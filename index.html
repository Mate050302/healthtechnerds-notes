<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Health Tech Nerds 정리 노트 — 미국 헬스케어 읽기</title>
<meta name="description" content="Health Tech Nerds 의 Weekly Health Tech Reads 32회차를, 미국 헬스케어를 처음 보는 사람 기준으로 한글로 풀어 쓴 정리 노트">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#faf9f7; --surface:#fff; --surface-2:#f4f2ee; --text:#1b1a18; --muted:#6d6860;
  --line:#e5e1d9; --line-soft:#efece6;
  --accent:#1c6d5b; --accent-soft:#e4f1ed; --accent-ink:#12503f;
  --warn:#8a5a10; --warn-soft:#fbf0dc;
  --t-reads:#1f5fa8; --t-reads-bg:#e6eefa;
  --t-policy:#8a5a10; --t-policy-bg:#fbf0dc;
  --t-roundup:#6b3f9e; --t-roundup-bg:#f0e9fb;
  --t-interview:#a33a6b; --t-interview-bg:#fbe8f1;
  --t-event:#5a5a5a; --t-event-bg:#ececec;
  --radius:12px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
:root:not([data-theme="light"]){ color-scheme:light }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131519; --surface:#1a1d22; --surface-2:#20242b; --text:#e9e7e3; --muted:#9aa0a8;
    --line:#2b3038; --line-soft:#232830;
    --accent:#63c3a8; --accent-soft:#173028; --accent-ink:#8fd9c2;
    --warn:#d9ab63; --warn-soft:#2e2415;
    --t-reads:#7fb0e8; --t-reads-bg:#182634;
    --t-policy:#d9ab63; --t-policy-bg:#2e2415;
    --t-roundup:#b493e0; --t-roundup-bg:#241c33;
    --t-interview:#e08bb2; --t-interview-bg:#331823;
    --t-event:#a8a8a8; --t-event-bg:#26262a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131519; --surface:#1a1d22; --surface-2:#20242b; --text:#e9e7e3; --muted:#9aa0a8;
  --line:#2b3038; --line-soft:#232830;
  --accent:#63c3a8; --accent-soft:#173028; --accent-ink:#8fd9c2;
  --t-reads:#7fb0e8; --t-reads-bg:#182634;
  --t-policy:#d9ab63; --t-policy-bg:#2e2415;
  --t-roundup:#b493e0; --t-roundup-bg:#241c33;
  --t-interview:#e08bb2; --t-interview-bg:#331823;
  --t-event:#a8a8a8; --t-event-bg:#26262a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:anywhere;
}
a{color:var(--accent-ink); text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit; font-size:inherit; color:inherit}

/* ---------- layout ---------- */
.app{display:grid; grid-template-columns:308px minmax(0,1fr); min-height:100vh}
.side{
  border-right:1px solid var(--line); background:var(--surface);
  position:sticky; top:0; height:100vh; display:flex; flex-direction:column; min-width:0;
}
.main{min-width:0; display:flex; flex-direction:column}

/* ---------- sidebar ---------- */
.brand{padding:18px 18px 12px; border-bottom:1px solid var(--line-soft)}
.brand h1{margin:0; font-size:15px; font-weight:700; letter-spacing:-.01em}
.brand p{margin:4px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5}
.searchwrap{padding:12px 14px 8px}
.search{
  width:100%; padding:9px 12px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--text); font-size:13.5px;
}
.search::placeholder{color:var(--muted)}
.search:focus{outline:2px solid var(--accent); outline-offset:-1px; background:var(--surface)}
.navlinks{display:flex; flex-wrap:wrap; gap:6px; padding:2px 14px 10px}
.navlink{
  border:1px solid var(--line); background:var(--surface-2); border-radius:999px;
  padding:5px 11px; font-size:12.5px; cursor:pointer; color:var(--muted);
}
.navlink:hover{border-color:var(--accent); color:var(--accent-ink)}
.navlink.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.filters{display:flex; flex-wrap:wrap; gap:5px; padding:0 14px 10px; border-bottom:1px solid var(--line-soft)}
.chip{
  border:1px solid var(--line); background:transparent; border-radius:999px;
  padding:3px 9px; font-size:11.5px; cursor:pointer; color:var(--muted);
}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .chip.on{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#0e1a16}}
.issuelist{overflow-y:auto; flex:1; padding:6px 8px 24px}
.ilist-head{
  font-size:11px; color:var(--muted); padding:10px 8px 4px; letter-spacing:.04em;
  text-transform:uppercase; font-weight:700; position:sticky; top:0; background:var(--surface);
}
.ilist-month{
  font-size:11.5px; color:var(--muted); font-weight:700; padding:12px 8px 4px;
  border-top:1px solid var(--line-soft); margin-top:6px;
}
.ilist-month:first-child{border-top:0; margin-top:0}
.irow{
  display:block; width:100%; text-align:left; border:0; background:transparent;
  padding:8px 10px; border-radius:9px; cursor:pointer; line-height:1.45;
}
.irow:hover{background:var(--surface-2)}
.irow.on{background:var(--accent-soft)}
.irow .r1{display:flex; align-items:center; gap:6px; margin-bottom:2px}
.irow .num{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.irow .ttl{font-size:13px; font-weight:600; color:var(--text); display:block}
.irow.on .ttl{color:var(--accent-ink)}
.irow .sub{font-size:11.5px; color:var(--muted); display:block; margin-top:2px}
.badge{
  font-size:10px; font-weight:700; padding:1.5px 6px; border-radius:5px; white-space:nowrap;
  letter-spacing:.01em;
}
.b-reads{background:var(--t-reads-bg); color:var(--t-reads)}
.b-policy{background:var(--t-policy-bg); color:var(--t-policy)}
.b-roundup{background:var(--t-roundup-bg); color:var(--t-roundup)}
.b-interview{background:var(--t-interview-bg); color:var(--t-interview)}
.b-event{background:var(--t-event-bg); color:var(--t-event)}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--line); padding:10px 16px;
  display:flex; align-items:center; gap:10px;
}
.menubtn{display:none; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 10px; cursor:pointer}
.crumb{font-size:12.5px; color:var(--muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.iconbtn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:5px 10px; cursor:pointer; font-size:12.5px; color:var(--muted)}
.iconbtn:hover{border-color:var(--accent); color:var(--accent-ink)}

/* ---------- content ---------- */
.wrap{padding:26px 30px 120px; max-width:860px; width:100%; margin:0 auto}
.doc h2{font-size:25px; line-height:1.35; margin:0 0 6px; letter-spacing:-.02em}
.doc h3{font-size:18px; margin:34px 0 10px; letter-spacing:-.01em; scroll-margin-top:70px}
.doc h4{font-size:15px; margin:22px 0 6px}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{margin:0 0 14px; padding-left:20px}
.doc li{margin-bottom:5px}
.meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 16px; font-size:12.5px; color:var(--muted)}
.hook{
  font-size:17px; line-height:1.7; font-weight:600; letter-spacing:-.01em;
  padding:14px 16px; border-left:3px solid var(--accent); background:var(--accent-soft);
  border-radius:0 10px 10px 0; margin:0 0 22px; color:var(--accent-ink);
}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin:0 0 14px}
.tldr{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 18px 6px; margin:0 0 26px}
.tldr .lbl{font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--muted); text-transform:uppercase}
.tldr ol{margin:8px 0 10px; padding-left:20px}
.tldr li{margin-bottom:7px}

.sec{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin:0 0 16px; overflow:hidden}
.sec > h3{margin:0; padding:14px 18px 12px; font-size:17px; border-bottom:1px solid var(--line-soft); background:var(--surface)}
.sec > h3 .en{display:block; font-size:11.5px; font-weight:500; color:var(--muted); margin-top:3px; letter-spacing:0}
.secbody{padding:14px 18px 6px}
.qa{margin:0 0 14px}
.qa .lbl{
  display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.05em;
  padding:2px 7px; border-radius:5px; margin-bottom:6px;
  background:var(--surface-2); color:var(--muted); border:1px solid var(--line-soft);
}
.qa.what .lbl{background:var(--t-reads-bg); color:var(--t-reads); border-color:transparent}
.qa.why .lbl{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent}
.qa.struct .lbl{background:var(--t-roundup-bg); color:var(--t-roundup); border-color:transparent}
.qa.consumer .lbl{background:var(--t-policy-bg); color:var(--t-policy); border-color:transparent}
.qa p{margin:0 0 10px}
.qa p:last-child{margin-bottom:0}
.stats{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px}
.stat{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:9px; padding:8px 11px; min-width:0}
.stat b{display:block; font-size:15px; font-family:var(--mono); letter-spacing:-.02em}
.stat span{display:block; font-size:11.5px; color:var(--muted); line-height:1.45; margin-top:2px}
.players{display:flex; flex-direction:column; gap:6px; margin:0 0 14px}
.player{font-size:13px; line-height:1.6; padding:7px 11px; background:var(--surface-2); border-radius:8px; border:1px solid var(--line-soft)}
.player b{color:var(--text)}
.player span{color:var(--muted)}
.terms{margin:0 0 16px; padding:12px 15px 13px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:10px}
.terms .lbl{font-size:11px; font-weight:800; letter-spacing:.04em; color:var(--accent-ink); display:block; margin-bottom:9px}
.term{font-size:13px; line-height:1.65; margin-bottom:9px}
.term:last-child{margin-bottom:0}
.term.core{
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:8px; padding:11px 13px; margin-bottom:10px; font-size:13.5px; line-height:1.75;
}
.term.core b{font-size:14px}
.term.core .pl{margin-top:4px}
.term b{color:var(--text)}
.term .ko{color:var(--accent-ink); font-weight:600}
.term .pl{color:var(--muted); display:block}
/* ---------- PON 리스트 ---------- */
.pon-scheme{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 17px; margin:0 0 14px}
.pon-scheme .lbl{display:block; font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--muted); margin-bottom:6px}
.pon-scheme p{margin:0; font-size:14px; line-height:1.75; color:var(--muted)}
.pon-filters{margin:0 0 16px; display:flex; flex-direction:column; gap:8px}
.pf-row{display:flex; flex-wrap:wrap; gap:5px; align-items:center}
.pf-lbl{font-size:11px; font-weight:800; color:var(--muted); margin-right:4px; letter-spacing:.04em}
.pf{border:1px solid var(--line); background:var(--surface-2); color:var(--muted); border-radius:999px; padding:4px 11px; font-size:12px; cursor:pointer}
.pf.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700}
:root[data-theme="dark"] .pf.on{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pf.on{color:#0e1a16}}
.pon-tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface)}
table.pon{border-collapse:collapse; width:100%; min-width:1100px; font-size:13.5px}
table.pon th{position:sticky; top:0; background:var(--surface-2); text-align:left; font-size:11px; font-weight:800; letter-spacing:.04em; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line); z-index:1}
table.pon td{padding:12px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top; line-height:1.7}
table.pon tr:last-child td{border-bottom:0}
table.pon .c-id{width:64px; font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:nowrap}
table.pon .c-kind{width:72px; white-space:nowrap}
table.pon .c-title{width:220px}
table.pon .c-desc{min-width:300px}
table.pon .c-ev{min-width:240px; color:var(--muted); font-size:13px}
table.pon .c-case{width:210px}
table.pon .c-cat{width:120px}
.kb{display:inline-block; width:22px; height:22px; line-height:22px; text-align:center; border-radius:6px; font-weight:800; font-size:12px; margin-right:6px; color:#fff}
.kb.k-P{background:var(--t-interview)} .kb.k-O{background:var(--accent)} .kb.k-N{background:var(--t-policy)}
:root[data-theme="dark"] .kb{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kb{color:#0e1a16}}
.c-kind small{font-size:11px; color:var(--muted)}
.pf.k-P.on{background:var(--t-interview); border-color:var(--t-interview)}
.pf.k-N.on{background:var(--t-policy); border-color:var(--t-policy)}
.c-title b{display:block; font-size:14px; line-height:1.6}
.prior{margin-top:5px; font-size:11.5px; color:var(--muted); background:var(--surface-2); padding:2px 7px; border-radius:5px; display:inline-block}
.feas{margin-top:8px; font-size:12.5px; color:var(--accent-ink); background:var(--accent-soft); padding:6px 9px; border-radius:7px; line-height:1.6}
.feas span{font-size:10px; font-weight:800; margin-right:6px; letter-spacing:.04em}
.c-ev .refs{display:flex; flex-wrap:wrap; gap:4px; margin-top:7px}
.c-ev .refs button{border:1px solid var(--line); background:var(--surface-2); color:var(--muted); border-radius:5px; font-size:11px; padding:2px 7px; cursor:pointer; font-family:var(--mono)}
.c-ev .refs button:hover{border-color:var(--accent); color:var(--accent-ink)}
.cs-row{margin-bottom:7px; font-size:12.5px; line-height:1.55}
.cs-row button{border:1px solid var(--accent); background:var(--surface); color:var(--accent-ink); border-radius:6px; padding:2px 8px; font-size:12px; font-weight:600; cursor:pointer}
.cs-row button:hover{background:var(--accent); color:#fff}
.cs-row b{font-size:12.5px}
.cs-row span{display:block; color:var(--muted); margin-top:2px}
.ct{display:inline-block; font-size:11.5px; padding:2px 8px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); margin:0 4px 4px 0; color:var(--text)}
.ct.sub{opacity:.7}

/* ---------- 건질 것 모음 리포트 ---------- */
.rpt-lead{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 20px; margin:0 0 16px}
.rpt-lead p{margin:0 0 12px; font-size:15px; line-height:1.85}
.rpt-lead p:last-child{margin-bottom:0}
.rpt-themes{margin:0 0 24px}
.rpt-themes > .lbl, .rpt-nav > .lbl{
  display:block; font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--muted); margin-bottom:10px;
}
.rt{border-left:3px solid var(--accent); background:var(--surface); padding:12px 16px; margin:0 0 10px; border-radius:0 9px 9px 0}
.rt b{display:block; font-size:15px; line-height:1.6; margin-bottom:5px}
.rt .rn{
  display:inline-block; width:20px; height:20px; line-height:20px; text-align:center; margin-right:8px;
  background:var(--accent); color:#fff; border-radius:50%; font-size:11px; font-family:var(--mono);
}
:root[data-theme="dark"] .rt .rn{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rt .rn{color:#0e1a16}}
.rt p{margin:0; font-size:14px; line-height:1.8; color:var(--muted)}
.rrefs, .irefs{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
.rrefs button, .irefs button{
  border:1px solid var(--line); background:var(--surface-2); color:var(--muted);
  border-radius:6px; font-size:11.5px; padding:3px 9px; cursor:pointer;
}
.rrefs button:hover, .irefs button:hover{border-color:var(--accent); color:var(--accent-ink)}

.rpt-nav{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 16px; margin:0 0 24px; position:sticky; top:52px; z-index:5}
.rn-row{display:flex; flex-wrap:wrap; gap:4px}
.rnb{
  border:1px solid var(--line); background:var(--surface-2); border-radius:7px; padding:3px 8px;
  font-size:11.5px; font-family:var(--mono); cursor:pointer; color:var(--text); display:flex; align-items:center; gap:4px;
}
.rnb:hover{border-color:var(--accent)}
.rnb span{background:var(--accent); color:#fff; border-radius:4px; font-size:10px; padding:0 4px; font-family:var(--sans)}
:root[data-theme="dark"] .rnb span{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rnb span{color:#0e1a16}}
.rnb.none{opacity:.4}

.rpt-iss{border-top:1px solid var(--line); padding:20px 0 6px; scroll-margin-top:120px}
.rpt-iss.empty-iss{opacity:.55}
.ri-head{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-bottom:6px}
.ri-num{
  border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent-ink);
  border-radius:6px; padding:2px 9px; font-size:12px; font-weight:700; cursor:pointer; font-family:var(--mono);
}
.ri-num:hover{background:var(--accent); color:#fff}
:root[data-theme="dark"] .ri-num:hover{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ri-num:hover{color:#0e1a16}}
.ri-date{font-size:12px; color:var(--muted); font-family:var(--mono)}
.ri-title{font-size:16px; font-weight:700; letter-spacing:-.01em}
.ri-why{margin:0 0 12px; font-size:14px; line-height:1.8; color:var(--muted)}
.ri-none{margin:0 0 4px; font-size:13.5px; color:var(--muted)}
.ri-item{border:1px solid var(--line); border-left:3px solid var(--accent); background:var(--surface); border-radius:0 10px 10px 0; padding:13px 16px; margin:0 0 10px}
.ri-item.signal{border-left-color:var(--t-policy)}
.ri-item .ik{
  display:inline-block; font-size:10px; font-weight:800; letter-spacing:.04em; padding:2px 8px;
  border-radius:5px; background:var(--accent); color:#fff; margin-bottom:7px;
}
.ri-item.signal .ik{background:var(--t-policy-bg); color:var(--t-policy)}
:root[data-theme="dark"] .ri-item .ik{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ri-item .ik{color:#0e1a16}}
.ri-item b{display:block; font-size:15px; line-height:1.65; margin-bottom:5px}
.ri-item p{margin:0; font-size:14px; line-height:1.8}
.ri-item .iw{margin-top:7px; color:var(--muted); font-size:13.5px}
.ri-item .iw span{
  font-size:10px; font-weight:800; background:var(--surface-2); color:var(--muted);
  padding:1px 6px; border-radius:4px; margin-right:6px;
}
@media (max-width:760px){ .rpt-nav{position:static} }

/* ---------- 투자받은 회사 ---------- */
.cbig{border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); padding:16px 18px; margin:0 0 16px}
.cbig-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px}
.cspacer{flex:1}
.cname{border:0; background:transparent; padding:0; font-size:18px; font-weight:700; cursor:pointer; letter-spacing:-.01em}
.cname:hover{color:var(--accent-ink); text-decoration:underline}
.cs{font-size:11px; font-weight:700; padding:2px 8px; border-radius:5px; background:var(--t-reads-bg); color:var(--t-reads)}
.cissue{border:1px solid var(--line); background:var(--surface-2); color:var(--muted); border-radius:5px;
  font-size:11px; padding:1px 7px; cursor:pointer; font-family:var(--mono)}
.cissue:hover{border-color:var(--accent); color:var(--accent-ink)}
.cmore{border:1px solid var(--accent); background:var(--surface); color:var(--accent-ink); border-radius:8px;
  font-size:12.5px; font-weight:600; padding:5px 12px; cursor:pointer}
.cmore:hover{background:var(--accent); color:#fff}
:root[data-theme="dark"] .cmore:hover{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cmore:hover{color:#0e1a16}}
.cone{margin:0 0 9px; font-size:14.5px; line-height:1.7; font-weight:600}
.ctags{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 10px}
.ctags span{font-size:11.5px; padding:2px 9px; border-radius:999px; background:var(--surface-2);
  border:1px solid var(--line-soft); color:var(--muted)}
.csum{margin:0 0 12px; font-size:14px; line-height:1.8; color:var(--muted)}
.ctab{width:100%; border-collapse:collapse; margin:0 0 12px; font-size:13.5px}
.ctab th{
  text-align:left; width:126px; vertical-align:top; padding:7px 10px 7px 0; font-weight:700;
  color:var(--muted); font-size:12px; white-space:nowrap; border-top:1px solid var(--line-soft);
}
.ctab td{padding:7px 0; line-height:1.7; border-top:1px solid var(--line-soft)}
.ctab tr:first-child th, .ctab tr:first-child td{border-top:0}
.ctab tr.w th{color:var(--t-policy)}
.ctab tr.w td{color:var(--t-policy)}
.cthumbs{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.cthumbs figure{margin:0; min-width:0}
.cthumbs a{display:block; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface-2)}
.cthumbs img{width:100%; height:132px; object-fit:cover; object-position:top; display:block}
.cthumbs figcaption{font-size:11px; color:var(--muted); margin-top:4px; line-height:1.5}
@media (max-width:760px){ .cthumbs{grid-template-columns:1fr 1fr} .ctab th{width:92px} }
.backlink{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; margin:0 0 14px;
}
.backlink:hover{border-color:var(--accent); color:var(--accent-ink)}
.cblock{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 18px; margin:0 0 12px}
.cblock .lbl{display:block; font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--muted); margin-bottom:8px}
.cblock p{margin:0 0 10px; font-size:14.5px; line-height:1.8}
.cblock p:last-child{margin-bottom:0}
.cblock.warn{border-color:var(--t-policy); background:var(--t-policy-bg)}
.cblock.warn .lbl{color:var(--t-policy)}
.cblock.forus{border-color:var(--accent); background:var(--accent-soft)}
.cblock.forus .lbl, .cblock.forus p{color:var(--accent-ink)}
.cfeat, .cteam, .ctrac, .csrc{list-style:none; margin:0; padding:0}
.cfeat li{padding:8px 0 8px 12px; border-left:3px solid var(--line); margin-bottom:8px}
.cfeat b{display:block; font-size:14px}
.cfeat span{display:block; font-size:13.5px; color:var(--muted); margin-top:2px; line-height:1.7}
.cteam li{padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:14px}
.cteam li:last-child{border-bottom:0}
.cteam .role{font-size:11.5px; color:var(--muted); background:var(--surface-2); padding:1px 7px; border-radius:5px; margin-left:7px}
.cteam span:not(.role){display:block; font-size:13px; color:var(--muted); margin-top:3px}
.ctrac li{display:flex; gap:9px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
.ctrac li:last-child{border-bottom:0}
.tt2{font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:5px; background:var(--surface-2); color:var(--muted); flex:none}
.tt2.t-funding{background:var(--accent-soft); color:var(--accent-ink)}
.tt2.t-regulatory{background:var(--t-policy-bg); color:var(--t-policy)}
.tt2.t-partnership{background:var(--t-roundup-bg); color:var(--t-roundup)}
.tt2.t-revenue, .tt2.t-customers, .tt2.t-traffic{background:var(--t-reads-bg); color:var(--t-reads)}
.ctrac .d{flex:1; min-width:0; font-size:14px; line-height:1.7}
.ctrac .w{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
/* 세로로 긴 갈무리가 섞여 있어 단 배치로 빈 공간을 줄인다. */
.cshots{columns:2; column-gap:12px}
.cshots figure{margin:0 0 14px; break-inside:avoid}
.cshots a{display:block; position:relative; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--surface-2)}
.cshots img{width:100%; display:block; max-height:520px; object-fit:cover; object-position:top}
.cshots a::after{
  content:'원본 보기'; position:absolute; right:8px; bottom:8px; font-size:10.5px; font-weight:700;
  background:rgba(0,0,0,.62); color:#fff; padding:3px 8px; border-radius:5px; opacity:0; transition:opacity .15s;
}
.cshots a:hover::after{opacity:1}
.cshots figcaption{font-size:12px; color:var(--muted); margin-top:5px; line-height:1.6}
@media (max-width:900px){ .cshots{columns:1} }
.csrc li{padding:6px 0; font-size:13.5px; border-bottom:1px solid var(--line-soft)}
.csrc li:last-child{border-bottom:0}
.csrc span{display:block; font-size:12.5px; color:var(--muted); margin-top:2px}

/* ---------- 회차 머리: 요약 → 건질 것 → 꼭지 고르기 ---------- */
.ihead{margin:0 0 26px}
.tldr{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 20px 8px; margin:0 0 14px}
.tldr .lbl{font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--muted)}
.tldr ol{margin:10px 0 8px; padding-left:20px}
.tldr li{margin-bottom:12px}
.tldr .pt{display:block; font-size:15px; line-height:1.7; font-weight:600}
.tldr .nt{display:block; font-size:13.5px; line-height:1.7; color:var(--muted); margin-top:3px}

.issueins{border-radius:var(--radius); padding:15px 20px; margin:0 0 16px}
.issueins.yes{background:var(--accent-soft); border:1px solid var(--accent); border-left:4px solid var(--accent)}
.issueins.no{background:var(--surface); border:1px dashed var(--line)}
.issueins .lbl{display:block; font-size:11px; font-weight:800; letter-spacing:.05em; margin-bottom:7px}
.issueins.yes .lbl{color:var(--accent-ink)}
.issueins.no .lbl{color:var(--muted)}
.issueins p{margin:0; font-size:14.5px; line-height:1.8}
.issueins.yes p{color:var(--accent-ink)}
.issueins.no p{color:var(--muted)}
.issueins .jump{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px}
.issueins .jump button{
  border:1px solid var(--accent); background:var(--surface); color:var(--accent-ink);
  border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; font-weight:600;
}
.issueins .jump button:hover{background:var(--accent); color:#fff}

.issueins .igrp{margin-top:13px}
.issueins .gl{
  display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.04em;
  padding:2px 9px; border-radius:5px; margin-bottom:8px;
}
.issueins .igrp.b .gl{background:var(--accent); color:#fff}
.issueins .igrp.s .gl{background:var(--t-policy-bg); color:var(--t-policy)}
:root[data-theme="dark"] .issueins .igrp.b .gl{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .issueins .igrp.b .gl{color:#0e1a16}}
.ibul{list-style:none; margin:0; padding:0}
.ibul li{
  padding:9px 0 9px 13px; border-left:3px solid var(--accent); margin-bottom:8px;
  background:var(--surface); border-radius:0 8px 8px 0; padding-right:12px;
}
.ibul.s li{border-left-color:var(--t-policy)}
.ibul li:last-child{margin-bottom:0}
.ibul b{display:block; font-size:14px; line-height:1.6; color:var(--text)}
.ibul span{display:block; font-size:13.5px; line-height:1.7; color:var(--muted); margin-top:3px}
.ibul .src{
  display:inline-block; margin-top:6px; border:1px solid var(--line); background:var(--surface-2);
  color:var(--muted); border-radius:5px; font-size:11px; padding:2px 8px; cursor:pointer;
}
.ibul .src:hover{border-color:var(--accent); color:var(--accent-ink)}
.insbox.sig{border-color:var(--t-policy); border-left-color:var(--t-policy); background:var(--t-policy-bg)}
.insbox.sig .lbl{color:var(--t-policy)}
.insbox.sig p{color:var(--text)}
.pbadge.sig{background:var(--t-policy-bg); color:var(--t-policy)}
.stoc .dot.sig{background:var(--t-policy)}

.picker{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 12px 10px}
.picker .lbl{display:block; font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--muted); padding:0 8px 8px}
.prow{
  display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left;
  border:0; background:transparent; padding:8px 10px; border-radius:9px; cursor:pointer; line-height:1.5;
}
.prow:hover{background:var(--surface-2)}
.prow .pn{font-family:var(--mono); font-size:11px; color:var(--muted); padding-top:3px; min-width:16px}
.prow .pmain{flex:1; min-width:0}
.prow .pt{display:block; font-size:14px; font-weight:600}
.prow .ps{display:block; font-size:12.5px; color:var(--muted); margin-top:2px}
.prow.dim .pt{color:var(--muted); font-weight:500}
.prow.has .pt{color:var(--accent-ink)}
.pbadge{font-size:10px; font-weight:800; padding:2px 7px; border-radius:5px; white-space:nowrap; margin-top:2px}
.pbadge.ins{background:var(--accent); color:#fff}
.pbadge.skip{background:var(--line-soft); color:var(--muted)}
:root[data-theme="dark"] .pbadge.ins{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pbadge.ins{color:#0e1a16}}

/* ---------- 사이드바 탭과 꼭지 목차 ---------- */
.sidetabs{display:flex; gap:4px; padding:8px 14px 6px; border-bottom:1px solid var(--line-soft)}
.sidetabs button{
  flex:1; border:1px solid var(--line); background:var(--surface-2); color:var(--muted);
  border-radius:8px; padding:6px 8px; font-size:12px; cursor:pointer;
}
.sidetabs button.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
.sidetoc{display:none}
.stoc-head{font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.04em; padding:10px 10px 6px}
.stoc{
  display:flex; align-items:flex-start; gap:8px; width:100%; text-align:left; border:0;
  background:transparent; padding:7px 10px; border-radius:8px; cursor:pointer; line-height:1.45;
}
.stoc:hover{background:var(--surface-2)}
.stoc.on{background:var(--accent-soft)}
.stoc.on .t{color:var(--accent-ink); font-weight:700}
.stoc .n{font-family:var(--mono); font-size:10.5px; color:var(--muted); padding-top:2px; min-width:14px}
.stoc .t{flex:1; font-size:12.5px; min-width:0}
.stoc.dim .t{color:var(--muted); opacity:.75}
.stoc .dot{width:6px; height:6px; border-radius:50%; background:var(--accent); margin-top:6px; flex:none}

/* ---------- 요약·인사이트·주장·사례 ---------- */
.sumbox{
  background:var(--surface-2); border:1px solid var(--line-soft); border-radius:10px;
  padding:12px 15px; margin:0 0 10px;
}
.sumbox .lbl, .insbox .lbl, .claims .lbl{
  display:block; font-size:10.5px; font-weight:800; letter-spacing:.05em;
  color:var(--muted); margin-bottom:6px;
}
.sumbox p{margin:0; font-size:14px; line-height:1.75}
.insbox{
  border:1px solid var(--accent); border-left:3px solid var(--accent);
  background:var(--accent-soft); border-radius:10px; padding:12px 15px; margin:0 0 16px;
}
.insbox .lbl{color:var(--accent-ink)}
.insbox p{margin:0; font-size:14px; line-height:1.75; color:var(--accent-ink)}
.insbox.none{background:transparent; border-color:var(--line); border-left-color:var(--line)}
.insbox.none .lbl{color:var(--muted)}
.insbox.none p{color:var(--muted); font-size:13px}

.claims{margin:0 0 16px}
.claims .claim{
  border-left:3px solid var(--line); padding:2px 0 2px 12px; margin:0 0 11px;
}
.claims.author .claim{border-left-color:var(--t-reads)}
.claims.expert .claim{border-left-color:var(--t-interview)}
.claims.case .claim{border-left-color:var(--t-roundup)}
.claims.author .lbl{color:var(--t-reads)}
.claims.expert .lbl{color:var(--t-interview)}
.claims.case .lbl{color:var(--t-roundup)}
.claim p{margin:0}
.claim .who{font-size:13px; margin-bottom:3px; display:flex; gap:7px; align-items:baseline; flex-wrap:wrap}
.claim .who b{font-size:13.5px}
.claim .role, .claim .scale{
  font-size:11.5px; color:var(--muted); background:var(--surface-2);
  padding:1px 7px; border-radius:5px;
}
.claim .c{font-size:14px; line-height:1.7}
.claim .e{font-size:13px; line-height:1.7; color:var(--muted); margin-top:4px}
.claim .e span{
  font-size:10px; font-weight:800; letter-spacing:.04em; color:var(--muted);
  background:var(--surface-2); padding:1px 6px; border-radius:4px; margin-right:6px;
}

/* ---------- 건너뛰어도 되는 꼭지 ---------- */
.sec.skip{background:transparent; border:1px dashed var(--line); border-radius:var(--radius); margin:0 0 16px}
.sec.skip summary{
  list-style:none; cursor:pointer; padding:11px 16px; display:flex; align-items:center;
  gap:9px; flex-wrap:wrap; color:var(--muted); font-size:13px;
}
.sec.skip summary::-webkit-details-marker{display:none}
.sec.skip summary::after{content:'펼치기'; margin-left:auto; font-size:11.5px; color:var(--muted); opacity:.8}
.sec.skip[open] summary::after{content:'접기'}
.sec.skip summary:hover{background:var(--surface-2); border-radius:var(--radius)}
.skipbadge{
  font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:5px;
  background:var(--line-soft); color:var(--muted); letter-spacing:.02em; flex:none;
}
.skiptitle{font-weight:600; color:var(--muted)}
.skipnote{font-size:11.5px; color:var(--muted); opacity:.85}
.sec.skip[open]{background:var(--surface); border-style:solid}
.sec.skip .secbody{padding-top:2px}
.sec.skip .qa p, .sec.skip .term, .sec.skip .player{font-size:13px}

/* ---------- 원문 번역본 나란히 보기 ---------- */
.cmptoggle{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 18px}
.cmptoggle button{
  border:1px solid var(--accent); background:var(--surface); color:var(--accent-ink);
  border-radius:9px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer;
}
.cmptoggle button.on{background:var(--accent); color:#fff}
:root[data-theme="dark"] .cmptoggle button.on{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cmptoggle button.on{color:#0e1a16}}
.cmptoggle span{font-size:12.5px; color:var(--muted)}
.sec.cmp{overflow:visible}
.cmprow{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:0}
/* 비교 모드에서는 본문 폭을 넓혀, 정리 노트는 원래 폭(860px)을 그대로 두고
   왼쪽 여백에 원문 번역본 열을 새로 만든다. */
.wrap.cmpon{max-width:1560px}
.wrap.cmpon > h2,
.wrap.cmpon > .meta,
.wrap.cmpon > .hook,
.wrap.cmpon > .tldr,
.wrap.cmpon > .toc,
.wrap.cmpon > .later,
.wrap.cmpon > .themebar,
.wrap.cmpon > .pager,
.wrap.cmpon > .cmptoggle{max-width:860px; margin-left:auto; margin-right:0}
.wrap.cmpon .cmprow{grid-template-columns:minmax(0,1fr) minmax(0,860px)}
.wrap.cmpon .rawcol p{font-size:15px}
.rawcol{
  padding:16px 20px 8px; background:var(--surface);
  border-right:2px solid var(--line); min-width:0;
}
.notecol{padding:16px 20px 8px; min-width:0; background:var(--surface-2)}
.rawlbl{
  display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.05em;
  padding:2px 8px; border-radius:5px; margin-bottom:10px;
  background:var(--t-reads-bg); color:var(--t-reads);
}
.rawlbl.note{background:var(--accent-soft); color:var(--accent-ink)}
.rawcol p{font-size:15px; line-height:1.85; margin:0 0 13px; color:var(--text)}
@media (max-width:1320px){
  .wrap.cmpon{max-width:900px}
  .wrap.cmpon .cmprow, .cmprow{grid-template-columns:minmax(0,1fr)}
  .rawcol{border-right:0; border-bottom:1px solid var(--line)}
  .wrap.cmpon > h2, .wrap.cmpon > .meta, .wrap.cmpon > .hook, .wrap.cmpon > .tldr,
  .wrap.cmpon > .toc, .wrap.cmpon > .later, .wrap.cmpon > .themebar,
  .wrap.cmpon > .pager, .wrap.cmpon > .cmptoggle{margin-right:auto}
}
.themebar{display:flex; flex-wrap:wrap; gap:5px; margin:22px 0 0}
.tt{font-size:11.5px; padding:3px 9px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); color:var(--muted); cursor:pointer}
.tt:hover{border-color:var(--accent); color:var(--accent-ink)}
.later{border:1px dashed var(--accent); background:var(--accent-soft); border-radius:var(--radius); padding:12px 16px; margin:18px 0 0}
.later .lbl{font-size:11px; font-weight:800; color:var(--accent-ink); letter-spacing:.05em; text-transform:uppercase}
.later ul{margin:8px 0 0; padding-left:18px; font-size:13.5px}
.pager{display:flex; justify-content:space-between; gap:10px; margin-top:34px; border-top:1px solid var(--line); padding-top:16px}
.pager button{
  border:1px solid var(--line); background:var(--surface); border-radius:9px; padding:9px 14px;
  cursor:pointer; font-size:13px; max-width:48%; text-align:left; line-height:1.4;
}
.pager button:hover{border-color:var(--accent)}
.pager small{display:block; color:var(--muted); font-size:11px}
.empty{color:var(--muted); font-size:14px; padding:40px 0; text-align:center}

/* glossary / themes / timeline */
.gl-letter{font-size:12px; font-weight:800; color:var(--accent-ink); margin:22px 0 6px; letter-spacing:.05em}
.gitem{border-bottom:1px solid var(--line-soft); padding:11px 0}
.gitem h4{margin:0 0 3px; font-size:15px}
.gitem h4 .ko{color:var(--accent-ink); font-size:13.5px; font-weight:600; margin-left:6px}
.gitem p{margin:0; font-size:13.5px; color:var(--muted); line-height:1.7}
.gitem .refs{margin-top:5px; display:flex; flex-wrap:wrap; gap:4px}
.gitem .refs button{border:1px solid var(--line); background:var(--surface-2); color:var(--muted); border-radius:5px; font-size:10.5px; padding:1px 6px; cursor:pointer; font-family:var(--mono)}
.gitem .refs button:hover{border-color:var(--accent); color:var(--accent-ink)}
.tl-item{display:grid; grid-template-columns:84px minmax(0,1fr); gap:14px; padding:12px 0; border-bottom:1px solid var(--line-soft)}
.tl-item .d{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-top:3px}
.tl-item h4{margin:0 0 3px; font-size:14.5px}
.tl-item p{margin:0; font-size:13.5px; color:var(--muted)}
.themecard{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); padding:15px 18px; margin-bottom:12px}
.themecard h3{margin:0 0 6px; font-size:16px}
.themecard p{margin:0 0 10px; font-size:13.5px; color:var(--muted)}
.themecard .refs{display:flex; flex-wrap:wrap; gap:4px}
.themecard .refs button{border:1px solid var(--line); background:var(--surface-2); color:var(--muted); border-radius:5px; font-size:10.5px; padding:2px 7px; cursor:pointer; font-family:var(--mono)}
.themecard .refs button:hover{border-color:var(--accent); color:var(--accent-ink)}
.toc{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--radius); padding:12px 16px; margin:0 0 24px}

에게 최선의 결말은 시장 고점에 대형 회사로 팔려 가는 것이라고 적는다. 소송 과정에서 공개된 ceo의 문자에는 2~3년 안에 은퇴하겠다는 계획이 담겨 있다. mckinsey의 최신 프로핏 풀 전망에서 2027년 medicaid 세그먼트의 ebitda가 마이너스로 찍혔고, 필자는 이런 차트에서 그런 모습을 본 기억이 없다고 적는다. 보험사 ceo들이 의료비 상승 요인을 주제로 의회 두 위원회에 불려 갔고, unitedhealth group은 그 증언에 앞서 2026년 aca 거래소에서 내는 이익을 자발적으로 환급하겠다고 밝혔다. 이번 주 자금 조달은 소아과 체인 zarminali 1억 1,000만 달러, 제약사 컴패니언 앱 brightinsight 1,300만 달러처럼 돈을 내는 쪽이 보험사·고용주·제약사·의원인 회사들로 몰렸고, 소비자가 직접 지갑을 여는 회사는 목록에 없다. center for medicare 리더들은 v28 모델이 메디케어 어드밴티지의 진단명 부풀리기 문제를 이미 해결한 것으로 보인다고 썼는데, 필자는 ai 문서 작성 도구 suki가 병원 쪽에서 높은 등급의 진료 코드 비중을 끌어올리는 것이 그 농간과 무엇이 다른지 모르겠다고 되묻는다. 후원: wing assistant sponsored by: wing assistant ai 펀딩 단상: openevidence 120억 달러 a musing on ai funding openevidence 시리즈 d doximity 임상 컨설트(clinical consult) 연 매출 런레이트(run rate) 메디컬 슈퍼인텔리전스라는 서사 the medical superintelligence narrative 디지털 트윈(digital twin) 오늘의 사업은 의사의 주목을 파는 일 openevidence's business today: selling provider attention epocrates 프로바이더(provider) 제약사의 의사 대상 광고 uber 밸류에이션 논쟁에 비춰 보기 open evidence & the gurley-damodaran debate on valuation uber dcf mckinsey 프로핏 풀과 2027년 medicaid 적자 mckinsey's profit pools mckinsey 프로핏 풀 분석 medicaid 프로핏 풀(profit pool) ebitda 보험사 ceo들의 의회 증언 other top headlines ways & means 위원회·energy and commerce 보건 소위 청문회 페이어(payer) 수직 통합(vertical integration) unitedhealth의 aca 이익 자진 환급 other top headlines unitedhealth group aca 익스체인지 amazon one medical의 ai 헬스 어시스턴트 other top headlines amazon one medical healthier capital의 첫 펀드 2억 2,000만 달러 other top headlines healthier capital 펀딩: openevidence 2억 5,000만 달러 funding announcements openevidence 펀딩: zarminali pediatrics 1억 1,000만 달러 funding announcements zarminali pediatrics 펀딩: answersnow 4,000만 달러 funding announcements answersnow aba 펀딩: brightinsight 1,300만 달러 funding announcements brightinsight 컴패니언 앱(companion app) 복약 순응도(adherence) 펀딩: one to one health 1,200만 달러 funding announcements one to one health 고용주가 사 주는 의료 펀딩: salvo health 500만 달러 funding announcements salvo health 케어 익스텐더(care extender) rpm·c imary-care","ai-clinical","medicare-advantage","market-earnings","pharma-glp1","digital-health-funding"],"n_sec":31,"n_build":1,"n_signal":5,"q":"ai 주치의 열풍과 hims의 49달러 알약 weekly health tech reads 2/8/25 ai가 주치의를 다시 발명하겠다고 선언한 주에, 같은 약속을 했던 앞 세대는 파산 신청을 했다. 이 회차의 중심 글은 필자가 ai 프라이머리 케어 모델을 두고 쓴 단상이다. 같은 주에 앞 세대 주자인 carbon health가 chapter 11 파산을 신청했고, ai 프라이머리 케어를 내건 lotus health ai는 3,600만 달러를 조달했는데 필자가 직접 가입해 보니 ai 뒤에 있는 인간 의사들이 정원이 차서 대기자 명단에 올랐다. 필자는 의사 한 명이 맡는 환자 수를 열 배로 늘리겠다는 모델의 진짜 숙제가 기술이 아니라 조직 설계라고 주장하며, 이미 과로를 이유로 노조를 만들려는 mass general brigham의 주치의들이 ai 가상 진료 도입에 더 화가 난 사례를 근거로 든다. devoted health가 3억 6,600만 달러를 조달하고 medicare advantage 가입자를 466,000명으로 전년 대비 121% 늘렸다고 거의 알리지 않은 채 발표했는데, 정작 devoted 창업팀에 속한 venrock은 두 달 전 신규 ma 가입자를 잘못 받으면 큰돈을 잃는다며 humana의 붕괴를 예측했다. hims가 목요일 아침 복합조제 glp-1 알약을 월 49달러에 내놓아 주가가 9% 뛰고 eli lilly와 novo nordisk 주가를 끌어내렸지만, fda와 보건복지부(hhs)가 즉각 반응하고 법무부에 조사가 회부되면서 금요일 늦게 제품을 내렸고 주가는 주간 30% 하락으로 끝났다. 실적 발표가 몰린 한 주에 주가가 크게 갈렸다. medicaid 보험사 molina가 28%, aca와 medicare advantage, medicaid를 함께 하는 centene이 10%, 의사 전용 네트워크 doximity가 25% 하락한 반면, 스페셜티 약 유통을 키운 cigna는 7% 올랐고 노인 통합 돌봄 pace 사업자 innovage는 50% 급등했다. 인디애나에서 병원 재정을 두고 서로 반대되는 자료 두 건이 나왔다. kaufmann hall은 2025년 마진이 전국 평균을 밑돈다고 발표했지만, 고용주 연합은 2024년 인디애나 병원의 거의 20%가 순이익률 20%를 넘겼다는 데이터를 내놓았고, 그 자료에서 fort wayne의 비영리 정형외과 병원 한 곳은 영업이익률 37%를 기록했다. 후원: candor health sponsored by: candor health 단상: ai로 주치의를 다시 발명한다는 이야기 my musing: ai and the nuances of reinventing primary care carbon health lotus health ai mass general brigham kff가 전한 보스턴 환자 사례 intuitive surgical primary care / pcp iron triangle panel size chapter 11 메디케어 어드밴티지: devoted health의 조용한 대형 조달 medicare advantage: devoted health very quietly announces a very large funding round devoted health medicare advantage (ma) v28 in-house medical group 실적: molina, 가이던스의 절반에도 못 미치다 public markets earnings updates molina healthcare medicaid rfp 실적: centene, aca 가입자가 몇 달 만에 줄어든다 public markets earnings updates centene centene의 뉴욕 프로바이더 상대 소송 aca ex 미국 소비자가 정체를 모르는 주사를 스스로 사는 동안, 투자자는 그 흐름에 돈을 걸었다.","themes":["pharma-glp1","consumer-dtc","digital-health-funding","ai-clinical","rcm-billing","hospital-health-system"],"n_sec":32,"n_build":1,"n_signal":3,"q":"펩타이드 열풍과 펀딩 열두 건 weekly health tech reads 3/29/26 미국 소비자가 정체를 모르는 주사를 스스로 사는 동안, 투자자는 그 흐름에 돈을 걸었다. 필자는 2026년 1분기를 마무리하며 올해 헬스케어 논의를 지배하는 흐름으로 임상 진료의 ai와 롱제비티 모델 두 가지를 꼽는데, 이번 주에 발표된 스타트업 펀딩 열두 건도 대부분 이 두 가지 안에 들어간다. 병원 안에 엔지니어를 들여보내 ai 과제를 함께 만드는 qualified health가 1억 2,500만 달러를, 병원의 청구서를 보험사에 중계하는 stedi가 5,000만 달러를 조달한 것이 그 예다. 이번 회차의 중심 글은 필자가 회색 시장 펩타이드 열풍을 두고 쓴 단상이며, 그는 논쟁의 진짜 쟁점이 효능의 증거가 아니라 fda 같은 기관에 대한 불신이라고 보고, 나쁜 결과와 규제 당국의 조사를 거쳐 펩타이드가 결국 자리 잡힌 시장으로 정착할 것이라고 예측한다. 같은 주에 롱제비티 진료 기관 emed가 기업가치 20억 달러가 넘는 조건으로 2억 달러를, 조제 약국과 롱제비티 클리닉을 연결하는 vitl이 750만 달러를 조달했고, 필자는 이 두 건을 투자자가 앞으로 올 펩타이드 붐을 기대하고 있다는 신호로 읽는다. emed가 고용주에게 자사 glp-1 관리 상품을 팔면서 내세운 근거도 임상 결과가 아니라 환자 순응도 90%다. 임상 진료용 ai 모델을 만드는 doctronic이 12개월도 안 되는 사이 세 번째로 4,000만 달러를 조달했지만, 주간 방문자 30만 명 가운데 실제 유료 원격진료 방문으로 이어지는 비율은 2%가 되지 않는다. 헬스케어 프로바이더 임원의 88%가 앞으로 12개월간 입원 건당 인건비가 오를 것이라고 답했고, 필자는 이 숫자가 ai 덕분에 곧 의료 공급 비용이 거의 사라진다는 여러 주장과 어긋난다고 본다. 같은 문제를 인력 쪽에서 푸는 회사도 이번 주에 돈을 받았는데, 학자금 대출 상환을 지원해 병원이 채용한 임상 인력이 오래 근무하도록 돕는 clasp가 2,000만 달러를 조달했다. 매사추세츠에서 고중증도 퇴원 건수가 최근 몇 년 사이 크게 늘었는데, 환자가 실제로 더 위중해진 것인지 아니면 ai 문서화 도구 덕분에 청구서에 무거운 코드가 더 많이 붙게 된 것인지를 두고 신문 기사가 의문을 제기한다. 같은 주에 의학 정보 검색으로 의사들 사이에 자리 잡은 openevidence가 의사가 벌어들인 돈을 빠짐없이 받게 해 준다는 취지의 청구 코드 제품을 내놓아, 같은 흐름이 이미 상품으로 팔리고 있음을 보여 준다. 미국 법무부가 뉴욕의 대형 병원 그룹 new york presbyterian을 반독점으로 제소했고, 쟁점은 진료의 질이 아니라 보험사가 값싼 병원을 우대하거나 환자를 그쪽으로 안내하지 못하게 막는 계약 조항이다. 필자는 소장을 직접 읽어 본 뒤 특별히 강력한 사건으로 보이지는 않았다고 평가한다. 직원 의료비를 회사 돈으로 직접 부담하는 고용주를 상대로 대안적 보험 플랜을 파는 xo health가 전국으로 확장했고, 필자는 이를 몇 년째 말만 오가던 대안적 플랜 설계를 고용주들이 실제로 채택하기 시작하는 변곡점으로 읽는다. 미국 공보험을 운영하는 연방 기관이 무엇을 잘한 진료로 볼 것인지 다시 정하는 자리에서 나온 첫 번째 시사점은 초점이 치료에서 예방 서비스로 옮겨 가고 있다는 것이며, 필자가 함께 소개한 다른 글도 의사에게 진료 건수가 아니라 환자를 건강하게 유지한 결과로 돈을 지급하자는 주장을 편다. 인사말 라이브 방송 예고 catch the grand round up live, tomorrow @ 12pm et / 9am p 서는 multiplan과 여러 보험사가 네트워크 밖 진료비를 담합해 낮게 지급했다는 이유로 소송을 당했다. 뉴욕의 부유층은 원하는 전문의 근처에 세컨드 하우스를 사고 롱제비티 시설이 딸린 럭셔리 콘도를 사는데, 필자는 여기서 실제로 팔리는 것이 기술이 아니라 사람과 경험에 대한 접근이라고 짚었다. 필자는 neil shah의 글을 소개하며, 사람들이 원하는 치료를 찾아 기존 의료 시스템 바깥으로 나가면서 펩타이드를 비롯한 웰니스 생태계가 빠르게 커졌다고 전한다. 노스캐롤라이나가 메디케이드 재원으로 식품, 주거, 교통을 사 준 시범사업에서 1인당 월 164달러의 비용 절감이 확인됐는데, 주 의회가 예산을 배정하지 않아 운영은 중단된 상태다. 스폰서: ursa health sponsored by: ursa health 필자의 생각: 헬스케어 사기의 최적 수준은 얼마인가 musing: what is the optimal amount of healthcare fraud? 미네소타 인적서비스국(dhs)의 고위험 프로바이더 재검증 yourpath medicaid 재인증·재검증(recertification, revalidation) provider / payer 이번 주의 차트: 자폐 치료 시장은 일자리 프로그램인가 chart of the week: the ballooning autism therapy market: a jobs program? 자폐 치료 시장 jobs program 곱씹어 볼 수치: 300만 달러 넘는 청구가 10년 새 850% 늘었다 data to ponder bcs 재보험(reinsurance) 스페셜티 의약품(specialty drugs) blues 플랜 주목할 흐름: 부유층은 어떤 헬스케어를 사고 있나 key trends to keep an eye on: what sort of healthcare are wealthy people purchasing? atria health and research institute med-à-terre longevity 주목할 흐름: 네트워크 밖 진료비를 둘러싼 소송 두 건 key trends to keep an eye on: legal debates heat up over how to price out-of-network claims highmark health의 halomd 제소 multiplan(claritev)과 페이어들을 상대로 한 애리조나 소송 out-of-network no surprises act와 idr multiplan (claritev) 주목할 흐름: 병원이 세운 지역 플랜의 메디케어 어드밴티지 철수 key trends to keep an eye on: another week, another provider-sponsored regional plan struggles presbyterian medicare advantage (ma) d-snp 프로바이더가 세운 지역 플랜 짧은 소식: health catalyst의 vitalware 매각 other headlines health catalyst의 vitalware 매각 rcm (revenue cycle management) 짧은 소식: hazel health, 인수자를 찾지 못했다 other headlines hazel health 학교 기반 원격진료 짧은 소식: hlth 운영사 hyve, 18억 달러에 매각 other headlines hyve hlth 짧은 소식: 연방기관 cms의 청구 처리 시스템 교체 other headlines cms의 claimscore 교체 벤더 선정 bain capital의 healthedge와 ust healthproof 합병 cms 짧은 소식: 메디케이드 근로 요건 시행 세부 발표 other headlines cms의 근로 요건 잠정 최종 규칙 work requirements interim final rule one big beautiful bill 짧은 소식: 감사기구가 지적한 메디케어 어드밴티지 과다 지급 4억 6,200만 달러 other headlines oig의 s 세 곳 모두 주 정부의 state-directed payment 순풍을 언급했지만, 다른 꼭지에서는 deloitte가 만든 자격 심사 시스템의 오류로 michigan의 장애인 환자가 메디케이드를 잘못 거부당한 사례가 나오고, molina는 근로 요건 때문에 향후 3년간 메디케이드 시장이 약 9% 줄 것으로 본다. fda 자문위원회가 여섯 개 펩타이드의 컴파운딩 제한을 풀라고 권고했는데, 찬성 측 논리의 핵심은 환자들이 이미 bpc-157 같은 펩타이드를 규제되지 않는 그레이마켓에서 사고 있으니 면허 약국을 통하는 편이 안전하다는 것이었다. 권고가 나왔는데도 hims 주가는 약 14% 떨어졌다. openai가 미국 사용자를 대상으로 chatgpt의 health 기능을 내놓으면서 매주 3억 명 이상이 건강 관련 질문을 하러 chatgpt를 찾는다고 밝혔는데, 같은 주에 nytimes가 openai가 chatgpt의 극도로 위험한 의학적 권고를 두고 소송당했다고 보도했다. cbo가 2036년까지의 보험 가입 경로 전망을 내놨는데 메디케이드가 3.8% 줄고 메디케어가 2.2% 늘며 무보험이 1.8% 느는 동안 고용주 보험은 0.1% 줄어 거의 움직이지 않는다. 필자는 지금이 얼마나 망가져 보이든 이 시장들이 어디로 사라지지는 않는다는 점을 되새기게 해 준다고 평했다. 후원: teladoc health today's newsletter is brought to you by: teladoc health 2분기 실적 총평: 네 회사가 드러낸 네 가지 흐름 q2 earnings: q2 earnings updates: aca issues drag molina and hca; tenet outperforms uhc aca ed state-directed payment duals molina: aca에서 무너지고 duals에서 벌다 molina's aca miss; duals outperformance molina healthcare hcc와 리스크 조정 메탈 티어와 실버 플랜 죽음의 소용돌이 hca: 무보험 전환 100%와 수술 물량 약세 hca's aca miss; surgical volume weakness hca healthcare 선택적 수술 페이어 믹스 chs: 무보험 증가와 상업보험 수술 감소가 겹치다 chs misses on double whammy of commercial softness & uninsured growth community health systems (chs) self-pay asc 중증도(acuity) tenet: 고중증도 외래 수술로 홀로 선방 tenet beats by a mile on asc strength; medicaid tailwinds tenet healthcare 조정 ebitda 이 주의 차트: cbo의 10년 보험 가입 전망 chart of the week: the cbo provides an update on health insurance coverage projections through 2036 cbo 보험 가입 전망 cbo 고용주 기반 보험 펩타이드 컴파운딩 권고와 hims 주가 하락 the hot peptide summer: fda advisory panel recommends six peptides in a split vote while hims stock drops 14% fda 약국 조제 자문위원회 표결 hims 컴파운딩 펩타이드와 bpc-157 fda 자문위원회 new mountain, machinify 매각 추진 other top headlines machinify payment integrity cms, 모든 ma 플랜 stars 점수 재산정 other top headlines cms stars 점수 재산정 medicare advantage(ma) stars 점수 chatgpt 건강 기능 출시와 같은 주의 소송 other top headlines chatgpt health openai 소송 wildflower, d2c 운동 프로그램 every mother 인수 _ko":"명상 앱 매각가 급락과 중재 비용 논쟁","title_en":"Weekly Health Tech Reads 8/30/26","hook":"30억 달러로 평가받던 Headspace가 2억~3억 달러에 팔리고, 중재 절차가 늘린 의료비는 고용주와 근로자가 떠안는다.","themes":["policy-legislation","workforce","behavioral-mental","ma-consolidation","medicare-advantage","pharma-glp1"],"n_sec":17,"n_build":1,"n_signal":0,"q":"명상 앱 매각가 급락과 중재 비용 논쟁 weekly health tech reads 8/30/26 30억 달러로 평가받던 headspace가 2억~3억 달러에 팔리고, 중재 절차가 늘린 의료비는 고용주와 근로자가 떠안는다. 2021년 30억 달러로 평가받던 headspace가 sword health에 2억~3억 달러 현금으로 팔렸고, 필자는 오늘날 남은 가치가 명상 구독이 아니라 합병 상대였던 ginger가 쌓아 온 고용주 계약에 있다고 본다. no surprises act의 중재 절차가 224억 달러의 비용을 낳았다는 health affairs forefront 기사에 영상의학 진료그룹들이 강하게 반발했는데, 정작 기사가 전한 고용주 쪽 숫자(san antonio 시 예산 4,000만 달러 초과, new york department of civil service 2억 달러 넘는 추가 청구, united service workers union 보험료 1.75% 인상)는 반박에서 다뤄지지 않았다. doximity가 의사 2만 3,000명 설문 결과를 내놓았는데, 영상의학과 평균 연봉은 61만 달러이고 보상이 연 6.6%씩 오르고 있어서, 보험사가 수가를 깎고 있다는 영상의학 단체의 주장과 어긋난다고 필자는 지적한다. eli lilly가 자금을 댄 연구에서 tirzepatide 사용자는 12~18개월 뒤 대조군보다 의료비를 1인당 월 319달러 덜 썼는데, 여기에는 약값 자체가 빠져 있다. oura가 이르면 9월에 160억 달러가 넘는 기업가치로 최대 30억 달러를 조달하는 ipo를 추진한다고 bloomberg가 전했다. the villages health system이 스스로 신고한 업코딩 문제로 미국 법무부에 5억 4,150만 달러를, monogram health는 부정확한 위험조정 제출에 관한 내부고발 건으로 240만 달러를 내기로 합의했다. 후원 - elation health today's newsletter is brought to you by: elation health sword health의 headspace 인수 m&a sword health의 headspace 인수 ginger covered lives betterhelp no surprises act 중재 싸움 no surprises act no surprises act 중재 절차 radiology partners, halomd, team health san antonio 시 new york department of civil service, united service workers union 지불자(payor)와 공급자(provider) cms no surprises act idr qpa 의사 보상 데이터 physician compensation doximity 2025 연례 의사 설문 doximity interventional radiology 이번 주의 차트 - tirzepatide 비용 절감 연구 chart of the week tirzepatide 의료비 연구 medicare glp-1 bridge glp-1 tirzepatide pppm 행사 안내 - 내슈빌 디너와 컨퍼런스 oura ipo 추진 other top headlines oura oura the villages health system 5억 4,150만 달러 합의 other top headlines the villages heal
