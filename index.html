다는 것이다.","insight":"Virta가 파는 것은 새 기기가 아니라 '심장대사'라는 하나의 묶음이며, GLP-1이 그 묶음에 대한 관심을 이미 키워 놓았다는 것이 이 꼭지의 요지다. 우리 앱은 걸음과 식단을 각각 다른 화면에서 따로 보여 준다. 미국 사용자에게는 그 둘을 심장대사 위험이라는 한 축으로 묶어 보여 주는 화면 자체가 지금 없는 가치가 된다. 여기에 GLP-1을 쓰고 있는지 묻는 한 문항을 붙이면, 약만으로는 채워지지 않는 단백질 섭취와 근육량, 약을 멈춘 뒤의 체중 반등에 맞춰 안내를 다르게 내보낼 수 있다. 셋 다 기록과 화면으로 해결되는 일이어서 3개월 안에 가능하고, 먼저 확인할 것은 미국 사용자 가운데 GLP-1을 쓰는 사람의 비율이 시험에 충분한지다.","signal":null,"author":[{"claim":"Virta는 앞으로 몇 년간 지켜볼 만한 회사다.","evidence":"영양으로 심장대사 문제의 근본 원인을 다룬다는 접근과 임상 결과가 인상적이라는 점을 들었다. 다만 그 결과는 여러 개의 링크로만 걸었고 수치를 본문에 옮기지는 않았다."},{"claim":"GLP-1이 심장대사 건강에 대한 인식을 높여, 처방을 넘어선 더 넓은 심장대사 지원 모델에 기회가 열리고 있다.","evidence":"근거를 대지 않았다."},{"claim":"Virta가 택한 길은 고용주를 위한 종합 디지털 헬스 솔루션이 되는 Teladoc식 경로가 아니라 현재 모델을 고객 유형 전반으로 깊이 파고드는 쪽이며, 더 어렵지만 더 오래 가는 사업적·사회적 가치를 준다.","evidence":"Shah가 밝힌 100배 계획의 구성, 즉 대상 인원을 50배로 늘리면서 고객당 수익률을 2배로 높인다는 조합에서 그 방향을 읽었다."}],"experts":[{"who":"Amit Shah","role":"Virta Health의 사장이다. 자기 회사의 규모와 전망을 발표하는 자리이므로 좋게 말할 위치에 있다.","claim":"Virta는 사업을 100배로 키울 기회가 있다. 대상이 되는 커버드 라이브를 300만 명에서 1억 5,000만 명으로 50배 늘리는 동시에, 고객당 수익률을 지금의 2배로 높인다는 것이다.","evidence":"런레이트 매출 2억 달러와 EBITDA 흑자라는 현재 실적을 함께 제시했다. 다만 100배라는 목표 자체를 뒷받침하는 근거는 대지 않았다."}],"cases":[{"name":"Virta Health","what":"영양을 통해 심장대사 문제의 근본 원인을 다루는 임상 모델을 고용주 등에게 파는 회사다.","scale":"런레이트 매출은 2억 달러이고 EBITDA 기준으로 흑자다. 현재 대상 커버드 라이브는 300만 명이다.","note":"GLP-1이 만들어 놓은 심장대사 관심을 처방 바깥의 지원으로 받아내는 위치에 서 있다는 것이 필자의 평가다."}],"notes":[{"term":"cardiometabolic","ko":"심장대사","plain":"심장병과 대사질환, 즉 당뇨와 비만과 고지혈증을 하나로 묶어 부르는 말이다. 원인과 위험 요인을 공유하기 때문에 미국에서는 이들을 따로 보지 않고 한 덩어리로 다루며, 회사들은 이 이름을 걸고 고용주와 보험사에 상품을 판다. 한국에서 대사증후군이라 부르는 범위와 겹치지만, 심장 쪽까지 더 넓게 끌어안는다."},{"term":"GLP-1","ko":"위고비·오젬픽 계열의 체중 감량 주사약","plain":"원래 당뇨약으로 나왔다가 체중을 크게 줄여 주는 효과 때문에 미국에서 폭발적으로 쓰이게 된 약 계열이다. 이 약 덕분에 체중과 혈당, 심장 위험을 한 덩어리로 관리하려는 수요가 크게 늘었다. 다만 약만으로는 근육 감소와 단백질 섭취 부족, 복약을 멈춘 뒤의 체중 반등까지 해결되지 않아서, 그 빈자리를 채우려는 서비스가 여럿 생겼다. 한국에서도 위고비라는 이름으로 팔린다."},{"term":"런레이트 매출 (run-rate revenue)","ko":"지금 속도를 1년으로 환산한 매출","plain":"가장 최근 한 달이나 한 분기의 매출에 12나 4를 곱해 1년치로 바꾼 값이다. 실제로 지난 1년 동안 번 돈이 아니라 지금 속도가 그대로 이어진다고 가정한 숫자여서, 빠르게 크는 회사가 자기 규모를 크게 보이려 할 때 흔히 쓴다."},{"term":"EBITDA 흑자","ko":"이자·세금·감가상각 빼기 전 이익이 난 상태","plain":"회계상 순이익이 아니라 영업 단계에서 남는 돈이 플러스가 됐다는 뜻이다. 순이익 흑자보다 느슨한 기준이지만, 적자가 당연시되던 디지털 헬스 회사에게는 의미 있는 문턱으로 취급된다."},{"term":"covered lives","ko":"커버드 라이브","plain":"그 회사의 서비스를 쓸 자격이 있는 사람의 수다. 실제 이용자가 아니라 계약이 닿는 모집단이어서, 300만에서 1억 5,000만으로 늘린다는 말은 이용자를 50배 늘린다는 뜻이 아니라 팔 수 있는 대상 범위가 50배 넓어진다는 뜻이다."}]},{"heading_ko":"다가오는 컴퍼니 프레젠테이션 일정","heading_en":"Upcoming Company Presentations","skip":"promo","summary":"뉴스레터가 여는 회사 발표 세션 세 건의 일정과 신청 안내다. 여성 건강, 메디케어 어드밴티지, 아웃오브네트워크 가격 책정이 각각의 주제다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"고용주 의료비 상승이 전국 뉴스가 되다","heading_en":"Chart of the Week","skip":null,"summary":"고용주가 직원 의료비로 쓰는 돈이 얼마나 빠르게 오르는지를 보여 주는 Aon의 자료가 나왔고, 주요 매체가 이를 크게 다뤘다는 짧은 꼭지다. 필자는 숫자 자체는 새롭지 않다고 하면서도, 이것이 전국적 주목을 받는 시점에 주목한다.","insight":null,"signal":null,"author":[{"claim":"이 데이터는 이 뉴스레터를 꾸준히 읽는 독자에게 새롭지 않다.","evidence":"2027년 비용 트렌드가 한 자릿수 후반에서 두 자릿수 초반이 될 것이라고 한동안 이야기해 왔다는 점을 들었다."},{"claim":"그럼에도 이 문제가 전국적 주목을 받고 있다는 점은 흥미롭다.","evidence":"중간선거 시즌과 부담 가능성을 둘러싼 더 넓은 전국적 논의가 앞에 놓여 있다는 점을 들었다."}],"experts":[],"cases":[{"name":"Aon의 고용주 비용 트렌드 자료","what":"고용주 시장의 의료비 상승 폭에 관한 데이터를 목요일에 공개했고, WSJ 등 주요 매체가 이를 조명했다.","scale":"","note":"필자가 그동안 말해 온 2027년 전망은 한 자릿수 후반에서 두 자릿수 초반이다."}],"notes":[{"term":"cost trend","ko":"비용 트렌드","plain":"고용주가 직원 의료비로 쓰는 돈이 해마다 몇 퍼센트씩 오르는지를 가리키는 업계 용어다. 한 자릿수 후반에서 두 자릿수 초반이라는 말은 매년 8~12% 안팎 오른다는 뜻이며, 고용주는 그 인상분의 상당 부분을 직원이 내는 몫을 늘려 넘긴다. 그래서 이 숫자가 곧 개인의 부담으로 이어진다."},{"term":"Aon","ko":"복리후생 컨설팅·보험 중개 회사","plain":"대형 고용주를 대신해 직원 보험과 복리후생을 설계하고 협상해 주는 회사다. 수백 곳의 고용주 데이터를 쥐고 있어서 매년 내놓는 비용 전망이 업계 기준으로 인용된다."}]},{"heading_ko":"Hims CEO의 비전에 대한 회의","heading_en":"Other Top Headlines","skip":null,"summary":"Hims의 CEO가 방송 인터뷰에서 내놓은 미래 구상을 필자가 정면으로 반박하는 꼭지다. 저가 웨어러블과 블루투스 약통에서 데이터를 모아 AI 코치가 개인화한다는 구상인데, 필자는 그것이 Hims가 지금까지 소비자를 얻어 온 이유와 정반대라고 본다. 그러면서도 이 회사를 낙관할 이유로 두 가지 사회적 흐름을 따로 짚는다.","insight":null,"signal":"필자는 소비자가 다른 곳에서 더 싸게 살 수 있는 약을 굳이 Hims에서 멤버십 비용까지 내고 산다는 사실을 Hims라는 사업이 존재하는 이유로 들었다. 미국 소비자가 약값 자체보다 주문과 상담과 배송이 하나로 묶인 브랜드 경험에 웃돈을 낸다는 뜻이다. 필자는 이 흐름을 받치는 사회적 배경으로 두 가지를 덧붙였다. 개인에게 의료비 전용 계좌 예산을 주고 알아서 쓰게 하자는 주장에 지지가 넓어지고 있다는 것, 그리고 공급자를 원하는 약에 닿지 못하게 막는 중간상으로 보는 소비자 불신이 커지고 있다는 것이다.","author":[{"claim":"Hims가 헬스케어를 어떻게 바꾸겠다는 것인지에 대한 Dudum의 비전에 극도로 회의적이다.","evidence":"인터뷰의 첫 몇 분이 유럽에서 10달러에 만든 웨어러블 모조품과 블루투스 약통에서 나오는 데이터를 AI 코치가 활용한다는 설명에 쓰였다는 점을 들었다."},{"claim":"블루투스 약통은 근 20년 가까이 시도돼 온 타르 웅덩이 같은 아이디어다.","evidence":"그런 아이디어를 다룬 글을 링크로 걸었을 뿐, 과거의 실패 사례를 본문에 적지는 않았다."},{"claim":"지금 Hims 고객 중에 Hims 브랜드의 블루투스 약통이나 10달러짜리 웨어러블 모조품을 사고 싶다고 말한 사람은 0명일 것이다.","evidence":"스스로 짐작이라고 밝혔으며, 소비자 조사 같은 근거는 대지 않았다."},{"claim":"소비자는 브랜드화된 소비자 경험에 더 많은 돈을 내며, 그것이 Hims라는 사업이 존재하는 이유다.","evidence":"소비자들이 다른 곳에서 더 싸게 살 수 있는 약을 굳이 Hims에 멤버십 비용까지 내면서 산다는 사실을 들었다."},{"claim":"이런 수순은 소비자 데이터를 둘러싼 해자를 쌓으려 할 때 두는 수처럼 보인다.","evidence":"Dudum이 인터뷰에서 말한 내용 자체를 근거로 들었다."},{"claim":"그럼에도 Hims는 대단히 강력한 사회적 순풍을 등에 업고 있어 이 모델을 낙관할 이유가 여전히 있다.","evidence":"두 가지를 들었다. 하나는 '지불자로서의 환자'와, 개인에게 HSA·FSA 예산을 주고 원하는 대로 쓰게 하자는 흐름에 대한 지지 확대다. 다른 하나는 모든 것에 대한 소비자 불신의 증가와, 공급자는 원하는 약에 접근하지 못하게 막는 중간상이라는 인식이다. 필자는 이 순풍들이 반드시 좋은 것이라고 보지는 않지만 실재한다고 덧붙였다."}],"experts":[{"who":"Andrew Dudum","role":"Hims의 CEO다. 방송에서 자기 회사의 비전을 설명하는 자리이므로 투자자 인식과 주가에 이해관계가 있다.","claim":"Hims의 AI 코치가 저가 웨어러블과 블루투스 약통 같은 기기에서 나오는 데이터를 활용해 헬스케어 경험을 개인화할 것이며, 약통은 앞으로 12개월간 추진할 개념이다. 또한 개인에게 HSA·FSA 예산을 주는 흐름이 중요하다.","evidence":"원문은 그가 이 비전을 뒷받침할 데이터나 고객 요구를 제시했다고 적지 않았다. 다만 필자는 HSA·FSA를 짚은 대목만큼은 그가 제대로 짚었다고 평가했다."}],"cases":[{"name":"Hims","what":"약을 멤버십과 함께 소비자에게 직접 파는 회사다. CEO가 CNBC 인터뷰에서 AI 코치와 기기 데이터 기반 개인화 구상을 밝혔다.","scale":"","note":"개인 투자자 커뮤니티는 이 서사에 반응한 것으로 보이나, 필자는 Hims가 소비자를 얻어 온 이유와 놀랍도록 동떨어진 방향이라고 봤다."}],"notes":[{"term":"HSA / FSA","ko":"의료비 전용 세제 계좌","plain":"근로자가 세금을 떼기 전 급여의 일부를 떼어 두었다가 의료비에만 쓰는 계좌다. HSA는 쓰지 않은 돈이 계속 이월되고 본인 소유로 남지만, FSA는 그해에 쓰지 않으면 대개 사라진다. 미국인은 이 돈으로 무엇을 살 수 있는지 잘 몰라 연말마다 쓸 곳을 찾는다. 한국에는 대응하는 제도가 없고, 굳이 견주면 연말정산 의료비 공제에 가깝지만 계좌에 실제로 돈이 들어 있다는 점이 다르다."},{"term":"tarpit idea","ko":"타르 웅덩이 아이디어","plain":"겉으로는 명백히 좋아 보여서 창업자들이 계속 뛰어들지만, 실제로는 아무도 빠져나오지 못하고 가라앉는 아이디어를 가리키는 말이다. 필자는 블루투스 약통이 근 20년째 그런 아이디어로 남아 있다고 본다."},{"term":"patients as payers","ko":"지불자로서의 환자","plain":"보험사나 고용주가 아니라 환자 본인이 자기 돈으로 의료비를 내는 쪽으로 무게가 옮겨 가는 흐름을 가리킨다. 그렇게 되면 환자는 값과 경험을 직접 비교하는 소비자가 되고, 병원이 아니라 소비자 브랜드가 들어설 여지가 생긴다. 필자가 Hims를 낙관할 이유로 든 첫 번째 순풍이 이것이다."}]},{"heading_ko":"Hims, 구독 청구 불만으로 Visa 감시 대상에 오르다","heading_en":"Other Top Headlines","skip":null,"summary":"앞 꼭지와 같은 회사에 대한 후속 소식이다. 체중 감량 구독의 청구 방식을 두고 소비자 불만이 몰리면서 카드 결제망의 감시 목록에 올랐다. 필자는 벌금 액수 자체보다, 대외적으로 말하는 서사와 실제로 벌어지는 일 사이의 간극에 무게를 둔다.","insight":null,"signal":"Hims의 체중 감량 구독은 첫 달에 39달러였다가 그다음 달부터 149달러가 되는데, 이 청구 방식을 두고 카드 결제 이의 제기가 몰리면서 Visa의 가맹점 감시 목록에 올랐다. 분쟁 한 건당 8달러가 붙어 9월 벌금이 약 7만 5,000달러로 예상된다는 것은 한 달 분쟁이 9,000건을 넘는다는 뜻이고, 감시에서 빠지려면 분쟁률을 거래의 1.5% 아래로 낮춰야 한다는 조건은 지금 그 비율을 넘고 있다는 뜻이다. 미국 소비자가 온라인 처방약 구독에 실제로 돈을 내면서도, 청구 금액이 예고 없이 오르는 대목에서는 회사에 항의하는 대신 카드사에 이의를 제기하는 수단을 쓴다는 것을 보여 준다.","author":[{"claim":"Hims의 청구 구조는 마치 소비자를 위한 예상치 못한 의료비 청구서를 제1원리에서 다시 생각해 낸 것 같다.","evidence":"첫 달 39달러였던 멤버십 비용이 이후 149달러로 오르는 구조를 들었다."},{"claim":"9월에 예상되는 약 7만 5,000달러의 벌금은 Hims 전체 손익에 비하면 푼돈이다.","evidence":"분쟁 한 건당 8달러라는 단가를 들었다."},{"claim":"더 큰 문제는 Hims가 대외적으로 말하는 서사와 실체가 다르다는 점이다.","evidence":"이번 감시 프로그램 등록과, 기만적 마케팅 관행에 대한 최근 FTC 소송을 함께 들었다."}],"experts":[],"cases":[{"name":"Hims의 Visa 감시 프로그램 등록","what":"체중 감량 구독의 청구 방식을 두고 소비자 불만이 급증해, Hims가 Visa의 Acquirer Monitoring Program에 등록됐다고 Bloomberg가 보도했다.","scale":"첫 달 멤버십은 39달러이고 브랜드 GLP-1 약값은 별도이며, 그다음 달부터는 149달러다. 분쟁 한 건당 8달러가 붙어 9월에는 약 7만 5,000달러가 된다. 프로그램에서 빠지려면 분쟁률을 3개월 연속 거래의 1.5% 아래로 낮춰야 한다.","note":"결제 대행사 Stripe가 이 문제를 통보했다. 기만적 마케팅에 대한 FTC 소송도 함께 걸려 있다."}],"notes":[{"term":"Acquirer Monitoring Program","ko":"카드망의 가맹점 감시 제도","plain":"Visa 같은 카드 결제망이 결제 분쟁이 유난히 많은 가맹점을 따로 감시 목록에 올려 두는 제도다. 목록에 오르면 분쟁 한 건마다 별도 수수료가 붙고, 정해진 기간 안에 개선하지 못하면 카드 결제 자체를 받지 못하게 될 수도 있다. 그래서 벌금 액수보다 요주의 가맹점으로 지목됐다는 사실이 더 무겁다."},{"term":"분쟁률 (dispute rate)","ko":"결제 이의 제기 비율","plain":"소비자가 카드사에 이 결제는 부당하다고 이의를 제기해 돈을 되돌려 받는 절차를 차지백이라 하고, 전체 거래 대비 그 건수 비율이 분쟁률이다. 구독 요금이 예고 없이 오르거나 해지가 어려울 때 소비자가 가장 흔히 쓰는 수단이라, 이 비율이 높다는 것은 청구 방식에 문제가 있다는 신호로 읽힌다."}]},{"heading_ko":"Summa Health와 General Catalyst의 기술 전환 스택","heading_en":"Other Top Headlines","skip":null,"summary":"고전하던 지역 병원 그룹 하나를 벤처캐피털이 투자한 회사들의 기술로 통째로 바꿔 보겠다는 실험이다. 투입되는 아홉 곳이 모두 같은 투자사의 포트폴리오라는 점이 쟁점이 된다. 병원에서 혁신 업무를 해 본 필자는 현장이 어떻게 굴러갈지를 근거로 이 방식이 역효과를 낼 것으로 보고, 대신 급진적 투명성을 제안한다.","insight":null,"signal":null,"author":[{"claim":"Summa에게 최선의 솔루션인지와 무관하게 GC 포트폴리오라는 이유로 선정된 것으로 보이는 파트너 아홉 곳을 위에서 덮어씌우는 방식은 역효과가 날 것이 거의 확실하다.","evidence":"자신이 헬스 시스템에서 이노베이션 업무를 해 본 경험을 들었다. 그 경험에서 시스템 리더들은 대체로 시장의 스타트업과 선호 파트너에 대해 감을 잘 잡고 있었고, 다만 시스템 자체에 발목이 잡혔을 뿐이라고 적었다."},{"claim":"이는 여전히 미국 케어 딜리버리에서 가장 흥미로운 이노베이션 실험 중 하나이지만, 파트너십의 초기 성과는 회의를 품을 만한 이유를 준다.","evidence":"초기 성과가 구체적으로 어떠했는지는 적지 않았다."},{"claim":"시스템 전체의 전환이 정말 목표라면 급진적 투명성이 필요하다.","evidence":"공개해야 할 항목을 하나씩 열거했다. 통상적인 재무 공시를 넘어선 손익 구조, 전환 스택의 세부와 임상·재무 영향, GC 계열사들 사이의 거래, 아홉 곳이 다른 벤더가 아니라 왜 선정됐는지, 현장 직원들의 경험이다. RFK가 이미 초대를 받았다는 점을 들어 다른 사람에게도 열지 못할 이유가 없다고 적었다."}],"experts":[],"cases":[{"name":"Summa Health와 General Catalyst의 기술 전환 스택","what":"고전하는 지역 공급자였던 Summa Health를 최고 수준 기술을 활용한 미래의 선도 공급자로 바꾸겠다는 계획을 두 곳이 함께 발표했다.","scale":"General Catalyst 포트폴리오 회사 아홉 곳으로 구성된다. Aidoc, Clarium, Commure, Fabric, Hippocratic AI, Judi Health, Transcarent, Verse Medical, Percepta이며 Percepta가 전환 파트너로 총괄한다.","note":"아홉 곳이 어떻게 선정됐고 Summa 직원들에게 어떻게 설명됐는지는 공개되지 않았다. 필자가 가장 듣고 싶다고 한 대목이 그것이다."}],"notes":[{"term":"health system","ko":"헬스 시스템","plain":"병원 여러 곳과 외래 진료소를 한 지붕 아래 묶어 운영하는 지역 의료 기업이다. 미국은 국가가 병원을 배치하지 않기 때문에 이런 민간·비영리 시스템이 지역 의료를 사실상 도맡는다. Summa Health는 오하이오 Akron 지역의 그런 조직이다."}]},{"heading_ko":"R1 RCM, 사전승인 플랫폼 Humata 인수","heading_en":"Other Top Headlines","skip":null,"summary":"청구·수납을 대행하는 대형 사업자가 사전승인 소프트웨어 회사를 사들였다는 소식이다. 인수된 회사의 자산은 이전에 무너진 회사에서 되사 온 것이라, 같은 기술이 여러 손을 거쳐 왔다는 이력이 함께 정리된다. 필자는 그 회사 창업자와 나눈 팟캐스트 대화를 함께 소개한다.","insight":null,"signal":null,"author":[{"claim":"사전승인 절차를 다룬 이 팟캐스트 대화는 AI가 마찰을 줄일 수 있는 지점과 사람이 여전히 필요한 지점을 함께 보여 준다.","evidence":"대화에서 다룬 주제를 열거했을 뿐, 구체적인 결론이나 창업자의 발언은 옮기지 않았다."}],"experts":[],"cases":[{"name":"R1 RCM의 Humata 인수","what":"병원 청구·수납 대행 사업자 R1 RCM이 사전승인 플랫폼 Humata를 조건 비공개로 인수했다.","scale":"Humata는 2023년 Olive AI가 사업을 접은 뒤 그 자산을 되사들이며 시작됐고, Olive는 2021년 Verata Health를 1억 2,000만 달러에 인수하며 그 자산을 확보했다.","note":"같은 자산이 Verata에서 Olive로, 다시 Humata로, 이번에 R1으로 세 번 손바뀜한 셈이다. Humata는 Oklahoma 주에서 WISeR 프로그램의 참여 벤더로 활동하고 있으며, 창업자 겸 CEO Jeremy Friese는 Verata에서도 같은 자리에 있었고 최근 이 뉴스레터의 팟캐스트에 출연했다."}],"notes":[{"term":"prior authorization","ko":"사전승인","plain":"의사가 검사나 약을 정하기 전에 보험사에게 미리 허락을 받아야 하는 절차다. 보험사는 불필요한 지출을 막는 장치라고 하고, 의사와 환자는 진료가 며칠에서 몇 주씩 밀리는 원인으로 지목한다. 한국은 급여 기준에 맞으면 일단 진료하고 나중에 심사를 받으므로, 이렇게 미리 허락을 받는 단계 자체가 없다."},{"term":"RCM (revenue cycle management)","ko":"청구·수납 대행","plain":"병원이 진료를 마친 뒤 보험사에 청구서를 보내고 실제로 돈을 받아 내기까지의 모든 사무 작업을 대신 처리해 주는 사업이다. 미국은 보험사마다 청구 규칙이 달라 이 작업만으로 큰 산업이 만들어졌다. R1 RCM이 그 대표 사업자다."},{"term":"WISeR 프로그램","ko":"메디케어 원조에 사전승인을 시험하는 CMS 프로그램","plain":"메디케어에는 정부가 직접 값을 치르는 부분(원조 메디케어)과 민간 보험사에 맡기는 부분(메디케어 어드밴티지)이 있는데, 사전승인은 그동안 주로 민간 쪽에서만 쓰였다. WISeR는 정부 직영 부분에서도 일부 시술에 사전승인을 붙여 보는 시험 프로그램이며, 주 단위로 참여 벤더가 지정된다. Humata가 Oklahoma의 벤더다."}]},{"heading_ko":"Ascension 병원의 약물 혼동 사고","heading_en":"Other Top Headlines","skip":null,"summary":"대형 병원 그룹이 수술 중 약물이 뒤바뀐 사고를 인정했다는 짧은 소식이다. 필자는 이 사고를 계기로, 아직 오지 않은 AI의 위험을 걱정하는 데 쓰는 에너지와 지금 벌어지고 있는 사고 사이의 불균형을 지적한다.","insight":null,"signal":null,"author":[{"claim":"이런 이야기가 현재 진행형인데도 우리가 집단적으로 의료에서 AI가 미래에 미칠 영향을 걱정하는 데 그토록 많은 에너지를 쓴다는 사실이 놀랍다.","evidence":"이번 사고 자체를 들었다."},{"claim":"병원은 복잡한 환경이고 실수는 인간적인 일이지만, 2026년에 이 사고는 충분히 피할 수 있었던 일로 보인다.","evidence":"근거를 대지 않았다."}],"experts":[],"cases":[{"name":"Ascension","what":"미국의 대형 헬스 시스템으로, Nashville의 자사 병원 한 곳에서 정기 관절 치환 수술 도중 마취제 대신 인산칼륨이 주입된 사고를 인정했다.","scale":"환자 한 명이 마비되고 세 명이 상해를 입었다.","note":""}],"notes":[]},{"heading_ko":"Weave, 6억 5,000만 달러에 비상장 전환","heading_en":"Other Top Headlines","skip":null,"summary":"의료기관의 접수와 환자 응대 업무를 돕는 AI 회사가 사모펀드에 인수되어 상장을 접는다는 한 줄 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Weave","what":"의료기관의 여러 프론트오피스 환자 응대 업무를 돕는 에이전틱 AI 플랫폼으로, Francisco Partners에 인수되며 비상장 전환된다.","scale":"인수 금액은 약 6억 5,000만 달러다.","note":""}],"notes":[]},{"heading_ko":"Cityblock, 1억 1,600만 달러 조달과 Homeward Health 인수","heading_en":"Funding Announcements","skip":null,"summary":"복합 질환을 가진 공보험 인구를 맡아 온 회사가 자금을 조달하면서 같은 시장의 다른 회사를 주식으로 인수했다. 필자가 창업자와 직접 나눈 대화를 바탕으로, 이 회사가 지금 어느 국면에 들어섰는지를 정리한다. 요점은 시장의 역풍을 견디며 갖춘 운영 기반을 이제 확장에 쓰면서, 이 시장에서 다른 회사를 사들이는 쪽으로 돌아서려 한다는 것이다.","insight":null,"signal":null,"author":[{"claim":"Cityblock은 이번 발표를 사업의 새 장을 여는 출발점으로 보고 있다.","evidence":"Ajayi와의 대화에서 받은 분명한 인상이라고 밝혔다."},{"claim":"VBC 시장의 역풍이 이 회사에게는 순풍으로 바뀌고 있다.","evidence":"근거를 대지 않았다."},{"claim":"Cityblock이 플랫폼이 될 만한 규모에 도달해 이 시장에서 자산을 사들이는 인수자가 되기에 좋은 위치에 섰으며, 그것이 맞다면 시장 전반의 스타트업에게 좋은 소식이다.","evidence":"이번 라운드와 Homeward Health 인수, 그리고 Ajayi가 밝힌 비유기적 성장 계획을 들었다."}],"experts":[{"who":"Toyin Ajayi","role":"Cityblock의 공동창업자 겸 CEO다. 자금 조달과 인수를 막 발표한 자리이므로 전망을 좋게 말할 위치에 있다.","claim":"앞으로 유기적 성장과 비유기적 성장을 함께 추구하며, 비유기적 성장의 우선순위는 중증 정신질환과 물질사용장애, 특수 요구 인구 같은 다른 복합 인구로 확장하는 것과 그 인구를 지원하는 역량에 맞춰져 있다.","evidence":"원문은 그가 든 근거를 옮기지 않았다."}],"cases":[{"name":"Cityblock","what":"복합 질환을 가진 메디케이드·메디케어 인구를 맡아 VBC 방식으로 진료를 제공하는 회사로, 자금을 조달하면서 Homeward Health를 전액 주식 거래로 인수한다고 발표했다.","scale":"조달 금액은 1억 1,600만 달러이며, General Catalyst가 라운드를 주도했다.","note":"주정부와 CMS, 보험사에게 고가치 케어를 제공하는 AI 기반 파트너가 되겠다는 것이 다음 국면의 목표로 제시됐다."}],"notes":[{"term":"Medicaid","ko":"메디케이드","plain":"저소득층을 위한 미국의 공보험이다. 연방과 주가 함께 돈을 대고 주가 운영하므로 자격 기준과 보장 범위가 주마다 다르다. 노인을 위한 메디케어와 헷갈리기 쉬운데 메디케이드는 소득 기준이며, 둘 다 받는 사람도 있다."},{"term":"VBC (value-based care)","ko":"성과 기반 지불","plain":"진료 건수마다 값을 치르는 방식 대신, 맡은 인구의 건강 결과와 총 의료비를 기준으로 돈을 주고받는 방식이다. 회사가 환자를 잘 관리해 입원과 응급실 이용을 줄이면 아낀 돈의 일부를 가져가고, 반대의 경우에는 손실을 떠안는다. 미국은 지난 10년간 이 방식으로 옮겨 가는 흐름을 밀어붙였지만, 자금 조달이 어려워지고 성과가 늦게 나오면서 여러 회사가 고전했다. 본문에서 말하는 역풍이 그것이다."},{"term":"복합 질환 인구 (complex populations)","ko":"돌보기 어려운 고비용 환자군","plain":"만성질환 여러 개에 정신질환이나 주거 불안 같은 생활 문제까지 겹쳐 의료비가 유난히 많이 드는 사람들을 가리킨다. 인원은 적지만 전체 의료 지출에서 차지하는 비중이 커서, 이들의 비용을 낮추는 데 성공하면 돌아오는 보상이 크다. 이 회차의 자금 조달 세 건이 모두 이 인구나 농촌 쪽을 향한 이유이기도 하다."}]},{"heading_ko":"Deon Health, 지적·발달장애 인구 관리의료로 투자 유치","heading_en":"Funding Announcements","skip":null,"summary":"지적·발달장애가 있는 사람들을 관리의료 모델로 옮기는 회사가 보험사로부터 전략적 투자를 받았다. 필자가 CEO와 나눈 대화를 소개하는데, 이 인구가 왜 비용이 높으면서도 그동안 제도 바깥에 있었는지가 설명된다. 마지막에 나오는 사망 원인 이야기가 이 꼭지에서 가장 무게가 실린 대목이다.","insight":null,"signal":null,"author":[{"claim":"Deon이 만들고 있는 모델은 흥미롭다.","evidence":"지역 공급자들과의 조인트벤처를 통해 직접지원 전문인력을 지원한다는 구조를 들었다."},{"claim":"요로감염에서 비롯된 패혈증이 이 인구의 주요 사망 원인이라는 것은 2026년 미국에서 충분히 풀 수 있는 문제로 보인다.","evidence":"많은 이들이 말을 하지 못해 문제를 전달할 수 없다는 Ratner의 설명을 들었다."}],"experts":[{"who":"Sara Ratner","role":"Deon Health의 CEO다. 이 인구를 관리의료 모델로 옮기는 사업을 하는 쪽이므로 그 전환이 좋다고 말할 이해관계가 있다.","claim":"이 인구를 관리의료 모델로 옮기면 메디케이드 전반의 부정수급 우려를 어느 정도 해소하는 동시에 독특한 의료 수요를 더 잘 지원할 수 있고, 응급실에 오는 빈도가 줄면서 비용 절감도 따라온다. 요로감염에서 비롯된 패혈증이 이 인구의 주요 사망 원인 중 하나다.","evidence":"많은 이들이 말을 하지 못해 문제를 전달할 수 없다는 점을 들었다. 다만 부정수급이 얼마나 줄고 비용이 얼마나 절감되는지는 수치로 제시되지 않았다."}],"cases":[{"name":"Deon Health","what":"지적·발달장애가 있는 인구를 위한 관리의료 모델을 만드는 회사로, 지역 공급자들과의 조인트벤처를 통해 직접지원 전문인력을 지원한다. AmeriHealth Caritas로부터 새로운 전략적 투자 라운드를 유치했다.","scale":"금액은 공개되지 않았다.","note":"투자자가 재무 투자사가 아니라 메디케이드 관리의료를 하는 보험사라는 점이 눈에 띈다. 사업 파트너가 지분으로 들어온 형태다."}],"notes":[{"term":"I/DD","ko":"지적·발달장애","plain":"지적장애와 자폐를 비롯한 발달장애를 함께 부르는 말이다. 이 인구는 의료비가 가장 많이 드는 환자군 가운데 하나인데도, 미국의 여러 주에서 관리의료 대상 밖에 놓여 왔다."},{"term":"DSP (direct support professional)","ko":"직접지원 전문인력","plain":"지적·발달장애가 있는 사람의 일상생활을 곁에서 돕는 인력이다. 미국에서 이 일은 임금이 낮고 이직률이 높아 인력난이 만성이며, 그 때문에 돌봄의 질과 건강 문제를 알아채는 능력이 사람에 따라 크게 달라진다. Deon이 이 인력을 지원하겠다고 나선 배경이 그것이다."},{"term":"관리의료 모델로 옮긴다","ko":"주정부가 직접 치르던 몫을 민간에 맡기는 전환","plain":"그전에는 주정부가 서비스 건마다 값을 직접 치렀다. 관리의료로 옮기면 주정부가 민간 회사에 사람당 정액을 주고 전체를 맡기며, 받는 쪽은 덜 쓸수록 이익이 남으므로 응급실 방문을 줄일 유인이 생긴다. 다만 필요한 서비스까지 줄일 위험도 함께 생기는 대목이다. 본문에서 이 인구가 역사적으로 제외돼 왔다는 것은 이 전환이 아직 안 됐다는 뜻이다."}]},{"heading_ko":"Hopscotch Health, 농촌 1차 진료로 5,300만 달러","heading_en":"Funding Announcements","skip":null,"summary":"농촌 지역의 1차 진료를 돕는 회사가 자금을 조달했다는 짧은 소식이다. 필자는 이번 주에 나온 세 건의 라운드를 묶어 농촌과 복합 질환 시장에 돈이 몰리고 있다고 읽는다.","insight":null,"signal":null,"author":[{"claim":"지금 농촌과 복합 질환 시장에 모멘텀이 있다.","evidence":"이번 주에 Cityblock, Deon Health, Hopscotch Health 세 건의 라운드가 함께 나왔다는 점을 들었다."}],"experts":[],"cases":[{"name":"Hopscotch Health","what":"원문이 농촌 지역 1차 진료 이네이블러라고 소개한 회사로, 새 자금을 조달했다.","scale":"조달 금액은 5,300만 달러이며 8VC와 Town Hall Ventures가 라운드를 주도했다. 현재 주로 North Carolina 서부에서 1만 5,000명의 환자를 진료한다.","note":""}],"notes":[{"term":"primary care enabler","ko":"1차 진료 이네이블러","plain":"동네 의원을 직접 사들여 소유하는 대신, 개원의가 성과 기반 계약을 감당할 수 있도록 데이터와 인력과 자금을 대주는 사업 모델이다. 성과 기반 계약은 절감액을 나중에 정산받는 구조여서 작은 의원 혼자서는 버티기 어렵기 때문에, 그 부담을 대신 져 주는 회사가 필요해진다."}]},{"heading_ko":"AI가 의사를 대체하느냐는 논쟁을 가라앉히기","heading_en":"What I'm Reading","skip":null,"summary":"AI가 임상의를 능가할 것이라는 기고가 의학 학술지에 실리면서 벌어진 소동을 다룬다. 필자는 글 자체보다 그에 대한 반발이 과했다고 보고, 인용된 인물이 실제로 그리는 그림은 의사를 없애는 쪽이 아니라고 짚는다. 그러면서 이 논쟁이 정작 필요한 대화를 가리는 미끼라고 결론짓는다.","insight":"이 꼭지는 무엇을 만들지보다 어디까지가 규제 밖인지를 갈라 준다. 필자가 든 예, 즉 FDA 허가를 받은 AI 에이전트를 병원이 환자에게 처방하는 경로는 3개월 안에 갈 수 없는 길이므로, 진단이나 치료 결정에 닿는 기능은 이번 후보에서 빼는 편이 낫다. 반대로 규제 밖에 남는 자리는 사용자가 이미 받아 든 것을 이해시키는 쪽이다. 검사 결과지나 진료 후 요약을 쉬운 말로 풀어 주고 다음 진료에서 물어볼 질문을 정리해 주는 화면은 새로 판정을 내리지 않는 선을 지키는 한 허가 대상이 아니고, 영어가 편하지 않거나 설명을 듣지 못한 미국 사용자가 실제로 막히는 지점이기도 하다.","signal":null,"author":[{"claim":"이 글에 대한 소셜미디어의 반박들이 얼마나 쓸모 있는지 의문이며, 알고리즘에 영합해 분노를 자극하도록 설계된 것처럼 보인다.","evidence":"근거를 대지 않았다."},{"claim":"Khosla의 실제 입장을 들어 보면 의사가 AI 에이전트 팀을 관리하는 세계이므로, 자율 AI냐 사람이 낀 AI냐라는 이 논쟁의 구분 자체가 흐릿하다.","evidence":"작년 말 Eric Larsen과의 팟캐스트 18분 지점 발언을 들었고, 이 팀이 기고를 쓴 8개월 남짓 동안 그가 그 입장에서 크게 멀어지지 않았을 것이라고 짐작했다."},{"claim":"병원이 FDA 승인 AI 에이전트를 환자에게 처방하는 것은 디지털 치료제가 10년 넘게 약속해 온 것의 다음 반복과 크게 다르지 않으며, 바로 그 지점에서 지금의 논쟁은 사실상 무의미해진다.","evidence":"Cleveland Clinic이 그렇게 하는 상황을 가정해 물었고, FDA 510k 절차도 이를 그렇게 보는 듯하다는 점을 덧붙였다."},{"claim":"'AI가 의사를 대체할 것인가'라는 서사는 정작 이뤄져야 할 훨씬 결이 섬세한 대화에서 주의를 돌리는 미끼다.","evidence":"Mark Cuban의 비판을 읽어 보니 그도 사실 Khosla와 Emanuel 등의 입장에 대체로 동의하고 있다고 본 점을 들었다. 각자가 자기 이익 풀을 지키려는 태도를 넘어서면 합의점이 훨씬 많다는 것이다."},{"claim":"AI의 임상 확산 자체는 불가피해 보이므로 사람들을 양극단으로 몰아붙이는 일은 역효과다.","evidence":"근거를 대지 않았다."}],"experts":[{"who":"Zeke Emanuel, Abe Baker-Butler, Neal Khosla, Vinod Khosla","role":"이 기고를 함께 쓴 네 사람이다. 원문은 이들의 소속을 밝히지 않았다. 필자는 이 논쟁 전반을 두고 각자가 자기 이익 풀을 지키려 한다고 적었을 뿐, 이 네 사람을 지목해 그렇게 말하지는 않았다.","claim":"AI 단독이 의사와 AI의 하이브리드를 능가할 것이며, 2030년이면 실제 진료 워크플로에 투입될 수 있다.","evidence":"이 주제에 관한 최근 연구를 정리해 근거로 삼았다. 필자는 글 자체가 그것이 불러일으킨 반응에 비하면 꽤 온건했다고 평가했다."},{"who":"Vinod Khosla","role":"위 기고의 공동 저자다. 원문은 그의 소속을 밝히지 않았고, 작년 말 팟캐스트 발언을 인용했다.","claim":"의사가 자신을 대신해 일종의 레지던트 역할을 하는 AI 에이전트 팀을 관리하면서 의사의 도달 범위가 넓어지는 세계가 온다. 그 세계에서 의사는 재정적으로 오히려 더 낫다.","evidence":"원문은 그가 든 근거를 옮기지 않았다."},{"who":"소셜미디어의 전문가들","role":"원문은 개별 이름을 밝히지 않았다. 임상의를 방어하는 쪽에 선 사람들이다.","claim":"연구가 결함투성이다, 의학은 예술이자 과학이다, AI는 사람에게 손을 얹을 수 없다.","evidence":"원문은 이들이 든 근거를 하나씩 옮기지 않았고, 필자는 이 반박들이 분노를 자극하도록 설계된 것처럼 보인다고 평가했다."}],"cases":[{"name":"JAMA Viewpoint 기고","what":"AI가 임상의를 능가할 것이라고 주장하는 관점 글이 미국의사협회지의 의견란에 실렸다.","scale":"저자는 네 명이며, 이 팀이 글을 쓰는 데 8개월 남짓 걸렸다.","note":"필자는 글 자체가 그것이 불러일으킨 반응에 비하면 꽤 온건했다고 평가했다."},{"name":"Cleveland Clinic","what":"FDA 승인을 받은 AI 에이전트를 환자에게 처방하는 상황의 예로 언급됐다. 원문은 만약 그렇게 한다면 어떻게 볼 것이냐는 가정문으로 적고 관련 기사를 링크로 걸었다.","scale":"","note":"필자는 이것이 자율 AI인지 사람이 루프 안에 있는 것인지 딱 잘라 가를 수 없는 예로 들었다."}],"notes":[{"term":"JAMA Viewpoint","ko":"미국의사협회지의 의견란","plain":"연구 논문이 아니라 저자의 주장을 싣는 자리다. 새 데이터를 담지 않아도 실릴 수 있지만, 실린 곳이 미국 의학계에서 가장 무게 있는 학술지 가운데 하나여서 업계가 크게 반응한다. 이번 소동도 주장의 새로움보다 실린 자리 때문에 커진 면이 있다."},{"term":"FDA 510(k)","ko":"기존 제품과 같다고 인정받아 시장에 나오는 허가 경로","plain":"이미 승인된 제품과 실질적으로 같다는 것을 보여 시장에 내놓는 미국 의료기기 허가 경로다. 처음부터 임상시험을 새로 하는 전면 승인보다 훨씬 빠르고 싸서, 소프트웨어 형태의 의료기기 대부분이 이 경로로 시장에 나온다. 그래도 서류와 심사가 필요해 몇 달에서 1년 이상이 걸리므로, 3개월짜리 계획에는 들어가지 않는다."},{"term":"디지털 치료제 (digital therapeutics)","ko":"처방받는 치료용 소프트웨어","plain":"약 대신 앱이 치료 효과를 낸다고 주장하며 규제 허가를 받아 의사가 처방하는 소프트웨어다. 2010년대에 큰 기대를 모았으나 처방과 보험 수가를 받아 내는 데 실패해 대표 회사들이 무너졌다. 필자는 지금의 AI 에이전트 논의가 그 흐름의 다음 반복이라고 본다."},{"term":"human-in-the-loop","ko":"사람이 루프 안에 있는 구조","plain":"AI가 스스로 결정을 끝내지 않고 중간이나 마지막에 사람이 확인하고 승인하는 구조를 가리킨다. 규제와 책임 소재가 이 구분에 걸려 있어서, 같은 제품을 두고도 자율 AI인지 사람이 낀 AI인지를 두고 논쟁이 벌어진다. 필자가 이 구분이 흐릿하다고 말하는 이유가 그것이다."}]}],"themes":["policy-legislation","medicare-advantage","consumer-dtc","employer-insurance","value-based-care","ai-clinical"],"for_later":[]}],"extras":{"glossary":{"items":[]}},"themeLabels":{"medicare":"메디케어","medicare-advantage":"메디케어 어드밴티지","medicaid":"메디케이드","aca-exchange":"ACA 거래소","employer-insurance":"고용주 보험","payer-ops":"보험사 운영","hospital-health-system":"병원·헬스시스템","primary-care":"1차 진료","value-based-care":"성과기반 진료","rcm-billing":"청구·수납","pbm-drug-pricing":"PBM·약값","pharmacy-retail":"약국·리테일","pharma-glp1":"제약·GLP-1","price-transparency":"가격 투명성","consumer-dtc":"소비자 직접판매","cash-pay":"현금 결제 시장","employer-benefits":"복리후생","ai-clinical":"임상 AI","ai-admin":"행정 AI","data-interop":"데이터 상호운용","telehealth":"원격진료","behavioral-mental":"정신건강","chronic-care":"만성질환 관리","senior-care":"시니어 케어","women-health":"여성 건강","dental-vision":"치과·안과","devices-wearables":"기기·웨어러블","digital-health-funding":"투자·펀딩","ma-consolidation":"인수합병","regulation-cms":"CMS 규제","regulation-fda":"FDA 규제","policy-legislation":"입법·정책","public-health":"공중보건","workforce":"인력","rural-access":"의료 접근성","clinical-trials":"임상시험","insurance-brokerage":"보험 유통","startups":"스타트업","market-earnings":"실적·시장"},"raw":{"01":{"index":"01","title_en":"Weekly Health Tech Reads 1/4/26","subtitle":"AI와 헬스케어에 관한 단상, VBC에 대한 토론, 버몬트의 가격 투명성 노력, 그리고 그 밖의 소식","sections":[{"heading_en":"AscendRural's Senior Care Accelerator","body":"스폰서: AscendRural\n\nAscendRural's Senior Care Accelerator는 농촌 지역의 고령 인구를 지원하는, 파일럿이 가능한 솔루션을 대상으로 이번 주 금요일인 1월 9일까지 지원서를 받고 있습니다.\n\n이들의 4주 프로그램은 초기 단계 스타트업이 실제 농촌 현장에서 솔루션을 파일럿하고, 검증하고, 확장하도록 돕고, 최대 15만 달러 규모의 자금이 지원되는 파일럿 계약을 확보할 기회를 함께 제공합니다.\n\n선정된 팀은 멘토십, 농촌 시장 인사이트, 체계적인 준비 지원, 그리고 AscendRural의 전국 및 지역 파트너 생태계와의 연결도 얻게 됩니다.\n\n이번 주 금요일 1월 9일까지 지원하세요"},{"heading_en":"","body":"부디 편안한 휴가철이었기를 바라며, 다시 오신 것을 환영합니다. 연휴 동안 헬스케어 뉴스는 비교적 조용한 몇 주였는데, 다음 주 JPMorgan을 앞두고 모두가 준비에 들어가는 이번 주에는 분명 금세 달라질 것입니다. 올해 JPM의 기업 발표에 대해 제가 진행할 팝업 커버리지에 관해 이번 주에 저희가 보낼 또 다른 소식을 기다려 주세요.\n\n- Kevin"},{"heading_en":"My Reflection: Arts and crafts and business","body":"지난 몇 년 동안 여러 번 받은 질문이 있습니다. 왜 뉴스레터 제작 과정을 더 자동화하지 않느냐는 것입니다. 매주 제가 하는 일 가운데 얼마나 많은 부분이 자동화될 수 있고 그 과정에서 시간을 얼마나 아낄 수 있는지 그려 보는 것은 어렵지 않습니다. 그런데도 저는 늘 이 과정을 자동화하려는 충동을 눌러 왔습니다.\n\n오해하지는 마세요. 여러분과 주고받는 이야기를 즐기기는 하지만, 뉴스레터를 쓰려고 새벽 5시에 일어나고 싶지 않은 일요일도 분명 있습니다. 하지만 자동화하지 않은 가장 큰 이유는 이기적인 것입니다. 이 뉴스레터를 만드는 일은 매주 제가 하게 되는 저만의 개인 예술 프로젝트 같은 것이기 때문입니다. 뉴스레터 한 편 한 편은 제가 푸는 퍼즐이고, 제 솜씨를 다듬는 기회입니다. 저는 매주 이런 식으로 깊이 생각할 기회를 소중히 여기게 되었습니다.\n\n우리의 여러 세계가 AI가 만들어 낸 온갖 것에 잠식되면서, 이 뉴스레터 같은 것에 들어가는 솜씨는 점점 더 두드러질 것이라고 저는 믿습니다. 연휴 동안 Scott Belsky가 쓴 블로그 글도 비슷한 이야기를 했는데, 여러 주제 가운데 2026년 제품에 들어가는 솜씨의 중요성을 다뤘습니다. 제가 편향돼 있는 것은 분명하지만, 저에게는 확실히 와닿았습니다.\n\n이렇게 물으실 수도 있습니다. 알겠어요 Kevin, 그런데 이게 헬스케어와 무슨 상관이죠? 저는 더 많은 \"front of house\" 인간을 향한 움직임에 관한 Belsky 글의 아래 대목이 꽤 관련이 있다고 생각했습니다:\n\n2025년 헬스케어 AI 혁신의 상당 부분이 역사적으로 형편없었던 \"front of house\" 환자 경험을 자동화해 없애는 데 집중된 것으로 보였다는 점을 생각하면, 이런 정서를 보는 것은 특히 흥미로웠습니다.\n\n저는 2025년 뉴스레터에서 이를 폭넓게 다뤘습니다. AI 증상 체커로서 Doctronic이 성장한 것부터, 진료소의 자동 전화 안내 시스템으로 Assort Health가 채택된 것, 의료 시스템의 아웃바운드 전화를 처리하는 Hippocratic AI까지, 헬스케어의 \"front of house\" 경험을 자동화하려는 시도에 자금을 대려는 열기가 넘쳐 보입니다. 그 뒤에 있는 사업적 당위는 분명해 보입니다. 인건비를 줄여 영업이익률을 넓히는 것은 의료 제공 조직에 의미 있는 지렛대입니다. 그리고 현재 상태의 기준선이 워낙 낮기 때문에, 이는 단기적으로 개선하기 쉬운 기회를 제공합니다.\n\nWellSpan Health의 CEO는 지난 10월 이곳에서 Hippocratic AI와의 파트너십 비전을 잘 설명하면서, 그것이 그 사업적 당위를 어떻게 뒷받침하는지 감을 줬습니다:\n\n지금 저희 비전은 언제 어디서나 케어를 받을 수 있게 하는 것이고, 앞으로 사람들이 헬스케어를 그렇게 소비하게 될 것이라고 생각합니다. 그래서 Anna가 그 비전의 큰 부분이 될 수 있고, 저희는 이미 그녀를 저희 케어 팀의 일원으로 여기고 있습니다.\n\n그래서 그녀는 저희의 AI 케어 어시스턴트로 소개됩니다. 환자들이 그녀와 상호작용하는데, 미래의 비전은 WellSpan에 연락하는 모든 사람이 처음에 Anna의 인사를 받는 것일 수 있습니다. 웹이든 전화든 무엇이든, 모든 통화와 모든 접촉에 대해 그녀가 정말로 저희의 현관문이 되는 것이죠. 그리고 그녀는 지금까지 아주 잘하고 있습니다. 저희는 Anna로 160만 통이 넘는 전화를 걸었습니다. 그녀는 아주 열심히 일합니다. 그리고 지난주에 그녀는 그 주 1차 진료 방문의 50% 이상을 예약했습니다. 그 예약을 끝까지 완료했다는 것은 분명히 환자들이 Anna와 상호작용하는 것을 좋아한다는 뜻이고, 그렇지 않았다면 통화를 끝까지 마치지 않았을 것입니다.\n\n출처: Roxanna Gapstur, WellSpan Health CEO (명확성을 위해 약간 편집함)\n\n그런데 그 글을 읽으면서, 모든 상호작용을 자동화한다는 이 비전이 의료 제공 조직이 향할 방향으로는 틀린 것이 아닌가 하는 생각을 떨칠 수 없습니다. Belsky의 주장을 생각하면, 이런 자동화된 상호작용은 싸구려처럼 느껴지고 나쁜 경험을 낳을 것입니다. WellSpan에서의 Hippocratic 도입에 대한 페이스북의 반응이 이미 그 단면을 보여 줬습니다. 사람들은 기회가 주어지면 사람의 손길이 있는 경험을 선택할 것입니다. 단적인 예로, Private Medical 같은 고급 컨시어지 경험의 웹사이트를 보면, 핵심 가치 제안은 언제든 담당 의사에게 직접 연결되는 것이지 상호작용하게 될 LLM의 품질이 아닙니다.\n\n그래서 Belsky의 환대에 관한 생각 풍선을 헬스케어의 현관문에 적용해 보면, 의료 제공 조직에서 나올 더 흥미로운 비전은 애초에 환자가 증상 체커와 상호작용하거나, 자동 전화 안내를 듣거나, 자동 메시지를 받을 필요가 더 이상 없는 비전이라고 생각합니다. 환자에게 개인화된, 사람이 있는 경험에 편리하게 접근할 수 있게 해 주는 것? 그런 세상이라면 얼마나 좋을까요!\n\n오늘날의 컨시어지 경험보다 더 저렴한 가격대에서 그런 경험을 가능하게 하는 데 AI와 기술이 중요한 역할을 한다는 것은 분명합니다. 하지만 인건비를 아끼려고 사람 간 상호작용을 그저 자동화해 없애기보다는, 근본적으로 인간적인 경험의 배경으로 스며듭니다. 노동을 로봇으로 대체하는 차익거래 기회는 빠르게 닫힐 것입니다. 특히 그토록 많은 것이 인간관계로 굴러가는 산업에서는, 받아들일 만한 마진으로 이런 경험을 가능하게 하는 방법을 알아내는 것이 미션 크리티컬해 보입니다.\n\n그러니 저 같은 창작자든 의료 제공 조직을 운영하는 사람이든, 2026년에는 우리 각자의 제품에 들어가는 인간다움과 솜씨를 AI가 자동화해 없애는 것이 아니라 어떻게 뒷받침할지를 우리 모두 많이 고민하게 될 것 같습니다."},{"heading_en":"Community Discussion Topic: Is VBC Succeeding?","body":"지난 11월에 제가 Aledade의 Farzad Mostashari와 Brown의 Andrew Ryan의 대화를 소개했던 것을 기억하실 것입니다. 그 대화에서 두 사람은 이 질문에 정반대 편에 섰습니다. Mostashari는 value-based care의 원칙과 MSSP 프로그램의 성공을 탄탄하게 옹호했습니다. VBC에 반대하는 Ryan의 주장은 구체적인 내용은 적었지만, 미국 헬스케어의 병폐를 고치는 수단으로서 VBC에서 이제 넘어갈 때가 됐을지도 모른다는 씨앗을 심는 데는 그럼에도 효과적이었습니다. 다른 건 몰라도, 그 대화는 이 주제에 대한 의견의 격차를 분명히 보여 줬습니다.\n\n2026년에 들어서면서, 올해는 value-based care의 모멘텀에 결정적인 해가 될 것으로 보입니다. 그래서 이번 주 커뮤니티에서 아래 설문을 시작으로 더 풀어서 이야기해 보면 좋은 주제라고 생각했습니다:\n\n15년이 지난 지금, value-based care는 성공하고 있는가?\n\n그렇다, 명백한 성공이었다\n\n아직은 아니지만, 올바른 방향으로 가고 있다\n\n아직은 아니고, 잘못된 방향으로 가고 있다\n\n아니다, 이제 넘어갈 때다\n\n모르겠다, 장단점이 있다\n\n모르겠다, 답할 만큼 충분히 알지 못한다\n\nHTN 커뮤니티 멤버 여러분께:\n\n2026년에 커뮤니티에서 더 많은 시간을 쓰고 싶은 일 중 하나는, 함께 배우기에 특히 임팩트가 크다고 생각하는 몇 가지 주제로 대화를 모으는 것입니다. 이를 어떻게 가장 잘 뒷받침할지 실험하는 차원에서, 위의 VBC 질문에 대한 이어지는 토론으로 한 해를 열어 보려고 합니다.\n\n주중에 저희는 이 주제 전용의 새 채널에 커뮤니티 멤버들이 토론할 몇 가지 프롬프트를, 저희의 생각을 자극한 기사들과 함께 올릴 예정입니다. 목요일에는 제가 Aledade의 공동창업자 Farzad Mostashari를 모시고, 최근 발표된 Aledade의 크레딧 퍼실리티와 value-based care 파이낸싱에 대한 그의 더 넓은 관점에 관해 대화를 나눕니다. 금요일에는 커뮤니티 멤버들이 이 주제에 대해 배운 것을 나누는 토론을 열어 한 주를 마무리합니다.\n\n이번 주에 VBC의 현재 상태에 대해 더 생각해 보고 싶다면, 여기서 신청하시기를 권합니다:"},{"heading_en":"Chart of the Week: BCBS VT's transparency push","body":"Blue Cross Blue Shield of Vermont는 이번 주에 버몬트의 고비용 학술 의료 센터에서 이용을 다른 곳으로 돌리려는 상당히 대담한 조치를 취했습니다. 이 보험사는 더 저렴한 네 곳의 의료 제공 조직과 협력해 Vermont Affordable Care라는 웹사이트를 띄웠는데, 버몬트 주민들이 여러 장소에서 서비스 비용이 얼마인지 이해하도록 돕는 것을 목표로 합니다. 비용 데이터를 이용해 버몬트 주민들이 어디서 진료를 받는지에 영향을 주려는 흥미로운 시도입니다:\n\n출처: Vermont Affordable Care 웹사이트\n\n지난 몇 달 동안 여러 Blues 플랜이 헬스케어의 높은 비용을 이야기하려고 공론장에 나섰습니다. 최근 BCBSM이나 BCBSNC의 기고문이 그 예입니다. 이번 시도는 시장 지배적인 의료 제공자인 University of Vermont Medical Center(UVMMC)를 콕 집어 지목했다는 점에서 눈에 띕니다. 지역 뉴스 보도는 이것이 왜 통상적이지 않은지에 대한 좋은 힌트를 줍니다. BCBS VT는 줄타기를 하고 있습니다. 사람들을 UVMMC에서 멀어지게 유도하면서도, 동시에 UVMMC가 너무 화가 나서 네트워크를 떠나 버리지는 않도록 해야 하는 것이죠.\n\n전반적으로 저는 가격 투명성이 실제로 비용을 줄이는 데 도움이 될 것이라는 데 여전히 꽤 회의적입니다. 기본적인 논리는, 높은 가격을 받는 의료 제공자는 그럴 수 있으니 계속 높게 유지할 것이고, 낮은 가격을 받는 의료 제공자는 그 높은 가격을 근거로 자신들의 가격을 올리는 것을 정당화할 것이라는 점입니다. No Surprises Act나 North Carolina State Health Plan의 Clear Pricing Project의 결과를 예로 보세요.\n\n하지만 투명성이 비용을 줄이는 데 도움이 될 수 있다면, 저는 그것이 BCBS VT의 이번 같은 시도를 통해서일 것이라고 생각합니다. 경계를 밀어붙인 그들에게 박수를 보내며, 이것이 그 시장에서 비용을 줄이는 데 도움이 되기를 바랍니다."},{"heading_en":"Other Top Headlines","body":"CMS가 500억 달러 규모 Rural Health Transformation Program의 2026년 자금 배분을 발표했습니다. 2026년에 100억 달러가 50개 주 전체에 배분되며, Texas와 Alaska가 각각 2억 8,100만 달러와 2억 7,200만 달러로 선두입니다. New Jersey는 1억 4,700만 달러로 가장 적은 금액을 받았습니다. 각 주의 농촌 인구를 기준으로 1인당으로 계산해 보면 Rhode Island가 압도적인 1위이고, Texas는 실제로는 맨 아래에 있습니다."},{"heading_en":"Other Top Headlines","body":"Prenuvo와 한 영상의학과 의사가, 2023년 Prenuvo 스캔을 받은 뒤 뇌졸중을 겪은 환자로부터 의료과실 소송을 당했습니다. 소송은 이들이 뇌졸중을 막을 수 있었던 주요 경고 신호를 놓치고 오히려 결과가 정상이라고 알렸다고 주장합니다. 사건은 진행 중이지만, 판사는 캘리포니아 법에 따라 의료과실 배상액에 상한을 두려는 Prenuvo의 시도를 기각했습니다. 이 사건에 연루된 Prenuvo의 영상의학과 의사는 별건으로 2024년 1월 New York에서 7,000만 달러가 넘는 보험 사기 계획에 가담한 혐의를 인정한 것으로 보입니다. 저만 그런지 모르겠지만, 이는 2025년 초 Prenuvo의 1억 2,000만 달러 투자 유치 발표에서 나온 최첨단 기술 서사의 상당 부분과 모순되는, 꽤 우려스러운 데이터 포인트로 보입니다."},{"heading_en":"Other Top Headlines","body":"FDA가 Novo Nordisk의 경구용 알약 버전 Wegovy를 승인했습니다."},{"heading_en":"Funding Announcements","body":"HSA / FSA 혜택 자금을 쓸 수 있는 마켓플레이스인 TrueMed가 3,400만 달러를 유치했습니다. a16z가 라운드를 주도했습니다. 롱제비티 상품에 대한 관심이 커지고 HSA 계좌에 대한 정치적 지지가 있는 상황을 감안하면, TrueMed는 이 시장의 파도를 탈 좋은 위치에 있는 것으로 보입니다."},{"heading_en":"What I'm Reading: Town Hall Ventures' 2026 Predictions","body":"Town Hall Ventures' 2026 Predictions, Andy Slavitt, Josh Loria, Andie Steinberg 씀\n\n저는 2026년 예측 기사 대부분을 피해 왔지만, 이 글은 특히 정책 지형에 관해 흥미로운 관점이 몇 가지 있다고 생각했습니다. 구체적으로는, CMMI의 새 LEAD 모델의 핵심 요소로서 CARA를 다룬 대목이 특히 흥미로웠는데, 이것이 서브 캐피테이션 모델의 의미 있는 증가로 이어질 수 있다고 짚었습니다."},{"heading_en":"What I'm Reading: Mark Cuban Tells Us How He Can Fix America's Sh!tty Health Care","body":"Mark Cuban Tells Us How He Can Fix America's Sh!tty Health Care, Jonathan Cohn 씀\n\nMark Cuban은 요즘 헬스케어를 ~~망치는~~ 고치는 방법에 대한 자신의 관점을 여기저기서 늘어놓고 있습니다. 저는 The Bulwark에 실린 그와 Jonathan Cohn의 이 인터뷰가 그런 생각의 일부를 담은 좋은 인터뷰라고 생각했습니다. Cuban이 말하는 것 중 어떤 것은 말이 되고 어떤 것은 그렇지 않다는, 그 글에 담긴 Cohn의 정서에 저도 동의합니다. 전체 서사의 일관성을 표현하는 방식치고는 꽤 정중한 편으로 보입니다.\n\n솔직히 말하면 이 서사는 조금 Groundhog Day 같은 느낌입니다. 기억하실지 모르겠지만, 저는 2025년도 Cuban의 다른 블로그 글에 대한 불만을 나누며 시작했습니다. 올해 연휴 동안 새로 알게 된 한 가지는, Mark Cuban이 몇 년 전에 이 나라의 헬스케어 재원 조달에 대한 자기 나름의 계획을 실제로 내놓았고 그것을 10Plan이라고 불렀다는 사실입니다. Cost Plus Drugs가 만들어 낸 임팩트에 대해서는 Cuban이 분명 인정받을 자격이 있습니다. 하지만 전반적인 과도한 단순화와 손가락질은 대화를 생산적으로 진전시키는 데 전혀 도움이 되지 않아 보입니다. 10Plan이나 Cost Plus Wellness 같은 시도에서 Cuban이 겪은 확산 실패는(Cost Plus Drugs에서 Humana와 파트너십을 맺고 싶어 했던 것은 말할 것도 없고) 그가 이번 같은 대화에서 드러내는 것보다 이곳의 복잡성을 더 잘 알고 있음을 분명히 보여 줍니다. 그런 대화에서 그는 마치 다른 거의 모든 사람이 헬스케어를 아직 고치지 못했다는 이유로 바보이거나 악하다고 생각하는 것처럼 보입니다."}]},"26":{"index":"26","title_en":"Weekly Health Tech Reads 3/29/26","subtitle":"펩타이드 열풍에 대한 단상, 열두 건에 이르는 스타트업 펀딩 발표, 그리고 그 밖의 소식","sections":[{"heading_en":"","body":"👋 이번 주 일요일 헬스케어 뉴스 정리에 오신 것을 환영합니다. 2026년 1분기를 마무리하는 지금, 올해 헬스케어 혁신 논의를 지배하는 두 가지 흐름이 임상 진료에서의 AI와 롱제비티 모델이라는 점이 분명해졌습니다. 이번 주에는 두 가지 모두가 넘치도록 등장했고, 여기에 DOJ가 헬스 시스템을 제소한 일이나 프로바이더의 코딩 인텐시티 문제 같은 좀 더 전통적인 너드 주제들도 함께 나왔습니다. 이번 주에 발표된 스타트업 펀딩 라운드만 열두 건인데, 투자자들이 AI 닥터와 펩타이드 주사에서 보고 있는 거대한 기회를 보여 줍니다. 자, 들어가 봅시다!\n\n- Kevin\n\nPS. 다음 주 일요일은 부활절이라 쉬지만, 4월 6일 월요일에는 Martin과 함께 The Grand Round Up 라이브를 진행합니다. 그날은 이른바 2027 Final Notice 마감일이라, 이야기할 거리가 충분할 것 같습니다 🙂"},{"heading_en":"Catch The Grand Round Up LIVE, Tomorrow @ 12pm ET / 9am PT","body":"🚨 The Grand Round Up 라이브, 내일 미 동부시간 낮 12시 / 태평양시간 오전 9시\n\nMartin과 저는 The Grand Round Up에서 매주 헬스케어 뉴스를 정리하며 이야기 나누는 시간을 꽤 즐기고 있습니다. 요즘 헬스케어 혁신 세계에서 벌어지는 일이 워낙 많아서, 이렇게 글로 쓰는 형식에 더해 라이브로 다 함께 짚어 보는 것이 상당히 도움이 된다고 느끼고 있습니다.\n\n이번 주에는 대단한 펩타이드 논쟁, Martin이 연례 AHIP 컨퍼런스에서 느낀 점, 그리고 열두 건의 개별 펀딩 라운드 같은 주제를 다룹니다. 또 몇 분의 특별 게스트에게서 이야기를 들을 수 있게 되어 기대하고 있습니다.\n\n- Cityblock의 Co-Founder 겸 CEO인 Toyin Ajayi가 미 동부시간 12시 15분부터 12시 30분까지 Cityblock이 AI를 어떻게 도입하고 있는지 이야기합니다.\n- Stedi의 Founder 겸 CEO인 Zack Kanter가 미 동부시간 12시 35분부터 12시 50분까지 Stedi의 5,000만 달러 규모 시리즈 C와 클레임 클리어링하우스의 미래에 대해 이야기합니다.\n\n🎙️ 매주 월요일 미 동부시간 낮 12시 / 태평양시간 오전 9시, LinkedIn 또는 YouTube에서 라이브로 함께해 주세요."},{"heading_en":"Top Headlines","body":"DOJ가 최근 몇 달 사이 헬스 시스템을 상대로 두 번째 반독점 소송을 제기했습니다. 이번에는 뉴욕시의 New York Presbyterian을 상대로, all-or-nothing 조항과 anti-tiering / steering 계약 조항을 문제 삼았습니다. DOJ가 NYP를 상대로 어떤 논리를 펴는지, 그리고 NYP가 더 저렴한 보험 상품이 시장에 들어오는 것을 어떻게 막고 있다고 보는지 살펴볼 만한 소송입니다. 저만 그런지 몰라도, 뉴욕시 지도들의 조합과 더 낮은 가격을 제시하는 경쟁자 이야기, 그리고 NYP의 25% 시장 점유율에 대한 논의를 읽어 나가면서 이것이 특별히 강력한 반독점 사건이라는 느낌은 받지 못했습니다. 자신이 시장에서 고비용 상품이라는 것을 알고 있고, 바로 그 위치에 있는 것을 편안해하는 조직처럼 읽힙니다. DOJ의 소장은 NYP가 내부 분석을 진행해, 티어링이 도입되면 매년 수억 달러의 이익이 사라진다는 결과를 얻었다고 지적합니다. anti-tiering 조항과 all-or-nothing 계약이 소비자 가격을 낮추는 데 도움이 되지 않는 것은 분명합니다. 다만 그것이 주된 목표라면, 지금 놓여 있는 트레이드오프를 감안할 때 경쟁을 더 키우고 가격을 낮출 가능성이 더 높은 다른 길들이 있다고 생각합니다."},{"heading_en":"Top Headlines","body":"New York City Health + Hospitals가 Palantir와의 계약을 갱신하지 않기로 했습니다. ICE를 포함한 정부 고객을 지원하는 Palantir의 업무를 두고 정치적 반발이 일어난 데 따른 것입니다. NYC Health + Hospitals는 그동안 레비뉴 사이클 매니지먼트 지원을 위해 Palantir를 써 왔고, 2023년 이후 Palantir에 약 400만 달러를 지급한 것으로 보입니다."},{"heading_en":"Top Headlines","body":"컨설팅 업계에서는 Infosys가 Optimum Healthcare IT를 4억 6,500만 달러에 인수한다고 발표했습니다. Optimum은 2025년에 2억 7,600만 달러의 매출을 올렸는데, 2024년의 1억 700만 달러에서 늘어난 수치입니다. 흥미롭게도 Optimum 뒤에 있는 PE 회사는 지난 몇 년간의 성장 요인으로, 더 많은 인력을 업계로 끌어들인 도제식 교육 프로그램을 꼽습니다."},{"heading_en":"Top Headlines","body":"OpenEvidence가 \"의사들이 벌어들인 모든 돈을 빠짐없이 확보하도록 돕는다\"는 취지의 새로운 Coding Intelligence 상품을 출시했습니다. 핵심인 검색 상품을 넘어 좀 더 전통적인 RCM 기능으로 확장하는, OpenEvidence로서는 흥미로운 전략적 움직임으로 보입니다. 논리는 이해가 갑니다만, 그 기세가 경쟁이 치열한 RCM 시장에서 어떻게 이어질지는 궁금하기도 합니다. OE가 여기서의 사용량을 어떻게 발표할지 지켜보고 싶습니다."},{"heading_en":"Top Headlines","body":"고용주를 위한 대안적 플랜 설계인 XO Health가 전국으로 확장하고 있습니다. XO는 자가보험 고용주, level-funded 플랜, TPA를 대상으로 흥미로운 밸류 기반 케어 네트워크를 구축해 왔습니다. 지난 몇 년간 대안적 플랜 설계에 대해 이야기해 온 끝에, 이제 고용주들이 실제로 움직이기 시작하는 변곡점에 와 있다는 느낌입니다. 앞으로 몇 년간 이 영역이 어떻게 전개될지 지켜보면 흥미로울 것입니다."},{"heading_en":"Top Headlines","body":"Health Management Associates가 Medicaid에 특화된 애널리틱스 플랫폼 HealthTech Solutions를 인수한다고 발표했습니다."},{"heading_en":"MUSING: Should I be injecting myself with peptides?","body":"어린 시절 제가 자란 시대에, 제가 아는 한 몸에 뭔가를 주사하는 사람이라고는 야구의 강타자들, 마약 중독자들, 그리고 제1형 당뇨병을 앓던 친구뿐이었습니다. 수십 년이 지난 지금, 저는 갑자기 제 개인 펩타이드 공급책 노릇을 해 주는 롱제비티 클리닉 하나 없다는 이유로 촌사람이 된 기분입니다. 지난 1년간 펩타이드에 대한 관심이 어떻게 급등했는지 보여 주는, 목요일 Sherwood 기사의 차트를 보시죠.\n\n출처: Sherwood 기사, 2026년 3월 26일\n\n위 문단에서 눈치채셨겠지만, 저는 여기에 회의적입니다. 그런데 며칠 전 임상의 친구와 이야기하면서 펩타이드에 대한 의견을 물었습니다. 그의 의견이 절제된 낙관론이어서 조금 놀랐습니다. 지금의 회색 시장이 후미진 곳일 수는 있습니다. 하지만 동시에 염증을 억제하면 건강상 상당한 이득이 따른다는 일반적인 발상 자체에는 근거가 있다는 것입니다. 그의 전반적인 견해는, 10년 뒤에 우리가 펩타이드를 GLP-1과 같은 혁명적 잠재력을 가진 것으로 바라보게 될 가능성도 충분히 있다는 것이었습니다(GLP-1 자체도 펩타이드지만, 사람들이 흔히 \"펩타이드\"라고 말할 때 가리키는 회색 시장의 것들과는 다른 범주로 보이기는 합니다).\n\n저는 Martin Shkreli(그 파마 브로)와 Max Marchione(Superpower CEO)가 펩타이드의 유용성을 두고 벌인 30분짜리 TBPN 토론을 본 뒤, 월요일 오후의 상당 부분을 펩타이드 토끼굴을 파고드는 데 썼습니다. 이 주제에 관심이 있는데 아직 못 보셨다면, 시간을 들일 만합니다.\n\n제가 Shkreli를 이성의 목소리로 여기게 될 줄은 몰랐지만, 어쨌든 지금은 2026년이고 우리는 이상한 세상에 살고 있습니다. 저는 Shkreli가 내용상으로는 꽤 분명하게 토론에서 이겼다고 봅니다. 그러면서도 동시에, Marchione가 전투에서는 졌지만 결국 전쟁에서는 이기게 되는 것은 아닐까 하는 생각을 지울 수 없습니다. Superpower나 Hims 같은 회사들은 이 흐름에 올라타기 좋은 위치에 있는 것으로 보이고, 특히 다가오는 연방 차원의 규제 완화를 감안하면 더욱 그렇습니다. 이번 주 eMed와 VITL의 펀딩 발표는 다가올 펩타이드 붐에 대한 투자자들의 기대를 보여 주는 신호처럼 보입니다. Gameday Men's Health 같은 브랜드는 조용히 상당한 규모의 거점을 쌓아 올리고 있습니다(현재 미국 전역에 400개가 넘는 프랜차이즈 클리닉을 두고 있습니다).\n\nShkreli와 Marchione의 토론은 펩타이드를 둘러싼 현재의 대화를 꽤 잘 요약해 주는 것 같습니다. 의료계 주류는 펩타이드가 효과가 있다는 증거가 없다고 외칩니다. 시티즌 사이언티스트들은 효과가 없다면 왜 이렇게 많은 사람이 쓰고 있느냐고 되묻습니다. 양쪽 다 타당한 지점을 짚고 있지만, 서로 엇갈려 이야기하면서, 이런 문제를 대신 정리해 주기로 되어 있는 FDA 같은 기관에 대한 불신이라는 훨씬 더 큰 사회적 대화의 가장자리만 맴돌고 있는 듯합니다.\n\n여기서의 결말은 꽤 예측 가능해 보입니다. 소비자들은 지갑을 열어 중국산 회색 시장 펩타이드를 몸에 주사하는 것으로 자신의 선호를 드러내고 있습니다. 운동선수들이 BPC-157로 회복이 빨라진다고 여기는 것 같은데, 그럼 나라고 못 쓸 이유가 있나? 의료계 주류가 펩타이드에 증거가 없다고 소리치는 동안, 소비자들은 신경 쓰지 않는 것처럼 보입니다. 인기가 커지면 나쁜 행위자들이 나타날 것이고, 자기가 무엇을 주사하는지 실제로는 알지 못하는 일부 사람들에게 나쁜 결과가 생길 것입니다. 그런 나쁜 결과들은 이목을 끄는 헤드라인이 될 것입니다. 정치 지도자들이 손쉬운 승리를 보게 되면서 규제 당국의 조사가 뒤따를 것이고, 펩타이드는 결국 자리 잡힌 시장으로 정착할 것입니다.\n\n제 개인적인 펩타이드 소비에 관해 말하자면, 저는 이 시장에서 뒤늦게 따라가는 쪽이어도 괜찮습니다. 그 사이클이 흘러가는 동안 회색 시장 화합물은 다른 사람들이 실험하도록 두겠습니다. 그렇긴 해도, 앞으로 5년 안에 그 질문에 대한 제 답은 바뀔 것 같습니다. FDA 승인을 받은 retatrutide든, 파이프라인에서 내려올 다른 기적의 약이든 말이죠."},{"heading_en":"A NUMBER TO PONDER","body":"88%\n\nHealth Enterprise Partners가 자사 LP 150곳을 대상으로 진행한 설문에 따르면, 향후 12개월간 입원 건당 인건비가 오를 것이라고 보는 헬스케어 프로바이더 임원의 비율입니다. 이 수치는 AI가 가까운 미래에 비용 제로에 가까운 의료 공급의 풍요를 가져올 것이라는, 제가 읽어 온 여러 사설류의 주장과는 상반되어 보입니다.\n\nHEP 설문은 여러 핵심 산업 트렌드를 짚고 있어 전체를 훑어볼 가치가 있지만, 이 숫자가 특히 눈에 띄었습니다. 저는 HEP의 Managing Partner인 Ezra Mehlman, Operating Partner인 Tom Cassels와 이 내용을 비롯해 리포트의 다른 핵심 트렌드에 대해 이야기를 나눌 기회가 있었습니다(Apple, Spotify, YouTube). Tom과 Ezra는 AI가 촉발할 파괴의 가능성, 그리고 조직 재설계가 시간이 오래 걸리는 과정이라는 점에 대해 흥미로운 인사이트를 나눠 주었습니다."},{"heading_en":"CHART OF THE WEEK","body":"이번 주 Boston Globe의 기사는 매사추세츠주 패혈증의 흥미로운 사례를 조명했습니다. 아래 차트에서 보듯, 지난 몇 년 사이 고중증도 퇴원 건수가 극적으로 증가한 사례입니다. 이 증가의 잠재적 원인으로 AI가 이끄는 코딩 인텐시티라는 유령이 거론되는데, AI 기반 도구들이 프로바이더에게 더 나은 문서화를 제공하기 때문입니다.\n\n출처: Boston Globe 기사, 2026년 3월 20일"},{"heading_en":"Funding Announcements","body":"헬스 시스템용 AI 플랫폼 Qualified Health가 1억 2,500만 달러를 조달했습니다. New Enterprise Associates가 라운드를 주도했습니다. Qualified는 Mercy, Emory Healthcare, University of Rochester Medicine, Jefferson Health, University of Texas System을 자사 AI 플랫폼을 쓰는 고객으로 꼽습니다. Qualified는 Palantir나 Health Catalyst와 비슷한 접근을 취하는 것으로 보이는데, 엔지니어를 헬스 시스템 내부에 투입해 다양한 AI 기회를 구축하고 실행하도록 돕는 방식입니다."},{"heading_en":"Funding Announcements","body":"클레임 클리어링하우스 Stedi가 5,000만 달러를 조달했습니다. Addition이 라운드를 주도했으며, 이는 Stedi가 직전 라운드를 발표한 지 겨우 7개월 만입니다. Stedi의 누적 조달액은 이제 1억 4,200만 달러입니다. 유료 고객 6배 증가, 청구 트랜잭션 7배 증가를 언급하며, 연간 10억 건이 넘는 클레임과 자격 확인 트랜잭션을 처리하고 있다고 합니다."},{"heading_en":"Funding Announcements","body":"임상의를 위한 AI 에이전트를 만드는 스타트업 Thesis Care가 4,500만 달러를 조달했습니다. Oak HC/FT가 이 라운드를 주도했으며, Thesis는 이전에 Trovo Health로 불리던 회사입니다. 1차 진료와 전문 진료 조직 전반에 걸쳐 수천 명의 프로바이더를 고객으로 두고 있다고 하며, 여기에는 US Heart and Vascular도 포함됩니다."},{"heading_en":"Funding Announcements","body":"임상 진료를 위한 AI 모델 Doctronic이 4,000만 달러를 조달했습니다. Abstract와 Lightspeed Venture Partners가 라운드를 주도했으며, 12개월이 채 안 되는 기간에 세 번째 라운드입니다. Doctronic은 6개월 전 시리즈 A를 마감한 이후 15배 성장해 1,000만 달러 이상의 연환산 매출을 내고 있고 주간 방문자 30만 명 이상을 기록하고 있다고 밝힙니다. 이 계산대로라면 현재 월 약 21,000건의 원격진료 상담을 하고 있다는 뜻이 되고(21,000 × $39 × 12 = 약 1,000만 달러), 이는 주간 방문자 30만 명 중 2% 미만에 대해서만 원격진료 방문이 이뤄지고 있음을 뜻합니다. Ngai Yeung이 이번 주 Endpoints에서 Doctronic을 써 본 흥미로운 경험을 공유하며, 기대와는 달리 AI 중심의 케어가 아직 갈 길이 남아 있다는 점을 짚었습니다."},{"heading_en":"Funding Announcements","body":"AI 중심의 레비뉴 사이클 매니지먼트 플랫폼 Adonis가 4,000만 달러를 조달했습니다. Quadrille Capital이 라운드를 주도했고 General Catalyst와 Bling Capital이 참여해, Adonis의 누적 조달액은 9,400만 달러가 되었습니다. 보도자료는 Adonis가 2025년에 매출 4배 성장을 기록했고 순유지율은 130%를 넘는다고 밝힙니다. 고객으로 Mount Sinai가 인용되어 있습니다."},{"heading_en":"Funding Announcements","body":"롱제비티 진료 기관 eMed가 20억 달러 이상의 밸류에이션으로 2억 달러를 조달했습니다. AON Consulting이 라운드를 주도했는데, 이런 라운드의 리드 투자자로 보기에는 이례적인 이름입니다. 하기야 이 회사 자체가 좀 이례적이어서, Tom Brady를 Chief Wellness Officer로 두고 있습니다. eMed는 보도자료에서 자사가 고용주를 위한 \"골드 스탠더드\" GLP-1 상품이라고 여긴다며 환자 순응도 90%를 근거로 들었습니다. eMed는 롱제비티/펩타이드 기회를 바로 낚아챌 준비가 된 것으로 보이는 D2C 상품도 갖고 있습니다."},{"heading_en":"Funding Announcements","body":"정신과 진료 기관을 위한 AI 코파일럿 Blossom Health가 2,000만 달러를 조달했습니다. Headline이 라운드를 주도했습니다. Blossom은 수백 명의 임상의가 자사 제품을 사용해 1만 명이 넘는 환자를 진료하고 있다고 밝혔습니다."},{"heading_en":"Funding Announcements","body":"대출 상환 프로그램을 통해 고용주가 채용한 임상 인력을 유지하도록 돕는 스타트업 Clasp가 2,000만 달러를 조달했습니다. Crosslink Capital과 Digitalis Ventures가 라운드를 주도했습니다. Clasp는 다른 모델보다 유지율이 2.5배 높다고 주장합니다. 이미 여러 대형 헬스 시스템이 고객인데, Boston Children's Hospital, Memorial Sloan Kettering, Northwestern Medicine, Novant Health, Ohio Health 등입니다."},{"heading_en":"Funding Announcements","body":"AI 중심의 퇴원 후 관리 플랫폼 Dimer Health가 1,350만 달러를 조달했습니다. Team8과 Table Management가 라운드를 주도했습니다."},{"heading_en":"Funding Announcements","body":"NP가 이끄는 클리닉을 위한 business-in-a-box 모델 Prax Health가 두 번의 라운드에 걸쳐 1,000만 달러의 자금 조달을 발표했습니다. Martin이 Prax의 Co-Founder 겸 CEO인 Meghan Jewitt와 마주 앉아 이 모델에 대해 더 들어 볼 기회가 있었습니다. Prax는 200명이 넘는 NP가 자신의 독립 진료소를 열도록 도왔고, 올해 5배에서 10배 성장을 향해 가고 있습니다."},{"heading_en":"Funding Announcements","body":"AI 닥터를 만드는 스타트업 Certuma가 6,000만 달러 밸류에이션으로 1,000만 달러를 조달했습니다. 8VC가 라운드를 주도했습니다."},{"heading_en":"Funding Announcements","body":"조제 약국과 롱제비티 클리닉을 연결하는 플랫폼 VITL이 750만 달러를 조달했습니다. VITL은 현재 630곳이 넘는 클리닉을 고객으로 두고 있으며 1,000만 달러 이상의 ARR을 내고 있다고 밝힙니다."},{"heading_en":"What I'm Reading: Medicaid + AI: A New Standard for Innovation","body":"Toyin Ajayi 씀\n\nCityblock이 Medicaid 인구를 대상으로 AI 도입에 어떻게 접근하고 있는지를, 이론적 원칙과 멤버 여정에 AI를 어떻게 녹여 넣고 있는지 양쪽 측면에서 다룬 좋은 관점입니다."},{"heading_en":"What I'm Reading: The Future of Quality in Medicare and Medicaid: Themes from the CMS Quality Conference","body":"Avalere Health 씀\n\nAvalere 팀이 최근 열린 CMS의 질 측정 컨퍼런스에서 얻은 시사점을 공유합니다. 첫 번째 시사점이 치료에서 예방 서비스로의 초점 이동이라는 점이 흥미로웠는데, 아주 놀랍지는 않았습니다. 연례 웰니스 방문, 영양, 생활습관 개입이 모두 여기서 핵심 역할을 합니다."},{"heading_en":"What I'm Reading: Break Stuff: Ten Things the Healthcare Market Is Telling Us in 2026","body":"Ezra Mehlman, Jessie Gentil, Michelle Kauffman, Culver Duquette 씀\n\n위에서 언급했듯, 헬스케어 임원 150명 이상을 대상으로 한 이 연례 HEP 설문은 AI가 이끄는 변화의 현주소, 헬스케어 조직에 가해지는 비용 압박 등에 대해 유용한 인사이트를 제공했습니다."},{"heading_en":"What I'm Reading: Rise of the Agentic EHR","body":"Colton Ortolf 씀\n\nOrtolf가 X에 흥미로운 글을 올려, 에이전틱 EHR이 EHR 파괴자로서 \"헤드리스 EHR\" 개념을 대체할 가능성을 짚었습니다. '왜 지금인가'에 대한 논점들을 곱씹어 볼 만합니다. AI로 유통 비용이 낮아지는 점, 오늘날 더 나아진 기술, 더 많은 SMB 프로바이더 고객, 그리고 혁신가의 딜레마에 직면한 기존 강자 집단이 그것입니다."},{"heading_en":"What I'm Reading: Doctors should be paid to keep patients healthy","body":"Ashish Jha, Tom Tsai 씀\n\n밸류 기반 케어가 나아갈 길로 판돈을 키우자는 주장을 펴는, Substack(그리고 Boston Globe)에 실린 흥미로운 시리즈입니다. 전문 진료를 포함한 상방/하방 리스크, 더 긴 계약 기간 등 모두가 더 책임 있는 케어를 중심으로 돌아갑니다. VBC 너드라면 새로울 것이 많지는 않겠지만, 좀 더 일반 독자를 향해 이 주장이 어떻게 펼쳐지는지 보는 것은 흥미롭습니다."},{"heading_en":"What I'm Reading: High-Stakes Medicine: Rethinking Policies for the Cost and Value of Cell and Gene Therapies","body":"Alison Sexton Ward, Elizabeth Fowler, Jeremy Shane, Darius Lakdawalla 씀\n\n세포·유전자 치료제가 보상 경로 측면에서 안고 있는 고유한 어려움을 다룬 유익한 글입니다. 병원이 이런 프로그램에 투자할 때 겪는 재정적 어려움에 대한 지적이 특히 흥미로웠습니다. 이를테면 CGT 프로그램을 시작하는 데 선불로 100만 달러가 들 수 있는데, 이후의 환자 유입에 대한 가시성은 제한적이라는 것입니다."},{"heading_en":"HTN Content From the Week","body":"Community Brain Trust: HTN Slack 소식, 노스캐롤라이나가 주(州) 건강보험 플랜을 어떻게 고치고 있는지, Allina와 Sutter Health의 합병 등."},{"heading_en":"HTN Content From the Week","body":"Weekly Health Policy Briefing: AHIP에 드리운 그늘, Medicare에서 기본값이 된 매니지드 케어, 그리고 Medicaid 소급 적용."},{"heading_en":"HTN Content From the Week","body":"Health Tech Nerds Radio\n\n- The Grand Roundup: Sutter-Allina 합병, Lantern의 3,000만 달러 조달과 모델, WISeR 사전승인 반발, Medicare Advantage 대 FFS, state directed payments, 헬스테크 펀딩 등. Apple, Spotify, YouTube.\n- 헬스 시스템이 케어를 확장하도록 돕는 버추얼 케어 모델 만들기 | Ashul Govil (Story Health by Innovaccer). Apple, Spotify, YouTube.\n- 미국 공립학교의 절실한 정신건강 수요에 응답하기 | Jake Sussman (CEO, Marble Health). Apple, Spotify, YouTube.\n- AI와 조직의 현실, 치솟는 인건비, 그리고 버추얼 케어와 VBC의 다음 물결로서의 전문 진료: 페이어·프로바이더 임원 150명에게서 얻은 인사이트 | Ezra Mehlman (HEP), Tom Cassels (Manatt). Apple, Spotify, YouTube."}]},"54":{"index":"54","title_en":"Weekly Health Tech Reads 8/23/26","subtitle":"Devoted의 \"Beat and Raise\", San Antonio의 No Surprises Act 딜레마, AI 대 의사 논쟁의 수위 낮추기, Hims의 실망스러운 비전, 그 외","sections":[{"heading_en":"Announcing Differential","body":"Health Tech Nerds가 주최하고 Oak HC/FT가 후원하는, 가장 유망한 초기 단계 헬스테크 창업자 100명을 위한 초대 전용 모임 Differential을 알립니다.\n\nAI와 정책, 자본시장, 구매자 행동이 한꺼번에 움직이는 지금, 흔들리지 않는 헬스테크 회사를 세우려면 무엇이 필요할까요?\n\nMario Schlosser(Oscar Health), Toyin Ajayi(Cityblock), Kate Ryder(Maven Clinic), Jacob Shiff(CMMI), Vincent Tammaro(Mount Sinai) 등과의 비공개 대화를 통해 그 질문에 답해 보려 합니다. 행사 전과 도중, 그리고 이후에 야심 찬 다른 창업자들과 만날 기회도 많습니다.\n\n10월 1일 뉴욕에서 함께하시려면 지원해 주세요. 지원은 9월 9일에 마감됩니다.\n\n스폰서 Oak HC/FT, Davis Polk, Lazard, Lorikeet에 큰 감사를 전합니다.\n\nDifferential 스폰서 문의"},{"heading_en":"The No Surprises Act Saga","body":"San Antonio의 No Surprises Act 딜레마\n\n이번 주 텍사스에서 접한 이야기 하나가 내내 흥미로웠다. San Antonio 시 직원 건강보험 플랜이 2026년 연간 예산 2억 5,000만 달러를 4,000만 달러 초과하고 있다는 소식이다. 시는 San Antonio에서 응급실 네 곳을 운영하는 체인 Prestige Emergency Rooms가 2025년 말부터 NSA의 IDR 절차를 활용하기 시작한 것이 원인이라고 본다.\n\nPrestige는 San Antonio 지역 응급실 50곳 중 네 곳만 운영하지만, 시가 보장하는 2만 8,000명의 응급실 이용량 가운데 53%를 차지한다. IDR 절차를 거치면서 Prestige의 가격은 대략 두 배가 됐고, IDR로 넘긴 건의 99.6%에서 이기고 있다. Prestige는 그동안 BCBS 요율 아래에서 낮게 지급받아 왔고 이제야 합리적인 수가를 받는 것뿐이라고 주장하는데, IDR 결과를 옹호하는 공급자들이 흔히 내세우는 논리다. 한편 기사에 따르면 Prestige 쪽에서 얼마간의 술수가 벌어지고 있을 가능성도 있다. 시 직원들은 Prestige가 개인의 본인부담금과 코페이를 면제해 주기 때문에 그곳을 이용한다고 말했는데, IDR 절차를 활용해 고용주에게서 두 배를 받아낼 수 있다면 이는 효과적인 전략이다.\n\n여기서 질문이 하나 생긴다. 직원들이 하나같이 좋아하는 단일 공급자 그룹 때문에 올해 예산을 16% 넘겨 앉아 있는 시라면, 이제 무엇을 하겠는가? 시 매니저는 5월에 직원들에게 메모를 보내, 너무 많은 사람이 Prestige를 이용한 탓에 그 시점에 이미 플랜이 예산을 2,000만 달러 초과했다고 알렸다고 한다. 그는 메모에서 Prestige 대신 병원 응급실을 이용하라고 권했다. 그 전략은 통하지 않은 듯한데, 불과 석 달 만에 예산 적자가 두 배로 늘었다는 사실이 이를 보여 준다. 시 전체도 불어나는 예산 적자에 직면해 있어 상황은 한층 더 복잡하다. 시와 BCBS는 Prestige를 인네트워크로 데려오기 위해 협상을 시도하고 있지만, 오늘날 Prestige가 물량과 가격 양쪽에서 이기고 있는 마당에 협상에 나설 유인이 실제로 무엇일지 잘 모르겠다. 그래서 2027년에 시는 IDR 절차로 인한 비용 증가를 반영해 가입자 보험료를 인상하기 시작할 것이다.\n\n이는 No Surprises Act의 IDR 절차가 현실에서 어떤 결과를 낳는지 아주 잘 보여 주는 사례다. No Surprises Act는 예상치 못한 청구서라는 문제 하나를 풀었지만, San Antonio에서 드러나듯 이제 또 다른 문제를 만들어 내고 있다. 공급자들은 이 절차가 지불자와의 협상력 구도를 바꾸고 있다는 사실을, 그리고 청구를 IDR 절차로 몰아넣으면 갑자기 두 배(혹은 그 이상!)의 수가를 받을 수 있다는 사실을 깨달은 듯하다.\n\n이런 종류의 대화는 이제 막 시작됐을 뿐이라고 본다. Prestige 사례가 보여 주듯, 이 회사도 2025년 말에야 IDR 절차에 참여하기로 했다. 공급자들의 IDR 참여를 그래프로 그리면 S자 곡선이 나올 것 같고, 지난 몇 달 사이 그 결과에 정당성을 부여한 법원 판결들이 바로 지금 얼리어답터에서 더 주류인 공급자 조직으로 캐즘을 넘게 만들고 있다. 공급자 조직을 운영하는 입장에서 Prestige 같은 결과를 본다면, 똑같은 수를 두지 않을 이유가 있겠는가?\n\n이 모든 것이 공급자 쪽에서 리스크 조정 같은 분위기를 풍긴다. 인센티브가 공급자들에게 더 많이 받아내는 게임을 하라고 대놓고 가리키고 있고, 프로그램의 작동 방식에 v28 같은 변화가 오기 전까지 과열은 계속될 것이다."},{"heading_en":"Medicare Advantage","body":"Devoted Health의 가치가 얼마라고? 그 외 Medicare Advantage 시장의 움직임들\n\n금요일 늦은 오후, Business Insider는 Devoted Health가 250억 달러 가치로 추가 자본을 조달하고 있다고 보도했다. 3억 1,700만 달러를 160억 달러 가치로 조달했다고 발표한 지 채 1년도 되지 않은 시점이다. Cigna를 여전히 포함해 세느냐에 따라 다르지만, 이는 Devoted가 상장사였다면 Centene을 제치고 다섯 번째 또는 여섯 번째로 큰 관리의료 회사가 된다는 뜻이다.\n\n출처: HTN 분석, 재무상태표 데이터는 Perplexity의 도움을 받음\n\n오늘의 숫자로만 보면 Medicare Advantage 보험 사업치고는 천문학적인 가치다. Devoted는 올해 들어서야 MA 가입자 50만 명을 막 넘겼기 때문이다. MA 가입자 1인당 가치로 환산하면 대략 5만 달러(250억 달러 / 50만 명)인데, 이는 ZIRP 정점기 MA에서 보던 밸류에이션에 근접한 수준이다. 비교하자면 Clover Health는 2021년에 가입자 5만 7,000명으로 37억 달러 가치에 SPAC 상장했고, MA 가입자 1인당 6만 5,000달러였다. 오늘날 Clover는 가입자를 대략 세 배로 늘렸음에도 가치는 20억 달러에 가까워졌고, 이는 MA 가입자 1인당 1만 1,000달러라는 훨씬 합리적인 수치다. Devoted가 비슷하게 평가받는다면 오늘 기준 55억 달러 가치일 것이다.\n\n지금 보도된 가치에서는 사실상 Devoted를 어떤 합리적인 의미에서도 인수 불가능한 회사로 만든다. 물론 AI 회사라면 가능하겠지만, 데이터센터 위에 관리의료라는 PR 악몽까지 얹는 일은 금방 다시 생각하기를 바란다. 인터넷의 이 구석에서 전에도 이야기했듯, Devoted는 자신의 베팅을 꽤 분명히 밝혔다. 위 목록의 다른 이름들보다 CMS에게 더 효과적인 파트너가 되는 현대적 관리의료 사업을 다시 지을 수 있다고 보고, 그것을 해내면 앞으로 몇 년간 점유율을 가져가며 MA뿐 아니라 모든 보험 시장에서 지배적 사업자가 되어 그 목록의 1위까지 가치가 올라간다는 것이다. AI 시대를 위해 만들어진 전국 단위 Kaiser를 생각하면 된다. 거기까지 가려면 Devoted가 꽤 많이 성장해야 한다는 말로는 부족하고, 2027년에 Devoted가 가속 페달을 밟는 모습을 보게 될 듯하다.\n\n2분기 실적 시즌에 Alignment Health의 CEO는 2027년에 소규모 보험사 몇 곳이 튀어나와 의미 있는 시장 점유율을 가져가려 시도할 것이라고 전망했다. Devoted가 그런 보험사 중 하나가 되려 한다는 꽤 좋은 신호로 보이지 않는가? 나는 Devoted의 MA 북이 수익성 측면에서 현재 계획보다 의미 있게 앞서 있어 이런 성장 전략에 자신감을 주고 있으리라 짐작하는데, 근거는 두 가지다.\n\n- Medicare Advantage의 2026년 실적은 전반적으로 기대를 웃돌았고, 지불자들이 일제히 가이던스를 상회하고 상향했다. 업계가 트렌드를 어느 정도 손에 쥔 것으로 보인다.\n- Devoted는 2026년에 C-SNP 상품으로 크게 무게를 옮겼는데, D-SNP와 함께 C-SNP는 MA 시장에서 특히 수익성이 좋은 구간으로 보인다.\n\n케어 딜리버리에 쏟는 투자 수준을 감안하면 Devoted가 전사 차원에서 흑자라고 보기는 여전히 어렵지만, 투자자들은 2026년 반환점에서 계획 대비 현재 위치에 상당히 만족하고 있을 것이고, 2027년에 성장과 수익성의 트레이드오프를 잘 헤쳐 나갈 수 있다고 자신하고 있으리라 짐작한다. 어떤 의미에서 이건 사모 시장에서 성장하는 사업에게 일어난 비트 앤드 레이즈 상황처럼 느껴진다.\n\n이 모든 것이 2027년에 Devoted가 다시 매우 빠르게 성장할 태세를 갖춘 그림을 만든다. 특히 기존 사업자들이 수익성을 우선하는 더 신중한 자세를 이어가는 가운데 그렇다. 이미 Humana와 Centene 모두 가입자를 줄이겠다고 밝혔다. 우리는 이런 서사가 전에도 펼쳐지는 것을 봤고, 점유율을 빠르게 낚아채려 한 보험사들에게 대체로 좋게 끝나지 않았다. Devoted 자신도 2025년에 신규 가입자의 적자 때문에 고전했다. 그런데 2026년은 과거와 다르게 흘러간 듯하고, 특히 Humana는 새 가입자 유입을 소화하면서도 전체 사업을 흔들지 않으며 모두의 예상을 뒤집었다.\n\n흥미로운 질문은 결국 2026년의 성공을 신기루로 돌아보게 될지, 아니면 v28 이후 Medicare Advantage 시장의 새로운 길로 보게 될지다. 자본이 관리의료로 다시 돌아오면서 분위기가 좋은 것은 분명하지만, 헬스케어 부담 가능성에 대한 더 넓은 논의를 생각하면 지금의 초과 성과가 얼마나 지속 가능한지 궁금해지지 않을 수 없다.\n\n이 모든 것을 쓰다 보니 생각은 CMS와 올해 초의 Advanced Notice / Final Notice 소동으로 돌아간다. 업계는 2026년 초 Advanced Notice가 촉발한 짧은 위기를 빠르게 지나쳐 온 듯하다. 당시 Chris Klomp는 업계에 세금의 더 나은 청지기가 되라고 호소하면서 업계에 대한 지급을 낮추는 안을 내놓았다. 내 기억으로 업계는 Advanced Notice 요율이 재앙적이었을 것이고, Final Notice는 낫지만 여전히 부담이라고 말했다. 내가 Klomp의 입장이고 MA 보험사들이 지금 곳곳에서 가이던스를 상회·상향하는 것을 본다면, 2026년을 내가 생각했던 것보다 더 깊이 깎을 수 있다는 증거로 삼아 2027년을 두고 그 대화를 반드시 다시 꺼낼 것이다. 좋은 예를 찾으려면 Devoted만 봐도 된다. 불과 몇 달 전 Devoted의 CEO는 CMS에 업계에 돈을 덜 주라고 공개적으로 요구했다. CMS 입장에서 바로 그렇게 할 절호의 기회 아닌가?\n\n전체적으로 Devoted가 기존 사업자들이 주목해야 할 관리의료 산업의 흥미로운 변혁 이론을 제시한다고 생각하지만, 여기서의 밸류에이션은 내가 이해하기 어려운 방식으로 현실과 동떨어져 보인다. 투자자들은 Devoted를 평균에서 표준편차 3에서 6 사이에 있는 결과에 맞춰 가격 매기고 있는 것으로 보이는데, 요즘 사모 시장 성장 자본의 속성이 그런 듯하다. 내가 Devoted의 경영진이라면 시장이 뜨거울 때 이 기회를 활용해 실탄을 쌓아 둘 것이다. 그리고 직원들에게는 밸류에이션을 둘러싼 소음에 신경 쓰지 말라고 말할 텐데, 보상의 상당 부분이 Devoted의 기업가치 성장에 묶여 있을 것을 생각하면 설득하기 어려운 이야기이긴 하다.\n\n이번 자금조달 소식에 대해 너드들이 어떻게 생각하는지 궁금하다. 여기에 투자할 기회가 있다면 하겠는가? 그 이유도 듣고 싶다.\n\n이 라운드에 참여할 수 있다면, 오늘 250억 달러 가치의 Devoted에 당신의 돈을 넣겠는가?\n\n예, 전 재산을 걸겠다\n\n예, 분산된 포트폴리오에서 적당한 금액을 투자하겠다\n\n아니오, 나는 다른 곳에 투자하겠다\n\n금요일 늦게 나온 Devoted 소식 외에도, 각 조직이 미래를 대비해 성장과 수익성에 대해 서로 다른 입장을 잡아 가는 가운데 2027년 MA 시장의 찻잎으로 읽을 만한 흥미로운 신호가 여럿 있었다.\n\n- Centene은 지난주 브로커들에게 현재 34만 명 이상이 가입한 플랜에서 158개 이상의 카운티에 걸쳐 철수하겠다고 공유한 것으로 전해진다. 여기에는 Oklahoma, Tennessee, Hawaii 전역이 포함된다.\n- SCAN은 Costco와의 파트너십을 확대해, Medicare 가입자가 합쳐서 500만 명인 비공개 세 개 시장에서 공동 브랜드 MA 플랜을 출시한다고 발표했다."},{"heading_en":"Company Spotlight","body":"Virta Health가 자사 임상 모델의 규모를 공개하다: 런레이트 매출 2억 달러 + EBITDA 흑자\n\n출처: Virta Health의 HTN 컴퍼니 프레젠테이션\n\n화요일에 Virta Health의 사장 Amit Shah가 HTN에 현재 사업 상황을 업데이트해 주었다. 나는 늘 Virta의 서사가 흥미롭다고 생각한다. 영양을 통해 심장대사 문제의 근본 원인을 다루는 것을 목표로 하고, 그들이 보여 주는 임상 결과는 정말 인상적이다(참고로 저 링크들은 전부 다른 자료다). GLP-1이 심장대사 건강에 대한 인식을 높인 것은 분명하고, 이는 처방을 넘어 더 넓은 심장대사 지원을 제공하는 이런 모델에 기회를 만들어 주고 있다.\n\n앞으로 몇 년간 계속 확장해 나갈 회사로 지켜볼 만하다. Shah는 Virta가 사업을 100배로 키울 기회가 있다고 말했다. 대상이 되는 커버드 라이브를 50배(300만 명에서 1억 5,000만 명으로) 늘리는 동시에 고객당 수익률을 지금의 2배로 높인다는 것이다. 이는 앞으로의 경로를 보여 주는 듯한데, 고용주를 위한 디지털 헬스 솔루션이 되려는 Teladoc식 길을 가기보다 현재 모델을 고객 유형 전반으로 더 깊이 파고드는(즉 고용주 세그먼트를 넘어 확장하는) 방향이다. 어떤 면에서는 더 어려운 길처럼 보이지만, 그 길을 헤쳐 나갈 수 있는 사업에게는 더 오래 가는 사업적(그리고 사회적) 가치를 주는 길이기도 하다."},{"heading_en":"Upcoming Company Presentations","body":"다가오는 컴퍼니 프레젠테이션:\n\n- 8월 25일 화요일 오후 4시 ET\n  여성 건강에서 기업과 소비자를 잇다: Wildflower Health 컴퍼니 프레젠테이션, CEO 겸 창업자 Leah Sparks와 함께\n  여기서 신청하세요.\n\n- 8월 26일 수요일 오후 4시 ET\n  전국 사업자들이 후퇴하는 사이 MA 가입자를 50% 늘리다: Clever Care Health Plan 컴퍼니 프레젠테이션, CEO Karen Walker Johnson과 함께\n  여기서 신청하세요.\n\n- 8월 27일 목요일 오후 1시 ET\n  아웃오브네트워크 가격 책정을 소프트웨어 문제로 바꾸다: Daffodil Health 컴퍼니 프레젠테이션과 Q&A, 공동창업자 겸 CEO Navin Nagiah와 함께\n  여기서 신청하세요."},{"heading_en":"Chart of the Week","body":"고용주 비용 트렌드 상승의 북소리는 계속된다\n\n목요일에 Aon이 고용주 시장의 비용 트렌드 상승에 관한 데이터를 공개했고, WSJ 같은 매체에서 전국적인 주목을 받으며 아래 차트 등이 조명됐다.\n\n출처: WSJ\n\n이 뉴스레터를 꾸준히 읽는 독자들에게 새로운 데이터는 아니다. 우리는 2027년 비용 트렌드가 한 자릿수 후반에서 두 자릿수 초반이 될 것이라고 한동안 이야기해 왔다. 그럼에도 중간선거 시즌과 부담 가능성을 둘러싼 더 넓은 전국적 논의를 앞두고 이 문제가 전국적 주목을 받고 있다는 점은 흥미롭다."},{"heading_en":"Other Top Headlines","body":"Hims의 CEO Andrew Dudum이 이번 주 CNBC의 Andrew Ross Sorkin과 헬스케어의 미래에 관한 여러 주제로 인터뷰를 했다. 이번 주 Slack에서도 공유했듯, 나는 Hims가 헬스케어를 어떻게 바꾸겠다는 것인지에 대한 Dudum의 비전에 극도로 회의적인 상태로 인터뷰를 마쳤다. Dudum은 인터뷰의 첫 몇 분을, 유럽에서 10달러에 만든 Whoop과 Oura 모조품이나 블루투스가 달린 약통 같은 것에서 나오는 데이터를 자사 AI 코치가 활용해 헬스케어 경험을 개인화할 것이라는 설명에 썼다. 이 서사가 Hims의 개인 투자자 커뮤니티를 흥분시킨 것으로 보이지만, 2026년에 Dudum이 앞으로 12개월간 추진할 개념으로 약통을 이야기하는 것을 듣는 건 다소 충격적이다. 그것이 근 20년 가까이 시도돼 온 타르 웅덩이 같은 아이디어라는 사실을 모르는 듯하다. 헬스케어 산업이 하지 못했거나 하려 하지 않았던 방식으로 소비자 니즈를 기회주의적으로 충족시키는 데 놀랍도록 기민했던 회사치고, 여기서의 서사는 Hims가 그 소비자 정서를 얻어낸 이유와 놀라울 만큼 동떨어져 있다. 지금 Hims 고객 중에 Hims 브랜드의 블루투스 약통이나 10달러짜리 유럽산 Whoop 모조품을 사고 싶다는 피드백을 준 사람이 몇 명이나 될 것 같은가? 나는 0명이라고 본다. 소비자들이 다른 곳에서 더 싸게 살 수 있는 약을 굳이 Hims에 멤버십 비용을 내면서 사는 것과 정확히 같은 이유다. 소비자는 브랜드화된 소비자 경험에 더 많은 돈을 낸다. 이것이 말 그대로 Hims라는 사업이 존재하는 이유다! 그런데 Dudum이 인터뷰에서 말하는 내용을 보면, 그런 수순은 소비자 데이터를 둘러싼 해자를 쌓으려 할 때 두는 수처럼 보인다.\n\n이 인터뷰의 앞부분을 들으며 나는 Billy Madison에서 Adam Sandler를 나무라던 교장 선생님이 된 기분이었지만, 그럼에도 Hims는 지금 대단히 강력한 사회적 순풍을 등에 업고 있고, 그 점은 이 모델을 낙관할 만한 이유로 여전히 유효하다. 내가 보기에 그 순풍은 1. '지불자로서의 환자', 그리고 개인에게 HSA / FSA 예산을 주고 원하는 대로 쓰게 하자는 흐름에 대한 지지 확대(인터뷰에서 Dudum이 제대로 짚은 부분), 2. 모든 것에 대한 소비자 불신의 증가와, 그에 상응하는 정서, 즉 공급자는 소비자가 원하는 약에 접근하지 못하게 막는 중간상이라는 인식이다. 참고로 나는 이 순풍들이 반드시 좋은 것이라고 생각하지 않지만, 실재하는 흐름이라고는 생각하고, Hims는 거의 스스로에도 불구하고 그것을 활용하기에 좋은 위치에 있다."},{"heading_en":"Other Top Headlines","body":"Hims에 대해 그 모든 이야기를 쓰고 있던 중, 금요일 늦게 Bloomberg는 Hims가 높은 고객 불만 접수율 때문에 Visa의 Acquirer Monitoring Program에 등록됐다고 보도했다. 이는 올여름 Hims의 체중 감량 구독 모델 청구 방식을 두고 소비자 불만이 급증한 데 뒤이은 것이다. Hims는 첫 달에 39달러의 멤버십 비용을 받고(브랜드 GLP-1 약값은 제외) 이후에는 149달러로 올리는 것으로 보이는데, 마치 Hims가 소비자를 위한 예상치 못한 의료비 청구서를 제1원리에서 다시 생각해 낸 것 같다. Stripe가 Hims에 이 문제를 통보했고, Hims는 프로그램에서 빠지려면 분쟁률을 3개월 연속으로 거래의 1.5% 아래로 낮춰야 한다. 분쟁 한 건마다 8달러가 들어 9월에는 약 7만 5,000달러의 벌금이 되는데, 이는 Hims의 전체 손익에 비하면 푼돈이다. 더 큰 문제는, Hims가 대외적으로는 소비자가 신뢰하고 선택하는 공급자가 되겠다는 서사를 말하고 있지만, 이 사건과 최근의 기만적 마케팅 관행에 대한 FTC 소송이 Hims가 무엇인지(혹은 무엇이 아닌지)에 대한 다른 실체를 가리키는 것으로 보인다는 점이다."},{"heading_en":"Other Top Headlines","body":"Summa Health와 General Catalyst는 Summa Health의 운영을 고전하는 지역 공급자에서 최고 수준의 기술을 활용한 미래의 선도 공급자로 바꿔 놓을 '기술 전환 스택'을 발표했다. Summa의 스택은 General Catalyst 포트폴리오 회사 아홉 곳으로 구성된다. Aidoc, Clarium, Commure, Fabric, Hippocratic AI, Judi Health, Transcarent, Verse Medical, Percepta다. Percepta는 이 작업을 총괄하는 전환 파트너 역할을 맡는다고 한다. 나 자신이 헬스 시스템에서 이노베이션 업무를 해 본 사람으로서, 양쪽 현장이 얼마나 악몽 같을지 상상만 할 수 있을 뿐이다. 전환 과정에서 자기 역할이 무엇인지 파악하려 애쓰는 Summa의 기존 직원들에게도, 그리고 상당수는 진심으로 돕고자 할 것이라 짐작되는 GC 포트폴리오 회사들이 한꺼번에 이 시스템에 몰려드는 상황에서도 그렇다. 이 아홉 곳이 어떻게 선정됐고 Summa 직원들에게 어떻게 설명됐는지 그 이야기를 정말 듣고 싶다. 헬스 시스템에서 이노베이션을 하던 시절 내가 얻은 가장 큰 교훈 중 하나는, 시스템 리더들이 대체로 시장의 스타트업과 선호 파트너에 대해 감을 잘 잡고 있다는 점이었다. 다만 시스템 자체에 발목이 잡히는 경우가 많았을 뿐이다. Summa에게 최선의 솔루션인지와 무관하게 GC 포트폴리오라는 이유로 선정된 것으로 보이는 새 파트너 아홉 곳을 위에서 덮어씌우는 방식은 역효과가 날 것이 거의 확실해 보인다.\n\n이는 오늘날 이 나라의 케어 딜리버리에서 가장 흥미로운 이노베이션 실험 중 하나로 남아 있다. 다만 파트너십의 초기 성과는 회의를 품을 만한 이유를 주는 듯한데, 눈앞에 놓인 기회를 생각하면 안타까운 일이다. 시스템 전체의 전환이 정말 목표라면, GC와 Summa 쪽 사람들이 Summa의 운영에 급진적 투명성을 도입하는 것을 고려해 보라고 제안하고 싶다. 그래야 산업 전체가 지금 Summa에서 진행 중인 모든 작업에서 배울 수 있다. 통상적인 재무 공시를 넘어 Summa의 손익이 어떻게 돌아가는지 공유하라. 이 전환 스택의 세부 내용과 그것이 임상적으로, 재무적으로 Summa와 스택 자체에 어떤 영향을 미치는지 공유하라. 여기 있는 여러 GC 회사들 사이의 계열사 간 거래는 어떤 모습인가? 다른 벤더가 아니라 이들이 어떻게, 왜 선정됐는지 공유하라. 현장에 있는 Summa 직원들의 경험을 공유하라. 나라면 기꺼이 Akron까지 내려가 Summa와 GC 직원들을 인터뷰하고 그곳에서 무슨 일이 벌어지는지 업계와 나누겠다. RFK는 이미 초대를 받았는데, 다른 사람들에게도 확대하지 못할 이유가 있는가? 산업의 전환이 실제로 목표라면, 더 많은 투명성은 반드시 필요한 요소로 보인다."},{"heading_en":"Other Top Headlines","body":"R1 RCM이 사전승인 플랫폼 Humata를 조건 비공개로 인수했다. Humata는 Olive AI가 사업을 접은 뒤 그 자산을 되사들이며 2023년에 시작됐다. Olive는 원래 2021년에 Verata Health를 1억 2,000만 달러에 인수하면서 Humata 자산을 확보했다.\n\n우리는 최근 팟캐스트에 Humata의 창업자 겸 CEO Jeremy Friese(Verata에서도 같은 자리에 있었다)를 모시고 사전승인 절차와 WISeR 프로그램에 대해 이야기를 나눴다. Humata는 Oklahoma 주에서 참여 벤더로 활동하고 있다. AI가 사전승인 절차의 마찰 지점을 어디서 해결할 수 있는지, 투명성은 왜 필요한지, 그리고 어디서는 여전히 사람이 문제를 정리해야 하는지를 들여다보는 흥미로운 렌즈다."},{"heading_en":"Other Top Headlines","body":"Ascension은 이번 주 후반, Nashville의 자사 병원 한 곳에서 발생한 약물 혼동으로 정기 관절 치환 수술 중 마취제 대신 인산칼륨이 주입되어 환자 한 명이 마비되고 세 명이 상해를 입었다고 인정했다. 이런 이야기가 현재 진행형인데도 우리가 집단적으로 의료에서 AI가 미래에 미칠 영향을 걱정하는 데 그토록 많은 에너지를 쓴다는 사실이 가끔 놀랍다. 병원은 복잡한 환경이고 실수는 인간적인 일이지만, 2026년에 이 이야기는 충분히 피할 수 있었던 일로 보인다."},{"heading_en":"Other Top Headlines","body":"의료기관의 다양한 프론트오피스 환자 응대 업무를 돕는 에이전틱 AI 플랫폼 Weave가 Francisco Partners에 약 6억 5,000만 달러에 인수되며 비상장 전환된다."},{"heading_en":"Funding Announcements","body":"복합 질환을 가진 Medicaid·Medicare 인구를 위한 가치 기반 케어 모델 Cityblock이 1억 1,600만 달러를 조달하고 Homeward Health를 전액 주식 거래로 인수한다고 발표했다. General Catalyst가 이번 라운드를 주도했다. 나는 소식이 공개된 뒤 목요일에 Cityblock의 공동창업자 겸 CEO Toyin Ajayi와 이야기를 나눴고, 그는 현재 사업 상황과 앞으로의 궤적에 대해 훌륭한 관점을 들려주었다. Cityblock이 이번 발표를 사업의 새 장을 여는 출발점으로 보고 있다는 인상을 분명히 받았다. VBC 시장의 역풍을 헤쳐 나가면서 지난 몇 년간 갖추는 데 집중해 온 운영 플랫폼을 확장하는 것이다. 그 역풍은 이 사업에게 순풍으로 바뀌고 있는 것으로 보이며, 이제 복합 질환 인구에게 고가치 케어(즉 고품질·저비용 케어)를 제공하려는 주정부, CMS, 지불자에게 AI 기반 파트너가 되는 새로운 성장 국면에 들어선다. Ajayi는 Cityblock이 앞으로 유기적 성장과 비유기적 성장을 함께 추구할 것이며, 비유기적 성장의 우선순위는 중증 정신질환, 물질사용장애, 특수 요구 인구 등 다른 복합 인구로 확장하는 것과 그 인구를 지원하는 역량에 맞춰져 있다고 말했다. Cityblock은 이제 플랫폼 플레이가 될 만한 규모에 도달하면서 이 시장에서 자산을 사들이는 인수자가 되기에 좋은 위치에 있는 것으로 보이는데, 그것이 맞다면 이 시장 전반의 스타트업들에게 좋은 소식으로 보인다."},{"heading_en":"Funding Announcements","body":"지적·발달장애(I/DD) 인구를 위한 관리의료 모델 Deon Health가 AmeriHealth Caritas로부터 새로운 전략적 투자 라운드를 유치했다고 발표했다. Deon은 지역 공급자들과의 조인트벤처를 통해 직접지원 전문인력(DSP)을 지원하는 흥미로운 모델을 만들고 있다. 나는 Deon의 CEO Sara Ratner와 그 접근법에 대해 이야기를 나눌 기회가 있었다(녹화본은 곧 HTN 멤버들에게 공개된다). 그는 I/DD 인구의 구체적인 특성에 대해 훌륭한 렌즈를 제공해 주었는데, 이 인구는 비용이 가장 높은 환자군 중 하나이면서도 역사적으로 주정부의 관리의료 노력에서 대체로 제외돼 왔다. Sara가 말했듯, 이 인구를 관리의료 모델로 옮기면 Medicaid 전반의 부정수급 우려를 어느 정도 해소하는 동시에 이 인구의 독특한 의료 수요를 더 잘 지원할 수 있고, 응급실에 오는 빈도가 줄면서 그에 상응하는 비용 절감도 따라온다. Sara는 요로감염에서 비롯된 패혈증이 이 인구의 주요 사망 원인 중 하나라고 전했다. 많은 이들이 말을 하지 못해 문제를 전달할 수 없기 때문인데, 2026년 미국에서 충분히 풀 수 있는 문제로 보인다."},{"heading_en":"Funding Announcements","body":"농촌 지역 1차 진료 이네이블러 Hopscotch Health가 5,300만 달러를 조달했다. 8VC와 Town Hall Ventures가 라운드를 주도했다. Hopscotch는 현재 주로 North Carolina 서부에서 1만 5,000명의 환자를 진료한다. 이번 주 세 건의 라운드를 보면, 지금 농촌과 복합 질환 시장에 모멘텀이 있다는 것을 분명히 느낄 수 있다."},{"heading_en":"What I'm Reading","body":"이번 주 인터넷은 Zeke Emanuel, Abe Baker-Butler, Neal Khosla, Vinod Khosla가 AI가 임상의를 능가할 것이라고 주장하는 관점을 JAMA Viewpoint에 공동 게재하면서 떠들썩했다. 정작 글 자체는 그것이 불러일으킨 반응에 비하면 꽤 온건해 보였다. 이 주제에 관한 최근 연구를 정리한 뒤, AI 단독이 의사와 AI의 하이브리드를 능가할 것이며 2030년이면 실제 워크플로에 투입될 수 있을 것이라고 제안하는 내용이었다. 이 글은 예상 가능한 반발을 낳았고, 소셜미디어의 전문가들이 여러 근거를 들어 초지능으로부터 의사를 방어했다(연구가 결함투성이다, 의학은 예술이자 과학이다, AI는 사람에게 손을 얹을 수 없다 등등).\n\n지금 소셜미디어를 휩쓰는 이 글에 대한 반박들이 얼마나 쓸모 있는지 나는 개인적으로 고개를 갸웃하게 된다. 알고리즘에 영합해 분노를 수확하도록 설계된 것처럼 보인다. 무슨 뜻이냐면, 작년 말 Vinod Khosla는 Eric Larsen과 함께한 팟캐스트에서 이번에 나올 이 글에 대해 이야기했다(약 18분 지점). 그 인터뷰에서 Khosla의 입장을 들어 보면, 그는 의사가 자신을 대신해 일종의 레지던트 역할을 하는 AI 에이전트 팀을 관리하면서 의사의 도달 범위를 넓히는 세계를 그린다(참고로 그 새로운 세계에서 의사는 재정적으로 오히려 더 낫다). 이 팀이 이 관점 글을 쓰는 데 걸린 8개월 남짓 동안 Khosla가 그 입장에서 크게 멀어졌을 것 같지는 않다. 그렇다면 그것은 AI가 자율적으로 행동하는 사례인가, 아니면 임상의가 루프 안에 있는 사례인가? Khosla의 서사는 아주 구체적인 용도에 대해 FDA 승인을 받은 AI 에이전트라는 아이디어와 맞닿아 보이고, 우리는 이미 그 초기 신호를 보고 있다. Cleveland Clinic이 FDA 승인을 받은 AI 에이전트를 환자에게 처방한다면, 그것은 자율 AI의 사례인가, 아니면 사람이 루프에 있는 사례인가? 디지털 치료제가 지난 10년 넘게 약속해 온 것의 다음 반복과 그렇게 다른가? 나는 아니라고 생각하며(위 사례를 보면 FDA 510k 절차도 그렇게 보지 않는 듯하다), 바로 그 지점에서 지금의 논쟁이 나에게는 사실상 무의미해진다.\n\n오히려 'AI가 의사를 대체할 것인가'라는 서사는, 반드시 이뤄져야 할 훨씬 더 결이 섬세한 대화에서 주의를 돌리는 미끼처럼 점점 더 느껴진다. 또한 각자가 자기 이익 풀을 지키려는 태도를 넘어설 수 있다면 실제로는 합의점이 훨씬 더 많을 대화이기도 하다. 예를 들어 나는 Mark Cuban의 비판을 읽었는데, 그는 사실 Khosla, Emanuel 등의 입장에 대체로 동의하고 있다고 생각한다. 물론 이 변화가 어떻게 일어나는지, 미래에 사람과 AI의 역할은 무엇인지에 대해 중요한 대화가 남아 있다. 그리고 임상의학에서 AI를 어떻게 펼칠 것인가의 구체적인 지점에서는 불가피하게 이견이 생길 것이다. 하지만 그 확산 자체는 불가피해 보이고, 그렇다면 이 논쟁에서 사람들을 양극단으로 몰아붙이는 일은 역효과로 보인다. 앞으로 수십 년간 케어 딜리버리의 핵심 조직 원리 중 하나가 될 법한 문제를 함께 정리해 나가는 마당에는, 모여서 이 대화의 미묘한 지점들을 생산적으로 논의하는 편이 더 유용해 보인다."}]}},"companies":{"doctronic":{"slug":"doctronic","name":"Doctronic","one_liner":"증상을 적으면 AI가 무료로 진단과 치료 계획을 내주고, 처방전이 필요해지는 순간에만 39달러짜리 면허 의사 화상 진료를 파는 소비자용 서비스다.","site":"https://www.doctronic.ai","sells_to":"mixed","seen_in":[{"issue":"26","section":15,"headline":"AI가 진료 상담을 맡는 서비스가 12개월도 안 되어 세 번째 라운드로 4,000만 달러를 받았고, 필자는 공개 수치를 역산해 주간 방문자 30만 명 가운데 2%도 유료 진료로 넘어가지 않는다고 짚었다."}],"card":{"problem":"미국에서는 보험이 없거나 있어도 비용 때문에 진료를 미루는 사람이 많아서, 지금 겪는 증상이 병원에 갈 일인지 판단하는 단계부터 돈이 든다.","solution":"가입도 로그인도 없이 익명으로 증상을 물어보는 무료 AI 상담을 열어 두고 상담마다 진료 기록 형식의 문서를 만들어 주며, 처방전이나 검사 의뢰처럼 사람 의사가 필요해지는 순간에만 화상 진료를 유료로 판다.","price":"AI 상담은 횟수 제한 없이 무료이고, 면허 의사 화상 진료는 구독 없이 1회 39달러다. 보험이 있으면 본인부담금만 낸다.","tags":["AI 상담","원격진료","현금 결제","익명 이용","고용주 판매"],"headline_traction":"2026년 3월에 시리즈 B로 4,000만 달러를 받았다. 12개월이 안 되는 기간에 세 번째 라운드이며 누적 조달액은 6,500만 달러가 넘는다.","watch":"매출 15배 성장과 주간 방문자 30만 명 같은 성장 수치는 전부 회사가 스스로 낸 것이고 제삼자가 확인한 것이 아니다."},"problem":"한국은 전국민 건강보험이 있어서 아프면 동네 의원에 가면 되고 진료비 본인부담금도 몇천 원 수준이다. 미국은 그렇지 않다. KFF 집계에 따르면 2024년 기준으로 65세 미만 인구 가운데 2,670만 명, 비율로는 9.8%가 건강보험이 없다. 무보험 성인의 38.6%는 비용 때문에 필요한 진료나 약을 미루거나 아예 받지 못했다고 답했고, 민간보험이 있는 성인도 17.0%가 같은 답을 했다. 그래서 미국 소비자에게는 진료를 받는 일 자체보다 앞서, 지금 겪는 증상이 병원에 갈 일인지 판단하는 단계부터가 돈이 드는 문제가 되며, 그 판단을 공짜로 대신해 주는 창구에 수요가 생긴다.","solution":"사용자는 첫 화면 가운데에 있는 입력창에 증상을 적고 대화를 시작한다. 가입도 로그인도 필요 없고 익명으로 쓸 수 있으며, AI 상담 자체는 횟수 제한 없이 무료다. AI는 동료 심사를 거친 논문과 진료 지침을 근거로 가능한 진단 목록과 치료 선택지를 제시하고, 상담마다 SOAP 노트라는 진료 기록 형식의 문서를 만들어 준다. 회사는 이 문서를 다른 병원에 그대로 가져가서 쓰라고 안내한다. 처방전이나 검사 의뢰, 진단서가 필요해지는 순간에만 실제 면허 의사와의 화상 진료로 넘어가는데, 값은 1회 39달러이고 구독이 아니며 보험이 있으면 본인부담금만 낸다. 진료를 맡는 의사들은 본사와 분리된 별도 법인인 Doctronic Physicians Group 소속이고, 회사는 50개 주 전체에서 진료가 가능하다고 밝히고 있다.","features":[{"name":"무료 AI 상담","detail":"가입과 로그인 없이 익명으로 증상을 물어볼 수 있고 횟수 제한이 없다. 회사는 값 안내 페이지에서 이 부분을 영원히 0달러라고 표기한다."},{"name":"무료 SOAP 노트","detail":"상담이 끝날 때마다 진단과 치료 계획이 담긴 진료 기록 형식의 문서를 만들어 준다. 회사는 이 문서를 자기가 다니던 병원에 가져가면 진료가 더 빨라진다고 안내한다."},{"name":"39달러 원격진료","detail":"면허 의사와의 화상 진료 1회 값이다. 처방전 발급, 검사 의뢰와 결과 해석, 전문의 의뢰, 진단서 발급이 이 값에 포함되며 별도로 더 받지 않는다고 적혀 있다."},{"name":"유타주 AI 처방 갱신","detail":"이미 다른 의사가 처방한 약 191개 품목에 한해 AI가 30일, 60일, 90일 단위 갱신을 처리한다. 규제 약물과 ADHD 약, 주사제는 대상에서 빠진다."},{"name":"GLP-1 처방 관리 구독","detail":"비만 치료제 처방을 매달 써 주고 필요할 때 의사 화상 진료와 영양사 상담을 붙여 주는 상품이다. 월 99달러와 199달러 두 가지가 있고 약값은 포함되지 않는다."},{"name":"Checkup 컨시어지","detail":"연 1회 건강검진 상품이다. 기본 혈액검사와 흔히 쓰는 약의 재처방이 포함되고, 1만 곳이 넘는 의료기관에서 의무기록을 모아 준다고 밝히고 있다."},{"name":"검색 유입용 건강 정보 페이지","detail":"질환, 증상, 약, 검사, 비교 글로 사이트를 채워 검색에서 사람을 끌어들인다. 사이트맵을 직접 세어 보면 2만 4천 개가 넘고 그 가운데 블로그 글만 1만 2천 개가 넘는다."},{"name":"기업과 보험사 대상 판매","detail":"고용주, 제3자 관리기관, 보험사, 병원을 상대로 직원 한 사람당 월정액을 받는 별도 판매선이 있다. 관련 소개 페이지가 사이트에 스무 개 넘게 있다."}],"differentiator":"K Health은 같은 발상에서 출발했지만 지금은 Mass General Brigham, Mayo Clinic, Cedars-Sinai 같은 병원을 통해 파는 쪽으로 방향을 틀어서, 환자는 이 서비스를 병원 이름으로 만난다. Ada Health와 Buoy Health는 증상을 확인해 주는 데까지만 하고 실제 진료는 다른 곳으로 넘기기 때문에, 무료 상담과 유료 진료를 한 회사 안에서 잇지 못한다. Doctronic은 무료 AI 상담과 자체 의사망을 한 회사 안에 붙여 두고 39달러라는 현금가를 공개 웹에 그대로 걸어 둔 점이 다르지만, 여기까지는 결합 방식의 차이일 뿐이다. 진짜로 다른 한 가지는 유타주와 맺은 규제 완화 협약인데, 사람 의사를 거치지 않고 AI가 처방을 갱신하도록 주 정부가 승인한 첫 사례이며 위에 든 회사 가운데 이것을 가진 곳은 없다.","team":[{"name":"Matt Pavelle","role":"공동 창업자 겸 Co-CEO","background":"패션 이커머스 회사 Moda Operandi의 창립 CTO를 지냈고 렌트 리워드 스타트업 Piñata Rent를 공동 창업했다."},{"name":"Adam Oskowitz","role":"공동 창업자","background":"UCSF 혈관외과 조교수로 지금도 진료하는 외과 의사다."},{"name":"Byron Crowe","role":"최고의료책임자","background":"Solera Health 최고의료책임자와 하버드 의과대학 교원을 지낸 내과 전문의이며 2025년 10월에 합류했다."}],"traction":[{"type":"funding","detail":"Union Square Ventures가 주도한 시드로 500만 달러를 받았다.","when":"2025","source":"Sacra와 Fundz의 회사 정보. 1차 보도자료를 찾지 못해 정확한 발표일은 확인하지 못했다."},{"type":"funding","detail":"Lightspeed Venture Partners가 주도한 시리즈 A로 2,000만 달러를 받았다. Union Square Ventures, Tusk Ventures, HF0가 참여했고 Fei-Fei Li가 엔젤로 들어왔다.","when":"2025-09","source":"PR Newswire 보도자료, Lightspeed 투자 소개글"},{"type":"funding","detail":"Abstract와 Lightspeed가 공동 주도한 시리즈 B로 4,000만 달러를 받았다. 12개월이 안 되는 기간에 세 번째 라운드이며 누적 조달액은 6,500만 달러가 넘는다.","when":"2026-03","source":"Business Wire 보도자료, STAT News"},{"type":"regulatory","detail":"유타주 상무부 인공지능정책국과 규제 완화 협약을 맺어, 이미 다른 의사가 처방한 약 191개 품목에 한해 AI가 처방 갱신을 처리하는 12개월 파일럿을 시작했다. 협약 조건으로 갱신 문서에 이름이 들어가는 면허 의사를 두어야 하고 AI 위험을 포함한 의료과실보험을 유지해야 한다.","when":"2026-01","source":"유타주 상무부 보도자료, Fierce Healthcare, Deseret News"},{"type":"regulatory","detail":"유타주 의료면허위원회 위원 14명 가운데 11명이 이 파일럿을 즉시 중단하라는 서한을 보냈으나 주 상무부가 요청을 기각했고 파일럿은 계속되고 있다.","when":"2026-04","source":"KUER, Utah News Dispatch"},{"type":"revenue","detail":"시리즈 A를 마감한 뒤 6개월 안에 매출이 15배 늘어 연환산으로 8자리, 즉 1,000만 달러 이상이 되었다고 밝혔다.","when":"2026-03","source":"회사 보도자료(Business Wire). 제삼자가 확인한 수치가 아니다."},{"type":"traffic","detail":"주간 순방문자가 30만 명이 넘는다고 밝혔다.","when":"2026-03","source":"회사 보도자료(Business Wire). 제삼자가 확인한 수치가 아니다."},{"type":"traffic","detail":"사이트맵을 직접 세어 보면 검색 유입용 건강 정보 페이지가 2만 4천 개가 넘는다. 방문자 대부분이 진료를 사러 온 것이 아니라 검색으로 들어온 사람이라는 뜻이다.","when":"2026-09","source":"https://www.doctronic.ai/sitemap.xml 의 하위 사이트맵 19개를 직접 집계"},{"type":"partnership","detail":"병원, 제3자 관리기관, 자가보험 고용주와 공동 브랜드 제휴를 맺고 있다고 밝혔다.","when":"2026-03","source":"회사 보도자료를 옮긴 The AI Insider 기사. 제휴처 이름은 공개되지 않았다."}],"caveats":"성장 수치는 전부 회사가 낸 것이고 제삼자가 확인한 것이 아니다. 15배 성장, 주간 방문자 30만 명, 연환산 매출 1,000만 달러가 모두 여기에 해당한다. 뉴스레터 필자가 계산한 2% 미만이라는 전환율은 매출 전액이 39달러 진료에서 나온다고 가정한 역산인데, 실제로는 월 99달러와 199달러짜리 GLP-1 구독과 기업 대상 매출이 섞여 있으므로 진료 건수는 더 적고 전환율은 더 낮아질 가능성이 크다. 회사가 재방문 진료가 세 배 가까이 늘었다고 밝힌 점을 감안하면 월 21,000건이 21,000명을 뜻하지도 않는다. 회사가 내세우는 치료 계획 일치율 99.2%는 시리즈 A 발표 때 쓰던 수치가 그대로 다시 쓰인 것으로 보이며, 근거가 되는 연구는 회사 지분을 가진 사람들이 쓴 medRxiv 사전 공개 논문이고 대상도 기존 웹사이트 챗봇이다. 여기에 더해 펜실베이니아대학교의 Eric Bressman은 회사가 내놓은 검증 연구에서 원격진료 사례 500건을 놓고 AI와 사람 의사의 판단이 일치한 비율이 80%에 그쳤다고 지적했다. 99.2%와 80%가 모두 회사 쪽 자료에서 나온 수치이므로 어느 것을 인용하느냐에 따라 그림이 완전히 달라진다. 뉴스레터가 인용한 Endpoints News의 체험기는 기자가 물리치료사 의뢰를 받으려고 39달러 진료를 직접 써 본 기록인데, 경험이 일관되지 않았고 Matt Pavelle 대표도 개선이 필요하다는 점을 인정했다고 매체가 정리했다. 보안업체 Mindgard는 공개된 챗봇에 존재하지 않는 규제 공지를 만들어 넣어, 옥시콘틴 표준 용량의 세 배를 제시하게 만들었다고 발표했다. 회사와 유타주는 그것이 실제 환자 처방을 처리하는 운영 환경이 아니라고 반박했다. JAMA Health Forum은 유타주 협약이 회사에 환자 의무기록 보관과 제공 의무를 면제해 주고, 이용약관은 정확성과 그로 인한 피해에 대한 책임을 부인한다고 지적했다. 유타주 의료면허위원회 위원장 Alan Smith는 사망자가 나올 때까지 아무 조치도 취해지지 않을까 두렵다고 말했고, 미국의사협회도 처방 갱신이 단순히 확인만 하고 넘어갈 일이 아니라고 논평했다. Forbes는 2026년 7월 기사에서 처방 결정의 72%를 AI가 스스로 처리했고 그 가운데 3%는 나중에 사람 의사가 뒤집었다고 전했는데, 본문을 직접 확인하지 못해 참고로만 둔다. 앱스토어 설명 맨 끝과 회사 소개 페이지 하단에는 Doctronic이 AI 의사이지 면허 의사가 아니며 의료 행위를 하지 않고 의학적 조언을 제공하지 않는다는 문구가 붙어 있어, AI 의사라는 마케팅 표현과 어긋난다. 사이트 안에서도 표기가 갈린다. 진료비는 39달러와 40달러가 함께 쓰이고, 의사 연결 대기 시간은 30분 이내, 평균 15분, 평균 5분이 페이지마다 다르게 적혀 있다. 앱 평가 수가 매우 적어서(아이폰 23개, 구글 플레이 35개, 설치 1천 회 이상) 실제 사용은 앱이 아니라 웹에 몰려 있다고 보아야 한다.","for_us":"가장 눈여겨볼 대목은 낮은 전환율이 아니라 그 분모다. 주간 30만 명이 AI에게 건강을 물어보려고 찾아오는데 그 가운데 2%도 유료 진료로 넘어가지 않는다면, 무료로 물어볼 창구에 대한 수요가 진료 수요보다 훨씬 크다는 뜻이다. 우리는 진료를 팔 이유가 없으므로 이 수요가 그대로 앱을 열 이유가 된다. 설계에서 가져올 것이 세 가지 있다. 첫째, 가입도 로그인도 요구하지 않고 익명으로 바로 물어보게 한 진입 방식이다. 둘째, 상담 결과를 SOAP 노트라는 문서로 만들어 주고 그것을 자기가 다니던 병원에 가져가라고 안내하는 방식인데, 답변의 역할을 정보 제공과 기록 정리로 묶어 두면 진단이나 처방으로 읽히지 않게 하면서도 사용자에게 손에 잡히는 결과물을 남길 수 있다. 셋째, 면책 문구를 앱 설명과 서비스 안에 명시적으로 붙여 둔 방식이다. 증상과 검진 수치, 복용 중인 약에 대해 물어보는 상담 창구는 3개월 안에 소프트웨어만으로 붙일 수 있고, 우리 앱에는 이미 검진 수치와 식단 기록이 있으므로 물어볼 재료도 갖춰져 있다. 다만 트래픽 엔진인 검색 유입용 2만 페이지는 앱에서 그대로 따라 할 수 없는 부분이고, 유타주 규제 협약이나 50개 주 의사망은 3개월과 소프트웨어 인력이라는 조건 밖에 있으므로 제외한다.","screenshots":[{"file":"doctronic_home.png","caption":"첫 화면 가운데에 증상 입력창 하나만 놓여 있고, 그 아래에 무료이고 익명이며 의사들이 만들었다는 문구가 붙어 있다. 위쪽에는 39달러 방문당 결제와 모든 보험을 받는다는 안내가 함께 적혀 있다.","from":"https://www.doctronic.ai"},{"file":"doctronic_how.png","caption":"AI 의사가 어떻게 작동하는지 네 단계로 설명하는 페이지다. 무료 AI 상담에서 면허 의사 화상 진료로 넘어가는 지점이 어디인지, 대기 시간과 값이 얼마인지 보여 준다.","from":"https://www.doctronic.ai/how-your-ai-doctor-works/"},{"file":"doctronic_pricing.png","caption":"값 안내 페이지다. AI 상담은 영원히 0달러, 면허 의사 진료는 39달러 또는 보험 본인부담금, 기업은 직원 한 사람당 월정액으로 세 갈래를 나눠 놓았다.","from":"https://www.doctronic.ai/quality-care-in-seconds-pricing-that-makes-sense/"},{"file":"doctronic_ios.png","caption":"미국 아이폰 앱스토어 페이지다. 무료 앱이고 2025년 11월에 나왔으며 평점 4.4에 평가가 23개뿐이어서, 실제 사용이 앱이 아니라 웹에 몰려 있음을 보여 준다.","from":"https://apps.apple.com/us/app/doctronic/id6753094320"}],"sources":[{"title":"Doctronic 공식 사이트 첫 화면","url":"https://www.doctronic.ai","note":"무료와 익명 상담, 39달러 방문당 결제, 50개 주 진료 가능이라는 핵심 문구를 확인했다."},{"title":"Quality Care in Seconds, Pricing That Makes Sense","url":"https://www.doctronic.ai/quality-care-in-seconds-pricing-that-makes-sense/","note":"AI 상담 0달러, 의사 진료 39달러, 기업용 월정액이라는 세 갈래 값 구조를 확인했다."},{"title":"How Your AI Doctor Works","url":"https://www.doctronic.ai/how-your-ai-doctor-works/","note":"증상 입력에서 의사 연결까지의 네 단계 흐름과 평균 대기 15분이라는 표기를 확인했다."},{"title":"Doctronic Resource Center","url":"https://www.doctronic.ai/resource-center/","note":"무료와 유료의 경계, 진단서가 39달러 진료에 포함된다는 점, 로그인 없이 쓸 수 있다는 점을 확인했다."},{"title":"GLP-1 처방 관리 값 안내","url":"https://www.doctronic.ai/glp-99/","note":"월 99달러 구독이며 약값은 포함되지 않는다는 문구를 확인했다. 199달러 상품도 같은 형식으로 따로 있다."},{"title":"Doctronic Physicians Group","url":"https://www.doctronicpg.com/","note":"실제 진료를 맡는 의사들이 본사와 분리된 별도 법인 소속이며 50개 주에서 진료한다는 설명을 확인했다."},{"title":"Doctronic 사이트맵","url":"https://www.doctronic.ai/sitemap.xml","note":"하위 사이트맵 19개를 직접 세어 검색 유입용 페이지가 2만 4천 개가 넘는다는 것을 확인했다."},{"title":"Doctronic 아이폰 앱","url":"https://apps.apple.com/us/app/doctronic/id6753094320","note":"무료 SOAP 노트 제공, 평균 대기 5분, 평점 4.4에 평가 23개, 그리고 의료 행위를 하지 않는다는 면책 문구를 확인했다."},{"title":"Doctronic 안드로이드 앱","url":"https://play.google.com/store/apps/details?id=ai.doctronic.app","note":"설치 1천 회 이상, 평점 4.2에 리뷰 35개, 본사 주소가 뉴욕이라는 것을 확인했다."},{"title":"Doctronic Raises $40M Series B (Business Wire)","url":"https://www.businesswire.com/news/home/20260324814372/en/Doctronic-Raises-$40M-Series-B-Following-Breakthrough-as-First-AI-to-Legally-Renew-Prescriptions-in-the-U.S.","note":"시리즈 B 4,000만 달러, 주도 투자사, 15배 성장과 주간 방문자 30만 명이라는 회사 발표 수치를 확인했다."},{"title":"Doctronic raises $40 million as race to apply AI in clinical care heats up (STAT News)","url":"https://www.statnews.com/2026/03/23/ai-doctor-startup-doctronic-raises-40-million/","note":"누적 조달 6,500만 달러와 올해 매출 1,000만 달러 전망을 확인했다. 유료 구독 기사라 본문 일부만 열람했다."},{"title":"Doctronic Raises $20 Million Series A (PR Newswire)","url":"https://www.prnewswire.com/news-releases/doctronic-raises-20-million-series-a-to-bring-private-and-personalized-ai-doctor-to-the-masses-302556195.html","note":"2025년 9월 시리즈 A 2,000만 달러와 참여 투자자 명단을 확인했다."},{"title":"Investing in Doctronic (Lightspeed Venture Partners)","url":"https://lsvp.com/stories/investing-in-doctronic-ai-healthcares-24-7-digital-doctor/","note":"창업자 두 사람의 경력과 투자사의 판단 근거를 확인했다."},{"title":"Doctronic AI Appoints Dr. Byron Crowe as Chief Medical Officer","url":"https://www.businesswire.com/news/home/20251015771722/en/Doctronic-AI-Appoints-Dr.-Byron-Crowe-as-Chief-Medical-Officer-to-Lead-Next-Stage-of-Clinical-Innovation","note":"최고의료책임자 임명과 이전 경력을 확인했다."},{"title":"Utah and Doctronic Announce Groundbreaking Partnership for AI Prescription Medication Renewals","url":"https://commerce.utah.gov/2026/01/06/news-release-utah-and-doctronic-announce-groundbreaking-partnership-for-ai-prescription-medication-renewals/","note":"유타주 규제 완화 협약의 공식 발표다. 직접 열람은 차단되어 검색 결과 요약과 다른 보도로 내용을 확인했다."},{"title":"Utah tests AI for routine medication refills through regulatory relief program (Fierce Healthcare)","url":"https://www.fiercehealthcare.com/ai-and-machine-learning/doctronic-partners-utah-ai-sandbox","note":"규제 샌드박스의 범위와 제외 약물, 안전 장치를 확인했다."},{"title":"Utah dismisses medical board call to halt its pioneering AI prescription program (KUER)","url":"https://www.kuer.org/health/2026-04-28/utah-dismisses-medical-board-call-to-halt-its-pioneering-ai-prescription-program","note":"의료면허위원회의 중단 요청과 주 정부의 기각, 1단계에서는 면허 의사가 모든 처방 결정을 검토한다는 해명을 확인했다."},{"title":"New tech, familiar problems (Endpoints News)","url":"https://endpoints.news/new-tech-familiar-problems/","note":"뉴스레터가 인용한 Ngai Yeung 기자의 2026년 3월 26일 체험기다. 물리치료사 의뢰를 받으려고 39달러 진료를 써 봤으나 경험이 일관되지 않았고 대표도 개선 필요를 인정했다는 내용이다. 유료 구독 벽 때문에 도입부와 매체 요약만 확인했다."},{"title":"Is AI ready to refill prescriptions? Doctors are wary of Utah's automated program (KUER)","url":"https://www.kuer.org/health/2026-07-06/is-ai-ready-to-refill-prescriptions-doctors-are-wary-of-utahs-automated-program","note":"유타주 의료면허위원장의 발언과, 회사 검증 연구에서 사람 의사와의 일치율이 500건 기준 80%였다는 펜실베이니아대학교 Eric Bressman의 지적을 확인했다."},{"title":"Here Are 3 AI Companies Betting They Can Replace Doctors (Forbes)","url":"https://www.forbes.com/sites/jessepines/2026/07/24/here-are-3-ai-companies-betting-they-can-replace-doctors/","note":"처방 결정의 72%를 AI가 자율로 처리했고 그중 3%를 사람 의사가 뒤집었다는 수치가 나온 기사다. 본문을 직접 열람하지 못해 참고용으로만 두었다."},{"title":"AI doctor Doctronic raises $40M Series B, but faces controversy (Telecare Aware)","url":"https://telecareaware.com/ai-doctor-doctronic-raises-40m-series-b-but-faces-controversy-on-autonomous-rx-renewals-in-utah-and-effectiveness-claims/","note":"임상 검증 방식에 대한 JAMA Health Forum의 지적과 책임 소재 문제를 확인했다."},{"title":"Utah's new medical chatbot can be easily hacked to give dangerous medical advice (Mindgard)","url":"https://mindgard.ai/blog/doctronic-is-now-accepting-new-patients-and-unsafe-instructions","note":"공개 챗봇을 조작해 옥시콘틴 용량을 세 배로 제시하게 만든 실험을 확인했다."},{"title":"The Saga of Utah's Rx Refill Bot (MedCity News)","url":"https://medcitynews.com/2026/03/utah-prescription-medication-ai-doctronic-mindgard/","note":"보안 실험이 운영 환경이 아닌 공개 챗봇 대상이었다는 회사와 주 정부의 반박을 확인했다."},{"title":"Key Facts about the Uninsured Population (KFF)","url":"https://www.kff.org/uninsured/fact-sheet/key-facts-about-the-uninsured-population/","note":"2024년 기준 무보험 인구 2,670만 명과 비용 때문에 진료를 미룬 비율을 확인했다."},{"title":"K Health 공식 사이트","url":"https://khealth.com/","note":"지금은 Mass General Brigham, Mayo Clinic, Cedars-Sinai 등 병원을 통해 판매하는 구조로 바뀌었음을 확인했다."},{"title":"Buoy Health 공식 사이트","url":"https://www.buoyhealth.com/","note":"무료 증상 확인 도구까지만 제공하고 진료는 다른 곳으로 넘긴다는 점을 확인했다."}]},"emed":{"slug":"emed","name":"eMed","one_liner":"고용주를 통해 직원에게 비만 치료제(GLP-1)를 공급하고, 중간에 그만두지 않도록 관리해 주는 회사다.","site":"https://www.emed.com","sells_to":"mixed","seen_in":[{"issue":"26","section":17,"headline":"장수 의료(롱제비티) 기관으로 소개된 eMed가 기업가치 20억 달러가 넘는 조건으로 2억 달러를 조달했고, 보험 중개 회사 Aon이 라운드를 주도했으며, 환자 순응도 90%를 상품의 근거로 내세웠다."}],"card":{"problem":"미국에서는 일하는 사람 대부분이 회사를 통해 건강보험에 들기 때문에, 비만 치료제(GLP-1)를 쓰는 직원이 늘면 그 비용이 곧바로 고용주의 지출로 잡힌다. 그런데 1년 안에 절반이 넘는 사람이 약을 끊기 때문에 고용주는 결과가 남지 않은 채 약값만 치르게 된다.","solution":"eMed는 고용주와 계약해 직원에게 집에서 하는 채혈 검사와 처방, 주 1회 체크인을 묶어 공급하고, 중간에 그만두지 않도록 관리하는 대가를 받는다. 직원의 체중 감량과 복약 지속이 목표에 못 미치면 받는 돈을 깎겠다고 내걸었다.","price":"고용주를 거치는 경로는 상품마다 직원이 내는 돈이 다르고, 개인이 직접 가입하면 최초 검사비 49달러에 월 회비 149.99달러와 약값 월 149.99달러가 따로 붙어 매달 300달러 정도가 든다.","tags":["비만 치료제","고용주 판매","자가 채혈","원격진료","복약 관리"],"headline_traction":"2026년 3월에 기업가치 20억 달러가 넘는 조건으로 시리즈 A 2억 달러를 조달했고, 보험 중개 회사 Aon이 라운드를 주도했다.","watch":"상품의 근거로 내세우는 순응도 90%는 원래 프로그램 잔류율을 다른 이름으로 바꿔 적은 것이며, 회사가 스스로 낸 수치이고 제삼자가 검증하지 않았다."},"problem":"미국에서는 일하는 사람 대부분이 회사를 통해 건강보험에 든다. 폭스비즈니스 보도에 따르면 미국인의 60% 이상이 직장을 통해 의료 혜택을 받는다. 그래서 비싼 약을 쓰는 직원이 늘면 그 비용이 곧바로 고용주의 지출로 잡힌다. GLP-1 계열 비만 치료제는 체중을 뺀 뒤에도 계속 써야 하는 약이라, 한 번 쓰기 시작하면 회사가 해마다 떠안는 고정 항목이 된다. 더 곤란한 대목은 돈을 낸 만큼 결과가 남지 않는다는 점이다. 과체중이거나 비만인 성인 12만 5,474명의 실사용 기록을 본 연구(JAMA Network Open, 2025년 1월)에서는 1년 안에 53.6%가 약을 끊었고, 당뇨가 없는 사람만 따로 보면 64.8%가 끊었다. 2년으로 늘리면 당뇨가 없는 사람의 84.4%가 끊었다. 중간에 그만두면 빠진 체중이 대체로 되돌아오므로 고용주는 결과 없이 약값만 치른 셈이 된다. 실제로 아직 절반이 넘는 고용주가 이 약을 보장 항목에 넣지 않았다. Mercer 조사에 따르면 직원 500명 이상 고용주 가운데 체중 감량 약을 보장하는 곳은 2024년 기준 44%다. 한국은 전국민 건강보험이 있고 비만 치료제는 급여 대상이 아니어서 개인이 자기 돈으로 사기 때문에, 이 부담이 회사의 문제로 넘어오지 않는다.","solution":"고용주가 계약하면 직원은 eMed 앱으로 등록한다. 집으로 채혈 키트가 배송되고, 직원이 스스로 피를 뽑아 보내면 당화혈색소, 크레아티닌, 고감도 CRP, 감마지티피, 지질 검사, 비타민 B12 여섯 가지를 측정한다. 그 결과를 계약 의료진이 검토해 약을 쓸 수 있는지 판정하고 처방까지 내린다. 약은 위고비 주사와 위고비 알약, 젭바운드처럼 FDA 허가를 받은 정품만 쓰며, 약국 급여를 중개하는 사업자(PBM)를 거치지 않고 직접 조달하기 때문에 중간 마진이 붙지 않는다고 밝힌다. 처방 뒤에는 주 1회 체크인, 월 1회 진료 상담, 부작용에 대비한 상비약 꾸러미, 6개월과 12개월 시점의 재검사가 이어진다. 고용주에게는 직원의 체중 감량과 복약 지속을 보증하고 목표에 못 미치면 받는 돈을 깎겠다고 내걸었다. 소비자가 직접 가입하는 상품도 따로 있는데, 최초 검사비 49달러를 한 번 내고 월 회비 149.99달러를 내며, 약값은 월 149.99달러부터 별도로 붙는다. 셋을 합치면 첫 달에 350달러 가까이 들고 그 뒤로도 매달 300달러가 나간다. 보험은 받지 않는다.","features":[{"name":"가정용 채혈 스크리닝 키트","detail":"집으로 배송된 키트로 직접 피를 뽑아 여섯 가지 지표를 검사하고, 그 결과가 나와야 약을 처방받을 수 있다. 다른 병원에서 받은 검사지는 받아 주지 않는다."},{"name":"주 1회 체크인","detail":"앱에서 1분이 채 걸리지 않는 문답으로 체중과 상태를 기록한다. 예약이 필요 없고 언제든 할 수 있다."},{"name":"부작용 대응 상비약 꾸러미","detail":"메스꺼움처럼 흔한 부작용에 쓸 일반의약품을 프로그램에 포함해 함께 보낸다. 부작용 때문에 그만두는 일을 줄이려는 장치다."},{"name":"PBM을 거치지 않는 약 직접 조달","detail":"약국 급여를 중개하는 사업자를 빼고 직접 조달하는 경로로 정품 약을 들여온다고 밝힌다. 고용주에게는 리베이트로 부풀려진 가격이 아니라 정해진 값을 제시한다."},{"name":"성과 보증 계약","detail":"직원의 체중 감량과 복약 지속을 보증하고 목표에 미달하면 고용주가 내는 돈을 깎아 준다. 2026년 3월 조달과 함께 인두제 방식(가입자 1인당 정액 계약)도 새로 내놓겠다고 밝혔다."},{"name":"회사 부담이 없는 자율 가입형 상품","detail":"고용주가 계약서에 서명만 하면 회사 비용은 0달러이고, 직원이 할인 코드를 받아 월 149.99달러에 약을 사는 방식이다. 기존 약국 급여 계약을 바꾸지 않아도 된다."},{"name":"의료 종사자 전용 요금제","detail":"병원과 요양 시설 종사자를 겨냥한 별도 상품이다. 고용주가 대상자 1인당 월 25달러를 내고, 직원이 약값과 임상 지원 명목으로 월 99달러를 낸다."},{"name":"생활 습관 지원 연계","detail":"Thrive Global과 손잡고 행동 변화와 생활 습관 지도를 프로그램에 붙였다."}],"differentiator":"판매 경로에서 갈린다. eMed는 소비자 광고가 아니라 보험 중개 회사 Aon, 복리후생 운영 회사 Alight, 약국 급여 사업자 CVS Health를 통해 고용주에게 들어간다. Hims & Hers나 Ro처럼 소비자에게 직접 팔아 성장한 원격진료 회사와는 들어가는 경로 자체가 다르다. 약을 다루는 방식도 다르다. 약사가 자체 조제한 복제 성분(컴파운딩 세마글루타이드)을 쓰지 않고 FDA 허가를 받은 정품만 쓴다고 못 박는데, 2026년 초 FDA가 조제 GLP-1을 광고한 원격진료 회사 30곳에 경고장을 보냈을 때 eMed가 명단에 없었던 것도 이 선택과 맞물린다. 성과를 보증하고 못 지키면 대금을 깎겠다는 계약도 흔치 않다. 다만 '순응도 90%'라는 주장 자체는 이 분야에서 특별하지 않다. Omada는 12주 94%와 24주 84%를, Hims & Hers는 6개월 75%를 내걸고, Noom은 구독 유지 기간을 순응도처럼 제시한다. 셋 다 검증받은 수치가 아니고 셋 다 분모가 유리하게 잡혀 있다. Omada는 스스로 GLP-1을 쓴다고 밝히고 관리 프로그램에 등록한 사람만 셌고, Hims & Hers는 6개월 시점 설문에 응답한 사람만 셌다. eMed는 그 분모를 아예 밝히지 않았다.","team":[{"name":"Dr. Patrice A. Harris","role":"공동창업자, eMed, LLC(모회사) 전 CEO","background":"미국의사협회(AMA) 174대 회장을 지낸 정신과 의사이며, 흑인 여성으로는 처음으로 그 자리에 올랐다. 2020년 eMed를 공동창업했다. 2026년 8월 Nemours Children's Health로 옮겼다."},{"name":"Linda Yaccarino","role":"eMed Population Health CEO","background":"X(옛 트위터)의 CEO를 지냈고, X를 떠난 지 몇 주 만인 2025년 8월 5일 eMed에 왔다. 다만 그가 맡은 곳은 창업자 Harris가 이끌던 모회사가 아니라 GLP-1 사업을 하는 자회사다."},{"name":"Tom Brady","role":"Founding Chief Wellness Officer","background":"슈퍼볼 7회 우승 미식축구 선수 출신이다. 2026년 1월 12일 최고 웰니스 책임자로 선임됐고 3월 조달 라운드에도 투자자로 참여했다."},{"name":"Dr. Dyan Hes","role":"Chief Medical Officer","background":"소아과 전문의이자 미국비만의학회 인증 의사로 비만 의학과 소아과에서 25년 넘게 일했다. 뉴욕에서 Gramercy Pediatrics를 세웠고 지금은 Highline Modern Medicine의 의료 원장이다. 2025년 9월 30일 선임됐다."},{"name":"Michael Ferro Jr.","role":"영국 지주회사의 실질 지배자로 등기된 인물","background":"Merge Healthcare를 세우고 Tribune Publishing(옛 Tronc) 회장을 지낸 사업가다. 영국 기업등기소에 eMed Healthcare Group Holdings의 '중대한 지배력을 가진 자'로 2023년 8월 등록돼 있고, 연락처는 마이애미의 eMed 본사로 적혀 있다. 그런데 eMed 웹사이트의 경영진 명단에는 이 사람도, 같은 소송에서 최고 경영 책임자(Executive Chairman)로 지목된 Justin Dearborn도 나오지 않는다."},{"name":"Eric Larsen","role":"회사 소개 페이지의 팀 명단에 오른 인물","background":"UnitedHealth Group에서 부사장(EVP)을 지냈다."},{"name":"David Moore","role":"회사 소개 페이지의 팀 명단에 오른 인물","background":"Novo Nordisk에서 부사장(EVP)을 지냈다. Novo Nordisk는 위고비를 만든 제약사다."}],"traction":[{"type":"funding","detail":"기업가치 20억 달러가 넘는 조건으로 시리즈 A 2억 달러를 조달했다. 보험 중개 회사 Aon이 주도했고 Tom Brady, Joe Lonsdale, Antonio Gracias, Tom Ricketts, Jeff Aronin, Ara Cohen, R.J. Melman, Linda Yaccarino가 참여했다. 돈은 인공지능 플랫폼 개발과 인두제 계약을 감당할 자기자본에 쓴다고 밝혔다.","when":"2026-03","source":"PR Newswire 보도자료"},{"type":"funding","detail":"Aon이 eMed에 전략적 투자를 하고 자사 고용주 고객에게 eMed를 공급하기로 했다. 투자 금액은 공개되지 않았다.","when":"2025-08","source":"PR Newswire 보도자료"},{"type":"regulatory","detail":"Abbott의 BinaxNOW 가정용 코로나 검사가 FDA 긴급사용승인을 받았다. 화상으로 사람이 지켜보며 진행하는 첫 가정용 신속 검사였고, 그 화상 감독 플랫폼이 eMed의 것이었다. 2021년 1월 23일 개당 25달러로 판매를 시작했다.","when":"2020-12","source":"Abbott 보도자료, eMed 보도자료"},{"type":"customers","detail":"코로나 시기에 오하이오주, 콜로라도주, 버지니아주, 매사추세츠주와 검사 키트 공급 계약을 맺었고 United Airlines, American Airlines, Delta, Procter & Gamble, Quest Diagnostics와도 손잡았다. 2023년에는 미국 국립보건원(NIH)의 '집에서 검사하고 바로 치료받기' 시범 사업에서 원격진료를 맡았다. 회사는 누적 이용자를 600만 명 이상이라고 밝힌다.","when":"2021","source":"eMed 및 파트너사 보도자료"},{"type":"customers","detail":"영국 Babylon Health의 사업을 법정관리 절차에서 인수했다. NHS 환자를 보는 디지털 1차 진료 기관 GP at Hand가 여기 포함된다. 인수 대금은 현금 679만 파운드였다. 널리 인용되는 '50만 파운드'는 잔여 지분 값일 뿐이다. 인수한 사업은 2024년 한 해 4,290만 파운드의 매출을 냈다.","when":"2023-10","source":"eMed 보도자료, 영국 기업등기소 감사보고서"},{"type":"customers","detail":"나스닥 상장사 Science 37 Holdings를 주당 5.75달러, 약 3,800만 달러에 공개매수로 인수하고 상장을 폐지했다.","when":"2024-03","source":"미국 증권거래위원회(SEC) 제출 서류"},{"type":"revenue","detail":"영국 법인의 감사보고서상 2024년 매출은 5,140만 파운드, 세후 손실은 2,040만 파운드였고 직원은 326명이었다. 미국 쪽 매출과 인원은 비상장이라 공개된 자료가 없다.","when":"2024-12","source":"영국 기업등기소 제출 서류"},{"type":"partnership","detail":"미국 최대 약국 급여 사업자 CVS Health와 손잡고 고용주가 비용을 통제하며 GLP-1을 제공할 수 있는 경로를 만들었다.","when":"2026-02","source":"eMed 뉴스 페이지가 인용한 Axios 보도"},{"type":"partnership","detail":"복리후생 운영 회사 Alight, 그리고 Crux와 제휴해 고용주 대상 GLP-1 공급을 넓히기로 했다.","when":"2026-08","source":"Business Wire 보도자료"}],"caveats":"이 회사에서 가장 중요한 수치인 '순응도 90%'는 회사가 스스로 낸 것이고, 제삼자가 검증한 자료는 없다. 확인한 내용을 순서대로 적는다.\n\n첫째, 같은 숫자가 자리마다 다른 이름을 달고 있다. 회사 앱 안내 페이지는 '10명 중 9명이 처방받은 치료 계획을 따른다', '10명 중 9명이 6개월 넘게 프로그램에 남는다'로 적고 출처를 'eMed Population Health Data (2025)'라는 자사 데이터로 밝힌다. 즉 원래는 '프로그램 잔류율'이다. 보도자료는 이것을 '복약 순응도'로 바꿔 적고 업계 평균과 비교했다. 잔류율과 순응도는 다른 것을 세는 지표다.\n\n둘째, 표본 수도 순응도의 정의도 공개되지 않았다. eMed가 유일하게 등록한 연구(영국 ISRCTN12421711)는 eMed가 스스로 의뢰하고 스스로 돈을 대며 연구 책임자도 eMed 직원이고, 단일 기관에서 대조군 없이 뒤돌아보는 방식이며 윤리 심의 대상도 아니다. 결과는 아직 없고 종료 시점은 2027년 4월로 미뤄졌다. 그 연구가 정의한 순응도는 '권고받은 프로그램 활동 가운데 환자가 완료한 비율', 곧 앱 활동 수행률이다. 약을 실제로 얼마나 썼는지를 재는 지표가 아니다.\n\n셋째, 회사가 내세운 독립 검증은 아직 존재하지 않는다. eMed는 PitchBook에 '영국 회원 8,000명 이상을 유니버시티 칼리지 런던의 John Deanfield 교수가 독립 분석했고 6개월 91% 이상이 나왔으며 Nature Medicine에 심사 중, 몇 주 안에 게재'라고 밝혔다. 그로부터 다섯 달 반이 지난 2026년 9월 현재 PubMed, Europe PMC, Crossref, Nature Medicine 어디에도 그 논문이 없다. 게다가 같은 연구의 표본 수가 자료마다 8,000명, 1만 3천 명, 1,000명으로 다르게 적혀 있다. PitchBook의 애널리스트는 이 주장이 '마땅히 갖춰야 할 동료 심사와 임상 검증을 갖추지 못했다'고 평했다.\n\n넷째, '업계 평균의 두 배'는 성립하지 않는다. 시기와 지표를
