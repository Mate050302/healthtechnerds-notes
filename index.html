을 묶어 값을 매기는 CMMI 프로그램","plain":"고관절 치환술 같은 특정 수술에 대해 수술 자체뿐 아니라 퇴원 후 회복 기간까지 한 덩어리로 묶어 총액을 정하고, 병원이 그 안에서 해결하게 하는 지불 방식이다. 정해진 총액보다 적게 쓰면 병원이 남기고, 넘기면 병원이 부담한다. 대상 지역의 병원은 원하든 원하지 않든 참여해야 하기 때문에, 준비하지 않으면 손실이 나고 준비하면 이익이 난다. 이런 프로그램을 다루는 소프트웨어가 따로 사업이 되는 이유가 여기 있다."}]},{"heading_ko":"이번 주의 차트: Medicaid 관리형 보험사의 마이너스 마진","heading_en":"Chart of the Week","skip":null,"summary":"저소득층 공보험을 위탁받아 운영하는 민간 보험사들의 수익성을 2019년부터 2024년까지 들여다본 백서를 소개한다. 2024년에 이 집단 전체의 보험 인수 마진이 마이너스로 돌아섰다. 상장 보험사들이 2026년을 바닥으로 이야기한다는 점을 겹쳐 놓으면, 이 상태가 앞으로 몇 년 더 이어진다는 뜻이 된다.","insight":null,"signal":null,"author":[{"claim":"이 마진 수치는 적어도 몇 년 동안은 나아지지 않는다는 뜻으로 보인다.","evidence":"상장 지급자들이 모두 2026년을 Medicaid 수익성의 바닥 해로 이야기한다는 점과 2024년에 이미 마진이 마이너스로 돌아선 차트를 겹쳐 놓았다."}],"experts":[],"cases":[{"name":"Wakely의 Medicaid MCO 수익성 백서","what":"보험계리 자문사 Wakely가 2019년부터 2024년까지 저소득층 공보험을 위탁 운영하는 민간 보험사들의 수익성을 분석했다.","scale":"해당 기간 모든 연도에 재무 자료를 보고한 170개 플랜 대상이며, 이들이 2023년 가입자의 63%를 차지","note":"집단 전체의 보험 인수 마진이 2024년에 의미 있게 마이너스로 돌아선 것이 이 차트의 핵심이다.","sells_to":"none"}],"notes":[{"term":"Medicaid MCO(관리형 의료 조직)","ko":"저소득층 공보험을 위탁받아 운영하는 민간 보험사","plain":"주 정부가 저소득층 보험을 직접 운영하는 대신 민간 보험사에 가입자 1인당 정액을 주고 맡기는 방식이며, 지금 미국 Medicaid 가입자 대부분이 이 형태로 관리된다. 보험사는 받은 정액 안에서 의료비를 감당해야 하므로 실제 의료비가 예상보다 크면 손실이 난다. 정액은 주 정부가 정하고 물가나 이용량 증가를 뒤늦게 반영하기 때문에, 의료비가 빠르게 오르는 시기에는 손실이 몰린다. 앞서 나온 Medicare Advantage와 구조가 같고 대상 인구만 다르다."},{"term":"언더라이팅 마진(보험 인수 마진)","ko":"보험료로 받은 돈에서 의료비와 운영비를 뺀 뒤 남는 비율","plain":"보험사가 투자 수익 같은 것을 빼고 순수하게 보험 영업만으로 얼마를 남겼는지 보여 주는 지표다. 이 값이 마이너스라는 것은 받은 보험료보다 나간 돈이 많다는 뜻이며, 보험사가 그 사업에서 계속 손해를 보고 있다는 신호다. 손실이 이어지면 보험사는 주 정부에 정액 인상을 요구하거나 그 주에서 철수한다."},{"term":"NAIC 데이터","ko":"미국 보험 감독기구 협의회에 제출되는 재무 보고 자료","plain":"미국은 보험 감독이 주 단위로 이뤄지는데, 주 감독당국들의 협의체가 표준 양식을 정해 보험사 재무 자료를 모은다. 회사가 홍보용으로 내는 숫자가 아니라 감독용으로 제출하는 숫자여서 비교적 믿을 만한 자료로 쓰인다. 이번 백서가 이 자료를 근거로 삼은 이유도 그 때문이다."}]},{"heading_ko":"읽을거리: 임상 AI 도입을 위한 근거와 정책 요건","heading_en":"What I'm Reading","skip":null,"summary":"임상 현장에 AI를 도입할 때 어떤 근거 기준과 성능 기준이 필요한지를 정리한 업계 보고서를 소개한다. 다루는 영역은 고혈압과 정신건강 두 가지다. 필자의 평가는 새로운 내용은 없지만 정리가 잘 돼 있다는 정도다.","insight":null,"signal":null,"author":[{"claim":"획기적인 내용은 없지만 임상 AI를 배치할 때 유용할 사고를 잘 정리한 글이다.","evidence":"근거 기준과 성능 벤치마크를 다룬다는 점을 들었을 뿐 구체적인 내용은 옮기지 않았다."}],"experts":[{"who":"PHTI","role":"헬스 기술의 근거를 평가해 발표하는 기관이며, 특정 제품을 파는 쪽은 아니다.","claim":"고혈압과 정신건강 분야에서 AI 도입을 이끌려면 근거 기준과 성능 벤치마크가 정리돼야 한다.","evidence":"업계 세션에서 나온 논의를 정리한 보고서이며, 뉴스레터 본문에는 구체적인 기준이 옮겨지지 않았다."}],"cases":[],"notes":[]},{"heading_ko":"읽을거리: Medicaid의 세포·유전자 치료제 위험","heading_en":"What I'm Reading","skip":null,"summary":"한 번 투여에 수억 원이 드는 치료제가 늘어나면서 저소득층 공보험이 겪을 재정 부담을 다룬 글이다. 주 정부가 이 위험을 관리하는 데 민간 부문이 도울 기회가 있다는 주장으로 이어진다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Will Shrank, Bruce Greenstein, Hannah Katch","role":"이 글의 저자들이며, 원문에는 소속이 밝혀져 있지 않다. 다만 민간 부문 파트너의 기회를 주장하는 글이라는 점은 감안할 만하다.","claim":"Medicaid 프로그램이 세포·유전자 치료제와 관련해 어려움을 겪을 가능성이 크고, 주 정부가 이를 관리하도록 민간 부문 파트너가 도울 기회가 있다.","evidence":"여러 주의 사례에서 얻은 교훈을 정리했다고 소개될 뿐, 뉴스레터 본문에 구체적 근거는 옮겨지지 않았다."}],"cases":[],"notes":[{"term":"세포·유전자 치료제","ko":"한 번 투여로 병의 원인을 고치려는 초고가 치료제","plain":"환자의 세포나 유전자를 직접 손봐 병의 원인을 없애려는 치료제로, 한 번 투여에 수십억 원이 드는 경우도 있다. 문제는 비용이 한 해에 몰려 발생하는데 효과는 수십 년에 걸쳐 나타난다는 점이다. 저소득층 공보험처럼 예산이 한 해 단위로 정해지는 곳은 환자 몇 명만 나와도 예산이 흔들린다. 한국도 같은 문제를 겪고 있지만 미국은 주마다 예산이 따로여서 충격이 더 크게 몰린다."}]},{"heading_ko":"읽을거리: 뭉쳐서 협상력을 키우는 1차 진료 의사들","heading_en":"What I'm Reading","skip":null,"summary":"독립 개원의들이 큰 병원 그룹에 팔려 들어가는 대신 서로 뭉쳐 보험사와의 협상력을 키우는 방식을 다룬 기사다. 매사추세츠 서부의 한 진료 그룹 사례에 초점을 맞춘다.","insight":null,"signal":null,"author":[{"claim":"독립 1차 진료가 나아갈 길로서 독립 진료 협회의 장점을 다룬 흥미로운 글이다.","evidence":"매사추세츠 서부 Valley Medical Group의 경험에 초점을 맞춘 기사라는 점을 들었을 뿐, 내용은 옮기지 않았다."}],"experts":[{"who":"Karen Brown","role":"이 기사의 저자이며, 원문에 소속은 밝혀져 있지 않다.","claim":"1차 진료가 어려움에 처했고, 의사들이 서로 뭉쳐 시장에서의 힘을 키우는 것이 하나의 길이다.","evidence":"Valley Medical Group의 경험을 근거로 삼았다고 소개되나, 구체적 내용은 뉴스레터 본문에 옮겨지지 않았다."}],"cases":[],"notes":[{"term":"IPA(독립 진료 협회)","ko":"독립 개원의들이 협상만 함께하려고 만든 연합체","plain":"개원의들이 각자 자기 병원을 그대로 운영하면서, 보험사와의 계약 협상과 일부 행정 업무만 공동으로 처리하려고 만드는 조직이다. 미국은 보험사가 병원 하나하나와 개별로 값을 정하기 때문에, 작은 의원 하나는 협상력이 거의 없어 낮은 값을 받아들일 수밖에 없다. 뭉치면 값을 다툴 힘이 생기지만 소유권을 넘기지는 않으므로 독립을 지킬 수 있다. 한국은 수가가 일률적이라 이런 조직이 필요하지 않다."}]},{"heading_ko":"읽을거리: 공개된 Medicaid 데이터로 사기를 단정하기 전에","heading_en":"What I'm Reading","skip":null,"summary":"지난 주말 공개된 Medicaid 지출 데이터셋을 두고 사기라는 결론이 성급하게 나오고 있다는 지적이다. 이 데이터셋에는 전체 Medicaid 지출의 약 80%가 빠져 있다는 점이 핵심이다. 데이터가 무엇을 담고 있고 무엇을 담지 않는지 확인하지 않으면 잘못된 결론에 이른다는 이야기다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Jocelyn Guyer, Avi Herring, Laura Nolan","role":"이 글의 저자들이며, 원문에 소속은 밝혀져 있지 않다.","claim":"공개된 데이터셋에는 전체 Medicaid 지출의 약 80%가 빠져 있고, 이 데이터에서 도출되고 있는 결론 중 일부는 틀렸다.","evidence":"데이터셋에 무엇이 들어 있고 무엇이 빠져 있는지를 짚었다고 소개되나, 어느 항목이 빠졌는지 구체적인 목록은 뉴스레터 본문에 옮겨지지 않았다."}],"cases":[{"name":"DOGE의 Medicaid 데이터셋 공개","what":"연방 정부 조직이 Medicaid 지출 데이터를 공개했고, 이를 근거로 사기를 지적하는 주장들이 나왔다.","scale":"전체 Medicaid 지출의 약 80%가 이 데이터셋에 포함되지 않음","note":"데이터가 공개됐다는 사실과 그 데이터로 결론을 내릴 수 있다는 것은 다른 이야기라는 점을 보여 주는 사례다.","sells_to":"none"}],"notes":[{"term":"DOGE","ko":"정부 효율성 부서","plain":"연방 정부의 지출을 줄이겠다며 만들어진 조직으로, 정부 데이터를 공개하고 낭비와 사기를 지목하는 활동을 해 왔다. 데이터를 공개하는 것 자체는 투명성 측면에서 환영받지만, 맥락 없이 공개된 숫자가 곧바로 사기의 증거로 인용되는 일이 반복돼 왔다. 이 글이 문제 삼는 것이 그 지점이다."}]},{"heading_ko":"읽을거리: Medicaid에서 사기 위험이 높은 네 영역","heading_en":"What I'm Reading","skip":null,"summary":"저소득층 공보험 안에서 사기 위험이 특히 높은 네 가지 서비스 영역을 짚은 보고서를 소개한다. 네 영역은 가정·지역사회 기반 서비스, 응급 의료 이송, 자폐 행동 치료, 물질사용장애 치료다. 공통점은 서비스가 실제로 제공됐는지 확인하기 어렵다는 것이다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Chris Medrano, Brian Blase","role":"Paragon Institute 소속으로 이 보고서를 쓴 저자들이며, 이 기관은 공공 의료 지출 축소를 주장해 온 쪽이다.","claim":"Medicaid에서 사기 위험이 높은 네 영역이 있으며, 연방 기관의 더 강한 집행이 필요하다.","evidence":"가정·지역사회 기반 서비스, 응급 의료 이송, ABA 치료, 물질사용장애 치료 네 영역을 전국적으로 살펴봤다고 소개되나, 구체적 수치는 뉴스레터 본문에 옮겨지지 않았다."}],"cases":[],"notes":[{"term":"가정·지역사회 기반 서비스(HCBS)","ko":"요양시설이 아니라 집에서 받는 돌봄 서비스","plain":"거동이 불편하거나 장애가 있는 사람이 시설에 들어가는 대신 집에서 돌봄을 받도록 공보험이 비용을 대는 서비스다. 돌봄 제공자가 환자 집으로 찾아가기 때문에 실제로 몇 시간을 일했는지 제3자가 확인하기 어렵고, 그래서 청구 부풀리기가 생기기 쉽다. 한국의 노인장기요양 방문요양과 성격이 비슷하다."},{"term":"ABA 치료","ko":"자폐 아동을 대상으로 한 응용행동분석 치료","plain":"자폐 스펙트럼 아동에게 행동을 하나씩 익히게 하는 방식의 치료로, 미국에서는 주당 수십 시간씩 장기간 진행되고 공보험이 비용을 대는 경우가 많다. 시간 단위로 청구되는데 치료 효과를 객관적으로 측정하기 어려워, 실제보다 많은 시간을 청구하는 사례가 문제가 돼 왔다."}]},{"heading_ko":"읽을거리: 절감이 보이지 않는다는 인디애나의 반발","heading_en":"What I'm Reading","skip":null,"summary":"인디애나주가 저소득층 공보험을 민간 보험사 위탁 방식으로 바꾼 뒤 여러 난관을 겪고 있다는 기사다. 지금은 장기 요양시설 입소만이라도 예전 방식으로 되돌리자는 법안을 두고 주 안에서 논쟁이 벌어지고 있다. 위탁 방식이 늘 절감을 가져오지는 않는다는 사례다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Casey Smith","role":"이 기사의 저자이며, 원문에 소속은 밝혀져 있지 않다.","claim":"인디애나 Pathways 관리형 Medicaid 프로그램이 도입 과정에서 여러 난관을 겪었다.","evidence":"주 안에서 벌어지고 있는 법안 논쟁을 취재해 전했으나, 구체적 수치는 뉴스레터 본문에 옮겨지지 않았다."}],"cases":[{"name":"인디애나주 Medicaid 개편 법안","what":"장기 요양시설 입소를 민간 위탁 방식에서 다시 행위별 수가 방식으로 되돌려 절감을 꾀하자는 법안이 주 의회에서 논쟁 중이다.","scale":"","note":"민간 위탁이 절감을 만들어 낸다는 전제 자체가 현장에서 반박당하고 있는 드문 사례다.","sells_to":"none"}],"notes":[{"term":"FFS(행위별 수가제)","ko":"진료 행위 하나하나에 값을 매겨 지급하는 방식","plain":"검사 한 건, 처치 한 건마다 정해진 값을 지급하는 원래 방식이다. 정부가 직접 지급하므로 중간에서 이익을 가져가는 민간 보험사가 없지만, 행위가 늘어날수록 지출도 늘어난다는 약점이 있다. 그 약점 때문에 미국은 지난 수십 년간 민간 위탁으로 옮겨 왔는데, 이번 법안은 그 방향을 일부 되돌리자는 것이다. 한국 건강보험의 기본 지불 방식이 바로 이 행위별 수가제다."},{"term":"관리형 Medicaid","ko":"저소득층 공보험을 민간 보험사에 위탁 운영시키는 방식","plain":"주 정부가 가입자 1인당 정액을 민간 보험사에 주고 운영을 맡기는 방식으로, 예산을 예측 가능하게 만들고 의료비를 통제하겠다는 취지로 도입된다. 다만 보험사가 가져가는 관리 비용과 이익이 더해지므로, 실제로 총지출이 줄어드는지는 주마다 결과가 다르다. 인디애나에서 절감이 보이지 않는다는 반발이 나온 배경이 이것이다."}]},{"heading_ko":"HTN 라디오: ACCESS 모델 해설","heading_en":"HTN Radio","skip":"promo","summary":"뉴스레터가 운영하는 팟캐스트의 최근 회차를 소개하는 자리다. CMMI의 Jacob Shiff와 ACCESS 모델을 다뤘다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"HTN 라디오: Medicaid 기술 스택","heading_en":"HTN Radio","skip":"promo","summary":"자체 팟캐스트 회차 소개다. Medicaid 자격과 등록 절차의 변화를 다뤘다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"HTN 라디오: 이번 주 종합","heading_en":"HTN Radio","skip":"promo","summary":"자체 팟캐스트 회차 소개다. Humana의 플로리다 의료 제공자 그룹 인수 등을 다뤘다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"HTN 라디오: Nest Health의 새 사업 부문","heading_en":"HTN Radio","skip":"promo","summary":"자체 팟캐스트 회차 소개다. 산전·산후 건강에 초점을 맞춘 새 사업 부문을 다뤘다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]}],"themes":["policy-legislation","pbm-drug-pricing","regulation-cms","medicare-advantage","consumer-dtc","medicaid"],"for_later":[]},{"index":"18","date":"2026-03-01","type":"reads","title_en":"Weekly Health Tech Reads 3/1/26","title_ko":"AI 고용 논쟁과 MA 실적 시즌","hook":"AI가 일자리를 없앨지 다투는 사이, 작은 MA 회사들은 내년 요율에 괜찮다고 말했다.","tldr":[{"point":"필자는 AI가 화이트칼라 일자리를 없앤다는 파멸론 리포트를 2028년의 현실보다는 SF 소재에 가깝다고 보면서도, 미국 헬스케어의 백오피스 직무가 자동화하기 딱 좋아 보인다는 점은 인정하고, 결국 헬스케어 전체 일자리는 늘고 화이트칼라 감소를 블루칼라 증가가 상쇄할 것이라는 자기 직감을 밝힌다.","note":"필자가 파멸론에 선뜻 동의하지 못하는 이유는, 2025년 내내 병원들이 청구 업무에 AI를 빠르게 들였는데도 헬스케어는 여전히 미국 경제에서 일자리가 꾸준히 늘어난 유일한 영역이었기 때문이다."},{"point":"VBC와 Medicare Advantage 기업들의 4분기 실적이 몰리면서 주가가 크게 갈렸는데(Evolent +25%, agilon +31%, Privia +10%, Alignment -6%), 더 눈에 띈 것은 이 작은 회사들이 CMS의 2027년 지급률 초안을 두고 대형 보험사와 정반대로 '이 요율로도 괜찮다'고 말한 대목이다.","note":"몇 주 전 대형 보험사들이 한목소리로 실망을 표한 것과 달리, 소형 상장사는 Medicare Advantage에서의 성공이 투자자에게 내세울 유일한 서사라서 자신감을 보일 수밖에 없다는 사정도 함께 작동한다."},{"point":"소비자가 자기 돈으로 쓰는 온라인 처방 서비스 Hims는 매출 23억 달러에 전년 대비 59% 성장, 조정 EBITDA 마진 14%라는 숫자를 내고도 주가가 한 주 동안 7% 더 빠졌는데, 필자는 회사 이름을 가리면 좋은 투자로 보이지만 SEC 조사를 실적 발표에서 언급하지 않은 회사라면 투자자의 회의가 이해된다고 적는다.","note":"Hims는 보험을 거치지 않고 소비자가 직접 결제하는 방식이라, 미국 헬스케어 기업 중에서는 드물게 우리와 같은 B2C 시장에서 돈을 버는 회사다."},{"point":"Mount Sinai 연구진이 Nature Medicine에 낸 연구에서 ChatGPT Health가 임상 증례에 답한 내용을 두고 일부 임상의가 '불필요한 위해와 사망으로 충분히 이어질 수 있다'고 우려했지만, 필자는 그 위험을 인정하면서도 아이가 독감인지 계속 ChatGPT Health에 물어보겠다고 덧붙인다.","note":"여기서 시험한 것은 진단이 아니라 트리아지, 곧 지금 응급실로 가야 하는지 집에서 지켜봐도 되는지를 가르는 판단이다."},{"point":"Massachusetts 정책위원회가 주 내 완전보험형 상업 플랜 데이터를 살펴본 결과, 2024년 보험사들이 상업 청구의 평균 20.4%를 거절한 것으로 나타났다.","note":"청구가 거절되면 병원이 다시 넣어 통과되기도 하지만, 그러지 못한 금액은 환자에게 청구서로 넘어오는 일이 잦다."},{"point":"펀딩은 일곱 건이 나왔는데, VBC 인에이블먼트 Honest Health가 1억 4,000만 달러로 가장 컸고, 그 아래로 뇌 건강 클리닉 Salma Health 8,000만 달러, 진료소 행정 플랫폼 Third Way 1,500만 달러, 플랜 비교 플랫폼 Handl Health 1,420만 달러, 재택 소아 치료 Coral Care와 인지 평가 도구 BrainCheck 각 1,300만 달러, Medicare 애드보커시 Baba 650만 달러가 이어졌다.","note":"이 가운데 소비자가 직접 돈을 내는 곳은 없고, 대부분 병원과 고용주와 제도가 지불하는 쪽에 붙어 있다."}],"issue_insight":{"verdict":"yes","summary":"서른일곱 꼭지 대부분이 보험사와 병원 사이의 돈 이야기여서 B2C 앱으로 옮길 것이 없다. 다만 미국 소비자가 제도 앞에서 혼자 막히는 지점이 이번 회차에 여러 번 드러나는데, 그 막힘을 풀어 주는 일은 진료가 아니라 문서와 안내라서 소프트웨어만으로 만들 수 있다.","build":[{"title":"청구 거절 해독과 이의신청 도우미","detail":"Massachusetts에서 2024년 상업 청구의 20.4%가 거절됐다는 것은, 미국 유저 상당수가 이유를 모르는 청구서와 거절 통지서를 이미 손에 들고 있다는 뜻이다. 통지서를 찍어 올리면 무엇이 왜 거절됐는지 풀어 주고 이의신청 문서 초안까지 만들어 주는 기능은 진료를 대신하지 않으므로 3개월 안에 붙일 수 있다.","section":36},{"title":"'지금 내가 할 일' 안내","detail":"Baba와 Solace가 파는 애드보커시는 예약을 잡고 서류를 따지고 다음 순서를 잡아 주는 일인데, 그중 상당 부분은 사람이 아니라 화면으로도 된다. 제도가 복잡해 아무도 다음 단계를 알려 주지 않는다는 점이 미국 유저에게는 그 자체로 결핍이다.","section":30},{"title":"생활 문제 문진과 지역 자원 연결","detail":"CMMI의 Accountable Health Communities 최종 평가는 식료품, 주거, 교통 같은 상류 동인에 집중하면 입원과 응급실 이용이 줄고 비용도 아낄 수 있다고 시사한다. 몇 개의 질문과 연결 목록으로 이뤄지는 일이라 앱 화면에서 구현할 수 있으며, 진짜 과제는 지역 자원 목록을 어디서 가져오는가다.","section":35},{"title":"쇼퍼블 시술 값 비교 화면","detail":"Handl Health는 미리 고를 수 있는 시술에서 소비자 비용을 22% 낮췄다고 보고한다. 가격 공개 규정으로 풀린 데이터를 쓰면 '내 주변에서 이 시술은 얼마인가'를 보여 주는 화면은 소프트웨어 인력만으로 만들 수 있다. 다만 Handl은 고용주 쪽에 파는 회사라, 소비자가 이 정보에 직접 돈을 낸다는 증거는 이 회차에 없다.","section":27},{"title":"인지 기능 자가 체크","detail":"BrainCheck가 1,300만 달러를 받은 인지 건강 평가는 반응 속도와 기억 회상처럼 화면에서 잴 수 있는 항목으로 구성된다. 진단이 아니라 자기 점수의 변화를 따라가는 기록으로 선을 그으면, 현금 리워드나 건강 나이와 겹치지 않는 새 가치가 된다.","section":29}],"signal":[{"title":"미국 소비자는 보험을 건너뛰는 편의에 자기 돈을 낸다","detail":"Hims는 소비자 직접 결제만으로 연매출 23억 달러에 전년 대비 59% 성장을 냈고, 상위 10개 해외 시장으로 빠르게 넓힌 뒤 수익성은 나중에 챙기겠다고 밝혔다. 사람들이 지갑을 여는 지점은 진료 자체보다 절차를 건너뛰는 편의 쪽이다.","section":5},{"title":"병원에 가기 전에 AI에게 먼저 묻는다","detail":"Nature Medicine에 트리아지 시험 논문이 실릴 만큼 이 행동이 흔해졌고, 그 위험을 읽은 필자조차 아이가 독감인지 ChatGPT Health에 계속 물어보겠다고 적는다. 규모를 보여 주는 수치는 원문에 없지만 방향은 분명하다.","section":32},{"title":"소비자 직접 결제 구독은 종목마다 갈린다","detail":"같은 주에 소비자가 매달 직접 돈을 내는 온라인 심리상담 BetterHelp는 역풍을 맞았고, 현금으로 약을 살 때 쓰는 할인 쿠폰 GoodRx는 2026년 매출 가이던스를 낮게 내놓아 주가가 18% 빠졌다. 소비자 헬스 구독이 전부 자라는 국면은 아니다.","section":12}]},"sections":[{"heading_ko":"여는 인사","heading_en":"","skip":"admin","summary":"필자 Kevin이 이번 호에서 다룰 내용을 미리 알려 주는 인사말이다. VBC와 MA 기업들의 4분기 실적, 2027 Advance Notice에 대한 달라진 반응, Alignment CEO 인터뷰, 요즘 쏟아지는 AI 예측 글을 예고한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"후원: AscendRural","heading_en":"Sponsored by: AscendRural","skip":"sponsor","summary":"CMS의 농촌 보건 전환 프로그램을 주제로 한 3부작 웨비나 시리즈 광고다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"AI는 헬스케어 일자리를 없앨까","heading_en":"MUSING: Ben Affleck, the AI abundance / apocalypse, and healthcare","skip":null,"summary":"이번 주 시장을 흔든 AI 파괴 논쟁을 헬스케어 고용 문제로 옮겨 놓은 필자의 칼럼이다. 파멸론 리포트 한 편과 그에 맞선 반박들을 소개한 뒤, 미국 헬스케어의 백오피스 일자리가 자동화 대상이라는 직관과 실제 고용 지표가 어긋난다는 점을 짚는다. 결론을 내리기보다 2028년 고용 전망을 독자에게 묻는 설문으로 마무리한다.","insight":null,"signal":null,"author":[{"claim":"AI가 화이트칼라 일자리를 지우고 경제를 무너뜨린다는 2028년 시나리오는 현실을 반영하기보다 좋은 SF 스릴러 소재가 될 가능성이 더 크다.","evidence":"2025년 병원들이 청구 업무에 AI를 빠르게 도입해 재무 성과를 초과 달성하는 동안에도 헬스케어는 미국 경제에서 일자리가 꾸준히 늘어난 유일한 영역이었고, 가장 먼저 없어질 직종으로 꼽히던 영상의학과 의사는 오히려 그 어느 때보다 잘나가는 것으로 보인다는 점을 든다."},{"claim":"미국 헬스케어의 백오피스 직무는 사실상 전부 자동화하기 좋아 보이며, 그 규모가 수십만인지 수백만인지도 가늠하기 어렵다.","evidence":"지난 50년간 미국 헬스케어에서 만들어진 마찰을 관리하려고 그 직무들이 존재해 왔다는 점을 들 뿐, 구체적인 수치는 대지 않았다."},{"claim":"2028년 헬스케어 일자리 총수는 늘어날 것이며, 화이트칼라 감소를 블루칼라 증가가 충분히 상쇄할 것이다.","evidence":"자신의 직감이라고 밝히고, GDP 2% 성장 시나리오가 현실화되는 쪽으로 본다는 판단을 근거로 든다."}],"experts":[{"who":"Cintrini Research","role":"2028년을 배경으로 한 파멸론 리포트를 낸 리서치 회사","claim":"화이트칼라 일자리가 넘쳐나는 AI 에이전트로 대체되면서 일자리의 필요가 순식간에 사라지고, 아무도 주택담보대출을 감당하지 못해 경제 붕괴가 촉발된다.","evidence":"필자가 시나리오의 줄거리만 옮겼을 뿐, 리포트가 든 근거는 소개되지 않았다."},{"who":"Ben Affleck","role":"배우이자 Dunkin' Donuts 브랜드 홍보대사이며, The Joe Rogan Show에서 이 발언을 했다","claim":"AI가 분명 많은 것을 바꾸겠지만 결국은 Hollywood 같은 산업에서 생산성을 높여 주는 도구가 될 것이다.","evidence":"근거를 대지 않았다."},{"who":"Citadel Securities","role":"파멸론 리포트에 반박문을 쓴 금융 회사","claim":"AI가 미국 경제가 마주한 역풍을 상쇄해 GDP 성장률을 2% 안팎으로 유지하기에 딱 충분할지도 모른다.","evidence":"필자는 경제학자에게 기대할 법한 종류의 데이터로 뒷받침했다고만 전하고, 그 데이터가 무엇인지는 소개하지 않는다."}],"cases":[{"name":"Block 인력 감축","what":"Jack Dorsey가 결제 회사 Block의 인력을 거의 절반 가까이 선제적으로 감축했고, 이유로 앞으로 기대되는 AI 생산성 향상을 들었다.","scale":"전체 인력의 거의 절반","note":"필자는 경영 실패 때문일 가능성도 함께 언급하며, 감원의 명분과 실제 원인을 가른다.","sells_to":"other"}],"notes":[{"term":"RCM","ko":"청구·수납 업무","plain":"병원이 환자를 진료한 뒤 보험사에 돈을 청구하고 실제로 받아 내기까지의 업무 전체를 가리킨다. 미국은 보험사마다 인정 항목과 서류 규칙이 달라, 청구를 맞춰 넣고 거절된 건을 다시 넣는 데 사람이 아주 많이 필요하다. 한국의 심사평가원 청구 업무와 성격은 비슷하지만, 상대해야 할 보험사가 수백 곳이라 규모가 비교되지 않는다. 그래서 AI로 사람을 줄이기 가장 쉬운 자리로 늘 먼저 꼽힌다."},{"term":"Jevons Paradox","ko":"제번스의 역설","plain":"어떤 자원을 쓰는 효율이 좋아지면 값이 싸져서 오히려 총 사용량이 늘어난다는 경제학 이론이다. 여기서는 AI가 영상 판독을 빠르고 싸게 해 주자 판독 자체를 더 많이 시키게 되어 영상의학과 의사가 더 필요해졌다는 뜻으로 쓰인다. 필자는 이 해석에 유보를 달아, 그것이 정말 제번스의 역설의 증거인지는 확실하지 않다고 적는다."}]},{"heading_ko":"실적 시즌: 들어가며","heading_en":"Public Markets Updates","skip":null,"summary":"VBC와 Medicare Advantage 기업들의 4분기 실적 발표가 몰린 주였고, 발표 직후 주가가 크게 출렁였다는 안내다. 이어지는 꼭지들이 회사별 핵심을 하나씩 짚는다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[{"term":"Medicare Advantage (MA)","ko":"민간이 대신 운영하는 미국 노인 공적보험","plain":"미국의 노인 공적보험인 Medicare를 정부가 직접 운영하지 않고 민간 보험사가 대신 운영하는 방식이다. 정부는 가입자 한 명당 매달 정해진 금액을 보험사에 주고, 보험사는 그 예산 안에서 진료비를 감당한다. 남으면 이익이고 모자라면 손실이므로 보험사는 가입자를 아프지 않게 유지할 이유가 생기고, 반대로 아픈 사람을 덜 받으려는 유인도 생긴다. 한국에는 대응하는 제도가 없으며, 건강보험공단이 하는 일을 민간 회사가 정액으로 도급받는 구조라고 보면 가깝다."},{"term":"VBC","ko":"성과 기반 진료","plain":"진료를 몇 건 했는지가 아니라 환자에게 어떤 결과가 났고 비용이 얼마나 들었는지로 돈을 받는 방식이다. 미국의 기본은 행위별 수가여서 검사와 시술을 많이 할수록 병원이 버는데, 성과 기반 진료는 정해진 예산 안에서 환자를 관리해 입원을 줄이면 그 차액을 나눠 갖는다. 한국의 행위별 수가제와 견주면, 예산을 미리 정해 놓고 아끼면 상을 주는 쪽이다."}]},{"heading_ko":"Hims: 숫자는 좋은데 주가는 빠졌다","heading_en":"Public Markets Updates","skip":null,"summary":"소비자가 직접 결제하는 온라인 처방 서비스 Hims의 실적 이야기다. 성장률과 수익성 숫자만 보면 싸 보이는데도 주가가 계속 빠지는 이유를 필자가 따져 본다. GLP-1 논란과 거리를 두고 해외 확장을 새 성장축으로 내세운 점도 함께 다룬다.","insight":null,"signal":"미국 소비자가 보험을 거치지 않고 자기 돈으로 처방 기반 서비스를 구독한다는 것을 규모로 보여 주는 자리다. Hims는 이 방식만으로 연매출 23억 달러에 전년 대비 59% 성장, 조정 EBITDA 3억 1,800만 달러를 냈고, 상위 10개 해외 시장으로 빠르게 넓힌 뒤 수익성은 나중에 챙기겠다는 계획을 밝혔다. 미국에서 건강 가치를 붙일 때 사람들이 지갑을 여는 지점이 진료 자체보다 절차를 건너뛰는 편의 쪽이라는 것을 보여 준다.","author":[{"claim":"회사 이름을 가리면 훌륭한 투자처럼 보이지만, 그 회사가 Hims라는 것을 알면 투자자들이 회의적인 이유가 아주 잘 이해된다.","evidence":"매출 23억 달러, 전년 대비 59% 성장, 조정 EBITDA 마진 14%인데 기업가치가 38억 달러 언저리라는 숫자를 한쪽에 놓고, 최근의 소동을 겪고도 경영진이 실적 발표에서 SEC 조사를 받고 있다는 사실을 언급하지 않았다는 점을 다른 쪽에 놓는다."}],"experts":[],"cases":[{"name":"Hims 2025년 4분기 실적","what":"소비자가 앱과 웹에서 직접 가입하고 자기 돈을 내는 온라인 처방 서비스 회사가 실적을 발표했고, 주가는 한 주 동안 7% 더 빠졌다.","scale":"매출 23억 달러, 전년 대비 59% 성장, 조정 EBITDA 3억 1,800만 달러, 기업가치 약 38억 달러, 2030년 목표 매출 65억 달러와 조정 EBITDA 13억 달러","note":"조제 GLP-1이 지금 사업에서 차지하는 비중이 얼마나 작은지를 거듭 강조했고, 해외 확장이 서사의 중심축으로 옮겨 가고 있다.","sells_to":"consumer"}],"notes":[{"term":"compounded GLP-1","ko":"약국이 직접 조제한 비만 치료제","plain":"정식 허가된 비만 치료제가 품귀일 때, 약국이 같은 성분을 직접 섞어 만들어 파는 것을 말한다. 미국은 품귀 기간에 한해 이를 허용했고, 온라인 업체들이 훨씬 싼 대체재로 대량 판매했다. 품귀가 풀리면 조제 판매의 법적 근거가 사라져 규제와 소송 위험이 커지므로, Hims가 지금 이 비중이 작다고 거듭 강조하는 것이다."},{"term":"조정 EBITDA","ko":"일회성 비용을 뺀 영업 현금 이익","plain":"회사가 본업에서 벌어들이는 현금 이익을 대략 보여 주려고, 이자와 세금과 감가상각에 더해 일회성 비용까지 빼고 계산한 수치다. 회계 규칙이 정한 이익이 아니라 회사가 스스로 정의해 발표하는 값이므로 회사마다 기준이 다르다. 적자 상태의 성장 기업이 자기 사업의 체력을 보여 줄 때 즐겨 쓴다."}]},{"heading_ko":"Evolent: 종양학이 매출의 3분의 2가 된다","heading_en":"Public Markets Updates","skip":null,"summary":"보험사를 대신해 전문과목 진료를 관리해 주는 Evolent가 종양학에서 크게 성장했다는 실적 이야기다. 종양학 비중이 1년 만에 36%에서 65%로 뛰는 배경과, 반대로 ACA 거래소 사업이 부담이 되는 이유를 함께 전한다.","insight":null,"signal":null,"author":[{"claim":"ACA 사업은 2026년 Evolent 실적에 뚜렷한 부담 요인이다.","evidence":"가장 큰 두 개의 거래소 고객이 가입자를 각각 60%와 40% 줄였다는 점을 든다."}],"experts":[],"cases":[{"name":"Evolent 2025년 4분기 실적","what":"보험사를 대신해 종양학 같은 전문과목의 진료 승인과 케어 경로를 관리해 주는 회사가 강한 성장을 발표했고, 주가가 한 주 동안 25% 올랐다.","scale":"종양학이 2026년 매출의 65%(2025년 36%), 2026년 신규 코호트 매출 9억 달러로 상향(이전 추정 5억 5,000만 달러)","note":"하나의 종양 유형에 최대 200가지 케어 경로가 있는 영역이라, 표준을 잡아 주는 관리가 특히 효과를 낸다고 소개한다.","sells_to":"payer"}],"notes":[{"term":"ACA 거래소(exchange)","ko":"오바마 케어로 만들어진 개인 보험 장터","plain":"직장 보험도 공적보험도 없는 사람이 정부가 운영하는 웹사이트에서 민간 보험 상품을 골라 사는 시장이다. 소득이 낮으면 보험료 보조금을 받는다. 가입자 수가 보조금 정책에 따라 해마다 크게 출렁이는 것이 특징이라, 이 시장을 고객으로 둔 회사는 실적이 정책에 흔들린다. 한국처럼 전국민이 자동 가입되는 구조가 아니기 때문에 이런 장터가 따로 필요하다."},{"term":"케어 경로(care pathway)","ko":"질환별 표준 치료 갈래","plain":"같은 암이라도 병기와 유전자 변이, 이전 치료 이력에 따라 권장되는 치료 순서가 갈라지는데, 그 갈래 하나하나를 케어 경로라고 부른다. 갈래가 200가지까지 늘어나면 의사마다 선택이 달라지고 비용도 크게 벌어진다. 보험사가 이런 회사에 돈을 주고 관리를 맡기는 이유가 여기에 있다."}]},{"heading_ko":"agilon: 손실을 줄이려 가입자를 덜어 냈다","heading_en":"Public Markets Updates","skip":null,"summary":"1차 진료 의사 그룹이 Medicare Advantage 환자의 비용 책임을 떠안도록 돕는 agilon이 2026년 조정 EBITDA 손익분기 경로를 제시했다는 이야기다. 2025년 내내 계약을 다시 짜면서 수익성에 맞지 않는 MA 가입자 약 5만 명을 덜어 냈다는 대목이 핵심이다.","insight":null,"signal":null,"author":[{"claim":"2026년에 agilon이 덜어 낸 그 나쁜 리스크를 누가 다시 떠안게 될지 생각해 보는 것이 흥미롭다.","evidence":"agilon의 3대 고객이 Aetna, Humana, UHC라는 점을 근거로 든다."}],"experts":[],"cases":[{"name":"agilon health 2025년 4분기 실적","what":"의사 그룹이 MA 환자의 비용 책임을 지도록 뒷단을 대 주는 회사가 2026년 손익분기 경로를 제시했고, 주가가 31% 올랐다.","scale":"2025년 손실 약 3억 달러, 재계약 과정에서 MA 가입자 약 5만 명 축소","note":"적자를 줄이는 방법이 새 매출이 아니라 계약 축소였다는 점, 그리고 그 부담이 대형 보험사 쪽으로 되돌아간다는 점이 눈여겨볼 대목이다.","sells_to":"provider"}],"notes":[{"term":"리스크를 떠안는다(risk-bearing)","ko":"정액 예산을 넘겨받아 손익까지 책임지는 계약","plain":"보험사가 정부에게서 받는 가입자 1인당 정액 예산의 일부를 의사 그룹이 넘겨받아, 그 환자들의 진료비가 예산보다 적게 들면 이익을 얻고 더 들면 손실을 보는 계약이다. 그래서 병이 무거워 비용이 많이 드는 집단을 업계에서는 '나쁜 리스크'라고 부른다. 계약에서 그 집단을 덜어 내면 회사의 손실은 줄지만, 그 부담은 계약 상대인 보험사로 그대로 되돌아간다. 한국에는 의료기관이 이런 방식으로 손익을 지는 제도가 없다."}]},{"heading_ko":"Alignment: 가이던스를 넘기고도 주가는 내렸다","heading_en":"Public Markets Updates","skip":null,"summary":"MA 플랜 Alignment가 모든 지표에서 가이던스 상단을 넘겼는데도 주가가 약 6% 빠진 이유를 다룬다. 시장의 관심이 이미 실적이 아니라 California 밖에서도 빠르면서 수익성 있게 성장할 수 있는가로 옮겨 갔다는 것이다. 아래 인터뷰 꼭지와 이어진다.","insight":null,"signal":null,"author":[{"claim":"Alignment가 어려운 MA 시장에서도 계속 잘 실행해 내는 바탕에는 health plan으로서의 케어 매니지먼트 접근법이 있다.","evidence":"일관된 성과를 근거로 들지만, 접근법과 성과를 잇는 구체적인 수치는 이 꼭지에서 대지 않는다."}],"experts":[{"who":"John Kao","role":"MA 플랜을 운영하는 상장사 Alignment Health의 CEO","claim":"California 밖에는 IPA가 없다는 점이 오히려 그 시장들에서 성과를 내기 더 쉽게 만들어 줄 것이다.","evidence":"필자는 Alignment의 그 시장 초기 성과가 이를 뒷받침하는 것으로 보인다고 덧붙이지만, 구체적인 수치는 제시하지 않는다."}],"cases":[{"name":"Alignment Health 2025년 4분기 실적","what":"MA 플랜을 운영하는 회사가 모든 지표에서 가이던스 상단을 넘겼다고 발표했으나, 주가는 한 주 동안 약 6% 떨어졌다.","scale":"","note":"가입자가 직접 고르지만 보험료의 대부분을 정부가 내기 때문에, 소비자에게 파는 사업이라기보다 정부 예산을 받아 운영하는 사업에 가깝다.","sells_to":"other"}],"notes":[{"term":"IPA","ko":"개원의 연합체","plain":"여러 개인 의원이 보험사와 협상하려고 모여 만든 조직이다. California에는 이 조직이 강해서 보험사가 진료 방식에 개입하기 어렵고 값 협상에서도 의사 쪽 힘이 세다. Kao는 이 조직이 없는 다른 주에서는 보험사가 자기 방식대로 케어를 관리하기 더 쉽다고 본다. 한국은 개별 의원이 건강보험공단과 협상할 일이 없어 대응하는 조직이 없다."}]},{"heading_ko":"Clover: New Jersey 밖에서는 아직","heading_en":"Public Markets Updates","skip":null,"summary":"Clover가 2025년 조정 EBITDA 흑자를 냈고 2026년에는 순이익 흑자를 내겠다고 밝혔다는 소식이다. 다만 가입자가 한 주에 몰려 있어 확장이 과제이고, 기술 플랫폼 Counterpart Health가 아직 매출에 기여하지 못한다는 점도 짚는다.","insight":null,"signal":null,"author":[{"claim":"과장이 넘치던 SPAC 시절을 지나온 Clover는 점점 더 반대편 해안의 작은 Alignment 서사처럼 보인다.","evidence":"그 주에서 provider-sponsored plan이었던 이력 위에 MA 플랜으로 성과를 내고 있다는 점을 든다."},{"claim":"Counterpart Health의 기회를 두고 크게 흥분하기는 어렵다.","evidence":"애널리스트가 2026년 가이던스에 기여하느냐고 묻자 답이 '아니다'였고, 모델이 공개된 지 거의 2년이 지났다는 점을 든다."}],"experts":[],"cases":[{"name":"Clover Health 2025년 4분기 실적","what":"MA 플랜을 운영하는 회사가 2025년 조정 EBITDA 흑자 달성과 2026년 순이익 흑자 전망을 밝혔고, 주가는 이번 주 크게 움직이지 않았다.","scale":"2026년 가입자 15만 3,000명으로 53% 성장, 그중 New Jersey가 약 12만 7,000명, Georgia는 약 1만 명에서 약 2만 2,000명","note":"성장률 53%가 커 보이지만 실제 증가분의 대부분이 한 주에서 나온다는 점이 이 숫자의 핵심이다.","sells_to":"other"},{"name":"Counterpart Health","what":"Clover가 자사 기술을 다른 의사와 병원에 파는 플랫폼으로 내놓은 사업이며, 2026년 가이던스에는 기여하지 않는다고 밝혔다.","scale":"","note":"모델을 공개한 지 2년이 되도록 매출 기여가 없다는 점을 필자가 문제 삼는다.","sells_to":"provider"}],"notes":[{"term":"provider-sponsored plan","ko":"병원이나 의사 그룹이 직접 만든 보험 플랜","plain":"진료하는 쪽이 스스로 보험 상품을 만들어 파는 방식이다. 돈을 내는 쪽과 진료하는 쪽이 한 몸이라 진료 습관을 바꾸기 쉽고, 지역 의사들과의 관계도 이미 갖춰져 있다. 필자는 Clover가 유독 New Jersey에서만 잘하는 배경으로 이 이력을 든다."}]},{"heading_ko":"Privia: 조용한 분기","heading_en":"Public Markets Updates","skip":null,"summary":"개원 의사들을 한 플랫폼으로 묶어 계약과 행정을 대신해 주는 Privia의 실적은 특별할 것이 없었고, 질문은 대체로 여기서 어떻게 더 성장할 것인가에 몰렸다는 짧은 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Privia Health 2025년 4분기 실적","what":"개원 의사들을 묶어 보험 계약과 행정을 대신해 주는 회사가 견조한 성과를 이어 갔고, 주가가 약 10% 올랐다.","scale":"","note":"Q&A에서 AI 활용 준비, Evolent Care Partners 인수, MA에서의 공동 리스크 부담을 두고 대화가 오갔다.","sells_to":"provider"}],"notes":[]},{"heading_ko":"GoodRx: 가이던스 하향","heading_en":"Public Markets Updates","skip":null,"summary":"GoodRx가 2026년 매출 가이던스를 예상보다 낮게 제시해 주가가 18% 빠졌다는 한 줄 소식이다.","insight":null,"signal":"원문이 전하는 것은 가이던스가 예상보다 낮았다는 사실 하나뿐이지만, 이 회사의 매출이 소비자가 현금으로 약을 살 때 쓰는 할인 쿠폰에서 나온다는 점을 감안하면 방향은 읽힌다. 약값 절감을 미국 앱의 가치로 삼으려 한다면, 이 시장이 이미 커진 뒤 성장 기대가 꺾이는 구간에 들어섰다는 점을 감안해야 한다.","author":[],"experts":[],"cases":[{"name":"GoodRx 2026년 가이던스","what":"소비자가 약국에서 현금으로 약을 살 때 쓰는 할인 쿠폰 서비스가 예상보다 낮은 2026년 매출 가이던스를 제시했고, 주가가 18% 떨어졌다.","scale":"주가 18% 하락","note":"","sells_to":"consumer"}],"notes":[{"term":"GoodRx","ko":"처방약 현금 할인 쿠폰 서비스","plain":"미국은 같은 약이라도 약국마다, 보험 적용 여부에 따라 값이 크게 다르다. GoodRx는 약국과 약값 협상 대행사가 미리 정해 둔 할인가를 소비자에게 쿠폰 형태로 보여 주고, 소비자는 보험을 쓰지 않고 그 값으로 약을 산다. 한국은 약값이 전국 어디서나 같아서 이런 서비스가 성립하지 않는다."}]},{"heading_ko":"Teladoc: BetterHelp 역풍에도 주가 상승","heading_en":"Public Markets Updates","skip":null,"summary":"원격진료 회사 Teladoc이 견조한 분기 실적으로 주가가 15% 뛰었다는 짧은 소식이다. 소비자 대상 심리상담 서비스 BetterHelp가 광범위한 역풍을 맞고 있다는 단서가 함께 붙는다.","insight":null,"signal":"BetterHelp는 보험을 거치지 않고 소비자가 매달 직접 돈을 내는 온라인 심리상담이다. 원문은 이 사업에 광범위한 역풍이 있다고만 전하지만, 소비자가 직접 결제하는 정신건강 구독이 예전만큼 쉽게 자라지 않는다는 방향을 보여 준다. 같은 회차의 GoodRx 가이던스 하향과 겹쳐 놓으면, 미국 소비자 헬스 구독이 종목을 가리지 않고 자라는 국면은 아니라는 것을 알 수 있다.","author":[],"experts":[],"cases":[{"name":"Teladoc 2025년 4분기 실적","what":"고용주와 보험사에 원격진료를 팔면서 동시에 소비자에게 직접 심리상담 구독을 파는 회사가 견조한 분기를 발표했고, 주가가 15% 뛰었다.","scale":"주가 15% 상승","note":"회사 전체는 좋았지만 소비자 직접 결제 사업인 BetterHelp는 역풍을 맞고 있다는 점이 갈린다.","sells_to":"mixed"}],"notes":[{"term":"BetterHelp","ko":"소비자 직접 결제 온라인 심리상담","plain":"보험이나 회사를 거치지 않고 소비자가 직접 가입해 매달 구독료를 내고 상담사와 이야기하는 서비스다. 미국은 정신건강 상담이 보험으로 잘 커버되지 않고 대기도 길어서 이런 시장이 크게 자랐다. Teladoc이 인수해 자회사로 두고 있다."}]},{"heading_ko":"Slack에 쓴 다른 실적 업데이트","heading_en":"Public Markets Updates","skip":"promo","summary":"Option Care Health, Universal Health Services, Fresenius, Acadia Healthcare에 대한 업데이트는 뉴스레터가 아니라 자체 Slack 커뮤니티에 썼다는 안내다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"Alignment CEO 인터뷰: 보험사인가 진료 조직인가","heading_en":"HTN Radio: An interview with Alignment's John Kao","skip":null,"summary":"Alignment의 임상 모델을 다룬 자체 팟캐스트 소개다. 프로바이더 네트워크와 어떻게 일하는지, Care Anywhere라는 방문형 서비스로 무엇을 하는지가 중심이다. 필자는 이 회사가 문화적으로 보험사보다 진료 조직에 가깝게 느껴진다는 점을 흥미롭게 본다.","insight":null,"signal":null,"author":[{"claim":"Medicare Advantage 플랜을 문화적으로 무엇보다 케어 딜리버리 조직에 가깝게 규정하는 틀이며, 업계의 더 많은 곳이 이 방향으로 움직일지 지켜보고 싶다.","evidence":"인터뷰에서 들은 Care Anywhere 방문형 랩어라운드 서비스 설명을 근거로 들 뿐, 성과 수치는 대지 않았다."}],"experts":[],"cases":[],"notes":[{"term":"랩어라운드 서비스(wrap-around)","ko":"진료로 메워지지 않는 부분을 집에서 채워 주는 보조 서비스","plain":"정규 진료만으로 다 챙길 수 없는 부분을 집으로 찾아가 채워 주는 서비스를 말한다. 간호사나 사회복지사가 방문해 약을 제대로 먹는지, 식사와 거동은 어떤지, 우울하지는 않은지 살피는 식이다. 보험사가 이 비용을 스스로 부담하는 이유는, 그렇게 해서 입원 한 번을 막으면 정액 예산에서 남는 돈이 훨씬 크기 때문이다."}]},{"heading_ko":"팟캐스트: ACO 다시 설계하기","heading_en":"Other episodes this week:","skip":null,"summary":"Liz Fowler와 Purva Rawal이 최근 내놓은 ACO 지원 제안을 다룬 에피소드 소개다. 원문은 제안의 방향만 전하고 내용은 소개하지 않는다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Liz Fowler, Purva Rawal","role":"ACO를 지원할 방안을 제안한 정책 전문가로 소개된다","claim":"ACO를 경쟁과 더 나은 성과가 나오는 쪽으로 다시 설계해야 한다.","evidence":"원문은 에피소드 제목과 대화 주제만 전하고, 제안의 근거는 소개하지 않는다."}],"cases":[],"notes":[{"term":"ACO","ko":"책임의료조직","plain":"여러 병원과 의사가 한 팀을 이뤄 정해진 환자 집단의 총 진료비와 진료 결과를 함께 책임지는 조직이다. 비용이 기준보다 적게 들고 품질 기준을 지키면 절감액의 일부를 정부와 나눠 갖는다. Medicare가 행위별 수가에서 성과 기반 쪽으로 옮겨 가려고 만든 대표 장치이며, 한국에는 대응하는 제도가 없다."}]},{"heading_ko":"팟캐스트: 이중수급자를 위한 재택 케어","heading_en":"Other episodes this week:","skip":null,"summary":"재택 케어 회사 Jukebox Health 경영진과 LTSS 인구를 위한 재택 개입을 이야기한 에피소드 소개다. 원문은 대화 주제만 전하고 주장은 담지 않는다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[{"term":"이중수급자(dual-eligible)","ko":"Medicare와 Medicaid를 동시에 받는 사람","plain":"나이가 많아 노인 공적보험 대상이면서 소득도 아주 낮아 저소득층 의료부조 대상이기도 한 사람이다. 병이 무겁고 비용이 많이 드는 집단인데, 두 제도가 서로 다른 규칙과 다른 예산으로 돈을 대기 때문에 책임이 갈라진다. 그 틈에서 케어가 끊기는 일이 잦아, 미국 헬스케어에서 가장 까다로운 인구로 꼽힌다."},{"term":"LTSS","ko":"장기 돌봄·생활 지원","plain":"혼자 씻고 먹고 움직이는 일이 어려워진 사람에게 오래 이어서 제공하는 돌봄과 생활 지원이다. 병을 고치는 진료가 아니라 일상을 유지시키는 서비스이며, 미국에서는 주로 Medicaid가 돈을 댄다. 한국의 노인장기요양보험이 하는 일과 가깝다."}]},{"heading_ko":"팟캐스트: The Grand Roundup","heading_en":"Other episodes this week:","skip":"promo","summary":"2026년 2월 23일자 자체 팟캐스트 에피소드를 알리는 한 줄이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"Enhabit, 11억 달러에 비상장 전환","heading_en":"Other Top Headlines","skip":null,"summary":"재택 의료 회사 Enhabit이 사모펀드 Kinderhook에 약 11억 달러로 인수돼 상장을 접는다는 소식이다. 2021년 분사 이후 수가 변화와 Medicare Advantage 확대에 적응하지 못한 것이 배경이다.","insight":null,"signal":null,"author":[{"claim":"이 딜은 Enhabit 주주와 Kinderhook 모두에게 괜찮은 윈윈이다.","evidence":"애널리스트 논평을 근거로 들면서, 주주는 단기적 이익을 얻고 인수자는 앞으로 몇 년에 걸쳐 반등할 것으로 보이는 시장에서 장기 상방을 확보한다고 정리한다."}],"experts":[],"cases":[{"name":"Kinderhook Industries의 Enhabit 인수","what":"간호사와 치료사가 환자 집을 방문해 의료를 제공하는 회사를 사모펀드가 약 11억 달러에 사들여 비상장으로 전환한다.","scale":"인수가 약 11억 달러, 2025년 매출 10억 6,000만 달러, EBITDA 1억 700만 달러","note":"Medicare Advantage 가입자가 늘수록 방문 승인과 단가가 조여지기 때문에, 재택 의료 회사에는 MA 성장이 곧 역풍이 된다.","sells_to":"other"}],"notes":[{"term":"재택 의료(home health)","ko":"집으로 찾아가는 의료 서비스","plain":"퇴원한 환자나 거동이 어려운 환자의 집으로 간호사와 물리치료사가 찾아가 제공하는 의료 서비스이며, 미국에서는 주로 Medicare가 돈을 댄다. 전통 Medicare는 정해진 수가를 그대로 지급하지만, 민간이 운영하는 Medicare Advantage 플랜은 방문 횟수를 사전 승인으로 조이고 단가도 낮게 쳐 준다. 그래서 MA 가입자가 늘어날수록 이 회사들의 매출이 깎인다."}]},{"heading_ko":"법무부, OhioHealth 계약 방식 제소","heading_en":"Other Top Headlines","skip":null,"summary":"미국 법무부가 Columbus 지역 병원 그룹 OhioHealth의 보험사 계약 방식을 문제 삼아 소송을 냈다는 소식이다. 특정 계약 조항 때문에 보험사가 더 싼 대안 플랜을 만들 수 없다는 것이 주장의 핵심이다.","insight":null,"signal":null,"author":[],"experts":[{"who":"미국 법무부(DOJ)","role":"병원 그룹을 상대로 반독점 소송을 제기한 정부 기관","claim":"OhioHealth의 계약 방식 때문에 보험사가 대안적인 플랜 설계를 제시할 방법이 없다.","evidence":"anti-tiering 및 steering 조항과 all-or-nothing 계약을 사용한다는 점을 든다."}],"cases":[{"name":"미국 법무부 대 OhioHealth","what":"Columbus 지역 병원 그룹이 보험사와 맺는 계약 조항을 걸어 연방정부가 소송을 제기했다.","scale":"","note":"진료의 질이 아니라 계약서 조항이 쟁점이라는 점에서, 최근 미국의 병원 반독점 소송이 같은 형태로 반복되고 있다.","sells_to":"none"}],"notes":[{"term":"anti-tiering / steering 조항","ko":"병원 등급 나누기와 환자 유도를 막는 계약 조항","plain":"보험사는 값이 싸고 성적이 좋은 병원을 상위 등급에 올려 환자 본인부담을 낮춰 주는 방식으로 환자를 그쪽으로 유도한다. 이 조항이 계약서에 들어가면 보험사는 그 병원을 불리한 등급에 넣거나 환자를 다른 병원으로 안내할 수 없다. 결과적으로 어느 병원에 가든 환자가 내는 돈이 같아져, 싼 곳을 고를 이유가 사라진다. 한국은 모든 병원의 수가가 같아서 이런 조항 자체가 성립하지 않는다."},{"term":"all-or-nothing 계약","ko":"전부 아니면 전무 계약","plain":"한 병원 그룹과 계약하려면 그 그룹의 병원과 의원을 하나도 빼지 않고 전부 보험 네트워크에 넣어야 한다는 조건이다. 보험사는 비싼 병원만 빼고 싼 곳만 골라 담아 보험료가 저렴한 상품을 만들 길이 막힌다. 미국은 병원마다 값이 다르게 협상되기 때문에 이런 조건이 곧 가격 결정력이 된다."}]},{"heading_ko":"2027 Advance Notice 의견 제출","heading_en":"Other Top Headlines","skip":null,"summary":"CMS가 내년 Medicare Advantage 지급률 초안에 대한 의견을 받았고, 여러 단체가 각자의 의견서를 공개했다는 소식이다. 필자는 아직 다 읽지 못했다면서도, MA를 옹호하는 단체의 의견서가 톤 때문에 볼 만하다고 짚는다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Better Medicare Alliance","role":"Medicare Advantage를 옹호하는 업계 단체","claim":"프로그램 무결성과 관련한 일부 변화는 지지하지만, 제안된 실효 성장률과 그것이 확정될 경우 수급자에게 미칠 부정적 영향은 우려된다.","evidence":"원문은 의견서의 톤만 전하고, 근거로 든 내용은 소개하지 않는다."}],"cases":[{"name":"2027 Advance Notice 의견 제출","what":"CMS가 낸 2027년 MA 지급률 초안에 대해 업계 조직들이 의견서를 제출하고 그 내용을 소셜 미디어에 공개했다.","scale":"","note":"몇 주 뒤 확정본이 나오기 전, 업계가 공개적으로 압박을 넣는 자리다.","sells_to":"none"}],"notes":[{"term":"Advance Notice와 Final Notice","ko":"내년 MA 지급률 초안과 확정본","plain":"CMS가 이듬해 Medicare Advantage 플랜에 가입자 한 명당 얼마를 줄지 정하는 절차다. 먼저 초안을 내고 업계 의견을 받은 뒤 확정본을 발표한다. 이 숫자가 조금만 움직여도 플랜의 이익이 크게 흔들리기 때문에 업계 전체가 총력을 다해 의견을 낸다. 한국으로 치면 해마다 건강보험 수가 인상률을 정하는 협상과 비슷한 자리다."},{"term":"실효 성장률(effective growth rate)","ko":"내년 진료비 상승 추정치","plain":"내년에 가입자 한 명당 진료비가 얼마나 오를 것으로 볼지에 대한 CMS의 추정치이며, 지급률을 정하는 핵심 숫자다. 이 값이 실제 진료비 상승보다 낮게 잡히면 플랜은 그만큼 손해를 보고, 그 부담을 보험료나 부가 혜택 축소로 가입자에게 넘기게 된다. 업계 단체가 수급자에게 부정적 영향이 간다고 주장하는 대목이 여기다."}]},{"heading_ko":"CMS, 사기 단속과 Minnesota 지급 유보","heading_en":"Other Top Headlines","skip":null,"summary":"CMS가 사기를 단속할 새 조치들을 발표했고, 그중에는 Minnesota주가 문제를 해결할 때까지 분기 연방 지급금 2억 5,950만 달러를 유보하는 조치가 포함된다는 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"CMS의 사기 단속 조치","what":"연방 보건 당국이 사기 단속 조치를 발표하면서, Minnesota주에 줄 분기 연방 지급금을 주가 프로그램 무결성 문제를 해결할 때까지 유보하기로 했다.","scale":"분기 연방 지급금 2억 5,950만 달러 유보","note":"연방정부가 주 정부의 관리 실패에 돈줄로 직접 압박을 가한 사례다.","sells_to":"other"}],"notes":[{"term":"CMS","ko":"미국 연방 보건의료 재정 기관","plain":"Medicare와 Medicaid를 운영하는 미국 연방정부 기관이다. 지급률을 정하고 규칙을 만들며, 주 정부가 운영하는 Medicaid에는 연방이 부담하는 몫을 분기별로 내려보낸다. 한국의 보건복지부와 건강보험공단 역할을 합쳐 놓은 자리에 가깝고, 이 기관의 결정 하나가 업계 전체의 손익을 바꾼다."},{"term":"프로그램 무결성(program integrity)","ko":"제도에서 새는 돈을 막는 관리","plain":"자격 없는 사람에게 돈이 나가거나 하지 않은 진료가 청구되는 것을 걸러 내는 관리 활동을 말한다. 미국은 청구를 일단 지급한 뒤 나중에 되찾는 구조라, 사기에 취약하다는 지적을 늘 받는다. 이번 지급 유보도 그 관리가 부실하다는 판단에서 나온 조치다."}]},{"heading_ko":"가상 심부전 프로그램 파트너십","heading_en":"Other Top Headlines","skip":null,"summary":"Allina Health의 심장 전문 기관과 소프트웨어 회사 Innovaccer가 원격 심부전 관리 프로그램을 시작한다는 소식이다. 필자는 CMMI의 새 ACCESS 모델 맥락에서 이런 파트너십이 늘어날 것으로 본다.","insight":null,"signal":null,"author":[{"claim":"자신이 CMMI라면 딱 이런 유형의 파트너십이 발표되기를 바랄 것이다.","evidence":"CMMI의 새 ACCESS 모델이라는 맥락을 들 뿐, 그 모델의 내용이나 다른 근거는 대지 않는다."}],"experts":[],"cases":[{"name":"Allina Health Minneapolis Heart Institute의 가상 심부전 프로그램","what":"병원의 심장 전문 기관이 환자를 병원에 오게 하지 않고 원격으로 관리하는 심부전 프로그램을 시작한다.","scale":"","note":"심부전은 약 용량을 조금씩 맞춰 가는 관리가 핵심이라, 원격으로 자주 살피는 방식이 잘 맞는 질환으로 꼽힌다.","sells_to":"other"},{"name":"Innovaccer의 Story Health 플랫폼","what":"병원에 파는 소프트웨어 회사가 자사 플랫폼을 이 프로그램의 운영 기반으로 제공한다.","scale":"","note":"환자가 쓰는 화면이 있더라도 계약과 지불은 병원 쪽에서 이뤄지는 구조다.","sells_to":"provider"}],"notes":[{"term":"CMMI와 ACCESS 모델","ko":"새 지불 방식을 시험하는 연방 조직과 그 신규 모델","plain":"CMMI는 CMS 안에서 새로운 지불 방식과 진료 모델을 실험하는 조직이다. 여기서 성공한 모델이 제도 전체로 퍼지기 때문에, 업계는 CMMI가 어떤 모델을 밀지 늘 살핀다. ACCESS는 CMMI가 새로 내놓은 모델인데, 원문은 이름만 언급하고 내용은 설명하지 않는다."}]},{"heading_ko":"Oregon: Medicaid 전문과목 의뢰 중단","heading_en":"Other Top Headlines","skip":null,"summary":"Providence Medical Group이 CareOregon 가입자를 자사 전문과목 클리닉으로 받는 의뢰를 2월 15일자로 중단하기로 합의했다는 소식이다. 주가 Medicaid 비용 문제와 계속 씨름하는 상황이 배경이다.","insight":null,"signal":null,"author":[],"experts":[{"who":"CareOregon","role":"Portland 광역권 최대 Medicaid 플랜","claim":"가입자들이 여전히 케어를 받을 수 있을 것이다.","evidence":"자신감을 표했다고만 전할 뿐, 대체 경로에 대한 근거는 소개되지 않는다."}],"cases":[{"name":"Providence Medical Group","what":"전문과목 클리닉을 운영하는 의료 그룹이 특정 Medicaid 플랜 가입자의 의뢰를 더 받지 않기로 했다.","scale":"2026년 2월 15일자 시행","note":"Medicaid 수가가 낮을 때 의료기관이 취하는 가장 직접적인 대응이 진료 자체를 받지 않는 것이다.","sells_to":"other"},{"name":"CareOregon","what":"주로부터 예산을 받아 저소득층 가입자의 진료를 관리하는 Medicaid 플랜이 이 합의의 상대방이다.","scale":"Portland 광역권 최대 Medicaid 플랜","note":"보험이 있어도 받아 주는 곳이 없으면 진료를 못 본다는 미국 Medicaid의 고질적 문제가 그대로 드러난다.","sells_to":"other"}],"notes":[{"term":"Medicaid","ko":"저소득층 의료부조","plain":"소득이 낮은 사람을 위한 공적 의료 제도로, 연방정부와 주 정부가 돈을 나눠 내고 운영은 주가 한다. 지급하는 수가가 낮아 아예 받지 않겠다는 의사와 병원이 많고, 그래서 보험이 있어도 진료 볼 곳을 찾지 못하는 일이 생긴다. 한국의 의료급여와 취지는 같지만, 대상과 급여 범위가 주마다 달라진다."}]},{"heading_ko":"Honest Health 1억 4,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"VBC 인에이블먼트 회사 Honest Health가 헬스케어의 큰 투자자들이 참여한 라운드로 1억 4,000만 달러를 모았다. 몇 년간 조용했던 회사인데, 초점이 1차 진료 의사 중심에서 health system 지원 쪽으로 옮겨 가는 것으로 보인다는 관찰이 붙는다.","insight":null,"signal":null,"author":[{"claim":"Honest의 초점이 PCP 중심 접근에서 health system 인에이블먼트 쪽으로 옮겨 가고 있으며, 이는 지켜볼 만하다.","evidence":"보도자료의 내용을 근거로 든다."}],"experts":[],"cases":[{"name":"Honest Health","what":"의사 그룹과 병원이 성과 기반 계약을 감당하도록 데이터와 뒷단을 대 주는 회사가 1억 4,000만 달러를 유치했다.","scale":"1억 4,000만 달러, NewSpring Healthcare 주도","note":"2021년 Buffalo의 IPA와 시작해 2022년 BCBS Michigan과 손잡고 Michigan으로 넓힌 이후 몇 년간 조용했다.","sells_to":"provider"}],"notes":[{"term":"인에이블먼트(enablement)","ko":"성과 기반 계약의 뒷단을 대신 맡아 주는 사업","plain":"의사 그룹이나 병원이 성과 기반 계약을 감당할 수 있도록 데이터 분석, 인력, 자본을 대신 대 주는 사업이다. 환자 집단의 비용을 예측하고 관리하는 일은 작은 의원이 혼자 하기 어렵기 때문에, 그 뒷단을 통째로 맡고 절감액을 나눠 갖는 회사들이 생겨났다. 미국 헬스케어 스타트업에서 가장 흔한 사업 형태 중 하나다."}]},{"heading_ko":"Salma Health 8,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"뇌 건강을 전문으로 다루는 클리닉 모델 Salma Health가 8,000만 달러를 유치했다. 우울증용 자기 자극 치료 기기를 만든 Magnus Medical과 연결되어 있는 것으로 보이며, California의 클리닉 네 곳을 전국으로 넓힐 계획이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Salma Health","what":"우울증을 포함한 뇌 건강을 전문으로 보는 클리닉을 직접 운영하는 회사가 8,000만 달러를 유치했다.","scale":"8,000만 달러, Mubadala Capital과 ARCH Venture Partners 주도, California 클리닉 4곳","note":"기기와 시술이 있어야 성립하는 모델이라 소프트웨어만으로는 접근할 수 없는 영역이다.","sells_to":"other"}],"notes":[{"term":"TMS","ko":"경두개 자기 자극 치료","plain":"머리 밖에서 자기장을 쏘아 뇌의 특정 부위를 자극하는 우울증 치료법이다. 약이 잘 듣지 않는 환자에게 쓰며, 클리닉을 여러 번 방문해 받아야 한다. 기기 자체가 허가를 받아야 하고 시술도 필요해서, 앱이 대체할 수 있는 영역이 아니다."},{"term":"center-of-excellence 모델","ko":"한 질환만 집중해서 보는 전문 시설","plain":"특정 질환 하나를 아주 많이 다뤄 성적이 좋은 전문 시설을 가리킨다. 미국에서는 고용주나 보험사가 그런 곳을 지정해 환자를 몰아 주고 값을 미리 정해 두는 방식이 흔하다. 여기저기 흩어져 받는 것보다 결과가 좋고 값도 예측할 수 있기 때문이다."}]},{"heading_ko":"Third Way 1,500만 달러","heading_en":"Funding Announcements","skip":null,"summary":"진료소의 행정 업무를 대신 맡는 Third Way가 1,500만 달러를 모았다. 프런트 오피스 비용을 최대 40% 줄이고 환자 방문을 11% 늘리며 전화 대기 시간을 절반으로 줄이고 있다는 자체 수치를 밝힌다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Third Way","what":"의원의 접수와 전화 응대, 예약 같은 앞단 행정을 대신 처리해 주는 회사가 1,500만 달러를 유치했다.","scale":"1,500만 달러, Health Velocity Capital 주도, 연간 500만 명을 보는 진료소 지원, 행정 비용 최대 40% 절감, 환자 방문 11% 증가, 전화 대기 시간 절반","note":"전화를 제때 받는 것만으로 환자 방문이 11% 늘었다는 수치는 회사 발표이지만, 미국 의원의 앞단이 얼마나 막혀 있는지를 보여 준다.","sells_to":"provider"}],"notes":[{"term":"프런트 오피스","ko":"진료소의 앞단 행정","plain":"환자를 맞고 전화를 받고 예약을 잡고 보험 자격을 확인하는 진료소의 앞단 업무를 말한다. 미국은 보험 확인과 사전 승인 절차가 복잡해 이 자리에 사람이 많이 필요하고 인건비도 크다. 그래서 AI로 가장 먼저 대체를 시도하는 자리이기도 하다."}]},{"heading_ko":"Handl Health 1,420만 달러","heading_en":"Funding Announcements","skip":null,"summary":"복리후생 컨설턴트가 성적 좋은 플랜을 찾도록 돕는 Handl Health가 1,420만 달러를 유치했다. 미리 고를 수 있는 시술에서 소비자 비용을 22% 줄였고, 2년간 10억 달러 지출에서 1억 1,300만 달러를 아꼈다고 보고한다.","insight":"미국은 같은 시술이라도 병원마다 값이 몇 배씩 차이 나고, 가격 공개 규정으로 풀린 데이터가 있어 값을 비교하는 화면은 소프트웨어 인력만으로 만들 수 있다. Handl이 22%를 아꼈다는 대상이 급하지 않아 미리 고를 수 있는 시술이라는 점이 중요한데, 이런 항목은 앱에서 '내 주변에서 이건 얼마인가'를 보여 주는 것만으로도 값어치가 생긴다. 다만 Handl은 고용주 쪽에 파는 회사이므로, 소비자가 이 정보에 직접 돈이나 시간을 쓴다는 증거는 이 꼭지에 없다.","signal":null,"author":[],"experts":[],"cases":[{"name":"Handl Health","what":"회사의 직원 보험을 대신 골라 주는 컨설턴트가 성적 좋은 플랜을 찾도록 돕는 플랫폼이 1,420만 달러를 유치했다.","scale":"1,420만 달러, Arthur Ventures 주도, 쇼퍼블 시술의 소비자 비용 22% 절감, 2년간 10억 달러 지출에서 1억 1,300만 달러 절감","note":"절감액의 수혜자는 소비자이지만 상품을 사는 쪽은 고용주와 컨설턴트라는 점에서, 미국 가격 비교 사업의 전형적인 형태다.","sells_to":"employer"}],"notes":[{"term":"쇼퍼블 시술(shoppable procedure)","ko":"미리 고를 수 있는 시술","plain":"응급이 아니어서 날짜를 잡고 어디서 받을지 고를 수 있는 시술을 말한다. MRI, 대장내시경, 무릎 수술 같은 것이 여기 들어간다. 미국은 같은 시술의 값이 병원마다 크게 다르기 때문에, 고를 수 있다는 것 자체가 곧 돈이 된다. 한국은 급여 항목의 값이 전국에서 같아서 이 개념이 거의 성립하지 않는다."},{"term":"복리후생 컨설턴트(benefits consultant)","ko":"직원 보험을 대신 골라 주는 자문 회사","plain":"회사가 직원 보험을 어디서 어떤 조건으로 살지 대신 조사하고 협상해 주는 중개·자문 회사다. 미국 직장인의 보험은 개인이 아니라 회사가 고르기 때문에, 이 컨설턴트를 설득하는 것이 곧 영업이 된다. 미국 헬스케어 스타트업이 소비자가 아니라 이쪽을 고객으로 삼는 이유이기도 하다."}]},{"heading_ko":"Coral Care 1,300만 달러","heading_en":"Funding Announcements","skip":null,"summary":"아이의 집으로 찾아가는 소아 치료 모델 Coral Care가 1,300만 달러를 모았고, 작업치료사와 물리치료사, 언어치료사 400명이 넘는 네트워크를 갖췄다는 짧은 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Coral Care","what":"발달이 늦거나 치료가 필요한 아이의 집으로 치료사가 찾아가는 서비스를 운영하는 회사가 1,300만 달러를 유치했다.","scale":"1,300만 달러, Haymaker Ventures 주도, 치료사 400명 이상","note":"사람이 직접 방문하는 모델이라 소프트웨어만으로는 대체할 수 없다.","sells_to":"other"}],"notes":[{"term":"OT, PT, SLP","ko":"작업치료사, 물리치료사, 언어치료사","plain":"작업치료사는 옷 입기나 손 쓰기처럼 일상 동작을 다시 익히도록 돕고, 물리치료사는 걷기와 근력 같은 몸의 움직임을 다루며, 언어치료사는 말과 삼킴을 다룬다. 아이의 발달 지연에서 이 세 직군이 함께 붙는 경우가 많다."}]},{"heading_ko":"BrainCheck 1,300만 달러","heading_en":"Funding Announcements","skip":null,"summary":"인지 건강을 평가하는 디지털 도구 BrainCheck가 1,300만 달러를 유치했다는 짧은 소식이다. 원문은 투자자만 전하고, 누구에게 파는지나 어떤 평가인지까지는 밝히지 않는다.","insight":"인지 기능 평가는 기기 없이 화면에서 반응 속도와 기억 회상, 주의력을 재는 방식으로 구현할 수 있어 3개월 소프트웨어 작업의 범위 안에 들어간다. 우리 앱에는 이미 매일 쌓이는 걸음 데이터가 있으므로, 같은 사람의 인지 점수가 시간에 따라 어떻게 움직이는지 함께 보여 주면 현금 리워드나 건강 나이와 겹치지 않는 새 가치가 된다. 다만 진단이나 치매 판별로 표현하는 순간 규제 영역으로 넘어가므로, 어디까지나 자가 추적이라고 선을 그어야 한다.","signal":null,"author":[],"experts":[],"cases":[{"name":"BrainCheck","what":"인지 건강 상태를 평가하는 디지털 도구를 만드는 회사가 1,300만 달러를 유치했다.","scale":"1,300만 달러, Next Coast Ventures 주도, UPMC Enterprises와 S3 Ventures 참여","note":"병원 투자 조직인 UPMC Enterprises가 들어간 것으로 보아 병원 쪽 판매를 염두에 둔 것으로 보이나, 원문은 판매 대상을 밝히지 않는다.","sells_to":"other"}],"notes":[]},{"heading_ko":"Baba 650만 달러","heading_en":"Funding Announcements","skip":null,"summary":"Medicare 가입자를 대신해 제도를 헤쳐 나가 주는 애드보커시 모델 Baba가 650만 달러를 유치했다. 원격의료 의사가 초진으로 의학적 필요성을 확인한 뒤 애드보킷에게 넘기는 구조이며, 최근 훨씬 큰 라운드를 발표한 Solace와 개념이 비슷하다는 관찰이 붙는다.","insight":"애드보킷이 하는 일 가운데 상당 부분은 사람이 아니라 화면으로도 된다. 청구서와 보험 안내문을 대신 읽어 무엇이 왜 청구됐는지 알려 주고, 다음에 무엇을 해야 하는지 순서를 잡아 주는 기능은 진료를 대신하지 않으므로 3개월 안에 붙일 수 있다. 미국 유저에게 이것이 가치가 되는 이유는, 제도가 복잡한데 '지금 내가 무엇을 해야 하는가'를 아무도 알려 주지 않기 때문이다. 다만 Baba는 원격의료 초진으로 보험 청구 근거를 만드는 구조라, 돈을 내는 쪽이 소비자가 아니라 제도라는 점은 구분해서 봐야 한다.","signal":null,"author":[{"claim":"Baba는 최근 훨씬 큰 라운드를 발표한 Solace와 개념적으로 비슷하게 들린다.","evidence":"Baba 웹사이트에 적힌 구조, 곧 원격의료 의사가 초진으로 의학적 필요성을 확인한 뒤 환자를 애드보킷에게 인계한다는 설명을 근거로 든다."}],"experts":[],"cases":[{"name":"Baba","what":"Medicare 가입자를 대신해 제도와 병원을 상대해 주는 애드보커시 서비스가 650만 달러를 유치했다.","scale":"650만 달러, General Catalyst 주도","note":"환자를 직접 상대하지만 매출은 원격의료 초진으로 만든 청구 근거에서 나오는 것으로 보이므로, 소비자가 직접 지불하는 사업으로 보기 어렵다.","sells_to":"other"}],"notes":[{"term":"애드보커시, 애드보킷(advocate)","ko":"환자를 대신해 제도를 상대해 주는 사람과 그 서비스","plain":"환자를 대신해 보험사와 병원을 상대해 주는 사람이다. 예약을 잡고, 청구서를 따지고, 거절된 항목에 이의를 넣고, 어느 의사에게 가야 하는지 찾아 준다. 미국은 이 일을 대신해 주는 곳이 제도 안에 없어 환자가 스스로 감당해야 하고, 그래서 이것 자체를 파는 회사가 생겨난다. 한국에서는 병원 접수 창구와 건강보험공단이 대부분 흡수하는 일이다."},{"term":"의학적 필요성(medical necessity)","ko":"보험이 값을 쳐 주는 조건","plain":"미국 보험은 어떤 서비스가 '의학적으로 필요하다'고 인정되어야만 값을 쳐 준다. 그래서 원격의료 의사가 먼저 진료해 그 근거를 기록으로 남기면, 뒤이어 제공하는 서비스에 청구할 길이 열린다. 소비자에게는 무료처럼 보이지만 실제로는 제도가 값을 치르는 구조가 이렇게 만들어진다."}]},{"heading_ko":"이번 주의 인용: 소형 플랜들의 달라진 톤","heading_en":"Quote of the Week","skip":null,"summary":"agilon과 Alignment, Clover가 2027년 지급률 초안을 두고 대형 보험사와 다른 반응을 보였다는 관찰이다. Clover CEO의 발언을 그대로 인용하고, 그 발언이 CMS와의 수 싸움에서 무엇을 뜻하는지 필자가 해석한다.","insight":null,"signal":null,"author":[{"claim":"Medicare Advantage 생태계의 작고 스타트업다운 '인서전트' 계층이 CMS의 변화에 덜 비판적으로 나온 것은 흥미롭다.","evidence":"몇 주 전 대형 사업자들이 한목소리로 실망을 표한 것과, 이번에 소형사들이 자기 모델이 요율 인하로부터 스스로를 지켜 준다고 말한 것을 나란히 놓는다."},{"claim":"다만 Medicare Advantage에서의 성공이 투자자에게 내세울 유일한 서사인 소형 상장사라면 그것을 해낼 수 있다는 자신감을 표현할 수밖에 없다.","evidence":"근거를 대지 않았다."},{"claim":"CMS 지도부라면 이 실적 발표에서 인용구를 잘라내며 '다들 뭘 그렇게 화내는 거지'라고 말하고 있을 것이다.","evidence":"CMS 지도부가 다른 자리에서 경쟁을 늘리기 위해 '인서전트' 모델을 지원한다는 구상을 공개적으로 논해 왔다는 점을 든다."}],"experts":[{"who":"Andrew Toy","role":"MA 플랜을 운영하는 상장사 Clover Health의 CEO","claim":"Advance Notice의 트렌드는 사실 어느 정도 합리적이며, 레이트가 조금 위로 움직일 가능성도 있지만 거기에 기대고 있지는 않다.","evidence":"CMS가 낭비와 남용을 걷어내고 더 최근의 데이터를 보는 등 여러 조치를 했다는 점을 근거로 든다."}],"cases":[],"notes":[{"term":"트렌드와 벤치마크 레이트","ko":"진료비 상승 추정치와 그에 따른 기준 지급액","plain":"트렌드는 내년에 진료비가 얼마나 오를지에 대한 추정치이고, 벤치마크 레이트는 그 추정을 반영해 CMS가 가입자 한 명당 지급하기로 정한 기준 금액이다. 트렌드가 실제 진료비 상승보다 낮게 잡히면 플랜의 이익이 그만큼 줄어들기 때문에, 업계는 이 숫자 하나에 매달린다."}]},{"heading_ko":"ChatGPT Health, 트리아지 시험에서 고전","heading_en":"What I'm Reading","skip":null,"summary":"Mount Sinai 연구진이 Nature Medicine에 낸 연구로, ChatGPT Health가 임상 증례에 어떻게 답하는지를 구조화해 시험한 결과 우려가 확인됐다는 내용이다. 필자는 그 위험을 인정하면서도 자신은 계속 쓰겠다고 덧붙인다.","insight":"우리 앱에 건강 질문 창구를 붙인다면 차별점은 모델 성능이 아니라 두 가지다. 하나는 유저의 걸음과 기록을 이미 갖고 있어 같은 질문에도 그 사람에 맞춘 답을 줄 수 있다는 점이고, 다른 하나는 위험 신호가 보이면 답을 멈추고 어디로 가야 하는지로 넘기는 보수적인 처리다. 이 연구가 짚어 낸 실패 사례들이 그 보수적 처리를 어디에 걸어야 하는지에 대한 명세가 된다.","signal":"미국 소비자가 병원에 가기 전에 AI에게 먼저 물어보는 행동이 이미 흔해졌다는 것을 보여 주는 자리다. 규모를 보여 주는 수치는 원문에 없지만, 임상 연구가 나올 만큼 이 행동이 퍼졌다는 사실 자체와, 위험을 다 읽은 필자조차 아이가 독감인지 계속 물어보겠다고 적는다는 점이 방향을 말해 준다.","author":[{"claim":"그 위험이 있다는 것은 분명하지만, 그래도 아이가 독감인지 ChatGPT Health에 계속 물어보겠다.","evidence":"근거를 대지 않았다."}],"experts":[{"who":"Ashwin Ramaswamy 외 Mount Sinai 연구진","role":"Nature Medicine에 논문을 낸 병원 소속 연구자들","claim":"ChatGPT Health가 임상 증례에 응답한 내용에 우려가 있으며, 일부 임상의는 그것이 '불필요한 위해와 사망으로 충분히 이어질 수 있다'고 걱정했다.","evidence":"일련의 임상 증례를 놓고 트리아지 권고를 구조화해 시험한 결과를 근거로 든다."}],"cases":[{"name":"ChatGPT Health 트리아지 시험 연구","what":"Mount Sinai 연구진이 일반 이용자가 쓰는 AI 건강 서비스에 임상 증례를 주고 어떤 트리아지 권고를 하는지 시험해 Nature Medicine에 발표했다.","scale":"","note":"일반인이 쓰는 AI 건강 상담이 학술지에서 임상 시험 대상이 되었다는 것 자체가 이 행동의 규모를 방증한다.","sells_to":"none"}],"notes":[{"term":"트리아지(triage)","ko":"지금 어디로 가야 하는지 가르는 판단","plain":"증상을 듣고 지금 응급실로 가야 하는지, 며칠 안에 진료를 보면 되는지, 집에서 지켜봐도 되는지를 가르는 판단이다. 의료에서 가장 먼저 이뤄지는 갈림길이고, 여기서 틀리면 곧바로 사람이 다친다. 이 연구가 시험한 것이 진단이 아니라 바로 이 판단이다."},{"term":"임상 증례(clinical vignette)","ko":"시험용으로 만든 가상 환자 사례","plain":"나이와 증상, 병력을 정해 놓은 가상의 환자 사례를 말한다. 실제 환자를 대상으로 시험할 수 없을 때, 같은 사례를 여러 대상에게 똑같이 제시해 답을 비교하는 방식으로 쓴다. 그래서 결과가 실제 진료 상황과 얼마나 같은지는 따로 따져 봐야 한다."}]},{"heading_ko":"세이프티넷에서의 AI와 인력","heading_en":"What I'm Reading","skip":null,"summary":"세이프티넷 환경에서 AI 도입을 검토할 때 고려해야 할 인력 문제를 짚은 게스트 기고 소개다. 몇 주 전 실린 다른 기고 위에 얹히는 글이라고 필자가 자리매김한다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Janine Kundsen, Soshanah Brown","role":"이 뉴스레터에 게스트로 기고한 필자들","claim":"세이프티넷 환경에서 AI 도입을 검토할 때는 인력과 관련한 사안들을 함께 고려해야 한다.","evidence":"원문은 기고의 주제만 소개하고, 근거는 전하지 않는다."}],"cases":[],"notes":[{"term":"세이프티넷(safety net)","ko":"보험 없는 환자를 주로 보는 공공 의료","plain":"보험이 없거나 Medicaid만 가진 환자를 주로 보는 공공병원과 지역 클리닉을 가리킨다. 재정이 빠듯하고 인력도 부족해서, 새 기술을 들일 때의 조건이 여유 있는 병원과 전혀 다르다. 미국에서 의료 접근성을 이야기할 때 늘 등장하는 자리다."}]},{"heading_ko":"ARPA-H HEROS: 한 걸음 나아가고 한 걸음 물러서다","heading_en":"What I'm Reading","skip":null,"summary":"연방 연구 기관 ARPA-H의 HEROS 프로그램을 다룬 Health Affairs 기고 소개다. 성과 기반 모델이 연방 재정 방향이 바뀌면서 끊긴 또 하나의 사례로 읽힌다는 것이 요지다.","insight":null,"signal":null,"author":[{"claim":"이런 흥미로운 프로그램들이 시작과 중단을 반복하는 것은 진짜 난제로 보이며, 무엇이 답인지는 잘 모르겠다.","evidence":"HEROS가 연방 재정의 조류 변화로 끊긴 사례라는 점을 근거로 든다."}],"experts":[{"who":"Darshak Sanghavi, Jake Segal, Caroline Whistler","role":"Health Affairs에 이 글을 쓴 필자들","claim":"ARPA-H의 HEROS는 흥미로운 성과 기반 모델이었으나 연방 재정의 방향이 바뀌면서 끊겼다.","evidence":"원문은 글의 요지만 전하고, 근거는 소개하지 않는다."}],"cases":[{"name":"ARPA-H HEROS 프로그램 중단","what":"연방정부의 고위험 보건 연구 기관이 운영하던 성과 기반 프로그램이 재정 방향 변화로 끊겼다.","scale":"","note":"미국에서는 좋은 실험 프로그램도 정권과 예산이 바뀌면 통째로 사라진다는 점을 보여 주는 사례다.","sells_to":"none"}],"notes":[{"term":"ARPA-H","ko":"미국 보건 고위험 연구 기관","plain":"미국 연방정부가 실패 위험이 크지만 성공하면 크게 바뀌는 보건 연구에 돈을 대려고 만든 기관이다. 국방 분야의 DARPA를 보건에 옮겨 놓은 조직이라고 보면 된다. 예산이 정치 상황에 직접 묶여 있어, 정권이 바뀌면 진행 중인 프로그램이 통째로 끊길 수 있다."}]},{"heading_ko":"Accountable Health Communities 최종 평가","heading_en":"What I'm Reading","skip":null,"summary":"CMMI가 Accountable Health Communities 모델의 최종 평가 보고서를 냈다는 소식이다. 요약본은 '건강의 상류 동인'에 집중하면 입원과 응급실 이용을 줄이면서 비용 절감으로도 이어질 수 있음을 시사한다.","insight":"상류 동인을 다루는 방식은 대개 몇 가지 질문으로 먹을 것과 살 곳, 교통 같은 생활 문제를 찾아낸 뒤 그 사람을 지역 자원에 연결해 주는 것이다. 진료 행위가 아니라 문진과 연결이므로 앱 화면에서 소프트웨어 인력만으로 만들 수 있다. 미국 유저에게는 병원비보다 먼저 막히는 것이 이런 생활 문제인 경우가 많아 현금 리워드와 겹치지 않는 건강 가치가 되며, 3개월 안의 진짜 과제는 기능 구현이 아니라 연결할 지역 자원 목록을 어디서 가져오는가다.","signal":null,"author":[],"experts":[{"who":"RTI International","role":"CMMI의 의뢰로 이 모델을 평가한 연구 기관","claim":"'건강의 상류 동인'에 집중하면 입원과 응급실 이용을 줄이면서 비용 절감으로도 이어질 수 있다.","evidence":"모델 최종 평가 보고서의 결과를 근거로 들며, 필자는 요약본이 결과를 잘 개괄해 준다고만 전한다."}],"cases":[{"name":"Accountable Health Communities 모델 최종 평가 보고서","what":"CMMI가 운영한 이 모델의 최종 평가 결과가 공개됐다.","scale":"","note":"정부가 직접 돈을 대고 결과를 검증한 자료라, 상류 동인 접근의 효과를 주장할 때 인용할 수 있는 근거가 된다.","sells_to":"none"}],"notes":[{"term":"건강의 상류 동인(upstream drivers of health)","ko":"병이 되기 전 단계의 생활 조건","plain":"진료실 안이 아니라 그 바깥에서 건강을 좌우하는 생활 조건을 말한다. 먹을 것이 있는지, 살 곳이 안정적인지, 병원까지 갈 교통이 있는지, 난방비를 낼 수 있는지 같은 것들이다. 이것이 무너지면 결국 응급실 방문과 입원으로 되돌아오기 때문에, 미국에서는 보험사와 정부가 여기에 돈을 쓰는 것이 오히려 남는 장사인지를 계속 시험해 왔다."}]},{"heading_ko":"Massachusetts: 상업 청구의 20.4%가 거절됐다","heading_en":"What I'm Reading","skip":null,"summary":"Massachusetts 보건정책위원회가 주 안의 완전보험형 상업 플랜 데이터를 살펴본 결과를 담은 보고서다. 2024년 보험사들이 상업 청구의 평균 20.4%를 거절했다는 한 줄이 핵심이다.","insight":"청구 다섯 건 중 한 건이 거절된다는 것은, 미국 유저 상당수가 왜 이 돈을 내라는지 모르겠는 종이를 이미 손에 들고 있다는 뜻이다. 거절 통지서나 보험 안내문을 찍어 올리면 무엇이 왜 거절됐는지 풀어 주고 이의신청 문서 초안까지 만들어 주는 기능은, 진료를 대신하지 않으므로 규제를 건드리지 않고 3개월 안에 만들 수 있다. 성공했을 때 유저가 실제로 돈을 아끼는 것이 눈에 보인다는 점에서 현금 리워드와 성격이 다른 가치가 된다.","signal":null,"author":[],"experts":[],"cases":[{"name":"Massachusetts Health Policy Commission 보고서","what":"주 정책기관이 완전보험형 상업 플랜의 청구 데이터를 분석해 거절 비율을 공개했다.","scale":"2024년 상업 청구 평균 거절률 20.4%","note":"완전보험형만 본 수치라 자가보험 가입자가 많은 대기업 직원까지 그대로 대표하지는 않는다.","sells_to":"none"}],"notes":[{"term":"청구 거절(claim denial)","ko":"보험사가 청구를 받아 주지 않는 것","plain":"병원이 보험사에 낸 청구를 보험사가 지급하지 않고 되돌려 보내는 것이다. 서류 오류부터 사전 승인 누락, 의학적 필요성 불인정까지 이유가 다양하다. 병원이 고쳐서 다시 넣으면 통과되기도 하지만, 그러지 못하면 그 금액이 환자 본인 부담으로 넘어오는 일이 잦다. 한국은 심사평가원이 단일 기준으로 심사하므로 환자가 이 과정을 볼 일이 거의 없다."},{"term":"완전보험형(fully-insured)","ko":"회사가 보험료를 내고 위험은 보험사가 지는 방식","plain":"회사가 보험사에 보험료를 내면 직원 진료비의 위험은 보험사가 떠안는 방식이다. 반대는 회사가 직원 진료비를 직접 부담하고 보험사는 관리만 대행하는 자가보험이며, 미국 대기업 직원 상당수가 이쪽에 속한다. 이번 데이터는 완전보험형만 본 것이라 전체 시장을 그대로 대표하지는 않는다."}]},{"heading_ko":"a16z: 선제적 케어가 지출을 줄일까","heading_en":"What I'm Reading","skip":null,"summary":"벤처캐피털 a16z 팀이 임상 AI의 미래를 낙관적으로 그린 글을 소개하고, 필자가 어디에 동의하고 어디에 반대하는지 밝히는 자리다. 쟁점은 선제적 케어가 늘면 헬스케어 지출이 줄어드는가, 아니면 오히려 늘어나는가다.","insight":null,"signal":null,"author":[{"claim":"이 전환을 거치면서 GDP 대비 헬스케어 지출 비중이 떨어질 것이라는 차트에는 이견이 있으며, 그 반대가 일어난다는 데 가볍게 걸겠다.","evidence":"근거를 대지 않았다."},{"claim":"앞으로 몇 년간 업계의 더 큰 논쟁거리는 이 선제적 케어의 물결 가운데 실제로 달러당 더 나은 건강으로 이어지는 것이 얼마나 되는가다.","evidence":"근거를 대지 않았으며, 쓴 돈당 더 많은 건강을 얻는다면 지출이 늘어도 좋은 일일 수 있다는 단서를 함께 단다."}],"experts":[{"who":"Jay Rughani, Jane Rhee, Julie Yoo","role":"헬스케어에 투자하는 벤처캐피털 a16z의 투자자들","claim":"선제적 케어가 늘면 사후 대응적 케어가 줄어들고, 그 결과 '우리가 지금까지 만든 그 어떤 것보다 달러당 더 많은 건강'을 전달하는 시스템이 된다.","evidence":"원문은 글의 주장과 차트의 존재만 전하고, 근거로 든 데이터는 소개하지 않는다."}],"cases":[],"notes":[]}],"themes":["medicare-advantage","value-based-care","market-earnings","digital-health-funding","consumer-dtc","ai-clinical"],"for_later":[]},{"index":"20","date":"2026-03-08","type":"reads","title_en":"Weekly Health Tech Reads 3/8/26","title_ko":"400만 달러 치료제와 응급실 청구서","hook":"한 건에 400만 달러짜리 치료제가 밀려오는 사이, 응급실 한 곳은 중재 제도로 값을 열 배 받아 냈다.","tldr":[{"point":"필자는 세포·유전자 치료제를 앞으로 10년의 가장 큰 주제로 보는데, 지금 시장에 나온 치료제는 한 건에 100만~400만 달러이고 승인된 것은 30개뿐인 반면 개발 중인 유전자 치료제는 4,000개다. 미주리주의 한 비영리 헬스 시스템은 자기 직원의 쌍둥이에게 필요한 420만 달러짜리 치료를 자가보험 플랜에 미칠 부담 때문에 거절했다가 CEO가 살해 협박을 받았고, 결국 주 Medicaid 기관이 그 비용을 냈다.","note":"미국은 직원 의료비를 보험사에 맡기지 않고 회사가 직접 부담하는 자가보험 플랜이 흔해서, 직원 5,000명 규모 회사에서도 치료 한 건이 플랜 전체를 흔든다."},{"point":"CMS 리더 Chris Klomp은 영상의학 AI를 기존 청구 코드에 시간 단위로 올리려던 창업자에게 그렇게 하면 그 코드를 일부러 없애 버리겠다고 답했다고 밝히면서, 헬스케어에 디플레이션적 지불 메커니즘이 필요하다고 말했다.","note":"미국 공보험은 진료 행위마다 시간과 상대가치를 기준으로 값을 매겨 왔는데, AI는 시간이 아니라 연산량으로 움직이므로 기존 값 매기는 방식에 그대로 얹으면 비용이 내려가지 않는다."},{"point":"GLP-1을 둘러싼 소비자 쪽 소식이 한 주에 몰렸다. Hims는 Novo Nordisk의 브랜드 체중 감량 약을 팔게 된다는 보도에 금요일 장 마감 후 40% 뛰었고, Omada는 GLP-1을 쓰는 회원이 2024년 말 5만 명에서 15만 명으로 늘었다고 밝혔으며, FDA는 컴파운딩 GLP-1을 불법으로 마케팅했다는 이유로 텔레헬스 기업 30곳에 경고 서한을 보냈다.","note":"Novo는 올해 초 Hims를 상대로 소송을 냈고 작년에는 기만적 마케팅이라고 비난했으며 그전에 맺었던 파트너십에서도 발을 뺐는데, 그러고도 다시 협상 테이블로 돌아왔다."},{"point":"아이다호주 Post Falls에서 Nutex Health가 운영하는 응급실 한 곳이 No Surprises Act 중재 절차에 월 280건의 클레임을 넣는 동안 나머지 39개 응급실은 다 합쳐 월 14건을 넣었고, 주 의회는 이를 막는 법안을 위원회에서 통과시켰다. 같은 주에 Nutex는 5,500만 달러 규모의 중재 클레임이 자격 없음으로 판정되면서 주가가 한때 40% 떨어졌다.","note":"No Surprises Act는 환자가 네트워크 밖 응급실을 이용해도 네트워크 안 수준만 부담하게 하고 남은 금액은 병원과 보험사가 중재로 정하게 했는데, 그 중재 창구에 클레임을 쏟아붓는 것이 병원 쪽 수익 전략이 됐다."},{"point":"CMS는 리스크 어저스트먼트 데이터를 USB 드라이브에 담아 우편으로 보내 온 Elevance에 제재 서한을 발부해 45개 계약의 신규 가입을 동결했고, Elevance는 주간 8% 하락으로 시가총액 약 60억 달러가 증발했다. 같은 회차에 실린 Blue Health Intelligence 분석은 상업 보험 입원 청구에서 코딩 인텐시티 증가가 병원의 10%에서만 나왔다는 것을 보여 준다.","note":"미국은 환자를 무겁게 기록할수록 보험사와 병원이 받는 금액이 커지는 구조라, 진단 데이터를 어떻게 다루느냐가 곧바로 매출 문제가 된다."},{"point":"의학 정보 검색 서비스 OpenEvidence가 학술 출판사 Wiley와 5년, 수백만 달러 규모의 콘텐츠 계약을 맺고 Wiley에 지분까지 주었는데, CEO Daniel Nadler는 자사의 핵심 혁신을 AI Napster로 가득한 시장 속의 Spotify로 본다고 말했다.","note":"Napster는 음원을 무단으로 나눠 쓰다 소송으로 문을 닫았고, Spotify는 권리자에게 돈을 내고 같은 음악을 합법으로 유통해 살아남은 회사다."}],"issue_insight":{"verdict":"yes","summary":"33개 꼭지 가운데 대부분은 병원과 보험사, 주 정부 사이의 돈 이야기여서 소비자 앱 화면으로 옮길 것이 없다. 미국 소비자가 직접 등장하는 자리는 사실상 GLP-1 하나이며, 3개월 안에 시험해 볼 만한 것은 GLP-1 사용자 동반 기록과 소화기 증상 일지 두 갈래다.","build":[{"title":"GLP-1 사용자 동반 기록","detail":"약을 팔지 않고 투약 요일과 몸 상태만 기록하게 하면 규제 허가 없이 소프트웨어만으로 만들 수 있고, 이미 매일 받고 있는 걸음과 식단 데이터를 붙여 주사 시작 전후를 대조해 보여 줄 수 있다. Omada가 밝힌 회원 증가는 이 수요가 1년 만에 3배로 커졌다는 것을 보여 준다.","section":8},{"title":"소화기 증상과 유발 음식 일지","detail":"PHTI가 평가한 버추얼 소화기 제품 가운데 임상의가 붙지 않는 랩어라운드형은 증상 기록과 식단 기록을 잇는 구조여서, 식단 기록이 이미 있는 앱이라면 증상 입력 화면과 되짚어 보기 화면만 더하면 된다. 다만 PHTI의 평가 대상은 고용주와 보험사가 사는 제품이라, 소비자가 스스로 쓸지는 이 자료만으로 알 수 없다.","section":26}],"signal":[{"title":"체중 감량 약을 사는 통로가 앱 화면 쪽으로 옮겨 간다","detail":"소송까지 걸었던 제약사가 소비자 직접 판매 회사에 다시 돌아왔다는 보도만으로 Hims 주가가 하룻밤에 40% 움직였다. 브랜드 약을 파는 쪽에서도 소비자 접점을 쥔 채널의 값을 그만큼 높게 본다는 뜻이다.","section":7},{"title":"약보다 계속 쓰게 돕는 서비스가 1년에 3배로 커졌다","detail":"Omada는 GLP-1을 쓰는 회원이 2024년 말 5만 명에서 15만 명으로 늘었다고 밝혔고, 새 GLP-1 상품은 아직 2026년 가이던스에 넣지도 않았다고 했다. 다만 이 회원들의 비용은 고용주가 내므로 소비자가 직접 지갑을 여는 규모는 이 숫자로 알 수 없다.","section":8},{"title":"승인 절차 밖의 GLP-1을 파는 업체가 한 번에 30곳 경고를 받을 만큼 많다","detail":"FDA가 컴파운딩 GLP-1의 불법 마케팅을 이유로 텔레헬스 기업 30곳에 경고 서한을 보냈다. 정식 승인 경로 밖에서 약을 사는 수요가 규제 기관이 일괄 대응할 만큼 커져 있다는 신호이며, 동시에 앱이 약을 권하는 형태로 기능을 만들면 같은 규제 위험에 들어간다는 뜻이기도 하다.","section":17}]},"sections":[{"heading_ko":"인사말","heading_en":"","skip":"admin","summary":"이번 주에 다룰 주제를 예고하는 짧은 인사다. 태평양 북서부의 응급실 분쟁 두 건과 세포·유전자 치료제 이야기를 중심에 둔다고 밝힌다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"세포·유전자 치료제의 물결에 대비하는 주 정부와 스타트업","heading_en":"MUSING: Startups and states preparing for the coming \"tsunami\" of pharma innovation","skip":null,"summary":"이 회차의 중심 글이다. 필자는 한 건에 100만~400만 달러인 세포·유전자 치료제가 앞으로 10년 미국 헬스케어의 가장 큰 비용 주제가 될 것으로 보고, 지금 이미 벌어지고 있는 일 하나와 앞으로 필요한 준비 하나를 나란히 놓는다. 벌어진 일은 자가보험 플랜을 운영하는 고용주가 직원 가족의 치료를 거절했다가 주 정부가 대신 떠안게 된 사건이고, 준비는 주 Medicaid 기관과 스타트업이 이 치료제를 감당할 운영 체계를 만드는 일이다. 소비자가 무엇을 사는 이야기가 아니라 비용을 누가 떠안는지에 관한 이야기다.","insight":null,"signal":null,"author":[{"claim":"앞으로 10년간 제약 혁신, 그중에서도 세포·유전자 치료제를 아주 많이 이야기하게 될 것이다.","evidence":"y축이 없는 Cigna 2024 투자자 발표 슬라이드와, 치료 한 건당 100만~400만 달러라는 현재 시장 가격을 근거로 든다."},{"claim":"지금 이런 이야기가 나오는 것이 놀라운 이유는 생명을 구하는 치료제가 아직 몇 개뿐인 시점이기 때문이다.","evidence":"FDA 승인 30개 대비 개발 중인 유전자 치료제 4,000개라는 숫자를 든다."},{"claim":"자원 제약을 감안하면 이 영역은 민관 협력이 꽃필 만한 논리적인 자리로 보인다.","evidence":"대담에서 들은 인프라 변화의 규모를 언급할 뿐, 수치로 된 근거를 따로 대지는 않았다."}],"experts":[{"who":"Jonathan Gruber","role":"Obamacare 설계에 참여한 경제학자로, 60 Minutes 방송에서 인용된 발언이다.","claim":"이것을 다가오는 쓰나미에 비유하며, 기본적으로 고용주 기반 헬스케어 시스템을 압도하게 될 것이라고 말했다.","evidence":"근거를 대지 않았다."}],"cases":[{"name":"Mosaic Life Care","what":"미주리주의 직원 5,000명 규모 비영리 헬스 시스템이다. 자가보험 플랜에 미칠 비용 부담을 이유로 한 직원의 쌍둥이에 대한 세포·유전자 치료 보장을 거절했다가, 직원이 이를 공개하면서 CEO가 살해 협박을 받았고 CEO는 주 Medicaid 기관에 호소해 그 기관이 비용을 냈다.","scale":"치료 비용 420만 달러, 직원 5,000명","note":"고용주가 거절한 비용이 결국 주 정부로 넘어갔다는 대목이 이 사건의 핵심이다.","sells_to":"payer"},{"name":"Cigna 2024 Investor Presentation","what":"보험·약제비 관리 사업을 하는 Cigna가 2024년에서 2034년 사이 총 케어 비용이 GLP-1과 세포·유전자 치료제 지출 때문에 크게 늘 것이라고 전망한 슬라이드다.","scale":"","note":"필자 스스로 y축이 없는 차트라고 밝혔으므로 증가 폭의 절대값은 알 수 없다.","sells_to":"employer"},{"name":"Aradigm","what":"Will Shrank이 이끄는 스타트업으로, 세포·유전자 치료제를 전달하는 데 얽힌 금융과 케어 딜리버리 문제를 다루기 위한 카브아웃 모델을 만들고 있다.","scale":"","note":"카브아웃은 특정 치료 영역만 따로 떼어 별도 계약과 별도 비용 구조로 운영하는 방식을 가리킨다.","sells_to":"payer"},{"name":"NexCure","what":"CAR-T 치료를 제공하는 클리닉 네트워크를 만들겠다며 자금을 조달한 스타트업이다. 보도자료에서 미국 병원 6,100곳 가운데 CAR-T를 시행할 수 있는 곳은 200곳, 곧 3%뿐이라고 밝혔다.","scale":"6,100곳 중 200곳(3%)","note":"치료제가 승인돼도 시행할 수 있는 시설이 없으면 환자에게 닿지 않는다는 점을 보여 준다.","sells_to":"payer"},{"name":"Louisiana Department of Health","what":"Bruce Greenstein이 이끄는 주 보건 당국으로, 세포·유전자 치료제 도입에 필요한 운영 체계를 앞서 준비하고 있는 사례로 소개된다.","scale":"","note":"원문에는 이 대담에서 나온 구체적인 발언이 인용돼 있지 않다.","sells_to":"other"}],"notes":[{"term":"Cell and Gene Therapies (CGT)","ko":"세포·유전자 치료제","plain":"환자의 세포나 유전자를 직접 고쳐 병의 원인을 한 번에 없애려는 치료제다. 매일 먹는 약과 달리 대개 한 번 투여로 끝나지만, 그 한 번의 값이 100만~400만 달러다. 한국은 전 국민이 하나의 건강보험에 묶여 있어 이런 비용이 전체 가입자에게 분산되지만, 미국은 회사별 플랜과 주별 Medicaid로 위험이 잘게 쪼개져 있어 한 건이 특정 집단을 무너뜨릴 수 있다."},{"term":"self-insured plan","ko":"자가보험 플랜","plain":"회사가 보험사에 보험료를 내고 위험을 넘기는 대신, 직원의 의료비를 회사 돈으로 직접 지급하는 방식이다. 보험사는 청구 처리 같은 관리 업무만 대행한다. 평소에는 회사가 비용을 아낄 수 있지만, 초고액 치료가 한 건 발생하면 그 부담이 곧바로 회사 재무로 들어온다. 한국에는 이에 해당하는 제도가 없다."},{"term":"Medicaid","ko":"메디케이드","plain":"저소득층을 대상으로 하는 미국의 공공 의료 보장 제도이며, 연방과 주가 함께 돈을 대고 실제 운영은 주 정부가 맡는다. 그래서 주마다 보장 범위와 지급 방식이 다르다. 이 꼭지에서 고용주가 거절한 치료비를 결국 주 Medicaid 기관이 부담했다는 것은, 민간이 감당하지 못한 비용이 공공으로 넘어간다는 뜻이다."},{"term":"CAR-T","ko":"카티 세포 치료","plain":"환자의 면역세포를 몸 밖으로 꺼내 암세포를 공격하도록 유전자를 바꾼 뒤 다시 넣는 치료다. 세포를 다루는 특수 시설과 부작용을 관리할 인력이 필요해서 아무 병원에서나 할 수 없고, 그래서 미국 병원의 3%만 시행할 수 있다."}]},{"heading_ko":"AI를 어떤 방식으로 지불할 것인가에 대한 CMS의 시각","heading_en":"QUOTE OF THE WEEK: The CMS perspective on AI's deflationary potential","skip":null,"summary":"미국 공보험을 운영하는 연방 기관 CMS의 리더가 업계 행사에서 한 발언을 옮긴 자리다. 요지는 AI를 기존 청구 코드에 얹어 시간 단위로 값을 받으려 하면 비용이 내려가지 않으니, 지불 방식 자체를 바꿔야 한다는 것이다. 필자는 여기서 CMS가 지불 수준과 업계의 이익 규모를 어떻게 보고 있는지 읽어 낼 수 있다고 본다. 병원과 정부 사이의 값 매기는 방식에 관한 이야기이며 소비자는 등장하지 않는다.","insight":null,"signal":null,"author":[{"claim":"이 발언에서 CMS 리더십이 지불 수준과 이익 풀을 어떻게 생각하고 있는지 추론해 낼 것이 많다.","evidence":"인용한 발언 자체를 근거로 삼는다."},{"claim":"그 입장과 혁신·경쟁을 지원하는 일 사이의 긴장은 분명하다.","evidence":"Kintsugi의 최근 포스트모템이 짚은 두 가지, 곧 높은 규제 자본 요건과 벤처 투자자들이 기대하는 매출 성장 곡선을 근거로 든다."}],"experts":[{"who":"Chris Klomp","role":"미국 공보험을 운영하는 연방 기관 CMS의 리더로, 지불 규칙을 정하는 쪽에 서 있는 정부 인사다.","claim":"헬스케어에는 디플레이션적 지불 메커니즘이 필요하며, AI를 기존의 시간 기반 청구 코드에 얹으려 한다면 그 코드를 일부러 없애겠다고 답했다고 말했다.","evidence":"지금 헬스케어의 대부분이 오리지널 Medicare 수가표와 벤치마크에 연동돼 있고 그것이 시간에 기반한 구성물이라는 점, 그리고 영상의학 AI 창업자와 나눈 대화를 근거로 든다."}],"cases":[{"name":"Better Medicare Alliance Executive Policy Summit","what":"메디케어 어드밴티지 업계 단체가 연 정책 행사로, CMS 리더 Chris Klomp과 John Brooks가 화요일에 여기서 업계를 향해 발언했다.","scale":"","note":"두 사람은 MA Advance Notice에 달린 약 47,000건의 의견을 읽던 중에 이 자리에 왔다고 소개된다.","sells_to":"other"},{"name":"Kintsugi 포스트모템","what":"사업을 접은 회사가 그 과정을 정리해 공개한 글이며, 규제가 요구하는 자본 부담은 큰데 투자자는 빠른 매출 성장을 기대한다는 어긋남을 짚었다고 소개된다.","scale":"","note":"필자는 이 글을 CMS의 입장과 혁신 지원 사이의 긴장을 보여 주는 사례로 인용한다.","sells_to":"none"}],"notes":[{"term":"Medicare Advantage (MA) / Advance Notice","ko":"메디케어 어드밴티지 / 사전 통지","plain":"메디케어는 65세 이상을 위한 미국 공보험이고, 메디케어 어드밴티지는 그 보장을 민간 보험사가 대신 운영하는 방식이다. 정부는 가입자 한 명당 일정 금액을 보험사에 매달 지급한다. Advance Notice는 다음 해에 그 금액을 어떻게 정할지 CMS가 미리 알리는 문서이며, 업계 전체의 수익이 여기에 달려 있어 의견이 수만 건씩 달린다."},{"term":"fee schedule / relative value unit / conversion factor","ko":"수가표 / 상대가치단위 / 환산지수","plain":"미국 공보험이 진료 하나하나에 값을 매기는 방식이다. 먼저 진료 행위마다 품이 얼마나 드는지를 상대가치단위라는 점수로 매기고, 거기에 환산지수라는 금액을 곱해 실제 지급액을 정한다. 점수의 상당 부분이 사람이 쓴 시간을 기준으로 짜여 있어서, 사람의 시간을 쓰지 않는 AI에는 잘 맞지 않는다. 한국의 상대가치점수와 환산지수 제도와 구조가 비슷하다."},{"term":"CPT code","ko":"진료 행위 청구 코드","plain":"의사가 무엇을 했는지를 나타내는 표준 코드로, 청구서에 이 코드를 적어야 돈을 받는다. 코드마다 값이 정해져 있고, 어떤 코드는 15분 같은 시간 단위로 여러 번 청구할 수 있게 돼 있다. 발언에 나온 창업자는 AI가 한 일을 그 시간 단위 코드로 두 단위 청구해도 되겠느냐고 물은 것이다."},{"term":"CMMI","ko":"CMS 산하 혁신 조직","plain":"CMS 안에서 새로운 지불 방식을 설계하고 시범 사업으로 돌려 보는 조직이다. 기존 수가표를 그대로 두고는 바꿀 수 없는 지불 구조를 실험하는 자리이며, 이 회차 뒤쪽에 나오는 ACCESS 모델과 LEAD 모델도 이 조직이 만든 것이다."}]},{"heading_ko":"Elevance가 한 주에 잃은 60억 달러","heading_en":"A NUMBER TO PONDER","skip":null,"summary":"대형 보험사 Elevance가 CMS 제재를 받아 45개 계약의 신규 가입이 동결됐고, 그 결과 주가가 한 주에 약 8% 빠져 시가총액 60억 달러가 사라졌다는 소식이다. 문제가 된 것은 가입자의 건강 상태 데이터를 CMS에 전달하던 방식이다. 보험사와 정부 사이의 규제 문제이며 소비자 쪽으로 이어지는 대목은 없다.","insight":null,"signal":null,"author":[{"claim":"CMS와 Elevance가 말하는 시기가 어긋나는 것이 Elevance에 유리할지 불리할지는 판단하기 어렵다.","evidence":"CMS는 2025년 10월까지도 계속됐다고 시사하는 반면 Elevance는 8-K에서 2023년에 관행을 바꿨다고 밝힌 점을 나란히 놓는다."}],"experts":[],"cases":[{"name":"Elevance","what":"대형 건강보험 회사로, 리스크 어저스트먼트 데이터를 USB 드라이브에 담아 우편으로 보내 온 관행 때문에 CMS로부터 2026년 3월 31일 자로 45개 계약의 신규 가입을 동결하는 제재 서한을 받았다.","scale":"45개 계약 가입 동결, 주간 주가 약 8% 하락, 시가총액 약 60억 달러 감소","note":"문제는 2018년까지 거슬러 올라가며, 2027년 가입 시즌 전에 고칠 시간은 남아 있다고 필자는 본다.","sells_to":"mixed"}],"notes":[{"term":"risk adjustment","ko":"리스크 어저스트먼트","plain":"메디케어 어드밴티지에서 정부가 보험사에 주는 금액은 가입자가 얼마나 아픈지에 따라 달라진다. 아픈 사람을 많이 받은 보험사가 손해 보지 않게 하려는 장치이지만, 반대로 진단을 최대한 많이 붙일 유인도 함께 생긴다. 그래서 보험사가 CMS에 넘기는 진단 데이터는 감독의 초점이 되며, 원문은 USB 발송의 무엇이 정확히 문제였는지까지는 밝히지 않았다."},{"term":"enrollment freeze","ko":"신규 가입 동결 제재","plain":"보험사가 새 가입자를 받지 못하게 막는 제재다. 기존 가입자는 유지되지만 매년 정해진 가입 기간에만 가입자가 움직이는 미국 구조에서는, 한 시즌을 통째로 놓치면 그해 성장이 사라진다. 벌금보다 타격이 크기 때문에 주가가 즉시 반응한다."}]},{"heading_ko":"코딩 인텐시티 증가를 이끈 병원 10%","heading_en":"CHART OF THE WEEK: Blue's view into AI-driven upcoding coding intensity increases","skip":null,"summary":"Blue Health Intelligence가 BCBS 상업 보험의 입원 청구를 분석해, 환자를 무겁게 기록하는 경향이 어디에서 나왔는지 본 차트다. 결론은 병원 전체가 아니라 상위 10%의 병원에서만 급격히 늘었고 나머지 90%는 평탄했다는 것이다. 병원이 받는 금액을 좌우하는 청구 기록 문제이며 소비자와 직접 이어지지 않는다.","insight":null,"signal":null,"author":[{"claim":"소제목에서 이 변화를 AI가 이끈 업코딩이라고 부른다.","evidence":"제시된 근거는 복합 입원 비율 추이 차트뿐이며, AI가 원인이라는 직접적인 증거는 원문에 제시되지 않았다."}],"experts":[],"cases":[{"name":"Blue Health Intelligence","what":"BCBS 계열의 상업 보험 입원 클레임을 분석해 병원의 코딩 인텐시티 변화를 평가했다. 상위 10% 병원의 복합 입원 비율이 2022년 2분기 46.8%에서 2025년 1분기 59.8%로 올랐고 나머지 90%는 평탄했다.","scale":"상위 10% 병원 46.8% → 59.8%, 2022년 2분기~2025년 1분기","note":"같은 기간 나머지 병원이 평탄했다는 점이, 환자가 실제로 더 위중해진 것이라는 해석을 약하게 만든다.","sells_to":"payer"}],"notes":[{"term":"coding intensity / upcoding","ko":"코딩 인텐시티 / 업코딩","plain":"미국 병원은 입원 환자의 상태를 어떤 진단 코드로 기록하느냐에 따라 받는 금액이 달라진다. 같은 환자라도 합병증이 있다고 기록하면 더 무거운 분류로 들어가 지급액이 커진다. 코딩 인텐시티는 그 기록이 얼마나 무거워졌는지를 뜻하고, 업코딩은 실제보다 무겁게 붙였다는 혐의를 담은 말이다. 한국의 포괄수가제에서도 같은 구조의 문제가 생길 수 있지만, 미국은 병원마다 가격 자체가 달라 금액 차이가 훨씬 크다."}]},{"heading_ko":"태평양 북서부 응급실 두 곳의 분쟁","heading_en":"NEWS: The drama of emergency departments in the Pacific Northwest","skip":null,"summary":"성격이 전혀 다른 응급실 분쟁 두 건을 나란히 놓은 꼭지다. 오리건주 Eugene에서는 헬스 시스템이 응급실 운영 계약을 지역 그룹에서 전국 단위 회사로 옮기려다 지역 사회와 의료진의 반발을 샀고, 아이다호주 Post Falls에서는 응급실 한 곳이 보험사와의 중재 절차를 대량으로 활용해 주 의회가 이를 막는 법안을 검토하고 있다. 필자는 뒤쪽 사례를 더 길게 다루면서, 겉으로는 훌륭한 성장 사업으로 보이는 모델이 사실은 중재 제도를 지렛대 삼아 값을 받아 내는 구조라는 점을 짚는다. 환자가 내는 돈이 아니라 병원과 보험사 사이에서 값이 정해지는 이야기라는 점을 염두에 두고 읽으면 된다.","insight":null,"signal":null,"author":[{"claim":"Eugene의 상황은 그곳의 누구에게도 이길 수 없는 국면으로 보인다.","evidence":"인근 응급실 폐업으로 환자가 몰리는 상황과 PeaceHealth가 최근 몇 년간 현금을 소진해 온 사정을 근거로 든다."},{"claim":"사실을 한 세트만 놓고 보면 Nutex에는 정말 설득력 있는 서사가 있다.","evidence":"환자 리뷰 5점 만점에 4.8점, 매출 82% 성장, 조정 EBITDA 마진 30%라는 수치를 든다."},{"claim":"인용된 주 상원의원의 발언에서는 그가 보험이라는 개념을 이해하고 있다는 인상을 받지 못했다.","evidence":"다른 사람이 Nutex에서 임신 테스트를 받고 싶어 한다는 이유로 당신이 헬스케어에 더 많은 돈을 내야 하느냐고 물었다면 다르게 답했을 것이라는 가정을 든다."},{"claim":"자본주의를 지지하더라도, 나쁜 행동을 억제하는 규제 틀을 만들 수 있는 유능한 정치인이 있는 것이 중요하다.","evidence":"근거를 대지 않았다."}],"experts":[{"who":"Brian Lenney","role":"아이다호주 상원의원으로, Nutex를 규제하는 법안에 반대표를 던진 쪽이다.","claim":"그들은 나쁜 행위자가 아니며, 그 값을 낼 의향이 있는 소비자가 시장에 있다면 그것은 좋은 일이고, 지금 의회는 회사 하나를 문 닫게 하려 하고 있다고 말했다.","evidence":"자본주의라는 원칙만 들었을 뿐 구체적인 근거를 대지 않았다."}],"cases":[{"name":"PeaceHealth (오리건주 Eugene)","what":"응급실 서비스 계약을 지역 그룹에서 ApolloMD로 옮기려 했고, 경쟁 입찰을 거쳐 ApolloMD가 선정된 것으로 보인다. 지역 사회가 반발했고 소속 프로바이더들은 리더십에 대한 불신임 투표를 했다.","scale":"","note":"지역 사회는 ApolloMD를 사모펀드 자본이 들어간 전국 단위 회사로 인식했지만, ApolloMD 웹사이트는 의사 소유이며 외부 자본이 없다고 밝히고 있다.","sells_to":"payer"},{"name":"Nutex Health","what":"상장된 마이크로 병원 및 독립형 응급실 운영사다. No Surprises Act의 중재 절차를 핵심 전략으로 쓰며, 이 접근을 다윗과 골리앗의 싸움이라고 부른다.","scale":"아이다호 응급실 한 곳에서 월 280건의 중재 클레임(나머지 39곳 합계 월 14건), 무릎 염좌 청구 8,588달러, 메디케어 수가의 약 1,000%, 매출 성장 82%, 조정 EBITDA 마진 30%, 환자 리뷰 4.8/5","note":"목요일 실적 발표에서 5,500만 달러 규모의 중재 클레임이 자격 없음으로 판정되면서 주가가 한때 40% 떨어졌다. 원문에 적힌 시장 가격 숫자는 \"$,700\"으로 깨져 있어 정확한 값을 알 수 없다.","sells_to":"payer"},{"name":"아이다호주 응급실 중재 규제 법안","what":"No Surprises Act 중재 절차의 남용을 막기 위해 주 의회가 검토 중인 법안으로, 반대에도 불구하고 위원회를 통과해 전체 표결로 넘어간다.","scale":"","note":"원문은 이 법안에 공감하는 의원들을 몬태나주 의원이라고 적었지만 인용된 상원의원은 아이다호 소속이라, 원문 자체에 어긋남이 있다.","sells_to":"none"}],"notes":[{"term":"No Surprises Act / IDR","ko":"예상 밖 청구 방지법 / 독립 분쟁 해결 절차","plain":"예전에는 환자가 응급실에 갔다가 그 병원이 자기 보험의 네트워크 밖이면 차액을 개인이 뒤집어썼다. 2022년 시행된 이 법은 환자에게 네트워크 안 수준만 부담시키고, 남은 금액은 병원과 보험사가 중재로 정하게 바꿨다. 그래서 환자는 보호받지만 말썽은 중재 창구에서 난다. 병원이 클레임을 대량으로 넣어 보험사를 압박하는 전략이 생겼기 때문이다. 한국은 수가가 전국적으로 정해져 있어 이런 분쟁 자체가 없다."},{"term":"free-standing ED / micro-hospital","ko":"독립형 응급실 / 마이크로 병원","plain":"큰 병원 건물에 딸려 있지 않고 동네에 따로 서 있는 응급실이다. 겉모습은 가벼운 진료를 보는 긴급진료소와 비슷하지만 청구는 응급실 기준으로 하기 때문에 같은 처치라도 금액이 크게 다르다. 인용된 상원의원이 임신 테스트를 예로 든 것도 이 지점이다."},{"term":"Medicare rate의 1,000%","ko":"메디케어 수가의 열 배","plain":"미국에는 전국 단일 가격이 없어서, 민간 보험 쪽 가격을 이야기할 때 공보험인 메디케어가 지급하는 금액의 몇 배인지로 비교한다. 보통 민간이 메디케어의 두세 배 수준이라고들 하므로, 열 배는 대단히 높은 값이다."},{"term":"Rule of 40 / Rule of 110","ko":"40의 법칙 / 110의 법칙","plain":"소프트웨어 회사를 평가할 때 매출 성장률과 이익률을 더해 40이 넘으면 좋은 회사로 본다는 투자 업계의 경험칙이다. Nutex는 성장률 82%에 마진 30%를 더해 110이 넘으므로, 필자는 왜 40짜리 소프트웨어에 투자하겠느냐고 비꼬아 물은 것이다."}]},{"heading_ko":"Hims와 Novo의 파트너십 소문","heading_en":"From The Public Markets","skip":null,"summary":"소비자에게 약을 직접 파는 원격진료 회사 Hims가 체중 감량 약 제조사 Novo Nordisk의 브랜드 약을 팔게 된다는 보도가 나오면서 주가가 금요일 장 마감 후 40% 뛰었다는 소식이다. 두 회사는 소송과 비난을 주고받던 사이여서 필자도 예상 밖이라고 적는다.","insight":null,"signal":"체중 감량 약을 만드는 제약사가 소송까지 걸었던 소비자 직접 판매 회사에 다시 돌아왔고, 그 소문만으로 시가총액이 하룻밤에 40% 움직였다. 브랜드 약을 파는 쪽에서도 소비자 접점을 쥔 앱 채널의 값을 그만큼 높게 본다는 뜻이다. 미국에서 체중 감량 약을 사는 통로가 병원 진료실보다 앱 화면 쪽으로 기울고 있다는 신호다.","author":[{"claim":"Novo가 계속 협상 테이블로 돌아온다는 사실은 Hims에 대한 강세 논리를 보여 준다.","evidence":"올해 초 소송, 작년의 기만적 마케팅 비난, 그전 파트너십 철회라는 이력에도 다시 돌아왔다는 점을 근거로 든다."},{"claim":"지금까지 다룬 뉴스 중 가장 예상 밖의 것 축에 든다.","evidence":"두 회사가 주고받은 소송과 비난의 이력을 근거로 든다."}],"experts":[],"cases":[{"name":"Hims","what":"소비자가 앱과 웹에서 진료를 받고 약을 배송받는 직접 판매 회사다. Novo Nordisk의 브랜드 체중 감량 약을 팔기로 했다는 Bloomberg 보도가 나왔다.","scale":"금요일 장 마감 후 주가 40% 상승","note":"발표는 이르면 월요일로 예고됐을 뿐, 이 시점에는 아직 확정되지 않은 보도 단계다.","sells_to":"consumer"}],"notes":[]},{"heading_ko":"Omada 4분기 실적과 GLP-1 회원 15만 명","heading_en":"From The Public Markets","skip":null,"summary":"만성질환 관리 프로그램을 고용주와 보험사에 파는 Omada의 실적 소식이다. 매출과 수익성 숫자보다 눈여겨볼 것은 GLP-1을 쓰는 회원 수가 1년 남짓 사이 5만 명에서 15만 명으로 늘었다는 대목이다. 약 자체가 아니라 약을 쓰는 사람을 옆에서 관리해 주는 서비스가 어느 정도 규모로 커졌는지 보여 준다.","insight":"GLP-1을 맞는 사람을 대상으로 한 동반 기록은 약을 팔지 않고 투약 요일과 몸 상태만 다루면 규제 허가 없이 3개월 안에 만들 수 있다. 걸음과 식단을 이미 매일 받고 있으므로, 주사를 시작한 시점을 표시하게 하고 시작 전 4주와 시작 후 4주를 자동으로 대조해 보여 주는 정도가 현실적인 첫 판이다. 다만 우리 앱의 미국 사용자 가운데 실제로 GLP-1을 쓰는 사람이 시험에 충분한 수인지부터 확인해야 한다.","signal":"Omada는 GLP-1을 쓰는 회원이 2024년 말 5만 명에서 15만 명으로 늘었다고 밝혔고, 새로 내놓는 GLP-1 상품은 아직 2026년 가이던스에 넣지도 않았다고 했다. 약을 파는 것이 아니라 계속 쓰도록 돕는 서비스가 1년 남짓에 3배로 커졌다는 뜻이다. 다만 이 회원들의 비용은 고용주가 내므로, 소비자가 직접 지갑을 여는 규모는 이 숫자로 알 수 없다.","author":[{"claim":"새 GLP-1 상품이 2026년 가이던스에 빠져 있다는 점은 상방 시나리오를 암시하는 듯하다.","evidence":"Omada가 실적 발표에서 직접 언급한 내용을 근거로 든다."}],"experts":[],"cases":[{"name":"Omada","what":"만성질환과 체중 관리 프로그램을 고용주와 보험사에 파는 상장 회사다. 4분기에 순이익이 흑자로 돌아섰고 GLP-1 사용 회원을 계속 늘리고 있다.","scale":"2025년 매출 2억 6,000만 달러(전년 대비 53% 증가), 연간 조정 EBITDA 600만 달러, 2026년 매출 전망 약 3억 1,700만 달러(22% 성장), GLP-1 회원 15만 명(2024년 말 5만 명)","note":"회원이 세 배로 늘어난 것에 비해 매출 성장률은 53%라, 회원 한 명당 받는 금액은 크지 않다는 점을 함께 봐야 한다.","sells_to":"employer"}],"notes":[{"term":"GLP-1","ko":"GLP-1 계열 체중 감량 주사제","plain":"원래 당뇨 치료제로 쓰이다가 체중 감량 효과가 확인돼 미국에서 폭발적으로 팔리고 있는 주사제다. 값이 비싸고 메스꺼움 같은 부작용이 있어 시작한 사람 가운데 상당수가 중간에 그만두는 것이 이 시장의 고질적인 문제이며, 그래서 약을 계속 맞도록 옆에서 관리해 주는 서비스가 따로 사업이 된다."}]},{"heading_ko":"Ardent Health 실적과 하향된 전망","heading_en":"From The Public Markets","skip":null,"summary":"병원을 운영하는 상장 회사 Ardent Health가 2026년 수익 전망을 낮췄다는 소식이다. 2025년에는 성장했지만 올해는 뒷걸음질하고 2027년에 다시 성장으로 돌아설 것으로 본다. 병원 운영 사업의 실적 이야기이며 소비자 쪽과 이어지는 대목은 없다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Ardent Health","what":"병원을 운영하는 상장 회사로, 수요일 장 마감 후 실적을 발표하면서 2026년 조정 EBITDA 전망을 낮췄다.","scale":"2025년 5억 4,500만 달러(전년 대비 약 9% 성장), 2026년 전망 4억 8,500만~5억 3,500만 달러","note":"","sells_to":"payer"}],"notes":[]},{"heading_ko":"Surgery Partners의 두 개의 반기","heading_en":"From The Public Markets","skip":null,"summary":"수술 시설을 운영하는 Surgery Partners가 실적 발표 후 주가가 약 20% 빠졌다는 소식이다. 매출은 추정치를 넘었지만 상반기의 기세가 하반기에 뒤집혔고, 이미 한 차례 낮췄던 4분기 마진 전망에도 못 미쳤다. 소비자 쪽과 이어지는 대목은 없다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Surgery Partners","what":"수술 시설을 운영하는 상장 회사로, 2025년을 두 개의 반기 이야기라고 표현하며 하반기 역풍을 인정했다.","scale":"실적 발표 후 주가 약 20% 하락","note":"4분기 마진이 이미 3분기에 한 번 낮춰 놓은 전망치에도 미치지 못했다는 점이 시장 반응의 핵심이다.","sells_to":"payer"}],"notes":[]},{"heading_ko":"Astrana의 메디케어 어드밴티지 실적","heading_en":"From The Public Markets","skip":null,"summary":"메디케어 어드밴티지 시장에서 진료를 맡아 운영하는 Astrana의 실적 소식이다. 대부분의 계약이 인두제 방식인데도 조정 EBITDA 마진 6.5%를 냈다는 점을 필자는 인상적이라고 본다. 끝에 붙은 필자의 한마디가 이 꼭지의 핵심인데, 작은 회사들은 모두 자기가 덜 다칠 것이라 말하고 큰 회사들은 업계 전체가 같이 다칠 것이라 말하니 누군가는 틀리게 돼 있다는 지적이다.","insight":null,"signal":null,"author":[{"claim":"작은 플레이어들이 모두 업계보다 덜 영향받을 것이라 예상하고 큰 플레이어들은 업계 전반에 일관된 영향을 예상한다면, 누군가는 틀리게 되어 있다.","evidence":"지난주와 이번 주에 소규모 메디케어 어드밴티지 회사들이 내놓은 발언이 같은 패턴이라는 점을 근거로 든다."}],"experts":[],"cases":[{"name":"Astrana","what":"메디케어 어드밴티지 시장에서 진료 그룹을 운영하며 대부분 인두제 계약으로 일하는 상장 회사다. 월요일 실적 발표 후 주가가 30% 올랐다.","scale":"2025년 매출 32억 달러, 조정 EBITDA 2억 540만 달러(마진 6.5%), 2026년 가이던스 중간값 매출 39억 5,000만 달러·조정 EBITDA 2억 6,500만 달러","note":"2027 Advance Notice와 관련해 자사는 업계보다 덜 영향받을 것으로 본다고 밝힌 점이 필자의 지적 대상이다.","sells_to":"payer"}],"notes":[{"term":"capitated contract","ko":"인두제 계약","plain":"진료를 한 건 할 때마다 값을 받는 것이 아니라, 환자 한 명당 매달 정해진 금액을 미리 받고 그 안에서 진료를 모두 책임지는 계약이다. 환자가 아프지 않으면 이익이 남고 많이 아프면 손해가 나므로, 위험을 진료하는 쪽이 떠안는 구조다. 마진이 얇을 수밖에 없어서 6.5%가 인상적이라는 평가가 나온다."}]},{"heading_ko":"New Mountain, 헬스케어 AI 자산 매각 철회","heading_en":"Other Top Headlines","skip":null,"summary":"사모펀드 New Mountain Capital이 Thoreau와 다섯 개 헬스케어 AI 자산을 전직 파트너에게 매각하려던 거래에서 손을 뗐다는 소식이다. 매수자가 마감을 놓치고 조건이 나쁜 제안을 냈다는 것이 이유로 제시된다. 회사끼리의 자본 거래이며 소비자 쪽과 이어지지 않는다.","insight":null,"signal":null,"author":[{"claim":"시장에서 가장 흥미로운 헬스케어 플랫폼 중 하나가 될 수도 있었던 것의 아쉬운 종결이며, 어쩌면 지금 사모 시장의 불확실성을 보여 주는 신호일 수 있다.","evidence":"Bloomberg가 인용한 New Mountain의 투자자 서한 내용을 근거로 든다."}],"experts":[],"cases":[{"name":"New Mountain Capital / Thoreau","what":"사모펀드가 Thoreau와 다섯 개 헬스케어 AI 자산을 전 파트너 Matt Holt에게 팔려던 계획을 철회했다. 매수자가 오퍼 마감을 놓치고 여러 불확실성이 있는 더 낮은 오퍼를 냈다는 것이 이유다.","scale":"헬스케어 AI 자산 다섯 개","note":"New Mountain은 해당 사업들의 상방을 여전히 낙관하며 매각 과정 자체가 운영에 부담이 됐다고 밝혔다.","sells_to":"other"}],"notes":[]},{"heading_ko":"OpenEvidence와 Wiley의 콘텐츠 계약","heading_en":"Other Top Headlines","skip":null,"summary":"의사들이 쓰는 의학 정보 검색 서비스 OpenEvidence가 학술 출판사 Wiley와 콘텐츠 계약을 맺었다는 소식이다. 필자가 흥미롭게 본 대목은 이 회사가 콘텐츠를 무단으로 긁어 오는 대신 출판사에 돈을 내고 지분까지 나눠 주는 방식을 자기 경쟁 우위로 삼는다는 점이다. 사용자는 의사이고 소비자가 아니다.","insight":null,"signal":null,"author":[{"claim":"무척 흥미로운 딜이다.","evidence":"Nadler의 Spotify 발언과 Wiley가 실적 콜에서 밝힌 5년·수백만 달러 계약 및 지분 취득 조건을 근거로 든다."}],"experts":[{"who":"Daniel Nadler","role":"OpenEvidence의 CEO로, 콘텐츠 대가를 지불하는 쪽의 사업 모델을 가진 사람이다.","claim":"자사의 지금까지의 핵심 혁신은 AI Napster들로 가득한 시장 속의 Spotify가 된 것이라고 말했다. 즉 퍼블리셔들에게 돈을 내고 있다는 뜻이다.","evidence":"근거를 대지 않았다. JPMorgan 행사에서 한 발언이다."}],"cases":[{"name":"OpenEvidence와 Wiley의 계약","what":"의학 정보 검색 서비스와 학술 출판사가 맺은 콘텐츠 파트너십이며, Wiley는 계약의 일부로 OpenEvidence 지분을 받는다.","scale":"5년, 수백만 달러 규모","note":"Wiley가 상장 회사여서 계약 조건이 실적 콜을 통해 공개됐다는 점이 특이하다.","sells_to":"provider"}],"notes":[]},{"heading_ko":"Quantum Health의 CirrusMD 인수","heading_en":"Other Top Headlines","skip":null,"summary":"직원 복리후생 시장에서 의료 이용을 안내해 주는 회사 Quantum Health가 원격진료 회사 CirrusMD를 인수했다는 소식이다. 작년의 프로바이더 데이터 회사 인수에 이은 두 번째 인수다. 고용주가 사는 상품이며 소비자가 직접 고르는 서비스가 아니다.","insight":null,"signal":null,"author":[{"claim":"지금이 고용주 시장에서 이런 종류의 상품을 스케일하기에 흥미로운 시점이다.","evidence":"근거를 대지 않았다."}],"experts":[],"cases":[{"name":"Quantum Health의 CirrusMD 인수","what":"고용주에게 의료 이용 안내 서비스를 파는 회사가 원격진료 플랫폼을 인수해 자사 상품에 붙인다. 작년에는 프로바이더 데이터 스타트업 Embold Health를 인수했다.","scale":"","note":"안내 서비스가 안내에 그치지 않고 진료 제공까지 끌어안는 방향으로 넓어지고 있다.","sells_to":"employer"}],"notes":[{"term":"employer navigation","ko":"고용주 대상 의료 이용 안내","plain":"미국 직장인은 회사를 통해 보험에 드는데, 어떤 병원이 네트워크 안인지 무엇이 얼마인지 알기 어렵다. 그래서 회사가 돈을 내고 직원 대신 병원을 찾아 주고 청구서를 확인해 주는 별도 서비스를 붙인다. 한국에는 이런 업무 자체가 필요 없어 대응하는 시장이 없다."}]},{"heading_ko":"DoseSpot과 Arrive Health의 합병","heading_en":"Other Top Headlines","skip":null,"summary":"전자 처방 플랫폼과 보험 급여 데이터 회사가 합쳐 Interra Health가 됐다는 소식이다. 목표는 약을 처방하는 그 순간에 그 약이 이 환자에게 얼마인지 실시간으로 보여 주는 것이다. 눈여겨볼 점은 이 가격 정보가 흐르는 화면이 환자가 아니라 처방하는 의사 쪽이라는 것이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Interra Health (DoseSpot + Arrive Health)","what":"전자 처방 플랫폼과 보험 급여 데이터를 결합해 약값을 실시간으로 보여 주는 회사로 합병했다. Bain Capital이 자금을 대고 과반 지분을 가지며 PSG, Providence, UPMC Enterprises가 소수 투자자로 참여한다.","scale":"2026년 매출 1억 달러 예상, 연 40% 성장 전망","note":"가격 투명성 상품이지만 판매 대상은 소비자가 아니라 처방 현장이다.","sells_to":"provider"}],"notes":[{"term":"e-prescribing / real-time benefit check","ko":"전자 처방 / 실시간 급여 확인","plain":"미국에서 같은 약이라도 환자가 실제로 내는 돈은 가입한 플랜, 약국, 남은 공제액에 따라 제각각이다. 실시간 급여 확인은 의사가 처방을 입력하는 화면에서 이 환자가 이 약국에서 얼마를 낼지를 곧바로 띄워 주는 기능이다. 문제는 그 값을 보는 사람이 의사이고, 환자는 약국 계산대에 가서야 금액을 알게 된다는 점이다."}]},{"heading_ko":"TPG의 FindHelp 2억 5,000만 달러 투자","heading_en":"Other Top Headlines","skip":null,"summary":"사모펀드 TPG가 임팩트 투자 펀드에서 SDoH 플랫폼 FindHelp에 2억 5,000만 달러를 투자했다는 소식이다. 이 회사가 이제 메디케어와 메디케이드 급여 등록 검증까지 지원한다는 대목을 필자는 비즈니스 모델 확장으로 본다. 원문은 이 서비스의 비용을 누가 내는지 밝히지 않는다.","insight":null,"signal":null,"author":[{"claim":"메디케어와 메디케이드 베네핏 등록 검증까지 지원하는 것은 흥미로운 비즈니스 모델 확장으로 보인다.","evidence":"보도자료의 내용을 근거로 든다."}],"experts":[],"cases":[{"name":"FindHelp","what":"식품과 주거 같은 생활 조건 문제를 다루는 SDoH 플랫폼으로, TPG의 임팩트 투자 펀드에서 2억 5,000만 달러를 받았다.","scale":"2억 5,000만 달러","note":"원문은 이 플랫폼의 비용을 누가 내는지 밝히지 않아, 어느 쪽에 파는 사업인지 단정할 수 없다.","sells_to":"other"}],"notes":[{"term":"SDoH","ko":"건강의 사회적 결정 요인","plain":"먹을 것이 있는지, 살 곳이 안정적인지, 병원까지 갈 교통편이 있는지처럼 진료실 밖의 생활 조건이 건강을 좌우한다는 개념이다. 미국은 이런 조건이 나쁜 사람의 의료비가 크게 늘기 때문에, 보험사와 병원이 식품이나 교통 지원에 돈을 쓰는 것이 결국 비용을 줄인다고 보고 투자한다."}]},{"heading_ko":"FDA, 텔레헬스 30곳에 경고 서한","heading_en":"Other Top Headlines","skip":null,"summary":"FDA가 컴파운딩 GLP-1을 불법으로 마케팅했다는 이유로 텔레헬스 기업 30곳에 경고 서한을 보냈다는 한 줄 소식이다. 한 번에 30곳이라는 숫자가 이 시장의 크기를 짐작하게 한다.","insight":null,"signal":"FDA가 컴파운딩 GLP-1의 불법 마케팅을 이유로 한 번에 텔레헬스 기업 30곳에 경고 서한을 보냈다. 정식 승인 경로 밖에서 체중 감량 약을 사는 소비자 수요가 규제 기관이 일괄 대응할 만큼 커져 있다는 뜻이다. 동시에 우리 앱이 GLP-1 관련 기능을 붙일 때 특정 약을 권하거나 파는 형태로 만들면 같은 규제 위험에 들어간다는 경계선이기도 하다.","author":[],"experts":[],"cases":[{"name":"FDA의 경고 서한","what":"컴파운딩 GLP-1의 불법 마케팅을 이유로 텔레헬스 기업 30곳에 경고 서한을 발부했다.","scale":"30곳","note":"원문은 어떤 회사들인지, 어떤 표현이 문제였는지까지는 밝히지 않는다.","sells_to":"none"}],"notes":[{"term":"compounded GLP-1","ko":"조제 GLP-1","plain":"제약사가 만든 완제품 대신 약국이 같은 성분을 직접 조제해 만든 주사제다. 값이 훨씬 싸서 소비자가 원격진료 업체를 통해 많이 사 왔지만, 완제품과 같은 승인 절차를 거치지 않았기 때문에 광고 방식과 판매 조건이 엄격하게 제한된다."}]},{"heading_ko":"Grow Therapy 1억 5,000만 달러 조달","heading_en":"Funding Announcements","skip":null,"summary":"심리 치료사들이 개업과 보험 청구를 맡길 수 있게 해 주는 플랫폼 Grow Therapy가 30억 달러 가치로 자금을 조달했다는 소식이다. 연 매출 10억 달러라는 숫자가 나왔지만, 필자는 그 대부분이 치료사에게 가는 돈이고 회사에 남는 것은 30% 미만일 것으로 본다.","insight":null,"signal":null,"author":[{"claim":"Grow에 실제로 돌아가는 매출은 아마 그 숫자의 30% 미만일 것이다.","evidence":"Slack에서 오간 이 사업의 매출 인식 구조와 네트워크 소속 프로바이더에게 돌아가는 몫에 대한 논의를 근거로 들며, 계산 과정을 따로 제시하지는 않았다."}],"experts":[],"cases":[{"name":"Grow Therapy","what":"치료사를 위한 운영 대행 성격의 플랫폼으로, TCV와 Goldman Sachs Alternatives가 주도한 라운드에서 자금을 조달했다.","scale":"1억 5,000만 달러 조달, 기업가치 30억 달러, 연 매출 10억 달러 이상(Bloomberg)","note":"매출 10억 달러는 치료사에게 지급되는 돈까지 포함한 숫자라는 점을 필자가 짚는다.","sells_to":"provider"}],"notes":[]},{"heading_ko":"Sage 6,500만 달러 조달","heading_en":"Funding Announcements","skip":null,"summary":"요양원과 어시스티드 리빙 시설을 위한 플랫폼 Sage가 자금을 조달했다는 소식이다. 제품은 간호사 호출 기기와 낙상 감지 센서, 앱, 분석 플랫폼으로 구성된다. 기기가 포함된 시설용 제품이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Sage","what":"요양원과 어시스티드 리빙 시설에 간호사 호출 기기, 낙상 관리 센서, 앱, 분석 플랫폼을 파는 회사다. Goldman Sachs Alternatives가 주도하고 IVP와 Goldcrest가 참여했다.","scale":"6,500만 달러","note":"하드웨어가 포함된 구성이라 소프트웨어만으로 따라 만들 수 있는 제품이 아니다.","sells_to":"provider"}],"notes":[]},{"heading_ko":"Ease 4,100만 달러 조달","heading_en":"Funding Announcements","skip":null,"summary":"정신건강 진료 기관의 운영을 다루는 AI 플랫폼 Ease가 a16z 주도로 자금을 조달했다는 한 줄 소식이다. 진료 기관이 쓰는 도구다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Ease","what":"행동 건강 분야의 운영을 다루는 AI 플랫폼으로, a16z가 라운드를 주도했다.","scale":"4,100만 달러","note":"","sells_to":"provider"}],"notes":[]},{"heading_ko":"KeyCare 2,740만 달러 조달","heading_en":"Funding Announcements","skip":null,"summary":"헬스 시스템에 원격진료 역량을 붙여 주는 KeyCare가 자금을 조달했다는 소식이다. 필자는 투자자 명단에 암 검사 회사 Exact Sciences가 들어 있는 점을 눈에 띄는 대목으로 꼽는다.","insight":null,"signal":null,"author":[{"claim":"투자자 가운데 Exact Sciences가 포함된 것은 눈에 띄는 이름이었다.","evidence":"근거를 대지 않았다."}],"experts":[],"cases":[{"name":"KeyCare","what":"헬스 시스템에 원격진료 플랫폼을 파는 회사로, Health X Ventures가 주도한 라운드에 여러 전략적 투자자가 참여했다.","scale":"2,740만 달러","note":"","sells_to":"provider"}],"notes":[]},{"heading_ko":"Greater Good Health 2,050만 달러 조달","heading_en":"Funding Announcements","skip":null,"summary":"의사가 아니라 진료 간호사가 중심이 되는 케어 모델 Greater Good Health가 자금을 조달했다는 소식이다. 뉴스레터 측이 이 회사 경영진과 나눈 심층 대담도 함께 소개된다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Greater Good Health","what":"진료 간호사가 이끄는 케어 모델을 운영하는 회사로, Allumia Ventures가 라운드를 주도했다.","scale":"2,050만 달러","note":"","sells_to":"payer"}],"notes":[{"term":"NP (nurse practitioner)","ko":"진료 간호사","plain":"미국에서 석사 이상 교육을 받고 진찰과 처방을 일정 범위까지 스스로 할 수 있는 간호사다. 의사가 부족한 지역이나 1차 진료에서 의사를 대신하는 자리를 많이 맡는다. 한국에는 이만큼 넓은 권한을 가진 직역이 없다."}]},{"heading_ko":"NexCure 1,900만 달러 조달","heading_en":"Funding Announcements","skip":null,"summary":"CAR-T 치료를 외래 클리닉에서 제공하겠다는 NexCure가 자금을 조달했다는 소식이다. 이 회차 앞쪽의 세포·유전자 치료제 꼭지에서 미국 병원의 3%만 CAR-T를 시행할 수 있다는 근거로 인용된 그 회사다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"NexCure","what":"CAR-T 치료를 위한 외래 클리닉 모델을 만드는 회사로, RA Capital이 인큐베이팅하고 라운드를 주도했으며 Cencora Ventures와 Oncology Ventures도 참여했다.","scale":"1,900만 달러","note":"투자자 구성이 제약·유통 쪽이라, 치료제 공급망 쪽에서 시설 부족을 메우려는 시도로 읽힌다.","sells_to":"payer"}],"notes":[]},{"heading_ko":"UnityAI 850만 달러 조달","heading_en":"Funding Announcements","skip":null,"summary":"진료 현장의 운영 업무를 다루는 에이전틱 AI 플랫폼 UnityAI가 자금을 조달했다는 소식이다. 대형 전문 진료 그룹들과 일하고 있다고 밝힌다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"UnityAI","what":"케어 딜리버리 운영을 다루는 에이전틱 AI 플랫폼으로, Third Prime이 라운드를 주도했다. Tennessee Oncology와 Peregrine Health를 포함한 대형 전문 진료 그룹들과 일하고 있다.","scale":"850만 달러","note":"","sells_to":"provider"}],"notes":[]},{"heading_ko":"읽을거리: Medicaid의 사회적 필요 대응","heading_en":"What I'm Reading: Addressing Social Needs Saves Money and Improves Health in Medicaid. Now Scale It.","skip":null,"summary":"저소득층 공보험 가입자의 생활 조건 문제를 다루는 시범 사업들을 살펴보고, 이런 모델을 규모 있게 키우는 것이 앞으로 중요하다고 주장하는 글을 소개한다. 필자는 좋은 읽을거리라고만 적고 자기 평가를 덧붙이지 않는다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Mandy Cohen, Melinda Dutton","role":"소개된 글의 저자들이며, 원문은 이들의 소속이나 이해관계를 밝히지 않았다.","claim":"생활 조건 문제를 다루는 모델을 규모 있게 키우는 것이 앞으로 Medicaid 인구를 지원하는 데 핵심적인 부분이라고 주장한다.","evidence":"Accountable Health Communities와 Healthy Outcomes Pilots라는 두 시범 사업을 살펴본 내용을 근거로 든다."}],"cases":[],"notes":[{"term":"upstream needs","ko":"상류의 필요","plain":"병이 생긴 뒤 치료하는 일을 하류라고 보고, 그보다 앞선 자리에 있는 먹을 것, 살 곳, 이동 수단 같은 조건을 상류라고 부른다. 상류를 손보면 하류에서 쓰는 의료비가 줄어든다는 것이 이 글의 전제다."}]},{"heading_ko":"읽을거리: 버추얼 소화기 케어 평가","heading_en":"What I'm Reading: Virtual Gastrointestinal Care Solutions","skip":null,"summary":"PHTI가 소화기 증상을 원격으로 관리하는 제품들을 평가한 보고서를 소개한다. 제품을 두 갈래로 나누는데, 임상의가 붙지 않고 앱과 코치로 감싸는 랩어라운드형과 임상의가 직접 진료하는 형태다. 전반적으로 이 영역의 근거를 긍정적으로 봤다는 것이 결론이다.","insight":"랩어라운드형 소화기 관리는 증상 기록과 식단 기록을 잇는 구조라, 식단 기록이 이미 있는 앱이라면 3개월 안에 소프트웨어만으로 붙일 수 있다. 구체적으로는 배가 아픈 정도와 배변 상태를 매일 한 번 입력받고, 그날과 전날 먹은 것과 겹쳐 보여 주며 반복해서 걸리는 음식을 되짚어 주는 정도가 첫 판이다. 진단이나 치료를 주장하지 않고 본인 기록을 정리해 주는 형태로 두면 규제 허가가 필요 없다. 다만 PHTI가 평가한 제품들은 고용주와 보험사가 사는 것이라, 소비자가 스스로 쓸지는 이 자료만으로 알 수 없다.","signal":null,"author":[],"experts":[{"who":"PHTI","role":"디지털 헬스 솔루션의 임상적·경제적 근거를 평가해 보고서를 내는 기관이다. 원문은 그 이상으로 소개하지 않았다.","claim":"버추얼 소화기 솔루션의 확대 도입에 대해 전반적으로 긍정적인 임상적·경제적 근거를 발견했다고 밝혔다.","evidence":"랩어라운드 솔루션(Cylinder, Digbi)과 임상의 주도 솔루션(Ayble, Oshi, Salvo)을 함께 평가한 결과를 근거로 든다."}],"cases":[{"name":"Cylinder, Digbi","what":"임상의가 직접 진료하지 않고 앱과 코칭으로 소화기 증상을 관리하는 랩어라운드형 제품으로 분류됐다.","scale":"","note":"우리가 3개월 안에 시험해 볼 수 있는 형태에 해당하는 쪽이다.","sells_to":"employer"},{"name":"Ayble, Oshi, Salvo","what":"임상의가 직접 붙어 진료하는 형태의 버추얼 소화기 솔루션으로 분류됐다.","scale":"","note":"의료진 채용과 면허 문제가 따르므로 3개월 안에 따라 만들 수 있는 형태가 아니다.","sells_to":"mixed"}],"notes":[]},{"heading_ko":"읽을거리: 밸류 기반 지불과 농촌 진료","heading_en":"What I'm Reading: Value-Based Payments Are Catching On, but Rural and Small Practices Lag","skip":null,"summary":"1차 진료 의사 설문을 바탕으로 결과 기반 지불이 얼마나 자리 잡았는지 살펴본 짧은 글을 소개한다. 요지는 전반적으로는 퍼지고 있지만 농촌과 소규모 진료 기관이 뒤처져 있다는 것이다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Celli Horstman","role":"Commonwealth Fund에 실린 글의 저자다.","claim":"농촌 지역 진료 기관이 다른 유형의 진료 기관보다 밸류 기반 지불 도입에서 뒤처져 있다고 짚는다.","evidence":"2025년 1차 진료 의사 설문 데이터를 근거로 든다."}],"cases":[],"notes":[{"term":"value-based payment (VBP)","ko":"밸류 기반 지불","plain":"진료를 한 건 할 때마다 돈을 주는 대신, 환자를 건강하게 유지한 결과에 따라 돈을 주는 방식이다. 진료를 많이 할수록 이익이 나는 구조를 바꾸려는 시도인데, 결과를 측정하고 위험을 감당할 체력이 있어야 해서 규모가 작은 진료 기관은 참여하기 어렵다."}]},{"heading_ko":"읽을거리: ACCESS 모델 비판","heading_en":"What I'm Reading: ACCESS: A Fix For Digital Health Companies, Not Medicare's Costliest Patients","skip":null,"summary":"CMS 산하 혁신 조직이 만든 새 지불 모델을 비판하는 기고를 소개한다. 요지는 이 모델이 디지털 헬스 기업에는 재정적 생명줄이 되지만 복합 질환자에게는 오히려 상황을 나쁘게 만들 위험이 있다는 것이다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Morish Shah, Graham Walker, Sudeep Bansal","role":"Health Affairs Forefront에 실린 비판 글의 저자들이며, 원문은 이들의 소속이나 이해관계를 밝히지 않았다.","claim":"CMMI의 ACCESS 모델이 디지털 헬스 기업들에게는 재정적 생명줄이지만 복합적 인구에게는 상황을 더 나쁘게 만들 위험이 있다고 본다.","evidence":"원문이 요약만 전하고 있어 이들이 든 근거는 제시되지 않았다."}],"cas
