 결정할 때 잠재적인 사기를 어떻게 감안할 것인가에 관한 이야기였습니다. 그 친구가 짚은 것 중 하나는, 큰 정책 결정을 고민할 때 사기의 최적 수준이 실제로는 0이 아닐 수 있다는 점이었습니다. 대체로 그 요지는, 사기를 없애는 데서 오는 한계 수익이 점점 줄어들기 때문에 어느 정도(낮은) 수준의 사기는 사업을 하는 데 드는 비용으로서 최적이라는 것입니다. 사기를 더 많이 뿌리 뽑을수록, 나쁜 행위자가 하나도 없도록 만들려는 노력 속에서 선량한 행위자까지 의도치 않게 옥죄게 됩니다.\n\n오늘날의 정치 담론에서 꺼내기에 딱히 인기 있는 개념은 아니지만, 그럼에도 이 Bits about Money 글처럼 여러 자리에서 이따금 논의되어 왔습니다. 그 Bits about Money 글이 짚는 것 중 제가 흥미롭게 본 대목은 신뢰라는 개념입니다. 사기란 근본적으로 신뢰의 남용이며, 서로를 신뢰하는 데서 우리 모두가 얻는 사회적 효용이 대단히 크다는 것입니다. 금융의 세계에서 우리 모두는 사기가 0이 아닌 세상에서 이득을 봐 왔을 가능성이 큽니다.\n\n이번 주 Minnesota Medicaid 프로그램에서 나오는 최신 소식들을 지켜보며 그 대화가 떠올랐습니다. 주 초에 약물사용장애에 집중하는 스타트업 YourPath의 CEO가, 자기 스타트업이 Minnesota Medicaid의 재인증을 거부당했다는 글을 LinkedIn에 올렸습니다. 뒤이어 Minnesota Department of Human Services가 고위험으로 분류된 프로바이더 5,583곳 가운데 2,061곳만 재검증했다는 보도가 나왔습니다. 등록이 취소된 3,411곳 중 2,491곳은 서류가 미비하거나 제출되지 않은 탓이었는데, 이는 그 LinkedIn 글과도 맞아떨어집니다.\n\nMinnesota가 Medicaid 프로그램에서 사기 문제를 겪어 왔고 그 문제가 지난 몇 달간 전국적으로 조명된 것은 분명합니다. 하지만 YourPath가 사기 우려 때문에 진료 제공을 중단하도록 강제해야 할 종류의 조직이라고는 보기 어렵습니다. 선량해 보이는 행위자들이 서류 문제로 사기 집단과 함께 쫓겨나는 지금의 모습은, Minnesota Medicaid 프로그램에서 사기를 없애려는 시도가 낳는 상당히 예측 가능한 부작용으로 보입니다.\n\n이는 결국 신뢰의 문제, 구체적으로는 우리가 이 프로바이더들이 선량한 행위자라고 얼마나 믿느냐의 문제로 귀결됩니다. Minnesota를 비롯한 여러 주가 최근 몇 년간 보여 주었듯, 프로바이더가 선량한 행위자일 것이라는 신뢰가 어쩌면 과했고, 그 결과 여러 주에서 용납하기 어려운 수준의 사기가 발생했습니다. 이 모든 것은 서로를 신뢰할 수 있다는 것의 사회적 효용을 다시 한번 보여 줍니다. 그런 신뢰가 없으면 지금 Minnesota에서 벌어지는 것과 같은 상황이 생깁니다.\n\n특히 우리 사회가 제도에 대한 신뢰가 이토록 낮은 지점에 와 있는 지금, 이것은 정책 결정자들이 씨름하기 어려운 과제라고 생각합니다. 사기 사례 하나하나가 소셜미디어의 광풍으로 번지면서, 허용 가능한 사기의 양은 점점 더 0에 가까워집니다. YourPath 같은 회사들 역시 소셜미디어에서 자기 입장을 펴고 있는 만큼, 이 일의 반대편이 어떻게 전개될지도 지켜볼 만합니다. 이런 것들이야말로 정책 결정자들이 거시적 차원에서 씨름해야 하는 트레이드오프이고, 안타깝게도 더 큰 사회적 싸움에서 부수적 피해가 되어 버리는 YourPath 같은 기업들에게는 아주 실질적인 결과를 남깁니다.\n\n전반적으로 사기에 대한 무관용 기조로 옮겨 가는 것으로 보이는 지금, 여러 층위에서 그 파장을 생각해 보는 것이 흥미로울 텐데, 그중에서도 제가 특히 관심 있는 것은 Medicaid 시장의 투자 가능성입니다. 이미 어려운 시장에 스타트업과 투자자를 가로막는 장애물이 하나 더 생긴 셈으로 보입니다."},{"heading_en":"CHART OF THE WEEK","body":"몸집을 불려 가는 자폐 치료 시장: 일자리 프로그램인가?\n\n이번 주 WSJ이 자폐 치료 시장의 빠르게 증가하는 비용을 다룬 가장 최근의 매체가 되었습니다. 이 주제의 상당 부분은 프로그램의 비용 증가라는 측면에서 이전에도 논의되어 왔지만, 아래 차트는 자폐 치료 시장의 성장으로 만들어진 일자리에 대해 눈이 번쩍 뜨이게 하는 내용이었습니다.\n\n출처: WSJ 기사\n\n이 나라의 헬스케어가 근본적으로 일자리 프로그램이라는 주장을 펴고 싶은 분이라면, 이 그래픽을 잘 챙겨 두시면 됩니다. 그리고 이 그래픽을 앞서 나눈 사기의 최적 수준에 관한 논의와 나란히 놓고 보면, 사기가 0인 환경에서는 이 일자리 중 얼마나 많은 수가 사라질지 생각해 보는 것이 흥미롭습니다."},{"heading_en":"DATA TO PONDER","body":"850%\n\n지난 10년간 300만 달러를 넘는 청구 건수의 증가율\n\nBlues 플랜에 재보험 상품을 제공하는 조직인 BCS는 지난 10년간 자사 고객 Blues 플랜에서 300만 달러를 넘는 청구 건수가 850% 증가했다고 밝혔습니다. BCS는 그 증가의 원인으로 유전자 치료제, 스페셜티 의약품, 그리고 복잡한 소아 / 온콜로지 / 심장 진료를 꼽습니다. 물론 여기서 청구 건수 자체를 볼 수 있다면 도움이 되겠지만, 그럼에도 최근 몇 년간 플랜들이 마주해 온 어려움을 보여 주는 또 하나의 지표가 됩니다."},{"heading_en":"Key Trends to Keep an Eye On","body":"HTN에서 추적하고 있는 뜨거운 주제들에 관한 뉴스입니다\n\n부유층은 어떤 종류의 헬스케어를 구매하고 있는가?\n\nWSJ 부동산 섹션에 뉴욕 사람들이 헬스케어를 고려해 고급 부동산을 사들이는 방식에 관한 흥미로운 기사 두 편이 실렸습니다. 지난주 후반에는 부유한 시니어들이 뉴욕 헬스 시스템에서 자신이 선택한 전문의 가까이에 있는 세컨드 하우스, 이른바 \"med-à-terres\"를 구매하는 모습을 다뤘습니다. 이번 주에는 뉴욕시의 럭셔리 콘도들이 이제 고급 롱제비티 경험을 구매자를 위한 셀링 포인트로 넣고 있다는 점을 조명하며, Atria Health and Research Institute를 사례로 들었습니다. 혁신이 아이폰처럼 확산된다고, 즉 처음에는 비싼 값으로 시작해 시간이 지나며 저렴해진다고 믿는 분이라면, 부유층이 여기서 실제로 무엇을 구매하고 있는지 살펴보는 것이 흥미로울 것입니다. 구체적으로 말하면, 여기서 셀링 포인트는 기술이 아닌 것으로 보입니다. 오히려 그들이 사는 것은 사람과 경험에 대한 접근이며, 기술은 그것을 가능하게 하는 역할입니다."},{"heading_en":"Key Trends to Keep an Eye On","body":"네트워크 외 청구에 어떻게 가격을 매길 것인가를 둘러싼 법적 공방이 뜨거워지다\n\n이번 주 두 건의 소송이 짚어 볼 만했습니다. 먼저 No Surprises Act 관련 소송이 이어지며, Highmark Health가 HaloMD와 한 프로바이더 그룹을 No Surprises Act의 IDR 절차를 남용했다는 이유로 제소했습니다. 또한 이번 주에 MultiPlan(다른 이름으로 Claritev)과 여러 페이어가 Arizona에서 소송을 당했는데, MultiPlan의 네트워크 외 가격 산정 방식이 페이어 카르텔에 해당하며 Arizona 프로바이더에게 조직적으로 과소 지급하고 소비자에게 피해를 준다는 주장입니다.\n\n이는 페이어와 프로바이더 사이에 큰 가격 격차를 풀어야 할 때 네트워크 외 협상이 얼마나 첨예해지는지를 잘 상기시켜 줍니다. 페이어가 낮은 요율로 지급하기 위해 벤더와 계약하면(MultiPlan) 프로바이더의 분노를 삽니다. 프로바이더가 높은 요율을 받기 위해 벤더와 계약하면(HaloMD) 페이어의 분노를 삽니다. 이렇게 돌고 또 돕니다."},{"heading_en":"Key Trends to Keep an Eye On","body":"또 한 주, 또 하나의 프로바이더가 세운 지역 플랜이 고전하다\n\n화요일에 Presbyterian이 2025년에 약 6,000만 달러의 손실을 낸 뒤 Medicare Advantage 시장에서 철수한다고 발표했으며, 약 3만 명의 가입자가 영향을 받습니다. Presbyterian은 오늘 1만 3,000명을 서비스하고 있는 D-SNP 시장에는 남습니다. 크게 보면 이는 지역 건강보험 플랜의 고전이라는 흐름에 들어맞지만, D-SNP 시장에 남는다는 것은 앞으로 그 특정 시장 세그먼트에 가능성이 있음을 시사합니다."},{"heading_en":"Other Headlines","body":"알아 두면 좋을 그 밖의 주요 헤드라인 정리입니다\n\nHealth Catalyst의 주가가 약 40% 급등했습니다. Vitalware 사업을 RCM 벤더 Med-Metrix에 1억 4,700만 달러에 매각한 데 따른 것입니다. Health Catalyst는 그 대금으로 부채를 상환하는 한편, 비용·임상·소비자 데이터 전반에 걸쳐 AI 역량을 구축하는 쪽으로 전략적 초점을 계속 다듬어 갈 계획입니다."},{"heading_en":"Other Headlines","body":"학교 기반 원격진료 모델인 Hazel Health가 매각 절차를 진행했으나 관심이 거의 없었고, 이후 전략적 대안을 검토하고 있는 것으로 전해집니다. Axios가 전한 내용입니다. Forge 데이터에 따르면 Hazel Health는 2016년 설립 이후 총 2억 7,300만 달러를 조달했습니다."},{"heading_en":"Other Headlines","body":"HLTH를 비롯한 여러 행사를 운영하는 이벤트 기업 Hyve가 PE 회사 Hellman and Friedman에 18억 달러로 알려진 금액에 매각되었습니다. Hyve는 3년 전 Providence Equity Partners와 Searchlight Capital Partners에 5억 파운드 미만의 금액으로 인수된 이후, HLTH를 포함한 인수를 통해 지난 몇 년간 순조롭게 성장해 왔습니다."},{"heading_en":"Other Headlines","body":"CMS가 자사의 청구 처리 플랫폼 ClaimsCore를 대체할 벤더로 HealthEdge와 Peraton을 두고 절차를 진행하고 있습니다. HealthEdge의 계약은 잠재적으로 11억 5,000만 달러 규모지만, 현재 확정된 금액은 250만 달러에 불과합니다. Bain Capital은 Healthedge를 UST HealthProof와 합병했습니다."},{"heading_en":"Other Headlines","body":"CMS가 Interim Final Rule을 통해 근로 요건에 관한 세부 내용을 발표하며, One Big Beautiful Bill에 따라 이것이 어떻게 시행될지를 명확히 했습니다."},{"heading_en":"Other Headlines","body":"OIG가 감사 결과를 발표했는데, CMS가 2021년에 의무기록으로 뒷받침되지 않는 뇌졸중 진단 코드에 대해 MA 플랜에 4억 6,200만 달러를 과다 지급했을 수 있다는 내용입니다."},{"heading_en":"Other Headlines","body":"프라이머리 케어 EHR 플랫폼 Elation이 여성 건강을 위한 AI 네이티브 EHR인 Aster를 인수했습니다."},{"heading_en":"Other Headlines","body":"Lumexa Imaging이 뉴욕시에서의 외래 영상 진단을 위해 Hospital for Specialty Surgery와 JV를 설립했습니다."},{"heading_en":"Funding Announcements","body":"이번 주에 나온 펀딩 라운드 중 가장 흥미로운 몇 건을 소개합니다\n\n홈 헬스를 위한 AI 오퍼레이팅 시스템 Adaptive Innovations가 두 번의 파이낸싱 라운드에 걸쳐 6,000만 달러를 조달했습니다. Felicis와 Bain Capital Ventures가 라운드를 주도했습니다. Adaptive는 소규모 가족 운영 홈 헬스 프로바이더를 인수해 AI화하고, 그 과정에서 이들 사업체의 재무 마진을 개선하는 것으로 보입니다. Texas에서 가장 큰 성과를 내고 있는데, 2025년 출범 이후 지금까지 10만 건이 넘는 방문 진료를 완료했습니다. Axios에 따르면 이번 자금으로 12개 주로 확장할 계획입니다."},{"heading_en":"Funding Announcements","body":"중소 사업자를 위한 AI 플랫폼 Lassie가 3,500만 달러를 조달했습니다. a16z가 라운드를 주도했습니다. Lassie는 현재 700곳이 넘는 의원에서 쓰이고 있으며, 특히 치과에 집중하고 있습니다. Lassie는 다섯 자릿수의 연간 계약 금액으로 의원들을 확보하면서, 출시 1년 안에 1억 달러 이상의 ARR을 달성하는 궤도에 올라 있다고 밝혔습니다. 이런 종류의 AI화 접근법에 대한 수요를 분명히 보여 줍니다."},{"heading_en":"Funding Announcements","body":"버추얼 비만 케어 모델인 Ilant Health가 1,500만 달러를 조달했습니다. Cornucopian Capital이 라운드를 주도했습니다. Ilant는 고용주와 건강보험 플랜이 현재 비만 케어 제공에서 겪고 있는 긴장을 조율하도록 지원하며, 자사의 케어 모델을 통해 임상 결과를 개선하는 동시에 총 진료비를 낮게 유지하도록 돕습니다."},{"heading_en":"What I'm Reading","body":"웹 곳곳에서 모은 그 밖의 흥미로운 글들입니다\n\nNeil Shah가 \"핫 펩타이드 서머\"에 대한, 그리고 사람들이 원하는 치료를 찾아 전통적인 헬스 시스템 바깥을 보게 되면서 웰니스 생태계가 어떻게 도약했는지에 대한 자신의 관점을 공유했습니다. 기존 프라이머리 케어 접근법의 공백과 이 새로운 모델들이 그 공백을 어떻게 메우고 있는지를 다룬, 흥미롭고 간결한 논의입니다."},{"heading_en":"What I'm Reading","body":"North Carolina가 Healthy Opportunities Pilot의 결과를 발표했습니다. Medicaid 재원을 식품, 주거, 교통 같은 서비스에 지출한 모델입니다. 이 프로그램이 1인당 월 164달러의 비용을 절감한 것으로 나타났습니다. North Carolina General Assembly가 이 프로그램에 예산을 배정하지 않기로 하면서 현재 운영은 중단된 상태입니다."}]},"45":{"index":"45","title_en":"Weekly Health Tech Reads 6/14/26","subtitle":"하와이의 VBC 난제, 헬스케어 선거로 자리 잡아 가는 2032년, Hinge의 투자자의 날, 임상 인텔리전스 레이어를 노리는 Abridge의 도전, 그리고 그 밖의 소식","sections":[{"heading_en":"Sponsored by: Assured","body":"Houston Methodist, Birches Health, Tono Health를 비롯한 100곳 이상의 조직이 Assured를 사용해 빠르면 영업일 2일 만에 프로바이더 크레덴셜링을 마칩니다.\n\nBirches Health의 사례를 보시죠. 이 행동 중독 플랫폼은 1년이 채 안 되는 기간에 2개 주에서 50개 주 전체로, 크레덴셜을 받은 프로바이더 10명에서 800명으로 확장했고, 인네트워크까지 걸리는 시간은 75% 줄었으며 크레덴셜링 거절은 아예 사라졌습니다.\n어떻게 했는지 확인해 보세요\n\n뉴스레터 스폰서십에 관심이 있으시면 알려 주세요!"},{"heading_en":"VBC MUSING: Hawai'i's primary care financing conundrum","body":"여느 매니지드 케어 조직들과 마찬가지로, 하와이의 지역 BCBS 플랜인 Hawai’i Medical Service Association(HMSA)도 지난 몇 년간 재무적 어려움을 겪어 왔습니다. 2024년 1억 1,740만 달러의 영업손실을 기록했다고 보고된 것이 이를 단적으로 보여 줍니다.\n\n이런 문제를 풀기 위해 HMSA는 2026년 초 지역 최대 헬스 시스템인 Hawai’i Pacific Health(HPH)와 합병해 One Health Hawai’i라는 공동 법인을 만들자고 제안했습니다. 의료비를 더 잘 관리한다는 취지에서 밸류 기반 케어라는 개념이 이 합병의 중심에 있었고, 양측은 프라이머리 케어를 넘어 전문 진료까지 확대되는 글로벌 캡 계약을 딜의 핵심 요소로 내세웠습니다. HMSA와 HPH는 이 payvidor 모델이 행정 비용에서 20억 달러를 절감할 것으로 기대한다고 밝혔습니다. 제안된 모델의 대략적인 얼개는 다음과 같습니다:\n\nSource: Honolulu Civil Beat\n\n이 구조는 연초에 상당한 반발을 불러일으켰고, 지역 정치인들은 제안이 불투명하다는 점을 문제 삼았습니다. 다른 지역 헬스 시스템들도 이 움직임이 상업 보험에 가입한 환자들을 자신들에게서 떼어내 HPH 쪽으로 돌리려는 의도가 크다며 우려를 제기했습니다.\n\n최근 HMSA가 재무를 떠받치기 위해 프라이머리 케어 지불 모델을 밸류 기반 월별 캐피테이션에서 FFS 지불로 되돌리자고 제안하면서, 이 모든 일이 한층 더 큰 감시를 받게 됐습니다. 이는 지역 진료소들의 분노를 샀는데, 일부 진료소는 이 변화가 5만 달러의 손실을 낳을 수 있고, 최근의 메디케어 수가 인하와 겹치면 진료소가 문을 닫을 위험에 놓인다고 지적했습니다. 이 시장의 일부 PCP는 이미 컨시어지 모델로 옮겨 갔습니다. 컨시어지 비용을 감당할 수 있는 더 적은 수의 환자를 관리하면서 더 많은 돈을 받는 방식인데, 이는 시장의 접근성 문제를 더 악화시키는 것으로 보입니다.\n\n10년 전 HMSA는 2016년 3PC 모델이라 불리는 프라이머리 케어 캐피테이션 모델을 내놓으며 전국적인 주목을 받았습니다. 환자 1인당 월 20~40달러를 PCP에게 지급하는 방식이었습니다. 2017년으로 거슬러 올라가 보면, HMSA는 애초에 VBC 모델로 옮겨 가는 것에 대해 이미 지역 프로바이더들로부터 반발을 받고 있었습니다. 이들은 환자당 월평균 24달러의 보상은 충분하지 않으며, PCP들이 어전트 케어와 ER을 더 자주 찾게 되면서 보험사가 오히려 더 많은 돈을 잃게 될 것이라고 주장했습니다. 결과적으로 꽤나 선견지명 있는 비판이었던 것으로 보입니다.\n\n2019년 3PC의 초기 결과가 JAMA에 보고됐습니다. 질 지표에서 소폭의 개선과 PCP 방문 감소를 이끌어 내고 있었지만, 장기적인 효과는 불분명했습니다. 열렬한 지지라고 하기는 어려운 결과였지만, 아직 이른 시점이기도 했습니다. 2022년에는 하와이 의사 약 2,500명을 대상으로 3PC에 대한 만족도를 묻는 설문이 발송됐습니다. 250건의 응답이 돌아왔는데, 프로바이더의 77%가 이 지불 방식 전환에 불만이었고 60.6%는 전체 소득이 줄었다고 답했습니다.\n\n모델에 대한 프로바이더들의 이런 역사적 부정적 정서에도 불구하고, 오늘날 피드백의 어조는 수용에 가깝습니다. 프로바이더들이 이 모델을 사랑하지는 않을지 몰라도 거기에 적응했고, 수년간의 조정을 거쳐 이제는 작동하고 있다는 것입니다.\n\n어쩌면 그 점이 HMSA가 FFS로 되돌아가기로 한 결정과 관련이 있을지도 모릅니다. HMSA는 이런 VBC 지불을 통해 프라이머리 케어에 더 많이 투자해 왔다고 보면서도, 프라이머리 케어 접근성은 오히려 떨어졌고 ER과 어전트 케어 이용은 늘어나 감당하기 어려운 재무 상황이 만들어졌다고 밝혔습니다. 이런 결과는 이런 VBC 모델의 이론이 예측했을 법한 것과 정확히 정반대로 보입니다. 또한 3P 프로그램에 대한 최초의 비판과 정확히 일치하기도 합니다.\n\n지불 모델을 둘러싼 불확실성은 본인이 프라이머리 케어 프로바이더이기도 한 하와이 주지사가 제안된 payvidor 합병에 앞서 개입하도록 만들었습니다. HMSA는 이제 VBC→FFS 전환 시행을 6개월 미뤄 2027년 1월로 늦추기로 합의했고, 농촌 지역 진료소에는 15% 높은 수가표를 적용하는 방안도 포함했습니다. HMSA와 HPH의 논의는 계속되고 있지만, 그 결과와 무관하게 이곳의 분위기가 긍정적인 방향으로 흐르는 것 같지는 않습니다.\n\n종합하면, 밸류 기반 케어를 구현해 온 10년의 여정은 매혹적이면서도 지저분합니다. 3PC 모델에도 불구하고 HMSA는 응급실과 어전트 케어 이용이 늘고 있다고 보고하는데, 이는 프라이머리 케어 접근성 저하와 동시에 벌어지고 있고, 그 와중에 프라이머리 케어 투자는 오히려 늘고 있습니다. 이론상 벌어져야 할 일이 아닙니다. 또 HMSA가 바로 그런 이유로 VBC 지불에서 물러서고 있으면서, 동시에 VBC 원칙에 기반한 payvidor 합병을 밀어붙이고 있다는 점도 앞뒤를 맞추기 어렵습니다.\n\n이 모든 혼란 속에서 짚어 둘 만한 것은, HMSA가 성과에 미친 영향을 평가할 데이터를 추적하는 데 어려움을 겪었다고 밝혔다는 점, 그리고 일부 기사에 따르면 하와이주가 적절한 연방 자금을 받기 위해 환자에게 제공된 서비스에 대한 클레임 기반 정보를 더 많이 원한다는 점입니다. 이 역학은 계속 지켜볼 만한데, 연방 자금 삭감이 밸류 기반 케어에 역풍으로 작용하는 한편 주 정부들은 연방 재원을 받기 위해 클레임 데이터 추적을 우선시하고 있음을 시사하는 것으로 보이기 때문입니다.\n\n이 모든 것의 밑바닥에는 요즘 이런 대화에서 자주 마주치는 핵심 문제가 깔려 있습니다. 헬스케어 재원이 헬스케어 비용을 따라가지 못하는 주에서 벌어지는 힘든 트레이드오프, 그래서 모두가 충분치 않은 헬스케어 달러에서 자기 몫을 확보하려 애쓰는 혼란스러운 환경 말입니다. 이제는 연방과 주 차원의 불확실성까지 여기에 더해지면서, 변화하는 시장에 적응하려 애쓰는 지역 리더들에게서 다소 기묘한 의사결정 패턴이 나타나고 있는 것으로 보입니다."},{"heading_en":"","body":"VBC 이야기가 나온 김에, Ursa Health는 Cityblock, Gentiva, Wellvana, Atlas Oncology Partners를 비롯해 프라이머리 케어와 전문 진료 전반의 VBC 프로바이더 및 이네이블러들이 신뢰하는 애널리틱스 기업입니다.\n\n다음 주에는 Ursa와 Atlas를 모시고 전문 진료 영역의 밸류 기반 케어를 깊이 들여다봅니다. 라이브로 참석하기 어려우신가요? 그래도 등록해 두세요. 녹화본과 요약 정리본을 신청하신 모든 분께 공유해 드립니다. 자세히 보고 등록하세요!\n\n이 행사는 Ursa Health의 후원으로 진행됩니다."},{"heading_en":"CHART OF THE WEEK: PwC expects another 9% cost increase in 2027","body":"PwC가 건강보험 플랜 계리사들과의 대화를 바탕으로 연간 상업 의료비 트렌드 증가율을 살펴본 새 리포트를 냈습니다. 결과는 아래에 정리했습니다:\n\nSource: PwC report\n\n이대로 유지된다면 2008년 이후 가장 높은 비용 트렌드 증가율과 동률이 됩니다. PwC는 또한 지출이 2035년까지 9조 달러로 늘어날 것으로 봅니다.\n\n리포트는 세 가지 핵심 비용 동인을 꼽습니다. 제약 혁신, 정신 건강 접근성, 그리고 임상 문서화입니다. 이런 결과가 계속 이어진다면 고용주를 위한 대안적 플랜 설계와 ICHRA 이야기를 훨씬 더 많이 하게 될 것 같은데, 이는 바로 다음 섹션과도 이어집니다…"},{"heading_en":"A CONVO TO PONDER: Is 2032 setting up as a healthcare election?","body":"월요일 Grand Roundup에서는 저희가 흠모하는 너드 아이돌 중 한 명인 Ezekiel Emanuel과 이야기를 나눴습니다. 대화는 기대를 저버리지 않았고, Zeke는 미국 헬스케어를 위한 새로운 정책안을 준비하고 있다고 전해 줬습니다. 대화에서 다뤘듯, 앞으로 몇 년 안에 주요 헬스케어 법안이 등장하는 초기 국면에 들어선 느낌이며, 어쩌면 2032년 선거 사이클의 큰 축이 될 수도 있습니다:\n\nWhy U.S. healthcare doesn't need more money—it needs a different system | Ezekiel Emanuel\n\nZeke는 자기 구상의 핵심 요소들을 공유했는데, 가장 눈에 띄는 것은(적어도 제 생각에는) 정부가 지원하는 보험 프로그램들을 하나의 리스크 풀로 모으고, 고용주 제공 보험은 별도의 리스크 풀로 두자는 것입니다. 이는 Mark Bertolini 같은 다른 분들이 보험 커버리지의 미래가 어떤 모습일 수 있는지를 개념적으로 이야기할 때 들었던 내용과도 일부 겹칩니다. ICHRA에 대한 \"강세\" 논거의 핵심 요소이기도 합니다(일부 고용주가 정부 리스크 풀에 참여하는 통로로서 말이죠.\n\nZeke는 이 생각거리에 아주 유용한 틀을 제시해 줬습니다. 이런 정책 논의는 여러 해에 걸쳐 펼쳐지는 긴 대화지만, 현재 헬스케어 시스템에 대한 불만이 충분히 쌓여 있어 헬스케어 개혁이 2032년 대선의 핵심 축이 될 것이라고 볼 만하다는 것입니다. 당연히 이것이 어떻게 전개되느냐에 따라 광범위한 영향이 뒤따르며, 그 역학과 그것이 헬스케어 지형의 기회를 어떻게 바꿀지 지금부터 생각해 보기 시작할 가치가 있다고 봅니다."},{"heading_en":"Key Trends to Keep an Eye On","body":"HTN에서 저희가 추적 중인 뜨거운 주제들에 대한 뉴스입니다\n\nAbridge, 헬스케어의 신뢰받는 AI 파트너임을 주장하다\n목요일 아침, 저는 한 투자자와 AI 플랫폼 지형이 얼마나 빠르게 진화하고 있는지, 그래서 시장이 어디로 가고 있는지 파악하기가 얼마나 어려운지를 두고 이야기를 나눴습니다. 이 회사들이 진화하는 속도는 정말 놀랍습니다. 그리고 그날 오후 저는 Abridge의 제품 발표 자리에 들어섰는데, 여기서 Abridge는 자신이 스크라이브 기업이 아니라 헬스 시스템과 페이어, 라이프사이언스를 잇는 헬스케어의 \"clinical intelligence layer\"라는 주장을 폈습니다. 세션 초반의 제품 데모는 대단히 잘 만들어져 있었고, 환자/프로바이더 경험의 미래 모습이 어떨 수 있는지와 그 안에서 Abridge가 할 수 있는 역할을 손에 잡히게 보여 줬습니다. 화려한 헤드라인은 두 가지였습니다. 1. Abridge가 환자를 임상시험으로 안내하는 일을 시작하면서 Eli Lilly로부터 전략적 투자를 받았다는 것, 2. Abridge가 Nvidia와 파운데이션 모델을 구축하고 있으며 이 모델이 범용 AI 모델을 크게 앞선다고 강조했다는 것입니다. 이 영역이 어떻게 전개될지에 대한 의문은 여전히 많지만, 이런 세션을 보면 Abridge에 대한 강세 논거는 분명해진다고 봅니다. 헬스 시스템의 신뢰받는 AI 파트너로 자리 잡아 Epic 위에 얹히는 기본 사용자 경험 레이어가 되는 것이죠. 물론 Abridge가 거기에 도달할지 아니면 다른 누군가가 도달할지는 지켜봐야 하지만, 기회는 분명히 존재합니다."},{"heading_en":"Key Trends to Keep an Eye On","body":"매니지드 케어 시장의 조류가 다시 밀려들고 있을지도\n이번 주 다수의 Medicare Advantage 매니지드 케어 기업들이 상당히 좋은 성과를 냈습니다. 페이어들이 시장 역학을 파악해 가면서, 지난 몇 년간 매니지드 케어를 덮쳤던 \"100년 만의 폭풍\"을 지나가고 있다는 전반적인 인식을 뒷받침합니다. Clover와 Alignment가 이번 주 낙관론의 좋은 예를 보여 줬습니다:\n\nClover는 8-K를 제출한 뒤 이번 주 20% 상승했습니다. 최근 Clover에 유리한 법원 결정 이후 CMS가 PPO 상품에 대해 4.5 스타로 대체 입찰서를 다시 제출하라고 통지했다는 내용이었습니다. 법원 결정이 유지된다고 가정하면 이는 Clover에게 중대한 승리이며(그리고 더 넓은 스타 등급 생태계에는 산업 구도를 바꿀 만한 일일 수도 있습니다).\n\nAlignment Healthcare는 이번 주 약 30% 상승했습니다. Goldman Sachs 컨퍼런스에서 이용량 환경이 \"benign\"하며 의료비가 양호하게 관리되고 있다는 업데이트를 내놨습니다. 2분기 실적 시즌이 어떤 모습일지 미리 엿보는 느낌이고, 그렇다면 MA 주식들의 아웃퍼폼이 이어질 것임을 시사합니다."},{"heading_en":"Key Trends to Keep an Eye On","body":"워싱턴이 사기보다 더 싫어하는 것은 사전승인뿐임을 다시 확인시켜 주다\n사기·낭비·남용 위험이 높은 소수 영역에 AI 기반 사전승인을 적용하는 CMMI의 WISeR 모델이, 하원 세출위원회가 앞으로 CMS가 이 프로그램에 예산을 쓰지 못하도록 만장일치로 표결하면서 결정적인 타격을 입었습니다. 이 조치는 모델 출범 이후 WISeR가 상당한 정치적 반발에 부딪혀 온 끝에 나왔습니다. 사전승인은 여전히 정치적 지뢰밭입니다. 사기에 대한 우리의 관용이 사실상 0이고 거의 모든 AI 스타트업 피치가 미국 헬스케어의 낭비를 없애겠다는 이야기인 환경에서조차, 워싱턴 정치인들은 사기를 막기 위해 사전승인을 도입하기보다 사기를 그냥 넘어가게 두는 쪽을 선호한다는 것을 드러냅니다. 한편으로 이 결과는 저를 완전히 어리둥절하게 만들지만, 다른 한편으로는 아마 예측 가능한 일이었고, 미국 헬스케어가 왜 지금과 같은 모습인지를 아주 잘 보여 주는 축소판이기도 합니다."},{"heading_en":"Other Top Headlines","body":"알아 둘 만한 헤드라인 정리입니다\n\nHinge Health가 투자자의 날을 열어, 이 MSK 프로바이더가 보고 있는 모멘텀을 강조했습니다. 20% 이상의 연간 매출 성장과 35%에 가까운 영업이익률을 바탕으로 당분간 Rule of ~60 기업이 될 것으로 기대한다고 밝혔습니다. 제품과 고투마켓 플레이북 양쪽을 통해 Hinge가 시장에서 어떻게 이기고 있는지를 보여 주는 아주 깔끔한 스토리이며, 덕분에 고용주에서 모든 유형의 페이어로 효율적으로 확장하고 있습니다. 또한 HingeSelect를 통해 수술 비용을 관리하는 영역으로 제공 범위를 넓히고 있는데, 이는 자사의 버추얼 모델을 물리적 MSK 케어 딜리버리 네트워크와 연결하려는 시도로 앞으로 지켜볼 내러티브의 핵심 요소가 될 것입니다. 세션에서 공개된 아래 슬라이드는 IPO 당시와 오늘을 비교한 Hinge의 전망치를 보여 주는데, Hinge가 보고 있는 모멘텀을 대체로 가늠하게 해 줍니다. Hinge 주가는 IPO 이후 62% 올랐습니다."},{"heading_en":"Other Top Headlines","body":"SNF를 운영하는 상장사 The Ensign Group이 이번 주 Hunterbrook의 숏 리포트에 직면해 주가가 8% 떨어졌습니다. 리포트는 Ensign이 질 측정 보고를 조작하고 있으며, 부실한 SNF를 사들인 뒤 더 나쁜 인력 배치 비율로 수익성을 끌어올린다는 우려를 제기했습니다. 리포트는 Hunterbrook이 Ensign과 \"유사 증권\"에 대해 숏 포지션을 취하고 있다고 밝혔는데, 이는 Hunterbrook이 이를 더 넓은 시장 차원의 문제로 보고 있음을 시사하는 듯합니다."},{"heading_en":"Other Top Headlines","body":"GoHealth가 챕터 11을 신청하면서, 이번 조치가 2026년 AEP를 앞두고 자사의 입지를 강화할 것이라는 다소 낙관적인 보도자료를 냈습니다. 대주단 100%의 지지를 받은 사전 조율안(prepackaged plan)을 가지고 절차에 들어가는 만큼 빠르게 회생 절차를 마칠 수 있을 것으로 보입니다. GoHealth는 2020년에 약 67억 달러의 시가총액으로 상장했지만, 매출이 급감하면서 부채 부담을 감당하는 데 어려움을 겪어 왔습니다."},{"heading_en":"Other Top Headlines","body":"RFK와 Dr. Oz가 이번 주 X에 나서, 가격 투명성 요건 집행을 진지하게 할 것이며 병원들이 규정을 준수하기를 기대한다고 밝혔습니다. AP는 500곳이 넘는 병원이 CMS로부터 경고 서한을 받았다고 전했는데, 실제로 어떤 결과가 뒤따를지 지켜볼 만합니다."},{"heading_en":"Other Top Headlines","body":"CVS MinuteClinic과 Mass General Brigham이 매사추세츠주 Health Policy Commission으로부터 파트너십을 추진해도 좋다는 지지 표결을 받았습니다. 이 결합으로 비용이 늘어날 수 있다는 우려에도 불구하고 나온 결정입니다."},{"heading_en":"Other Top Headlines","body":"Humana가 옛 Kindred at Home인 Gentiva의 지분 40%를 약 9억 달러에 매각했습니다. Humana는 원래 2022년에 Kindred at Home의 지배 지분을 CD&R에 매각한 바 있습니다."},{"heading_en":"Other Top Headlines","body":"Amazon One Medical과 Montefiore가 뉴욕시 지역에서 파트너십을 확대한다고 발표했습니다. Westchester County의 Montefiore 시설에 One Medical이 헬스 시스템 파트너와 함께 쓰는 첫 코로케이션 시설을 여는 것입니다."},{"heading_en":"Other Top Headlines","body":"Oula와 Novant가 산과 시장에서 흥미로운 파트너십을 발표했습니다. Oula가 Charlotte에 클리닉을 열고 남동부 지역으로 더 확장할 계획입니다."},{"heading_en":"Funding Announcements","body":"이번 주 가장 흥미로운 펀딩 라운드를 소개합니다\n\nAI를 활용한 보건의료 보조인력 양성 프로그램 Stepful이 5,500만 달러를 조달했습니다. Oak HC/FT가 라운드를 주도했습니다. Stepful은 이미 35곳 이상의 헬스 시스템이 자사를 사용하고 있다고 밝혔습니다."},{"heading_en":"What I'm Reading","body":"웹에서 만난 그 밖의 흥미로운 글들을 모았습니다\n\nNature에 실린 새 논문이 여기저기서 회자되고 있습니다. 프론티어 LLM들이 헬스케어 전용 임상 AI 도구, 즉 OpenEvidence와 UpToDate를 앞섰다는 내용입니다. 이에 어젯밤 OpenEvidence가 소셜 미디어에서 결과의 타당성에 의문을 제기하는 대응을 내놨습니다. Mayo / Microsoft, 그리고 Abridge / Nvidia가 헬스케어 전용 파운데이션 모델을 두고 손을 잡는 흐름과 같은 시기에 이 논문이 나왔다는 점이 흥미로운데, 이 흐름은 정반대의 결론을 가리키는 것처럼 보이기 때문입니다. 논리적으로 보면 저에게는 헬스케어 전용 모델이 시간이 갈수록 더 나은 성능을 내는 쪽이 더 말이 됩니다. Abridge는 목요일에 Nvidia와 함께 헬스케어 전용 모델로 옮겨 가면서 자사의 CDI가 69%에서 85%로 개선됐고, 사실상 인간 코더와 대등한 수준이 됐다고 밝혔습니다. 어느 쪽이든, 여기서 충돌하는 데이터 포인트들은 앞으로 이 영역이 얼마나 혼란스럽고 지저분해질지를 잘 보여 주며, 그래서 저는 기술적 우월성을 입증하는 논문이 아니라 결국 고객의 신뢰가 승부를 가른다고 생각합니다."},{"heading_en":"What I'm Reading","body":"Trilliant Health 팀이 GLP-1에 대한 분석을 공유했습니다. GLP-1 사용 환자 중 수면 무호흡증, 우울증, CKD 등 GLP-1의 새롭게 떠오르는 적응증을 진단받은 사람이 얼마나 되는지를 들여다본 내용입니다. 적응증이 늘어나는 상황에서 현재 가격으로 GLP-1 비용을 감당하는 것이 재정적으로 얼마나 어려운 과제인지에 대한 중요한 질문을 던집니다. 위의 PwC 리포트와 겹쳐 놓고 보면, 앞으로 헬스케어 시스템이 마주할 재정 상황은 만만치 않아 보입니다."}]},"46":{"index":"46","title_en":"Weekly Health Tech Reads 6/21/2026","subtitle":"현장에서 AI 스크라이브를 경험하다, Thoreau의 Ensemble 플랫폼 투자, anti-tiering/steering 조항에 가해진 결정적 한 방, 그리고 떠오르는 이중 시스템","sections":[{"heading_en":"","body":"*이번 주 뉴스레터는 다음 후원사가 함께합니다:*\n\n헬스케어 기업들은 갈수록 경험으로 경쟁합니다. Talkspace, Superpower, Berry Street 같은 회사들이 헬스케어를 위해 만들어진 AI 컨시어지 플랫폼 Lorikeet을 쓰는 이유입니다.\n\nLorikeet은 환자와 멤버의 문의를 처음부터 끝까지 해결합니다. 여러 시스템을 넘나들며 처방을 관리하고, 예약을 잡고, prior auth를 처리하고, 베네핏을 확인하고, 케어를 조율합니다. 오늘날 헬스케어 소비자가 기대하는 경험을 유지하면서 말이죠.\n\n*Lorikeet이 어떻게 대규모로 더 나은 경험을 제공하는지 확인해 보세요*\n\n*뉴스레터 스폰서십에 관심이 있으시면 알려주세요!*"},{"heading_en":"MUSING ON AI: Experiencing an ambient scribe in the wild","body":"이번 주에 저는 처음 겪는 일을 경험했습니다. 진료 예약에 갔는데, 의사가 (저는 제 진료가 아니라 가족과 함께 간 것이었습니다) 진료를 녹음해도 괜찮겠느냐고 물으면서, 헬스 시스템이 새로 도입하고 있는 앰비언트 스크라이빙 도구로 진료를 녹음하려고 자기 휴대폰을 테이블 위에 올려놓았습니다. 당연히 관심이 갔습니다. 1. 이 시장에서 벌어지고 있는 온갖 움직임 때문이기도 하고, 2. 지난주에 Abridge가 앰비언트 스크라이빙으로 진료 과정 전체를 처음부터 끝까지 문서화하는 미래의 진료 모습을 꽤 설득력 있게 그려 보이는 것을 막 들었기 때문이기도 합니다.\n\n저는 이런 도구에 관심이 있다고 의사에게 말했습니다. 제가 보기에 그 의사는 \"late majority\" 도입자로, 시스템이 도구를 밀어붙이는 가운데 다소 회의적인 태도로 스크라이브를 쓰고 있었습니다. 의사는 곧바로 녹음을 일시정지하더니, 묻지도 않았는데 이 도구에 대한 자기 생각을 늘어놓기 시작했습니다. 기술에 대해 두 가지 문제를 지적했습니다.\n\n1. 환자가 증상에 대해 말한 내용을, 의사가 보기에는 어딘가 어긋나는 의학 용어로 문서화하고 있었습니다. 입이 마른다는 식의 지나가는 말이 xerostomia로 기록되는 식입니다. 의사는 그런 말이 임상 용어로 진료 기록에 들어갈 만한 내용은 아니라고 봤습니다.\n\n2. 의사가 환자에게 한 이야기를, 의사 본인이 보기에 맞지 않는 방식으로 담아내고 있었습니다. 삶의 다음 단계에 대한 대화가 \"advanced care planning\"으로 기록되는데, 의사는 그건 좀 아니라고 말합니다. 훨씬 편안한 대화였고, 자기라면 그런 식으로 기록하지 않았을 거라고요.\n\n이 분야를 낙관적으로 보고 싶다면, 그런 지적을 시간이 지나면 해결될 사소한 문제로 넘겨 버리기는 쉬워 보입니다. 좀 더 비관적이라면, 음성이 기록의 원본이 될 경우 그 문제들이 훨씬 큰 난제가 될 수 있다고 확장해서 보기도 쉽습니다.\n\n다시 진료로 돌아가서, 의사는 스크라이브의 일시정지를 풀고 진료를 시작하며 이렇게 말했습니다. \"그래서 오늘 저는 [환자]와 그 가족분과 함께 있습니다.\" 이상한 말투였습니다. 우리가 수십 번은 만나 온 의사인데, 진료를 그런 식으로 시작한 적은 한 번도 없었으니까요. 제 생각에 의사는 AI 스크라이브에게 말하고 있었던 것 같습니다.\n\n그 뒤로 스크라이브는 배경으로 물러났고, 진료는 여느 진료와 다를 바 없이 진행됐습니다. 20분쯤 지났을 때는, 제가 그렇게까지 흥미를 느끼고 있지 않았다면 스크라이브가 거기 있다는 사실조차 잊었을 겁니다. 다른 진료와 똑같았습니다. 그러다 의사는 대화의 특정 부분에서 다시 녹음을 일시정지했습니다. 그렇게 1~2분이 지난 뒤 의사가 다시 재생을 눌렀고, 우리는 대화를 마쳤습니다. 말할 것도 없이, 음성이 기록의 원본이라면 진료 중에 이런 식으로 껐다 켰다 하는 것은 상당히 문제가 있어 보입니다.\n\n전체적으로 보면, 제가 AI 스크라이브를 둘러싼 온갖 투자 활동과 열기를 예민하게 의식하고 있지 않았다면, \"음, 좀 이상하네\" 싶은 몇 순간 말고는 아마 아예 눈치채지도 못했을 겁니다. 그건 대체로 이 분야의 가능성을 보여 주는 대목입니다. 배경으로 물러나야 하는 기술이니까요. 동시에 분명히 손봐야 할 부분들도 있습니다. 특히 이런 도구들이 얼리 어답터 집단을 넘어, 아마도 더 회의적일 폭넓은 의사 집단으로 배포될 때 그렇습니다.\n\n이 모델들이 서로 대비해 얼마나 잘 작동하는지에 대한 온갖 이야기에도 불구하고, 여기서의 문제들은 저에게 기술적인 것으로 보이지 않습니다. 인간의 신뢰와 엔터프라이즈 배포의 문제입니다. 음성이 페이어와 프로바이더가 진료에서 무슨 일이 있었는지를 판정하는 데 쓰는 문서화 레이어가 되려면, 프로바이더가 진료 중에 그것을 껐다 켰다 해서는 곤란합니다. 의사들이 그것이 무엇을 담아내고 있는지 믿지 못해 끄고 있다면, 이 분야의 서사 전체가 흔들립니다.\n\n이번 일은 이 AI 분야에서 진짜 큰 질문은 사실 기술적인 질문이 아니라, 케어 딜리버리 조직이 이런 도구를 자기 의사들뿐 아니라 환자와 페이어 파트너의 신뢰까지 얻는 방식으로 어떻게 도입하느냐 하는 조직 설계의 질문이라고 제가 생각하는 이유를 다시 일깨워 줬습니다. 그 세 다리가 다 없으면 이 모든 것이 무너집니다. 기술은 결국 그 수준에 도달할 것이라고 저는 확신하지만, 신뢰를 쌓는 쪽은 덜 확신합니다. 그리고 그것이야말로 업계 앞에 놓인 핵심 과제로 보입니다. 현장에서 AI 스크라이브를 처음 경험해 보니, 우리는 아직 모두가 거기에 도달해 있지는 않습니다."},{"heading_en":"CHART OF THE WEEK: Operating margin blues for Blues plans","body":"이 인터넷 동네에서 계속 오르내리는 화제 하나는 소규모 지역 플랜들의 곤경입니다. Blues 플랜들도 그런 어려움에서 자유롭지 않습니다. Modern Healthcare의 Nona Tepper가 짚었듯, 29개 Blues 플랜 가운데 2025년에 영업이익을 낸 곳은 7곳뿐이고, 2024년이나 2025년 중 한 해라도 이익을 낸 곳은 12곳뿐입니다. Blue Cross of Idaho는 꼴찌에서 1등으로 올라선 분위기를 강하게 풍깁니다.\n\n출처: Modern Healthcare"},{"heading_en":"","body":"*주간 뉴스레터가 마음에 드신다면 HTN Pro에 합류하세요.* 가장 중요한 뉴스에 대한 분석을 매일 받아 보고, 동료들과 이야기 나눌 수 있는 비공개 Slack도 이용할 수 있습니다.\n\n\"HTN을 좋아한다는 건 다들 아시겠지만, 이 뉴스레터가 업계 소식을 따라잡고 적시의 브리핑으로 고객에게 좋은 인상을 남기는 데 얼마나 중요한지 꼭 말씀드리고 싶었어요.\" *- Bridgette Collado*"},{"heading_en":"Key Trends to Keep an Eye On","body":"*HTN에서 주목하고 있는 뜨거운 주제에 대한 뉴스*\n\n*Thoreau가 플랫폼 행보에 나서며 AI 기반 헬스케어 어드민 플랫폼 경쟁에 합류, Ensemble을 약 120억 달러에 인수*\n\n화요일, Matt Holt의 Thoreau가 약 120억 달러 밸류에이션으로 Ensemble에 전략적 투자를 했다는 것이 공식화됐습니다. Ensemble의 현 주주인 Warburg Pincus, Berkshire Partners, Bon Secours Mercy Health는 소수 주주로 남습니다. Thoreau는 New Mountain Capital 시절 자신의 옛 포트폴리오를 인수하려던 시도가 무산된 뒤 오래지 않아 회복해, Ensemble을 새로운 플랫폼 자산으로 찾아냈습니다. Ensemble은 꽤 오래 매물로 나와 있었습니다. 지난해 말에는 약 130억 달러 밸류에이션으로 IPO와 M&A를 동시에 타진하는 듀얼 트랙 절차를 밟고 있다고 전해졌는데, 이는 여기서 IPO를 했을 경우 공개시장이 어떻게 반응했을지를 어느 정도 시사하는 듯합니다. Warburg와 Berkshire는 2022년 Golden Gate Partners로부터 약 50억 달러 밸류에이션에 Ensemble을 인수했습니다.\n\nThoreau의 다음 행보를 지켜보는 일은 무척 흥미로울 겁니다. New Mountain에서 보여 준 Holt의 플레이북과 Thoreau의 원래 비전을 보면, Ensemble에 AI 중심 자산들이 여럿 덧붙는 모습을 기대해도 좋다는 신호가 분명합니다. 보도자료에서 Thoreau 자신은 투자 플랫폼으로 소개되는데, 이는 많은 이들이 그렸던 운영 회사와는 다소 다른 그림일지도 모릅니다. 이번 주 Slack에서는 올해 초 Ensemble의 JPMorgan 발표가 신선할 만큼 인간적인 서사를 담고 있었다는 이야기를 나눴습니다. AI가 RCM을 자동화하는 데서 부딪히는 어려움을 짚으면서, 현장에 발을 딛는 접근의 가치를 강조했죠. Thoreau의 AI 중심 서사를 감안하면, 그 대목이 앞으로의 방향을 가늠할 단서를 던져 주는지도 모릅니다."},{"heading_en":"Key Trends to Keep an Eye On","body":"*anti-tiering / anti-steering 조항에 가해진 결정적 한 방이 상업 시장에서 대안적 플랜 설계의 문을 더 열어 줄 가능성*\n\nDOJ는 이번 주 OhioHealth를 상대로 한 반독점 소송을 합의로 마무리했다고 발표했습니다. 합의의 일환으로 OhioHealth는 자사의 anti-tiering 및 anti-steering 조항이 집행 불가능하다는 데 동의했습니다. 다만 제가 합의문을 읽은 바로는 all-or-nothing 조항은 상처 없이 살아남은 것으로 보입니다. DOJ가 애초에 이 소송을 제기한 것은 상업 보험 시장의 경쟁을 끌어올리기 위해서였습니다. 더 창의적인 플랜 설계의 문을 열어 주기 때문입니다. 금요일에는 백악관이 Council of Economic Advisors의 보고서를 공개했는데, anti-tiering/steering과 all-or-nothing 계약 관행을 금지하면 병원 가격을 18%, 고용주 보험료를 6.5% 낮출 수 있다는 내용이었습니다.\n\nDOJ는 New York Presbyterian을 상대로도 비슷한 소송을 제기했고, 그 소송이 비슷한 결말을 맞는지도 지켜볼 만합니다. 이것이 anti-tiering/steering 조항의 종말의 시작이라면, 상업 보험 시장에는 엄청난 기회이자, 이미 비용 상승이라는 큰 순풍을 타고 있는 대안적 플랜 설계 시장에는 거대한 순풍으로 보입니다. 이 모든 일 뒤에서 분명히 벌어지고 있을 협상 전략, 그리고 OhioHealth 같은 헬스 시스템이 무엇을 \"내줄지\"를 어떻게 저울질하는지 생각해 보면 무척 흥미롭습니다. 저라면 all-or-nothing보다 anti-tiering / steering 조항을 먼저 내주고, 시장에서의 브랜드 위상을 감안할 때 결국 상업 볼륨에는 그리 큰 영향이 없을 것이라는 데 걸겠습니다."},{"heading_en":"Key Trends to Keep an Eye On","body":"*고용주 이노베이션 시장이 계속 달아오르고 있습니다*\n\n같은 맥락에서, 이번 주에는 고용주 이노베이션 시장의 움직임을 보여 주는 흥미로운 신호 두 가지가 있었습니다. 의료비 상승이 비용 증가에 더 잘 대응하려는 고용주들에게 새로운 상품을 팔 기회를 만들어 내고 있습니다. 첫째, HCSC가 코페이만 있는 플랜 설계 Easify를 출시했습니다. HCSC 산하 여러 Blues 플랜이 이 상품을 도입하고 있는데, 코페이 온리 플랜은 몇 해 전 Bind/Surest가 시작한 흐름을 계속 이어 가는 모양새입니다. 둘째, Marathon Health와 Lantern이 파트너십을 맺고 Marathon의 프라이머리 케어 거점과 Lantern의 수술 네트워크를 결합했습니다. 어드밴스드 프라이머리 케어 모델과 전문 진료 플랫폼을 결합하는 논리는 꽤 직관적으로 보이고, 플랫폼들이 고용주가 헬스케어 비용을 총체적으로 관리하도록 도우면서 동시에 질 높은 케어에 대한 접근성도 확보하려 하는 만큼 이런 파트너십은 더 나올 것으로 봅니다."},{"heading_en":"Key Trends to Keep an Eye On","body":"*Medicare Advantage Stars 프로그램의 혼란은 계속됩니다*\n\nCMS는 Clover의 최근 법적 승리 이후 Stars 점수를 재산정하겠다는 서한을 업계에 보내며, Stars 관련 소송이 줄줄이 이어지는 상황을 선제적으로 차단한 것으로 보입니다. 점수가 더 높아진 플랜은 6월 29일까지 입찰을 다시 제출할 수 있습니다. Stars 프로그램이 존립에 관한 질문에 직면한 post-Chevron 환경에서, 이번 결정은 CMS가 다음에 무엇을 할지 고민할 시간을 버는 것으로 보입니다.\n\n이 소식에 대한 주식시장의 반응은 잠잠했는데, 이번 변화의 전반적인 파급력을 어느 정도 가늠하게 해 줍니다. 올해 초 advance/final notice를 둘러싸고 봤던 만큼의 출렁임에는 한참 못 미칩니다. 그래도 1분기 실적 시즌이 탄탄했던 업계에 또 하나의 긍정적인 자극으로 보이고, 몇 년간 힘든 시기를 보낸 뒤 2026년 전체 성과에 대한 낙관을 어느 정도 실어 줍니다. 헬스케어 비용을 둘러싼 연방정부와 업계의 협상이 계속되는 가운데, 2026년을 지나며 CMS 지도부가 이 모든 상황을 지켜보고 있을 것이라고 생각합니다. 대략 6개월 뒤면 우리는 2028년 Advance Notice를 이야기하고 있을 텐데, CMS가 납세자의 돈을 어떻게 관리해 왔는지를 평가할 때 이런 승리들이 그냥 넘어가지는 않을 것 같습니다."},{"heading_en":"A QUOTE TO PONDER: MultiCare's CFO predicts a two-tier healthcare system","body":"이런 흐름이 계속되면, 제 짐작으로는 우리는 결국 이중 시스템을 만들어 내게 될 것입니다. 상업 보험사와 자기 돈으로 낼 수 있는 사람들을 위한 시스템 하나, 그리고 Medicare와 Medicaid 환자를 위한 또 다른 시스템 말입니다\n\n- MultiCare의 CFO James Lee @ HFMA\n\nMedCityNews에 따르면 MultiCare의 CFO는 HFMA에서 이런 생각을 밝히며, 상업 보험 환자를 우선할 수밖에 없고 그 결과 CMS가 보장하는 환자들은 진료를 더 오래 기다리게 될 것이라고 말했습니다.\n\n저는 Lee의 결론에 대체로 동의하는 편입니다. 다만 정치적으로 보면, 대형 헬스 시스템이 상업 보험 인구에게 우선적인 접근권을 준다고 대놓고 말하는 것은 이길 수 없는 싸움이라고 생각합니다. 케어 딜리버리 주체들이 가난한 사람들의 진료를 늦춘다는 악몽 같은 PR 기사에 시달리지 않으면서 이 일을 실제로 어떻게 해낼 수 있을지에 대해 흥미로운 함의가 있습니다."},{"heading_en":"Other Top Headlines","body":"*그 밖의 주목할 만한 헤드라인 정리*\n\n인디애나주의 병원 가격 상한 시도는 현재 미국에서 병원 가격을 억제하려는 규제 노력 가운데 더 흥미로운 축에 속합니다. 가격 상한을 초과하는 병원은 2029년까지 기준선 아래로 내려오지 못하면 면세 지위를 잃을 수 있습니다. 이 때문에 어떤 숫자를 그 기준에 넣어야 하는지를 두고 논쟁이 벌어지고 있습니다. 의사 진료 서비스를 포함하면 병원들은 전체 상한 아래에 있는 것처럼 보이게 됩니다. 헬스 시스템이 제공하는 모든 서비스를 기준에 포함하는 것이 논리적으로는 맞아 보입니다. 하지만 근본 문제가 입원 비용이 너무 높다는 것이라면, 계산에 의사 진료 비용을 포함시키는 것은 시스템이 가중평균을 기준선 아래로 낮출 수 있게 해 주고, 이는 가격 상한의 취지를 통째로 무너뜨리는 것처럼 보입니다."},{"heading_en":"Other Top Headlines","body":"*Midjourney*, AI 영상으로 널리 알려진 그 회사가 헬스케어 시장에 진출합니다. 60초짜리 전신 MRI 스캐닝 도구와 함께 샌프란시스코에 2만 3,000제곱피트 규모의 메드스파/웰니스 클리닉을 열겠다고 발표했습니다. Midjourney는 2031년까지 전 세계 5,000개 지점에 이 MRI 스캐너 5만 대를 배치할 수 있기를 바라며, 그러려면 200억 달러가 필요할지도 모른다고 아무렇지 않게 던졌습니다. 메드스파 지점은 2027년 말에나 문을 엽니다. Midjourney는 Butterfly Network와 라이선스 계약을 맺고 Butterfly Network의 초음파 기술을 자사 스캐너에 사용합니다. Midjourney는 이런 조기 영상 진단이 있으면 세상이 전체 사망의 30%와 미래 헬스케어 비용의 50%를 피할 수 있을 것이라고 말하는데, 회사의 구호로는 훌륭하고 또 살아 보면 아주 쾌적할 평행우주처럼 느껴집니다. 여기서의 접근 방식 전체가 저에게는 그저 혼란스럽습니다. 기술이 잘 작동하기를 바라지만, 그렇다면 그냥 기술을 만들어서 다른 클리닉에 팔면 되지 않나요? 왜 메드스파까지 짓는 데 힘을 쏟는 걸까요? 사람들은 혁명적인 스캐닝 기술을 AI가 만들어 낸 스파 경험의 일부일 때만 쓰려고 할까요? 저는 모르겠습니다. 한편으로는 이 발표 뒤에서 뜯어볼 만한 더 흥미로운 기술은 Butterfly 쪽이라는 생각도 듭니다."},{"heading_en":"Other Top Headlines","body":"*OpenLoop Health*가 새 상품을 발표했는데, D2C 텔레헬스를 위한 Shopify 같은 것으로 보입니다. 인플루언서, 헬스장, 데이팅 앱 등 팔로워를 가진 누구든 몇 시간 안에 텔레헬스 사이트를 띄워 GLP-1 같은 것을 팔기 시작할 수 있게 해 준다고 합니다. 이것이 케어 접근성에 좋은 일이라고 보든, MedVi 같은 시나리오를 더 부추기는 일이라고 보든, 웰니스 시장에서 무언가를 만들기에 흥미로운 시기인 것만은 분명해 보입니다."},{"heading_en":"Other Top Headlines","body":"PBM 시장에서는 LucyRx와 Abarca Health가 합병해, 두 회사의 플랫폼을 결합해서 Big Three와 겨루기에 더 좋은 위치에 선 현대적인 PBM을 만들려 합니다."},{"heading_en":"Funding Announcements","body":"*이번 주 가장 흥미로운 펀딩 라운드 소개*\n\n*Connie*, Medicare Advantage 브로커리지를 AI로 묶어 올리는 롤업 회사가 4,000만 달러를 조달했습니다. HealthQuest Capital이 라운드를 주도했습니다. 자금 조달과 함께 Connie는 열 번째 브로커리지 인수를 발표했습니다. 지금 브로커리지 시장에는 상당한 모멘텀이 보입니다. 구체적으로는 독립 브로커리지를 AI로 롤업하는 플레이 주변에서, 더 넓게는 MA 시장에서 전략적 조언자로서 브로커가 갖는 중요성 측면에서요. MA 시장이 변해 가는 가운데 이 이론은 설득력이 있다고 보며, 멤버/플랜의 신뢰받는 조언자로 스스로를 자리매김하면서 꽤 좋은 성과를 낼 회사들도 나올 것입니다. 이 시장이 달아오르면서 우리가 지켜보는 지점 하나는, 좋은 독립 브로커리지를 두고 벌어지는 경쟁이 인수 가격을 거품 수준으로 밀어 올려 재무 성과를 갉아먹지는 않을지입니다."},{"heading_en":"Funding Announcements","body":"*InStride Health*, 버추얼 소아 정신건강 모델이 3,000만 달러를 조달했습니다. Echo Health Ventures와 FMZ Ventures가 라운드를 주도했습니다. InStride는 전국으로 확장 중이며 현재 17개 주에서 운영하면서 5,000명이 넘는 환자를 진료하고 있다고 밝혔습니다. 2025년에 매출이 두 배가 됐고 2026년에도 다시 두 배가 될 것으로 기대합니다. InStride에는 멋진 배경이 있습니다. 공동창업자들이 McLean Hospital에서 임상 모델을 개발했고, 그것을 InStride로 발전시켰습니다."},{"heading_en":"Funding Announcements","body":"*OffPlan*, 의사들이 DPC 진료소를 열고 소규모 고용주와 계약하도록 돕는 스타트업이 시드 라운드에서 250만 달러를 조달했습니다. 올해 안에 버지니아와 플로리다에서 시작한 뒤 전국으로 확장할 계획입니다. 지금 DPC 시장의 모멘텀을 보여 주는 또 하나의 신호이기는 하지만, 이 버전의 플레이는 난이도가 극도로 높아 보입니다. DPC 클리닉을 통째로 얹어 주는 clinic-in-a-box 모델과 고용주를 위한 대안적 플랜 설계/네트워크를 동시에 만들려는 시도이기 때문입니다. 얼마 전 Mending이 ACA 시장에서 빠져나오면서 고용주 대상 DPC 네트워크 플레이에 집중하는 쪽으로 방향을 튼 것을 봤는데, 이 방정식에서 한 조각에만 집중하는 것의 이점을 시사하는지도 모릅니다."},{"heading_en":"What I'm Reading","body":"NPR이 고용주를 통한 GLP-1 접근성에 대한 기사를 실으면서 두 가지 일화를 조명했습니다. Vida Health를 이용한 경험에 불만을 가진 직원, 그리고 Virta Health가 자기 환자 중 한 명의 GLP-1을 중단시킨 데 불만을 가진 프라이머리 케어 의사입니다. 기사에 깔린 저변의 톤은 이런 접근이 고용주가 GLP-1 접근을 관리하도록 돕는다는 것이고, 그렇다면 환자 편이 아니라는 뜻이 됩니다. PR 관점에서 이 업계가 조심해야 할 지점입니다. 고용주들이 GLP-1 비용을 어떻게 관리할지 씨름하는 가운데, 이런 접근들이 전통적인 utilization management 비판과 아주 비슷한 거센 비난에 직면하는 그림은 어렵지 않게 그려집니다. GLP-1 접근을 거부당해 좌절한 직원들에 대한 기사는 거의 저절로 쓰입니다."},{"heading_en":"What I'm Reading","body":"NPR은 또 오리건주 응급실 인력 사태의 결말도 조명했습니다. PeaceHealth가 ApolloMD와의 계약을 해지하고, 밀려날 위기에 놓였던 지역 ED 그룹과 계약하는 쪽으로 나아가고 있습니다. Oregon Nurses Association은 이를 \"모든 오리건 주민을 위한 역사적 승리\"라며 환영했고, NPR은 그 안에서 작동하는 여러 corporate practice of medicine 역학을 짚었습니다. 비슷한 상황이 다른 지역에서도 필연적으로 벌어질 테니 이 사례를 기억해 둘 만합니다."},{"heading_en":"What I'm Reading","body":"저는 한 정형외과 의사가 Higmark Health의 결정, 즉 prior auth를 EviCore에서 내부 AI 솔루션으로 옮기기로 한 결정을 한탄하며 쓴 이 Substack 글이 무척 흥미로웠습니다. 논지의 핵심은 수술 재료를 둘러싼 모호함 때문에 AI가 더 많은 클레임을 거절하고 있다는 것입니다. eviCore의 사람들이었다면 그 모호함을 다르게 해석해 클레임을 승인했으리라는 것이죠. 참고로 이 eviCore는 EvilCore라고 불려 온 바로 그 eviCore이고, Cigna는 이 자산을 털어내고 넘어가려 하면서 사실상 가치가 없다고 판단한 상태입니다. 조직들이 AI로 옮겨 가면서 현장에서 실제로 무슨 일이 벌어지고 있는지, 왜 제가 페이어/프로바이더 사이의 마찰을 완전히 자동화하는 것은 헛된 꿈이라고 여전히 꽤 확신하는지, 그리고 AI 중심의 세계에서도 사람이 왜 핵심적인 역할을 할지를 아주 잘 보여 주는 사례입니다. 제가 투자자였다면 지금 Cigna의 corp dev 팀에 eviCore의 호가를 물어보고 있을 겁니다…"},{"heading_en":"What I'm Reading","body":"WSJ는 유타에서 AI 처방 리필 파일럿을 둘러싸고 계속되는 충돌을 조명하며, 환자 안전과 의료 배상책임에 대한 의사들의 우려를 짚었습니다. 한편 Doctronic / 유타주 AI Office가 이런 문제들에 내놓는 답변은 꽤 명료해 보입니다. AI 닥터 파일럿을 굴리는 온갖 방법 중에서도 유타의 이번 접근은 상당히 합리적이라고 저는 계속 생각합니다."}]},"47":{"index":"47","title_en":"Weekly Health Tech Reads 6/28/2026","subtitle":"Cityblock이 Homeward를 인수한다; Prosper와 Assort의 펀딩 라운드 이후 agentic voice AI 시장의 상황에 대한 단상;","sections":[{"heading_en":"This week’s newsletter is brought to you by: Alumni Ventures","body":"헬스 테크 투자에 관심이 있다면, Alumni Ventures Healthtech Syndicate를 통해 개인도 a16z, Lightspeed, Khosla Ventures 같은 최상위 투자사가 투자한 스타트업에 투자할 수 있습니다.\n\n가입은 무료이고 간단합니다. 멤버는 전체 실사 자료를 포함한 선별된 딜 플로우에 먼저 접근할 수 있고, $10K부터 투자할 수 있는 선택권을 갖습니다.\n\nAlumni Ventures는 확신을 갖고 결정하는 데 필요한 모든 것을 공유하며, 같은 생각을 가진 투자자 커뮤니티와 연결해 줍니다.\n\nHTN은 Alumni Ventures와 제휴 관계가 없으며 투자 자문을 제공하지 않습니다.\n\n최신 헬스 테크 딜 보기\n\nHealth Tech Nerds 스폰서가 되어 보세요."},{"heading_en":"VOICE AI","body":"agentic voice AI 시장에서는 무슨 일이 벌어지고 있나?\n\n이번 주에는 케어 딜리버리 조직을 위한 선도적인 엔드투엔드 환자 대면 agentic voice AI 플랫폼 자리를 놓고 경쟁하는 두 회사가 며칠 사이로 대형 펀딩 라운드를 발표했다.\n\n화요일에 Prosper AI는 a16z 등으로부터 3,000만 달러를 유치했다고 발표했다. Prosper는 지난 6개월간 매출이 5배 성장했다고 밝혔다. 수요일에는 Assort Health가 Menlo Ventures 등으로부터 12억 달러 밸류에이션에 1억 2,000만 달러를 유치했다고 발표했다. Assort 역시 지난 15개월간 매출이 20배 성장했다고 밝혔는데, 이는 이전 매출 추정치를 근거로 보면 현재 ARR이 약 6,000만 달러 수준임을 시사하는 것으로 보인다.\n\n두 회사의 보도자료를 훑어보며 각자가 시장을 선도하는 agentic AI 플랫폼이 되겠다는 포부를 어떻게 서술하는지 보는 것은 흥미롭다. 각 회사의 차별화된 플랫폼을 설명하는 고객 인용문이 이상할 만큼 서로 닮았다:\n\n이것들이 스타트업 펀딩 발표이고 그런 발표에는 어떤 말이든 담기기 마련이라는 걸 알지만, 그래도 이 인용문들은 좀 묘하지 않은가? 여기 두 고객이 있는데, 둘 다 시장을 종합적으로 평가한 끝에 자기네 벤더가 자신들의 요구를 충족하는 유일한 플랫폼이라고 결론 내렸다고 주장한다.\n\n한편 Assort와 Prosper의 웹사이트를 (이 시장의 다른 여러 벤더는 말할 것도 없고) 훑어보면 플랫폼 역량은 완전히 똑같이 들린다. 스케줄링, 자격 확인, 청구 등을 처리하는 에이전트 말이다. 게다가 지난 가을 Assort가 직전 펀딩을 받은 뒤 내가 Assort의 에이전트 하나를 실제로 테스트해 봤을 때 결과가 그리 고무적이지도 않았다. 이 고객들이 플랫폼 요구사항을 서로 매우 다르게 평가하고 있거나, 이 벤더들이 시장의 서로 다른 세그먼트에서 영업하고 있거나, 아니면 이 평가들이 말하는 것만큼 견고하지 않거나 셋 중 하나다. 어느 설명도 이들이 성숙하고 차별화된 플랫폼으로서 실력으로 이기고 있다는 확신을 주지는 못한다.\n\n어쩌면 이 모든 게 실제로는 중요하지 않을지도 모른다. 아래 차트에서 보듯 이 회사들은 각자 선호하는 우상향 지표로 엄청난 성장을 보고하고 있으니 말이다. 각 회사가 자사의 인상적인 성장 궤적을 부각하려고 서로 다른 지표를 고르고 있다는 일반적인 이야기를 잘 보여주는 듯하다:\n\n출처: HTN; 회사 보도자료\n\n이 회사들의 성장과 투자자 관심을 이끄는 근본적인 논리는 꽤 단순해 보인다 — 의료 practice들은 행정 지원이 절실하고, agentic AI는 그 업무 상당수를 꽤 효과적으로 처리한다. 특히 이런 practice들이 행정 인력을 채용하는 데 어려움을 겪고 있을 때는 더욱 그렇다. agentic voice AI 스타트업 웹사이트에 올라와 있는 수많은 사례 연구가 이를 보여주며, 위 차트의 성장세도 마찬가지다.\n\n예를 들어 이 Prosper AI 고객을 보라. 북동부의 한 OB/GYN 그룹인데, 스케줄링 효율을 높여 EBITDA를 10만 달러 개선했고, 그것도 몇 주 만에 이뤄낸 것으로 보인다. 아니면 연간 110만 달러의 인건비 절감을 보고한 이 Prosper 고객도 있다. 또는 130만 달러의 매출 증가와 40만 달러의 인건비 절감을 보고 있는 이 Assort 고객, 100만 달러의 매출 증가를 보고한 또 다른 고객도 있다. 모두 상당히 인상적인 결과다. 이 회사들이 지금 이렇게 빠르게 성장하는 이유를 이해하기는 어렵지 않다.\n\n이 모든 움직임 덕분에 이번 주 Slack에서 이 agentic voice AI 시장의 규모와 지속 가능성에 대한 좋은 대화가 오갔다. 특히 PE 투자를 받은 전문과 practice 하위 세그먼트 안에서는 AI 보이스 에이전트로 단기간에 재무를 개선할 기회가 분명히 있다. 그 기회를 좇아 달려가는 회사들을 여기서 볼 수 있다. 훨씬 덜 분명한 것은 이 시장이 몇 개의 회사를 지탱할 수 있느냐, 그리고 장기적으로 실제로 무엇이 승리하느냐다. 지금 차별화는 주로 GTM에 있는 것으로 보인다. 고객 앞에 먼저 나서서 몇 주 만에 재무 성과를 보여주며 그들을 붙잡는 것이다. 이 회사들은 자신들이 플랫폼 승부에서 시장의 엄격한 헤드투헤드 평가를 이기고 있는 플랫폼이라고 주장하지만, 내게는 그럴 가능성이 상당히 낮아 보인다. 훨씬 더 그럴듯한 것은, 이것이 AI 이전의 암흑기에서 빠져나오는 practice들을 두고 벌이는 땅따먹기이고, 벤더들은 그 practice들에게 재무적 상승 여지를 부각해 계약을 따내고 있다는 것이다. 이 역량들이 기본 사양이 되어 갈 때 이 기회가 얼마나 지속 가능한가 하는 질문이 생긴다.\n\n의료 그룹들이 그저 전화를 제대로 받는 것만으로 챙길 수 있는 공짜 돈이 사실상 존재하는 상태가 영원히 지속될 수는 없다. 비교적 가까운 미래의 어느 시점에는 이 인플레이션적 환경이 가라앉을 수밖에 없어 보이고, 그러면 practice들은 자신들이 어디에 돈을 쓰고 있는지 더 면밀히 따져보게 될 것이다. 그때 이 시장의 역학이 어떤 모습일지 생각해 볼 가치가 있다고 본다.\n\n나는 이 특정 시장이 여러 개의 10억 달러 이상 결과를 지탱할 것이라고 그리 낙관하지 않는데, 이번 벤처 라운드들은 그것을 전제하는 듯하다. Assort 같은 회사들은 시장을 롤업할 채비를 하는 것으로 보이며, 최선의 밸류에이션 결과는 롤업 경쟁에서 이긴 뒤 FOMO를 느끼는 더 큰 조직에 인수되는 타이밍을 잘 잡는 것으로 보인다."},{"heading_en":"In Partnership with Nashville Health Care Council","body":"9월 13일부터 15일까지 Nashville Healthcare Sessions에서 저희를 만날 수 있습니다. 기존 사업자, 혁신 기업, 투자자를 아울러 약 1,500명으로 참가를 제한한 내실 있는 컨퍼런스로, AI, VBC, 헬스 정책 등을 논의합니다.\n\n코드 HTNSESSIONS로 등록하면 $100 할인됩니다."},{"heading_en":"CHART OF THE WEEK","body":"의사 공급과 평균 대기 시간을 매핑했을 때 나오는 직관에 반하는 결과\n\n나는 의사 부족 데이터에 대한 좋은 단상이라면 사족을 못 쓰는데, Joel Selanikio의 이 Substack 글도 예외가 아니다. 이 글은 Massachusetts가 미국의 어느 주보다 인구당 의사 수가 많은데도 Boston이 (아래의 다른 대형 대도시권과 비교해) 미국에서 의사를 만나기까지 평균 대기 시간이 가장 긴 곳이라는 점을 짚는다. 그 점이 아래 차트에 시각적으로 드러난다. 직관적으로는 그 반대가 맞을 것 같다 — 인구당 의사가 많을수록 대기 시간이 짧아야 하지 않나? 이 글은 수요/공급과 우리가 이런 것들을 어떻게 측정하는지에 대해 많은 질문을 던지게 한다."},{"heading_en":"Other Top Headlines","body":"Cityblock이 Homeward Health를 인수하는 것으로 알려졌으며, 이를 통해 Michigan에서 BCBS Michigan 및 Aetna와 맺은 Homeward의 인네트워크 Medicare Advantage 계약을 확보하게 된다. Homeward는 2022년 초 General Catalyst로부터 2,000만 달러를 투자받아, 농촌 지역 케어 딜리버리를 다시 생각하겠다는 내러티브와 함께 출범했다. General Catalyst는 Cityblock의 투자자이기도 하다. 2022년 8월 Homeward는 Michigan에서 초기 성과를 내면서 3억 4,500만 달러 밸류에이션에 5,000만 달러를 추가로 유치했는데, 이는 결국 당시 투자 환경이 얼마나 거품이었는지를 다시 한 번 뼈아프게 상기시키는 사례로 보인다. Homeward는 Cityblock에게 Medicare Advantage, 특히 농촌 케어 영역에서 쌓아 올릴 만한 흥미로운 다각화 기회를 제공한다."},{"heading_en":"Other Top Headlines","body":"임상 AI 스타트업 UpDoc이 자사 LLM이 FDA 클리어런스를 받았으며 1,800만 달러의 Seed 투자를 유치했다고 발표했다. WSJ Pro는 이 클리어런스를 다루며 UpDoc을 “컨시어지 닥터”로 표현했지만, 이 회사가 받은 510(k) 클리어런스는 내가 생각하는 AI 의사보다는 훨씬 좁게 인슐린 용량 조절에 한정된 것으로 보인다. 승인 이후 Cleveland Clinic은 환자 결과에 어떤 영향을 미치는지 보기 위해 6~12개월 파일럿을 시작할 예정인데, 나는 그게 FDA 승인의 목적이라고 생각했다. 이는 임상 케어에서 AI에 대한 올바른 규제 프레임워크가 무엇인지, 그리고 AI를 (여기서처럼) 의료기기에 가깝게 다뤄야 하는지 아니면 의료를 행하는 임상의에 가깝게 다뤄야 하는지에 대해 흥미로운 질문을 많이 던진다. 임상 AI를 의료 행위에 훨씬 가깝게 다루는 방향인 Utah에서 시험되고 있는 규제 접근이 개념적으로는 내게 훨씬 더 말이 된다."},{"heading_en":"Other Top Headlines","body":"Modern Healthcare가 2027년 ACA 요율 신고를 초기 분석한 결과, 페이어들이 또 한 해 높은 보험료 인상을 계획하고 있으며 상당수가 10% 이상의 인상을 요청하고 있는 것으로 나타났다."},{"heading_en":"Other Top Headlines","body":"Elevance Health가 CMS에 3억 4,200만 달러를 지급했다. 이는 CMS가 제재를 가해 올해 후반 Elevance MA 플랜의 신규 가입을 중단시킬 뻔했던 리스크 조정 문제를 해결하는 조치의 일환이다."},{"heading_en":"A NUMBER TO PONDER","body":"9조 달러\n\n이번 주 Health Affairs에 실린 최신 국민의료비 지출 데이터는 그 규모가 2034년에 9조 달러에 이르러 GDP의 20.6%를 차지할 것으로 시사한다. 이는 2024년에 보고된 5조 3,000억 달러, GDP의 18%에서 늘어난 수치다."},{"heading_en":"Funding Announcements","body":"프랑스 인슈어테크 플랫폼 Alan이 약 5억 5,500만 달러를 유치하며 기업 가치를 약 63억 달러로 평가받았다. Prosus가 라운드를 주도했다. Alan의 CEO는 LinkedIn에서 회사가 약 9억 2,500만 달러의 매출을 내고 있고 연 53% 이상 성장하고 있으며 “프랑스에서는 흑자”라고 밝혔다. Alan이 벨기에, 스페인, 캐나다에서도 서비스하고 있다는 점은 짚어둘 만한데, 이는 사업 전체로는 실제로 흑자가 아님을 시사하는 것으로 보인다. 지난 몇 년간 미국에서 인슈어테크 스타트업들이 규모 있는 수익성에 도달하는 데 어떤 어려움을 겪었는지 봐 왔으니, Alan이 매출 6배 멀티플에 걸맞게 성장해 가는지 지켜볼 만하다."},{"heading_en":"Funding Announcements","body":"규제 산업을 위한 agentic 운영체제 Trase가 1억 700만 달러의 Seed 투자를 유치했다. ARCH Venture Partners가 라운드를 주도했다. Trase의 보도자료는 Duke Health에서 진행 중인 작업을 부각하는데, 심장내과에서 매달 5,000건 이상의 팩스를 자동화해 해당 부서에 연간 28만 5,000달러 상당의 인력 여력을 확보해 줬다고 한다. 내게는 꽤 논리적인 AI 도입 사례로 보인다. 벤처 스튜디오 Red Cell Partners는 지난 가을 1,050만 달러의 pre-seed 자금으로 Trase를 출범시켰다."},{"heading_en":"Funding Announcements","body":"원격 환자 모니터링 플랫폼 Cadence가 1억 달러를 유치했다. Spark Capital이 라운드를 주도했고, Thrive, General Catalyst, Coatue, B Capital, Memorial Hermann, Duke Health 등 인상적인 투자자 명단이 함께했다. 보도자료에 담긴 Cadence의 내러티브는 RPM보다 훨씬 넓은데, Duke 같은 헬스 시스템을 위한 AI 기반 원격 케어 모델이라는 비전을 이야기한다. Cadence는 현재 20개 헬스 시스템과 함께 10만 명의 환자를 보고 있는 상태에서 1,000만 명까지 확대하겠다는 포부를 밝혔다. AI 케어 딜리버리 모델에 대한 관심과 fee-for-service RPM 청구 관행에 대한 감시 강화를 함께 고려하면, Cadence로서는 논리적인 확장이다. Stat에 실린 Mario Aguilar의 기사는 이것이 Cadence의 기존 헬스 시스템 고객 일부에게 의미 있는 변화가 될 것임을 보여주는 좋은 예를 담았는데, Rush가 청구 방식을 다시 생각하는 동시에 그것을 AI 컴플라이언스 검토 프로세스에 통과시켜야 한다는 점을 짚는다."},{"heading_en":"Funding Announcements","body":"오리지널 Medicare 수급자를 위한 케어 코디네이션 플랫폼 Hera가 2,700만 달러를 유치했다. Bain Capital Ventures가 라운드를 주도했다. Hera는 지난해 출범한 이후 1,000명이 넘는 시니어에게 케어 코디네이션 서비스를 제공하고 있으며, 올해 25개 주로 확대할 계획이다. Chronic Care Management(CCM) 코드를 활용해 오리지널 Medicare 수급자에게 이 서비스를 제공하고, 1099 계약직 RN과 사회복지사를 활용해 프로바이더에 incident to로 청구하는 것으로 보인다. 최근 이 시장에서 나온 몇 안 되는 시도 중 하나이며, 앞으로 몇 년간 이 시장이 어떻게 전개될지 계속 지켜볼 것이다."},{"heading_en":"Funding Announcements","body":"주거 불안정 문제를 다루는 플랫폼 Upside가 2,000만 달러를 유치했다. Aquiline이 라운드를 주도했다. Upside는 Medicaid 인구를 대상으로 10개 주에서 서비스하고 있으며 20개 페이어와 계약을 맺고 있다. 인게이지먼트 수치가 꽤 인상적이다. Upside는 대상 멤버의 90%와 연결에 성공하고, 연결된 사람 중 85%를 등록시키며, 전체 대상 멤버의 50%에 대해 주거를 안정화했다고 보고한다. 우리는 대체로 Medicaid 시장이 맞고 있는 역풍을 이야기하지만, 이처럼 모멘텀을 보이는 구간도 분명히 있어 보인다. 페이어가 주거 니즈를 다루는 것을 생각할 때마다 나는 2019년 UHG의 MyConnections 프로그램을 다룬 이 훌륭한 Bloomberg 기사로 돌아가게 되는데, 이 기사는 여기 놓인 사회적 기회와 이런 접근의 재무를 양쪽 다 정말 잘 정리해 놓았다."},{"heading_en":"What I’m Reading","body":"나는 스톱로스 시장에서의 “레이저링(lasering)” 개념이 꽤 궁금하다. 보험사가 단체 보험에서 고위험 개인 한 명에게 훨씬 높은 공제액을 적용해 사실상 그 사람을 떼어내는 것을 말한다. 종양학, 스페셜티 의약품, 복잡한 수술과 관련된 높은 비용에 대응하는 데 쓰이고 있다. Marsh and McLennan은 최근 고비용 시술을 받을 가능성이 있던 직원 한 명에 대해 “레이저”를 권고해 600인 규모 회사가 약 100만 달러를 절감하도록 도운 사례를 소개했다. Marsh는 분석 끝에 향후 1년 내에 그 시술이 일어나지 않을 것으로 판단했고, 레이저 비용을 86만 5,000달러 대신 70만 달러로 낮춰 협상했다. 이런 접근이 계속 확산될 경우의 파급 효과에 대해서는 궁금한 점이 많다."},{"heading_en":"What I’m Reading","body":"Michael Stratton과 Health Data Atlas 팀이 독립형 응급실의 증가와 몇몇 주에서 그 증가가 갖는 함의에 대한 좋은 설명 글을 공유했다. 여기서는 Texas가 선두 주이며, ED 방문의 약 25%가 독립형 ED에서 처리되는 것으로 보인다. 이 글은 HCA, Atrium Health, Nutex Health가 이 시장의 더 큰 플레이어들이라는 점을 짚는다. HTN 정기 독자라면 Nutex Health가 아웃오브네트워크를 유지하면서 No Surprises Act를 활용하는 공격적인 청구 전략으로 Idaho에서 논란을 일으켜 온 것을 기억할 것이다."},{"heading_en":"What I’m Reading","body":"No Surprises Act를 둘러싼 꼼수 이야기가 나온 김에, Elevance는 자사 IDR 데이터에서 가장 흔한 25개 예정 수술 및 내시경 시술을 살펴본 데이터를 공유했다. IDR 절차와 FFS Medicare 사이의 지급액 차이는 어마어마해서, 중앙값 지급액은 67.4배, 평균 지급액은 144.8배 높았다. 프로바이더와 페이어 모두 NSA를 둘러싼 각자의 주장에 강한 확신을 갖고 있다는 걸 알지만, 이런 결과들은 내게 여전히 전혀 말이 되지 않는다."}]},"48":{"index":"48","title_en":"Weekly Health Tech Reads 7/12/26","subtitle":"Kaiser의 AI 콜센터 문제, Evidenced의 새 2,400만 달러 펀드, 억만장자를 위한 OB/GYN, 그리고 소송으로 정신없었던 한 주","sections":[{"heading_en":"Today's newsletter is brought to you by: Medallion","body":"오늘의 뉴스레터는 Medallion이 후원합니다.\n\n헬스케어는 전환점에 서 있습니다 — AI와 정책, 그리고 운영상의 압박이 '준비된 상태'란 실제로 무엇인지를 다시 만들어 가고 있습니다. 9월 1일 Medallion의 Elevate에 참여하세요. 헬스케어 리더와 실무자들이 모여 이 산업이 어디로 향하고 있으며 그곳에 어떻게 도달할지를 파헤치는, 하루 종일 진행되는 온라인 행사입니다.\n\nElevate 등록하기\n\n뉴스레터 스폰서십에 관심이 있으시면 알려주세요!"},{"heading_en":"AI: Kaiser's Nurse Call Center AI Woes","body":"이번 주에 읽은 기사는 무척 흥미로웠습니다. Kaiser 콜센터의 'AI 감시'에 분노하며 그 AI가 환자 케어를 더 나쁘게 만들고 있다고 주장하는 Kaiser 콜센터 간호사들에 관한 내용이었습니다. 이 기사는 Kaiser가 콜센터에서 AI를 실제로 어떻게 쓰고 있는지, 또는 그것이 어떤 식으로 실제로 케어를 악화시켰는지에 대해서는 구체적인 내용을 별로 제시하지 않고, 간호사가 생산적인지를 판단하기 위해 AI가 매일 사용되고 있다는 일반적인 개념을 전하는 데 그칩니다.\n\n적어도 제가 해석하기로 이 주장의 핵심은, 간호사들이 더 이상 사람을 인간적인 손길로 대할 수 없다고 느낀다는 점입니다. 다음 인용문이 이를 잘 보여 줍니다:\n\n\"예전에는 환자가 회복하는 데 도움이 되도록 유머를 쓰곤 했는데, 여기서는 통화가 녹음되고 있다는 걸 알기 때문에 그렇게 하는 게 편치 않습니다. 환자가 유머나 개인적인 연민을 고마워하는지는 언제든 알 수 있죠. 하지만 콜센터에는 그런 것을 받아들일 여유가 없다고 느낍니다. 스크립트에 없는 일이니까요.\" 그녀는 말했습니다. \"그건 간호사로 일한다는 것의 의미 전체와, 환자들이 간호사에게 기대하게 된 것을 앗아갑니다.\"\n\n출처: CalMatters 보도, 익명의 Kaiser 간호사\n\n이 문제는 Kaiser가 AI를 두고 겪어 온 더 넓은 과제의 일부로 불거졌으며, 올해 초 정신건강 전문가들의 파업이 이를 잘 보여 줬습니다. 다만 여기서 짚어 둘 점은, Kaiser의 간호사들이 우려를 표해 왔지만 그 우려가 아직 실제 문제로 나타났는지는 분명하지 않다는 것입니다. 보도에 따르면 Kaiser는 통화 시간에 대한 환자 불만을 한 건도 받지 않았고, 통화를 너무 오래 했다는 이유로 해고된 사람의 사례도 제시되지 않았습니다. Kaiser는 그 지표를 성과 평가에 사용하지 않는다고 밝혔습니다.\n\n그럼에도 이 기사는 Kaiser가 환자 안전보다 이익을 우선한다는 서사의 문을 열어 줍니다. 기사에 등장하는 한 간호사가 시사한 것처럼 말이죠. 어느 정도는 Kaiser가 여기서 이익을 신경 쓰고 있는 게 사실일 수밖에 없지 않을까요? 저는 그것이 악의적인 지적이라고 생각하지 않습니다. 제기된 환자 안전 문제는 Kaiser의 AI 도입에만 국한되지 않는 훨씬 더 넓은 질문으로 보입니다. 오히려 헬스케어 조직들이 씨름하고 있는 더 광범위한 인력 전환과 조직 재설계를 냉정하게 상기시키는 일처럼 보입니다. 이 기사가 보여 주듯, 콜센터를 채우고 있는 사람들의 신뢰를 잃었다면 Kaiser가 콜센터에서 AI를 실제로 어떻게 쓰고 있는지는 별로 중요하지 않습니다.\n\n지금 진행 중인 AI 전환을 감안할 때, 콜센터가 이런 조직 재설계의 최전선이 된 것을 보는 일은 꽤 흥미롭습니다. 몇 주 전에 읽은 HBR 기사가 떠오릅니다. UHC의 Consumer Resolution Center가 거둔 성공과, 그곳이 'AI 알고리즘과 잘 훈련되고 공감 능력 있는 직원들의 조합'을 활용해 소비자 문제를 신속히 해결하고 그 학습을 조직 전반에 더 넓게 적용하는 방식을 다룬 글이었습니다. UHC의 경험은 위의 Kaiser 사안에 유용한 대비를 제공하며, 소비자에게 이익이 되는 새로운 핵심 전략 자산을 만들어 낸 조직 전환의 긍정적인 면을 보여 줍니다. 두 기사의 톤 차이는 눈에 띕니다 — UHC의 기사는 직원들이 더 큰 공감을 갖고 행동할 수 있게 하는 관점을 제시하는 반면, Kaiser의 기사는 직원들이 공감을 갖고 행동할 수 없다고 느끼는 관점을 제시합니다.\n\n제가 운영 부문에서 이런 AI 중심의 조직 재설계를 검토하는 헬스케어 임원이라면, UHC CRC 모델을 성공의 청사진으로 어떻게 활용할지 오래 깊이 고민하는 동시에, Kaiser가 직면한 신뢰 문제로부터는 최대한 멀리 떨어져 있으려 할 것입니다."},{"heading_en":"HTN EXCLUSIVE: Exclusive: Evidenced, a venture fund focused on healthcare bets with regulatory tailwinds, raises $24 million","body":"업계 베테랑 Bryan Sivak과 Sean Glass가 운영하는 VC 펀드 Evidenced가 첫 번째 펀드로 2,400만 달러를 조성했습니다. 저희는 내일 오전 9시 35분(CT) Grand Round Up에서 Bryan, Sean과 새 펀드에 대해 이야기를 나눌 예정입니다.\n\nLP 명단에는 Rockefeller Foundation, Rock Creek Group, Colibri 등이 포함되어 있습니다. Evidenced는 이미 저희가 지켜볼 만하다고 생각하는 헬스케어 기업들로 인상적인 포트폴리오를 갖추고 있는데, Accompany Health, Fabric Health, Ilant Health, Photon 등이 있습니다.\n\nEvidenced의 논지는 규제 순풍이 있는 기회를 찾아내는 데 중심을 두고 있습니다. 저희에게 이는 늘 헬스케어 서비스 투자에서 알파를 발굴하는 가장 단순명료한 방법 중 하나로 보여 왔습니다. 말할 것도 없이 지금은 주와 연방 정책이 대단히 변동성이 큰 시기이며, 정책의 흐름을 남들보다 더 효과적으로 읽어 낼 수 있다면 알파를 만들어 낼 기회는 오히려 커질 것이라고 생각합니다.\n\n정책이 이렇게 소용돌이치는 상황에서, 내일 Bryan과 Sean에게 지속력 있는 정책 순풍이 어디에 있을 수 있고 무엇이 더 일시적으로 보이는지에 대한 생각을 듣기를 기대하고 있습니다.\n\nGrand Round Up은 YouTube, LinkedIn, X에서 라이브로 시청하실 수 있습니다."},{"heading_en":"CARE DELIVERY: Do you have access to the “Billionaire’s Vagina Club”?","body":"AI 풍요 서사에서 제가 늘 가장 흥미롭게 여기는 것 중 하나는, AI 덕분에 모든 사람이 오늘날 가장 부유한 사람이 누리는 것보다 더 나은 헬스케어를 이용하게 되리라는 전반적인 인식입니다. Elon Musk도 이번 주 자신의 Optimus 휴머노이드 로봇의 역량에 대해 이야기하면서 이 점을 언급했습니다. 어떤 의미에서는 저도 동의하지 않는 것은 아닙니다. 오늘날 평범한 사람이 과거 가장 부유했던 사람보다 더 나은 헬스케어를 이용하고 있으리라고도 생각합니다. 진보의 본질이 그렇죠. 수술 로봇은 수십 년째 존재해 왔고, 그 역량을 AI와 결합하면 수술 결과가 개선되는 시나리오를 그리기란 어렵지 않습니다. 하지만 그 전제는 이런 질문을 부릅니다. 오늘날 가장 부유한 사람들은 어떤 종류의 헬스케어를 이용하고 있을까요?\n\n여기서 'Billionaire's Vagina Club'이 등장합니다. 얼마 전 The New Yorker가 조명한, Stanford의 부인과 의사가 운영하는 배타적 컨시어지 OB/GYN 진료소의 별칭입니다. 여성이 'sexspan'을 늘리도록 돕는다는 이 진료소는 연 3만~4만 달러가 들고, 실리콘밸리 엘리트들이 긴 대기자 명단에 줄을 서 있다고 합니다. New Yorker 기사가 이를 구체적으로 언급하지는 않지만, 이 진료소는 실리콘밸리를 겨냥한 컨시어지 모델로 이전에도 다뤄진 적이 있는 Private Medical의 일부인 것으로 보입니다.\n\n제가 이 기사를 보게 된 것은 Midi의 창업자 겸 CEO인 Joanna Strober가 이번 주 LinkedIn에 이에 대해 글을 올렸기 때문입니다. Strober는 여성들이 완경 케어를 받기 위해 이만한 돈을 지불해야 한다고 느끼는 것이 슬프다고 말한 대목이 인용됐다고 공유하면서, Midi의 케어는 그 가격의 일부만으로도 똑같이 좋다는 점을 지적했습니다. 저도 그 생각에 동의하며, 한 걸음 더 나아가 시간이 지나면 Midi의 케어가 훨씬 더 나아져야 한다고 봅니다. 어떤 인간도 해낼 수 없는 양의 정보를 AI가 걸러 낼 수 있기 때문입니다. 기본 전제는 Midi의 플랫폼이 더 큰 사용자 기반과 더 많은 데이터를 갖고 있고, 그 데이터를 활용해 이용자 개개인에게 맞춤형 케어 경로를 제안하는 AI 역량에 투자할 여력이 더 크다는 것입니다.\n\n그렇다면 이 모든 게 사실이라면, 왜 가장 부유한 사람들은 여전히 이 Billionaire's Vagina Club 같은 것에 그렇게 많은 돈을 쓰고, 그 가격의 일부만 드는 Midi 같은 도구를 그냥 쓰지 않는 걸까요? 이는 다분히 수사적인 질문입니다. 답은 꽤 명백하다고 생각하는데, 억만장자 중에 TurboTax로 세금 신고를 하는 사람이 많지 않으리라고 짐작하는 것과 같은 이유입니다. 이는 또한 적어도 헬스케어와 관련해서는 풍요 논리의 한계를 더 일반적으로 보여 준다고 봅니다.\n\n가장 부유한 사람들이 큰돈을 치르고 사는 헬스케어란, 화이트 글러브 서비스를 제공하고 그들이 시간을 낼 수 없는 모든 일을 처리해 주는, 잘 훈련된 사람들에 대한 배타적 접근입니다. 최고의 사람들에 대한 그 배타적 접근은 본질적으로 시장 최상단에서 아래로 흘러내리는 희소성을 만들어 냅니다. Bryan Johnson의 Blueprint 프로토콜을 이용해서, 불치병에 걸리는 불운으로 인터넷 밈이 되지는 않기를 바라며 영원히 사는 상상을 해 보고 싶으신가요? 좋습니다, 그건 무료입니다. Bryan Johnson의 의료팀이 그 프로토콜을 안내해 주기를 원하시나요? 아, 좋습니다, 그건 연 100만 달러를 내셔야 합니다. 그렇게 희소성은 지속됩니다.\n\n이 모든 것이 앞으로 몇 년간 헬스케어가 어떻게 계속 진화할지, 그리고 감당할 수 있는 사람과 그럴 수 없는 사람이 걷게 될 서로 다른 경로가 어떠할지를 보여 주는 좋은 로드맵이라고 생각합니다. 하나는 더 맞춤화된 인간적(그리고 자본주의적) 경험이 될 것이고, 다른 하나는 더 자동화된(그리고 정부가 운영하는) 경험이 될 것입니다. 헬스케어의 소비자 시대는 이 양극화를 더 빠르게 만들고 있는 것으로 보입니다. 그래서 저는 평범한 사람이 오늘날 가장 부유한 사람보다 더 나은 의료를 이용하게 될 것이라는 Musk의 말이 맞을 것이라고 봅니다. 동시에 그 미래의 모습은 그가 그리는 풍요로운 로봇 유토피아보다는 오늘 우리가 겪고 있는, 희소성이 주도하는 헬스케어 위기와 훨씬 더 닮아 있을 것이라고도 생각합니다. 헬스케어가 그 어느 때보다 나아진 상태이면서 동시에 완전한 재앙이기도 한 영구적 상태에 놓여 있는 듯한 그 핵심 딜레마는, 앞으로도 계속될 자리를 잘 잡고 있는 것 같습니다."},{"heading_en":"CHART OF THE WEEK","body":"Stat이 이번 주 Out of Pocket, Out of Reach라는 새 탐사 시리즈를 내놓았습니다. 고용주 제공 건강보험이 직면한 수많은 문제와 그것이 얼마나 비싸졌는지에 초점을 맞춘 시리즈입니다. Stat의 시리즈는 앞으로도 폭넓은 주제를 다룰 것으로 보입니다 — 헬스 시스템과 제약사의 높은 비용, 페이어가 그 비용을 관리하지 못하는 문제, 그리고 이것이 어떻게 유권자들에게 점점 더 핵심 이슈가 되고 있는지 등입니다. 이번 주에 특히 부각한 주제 하나는 소규모 단체 시장의 대폭적인 보험료 인상이었는데, ESI 시장이 무너지고 있다는 증거로 제시됐습니다.\n\nESI 시장이 무너지고 있는지에 대한 질문은 저희에게 대단히 흥미로운 문제라서, 커뮤니티에 여러분의 관점을 묻는 설문을 돌렸습니다. 답변의 분포는 제게 무척 흥미로웠습니다 — 아래를 보시죠.\n\nESI 시스템이 무너지고 있다는 데 동의하는 너드(21명)와 동의하지 않는 너드(20명)가 거의 반반으로 갈렸습니다. 다만 동의하지 않는 쪽이 동의하는 쪽보다 더 강하게 느끼는 것으로 보입니다.\n\n이는 지금 이 순간 업계 전반에 깔린 불확실성을 잘 보여 준다고 생각합니다. 이 모든 것이 앞으로 얼마나 지속 가능한지에 대해 서로 다른 의견이 많습니다. 한 가지 확신하는 게 있다면, 이 논의는 아직 초반부에 있는 것처럼 느껴지고, 고용주 시장의 앞날에 대한 불확실성은 DC와 각 주에서 헬스케어를 어떻게 할지에 대한 정치적 논쟁이 달아오르는 가운데 이 시장을 헤쳐 나가는 창업가들에게 분명히 기회를 만들어 줄 것이라는 점입니다.\n\nSlack에서 대화를 확인해 보세요"},{"heading_en":"DATA TO PONDER","body":"35x\n\nCVS가 Aetna 대비 Signify의 케어 매니지먼트에서 확인하는 참여도 증가폭\n\n목요일 오후, 저는 CVS Health의 Executive Vice President 겸 President of Health Care Delivery인 Sree Chatuguru를 인터뷰하는 즐거운 시간을 가졌습니다. Oak Street, Signify, MinuteClinic 전반에 걸친 CVS의 케어 딜리버리 현황에 대한 이야기였습니다. Oak Street가 v28 이후의 세계에 어떻게 적응하고 있는지, Signify가 가정에서 환자를 어떻게 참여시키고 있는지, MinuteClinic이 프라이머리 케어로 어떻게 확장하고 있는지 등 많은 것을 다뤘습니다.\n\n제게 가장 흥미로웠던 부분은 신뢰라는 주제, 그리고 CVS가 소비자와 신뢰 관계를 구축하려 하는 방식을 짚어 낸 대목이었습니다. Sree는 Aetna가 케어 매니지먼트 아웃리치를 할 때와 Signify가 가정 방문에서 케어 매니지먼트로 따뜻하게 인계할 때 참여도가 어떻게 달라지는지에 대해 CVS가 곧 공개할 데이터의 예를 공유했습니다. Signify는 Aetna 대비 참여율이 35배 높아지는 것을 확인하고 있으며, 그중 81%가 그날 바로 Aetna의 고위험군 케어 매니지먼트 프로그램에 연결됐습니다. Sree는 MA 회원의 약 60%가 건강보험사가 전화로는 사실상 연락할 수 없는 대상이라는 점에서 이것이 큰 의미를 갖는다고 지적합니다.\n\n공개될 데이터를 보는 일은 즐거울 것입니다. 하지만 이는 특히 아무도 자동화된 스팸에, 그러니까 넘쳐 나는 자동 전화와 이메일에 응답하지 않는 세상에서 인간적 연결이 갖는 엄청난 가치를 보여 주는 또 하나의 데이터 포인트이기도 합니다."},{"heading_en":"Other News From the Week","body":"Clover가 CMS를 상대로 한 Stars 소송에서 승리하고, CMS가 Clover 소송의 일부 내용만을 근거로 다른 플랜들의 점수를 재산정하기로 결정한 데 이어, Elevance와 SCAN이 최근 며칠 사이 CMS를 상대로 소송을 제기했습니다. Elevance와 SCAN 모두 Clover와 같은 방식으로 자사의 Star 점수를 재산정해 달라고 요구하고 있는데, 양측 모두 점수가 높아지면 추가 품질 성과금을 받게 된다고 주장합니다. Elevance는 약 1억 1,500만 달러를 더 받게 될 것이라고 밝혔고, SCAN은 1억 2,500만 달러를 예상합니다. SCAN의 소장은 Stars 프로그램을 '부인할 수 없이 망가졌다'고 표현하는데, 현재 Stars 프로그램의 상태가 얼마나 지탱하기 어려운지를 보여 줍니다. CMS가 여기서 어떻게 대응하는지, 그리고 앞으로 몇 년간 플랜들의 소송이 끊임없이 이어지는 것을 피하면서 Stars 프로그램 전반에 드리운 거대한 불확실성을 어떻게 해소하려 하는지 지켜보는 것이 흥미로울 것입니다."},{"heading_en":"Other News From the Week","body":"페이어들의 ACA 2027년 보험료 인상 요청이 더 많이 보도되면서, 많은 페이어가 두 자릿수 인상률을 요청한 만큼 ACA가 죽음의 나선(death spiral)에 빠진 것인지에 대한 논의가 또 한 차례 벌어질 것으로 보입니다. WSJ은 보험료 인상의 원인으로 헬스케어 비용 상승과 ACA 시장의 가입자 감소를 지목했는데, 이는 교과서적인 죽음의 나선처럼 느껴집니다. 다만 인상 요청의 다양한 이유들 — No Surprises Act부터 프로바이더의 AI, 시장 철수 등에 이르기까지 — 을 읽어 보면, 저에게는 죽음의 나선이라기보다 우리가 극심한 인플레이션 환경에 있다는 점을 반영하는 것으로 다가옵니다."},{"heading_en":"Other News From the Week","body":"CVS가 이번 주 App Store에 새로운 소비자용 앱 Health100을 소프트 론칭했습니다. CVS는 신뢰받는 소비자 헬스케어 파트너가 된다는 자사 서사의 핵심 요소로 이 앱을 삼아 왔습니다. 앞으로 몇 분기 동안 투자자 콜에서 이 앱의 성과에 관한 업데이트를 지켜볼 만합니다."},{"heading_en":"Other News From the Week","body":"Alignment는 전직 핵심 임원이 회계 부정을 주장하며 제기한 내부고발 소송에 직면했고, 이로 인해 주가가 이번 주 약 20% 하락했습니다. 소송은 Alignment가 SG&A 비용으로 분류했어야 할 소프트웨어 엔지니어 팀의 소프트웨어 개발비를 부적절하게 자본화했다고 주장합니다. 저희는 이번 주 Slack에서 이 소장을 논의했습니다,"},{"heading_en":"Other News From the Week","body":"Tampa General Hospital이 최근의 340B 조치를 두고 Eli Lilly를 상대로 소송을 제기하며 Eli Lilly의 독점적 행위를 문제 삼았습니다. TGH는 Lilly 의약품의 취득 비용이 약 43% 오르면서 연간 2,400만 달러의 비용 증가를 겪게 될 것이라고 주장합니다. 제가 병원 로비 단체라면 여기서 이 주장을 펼칠 다른 병원을 택하고 싶었을 것 같습니다 — TGH는 수지를 맞추기 위해 340B 프로그램이 필요한 안전망 병원이라고 주장하지만, 지난 몇 년간 연간 4억 달러의 영업이익으로 8%의 영업 EBITDA 마진을 꾸준히 내 왔습니다."},{"heading_en":"Other News From the Week","body":"Withings가 Withings Medical을 공식 발표하며 케어 딜리버리 영역 진출을 공식화했고, ACCESS가 이 분야에서 Withings의 첫 상업적 시험대가 됩니다. Withings는 헬스케어에서 대단히 흥미로운 창업 스토리입니다. 창업자가 2018년 Nokia로부터 회사를 되사들인 이후 매출이 90% 성장했고, 2025년 흑자를 달성했으며, Withings의 원격 환자 모니터링 사업이 이제 매출의 17%를 차지한다고 밝혔습니다."},{"heading_en":"Other News From the Week","body":"Memorial Hermann이 보험 사업을 축소하는 헬스 시스템들의 행렬에 합류해 상업 보험 시장에서 철수합니다. Medicare Advantage 시장에는 계속 남을 예정이며, 현재 약 1만 5,000명의 회원을 보유하고 있습니다."},{"heading_en":"Funding Announcements","body":"VBC 이네이블먼트 플랫폼 Pearl Health가 지분으로 5,000만 달러, 부채로 6,000만 달러를 조달했습니다. a16z가 라운드를 주도했습니다. Pearl은 2025년 흑자에 도달했고 2024년부터 2026년 사이 환자 기반을 3배로 늘렸다고 밝혔습니다. 현재 40개 주에서 1만 명의 프로바이더를 지원하며 연간 36억 달러의 의료 지출을 관리하고 있습니다. 보도자료는 Pearl의 플랫폼을 AI 중심으로 조명하는데, a16z는 Pearl이 임상 인력 확충 대신 기술을 통해 프로바이더가 VBC 계약을 관리하도록 돕는 데서 성과를 내고 있다고 언급했습니다."},{"heading_en":"Funding Announcements","body":"소아 대상 버추얼 정신건강 클리닉 Handspring Health가 1,900만 달러를 조달했습니다. RPS Ventures가 라운드를 주도했습니다. Handspring은 지난 2년간 매출을 10배 늘리며 4,000가구에게 서비스를 제공했다고 밝혔습니다."},{"heading_en":"Funding Announcements","body":"자동화 약국 키오스크 Queue가 1,260만 달러를 조달했습니다. AlleyCorp가 라운드를 주도했으며, Queue는 전국 규모 약국 체인을 핵심 고객으로 두고 있고 상업적 검증 단계에 있는 작동 프로토타입을 보유하고 있다고 밝혔습니다. 여러 종류의 자동화 헬스케어 키오스크가 수년에 걸쳐 나타났다 사라졌습니다 — 이전 디지털 헬스 붐 사이클에서 잘나갔지만 이후 모멘텀이 사그라든 회사로 higi가 자연스럽게 떠오릅니다. 요즘 약국들이 겪는 문제를 감안하면 이 개념 자체는 자연스러운 매력이 있습니다. 이 약국 중심 모델이 더 지속력 있는 성공을 거둘 수 있을지 궁금합니다."},{"heading_en":"What I'm Reading","body":"Venrock이 헬스케어 리더들을 대상으로 한 연례 설문조사를 발표했는데, 헬스케어 내부자들이 시장 상황을 어떻게 보는지 흥미롭게 들여다볼 수 있습니다. 설문 응답을 읽으며 느낀 전반적인 정서는 상당히 깊은 냉소였습니다. 특히 AI가 산업에 미칠 영향이나 현재의 정책 지형에 대해 특별히 낙관하는 사람은 없어 보입니다. 앞으로 18개월간 AI가 지불 지형에 어떤 영향을 줄 것 같냐는 질문에, 거의 4명 중 1명이 CMMI의 ACCESS 모델이 시니어들을 속여 해지하기 어려운 구독에 가입시키는 사기를 가능하게 할 것이라고 답했습니다. 제가 그 자리에서 낙관론자가 되는 일은 흔치 않은데, 어쨌든 ACCESS가 대규모 사기를 가능하게 하지는 않으리라고 보는 점에서 그런 지점에 이른 것 같습니다. 디지털 헬스의 IPO 기대치가 어떻게 바뀌었는지를 보는 것도 다소 놀랍습니다 — 작년에는 응답자의 42%가 2026년 상반기에 IPO가 있을 것이라고 봤습니다. 지금은 응답자의 51%가 2028년 이후까지 IPO를 기대하지 않습니다. 그 변화가 공모 시장의 상황을 반영하는 것인지 비상장 시장의 상황을 반영하는 것인지 궁금합니다. 한편으로 Hinge는 IPO 이후 꽤 좋은 성과를 내고 있으며 현재 약 118% 올라 있습니다. 다른 한편으로 최근 Ensemble이 Thoreau에 매각되면서 IPO를 추진하는 대신 비상장으로 남기를 택하는 것을 봤습니다. 지금은 비상장으로 남는 이점이 꽤 매력적으로 보입니다 — 공모-비상장 밸류에이션 격차, 상장사로서의 분기 보고 의무, 그리고 비상장 기업을 위한 활발한 세컨더리 시장을 감안하면, 상장의 이점은 무엇일까요?"}]},"49":{"index":"49","title_en":"Weekly Health Tech Reads 7/19/26","subtitle":"Q2 어닝 시즌이 시작되고, OpenEvidence는 200억 달러 밸류에이션을 거절하고, Cadence의 컴퍼니 프레젠테이션, PFS에 대한 단상, 그 외","sections":[{"heading_en":"Today's newsletter is brought to you by: Assured","body":"Assured는 공급자 크리덴셜링, 페이어 등록, 라이선스, 갱신을 처음부터 끝까지 관리한다. 이 플랫폼은 신청서를 준비해 제출하고, 진행 상태를 추적하며, 페이어 후속 대응을 처리하는 동시에 운영팀에는 이 업무를 한곳에서 관리할 창구를 제공한다.\n\nAssured와 함께 Birches Health는 1년이 채 안 되는 기간에 공급자를 10명에서 800명으로 늘렸고, 40개 주로 확장했으며, 크리덴셜링 처리 시간을 최대 75%까지 줄였다. 자세히 보기.\n\n뉴스레터 스폰서십에 관심이 있다면 알려 달라!"},{"heading_en":"Q2 EARNINGS SEASON","body":"UHG와 Elevance 실적으로 Q2 어닝 시즌이 시작되고, HCA는 실적을 앞당겨 공개했다\n\nQ2 어닝 시즌이 시작되면서 이번 주 실적과 관련해 주목할 만한 소식이 세 건 있었다.\n\n- HCA는 8-K로 실적 발표에 앞서 ACA/무보험자 이동에 따른 페이어 믹스 역풍을 밝히면서 주간 8% 하락했고, 주 초반 병원 섹터를 약 5% 끌어내렸다.\n\n- UHG는 회복세를 이어 가며 실적 가이던스를 상향해 주가가 잠시 8%가량 뛰었지만 대체로 보합에 머물렀다. MA의 긍정적인 의료 트렌드와 Optum Health의 반등이 이를 뒷받침했다.\n\n- Elevance는 실적 가이던스를 올리고도 월가를 실망시키며 11% 하락했다. 추가 Medicaid 철수 가능성을 언급했고, 이 문제가 실적 콜을 지배했다. 자세한 내용은 아래에서 다룬다.\n\n이 세 곳의 결과가 페이어와 공급자 전반에서 Q2 실적이 어디쯤에 안착할지를 꽤 잘 보여 준다고 짐작한다. 페이어와 VBC 공급자에게는 유리하고 헬스 시스템에는 불리한 환경으로 보인다. 그 밖에 남은 실적 콜에서 우리가 지켜볼 핵심 질문 몇 가지는 다음과 같다.\n\n- Elevance가 Medicaid 시장 철수를 시사한 의도는 무엇인가?\n  이번 주 실적에서 가장 어리둥절했던 대목 중 하나는 Elevance가 먼저 나서서 월가에 이미 발표한 D.C. 철수 외에 Medicaid 시장에서 추가로 철수할 것으로 예상한다고 말해 놓고는, 철수 범위에 대해서는 아무런 설명을 하지 않았다는 점이다. Elevance는 오랫동안 2026년이 Medicaid의 바닥이고 2027년 이후에는 마진이 개선될 것이라고 밝혀 왔는데, 이는 상황이 나아지는 중이라는 뜻으로 읽힌다. Elevance는 실적 콜에서 성과도 괜찮아 보인다고 했다. Medicaid 요율은 기대보다 유리하게 나오고 있고, 중증도 변화는 예상 범위 안이며, 이용량은 높긴 하지만 역시 예상과 일치한다는 것이다. 불안을 더하는 대목은 Q&A에서 애널리스트들이 철수 규모가 어느 정도인지 최소 세 차례나 따로 물었는데도 Elevance 경영진이 끝내 답하지 않았다는 점이다. 마진이 -1.75%까지 내려가는 동안 시장을 버티고 있다가 시장이 반등하는 시점에 규모도 밝히지 않은 채 철수를 발표하는 것은 이상한 전략적 결정으로 보인다. Elevance는 Medicaid에 대한 전반적인 의지를 다시 강조했지만, 이번 움직임은 개별 시장 성과에 변동성이 얼마나 큰지에 대한 의문을 자연스럽게 부른다. Centene과 Molina가 이 시장 역학을 어떻게 설명할지 지켜보면 흥미로울 것이다.\n\n- 커머셜 트렌드를 둘러싼 엇갈리는 서사는 어떻게 흘러갈까?\n  Elevance는 커머셜 시장에 대해 낙관적인 서사를 내놓으며 트렌드가 높긴 하지만 예상 범위 안이고 고객 파이프라인도 상당히 탄탄하다고 했다. Elevance는 지난 몇 년간 떠났던 고객들이 다시 돌아오는 패턴이 보인다고 밝혔는데, 커머셜에서의 모멘텀을 보여 주는 흥미로운 관찰이다. UHG의 커머셜 사업 업데이트는 예상보다 높은 커머셜 트렌드 수치를 부각했고, 예상했던 11% 트렌드를 웃돌고 있다. 이렇게 트렌드가 계속 높게 유지되면서 커머셜에서 7% 이상 마진으로 돌아가겠다는 UHG의 마진 회복 목표 시점은 2027년 이후로 더 밀리고 있다. UHG는 이 트렌드 상승의 핵심 요인으로 No Surprises Act의 IDR 절차를 지목했는데, 분기 기준 0.5%, 전체 비용 기준 1%를 차지한다고 했다. UHG는 또한 FFS가 지배적인 커머셜 시장에서 공격적인 청구 관행과 진료당 비용 상승이 나타나고 있다고 밝혔다. IDR 절차는 UHG 콜에서 애널리스트가 후속 질문까지 던지며 놀라울 정도로 큰 비중을 차지했는데, 그에 못지않게 놀라운 점은 Elevance는 이를 한 번도 언급하지 않은 것 같다는 사실이다. 커머셜 헬스케어 비용을 둘러싼 전국적 논의가 격화되는 만큼, 어닝 시즌 동안은 물론 그 이후에도 이 트렌드 서사를 지켜볼 가치가 있다.\n\n- ACA의 초기 결과는 데스 스파이럴처럼 보이지 않는다\n  바로 지난주에 우리는 ACA 시장이 나쁜 상황에 놓였다는 WSJ 보도를 이야기했다. 페이어들이 2027년에 두 자릿수 요율 인상을 요청하고 있고, 이것이 시장이 데스 스파이럴 비슷한 상황을 겪고 있다는 증거로 제시됐다는 내용이었다. HCA, Elevance, UHG는 분명 그런 인상을 주지 않는다. Elevance와 UHG는 모두 ACA 트렌드가 예상대로 흘러가고 있다고 했고, Elevance는 리스크 풀이 자사 가정과 부합해 보인다고 했다. HCA는 ACA에서 무보험자로의 페이어 믹스 이동이 예상보다 큰 부정적 영향을 미쳤다고 밝혔는데, 이는 거래소를 떠난 사람들이 단순히 의료를 이용하지 않는 건강한 가입자(또는 부정 가입자)만은 아니었다는 뜻으로 읽힌다. HCA가 그들을 무보험자로 다시 보고 있기 때문이다. 커머셜 논의와 비슷하게, 이 모든 것은 극심한 인플레이션 비용 환경에 반응하고 있는, 작동 중인 시장을 가리키는 것으로 보인다.\n\n- MA의 2026년 초과 성과는 2027년, 특히 Humana에게 어떤 밑그림을 그려 줄까?\n  Humana는 연초에 신규 가입자 유입을 두고 받았던 질문들을 생각하면 이번 실적 콜에서 승리의 자축을 할 것 같다. 주가 흐름이 어떤 지표라면 Humana는 그 질문들을 이미 넘어섰다. 3월 저점인 165달러에 Humana 주식을 샀다면 지난 3개월간 144% 수익을 냈을 것이다. 2026년은 MA 플랜들에게 잘 풀리는 해가 되어 가는 모습이고, 이제 질문은 2027년과 플랜들이 마진과 성장을 어떻게 저울질하느냐로 옮겨 간다. Humana의 화법은 특히 눈여겨볼 만한데, 최근 서사를 마진 회복 쪽으로 급격히 옮겼기 때문이다. 지난주 Sam Melamed와의 HTN 대화에서 우리는 초기 브로커 청취 결과가 대형 페이어 대부분이 2027년 MA 시장에서 혜택 풍부도 기준 2위를 노리고 있음을 시사한다는 이야기를 나눴다. 각 플랜의 출발점이 다르다는 점을 감안하면, 모두가 한 시장에서 2위를 목표로 할 경우 Humana가 대체로 1위를 유지하게 될 가능성이 커 보인다.\n\n- 병원들은 자신들이 마주한 여러 역풍을 어떻게 헤쳐 나갈까?\n  HCA가 언급한 불리한 ACA 페이어 믹스 이동에 더해, HCA는 수술 물량 감소도 밝혔다. 그 결과 플로리다의 Medicaid Supplemental Payment Program 결정으로 4억 달러의 추가 이익을 봤음에도 연간 가이던스를 하향 조정했다. Elevance와 UHG는 모두 수술 물량에서 둔화가 감지되는지 질문을 받았지만, 어느 쪽도 HCA와 비슷한 둔화를 보고하지 않았다. HCA는 연초 대비 20% 하락한 상태이며, 다른 병원 운영사들이 이 여러 역풍을 어떻게 헤쳐 나가는지 지켜볼 가치가 있다."},{"heading_en":"AI","body":"AI 임상 의사결정 지원 도구 1위를 향한 경쟁은 계속된다\n\n임상 의사결정 지원 시장을 차지하기 위한 Doximity와 OpenEvidence의 대서사시 같은 싸움이 이번 주 흥미로운 국면을 맞았다.\n\n출처: HTN 분석; LinkedIn; DOCS 재무자료; The Information 보도\n\nOpenEvidence와 Doximity 모두 LinkedIn에 나서서 Stanford ARISE Lab의 최근 보고서 결과를 자신들이 시장 1위라는 결정적 증거라며 내세웠다. 곁가지 이야기지만, 여러 벤더에게 각자 1위를 차지한 항목의 시각자료를 나눠 준 것은 ARISE의 천재적인 PR 전략처럼 보인다. 그렇지 않고서야 철천지원수들이 같은 시각자료를 올리는 상황을 달리 설명하기 어렵다. Doximity는 정확도 지표에서 이겼고, OpenEvidence는 의사들이 선택하는 도구라는 항목에서 이겼다. Doximity를 선택했다고 답한 의사가 0%라는 점은 다소 이상하다. Doximity가 요즘 대세가 아닐 수는 있지만, 설마 Doximity를 선호하는 의사가 0%일 리는 없지 않은가?\n\n금요일 밤, The Information은 OpenEvidence가 200억 달러 밸류에이션에 2억 달러를 투자하겠다는 제안을 거절했다고 보도했다. 창업자들과 다른 주주들이 추가 희석을 원하지 않았다는 것이다. OpenEvidence는 또한 \"대형 테크 기업\"과 인수 논의를 해 온 것으로 전해진다. 이 모든 것은 OpenEvidence가 현재 시장에서 갖고 있는 모멘텀과 Doximity가 이제는 따라가는 처지가 됐다는 점을 보여 주는 것 같다. 머지않아 OpenEvidence의 대규모 인수가 나오는 데 걸어도 무리가 없어 보이며, 그렇게 되면 어느 도구가 기술적으로 더 뛰어난지와 무관하게 여론에서 승자 지위를 굳히게 될 것이다.\n\n나는 잠재적 인수자인 대형 테크 기업이 상장사이기를 바라고 있다. 그래야 최소한 거래에 대한 공정성 의견서와 OpenEvidence의 재무 전망치를 볼 수 있기 때문이다. 그 코퍼레이트 디벨롭먼트 논의에 벽에 붙은 파리로 앉아 있으면 정말 흥미로울 것이다. 3억 달러 매출을 60배 넘는 멀티플에 사는 것과 6억 7,000만 달러 매출을 6배 멀티플에 사는 것 중에 고르라면 나라면 하지 않을 선택이지만, 여기 작동하는 FOMO 역학은 이해한다. 그리고 요즘 AI 기업들은 밸류에이션의 기본 원칙을 새로 쓰고 있는 것 같다."},{"heading_en":"MARTIN'S POLICY CORNER","body":"Physician Fee Schedule\n\n(참고: 이 섹션은 우리 상주 정책 너드 Martin Cech가 보내온 글이다)\n\n이번 주 초 CMS가 약 1,600쪽 분량의 2027년 Medicare Physician Fee Schedule 제안 규칙을 공개했는데, \"이 제안 규칙이 헬스케어의 미래에 의미하는 바는 이것이다\"라고 말하는 것은 지나치게 단순한 축약이 될 것이다. 예를 들어 다음과 같은 내용을 담은 방대한 기술 문서다.\n\n- 원격 모니터링 프로그램에 대한 중대한, 심지어 파국적이라 할 만한 변경 제안\n\n- Original Medicare에서 책임 기반 진료 관계를 더 늘리겠다는 현 행정부의 목표를 진전시키기 위한 Medicare Shared Savings Program 조정\n\n- 그리고 CPT 코드를 둘러싼 AMA와 CMS의 반목에서 나온 최신 공격\n\n그런데 이 거대한 문서와 부속 자료를 헤쳐 나가고, Slack에서 이 주제로 댓글이 83개나 달린 사려 깊은 논의에 뛰어들고, 소셜미디어의 이야기들을 훑으면서 내 관심을 사로잡은 것은 CMS가 재원 배분 공식을 손보려는 방식에 대한, 특히 공급자들 사이의 불만이다.\n\nD.C.에서 사람들이 즐겨 하는 말 중에 \"예산은 우선순위의 표명이다\"라는 것이 있다. PFS 제안 규칙은 엄밀히 말해 예산이라기보다 공급자에게 얼마를 지급할지를 결정하는 복잡한 공식들의 재료에 가깝지만, 이 말은 여기에도 똑같이 적용된다.\n\nMedicare 의사 보상이 작동하는 방식은 아주 높은 수준에서 도식적으로 보면 이렇다. 컨버전 팩터라 불리는 달러 금액에 Relative Value Unit을 곱하는데, 이 RVU는 Medicare가 지급하는 모든 시술과 서비스에 배분되어 있다. CMS가 이 서비스나 시술은 몇 RVU의 가치가 있다고 정하면, 그 RVU 값에 컨버전 팩터를 곱한다. 올해 컨버전 팩터는 약 33달러로 제안됐고, 그렇게 해서 나온 금액이 CMS가 그 서비스나 시술에 지급하는 값이다.\n\nCMS가 컨버전 팩터를 아무렇게나 정하는 것은 아니다. 의회가 2015년에 MACRA라는 법을 통과시켜 매년 컨버전 팩터를 기계적으로 갱신한다. CMS가 쓸 수 있는 유일한 수단은 RVU 배분을 다시 섞는 것이고, 이는 대체로 예산 중립적이어야 한다. 이 재배분은 제로섬 게임이다. CMS가 임상 사회복지사나 프라이머리 케어에 돈을 더 쓰고 싶다면, 그 돈은 다른 공급자 집단에서 나와야 한다.\n\n헬스케어 정책을 만드는 도구로는 대단히 무딘 수단이지만, 지난 몇 년간 Biden 행정부와 Trump 행정부 모두에서 CMS는 이를 활용해 Medicare 지출을 대체로 시술에서 상담 치료나 프라이머리 케어 같은 서비스 쪽으로 옮겨 왔다. 올해 제안 규칙에서도 시간 기반이 아닌 시술 코드에 대한 효율성 조정과 상담 치료에 대한 4년짜리 상향 조정의 마지막 해가 이어진다. CMS는 그 영향을 모델링했는데, 임상 사회복지사(+12%)와 심리학자(+11%)가 가장 큰 인상을 받고, 피부과 의사(-9%)와 이비인후과 의사(-9%)가 손해를 보는 쪽이다.\n\n행동건강과 프라이머리 케어 공급자에게 더 많이 보상해야 한다는 데는 대체로 모두가 동의한다. 올해 피부과와 이비인후과에게 특히 어려운 점은, 그 취지에 동의하더라도 그 돈이 자기들 급여에서 나온다는 것이다. 의회가 재원 공식을 늘릴 수도 있지만 그러려면 세금을 더 걷거나 국가부채를 더 늘려야 한다. 사회로서 우리는 행동건강과 프라이머리 케어를 우선하고 싶어 하지만, 누군가는 그 값을 치러야 하고, 우리 모두는 그게 자신이 아니길 바란다."},{"heading_en":"COMPANY PRESENTATION","body":"Cadence의 컴퍼니 업데이트\n\n목요일 오후, Cadence의 공동창업자 겸 CEO Chris Altchek이 컴퍼니 업데이트를 위해 나와 함께했다. 회사가 1억 달러 시리즈 C를 발표한 지 몇 주 뒤였다. 그는 Cadence가 지금 어디에 있고 어디로 가고 있는지, 그리고 AI 기반 의료 전달이 오늘날 미국 헬스케어가 마주한 핵심 제약인 임상 인력 공급 문제를 어떻게 푸는 데 도움이 된다고 보는지를 훌륭하게 설명해 주었다. 아래 슬라이드에 정리된 것처럼, PCP가 임상의의 감독을 받는 FDA 인증 에이전트에게 의료 전달을 위임하게 될 것이라는 비전은 듣기에 흥미로웠다.\n\n이번 세션에서 내가 크게 얻어 간 것 몇 가지다.\n\n- Cadence는 원격 모니터링 영역에서 인상적인 규모에 도달했다. 2026년 1월 기준 ARR 6,100만 달러를 보고했고, 2027년 1월에는 1억 3,500만 달러로 성장할 것으로 기대한다. 현재 20개 헬스 시스템과의 파트너십을 통해 10만 명의 환자를 치료하고 있으며, 헬스 시스템 수를 20곳에서 약 90곳으로 늘리고 고객사 내 의사 채택률을 5%에서 약 10%로 높여 환자 100만 명에 도달할 것으로 본다. 우리는 고투마켓 전략에 대해 꽤 많은 이야기를 나눴는데, 헬스 시스템이 마주한 온갖 역풍을 감안하면 이 고객군의 관심은 여러 전략적 방향으로 분산돼 있으리라 짐작한다. 어떤 면에서는 병원들의 재무적 역풍이 오히려 이 개념을 더 매력적으로 만들 수도 있고 또 그래야 한다. 커머셜 입원 물량 쪽으로 방향을 트는 핵심 지렛대가 될 수 있기 때문이다.\n\n- Cadence는 내가 지금까지 들어 본 임상 AI 사용 사례 중 손에 잡히는 편에 속한다. Chris는 우려되는 측정값이 나온 뒤 환자에게 전화를 거는 음성 AI 에이전트인 알림 트리아지 에이전트를 어떻게 만들었는지 설명했다. AI 에이전트 도입 전 Cadence의 평균 응답 시간은 90분이었는데, AI 에이전트로는 3.5분까지 줄었다. 우리는 시니어들이 AI 에이전트와 대화하는 것에 어떻게 반응했는지도 이야기했는데, Chris는 회사가 2~3%의 거부율을 예상했지만 지난 45일간(약 4만 5,000통 기준) 실제로는 0.18%라고 전했다. Chris는 음성 AI와 대화하는 데 대한 그런 편안함이 Cadence의 전체 서비스에 통합돼 있는 방식, 즉 자신의 담당 공급자가 제공하는 서비스의 일부로서 개인에게 즉각적인 피드백을 준다는 점 덕분이라고 본다.\n\n- 우리는 Physician Fee Schedule에서 제안된 RPM 관련 변화 가능성에 대해서도 이야기했다. Cadence는 RPM의 낭비를 없앤다는 목표에는 동의하지만, 관건은 목욕물을 버리다 아기까지 버리지 않는 것, 즉 질 낮은 RPM과 의미 있는 임상 프로그램을 구분하는 것이라고 했다. Cadence는 CCM과 APCM 등 여러 프로그램으로 확장해 왔기 때문에 어떤 변화가 오더라도 자사 사업에 미치는 영향은 비교적 작을 것이라고 밝혔다.\n\n프레젠테이션과 Q&A에서 훨씬 더 많은 내용을 다뤘다. 멤버는 여기서 확인할 수 있다."},{"heading_en":"Upcoming HTN Conversations","body":"다가오는 HTN 대화:\n\n- Judi Health의 CEO 겸 공동창업자 A.J. Loiacono의 컴퍼니 프레젠테이션, HTN의 애널리스트 Q&A 포함.\n  7월 20일 월요일 오후 2시 ET\n\n- Bailey & Company의 Rebecca Springer, Ben Matz와의 전문가 인터뷰, 소비자 헬스에 관한 최신 보고서를 논의한다.\n  7월 20일 월요일 오후 4시 ET\n\n- AI 기반 제약 마케팅 회사 Solstice의 CEO Aris Saxena와의 파이어사이드 챗.\n  7월 21일 화요일 오후 3시 ET"},{"heading_en":"Funding Announcements","body":"NP 인에이블먼트 모델인 Corner Health가 Oak HC/FT 주도로 2,500만 달러 시리즈 A를 조달했다. Oak HC/FT의 투자 논지는 읽어 볼 가치가 충분한데, Corner의 근거와 현재 상황을 잘 정리해 놓았다. 여기에는 Corner에 관한 인상적인 데이터가 담겨 있다. 현재 Washington과 Arizona에서 공급자 소유 진료소 70곳을 운영 중이고, 두 시장 모두에서 가장 빠르게 성장하는 프라이머리 케어 네트워크라고 주장하며, 대기자 명단에 NP가 1,000명 올라 있다. Corner의 모델은 행정 인력 없이 진료소를 운영할 수 있게 해 주는 AI 중심 OS를 축으로 하며, 진료소의 90%가 진료하는 NP 외에 다른 직원 없이 운영된다. 덕분에 NP들은 업계 평균보다 2~3배 많은 시간을 환자와 보내면서도, 고용된 NP보다 연간 3만~8만 달러를 더 번다. 이 데이터 포인트들의 조합은 정말 인상적으로 다가오고, 앞으로 Corner의 진행 상황을 계속 지켜보고 싶다."},{"heading_en":"Funding Announcements","body":"헬스 스캔을 중심으로 한 장수 클리닉 모델인 Neko Health가 70억 달러 밸류에이션에 7억 달러를 조달했다. Lightspeed Venture Partners가 이번 라운드를 주도했고, 이는 Neko의 미국 진출 계획을 앞둔 시점에 이뤄졌다. 현재 영국과 스웨덴에서 클리닉 여덟 곳을 운영 중이며, 올해 안에 NYC를 비롯한 미국 도시에 첫 클리닉을 연다. Neko 창업자의 LinkedIn 게시글은 Neko의 더 큰 야망을 암시한다. 헬스 스캔이 첫 제품이 되고, Neko는 기기와 센서, AI, 소프트웨어, 임상 프로토콜, 클리닉을 아우르는 \"헬스케어 스택\"을 다시 생각한다는 것이다.\n\n  - 내 계산으로 Neko의 ARR은 3,500만 달러 언저리일 가능성이 높다. 논의를 위해 클리닉 8곳, 하루 스캔 30건, 연 365일, 스캔당 400달러로 잡으면 3,500만 달러가 된다. 실제로는 클리닉이 연중무휴로 열지 않을 테지만, 그림은 이해될 것이다. 이 계산대로면 매출 멀티플은 200배가 된다.\n\n  - Lightspeed가 이 라운드를 주도하며 세운 언더라이팅 케이스와, 미국 최고의 예방 건강 공급자로서 Neko의 미래 마진 프로필이 어떤 모습일지 정말 보고 싶다. 비전의 개념적 매력은 분명하지만, 이곳의 얼리어답터에서 일반 대중으로 확장할 때의 어려움 역시 분명하다. 헬스케어를 재발명하겠다는 큰 비전을 품었던 여러 회사의 실패는 여기서 회의적일 이유를 충분히 제공한다. Forward Health, Carbon Health, Babylon Health가 그렇다. 웰니스를 둘러싼 소비자 정서, 기술 변화, 그리고 부상하는 \"환자가 곧 지불자\" 트렌드를 감안하면 지금이 이 베팅을 다시 시도할 때일 수도 있고, 언더라이팅 케이스도 주제적으로는 그 지점을 중심에 놓았으리라 짐작한다.\n\n  - Midjourney와 Neko Health가 이 장수/예방 건강 시장에서 소비자 브랜드를 구축하려는 동안, 나 개인적으로는 이 차세대 스캐너가 실제로 작동한다는 전제 아래 다른 회사들이 소비자 브랜드를 만들 수 있게 해 주는, 좀 더 의료기기에 가까운 플레이에 훨씬 더 낙관적일 것 같다. 소비자 헬스 시장에서 Neko는 오늘날 Hims와 대략 비슷한 가치를 인정받고 있는데, 연 매출은 20억 달러 이상 적다. 한편 Cologuard나 Intuitive Surgical 같은 회사들의 결과를 보면, 나라면 어느 길을 갈지 개인적으로는 알 것 같다. 그래서 나는 여전히 Butterfly Network에 흥미를 느낀다."},{"heading_en":"Funding Announcements","body":"헬스 시스템을 위한 에이전틱 AI 플랫폼인 BunkerHill Health가 2,500만 달러 시리즈 B와 누적 5,500만 달러 조달을 발표했다. Khosla Ventures가 시리즈 B를 주도했고, Sequoia Capital, Felicis, Optum Ventures, Y Combinator도 인상적인 투자자 명단에 이름을 올렸다. 이번 라운드에 대한 Fortune의 보도는 이 시장과 관련해 모두가 떠올릴 법한 질문, 즉 \"헬스 시스템용 에이전틱 AI 플랫폼이 또?\"를 정면으로 다뤘다. BunkerHill의 투자자들은 초기 고객 확보가 BunkerHill이 이 시장의 승자 플랫폼임을 보여 주는 좋은 신호라고 베팅하는 듯하고, 실제로 확보한 초기 헬스 시스템 고객 명단은 상당히 인상적으로 보인다. Mayo Clinic, Cleveland Clinic, Intermountain이 모두 고객으로 언급된다. 이 모든 것을 보면 요즘 헬스 시스템들이 이런 플랫폼들을 서로 비교해 실제로 어떻게 평가하고 사용하는지 몹시 궁금해진다.\n\n  - 여기 고객 명단과 숫자를 보면 BunkerHill이 그 고객들과 비교적 작은 규모로 구축을 진행 중임을 시사하는 듯하다. 2,500만 달러 시리즈 B는 (경쟁이 붙은 라운드에서 10% 희석을 가정하면) 약 2억 5,000만 달러 밸류에이션을 의미한다. 최고 VC가 들어간 초기 단계 AI 기업에 흔히 붙는 천문학적 매출 멀티플(100배쯤?)을 가정하면 BunkerHill의 ARR은 250만 달러 정도라는 계산이 나온다. BunkerHill은 헬스 시스템 15곳을 고객으로 두고 있다고 밝히는데, 그러면 헬스 시스템당 연 매출은 약 16만 6,000달러가 된다. 이 숫자들은 현재 시장 상황과 스타트업들이 이런 유명 시스템 안에서 발판을 마련하려 애쓰는 모습을 보여 주는 것 같다. 또한 진정한 플랫폼 파트너로서 훨씬 더 큰 ACV 계약을 따내는 조직이 되기 위한 경쟁이 벌어지고 있음을 암시한다."},{"heading_en":"What I'm Reading","body":"헬스케어의 재정적 인센티브에 상당한 변화가 없다면 AI가 지출을 늘릴 것이라는 공감대가 형성되고 있는 것으로 보인다. 이 논지는 이번 주에 두 번 등장했다. 먼저 NEJM Catalyst 기고문에서 Bob Kocher, Brian Zhao, Erin Duffy는 AI가 지출을 늦추려면 새로운 정책과 지불 수단이 필요할 것이며, 어쩌면 목표는 지출을 절대적으로 줄이는 것이 아니라 \"비용 곡선을 꺾어\" 지출 증가율을 낮추는 것이어야 한다고 주장했다.\n\n또한 이번 주 PHTI는 고혈압 관리에 AI를 임상적으로 적용하는 문제를 다룬 워크숍 논의의 결과를 정리한 보고서를 공개했다. 보고서는 현재의 지불 방식, 즉 FFS나 성과연동지불, 인두제 모두 AI에는 한계가 있다고 지적하며, 대신 결과에 연동된 새로운 디플레이션형 지불 메커니즘을 고민해야 한다고 제안했다. 보고서가 언급하듯 CMMI의 ACCESS 모델이 그 방향으로 가는 한 걸음이다.\n\nAI에 새로운 성과 기반 지불 체계가 필요하다는 이런 공감대를, 업계가 ACCESS에 대해 표해 온 전반적인 회의론과 나란히 놓고 보면 흥미롭다. 예를 들어 지난주 Venrock 설문 데이터에 따르면 업계 리더의 23%는 ACCESS가 기업들이 시니어를 속이는 대규모 사기를 가능하게 할 것이라고 본다. 내가 지금 CMMI에서 정책을 만들고 있다면 컴퓨터 화면에 대고 소리를 지르고 있을 것이다. 오래 마음고생을 해 온 Minnesota 스포츠 팬으로서의 내 삶이 조금 떠오른다. 셀 수 없이 많은 가슴 아픈 패배 앞에서도 응원을 멈출 수가 없다. 올해가 바로 LeBron을 데려와 우승하는 해일 테니까. 마음 깊은 곳에서는 LeBron이 여기 오지 않으리란 걸 알지만, 그래도 희망은 있다!"},{"heading_en":"Other Headlines From the Week","body":"Pro 멤버 대상 일간 뉴스레터에서 다룬 다른 헤드라인 모음\n\nWarburg Pincus가 Pantherx Rare를 70억 달러 이상에 인수했다."},{"heading_en":"Other Headlines From the Week","body":"K Health이 또 하나의 헬스 시스템 파트너십을 따내며 Novant와 함께 버추얼 프라이머리 케어 진료 예약을 \"PatientGPT\"와 함께 출시했다."},{"heading_en":"Other Headlines From the Week","body":"Claritev(구 Multiplan)는 DOJ 반독점 조사의 범위가 확대되고 있다는 소식에 주가가 하락했다."},{"heading_en":"Other Headlines From the Week","body":"GE Healthcare가 Catholic Health와 10년, 약 5억 달러 규모의 파트너십을 발표했다."},{"heading_en":"Other Headlines From the Week","body":"MSK VBC 플레이어 TailorCare가 Georgia로 확장했다."},{"heading_en":"Other Headlines From the Week","body":"2024년 ACO REACH 결과에 대한 우리 분석은 더 작고 독립적인 그룹들이 더 나은 성과를 냈음을 시사한다."},{"heading_en":"Other Headlines From the Week","body":"한 판사가 ACA 2027 Payment Notice 최종 규칙의 일부를 막는 예비 금지명령을 인용했다."},{"heading_en":"Other Headlines From the Week","body":"상원 공화당이 CMMI의 WISeR 프로그램을 종료하려는 시도를 저지했다."},{"heading_en":"Other Headlines From the Week","body":"Eli Lilly가 Oura에 전략적 투자를 단행했다."},{"heading_en":"Other Headlines From the Week","body":"TytoCare가 2,500만 달러를 조달했다."},{"heading_en":"Other Headlines From the Week","body":"Chai Discovery가 38억 달러 밸류에이션에 4억 달러를 조달했다."}]},"50":{"index":"50","title_en":"Weekly Health Tech Reads 7/26/2026","subtitle":"Q2 실적: Molina, HCA, CHS, Tenet이 실적을 발표하며 ACA 문제, 상업보험 비용 부담 문제, 그리고 고중증도 ASC 케이스에서의 승리 전략이 부각됐습니다","sections":[{"heading_en":"Today's newsletter is brought to you by: Teladoc Health","body":"Teladoc이 새로운 버추얼 케어 모델 Teladoc One을 선보입니다. 이 모델은 비용 절감과 임상 성과에 수수료의 100%를 걸어 두는 방식입니다.\n\n이 모델은 Teladoc의 다전문과 버추얼 케어 인프라, 그리고 임상·청구·약제·기기·인게이지먼트·자격 데이터를 결합한 인텔리전스 엔진 위에 세워졌습니다. 케어팀이 필요를 더 일찍 파악하고 케어를 더 효과적으로 조율할 수 있도록 돕습니다. Teladoc One은 2026년 9월부터 일부 고객사를 대상으로 순차 적용됩니다.\n\n뉴스레터 스폰서십에 관심이 있으시면 알려 주세요!"},{"heading_en":"Q2 EARNINGS: Q2 Earnings Updates: ACA issues drag Molina and HCA; Tenet outperforms","body":"이번 주 이어진 Q2 실적 발표에서는 Molina, CHS, HCA, Tenet을 둘러싼 흥미로운 전략적 업데이트와 큰 폭의 주가 변동이 나왔습니다. 제가 계속 지켜볼 몇 가지 핵심 주제가 드러났습니다.\n\n1. 모두가 ACA에서 미스를 냈지만, 이유는 두 가지로 갈립니다.\n\n- HCA와 CHS는 ACA 탈락자 중 누구도 상업보험으로 갈아타지 않았는데도 모두가 여전히 ED에 나타났기 때문에 문제를 겪었습니다. Tenet도 비슷한 행태를 본 것으로 보이지만, 모델링은 더 잘했습니다.\n\n- 한편 Molina의 “small, silver, and stable” 전략은 역효과를 낸 것으로 보이며, 죽음의 소용돌이에 빠진 듯합니다. Molina는 ACA 전반의 중증도는 예상대로 움직이고 있다고 언급했지만, 건강한 가입자는 빠져나가고 고비용 가입자, 특히 더 높은 HCC로 이어지지 않는 고가 약물을 쓰는 가입자를 예상보다 높은 비율로 남기게 됐습니다.\n\n- 위 두 항목을 나란히 놓고 보면, ACA가 무너지는 지금 Molina가 아닌 일부 페이어들은 오히려 ACA에서 꽤 잘하고 있다고 보는 것이 논리적으로 보입니다.\n\n2. 상업보험 입원 수술 물량이 우려를 낳고 있습니다. 무엇이 이를 유발하는지를 두고 질문이 많은데, CHS는 이것이 더 넓은 거시환경 이슈이며 비용 부담 우려가 사람들이 선택적 정형외과·심장 시술을 미루는 형태로 나타나고 있다고 분명히 밝혔습니다. HCA 역시 선택적 입원 수술 감소의 배경으로 비용 부담 문제를 언급했습니다. 반면 Tenet은 소비자 위축은 나타나지 않는다고 밝혔습니다. 페이어들이 높은 상업보험 트렌드를 보고하는 가운데(UHC는 11%를 웃도는 트렌드를 보고 있습니다) 이런 역학이 펼쳐지는 모습은 흥미롭습니다.\n\n3. Medicaid 재원이 병원 실적을 떠받치고 있습니다. HCA, Tenet, CHS 모두 이번 분기 state-directed payment 프로그램의 순풍을 언급했습니다. Medicaid는 병원에 점점 더 중요한 매출원이자 수익성 동력으로서 계속 서사를 지배하고 있는데, 이는 Medicaid 손실을 둘러싼 과거의 서사와는 반대되는 흐름입니다.\n\n4. Molina의 ACA 어려움에도 불구하고 Duals / Medicaid 핵심 사업은 잘 굴러가는 것으로 보입니다. 트렌드가 완화되고 있고 Duals 부문 수익성은 기대를 앞질렀습니다. 2026년 managed care 섹터에 또 하나의 좋은 신호입니다.\n\n각 실적 발표에 대해 조금 더 살펴보면 다음과 같습니다."},{"heading_en":"Molina's ACA Miss; Duals Outperformance","body":"화요일 Molina 주가는 11% 하락했습니다. “small silver and stable”이라는 기존 접근법이 무너진 것으로 보이며, Molina는 2026년에 가격을 30% 올렸음에도 이 사업에서 여전히 적자라고 밝혔습니다. 이 주가 하락은 Molina가 핵심 Duals 사업의 초과 성과를 근거로 연간 이익 가이던스를 상향했음에도 나온 것입니다.\n\nMolina는 ACA에서의 어려움을 예상보다 높은 비율로 아픈 가입자를 남기게 된 탓으로 돌렸고, 특히 더 높은 HCC로 이어지지 않는 고가 약물을 쓰는 가입자를 지목했습니다. 이 때문에 리스크 조정 관점에서 Molina가 손해를 보게 됐습니다. 고가 스페셜티 파마, CGT 등으로 향하는 전반적 흐름을 감안하면 계속 지켜봐야 할 이슈로 보입니다. Molina는 약 28만 명 수준인 자사 가입자가 전체 ACA 시장의 약 1%에 불과하며, 시장 전체의 중증도는 예상보다 양호하게 나왔다고 밝혔습니다. Molina CEO는 이것이 메탈 티어의 문제도, Molina 포뮬러리의 문제도 아니었다는 점을 강조했습니다. 줄어드는 가입자 집단의 중증도 변화에 대해 Molina가 가격을 잘못 매겼을 뿐이라는 것입니다.\n\nMolina가 중증도 변화에 가격을 잘못 매긴 것은 사실로 보이지만, “small, silver, and stable” 전략이 여기서 완전히 무너진 것도 분명해 보입니다. Molina는 ACA 가입자를 더 줄여 이 시장에서 매출을 10억 달러 축소할 계획이라고 밝혔는데, 2026년 기준 약 25억 달러 규모에서 줄이는 것입니다. 오늘 28만 명이라는 점을 감안하면 2027년에는 약 16만 명이 될 것으로 Molina가 예상한다는 뜻으로 보입니다. 지나고 나서 하는 얘기이긴 하지만, 이 시점에서 보면 Molina는 거래소에서 완전히 철수했어야 했던 것 같습니다. 거래소에서의 상품이 이미 죽음의 소용돌이에 들어간 것으로 보이기 때문입니다. Molina는 가격으로 이 문제를 벗어날 수 있다고 자신하는 듯하지만, 2026년의 경험은 그렇지 않다는 쪽을 가리키는 것 같습니다.\n\n죽음의 소용돌이 같은 분위기는 자연히 ACA 시장 전반에 대한 우려로 이어지며, 이는 2027년 요율 신청과 관련해 최근에도 논의된 바 있습니다. 다만 전반적인 중증도 전망이 예상 수준이거나 그보다 낫다는 언급을 보면, 이 문제는 Molina의 ACA 전략에 국한된 것일 수 있습니다. HCA, CHS, Elevance, UHC의 Q2 실적도 모두 그 점을 확인해 주는 것으로 보입니다.\n\nACA 사업이 2026년 매출의 6% 미만인데도 그 외에는 잘 굴러가는 Duals와 Medicaid 핵심 사업을 끌어내리고 있으니, Molina로서는 답답한 결과일 것입니다. Duals의 초과 성과는 특히 눈에 띄었습니다. Molina는 이 사업의 EPS 기대치를 주당 1.50달러 올렸고 마진은 1.5%인데, 장기적으로 2.5% 마진을 목표로 하는 사업 치고는 기대를 앞선 수치입니다. Medicaid에서도 Molina는 비슷하게 좋은 성과를 내고 있습니다. 요율과 트렌드가 따라잡히고 있는 것으로 들리며, 2026년이 실제로 저점이라는 자신감을 주고 있습니다. Molina는 근로 요건으로 인해 향후 3년간 Medicaid 시장이 약 9% 축소될 것으로 보지만, 마진을 키우면서 그 변화를 성공적으로 헤쳐 나갈 수 있다고 자신하는 듯합니다."},{"heading_en":"HCA's ACA Miss; Surgical Volume Weakness","body":"금요일 HCA가 실적을 발표하면서, 앞서 알렸던 페이어 믹스 변화 이슈(환자들이 거래소에서 무보험으로 이동한 문제)에 대해 더 자세한 내용을 공유했습니다.\n\nHCA는 자사 ACA 미스를 이끈 두 가지 요인을 짚었습니다.\n\n- 기존에는 ACA 가입자의 85%가 무보험으로 옮겨가고 나머지는 상업보험으로 갈아탈 것으로 예상했습니다. 그런데 실제로는 100%에 가까운 수치가 무보험으로 이동하고 있습니다.\n\n- 무보험으로 갈 가입자들의 이용률이 더 낮을 것으로 가정했는데, 그렇지 않았습니다.\n\nHCA의 ACA 이슈 중 절반은 Houston, North Florida, SC / GA 세 개 시장에 집중돼 있습니다. HCA는 이 세 시장에서 ACA 물량이 25~28% 감소했다고 밝혔습니다. 흥미롭게도 이 문제는 전체 물량 중 아주 작은 부분에 해당합니다. HCA는 110만 건의 입원 중 ACA 이슈와 관련된 건은 약 2만 2천 건으로, 물량의 약 2% 수준이라고 공유했습니다. 사업의 아주 작은 비중이 사업 성과를 크게 흔든 셈인데, 이번 분기 미스를 낸 HCA와 Molina 모두에 해당하는 이야기로 보입니다.\n\nACA 이슈 외에도 HCA는 입원·외래 수술 물량 전반의 약세를 보고했고, 이것이 이번 분기의 또 다른 주요 서사였습니다. HCA는 입원 수술의 “소스”가 두 개라고 설명했습니다. 첫째는 응급실로, 입원의 3분의 2가 이 경로를 통하며 계속 성장해 전년 대비 2% 늘었습니다. 나머지 3분의 1은 선택적 수술인데, 올해 선택적 시술은 6% 줄었습니다. HCA는 ACA 사업이 여기에 일정 부분 역할을 한다고 봅니다. HCA는 의사들로부터 이것이 전반적인 비용 부담과 경제적 문제 때문이라는 이야기를 듣고 있다고 말했습니다. HCA는 또 외래 수술은 상황이 더 낫고, 중증도가 높은 케이스가 이익 성장을 이끌고 있다고 언급했습니다."},{"heading_en":"CHS misses on double whammy of commercial softness & uninsured growth","body":"CHS 주가는 이번 주 약 17% 하락했습니다. Q2 실적이 기대에 못 미쳤고 연간 전망도 낮췄는데, 무보험 환자 증가와 상업보험 선택적 수술 물량 감소가 실적을 끌어내렸다고 설명했습니다. 특히 동일 병원 기준 입원 수술은 전년 대비 3.8% 줄었습니다. CHS가 언급한 순풍도 일부 있는데, 구체적으로 Georgia, Indiana, Florida의 state-directed payment 프로그램입니다. 다만 이는 상업보험과 ACA 문제로 상쇄되고도 남았습니다.\n\nACA 이슈에 대해 CHS는 ACA 탈락에 관한 자사 가정은 매출 기대와 부합했지만, ACA 탈락자들이 예상보다 더 많이 CHS 병원을 계속 이용하고 있으며 이 환자들에게서는 사실상 매출이 거의 나지 않는다고 밝혔습니다. 이들은 사실상 전부 무보험이 됐습니다. CHS의 self-pay 인구는 작년에 방문의 5%였는데, 올해는 1.1%포인트 높은 6%를 조금 넘습니다. CHS는 self-pay에서 “푼돈만” 회수하기 때문에 여기서 의미 있는 매출을 인식하지 못합니다. CHS는 이들이 ER 고이용 인구이며, 예전과 똑같이 여전히 ER에 나타나고 있다고 언급했습니다.\n\n상업보험 수술 감소에 대해 CHS는 정형외과(고관절, 무릎, 어깨)의 감소가 가장 크고 심장내과 시술도 그렇다고 공유했습니다. CHS는 심장내과 시술이 선택적으로 보이지 않을 수 있지만 대체로는 선택적이라고 설명했는데, 사람들이 검진을 미루면 시술도 미뤄지기 때문이며, 이는 CHS가 COVID 때 본 양상과 같습니다. CHS는 ASC에서 물량이 늘고 있지만 중증도는 더 낮다고 밝혔습니다. 외래 진료 방문과 정형외과 MRI는 늘고 있는데, 이는 환자 물량 자체는 있다는 뜻이고 다만 그것이 시술로 이어지지 않고 있다는 의미입니다. CHS는 이것이 사람들이 케어를 미루기로 하는 경제적 결정이라고 봅니다.\n\n병원 실적 콜에서 유가, 연준 의장 결정, 전쟁 같은 이야기가 나오는 건 다소 이상한 일이지만, CHS가 지금 이것을 소비자의 전반적인 비용 부담 문제로 보고 있다는 점은 분명합니다."},{"heading_en":"Tenet beats by a mile on ASC strength; Medicaid tailwinds","body":"이번 주 다른 모두가 고전하는 듯한 와중에 Tenet은 견조한 분기를 보내며 주가가 17% 뛰었습니다. FY 2026 조정 EBITDA 가이던스를 중간값 기준 2억 9,500만 달러, 6% 상향했습니다. Tenet은 보충적 Medicaid 매출에서 순풍을 봤지만, Medicaid가 없었어도 이번 분기 기대치를 넘었을 것이라고 언급했습니다. ASC 전략은 성과를 내고 있는 것으로 보이는데, 중증도가 높은 시술에 집중한 결과입니다(관절 치환술이 전년 대비 10% 성장하고 있다고 밝혔습니다). 또 2026년 M&A 규모는 3억 달러를 넘길 예정입니다.\n\n흥미롭게도 Tenet 역시 HCA와 비슷한 ACA 이슈를 겪은 것으로 보이며, ACA 매출이 전년 대비 17% 감소했다고 밝혔습니다. Tenet은 또 ACA에서 무보험으로 거의 1대 1에 가까운 환자 이동이 나타나고 있다고 보고했다가, 이후 그 수치가 100%까지는 아니고 80%에서 100% 사이라고 정정했습니다. HCA가 원래 기대치는 85%였는데 실제 수치가 100%에 훨씬 가까워 큰 타격을 입었다는 점을 감안하면, 이 정정은 중요해 보입니다.\n\nTenet은 또 CHS와 달리 소비자 위축은 나타나지 않고 있다고 언급했고, 업계 전반에서 2%~2.5%의 물량 증가 수치가 발표되고 있는 만큼 급성기 케어를 비관할 만한 환경이라고는 보지 않는다고 밝혔습니다. Q2 결과, 특히 HCA·CHS와 비교해 보면 고중증도 ASC를 둘러싼 Tenet의 전반적 논지를 반박하기는 어렵습니다."},{"heading_en":"CHART OF THE WEEK: The CBO provides an update on health insurance coverage projections through 2036","body":"위에서 다룬 페이어 믹스 변화 논의, 그리고 지난 몇 주간 이어진 고용주 기반 보험이 얼마나 망가졌을 수 있는지에 대한 전반적 대화를 감안하면, CBO가 이번 주 연방 보험 보조금에 관한 더 넓은 보고서의 일부로 건강보험 가입 경로에 대한 10년 전망을 내놓은 것은 흥미로웠습니다.\n\n향후 10년간 가장 큰 변화는 Medicaid(-3.8%), Medicare(+2.2%), 무보험(+1.8%), ACA(-0.7%)입니다. 한편 고용주 부문은 0.1% 감소에 그쳐 거의 움직이지 않습니다. 지금 상황이 얼마나 망가진 것처럼 느껴지는지를 두고 그렇게 많은 에너지를 쏟고 있지만, 이 시장들이 어디로 사라지지는 않는다는 점을 되새기게 해줍니다."},{"heading_en":"THE HOT PEPTIDE SUMMER: FDA Advisory Panel recommends six peptides in a split vote while Hims stock drops 14%","body":"목요일과 금요일에 헬스케어 소셜미디어 채널을 보셨다면, FDA의 Pharmacy Compounding Advisory Committee가 회의를 열어 여섯 개 펩타이드에 대한 컴파운딩 제한을 해제해야 한다고 권고하는 표결을 하고, 한 개 펩타이드에 대해서는 반대 표결을 했다는 소식을 보셨을 것입니다. 현재로서는 이것이 FDA에 대한 권고이지 결정이 아니라는 점을 짚어 둘 만합니다.\n\n표결은 두 진영으로 갈렸습니다. 대체로 펩타이드와 상업적 이해관계가 있는 RFK 지명 인사들은 권고에 찬성했고, FDA의 직업 과학자들은 반대했습니다. 이 분열은 자연히 소셜미디어에서 논란을 일으켰습니다. 회의론자들은 지지자들에게 명백한 재정적 이해충돌이 있다고 지적했고, 지지자들은 누구에게나 재정적 이해충돌이 있고 환자들이 이미 쓰고 있는데 그게 무슨 상관이냐고 맞받았습니다. 양측의 논리는 예상 가능한 소비자주의 대 과학의 서사를 따릅니다.\n\n- 찬성: 환자들은 이미 BPC-157 같은 펩타이드를 규제되지 않는 그레이마켓에서 사고 있다. 허가해서 면허 있는 약국을 통해 유통하는 편이 더 안전하다.\n\n- 반대: 문제의 펩타이드들이 실제로 효과가 있다는 과학적 근거는 거의 없고, 오히려 해를 끼칠 가능성이 높다.\n\n표면적으로 이 권고는 펩타이드 커뮤니티, 특히 펩타이드 인프라를 뒷받침하며 이 시장으로 흘러들어온 자본에는 예상된 승리로 보입니다. 그런 만큼 승인에도 불구하고 Hims 주가가 약 14% 하락한 것은 흥미로웠습니다. 적어도 이번 권고가 절차의 한 단계일 뿐이며, 잘 돼도 FDA가 이 변경을 하는 시점은 2026년 말쯤이 될 것이라는 점을 상기시켜 줍니다. FDA가 이 위원회의 권고를 따를 의무는 없다는 점, 그리고 FDA 직업 과학자와 펩타이드 지지자 사이의 분열된 표결이 투자 심리를 다소 위축시켰을 수 있다는 점도 염두에 두시기 바랍니다."},{"heading_en":"Other Top Headlines","body":"Axios는 New Mountain Capital이 Machinify 매각을 추진하고 있다고 보도했습니다. Machinify는 원래 Matt Holt의 Thoreau 구상에 포함될 것으로 검토됐던 New Mountain 자산 중 하나입니다. New Mountain은 2025년 초 Machinify를 인수해 Rawlings, Apixio의 payment integrity 사업, VARIS와 결합했습니다. 올해 초 JPM에서의 Machinify 발표는 지난 몇 년간 다섯 개 회사를 통합한 이 사업의 재무를 엿볼 수 있게 해줬습니다. 매출은 약 7억 5,000만 달러로 21% CAGR로 성장 중이었고, EBITDA는 약 38%로 2028년에는 51%까지 올라갑니다."},{"heading_en":"Other Top Headlines","body":"CMS는 Clover의 법적 승소 이후 이어진 보험사들의 잇단 소송을 계기로 모든 Medicare Advantage 플랜의 Stars 점수를 재산정하기로 했습니다. Modern Healthcare에 따르면 MA 수급자의 69%가 별 4개 이상 플랜에 속하게 됐는데, 이는 기존 65%에서 오른 수치입니다."},{"heading_en":"Other Top Headlines","body":"ChatGPT는 이번 주 미국 사용자를 대상으로 Health 기능을 출시해 건강 정보를 연결할 수 있게 했습니다. 출시 내용에 따르면 매주 3억 명 이상이 건강 관련 질문을 하러 ChatGPT를 찾습니다. 시점이 눈에 띄는데, 같은 주에 NYTimes가 OpenAI가 ChatGPT의 “극도로 위험한 의학적 권고”를 두고 소송을 당했다고 보도했기 때문입니다. Bob Wachter는 이 두 헤드라인의 병치와 그 함의에 관해 좋은 Substack 글을 썼습니다."},{"heading_en":"Other Top Headlines","body":"여성 건강 프로바이더 Wildflower Health가 D2C 골반저·코어 운동 프로그램인 Every Mother를 인수했습니다. 이번 인수로 Wildflower는 D2C 시장에 진입하는데, 전통적 헬스케어 모델의 접근성·비용 문제를 감안하면 빠르게 성장하는 채널이라고 밝혔습니다. 저희는 이 시장과, 2027년 1월부터 시작되는 출산 관련 지불의 언번들링이 이 시장의 활동에 어떤 영향을 줄지 계속 지켜보겠습니다."},{"heading_en":"Other Top Headlines","body":"Mindoula가 Janus Healthcare Partners와 Valera Health를 인수해, 합쳐진 법인을 복합·상승 리스크 인구에 행동 건강 서비스를 제공하기 위해 건강보험사 및 프로바이더 조직과 협력할 수 있는 리스크 부담형 정신건강 프로바이더로 자리매김했습니다."},{"heading_en":"Other Top Headlines","body":"Abridge가 YC 지원을 받은 에이전틱 AI 플랫폼 Altrina를 어콰이어 하이어했습니다."},{"heading_en":"Other Top Headlines","body":"Surgery Partners 주가는 Idaho 소재 병원 두 곳의 지분을 Intermountain에 7억 9,500만 달러에 매각하며 6% 상승했습니다. 이는 두 병원의 가치를 11억 5,000만 달러로 평가한 것입니다. Surgery Partners는 Q1 실적에서 2026년에 매각이 마무리될 것으로 예상한다고 언급한 바 있고, 행동주의 투자자가 수술 전문 병원에서 철수하라고 압박해 온 점을 감안하면 논리적인 수순으로 보입니다."},{"heading_en":"Other Top Headlines","body":"AdventHealth와 Intermountain이 Denver에서 새로운 조인트벤처를 발표했습니다. AdventHealth 병원 다섯 곳과 Intermountain 병원 세 곳을 한데 모으는 형태입니다. AdventHealth가 이 벤처를 관리하고 일상 운영을 이끌게 됩니다."},{"heading_en":"Other Top Headlines","body":"DexCom이 FDA의 TEMPO 파일럿에 참여하는 첫 번째 발표 기업이 됐습니다. 이는 곧 DexCom이 당뇨 전단계와 제2형 당뇨 관리에 초점을 맞춘 CMMI의 ACCESS 프로그램(eCKM 및 CKM 트랙)에도 참여한다는 뜻입니다. DexCom이 Stelo 제품으로 D2C 시장을 고민해 온 비교적 전통적인 의료기기 제조사라는 점에서 ACCESS에 참여하는 모습은 흥미롭습니다(다만 Stelo는 DexCom이 기대했던 것보다 확산이 더뎠던 것으로 보입니다). TEMPO는 ACCESS의 네 개 트랙 각각에 대해 약 10개 기기를 승인하는 것을 목표로 하는데, 이 그룹에 다른 기기 회사들이 등장할지 궁금합니다."},{"heading_en":"Funding Announcements","body":"자율형 RCM 플랫폼 Candid Health가 1억 2,000만 달러를 조달했습니다. Sixth Street Growth가 라운드를 리드했고, 2025년 2월 Series C 대비 밸류에이션이 3배 올랐다고 알려졌습니다. 일반적인 희석 계산을 적용하면 이번 라운드에서 Candid의 가치는 12억 달러 안팎으로 보입니다. Candid는 ARR이 전년 대비 190% 성장했다고 밝히며, 엔터프라이즈 프로바이더 조직으로부터의 수요가 급증하고 있다고 언급했습니다. Candid의 고객 기반을 설명하는 언어가 2025년 Series C 때와 조금 달라진 점이 흥미롭습니다. 당시에는 원격의료에 분명히 초점을 맞추며 Allara, Nourish, Talkiatry 같은 구체적인 원격의료 고객사 이름을 들었습니다. Candid 웹사이트의 로고들은 여전히 원격의료 중심으로 보이지만, 이번 펀딩 라운드는 고객사를 특정하지 않고 Candid가 헬스케어 프로바이더를 지원한다는 식으로 훨씬 일반적으로 이야기합니다."},{"heading_en":"Funding Announcements","body":"의사 크리덴셜링 플랫폼 Assured Health가 1,900만 달러를 조달했습니다. Insight Partners가 Series A를 리드했습니다. Assured는 Houston Methodist, Tono Health, Birches Health를 포함해 100곳이 넘는 다양한 고객사와 일하고 있다고 밝혔습니다. 지난 10년간 프로바이더 크리덴셜링 문제를 풀겠다며 벤처 자금을 받은 스타트업들의 에너지가 얼마나 많이 투입됐는지를 생각하면, 프로바이더 온보딩이라는 과제의 복잡성을 방증하는 것으로 보입니다. 여기서의 투자 논리는 그 복잡성 때문에 오히려 에이전틱 AI 워크플로우로 자동화하기에 완벽한 기회라는 생각에 기대고 있는 것 같습니다."},{"heading_en":"Funding Announcements","body":"VBC 심장내과 모델인 Karoo Health가 1,620만 달러를 조달했습니다. 7wire Ventures와 Allumia Ventures가 Series A를 공동 리드했습니다. Karoo는 11개 주에서 600명 이상의 심장내과 프로바이더 네트워크를 지원하며, 전국 및 지역 건강보험사와 계약해 임상 성과를 개선하면서 케어 비용을 낮추는 가치 기반 지불 모델을 구현합니다. Humana가 Karoo의 최근 계약 성과 중 하나로 보이는데, Humana는 올봄 심장내과 중심의 새로운 VBC 파트너십 여러 건을 시작했습니다. 저희는 이 건과 다른 “VBC 2.0” 시도들을 눈여겨보고 있습니다. 페이어들이 고비용 임상 인구를 관리하려 하는 흐름에서 VBC 모델의 자연스러운 진화로 보이기 때문입니다."},{"heading_en":"What I'm Reading","body":"Coalition of Independent Dispute Resolution Entities를 대신해 작성된 새 보고서는 No Surprises Act의 IDR 프로세스가 정확히 의도대로 작동하고 있다고 주장합니다. 보고서는 NSA가 환자를 네트워크 외 청구서로부터 보호하도록 설계됐고, Independent Dispute Resolution Entities는 분쟁을 해결하는 과정에서 예상대로 행동하고 있다고 봅니다. 보고서는 최근 크게 도마에 오른 IDR 프로세스의 여러 메커니즘, 예컨대 QPA와 높은 분쟁 건수 등을 길게 다룹니다. 새롭게 생겨난 IRDE라는 소규모 산업을 대신해 정치적 옹호 단체들이 이 프로세스에 개입하게 됐다는 사실 자체가 No Surprises Act에 대해 할 말을 다 해준다고 생각합니다. 저자들의 지적처럼 이 법이 서프라이즈 청구를 줄이고 있다는 사실을 반박하기는 어렵습니다. 동시에 더 넓은 헬스케어 비용 부담 논의라는 측면에서는 나무만 보고 숲을 놓치는 것처럼 보이며, 정교한 두 당사자 사이의 협상에 정부가 끼어들 때 얼마나 비효율적일 수 있는지를 보여주는 좋은 사례이기도 합니다."},{"heading_en":"What I'm Reading","body":"Delaware 주는 이번 주 세 건의 법안을 통과시켰습니다. 향후 2년간 사모펀드의 주내 병원 인수를 금지하고, 자선 진료를 확대하며, 일차의료 투자를 의무화하고, 병원 가격 상한을 Medicare 요율의 250%로 설정하는 내용입니다. 보도는 법안이 알맹이가 빠졌다는 비판, 가격 상한 시행이 2029년으로 미뤄졌다는 점을 언급합니다. 여기 담긴 법안들이 정치적으로는 이해되지만, 표면적으로 계산이 어떻게 맞아떨어지는지는 잘 모르겠습니다. 저라면 Delaware가 이 시점에 사모펀드 관련 법안은 그냥 넘어가도 됐을 것 같다고 말하겠습니다. 자선 진료가 늘고 가격 상한이 다가오는 환경에서 어느 사모펀드가 병원을 사고 싶어 할지 잘 모르겠기 때문입니다. 사모펀드는 대체로 현금흐름이 플러스인 기회를 선호합니다. 주 정부가 Prospect Medical Holdings가 2025년에 Crozer Health를 폐쇄한 방식에 불만인 것으로 보이지만, 여기서 대안 시나리오가 훨씬 나았을지는 잘 모르겠습니다. PE의 자금 지원이 없었다면 Crozer Health는 그냥 더 일찍 문을 닫을 수밖에 없지 않았을까요?"},{"heading_en":"What I'm Reading","body":"Cityblock의 Ohio 마켓 리더이자 전 Ohio Medicaid 관료였던 Marisa Weisel이 Ohio 지역 신문에 논평을 실어, Ohio의 Medicaid managed care 체계를 폐기하고 fee-for-service로 돌아가려는 주 의회의 움직임에 반대했습니다. 이 논의는 여러 주에서 힘을 얻고 있는 것으로 보이는데, Medicaid가 주 전체 지출의 약 30%를 차지한다는 점에서 주목할 만합니다. 여기서 함께 지켜볼 대목은 지역 프로바이더와 VBC 스타트업 사이에 떠오르는 균열입니다. 헬스케어 마진이 압박받고 지역 프로바이더 그룹들이 점점 더 중요해지는 Medicaid 재원을 두고 더 치열하게 경쟁하면서, 자신들이야말로 지역사회의 신뢰받는 파트너라는 이야기를 하면서 “신규 진입자” 모델에 대한 불신의 씨앗을 뿌리는 서사를 지역 프로바이더 커뮤니티에서 더 자주 듣게 될 것으로 예상합니다. 지금 분위기에서는 안타깝지만 효과적인 정치적 논리로 보이며, 벤처 투자를 받은 모델들이 헤쳐 나가야 할 지점입니다."},{"heading_en":"What I'm Reading","body":"Science 기사는 중국에서 자폐와 유사한 증후군을 일으키는 유전자 변이를 치료하기 위해 n-of-1 유전자 편집 치료를 받은 뒤 며칠 만에 사망한 6세 여아의 가슴 아픈 이야기를 다뤘습니다. 아이의 부모는 치료비로 86만 달러를 모금했고, 임상의들로부터 우려스러워 보이는 재정적 압박을 받았습니다. 가족은 이제 책임 소재가 없다고 느끼고, 치료가 얼마나 위험한지 몰랐다는 이유로 가명으로 이야기를 공유하고 있습니다. Science 기사는 이 이야기 전반에 걸쳐 안전성, 윤리, 재정에 관한 수많은 우려를 짚는데, 안타깝게도 요즘 점점 더 커지는 현실처럼 보입니다. 특히 소비자가 원하는 것과 과학자가 생각하는 것에 관한 펩타이드 논의를 떠올리면 더 그렇습니다. 이 새로운 소비자 헬스케어 시대에 caveat emptor(구매자 위험 부담)는 우울한 현실처럼 느껴집니다."},{"heading_en":"What I'm Reading","body":"Evidenced Capital의 Brian Sivak과 Ilant Health의 Elina Onitskansky가 쓴 Fortune 기사는, 고용주들이 GLP-1 커버리지를 이분법적인 예/아니오 결정으로 잘못 보고 있으며 비용을 아끼려 커버하지 않기로 하는 고용주가 늘고 있다고 주장합니다. 기사는 비만 케어에 대한 더 전체적인 접근을 주장하며, GLP-1을 의료적 케어와 폭넓은 생활습관 변화를 결합한 더 넓은 모델의 한 부분으로 놓자고 말합니다. Ilant의 모델과 밀접하게 맞닿아 있는 이 주장은 고용주들이 GLP-1을 두고 겪는 딜레마에 대한 직관적인 해법으로 보입니다. 저는 Ilant가 비만 케어 영역에서 하고 있는 일에 꽤 흥미를 느껴 왔고, 이번 주(7/28 낮 12시 CT) Elina가 HTN 커뮤니티에 회사 업데이트 발표를 한다는 점이 기대됩니다.\n\nHTN Pro 멤버라면 여기에서 신청해 대화에 참여하실 수 있습니다."},{"heading_en":"What I'm Reading","body":"KFF는 Medicaid 시장에서 앞으로 불가피해 보이는 개별 환자 차원의 문제를 보여주는 사례를 조명했습니다. Michigan의 한 환자가 Deloitte의 기술 플랫폼 오류로 인해 장애인이라는 사실이 제대로 등록되지 않고 소득이 Medicaid 자격 기준을 넘는 것으로 잡히면서, 잠시 Medicaid 혜택을 잘못 거부당한 이야기입니다. 2006년 이후 Michigan Medicaid 계약으로 7억 5,600만 달러를 벌어들인 Deloitte는 자사 플랫폼이 제대로 작동하고 있으며 Michigan의 지시에 따라 운영된다고 말했습니다. 한편 Michigan은 자체 프로그램에 광범위한 문제는 없다고 밝혔습니다. Deloitte의 플랫폼은 지난 몇 년간 여러 주에서 조사 대상이 돼 왔습니다. KFF가 지적했듯 Deloitte는 오류투성이 플랫폼으로 60억 달러 이상을 받았고, 상원 재무위원회 청문회도 열렸는데 여기에는 상당히 말도 안 되는 사례들이 포함됐습니다. 예를 들어 Georgia에서는 납세자가 근로 요건 시스템에 9,100만 달러를 썼는데, 이는 등록자 1인당 1만 3,000달러로 건강 급여 총지출보다 5배 높은 금액입니다. 궁극적으로 누구의 잘못이든, 주들이 근로 요건을 시행해 나가면서 이런 이야기(그리고 아마 그와 관련된 소송)를 더 많이 듣게 되는 것은 자연스러운 수순으로 보입니다."}]},"51":{"index":"51","title_en":"Weekly Hea
