에 대한 이야기가 많이 오갈 것입니다. Martin과 제가 최근 여러 자리에서 이야기해 온 것처럼, 저는 여기서 더 사람다운 \"front of house\" 전략을 갖추는 것이 이기는 수라고 계속 생각합니다. 아무튼, OpenAI의 한 주 이야기에서 옆길로 샜네요.\n\n수요일에 OpenAI는 소비자용 PHR 성격의 도구인 ChatGPT Health를 발표했습니다. 저는 지금까지 너무 많은 PHR 발표를 겪어 와서 하나 더 나왔다고 들뜨지는 않지만, 위에서 OpenAI가 인용한 사용량을 보면 이번에는 다를지도 모르겠습니다. Brendan Keeler가 여기에 아주 좋은 분석을 남겼습니다. 헬스케어 스타트업 b.well이 여기서 큰 수혜자가 될 가능성이 있어 보입니다. OpenAI가 기반이 되는 상호운용성 인프라를 위해 이들과 파트너십을 맺고 있기 때문입니다.\n\n목요일에 OpenAI는 OpenAI for Healthcare를 발표했습니다. 여기에는 ChatGPT for Healthcare와 OpenAI API라는 두 가지 별도의 제공물이 포함됩니다. ChatGPT for Healthcare는 이미 AdventHealth, Baylor Scott & White Health, HCA, Memorial Sloan Kettering 등 여러 선도 헬스시스템에서 쓰이고 있는 엔터프라이즈 제공물입니다. 이 제공물에는 임상 검색, 케어 패스웨이 관리, 의뢰서 생성 등 여러 기능이 묶여 있습니다. 제 생각에 이것이 이번 주 가장 흥미로운 전개입니다. OpenAI가 엔터프라이즈 중심 접근을 통해 OpenEvidence/UpToDate/Doximity 같은 곳들과 프로바이더의 관심을 놓고 더 직접적으로 경쟁하는 자리로 옮겨 가는 것이기 때문입니다. 그리고 함께 출발한 헬스시스템 이름들도 꽤 묵직해 보입니다.\n\n휴. 이것으로 OpenAI가 이번 주에 공유한 모든 것에 대한 제 이해를 정리했습니다. 다른 어떤 회사가 이틀 사이에 소비자용 PHR 제공물과 헬스시스템용 엔터프라이즈급 AI 플랫폼을 동시에 내놓는다는 발표를 두 건이나 했다면, 대화의 중심은 그 조직 안에 얼마나 큰 혼란이 벌어지고 있길래 그러느냐, 그리고 한 회사가 이런 전략들을 동시에 실행하는 것이 조금이라도 가능하느냐는 의문이었을 것 같습니다. 이 모든 것을 실행하는 난이도는 거의 불가능에 가까워 보입니다.\n\n그런데 동시에, 주 초에 나온 리포트의 이용량 수치와 이미 엔터프라이즈 제공물에 이름을 올린 헬스시스템들을 함께 놓고 보면, 어쩌면 OpenAI에는 이걸 해낼 만한 추진력이 있는 걸까요? JPMorgan에서 어떤 논의가 오갈지 흥미로울 것은 분명합니다."},{"heading_en":"Doctronic & Utah launch pilot testing AI for medication refills","body":"이번 주 또 다른 AI 소식으로, Doctronic과 Utah주는 환자의 약 재처방을 돕는 데 AI를 활용하는 시범 프로그램을 지난달 시작했다고 발표했습니다. Politico의 보도가 이 파일럿을 잘 다뤘는데, 파일럿은 범위가 제한적이고 접근 방식을 펼치는 과정에서 여러 안전장치를 두고 있습니다. 그럼에도 Doctronic에게도, 그리고 AI가 임상 진료에 통합되는 방식이라는 더 넓은 맥락에서도 의미 있는 진전으로 보입니다. 현재까지 수백 명의 환자가 파일럿에 등록했고, Doctronic은 2026년에 몇 개 주가 비슷한 조치를 취할 것으로 예상합니다. 주목할 점은 Doctronic이 이 작업을 위해 의료과실 보험에 가입했다는 것인데, 이 활동을 의료행위로 본다는 관점을 뒷받침합니다.\n\n화요일에 Doctronic의 공동창업자 Dr. Adam Oskowitz와 이야기를 나눌 기회가 있었습니다. 규제 전략, Doctronic이 파일럿을 어떻게 펼치고 있는지, 그리고 'Doctronic 2.0'의 함의를 더 깊이 들여다보고 싶으시다면 여기서 시청하실 수 있습니다.\n\nAI Prescription Medication Renewals Discussion with Doctronic's Co-Founder Dr. Adam Oskowitz\n\n특히 흥미로웠던 것은 Doctronic이 환자들을 자사의 처방 재조제 웹사이트로 이끌기 위해 어떻게 일하고 있는지였습니다. 직접 발로 뛰는 방식으로, 동네 약국을 찾아가 이점을 설명하고 거기서부터 넓혀 갈 계획입니다. 이 모든 일에 사람의 요소가 있다는 점을 다시 일깨워 주는 대목이고, Doctronic은 지역 시장에서 인지도를, 그리고 신뢰를 쌓는 데 사려 깊게 접근하고 있는 것으로 보입니다.\n\n이 소식에 대해 더 생각해 보고 싶으시다면, 이번 주 Slack에서도 그 대화에 대한 제 정리를 더 깊이 풀어놓았습니다."},{"heading_en":"Revisiting the VBC Topic of the Week","body":"지난주 VBC 설문에 대한 응답 결과입니다. 설문에 답한 379명 가운데 41%는 VBC가 아직 거기까지 가지는 못했지만 옳은 방향으로 가고 있다는 쪽이었습니다. 명백한 성공이라고 보는 사람은 우리 중 소수에 불과했습니다. 한편 47명(12%)은 이제 VBC에서 넘어갈 때가 됐다고 답했습니다.\n\n출처: HTN 1/4 뉴스레터 설문, 총 379개 응답\n\n설문 응답 외에도, 왜 그 답을 골랐는지에 대해 여러분이 아주 사려 깊은 코멘트를 많이 남겨 주셨습니다. 그것들을 전부 요약해 보려 하기보다는, 여기서 살펴보실 수 있게 Google Doc에 담아 두었습니다(응답에서 신원을 알아볼 수 있는 내용은 제거했습니다).\n\n이번 주에는 Aledade의 CEO인 Farzad Mostashari를 인터뷰할 기회도 있었습니다. VBC에 대해 나누는 어떤 대화에서든 Aledade는 원칙을 지키면서 성공적으로 실행하는 방법의 대표 사례로 등장하기 때문에, 위 질문에 답할 때 참고하기 좋은 예라고 생각합니다.\n\nFarzad와 저는 Aledade가 최근 발표한 크레딧 퍼실리티와 VBC 모델의 더 기술적인 측면들, MSSP를 넘어 MA와 커머셜, Medicaid로 확장하는 것에 대한 그의 생각, 그리고 VBC가 어디로 향하고 있는지에 대한 더 큰 질문들을 그가 어떻게 보는지 이야기했습니다. 제 생각에는 스펙트럼에서 더 낙관적인 쪽을 보여 주는 좋은 사례입니다.\n\nFinancing value-based care with Aledade CEO and Co-Founder Farzad Mostashari, M.D."},{"heading_en":"Other Top Headlines","body":"CMS 지도부가 Consumer Electronics Show에서 Medicare FFS 청구를 위한 새로운 클레임 처리 플랫폼에 대한 RFI를 낸다고 밝혔고, 이제 여기서 확인할 수 있습니다. CMS가 실제로 1970년대식 COBOL 시스템에서 더 현대적인 시스템으로 클레임 처리를 갈아탄다면 이는 큰 움직임으로 보입니다. 실현 가능한 선택지가 그리 많아 보이지 않는다는 점을 감안하면, CMS가 어떤 플랫폼으로 옮겨 갈지 생각해 보는 것도 흥미롭습니다. Brad Smith가 CMMI의 10년 성과에 대해 자주 인용되는 NEJM 기고문을 썼을 때, CMMI 모델의 발목을 잡은 운영상의 난제 사례 가운데 하나로 Next Generation Accountable Care Organization 모델이 노후한 시스템 탓에 수천 건의 청구에 시범사업 코드를 잘못 적용해 5,000만 달러 손실을 봤다는 점을 들었던 것을 기억하시는 분도 있을 것입니다."},{"heading_en":"Other Top Headlines","body":"역시 Consumer Electronics Show에서, FDA는 일부 AI 및 웰니스 제품에 대한 감독을 완화하겠다고 발표했습니다. 놀랍지 않게도, Whoop(2025년 7월 혈압 인사이트 기능과 관련해 FDA로부터 경고 서한을 받은 바 있습니다) 같은 조직들은 이 조치를 반겼습니다."},{"heading_en":"Other Top Headlines","body":"Novo는 자사의 Wegovy 알약이 이제 CVS와 Costco 약국, Ro, LifeMD, Weight Watchers, NovoCare Pharmacy, GoodRx 등 여러 채널을 통해 미국 소비자에게 제공된다고 발표했습니다. Ro도 이 소식에 대한 보도자료를 냈는데, 목록에 오른 다른 브랜드들과 함께 2026년에 이들에게 견실한 성장을 가져다줄 것으로 예상됩니다. GLP-1 시장은 여러 플레이어가 소비자를 자사 사이트로 데려와 체중감량 약을 사게 만드는 방법을 헤쳐 나가면서 계속해서 브랜딩의 흥미로운 실습장이 되고 있습니다.\n\nNovo는 또한 첫 \"State of Weight and Health Report\"를 내놓으며, 이 나라의 이른바 Obesity Trap을 들여다보고 비만을 안고 살아가는 사람들이 마주하는 여러 어려움을 조명했습니다."},{"heading_en":"Other Top Headlines","body":"Altaris Capital이 헬스시스템 대상 기술 서비스 제공업체 Tegria를 Providence로부터 인수했습니다. Providence는 2020년에 아홉 개 서비스 사업을 합쳐 Tegria를 처음 출범시켰는데, 이들 사업은 합쳐서 2,500명의 직원이 350개 의료 기관을 지원하고 있었습니다."},{"heading_en":"Other Top Headlines","body":"Sky News는 TPG가 UHG로부터 Optum UK를 12억~14억 파운드(16억~18억 달러)에 인수하기 위해 협상 중이며, 몇 주 안에 거래가 발표될 수 있다고 보도했습니다. Optum UK는 잉글랜드의 GP를 위한 EMR 소프트웨어를 제공합니다. UHG는 2022년 6월에 발표된 거래에서 EMIS를 15억 달러에 인수했습니다."},{"heading_en":"Other Top Headlines","body":"Dr Oz는 화요일 Minnesota 주지사 Tim Walz에게 서한을 보내, CMS가 주의 과거 분기별 수령 내역을 검토하고 있으며 부정수급에 대응하기 위해 필요하다면 앞으로 Medicaid 자금 지급을 유예하고 보류하겠다고 통보했습니다. CMS는 또한 Minnesota에서 부정수급 고위험군인 14개 Medicaid 프로그램을 확인했다고 밝히면서, \"프로바이더 등록과 지급액의 이례적인 증가\"를 발견했지만 주는 아무런 조치를 취하지 않았다고 지적했습니다. CMS에 따르면 이들 14개 프로그램은 주와 연방 납세자의 돈 37억 5,000만 달러를 썼습니다."},{"heading_en":"Other Top Headlines","body":"Amazon One Medical이 시카고에서 Rush University System for Health와 파트너십을 맺으면서, 시카고 시장의 오랜 파트너였던 Advocate Aurora와 갈라섰습니다. One Medical과 Advocate Aurora는 2019년에 처음 파트너십을 맺었습니다. 이제 One Medical이 파트너를 바꾼 지역이 두 곳이 된 만큼, 다른 시장에서도 이 흐름을 지켜볼 만합니다. 맨해튼에서도 2019년 Mount Sinai와 파트너십을 맺은 뒤 최근 Monefiore로 갈아탔습니다."},{"heading_en":"Other Top Headlines","body":"Walmart는 LillyDirect를 포함해 고객을 위한 비대면 진료 상품을 큐레이션해 주는 웹사이트 Better Care Services라는 새로운 서비스를 발표했습니다."},{"heading_en":"Other Top Headlines","body":"CVAUSA가 피닉스에 기반을 둔 심장내과 그룹 Cardiovascular Consultants를 인수했습니다. Cardiovascular Consultants는 CVAUSA가 2024년 4월에 인수한 또 다른 피닉스 심장내과 그룹 Atria Heart의 일부가 됩니다."},{"heading_en":"Other Top Headlines","body":"IntelyCare가 CareRev을 인수하며 두 인력 공급 플랫폼을 결합했습니다."},{"heading_en":"Funding Announcements","body":"산모 케어 모델 Pomelo Care가 17억 달러 밸류에이션에 9,200만 달러를 조달했습니다. Stripes가 라운드를 리드했습니다. 보도자료에 따르면 주로 Medicaid와 고용주 인구를 대상으로 하는 Pomelo Care는 이제 커버드 라이프가 2,500만 명에 이릅니다. 미국 출산의 7%를 지원합니다. 이번 자금은 산모 영역을 넘어 여성과 아동 헬스케어 전반으로 확장하는 데 쓰입니다."},{"heading_en":"Funding Announcements","body":"수술실용 AI 플랫폼 Apella가 지분과 부채로 8,000만 달러를 조달했습니다. 시리즈 B 라운드는 HighlandX가 리드했고 Houston Methodist 등도 참여했습니다. 보도자료에 따르면 Houston Methodist, Tampa General Hospital, MUSC가 고객이며, 병원 고객들은 평균 5%의 수술 볼륨 증가를 보였습니다."},{"heading_en":"Funding Announcements","body":"리얼월드 데이터 플랫폼 Protege가 3,000만 달러를 조달했습니다. a16z가 라운드를 리드했습니다."},{"heading_en":"Funding Announcements","body":"헬스시스템용 안전 플랫폼 Canopy가 2,200만 달러를 조달했습니다. 111° West Capital과 ACME Capital이 라운드를 리드했습니다. Canopy는 현재 60개 헬스시스템에 걸쳐 30만 명 이상의 직원과 함께 일하고 있습니다."},{"heading_en":"Funding Announcements","body":"행동건강 클리닉을 위한 AI 운영체제 Oasys가 460만 달러를 조달했습니다. Pathlight Ventures가 라운드를 리드했습니다."},{"heading_en":"Funding Announcements","body":"specialty pharma의 prior auth를 위한 새로운 모델 Ethicos Health가 프리시드 자금을 조달했습니다. Flare Capital 등이 투자했습니다."},{"heading_en":"What I'm Reading","body":"Making AI work for us: The Defining Health System CEO Leadership Challenge of 2026, Tom Cassels, Seth Frazier, Tracey Massel, Jared Augenstein 씀\n\nManatt의 팀이 오늘 아침 이 리포트를 냈는데, 빠르게 훑어본 바로는 헬스시스템 리더십이 AI 도입을 어떻게 바라봐야 하는지에 대한 사려 깊은 정리가 여럿 담겨 있는 것 같습니다."},{"heading_en":"What I'm Reading","body":"Hospitals Are a Proving Ground for What AI Can Do, and What It Can't, Te-Ping Chen과 Chao Deng 씀\n\n헬스시스템이 AI를 어떻게 도입하고 있는지에 대한 WSJ의 좋은 기사였습니다. 최근 Menlo Ventures 리포트를 인용해 현재 27%가 상용 AI 라이선스를 유료로 쓰고 있다고 짚습니다. 일부 시스템이 AI를 구현하는 과정에서 드러나는 가능성과 어려움을 모두 잘 그려 냅니다. 구체적으로, Mount Sinai는 보험 지급 거절을 뒤집으면서 1,200만 달러의 효과를 봤지만, 의사가 환자에게 보내는 메시지를 생성해 주려던 Epic 도구의 사용은 중단해야 했다는 내용을 다룹니다. 그 도구가 실수를 저지르고 있었는데, 다행히 상대적으로 위험이 낮은 상황들이었습니다. 예를 들어 보행보조기를 요청한 환자에게 도와줄 수 없다고 답하는 식이었습니다."},{"heading_en":"What I'm Reading","body":"\"Bullsh*t\" - The New Way Health Giants Hide Billions, Laura Wadsten과 Nathaniel Horwitz 씀\n\nHunterbrook Media의 팀이 3대 PBM 조직이 소유한 GPO에 대한 폭로 기사를 냈고 여기저기서 회자되고 있습니다. 다만 PBM GPO들이 원격으로 일할 수도 있다는 사실 말고는 새로운 내용이 그리 많지는 않다고 봅니다. 기사에 나오는 재무 관련 논의는 대부분 2023년 Nephron Research 리포트에 기대고 있는데, 저는 그 리포트가 PBM 재무와 GPO(그리고 specialty pharma)가 지난 몇 년간 PBM 이익에서 차지하는 비중이 커져 온 방식에 대해 훨씬 결이 섬세한 논의라고 봅니다. 이 모든 것이 저로서는 종잡을 수 없는 복잡한 난장판처럼 보이고, 복잡성과 불투명성이 회의를 부르는 문화적 국면에 있는 만큼 이런 기사들이 힘을 얻는 이유는 쉽게 알 수 있습니다.\n\n이런 유형의 서사에서 제가 늘 헷갈리는 지점이 하나 있습니다. 기사는 고용주들이 이미 3대 PBM을 넘어 더 투명한 상품으로 옮겨 가고 있다고 적습니다. 그렇다면 이 GPO 문제가 고용주로부터 수십억 달러의 이익을 숨기는 그렇게 노골적인 방법이라면, 시장이 이 문제를 꽤 빠르게 정리해야 하는 것 아닐까요? 짐작건대 고용주들이 이런 행태에 지쳤다면 이제 선택지가 있으니 발로 투표할 수 있는 것 아닌가요?"},{"heading_en":"What I'm Reading","body":"UnitedHealth Group Medicare Advantage Risk Adjustment, FTI Consulting 씀\n\nUHG가 자사의 리스크 조정 관행을 살펴본 FTI Consulting의 리포트를 공개했습니다. UHG의 리스크 조정 정책을 훑어 나가는 33쪽짜리 꽤 너드한 문서로, 내부적으로 적절한 정책과 통제가 갖춰져 있다고 결론짓습니다. 이 리포트를 위의 논의와 대비해 보는 것이 흥미롭습니다. 큰 조직이 무슨 일이 벌어지고 있는지 설명하는데 그 내용이 실제로는 꽤 밋밋할 때는, 앞선 손가락질보다 훨씬 적은 관심을 받는 것으로 보입니다. 이 역시 우리가 겪고 있는 지금의 문화적 국면을 보여 주는 것 같습니다."}]},"06":{"index":"06","title_en":"Weekly Health Tech Reads 1/18/26","subtitle":"JPM 2026 총정리, Rock Health의 2025년 펀딩 리포트, 그리고 AI·리스크 조정·ACA 시장에 관한 다수의 소식","sections":[{"heading_en":"Sponsored by: 10Pearls","body":"스폰서: 10Pearls\n\n헬스케어 기업들은 AI를 도입하라는 압박을 점점 더 크게 받고 있지만, 어디서부터 시작해야 할지 명확한 출발점이 없는 경우가 많습니다.\n\n10Pearls AI 워크숍은 팀이 생성형 AI를 이해하고, 우선순위가 높은 활용 사례를 찾아내고, 탐색 단계부터 프로덕션 배포까지 이어지는 로드맵을 정의할 수 있도록 구조화된 실습형 방법을 제공합니다. 실험 단계를 넘어설 준비가 된 헬스케어 프로바이더, 페이어, 헬스테크 기업을 위해 만들어졌습니다.\n\n전략, 제품, 엔지니어링 역량을 결합해 Elevance, Vori Health, HCSC 같은 고객사가 AI를 적용해 운영을 간소화하고 환자와 가입자 경험을 개선하도록 도왔습니다.\n\n10Pearls AI 워크숍에 대해 자세히 알아보기\n\n뉴스레터 스폰서십에 관심이 있으시면 알려 주세요!"},{"heading_en":"The JPMorgan 2026 Round Up","body":"JPMORGAN 2026\n\n저희는 이번 주 JPM을 소셜 미디어에서 제가 본 대부분의 반응과는 아주 다르게 경험했습니다. Martin과 저는 한 주 동안 컨퍼런스 현장에서 약 30건의 기업 발표를 들었고, 그 발표들에 대한 반응을 둘이 합쳐 약 2만 단어로 써 냈기 때문입니다.\n\n여기에는 OpenEvidence, Abridge, Datavant, Machinify, Ensemble, Talikatry, Cityblock, Virta, Cleveland Clinic, InnovAge, Alignment 등의 발표가 포함되었습니다. 이렇게 다양한 발표를 연달아 듣는 것은 JPM의 세 가지 기업 트랙(비상장 기업, 상장 기업, 헬스 시스템) 전반에서 투자자들이 듣고 있는 내러티브를 들여다보는 흥미로운 렌즈가 되어 주었습니다.\n\n아래는 그 발표들을 관통하는 큰 틀의 시사점입니다. 이 주제들을 더 깊이 파고든 전체 분석을 읽고 싶다면, 아래에서 신청해 사본을 받아 보실 수 있습니다."},{"heading_en":"The JPMorgan 2026 Round Up","body":"\"Rule of 50\" 기업들: JPMorgan 비상장 기업 트랙 발표에서 가장 눈에 띈 점 하나는, 사모펀드 쪽에 더 가까운 방식으로 탄탄한 사업을 만들어 온, 잘 알려지지 않은 기업들로 채워져 있었다는 것입니다. 여러 기업이 자신들을 \"Rule of 50\"이라고 언급했는데, 이는 Rule of 40 벤치마크를 변형한 것입니다. 이 기업들은 매출 성장과 조정 EBITDA 성장을 합쳐 50%가 넘는 수치를 내고 있었고, 지난 몇 년간 수많은 기업에게 난제였던 매출 성장과 수익성 성장의 조합을 보여 주었습니다. 이번 기업 발표들이 예년과는 꽤 다르게 느껴졌다는 다른 사람들의 이야기도 들었습니다. 화려하게 날아오르던 벤처 투자 기업들은 대체로 사라지고, 그만큼 주목받지는 못했지만 견고하고 성장하는 사업을 만들어 온 기업들이 그 자리를 채웠다는 것입니다. 이런 흐름을 잘 보여 주는 예가 PointClickCare입니다. PointClickCare는 30년 전 부트스트랩으로 창업해 2011년에 그로스 에쿼티 투자를 받았습니다. 현재 40% EBITDA 마진에 9억 달러의 매출을 내고 있으며, 2020년 이후 18% CAGR로 성장해 왔습니다. 그 성장 뒤에 있는 이야기를 듣는 것은 인상적이었습니다. 벤처 업계가 지난 몇 년간 헬스케어에서의 수익률에 환멸을 느껴 온 듯 보이는 가운데, JPMorgan에서 발표한 기업들은 훌륭한 반례를 제시했습니다."},{"heading_en":"The JPMorgan 2026 Round Up","body":"새로운 리스크 조정으로서의 레비뉴 사이클 매니지먼트. 레비뉴 사이클 매니지먼트가 과열되고 있습니다. Smarter Technologies와 Ensemble 모두 병원 리더들이 포인트 솔루션 피로를 겪고 있으며, AI로 이 시장을 풀어 보겠다는 수많은 초기 단계 스타트업의 전화를 더 이상 받지 않는다고 설명했습니다. Ensemble은 또한 헬스 시스템들이 RCM을 전략적 역량으로 보고 있으며, 받아야 할 돈을 모두 확보하기 위해 규모를 갖춘 플랫폼과 파트너십을 맺으려 한다고 설명했습니다. 개념적으로 이것은 10년 전 리스크 조정 내러티브와 매우 비슷해 보입니다. 협상 테이블의 반대편에 있다는 점만 다를 뿐입니다. 모두가 자신이 한 일에 대해 적정한 만큼의 매출을 확보하고 싶어 하고, 그것은 합리적으로 들립니다. 문제는 무엇이 적정한지를 어떻게 정의하고, 그에 대해 이견이 있을 때 누가 결정하느냐입니다. 메디케어 국장 Chris Klomp가 화요일 기조연설에서 리스크 조정은 어떤 페이어에게도 전략적 우위가 되어서는 안 되며, 페이어 간 인구의 상대적 건강 상태를 반영하도록 공평한 경쟁의 장을 만들어 주는 것이어야 한다고 언급한 점도 짚어 둘 만합니다. RCM에도 비슷한 개념이 적용될 것 같습니다. 개념적인 수준에서, 어떤 헬스 시스템이든 RCM을 전략적 역량으로 봐야 할 이유가 저에게는 분명하지 않습니다. 그래서 RCM 시장에서 새로운 돈줄이 발견된 것처럼 보이지만, 이 현상은 리스크 조정과 비슷한 이야기의 궤적을 따라가면서 일시적인 것으로 끝나리라는 생각이 듭니다."},{"heading_en":"The JPMorgan 2026 Round Up","body":"헬스케어 거래를 자동화할 Thoreau의 가능성. Thoreau에 대해 알려진 정보가 부족한 만큼, 그것이 무엇인지 아닌지를 말하기에는 아직 너무 이른 것 같습니다. 그럼에도 헬스케어의 거래 레이어를 자동화할 기회에 대한 기대와 관심은 피부로 느껴집니다. Datavant, Machinify, Smarter Technologies가 모두 JPMorgan에서 발표했고, 각각 2025년 자사 사업의 강한 모멘텀을 강조했습니다. Thoreau는 헬스케어에서 거대한 플랫폼을 만들 꽤 분명한 기회를 갖고 있는 만큼, 이 자산들이 어떻게 하나로 모이는지 지켜볼 가치가 있습니다."},{"heading_en":"The JPMorgan 2026 Round Up","body":"AI의 현재 활용은 기대에 못 미칩니다. AI는 모든 발표에서 등장한 주제였습니다. 모든 기업이 자사가 AI를 어떻게 쓰고 있는지 설명할 수 있었지만, 저는 발표를 듣고 크게 감탄하며 나오지는 못했습니다. 예상 가능한 방식으로 AI를 활용해 마진이 개선되는 것은 분명해 보이지만, AI를 어떻게 구현하고 있는지에서 정말로 두드러진 곳은 없었습니다. 유일하게 눈에 띈 기업 발표는 OpenEvidence였는데, 이는 기업 발표라기보다는 의료 초지능의 미래에 대한 CEO Daniel Nadler의 사색에 가까웠습니다. Mayo Clinic 같은 곳의 여러 분야 전문의 집단에 대한 디지털 트윈처럼 들리는, 설득력 있는 내러티브였습니다. 곱씹어 볼 만한 흥미로운 개념이고 기술은 시간이 지나면 거기까지 갈 것이라고 생각하지만, 저는 사실 OpenEvidence가 거기에 도달하려면 무엇보다 비즈니스 모델의 혁신이 더 필요하다고 봅니다. 제약사에 광고를 파는 것을 핵심 비즈니스 모델로 삼는 회사가 AI 시대의 Mayo Clinic이 되는 데에는 그다지 낙관적이지 않습니다."},{"heading_en":"The JPMorgan 2026 Round Up","body":"밸류 기반 케어: 목욕물과 함께 아이까지 버리지는 말자. 화요일에 메디케어 국장 Chris Klomp가 밝힌 정서가 그것이었습니다. 행정부는 여전히 VBC를 강하게 지지하지만, 오늘날 우리가 이를 구현해 온 방식이 작동하지 않는다는 점도 인정하는 것으로 들립니다. Klomp는 행위별 수가 방식의 진료를 더 늘리는 데에는 아무런 관심이 없다고 언급했습니다. 비상장 기업 트랙에서는 VBC에서 썰물이 빠져나갔다는 점이 분명했지만, 동시에 일군의 기업들이 여기서 의미 있는 규모에 도달하기 시작한 것으로도 보입니다. 몇몇 발표에서 기업들이 밸류 기반 계약의 성장을 이끄는 핵심 파트너로 Humana와 Aetna를 언급한 점이 눈에 띄었고, 특히 ThymeCare는 종양 시장에서 이 두 페이어로부터 엄청난 성장을 거두고 있습니다. 2024년 1만 명에서 2025년 8만 5천 명으로 늘었습니다. 저는 특히 Duly Health and Care의 반전이 인상 깊었는데, 이 회사는 다른 여러 가지와 함께 오늘날 \"매우 수익성 있는\" 밸류 기반 사업을 갖고 있다고 언급했습니다. 여기에는 낙관할 이유가 있어 보입니다."},{"heading_en":"The JPMorgan 2026 Round Up","body":"CMS 리더십이 내다보는 전망. CMS 리더십은 화요일에 JP Morgan에서 발표하며 여러 시장에 걸쳐 앞으로 무엇이 다가오는지 분명한 그림을 공유했습니다. 이렇게 많은 CMS 리더가 JP Morgan에 와서 발표한 것은 이번이 처음이라는 점이 언급되었고, 창업자와 투자자 커뮤니티가 깊이 있게 교류할 기회를 반긴다는 점도 분명했습니다. Dr Oz를 비롯한 CMS 관계자들은 ACA, 메디케어 어드밴티지, 메디케이드 등 여러 분야에 걸쳐 다수의 업데이트를 전했습니다. 한 가지 분명한 것이 있다면, 연방 관계자들이 이 나라의 헬스케어를 더 지속 가능하게 만들기 위해 크게 휘두르는 가운데 최근 몇 달간 우리가 본 움직임은 이제 시작일 뿐이라는 점입니다. 이 모든 변화 속에서 분명해 보이는 것 하나는, 연방 정책을 헤쳐 나가는 데 전문성을 가진 컨설턴트들이 대단한 한 해를 맞을 것으로 보인다는 점입니다. 조직들이 AHEAD, LEAD, Rural Transformation Project 같은 프로그램에서 기회를 이해하고 극대화하려 하기 때문입니다."},{"heading_en":"The JPMorgan 2026 Round Up","body":"이상이 컨퍼런스에서 얻은 저희의 큰 틀의 시사점이었습니다. 이 주제들이나 여러 기업 발표를 더 깊이 들여다보고 싶다면, 아래에서 약 30건의 기업 발표를 다룬 저희 커버리지를 신청해 받아 보실 수 있습니다. 신청하시면 각 날짜의 커버리지 사본을 이메일로 보내 드립니다.\n\n저희 JPM 커버리지를 후원해 준 Havarti Risk에 감사드립니다. Elevance의 전 최고계리사가 창업한 Havarti Risk는 깊은 경험을 바탕으로 건강보험 플랜이 비용에 대한 통제력을 되찾도록 돕고, 스타트업이 플랜이 신뢰하는 언어로 가치를 입증하도록 돕습니다."},{"heading_en":"Chart of the Week","body":"Rock Health이 이번 주 2025년 연말 펀딩 리포트를 발표했습니다. 전체를 관통하는 주제는 가진 자와 못 가진 자로 갈린 한 해였다는 것입니다. 전체 펀딩 수치는 딜 건수 기준으로는 소폭 줄었지만(2024년 509건에서 2025년 482건), 조달 자본 기준으로는 늘었습니다(105억 달러에서 142억 달러)."},{"heading_en":"Other Top Headlines","body":"ACA 가입자 수는 앞으로 몇 달간 지켜볼 흥미로운 주제가 될 것입니다. 초기 데이터는 많은 이들이 예측했던 것처럼 ACA 가입이 급감하지는 않았음을 시사하며, 이번 주 WSJ 기사가 이를 짚었습니다. 기사에 따르면 1월 3일 기준 2,280만 명이 ACA 커버리지에 가입했고, 이는 작년의 2,420만 명에서 줄어든 수치입니다. 더 많은 사람이 앞으로 가입할 수도 있지만, 그렇다 해도 약 6% 감소에 그치는 것으로, CBO의 1,890만 명 전망보다 훨씬 나은 결과입니다. 다만 Martin이 이번 주 Health Policy Briefing에서 언급했듯이, 이 분야를 가까이서 추적하는 사람들은 보험료를 내지 않는 사람들의 이탈이 얼마나 더 발생하는지 지켜봐야 하기 때문에 최종 가입자 수를 두고 결론을 내리기에는 아직 이르다고 지적했습니다. 이번 주 Modern Healthcare 기사는 \"유령 가입자\"를 우려하는 것으로 보이는 플랜들의 일화적 근거를 전했습니다."},{"heading_en":"Other Top Headlines","body":"메디케어 어드밴티지 가입자 소식으로, Alignment와 Clover 모두 이번 주 JP Morgan 발표를 앞두고 가입자 증가 데이터를 공유했습니다. Alignment는 1월 1일 기준 가입자가 약 275,300명으로 전년 대비 31% 늘었다고 발표했습니다. Clover는 가입자가 약 153,000명으로 전년 대비 53% 늘었다고 발표했습니다. 이제 모든 시선은 Humana로 향해 있으며, Annual Enrollment Period 동안 가입자가 얼마나 늘었는지 듣기를 기다리고 있습니다. 역사적으로 신규 가입자의 유입은 뒤이은 수익성 문제와 상관관계가 있었지만, Alignment와 Clover 모두 이번 경우에는 새로운 가입자를 관리할 수 있다고 상당히 자신하는 듯합니다."},{"heading_en":"Other Top Headlines","body":"백악관은 Donald J. Trump 대통령의 Great Healthcare Plan을 공개했습니다. 의료비 상승, 특히 ACA에 대한 미국인들의 우려를 다루기 위해 마련된 일련의 논점입니다. 발표와 함께 나온 팩트시트는 세부 내용이 부실했지만, 약값 인하, 보험료 인하, 보험사에 대한 책임 부과, 약값 극대화 등 몇 가지 중점 분야를 담고 있었습니다."},{"heading_en":"Other Top Headlines","body":"OpenAI가 개인 건강 기록 스타트업 Torch를 약 1억 달러 규모의 지분으로 인수했다고 The Information이 보도했습니다. 인수 대금은 선지급 6천만 달러이고, 나머지는 Torch 직원 4명의 잔류와 연동되어 있다고 전해집니다. Torch는 Forward Health의 창업자와, 2024년 Forward가 문을 닫은 뒤 함께한 Forward의 전 동료 3명이 시작한 회사입니다. 이는 OpenAI가 소비자 대상 ChatGPT Health 상품을 구축해 나가는 과정에서 사실상 대규모 애퀴하이어로 보입니다."},{"heading_en":"Other Top Headlines","body":"Anthropic은 일요일에 Claude for Healthcare를 발표했습니다. 지난 10월에 발표된 Claude for Life Sciences를 보완하는 새로운 도구 모음입니다."},{"heading_en":"Other Top Headlines","body":"Abridge와 Availity는 월요일에 파트너십을 발표했습니다. Availity의 실시간 사전 승인을 진료 현장에서 Abridge의 대화형 플랫폼에 내장하는 내용입니다. 이 분야가 성숙하고 플레이어들이 더 엔드투엔드에 가까운 RCM 상품을 두고 경쟁하는 가운데, 양측 모두에게 말이 되는 파트너십으로 보입니다. RCM 니즈의 일부만이 아니라 전 영역을 다루는 RCM 상품에 대한 고객의 관심에 힘입어, 2026년에는 이런 움직임이 더 많이 나올 것으로 예상합니다."},{"heading_en":"Other Top Headlines","body":"DOJ는 이번 주 Kaiser Permanente 계열사들과의 합의를 발표했습니다. 이에 따라 Kaiser는 2009년부터 2018년 사이에 리스크 점수를 부풀렸다는 혐의를 해소하기 위해 5억 5,600만 달러를 지급하게 됩니다. 합의 금액이 상당히 커 보이는 것은 분명하지만, 제가 더 흥미롭게 보는 지점은 7년에서 16년 전에 일어난 리스크 조정 혐의를 두고 이제야 사건을 마무리하는 이야기를 하고 있다는 것입니다. 리스크 조정 논의는 민간 업계의 행위에 초점을 맞추지만, 규제 당국이 여기에 대응하는 데 왜 그렇게 오래 걸렸는지에 대해서도 할 말이 더 있다는 생각이 듭니다."},{"heading_en":"Other Top Headlines","body":"리스크 조정 혐의 이야기가 나온 김에, Chuck Grassley 상원의원은 UnitedHealth Group이 리스크 점수를 극대화했다는 결론의 보고서를 공개했습니다. UHG는 리스크 조정 정책과 관련된 5만 페이지 분량의 문서를 Grassley에게 제출했고, 이 문서는 Grassley의 웹사이트에서 내려받아 살펴볼 수 있습니다."},{"heading_en":"Other Top Headlines","body":"Medicare Payment Advisory Commission은 금요일에 최신 연례 현황 보고서를 발표했습니다. 2026년 메디케어 어드밴티지 지급액이 FFS 지급액보다 760억 달러 많을 것이라는 결과입니다. 코딩과 관련된 과다 지급은 v28의 단계적 도입에 따라 2023년 380억 달러에서 2026년 220억 달러로 계속 줄고 있습니다."},{"heading_en":"Other Top Headlines","body":"Epic과 여러 헬스 시스템이 환자 의무기록에 부적절하게 접근했다는 이유로 Health Gorilla를 상대로 소송을 제기했습니다. Brendan Keeler가 구체적인 내용을 다뤘습니다."},{"heading_en":"Other Top Headlines","body":"UnitedHealth는 몇몇 주에서 농촌 병원에 대한 지급을 앞당기기 위한 6개월 파일럿을 진행하고 있으며, 수금 기간을 30일 미만에서 15일 미만으로 줄이는 데 초점을 맞추고 있습니다."},{"heading_en":"Funding Announcements","body":"커뮤니티 종양내과 클리닉을 위한 AI 플랫폼 VieCure가 4,300만 달러를 조달했습니다. 이번 라운드는 Danaher의 공동창업자 Mitch Rales와 Northpond Ventures가 주도했습니다."},{"heading_en":"Funding Announcements","body":"MRI 스캐닝 소프트웨어를 만드는 Vista AI가 2,950만 달러를 조달했습니다. Cedars-Sinai와 Intermountain Health를 비롯해 여러 헬스 시스템이 투자자로 참여했습니다."},{"heading_en":"What I'm Reading: Comparing OpenAI Health Connector with my open-source Health Skillz","body":"Josh Mandel 씀\n\nMicrosoft Healthcare의 최고 아키텍트 Josh Mandel이 ChatGPT Health 인터페이스에 연결하는 과정을 시연합니다."},{"heading_en":"What I'm Reading: When You Upload Your Medical Records to AI, Who's Actually Protecting Them?","body":"Myoung Cha 씀\n\n여러 소비자용 AI 플랫폼과 자신의 의료 데이터를 공유하는 것의 법적 함의를 짚어 본, 읽어 볼 만한 글입니다."},{"heading_en":"What I'm Reading: Consumer health apps are dead","body":"Ashwin Sharma 씀\n\n요즘 건강에 관심이 많은 친구들에게서, Sharma가 여기서 묘사한 대로 AI를 활용해 자신의 모든 개인 데이터를 훑는 개인용 AI 어시스턴트를 만들고 있다는 이야기를 점점 더 자주 듣습니다. Sharma는 이것이 소비자 대상 앱에 갖는 함의를 논합니다. 저는 앞의 두 글을 함께 놓고 이 모든 것의 신뢰 문제를 생각해 보는 것이 흥미롭습니다. 이 분야에서 이기려면 신뢰 측면에서 이기는 것이 (충분조건은 아니지만) 필요조건이라고 저는 계속 생각합니다."},{"heading_en":"What I'm Reading: 2026 JP Morgan Healthcare Conference Recap","body":"Rebecca Springer, Collin Anderson 씀\n\nBailey & Co의 사람들이 JP Morgan에서 나눈 대화에서 얻은 시사점과 2026년 사모펀드 시장에 대한 함의를 정리한 유용한 글을 냈습니다. 저는 롱제비티에 대한 관심과, 컨시어지 시장에서 조만간 몇몇 거래가 나올 것이라는 점이 흥미로웠습니다."},{"heading_en":"What I'm Reading: The High Cost of Living: What Working Families Pay For Health Care","body":"Emma Curchin, John Scmitt 씀\n\n미국 노동자 가정의 의료비를 들여다본 CEPR 팀의 흥미로운 글입니다."}]},"08":{"index":"08","title_en":"Weekly Health Tech Reads 1/25/2026","subtitle":"OpenEvidence의 펀딩 라운드, McKinsey의 프로핏 풀, 그리고 그 밖의 소식에 대한 이야기","sections":[{"heading_en":"Sponsored by: Wing Assistant","body":"Wing은 케어 딜리버리 조직과, 스케줄링·빌링·문서 작성·환자 커뮤니케이션 등을 처리하는 숙련된 버추얼 어시스턴트를 연결해 줍니다. 케어 플로우와 기술에 경험이 있는 이들의 어시스턴트는 감독이 거의 필요하지 않아, 내부 인력이 환자 진료에 집중할 여력을 확보해 줍니다.\n\n작은 가정의학과 클리닉에서부터 Cedars Sinai, Curana Health 같은 대형 병원과 전국 단위 조직에 이르기까지, Wing은 규모를 가리지 않고 여러 팀과 함께 일하며 운영을 개선합니다.\n\n더 알아보기\n\n뉴스레터 스폰서십에 관심이 있으시면 알려 주세요!"},{"heading_en":"A MUSING ON AI FUNDING","body":"OpenEvidence의 120억 달러 펀딩 라운드와 메디컬 슈퍼인텔리전스의 미래\n\n소문으로 돌던 OpenEvidence의 라운드가 이번 주 발표되었습니다. Thrive Capital과 DST Global이 주도해 120억 달러 밸류에이션에 1억 5,000만 달러를 조달했습니다. 플랫폼 내 광고를 통해 상업화에 나선 지 불과 몇 달 만에 연 매출 런레이트 1억 달러에 도달했습니다.\n\nOpenEvidence는 이달 초 JPMorgan에서 자사 플랫폼의 임상 컨설트가 2025년 12월 1,790만 건으로, 2024년 12월 월 260만 건에서 늘었다고 밝혔습니다. 임상의들 사이에서 하나의 동사(verb)로 자리 잡아 가는 것으로 보이는 헬스케어 기업으로서는 놀라운 성장 궤적입니다. 펀딩 궤적도 그에 못지않게 놀랍습니다. 지난 한 해 동안 OpenEvidence는 네 차례 라운드에 걸쳐 약 6억 3,500만 달러를 조달했고, 밸류에이션은 12배 올랐습니다. 이전 라운드는 다음과 같습니다.\n\n- 시리즈 C, 2025년 10월: 60억 달러 밸류에이션에 2억 달러\n- 시리즈 B, 2025년 7월: 35억 달러 밸류에이션에 2억 1,000만 달러\n- 시리즈 A, 2025년 2월: 10억 달러 밸류에이션에 7,500만 달러\n\n당신이 Sequoia Capital이고 2월 시리즈 A를 주도했다면, 7,500만 달러 투자금이 1년 만에 10억 달러에 가까운 규모로 불어난 셈입니다. 두말할 것 없이 이들은 OpenEvidence에 아주 만족하고 있을 겁니다. 당신이 OpenEvidence CEO인 Daniel Nadler이고 여전히 회사 지분의 58%를 보유하고 있다면, 더 기쁘리라 짐작합니다.\n\n여기서 밸류에이션 문제는 아주 흥미로운데, 아래에서 더 깊이 들어가 보겠습니다. 120억 달러 밸류에이션의 이번 시리즈 D 라운드에 참여한 투자자들이라면, OpenEvidence가 500억 달러 이상의 사업이 될 경로를 보고 있어야 하고, 적어도 1,000억 달러 이상 기업이 될 가능성도 어느 정도 보고 있어야 합니다.\n\nOpenEvidence의 최대 경쟁자인 Doximity가 현재 연 매출 약 6억 2,000만 달러를 내고 시가총액이 약 75억 달러라는 점은 짚어 둘 만합니다. 미국 헬스케어 디지털 광고 시장 전체의 지출 규모는 260억 달러로 추정됩니다. 요컨대 여기 새로 들어온 투자자들이 수익을 보려면 OpenEvidence가 시장 자체를 새로 정의해야 할 것으로 보입니다."},{"heading_en":"The Medical Superintelligence Narrative","body":"✍️ 더 깊이 들어가기\n\n이번 펀딩 라운드에서 제게 가장 흥미로운 지점은, 이것이 메디컬 슈퍼인텔리전스 구축을 중심에 둔 OpenEvidence 비전의 다음 단계를 위한 토대를 놓는다는 점입니다. 보도자료는 이를 다음과 같이 설명합니다.\n\n출처: OpenEvidence 보도자료\n\nNadler는 지난주 JPMorgan 발표에서도 이 구상을 이야기했습니다. 제가 들은 바로는 Mayo Clinic의 디지털 트윈처럼 들렸습니다. 각 전문과목에서 최고 수준인 AI 모델들이 서로 협력해 의사들의 까다로운 질문에 답하는 것입니다.\n\n이 내러티브에 투자자들이 군침을 흘리는 이유는 어렵지 않게 상상할 수 있습니다. 조지아주 시골의 종양내과 의사가 OpenEvidence를 통해 세계 최고 전문의 전원에 맞먹는 지식에 즉시 접근할 수 있다고 상상해 보십시오. 이론적으로는 헬스케어 시스템을 밑바닥부터 다시 배선하는 좋은 방법으로 보입니다.\n\n저는 결코 세계 최고의 AI 전문가가 아니지만, 기술적 관점에서 이것이 앞으로 몇 년 안에 실현 가능하다는 게 그리 터무니없어 보이지는 않습니다. 제가 훨씬 더 회의적인 쪽은 그 뒤에 있는 비즈니스 모델입니다."},{"heading_en":"OpenEvidence's Business Today: Selling Provider Attention","body":"분명 매력적인 비전이지만, 오늘의 사업에서 보면 엄청난 도약이기도 합니다. 지금의 OpenEvidence는 의사들의 주목을 제약사에 팔아 빠르게 1억 달러 매출로 성장한 회사입니다.\n\nOpenEvidence가 1억 달러 매출로 빠르게 성장하는 과정의 역학을 잘 요약해 준다고 생각한 인용문을 하나 접했습니다.\n\n독특한 시장입니다. 제가 본 어떤 시장과도 다릅니다. 약을 처방하는 사람들에게 영향을 주려고 연간 140억 달러를 쓰는 제약 산업이 있습니다. 약을 처방할 수 있는 사람은 60만 명뿐이니, 60만 명을 상대로 140억 달러가 쓰이는 셈입니다. 그 돈을 어떻게 쓸 수 있는지에 대한 온갖 규정이 있습니다. 그냥 돈을 줄 수는 없습니다. 이 의사들에게 닿는 채널을 가지고 있다면, 그것은 금광입니다.\n\n출처: Kirk Loevner 인터뷰\n\n반전은 이렇습니다. 그 인용문은 Epocrates CEO Kirk Loevner가 Epocrates 앞에 놓인 기회에 대해 이야기한 2009년 인터뷰에서 나온 것입니다. 25년을 거슬러 올라가 보면, Epocrates와 OpenEvidence의 서사 궤적에는 비슷한 점이 많습니다. 임상 진료를 개선하기 위해 방대한 정보에 더 쉽게 접근할 수 있게 해 주는 새로운 기술이 등장한다는 것입니다. 25년 전 그 새로운 기술은 PalmPilot이었습니다. 오늘날 그 기술은 AI입니다. 두 경우 모두 임상의가 정보에 접근하는 더 효율적인 방법입니다. 도입을 유도하기 위해 무료로 제공하고, 그 도구를 쓰는 프로바이더들의 주목을 팔아 수익화합니다. Loevner의 말대로, 금광입니다.\n\nEpocrates의 여정은 OpenEvidence 앞에 필연적으로 놓일 과제도 시사합니다. 제약사가 프로바이더 대상 광고에 연간 수십억 달러를 기꺼이 쓰는 이유는 그 광고에서 ROI가 나오기 때문일 것입니다. 거기서 생기는 긴장은 명백하며, Epocrates는 상장사가 된 뒤 이 문제로 어려움을 겪기 시작했습니다. EHR을 포함해 다른 제품군을 만들어 보려 했지만 크게 휘청였고, 결국 2012년 athenahealth에 인수되었습니다.\n\n그 여정은 이것이 기술 역량의 문제가 아니라 신뢰의 문제라고 제가 생각하는 이유를 잘 보여 줍니다. 당신이 조지아주 시골의 암 전문의이고, 이 플랫폼이 종양 치료제 제조사의 광고를 당신에게 띄우고 있다는 걸 안다면, 환자에 관한 까다로운 의학적 질문에 답할 때 이 플랫폼을 \"의학 지식의 기본 운영체제\"로 정말 신뢰하겠습니까? 저는 정말 그렇지 않다고 봅니다. OpenEvidence의 발목을 잡을 것은 기술이 아니라 사람입니다.\n\n그래서 저는 OpenEvidence 앞에 놓인 더 어려운 질문이 기술 문제가 아니라 비즈니스 모델 혁신의 문제라고 생각합니다. 현재 모델은 빠른 성장을 가능하게 하고 있지만, 더 큰 비전과는 근본적으로 어긋나 있는 것으로 보입니다. 조직 설계가 잘못되어 있습니다. 그러니 AI 시대의 Doximity를 만드는 길은 분명해 보이지만, 그 사업은 필연적으로 오늘의 Doximity와 매우 비슷한 모습, 즉 프로바이더의 주목을 팔아 수억 달러의 매출을 내는 모습일 것입니다.\n\n그 증거로는 OpenEvidence의 커머셜 팀을 보면 됩니다. 대부분이 지난 12개월 사이 Doximity에서 영입된 인력인데, 소수의 제약사 바이어들과 이미 맺어 온 상업적 관계를 활용하려는 것으로 보입니다. 경쟁사의 매출을 빼앗는 레드오션 전략에서는 논리적인 수로 보이지만, 새로운 형태의 메디컬 슈퍼인텔리전스를 만들고 있다면 취할 만한 수는 아니라는 인상을 받습니다.\n\n이번 OpenEvidence 라운드의 투자자들은 정의상 제 견해에 동의하지 않을 텐데, 밸류에이션을 둘러싼 유명한 과거 논쟁을 빌려 이를 좀 더 풀어 보는 것이 흥미로울 것 같습니다."},{"heading_en":"Open Evidence & the Gurley-Damodaran Debate on Valuation","body":"OpenEvidence의 가파른 부상은 10년 전 Aswath Damodaran과 Bill Gurley 사이의 유명한 밸류에이션 논쟁을 떠올리게 합니다. Uber가 2014년 6월 180억 달러 밸류에이션에 자금을 조달한 뒤, Damodaran과 Gurley는 Uber의 밸류에이션을 두고 공방을 벌였습니다. DCF에 관한 책을 쓴 교수인 Damodaran은 자신의 분석에 근거해 Uber가 크게 고평가되어 있으며 60억 달러가 더 적절하다고 주장했습니다. Uber 이사회에 있던 Gurley는 Damodaran이 핵심을 놓쳤다고 반박했습니다. Uber의 서비스는 시장을 근본적으로 재정의할 수 있기 때문에, DCF에는 드러나지 않는 방식으로 크게 저평가되어 있다는 것이었습니다. 정말 훌륭하고 품위 있는 공개 논쟁이었습니다.\n\n오늘날 Uber의 시가총액이 약 1,700억 달러라는 점을 보면, Gurley가 Damodaran이 보지 못한 무언가를 봤다는 것이 분명해 보입니다. 이 모든 것을 생각할 때 OpenEvidence에도 비슷한 렌즈를 적용해 보는 것이 흥미롭다고 생각합니다.\n\n인정하건대 OpenEvidence에 관해서라면 저는 Damodaran 진영에 속합니다. 여기 투자자들이 보고 있을 시장 기회로 가는 경로가 제게는 보이지 않습니다. 제가 보기에 이들 투자자에게 최선의 시나리오는, 헬스케어에서 전략적 한 수가 절실한 대형 플레이어에게 시장 고점에 매각하는 Livongo나 Oak Street 같은 엑싯입니다. 그리고 Nadler가 Doximity 영업팀에 보낸 문자가 어떤 단서라면, 그것이 그의 계획이기도 한 듯합니다. 법정에서 진행 중인 Doximity와 OpenEvidence의 법적 분쟁 덕분에, 그가 앞으로 2~3년 안에 은퇴할 계획을 밝힌 문자들 일부를 볼 수 있습니다.\n\n위의 어느 것도 사람들이 진료에 접근하는 방식을 근본적으로 바꾸려는 리더의 행동으로는 보이지 않습니다.\n\n이 OpenEvidence 밸류에이션 문제에 대해 커뮤니티가 어떻게 생각하는지 궁금합니다. 5년 뒤 얼마의 가치가 될 것 같으신가요?\n\n5년 뒤 OpenEvidence의 가치는 얼마일 것 같습니까?\n\n- 오늘의 10배 초과: 1,200억 달러 이상\n- 3배에서 10배: 360억 달러에서 1,200억 달러\n- 1배에서 3배: 120억 달러에서 360억 달러\n- 0.5배에서 1배: 60억 달러에서 120억 달러\n- 0.01배에서 0.5배: 1억 2,000만 달러에서 60억 달러\n- 0"},{"heading_en":"McKinsey's Profit Pools","body":"헬스케어가 어디로 가는지 실마리를 읽어 보려는 사람이라면, McKinsey의 프로핏 풀 분석이 늘 가장 좋은 출발점 중 하나라고 생각합니다. 이들은 지난주 최신 분석을 내놓으며 2026년과 그 이후 산업이 어디로 향하는지를 살폈습니다. 2028년과 2029년의 기회에 앞서, 단기적으로는 어려운 그림을 그리고 있습니다. 특히 2027년 세그먼트별 EBITDA를 본 아래 차트는 정말 놀랍습니다. 그래프 왼쪽 아래를 보면 Medicaid가 산업 세그먼트로서 마이너스 EBITDA를 기록할 것으로 전망되는데, 이런 차트에서 그런 모습을 본 기억은 제게 이번이 처음입니다.\n\n출처: McKinsey 분석"},{"heading_en":"Other Top Headlines","body":"목요일에 페이어 CEO들이 워싱턴 DC로 불려 가 Ways & Means Committee와 Energy and Commerce Health Subcommittee 양쪽에서 이 나라의 헬스케어 비용을 끌어올리는 요인에 대해 증언했습니다. 이 세션들은 제게 요즘 의회에서 오가는 대화의 수준을 다시 확인시켜 주는 자리였습니다. 정치적 연출은 넘치고 알맹이는 적었습니다. 대부분의 세션에 보험사 CEO들이 굳이 있어야 했는지 모르겠습니다. 공화당과 민주당이 각자의 헬스케어 정책이 가진 결함을 두고 간접적으로 다투고, 여기에 수직 통합에 대한 전반적인 반감이 뒤섞이며, 소셜미디어 캠페인용 사운드바이트를 만들어 내려는 자리처럼 느껴졌습니다."},{"heading_en":"Other Top Headlines","body":"UnitedHealth Group CEO Steve Hemsley는 목요일 의회 증언에 앞서 준비한 발언에서, UHC가 2026년 ACA 익스체인지에서 내는 이익을 자발적으로 환급하겠다고 밝혔습니다. Martin이 목요일 Health Policy Briefing에서 이야기했듯, 페이어들이 현재의 정치적 환경과 익스체인지에서의 향후 경로를 헤쳐 나가려는 상황에서 UHG로서는 영리한 수로 보입니다."},{"heading_en":"Other Top Headlines","body":"Amazon One Medical도 AI 발표 대열에 합류해, 이번 주 AI 기반 헬스 어시스턴트를 출시했다고 밝혔습니다. 경영진이 AI로 인한 시장 변화에 대응하면서 앞으로 몇 달간 이런 미투(me-too) 성격의 AI 제품 출시 발표가 줄을 이을 것은 불가피해 보입니다. 이런 일이 더 이상 뉴스가 되지 않는 날을 기다리고 있고, 그날이 곧 오리라 생각합니다."},{"heading_en":"Other Top Headlines","body":"Healthier Capital이 2억 2,000만 달러 규모 첫 펀드의 클로징을 발표했습니다. Healthier는 2017년부터 2023년까지 One Medical을 이끌며 2020년 IPO와 2022년 Amazon 인수를 거친 것으로 가장 잘 알려진 Amir Dan Rubin이 설립했습니다. 이미 Hyro, Qualified Health, Ezra, Zarminali Pediatrics 등 여러 곳에 투자했습니다."},{"heading_en":"Funding Announcements","body":"프로바이더를 위한 ChatGPT인 OpenEvidence가 120억 달러 밸류에이션에 2억 5,000만 달러를 조달했습니다. 자세한 내용은 위의 논의를 참고하세요."},{"heading_en":"Funding Announcements","body":"소아 진료 딜리버리 모델인 Zarminali Pediatrics가 1억 1,000만 달러를 조달했습니다. One Medical의 전 CEO Amir Dan Rubin이 공동 창업한 펀드 Healthier Capital이 라운드를 주도했습니다. Zarminali는 현재 여덟 개 주에서 28개 클리닉을 운영하고 있으며, 2026년에 15개 클리닉을 신규로 열고 M&A를 통해 기존 진료소들도 더할 계획입니다. One Medical이 프라이머리 케어 시장에서 했던 것과 크게 다르지 않은, 새로운 전국 단위 소아과 브랜드를 향한 큰 승부수로 보입니다. Hospitalogy가 2024년에 Zarminali를 잘 정리한 개요를 낸 바 있습니다."},{"heading_en":"Funding Announcements","body":"가상 ABA 플랫폼인 AnswersNow가 4,000만 달러를 조달했습니다."},{"heading_en":"Funding Announcements","body":"제약사용 컴패니언 앱을 만드는 BrightInsight가 1,300만 달러를 조달했습니다. 보도자료는 한 사례로 Patient App을 소개하는데, Sanofi와 Regeneron이 만든 자가 주사형 바이오의약품의 환자 복약 순응도를 높이는 데 도움을 줍니다. Mayo Clinic, General Catalyst, Insight Partners, Eclipse, New Leaf Venture Partners가 투자했습니다."},{"heading_en":"Funding Announcements","body":"고용주를 대상으로 하는 온사이트/가상 프라이머리 케어 모델인 One to One Health가 Frist Cressey Ventures로부터 1,200만 달러 규모의 소수 지분 그로스 캐피털 투자를 받았습니다. 보도자료는 이 모델이 직원 한 명당 연간 최대 4,000달러를 절감할 수 있다고 밝히는데, 그 계산이 어떻게 나오는지 무척 보고 싶습니다. 현재 650개 조직과 협업하며 50만 명의 멤버를 두고 있습니다."},{"heading_en":"Funding Announcements","body":"GI 질환의 케어 익스텐더인 Salvo Health가 500만 달러를 조달했습니다. Salvo는 지역 프로바이더들과 협업해 GI 및 대사성 간 질환에 대한 \"래퍼라운드 케어\"를 제공하며, 해당 프로바이더들이 RPM과 CCM 코드로 청구할 수 있게 해 줍니다."},{"heading_en":"Funding Announcements","body":"포스트 어큐트 케어를 위한 레비뉴 사이클 플랫폼인 Claim Health가 440만 달러를 조달했습니다. Claim은 1년이 채 안 되는 기간에 매출이 30배 성장했다고 밝히며, Ascend Health, Interim HealthCare, Home Care RN 등 초기 고객들이 행정 업무량 50% 감소, 리퍼럴 처리량 4배 증가, 예방 가능한 거절 건수 30~50% 감소를 경험했다고 전했습니다. Maverick Ventures가 라운드를 주도했습니다."},{"heading_en":"What I'm Reading","body":"An Updated Analysis of Coding Pattern Differences in Medicare Advantage, Chris Klomp, Joe Albanese, Alec Aramanda, John Brooks\n\n이번 주에 접하고 무척 흥미로웠던 글입니다. Center for Medicare의 리더들이 v28이 Medicare Advantage의 리스크 어저스트먼트 게이밍 문제를 이미 상당 부분 해결한 것으로 보인다고 이야기합니다. 아래 시각 자료가 v28이 코딩에 이미 얼마나 큰 영향을 미쳤는지를 잘 보여 줍니다.\n\n더 읽기"},{"heading_en":"What I'm Reading","body":"State of Health AI 2026, Sofia Guerra, Steve Kraus, Andrew Hedin, Marla Jalbut\n\nBessemer 팀이 정리한 AI 헬스케어 지형에 대한 좋은 조망입니다.\n\n더 읽기"},{"heading_en":"What I'm Reading","body":"Suki ROI Validations 2026, KLAS\n\nAI의 현주소 이야기가 나온 김에, Rush 같은 시스템에서 Suki가 어떻게 쓰이고 있는지 다룬 KLAS의 이 케이스 스터디가 흥미로웠습니다. 프로바이더당 매출 증가와 Suki가 \"문서 작성과 코딩의 개선\"을 어떻게 이끌고 있는지에 대한 눈이 번쩍 뜨이는 수치들이 담겨 있습니다. McLeod Health에서는 재진 인카운터 기준으로 Suki가 Level 5 인카운터 5% 증가, Level 4 인카운터 7.3% 증가, Level 3 인카운터 18.2% 감소를 이끌고 있습니다. 페이어의 리스크 어저스트먼트 농간을 둘러싼 지금의 우려를 생각하면, 이 행태가 그것과 무엇이 크게 다른지 저는 잘 모르겠습니다.\n\n더 읽기"},{"heading_en":"What I'm Reading","body":"Treatment of a teenager with an ultra-rare condition is a medical milestone, The Economist\n\n영국에서 의약품 개발 과정에 기반해 n=1 약물 치료의 승인을 시도하는 임상시험을 시작하려는 노력을 다룬 흥미로운 글입니다. 승인 속도를 높이는 동시에 이런 약의 개발 비용을 낮추는 흥미로운 접근으로 보입니다.\n\n더 읽기"},{"heading_en":"HTN Radio","body":"The Grand Round-Up: 01/22/26\n\nMartin과 저는 화요일에 즐겁게 이야기를 나눴습니다. JPM과 ACA 등록 등에 대해 다뤘습니다. 그가 영상까지 녹화하고 있는 줄은 몰랐으니, 제 상어 스웨트셔츠는 못 본 척해 주세요. 읽기보다 듣는 쪽을 선호하신다면, 저희가 최근에 녹음한 다른 것들도 있습니다.\n\n- Rebecca Springer와의 인터뷰: JPM에서의 PE 관련 대화에서 얻은 시사점\n- Doctronic의 Adam Oskowitz와의 인터뷰: 유타 파일럿에 대해\n- Aledade의 Farzad Mostashari와의 인터뷰: VBC에 대해"}]},"10":{"index":"10","title_en":"Weekly Health Tech Reads 2/1/26","subtitle":"2027 Advance Notice의 파급 효과에 대한 단상, 4분기 실적 시즌 개막, 디지털 헬스 M&A 과열, 그 외 소식들","sections":[{"heading_en":"Sponsored by: Lyft Healthcare","body":"교통편은 진료를 가로막는 장벽 가운데 가장 해결하기 쉬운 축에 속하지만, 기존의 비응급 의료 이송(Non-Emergency Medical Transportation, NEMT) 솔루션은 낡은 기술, 예측하기 어려운 대기 시간, 사전 예약 요건 탓에 기대에 못 미치는 경우가 많습니다.\n\n지난 10년간 Lyft Healthcare는 4,000곳이 넘는 의료 기관이 교통편을 안정적으로, 그리고 대규모로 관리할 수 있도록 도왔습니다. Lyft는 의료 제공자, 보험 플랜, 교통 혜택 관리자를 위해 설계된 유연한 솔루션을 제공하며, 이 솔루션은 기존 업무 흐름에 통합되고 환자의 필요에 맞춰 조정됩니다.\n\n그 결과는 진료 접근성 확대, 취약 계층의 더 나은 건강 결과, 그리고 의료 기관의 비용 절감입니다.\n\nLyft와 협력했을 때의 효과를 더 알아보세요.\n\n뉴스레터 스폰서십에 관심이 있으시면 알려주세요!"},{"heading_en":"","body":"2026년 2월에 오신 것을 환영합니다! 이번 호에서는 링크를 거는 방식에서 조금 다른 시도를 해 봤습니다. 아래에서 다루는 주제들을 두고 커뮤니티가 나누고 있는 대화로 회원들이 더 쉽게 찾아가 참여할 수 있도록, Slack 대화에 링크를 걸었습니다. 이 변화가 마음에 들든 들지 않든 피드백을 남겨 주세요 🙂\n\n늘 그렇듯 Advance Notice부터 온갖 AI, 스타트업 M&A, 새로운 상용 플랜 설계에 이르기까지, 이런 여러 산업 변화의 뒤편에는 파고들 만한 뉘앙스와 디테일이 많습니다. 그 모든 것을 관통하는 한 가지가 분명하다면, 변화가 진행 중이라는 점입니다. 더 깊이 들어가고 싶다면 커뮤니티에 참여하시길 권합니다. 매일 업계 곳곳의 관점에서 배우며 이런 주제들을 파고드는 일은 무척 재미있습니다."},{"heading_en":"A MUSING","body":"2027 Advance Notice: 하룻밤 사이에 시가총액 1,000억 달러를 지운 일의 파급 효과\n\n여기 계신 모두가 이미 들으셨겠지만, CMS는 월요일 저녁 Medicare Advantage에 대한 2027 Advance Notice를 발표했고, 지급자(payor)에 대한 실효 평균 변동률은 0.09%였습니다. 업계로서는 큰 폭의 부정적 서프라이즈였습니다.\n\n애널리스트와 여러 업계 관측자들은 전체 변동률이 한 자릿수 중반대일 것으로 기대했던 것으로 보입니다. 지난 11월 Humana의 3분기 실적 발표 콜에서 한 애널리스트는 비용 트렌드 상승을 근거로 실효 성장률이 9%를 넘을 수도 있다고 전망하기도 했습니다. 실제 실효 성장률은 4.97%로 나왔습니다.\n\n요율이 5%가량 출렁이는 것은 지금 이 시장이 얼마나 예측하기 어려운지를 보여 줍니다. 그리고 이는 1. 지난 10년간 헬스케어 스타트업 혁신을 뒷받침하는 데 큰 역할을 해 왔고 2. v28 이후의 세계로 넘어가면서 2027년에는 안정을 되찾을 것이라고 많은 이들이 여겨 온 시장에서 대단히 큰 문제로 보입니다. 몇 달 뒤 Final Notice가 어디에서 결정되든, 이번 Advance Notice는 이 시장의 안정성과 예측 가능성이라는 개념에 큰 망치를 휘둘렀습니다. 이는 업계와 협력한다는 CMS의 전반적인 기조와도 어긋나 보입니다.\n\n주식 시장은 이 소식에 즉각 반응해, 상장 MA 종목들이 발표와 함께 모두 10% 이상 하락했습니다. WSJ가 계산해 보니 이 하락으로 대형 4개사(UNH, HUM, CVS, ELV)에서만 하룻밤 사이에 약 1,000억 달러의 시가총액이 사라졌습니다. Alignment를 빼면 어떤 MA 플랜도 주 후반에 반등하지 못했습니다(Elevance는 수요일에 실적을 발표했고, 그것이 주중 상승을 이끌었습니다). Humana 주가는 화요일에도 계속 떨어져 결국 한 주를 26% 하락으로 마감했습니다.\n\n출처: Google Finance\n\n타격을 받은 것은 상장 보험사만이 아니었습니다. 이번 Advance Notice로 여러 지역 시장의 프로바이더 소유 건강보험 플랜 단체인 Alliance of Community Health Plans도 성명을 내고 Advance Notice를 \"실망스럽고 전혀 현실적이지 않다\"고 표현했으며, 이 요율이 확정되면 더 많은 보험사가 시장에서 철수할 것으로 본다고 밝혔습니다. 이 성명에서 눈여겨볼 대목은 ACHP가 위험 조정(risk adjustment)을 현대화하려는 CMS의 노력은 지지한다고도 밝혔다는 점입니다. 여기서 중요한 지점으로 보입니다. 반발은 위험 조정에 대한 것이 아니라 전체 계산에 대한 것입니다.\n\n지역 건강보험 플랜들은 이미 재정 압박을 받고 있었습니다. 몇 달 전 HealthScape Advisors 보고서는 지역 플랜의 절반 이상이 2027년을 버텨 낼 자본 준비금을 갖추지 못했다고 짚었습니다. 그것도 이번 소식이 나오기 전 이야기입니다. 그러니 MA 시장의 경쟁 조건을 평평하게 만드는 것이 의도였다면, 이건 문제로 보입니다."},{"heading_en":"Klomp's Commentary on Tuesday","body":"이번 소식에 대한 반응의 크기와 혼란스러운 전략적 함의를 감안하면, 발표 직후인 화요일에 Paragon Institute의 Demetrios Kouzoukas와 함께한 웨비나에서 Chris Klomp의 이야기를 듣는 것은 특히 흥미로웠습니다. 한 시간짜리 대화가 44분쯤 지나서야 마침내 Advance Notice 주제에 다다랐고, Klomp의 발언은 이랬습니다.\n\n분명히 해 두고 싶습니다. 어제 장 마감 후 Advance Notice가 공개된 뒤로 말이 많았기 때문입니다. 행정부가 Medicare Advantage를 지지하지 않는 것이냐, 아니면 시장이 그저 잘못 읽은 것이냐, 혹은 앞으로 시장에 비우호적이거나 적대적으로 나오겠다는 신호냐 하는 질문들이 제기됐죠. 저희는 이에 대해 명확하고 투명하게 소통해 왔다고 믿습니다. Administrator도 명확하고 투명하게 소통해 왔습니다. 다만 오해의 여지 없이 분명히 말씀드리자면, 저희는 Medicare Advantage가 Medicare의 미래에서 중요한 역할을 할 것이고 또 해야 한다고 계속 믿고 있습니다. 저희는 그것이 수혜자들에게 계속해서 훌륭한 가치를 제공하도록 하는 데 집중하고 있습니다. 저희가 책임지고 있는 6,800만 명의 수혜자 말입니다. 그게 무슨 뜻이냐고요? 그들이 가능한 최고의 의료 경험을 하는 것입니다. 필요한 진료를 받는 것입니다. 그것이 비용 효율적으로 이뤄지는 것입니다. 그리고 그것이 올바른 진료여서 그들이 가장 건강한 삶을 살 수 있게 되는 것입니다. 동시에 프로그램의 장기적인 지속 가능성과 안정성을 확보하는 것이고요. 그런 목표에 맞춰, 말씀하신 대로 연결되지 않은 차트 리뷰(unlinked chart review)에 대한 코딩과 관련해 몇 가지 수정안을 제안했습니다. 그 목표가 무엇이냐고요? 프로그램의 인센티브가 실제로 수혜자의 진료를 개선하는 활동에 보상하도록 만드는 것입니다.\n\n…\n\n오해하지 마십시오. 조금도 돌려 말하지 않겠습니다. 저희는 Medicare Advantage를 전폭적으로 지지합니다. 그것은 Medicare의 미래에서 핵심적인 구성 요소입니다.\n\n출처: Chris Klomp, Paragon Health Institute 인터뷰 1/27/25\n\n여기서부터 제 머리가 정말 아파 옵니다. 표면적으로 보면, 상장 보험사들의 시가총액 1,000억 달러를 날려 버린 바로 그날에, 그리고 지역 보험사들이 이 조치가 자신들의 생존 자체를 위협한다는 성명을 내는 와중에, Medicare Advantage 시장을 목청 높여 지지한다는 것은 앞뒤가 맞지 않아 보입니다. 알려진 바로는 Klomp를 비롯한 CMS 지도부는 대단히 명석하고 소통에도 뛰어나며, 특히 민간 시장과의 협상을 풀어 가는 데서 그렇습니다. MFN이 좋은 예로 보입니다. 그건 이번 행정부의 특징인 듯합니다. 그렇다면 이 겉보기의 부조화를 두고, CMS가 지지한다고 신호를 보내는 대상은 정확히 무엇일까요?\n\nPolitico가 이번 주에 짚었듯, Klomp 본인이 불과 몇 주 전 JPM에서 Medicare Advantage가 불안정해졌고, 시장에는 안정성과 예측 가능성이 필요하며, CMS가 일관되게 지급할 것이라고 말했습니다. 어떤 의미에서는 이것을 아주 문자 그대로 CMS가 일관되게 지급하는 것으로 해석할 수도 있겠습니다. 2026년과 2027년 사이에 플랜에 지급하는 금액을 바꾸지 않고 있으니까요. 하지만 실없는 농담은 접어 두고, 이건 제게 앞뒤가 맞지 않습니다. 여러 반응이 보여 주듯 이번 조치는 안정적이지도 예측 가능하지도 않았습니다.\n\n월요일에 벌어진 일을 두고 제 머릿속의 부조화를 풀어 볼 만한 가설은 두 가지입니다.\n\nCMS가 Medicare Advantage 산업을 리셋하겠다는 의지를 신호로 보내며 반창고를 확 떼어 냈다. Klomp는 CMS가 Medicare Advantage 프로그램에서 납세자의 돈을 잘 관리해 오지 못했다는 견해를 여러 차례 밝혀 왔고, 이번 조치는 바로 그 점을 다시 최우선에 두겠다는 뜻입니다. 고성장하고 투자자 친화적인 시장으로서의 Medicare Advantage 시대는 끝났으며, CMS는 장기적으로 납세자에게 더 지속 가능한 프로그램이 되도록 여기서 돈을 빼내겠다는 뜻을 분명히 하고 있습니다. Trump 행정부가 MA에 우호적일 것이라는 기대와 달리, 긴축의 시기가 온 것입니다. 당연히 이런 전환에는 시장의 혼란이 따르겠지만, 시장이 어떻게 반응할지는 꽤 예측 가능합니다. 플랜들은 혜택을 줄이고, 시장에서 철수하는 곳이 나오고, 시장은 통합될 것입니다. 모두 시간을 두고 다뤄야 할 과제지만, 새로운 기준선을 분명히 한 뒤에야 다룰 수 있는 것들입니다. Klomp가 공개적으로 MA를 지지하는 것은 앞으로의 변화를 이끌고 여러 이해관계자를 다시 협상 테이블로 불러오기 위함입니다.\n\nCMS가 여기서 계산을 잘못했고 보험계리적 수치의 영향을 과소평가했다. Klomp의 발언을 보면 Advance Notice가 의도한 주된 변화는 차트 리뷰 관련 변경을 통해 위험 조정의 경쟁 조건을 평평하게 만드는 것이었음이 분명합니다. Paragon 대화의 한 대목에서 Klomp는 이렇게 말했습니다. \"Advance Notice의 나머지는 그냥 계산입니다. 아시다시피 보험계리사들이 기저 의료비 트렌드를 산정합니다. 그것을 실효 성장률에 넣으면, Advance Notice의 나머지는 거기서 계산으로 흘러나옵니다.\" 이 말을 읽고 나면, Advance Notice의 주된 의도가 대형 상장사와 소규모 지역 사업자 사이의 경쟁 조건을 평평하게 만드는 것이었다는 시나리오를 상상하기는 어렵지 않습니다. 그런데 보험 시장에서 흔히 그렇듯, 보험계리적 계산은 Advance Notice 같은 사안에서 결코 작은 조각이 아닙니다. 이번 Advance Notice에 대한 반응에서 보았듯, 그 계산식에 들어가는 입력값과 가정이 사실상 전부입니다. Advance Notice의 나머지를 그저 보험계리적 계산이라고 치부한 것은 결과적으로 큰 전술적 실수였습니다. CMS의 계리사와 업계의 계리사가 매우 다른 계산을 하고 있기 때문입니다. 특히 목표가 경쟁 조건을 평평하게 만들어 보험 플랜 간 경쟁을 촉진하는 것이었다면, 지역 플랜의 시장 철수와 통합을 불러오는 것은 그 목적을 무너뜨리는 것처럼 보입니다.\n\n두 설명 모두 제게는 말이 되지만, 지금 시점에서 어느 쪽이 더 그럴듯한지는 전혀 모르겠습니다. 제가 또 다른 설명을 놓치고 있을 가능성도 충분히 있습니다. 이건 그저 제 머리가 이번 주에 정리해 낼 수 있었던 내용일 뿐입니다. 안정성과 예측 가능성이라는 애초의 논점으로 돌아가면, 여기서 설명이 갈린다는 것 자체가 업계에는 큰 숙제로 보입니다.\n\n몇 달 뒤 Final Notice가 나오면 실제로 무슨 일이 벌어지고 있는지 더 잘 알 수 있을 것 같습니다. 이번 주에 여러 논평자가 짚었듯, Final Notice는 역사적으로 Advance Notice보다 약 1% 높았습니다. 지난 10년간의 Advance Notice와 Final Notice 데이터는 다음과 같습니다.\n\n출처: 제 Google Sheet 파일과 CMS 데이터\n\nFinal Notice가 별 변화 없이 나온다면, 이번이 정말로 시장에 대한 강한 리셋임을 분명히 보여 주는 신호일 것입니다. Final Notice가 역사적 인상폭의 상단에서 나온다면, CMS가 이렇게까지 깊이 깎을 의도는 아니었으며 소중한 것까지 함께 내버릴 위험이 있음을 시사할 수 있습니다. 이번 주 MA 보험사 주가 흐름을 보면 월스트리트는 예상 결과에 대해 이미 패를 내보인 듯합니다."},{"heading_en":"The ripple effect for startups and investors","body":"Final Notice의 결과와 무관하게, Medicare Advantage에서 벌어진 이런 시장 격변의 파급 효과는 아무리 강조해도 지나치지 않아 보입니다. 지난 10년간 헬스케어 서비스 분야의 대형 엑싯을 되짚어 보면, 그 상당수가 MA 시장에 기대고 있었습니다. Oak Street, Signify, VillageMD, Landmark, CareBridge 등 MA 프로그램의 성공에 힘입어 만들어진 유니콘만 꼽아도 그렇습니다. 이런 종류의 사업에 투자하고 있다면, 정부가 더 이상 납세자의 돈으로 이런 성과를 뒷받침하고 싶지 않다는 신호를 보내는 것인지 스스로 물어봐야 한다고 생각합니다. 만약 그렇다면, IPO 시장은 여전히 얼어붙어 있고 유일한 전략적 인수자 집단마저 무력해진 상황에서, 앞으로 정부 프로그램을 대상으로 일하는 회사들에게 어떤 엑싯 가능성이 남아 있을까요? 이미 어려운 환경에 더해 사모 시장에는 큰 문제가 될 소지로 보입니다.\n\n지난 10년간 복합 질환이나 고령 인구를 대상으로 혁신해 온 벤처 투자 스타트업에서 일하고 있다면, 그 스타트업이 직간접적으로 지난 10년간 MA 프로그램의 성공 덕분에 존재할 가능성이 큽니다. 사람들이 가끔 제게 왜 이 뉴스레터에서 보험 시장 이야기를 그렇게 많이 하느냐고 묻습니다. 바로 이 역학 때문입니다. 보험 시장, 특히 Medicare Advantage는 시장에서 벌어지는 스타트업 활동의 상당 부분을 떠받치는 핵심 엔진입니다. MA 시장의 이런 격변은 필연적으로 MA 플랜 자체를 훨씬 넘어서는 파급 효과를 낳을 것입니다. 첫 번째 파도는 v28 때 그랬듯 VBC 프로바이더를 덮칠 것이고, 이어지는 파도는 그 시장에 솔루션을 파는 여러 회사를 덮칠 것입니다. 말할 것도 없이, CMS가 앞으로 혁신과 위험 감수를 폭넓게 지원하고 싶다고도 밝히고 있는 만큼, 이런 과제들을 어떻게 다룰지 지켜보는 것은 흥미로울 것입니다.\n\n우리는 지금 임계점에 와 있는 듯하고, 어쩌면 이 나라가 아주 빠르게 이중 의료 체계로 향하고 있는지도 모릅니다. 감당할 수 있는 개인과 기업을 위한 현금 지불·상용 보험 시장, 그리고 나머지 국민을 위한 대규모 정부 재원 위험 풀 말입니다. 그 위험 풀들이 시간이 지나며 구체적으로 어떻게 형성될지는 지켜볼 만하지만, 지금 이 순간 한 가지가 분명하다면 연방 정부가 납세자의 자원을 더 잘 관리하려 하고 있다는 점입니다.\n\n이번 주 두 계층에 걸친 헤드라인의 대비는 여러 시장의 혁신 상태를 꽤 잘 보여 줍니다. ACA, Medicaid, Medicare 시장이 두들겨 맞는 동안, Ro와 Hims는 둘 다 곧 나올 슈퍼볼 광고의 세부 내용을 공개하고 있고, Ro는 광고 하나에 총비용 1,500만 달러 이상을 쓴다고 설명했습니다. 좋든 나쁘든 미국 헬스케어를 잘 보여 주는 예로 보입니다."},{"heading_en":"Question of the Week","body":"위에서 다룬 여러 역학을 감안해, 여기 커뮤니티에 설문을 돌려 보면 재미있겠다고 생각했습니다. Final Notice가 Expected Average Change 수치를 얼마나 올릴 것이라고 보시나요?\nAdvance Notice 대비 Final Notice가 어디쯤에서 나올 것이라고 예상하시나요?\n\n선택지에는 지난 10년간의 실제 결과에 대한 맥락이 함께 담겨 있습니다.\n\n사실상 변화 없음(0.09%에서 0%~0.1% 상승, 선례는 2017년뿐)\n\n소폭 상승(0.1%~0.75% 상승, 역사적 결과의 하단)\n\n중간 정도 상승(0.75%~1.25% 상승, 역사적 평균 결과)\n\n큰 폭 상승(1.25%~2.5% 상승, 역사적 결과의 상단)\n\n더 큰 폭 상승(2.5% 이상 상승, 선례는 2026년뿐)"},{"heading_en":"Q4 Earnings Season","body":"월요일 밤에 Advance Notice가 나오면서 실적 시즌의 무대가 흥미롭게 깔렸습니다. 실적 시즌은 화요일 UHG와 HCA의 발표로 시작됐고, Elevance도 수요일에 실적을 냈습니다. 실적 발표 콜의 대비가 아주 흥미롭습니다. HCA는 애널리스트들로부터 20%의 영업이익률을 장기간 유지할 수 있느냐는 질문을 받는 반면, UHG와 Elevance는 한 자릿수 중반대의 각종 마진 목표가 장기적으로 달성 가능하기는 하냐는 추궁을 받고 있습니다. 헬스케어에서 돈이 어떻게 흐르는지 고민하고 있다면, 여기 파고들 거리가 많다고 생각합니다.\n\n각각에 대한 간단한 요약은 다음과 같고, 더 자세한 내용은 커뮤니티에 있습니다."},{"heading_en":"Q4 Earnings Season","body":"UHG가 4분기 실적 시즌의 포문을 열며, 2026년은 UHC와 Optum 전반에서 핵심 사업에 다시 집중하는 해가 될 것이라고 강조했습니다. UHG는 2026년 매출이 소폭 감소할 것으로 전망하는데, Bloomberg는 이것이 30년 만에 처음 있는 UHG의 연간 매출 감소가 될 것이라고 짚었습니다. UHC는 보험 포트폴리오의 가격을 다시 책정했고 2026년에 마진 개선을 기대한다고 밝혔습니다. Medicare Advantage 회원 이탈은 당초 예상보다 크지만, UHC는 이 접근에 자신감을 표하면서 시장 역학 탓에 예상보다 많은 갈아타기가 일어났다고 설명했습니다. Optum은 마진을 개선하는 데 UHC보다 더 오랜 시간이 걸릴 것입니다. Optum Health는 2026년에 완만한 마진 개선을 기대하고 2027년에 그 위에 쌓아 갈 계획이며, 목표 마진을 달성할 수 있다는 근거로 텍사스 시장의 결과를 들었습니다. 한 애널리스트가 짚었듯 4분기는 Optum Health가 약 6억 달러를 밑돌면서 힘든 시기였습니다. 이 모든 것이 앞으로를 향해 스스로를 재배치하고 있는 이 조직 안에서 변화가 진행 중임을 보여 줍니다. UHC는 준비된 발언에서 2027 Advance Notice를 정면으로 다루며, 그것이 \"의료 이용량과 비용 트렌드의 현실을 전혀 반영하지 못한다\"고 했습니다."},{"heading_en":"Q4 Earnings Season","body":"Elevance 주가는 수요일 오전 실적 발표 콜 이후 주 후반에 7% 반등했습니다. 이 회사는 핵심 사업을 안정화하면서 2026년 조정 EPS 감소를 전망하는 한편, 2027년 이후에는 12% EPS 성장으로 돌아가겠다는 계획입니다. UHG와 비슷하게 Elevance도 앞으로 HMO 계약과 D-SNP 인구 중심으로 재배치하면서 MA 사업의 예상보다 큰 감소를 받아들이는 분위기였습니다. '두 번째 블루 입찰(second blue bid)' 현상 덕분에 ASO 시장에서 강한 성장을 보고 있다고도 밝혔습니다. Medicaid는 여전히 저점 구간의 해로 보고 있으며, 저희 계산으로는 Elevance가 보조금 만료의 여파로 올해 ACA 시장에서 최대 38%의 이탈을 볼 수 있다고 밝힌 셈입니다. 전반적으로 앞으로 보험 시장이 맞닥뜨릴 어려움을 보여 주는 한편, Carelon 사업의 긍정적인 모멘텀이 그것을 상쇄하고 있습니다."},{"heading_en":"Q4 Earnings Season","body":"보험사들이 제자리걸음을 하는 동안 HCA는 눈부신 분기를 내놓았고, 실적 발표 후 주가가 잠시 11% 뛰었습니다. HCA는 애널리스트 예상치를 웃돌았고, 한 애널리스트는 콜을 마무리하며 앞으로도 20%가 넘는 마진을 유지할 수 있겠느냐고 물었습니다. 대부분의 병원 시스템이 영업이익률에서 겨우 손익분기를 맞추는 이야기를 하는 업계에서, 그 질문 자체가 최근 HCA가 얼마나 잘하고 있는지를 보여 주는 듯합니다. HCA는 그 질문에 답을 내놓고 싶어 하지 않았고, 콜에서 2026년 조정 EBITDA에 6억~9억 달러의 부정적 영향을 더할 여러 정책 역풍도 언급했지만, 현재로서는 회사가 상당히 잘 실행하고 있는 것으로 보입니다."},{"heading_en":"Chart of the Week","body":"Oliver Wyman이 여러 주에 걸쳐 병원의 예상 영업이익률 하락 폭을 살펴본 흥미로운 분석을 내놓았습니다. 아래는 가장 큰 영향을 받는 주들의 차트입니다. New York은 병원 영업이익률이 5.8% 낮아질 것으로 예상합니다. 반대쪽 끝에는 Wyoming이 0.2% 하락으로 자리합니다.\n\n이런 보고서를 읽으면서 위의 HCA 실적을 함께 생각해 보면 흥미롭습니다. 이런 시장 여건에서 훨씬 많은 병원이 HCA 수준의 운영 규율에서 도움을 받을 수 있을 것 같습니다.\n\n출처: Oliver Wyman 보고서"},{"heading_en":"Other Top Headlines","body":"버추얼 케어 프로바이더 Sword Health가 Kaia Health를 2억 8,500만 달러에 인수했습니다. Kaia는 Sword에 독일 MSK 시장의 교두보를 마련해 주며, 여기 담긴 전략을 정말 깊이 파고들고 싶다면 이번 주 Brian Dolan의 Exits and Outcomes가 아주 잘 정리해 두었습니다. Sword는 이번 인수를 시작으로 7주 연속 뉴스를 내놓을 예정인 듯하고, Bloomberg 기사에 따르면 5억 달러를 조달하는 동시에 올해 인수에 매우 적극적으로 나설 계획이라는 뜻도 내비쳤습니다. Sword는 2025년에 빠르게 성장하면서도 현금흐름 흑자를 냈다고 밝히며 기존 사업 운영에는 외부 자본이 필요 없다고 말했습니다. 그렇다면 그 현금으로 스타트업을 사기 위해 투자자들에게 Sword 지분을 발행할 계획이라는 뜻으로 읽힙니다. 현금이냐 지분이냐에 대한 선호를 두고 스타트업 쪽과 Sword 쪽 모두에서 어떤 역학이 작동할지, 그리고 Sword 입장에서는 왜 부채로 조달하지 않는지 생각해 보면 흥미롭습니다. 어느 쪽이든 현재 시장에서 긍정적인 모멘텀을 많이 갖고 있는 것으로 보입니다. [Bloomberg]"},{"heading_en":"Other Top Headlines","body":"정신건강 시장에서는 Spring Health와 Alma가 합병했습니다. 재무 조건은 공개되지 않았습니다. Spring Health 블로그 글은 이 거래가 Spring Health의 AI 역량과 Alma의 프로바이더 인프라 및 네트워크를 결합한다고 설명합니다. Spring Health는 현재 고용주와 건강보험 플랜을 통해 5,000만 명의 계약 인원을 확보하고 있고, Alma는 전국 단위 보험사와 일부 지역 보험사에 걸쳐 1억 2,000만 명을 포괄하는 건강보험 플랜 계약을 갖고 있습니다. IPO 후보로 거론돼 온 Spring Health는 4억 7,000만 달러 이상을 조달했으며 가장 최근인 2024년 6월에 33억 달러 밸류에이션을 받았습니다. Alma는 2억 2,000만 달러 이상을 조달했고 가장 최근인 2022년에 8억 달러 밸류에이션을 받았습니다."},{"heading_en":"Other Top Headlines","body":"Crossover Health가 Premise Health와 합병하며, 고용주 대상 1차 진료의 대표적인 두 자산이 결합했습니다. Premise Health는 44개 주에 800개의 웰니스 센터를 두고 있고, Crossover는 50개 클리닉을 운영하는데 그중 26개는 사업장 내(on-site), 24개는 여러 고용주가 함께 쓰는 인근(near-site) 지점입니다. 이 시장에서 논리적인 자산 결합으로 보입니다."},{"heading_en":"Other Top Headlines","body":"Included Health가 고용주를 위한 대안적 플랜 설계를 선보였습니다. 매우 흥미로운 전략적 움직임으로 보이며, 고용주들이 비용 상승을 헤쳐 나가느라 씨름하는 가운데 앞으로 몇 년간 고용주에게 판매하는 내비게이터를 비롯한 여러 회사가 이 방향으로 움직일 것으로 예상합니다. 금요일 늦게 Included Health CEO Owen Tripp과 이 소식에 대해 이야기 나눌 기회가 있었고, 그 내용은 내일 커뮤니티에 공유할 계획입니다. 그는 Included Health가 이 플랜으로 이미 시장에서 얻은 반응에 대한 흥미로운 데이터 포인트, AI 기반 회원 경험이 이 플랜 작동의 핵심인 이유, 그리고 이런 유형의 상품을 브로커가 고용주의 성과 관리를 돕는 또 하나의 도구로 어떻게 보는지를 이야기했습니다. 최근 고용주 시장이 공개 시장에서 두들겨 맞긴 했지만, 저는 오히려 앞으로 여기에 기회가 많다는 인상을 받습니다."},{"heading_en":"Other Top Headlines","body":"Endpoints News에 따르면, 고령자 1차 진료 프로바이더 ChenMed는 이번 주 온라인 행사에서 GLP-1을 복용하는 회원들 사이에 제지방 근육량 감소와 그에 따른 낙상 증가로 입원이 급증한 것을 확인한 뒤, 더 이상 회원들에게 GLP-1 복용을 권하지 않는다고 밝혔습니다. 약 1만 명 규모의 인구에서 6개월 동안 500건의 초과 입원이 발생했다고 하는데, 이 집단에서의 GLP-1 사용에 대한 꽤 경고적인 사례로 보입니다. [Endpoints]"},{"heading_en":"Other Top Headlines","body":"Reed Jobs가 시작한 종양학 중심 벤처 펀드 Yosemite가 3억 5,000만 달러 규모의 신규 펀드 중 2억 달러를 클로징했다고 발표했습니다. LP에는 Amgen, Memorial Sloan Kettering, MIT, John Doerr가 포함됩니다. 아직 신생 펀드이긴 하지만 Yosemite는 흥미로운 접근과 종양학 분야에서 인상적인 트랙 레코드를 갖고 있습니다. [Forbes]"},{"heading_en":"Funding Announcements","body":"처방약 사전 승인(prior auth) 모델인 Tandem이 Bloomberg에 따르면 10억 달러 밸류에이션에 1억 달러를 조달했습니다. Accel이 라운드를 주도합니다. 이로써 Tandem의 총 조달액은 1억 3,700만 달러가 되며, 다른 투자자로는 Thrive Capital과 General Catalyst가 있습니다. Tandem의 사이트에는 수천 명의 프로바이더가 매일 이 서비스를 쓰고 있고 연간 수백만 건의 처방을 처리하고 있다고 적혀 있습니다. [Bloomberg]"},{"heading_en":"Funding Announcements","body":"AI 기반 보험 브로커리지 롤업 회사인 Gyde가 6,000만 달러를 조달했습니다. AI를 활용해 효율을 높이고 브로커리지 내 마진을 개선하는, 브로커리지 소유주와 Gyde 모두에게 윈윈이 되는 꽤 단순명료한 모델로 보입니다. 이런 모델이 얼마나 빠르게 확장될지 궁금합니다."},{"heading_en":"Funding Announcements","body":"AI 중심의 의료 과실 배상 사업인 Indigo가 5,000만 달러를 조달했습니다. Rubicon Founders와 Town Hall Ventures가 투자했습니다. 보도자료에 따르면 Indigo는 현재 전국 1만 명의 프로바이더에게 서비스를 제공하고 있고, 100억 달러의 보험료를 인수하고 있으며, 제출 건의 20%를 완전 자동화했습니다."},{"heading_en":"What I'm Reading","body":"Directing Medicare: Past, Present, and Future with CMS Medicare Director Chris Klomp, Paragon Health Institute\nCMS의 전임 Medicare 디렉터와 현직 디렉터인 Demetrios Kouzoukas와 Chris Klomp의 시의적절한 온라인 대담. 2027 Advance Notice 논의와 관련해 위에서 이미 많이 인용했지만, MFN에 대한 접근을 비롯해 유용한 다른 주제도 여럿 다룹니다. 들어볼 만합니다."},{"heading_en":"What I'm Reading","body":"The Means-Testing Industrial Complex, Luke Farrell\n지난 몇 달간 Martin이 HTN에서 많이 다뤄 온 주제, 즉 Equifax와 Deloitte가 Medicaid 근로 요건을 관리하며 일궈 낸 거대한 사업에 대한 좋은 심층 분석입니다."},{"heading_en":"What I'm Reading","body":"How GLP-1s Broke Healthcare Distribution, Sophia Ye와 Sachin Maini\nGLP-1이 헬스케어 유통의 새로운 시대를 열고 있다는 점을 다룬 좋은 생각거리라고 봤습니다. 위에서 이야기한 현금 지불 시장과 상용 시장의 혁신과 이어서, 헬스케어 유통이 어떻게 바뀌고 있는지 생각해 보면 흥미롭습니다."},{"heading_en":"What I'm Reading","body":"We must not let AI 'pull the doctor out of the visit' for low-income patients, Leah Goodridge와 Oni Blackstock\nAI가 1차 진료에 미칠 위험, 그리고 계층 격차를 키울 위험에 대한 흥미로운 오피니언입니다. 아래에 링크한 Town Hall과의 대화에서 Andy Slavitt이 이 점을 짚으며 이 주장의 반대편에 섰습니다. 한 가지 확신하는 것이 있다면, AI가 필연적으로 더 큰 역할을 하게 되면서 앞으로 몇 년간 이런 논쟁을 아주 많이 하게 되리라는 점입니다."},{"heading_en":"HTN Radio","body":"뉴스레터와 Slack 단상을 통해 매주 수천 단어씩 헬스케어 산업 트렌드에 대해 쓰는 것에 더해, 저희는 이런 주제들을 두고 더 정기적으로 라이브로 이야기 나누는 재미도 크게 붙였습니다. 지난주에 나눈 최신 대화들은 다음과 같습니다.\n\nThe Grand Round-Up: 01/27/26"},{"heading_en":"HTN Radio","body":"Town Hall Ventures의 Andie Steinberg, Andy Slavitt과 2026년 정책 환경에 대해 나눈 대화. 저희는 2027 Advance Notice 직후인 화요일에 녹음했기 때문에, 그 소식이 앞으로의 MA 시장에 대한 두 사람의 관점을 어떻게 바꿨는지 들을 수 있었습니다."},{"heading_en":"HTN Radio","body":"Martin은 이번 주에 Pair Team 팀과 두 차례 이야기를 나눴습니다. 먼저 전반적인 모델에 대해, 그다음에는 Pair Team의 소식에 대해"}]},"12":{"index":"12","title_en":"Weekly Health Tech Reads 2/8/25","subtitle":"AI 프라이머리 케어 모델에 대한 단상, Devoted의 조용한 펀딩 라운드, Hims의 기묘했던 한 주, 그리고 그 밖의 많은 소식","sections":[{"heading_en":"Sponsored by: Candor Health","body":"Sana Benefits가 케어 내비게이션을 확장하는 과정에서, 파편화된 프로바이더 데이터가 리퍼럴을 지연시키고 성장을 제약했습니다. Candor와 파트너십을 맺어 프로바이더 데이터 정확도를 개선한 결과 Sana는 다음을 얻었습니다.\n\n- 인력을 늘리지 않고도 케어 내비게이션 처리량 50% 이상 증가\n- 리퍼럴 처리 시간 50% 단축\n- 계약된 프로바이더로의 추천 3배 증가\n- 13개 프로바이더 데이터 소스를 대체한 하나의 AI 네이티브 플랫폼\n\n“Candor는 이제 우리의 단일 진실 공급원입니다.” Sana의 메디컬 디렉터 Dr. Scanlon의 말입니다. “우리 팀이 의지하는 단 하나의 플랫폼입니다.” 탄탄한 프로바이더 데이터 기반을 갖춘 Sana는 더 진보되고 자동화된 케어 내비게이션을 구축하는 데 자신감을 갖고 있습니다.\n\nSana가 Candor와 함께한 여정에 대해 더 읽어보기\n\n뉴스레터 스폰서십에 관심이 있으시면 알려주세요!"},{"heading_en":"MY MUSING: AI and the nuances of reinventing primary care","body":"제가 기억하는 한, 헬스케어 산업은 이 나라 헬스케어의 관문을 재발명하는 일에 대해 늘 이야기해 왔습니다. 창업자들은 자신들의 새로운 접근이 사람들이 저렴한 비용으로 양질의 케어에 접근하는 방식을 재구성해 줄 것이고, 헬스케어의 철의 삼각형이라는 수수께끼를 마침내 풀어낼 것이라고 숨 가쁘게 이야기합니다. 기존 사업자들은 자기 비즈니스 모델이 파괴될 가능성을 걱정하며 컨설턴트 군단을 불러들여 이사회에 안전한 길을 제시합니다. 지금까지 이런 파괴적 위협들은 둘 중 하나로 끝나는 듯합니다. 불타 사라지거나, 아니면 기존 사업자를 돕는 쪽으로 방향을 트는 것입니다. 알고 보면 철의 삼각형은 성가신 개념이고, VC 자금으로 손실을 더 이상 메울 수 없게 되는 순간 어느 레버를 포기할지 어려운 결정을 내려야만 합니다. 우리는 이 회전목마를 돌고 또 돕니다.\n\n이 이야기의 이전 버전이 이번 주에 결말을 맞았습니다. Carbon Health가 주 초에 Chapter 11 파산을 신청했습니다. 2021년 Carbon 내러티브가 정점에 있을 때, 이 회사는 2025년까지 클리닉 1,500곳을 여는 비전을 이야기했고 그 길 위에서 “세계에서 가장 위대한 현대 헬스케어 기업”이 되겠다고 했습니다. 돌이켜 보면 현실은, Carbon이 COVID 직후 프리미엄 밸류에이션에 어전트 케어 클리닉을 사들이면서 수익성 없는 사업에 가속 페달을 밟은 채 절벽으로 곧장 달려갔다는 것이 분명해 보입니다. 헬스케어에 대한 새로운 접근을 다시 세우는 일의 아이러니 중 하나는, 파산 신청 시점에 Carbon의 최대 지분 보유자 두 곳이 VC 펀드 DCVC(약 13.6%)와 모두가 사랑하는 파괴적 헬스케어 주체 CVS(12%)로 보인다는 점입니다. 물론 CVS는 2023년 1월 Carbon의 1억 달러 시리즈 D 라운드를 주도했고, 당시 Carbon의 기업가치는 약 13억 달러로 알려졌는데 이는 2021년 정점의 33억 달러에서 내려온 수치였습니다. 때로는 기존 사업자를 돕고자 해도 여전히 불타 사라집니다.\n\n비저너리 창업자들의 이런 시도는 늘 업계에서 과도한 관심을 끄는 것 같고, 왜 그런지 이해하기는 어렵지 않습니다. 여기서 다루는 문제는 매우 현실적이고, 그것을 푸는 일의 매력은 엄청납니다. KFF는 이번 주에 이 역학을 다시 한번 일깨워 주었습니다. 주치의(PCP)가 세상을 떠나면서 혈압약 때문에 새 PCP가 필요해진 보스턴의 한 여성 이야기를 조명한 것입니다. 열 곳의 진료소에 전화를 걸었지만 가장 빠른 예약이 1.5년에서 2년 뒤였습니다. 보스턴에 프라이머리 케어 의사가 충분하지 않기 때문입니다. 저는 그 문장이 어떻게 참일 수 있는지 이해할 수 없지만, 분명 사실인 모양입니다.\n\n**AI enters the chat: the next disruptive threat (AI가 대화에 들어오다: 다음 파괴적 위협)**\n\n2026년은 이 문제를 풀 다음 유력한 파괴적 위협을 내놓을 운명인 것 같습니다. AI 기반 프라이머리 케어 모델이 힘을 얻고 있고, 투자자들은 이 시장에 거대한 베팅을 하기 시작했습니다. 올해 우리는 이 회사들 이야기를 아주 많이 하게 될 것 같습니다.\n\n이번 주 가장 최근 소식은 Lotus Health AI가 Kleiner Perkins와 CRV로부터 3,600만 달러를 조달해 AI 중심 프라이머리 케어 프로바이더를 출범한다는 것이었습니다. 내러티브는 확실히 매력적입니다. AI를 써서 PCP가 할 수 있는 일을 10배로 늘리고, 모두에게 프라이머리 케어 무료 접근을 열어주겠다는 것입니다. 다시 한번 우리는 철의 삼각형이 던지는 그 성가신 오랜 문제에 매력적인 해법이 등장하는 장면을 봅니다. 모두에게 무료로 제공되는 고품질 케어라니, 저를 등록시켜 주세요!\n\n저는 수요일 밤 Lotus에 가입하며 이 현실을 엿볼 생각에 들떴지만, 대기자 명단에 오르는 것으로 끝났습니다. 왜일까요? 앱에 따르면 Lotus의 AI 뒤에 있는 이름 없는 인간 PCP들이 정원이 다 차서 신규 환자를 받지 않는다는 것이었습니다. 헬스케어 접근을 재구성하고 있다는 홍보 영상을 내놓으면서 정작 업계가 겪어 온 바로 그 문제를 똑같이 겪고 있는 회사에는 어떤 아이러니가 있습니다(일요일인 지금도 저는 여전히 대기자 명단에 있습니다). 늘 그렇듯, 이런 내러티브는 디테일에 악마가 숨어 있습니다.\n\n**A path forward for AI-augmented care (AI로 증강된 케어를 향한 길)**\n\n신생 모델들이 부딪힐 수 있다고 우리 모두가 예상해야 할 문제들이 있고 그런 문제가 많음에도 불구하고, 저는 그것이 프라이머리 케어에 AI를 쓰는 일을 피할 이유라고 생각하지 않습니다. 이번 주 우리는 Andy Slavitt과 Toyin Ajayi의 게스트 포스트를 공유했는데, 특히 저소득층과 관련해 바로 그 지점을 짚고 있습니다. 제대로만 한다면 선을 이룰 잠재력은 엄청납니다. 물론 AI를 배포하는 데는 위험과 도전이 따를 것입니다. 우리 모두는 앞으로 몇 년 동안 그 도전들과 씨름하게 될 것입니다. Slavitt과 Ajayi는 여기서 합리적인 길을 제시하며 “가장 강력한 결과는 임상의를 대체하는 AI가 아니라 AI로 증강된 케어에서 나온다”고 지적합니다.\n\n잠시 보스턴으로 돌아가 보죠. 이 도시의 기관들은 AI 증강 케어라는 개념을 도입하는 울퉁불퉁한 길 위에 있는 것으로 보입니다. Mass General Brigham이 좋은 예입니다. 프라이머리 케어 프로바이더들이 근무 조건에 불만을 품고 노조 결성을 추진해 왔습니다. 2025년 초 MGB는 향후 5년간 프라이머리 케어 인력을 지원하기 위해 4억 달러를 투자하겠다고 약속했습니다. 또한 K Health와의 파트너십을 통해 AI 가상 진료 서비스를 내놓았는데, 이것이 적어도 일부 MGB PCP들을 더욱 화나게 만든 것으로 보입니다. 이들은 스타트업에 돈을 줄 바에는 MGB의 PCP들에게 보수를 더 주고 더 많이 채용할 수도 있지 않느냐고 말합니다. 제가 헬스 시스템에 있던 시절, One Medical이나 Oak Street 같은 조직이 헬스케어의 관문 문제에 대한 잠재적 해법으로 여겨졌을 때 익히 들었던 후렴구입니다.\n\n그 MGB 사례가 이 문제의 핵심을 짚는 것 같습니다. MGB 경영진이 접근성을 높이려고 AI 솔루션을 도입하려는 이유를 상상하기는 어렵지 않지만, 다시 말하지만 여기서도 디테일이 중요합니다. MGB의 PCP를 찾아가 AI가 당신의 패널 사이즈를 2,000명에서 20,000명 수준으로 10배 늘려줄 것이라고 신나게 말하는 장면을 상상해 보세요. 그런데 그들은 이미 과로하고 제대로 인정받지 못한다고 느껴 노조를 만들려 하고 있습니다. 아마 당신을 머리가 여덟 개 달린 사람 보듯 쳐다볼 겁니다.\n\n이 AI 중심 모델들이 앞으로 몇 년간 풀어야 할 핵심 이슈는 반드시 기술적인 것이 아니라 오히려 조직 설계입니다. 업계의 로스 리더로서 과중한 부담과 낮은 보수를 느끼는 프라이머리 케어 인력의 역량을 10배로 만들려면, 기술을 만드는 일보다 신뢰를 만드는 일이 더 필요할 것입니다.\n\n**A learning lesson from Intuitive Surgical's success (Intuitive Surgical의 성공에서 얻는 교훈)**\n\n요즘 저는 Intuitive Surgical의 창업 여정에 대해 많이 이야기하게 됩니다. 선도적인 수술 로봇 플랫폼인 이 회사는 프로바이더가 더 나은 케어를 제공하고, 더 많은 환자를 보고, 그 결과 재무적으로도 더 나아지게 해 주는 도구로 스스로를 포지셔닝하며 놀라운 성공을 거뒀습니다. 그 가치 제안 덕분에 2000년 상장 이후 Intuitive의 주가는 약 24,000% 상승했습니다. Intuitive는 오늘날 1,800억 달러의 가치를 지닙니다. 저는 2026년 이 AI 증강 케어 경쟁에서 승리하는 회사들이 Intuitive Surgical과 매우 비슷한 내러티브를 발전시킬 것이라고 봅니다. 임상의를 대체하는 것이 아니라 증강한다는 점을 강조하는 내러티브 말입니다. 이를 성공적으로 해내는 조직들은 제 눈에는 미래의 케어 딜리버리 조직처럼 보입니다. 임상의들이 그곳에서 일하고 싶어 하고, 그들과 함께하고 싶어 할 곳 말입니다.\n\n그리고 네, 여기 곳곳에 흩어놓은 철의 삼각형 언급을 따라오셨다면, 그것은 AI 기반 프라이머리 케어의 승자들이 접근성과 품질에서 이길 것이라는 뜻입니다. 그것은 또한 기본적으로 그들이 비용을 증가시킬 것이라는 뜻이기도 합니다. 모두를 위한 무료 고품질 프라이머리 케어라는, VC가 보조금을 대 준 열띤 꿈에도 불구하고 말이죠."},{"heading_en":"MEDICARE ADVANTAGE: Devoted Health very quietly announces a very large funding round","body":"완전히 레이더 아래로 지나간 것으로 보이는 소식인데, Devoted Health가 3억 6,600만 달러의 신규 지분 투자를 유치했고 2026년 1월 기준 Medicare Advantage 가입자를 466,000명 이상으로 늘렸다고 발표했습니다. 전년 대비 121% 성장입니다. 월요일에 Bill Frist가 이 가입자 성장에 대해 LinkedIn에 올린 글이 아니었다면, 저는 이 소식을 어디에서도 알아차리지 못했을 것 같습니다.\n\n이 발표가 그렇게 조용히 나간 것은 다소 이상하고, Medicare Advantage 시장의 불확실성을 보여주는 듯합니다. Venrock 팀은 12월 예측에서 Humana가 신규 MA 가입자의 무게에 눌려 2026년에 무너질 것이라고 전망하며 이렇게 말했습니다. “MA 성장의 문제는 조심하지 않으면 신규 가입자에게서 큰돈을 잃을 수 있다는 점이다.” 참고로 Venrock의 파트너들은 2017년 Devoted의 시드 라운드를 주도한 뒤 2018년부터 Devoted 창업팀의 일원이었습니다.\n\nMedicare Advantage 업계 베테랑들 중에 신규 MA 가입자 유입을 관리하는 일의 수익성 문제에 대한 Venrock의 평가에 반대할 사람은 많지 않을 것 같습니다. 지난 몇 년간 대형 MA 플랜들이 겪은 막대한 어려움이 가장 최근의 증거입니다. 여기에 플랜과 프로바이더 모두에게 v28이 제기하는 수익성 문제, 그리고 Devoted가 자체 인하우스 메디컬 그룹을 구축해 왔다는 사실을 더하면 재무적 재앙의 레시피처럼 보입니다.\n\n그러니 말할 것도 없이, 특히 지금의 Medicare Advantage 환경에서 Devoted가 이렇게 빠르게 성장하는 모습을 보는 것은 흥미롭습니다. 짐작건대 Devoted는 자신들이 올바른 방식으로 성장하고 있고 이 가입자 유입을 감당해 낼 수 있다고 느끼는 듯하며, Devoted의 기술 플랫폼이 그 핵심 역할을 하리라 생각됩니다.\n\nHumana 경영진도 같은 생각인 것으로 보인다는 점 역시 짚어 둘 만합니다. 이제 문제는 둘 중 누가 옳은가인데, 둘 다 2026년에 대규모 성장을 앞두고 있는 것으로 보입니다."},{"heading_en":"Public Markets Earnings Updates","body":"Molina 주가는 이번 주 실적 발표에서 28% 하락했습니다. 또다시 실적이 기대에 못 미쳤기 때문입니다. 2025년을 연간 조정 EPS 25.50달러 가이던스로 시작했지만 실제로는 11.03달러로 마감했습니다. 4분기 미스는 캘리포니아의 소급 조정과 계속되는 의료비 압박에서 비롯됐습니다. 긍정적인 면으로는 플로리다 RFP 수주를 강조했는데, 여기서 Children’s Medical Services의 단독 파트너가 되며 연간 60억 달러의 보험료 규모가 예상됩니다. RFP와 M&A 파이프라인은, 시장이 언젠가 안정된다고 가정하면, Molina에 거대한 성장 기회를 제공합니다. Molina는 2026년이 Medicaid 마진의 저점이 될 것이며 그런 환경에서도 여전히 낮은 한 자릿수 마진을 낼 것으로 봅니다. Molina는 현재 3~4% 과소 재정 지원되고 있는 시장에 대해 주들이 요율을 조정하면서 더 밝은 해가 올 것으로 전망합니다. Q&A에 참여한 애널리스트들은 주들이 프로그램을 조정하는 가운데 시장이 가까운 시일 내에 개선될 것이라는 데 그만큼 자신감을 보이지는 않았습니다."},{"heading_en":"Public Markets Earnings Updates","body":"Centene 주가는 금요일 실적 발표에서 10% 하락했습니다. ACA, Medicare Advantage, Medicaid 사업 전반에서 마진 회복을 추진하는 가운데였습니다. Centene은 다시 한번 행동건강(behavioral health) 트렌드를 핵심 비용 동인으로 지목하면서도, 여러 주에 걸쳐 ABA 치료 비용을 잡기 위한 조치를 취해 왔다고 밝혔습니다. Centene은 2025년 ACA 사업에서 No Surprises Act 관련 비용에 대해 충당금을 쌓아야 했고, 이로 인해 연간 의료비가 1% 올랐다고 언급했습니다. 프로바이더들이 NSA 독립 분쟁 해결 절차를 통해 이익을 뽑아내고 있어, 이번 주 뉴욕의 한 프로바이더를 상대로 소송을 제기했다고 밝혔습니다. Centene은 1분기 말 ACA 가입자를 350만 명으로 예상하는데, 12월의 500만 명에서 줄어든 수치로 향후 몇 달간 ACA 시장이 축소될 것이라는 또 하나의 신호입니다. Centene은 Duals 인구를 위한 새로운 운영 모델을 출범했다고 밝혔으며, 이는 현재 MA 사업의 약 40%를 차지합니다."},{"heading_en":"Public Markets Earnings Updates","body":"Cigna는 목요일 4분기 실적을 발표한 뒤 이번 주를 7% 상승으로 마감했습니다. PBM 입법을 둘러싼 불확실성을 넘어서고, 특히 스페셜티 파머시 시장에서 성장을 견인하면서 어려운 보험 시장에서 방향을 돌리고 있습니다. Cigna는 준비된 발언 전반에서 여러 파트너십을 강조했습니다. TrumpRx와의 협업부터 Shields에 대한 투자, Cigna Healthcare 안에서 Progyny, Carrot, Headspace와 진행하는 협력까지 말입니다. 보험 사업에서는 Clarity라는 새로운 코페이 전용 상품 출시를 강조했는데, 고객사에 최대 10%의 절감 효과를 보이고 있다고 합니다. 2026년 대안적 플랜 설계 상품에 대한 관심을 보여주는 또 하나의 신호입니다. Cigna의 스페셜티 케어 상품은 이제 사업의 35%를 차지하는데, 불과 3년 전 25%에서 올라온 수치로 전반적인 시장 흐름과 Cigna가 그 사업에 의도적으로 우선순위를 둔 것이 함께 작용했습니다. 앞으로 바이오시밀러와 스페셜티 제네릭으로의 전환에서 상당한 기회를 보고 있습니다. FTC 합의와 PBM 입법 소식은 다소 뉴스가 아닌 것처럼 보였는데, Cigna가 사업의 마진 프로필이 달라질 것으로 예상하지 않기 때문입니다."},{"heading_en":"Public Markets Earnings Updates","body":"PACE 프로바이더 Innovage는 이번 주 주가가 50% 급등했습니다. 실적 기대치를 넘어서고 회계연도 전체 EBITDA 가이던스를 상향했기 때문입니다. 해당 분기 조정 EBITDA 마진 9.2%를 기록했는데, 캐피테이션 방식 케어 딜리버리 모델의 세계에서는 인상적인 성과입니다. 2026년 PACE를 지켜보는 일은 흥미로울 것입니다. 여러 면에서 Innovage의 최근 성공은 지난 몇 년간의 어려운 운영 이슈를 딛고 나온 VBC 성과의 모범 사례처럼 보입니다. PACE는 다른 VBC 시장이 겪는 어려움 중 일부로부터 비교적 자유로웠던 것으로 보이며, MA와 Medicaid의 변화가 이 프로그램에 스며들면서 역풍이 나타날지 지켜보는 것도 흥미로울 것입니다. 이번 주 커뮤니티에서 지금이 PACE의 고점이 아닐지 논의한 것이 특히 흥미로웠습니다."},{"heading_en":"Public Markets Earnings Updates","body":"Doximity 주가는 금요일 아침 실적 발표 후 25% 하락했습니다. 해당 분기 매출과 조정 EBITDA 모두 가이던스 상단을 넘겼는데도 말이죠. 매출 1억 8,500만 달러, 조정 EBITDA 1억 1,100만 달러로 인상적인 60% 마진을 기록했습니다. 지금 OpenEvidence가 가진 모멘텀이 Doximity의 실적 위에 크게 드리워져 있고, Doximity는 자사의 AI 성장 내러티브를 강조했습니다. 어느 대목에서 Doximity CEO Jeff Tangney는 준비된 발언 중에 “분명히 해두자면, 어떤 AI도 실수를 없애지 못했고 초지능에 가까운 무언가를 달성하지도 못했다”고 언급했습니다. 거의 확실하게 이것은 최근 의료 초지능 구축을 이야기해 온 OpenEvidence를 겨냥해 얇게 가린 한 방이었습니다. 이번 분기(회계연도 2026년 3분기)의 초과 달성에도 불구하고 Doximity는 FY 2026 가이던스를 상향하지 않고 있습니다. 4분기 매출이 낮아지고 AI 투자가 늘어날 것으로 예상하기 때문입니다. 4분기 매출이 낮아지는 이유는 정책 역풍에 대한 시장의 불확실성과 계약 사이클 타이밍 조정 때문이라고 합니다. Doximity는 2026년에 AI 상품을 상업화할 계획이며, 분기 활성 의사 30만 명과 이를 사용하는 병원 100곳이라는 인상적인 성과를 근거로 들었습니다. OpenEvidence가 아무리 다르게 바라더라도, Doximity가 조만간 어디로 사라질 것 같지는 않습니다. 특히 흥미로웠던 대목은 한 애널리스트가 탄탄한 재무 상태와 현재 공개시장이 매기고 있는 밸류에이션을 감안할 때 Doximity가 상장사일 필요가 있느냐고 물었고, Tangney가 투자자들도 Doximity에 같은 질문을 하고 있다고 답한 부분이었습니다."},{"heading_en":"Chart of the Week: The Haves and Have-nots of Hospital Margins","body":"후지어 스테이트(인디애나)에서 지금 병원을 둘러싼 흥미로운 대화가 벌어지고 있습니다. Kaufmann Hall은 병원 재정의 곤경을 조명하는 프레젠테이션을 공유하며 2025년 마진이 전국 평균을 밑돌았다고 지적했습니다.\n\n그런 만큼 Employer’s Forum of Indiana의 반응을 보는 것도 흥미로웠는데, 인디애나 병원의 거의 20%가 2024년에 20%가 넘는 순이익률을 기록했다는 데이터를 공유했습니다. 아래 차트는 전체 병원의 수익성을 보여줍니다.\n\n출처: Employer’s Forum of Indiana\n\nFort Wayne의 Parkview Orthopedic Hospital이 인디애나에서 선두인데, 2024년 매출 1억 8,600만 달러, 운영비용 1억 1,700만 달러를 보고했습니다. 이는 2024년 영업이익 6,900만 달러, 즉 37%의 영업이익률에 해당합니다.\n\n인디애나주 Fort Wayne의 비영리 병원이 어떻게 최고 수준 SaaS 마진에 맞먹는 영업이익률을 내고 있는지 고개를 갸웃하고 계신다면, 저와 함께하시죠."},{"heading_en":"Other Top Headlines","body":"CommonSpirit은 이번 주 Conifer Health Solutions와의 관계를 정리하고 RCM 기능을 내재화하며 RCM 업계에 파장을 일으켰습니다. Conifer의 과반 지분을 보유한 Tenet은 이번 거래의 일부로 CommonSpirit이 보유한 Conifer 지분 23.8%를 사들이기 위해 CommonSpirit에 5억 4,000만 달러를 지급합니다. CommonSpirit은 Conifer Health Solutions와의 계약에서 빠져나오기 위해 19억 달러를 지불합니다. 지금 RCM 시장의 활동량을 감안하면, CommonSpirit이 RCM을 사내로 되가져오기 위해 높은 가격표를 지불하기로 선택한 것은 흥미롭습니다. Conifer와 Ensemble 등은 RCM의 엔드투엔드 파트너가 주는 이점을 내세우고 있지만, 더 많은 시스템이 이 방향으로 갈지 궁금해집니다. 시스템들이 내부 팀에 빌드/바이/파트너 결정을 맡기고 최고 수준의 파트너를 데려오려 한다면, 일부 “포인트 솔루션”에는 오히려 순증 효과가 될 것 같기도 합니다."},{"heading_en":"Other Top Headlines","body":"Hims는 이번 주 믿기 어려울 만큼 기묘한 한 주를 보냈고, 최근 기억나는 어떤 회사보다도 “저게 합법인가?”라는 생각에 고개를 갸웃하게 만들었습니다. 물론 큰 뉴스는 Hims가 목요일 아침 복합조제 GLP-1 알약을 월 49달러라는 저렴한 가격에 출시했다는 것이었습니다. Novo Nordisk의 실적 발표와 겹친 이 소식은 Eli Lilly와 Novo Nordisk 주가를 모두 끌어내렸고, Hims 주가는 9% 뛰었습니다. 그 상승은 오래가지 않았습니다. 시장이 더 알아가면서 이 조치의 합법성과 제품이 실제로 효과가 있을지를 모두 의심하기 시작했기 때문입니다. 이 발표는 FDA와 HHS 양쪽의 신속한 반응을 불러왔습니다. Hims는 결국 금요일 늦게 제품을 시장에서 내렸지만, 그 전에 이미 조사를 위해 DOJ에 회부됐습니다. 결국 Hims 주가는 제가 일요일 아침 이 글을 쓰는 시점 기준으로 이번 주 30% 하락한 채 거래되고 있습니다. 이 회사가 여기서 어디로 갈지 지켜보는 일은 흥미로울 것입니다. 이번 주는 그들 쪽의 중대한 전술적 실수처럼 느껴졌습니다."},{"heading_en":"Other Top Headlines","body":"HCA가 텍사스에서 어전트 케어 센터 13곳과 독립형 응급실 6곳을 인수합니다. HCA는 이제 텍사스에서 95곳, 전국적으로 400곳 이상의 어전트 케어 사이트를 운영합니다."},{"heading_en":"Other Top Headlines","body":"Trump 대통령이 이번 주 새 예산 패키지에 서명했습니다. 여기에는 원격의료 예산과 hospital-at-home 웨이버 연장, 그리고 PBM에 대한 투명성 요구사항이 포함됩니다."},{"heading_en":"Other Top Headlines","body":"Cigna의 Express Scripts가 이번 주 미국 내 인슐린 가격에 관한 사건에서 FTC와 합의에 도달했습니다. 합의의 일환으로 Express Scripts는 투명성 강화와 GPO 운영을 스위스에서 미국으로 되가져오는 것을 포함해 일부 변화를 시행하기로 했습니다. 획기적인 합의로 평가받고 있지만, 애널리스트들은 현시점에서 Cigna 모델에 미치는 영향에 대해 크게 우려하지 않는 것으로 보였습니다."},{"heading_en":"Other Top Headlines","body":"TrumpRx가 이번 주 공식 출범했습니다. Casey Langwith가 이번 주 LinkedIn에서 이 서비스의 소비자 경험과 운영 메커니즘 양쪽을 살펴본 좋은 관점을 공유했습니다."},{"heading_en":"Other Top Headlines","body":"Fair Square Medicare가 Alliant Insurance Services 소속 브로커리지인 Senior Market Sales에 인수됐습니다."},{"heading_en":"Funding Announcements","body":"Devoted Health가 3억 6,600만 달러의 신규 펀딩을 조용히 발표했고, 아울러 Medicare Advantage 가입자가 전년 대비 121% 성장해 466,000명이 됐다고 밝혔습니다. 라운드는 The Space Between과 Centricus가 주도했습니다. GV, VZVC, Morgan Health가 신규 투자자로 참여했습니다. 위 논의를 참고하세요."},{"heading_en":"Funding Announcements","body":"숙련 홈헬스, 호스피스 및 관련 서비스를 제공하는 Elara Caring이 DaVita와 Ares로부터 전략적 투자를 유치했다고 발표했습니다. DaVita는 이번 주 실적 발표에서 소수 지분에 2억 달러를 투자했다고 밝혔는데, 신장 케어를 위한 홈헬스 시장의 기회에 대한 흥미로운 신호로 보입니다. Elara는 지난 몇 년간 부채 부담 문제를 겪었고 2022년 12월 부실 구조조정을 거쳤습니다."},{"heading_en":"Funding Announcements","body":"폐경기 케어로 가장 잘 알려진 여성 건강 기업 Midi가 10억 달러 이상의 밸류에이션에 1억 달러를 조달했습니다. Goodwater Capital이 라운드를 주도했습니다. Midi에게는 인상적인 이정표인데, 발표에서 4,500만 명 이상의 여성이 보험을 통해 Midi를 이용할 수 있고 주당 25,000명의 환자를 보고 있다고 밝혔습니다."},{"heading_en":"Funding Announcements","body":"심장내과 의사를 위한 VBC 플랫폼 Chamber Cardio가 6,000만 달러를 조달했습니다. Frist Cressey가 라운드를 주도했고 General Catalyst, AlleyCorp 등이 참여했습니다. Fierce Healthcare는 Chamber가 500명 이상의 심장내과 의사 네트워크를 지원한다고 전합니다. 지금 CMS가 이런 모델에 관심을 보이고 있는 만큼, 스페셜티 VBC 시장의 모멘텀을 지켜볼 만합니다."},{"heading_en":"Funding Announcements","body":"건강보험 청구 처리를 위한 AI 플랫폼 Alaffia Health가 5,500만 달러를 조달했습니다. Transformation Capital이 라운드를 주도했습니다. Alaffia는 고비용 시설 청구에서 평균 20% 이상의 절감과 건강보험사에 5배 이상의 ROI를 내고 있다고 보고합니다."},{"heading_en":"Funding Announcements","body":"AI 프라이머리 케어 프로바이더 Lotus Health AI가 3,600만 달러를 조달했습니다. Kleiner Perkins와 CRV가 라운드를 주도했습니다."},{"heading_en":"Funding Announcements","body":"AI 행정 플랫폼 Synthpop이 1,500만 달러를 조달했습니다. Ansa Capital이 라운드를 주도했습니다."},{"heading_en":"Funding Announcements","body":"호흡기 건강을 위한 웰니스 모델 Climatic이 1,000만 달러를 조달했습니다. Lerer Hippeau가 라운드를 주도했습니다."},{"heading_en":"Funding Announcements","body":"Medicaid 갱신 및 재판정을 지원하는 플랫폼 Graici가 750만 달러를 조달했습니다. Santé Ventures가 라운드를 주도했습니다."},{"heading_en":"What I'm Reading: We helped create Medicare Advantage. Here's how to fix it","body":"Donna Shalala, Tommy Thompson\n\n25년 전 오늘의 MA가 된 제도를 설계한 두 사람이, 잘못된 정책이 이 프로그램을 위험에 빠뜨리고 있다고 주장합니다. 지난 몇 년간 MA를 두들기는 정치적 논의가 많았던 것을 감안하면, 마침내 이 프로그램의 장점을 옹호하는 사람들이 나오기 시작한 것은 주목할 만해 보입니다."},{"heading_en":"What I'm Reading: AI in Healthcare Could Be More of the Same — Or It Could Finally Fix What Really Matters","body":"Andy Slavitt, Toyin Ajayi\n\nAndy와 Toyin이 저소득층에 AI를 사려 깊게 배포할 것을 주장하는 게스트 포스트를 HTN에 공유했습니다."},{"heading_en":"What I'm Reading: High-Deductible Health Plans and Mortality Among Cancer Survivors","body":"Justin Barnes, Arjun Gupta, Meera Ragavan\n\n이 JAMA Network Open 연구는 고액공제 건강보험(HDHP)에 가입한 것이 암 환자의 더 나쁜 생존 결과와 상관관계가 있음을 시사하며, 그 원인이 HDHP에 따르는 재정적 장벽 때문에 사람들이 필요한 의료를 포기하게 되는 데 있을 수 있다고 제시합니다."},{"heading_en":"What I'm Reading: The Scribe That Launched a Thousand Takes","body":"Brendan Keeler\n\nBrendan이 이번 주 있었던 Epic의 큰 기대를 모은 AI 스크라이브 제품 출시와, 업계에서 진행 중인 AI 중심 변화의 더 넓은 함의를 파고듭니다."},{"heading_en":"What I'm Reading: What a time to be an oncologist","body":"Olivia Webb Kosloff\n\nOlivia가 프로바이더의 관심을 수익화하려는 접근이 갖는 함의에 대해, 특히 이 경우에는 종양내과 의사를 향한 업계의 관심에 초점을 맞춰 좋은 관점을 공유했습니다. 이 글이 제기하는 질문들에 시간을 좀 들여 볼 만하다고 생각하는데, 특히 왜 의약품 도매업체들이 최근 스페셜티 프로바이더 인수에 그토록 관심을 보이는지 생각해 보게 됩니다."},{"heading_en":"HTN Radio","body":"Martin과 제가 헬스케어 주제를 두고 서로, 그리고 업계 리더들과 나누는 이야기를 YouTube 대신 팟캐스트 형태로 듣고 싶다는 의견을 여러분 중 여러 분께 들었습니다. 그렇다면 오늘이 운수 좋은 날입니다. 이제 즐겨 쓰시는 팟캐스트 플랫폼에서 Health Tech Nerds Radio를 확인하실 수 있습니다. 최근 에피소드 몇 편의 Spotify 링크입니다.\n\n- The Grand Roundup: February 2nd 2026\n- Building and scaling an in-home care model for Medicaid populations with Dr. Rebekah Gee and Rebecca Kavoussi (Nest Health)\n- What it takes to deliver rural primary care with Dr. Aditi Malik and Tim Gronninger (Hopscotch)\n\n여전히 YouTube에서 보는 것이 더 좋으시다면, 최신 Grand Roundup을 여기서 확인하세요."}]},"14":{"index":"14","title_en":"Weekly Health Tech Reads 2/15/25","subtitle":"헬스케어 일자리 증가에 대한 단상, 다수의 실적 발표(CVS, Humana, Oscar, Tenet, Hinge), ACCESS 요율의 게임 이론, 그리고 그 밖의 소식","sections":[{"heading_en":"Introducing Health Tech Nerds Radio!","body":"Health Tech Nerds Radio를 소개합니다!\n\n지난 몇 달 동안 저희는 헬스케어 뉴스를 풀어내는 라이브 대화를 훨씬 더 많이 나누게 됐습니다. 저희끼리도 그랬고, 다른 헬스케어 리더들과도 그랬습니다. 여러분이 이동 중에 그런 대화를 듣는 걸 그렇게들 좋아하시는 것 같아, 저희도 큰맘 먹고 그 대화들을 \"팟캐스트\" 채널인 HTN Radio로 옮겼습니다.\n\n아직 포맷을 이리저리 만지는 중이지만, 월요일 오후에는 뉴스에 대한 주간 토론을, 그리고 흥미로운 기업 리더들과의 인터뷰를, 또 Humana의 4분기 실적 발표 콜에 대한 논의처럼 속보에 대한 실시간 반응을 공유해 왔습니다.\n\n그러니 팟캐스트를 즐겨 들으신다면, 좋아하시는 팟캐스트 플랫폼에서 저희를 찾아보세요. 아래는 최근 에피소드 몇 개입니다(Spotify 링크).\n\n- Humana's Q4 Earnings Call Recap: Membership Growth and Strategy Insights. 여기서 들으세요.\n\n- The Grand Roundup: February 9th, 2026. 여기서 들으세요. Carbon Health의 파산, AI와 프라이머리 케어, 펀딩 트렌드, 페이어 실적(Molina, Centene, DaVita), 그리고 PACE와 수직 통합 모델의 전망.\n\n- What it takes to deliver rural primary care | Dr. Aditi Malik and Tim Gronniger (Hopscotch). 여기서 들으세요.\n\n그리고 혹시 궁금해하실까 봐 말씀드리면, 네, 저희는 건설적인 피드백을 언제나 환영합니다. 그런 의미에서, 제가 마이크에서 몸을 뒤로 젖히는 버릇을 그만둬야 한다는 점은 저도 알고 있습니다 :)"},{"heading_en":"MUSING: The incongruity of the Healthcare Jobs Report","body":"노동부는 1월 비농업 부문 고용이 13만 명 늘었다는 데이터를 발표했고, 이는 경제학자들의 예상을 웃도는 수치였습니다. 헬스케어가 그 증가를 이끈 주된 동력으로, 1월에만 8만 2,000개의 일자리를 더했습니다. 이는 외래 헬스케어 서비스 5만 개, 병원 1만 8,000개, 너싱 및 거주형 케어 1만 3,000개로 나뉩니다. 이 숫자는 헬스케어 일자리 증가가 월평균 3만 3,000개였던 2025년을 앞서는 수준입니다. WSJ가 더 넓은 경제와 비교해 이 증가세를 아래와 같이 잘 보여 주었습니다.\n\n출처: WSJ 기사\n\n헬스케어의 낭비를 없애 준다는 AI 솔루션에 대한 투자와 도입이 폭발적으로 늘어난 시기에 헬스케어 일자리가 늘었다는 사실을 저는 납득하기 어렵습니다. AI에 대한 투자가 정말로 헬스케어의 낭비를 줄이는 데 도움이 되고 있다면, 일자리는 줄어드는 모습이 보여야 하지 않을까 싶습니다. 그런데 오히려 나머지 경제는 무너져 가는 것처럼 보이는데도 헬스케어 일자리는 계속 꾸준히 늘고 있습니다 — 대체 어떻게 된 일일까요? 정기 독자라면 잘 아시겠지만, 저는 AI가 실제로는 헬스케어 비용을 줄이는 데 기여하는 게 아니라 오히려 그 반대라는 의심을 품고 있습니다. 고용 데이터도 그렇게 말하는 듯합니다.\n\n지금 이 나라의 헬스케어 비용을 둘러싼 거시 서사에서 이는 만만치 않은 긴장으로 보이고, 미국 경제를 떠받치는 데 일조하고 있는 것으로 보이는 일자리 프로그램으로서 헬스케어 지출이 하는 역할에 대해 더 깊은 대화를 불러온다고 저는 생각합니다."},{"heading_en":"Public Company Earnings Reports","body":"아래에서 CVS, Humana, Oscar, Tenet, Hinge의 실적 발표를 빠르게 훑어보겠습니다. 최근 늘 그렇듯, 페이어와 프로바이더 사이의 엇갈린 결과를 짚어 둘 필요가 있습니다. 페이어들에게는 주가가 크게 떨어지지 않는 것 자체가 승리처럼 느껴지는 반면, Tenet과 Hinge는 견조한 실적 발표 이후 둘 다 20%가 넘는 주가 상승을 봤습니다. 지금 시대를 잘 보여 주는 것 같습니다."},{"heading_en":"Public Company Earnings Reports","body":"CVS는 2024년에 빠졌던 구덩이에서 계속 기어 나오며 또 한 번 견조한 분기를 기록했습니다. Slack에서도 언급했듯이, 저는 지금 CVS의 전반적인 서사가 설득력 있다고 봅니다 — VBC 케어 딜리버리에 두던 강조점에서 사실상 벗어나, 보험 규율과 파머시 서비스 제공의 성장, 그리고 전체 오프라인 매장 기반을 중심으로 한 더 넓은 서사로 옮겨 갔습니다. 실적 발표 콜 자체는 전략적으로 대체로 특별할 게 없었습니다 — 보험 사업은 목표 마진으로 되돌아가는 중이고, CVS는 Caremark와 파머시 서비스의 밸류 프롭이 그 어느 때보다 중요하다고 보며, PBM 입법은 관리 가능한 수준으로 봅니다. CVS도 다른 보험사들과 마찬가지로 2027 Advance Notice가 업계의 의료비 추세와 맞지 않는다고 지적했지만, 동시에 그것이 사업의 장기 가이던스에 영향을 줄 것으로 보지는 않는다고 했습니다. Humana도 그 주 후반 실적 발표 콜에서 비슷한 언급을 했는데, 이는 CMS와 진행 중인 더 큰 협상에서 흥미로운 지점으로 보입니다. 제가 CMS 리더십이라면 그런 발언을 들으며 이런 생각을 할 것 같습니다. 2027 Advance Notice가 그렇게 치명적이라면, 왜 투자자들에게는 그 장기 영향에 대한 우려를 이렇게 적게 표현하는 걸까? 물론 페이어들이 사업의 마진을 지키기 위해 손에 쥔 여러 베네핏 레버를 당길 것이기 때문이라고 짐작합니다. 그 결과 2026년 중간선거를 앞둔 CMS에게는 흥미로운 정치적 게임 이론 연습거리가 됩니다."},{"heading_en":"Public Company Earnings Reports","body":"Humana는 2026년 첫 투자자 시험을 상당히 잘 관리해 냈고, 이번 주 주가는 몇 퍼센트 하락하는 데 그쳤습니다. CVS의 실적 콜을 대체로 무난했다고 표현했다면, Humana는 그 반대였고, Martin과 저는 수요일 오전을 그 내용을 라이브로 소화하는 데 썼습니다. Humana는 모두가 기다리던 엄청난 MA 성장 수치를 공유했습니다 — AEP 기간 동안 MA 가입자가 약 100만 명, 즉 20% 늘었습니다. 전체적으로는 2026년에 25% 성장할 것으로 봅니다. Humana는 실적 콜 내내 투자자들로부터 받는 질문에 답하면서, 새로 유입된 회원을 관리할 수 있다는 자신감을 계속 표현했습니다. 투자자에게 확신을 주기 위해 설계된 회원 유입 관련 데이터 포인트도 여럿 공유했습니다. 제게 가장 눈에 띈 것은 신규 회원의 70%가 4스타 이상 플랜에 있다는 점, 그리고 경쟁사가 철수한 플랜에서 나온 가입자 중 12%만 Humana로 왔다는 점이었습니다. Humana는 2026년 개인 MA 마진이 \"약간 마이너스\"일 것으로 예상하지만, 흥미롭게도 신규 회원의 Stars 성과 덕분에 신규 회원과 기존 회원의 마진이 같은 수준일 것으로 봅니다. 즉 Humana는 신규 회원의 70%가 4스타 이상 플랜에 있다는 점이 신규 회원의 더 높은 의료비를 상쇄하는 수익 상승 효과를 제공해, 의료비는 더 낮아야 하지만 4스타 이상 플랜 비중은 약 25%에 그치는 기존 유지 인구와 대략 비슷해질 것으로 기대한다는 뜻입니다. Humana의 전체 승부수는 확보하고 있는 MA 회원의 LTV를 끌어내는 데 거는 베팅으로 보이는데, 그 점에서 2027 Advance Notice는 또 하나의 거대한 장애물입니다. 여기서 전체 서사와 관련해 제게 가장 걸린 부분은 애널리스트 Q&A였습니다 — 2027 Advance Notice의 요율을 감안할 때 마진과 회원 수 중 무엇을 우선할 것이냐는 압박 질문에 대한 답은 \"둘 다\"의 변주였고, 이 흐릿한 답변은 2027년 계획 사이클에 들어가는 Humana의 계리사들이 해석하느라 꽤나 재미있을 겁니다. 다음 시험은 몇 달 뒤, Humana가 2026년이 어떻게 흘러가고 있는지, 그리고 2027년 전략을 조정할지 여부를 보고할 때 찾아옵니다."},{"heading_en":"Public Company Earnings Reports","body":"시장은 Oscar의 실적에 크게 반응하지 않았습니다. Oscar는 2026년 ACA 회원 수가 유의미하게 늘었다고 보고했습니다. Oscar는 2025년 4분기와 2026년 2분기 사이에 약 100만 명이 늘어나는 동시에 2026년에 흑자로 돌아설 것으로 봅니다. Oscar는 올해가 흘러가면서 ACA 시장 이탈이 자사가 추정한 20~30% 범위의 하단에 부합할 것으로 예상한다고 했습니다. Oscar는 회원 구성에서 상당한 변화를 봤다고 보고했습니다 — Silver 플랜은 회원의 71%에서 36%로 줄었고, Gold 플랜은 약 4%에서 25%로, Bronze 플랜은 25%에서 39%로 늘었습니다. Oscar는 그 결과 회원들이 더 높은 디덕터블을 가진 플랜을 갖게 됐다고 했습니다. Oscar의 Bronze와 Gold 플랜은 베네핏이 그리 풍부하지 않습니다. 전체적으로 Oscar는 ACA 시장에서 성숙해 가는 보험 사업으로서 잘 실행하고 있는 것으로 보입니다. 이는 Oscar에게 축복이자 저주로 동시에 작용하는 듯합니다 — 지금 ACA 시장 상황을 보면, 요즘 익스체인지에서 단일 사업만 하는 회사가 되고 싶은 보험사가 있을지 잘 모르겠습니다. 다른 상품으로 다각화하려는 Oscar의 시도는 계속 형태를 잡지 못하고 있습니다 — ICHRA는 장기적으로 흥미로운 성장 기회일 수 있지만, 단기에 Oscar에게 유의미한 사업이 될 방법은 분명하지 않습니다. Oscar는 ICHRA 회원이 두 배가 됐다고 했지만, 여전히 관련 데이터를 공유할 만큼 유의미하지는 않습니다. 이는 시장의 스타트업들에게는 아주 좋은 소식으로 보이지만, 상장사의 성장 서사로서는 곤란한 일이기도 합니다. +Oscar는 이번 실적 콜에서도 또다시 어디에서도 찾아볼 수 없었습니다. Oscar는 ICHRA 시장이 커짐에 따라 브로커리지 서비스와 등록 플랫폼 — 2025년에 여러 건의 소규모 인수를 통해 확보한 자산 — 을 사업의 유의미한 매출 기회로 언급했습니다. 여러 면에서, 2025년의 일련의 소규모 인수가 Oscar의 핵심 매출 기회로 부각되고 있다는 사실 자체가 여기서의 문제를 드러냅니다. 저는 훨씬 더 흥미로운 장기 성장 기회가 개인의 보험 구매 결정을 재원 조달 결정과 분리한다는 Bertolini의 이야기 갈래에 있다고 봅니다. 정부 리스크 풀이 ACA, ICHRA, Medicare, Medicaid에 있는 개인들이 동일한 상품 구성을 구매하는 세계로 옮겨 간다면, Oscar가 거기서 상당한 수혜를 보는 그림은 상상하기 어렵지 않습니다."},{"heading_en":"Public Company Earnings Reports","body":"Tenet은 또 한 번 강한 분기를 기록했고, 주가는 이번 주에 거의 20% 뛰었습니다. 조정 EBITDA는 2025년에 45억 7,000만 달러로 늘어, 연초 기대치 중간값을 5억 달러 웃돌았습니다. 지난 1년간 Tenet 주가는 71% 올랐고, 지난 5년으로는 350% 올랐습니다. Tenet의 USPI 부문은 조정 EBITDA 20억 달러를 만들어 냈고, 2025년 대비 12% 성장하면서 4분기에는 조정 EBITDA 마진 39.2%를 달성했습니다. 한편 병원 부문은 2025년에 조정 EBITDA 25억 달러를 15.7% 마진으로 만들어 냈습니다. 이 성장률과 마진 수치는 지금 병원과 외래 양쪽에서 Tenet의 접근이 갖는 힘을 보여 줍니다. Tenet은 inpatient-only list의 단계적 폐지가 향후 몇 년간 USPI에 점진적인 순풍이 될 것으로 보며, 특히 고난도 척추 및 비뇨기 시술 쪽에서 그렇다고 했습니다. 다만 앞으로 파도가 거칠어질 수 있는데, Tenet은 ACA 보조금 만료로 올해 2억 5,000만 달러를 잃을 것으로 예상한다고 했습니다. ACA 전체 등록자가 20% 줄면서 무보험 인구가 늘어날 것으로 보며, 특히 애리조나, 미시간, 캘리포니아 같은 주에서 그럴 것으로 봅니다."},{"heading_en":"Public Company Earnings Reports","body":"Hinge Health는 가상 MSK 프로바이더로서 인상적인 분기를 기록하며 주가가 약 21% 올랐고, 거의 1년 전 IPO 당시 거래를 시작했던 가격 가까이로 되돌아왔습니다. Hinge는 자사가 \"rule of 40\" 지표를 압도적으로 넘어선다고 밝혔는데, 2025년 연간 기준 매출 성장률과 잉여현금흐름을 합한 값이 81%였습니다. 이 결과는 지금 Hinge가 가진 모멘텀을 잘 보여 줍니다. 고용주 세그먼트에서 빠르게 성장하면서 기술을 투입해 비용은 상대적으로 평탄하게 유지했고, 그 결과 사업의 현금흐름이 유의미하게 개선됐습니다. 잉여현금흐름 마진은 2024년 12%에서 2025년 31%로 올랐습니다. Hinge는 자사가 따낸 고객 상당수가 여전히 디지털 MSK를 처음 도입하는 조직들이지만, 경쟁 제품을 쓰던 고객들과의 대화도 나타나고 있다고 했습니다. 여기서부터 Hinge가 어떤 성장 옵션을 추구하는지 지켜보는 게 흥미로울 겁니다 — Endpoints가 이번 주 초에 지적했듯이, Hinge는 최근 정신건강 분야로의 확장을 시사하는 채용 공고를 몇 건 올렸습니다."},{"heading_en":"The discussion around ACCESS rates","body":"CMMI는 목요일에 ACCESS와 관련해 두 가지를 발표했습니다 — ACCESS 모델의 지급 요율을 공개한 것, 그리고 여러 주요 페이어들이 유사한 성과 기반 가격 모델을 도입하기로 약속했다고 알린 것입니다. ACCESS의 지급 요율은 소셜 미디어에서 뜨거운 화제가 됐는데, 사람들이 ACCESS의 여러 트랙 전반에 걸쳐 대체로 매우 낮다고 인식되는 요율에 반응했기 때문입니다.\n\n다시 한번, 여기서 이 요율을 공개하는 CMMI / CMS의 게임 이론을 생각해 보는 게 저는 무척 흥미롭습니다. 디지털 헬스 업계가 낮은 요율에 부정적으로 반응하리라는 것, 그리고 그런 요율로는 수익을 내며 운영하기 힘든 회사들의 참여를 이끌어 내지 못하리라는 것은 상당히 예측 가능해 보입니다. CMMI 리더십도 분명 그 결과를 예상했을 겁니다. 동시에 CMMI는 자신들의 모델이 성공하려면 업계가 나타나 참여해야 한다는 점도 알고 있을 수밖에 없습니다. 모든 회사가 \"고맙지만 사양하겠습니다\"라고 한다면, 그건 CMMI가 새 모델을 내놓는 목적 자체를 무색하게 만드는 것 아닐까요?\n\n그런 역학을 감안하면, 여기서 CMMI가 무엇을 하려는 것인지, 누가 참여할 것이라 보는지, 그리고 어떤 인구를 대상으로 하는지를 생각해 보는 게 흥미롭습니다.\n\n잠시 한발 물러서 보면 — 이쯤 되면 우리 모두 Oz의 이야기 갈래를 들어 봤을 겁니다. CMS 리더십이 기술 도입, MAHA 마인드셋, 재정 보수주의를 중심으로 지금을 미국 헬스케어의 전환적 순간으로 본다는 이야기 말입니다. 기술과 AI 도입을 밀어붙여 산업을 바꾸려는 욕구가 분명히 있습니다. 헬스케어에 쓰이는 연방 예산에 대해 더 재정적으로 책임 있게 굴려는 욕구도 분명히 있습니다. Oz는 Trump가 Medicaid를 더 나은 재정 궤도에 올려놓음으로써 이 나라의 Medicaid를 구했다는 견해를 밝혔고, 미국이 나라가 딸린 헬스 시스템이 되지 않도록 하는 데 집중하고 있다고 했습니다. Medicare Advantage에서도 납세자의 돈을 잘 관리하는 청지기가 되겠다는 비슷한 서사를 들었습니다. 그리고 마지막으로 RFK는 MAHA 어젠다의 핵심 축으로 \"wearables for all\"이라는 개념을 이야기해 왔습니다.\n\n이 여러 이야기 갈래를 합쳐 보면, CMMI가 ACCESS를 통해 여기서 밀어붙이고 있는 것에 대한 강력한 가설이 하나 떠오릅니다 — AI 케어 모델과 소비자 웨어러블 기업들의 Medicare 진입입니다. 위의 모든 이해관계를 감안하면 논리적인 수순으로 보이고, 특히 여기서 요율이 얼마나 낮게 나왔는지를 함께 놓고 보면 더욱 그렇습니다. CMMI는 업계가 부정적으로 반응하리라는 걸 분명 알았을 겁니다. 그렇다면 \"이 모델에 누가 참여하는가?\"라는 질문의 답은, 기저 원가 구조를 근본적으로 다르게 사고할 수 있는 신규 진입자와 AI 기반 모델일 수밖에 없습니다.\n\n저는 CMMI가 이런 방식으로 ACCESS에 참여하고 싶어 하는 회사들을 이미 파악하고 있으리라 짐작합니다. 어쩌면 ACO 모델과 결합하는 방식일 수도 있지만, CMS는 정책학 박사 학위를 가진 이들에게 인센티브를 주는 방식에서 벗어나고 싶다는 의사도 분명히 밝혔습니다(공정하게 말하면, ACCESS가 그 점에서 판을 크게 바꾸고 있는지는 잘 모르겠습니다). 또는 그 소비자 기업들이 기존 모델 위에 역량을 쌓아 올리는 방식일 수도 있습니다. 어느 쪽이든, 상대적으로 건강한 시니어 인구층에게 웨어러블과 기타 디지털 헬스 도구를 쥐여 주는 흥미로운 뒷문처럼 보이고, 아마도 그들이 스스로 건강을 선제적으로 관리하기 시작하도록 도와 비용 곡선을 꺾겠다는 목표일 겁니다. 정말 그것이 목표라면, 저로서는 지지할 수 있는 목표입니다.\n\n이 모든 것의 흥미로운 함의 하나 — 지난 10년간 이어진 고용주 대상 디지털 헬스 혁신의 물결이 가진 가치를 CMS가 어떻게 인식하고 있는지에 대해 이는 무엇을 말해 주는 걸까요? CMMI 리더십이 대부분의 고용주 대상 디지털 헬스 솔루션의 시세를 모를 리 없습니다. 그럼에도 그들은 디지털 헬스 모델이 고용주에게 청구하는 것보다 현저히 낮아 보이는 요율로 밀고 나가기를 택했습니다. 이는 그런 회사들이 고용주 시장에 판매하며 거둔 성공에도 불구하고 비용 대비 그 제공물의 가치에 대해 어느 정도 회의를 품고 있으며, 여기에 더 나은 길이 있을 수 있다고 보고 있음을 시사하는 듯합니다."},{"heading_en":"Other Top Headlines","body":"CMS가 2026년 1월과 2월 Medicare Advantage 등록 수치를 공개했는데, 지난 몇 주 동안 기업들이 결과를 공유하면서 HTN Slack에서 함께 추적해 온 내용과 일치합니다. 전체적으로 시장은 소폭 성장했고, Humana, Devoted, SCAN, Clover가 성장을 주도했습니다. 시장을 이끄는 것은 Special Needs Plan으로 보이는데, SNP 플랜 등록은 전체적으로 약 5% 늘어난 반면 일반 MA 등록은 소폭 줄었습니다. C-SNP 플랜은 14% 늘었고, D-SNP는 4% 늘었습니다. Devoted와 Humana 모두 SNP 상품에서 상당한 회원 성장을 거둔 것으로 보입니다. CVS는 전체적으로는 회원을 잃었지만, C-SNP 플랜에서는 강한 성장을 경험한 것으로 보입니다. MA 등록 상황에 대해서는 다음 주에 더 많은 내용이 이어집니다."},{"heading_en":"Other Top Headlines","body":"HHS / DOGE는 2018년 1월부터 2024년 12월까지의 프로바이더별 Medicaid 지출을 공개했다고 밝혔습니다. 이 데이터에 대한 반응이 소셜 미디어 사이트마다 어떻게 다른지를 보는 게 흥미롭습니다. LinkedIn에서는 제가 본 한 논의가 거의 없었고, 지난 몇 년간 여러 ABA 진료기관 사이의 엇갈린 성장률을 들여다보며 그 성장률이 왜 다를 수 있는지 곱씹은 Yubin Park의 글 같은 사려 깊은 게시물 몇 개가 있었을 뿐입니다. 반면 X는… 데이터를 근거로 어디서 사기가 일어났다고 생각하는지 짚어 내는 수많은 사기 탐지꾼들의 글은 링크하지 않겠습니다. 전반적으로 저는 이런 투명성이 시스템에 좋은 일이라고 생각하지만, 지금 우리 사회가 이런 대화에 뛰어들 역량이 되는지는 걱정스럽습니다."},{"heading_en":"Other Top Headlines","body":"Humana는 플로리다에 기반을 둔 프라이머리 케어 프로바이더 MaxHealth의 인수를 발표했습니다. MaxHealth는 82개의 직영 및 제휴 클리닉과 8만 명이 넘는 VBC 회원을 두고 있습니다. MaxHealth는 이전에 Arsenal Capital Partners가 소유했는데, Arsenal은 2020년부터 2022년 사이에 플로리다에서 몇 개의 자산을 인수해 이를 조립했습니다. VBC 시장의 밸류에이션으로 보면 지금과는 매우 다른 시기였습니다. Bloomberg는 거래 규모가 약 10억 달러라고 보도했고, 셀사이드 애널리스트 리포트들은 이 거래가 EBITDA의 약 13배였다고 봅니다. 이 숫자들은 MaxHealth가 약 7,200만 달러의 EBITDA와 한 자릿수 중반의 EBITDA 마진을 내고 있음을 시사합니다. 지난 12월에는 Towerbrook과 Guidewell(일명 Florida Blue)이 여기에 제안을 넣고 있다고 보도됐는데, Humana가 끼어든 것으로 보입니다. 여기서 작동하는 전략을 두고 HTN Slack에서 흥미로운 논의가 많았습니다. Humana는 밸류에이션이 크게 압축된 시장에서 공격적으로 움직이는 것으로 보입니다. MaxHealth로 계산해 보면 VBC 가입자 1인당 약 1만 4,000달러에 인수되는 셈인데, 몇 년 전 Oak Street이 인수될 때의 VBC 가입자 1인당 약 6만 6,000달러에서 크게 내려온 수치입니다."},{"heading_en":"Other Top Headlines","body":"롱제비티 컬트 리더 구루 Bryan Johnson은 Immortals라는 연 100만 달러짜리 새 롱제비티 상품을 발표하며 소셜 미디어에서 화제를 일으켰습니다. 운 좋은 세 사람을 대상으로 출시한다고 합니다. 여기에는 컨시어지 팀, AI 지원, 그리고 Bryan이 자신의 생물학적 나이를 되돌리기 위해 하는 각종 검사와 온갖 부질없는 것들이 포함됩니다. 지금까지 거의 1,600명이 이 상품에 지원했다고 하는데, 계산해 보면 16억 달러의 매출 기회를 시사합니다(대기자 명단 등록에 지불 능력 필터가 있지는 않을 것 같으니, 당연히 걸러 들으시길). 그럼에도 지금 롱제비티를 둘러싼 흥분을 보여 주는 것 같기는 합니다. Johnson은 관심 있는 이들을 위해 연 6만 달러짜리 티어와 무료 티어도 내놓을 계획이라고 합니다."},{"heading_en":"Other Top Headlines","body":"Harbor Health가 치매 케어 스타트업 Rippl Health를 인수했습니다. 텍사스에서 새로운 payvidor 모델을 만들려는 Harbor에게 이는 최근 몇 달 사이 두 번째 인수입니다. Harbor는 지난 9월에 VillageMD 클리닉 32곳의 인수도 발표한 바 있습니다. Rippl의 가상 치매 케어 모델이 Harbor의 케어 제공에 통합될 것으로 보이긴 하지만, 제 짐작으로 이 거래는 Harbor로 들어가는 현금 수혈에 더 가깝습니다 — 지분으로 Rippl을 사고, Rippl의 투자자 기반으로부터 현금을 수혈받는 것입니다. General Catalyst가 9월 Harbor의 1억 3,000만 달러 라운드를 공동 주도했고 2022년 Rippl의 시드 라운드도 주도했다는 점은 짚어 둘 만합니다. Rippl은 연착륙할 곳을 찾고 Harbor는 추가 현금을 얻는 윈윈을 상상하기는 어렵지 않습니다."},{"heading_en":"Other Top Headlines","body":"상원의원 Elizabeth Warren과 Josh Hawley가 이번 주 Break Up Big Medicine Act라는 새 법안을 발의했습니다. 양당의 두 의원이 이 사안에서 손을 잡았다는 점이 눈에 띄는데, 헬스케어판 Glass-Steagall Act 같은 역할을 의도한 것으로 보입니다. 지금 일반 대중이 수직 통합된 헬스케어를 싫어한다는 것, 그래서 이런 정서가 워싱턴에서 잘 먹힌다는 것은 이해하지만, 이런 입법으로 의회가 구체적으로 무엇이 나아진다고 보는지는 궁금합니다. 대형 상장사들은 잠시 제쳐 두더라도, 이런 종류의 입법은 Kaiser 같은 모델과 다른 통합 케어 모델에 광범위한 영향을 줄 가능성이 커 보입니다."},{"heading_en":"Other Top Headlines","body":"D2C 롱제비티 영역에서는 Function Health가 Superpower를 상대로 기만적 광고를 주장하며 소송을 제기했습니다. 최근 빠른 성장을 내세우던 두 스타트업이 이제 10대들의 말다툼처럼 읽히는 소송에 얽힌 걸 보니 저로서는 묘합니다. 잘 자본화된 두 스타트업이 시장 점유율을 놓고 싸우면서, 롱제비티 도입이라는 거대한 \"블루 오션\" 기회여야 할 국면 초반에 \"레드 오션\" 접근을 취하는 듯한 이 모습이 시장 모멘텀이 빠르게 식고 있다는 신호는 아닌지 생각하게 됩니다."},{"heading_en":"Other Top Headlines","body":"OpenEvidence가 Sutter Health와의 새로운 파트너십을 발표하며, Open Evidence의 임상 검색 도구를 Sutter Health 의사들을 위한 Epic EHR 워크플로우에 통합합니다. OpenEvidence가 프로바이더들 사이에서 모멘텀을 계속 키워 가면서 당길 만한 자연스러운 성장 레버로 보입니다."},{"heading_en":"Other Top Headlines","body":"PE 회사 Madison Health Group이 행동건강 프로바이더 Magellan Health를 인수합니다."},{"heading_en":"Funding Announcements","body":"가상 정신의학 그룹 Talkiatry가 지분으로 2억 1,000만 달러를, 여기에 더해 데트 퍼실리티로 1억 9,000만 달러를 조달했습니다. Slack에서도 언급했듯이 Talkiatry는 지금 강한 모멘텀을 갖고 있는 것으로 보이며, 탄탄한 핵심 사업 위에 쌓아 올리고 있습니다. 현재 800명의 정신과 의사를 고용하고 있는데, 이는 미국 정신과 의사의 거의 2%에 해당합니다. HCA를 비롯한 헬스 시스템들과 통합 리퍼럴 파트너가 되기 위한 파트너십을 추진 중이고, 그 위에 쌓아 올릴 아주 강한 위치로 보입니다. 동종 최고의 프로바이더 조직을 만드는 것은 언제나 이기는 전략적 수로 보이고, Talkiatry가 여기서 하고 있는 게 바로 그것 같습니다."},{"heading_en":"Funding Announcements","body":"환자 애드보커시 모델 Solace가 10억 달러 이상의 밸류에이션으로 1억 3,000만 달러를 조달했습니다. IVP가 라운드를 주도했습니다. Solace는 2,000명이 넘는 \"애드보킷\"과 관계를 맺고 있는데, 모두 1099 계약 형태의 임상 면허 보유자로 보입니다. Solace의 웹사이트를 보면 Solace가 고용한 임상의가 초기 상담을 하고, 이후 애드보커시 업무는 이 애드보킷들 중 한 명이 \"개시 임상의에 부수하여\" 수행하는 것으로 보입니다. 그 마지막 표현은 Solace 웹사이트에서 가져온 것으로, 애드보킷에 대해 incident-to 빌링을 쓴다는 뜻으로 읽힙니다. 모든 환자가 헬스케어 시스템을 헤쳐 나가는 데 좋은 애드보킷이 있으면 좋다는 데는 우리 모두 동의할 겁니다. 다만 그 재원 조달 방식이 애매한 방식으로 incident-to 빌링을 써서 추가적인 Medicare 달러를 확보하는 것이라면, 그에 대해 어떻게 느껴야 할지는 그만큼 확신이 서지 않습니다. 모두에게 애드보킷을이라는 훈훈한 스타트업 서사보다는 금융 차익거래에 더 가깝게 느껴집니다."},{"heading_en":"Funding Announcements","body":"고용주를 위한 의사 품질 분석 플랫폼 Garner가 14억 달러 밸류에이션으로 1억 1,800만 달러를 조달했습니다. Kleiner Perkins가 라운드를 주도했습니다. 대형 고용주들 사이에서 견조한 견인력을 보이고 있는 회사로서는 대규모 펀딩 라운드인데, Garner의 데이터는 직원들이 질 높고 비용이 낮은 프로바이더를 찾도록 돕고 있습니다. Garner가 이 자금을 고용주 대상 상품군 확장에 쓰게 되지 않을까 하는 생각이 듭니다 — 고용주들이 받고 있는 압박과 Garner가 만들어 내고 있는 것으로 보이는 절감액을 감안하면 논리적인 수순으로 보입니다."},{"heading_en":"Funding Announcements","body":"개 롱제비티 신약 개발사 Loyal이 1억 달러를 조달했습니다. 언젠가는 우리 인간에게로도 확장할 계획을 갖고 있습니다. Age1, Baillie Gifford 등이 투자했습니다."},{"heading_en":"Funding Announcements","body":"헬스 플랜을 위한 AI 운영 플랫폼 Anterior가 4,000만 달러를 조달했습니다. NEA, Sequoia, FPV, Kinnevik이 참여했습니다. 보도자료에 따르면 Anterior는 Geisinger Health Plan을 고객으로 두고 있으며, HealthEdge와 파트너십을 맺고 통합을 진행했습니다. 보도자료는 또한 Anterior의 접근이 기술보다 구현에 더 초점을 맞추고 있다고 밝히는데, 헬스케어에서는 현명한 초점으로 보입니다."},{"heading_en":"Funding Announcements","body":"VBC 종양학 플랫폼 Atlas Oncology Partners가 2,800만 달러를 조달했습니다. Flare Capital이 라운드를 주도했고 Rubicon Founders가 참여했습니다."},{"heading_en":"Funding Announcements","body":"10대를 위한 또래 지지 기반 정신건강 모델 Somethings가 1,920만 달러를 조달했습니다. Catalio Capital이 라운드를 주도했고, General Catalyst와 Tusk Ventures가 참여했습니다."},{"heading_en":"Funding Announcements","body":"ICHRA 플랫폼 Kyra Health가 금액 비공개의 시드 펀딩을 발표했습니다. FlyOver Capital과 Wavemaker 360이 라운드를 주도했고, Kyra를 인큐베이팅한 벤처 스튜디오 25Madison이 힘을 보탰습니다."},{"heading_en":"Funding Announcements","body":"PACE 프로바이더 Habitat Health가 Hercules Capital로부터 금액 비공개의 벤처 데트를 조달했습니다."},{"heading_en":"What I'm Reading: Guest Post: Applied AI in healthcare - what 15 digital health teams are actually building and how","body":"Jacob Mulligan 씀\n\nJacob Mulligan이 이번 주 HTN에서 디지털 헬스 스타트업의 AI 도입 현황에 대한 유익한 관점을 공유했습니다."},{"heading_en":"What I'm Reading: Weekly Health Policy Briefing 02/12/2025","body":"Martin Cech 씀\n\n제가 분명 편향돼 있고 Martin의 뉴스레터가 매주 읽을 만하다고 생각하는 편이긴 하지만, 이번 주 Medicare Advantage와 Original Medicare의 비용을 비교하는 일의 어려움에 대한 그의 관점은 특히 확인해 볼 만하다고 생각했습니다. 특히 아래에 이어지는 다음 기사를 감안하면 더욱 그렇습니다."},{"heading_en":"What I'm Reading: The Trouble with MedPAC","body":"WSJ 편집위원회 씀\n\n이번 주 Slack에서 언급했듯이, 이 글이 WSJ에 실린 걸 보는 게 무척 흥미로웠는데, 이런 결론으로 끝맺습니다: \"더 나아가, MedPAC의 예산을 끊어라. 워싱턴이 미국 헬스케어에 대한 더 많은 정부 통제를 위해 로비하는 정부 보건정책 기관을 하나 더 둘 이유가 무엇인가?\" 지난해 WSJ의 Medicare Inc 시리즈가 워싱턴 정치인들과 일반 대중 모두에게 미친 것으로 보이는 영향을 감안하면, WSJ의 논조 변화는 눈에 띕니다."},{"heading_en":"What I'm Reading: How Ozempic Brought a Napster Moment to Big Pharma","body":"David Wainer 씀\n\nHims는 컴파운딩 GLP-1 알약을 출시한 결정에서 비롯된 역풍을 계속 겪고 있는데, 이는 점점 Hims에게 낙타 등을 부러뜨린 마지막 지푸라기처럼 보입니다. 이 WSJ 기사는 Hims를 Napster에 비유하는데, Napster는 음악 산업을 바꿔 놓았지만 결국 파산했습니다. 기사는 Ro가 제약사들과의 관계 덕분에 더 지속 가능한 방식으로 Hims의 자리에 들어서는 iTunes / Spotify 격이라는 그림을 그립니다."}]},"16":{"index":"16","title_en":"Weekly Health Tech Reads 2/22/26","subtitle":"디플레이션을 노린 규제 시도, 실적 업데이트, Hims의 Eucalyptus 인수, 그리고 그 밖의 소식에 대한 단상","sections":[{"heading_en":"MUSING: The peculiar dynamics of deflationary regulation in healthcare","body":"의료비를 둘러싼 전국적인 논의를 생각하면, “의료비 지출을 실제로 줄인다면 어떤 모습일까?”라는 질문이 요즘 자주 머릿속을 맴돈다. 이번 주에는 의료비를 낮추려 한 최근 세 건의 규제 시도를 둘러싼 뉴스가 한꺼번에 나왔는데, 하나씩 뜯어보면 흥미로울 것 같았다. IRA, NSA, 그리고 ACCESS다."},{"heading_en":"The Inflation Reduction Act and drug costs","body":"내가 대체로 이해하는 IRA의 논리는 이렇다. Medicare의 막대한 물량이 협상력을 만들어 내고, 그 힘으로 제약사로부터 의미 있는 가격 인하를 받아낼 수 있다는 것이다. 그러면 전체 약제비 지출을 줄이는 데 도움이 된다.\n\n그런 취지에서 미국에서 매출이 가장 큰 약 중 하나인 Eliquis가 IRA 1차 협상 대상 10개 약물 중 하나로 지정됐다. Eliquis는 2023년에 122억 달러의 매출을 올렸다. Medicare는 Eliquis 제조사인 Bristol Myers Squibb와 56% 가격 인하에 합의했는데, 표면적으로는 의료비 측면에서 승리로 보인다. 전체적으로 1차 10개 약물 협상은 새 가격이 적용되는 첫해인 2026년에 고령층 지출을 약 15억 달러 줄일 것으로 추정되며 환영받았다. 훌륭하다!\n\n그런 점을 생각하면, 이달 초 Bristol Myers Squibb의 실적 발표에서 2026년 Eliquis 매출이 10~15% 성장할 것으로 예상한다는 내용을 읽은 건 다소 이상했다.\n\n그러니까 IRA가 시행되어 Medicare 안에서 Eliquis 가격을 56% 깎게 되는 바로 그 해에, Bristol Myers Squibb는 어떻게든 그 약의 매출을 2025년 144억 달러에서 약 160억 달러로 약 20억 달러 늘리고 있다는 것이다. IRA 협상 과정에서 기대되는 절감액 전체보다 큰 금액이다. 애널리스트들은 이 결과에 기분 좋게 놀란 듯했고, BMY 주가는 지난 몇 주 동안 약 10% 올랐다. Q&A에서 많은 애널리스트가 Eliquis에 집중했는데, 이 약은 미국 외 지역에서 특허가 만료되면서 2027년에는 매출이 감소할 것이라고 한다. 2030년이면 특허 만료로 Eliquis 매출은 거의 0에 가깝게 떨어질 전망이다. 규제가 아니라 경쟁이 주는 혜택이다.\n\n이미 시장을 지배하고 있는 약이 가격이 56% 깎이는데도 성장하는 게 어떻게 가능하냐고 물을 수 있다. 한 기사가 여기서 작동하는 역학을 잘 짚어 준다. 물량 증가가 매출 성장을 이끄는 것으로 보이지는 않는다. 대신 BMY가 list-to-net 가격 차이를 다루는 방식을 바꾼 것으로 보이며, 그 효과가 가격 인하분을 상쇄하고도 남았다. 여기서 벌어지는 기이한 일의 한 예를 들자면… BMY는 Medicaid에서 Eliquis 가격을 0으로, 말 그대로 무상으로 낮추는 데 동의했는데, 내가 온전히 이해했다고 말하기 어려운 어떤 인플레이션 리베이트 역학 때문에 그 조치가 오히려 BMY의 수익성에 보탬이 된다고 한다.\n\n사실상 IRA의 간판 격이었던 약에 대해 이런 인용문을 읽는 건 놀랍다.\n\n❝ 모든 것을 감안할 때, Inflation Reduction Act는 Eliquis에게 일어난 가장 좋은 일일지도 모른다.\n\n출처: Citeline"},{"heading_en":"The No Surprises Act & provider OON billing","body":"이번 주 규제의 기이함 목록에 오른 또 하나는 No Surprises Act다. out-of-network 의료 제공자가 보내는 예상치 못한 의료비 청구서로부터 소비자를 보호하면서 시장에 더 많은 투명성을 가져오도록 설계된 것처럼 보였던 법이다. 훌륭하다!\n\nNSA에는 초기 성과가 좀 있는 듯했다. 이런 전술을 쓰던 PE 지원 그룹 몇 곳을 초기에 파산으로 몰아넣었기 때문이다(Envision과 American Physician Partners). 그런데 몇 년이 지난 지금, 다른 PE 지원 그
