서 이 중간자가 값을 정하는 힘을 가지며, 그 과정이 불투명하다는 비판이 계속돼 왔다. 한국은 건강보험공단이 약가를 직접 정하므로 이런 회사 자체가 없다."},{"term":"specialty pharmacy","ko":"스페셜티 파머시","plain":"항암제나 자가면역질환 주사제처럼 한 달 약값이 수천 달러를 넘고 냉장 보관이나 투여 지도가 필요한 약을 전담해 유통하는 약국이다. 건수는 적어도 금액이 크기 때문에 유통 마진이 크고, 그래서 대형 회사들이 앞다퉈 이 사업을 키우고 있다."},{"term":"co-pay only plan","ko":"코페이 전용 플랜","plain":"미국 보험은 대개 연간 공제액을 다 채우기 전까지 환자가 진료비 전액을 내야 하는데, 코페이 전용 플랜은 공제액 없이 방문마다 정해진 금액만 내게 한다. 환자는 얼마를 낼지 미리 알 수 있고, 고용주는 직원이 필요한 진료를 미루다 병을 키우는 일을 줄일 수 있다고 기대한다. Cigna는 이 상품이 고객사에 최대 10% 절감 효과를 보인다고 밝혔다."}]},{"heading_ko":"실적: Innovage와 PACE 모델의 선전","heading_en":"Public Markets Earnings Updates","skip":null,"summary":"노인 대상 PACE 프로그램을 운영하는 Innovage의 주가가 한 주에 50% 급등했다. 필자는 이를 지난 몇 년간의 운영 난맥을 딛고 나온 성과 기반 진료의 모범 사례로 읽는다. 다만 커뮤니티에서는 지금이 PACE의 고점이 아니냐는 논의가 나왔다는 점도 함께 전한다.","insight":null,"signal":null,"author":[{"claim":"Innovage의 최근 성공은 여러 면에서 성과 기반 진료 성과의 모범 사례처럼 보인다.","evidence":"캐피테이션 방식 케어 딜리버리에서 조정 EBITDA 마진 9.2%를 낸 점을 근거로 든다."}],"experts":[],"cases":[{"name":"Innovage","what":"노인이 요양시설에 들어가지 않고 지역에서 지내도록 의료와 돌봄을 통째로 책임지는 PACE 프로그램 사업자로, 실적 기대치를 넘고 연간 EBITDA 가이던스를 올렸다.","scale":"주가 50% 급등, 해당 분기 조정 EBITDA 마진 9.2%","note":"돈이 정부에서 나오고 한 사람당 정액을 받는 구조라, 마진을 내려면 입원을 줄이는 것 말고는 방법이 없다.","sells_to":"other"}],"notes":[{"term":"PACE","ko":"노인 종합 돌봄 프로그램","plain":"요양시설에 들어갈 정도로 몸이 나빠진 노인이 집과 지역에 머무르도록, 진료와 재활, 식사, 이동까지 한 기관이 통째로 맡는 제도다. 메디케어와 메디케이드가 한 사람당 정해진 돈을 매달 지급한다. 한국의 노인장기요양보험과 방문 진료를 한 조직이 함께 맡는 형태에 가깝다."},{"term":"capitation","ko":"캐피테이션(인두제)","plain":"진료 한 건마다 값을 받는 것이 아니라, 사람 한 명을 맡는 대가로 매달 정액을 받는 지불 방식이다. 진료를 많이 할수록 손해이므로 예방과 관리에 힘쓰게 되지만, 반대로 필요한 진료를 줄이려는 힘도 함께 생긴다. 한국은 진료 건마다 값을 매기는 행위별 수가제가 기본이라 이 방식이 거의 없다."},{"term":"VBC (value-based care)","ko":"성과 기반 진료","plain":"얼마나 많이 진료했는지가 아니라 환자가 얼마나 건강해졌는지, 비용을 얼마나 아꼈는지로 보상을 정하는 방식을 통틀어 가리킨다. 미국에서 지난 10년간 가장 많이 시도된 개혁 방향이지만 실제로 돈을 번 회사는 많지 않다."}]},{"heading_ko":"실적: Doximity, 기대치를 넘기고도 25% 하락","heading_en":"Public Markets Earnings Updates","skip":null,"summary":"의사 전용 네트워크 Doximity가 매출과 이익 모두 가이던스 상단을 넘겼는데도 주가는 25% 빠졌다. 시장이 보는 것은 이번 분기 숫자가 아니라 의학 정보 검색에서 치고 올라오는 OpenEvidence의 존재다. CEO가 준비된 발언에서 경쟁사를 겨냥한 듯한 문장을 넣은 대목이 이 꼭지의 볼거리다.","insight":null,"signal":null,"author":[{"claim":"Tangney의 발언은 거의 확실하게 OpenEvidence를 겨냥해 얇게 가린 한 방이었다.","evidence":"OpenEvidence가 최근 의료 초지능 구축을 이야기해 왔다는 점을 근거로 든다."},{"claim":"OpenEvidence가 아무리 다르게 바라더라도 Doximity가 조만간 사라질 것 같지는 않다.","evidence":"분기 활성 의사 30만 명과 이를 쓰는 병원 100곳이라는 수치를 근거로 든다."}],"experts":[{"who":"Jeff Tangney","role":"Doximity CEO로, AI 경쟁사에 밀린다는 시장의 시선을 반박해야 하는 위치에 있다.","claim":"분명히 해두자면, 어떤 AI도 실수를 없애지 못했고 초지능에 가까운 무언가를 달성하지도 못했다.","evidence":"근거를 대지 않았다."},{"who":"Jeff Tangney","role":"같은 인물. 실적 발표 Q&A에서 상장 유지 여부를 묻는 질문을 받았다.","claim":"투자자들도 Doximity에 상장사일 필요가 있느냐는 같은 질문을 하고 있다.","evidence":"근거를 대지 않았다."}],"cases":[{"name":"Doximity","what":"미국 의사들이 쓰는 전용 네트워크를 운영하며 제약사 마케팅과 채용 광고로 돈을 버는 회사로, 분기 실적이 가이던스 상단을 넘겼는데도 주가가 빠졌다.","scale":"주가 25% 하락, 매출 1억 8,500만 달러, 조정 EBITDA 1억 1,100만 달러로 마진 60%, 분기 활성 의사 30만 명, 사용 병원 100곳","note":"이번 분기 초과 달성에도 연간 가이던스를 올리지 않았는데, 4분기 매출이 줄고 AI 투자가 늘 것으로 보기 때문이다.","sells_to":"pharma"}],"notes":[{"term":"OpenEvidence","ko":"의학 근거 검색 서비스","plain":"의사가 진료 중에 최신 논문과 진료 지침을 물어보면 근거와 함께 답을 주는 서비스로, 미국 의사들 사이에서 빠르게 퍼졌다. 의사의 시간을 가져가는 자리를 두고 Doximity와 정면으로 부딪히기 때문에, Doximity의 주가가 이 회사의 기세에 흔들린다."}]},{"heading_ko":"이번 주의 차트: 병원 마진의 빈부 격차","heading_en":"Chart of the Week: The Haves and Have-nots of Hospital Margins","skip":null,"summary":"인디애나에서 같은 병원들을 두고 정반대 이야기를 하는 두 자료가 맞붙었다. 컨설팅사는 병원 재정이 어렵다고 하고, 고용주 연합은 상당수 병원이 소프트웨어 회사급 이익률을 내고 있다는 데이터를 내놓았다. 병원 재정난이라는 말이 전체 평균으로만 이야기될 때 무엇이 가려지는지 보여 주는 꼭지다.","insight":null,"signal":null,"author":[{"claim":"Fort Wayne의 비영리 병원 한 곳이 최고 수준 SaaS 마진에 맞먹는 영업이익률을 내고 있다는 사실은 고개를 갸웃하게 만든다.","evidence":"Parkview Orthopedic Hospital의 2024년 매출 1억 8,600만 달러와 운영비용 1억 1,700만 달러, 그 차이인 영업이익 6,900만 달러와 영업이익률 37%를 근거로 든다."}],"experts":[],"cases":[{"name":"Kaufmann Hall 프레젠테이션","what":"병원을 상대로 자문하는 회사가 인디애나 병원 재정의 곤경을 다룬 자료를 공유하며 2025년 마진이 전국 평균을 밑돌았다고 지적했다.","scale":"","note":"병원 편에 서서 요율 인상을 주장할 때 쓰이는 종류의 자료다.","sells_to":"provider"},{"name":"Employer's Forum of Indiana","what":"직원 의료비를 부담하는 고용주들이 모인 단체로, 인디애나 병원의 거의 20%가 2024년에 순이익률 20%를 넘겼다는 데이터를 내놓아 위 주장에 맞섰다.","scale":"인디애나 병원의 약 20%가 순이익률 20% 초과","note":"미국에서 병원 값을 실제로 문제 삼는 쪽은 정부나 환자가 아니라 보험료를 내는 고용주라는 점을 보여 준다.","sells_to":"other"},{"name":"Parkview Orthopedic Hospital","what":"Fort Wayne에 있는 비영리 정형외과 병원으로, 인디애나에서 가장 높은 이익률을 기록했다.","scale":"2024년 매출 1억 8,600만 달러, 운영비용 1억 1,700만 달러, 영업이익 6,900만 달러, 영업이익률 37%","note":"수술 종류를 골라 받는 전문 병원일수록 이익률이 높게 나온다는 점을 함께 놓고 볼 대목이다.","sells_to":"mixed"}],"notes":[{"term":"not-for-profit hospital","ko":"비영리 병원","plain":"미국 병원의 절반 이상이 비영리 법인이며, 이익을 주주에게 배당하지 않는 대신 법인세와 재산세를 면제받는다. 이익을 내면 안 된다는 뜻이 아니라 남은 돈을 조직 안에 쌓아 둔다는 뜻이므로, 이익률이 37%인 비영리 병원도 제도상 문제가 없다. 세금을 면제받는 대가로 지역사회에 기여해야 하는데 그 기여가 충분한지가 미국에서 오래된 논쟁거리다."}]},{"heading_ko":"CommonSpirit, 19억 달러를 내고 청구 업무를 되가져오다","heading_en":"Other Top Headlines","skip":null,"summary":"대형 병원 그룹 CommonSpirit이 외부에 맡겼던 청구·수납 업무를 다시 내부로 가져오면서 거액의 계약 해지 비용을 지불했다. 병원이 통째로 맡기는 방식과 직접 하는 방식 사이에서 무게추가 움직이는 사례다. 필자는 이 흐름이 오히려 작은 전문 업체들에게 기회가 될 수 있다고 본다.","insight":null,"signal":null,"author":[{"claim":"시스템들이 내부 팀에 직접 만들지 살지 맡길지를 판단하게 하고 최고 수준의 파트너를 골라 오려 한다면, 일부 포인트 솔루션에는 오히려 순증 효과가 될 수 있다.","evidence":"근거를 대지 않았다."}],"experts":[],"cases":[{"name":"CommonSpirit과 Conifer Health Solutions","what":"병원 그룹 CommonSpirit이 청구·수납 업무를 대행하던 Conifer와의 관계를 끊고 그 기능을 내부로 가져왔다. Conifer의 과반 지분을 가진 Tenet은 CommonSpirit이 보유하던 Conifer 지분 23.8%를 사들인다.","scale":"Tenet이 CommonSpirit에 5억 4,000만 달러 지급, CommonSpirit이 계약 해지에 19억 달러 지불","note":"계약을 깨는 데만 19억 달러를 쓸 만큼 청구 업무의 주도권을 되찾는 값을 크게 매겼다는 뜻이다.","sells_to":"provider"}],"notes":[{"term":"RCM (revenue cycle management)","ko":"청구·수납 관리","plain":"환자를 진료한 뒤 보험사에 청구서를 넣고, 거절당하면 다시 다투고, 환자 본인 부담분을 받아 내는 일련의 업무다. 미국은 보험사마다 규칙이 달라 이 과정이 대단히 복잡하고 사람이 많이 필요해, 병원 인건비의 큰 몫을 차지한다. 한국은 심사평가원 한 곳에 청구하면 되므로 이만한 산업이 생기지 않았다."}]},{"heading_ko":"Hims의 49달러 GLP-1 알약, 이틀 만의 철수","heading_en":"Other Top Headlines","skip":null,"summary":"소비자에게 직접 약을 파는 Hims가 복합조제 GLP-1 알약을 월 49달러에 내놓았다가 규제 당국의 즉각적인 반응을 부르고 이틀 만에 거둬들인 사건이다. 값이 발표되자 제약사 주가가 흔들릴 만큼 시장이 반응했지만, 합법성과 효과 양쪽에서 의심이 커졌다. 필자는 이 주를 회사의 중대한 전술적 실수로 본다.","insight":null,"signal":"미국 소비자에게 GLP-1은 값이 곧 방아쇠다. 월 49달러라는 값 하나가 발표되자 Eli Lilly와 Novo Nordisk 주가가 함께 밀렸고 Hims 주가는 9% 뛰었다. 승인 절차 밖의 경로라도 값이 충분히 낮으면 수요가 붙는다고 시장이 판단했다는 뜻이며, 그만큼 지금 값에서 약을 계속 쓰지 못하는 사람이 많다는 방증이기도 하다.","author":[{"claim":"이번 주는 Hims 쪽의 중대한 전술적 실수처럼 느껴졌다.","evidence":"제품이 금요일 늦게 시장에서 내려졌고 그 전에 이미 법무부에 조사가 회부됐으며, 주가가 주간 30% 하락으로 끝났다는 점을 든다."}],"experts":[],"cases":[{"name":"Hims","what":"소비자가 앱에서 상담을 받고 자기 돈으로 약을 사는 직접 판매 회사로, 목요일 아침 복합조제 GLP-1 알약을 월 49달러에 출시했다가 금요일 늦게 내렸다.","scale":"월 49달러, 출시 당일 주가 9% 상승, 주간 30% 하락","note":"FDA와 HHS가 빠르게 반응했고 제품 철수 전에 이미 법무부에 조사가 회부됐다. 발표 시점이 Novo Nordisk 실적 발표와 겹쳤다.","sells_to":"consumer"}],"notes":[{"term":"compounded drug","ko":"복합조제 의약품","plain":"약국이 승인된 완제품 대신 성분을 직접 조합해 만드는 약이다. 원래는 알약을 삼키지 못하는 환자처럼 개별 사정에 맞추라고 열어 둔 예외인데, 품귀 상태에서 값싼 대체 공급 경로로 쓰이면서 문제가 됐다. FDA의 승인 심사를 거치지 않으므로 효과와 순도를 보증하는 절차가 없다."},{"term":"GLP-1","ko":"GLP-1 계열 비만·당뇨 치료제","plain":"식욕을 억제해 체중을 크게 줄이는 주사제로, Novo Nordisk와 Eli Lilly가 시장을 나눠 갖고 있다. 미국에서는 보험이 비만 목적 처방을 잘 대 주지 않아 월 수백 달러를 자기 돈으로 내야 하는 경우가 많고, 그래서 값싼 우회 경로가 계속 생겨난다."}]},{"heading_ko":"HCA, 텍사스에서 어전트 케어를 사들이다","heading_en":"Other Top Headlines","skip":null,"summary":"미국 최대 영리 병원 그룹 HCA가 텍사스에서 어전트 케어 13곳과 독립형 응급실 6곳을 인수했다. 큰 병원이 소비자를 처음 만나는 지점을 계속 늘리고 있다는 짧은 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"HCA Healthcare","what":"영리 병원 그룹이 텍사스에서 어전트 케어 센터 13곳과 독립형 응급실 6곳을 인수했다.","scale":"인수 후 텍사스 95곳, 전국 400곳 이상의 어전트 케어 사이트 운영","note":"주치의 예약이 몇 달에서 몇 년씩 걸리는 상황에서, 예약 없이 갈 수 있는 지점이 병원 그룹의 성장 축이 되고 있다.","sells_to":"mixed"}],"notes":[{"term":"urgent care","ko":"어전트 케어","plain":"예약 없이 걸어 들어가 그날 진료를 받는 곳으로, 응급실만큼 위중하지는 않지만 주치의 예약을 기다릴 수 없는 상황에 쓰인다. 주치의를 잡기 어려워질수록 이용이 늘어난다. 한국에서 아무 의원이나 당일에 갈 수 있는 것이 미국에서는 별도 업태가 되어 있는 셈이다."},{"term":"free-standing ED","ko":"독립형 응급실","plain":"병원 건물에 붙어 있지 않고 따로 서 있는 응급실이다. 겉모습은 어전트 케어와 비슷하지만 응급실 요금 체계를 적용하기 때문에 같은 진료라도 청구액이 훨씬 크다. 환자가 두 곳을 구분하지 못해 큰 청구서를 받는 일이 미국에서 반복되는 문제다."}]},{"heading_ko":"예산 패키지에 원격의료와 재택입원 연장이 담기다","heading_en":"Other Top Headlines","skip":null,"summary":"새 예산 패키지가 서명됐고, 여기에 원격의료 예산과 재택입원 웨이버 연장, PBM 투명성 요구가 포함됐다. 코로나 때 임시로 열어 둔 규정들이 다시 한 번 연장되는 흐름이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"새 예산 패키지 서명","what":"원격의료 예산과 hospital-at-home 웨이버 연장, PBM 투명성 요구사항이 함께 담긴 예산 패키지에 대통령이 서명했다.","scale":"","note":"임시 연장이 반복된다는 것은 이 규정들이 아직 영구 제도로 자리 잡지 못했다는 뜻이기도 하다.","sells_to":"none"}],"notes":[{"term":"hospital-at-home waiver","ko":"재택입원 특례","plain":"원래 메디케어는 입원 진료비를 병원 건물 안에서 이뤄진 것만 인정하는데, 특례로 환자 집을 병실로 간주해 같은 값을 지급하도록 열어 둔 것이다. 코로나 때 병상이 부족해 임시로 시작했고 이후 몇 달씩 연장을 반복하고 있다. 병원 입장에서는 이 특례가 끊기면 사업 자체가 성립하지 않는다."},{"term":"telehealth waiver","ko":"원격의료 특례","plain":"메디케어는 본래 시골 거주자 등으로 원격진료 대상을 좁게 제한해 왔는데, 그 제한을 한시적으로 풀어 둔 상태다. 연장이 끊기면 지금 원격으로 진료받는 상당수 노인이 대면 방문으로 돌아가야 한다."}]},{"heading_ko":"Express Scripts, 인슐린 사건에서 FTC와 합의","heading_en":"Other Top Headlines","skip":null,"summary":"Cigna의 PBM 자회사 Express Scripts가 인슐린 값을 둘러싼 FTC 사건에서 합의했다. 투명성 강화와 함께 스위스에 두었던 구매 조직을 미국으로 되돌리기로 했다. 획기적 합의라는 평가가 붙었지만 애널리스트들은 사업에 미치는 영향을 크게 보지 않았다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Express Scripts와 FTC의 합의","what":"미국 내 인슐린 가격에 관한 사건에서 합의가 이뤄졌고, Express Scripts는 투명성 강화와 GPO 운영의 미국 이전을 포함한 변화를 시행하기로 했다.","scale":"","note":"획기적 합의로 평가받았지만 애널리스트들은 Cigna 모델에 미치는 영향을 크게 우려하지 않았다.","sells_to":"none"}],"notes":[{"term":"GPO","ko":"공동 구매 조직","plain":"PBM이 제약사와 리베이트를 협상하기 위해 따로 세운 구매 조직이다. 대형 PBM들이 이 조직을 스위스 같은 해외에 두면서, 리베이트가 얼마나 오갔는지 미국 규제 당국의 시야에서 벗어난다는 지적을 받아 왔다. 이번 합의로 그 조직을 미국으로 되가져오는 것이 핵심 변화 가운데 하나다."}]},{"heading_ko":"TrumpRx 공식 출범","heading_en":"Other Top Headlines","skip":null,"summary":"정부가 내건 약 직접 구매 창구 TrumpRx가 이번 주 공식 출범했다. 뉴스레터는 출범 사실과 함께 소비자 경험과 운영 구조를 살펴본 외부 관점이 있다는 것만 짧게 전한다.","insight":null,"signal":"약을 보험을 거치지 않고 소비자가 직접 사는 경로가 정부 차원에서 공식 창구를 갖게 됐다. 같은 회차에서 PBM 대기업 Cigna가 TrumpRx와의 협업을 실적 발표에서 강조했다는 점을 함께 놓으면, 이 경로를 업계도 무시하지 않고 있다는 뜻이다. 다만 이 회차에는 이용 규모를 보여 주는 수치가 없다.","author":[],"experts":[],"cases":[{"name":"TrumpRx","what":"이번 주 공식 출범한 정부발 약 구매 창구다. 원문은 구조를 자세히 설명하지 않고, Casey Langwith가 소비자 경험과 운영 메커니즘을 각각 살펴본 글을 공유했다는 점만 전한다.","scale":"","note":"소비자 경험을 따로 뜯어볼 만한 대상이라는 점에서 소비자를 직접 상대하는 창구다. 다만 이 회차에는 지불 구조와 이용 규모가 나오지 않는다.","sells_to":"other"}],"notes":[]},{"heading_ko":"Fair Square Medicare 인수","heading_en":"Other Top Headlines","skip":null,"summary":"Fair Square Medicare가 Alliant Insurance Services 소속 브로커리지인 Senior Market Sales에 인수됐다는 한 줄 소식이다. 노인이 메디케어 상품을 고르는 유통 경로가 계속 합쳐지고 있다는 정도로 읽으면 된다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Fair Square Medicare","what":"Alliant Insurance Services에 속한 브로커리지 Senior Market Sales에 인수됐다. 원문은 회사가 무엇을 하는지 따로 설명하지 않는다.","scale":"","note":"보험 브로커는 가입자가 아니라 보험사에게서 수수료를 받으므로, 소비자를 상대하더라도 돈을 내는 쪽은 보험사다.","sells_to":"payer"}],"notes":[{"term":"insurance brokerage","ko":"보험 브로커리지","plain":"노인이 수십 개 메디케어 상품 가운데 무엇을 고를지 상담해 주고 가입을 대행하는 회사다. 상담은 가입자에게 무료이고, 가입이 성사되면 보험사가 브로커에게 수수료를 준다. 그래서 수수료가 높은 상품 쪽으로 권유가 기울 수 있다는 점이 미국에서 반복되는 논쟁거리다."}]},{"heading_ko":"펀딩: Devoted Health 3억 6,600만 달러","heading_en":"Funding Announcements","skip":null,"summary":"앞서 다룬 Devoted Health 조달의 투자자 구성을 정리한 자리다. The Space Between과 Centricus가 주도했고 GV, VZVC, Morgan Health가 신규로 들어왔다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Devoted Health","what":"Medicare Advantage 플랜 운영사가 신규 펀딩을 조용히 발표하며 가입자 성장도 함께 공개했다.","scale":"3억 6,600만 달러, 가입자 466,000명, 전년 대비 121% 성장","note":"The Space Between과 Centricus가 라운드를 주도했고 GV, VZVC, Morgan Health가 신규 투자자로 들어왔다.","sells_to":"other"}],"notes":[]},{"heading_ko":"펀딩: Elara Caring에 DaVita가 2억 달러","heading_en":"Funding Announcements","skip":null,"summary":"홈헬스와 호스피스를 제공하는 Elara Caring이 투석 대기업 DaVita와 Ares로부터 전략적 투자를 받았다. 필자는 신장 질환 환자를 집에서 보는 시장에 대한 신호로 읽는다. Elara는 몇 해 전 부채로 구조조정을 겪은 회사다.","insight":null,"signal":null,"author":[{"claim":"DaVita의 이번 투자는 신장 케어를 위한 홈헬스 시장의 기회에 대한 흥미로운 신호로 보인다.","evidence":"DaVita가 실적 발표에서 소수 지분에 2억 달러를 투자했다고 밝힌 점을 근거로 든다."}],"experts":[],"cases":[{"name":"Elara Caring","what":"숙련 홈헬스와 호스피스, 관련 서비스를 제공하는 회사로, 투석 대기업 DaVita와 사모 운용사 Ares로부터 전략적 투자를 받았다.","scale":"DaVita가 소수 지분에 2억 달러 투자","note":"Elara는 지난 몇 년간 부채 부담 문제를 겪었고 2022년 12월 부실 구조조정을 거쳤다.","sells_to":"other"}],"notes":[{"term":"skilled home health","ko":"숙련 방문 간호","plain":"간호사나 물리치료사가 집으로 찾아가 상처 치료, 주사, 재활을 하는 서비스로, 의사 지시가 있으면 메디케어가 비용을 낸다. 청소나 식사 돌봄 같은 생활 지원과는 지불 주체가 다르다. 한국의 가정간호와 방문간호를 합친 것에 가깝다."}]},{"heading_ko":"펀딩: 폐경 케어 Midi, 1억 달러","heading_en":"Funding Announcements","skip":null,"summary":"폐경기 케어로 알려진 여성 건강 회사 Midi가 10억 달러가 넘는 밸류에이션에 1억 달러를 조달했다. 이 회차의 펀딩 가운데 소비자가 직접 이용하는 서비스로는 규모가 가장 크다. 주당 25,000명을 본다는 수치가 이 시장의 크기를 보여 준다.","insight":"폐경기 증상은 검사 수치가 아니라 본인이 느끼는 것으로 판단하므로, 기록과 되짚어 보기만으로도 값이 생기는 몇 안 되는 영역이다. 안면홍조 횟수, 밤에 깨는 횟수, 기분을 매일 몇 초 만에 남기게 하고, 이미 받고 있는 걸음·수면 데이터와 겹쳐 몇 주 단위 변화를 보여 주는 것은 3개월 안에 만들 수 있다. 치료를 권하지 않고 기록과 요약에 머무르면 허가가 필요 없다. 다만 우리 앱의 미국 사용자 가운데 40대 후반에서 50대 초반 여성이 얼마나 되는지 먼저 확인해야 한다.","signal":"폐경기 상담에 주당 25,000명이 찾아오고, 4,500만 명 이상이 보험을 통해 이 서비스를 쓸 수 있다. 검사로 확정하지 않고 본인이 느끼는 증상으로 판단하는 영역에 이만한 수요가 서 있고, 투자자는 여기에 10억 달러가 넘는 값을 매겼다.","author":[],"experts":[],"cases":[{"name":"Midi","what":"폐경기 케어로 가장 잘 알려진 여성 건강 회사로, Goodwater Capital이 주도한 라운드에서 자금을 조달했다.","scale":"1억 달러 조달, 밸류에이션 10억 달러 이상, 보험을 통해 이용 가능한 여성 4,500만 명 이상, 주당 환자 25,000명","note":"회사가 밝힌 수치이며, 보험을 통해 이용 가능하다는 것은 실제 이용자 수가 아니라 적용 대상 규모를 뜻한다.","sells_to":"mixed"}],"notes":[{"term":"menopause care","ko":"폐경기 케어","plain":"안면홍조, 수면 장애, 기분 변화처럼 폐경 전후 몇 년에 걸쳐 나타나는 증상을 다루는 진료다. 검사 한 번으로 확정하는 병이 아니라 증상으로 판단하며, 미국에서는 이 시기를 제대로 봐 주는 의사를 찾기 어렵다는 불만이 많아 전문 서비스가 따로 자랐다."}]},{"heading_ko":"펀딩: 심장내과 VBC 플랫폼 Chamber Cardio","heading_en":"Funding Announcements","skip":null,"summary":"심장내과 의사들이 성과 기반 진료 계약을 소화하도록 돕는 Chamber Cardio가 6,000만 달러를 조달했다. 필자는 CMS가 전문과 단위 성과 기반 모델에 관심을 보이는 지금 지켜볼 만한 시장이라고 본다.","insight":null,"signal":null,"author":[{"claim":"지금 CMS가 이런 모델에 관심을 보이는 만큼 스페셜티 VBC 시장의 모멘텀을 지켜볼 만하다.","evidence":"근거를 대지 않았다."}],"experts":[],"cases":[{"name":"Chamber Cardio","what":"심장내과 의사를 위한 성과 기반 진료 플랫폼으로, Frist Cressey가 주도하고 General Catalyst와 AlleyCorp 등이 참여한 라운드를 마쳤다.","scale":"6,000만 달러 조달, 500명 이상의 심장내과 의사 네트워크 지원","note":"네트워크 규모는 Fierce Healthcare가 전한 수치다.","sells_to":"provider"}],"notes":[{"term":"specialty VBC","ko":"전문과 단위 성과 기반 진료","plain":"그동안 성과 기반 진료는 주치의를 중심으로 설계돼 왔는데, 이를 심장내과나 종양내과처럼 특정 전문과에 맞춰 만드는 흐름이다. 환자 한 명의 전체 의료비가 아니라 그 질환에 드는 비용만 떼어 책임지게 하는 방식이라, 전문의도 참여할 유인이 생긴다."}]},{"heading_ko":"펀딩: 청구 심사 AI Alaffia Health","heading_en":"Funding Announcements","skip":null,"summary":"보험사가 받은 청구서를 AI로 들여다보는 Alaffia Health가 5,500만 달러를 조달했다. 고비용 시설 청구에서 평균 20% 이상을 깎는다고 회사가 밝혔다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Alaffia Health","what":"건강보험 청구 처리를 위한 AI 플랫폼으로, Transformation Capital이 주도한 라운드에서 자금을 조달했다.","scale":"5,500만 달러 조달, 고비용 시설 청구에서 평균 20% 이상 절감, 건강보험사에 5배 이상 ROI","note":"절감과 ROI 수치는 회사가 스스로 보고한 값이다.","sells_to":"payer"}],"notes":[{"term":"facility claim","ko":"시설 청구","plain":"의사 진료비와 별도로 병원 건물과 장비, 간호 인력에 대해 병원이 따로 청구하는 항목이다. 금액이 크고 항목이 많아 오류와 과다 청구가 섞여 들기 쉬워, 보험사가 사람 대신 AI로 훑는 대상이 된다."}]},{"heading_ko":"펀딩: AI 프라이머리 케어 Lotus Health AI","heading_en":"Funding Announcements","skip":null,"summary":"이 회차의 단상에서 다룬 Lotus Health AI의 조달 소식을 한 줄로 정리한 자리다. Kleiner Perkins와 CRV가 라운드를 주도했다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Lotus Health AI","what":"AI를 중심에 둔 프라이머리 케어 프로바이더로, Kleiner Perkins와 CRV가 주도한 라운드에서 자금을 조달했다.","scale":"3,600만 달러","note":"필자가 직접 가입해 본 결과는 이 회차 두 번째 꼭지에 있다.","sells_to":"mixed"}],"notes":[]},{"heading_ko":"펀딩: 행정 AI Synthpop","heading_en":"Funding Announcements","skip":null,"summary":"의료기관의 행정 업무를 다루는 AI 플랫폼 Synthpop이 1,500만 달러를 조달했다는 한 줄 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Synthpop","what":"AI 행정 플랫폼으로, Ansa Capital이 주도한 라운드에서 자금을 조달했다.","scale":"1,500만 달러","note":"","sells_to":"provider"}],"notes":[]},{"heading_ko":"펀딩: 호흡기 웰니스 Climatic","heading_en":"Funding Announcements","skip":null,"summary":"호흡기 건강을 다루는 웰니스 모델 Climatic이 1,000만 달러를 조달했다. 원문은 사업 구조나 지불 주체를 밝히지 않는다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Climatic","what":"호흡기 건강을 위한 웰니스 모델로, Lerer Hippeau가 주도한 라운드에서 자금을 조달했다.","scale":"1,000만 달러","note":"원문에는 누가 돈을 내는지, 무엇을 제공하는지가 나오지 않는다.","sells_to":"mixed"}],"notes":[]},{"heading_ko":"펀딩: Medicaid 갱신 지원 Graici","heading_en":"Funding Announcements","skip":null,"summary":"Medicaid 자격 갱신과 재판정을 지원하는 Graici가 750만 달러를 조달했다. 서류 절차 때문에 자격이 있는데도 보험을 잃는 문제가 이 회사가 붙어 있는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Graici","what":"Medicaid 갱신 및 재판정을 지원하는 플랫폼으로, Santé Ventures가 주도한 라운드에서 자금을 조달했다. 원문은 누구에게 파는지 밝히지 않는다.","scale":"750만 달러","note":"","sells_to":"other"}],"notes":[{"term":"redetermination","ko":"자격 재판정","plain":"Medicaid는 소득 기준으로 자격을 주므로 해마다 서류로 자격을 다시 확인한다. 문제는 실제로 자격이 유지되는 사람도 우편을 못 받거나 서류를 제때 내지 못해 보험을 잃는 경우가 많다는 점이다. 한국은 건강보험 자격이 자동으로 유지되므로 이런 절차 자체가 없다."}]},{"heading_ko":"읽을거리: 우리가 만든 MA, 이렇게 고쳐야 한다","heading_en":"What I'm Reading: We helped create Medicare Advantage. Here's how to fix it","skip":null,"summary":"25년 전 Medicare Advantage 제도를 설계한 두 사람이 잘못된 정책이 이 프로그램을 위험에 빠뜨린다고 주장한 글이다. 필자는 몇 년간 MA를 비판하는 목소리만 이어지던 흐름에서 옹호가 나오기 시작했다는 점을 주목한다.","insight":null,"signal":null,"author":[{"claim":"마침내 MA 프로그램의 장점을 옹호하는 사람들이 나오기 시작한 것은 주목할 만하다.","evidence":"지난 몇 년간 MA를 두들기는 정치적 논의가 많았다는 점을 근거로 든다."}],"experts":[{"who":"Donna Shalala, Tommy Thompson","role":"25년 전 오늘의 MA가 된 제도를 설계한 당사자들로, 자신들이 만든 제도의 존속을 옹호하는 위치에 있다.","claim":"잘못된 정책이 이 프로그램을 위험에 빠뜨리고 있다.","evidence":"이 회차에는 주장만 소개돼 있고 근거를 대지 않았다."}],"cases":[],"notes":[]},{"heading_ko":"읽을거리: 헬스케어의 AI, 그대로일 수도 있고 진짜를 고칠 수도 있다","heading_en":"What I'm Reading: AI in Healthcare Could Be More of the Same — Or It Could Finally Fix What Really Matters","skip":null,"summary":"저소득층을 대상으로 AI를 사려 깊게 배치하자고 주장하는 게스트 포스트다. 이 회차 두 번째 꼭지에서 필자가 인용한 문장이 이 글에서 나왔다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Andy Slavitt, Toyin Ajayi","role":"전 CMS 대행 수장이자 헬스케어 투자사 공동창업자, 그리고 저소득층 대상 케어 딜리버리 회사를 이끄는 공동창업자다. 둘 다 AI를 쓰는 케어 모델에 사업적 이해가 걸려 있다.","claim":"저소득층에 AI를 사려 깊게 배포해야 하며, 가장 강력한 결과는 임상의를 대체하는 AI가 아니라 AI로 증강된 케어에서 나온다.","evidence":"이 회차에는 한 문장만 인용돼 있고 근거를 대지 않았다."}],"cases":[],"notes":[]},{"heading_ko":"읽을거리: 고액공제 보험과 암 생존자의 사망률","heading_en":"What I'm Reading: High-Deductible Health Plans and Mortality Among Cancer Survivors","skip":null,"summary":"고액공제 건강보험 가입이 암 환자의 생존 결과 악화와 상관관계가 있다는 JAMA Network Open 연구다. 저자들은 그 통로로 재정 장벽 때문에 필요한 진료를 포기하는 행동을 지목한다. 보험이 있느냐 없느냐보다 실제로 낼 수 있느냐가 결과를 가른다는 이야기다.","insight":null,"signal":"미국에서는 보험에 들어 있어도 연간 공제액을 채우기 전까지는 진료비를 자기 돈으로 내야 한다. 이 연구는 그 부담 때문에 필요한 진료를 미루는 행동이 암 환자의 생존 결과 악화와 이어져 있을 수 있다고 본다. 미국 소비자에게 의료비 부담은 보험 가입 여부와 별개로 매번 실제 결정에 개입한다는 뜻이다.","author":[],"experts":[{"who":"Justin Barnes, Arjun Gupta, Meera Ragavan","role":"JAMA Network Open에 실린 연구의 저자들이다.","claim":"고액공제 건강보험 가입은 암 환자의 더 나쁜 생존 결과와 상관관계가 있으며, 그 원인은 재정적 장벽 때문에 필요한 의료를 포기하는 데 있을 수 있다.","evidence":"상관관계는 연구 데이터로 제시하지만, 진료 포기가 원인이라는 부분은 저자들의 추정으로 제시한다."}],"cases":[],"notes":[{"term":"HDHP (high-deductible health plan)","ko":"고액공제 건강보험","plain":"매달 내는 보험료는 싼 대신 연간 공제액을 다 채우기 전까지 진료비 전액을 본인이 내는 상품이다. 미국에서는 개인 기준 공제액이 수천 달러인 경우가 흔해, 보험이 있어도 큰 병이 아니면 실질적으로 보험 혜택을 못 받는다. 고용주가 보험료 부담을 줄이려고 이 상품을 늘려 왔고, 그래서 보험은 있는데 진료를 미루는 사람이 늘었다. 한국은 본인부담금 비율이 정해져 있고 상한제가 있어 이런 구조가 없다."}]},{"heading_ko":"읽을거리: Epic의 AI 스크라이브가 부른 논쟁","heading_en":"What I'm Reading: The Scribe That Launched a Thousand Takes","skip":null,"summary":"전자의무기록 대기업 Epic이 이번 주 내놓은 AI 스크라이브 제품과 그것이 업계에 던지는 함의를 다룬 글을 소개한다. 이 회차에는 글쓴이의 결론까지 옮겨져 있지는 않다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Epic AI 스크라이브 출시","what":"미국 병원 전자의무기록 시장을 쥐고 있는 Epic이 큰 기대를 모은 AI 스크라이브 제품을 이번 주 출시했다.","scale":"","note":"이 영역에는 이미 여러 스타트업이 자리 잡고 있어, 기반 소프트웨어 회사가 같은 기능을 내놓는 것 자체가 시장 구도를 흔든다.","sells_to":"provider"}],"notes":[{"term":"AI scribe","ko":"AI 진료 기록 도우미","plain":"진료실에서 의사와 환자의 대화를 듣고 진료 기록을 자동으로 작성해 주는 도구다. 미국 의사는 보험 청구와 소송 대비를 위해 기록을 길게 남겨야 해서 진료 시간의 상당 부분을 타자에 쓰는데, 그 부담을 덜어 준다는 점에서 가장 빠르게 퍼진 의료 AI 용도가 됐다."}]},{"heading_ko":"읽을거리: 종양내과 의사의 시대","heading_en":"What I'm Reading: What a time to be an oncologist","skip":null,"summary":"프로바이더의 관심을 돈으로 바꾸려는 접근이 무엇을 뜻하는지, 특히 종양내과 의사를 향한 업계의 관심을 놓고 쓴 글이다. 필자는 왜 의약품 도매업체들이 최근 전문 진료 기관 인수에 열심인지 생각해 볼 만하다고 덧붙인다.","insight":null,"signal":null,"author":[{"claim":"이 글이 제기하는 질문들, 특히 왜 의약품 도매업체들이 최근 스페셜티 프로바이더 인수에 그토록 관심을 보이는지에 시간을 들여 볼 만하다.","evidence":"근거를 대지 않았다."}],"experts":[{"who":"Olivia Webb Kosloff","role":"헬스케어를 다루는 필자로, 이 회차에는 소속이 밝혀져 있지 않다.","claim":"프로바이더의 관심을 수익화하려는 접근에는 따져 볼 함의가 있으며, 이번 경우에는 종양내과 의사를 향한 업계의 관심이 그 대상이다.","evidence":"이 회차에는 주장의 요지만 소개돼 있고 근거를 대지 않았다."}],"cases":[],"notes":[{"term":"drug wholesaler","ko":"의약품 도매업체","plain":"제약사에서 약을 받아 병원과 약국에 넘기는 유통 대기업이다. 항암제처럼 값비싼 약은 의사가 직접 투여하고 그 값을 청구하는 구조라, 도매업체가 종양내과 진료 기관을 사들이면 약이 흘러가는 경로 전체를 쥐게 된다. 필자가 던지는 질문의 배경이 여기에 있다."}]},{"heading_ko":"HTN 라디오 안내","heading_en":"HTN Radio","skip":"promo","summary":"뉴스레터가 자사 팟캐스트를 팟캐스트 플랫폼에서도 들을 수 있게 됐다고 알리는 자리다. 최근 에피소드 세 편의 링크가 붙어 있다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]}],"themes":["primary-care","ai-clinical","medicare-advantage","market-earnings","pharma-glp1","digital-health-funding"],"for_later":[]},{"index":"14","date":"2026-02-15","type":"reads","title_en":"Weekly Health Tech Reads 2/15/25","title_ko":"헬스케어 고용 급증과 ACCESS 요율","hook":"헬스케어만 일자리가 늘고, 보험사는 버티고 병원은 뛰고, 정부는 낮은 요율로 새 얼굴을 부른다","tldr":[{"point":"AI가 헬스케어의 낭비를 없앤다는 이야기가 넘치는 시기에 헬스케어 일자리는 오히려 1월에만 8만 2,000개가 늘었고, 필자는 이를 근거로 AI가 비용을 줄이는 게 아니라 늘리고 있다고 의심한다","note":"미국은 병원과 보험사가 서로 청구서를 주고받는 구조라서 사람 손이 많이 필요하고, 그 인건비가 곧 의료비이자 일자리다"},{"point":"같은 주 실적에서 보험사(CVS·Humana·Oscar)는 주가가 크게 안 빠진 것만으로 선방이었던 반면, 병원 사업자 Tenet과 앱 기반 근골격계 회사 Hinge는 20% 넘게 올랐다","note":"미국에서 의료비가 오르면 그 돈을 내는 보험사는 손해를 보고 그 돈을 받는 병원은 이득을 보므로, 둘의 실적은 늘 반대로 움직인다"},{"point":"정부 혁신 기구 CMMI가 새 지불 모델 ACCESS의 요율을 매우 낮게 공개했고, 필자는 이것이 기존 디지털 헬스가 아니라 AI 케어 모델과 소비자 웨어러블 회사를 Medicare로 끌어들이려는 의도라는 가설을 세운다","note":"요율이 낮으면 사람 손으로 굴러가는 기존 회사는 남는 게 없어 참여하지 않고, 원가 구조가 아예 다른 신규 진입자만 남는다"},{"point":"ACA 시장은 축소 국면에 들어가, Oscar 회원의 플랜이 Silver 71%에서 36%로 빠지고 Bronze가 39%까지 늘어 자기부담이 커졌으며, Tenet은 보조금 만료로 올해 2억 5,000만 달러를 잃고 ACA 등록자가 20% 줄 것으로 본다","note":"ACA는 직장 보험도 노인 보험도 없는 사람이 직접 사는 개인 보험 시장이고, 보험료 보조금이 끊기면 사람들이 가입 자체를 접는다"},{"point":"Humana가 프라이머리 케어 회사 MaxHealth를 약 10억 달러에 사면서 성과 기반 진료 가입자 1인당 약 1만 4,000달러를 매겼는데, 몇 년 전 Oak Street의 1인당 약 6만 6,000달러에서 크게 내려온 값이다","note":"성과 기반 진료(VBC) 회사의 몸값이 5분의 1 수준으로 내려앉았다는 뜻이며, 그만큼 이 모델에 대한 기대가 식었다"},{"point":"롱제비티 소비자 시장은 뜨거운 동시에 이미 다투는 중이다 — Bryan Johnson의 연 100만 달러 상품에 1,600명이 지원했고, D2C 회사 Function Health는 경쟁사 Superpower를 기만 광고로 고소했다","note":"롱제비티는 병을 고치는 것이 아니라 노화를 늦춘다고 파는 영역이라 보험이 돈을 내지 않고, 그래서 소비자가 자기 돈으로 사는 몇 안 되는 건강 시장이다"}],"issue_insight":{"verdict":"yes","summary":"회차의 대부분은 보험사와 병원 사이의 돈 이야기라 우리와 상관없다. 다만 앱 화면에서 바로 시험해 볼 만한 고객 문제가 네 군데 드러나고, 미국 소비자가 자기 돈을 쓰는 방향은 두 갈래로 뚜렷하다.","build":[{"title":"걷다가 아픈 사람용 짧은 운동 프로그램","detail":"Hinge Health가 파는 것이 앱으로 안내하는 근골격계 운동이다. 기기도 허가도 필요 없이 동작 안내와 통증 기록만으로 붙일 수 있고, 걷기를 줄인 유저를 골라 주는 형태가 우리 앱과 맞는다.","section":8},{"title":"다음에 무엇을 해야 하는지 알려 주는 길잡이","detail":"Solace는 환자를 대신해 의료 시스템을 헤쳐 주는 사람을 붙여 주고 10억 달러 이상의 값이 매겨졌다. 예약 전 물어볼 것, 보험 거절 시 절차 같은 안내는 소프트웨어만으로 만들 수 있다.","section":20},{"title":"의사 고르기 도우미","detail":"Garner가 푸는 문제는 미국인이 어느 의사가 좋고 싼지 모른다는 것이다. 우리에게 청구 데이터는 없으므로 추천 대신 확인 절차만 주는 선에서 시험할 수 있다.","section":21},{"title":"GLP-1 사용 중 생활 관리 화면","detail":"약을 파는 채널은 재편되고 있지만 맞는 동안의 걷기·식사·부작용 관리는 어느 채널도 앱으로 주지 않는다. 복용 여부는 자기 신고로 받고 약 자체에 대한 조언은 피하는 범위라면 3개월 안에 가능하다.","section":31}],"signal":[{"title":"자기 돈으로 내는 구간이 넓어진다","detail":"ACA 가입자의 플랜이 자기부담이 큰 쪽으로 옮겨 갔고 보조금 만료로 등록자는 20% 줄 전망이다. 보험이 덜 내주는 만큼 소비자가 직접 지갑을 여는 영역이 커진다.","section":6},{"title":"롱제비티에 실제로 돈이 몰린다","detail":"연 100만 달러 상품 지원자 1,600명, 그리고 D2C 회사끼리의 점유율 소송이 같은 주에 나왔다. 보험이 안 내주는데도 소비자가 사는 몇 안 되는 건강 영역이다.","section":13},{"title":"GLP-1은 소비자가 직접 사는 시장이다","detail":"미국 소비자는 원격진료 회사에서 GLP-1을 직접 사 왔고, 지금 바뀌는 것은 수요가 아니라 공급 경로다.","section":31}]},"sections":[{"heading_ko":"HTN Radio 팟캐스트 개시 안내","heading_en":"Introducing Health Tech Nerds Radio!","skip":"promo","summary":"뉴스레터가 자체 팟캐스트 채널 HTN Radio를 시작했다고 알리는 자리다. 최근 에피소드 세 편을 소개한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"헬스케어 고용 통계가 어긋나는 지점","heading_en":"MUSING: The incongruity of the Healthcare Jobs Report","skip":null,"summary":"미국 1월 고용 통계에서 헬스케어가 증가를 이끌었다는 사실을 놓고 필자가 자기 지론과 부딪히는 지점을 짚는 꼭지다. AI가 낭비를 없앤다면 일자리는 줄어야 하는데 반대로 가고 있다는 관찰이 요지다. 뒤로 가면 헬스케어 지출이 사실상 고용 프로그램 노릇을 하는 것 아니냐는 질문으로 이어진다.","insight":null,"signal":null,"author":[{"claim":"AI 투자가 헬스케어 비용을 줄이는 게 아니라 오히려 늘리고 있다고 의심한다.","evidence":"AI 도입과 투자가 폭증한 기간에 헬스케어 일자리가 줄기는커녕 늘었다는 1월 고용 통계를 든다."},{"claim":"헬스케어 지출이 미국 경제를 떠받치는 고용 프로그램 역할을 하고 있는지 더 깊이 따져 봐야 한다.","evidence":"나머지 경제는 약해지는데 헬스케어 고용만 꾸준히 는다는 대비를 든다. 그 이상의 근거는 대지 않았다."}],"experts":[],"cases":[{"name":"미국 노동부 1월 고용 통계","what":"1월 비농업 부문 고용이 13만 명 늘어 경제학자 예상을 웃돌았고, 헬스케어가 8만 2,000개로 증가를 이끌었다고 발표했다.","scale":"외래 5만·병원 1만 8,000·너싱 및 거주형 케어 1만 3,000, 2025년 월평균 증가는 3만 3,000","note":"2025년 평균의 두 배를 넘는 증가폭이다.","sells_to":"none"}],"notes":[{"term":"비농업 부문 고용","ko":"농업을 뺀 전체 일자리 수","plain":"미국 노동부가 매달 발표하는 대표 고용 지표다. 농업은 계절을 심하게 타서 빼고 센다. 이 숫자가 경기 판단의 기준선 노릇을 하기 때문에, 어느 산업이 증가분을 얼마나 차지했는지가 함께 주목받는다."},{"term":"외래 헬스케어 서비스","ko":"입원하지 않고 받는 진료","plain":"동네 의원, 외래 수술 센터, 검사실처럼 하룻밤 자지 않고 받는 진료를 묶은 범주다. 미국은 이 영역이 병원 입원보다 빠르게 커지고 있으며, 이번 증가분 8만 2,000개 가운데 5만 개가 여기서 나왔다."}]},{"heading_ko":"실적 총평: 보험사와 병원이 갈렸다","heading_en":"Public Company Earnings Reports","skip":null,"summary":"아래 다섯 개 실적 꼭지를 여는 총평이다. 필자는 보험사와 의료 제공자의 결과가 정반대로 갈렸다는 점을 짚는다. 개별 회사 숫자는 이어지는 꼭지에서 나온다.","insight":null,"signal":null,"author":[{"claim":"보험사에게는 주가가 크게 안 빠지는 것 자체가 승리가 된 반면 의료 제공자는 급등했고, 이 대비가 지금 시대를 잘 보여 준다.","evidence":"Tenet과 Hinge가 견조한 실적 뒤 둘 다 20%가 넘는 주가 상승을 봤다는 점을 든다."}],"experts":[],"cases":[],"notes":[{"term":"페이어와 프로바이더","ko":"돈을 내는 쪽과 진료하는 쪽","plain":"미국 헬스케어는 진료비를 내주는 보험사(페이어)와 진료를 하는 병원·의사(프로바이더)로 나뉜다. 한국은 건강보험공단 하나가 페이어 역할을 하지만 미국은 민간 보험사 수백 곳과 정부 프로그램이 뒤섞여 있다. 의료비가 오르면 페이어는 손해를 보고 프로바이더는 이득을 보므로, 두 진영의 실적은 대체로 반대로 움직인다."}]},{"heading_ko":"실적: CVS","heading_en":"Public Company Earnings Reports","skip":null,"summary":"CVS가 2024년의 부진에서 계속 회복 중이라는 실적 정리다. 필자는 CVS가 성과 기반 진료를 밀던 서사에서 보험 규율·약국 서비스·오프라인 매장 쪽으로 무게를 옮긴 것을 설득력 있다고 본다. 후반부는 CVS와 Humana가 2027년 정부 요율안을 두고 보인 태도를 놓고, CMS 입장에서 이것이 어떤 협상 신호로 읽힐지를 따져 보는 대목이다.","insight":null,"signal":null,"author":[{"claim":"지금 CVS의 서사가 설득력 있다.","evidence":"성과 기반 케어 딜리버리 강조에서 벗어나 보험 규율, 파머시 서비스 성장, 오프라인 매장 기반으로 무게중심을 옮겼다는 점을 든다."},{"claim":"보험사들이 2027 Advance Notice가 치명적이라면서도 투자자에게는 장기 영향 우려를 거의 표현하지 않는 것은, CMS 입장에서 협상 카드로 읽힐 만한 대목이다.","evidence":"CVS와 Humana가 같은 주에 같은 취지로 말한 점을 들고, 보험사들이 베네핏 레버를 당겨 마진을 지킬 것이기 때문이라고 추정한다."}],"experts":[],"cases":[{"name":"CVS Health","what":"또 한 번 견조한 분기를 보고했다. 보험(Aetna)과 PBM(Caremark), 약국 체인을 함께 굴리는 수직 통합 회사다.","scale":"","note":"PBM 규제 입법은 관리 가능한 수준으로 본다고 밝혔고, 2027 Advance Notice가 장기 가이던스에 영향을 줄 것으로 보지는 않는다고 했다.","sells_to":"mixed"}],"notes":[{"term":"PBM","ko":"약제비 관리 회사","plain":"보험사를 대신해 어떤 약을 보험 목록에 넣을지 정하고 제약사와 값을 협상하는 중간 사업자다. 한국은 정부가 약값을 정하지만 미국은 이 민간 회사들이 그 자리를 차지하고 있다. 제약사에게 받는 리베이트를 얼마나 챙기는지가 드러나지 않아 정치권의 규제 표적이 되고 있으며, CVS의 Caremark가 그 중 한 곳이다."},{"term":"2027 Advance Notice","ko":"2027년 정부 지급 요율 예고안","plain":"정부가 민간 보험사의 노인 보험 상품(Medicare Advantage)에 내년에 얼마를 줄지 미리 알리는 문서다. 정식 확정 전에 초안을 공개해 업계 의견을 받는 절차이며, 이 숫자가 보험사 수익을 좌우한다. 이번 예고안이 실제 의료비 상승 추세보다 낮게 잡혔다고 보험사들이 반발하는 중이다."}]},{"heading_ko":"실적: Humana","heading_en":"Public Company Earnings Reports","skip":null,"summary":"Humana가 노인 보험 가입자를 한 해 만에 100만 명 가까이 늘렸다는 실적 정리다. 관건은 늘어난 가입자가 돈이 되느냐인데, Humana는 신규 회원의 별점 성적이 좋아 의료비 부담을 상쇄한다고 주장한다. 필자는 그 논리를 따라가 본 뒤, 마진과 회원 수 중 무엇을 택할 것이냐는 질문에 회사가 흐릿하게 답한 대목을 문제로 짚는다.","insight":null,"signal":null,"author":[{"claim":"Humana의 승부수는 확보한 가입자의 생애 가치를 끌어내는 데 거는 베팅으로 보이며, 2027 Advance Notice가 그 앞의 큰 장애물이다.","evidence":"신규 가입자 확보 규모와 요율안이 맞물리는 구도를 든다."},{"claim":"마진과 회원 수 중 무엇을 우선하겠느냐는 애널리스트 질문에 '둘 다'로 답한 것이 이번 실적에서 가장 걸리는 대목이다.","evidence":"그 흐릿한 답을 Humana의 계리사들이 2027년 계획을 짜며 해석해야 한다는 점을 든다."}],"experts":[],"cases":[{"name":"Humana","what":"가입 신청 기간에 노인 보험 가입자를 크게 늘렸다고 보고했다. Medicare Advantage를 주력으로 하는 보험사다.","scale":"가입 기간 중 약 100만 명·20% 증가, 2026년 전체 25% 성장 전망, 신규 회원의 70%가 4스타 이상 플랜, 경쟁사 철수 플랜 이탈자 중 12%만 Humana행, 기존 유지 인구는 4스타 이상이 약 25%","note":"2026년 개인 MA 마진은 '약간 마이너스'로 보면서도, 신규와 기존 회원의 마진이 같은 수준일 것으로 본다고 했다. 개인이 플랜을 고르지만 보험료 대부분은 정부가 낸다.","sells_to":"other"}],"notes":[{"term":"MA (Medicare Advantage)","ko":"민간이 운영하는 노인 보험","plain":"미국의 65세 이상 공적 보험(Medicare)을 정부가 직접 운영하는 대신, 민간 보험사가 가입자 한 명당 정해진 금액을 정부에게 받아 대신 운영하는 방식이다. 가입자는 여러 회사의 상품 중 하나를 고르고, 회사는 받은 돈보다 의료비를 덜 쓰면 남긴다. 한국에는 대응하는 제도가 없으며, 건강보험공단이 할 일을 민간 회사가 정액을 받고 떠맡는 구조라고 보면 가깝다."},{"term":"AEP (가입 신청 기간)","ko":"노인 보험을 갈아탈 수 있는 연 1회 기간","plain":"매년 정해진 몇 주 동안만 노인 보험 상품을 바꿀 수 있다. 이 기간의 결과로 한 해 회원 수가 결정되기 때문에 보험사에게는 1년 농사에 해당한다. Humana의 100만 명 증가도 이 기간에 일어난 일이다."},{"term":"Stars (별점)","ko":"정부가 매기는 보험 상품 품질 등급","plain":"CMS가 노인 보험 상품에 별 1개에서 5개까지 등급을 매기고, 4스타 이상이면 보험사에게 보너스를 더 준다. 즉 별점은 품질 표시인 동시에 매출 항목이다. Humana가 '신규 회원의 70%가 4스타 이상 플랜에 있다'고 강조하는 이유는, 그 보너스가 신규 회원의 높은 의료비를 메워 준다고 말하기 위해서다."}]},{"heading_ko":"실적: Oscar","heading_en":"Public Company Earnings Reports","skip":null,"summary":"개인 보험 시장(ACA)에 집중한 Oscar의 실적 정리다. 회원은 크게 늘고 흑자 전환도 예고했지만, 필자는 지금 축소되는 ACA 시장에 사업이 하나뿐인 것을 축복이자 저주로 본다. 다각화 시도인 ICHRA와 브로커리지가 아직 유의미하지 않다는 점, 그리고 장기 기회는 다른 데 있다는 필자의 견해가 이어진다.","insight":null,"signal":"미국 ACA 가입자의 플랜 구성이 한 해 만에 크게 바뀌었다. Silver가 71%에서 36%로 줄고 Bronze가 25%에서 39%로 늘면서, Oscar는 회원들이 더 높은 디덕터블을 갖게 됐다고 밝혔다. 디덕터블이 높다는 것은 일정 금액까지는 보험이 아니라 본인이 직접 낸다는 뜻이므로, 미국 소비자가 자기 돈으로 의료비를 치르는 구간이 그만큼 넓어지고 있다는 신호다.","author":[{"claim":"지금 ACA 시장 상황을 보면 익스체인지에서 단일 사업만 하는 보험사가 되고 싶은 회사는 없을 것이다.","evidence":"Oscar의 다각화 시도가 계속 형태를 잡지 못하고 있다는 점을 든다."},{"claim":"2025년의 소규모 인수들이 핵심 매출 기회로 부각되는 것 자체가 Oscar의 문제를 드러낸다.","evidence":"브로커리지·등록 플랫폼을 유의미한 매출 기회로 언급했다는 점을 든다."},{"claim":"훨씬 흥미로운 장기 기회는 보험 구매 결정과 재원 조달 결정을 분리한다는 이야기 갈래에 있다.","evidence":"ACA·ICHRA·Medicare·Medicaid의 개인들이 같은 상품 구성을 사는 세계로 옮겨 가면 Oscar가 수혜를 본다는 가정을 든다."}],"experts":[{"who":"Bertolini","role":"Oscar의 이야기 갈래를 이끄는 인물로 필자가 인용한다. 원문은 직함을 밝히지 않는다.","claim":"개인의 보험 구매 결정을 재원 조달 결정과 분리해야 한다.","evidence":"근거를 대지 않았다. 필자가 그 갈래를 소개만 한다."}],"cases":[{"name":"Oscar Health","what":"2026년 ACA 회원이 크게 늘었다고 보고했다. 개인이 직접 사는 보험 상품을 파는 회사다.","scale":"2025년 4분기에서 2026년 2분기 사이 약 100만 명 증가 전망, 2026년 흑자 전환 전망, 시장 이탈은 자체 추정 20~30%의 하단, Silver 71%→36%·Gold 약 4%→25%·Bronze 25%→39%, ICHRA 회원 두 배","note":"ICHRA는 두 배가 됐지만 아직 데이터를 공유할 만큼 유의미하지 않다고 했다. 개인이 고르지만 보험료 상당 부분은 정부 보조금이 댄다.","sells_to":"other"}],"notes":[{"term":"ACA 익스체인지","ko":"개인이 직접 보험을 사는 정부 운영 장터","plain":"직장 보험도 없고 노인·저소득 보험 대상도 아닌 사람이 자기 보험을 사는 온라인 시장이다. 소득에 따라 정부가 보험료 일부를 보조해 준다. 한국은 전 국민이 자동으로 건강보험에 들지만, 미국에서는 이 시장에 스스로 찾아와 상품을 골라야 한다."},{"term":"메탈 티어 (Bronze·Silver·Gold)","ko":"보장 수준에 따른 상품 등급","plain":"같은 보험이라도 Bronze는 매달 내는 보험료가 싼 대신 병원에 갈 때 본인이 많이 내고, Gold는 반대다. Silver는 그 중간이며 저소득층 추가 지원이 붙는 등급이다. Oscar 회원이 Silver에서 Bronze·Gold로 대거 옮겨 갔다는 것은 매달 내는 돈과 아플 때 내는 돈의 균형이 바뀌었다는 뜻이다."},{"term":"디덕터블","ko":"보험이 내주기 전까지 본인이 먼저 채워야 하는 금액","plain":"예를 들어 디덕터블이 5,000달러면, 한 해 의료비가 5,000달러에 이를 때까지는 보험이 아니라 본인이 전액을 낸다. 한국의 건강보험에는 없는 개념이며, 그래서 보험이 있는 미국인도 웬만한 진료비는 자기 돈으로 치른다. 디덕터블이 높아졌다는 말은 자기 돈을 쓰는 구간이 넓어졌다는 뜻이다."},{"term":"ICHRA","ko":"회사가 돈만 주고 보험은 직원이 고르는 제도","plain":"고용주가 단체 보험을 직접 사 주는 대신, 정해진 금액을 직원에게 주고 직원이 개인 시장에서 원하는 보험을 사게 하는 방식이다. 회사는 비용을 예측할 수 있고 직원은 선택권을 얻는다. 아직 규모가 작아 이 회차에서도 '장기 기회이지만 단기에는 의미 없다'로 다뤄진다."}]},{"heading_ko":"실적: Tenet","heading_en":"Public Company Earnings Reports","skip":null,"summary":"병원과 외래 수술 센터를 함께 굴리는 Tenet의 강한 실적 정리다. 특히 외래 수술 부문의 마진이 병원 부문의 두 배를 넘는다는 점이 눈에 띈다. 마지막에 ACA 보조금 만료로 생길 손실과 무보험 인구 증가 전망이 붙는다.","insight":null,"signal":"Tenet은 ACA 보조금 만료로 올해 2억 5,000만 달러를 잃고, ACA 전체 등록자가 20% 줄면서 무보험 인구가 늘 것으로 본다. 애리조나·미시간·캘리포니아를 특히 꼽았다. 보험료가 오르자 사람들이 가입 자체를 접는다는 뜻이고, 그만큼 병원 밖에서 스스로 관리하거나 현금으로 해결해야 하는 인구가 늘어난다.","author":[{"claim":"이 성장률과 마진 수치는 병원과 외래 양쪽에서 Tenet의 접근이 갖는 힘을 보여 준다.","evidence":"외래 부문 39.2% 마진과 병원 부문 15.7% 마진을 나란히 든다."}],"experts":[],"cases":[{"name":"Tenet Healthcare","what":"또 한 번 강한 분기를 보고했다. 병원 체인과 외래 수술 센터 사업(USPI)을 함께 운영한다.","scale":"주가 주간 약 20% 상승·1년 71%·5년 350%, 2025년 조정 EBITDA 45억 7,000만 달러(연초 기대 중간값 대비 5억 달러 초과), USPI 20억 달러·전년 대비 12% 성장·4분기 마진 39.2%, 병원 부문 25억 달러·마진 15.7%","note":"ACA 보조금 만료로 올해 2억 5,000만 달러 손실과 ACA 등록자 20% 감소를 예상한다고 밝혔다.","sells_to":"payer"}],"notes":[{"term":"USPI·외래 수술 센터","ko":"입원 없이 수술만 하는 시설","plain":"하룻밤 자지 않고 당일에 수술을 받고 돌아가는 전문 시설이다. 병원보다 시설 유지비가 적어 마진이 훨씬 높으며, Tenet의 외래 부문 마진 39.2%와 병원 부문 15.7%의 차이가 그 결과다. 미국 의료가 병원에서 이쪽으로 옮겨 가는 흐름의 중심에 있다."},{"term":"inpatient-only list","ko":"입원해야만 보험 처리되는 시술 목록","plain":"정부가 '이 시술은 반드시 입원 상태에서 해야 값을 쳐준다'고 정해 둔 목록이다. 이 목록이 단계적으로 없어지면 지금까지 병원에서만 할 수 있던 시술을 외래 수술 센터에서도 할 수 있게 된다. Tenet이 이를 향후 몇 년간 외래 부문의 순풍으로 보는 이유다."},{"term":"ACA 보조금 만료","ko":"개인 보험료 지원이 끊기는 일","plain":"정부가 ACA 시장 가입자의 보험료를 대신 내주던 확대 보조금이 종료되는 상황이다. 보조금이 끊기면 개인이 내야 할 보험료가 뛰고, 일부는 보험을 아예 포기한다. 무보험자가 병원에 오면 병원은 진료비를 받지 못하므로, Tenet은 이를 2억 5,000만 달러 손실로 계산했다."}]},{"heading_ko":"실적: Hinge Health","heading_en":"Public Company Earnings Reports","skip":null,"summary":"앱으로 근골격계 통증을 관리해 주는 Hinge Health의 실적 정리다. 고용주 시장에서 빠르게 성장하면서 비용은 기술로 평탄하게 눌러 현금흐름이 크게 좋아졌다는 것이 요지다. 신규 고객 상당수가 이 종류의 서비스를 처음 도입하는 조직이라는 점과, 정신건강 확장 조짐이 마지막에 붙는다.","insight":"걷기를 멈추게 하는 흔한 이유가 무릎·허리 통증인데, Hinge가 파는 것이 바로 앱으로 안내하는 근골격계 운동이다. 기기도 규제 허가도 필요 없고 동작 안내, 통증 기록, 진행률만으로 3개월 안에 붙일 수 있다. 미국 유저 중 통증 때문에 걸음이 줄어든 사람을 골라 짧은 프로그램을 주는 형태로 시험해 볼 만하다. 다만 Hinge의 고객은 고용주이므로, 소비자가 이 값을 직접 낼지는 이 회차만으로 알 수 없다.","signal":null,"author":[{"claim":"이 결과는 Hinge가 지금 가진 모멘텀을 잘 보여 준다.","evidence":"고용주 세그먼트에서 빠르게 성장하면서 기술 투입으로 비용을 평탄하게 유지했고 잉여현금흐름 마진이 12%에서 31%로 올랐다는 점을 든다."}],"experts":[],"cases":[{"name":"Hinge Health","what":"인상적인 분기를 보고했다. 앱을 통해 근골격계 통증 관리를 제공하고 고용주에게 파는 회사다.","scale":"주가 약 21% 상승, 2025년 매출 성장률과 잉여현금흐름 합계 81%, 잉여현금흐름 마진 2024년 12%→2025년 31%","note":"고객 상당수가 디지털 근골격계 서비스를 처음 도입하는 조직이라고 밝혔다. Endpoints가 짚은 채용 공고는 정신건강 확장을 시사한다.","sells_to":"employer"}],"notes":[{"term":"MSK (근골격계)","ko":"허리·무릎·어깨 같은 통증 영역","plain":"근육과 뼈, 관절에 생기는 통증을 묶어 부르는 말이다. 미국 고용주가 부담하는 의료비 중 가장 큰 항목의 하나여서, 회사가 돈을 내고 직원에게 앱 기반 운동 프로그램을 제공하는 시장이 만들어졌다. Hinge는 이 시장에서 가장 큰 회사다."},{"term":"rule of 40","ko":"성장률과 수익성을 더해 40을 넘는지 보는 기준","plain":"소프트웨어 회사를 평가할 때 쓰는 관행적 잣대로, 매출 성장률(%)과 현금 창출 마진(%)을 더한 값이 40을 넘으면 건강하다고 본다. 빠르게 크면서 돈도 남기는지를 한 숫자로 보려는 것이다. Hinge의 81%는 그 기준의 두 배다."}]},{"heading_ko":"ACCESS 요율을 둘러싼 논의","heading_en":"The discussion around ACCESS rates","skip":null,"summary":"정부 혁신 기구 CMMI가 새 지불 모델 ACCESS의 요율을 공개했는데 업계가 너무 낮다고 반발한 사건이다. 필자는 그 반발이 예상 가능한 일이었다는 점에서 출발해, 그렇다면 CMMI는 누가 참여하기를 바라고 이 요율을 냈겠느냐를 되짚는다. 결론은 기존 디지털 헬스가 아니라 AI 케어 모델과 소비자 웨어러블 회사를 Medicare로 끌어들이려는 것이라는 필자의 가설이다. 마지막에는 이 요율 수준이 지난 10년 고용주 대상 디지털 헬스의 값어치를 정부가 어떻게 보는지 드러낸다는 해석이 붙는다.","insight":null,"signal":null,"author":[{"claim":"CMMI가 ACCESS로 밀어붙이는 것은 AI 케어 모델과 소비자 웨어러블 기업의 Medicare 진입이라는 가설이 유력하다.","evidence":"기술·AI 도입 의지, 연방 예산 절감 의지, RFK의 '모두에게 웨어러블' 구상이라는 세 갈래를 요율이 매우 낮게 나온 사실과 겹쳐 놓는다. 다만 필자 스스로 가설이라고 밝힌다."},{"claim":"이 요율은 상대적으로 건강한 시니어에게 웨어러블과 디지털 도구를 쥐여 주는 뒷문처럼 보이며, 그것이 목표라면 지지할 만하다.","evidence":"근거를 대지 않았다. 필자의 추정임을 스스로 밝힌다."},{"claim":"정부가 고용주 대상 디지털 헬스의 시세보다 현저히 낮은 요율을 택한 것은, 그 제공물의 값어치에 대한 회의를 시사한다.","evidence":"CMMI 리더십이 고용주 시장의 시세를 모를 리 없다는 점을 든다."}],"experts":[{"who":"Oz","role":"CMS 리더십을 대표하는 인물로 필자가 인용한다. 원문은 직함을 밝히지 않는다.","claim":"Trump가 Medicaid를 더 나은 재정 궤도에 올려 구했고, 미국이 나라가 딸린 헬스 시스템이 되지 않도록 하는 데 집중하고 있다.","evidence":"근거를 대지 않았다. 필자가 그의 발언 갈래를 요약해 옮긴다."},{"who":"RFK","role":"MAHA 어젠다를 이끄는 연방 보건 인사로 필자가 인용한다. 원문은 직함을 밝히지 않는다.","claim":"'모두에게 웨어러블'이 MAHA 어젠다의 핵심 축이다.","evidence":"근거를 대지 않았다."}],"cases":[{"name":"CMMI의 ACCESS 관련 발표","what":"목요일에 두 가지를 발표했다. ACCESS 모델의 지급 요율을 공개했고, 여러 주요 보험사가 유사한 성과 기반 가격 모델을 도입하기로 약속했다고 알렸다.","scale":"","note":"요율은 여러 트랙에 걸쳐 매우 낮다고 인식되며 소셜 미디어에서 뜨거운 화제가 됐다. 원문에 구체 금액은 나오지 않는다.","sells_to":"other"}],"notes":[{"term":"CMMI","ko":"정부 산하 지불 방식 실험 기구","plain":"Medicare와 Medicaid를 운영하는 정부 기관 CMS 안에 있는 조직으로, 새로운 진료비 지불 방식을 시범 사업으로 돌려 보는 곳이다. 성공하면 전국으로 확대된다. 한국으로 치면 건강보험공단이 새로운 수가 체계를 일부 지역에서 먼저 시험해 보는 것과 비슷하며, 이 기구가 정한 요율이 곧 참여 회사의 매출 단가가 된다."},{"term":"ACCESS 모델","ko":"CMMI가 새로 내놓은 지불 모델","plain":"이 회차의 주제가 되는 신규 시범 모델이다. 여러 참여 트랙으로 나뉘어 있고, 이번에 공개된 것은 그 트랙별로 정부가 얼마를 줄지에 관한 요율이다. 요율이 낮으면 사람 손이 많이 드는 기존 회사는 남는 게 없어 참여하지 않으므로, 어떤 요율을 정하느냐가 곧 누구를 부르는지를 결정한다."},{"term":"MAHA","ko":"미국을 다시 건강하게","plain":"지금 미국 연방 보건 정책의 구호로, 약과 시술보다 생활 습관과 예방을 앞세우자는 방향이다. 웨어러블 보급, 식품 규제, 만성질환 예방이 그 안에 들어간다. 이 회차에서는 정부가 왜 소비자 기기 회사를 Medicare 안으로 부르려 하겠느냐는 추론의 근거로 쓰인다."},{"term":"ACO","ko":"의료진이 모여 비용 절감분을 나눠 갖는 조직","plain":"여러 의사와 병원이 한 집단을 이뤄 담당 환자군의 총 의료비를 책임지고, 정부가 예상한 금액보다 적게 쓰면 그 차액을 나눠 받는 구조다. 지난 10년 미국 성과 기반 진료의 주된 형태였다. 본문에서 '정책학 박사 학위를 가진 이들에게 인센티브를 준다'는 비아냥은, 이 모델이 실제 진료 개선보다 제도 해석을 잘하는 쪽에 보상이 갔다는 비판이다."}]},{"heading_ko":"MA 등록 수치와 특수 플랜의 성장","heading_en":"Other Top Headlines","skip":null,"summary":"정부가 공개한 2026년 1~2월 노인 보험 등록 수치를 정리한 꼭지다. 전체 시장은 소폭 성장에 그쳤고, 성장은 특수 인구를 대상으로 한 플랜에서 나왔다는 것이 요지다. 어느 회사가 어디서 늘었는지가 이어진다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"CMS의 2026년 1~2월 MA 등록 수치 공개","what":"전체 시장은 소폭 성장했고 Humana, Devoted, SCAN, Clover가 성장을 주도했다고 나타났다.","scale":"SNP 등록 전체 약 5% 증가, 일반 MA 등록은 소폭 감소, C-SNP 14% 증가, D-SNP 4% 증가","note":"CVS는 전체적으로 회원을 잃었지만 C-SNP에서는 강한 성장을 경험한 것으로 보인다.","sells_to":"other"}],"notes":[{"term":"SNP·C-SNP·D-SNP","ko":"특수 인구 전용 노인 보험 플랜","plain":"일반 노인 보험과 달리 특정 조건에 해당하는 사람만 가입하는 상품이다. C-SNP는 당뇨나 심부전 같은 만성질환자 전용이고, D-SNP는 노인 보험과 저소득층 보험(Medicaid) 양쪽 자격을 동시에 가진 사람 전용이다. 의료비가 많이 드는 인구인 만큼 정부가 주는 금액도 커서 보험사들이 집중 공략하고 있으며, 이번 성장이 전부 여기서 나왔다."}]},{"heading_ko":"Medicaid 지출 데이터 공개와 그 반응","heading_en":"Other Top Headlines","skip":null,"summary":"정부가 7년치 저소득층 보험 지출을 진료기관별로 공개한 사건이다. 본문의 초점은 데이터 자체보다 그것을 받아든 사람들의 반응 차이에 있다. 필자는 투명성 자체는 좋다고 보면서도, 사회가 이런 데이터를 놓고 대화할 준비가 됐는지를 걱정한다.","insight":null,"signal":null,"author":[{"claim":"이런 투명성은 시스템에 좋은 일이지만, 지금 사회가 이런 대화를 감당할 역량이 되는지는 걱정스럽다.","evidence":"LinkedIn에는 사려 깊은 게시물이 드물게 있었던 반면 X에는 데이터를 근거로 사기를 지목하는 글이 쏟아졌다는 대비를 든다."}],"experts":[{"who":"Yubin Park","role":"공개 데이터를 분석해 LinkedIn에 글을 올린 인물로 필자가 소개한다. 원문은 소속을 밝히지 않는다.","claim":"여러 ABA 진료기관 사이의 성장률이 크게 엇갈리며, 왜 그런지 따져 볼 만하다.","evidence":"공개된 진료기관별 지출 데이터에서 나타난 성장률 차이를 든다."}],"cases":[{"name":"HHS / DOGE의 Medicaid 지출 데이터 공개","what":"2018년 1월부터 2024년 12월까지의 진료기관별 저소득층 보험 지출을 공개했다고 밝혔다.","scale":"7년치 데이터","note":"같은 데이터를 놓고 소셜 미디어별 반응이 크게 달랐다는 점을 필자가 짚는다.","sells_to":"other"}],"notes":[{"term":"DOGE","ko":"연방 지출을 줄이겠다는 정부 조직","plain":"정부 예산 낭비를 찾아 없애겠다는 목적으로 만들어진 조직이다. 이번처럼 정부 지출 원자료를 그대로 공개하는 방식을 자주 쓴다. 데이터가 맥락 없이 풀리면 개별 기관을 지목한 사기 의혹으로 번지기 쉽다는 것이 이 꼭지의 우려다."},{"term":"ABA","ko":"자폐 아동 행동 치료","plain":"자폐 스펙트럼 아동에게 제공하는 응용행동분석 치료로, 미국에서는 저소득층 보험이 비용을 대는 경우가 많다. 시간 단위로 청구되고 기관 수가 빠르게 늘어 지출 증가가 두드러지는 영역이라, 공개된 데이터에서 성장률 차이가 눈에 띄는 항목으로 언급된다."}]},{"heading_ko":"Humana의 MaxHealth 인수와 몸값 붕괴","heading_en":"Other Top Headlines","skip":null,"summary":"Humana가 플로리다의 프라이머리 케어 회사를 약 10억 달러에 샀다는 소식이다. 핵심은 거래 자체보다 가격이 함의하는 바에 있다. 가입자 1인당 가격을 계산해 몇 년 전 같은 종류의 거래와 비교하는 대목이 이 꼭지의 요지다.","insight":null,"signal":null,"author":[{"claim":"Humana는 밸류에이션이 크게 압축된 시장에서 공격적으로 움직이고 있다.","evidence":"MaxHealth의 VBC 가입자 1인당 약 1만 4,000달러를 Oak Street의 1인당 약 6만 6,000달러와 비교한다."}],"experts":[],"cases":[{"name":"Humana의 MaxHealth 인수","what":"플로리다 기반 프라이머리 케어 제공자를 인수한다고 발표했다. MaxHealth는 성과 기반 계약으로 노인 환자를 진료하는 의원 네트워크다.","scale":"직영·제휴 클리닉 82개, VBC 회원 8만 명 이상, 거래 규모 약 10억 달러(Bloomberg 보도), EBITDA의 약 13배(셀사이드 애널리스트 추정), 이는 EBITDA 약 7,200만 달러와 한 자릿수 중반 마진을 시사, VBC 가입자 1인당 약 1만 4,000달러","note":"몇 년 전 Oak Street은 1인당 약 6만 6,000달러에 인수됐다. 12월에는 Towerbrook과 Guidewell이 제안을 넣고 있다고 보도됐는데 Humana가 끼어든 것으로 보인다.","sells_to":"payer"}],"notes":[{"term":"EBITDA 배수","ko":"영업이익 대비 몇 배에 샀는지","plain":"회사를 살 때 그 회사가 한 해 버는 영업 현금(EBITDA)의 몇 배를 지불했는지로 비싸고 싼 것을 가늠한다. 13배라면 산 값을 그 회사 벌이로 갚는 데 13년이 걸린다는 뜻이다. 여기서는 거래액 10억 달러와 13배라는 두 숫자를 역산해 MaxHealth의 실제 벌이를 추정한다."},{"term":"VBC 가입자 1인당 가격","ko":"환자 한 명을 얼마에 샀는지","plain":"성과 기반 진료 회사의 가치를 담당 환자 수로 나눈 값이다. 이 모델에서는 환자 한 명이 곧 정부에게서 받는 연간 정액 수입이므로, 1인당 가격이 그 수입을 얼마나 값지게 보는지를 나타낸다. 1인당 6만 6,000달러에서 1만 4,000달러로 내려왔다는 것은 시장의 기대가 5분의 1 수준으로 식었다는 뜻이다."}]},{"heading_ko":"연 100만 달러짜리 롱제비티 상품","heading_en":"Other Top Headlines","skip":null,"summary":"Bryan Johnson이 연 100만 달러짜리 롱제비티 상품을 세 명에게 판다고 발표한 소식이다. 필자는 지원자 수를 매출 기회로 환산해 보면서도 그 계산을 액면 그대로 받지 말라고 단서를 단다. 아래 티어가 함께 예고돼 있다는 점이 마지막에 붙는다.","insight":null,"signal":"연 100만 달러짜리 상품에 거의 1,600명이 지원했다는 숫자는 미국에서 롱제비티에 돈을 쓰려는 사람이 얼마나 되는지 보여 준다. 필자도 대기자 명단에 지불 능력 필터가 없을 테니 걸러 들으라고 단서를 달았다. 더 눈여겨볼 대목은 같은 상품에 연 6만 달러 티어와 무료 티어가 예고돼 있다는 점인데, 롱제비티의 진입 지점이 무료까지 내려오고 있다는 뜻이다.","author":[{"claim":"지원자 수를 매출로 환산한 계산은 걸러 들어야 하지만, 지금 롱제비티를 둘러싼 흥분을 보여 주기는 한다.","evidence":"대기자 명단 등록에 지불 능력 필터가 없을 것이라는 점을 스스로 든다."}],"experts":[],"cases":[{"name":"Bryan Johnson의 Immortals","what":"연 100만 달러짜리 롱제비티 상품을 세 명에게 판다고 발표했다. 컨시어지 팀, AI 지원, 각종 검사가 포함된다. 소비자가 직접 돈을 낸다.","scale":"연 100만 달러 × 3명, 지원자 거의 1,600명(필자 환산으로 16억 달러 매출 기회), 연 6만 달러 티어와 무료 티어 예고","note":"지원자 수는 대기자 명단 등록 기준이며 지불 능력 확인이 없다는 점을 필자가 짚는다.","sells_to":"consumer"}],"notes":[]},{"heading_ko":"Harbor Health의 Rippl 인수","heading_en":"Other Top Headlines","skip":null,"summary":"텍사스에서 보험과 진료를 함께 하는 모델을 만들려는 Harbor Health가 치매 케어 스타트업을 인수한 소식이다. 필자는 이 거래의 실질이 진료 통합이 아니라 현금 확보에 가깝다고 본다. 같은 투자사가 양쪽에 들어가 있다는 점이 그 추정의 근거다.","insight":null,"signal":null,"author":[{"claim":"이 거래는 진료 통합보다 Harbor로 들어가는 현금 수혈에 가깝다.","evidence":"지분으로 Rippl을 사고 Rippl의 투자자 기반에서 현금을 받는 구조라는 점, 그리고 General Catalyst가 양쪽에 모두 들어가 있다는 점을 든다. 다만 스스로 짐작이라고 밝힌다."}],"experts":[],"cases":[{"name":"Harbor Health의 Rippl Health 인수","what":"가상 치매 케어 스타트업을 인수했다. Harbor는 텍사스에서 보험과 진료를 함께 하는 모델을 만드는 중이다.","scale":"최근 몇 달 사이 두 번째 인수, 지난 9월 VillageMD 클리닉 32곳 인수","note":"General Catalyst가 9월 Harbor의 1억 3,000만 달러 라운드를 공동 주도했고 2022년 Rippl의 시드 라운드도 주도했다.","sells_to":"other"}],"notes":[{"term":"payvidor","ko":"보험사와 진료기관을 겸하는 회사","plain":"보험(payer)과 진료(provider)를 합친 말로, 한 회사가 보험료도 받고 진료도 직접 하는 모델이다. 중간에서 청구서를 주고받는 과정이 없어져 이론상 비용이 줄지만, 진료를 덜 해 줄수록 회사가 남기는 구조라 견제가 필요하다. 미국에서는 Kaiser가 대표 사례다."}]},{"heading_ko":"수직 통합을 겨눈 초당적 법안","heading_en":"Other Top Headlines","skip":null,"summary":"성향이 정반대인 두 상원의원이 헬스케어 수직 통합을 쪼개려는 법안을 함께 발의했다. 필자는 그 정서가 왜 워싱턴에서 잘 먹히는지는 이해하면서도 무엇이 실제로 나아지는지를 묻는다. 통합 모델 전반에 미칠 영향을 우려하는 대목이 마지막이다.","insight":null,"signal":null,"author":[{"claim":"이런 입법으로 구체적으로 무엇이 나아진다고 보는지 궁금하며, Kaiser 같은 통합 케어 모델에도 광범위한 영향을 줄 가능성이 크다.","evidence":"대형 상장사를 제외하더라도 통합 모델 전반이 걸린다는 점을 든다. 그 이상의 근거는 대지 않았다."}],"experts":[],"cases":[{"name":"Break Up Big Medicine Act","what":"상원의원 Elizabeth Warren과 Josh Hawley가 발의한 법안이다. 헬스케어의 수직 통합을 제한하는 것을 목표로 한다.","scale":"","note":"양당 의원이 손을 잡았다는 점을 필자가 눈여겨본다.","sells_to":"none"}],"notes":[{"term":"수직 통합","ko":"한 회사가 보험·약국·진료를 다 갖는 것","plain":"CVS처럼 한 회사가 보험사, PBM, 약국, 의원을 모두 소유한 형태다. 자기 보험 가입자를 자기 약국과 자기 의원으로 보내 이익을 여러 단계에서 챙길 수 있어 비판을 받는다. 한국은 의약분업과 영리병원 금지로 이런 구조가 애초에 성립하지 않는다."},{"term":"Glass-Steagall Act","ko":"은행과 증권을 분리시켰던 옛 미국 법","plain":"대공황 이후 한 회사가 예금 은행업과 투자업을 동시에 하지 못하게 막은 법이다. 이 법안이 '헬스케어판 Glass-Steagall'이라 불린다는 것은, 보험과 진료 같은 서로 다른 역할을 한 회사가 겸하지 못하게 쪼개겠다는 뜻이다."}]},{"heading_ko":"D2C 롱제비티 회사끼리의 소송","heading_en":"Other Top Headlines","skip":null,"summary":"소비자에게 직접 파는 롱제비티 회사 두 곳이 기만 광고를 두고 법정에서 붙었다. 필자는 이 다툼을 시장이 커지는 신호가 아니라 모멘텀이 식는 신호로 읽는다. 그 판단의 근거가 무엇인지가 이 짧은 꼭지의 전부다.","insight":null,"signal":"잘 자본화된 D2C 롱제비티 스타트업 두 곳이 점유율을 놓고 소송까지 갔다. 소비자가 자기 돈을 내는 롱제비티 시장이 이미 다툴 만큼 자리를 잡았다는 뜻으로도, 필자처럼 열기가 식는 신호로도 읽을 수 있다. 어느 쪽이든 미국 소비자의 건강 지출에서 이 영역이 실제 자리를 차지하고 있음은 드러난다.","author":[{"claim":"이 소송은 롱제비티 시장의 모멘텀이 빠르게 식고 있다는 신호일 수 있다.","evidence":"거대한 블루 오션이어야 할 국면 초반에 잘 자본화된 두 스타트업이 점유율을 놓고 레드 오션식으로 싸운다는 점을 든다. 스스로 추측임을 밝힌다."}],"experts":[],"cases":[{"name":"Function Health의 Superpower 상대 소송","what":"기만적 광고를 주장하며 소송을 제기했다. 두 회사 모두 소비자에게 직접 파는 롱제비티 스타트업이다.","scale":"","note":"최근까지 양쪽 다 빠른 성장을 내세우던 회사들이다. 원문은 두 회사가 구체적으로 무엇을 파는지는 밝히지 않는다.","sells_to":"consumer"}],"notes":[]},{"heading_ko":"OpenEvidence와 Sutter Health 제휴","heading_en":"Other Top Headlines","skip":null,"summary":"의사용 임상 검색 도구가 대형 병원 체인의 전자의무기록 안으로 들어간다는 소식이다. 필자는 이를 자연스러운 성장 레버로 본다. 두 문장짜리 짧은 꼭지다.","insight":null,"signal":null,"author":[{"claim":"이는 OpenEvidence가 당길 만한 자연스러운 성장 레버다.","evidence":"프로바이더들 사이에서 모멘텀을 키워 가고 있다는 점을 든다."}],"experts":[],"cases":[{"name":"OpenEvidence와 Sutter Health의 제휴","what":"OpenEvidence의 임상 검색 도구를 Sutter Health 의사들이 쓰는 Epic 전자의무기록 흐름 안에 통합한다. 의사에게 파는 도구다.","scale":"","note":"","sells_to":"provider"}],"notes":[{"term":"Epic EHR","ko":"미국 병원이 가장 많이 쓰는 전자의무기록","plain":"의사가 환자 기록을 보고 처방을 넣는 화면 전체를 제공하는 소프트웨어로, 미국 대형 병원 시장의 대부분을 차지한다. 의사가 하루 종일 이 화면 안에 머물기 때문에, 새 도구가 팔리려면 이 화면 안으로 들어가는 것이 사실상 유일한 길이다."}]},{"heading_ko":"Magellan Health 매각","heading_en":"Other Top Headlines","skip":null,"summary":"사모펀드가 행동건강 회사를 인수한다는 한 줄 소식이다. 필자의 논평은 붙어 있지 않다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Madison Health Group의 Magellan Health 인수","what":"사모펀드 Madison Health Group이 행동건강 프로바이더 Magellan Health를 인수한다.","scale":"","note":"원문은 금액을 밝히지 않았다.","sells_to":"payer"}],"notes":[]},{"heading_ko":"펀딩: Talkiatry","heading_en":"Funding Announcements","skip":null,"summary":"가상 정신의학 그룹이 지분과 데트를 합쳐 4억 달러를 조달했다. 필자는 이 회사가 정신과 의사를 직접 고용해 만든 진료 조직 자체를 강점으로 본다. 병원 체인과의 리퍼럴 제휴가 그 위에 얹히는 구조다.","insight":null,"signal":null,"author":[{"claim":"동종 최고의 프로바이더 조직을 만드는 것은 언제나 이기는 전략적 수이며, Talkiatry가 하는 것이 바로 그것이다.","evidence":"정신과 의사 800명 고용과 헬스 시스템과의 리퍼럴 제휴 추진을 든다."}],"experts":[],"cases":[{"name":"Talkiatry","what":"지분 2억 1,000만 달러와 데트 퍼실리티 1억 9,000만 달러를 조달했다. 정신과 의사를 직접 고용해 원격으로 진료하는 그룹이다.","scale":"정신과 의사 800명으로 미국 정신과 의사의 거의 2%","note":"HCA를 비롯한 헬스 시스템과 통합 리퍼럴 파트너가 되기 위한 제휴를 추진 중이다. 원문은 진료비를 누가 내는지 밝히지 않는다.","sells_to":"payer"}],"notes":[]},{"heading_ko":"펀딩: Solace","heading_en":"Funding Announcements","skip":null,"summary":"환자를 대신해 의료 시스템을 헤쳐 주는 애드보커시 회사가 10억 달러 이상의 값에 자금을 조달했다. 필자는 그 필요 자체는 인정하면서도 재원을 대는 방식을 문제 삼는다. 청구 방식이 이 꼭지의 핵심 논점이다.","insight":"Solace가 파는 것은 '지금 내 상황에서 다음에 무엇을 해야 하는가'를 대신 알아봐 주는 사람이다. 그 안내 자체는 소프트웨어로 만들 수 있다. 진료 예약 전에 무엇을 물어야 하는지, 보험사가 거절했을 때 어떤 절차가 남아 있는지를 앱 안에서 단계로 보여 주는 형태다. 다만 우리는 Medicare에 청구하지 않으므로 Solace의 수익 구조는 따라갈 수 없고, 안내만 무료로 얹는 범위가 3개월 안에 가능한 선이다.","signal":null,"author":[{"claim":"재원 조달 방식이 애매하게 incident-to 빌링을 써서 추가 Medicare 달러를 확보하는 것이라면, 훈훈한 스타트업 서사보다 금융 차익거래에 가깝다.","evidence":"Solace 웹사이트의 '개시 임상의에 부수하여'라는 표현을 직접 인용한다."}],"experts":[],"cases":[{"name":"Solace","what":"10억 달러 이상 밸류에이션으로 1억 3,000만 달러를 조달했다. 환자에게 애드보킷을 붙여 의료 시스템 이용을 돕는 모델이다.","scale":"애드보킷 2,000명 이상, IVP가 라운드 주도","note":"애드보킷은 모두 1099 계약 형태의 임상 면허 보유자로 보이며, 고용된 임상의가 초기 상담을 한 뒤 실제 업무는 애드보킷이 맡는 구조로 웹사이트에 적혀 있다.","sells_to":"payer"}],"notes":[{"term":"incident-to 빌링","ko":"의사에 부수한 진료로 청구하는 방식","plain":"의사가 아닌 인력이 한 일을 의사가 한 것처럼 묶어 Medicare에 청구하는 규정이다. 원래는 의사가 세운 계획 아래 보조 인력이 이어서 하는 진료를 인정해 주려는 제도인데, 값이 더 높게 매겨지기 때문에 적용 범위를 넓게 잡으려는 유인이 생긴다. 필자가 문제 삼는 지점이 바로 그 경계다."},{"term":"1099 계약","ko":"직원이 아닌 프리랜서 계약","plain":"미국에서 개인사업자 형태로 일하는 사람에게 발급하는 세금 서식 번호에서 나온 말이다. 회사는 4대 보험이나 고정 급여를 부담하지 않고 일한 만큼만 지급한다. 애드보킷 2,000명이 모두 이 형태라는 것은, 고정비 없이 사람 수를 빠르게 늘릴 수 있는 구조라는 뜻이다."}]},{"heading_ko":"펀딩: Garner","heading_en":"Funding Announcements","skip":null,"summary":"고용주에게 의사 품질 분석을 파는 회사가 14억 달러 밸류에이션으로 자금을 조달했다. 데이터로 직원이 좋고 싼 의사를 찾도록 돕는 것이 제품이다. 필자는 이 자금이 고용주 대상 상품군 확장에 쓰일 것으로 본다.","insight":"Garner가 푸는 문제는 미국인이 어느 의사가 좋고 어느 의사가 싼지 모른다는 것이다. Garner의 답은 고용주가 가진 청구 데이터라서 우리에게는 없지만, 문제 자체는 앱 화면에서 건드릴 수 있다. 진료를 앞둔 유저에게 같은 시술의 값 차이를 확인하는 방법과 병원에 물어볼 것을 알려 주는 정도는 3개월 안에 만든다. 데이터 없이 '추천'까지 가면 근거가 없으므로, 판단을 대신하지 말고 확인 절차만 주는 선이 안전하다.","signal":null,"author":[{"claim":"Garner가 이 자금을 고용주 대상 상품군 확장에 쓸 것으로 본다.","evidence":"고용주들이 받고 있는 압박과 Garner가 만들어 내는 것으로 보이는 절감액을 든다. 스스로 추측임을 밝힌다."}],"experts":[],"cases":[{"name":"Garner","what":"14억 달러 밸류에이션으로 1억 1,800만 달러를 조달했다. 고용주에게 파는 의사 품질 분석 플랫폼으로, 직원이 질 높고 비용이 낮은 프로바이더를 찾도록 돕는다.","scale":"Kleiner Perkins가 라운드 주도, 대형 고용주들 사이에서 견조한 견인력","note":"고르는 사람은 직원이지만 도입과 지불은 회사가 한다.","sells_to":"employer"}],"notes":[]},{"heading_ko":"펀딩: Loyal","heading_en":"Funding Announcements","skip":null,"summary":"개의 수명을 늘리는 신약을 만드는 회사가 1억 달러를 조달했다. 언젠가 사람으로 확장할 계획이라고 한다. 한 줄 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Loyal","what":"1억 달러를 조달했다. 개의 롱제비티 신약을 개발하는 회사다.","scale":"Age1, Baillie Gifford 등이 투자","note":"원문은 판매 경로를 밝히지 않는다.","sells_to":"other"}],"notes":[]},{"heading_ko":"펀딩: Anterior","heading_en":"Funding Announcements","skip":null,"summary":"보험사 운영 업무를 AI로 처리하는 회사가 4,000만 달러를 조달했다. 필자는 이 회사가 기술보다 구현에 초점을 둔다고 밝힌 대목을 현명하다고 본다.","insight":null,"signal":null,"author":[{"claim":"기술보다 구현에 초점을 맞추는 것은 헬스케어에서 현명한 초점이다.","evidence":"Anterior의 보도자료 표현을 근거로 든다."}],"experts":[],"cases":[{"name":"Anterior","what":"4,000만 달러를 조달했다. 헬스 플랜(보험사)의 운영 업무를 처리하는 AI 플랫폼이다.","scale":"NEA, Sequoia, FPV, Kinnevik 참여","note":"보도자료에 따르면 Geisinger Health Plan을 고객으로 두고 HealthEdge와 통합을 진행했다.","sells_to":"payer"}],"notes":[]},{"heading_ko":"펀딩: Atlas Oncology Partners","heading_en":"Funding Announcements","skip":null,"summary":"성과 기반 종양학 플랫폼이 2,800만 달러를 조달했다. 한 줄 소식이며 필자의 논평은 없다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Atlas Oncology Partners","what":"2,800만 달러를 조달했다. 성과 기반 계약으로 암 진료를 다루는 플랫폼이다.","scale":"Flare Capital이 주도, Rubicon Founders 참여","note":"원문은 누구에게 파는지 밝히지 않는다.","sells_to":"other"}],"notes":[]},{"heading_ko":"펀딩: Somethings","heading_en":"Funding Announcements","skip":null,"summary":"10대를 또래 지지로 돕는 정신건강 모델이 1,920만 달러를 조달했다. 한 줄 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Somethings","what":"1,920만 달러를 조달했다. 10대를 대상으로 또래 지지에 기반한 정신건강 서비스를 제공한다.","scale":"Catalio Capital 주도, General Catalyst와 Tusk Ventures 참여","note":"원문은 누가 비용을 내는지 밝히지 않는다.","sells_to":"other"}],"notes":[]},{"heading_ko":"펀딩: Kyra Health","heading_en":"Funding Announcements","skip":null,"summary":"회사가 돈만 주고 직원이 보험을 직접 고르는 제도(ICHRA)를 다루는 플랫폼이 시드 자금을 조달했다. 금액은 공개하지 않았다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Kyra Health","what":"금액 비공개의 시드 펀딩을 발표했다. ICHRA를 운영하는 플랫폼이다.","scale":"FlyOver Capital과 Wavemaker 360이 주도, 벤처 스튜디오 25Madison이 인큐베이팅","note":"","sells_to":"employer"}],"notes":[]},{"heading_ko":"펀딩: Habitat Health","heading_en":"Funding Announcements","skip":null,"summary":"요양원 대신 집에서 지내도록 돕는 노인 통합 돌봄 제공자가 벤처 데트를 조달했다. 금액은 공개하지 않았다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Habitat Health","what":"Hercules Capital로부터 금액 비공개의 벤처 데트를 조달했다. PACE 프로그램을 운영하는 제공자다.","scale":"","note":"","sells_to":"payer"}],"notes":[{"term":"PACE","ko":"요양원 대신 집에서 지내게 하는 노인 통합 돌봄","plain":"요양원에 들어갈 정도로 몸이 약해진 노인이 집에 살면서 의료와 돌봄, 식사, 이동을 한 조직에서 통째로 받는 프로그램이다. 정부가 한 명당 매달 정액을 주고, 그 조직이 요양원 비용보다 적게 쓰면 남긴다. 한국의 노인장기요양보험 재가 서비스와 병원 진료를 한 회사가 묶어서 하는 형태에 가깝다."}]},{"heading_ko":"읽을거리: 디지털 헬스 15개 팀의 AI 실사용","heading_en":"What I'm Reading: Guest Post: Applied AI in healthcare - what 15 digital health teams are actually building and how","skip":null,"summary":"뉴스레터에 실린 게스트 기고를 소개하는 자리다. 디지털 헬스 스타트업이 AI를 실제로 어디에 쓰고 있는지를 다룬다. 본문에는 내용 요약이 옮겨져 있지 않고 소개 두 문장만 있다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Jacob Mulligan","role":"이 뉴스레터에 기고한 필자다. 원문은 소속을 밝히지 않는다.","claim":"디지털 헬스 스타트업의 AI 도입 현황을 15개 팀 사례로 정리했다.","evidence":"근거를 대지 않았다. 이 회차에는 글의 결론이 옮겨져 있지 않다."}],"cases":[],"notes":[]},{"heading_ko":"읽을거리: MA와 Original Medicare 비용 비교의 어려움","heading_en":"What I'm Reading: Weekly Health Policy Briefing 02/12/2025","skip":null,"summary":"정책 뉴스레터 한 편을 추천하는 자리다. 민간이 운영하는 노인 보험과 정부가 직접 운영하는 노인 보험의 비용을 비교하기가 왜 어려운지를 다룬 글이라고 소개한다. 바로 다음 꼭지의 MedPAC 이야기와 이어 읽으라는 안내가 붙는다.","insight":null,"signal":null,"author":[{"claim":"MA와 Original Medicare의 비용 비교가 어렵다는 Martin의 이번 주 관점은 특히 확인해 볼 만하다.","evidence":"다음 꼭지의 MedPAC 기사와 함께 읽을 것을 든다. 자신이 편향돼 있음을 스스로 밝힌다."}],"experts":[{"who":"Martin Cech","role":"정책 뉴스레터를 쓰는 필자이며, 이 뉴스레터 진행자와 함께 방송을 하는 동료다.","claim":"Medicare Advantage와 Original Medicare의 비용을 비교하는 일에는 구조적인 어려움이 있다.","evidence":"근거를 대지 않았다. 이 회차에는 글의 논지가 옮겨져 있지 않다."}],"cases":[],"notes":[{"term":"Original Medicare","ko":"정부가 직접 운영하는 노인 보험","plain":"민간 보험사가 대신 운영하는 Medicare Advantage와 달리, 정부가 진료 건마다 병원에 직접 값을 치르는 원래 방식이다. 두 방식은 가입자 구성과 지급 구조가 달라서 어느 쪽이 더 싸게 먹히는지를 단순 비교하기 어렵고, 그 비교가 지금 미국 정책 논쟁의 핵심이다."}]},{"heading_ko":"읽을거리: MedPAC을 겨눈 WSJ 사설","heading_en":"What I'm Reading: The Trouble with MedPAC","skip":null,"summary":"WSJ 편집위원회가 의회 자문 기구 MedPAC의 예산을 끊으라고 주장한 사설이다. 필자가 주목하는 것은 주장 자체보다 이 신문의 논조가 바뀌었다는 사실이다. 지난해 같은 신문의 연재가 미친 영향과 대비된다.","insight":null,"signal":null,"author":[{"claim":"WSJ의 논조 변화가 눈에 띈다.","evidence":"지난해 WSJ의 Medicare Inc 시리즈가 워싱턴 정치인과 일반 대중 모두에게 미친 것으로 보이는 영향을 든다."}],"experts":[{"who":"WSJ 편집위원회","role":"신문의 사설을 쓰는 조직이며, 정부의 시장 개입에 비판적인 논조를 취해 온 쪽이다.","claim":"MedPAC의 예산을 끊어야 한다. 워싱턴이 미국 헬스케어에 대한 더 많은 정부 통제를 위해 로비하는 정부 보건정책 기관을 하나 더 둘 이유가 없다.","evidence":"이 회차에는 결론 문장만 인용돼 있고, 그 근거는 옮겨져 있지 않다."}],"cases":[],"notes":[{"term":"MedPAC","ko":"의회에 Medicare 지급 수준을 자문하는 기구","plain":"노인 보험의 지급 요율이 적절한지 분석해 의회에 권고하는 독립 자문 기구다. 권고에 강제력은 없지만 의회 논의의 출발점이 되며, 민간 보험사가 정부 돈을 과하게 받고 있다는 분석을 내놓아 업계와 부딪혀 왔다. WSJ 사설은 이 기구가 정부 통제를 늘리는 쪽으로 로비한다고 본다."}]},{"heading_ko":"읽을거리: GLP-1이 제약업에 불러온 Napster 순간","heading_en":"What I'm Reading: How Ozempic Brought a Napster Moment to Big Pharma","skip":null,"summary":"WSJ 기사를 소개하는 자리다. 값싼 복제 형태의 비만 치료제를 소비자에게 직접 팔던 Hims가 역풍을 맞고 있고, 기사는 그 자리를 제약사와 손잡은 Ro가 이어받는 구도를 그린다. 음악 산업의 Napster와 iTunes에 빗댄 비유가 기사의 뼈대다.","insight":"이 꼭지는 미국에서 GLP-1을 소비자에게 직접 파는 채널이 재편되고 있다는 이야기다. 약을 어디서 사든 맞는 동안의 생활 관리는 어느 채널도 앱으로 주지 않으므로 그 자리는 비어 있다. 우리는 걷기 기록을 이미 갖고 있으니, GLP-1 사용자를 따로 묶어 근육 유지 걷기와 식사, 부작용 기록을 주는 화면은 3개월 안에 가능하다. 다만 복용 여부는 유저의 자기 신고에 기대야 하고, 약 자체에 대한 조언은 규제 영역이므로 피해야 한다.","signal":"미국 소비자는 원격진료 회사에서 GLP-1을 직접 사 왔고, 지금 바뀌는 것은 수요가 아니라 공급 경로다. 기사는 값을 낮춰 팔던 Hims가 Napster처럼 밀려나고 제약사와 관계를 맺은 Ro가 그 자리를 잇는 그림을 그린다. 소비자가 자기 돈으로 약을 사는 흐름 자체는 유지된다는 뜻이다.","author":[{"claim":"컴파운딩 GLP-1 알약 출시가 Hims에게 낙타 등을 부러뜨린 마지막 지푸라기처럼 보인다.","evidence":"역풍이 계속되고 있다는 관찰 외에 별도 근거를 대지 않았다."}],"experts":[{"who":"David Wainer","role":"WSJ에 이 기사를 쓴 기자다.","claim":"Hims는 산업을 바꿔 놓고도 결국 파산한 Napster에 해당하고, Ro는 제약사와의 관계 덕분에 더 지속 가능한 방식으로 그 자리에 들어서는 iTunes 또는 Spotify에 해당한다.","evidence":"Hims가 겪는 역풍과 Ro가 제약사와 맺은 관계를 근거로 든다."}],"cases":[{"name":"Hims","what":"컴파운딩 GLP-1 알약을 출시한 결정에서 비롯된 역풍을 계속 겪고 있다. 소비자에게 직접 파는 회사다.","scale":"","note":"기사가 Napster에 빗댄 대상이다.","sells_to":"consumer"},{"name":"Ro","what":"제약사들과의 관계를 바탕으로 Hims의 자리를 더 지속 가능한 방식으로 대체하는 쪽으로 기사에서 그려진다. 소비자에게 직접 판다.","scale":"","note":"기사의 구도이며 실제 실적 수치는 이 회차에 없다.","sells_to":"consumer"}],"notes":[{"term":"컴파운딩 GLP-1","ko":"약국이 직접 조제한 비만 치료제","plain":"제약사가 만든 완제품 대신, 조제 전문 약국이 같은 성분을 섞어 만든 형태다. 미국에서는 완제품이 품귀일 때 한시적으로 허용됐고 값이 훨씬 싸서 원격진료 회사들이 이를 소비자에게 직접 팔았다. 품귀가 풀리면 근거가 사라지고 제약사와 규제 당국의 압박을 받게 되는데, Hims가 지금 겪는 역풍이 그 대목이다."},{"term":"Napster 비유","ko":"산업을 흔들었지만 자신은 사라진 선발주자","plain":"Napster는 음악을 공짜로 주고받게 만들어 음반 산업을 뒤집었지만 소송에 밀려 파산했고, 그 수요를 합법적으로 받아낸 iTunes와 Spotify가 시장을 가져갔다. 기사는 값싼 GLP-1으로 수요를 열어젖힌 Hims를 Napster에, 제약사와 손잡은 Ro를 iTunes에 견준다."}]}],"themes":["market-earnings","medicare-advantage","aca-exchange","value-based-care","consumer-dtc","digital-health-funding"],"for_later":[]},{"index":"16","date":"2026-02-22","type":"reads","title_en":"Weekly Health Tech Reads 2/22/26","title_ko":"의료비를 깎으려던 규제의 역설","hook":"의료비를 낮추라고 만든 규제 두 건이 오히려 값을 끌어올린 한 주다.","tldr":[{"point":"Medicare가 Eliquis 가격을 56% 깎기로 한 바로 그 해에 제조사 Bristol Myers Squibb는 그 약의 매출을 2025년 144억 달러에서 약 160억 달러로 늘릴 것으로 전망했고, 늘어나는 20억 달러는 1차 협상 10개 약 전체의 절감 추정치인 15억 달러보다 크다. 필자가 인용한 분석 매체는 이를 두고 인플레이션 감축법이 Eliquis에게 일어난 가장 좋은 일일지도 모른다고 적었다.","note":"미국 약값에는 표시가와 제조사가 실제로 손에 쥐는 값이 따로 있고 그 차이를 리베이트로 메우는데, 제조사가 이 차이를 다루는 방식을 바꾸면 표시가를 깎고도 실수령액을 지킬 수 있다."},{"point":"예상치 못한 의료비 청구서로부터 소비자를 지키려고 만든 No Surprises Act의 분쟁 조정 절차를 일부 의사 그룹이 역이용하면서, 보험사 Centene은 2025년 자사 ACA 가입자의 의료비가 1% 늘었다고 밝혔고 필자는 이를 거래소 전체로 환산하면 10억~20억 달러 규모라고 추정한다.","note":"이 10억~20억 달러는 Centene 한 회사의 경험이 전체를 대표한다고 가정하고 필자가 직접 곱한 값이며, 원문도 가정임을 밝히고 있다."},{"point":"필자는 CMMI가 발표한 ACCESS 모델의 지불 요율이 업계 예상보다 낮은 것을 두고, 기존 디지털 헬스의 인건비 구조로는 셈이 맞지 않아 접근법을 바닥부터 다시 짜야 하는 수준이라고 본다. 그는 이 모델이 새 이익 풀을 만들면서 전체 비용도 낮추려면 생태계 어딘가의 이익을 줄여야 한다고 덧붙인다.","note":"CMMI는 미국 공보험을 운영하는 연방 기관 안에서 새로운 지불 방식을 시험 삼아 굴려 보는 조직이고, ACCESS는 기술로 전달하는 만성질환 관리에 값을 매기려는 시험 프로그램이다."},{"point":"소비자에게 직접 파는 헬스케어 기업 Hims가 호주 등에서 연 매출 약 4억 5,000만 달러와 고객 77만 5,000명을 가진 Eucalyptus를 최대 11억 5,000만 달러에 인수했지만, Hims 주가는 이번 주 6% 더 내려 시가총액이 약 36억 달러, 2026년 예상 매출의 약 1.5배에 머물렀다.","note":"매출의 1.5배는 성장 기업에 붙는 값으로는 매우 낮은 편이며, 시장이 이 사업의 지속성을 의심하고 있다는 뜻이다."},{"point":"정신건강 원격 상담 기업 Talkspace가 2025년 매출 2억 3,000만 달러로 22% 성장하며 주가가 20% 넘게 올랐는데, 소비자가 직접 결제한 매출은 전체의 약 6%뿐이고 나머지는 보험사와 기업 채널에서 나왔다.","note":"미국에서 개인이 상담료를 온전히 자기 돈으로 내는 일은 드물어서, 소비자 대상으로 출발한 회사도 결국 보험사와 회사를 고객으로 삼는 쪽으로 방향을 튼다."},{"point":"Scripps Health는 2024년 Medicare Advantage에서 철수해 7,500만 달러 손실이 나던 계약을 끊고 환자를 전통적 Medicare로 옮겼는데도 물량 감소가 없었다고 밝힌 반면, Cleveland Clinic은 같은 상품의 가입자를 2026년 4만 6,000명에서 2028년 12만 5,000명으로 늘리겠다고 말한다.","note":"Medicare Advantage는 민간 보험사가 정부로부터 1인당 정액을 받아 고령층 보험을 대신 운영하는 상품이며, 병원 입장에서는 지급 조건이 까다로워 손익이 갈린다."}],"issue_insight":{"verdict":"yes","summary":"이번 회차의 스물다섯 꼭지 가운데 스물세 꼭지는 규제 당국과 보험사, 병원 사이에서 오가는 돈 이야기여서 B2C 앱 화면으로 옮길 것이 없다. 미국 소비자가 자기 지갑으로 등장하는 자리는 두 곳뿐인데, 두 곳이 정확히 반대 방향을 가리킨다는 점이 이번 주에 건질 것이다.","build":[{"title":"정신건강 자가 선별 체크인","detail":"Talkspace가 AI로 하고 있다고 밝힌 일은 치료가 아니라 도움이 필요한 사람을 찾아내는 식별 단계이며, 이 단계는 검증된 자가 응답 문항과 결과 안내만으로 이뤄져 소프트웨어 인력만으로 3개월 안에 붙일 수 있다. 진단이나 치료를 주장하지 않고 본인 상태를 정리해 보여 주는 형태로 묶어 두는 것이 관건이다.","section":7}],"signal":[{"title":"정신건강에서 소비자가 직접 내는 돈은 매출의 6%로 줄었다","detail":"Talkspace는 소비자 중심 모델로 출발했지만 이번 분기 소비자 매출이 전체의 약 6%에 그쳤고, 회사는 보험사와 기업 채널을 우선하고 있다. 미국에서 정신건강 서비스를 개인에게 직접 팔아 매출을 세우기는 어렵다는 뜻이다.","section":7},{"title":"소비자가 자기 돈으로 사는 D2C 헬스케어는 규모는 있으나 값이 매겨지지 않는다","detail":"Eucalyptus는 호주 등에서 고객 77만 5,000명과 연 매출 약 4억 5,000만 달러를 쌓아 소비자 직접 결제 시장이 실재함을 보여 주지만, 인수자인 Hims는 2026년 예상 매출의 약 1.5배에 거래되고 개인 투자자마저 등을 돌리고 있다. 소비자가 돈을 낸다는 사실만으로는 사업이 인정받지 못한다.","section":11}]},"sections":[{"heading_ko":"이번 주 단상: 의료비를 낮추려는 규제의 기이한 역학","heading_en":"MUSING: The peculiar dynamics of deflationary regulation in healthcare","skip":null,"summary":"이번 회차의 중심 글을 여는 짧은 도입부다. 필자는 의료비 지출을 실제로 줄인다면 어떤 모습일지를 묻고, 그 답을 찾기 위해 최근 규제 시도 세 건을 차례로 뜯어보겠다고 예고한다. 세 건은 약값을 협상하게 한 IRA, 예상치 못한 청구서를 막으려던 NSA, 기술로 전달하는 케어에 값을 매기려는 ACCESS다. 뒤따르는 세 꼭지가 각각 이 셋을 다룬다.","insight":null,"signal":null,"author":[{"claim":"의료비를 낮추려는 규제 시도 세 건의 소식이 같은 주에 겹쳐 나왔고, 이를 하나씩 뜯어볼 만하다.","evidence":"IRA, NSA, ACCESS 세 건이 모두 이번 주에 뉴스가 됐다는 사실만 들었을 뿐, 도입부에서 별도의 근거를 대지는 않았다."}],"experts":[],"cases":[],"notes":[]},{"heading_ko":"인플레이션 감축법과 약값","heading_en":"The Inflation Reduction Act and drug costs","skip":null,"summary":"미국이 사상 처음으로 공보험이 제약사와 약값을 직접 협상하게 만든 제도가 첫 결과를 낸 자리다. 협상 대상 1호 격이던 항응고제 Eliquis는 56% 인하에 합의했는데, 정작 제조사는 같은 해 그 약의 매출이 늘어날 것이라고 발표했다. 필자는 왜 이런 일이 가능한지를 표시가와 실수령가의 차이에서 찾는다. 규제가 아니라 특허 만료에 따른 경쟁이 결국 값을 떨어뜨릴 것이라는 대비가 이 꼭지의 결론이다.","insight":null,"signal":null,"author":[{"claim":"가격이 56% 깎이는 해에 그 약의 매출이 오히려 20억 달러 늘어나는 것은 이상한 결과다.","evidence":"Bristol Myers Squibb 실적 발표의 2026년 Eliquis 매출 10~15% 성장 전망, 2025년 144억 달러에서 약 160억 달러로 늘어난다는 계산, 그리고 1차 10개 약 협상의 2026년 절감 추정치 15억 달러를 나란히 놓았다."},{"claim":"매출 성장의 원인은 물량 증가가 아니라 제조사가 표시가와 실수령가의 차이를 다루는 방식을 바꾼 데 있는 것으로 보인다.","evidence":"이 역학을 짚은 기사를 인용했으며, Medicaid에서 Eliquis 가격을 0으로 낮춘 조치가 오히려 수익성에 보탬이 된다는 사례를 들었다. 다만 그 인플레이션 리베이트 역학을 자신이 온전히 이해했다고 말하기 어렵다고 스스로 밝혔다."},{"claim":"Eliquis 매출을 결국 0에 가깝게 끌어내리는 것은 규제가 아니라 경쟁이다.","evidence":"미국 외 지역 특허 만료로 2027년 매출이 감소하고 2030년이면 거의 0에 가까워진다는 애널리스트 논의를 근거로 들었다."}],"experts":[{"who":"Citeline","role":"제약 산업 정보와 분석을 다루는 매체이며, 이번 사안에서 이해관계 당사자는 아니다.","claim":"모든 것을 감안할 때 인플레이션 감축법은 Eliquis에게 일어난 가장 좋은 일일지도 모른다.","evidence":"필자는 이 문장만 인용했고, 그 근거로는 같은 매체가 짚은 표시가와 실수령가 차이의 변화를 함께 소개했다."}],"cases":[{"name":"IRA 1차 약가 협상","what":"Medicare가 지출이 큰 약 10개를 골라 제조사와 값을 협상했고, 새 가격이 2026년부터 적용된다. Eliquis도 그 10개 안에 들었다.","scale":"Eliquis 2023년 매출 122억 달러, 인하율 56%, 10개 약 합산 2026년 고령층 지출 절감 추정 15억 달러","note":"인하율만 보면 큰 승리처럼 보이지만, 절감 추정치가 한 약의 매출 증가분보다 작다는 대비가 이 꼭지 전체의 논지다.","sells_to":"none"},{"name":"Bristol Myers Squibb의 Eliquis 매출 전망","what":"Eliquis를 만드는 제약사가 실적 발표에서 2026년 이 약의 매출이 10~15% 성장할 것이라고 밝혔다.","scale":"2025년 144억 달러에서 2026년 약 160억 달러, 발표 후 몇 주간 주가 약 10% 상승","note":"Medicaid에서 이 약의 가격을 무상으로 낮추는 데 동의한 조치가 오히려 회사 수익성에 보탬이 된다고 원문은 전한다.","sells_to":"payer"}],"notes":[{"term":"Medicare","ko":"메디케어, 65세 이상 대상 연방 공적 보험","plain":"미국에는 전국민이 함께 드는 건강보험이 없고, 65세 이상과 일부 장애인만 연방 정부가 운영하는 Medicare에 들어간다. 그 아래 세대는 대부분 직장이나 개인 가입으로 민간 보험을 산다. 가입자가 수천만 명이라 정부가 사는 약의 물량이 매우 크며, 이 물량이 협상력의 근거로 거론된다. 한국의 건강보험공단이 전 국민을 담당하는 것과 달리 미국은 고령층만 담당한다고 보면 된다."},{"term":"IRA(인플레이션 감축법) 약가 협상","ko":"메디케어가 제약사와 약값을 직접 협상하게 한 2022년 법","plain":"그전까지 미국 법은 Medicare가 제약사와 약값을 협상하는 것을 아예 금지했고, 값은 제조사가 정한 대로 따라갔다. 2022년 이 법이 그 금지를 풀어 지출이 큰 약부터 순서대로 협상 대상에 올리게 했다. 1차로 10개 약이 지정됐고 협상된 가격은 2026년부터 적용된다. 한국의 약가 협상과 비슷한 절차가 미국에서는 이제야 시작된 셈이다."},{"term":"Medicaid","ko":"메디케이드, 저소득층 대상 공적 보험","plain":"연방 정부와 주 정부가 함께 돈을 대어 저소득층에게 제공하는 보험이다. Medicare가 나이로 대상을 가른다면 Medicaid는 소득으로 가른다. 제약사는 Medicaid에 약을 팔 때 법으로 정해진 리베이트를 내야 하는데, 이 계산 방식 때문에 표시가를 낮추는 것이 오히려 제조사에 유리해지는 경우가 생긴다. 이번 꼭지에서 필자가 이해하기 어렵다고 적은 대목이 바로 이 부분이다."},{"term":"list-to-net(표시가와 실수령가의 차이)","ko":"표시가와 제조사 실수령가의 차이","plain":"미국 약값은 제조사가 붙인 표시가와 제조사가 실제로 손에 쥐는 값이 크게 다르다. 그 사이에서 보험사와 약제비 관리 회사가 리베이트를 받아 가기 때문이다. 그래서 표시가를 깎아도 리베이트 구조를 함께 손보면 제조사의 실수령액은 오히려 늘어날 수 있다. 값을 깎았는데 매출이 늘어난 이번 사례가 여기에서 나온다."}]},{"heading_ko":"No Surprises Act와 네트워크 외 청구","heading_en":"The No Surprises Act & provider OON billing","skip":null,"summary":"예상치 못한 의료비 청구서로부터 환자를 보호하려고 만든 법이 몇 년 만에 어떻게 역이용되고 있는지를 다룬다. 이 법은 환자와 의사가 값을 두고 다투는 대신 의사와 보험사가 중재 절차에서 값을 정하게 했는데, 사모펀드가 투자한 의사 그룹들이 그 절차를 자기들에게 유리하게 굴리는 법을 익혔다. 보험사 Centene의 실적 발표 수치가 그 규모를 처음으로 드러냈다. 필자는 여기서 가격 투명성이라는 목표 자체에 대한 회의를 덧붙인다.","insight":null,"signal":null,"author":[{"claim":"비용을 줄이도록 설계된 법이 업계에 한 수 밀려 오히려 비용을 끌어올린 또 하나의 사례다.","evidence":"초기에는 이 법이 Envision과 American Physician Partners를 파산으로 몰아넣는 성과를 냈지만, 몇 년 뒤 다른 사모펀드 지원 그룹들이 중재 절차를 유리하게 쓰는 법을 알아냈다는 흐름을 근거로 들었다."},{"claim":"중재 절차가 2025년 ACA 거래소의 의료비를 10억~20억 달러 늘리고 있는 것으로 보인다.","evidence":"Centene이 밝힌 자사 ACA 인구 의료비 1% 증가를 전체 거래소 인구에 그대로 적용해 환산한 값이며, 필자 스스로 그 가정 위에 선 추정임을 밝혔다."},{"claim":"의료 제공자 가격 투명성은 목표는 고귀하지만 실제로는 의사 그룹이 더 많이 청구하게 만드는 기제다.","evidence":"역사적으로 낮은 값을 받아 온 제공자가 공개된 값을 보고 요율을 끌어올리면 시장 전체가 위로 당겨진다는 설명을 붙였으나, 중재 절차가 시사하는 바라고만 적었을 뿐 별도 데이터는 대지 않았다."}],"experts":[{"who":"Centene","role":"ACA 거래소 가입자를 많이 보유한 상장 보험사이며, 의사 그룹에 돈을 덜 지급할수록 이익이 커지는 쪽이다.","claim":"의료 제공자들이 중재 절차를 남용하는 탓에 2025년 자사 ACA 인구의 의료비가 1% 늘고 있으며, 그 결과 일부 제공자를 상대로 소송을 시작하고 있다.","evidence":"가장 최근 실적 발표에서 밝힌 수치이며, 어떻게 1%를 산출했는지 구체적인 계산은 원문에 실리지 않았다."}],"cases":[{"name":"No Surprises Act와 독립 분쟁 해결 절차","what":"네트워크 외 의사가 환자에게 직접 큰 금액을 청구하지 못하게 막고, 의사와 보험사가 중립 심판을 통해 값을 정하게 한 제도다.","scale":"필자 추정으로 2025년 거래소 의료비 증가 10억~20억 달러","note":"환자를 보호하는 데는 성공했지만, 값을 정하는 자리가 환자에게서 중재 절차로 옮겨졌을 뿐 값 자체는 오히려 올랐다는 것이 이 꼭지의 요지다.","sells_to":"none"},{"name":"Envision과 American Physician Partners","what":"네트워크 외 청구 전술을 쓰던 사모펀드 지원 의사 인력 그룹으로, 병원에 응급실 의료진 등을 공급했다. 이 법이 시행된 초기에 파산했다.","scale":"","note":"같은 법이 초기에는 이런 회사들을 무너뜨렸다는 사실이, 뒤이어 다른 그룹들이 우회로를 찾아냈다는 대목과 대비를 이룬다.","sells_to":"provider"},{"name":"Lawson Mansell 초청 대화 예고","what":"이 법과 중재 절차에 대해 여러 차례 글을 쓴 Niskanen Center의 보건정책 애널리스트를 목요일 커뮤니티 대화에 초대한다는 안내다.","scale":"","note":"이 꼭지에서 그의 주장은 아직 소개되지 않았고 예고만 실렸다.","sells_to":"none"}],"notes":[{"term":"네트워크 외 진료(out-of-network)","ko":"내 보험사와 계약이 없는 병원이나 의사에게 받은 진료","plain":"미국 보험사는 병원과 의사를 하나씩 찾아다니며 개별 계약을 맺어 자기 네트워크를 만든다. 그 안에서 진료를 받으면 미리 합의된 값이 적용되지만, 밖에서 받으면 합의된 값이 없어 의사가 부르는 대로 청구서가 날아온다. 문제는 환자가 고른 병원이 네트워크 안이어도 그날 당직 응급의나 마취과 의사만 네트워크 밖인 경우가 흔하다는 점이다. 한국은 어느 병원에 가도 같은 수가가 적용되므로 이런 상황 자체가 없다."},{"term":"No Surprises Act(NSA)","ko":"예상치 못한 청구서 금지법","plain":"환자가 고를 수 없었던 상황에서 네트워크 밖 의사에게 진료를 받았을 때, 그 차액을 환자에게 청구하지 못하게 막은 2022년 시행 법이다. 환자는 네트워크 안에서 받았을 때와 같은 본인 부담만 내고, 나머지 금액을 두고는 의사와 보험사가 따로 다툰다. 돈의 흐름에서 환자를 빼내고 그 자리에 중재 절차를 넣은 셈이다. 말썽은 그 중재 절차에서 정해지는 값이 예상보다 훨씬 높게 나온다는 데서 생겼다."},{"term":"IDR(독립 분쟁 해결 절차)","ko":"의사와 보험사가 값을 다투는 중재 절차","plain":"의사와 보험사가 각자 적정하다고 생각하는 금액을 써내면 중립 심판이 둘 중 하나를 통째로 고르는 방식이다. 중간값으로 절충하지 않고 한쪽을 그대로 채택하기 때문에, 어느 쪽이 더 그럴듯한 근거를 붙여 높은 값을 써내느냐가 승패를 가른다. 이 구조를 익힌 의사 그룹이 반복해서 절차를 걸면 평균 지급액이 올라간다. 이번 꼭지에서 남용이라고 부르는 것이 이 반복 신청이다."},{"term":"ACA 거래소(exchange)","ko":"직장 보험이 없는 사람이 개인 보험을 사는 정부 운영 장터","plain":"직장에서 보험을 주지 않고 공적 보험 대상도 아닌 사람이 개인 자격으로 민간 보험을 고르는 온라인 장터다. 2010년 오바마케어로 만들어졌고, 소득에 따라 연방 보조금이 붙는다. 여기서 팔리는 상품의 의료비가 오르면 이듬해 보험료와 보조금이 함께 오르므로, 중재 절차로 늘어난 비용은 결국 가입자와 연방 예산이 나눠 진다."}]},{"heading_ko":"ACCESS 모델과 디지털 헬스에 주는 함의","heading_en":"The implications for ACCESS & digital health","skip":null,"summary":"앞의 두 사례를 발판 삼아 세 번째 규제 시도를 다루는 꼭지다. ACCESS는 기술로 전달하는 케어를 장려해 의료비를 낮추겠다는 새 지불 프로그램인데, 발표된 지불 요율이 업계 예상보다 낮았다. 필자는 이 모델을 설계한 정부 쪽 당사자와 나눈 대화를 소개한 뒤, 요율이 낮은 것이 실수가 아니라 의도라고 읽는다. 그래서 기존 디지털 헬스 위에 얹는 방식으로는 셈이 맞지 않고 접근법을 바닥부터 다시 짜야 한다는 것이 이 꼭지의 핵심 주장이다.","insight":null,"signal":null,"author":[{"claim":"ACCESS는 더 많은 경쟁을 불러들이고 디지털 헬스 전체 시장을 키울 기회를 만들고 있으나, 오늘날과는 근본적으로 다른 비용 구조 위에서다.","evidence":"성공할 경우 참여자들에게 연간 수십억 달러 매출의 새 이익 풀이 생긴다는 자신의 추정과, 발표된 요율이 업계 예상보다 낮았다는 사실을 근거로 들었다."},{"claim":"요율은 의료비에 디플레이션 효과를 내도록 의도적으로 낮게 설정된 것으로 보이며, 전통적 접근법의 인건비로는 셈이 맞지 않는다.","evidence":"요율이 낮다는 사실을 들었을 뿐 구체적인 금액이나 원가 계산은 제시하지 않았다."},{"claim":"ACCESS가 새 이익 풀을 만들면서 전체 비용도 낮추는 데 성공하려면 생태계의 다른 어딘가에서 이익을 줄여야 한다.","evidence":"앞서 다룬 IRA와 NSA에서 기존 이익 풀이 끈질기게 방어된 사례를 근거로 들었다."},{"claim":"규제 당국이 이런 시도를 하는 것 자체는 좋은 일이며, 날이 갈수록 ACCESS에 더 흥미를 느끼고 있다.","evidence":"험난한 싸움이 될 것이라는 전망은 덧붙였으나 이 판단 자체에는 근거를 대지 않았다."}],"experts":[{"who":"Jacob Shiff","role":"이 모델을 만든 연방 기관 CMMI의 Chief AI & Technology Officer로, 프로그램을 알리고 참여자를 모아야 하는 쪽이다.","claim":"ACCESS는 Medicare 인구의 넓은 층에게 고품질이면서 비용 효율적인 케어에 대한 접근성을 개선하려는 것이며, 기술로 의료를 더 나은 재정 궤도에 올리려는 행정부의 큰 흐름과 맞닿아 있다.","evidence":"팟캐스트 대화에서 그가 그린 비전을 필자가 요약한 것이며, 뉴스레터 본문에는 그의 발언 자체나 뒷받침하는 수치가 옮겨지지 않았다."}],"cases":[{"name":"CMMI ACCESS Model","what":"기술 기반 케어의 도입을 장려해 Medicare 인구의 의료비를 낮추려는 새 지불 프로그램으로, 지난주 지불 요율이 발표됐다.","scale":"성공 시 참여자들에게 연간 수십억 달러 규모의 새 이익 풀(필자 추정)","note":"필자는 CMMI가 이 프로그램의 일부로 공개할 참여자 성과 데이터를 지켜볼 만하다고 짚는다. 앞선 중재 절차에서 데이터가 보이자 무슨 일이 벌어지는지 드러난 것과 같은 이유다.","sells_to":"none"}],"notes":[{"term":"CMMI","ko":"메디케어·메디케이드 혁신 센터","plain":"미국 공보험을 운영하는 연방 기관 안에 있는 조직으로, 새로운 지불 방식을 정식 제도로 만들기 전에 시험 삼아 굴려 보는 일을 한다. 기존 방식은 진료 행위 하나하나에 값을 매겨 지급하는 것이었는데, 이 조직은 결과나 총액을 기준으로 지급하는 방식들을 실험한다. 여기서 값이 매겨지면 그 순간 그 서비스가 사업이 되므로, 어떤 요율을 발표하느냐가 곧 새 시장의 크기를 정한다."},{"term":"ACCESS 모델","ko":"기술로 전달하는 케어에 값을 매기는 시험 프로그램","plain":"만성질환을 앓는 Medicare 가입자에게 기술을 활용한 관리를 제공하면 정부가 값을 지급하는 방식이다. 전에는 이런 관리가 대체로 무료 부가 서비스이거나 아예 지급 대상이 아니었다. 요율을 낮게 잡았다는 것은 사람이 전화를 걸어 관리하는 기존 방식으로는 남는 것이 없고, 소프트웨어가 대부분을 처리하는 회사만 셈이 맞는다는 뜻이다. 그래서 기존 업계의 반발과 진료 품질 논란이 따라올 것이라고 필자는 내다본다."}]},{"heading_ko":"이번 주 상장사 실적 안내","heading_en":"Public Markets","skip":"admin","summary":"실적 발표가 비교적 조용한 한 주였고 다음 주에 훨씬 많은 발표가 예정돼 있다는 안내다. 뒤이어 이번 주 주요 실적 세 건을 소개한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"GRAIL, 대규모 연구 목표 미달로 주가 반토막","heading_en":"Public Markets","skip":null,"summary":"혈액을 한 번 뽑아 여러 종류의 암을 조기에 찾아내겠다는 검사를 만드는 회사가 영국 공공 의료 체계와 함께 진행한 대규모 연구에서 미리 정해 둔 목표를 채우지 못했다고 발표했다. 경영진은 초기 단계 암을 더 많이 찾아냈다는 부분을 강조했지만 주가는 하루에 절반이 날아갔다. 미리 정한 목표를 못 채우면 나머지 결과가 아무리 좋아도 설득력이 떨어지는 임상 연구의 규칙이 그대로 드러난 사례다.","insight":null,"signal":null,"author":[],"experts":[{"who":"GRAIL 경영진","role":"이 검사를 파는 회사의 경영진으로, 결과를 최대한 긍정적으로 해석해야 할 위치에 있다.","claim":"초기 단계 암을 더 많이 찾아내고 후기 단계 암 진단을 줄인 결과에 대해서는 여전히 낙관적이다.","evidence":"연구에서 관찰된 초기·후기 단계 진단 변화를 들었으나, 미리 정해 둔 1차 평가변수를 채우지 못했다는 사실은 그대로 인정했다."}],"cases":[{"name":"GRAIL","what":"암 선별 검사 Galleri를 만드는 회사로, 실적을 발표하면서 영국 국가보건서비스와 진행해 온 대규모 연구가 1차 평가변수를 충족하지 못했다고 밝혔다.","scale":"금요일 주가 50% 하락","note":"투자자들이 우려한 것은 연구 결과 자체보다 영국과 미국에서의 상업적 파장이었다.","sells_to":"payer"}],"notes":[{"term":"1차 평가변수(primary endpoint)","ko":"연구를 시작하기 전에 못 박아 둔 성공 기준","plain":"임상 연구는 시작하기 전에 무엇을 얼마나 개선하면 성공으로 볼지를 미리 정해 공개한다. 나중에 결과를 보고 유리한 항목을 골라 성공이라고 주장하는 것을 막기 위해서다. 이 기준을 못 채우면 다른 항목에서 좋은 결과가 나와도 정식 근거로 인정받기 어렵고, 규제 승인과 보험 적용 논의도 함께 막힌다. 이번에 경영진이 강조한 초기 단계 암 발견은 그 미리 정한 기준이 아니었다."},{"term":"NHS(영국 국가보건서비스)","ko":"영국의 공공 의료 체계","plain":"영국 정부가 세금으로 운영하는 의료 체계로, 국민 대부분이 여기서 진료를 받는다. 검사 회사 입장에서는 여기에 채택되면 한 번에 전국 물량을 얻는 셈이라 가장 중요한 고객이다. 반대로 여기서 진행한 연구가 목표를 못 채우면 그 물량 전체가 흔들린다. 한국의 건강보험 급여 등재와 비슷한 무게를 가진 관문이다."}]},{"heading_ko":"Talkspace, 소비자에서 기업·보험사로 방향을 틀다","heading_en":"Public Markets","skip":null,"summary":"정신건강 원격 상담으로 출발한 회사가 소비자 직접 판매에서 보험사와 기업 채널로 무게중심을 옮기면서 실적이 좋아졌다는 소식이다. 이번 분기 소비자 매출은 전체의 약 6%에 그쳤다. 실적 발표에서 회사가 강조한 것은 AI로 임상의 한 사람이 감당하는 범위를 넓히는 방식이었다. 소비자가 직접 돈을 내는 정신건강 시장이 미국에서 어떤 크기인지를 가늠할 수 있는 자리다.","insight":"Talkspace가 AI로 하고 있다고 밝힌 일은 상담 자체가 아니라 정신건강 지원이 필요한 사람을 더 많이 찾아내는 식별 단계다. 이 단계는 검증된 자가 응답 문항과 결과 정리 화면만으로 이뤄지므로 소프트웨어 인력만으로 3개월 안에 붙일 수 있고, 걸음과 수면처럼 이미 받고 있는 데이터와 함께 놓으면 본인 상태의 변화를 보여 주는 화면으로 확장된다. 진단이나 치료를 주장하지 않고 본인이 자기 상태를 정리해 보는 형태로 범위를 묶어 두는 것이 관건이다.","signal":"소비자 중심 모델로 출발한 회사인데도 이번 분기 소비자 매출이 전체의 약 6%에 그쳤고, 회사는 보험사와 기업 채널을 우선하고 있다고 명시했다. 미국에서 정신건강 서비스를 개인에게 직접 팔아 매출을 세우기는 어렵다는 뜻이며, 반대로 개인은 자기 돈을 내지 않고도 쓸 수 있는 창구를 찾고 있다는 뜻이기도 하다.","author":[{"claim":"사업이 전환점을 도는 것으로 보인다.","evidence":"2025년 매출 2억 3,000만 달러로 전년 대비 22% 증가, 조정 EBITDA 마진 7% 달성, 주가 20% 이상 상승을 근거로 들었다."}],"experts":[{"who":"Talkspace 경영진","role":"AI로 임상의의 도달 범위를 넓힌다고 말하는 당사자 회사의 경영진이며, AI가 수요를 줄이지 않는다고 설명해야 할 위치에 있다.","claim":"AI로 정신건강 지원이 필요한 사람이 더 많이 식별되면서 치료사 수요도 함께 늘어날 것이다.","evidence":"실적 발표에서 밝힌 기대일 뿐, 이를 뒷받침하는 수치는 원문에 실리지 않았다."}],"cases":[{"name":"Talkspace","what":"정신건강 원격 상담 기업으로, 소비자 중심 모델에서 보험사와 기업을 상대하는 모델로 전환하고 있다.","scale":"2025년 매출 2억 3,000만 달러(전년 대비 22% 증가), 조정 EBITDA 마진 7%, 2026년 말 분기 마진 10%대 중반 전망, 소비자 매출 비중 약 6%","note":"소비자 매출 비중 6%라는 숫자가 이 회사의 전환이 얼마나 멀리 갔는지를 보여 준다.","sells_to":"mixed"}],"notes":[{"term":"지급자(payer)","ko":"의료비를 실제로 지급하는 쪽, 곧 보험사와 정부 프로그램","plain":"미국 헬스케어 글에서 지급자는 보험사, 그리고 Medicare와 Medicaid 같은 정부 프로그램을 함께 가리키는 말이다. 환자가 진료를 받아도 돈은 대부분 이쪽에서 나오기 때문에, 미국에서 제품을 판다는 것은 환자가 아니라 이쪽을 설득한다는 뜻인 경우가 많다. 한국에서는 건강보험공단 하나가 이 자리를 차지하지만 미국에는 수백 곳이 있어 각각을 따로 설득해야 한다."},{"term":"조정 EBITDA 마진","ko":"일회성 항목을 뺀 영업 현금 창출력 비율","plain":"매출에서 실제 영업으로 남는 현금이 얼마나 되는지를 보여 주는 지표로, 이자와 세금, 감가상각, 그리고 일회성으로 분류한 비용을 제외하고 계산한다. 무엇을 일회성으로 볼지는 회사가 정하기 때문에 회사 간 단순 비교는 조심해야 한다. 적자 기업이 흑자로 돌아섰다고 말할 때 흔히 쓰는 기준이다."}]},{"heading_ko":"Community Health Systems, 매각 마무리 국면","heading_en":"Public Markets","skip":null,"summary":"병원을 여러 곳 운영하는 상장 기업이 2025년에 진행한 자산 매각을 마무리하고 있다는 소식이다. 매각 때문에 매출과 이익 모두 줄어들지만, 원래 형편이 좋지 않던 자산을 덜어 내는 과정이라는 해석이 붙는다. 필자는 커뮤니티 슬랙에서 나온 표현을 빌려 지금 미국 병원들이 가진 쪽과 못 가진 쪽으로 갈라져 있다고 정리한다.","insight":null,"signal":null,"author":[{"claim":"이 회사는 못 가진 쪽에서 운영해 왔고, 거기서 벗어나려고 자산 기반의 규모를 적정하게 줄여 왔다.","evidence":"2025년에 진행한 여러 매각으로 매출과 조정 EBITDA가 2025년 수준 아래로 줄어든다는 회사 전망을 근거로 들었다."}],"experts":[{"who":"Martin","role":"이 뉴스레터가 운영하는 커뮤니티 슬랙의 참여자로, 소속은 원문에 밝혀져 있지 않다.","claim":"지금 헬스 시스템의 성과는 가진 쪽과 못 가진 쪽으로 나뉜다.","evidence":"슬랙 대화에서 나온 관찰이며, 뒷받침하는 수치는 원문에 실리지 않았다."}],"cases":[{"name":"Community Health Systems","what":"여러 지역에서 병원을 운영하는 상장 기업으로, 실적 발표 후 주가가 소폭 올랐다. 매출은 추정치를 살짝 밑돌았고 주당순이익은 상회했다.","scale":"2025년 진행한 매각으로 매출과 조정 EBITDA 모두 2025년 수준 아래로 축소 전망","note":"상장된 헬스 시스템 대부분은 형편이 나은 쪽에 있는데 이 회사는 반대쪽에 있었다는 것이 필자의 정리다.","sells_to":"payer"}],"notes":[]},{"heading_ko":"이번 주의 인용: Scripps의 Medicare Advantage 철수","heading_en":"Quote of the Week","skip":null,"summary":"한 병원 그룹이 2024년에 고령층 민간 보험 상품에서 통째로 빠져나온 결정과 그 결과를 다룬 기사를 소개한다. 이 그룹의 재무 책임자는 그 상품이 마진이 워낙 낮아 병원이 돈을 벌려면 보험까지 직접 운영하는 수밖에 없다고 본다. 같은 시기 정반대 판단을 내린 대형 병원 그룹도 함께 소개되면서, 미국 병원들이 이 상품을 두고 완전히 갈린 두 전략을 쓰고 있음이 드러난다.","insight":null,"signal":null,"author":[{"claim":"7,500만 달러를 잃고 있는 계약에서 빠져나와 환자를 더 수익성 있는 계약으로 옮길 수 있다면 고민할 것도 없어 보인다.","evidence":"환자 대부분을 전통적 Medicare와 보충 보험으로 옮겼는데도 의미 있는 물량 감소가 없었다는 Scripps의 시각을 근거로 들었다."},{"claim":"헬스 시스템이 이 상품에서 벌 돈이 없다는 것은 결론이 난 문제가 아니다.","evidence":"몇 주 전 JPMorgan 컨퍼런스에서 Cleveland Clinic 경영진이 정반대 방향의 계획을 밝히는 것을 직접 들었다는 점을 근거로 들었다."}],"experts":[{"who":"Brett Tande","role":"이 상품에서 철수한 병원 그룹 Scripps Health의 최고재무책임자로, 자기 조직의 결정을 정당화할 위치에 있다.","claim":"Medicare Advantage는 마진이 워낙 낮은 상품이라 거기서 돈을 벌 유일한 방법은 수직 통합뿐이다.","evidence":"원문에는 인용문이 이미지로 실려 있고 본문에는 필자가 요약한 취지만 옮겨져 있어, 그가 든 구체적 근거는 확인할 수 없다."},{"who":"Cleveland Clinic 경영진","role":"같은 상품에서 정반대로 확장하는 대형 병원 그룹의 경영진으로, 자기 확장 계획을 설명해야 할 위치에 있다.","claim":"Medicare Advantage의 글로벌 캡 가입자를 2026년 4만 6,000명에서 2028년 12만 5,000명으로 늘리겠다.","evidence":"JPMorgan 컨퍼런스 발표에서 밝힌 목표 수치이며, 왜 자기들은 수익을 낼 수 있는지에 대한 설명은 원문에 실리지 않았다."}],"cases":[{"name":"Scripps Health","what":"2024년에 Medicare Advantage 시장에서 철수하고 환자를 전통적 Medicare와 보충 보험으로 옮겼으며, 그 결정이 재무적으로 배당을 안겨 왔다고 밝혔다.","scale":"철수 전 해당 계약들에서 연간 7,500만 달러 손실","note":"환자를 옮겼는데도 의미 있는 물량 감소가 없었다는 대목이 이 사례의 핵심이다. 상품을 바꿔도 환자는 그 병원을 계속 다녔다는 뜻이다.","sells_to":"payer"},{"name":"Cleveland Clinic","what":"같은 상품에서 위험을 통째로 떠안는 방식의 가입자를 크게 늘리겠다고 밝혔다.","scale":"글로벌 캡 가입자 2026년 4만 6,000명에서 2028년 12만 5,000명","note":"같은 상품을 두고 한쪽은 나가고 한쪽은 두 배 넘게 늘린다는 대비가 이 꼭지의 논지다.","sells_to":"payer"}],"notes":[{"term":"Medicare Advantage(MA)","ko":"민간 보험사가 대신 운영하는 고령층 보험","plain":"정부가 직접 진료비를 내주는 대신, 민간 보험사에 가입자 1인당 정액을 주고 그 안에서 알아서 운영하게 하는 방식이다. 보험사는 의료비를 적게 쓸수록 이익이 남으므로 진료를 사전 승인 절차로 조이고 병원에 지급하는 값을 깎는다. 그래서 가입자에게는 치과나 안경 같은 부가 혜택이 붙어 인기가 높지만, 병원 입장에서는 승인 거절과 지급 지연이 늘어나 수익이 나빠진다. 한국에는 대응하는 제도가 없고, 굳이 견주자면 공단이 할 일을 민간 보험사에 통째로 위탁한 형태다."},{"term":"전통적 Medicare와 Med Supp(보충 보험)","ko":"정부가 직접 지급하는 원래 방식과 그 빈틈을 메우는 사보험","plain":"전통적 Medicare는 정부가 진료 행위마다 값을 직접 지급하는 원래 방식으로, 사전 승인 절차가 거의 없어 병원이 다루기 쉽다. 다만 본인 부담이 남기 때문에 가입자가 그 빈틈을 메우려고 따로 사는 사보험이 Med Supp, 곧 메디갭이다. 병원이 환자를 이쪽으로 옮겼다는 것은 지급이 까다로운 계약에서 지급이 단순한 계약으로 갈아탔다는 뜻이다."},{"term":"글로벌 캡(global cap)","ko":"병원이 1인당 정액을 받고 의료비 위험을 통째로 떠안는 계약","plain":"보험사가 병원 그룹에 가입자 1인당 정액을 넘기고, 그 가입자에게 드는 의료비 전부를 병원이 책임지는 계약이다. 환자가 많이 아프면 병원이 손해를 보고, 건강하게 관리하면 남는 돈이 병원 몫이 된다. 위험이 큰 대신 잘하면 보험사가 가져가던 이익까지 병원이 가져올 수 있어, 수직 통합을 이야기할 때 등장하는 형태다."},{"term":"수직 통합","ko":"병원이 보험까지 직접 운영하는 것","plain":"진료를 제공하는 쪽과 그 진료비를 지급하는 쪽을 한 조직이 함께 갖는 것을 말한다. 이렇게 하면 보험사에 값을 깎이는 대신 그 마진을 자기가 가져올 수 있고, 환자를 자기 병원 안에서 관리해 비용도 통제할 수 있다. 다만 보험을 운영하려면 별도의 자본과 인가, 위험 관리 역량이 필요해 아무 병원이나 뛰어들 수는 없다."}]},{"heading_ko":"Danaher, 맥박산소측정 기업 Masimo 인수","heading_en":"Other Top Headlines","skip":null,"summary":"진단 장비 시장의 대형 인수 소식이다. 병원에서 쓰는 산소포화도 측정 장비의 선두 기업이 코로나 시기 고점의 60% 수준 가격에 팔렸다. 필자는 인수 금액보다 매각에 이르게 된 사업 상태에 주목하며, 회사가 직접 낸 자료의 성장률 수치를 근거로 든다.","insight":null,"signal":null,"author":[{"claim":"2025년 12월 투자자의 날 발표 자료가 이 사업의 상태를 잘 보여 주며, 매출 성장은 이미 둔화돼 있었다.","evidence":"시장을 선도하는 맥박산소측정 사업이 연 4~6% 성장을 만들고 나머지 사업이 몇 퍼센트를 보태 전체 목표가 연 7~10%라는 회사 자료의 수치를 근거로 들었다."}],"experts":[],"cases":[{"name":"Danaher의 Masimo 인수","what":"진단·생명과학 장비 대기업 Danaher가 병원용 맥박산소측정 장비 기업 Masimo를 인수한다고 발표했다.","scale":"인수가 99억 달러, 주당 180달러, 코로나 시기 고점 주당 약 300달러","note":"코로나 시기에 값이 크게 올랐던 의료 기기 기업들이 그 고점에서 크게 내려온 가격에 정리되고 있음을 보여 주는 사례다.","sells_to":"provider"}],"notes":[]},{"heading_ko":"Hims, 호주 D2C 기업 Eucalyptus 인수","heading_en":"Other Top Headlines","skip":null,"summary":"소비자에게 직접 파는 미국 헬스케어 기업이 호주를 중심으로 한 같은 방식의 기업을 인수했다. 필자는 이 거래의 본질이 제품이 아니라 해외 유통망을 사들이는 것이라고 본다. 인수 대금은 대부분 나중에 조건을 채워야 지급되는 구조이고, 인수 발표 뒤에도 인수 기업의 주가는 계속 내렸다. 미국에서 소비자가 자기 돈을 내는 헬스케어 사업이 어떤 규모이고 시장이 그 값을 어떻게 매기는지가 한자리에 나온다.","insight":null,"signal":"인수 대상인 Eucalyptus는 호주 등에서 고객 77만 5,000명과 연 매출 약 4억 5,000만 달러를 쌓았다. 소비자가 보험 없이 자기 돈으로 결제하는 헬스케어가 실제로 매출을 내는 사업이라는 증거다. 그런데 인수한 Hims는 시가총액이 약 36억 달러로 2026년 예상 매출의 약 1.5배에 머물고 개인 투자자마저 경영진에게 껄끄러운 질문을 던지고 있어, 소비자가 돈을 낸다는 사실만으로는 사업이 인정받지 못한다는 것도 함께 보여 준다.","author":[{"claim":"Hims는 이번 움직임으로 국제 유통망을 사들이는 것으로 보인다.","evidence":"호주와 몇몇 다른 시장에서 연 매출 약 4억 5,000만 달러와 고객 77만 5,000명을 확보한다는 점을 근거로 들었다."},{"claim":"수익성이 시야에 들어왔다는 투자자 자료의 표현은 구체적으로 아무것도 말하지 않으면서 수익성에 가까울지도 모른다는 암시를 주는 데 기막히게 잘 들어맞는다.","evidence":"투자자 대상 자료에 실린 문구 자체를 근거로 들었으며, 실제 손익 수치는 공개되지 않았다."},{"claim":"이 거래의 대금 지급 구조는 꽤 복잡해 보인다.","evidence":"SEC 제출 서류를 직접 읽고 클로징 시점 현금 2억 4,000만 달러, 이후 18개월에 걸친 확정 이연 지급, 2029년까지 매출·EBITDA 마일스톤에 걸린 추가 지급이라는 구성을 정리했다."}],"experts":[],"cases":[{"name":"Hims의 Eucalyptus 인수","what":"소비자에게 직접 파는 미국 헬스케어 기업 Hims가 호주 등에서 같은 방식으로 영업하는 Eucalyptus를 인수했다. 소비자는 보험을 거치지 않고 자기 돈으로 결제한다.","scale":"인수가 최대 11억 5,000만 달러(클로징 현금 2억 4,000만 달러), Eucalyptus 연 매출 약 4억 5,000만 달러와 고객 77만 5,000명, Hims 주가 이번 주 6% 추가 하락으로 시가총액 약 36억 달러이며 2026년 예상 매출의 약 1.5배","note":"고객 77만 5,000명이 연 매출 4억 5,000만 달러를 만들었다는 것은 1인당 연간 지출이 500달러를 훌쩍 넘는다는 뜻이며, 소비자 직접 결제 시장의 객단가를 가늠할 수 있는 드문 수치다.","sells_to":"consumer"}],"notes":[{"term":"D2C(소비자 직접 판매) 헬스케어","ko":"보험을 거치지 않고 소비자가 직접 사는 의료 서비스","plain":"온라인으로 문진을 받고 원격 진료를 붙여 약이나 서비스를 소비자에게 바로 파는 방식이다. 보험사의 승인 절차와 네트워크 계약을 건너뛰기 때문에 소비자가 전액을 자기 돈으로 낸다. 미국에서 탈모, 발기부전, 피부, 체중 감량처럼 보험이 잘 대주지 않는 영역을 중심으로 커졌다. 지불하는 쪽이 소비자 자신이라 마케팅과 재구매율이 사업의 전부가 된다."},{"term":"ARR(연간 반복 매출)","ko":"구독처럼 매년 되풀이해 들어오는 매출을 1년치로 환산한 값","plain":"구독 사업에서 지금 시점의 월 매출에 12를 곱하는 식으로 계산하는 지표다. 실제로 지난 1년간 벌어들인 금액이 아니라 지금 상태가 1년간 이어진다고 가정한 값이므로, 해지가 늘면 실제 매출은 이보다 작아진다. 인수 발표에서 자주 쓰이지만 회계 매출과는 다르다는 점을 감안해야 한다."},{"term":"earn-out(조건부 추가 지급)","ko":"인수 대금 일부를 나중에 목표 달성 여부에 따라 지급하는 방식","plain":"인수 금액 전부를 계약 시점에 주지 않고, 매출이나 이익이 정해 둔 목표에 닿았을 때만 나머지를 주는 구조다. 인수하는 쪽은 위험을 줄이고, 파는 쪽은 남아서 성과를 내야 전액을 받는다. 최대 11억 5,000만 달러라고 발표해도 실제로 지급될 금액은 그보다 훨씬 작을 수 있으므로, 발표 금액을 그대로 사업 가치로 읽으면 안 된다."}]},{"heading_ko":"First Cressey Ventures, 4호 펀드 결성","heading_en":"Other Top Headlines","skip":null,"summary":"헬스케어 전문 벤처 투자사가 새 펀드를 결성했다는 소식이다. 보험사와 병원 그룹이 출자자로 이름을 올렸다. 필자가 눈여겨본 것은 발표문에 적힌 성과가 아니라 발표문에서 빠진 펀드다.","insight":null,"signal":null,"author":[{"claim":"성과를 자랑하는 문장에 3호 펀드가 언급되지 않았다는 사실은 그 시기의 디지털 헬스 펀드 전반의 성과에 대해 많은 것을 말해 주는 듯하다.","evidence":"3호 펀드가 2022년 4월에 발표됐다는 사실, 곧 디지털 헬스 기업 가치가 정점이던 시기에 돈을 집행하기 시작했다는 점을 근거로 들었다."}],"experts":[],"cases":[{"name":"First Cressey Ventures 4호 펀드","what":"헬스케어 전문 벤처 투자사가 네 번째 펀드를 결성했다고 발표했다.","scale":"펀드 규모 4억 2,500만 달러, 1호와 2호는 같은 시기 결성된 전체 벤처 펀드 상위 5% 성과","note":"보험사 Cigna와 병원 그룹 MedStar, OhioHealth가 전략적 출자자로 이름을 올렸다. 업계 당사자들이 투자자로 들어와 있다는 뜻이다.","sells_to":"other"}],"notes":[{"term":"LP(출자자)","ko":"펀드에 돈을 대는 쪽","plain":"벤처 펀드는 운용사가 직접 돈을 대는 것이 아니라 연기금이나 대기업 같은 곳에서 돈을 받아 굴린다. 그 돈을 대는 쪽을 LP라고 부른다. 전략적 LP는 단순히 수익만 노리는 것이 아니라, 그 펀드가 투자한 회사들과 사업으로 엮이려는 목적을 함께 가진 출자자를 말한다. 보험사와 병원이 헬스케어 펀드에 출자하는 것이 그런 경우다."},{"term":"빈티지(vintage)","ko":"펀드가 돈을 집행하기 시작한 연도","plain":"와인처럼 펀드도 어느 해에 시작했느냐로 성과가 크게 갈린다. 시장이 뜨거울 때 시작한 펀드는 비싼 값에 사들이게 되고, 침체기에 시작한 펀드는 싸게 사서 회수 시점에 유리하다. 그래서 펀드 성과를 비교할 때는 같은 해에 시작한 펀드끼리 견준다. 2022년 초는 디지털 헬스 기업 가치가 정점을 찍은 직후라 최악의 빈티지로 꼽힌다."}]},{"heading_ko":"Dafodil Health, 1,630만 달러 조달","heading_en":"Funding Announcements","skip":null,"summary":"보험 플랜 운영 업무를 AI로 처리하는 회사가 투자를 받았다는 소식이다. 이 회사가 대체하려는 기존 사업 모델은 절감한 금액의 일정 비율을 수수료로 가져가는 방식이었는데, 그 방식은 절감액을 부풀릴수록 수수료가 커진다는 이유로 오랫동안 비판을 받아 왔다. 필자는 공개된 절감 규모가 인상적인 만큼 이 회사가 무엇으로 돈을 버는지 궁금하다고 적는다.","insight":null,"signal":null,"author":[{"claim":"400만 달러 절감은 인상적인 규모여서 오히려 이 회사의 매출 모델이 궁금해진다.","evidence":"보도자료가 밝힌 한 지급자 파트너의 첫해 벤더 수수료 절감액 400만 달러를 근거로 들었으며, 사려 깊은 헬스케어 투자사 여럿이 투자한 사실을 덧붙였다."}],"experts":[],"cases":[{"name":"Dafodil Health","what":"건강보험 플랜 운영 업무를 처리하는 AI 플랫폼으로, 기존 업체와 달리 절감액 비율이 아닌 새로운 가격 책정 방식을 쓴다.","scale":"조달액 1,630만 달러, 한 지급자 파트너의 첫해 벤더 수수료 절감 400만 달러","note":"비교 대상으로 언급된 Multiplan(현 Claritev)은 절감액 비율 방식 때문에 오랫동안 비판을 받아 온 회사다.","sells_to":"payer"}],"notes":[{"term":"절감액 비율(percentage-of-savings) 방식","ko":"아껴 준 금액의 일정 비율을 수수료로 받는 계약","plain":"보험사가 원래 낼 뻔했던 금액과 실제로 낸 금액의 차이를 절감액으로 잡고, 그 몇 퍼센트를 업체가 수수료로 가져가는 방식이다. 문제는 원래 낼 뻔했던 금액을 누가 정하느냐인데, 그 기준을 높게 잡을수록 절감액도 수수료도 커진다. 그래서 값을 낮추라고 고용한 업체가 오히려 기준가를 부풀릴 동기를 갖게 된다. 이 모순 때문에 미국에서 여러 차례 소송과 조사의 대상이 됐다."}]},{"heading_ko":"Rainfall Health, 1,500만 달러 조달","heading_en":"Funding Announcements","skip":null,"summary":"병원이 특정 정부 지불 프로그램에서 받을 돈을 제대로 챙기도록 돕는 회사가 투자를 받았다. 조달한 돈을 제품 개발이 아니라 병원들에게 그 프로그램의 존재를 알리는 데 쓰겠다고 밝힌 점이 특이하다. 제도가 새로 생기면 그 제도를 아는 것 자체가 사업이 되는 미국 시장의 성격을 보여 준다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Rainfall Health","what":"CMMI의 TEAM 모델에 초점을 맞춘 헬스 시스템용 상환 플랫폼으로, 병원이 이 프로그램에서 받을 금액을 관리하도록 돕는다.","scale":"조달액 1,500만 달러, 일부 헬스 시스템에 최대 1억 달러의 영향이 있을 수 있다는 회사 추정","note":"회사는 이번 자금을 병원들 사이에서 이 모델에 대한 인지를 높이는 데 쓰겠다고 밝혔다.","sells_to":"provider"}],"notes":[{"term":"TEAM 모델","ko":"수술 한 건의 전 과정
