/* ---------- views ---------- */
function qaHTML(cls, label, text){
  /* 줄바꿈으로 나뉜 덩어리를 문단으로 만든다. 줄바꿈이 없고 길기만 하면
     문장 경계를 찾아 대략 260자 단위로 끊어 읽기 부담을 줄인다. */
  var parts = String(text).split(/\n\s*\n|\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  if(parts.length === 1 && parts[0].length > 420){
    var sents = parts[0].match(/[^.!?]+[.!?]+(?:\s|$)|[^.!?]+$/g) || [parts[0]];
    var acc = [], cur = '';
    sents.forEach(function(sn){
      cur += sn;
      if(cur.length >= 260){ acc.push(cur.trim()); cur = ''; }
    });
    if(cur.trim()) {
      if(acc.length && cur.trim().length < 90) acc[acc.length-1] += ' ' + cur.trim();
      else acc.push(cur.trim());
    }
    parts = acc;
  }
  return '<div class="qa ' + cls + '"><span class="lbl">' + esc(label) + '</span>' +
    parts.map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('') + '</div>';
}
function rawHTML(raw, n){
  /* 원문을 번역만 한 대조군. 정리 노트 꼭지와 순서가 1대 1로 맞는다. */
  if(!raw || !raw.sections || !raw.sections[n]) return '';
  var r = raw.sections[n];
  var paras = String(r.body || '').split(/\n\s*\n|\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  return '<div class="rawcol"><span class="rawlbl">원문 번역만</span>' +
    paras.map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('') + '</div>';
}
var SKIP_LABEL = {
  sponsor: {t:'광고', d:'후원사가 돈을 내고 실은 자리다. 건너뛰어도 된다.'},
  promo:   {t:'홍보·안내', d:'뉴스레터가 자기 행사나 커뮤니티를 알리는 자리다. 건너뛰어도 된다.'},
  admin:   {t:'잡다한 안내', d:'인사말이나 일정 공지처럼 내용이 거의 없는 자리다.'}
};
function secHTML(s, n){
  var b = [];

  /* 맨 위: 요약과 인사이트 */
  if(s.summary){
    b.push('<div class="sumbox"><span class="lbl">요약</span><p>' + esc(s.summary) + '</p></div>');
  }
  if(s.insight){
    b.push('<div class="insbox"><span class="lbl">3개월 안에 만들 수 있는 것</span><p>' + esc(s.insight) + '</p></div>');
  }
  if(s.signal){
    b.push('<div class="insbox sig"><span class="lbl">소비자 시장 신호</span><p>' + esc(s.signal) + '</p></div>');
  }
  if(!s.insight && !s.signal && !s.skip && s.summary){
    b.push('<div class="insbox none"><span class="lbl">건질 것</span><p>없다.</p></div>');
  }

  /* 필자의 주장과 근거 */
  if(s.author && s.author.length){
    b.push('<div class="claims author"><span class="lbl">필자의 주장과 근거</span>' +
      s.author.map(function(c){
        return '<div class="claim"><p class="c">' + esc(c.claim) + '</p>' +
          (c.evidence ? '<p class="e"><span>근거</span>' + esc(c.evidence) + '</p>' : '') + '</div>';
      }).join('') + '</div>');
  }

  /* 전문가의 주장과 근거 */
  if(s.experts && s.experts.length){
    b.push('<div class="claims expert"><span class="lbl">전문가의 주장과 근거</span>' +
      s.experts.map(function(c){
        return '<div class="claim"><p class="who"><b>' + esc(c.who) + '</b>' +
          (c.role ? '<span class="role">' + esc(c.role) + '</span>' : '') + '</p>' +
          '<p class="c">' + esc(c.claim) + '</p>' +
          (c.evidence ? '<p class="e"><span>근거</span>' + esc(c.evidence) + '</p>' : '') + '</div>';
      }).join('') + '</div>');
  }

  /* 실제 사례 */
  if(s.cases && s.cases.length){
    b.push('<div class="claims case"><span class="lbl">실제 사례</span>' +
      s.cases.map(function(c){
        return '<div class="claim"><p class="who"><b>' + esc(c.name) + '</b>' +
          (c.scale ? '<span class="scale">' + esc(c.scale) + '</span>' : '') + '</p>' +
          '<p class="c">' + esc(c.what) + '</p>' +
          (c.note ? '<p class="e"><span>눈여겨볼 대목</span>' + esc(c.note) + '</p>' : '') + '</div>';
      }).join('') + '</div>');
  }

  /* 모르면 막히는 말 */
  if(s.notes && s.notes.length){
    b.push('<div class="terms"><span class="lbl">모르면 막히는 말</span>' +
      s.notes.map(function(t){
        return '<div class="term core"><b>' + esc(t.term) + '</b> <span class="ko">' + esc(t.ko || '') + '</span>' +
          '<span class="pl">' + esc(t.plain) + '</span></div>';
      }).join('') + '</div>');
  }

  var body = b.join('');
  var sk = s.skip && SKIP_LABEL[s.skip] ? SKIP_LABEL[s.skip] : null;
  var raw = rawHTML(state.raw, n);
  var head = esc(s.heading_ko) + (s.heading_en ? '<span class="en">' + esc(s.heading_en) + '</span>' : '');

  if(sk){
    var inner = raw
      ? '<div class="cmprow">' + raw + '<div class="notecol">' + body + '</div></div>'
      : '<div class="secbody">' + body + '</div>';
    return '<details class="sec skip"><summary>' +
      '<span class="skipbadge">' + esc(sk.t) + '</span>' +
      '<span class="skiptitle">' + esc(s.heading_ko) + '</span>' +
      '<span class="skipnote">' + esc(sk.d) + '</span></summary>' + inner + '</details>';
  }
  if(raw){
    return '<section class="sec cmp"><h3 id="s' + n + '">' + head + '</h3>' +
      '<div class="cmprow">' + raw +
      '<div class="notecol"><span class="rawlbl note">정리 노트</span>' + body + '</div></div></section>';
  }
  return '<section class="sec"><h3 id="s' + n + '">' + head + '</h3>' +
    '<div class="secbody">' + body + '</div></section>';
}
function viewIssue(id){
  var i = ISSUES.findIndex(function(x){ return x.index === id; });
  if(i < 0){ document.getElementById('content').innerHTML = '<div class="empty">해당 회차를 찾을 수 없습니다</div>'; return; }
  need('issue', id, function(){ drawIssue(id, i); });
}
function drawIssue(id, i){
  var part = CACHE.issue[id];
  var it = part ? part.issue : ISSUES[i];
  var h = [];
  var secs = it.sections || [];
  /* 원문 번역본은 늘 함께 보여 준다. 켜고 끄는 단추를 두지 않는다. */
  state.raw = part ? (part.raw || null) : null;
  document.getElementById('content').className = 'wrap doc' + (state.raw ? ' cmpon' : '');

  /* --- 1. 제목 --- */
  h.push('<div class="ihead">');
  h.push('<h2>' + esc(it.title_ko) + '</h2>');
  h.push('<div class="meta"><span class="badge b-' + esc(it.type) + '">' + esc(TYPE_LABEL[it.type]||it.type) + '</span>' +
    '<span>' + esc(fmtDate(it.date)) + '</span><span>·</span><span>' + esc(it.index) + '회차</span>' +
    '<span>·</span><span>' + esc(it.title_en||'') + '</span></div>');
  if(it.hook) h.push('<div class="hook">' + esc(it.hook) + '</div>');

  /* --- 2. 전체 요약 --- */
  if(it.tldr && it.tldr.length){
    h.push('<div class="tldr"><span class="lbl">이 회차 요약</span><ol>' +
      it.tldr.map(function(t){
        if(typeof t === 'string') return '<li><span class="pt">' + esc(t) + '</span></li>';
        return '<li><span class="pt">' + esc(t.point) + '</span>' +
          (t.note ? '<span class="nt">' + esc(t.note) + '</span>' : '') + '</li>';
      }).join('') + '</ol></div>');
  }

  /* --- 3. 회차 전체 실행 인사이트 --- */
  var ii = it.issue_insight;
  var insSecs = [];
  secs.forEach(function(s, n){ if(s.insight || s.signal) insSecs.push(n); });
  if(ii && (ii.summary || (ii.build||[]).length || (ii.signal||[]).length)){
    var build = ii.build || [], signal = ii.signal || [];
    var yes = ii.verdict !== 'no' && (build.length || signal.length);
    function bullets(arr, cls){
      return '<ul class="ibul ' + cls + '">' + arr.map(function(x){
        var sn = (typeof x.section === 'number') ? (x.section - 1) : null;
        return '<li><b>' + esc(x.title) + '</b>' +
          (x.detail ? '<span>' + esc(x.detail) + '</span>' : '') +
          (sn !== null && secs[sn] ? '<button class="src" data-anchor="s' + sn + '">' +
            x.section + '. ' + esc(secs[sn].heading_ko) + '</button>' : '') + '</li>';
      }).join('') + '</ul>';
    }
    h.push('<div class="issueins ' + (yes ? 'yes' : 'no') + '">' +
      '<span class="lbl">이 회차에서 건질 것' + (yes ? '' : ' (없음)') + '</span>' +
      (ii.summary ? '<p>' + esc(ii.summary) + '</p>' : ''));
    if(build.length) h.push('<div class="igrp b"><span class="gl">3개월 안에 만들 수 있는 것</span>' + bullets(build, 'b') + '</div>');
    if(signal.length) h.push('<div class="igrp s"><span class="gl">소비자 시장 신호</span>' + bullets(signal, 's') + '</div>');
    if(!build.length && !signal.length && insSecs.length){
      h.push('<div class="jump">' + insSecs.map(function(n){
        return '<button data-anchor="s' + n + '">' + (n+1) + '. ' + esc(secs[n].heading_ko) + '</button>';
      }).join('') + '</div>');
    }
    h.push('</div>');
  }

  /* --- 4. 읽을 꼭지 고르기 --- */
  h.push('<div class="picker"><span class="lbl">꼭지 고르기 · ' + secs.length + '개' +
    (insSecs.length ? ' 가운데 건질 것 ' + insSecs.length + '개' : '') + '</span>');
  secs.forEach(function(s, n){
    var sk = s.skip && SKIP_LABEL[s.skip] ? SKIP_LABEL[s.skip] : null;
    h.push('<button class="prow' + (sk ? ' dim' : '') + ((s.insight||s.signal) ? ' has' : '') + '" data-anchor="s' + n + '">' +
      '<span class="pn">' + (n+1) + '</span>' +
      '<span class="pmain"><span class="pt">' + esc(s.heading_ko) + '</span>' +
      (sk ? '' : '<span class="ps">' + esc((s.summary||'').slice(0,72)) + ((s.summary||'').length > 72 ? '…' : '') + '</span>') +
      '</span>' +
      (s.insight ? '<span class="pbadge ins">만들 것</span>' : '') +
      (s.signal ? '<span class="pbadge sig">시장 신호</span>' : '') +
      (sk ? '<span class="pbadge skip">' + esc(sk.t) + '</span>' : '') +
      '</button>');
  });
  h.push('</div>');
  h.push('</div>');  /* ihead 끝 */

  /* --- 5. 꼭지 본문 --- */
  secs.forEach(function(s, n){ h.push(secHTML(s, n)); });

  if(it.themes && it.themes.length){
    h.push('<div class="themebar">' + it.themes.map(function(t){
      return '<button class="tt" data-theme-go="' + esc(t) + '">#' + esc(THEME_LABEL[t]||t) + '</button>'; }).join('') + '</div>');
  }
  var prev = ISSUES[i-1], next = ISSUES[i+1];
  h.push('<div class="pager">' +
    (prev ? '<button data-issue="' + esc(prev.index) + '"><small>이전 회차</small>' + esc(prev.title_ko) + '</button>' : '<span></span>') +
    (next ? '<button data-issue="' + esc(next.index) + '" style="text-align:right"><small>다음 회차</small>' + esc(next.title_ko) + '</button>' : '<span></span>') +
    '</div>');
  document.getElementById('content').innerHTML = h.join('');
  document.getElementById('crumb').textContent = fmtDate(it.date) + ' · ' + it.title_ko;
  buildSideToc(it, secs, insSecs);
}

/* 사이드바를 이 회차의 꼭지 목차로 바꾼다. 스크롤을 따라 현재 위치를 표시한다. */
function buildSideToc(it, secs, insSecs){
  var el2 = document.getElementById('sidetoc');
  if(!el2) return;
  el2.innerHTML = '<div class="stoc-head">' + esc(it.index) + '회차 · 꼭지 ' + secs.length + '개</div>' +
    secs.map(function(s, n){
      var sk = s.skip && SKIP_LABEL[s.skip] ? SKIP_LABEL[s.skip] : null;
      return '<button class="stoc' + (sk ? ' dim' : '') + '" data-anchor="s' + n + '" data-sn="' + n + '">' +
        '<span class="n">' + (n+1) + '</span><span class="t">' + esc(s.heading_ko) + '</span>' +
        (s.insight ? '<span class="dot"></span>' : '') +
        (s.signal ? '<span class="dot sig"></span>' : '') + '</button>';
    }).join('');
  setTab('toc');
  trackScroll();
}
var scrollTimer = null;
function trackScroll(){
  if(scrollTimer) return;
  scrollTimer = setInterval(function(){
    var secsEl = document.querySelectorAll('[id^="s"]');
    var cur = -1, top = 120;
    secsEl.forEach(function(e){
      if(!/^s\d+$/.test(e.id)) return;
      if(e.getBoundingClientRect().top <= top) cur = parseInt(e.id.slice(1), 10);
    });
    document.querySelectorAll('.stoc').forEach(function(b){
      b.classList.toggle('on', parseInt(b.dataset.sn, 10) === cur);
    });
  }, 400);
}
function mdish(t){
  /* very small formatter: **bold**, `code`, paragraphs, - lists, ## heads */
  var lines = String(t||'').split('\n'), out = [], inList = false;
  function inline(s){
    return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
                 .replace(/`(.+?)`/g,'<code>$1</code>')
                 .replace(/\[\[(\d{2})\]\]/g,'<button class="tt" data-issue="$1" style="padding:1px 7px">$1회차</button>');
  }
  lines.forEach(function(l){
    var s = l.trim();
    if(!s){ if(inList){ out.push('</ul>'); inList=false; } return; }
    if(/^###\s/.test(s)){ if(inList){out.push('</ul>');inList=false;} out.push('<h4>'+inline(s.replace(/^###\s/,''))+'</h4>'); return; }
    if(/^##\s/.test(s)){ if(inList){out.push('</ul>');inList=false;} out.push('<h3>'+inline(s.replace(/^##\s/,''))+'</h3>'); return; }
    if(/^[-*]\s/.test(s)){ if(!inList){ out.push('<ul>'); inList=true; } out.push('<li>'+inline(s.replace(/^[-*]\s/,''))+'</li>'); return; }
    if(inList){ out.push('</ul>'); inList=false; }
    out.push('<p>'+inline(s)+'</p>');
  });
  if(inList) out.push('</ul>');
  return out.join('');
}
function viewDoc(key, title){
  var d = EXTRAS[key];
  document.getElementById('crumb').textContent = title;
  if(!d){ document.getElementById('content').innerHTML = '<div class="empty">준비 중입니다</div>'; return; }
  var h = ['<h2>' + esc(d.title || title) + '</h2>'];
  if(d.lede) h.push('<div class="hook">' + esc(d.lede) + '</div>');
  if(d.toc && d.sections){
    h.push('<div class="toc"><span class="lbl">차례</span><ol>' + d.sections.map(function(s,n){
      return '<li><a href="#d' + n + '" data-anchor="d' + n + '">' + esc(s.heading) + '</a></li>'; }).join('') + '</ol></div>');
  }
  (d.sections||[]).forEach(function(s,n){
    h.push('<h3 id="d' + n + '">' + esc(s.heading) + '</h3>');
    h.push(mdish(s.body));
  });
  if(d.body) h.push(mdish(d.body));
  document.getElementById('content').innerHTML = h.join('');
}
function viewGlossary(){
  document.getElementById('crumb').textContent = '용어사전';
  var g = (EXTRAS.glossary && EXTRAS.glossary.items) || [];
  var q = state.q.trim().toLowerCase();
  if(q) g = g.filter(function(t){ return (t.en+' '+t.ko+' '+t.plain).toLowerCase().indexOf(q) >= 0; });
  var h = ['<h2>용어사전</h2><p style="color:var(--muted);font-size:14px">뉴스레터에 나온 미국 헬스케어 용어를 한글로 풀었습니다. 위 검색창으로 걸러집니다. 총 ' + g.length + '개.</p>'];
  var last = '';
  g.forEach(function(t){
    var L = (t.en||'?').charAt(0).toUpperCase();
    if(L !== last){ h.push('<div class="gl-letter">' + esc(L) + '</div>'); last = L; }
    h.push('<div class="gitem"><h4>' + esc(t.en) + '<span class="ko">' + esc(t.ko) + '</span></h4>' +
      '<p>' + esc(t.plain) + '</p>' +
      ((t.refs && t.refs.length) ? '<div class="refs">' + t.refs.slice(0,12).map(function(r){
        return '<button data-issue="' + esc(r) + '">' + esc(r) + '회차</button>'; }).join('') + '</div>' : '') + '</div>');
  });
  if(!g.length) h.push('<div class="empty">검색 결과가 없습니다</div>');
  document.getElementById('content').innerHTML = h.join('');
}
function viewThemes(){
  document.getElementById('crumb').textContent = '주제별';
  var t = (EXTRAS.themes && EXTRAS.themes.items) || [];
  var h = ['<h2>주제별로 보기</h2><p style="color:var(--muted);font-size:14px">55회차에 반복해서 나온 큰 줄기 ' + t.length + '개. 각 줄기가 무슨 이야기인지 먼저 읽고, 해당 회차로 넘어가세요.</p>'];
  t.forEach(function(x){
    h.push('<div class="themecard"><h3>' + esc(x.title) + '</h3><p>' + esc(x.summary) + '</p>' +
      ((x.refs && x.refs.length) ? '<div class="refs">' + x.refs.map(function(r){
        return '<button data-issue="' + esc(r) + '">' + esc(r) + '회차</button>'; }).join('') + '</div>' : '') + '</div>');
  });
  document.getElementById('content').innerHTML = h.join('');
}
function viewTimeline(){
  document.getElementById('crumb').textContent = '타임라인';
  var t = (EXTRAS.timeline && EXTRAS.timeline.items) || [];
  var h = ['<h2>2026년 미국 헬스케어, 무슨 일이 있었나</h2>' +
    '<p style="color:var(--muted);font-size:14px">뉴스레터가 다룬 사건을 시간 순으로 세웠습니다.</p>'];
  t.forEach(function(x){
    h.push('<div class="tl-item"><div class="d">' + esc(fmtDate(x.date)) + '</div><div>' +
      '<h4>' + esc(x.title) + '</h4><p>' + esc(x.note) + '</p>' +
      ((x.refs&&x.refs.length) ? '<div class="refs" style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap">' + x.refs.map(function(r){
        return '<button class="tt" data-issue="' + esc(r) + '" style="font-family:var(--mono);font-size:10.5px;padding:1px 6px">' + esc(r) + '회차</button>'; }).join('') + '</div>' : '') +
      '</div></div>');
  });
  document.getElementById('content').innerHTML = h.join('');
}
var SELLS_LABEL = {
  consumer:'소비자에게 직접', provider:'병원·의사에게', payer:'보험사에게',
  employer:'고용주에게', pharma:'제약사에게', mixed:'여러 곳에'
};
var TRACTION_LABEL = {
  funding:'투자', partnership:'협약', regulatory:'규제 통과', revenue:'매출',
  traffic:'트래픽', customers:'고객', award:'수상'
};
function viewCompanies(){
  document.getElementById('crumb').textContent = '투자받은 회사';
  var list = Object.keys(COMPANIES).map(function(k){ return COMPANIES[k]; });
  var q = state.q.trim().toLowerCase();
  if(q) list = list.filter(function(c){
    return (c.q || JSON.stringify(c).toLowerCase()).indexOf(q) >= 0; });
  list.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });

  var h = ['<h2>투자받은 회사</h2>',
    '<p style="color:var(--muted);font-size:14px">뉴스레터에 한 줄로만 나온 회사를 직접 찾아보고 정리했다. ' +
    '목록에서 요약과 화면을 훑고, 더 볼 것만 눌러서 들어가면 된다. 총 ' + list.length + '곳.</p>'];
  if(!list.length) h.push('<div class="empty">아직 정리된 회사가 없습니다</div>');

  list.forEach(function(c){
    var cd = c.card || {};
    var shots = (c.screenshots || []).slice(0, 3);
    h.push('<div class="cbig">');
    /* 머리: 이름, 판매 대상, 회차 */
    h.push('<div class="cbig-h">' +
      '<button class="cname" data-company="' + esc(c.slug) + '">' + esc(c.name) + '</button>' +
      (c.sells_to ? '<span class="cs">' + esc(SELLS_LABEL[c.sells_to] || c.sells_to) + '</span>' : '') +
      ((c.seen_in||[]).map(function(x){
        return '<button class="cissue" data-issue="' + esc(x.issue) + '">' + esc(x.issue) + '회차</button>'; }).join('')) +
      '<span class="cspacer"></span>' +
      '<button class="cmore" data-company="' + esc(c.slug) + '">자세히</button>' +
      '</div>');
    h.push('<p class="cone">' + esc(c.one_liner || '') + '</p>');
    if((cd.tags||[]).length){
      h.push('<div class="ctags">' + cd.tags.map(function(t){
        return '<span>' + esc(t) + '</span>'; }).join('') + '</div>');
    }
    /* 표: 문제와 해법부터 값, 성과, 주의까지 한 자리에 놓는다. */
    var rows = [];
    if(cd.problem) rows.push(['푸는 문제', esc(cd.problem), '']);
    else if(cd.summary) rows.push(['요약', esc(cd.summary), '']);
    if(cd.solution) rows.push(['솔루션', esc(cd.solution), '']);
    if(cd.price) rows.push(['소비자가 내는 값', esc(cd.price), '']);
    if(cd.headline_traction) rows.push(['성과', esc(cd.headline_traction), '']);
    if(cd.watch) rows.push(['주의', esc(cd.watch), 'w']);
    if(rows.length){
      h.push('<table class="ctab"><tbody>' + rows.map(function(r){
        return '<tr class="' + r[2] + '"><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>'; }).join('') + '</tbody></table>');
    }
    if(shots.length){
      h.push('<div class="cthumbs">' + shots.map(function(sh){
        return '<figure><a href="assets/companies/' + esc(sh.file) + '" target="_blank" rel="noopener">' +
          '<img src="assets/companies/' + esc(sh.file) + '" alt="' + esc(sh.caption||'') + '" loading="lazy"></a>' +
          '<figcaption>' + esc((sh.caption||'').slice(0,40)) + '</figcaption></figure>'; }).join('') + '</div>');
    }
    h.push('</div>');
  });
  document.getElementById('content').innerHTML = h.join('');
}
function viewCompany(slug){
  if(!COMPANIES[slug]){ document.getElementById('content').innerHTML = '<div class="empty">해당 회사를 찾을 수 없습니다</div>'; return; }
  need('company', slug, function(){ drawCompany(slug); });
}
function drawCompany(slug){
  var c = CACHE.company[slug] || COMPANIES[slug];
  document.getElementById('crumb').textContent = '회사 · ' + c.name;
  var h = ['<button class="backlink" data-nav="companies">회사 목록으로</button>'];
  h.push('<h2>' + esc(c.name) + '</h2>');
  h.push('<div class="meta">' +
    (c.sells_to ? '<span class="badge b-reads">' + esc(SELLS_LABEL[c.sells_to] || c.sells_to) + '</span>' : '') +
    (c.site ? '<span>' + esc(c.site.replace(/^https?:\/\//,'')) + '</span>' : '') +
    ((c.seen_in||[]).map(function(x){
      return '<span>·</span><button class="tt" data-issue="' + esc(x.issue) + '">' + esc(x.issue) + '회차</button>'; }).join('')) +
    '</div>');
  if(c.one_liner) h.push('<div class="hook">' + esc(c.one_liner) + '</div>');

  function block(title, body, cls){
    if(!body) return;
    h.push('<div class="cblock ' + (cls||'') + '"><span class="lbl">' + esc(title) + '</span>' +
      String(body).split(/\n\s*\n|\n/).filter(Boolean).map(function(x){
        return '<p>' + esc(x.trim()) + '</p>'; }).join('') + '</div>');
  }
  block('푸는 문제', c.problem);
  block('솔루션', c.solution);
  if((c.features||[]).length){
    h.push('<div class="cblock"><span class="lbl">기능 상세</span><ul class="cfeat">' +
      c.features.map(function(f){
        return '<li><b>' + esc(f.name) + '</b><span>' + esc(f.detail||'') + '</span></li>'; }).join('') + '</ul></div>');
  }
  block('차별점', c.differentiator);
  if((c.screenshots||[]).length){
    h.push('<div class="cblock"><span class="lbl">화면</span><div class="cshots">' +
      c.screenshots.map(function(sh){
        var src = 'assets/companies/' + esc(sh.file);
        return '<figure><a href="' + src + '" target="_blank" rel="noopener">' +
          '<img src="' + src + '" alt="' + esc(sh.caption||'') + '" loading="lazy"></a>' +
          '<figcaption>' + esc(sh.caption||'') + '</figcaption></figure>'; }).join('') + '</div></div>');
  }
  if((c.team||[]).length){
    h.push('<div class="cblock"><span class="lbl">팀</span><ul class="cteam">' +
      c.team.map(function(t){
        return '<li><b>' + esc(t.name) + '</b>' + (t.role ? '<span class="role">' + esc(t.role) + '</span>' : '') +
          (t.background ? '<span>' + esc(t.background) + '</span>' : '') + '</li>'; }).join('') + '</ul></div>');
  }
  if((c.traction||[]).length){
    h.push('<div class="cblock"><span class="lbl">성과</span><ul class="ctrac">' +
      c.traction.map(function(t){
        return '<li><span class="tt2 t-' + esc(t.type||'') + '">' + esc(TRACTION_LABEL[t.type] || t.type || '') + '</span>' +
          '<span class="d">' + esc(t.detail||'') + '</span>' +
          (t.when ? '<span class="w">' + esc(t.when) + '</span>' : '') + '</li>'; }).join('') + '</ul></div>');
  }
  block('주의해서 볼 대목', c.caveats, 'warn');
  block('우리 목적에 비추어', c.for_us, 'forus');
  if((c.sources||[]).length){
    h.push('<div class="cblock"><span class="lbl">확인한 자료</span><ul class="csrc">' +
      c.sources.map(function(x){
        return '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.title||x.url) + '</a>' +
          (x.note ? '<span>' + esc(x.note) + '</span>' : '') + '</li>'; }).join('') + '</ul></div>');
  }
  document.getElementById('content').innerHTML = h.join('');
}
function viewHome(){
  document.getElementById('crumb').textContent = '시작하기';
  var d = EXTRAS.home;
  var h = ['<h2>Health Tech Nerds 정리 노트</h2>'];
  h.push('<div class="hook">미국 헬스케어 업계 뉴스레터 ' + ISSUES.length + '회차(2026년 1월~8월)를, 헬스케어도 영어도 익숙하지 않은 사람이 읽을 수 있게 한글로 다시 쓴 노트입니다.</div>');
  if(d && d.sections){ d.sections.forEach(function(s,n){ h.push('<h3 id="h'+n+'">' + esc(s.heading) + '</h3>'); h.push(mdish(s.body)); }); }
  h.push('<h3>회차 한눈에 보기</h3>');
  var byType = {};
  ISSUES.forEach(function(i){ (byType[i.type] = byType[i.type] || []).push(i); });
  h.push('<div class="stats">' + Object.keys(byType).map(function(k){
    return '<div class="stat"><b>' + byType[k].length + '</b><span>' + esc(TYPE_LABEL[k]||k) + '</span></div>'; }).join('') + '</div>');
  h.push('<p style="color:var(--muted);font-size:13.5px">왼쪽 목록에서 회차를 고르거나, <button class="tt" data-nav="primer">미국 헬스케어 101</button> 부터 읽어보세요.</p>');
  document.getElementById('content').innerHTML = h.join('');
}

/* ---------- router ---------- */
function render(){
  renderNav(); renderFilters(); renderList();
  var v = state.view;
  /* 회차 화면만 비교 모드로 넓어진다. 나머지 화면은 기본 폭으로 되돌린다. */
  if(v !== 'issue'){ document.getElementById('content').className = 'wrap doc';
    document.getElementById('sidetoc').innerHTML = ''; setTab('list'); }
  if(v === 'issue') viewIssue(state.id);
  else if(v === 'companies') viewCompanies();
  else if(v === 'company') viewCompany(state.id);
  else if(v === 'glossary') needExtras(viewGlossary);
  else if(v === 'themes') needExtras(viewThemes);
  else if(v === 'timeline') needExtras(viewTimeline);
  else if(v === 'primer') needExtras(function(){ viewDoc('primer','미국 헬스케어 101'); });
  else if(v === 'consumer') needExtras(function(){ viewDoc('consumer','소비자 시장'); });
  else viewHome();
  document.querySelector('.main').scrollTop = 0;
  window.scrollTo(0,0);
}
function go(view, id){
  state.view = view; state.id = id || null;
  var hash = (view === 'issue' || view === 'company') ? '#/' + view + '/' + id : '#/' + view;
  if(location.hash !== hash) location.hash = hash;
  else render();
  closeSide();
}
function fromHash(){
  var m = /^#\/issue\/(\w+)/.exec(location.hash);
  if(m){ state.view='issue'; state.id=m[1]; return; }
  var mc = /^#\/company\/([\w-]+)/.exec(location.hash);
  if(mc){ state.view='company'; state.id=mc[1]; return; }
  var m2 = /^#\/(\w+)/.exec(location.hash);
  state.view = m2 ? m2[1] : 'home'; state.id = null;
}
window.addEventListener('hashchange', function(){ fromHash(); render(); });

/* ---------- events ---------- */
function setTab(which){
  state.tab = which;
  var hasToc = document.getElementById('sidetoc').innerHTML.trim().length > 0;
  if(which === 'toc' && !hasToc) which = 'list';
  /* CSS 기본값이 display:none 이므로 빈 문자열이 아니라 값을 명시해야 한다. */
  document.getElementById('issuelist').style.display = which === 'list' ? 'block' : 'none';
  document.getElementById('sidetoc').style.display = which === 'toc' ? 'block' : 'none';
  document.getElementById('filters').style.display = which === 'list' ? 'flex' : 'none';
  document.querySelectorAll('#sidetabs button').forEach(function(b){
    b.classList.toggle('on', b.dataset.tab === which);
  });
  document.getElementById('sidetabs').style.display = hasToc ? 'flex' : 'none';
}
function closeSide(){ document.getElementById('side').classList.remove('open'); document.getElementById('scrim').classList.remove('on'); }
document.getElementById('menubtn').addEventListener('click', function(){
  document.getElementById('side').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('on');
});
document.getElementById('scrim').addEventListener('click', closeSide);
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-issue],[data-nav],[data-type],[data-theme-go],[data-anchor],[data-cmp],[data-tab],[data-company]');
  if(!t) return;
  if(t.dataset.company){ e.preventDefault(); go('company', t.dataset.company); return; }
  if(t.dataset.tab){ e.preventDefault(); setTab(t.dataset.tab); return; }
  if(t.dataset.cmp){ e.preventDefault(); state.cmp = !state.cmp;
    try{ localStorage.setItem('htn-cmp', state.cmp ? '1' : '0'); }catch(err){}
    render(); return; }
  if(t.dataset.issue){ e.preventDefault(); state.theme=null; go('issue', t.dataset.issue); return; }
  if(t.dataset.nav){ e.preventDefault(); state.theme=null; go(t.dataset.nav); return; }
  if(t.dataset.type){ e.preventDefault(); state.types[t.dataset.type] = !state.types[t.dataset.type]; renderFilters(); renderList(); return; }
  if(t.dataset.themeGo){ e.preventDefault(); state.theme = t.dataset.themeGo; state.q=''; document.getElementById('q').value=''; renderList(); closeSide();
    document.getElementById('crumb').textContent = '#' + (THEME_LABEL[state.theme]||state.theme) + ' 로 목록 필터됨'; return; }
  if(t.dataset.anchor){ e.preventDefault(); closeSide();
    var el2 = document.getElementById(t.dataset.anchor);
    if(el2) el2.scrollIntoView({behavior:'smooth', block:'start'});
    return; }
});
var qt;
document.getElementById('q').addEventListener('input', function(e){
  clearTimeout(qt); var v = e.target.value;
  qt = setTimeout(function(){ state.q = v; state.theme=null; renderList(); if(state.view==='glossary') viewGlossary(); }, 120);
});
document.addEventListener('keydown', function(e){
  if(e.key === '/' && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); document.getElementById('q').focus(); }
  if(state.view==='issue' && !e.metaKey && !e.ctrlKey && document.activeElement.tagName !== 'INPUT'){
    var i = ISSUES.findIndex(function(x){ return x.index === state.id; });
    if(e.key === 'ArrowLeft' && ISSUES[i-1]) go('issue', ISSUES[i-1].index);
    if(e.key === 'ArrowRight' && ISSUES[i+1]) go('issue', ISSUES[i+1].index);
  }
});

fromHash(); render();
})();
</script>
</body>
</html>
