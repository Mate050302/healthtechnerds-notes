c.ai"},{"file":"doctronic_how.png","caption":"AI 의사가 어떻게 작동하는지 네 단계로 설명하는 페이지다. 무료 AI 상담에서 면허 의사 화상 진료로 넘어가는 지점이 어디인지, 대기 시간과 값이 얼마인지 보여 준다.","from":"https://www.doctronic.ai/how-your-ai-doctor-works/"},{"file":"doctronic_pricing.png","caption":"값 안내 페이지다. AI 상담은 영원히 0달러, 면허 의사 진료는 39달러 또는 보험 본인부담금, 기업은 직원 한 사람당 월정액으로 세 갈래를 나눠 놓았다.","from":"https://www.doctronic.ai/quality-care-in-seconds-pricing-that-makes-sense/"}],"q":"{\"slug\": \"doctronic\", \"name\": \"doctronic\", \"one_liner\": \"증상을 적으면 ai가 무료로 진단과 치료 계획을 내주고, 처방전이 필요해지는 순간에만 39달러짜리 면허 의사 화상 진료를 파는 소비자용 서비스다.\", \"site\": \"https://www.doctronic.ai\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"26\", \"section\": 15, \"headline\": \"ai가 진료 상담을 맡는 서비스가 12개월도 안 되어 세 번째 라운드로 4,000만 달러를 받았고, 필자는 공개 수치를 역산해 주간 방문자 30만 명 가운데 2%도 유료 진료로 넘어가지 않는다고 짚었다.\"}], \"card\": {\"problem\": \"미국에서는 보험이 없거나 있어도 비용 때문에 진료를 미루는 사람이 많아서, 지금 겪는 증상이 병원에 갈 일인지 판단하는 단계부터 돈이 든다.\", \"solution\": \"가입도 로그인도 없이 익명으로 증상을 물어보는 무료 ai 상담을 열어 두고 상담마다 진료 기록 형식의 문서를 만들어 주며, 처방전이나 검사 의뢰처럼 사람 의사가 필요해지는 순간에만 화상 진료를 유료로 판다.\", \"price\": \"ai 상담은 횟수 제한 없이 무료이고, 면허 의사 화상 진료는 구독 없이 1회 39달러다. 보험이 있으면 본인부담금만 낸다.\", \"tags\": [\"ai 상담\", \"원격진료\", \"현금 결제\", \"익명 이용\", \"고용주 판매\"], \"headline_traction\": \"2026년 3월에 시리즈 b로 4,000만 달러를 받았다. 12개월이 안 되는 기간에 세 번째 라운드이며 누적 조달액은 6,500만 달러가 넘는다.\", \"watch\": \"매출 15배 성장과 주간 방문자 30만 명 같은 성장 수치는 전부 회사가 스스로 낸 것이고 제삼자가 확인한 것이 아니다.\"}, \"problem\": \"한국은 전국민 건강보험이 있어서 아프면 동네 의원에 가면 되고 진료비 본인부담금도 몇천 원 수준이다. 미국은 그렇지 않다. kff 집계에 따르면 2024년 기준으로 65세 미만 인구 가운데 2,670만 명, 비율로는 9.8%가 건강보험이 없다. 무보험 성인의 38.6%는 비용 때문에 필요한 진료나 약을 미루거나 아예 받지 못했다고 답했고, 민간보험이 있는 성인도 17.0%가 같은 답을 했다. 그래서 미국 소비자에게는 진료를 받는 일 자체보다 앞서, 지금 겪는 증상이 병원에 갈 일인지 판단하는 단계부터가 돈이 드는 문제가 되며, 그 판단을 공짜로 대신해 주는 창구에 수요가 생긴다.\", \"solution\": \"사용자는 첫 화면 가운데에 있는 입력창에 증상을 적고 대화를 시작한다. 가입도 로그인도 필요 없고 익명으로 쓸 수 있으며, ai 상담 자체는 횟수 제한 없이 무료다. ai는 동료 심사를 거친 논문과 진료 지침을 근거로 가능한 진단 목록과 치료 선택지를 제시하고, 상담마다 soap 노트라는 진료 기록 형식의 문서를 만들어 준다. 회사는 이 문서를 다른 병원에 그대로 가져가서 쓰라고 안내한다. 처방전이나 검사 의뢰, 진단서가 필요해지는 순간에만 실제 면허 의사와의 화상 진료로 넘어가는데, 값은 1회 39달러이고 구독이 아니며 보험이 있으면 본인부담금만 낸다. 진료를 맡는 의사들은 본사와 분리된 별도 법인인 doctronic physicians group 소속이고, 회사는 50개 주 전체에서 진료가 가능하다고 밝히고 있다.\", \"features\": [{\"name\": \"무료 ai 상담\", \"detail\": \"가입과 로그인 없이 익명으로 증상을 물어볼 수 있고 횟수 제한이 없다. 회사는 값 안내 페이지에서 이 부분을 영원히 0달러라고 표기한다.\"}, {\"name\": \"무료 soap 노트\", \"detail\": \"상담이 끝날 때마다 진단과 치료 계획이 담긴 진료 기록 형식의 문서를 만들어 준다. 회사는 이 문서를 자기가 다니던 병원에 가져가면 진료가 더 빨라진다고 안내한다.\"}, {\"name\": \"39달러 원격진료\", \"detail\": \"면허 의사와의 화상 진료 1회 값이다. 처방전 발급, 검사 의뢰와 결과 해석, 전문의 의뢰, 진단서 발급이 이 값에 포함되며 별도로 더 받지 않는다고 적혀 있다.\"}, {\"name\": \"유타주 ai 처방 갱신\", \"detail\": \"이미 다른 의사가 처방한 약 191개 품목에 한해 ai가 30일, 60일, 90일 단위 갱신을 처리한다. 규제 약물과 adhd 약, 주사제는 대상에서 빠진다.\"}, {\"name\": \"glp-1 처방 관리 구독\", \"detail\": \"비만 치료제 처방을 매달 써 주고 필요할 때 의사 화상 진료와 영양사 상담을 붙여 주는 상품이다. 월 99달러와 199달러 두 가지가 있고 약값은 포함되지 않는다.\"}, {\"name\": \"checkup 컨시어지\", \"detail\": \"연 1회 건강검진 상품이다. 기본 혈액검사와 흔히 쓰는 약의 재처방이 포함되고, 1만 곳이 넘는 의료기관에서 의무기록을 모아 준다고 밝히고 있다.\"}, {\"name\": \"검색 유입용 건강 정보 페이지\", \"detail\": \"질환, 증상, 약, 검사, 비교 글로 사이트를 채워 검색에서 사람을 끌어들인다. 사이트맵을 직접 세어 보면 2만 4천 개가 넘고 그 가운데 블로그 글만 1만 2천 개가 넘는다.\"}, {\"name\": \"기업과 보험사 대상 판매\", \"detail\": \"고용주, 제3자 관리기관, 보험사, 병원을 상대로 직원 한 사람당 월정액을 받는 별도 판매선이 있다. 관련 소개 페이지가 사이트에 스무 개 넘게 있다.\"}], \"differentiator\": \"k health은 같은 발상에서 출발했지만 지금은 mass general brigham, mayo clinic, cedars-sinai 같은 병원을 통해 파는 쪽으로 방향을 틀어서, 환자는 이 서비스를 병원 이름으로 만난다. ada health와 buoy health는 증상을 확인해 주는 데까지만 하고 실제 진료는 다른 곳으로 넘기기 때문에, 무료 상담과 유료 진료를 한 회사 안에서 잇지 못한다. doctronic은 무료 ai 상담과 자체 의사망을 한 회사 안에 붙여 두고 39달러라는 현금가를 공개 웹에 그대로 걸어 둔 점이 다르지만, 여기까지는 결합 방식의 차이일 뿐이다. 진짜로 다른 한 가지는 유타주와 맺은 규제 완화 협약인데, 사람 의사를 거치지 않고 ai가 처방을 갱신하도록 주 정부가 승인한 첫 사례이며 위에 든 회사 가운데 이것을 가진 곳은 없다.\", \"team\": [{\"name\": \"matt pavelle\", \"role\": \"공동 창업자 겸 co-ceo\", \"background\": \"패션 이커머스 회사 moda operandi의 창립 cto를 지냈고 렌트 리워드 스타트업 piñata rent를 공동 창업했다.\"}, {\"name\": \"adam oskowitz\", \"role\": \"공동 창업자\", \"background\": \"ucsf 혈관외과 조교수로 지금도 진료하는 외과 의사다.\"}, {\"name\": \"byron crowe\", \"role\": \"최고의료책임자\", \"background\": \"solera health 최고의료책임자와 하버드 의과대학 교원을 지낸 내과 전문의이며 2025년 10월에 합류했다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"union square ventures가 주도한 시드로 500만 달러를 받았다.\", \"when\": \"2025\", \"source\": \"sacra와 fundz의 회사 정보. 1차 보도자료를 찾지 못해 정확한 발표일은 확인하지 못했다.\"}, {\"type\": \"funding\", \"detail\": \"lightspeed venture partners가 주도한 시리즈 a로 2,000만 달러를 받았다. union square ventures, tusk ventures, hf0가 참여했고 fei-fei li가 엔젤로 들어왔다.\", \"when\": \"2025-09\", \"source\": \"pr newswire 보도자료, lightspeed 투자 소개글\"}, {\"type\": \"funding\", \"detail\": \"abstract와 lightspeed가 공동 주도한 시리즈 b로 4,000만 달러를 받았다. 12개월이 안 되는 기간에 세 번째 라운드이며 누적 조달액은 6,500만 달러가 넘는다.\", \"when\": \"2026-03\", \"source\": \"business wire 보도자료, stat news\"}, {\"type\": \"regulatory\", \"detail\": \"유타주 상무부 인공지능정책국과 규제 완화 협약을 맺어, 이미 다른 의사가 처방한 약 191개 품목에 한해 ai가 처방 갱신을 처리하는 12개월 파일럿을 시작했다. 협약 조건으로 갱신 문서에 이름이 들어가는 면허 의사를 두어야 하고 ai 위험을 포함한 의료과실보험을 유지해야 한다.\", \"when\": \"2026-01\", \"source\": \"유타주 상무부 보도자료, fierce healthcare, deseret news\"}, {\"type\": \"regulatory\", \"detail\": \"유타주 의료면허위원회 위원 14명 가운데 11명이 이 파일럿을 즉시 중단하라는 서한을 보냈으나 주 상무부가 요청을 기각했고 파일럿은 계속되고 있다.\", \"when\": \"2026-04\", \"source\": \"kuer, utah news dispatch\"}, {\"type\": \"revenue\", \"detail\": \"시리즈 a를 마감한 뒤 6개월 안에 매출이 15배 늘어 연환산으로 8자리, 즉 1,000만 달러 이상이 되었다고 밝혔다.\", \"when\": \"2026-03\", \"source\": \"회사 보도자료(business wire). 제삼자가 확인한 수치가 아니다.\"}, {\"type\": \"traffic\", \"detail\": \"주간 순방문자가 30만 명이 넘는다고 밝혔다.\", \"when\": \"2026-03\", \"source\": \"회사 보도자료(business wire). 제삼자가 확인한 수치가 아니다.\"}, {\"type\": \"traffic\", \"detail\": \"사이트맵을 직접 세어 보면 검색 유입용 건강 정보 페이지가 2만 4천 개가 넘는다. 방문자 대부분이 진료를 사러 온 것이 아니라 검색으로 들어온 사람이라는 뜻이다.\", \"when\": \"2026-09\", \"source\": \"https://www.doctronic.ai/sitemap.xml 의 하위 사이트맵 19개를 직접 집계\"}, {\"type\": \"partnership\", \"detail\": \"병원, 제3자 관리기관, 자가보험 고용주와 공동 브랜드 제휴를 맺고 있다고 밝혔다.\", \"when\": \"2026-03\", \"source\": \"회사 보도자료를 옮긴 the ai insider 기사. 제휴처 이름은 공개되지 않았다.\"}], \"caveats\": \"성장 수치는 전부 회사가 낸 것이고 제삼자가 확인한 것이 아니다. 15배 성장, 주간 방문자 30만 명, 연환산 매출 1,000만 달러가 모두 여기에 해당한다. 뉴스레터 필자가 계산한 2% 미만이라는 전환율은 매출 전액이 39달러 진료에서 나온다고 가정한 역산인데, 실제로는 월 99달러와 199달러짜리 glp-1 구독과 기업 대상 매출이 섞여 있으므로 진료 건수는 더 적고 전환율은 더 낮아질 가능성이 크다. 회사가 재방문 진료가 세 배 가까이 늘었다고 밝힌 점을 감안하면 월 21,000건이 21,000명을 뜻하지도 않는다. 회사가 내세우는 치료 계획 일치율 99.2%는 시리즈 a 발표 때 쓰던 수치가 그대로 다시 쓰인 것으로 보이며, 근거가 되는 연구는 회사 지분을 가진 사람들이 쓴 medrxiv 사전 공개 논문이고 대상도 기존 웹사이트 챗봇이다. 여기에 더해 펜실베이니아대학교의 eric bressman은 회사가 내놓은 검증 연구에서 원격진료 사례 500건을 놓고 ai와 사람 의사의 판단이 일치한 비율이 80%에 그쳤다고 지적했다. 99.2%와 80%가 모두 회사 쪽 자료에서 나온 수치이므로 어느 것을 인용하느냐에 따라 그림이 완전히 달라진다. 뉴스레터가 인용한 endpoints news의 체험기는 기자가 물리치료사 의뢰를 받으려고 39달러 진료를 직접 써 본 기록인데, 경험이 일관되지 않았고 matt pavelle 대표도 개선이 필요하다는 점을 인정했다고 매체가 정리했다. 보안업체 mindgard는 공개된 챗봇에 존재하지 않는 규제 공지를 만들어 넣어, 옥시콘틴 표준 용량의 세 배를 제시하게 만들었다고 발표했다. 회사와 유타주는 그것이 실제 환자 처방을 처리하는 운영 환경이 아니라고 반박했다. jama health forum은 유타주 협약이 회사에 환자 의무기록 보관과 제공 의무를 면제해 주고, 이용약관은 정확성과 그로 인한 피해에 대한 책임을 부인한다고 지적했다. 유타주 의료면허위원회 위원장 alan smith는 사망자가 나올 때까지 아무 조치도 취해지지 않을까 두렵다고 말했고, 미국의사협회도 처방 갱신이 단순히 확인만 하고 넘어갈 일이 아니라고 논평했다. forbes는 2026년 7월 기사에서 처방 결정의 72%를 ai가 스스로 처리했고 그 가운데 3%는 나중에 사람 의사가 뒤집었다고 전했는데, 본문을 직접 확인하지 못해 참고로만 둔다. 앱스토어 설명 맨 끝과 회사 소개 페이지 하단에는 doctronic이 ai 의사이지 면허 의사가 아니며 의료 행위를 하지 않고 의학적 조언을 제공하지 않는다는 문구가 붙어 있어, ai 의사라는 마케팅 표현과 어긋난다. 사이트 안에서도 표기가 갈린다. 진료비는 39달러와 40달러가 함께 쓰이고, 의사 연결 대기 시간은 30분 이내, 평균 15분, 평균 5분이 페이지마다 다르게 적혀 있다. 앱 평가 수가 매우 적어서(아이폰 23개, 구글 플레이 35개, 설치 1천 회 이상) 실제 사용은 앱이 아니라 웹에 몰려 있다고 보아야 한다.\", \"for_us\": \"가장 눈여겨볼 대목은 낮은 전환율이 아니라 그 분모다. 주간 30만 명이 ai에게 건강을 물어보려고 찾아오는데 그 가운데 2%도 유료 진료로 넘어가지 않는다면, 무료로 물어볼 창구에 대한 수요가 진료 수요보다 훨씬 크다는 뜻이다. 우리는 진료를 팔 이유가 없으므로 이 수요가 그대로 앱을 열 이유가 된다. 설계에서 가져올 것이 세 가지 있다. 첫째, 가입도 로그인도 요구하지 않고 익명으로 바로 물어보게 한 진입 방식이다. 둘째, 상담 결과를 soap 노트라는 문서로 만들어 주고 그것을 자기가 다니던 병원에 가져가라고 안내하는 방식인데, 답변의 역할을 정보 제공과 기록 정리로 묶어 두면 진단이나 처방으로 읽히지 않게 하면서도 사용자에게 손에 잡히는 결과물을 남길 수 있다. 셋째, 면책 문구를 앱 설명과 서비스 안에 명시적으로 붙여 둔 방식이다. 증상과 검진 수치, 복용 중인 약에 대해 물어보는 상담 창구는 3개월 안에 소프트웨어만으로 붙일 수 있고, 우리 앱에는 이미 검진 수치와 식단 기록이 있으므로 물어볼 재료도 갖춰져 있다. 다만 트래픽 엔진인 검색 유입용 2만 페이지는 앱에서 그대로 따라 할 수 없는 부분이고, 유타주 규제 협약이나 50개 주 의사망은 3개월과 소프트웨어 인력이라는 조건 밖에 있으므로 제외한다.\", \"screenshots\": [{\"file\": \"doctronic_home.png\", \"caption\": \"첫 화면 가운데에 증상 입력창 하나만 놓여 있고, 그 아래에 무료이고 익명이며 의사들이 만들었다는 문구가 붙어 있다. 위쪽에는 39달러 방문당 결제와 모든 보험을 받는다는 안내가 함께 적혀 있다.\", \"from\": \"https://www.doctronic.ai\"}, {\"file\": \"doctronic_how.png\", \"caption\": \"ai 의사가 어떻게 작동하는지 네 단계로 설명하는 페이지다. 무료 ai 상담에서 면허 의사 화상 진료로 넘어가는 지점이 어디인지, 대기 시간과 값이 얼마인지 보여 준다.\", \"from\": \"https://www.doctronic.ai/how-your-ai-doctor-works/\"}, {\"file\": \"doctronic_pricing.png\", \"caption\": \"값 안내 페이지다. ai 상담은 영원히 0달러, 면허 의사 진료는 39달러 또는 보험 본인부담금, 기업은 직원 한 사람당 월정액으로 세 갈래를 나눠 놓았다.\", \"from\": \"https://www.doctronic.ai/quality-care-in-seconds-pricing-that-makes-sense/\"}, {\"file\": \"doctronic_ios.png\", \"caption\": \"미국 아이폰 앱스토어 페이지다. 무료 앱이고 2025년 11월에 나왔으며 평점 4.4에 평가가 23개뿐이어서, 실제 사용이 앱이 아니라 웹에 몰려 있음을 보여 준다.\", \"from\": \"https://apps.apple.com/us/app/doctronic/id6753094320\"}], \"sources\": [{\"title\": \"doctronic 공식 사이트 첫 화면\", \"url\": \"https://www.doctronic.ai\", \"note\": \"무료와 익명 상담, 39달러 방문당 결제, 50개 주 진료 가능이라는 핵심 문구를 확인했다.\"}, {\"title\": \"quality care in seconds, pricing that makes sense\", \"url\": \"https://www.doctronic.ai/quality-care-in-seconds-pricing-that-makes-sense/\", \"note\": \"ai 상담 0달러, 의사 진료 39달러, 기업용 월정액이라는 세 갈래 값 구조를 확인했다.\"}, {\"title\": \"how your ai doctor works\", \"url\": \"https://www.doctronic.ai/how-your-ai-doctor-works/\", \"note\": \"증상 입력에서 의사 연결까지의 네 단계 흐름과 평균 대기 15분이라는 표기를 확인했다.\"}, {\"title\": \"doctronic resource center\", \"url\": \"https://www.doctronic.ai/resource-center/\", \"note\": \"무료와 유료의 경계, 진단서가 39달러 진료에 포함된다는 점, 로그인 없이 쓸 수 있다는 점을 확인했다.\"}, {\"title\": \"glp-1 처방 관리 값 안내\", \"url\": \"https://www.doctronic.ai/glp-99/\", \"note\": \"월 99달러 구독이며 약값은 포함되지 않는다는 문구를 확인했다. 199달러 상품도 같은 형식으로 따로 있다.\"}, {\"title\": \"doctronic physicians group\", \"url\": \"https://www.doctronicpg.com/\", \"note\": \"실제 진료를 맡는 의사들이 본사와 분리된 별도 법인 소속이며 50개 주에서 진료한다는 설명을 확인했다.\"}, {\"title\": \"doctronic 사이트맵\", \"url\": \"https://www.doctronic.ai/sitemap.xml\", \"note\": \"하위 사이트맵 19개를 직접 세어 검색 유입용 페이지가 2만 4천 개가 넘는다는 것을 확인했다.\"}, {\"title\": \"doctronic 아이폰 앱\", \"url\": \"https://apps.apple.com/us/app/doctronic/id6753094320\", \"note\": \"무료 soap 노트 제공, 평균 대기 5분, 평점 4.4에 평가 23개, 그리고 의료 행위를 하지 않는다는 면책 문구를 확인했다.\"}, {\"title\": \"doctronic 안드로이드 앱\", \"url\": \"https://play.google.com/store/apps/details?id=ai.doctronic.app\", \"note\": \"설치 1천 회 이상, 평점 4.2에 리뷰 35개, 본사 주소가 뉴욕이라는 것을 확인했다.\"}, {\"title\": \"doctronic raises $40m series b (business wire)\", \"url\": \"https://www.businesswire.com/news/home/20260324814372/en/doctronic-raises-$40m-series-b-following-breakthrough-as-first-ai-to-legally-renew-prescriptions-in-the-u.s.\", \"note\": \"시리즈 b 4,000만 달러, 주도 투자사, 15배 성장과 주간 방문자 30만 명이라는 회사 발표 수치를 확인했다.\"}, {\"title\": \"doctronic raises $40 million as race to apply ai in clinical care heats up (stat news)\", \"url\": \"https://www.statnews.com/2026/03/23/ai-doctor-startup-doctronic-raises-40-million/\", \"note\": \"누적 조달 6,500만 달러와 올해 매출 1,000만 달러 전망을 확인했다. 유료 구독 기사라 본문 일부만 열람했다.\"}, {\"title\": \"doctronic raises $20 million series a (pr newswire)\", \"url\": \"https://www.prnewswire.com/news-releases/doctronic-raises-20-million-series-a-to-bring-private-and-personalized-ai-doctor-to-the-masses-302556195.html\", \"note\": \"2025년 9월 시리즈 a 2,000만 달러와 참여 투자자 명단을 확인했다.\"}, {\"title\": \"investing in doctronic (lightspeed venture partners)\", \"url\": \"https://lsvp.com/stories/investing-in-doctronic-ai-healthcares-24-7-digital-doctor/\", \"note\": \"창업자 두 사람의 경력과 투자사의 판단 근거를 확인했다.\"}, {\"title\": \"doctronic ai appoints dr. byron crowe as chief medical officer\", \"url\": \"https://www.businesswire.com/news/home/20251015771722/en/doctronic-ai-appoints-dr.-byron-crowe-as-chief-medical-officer-to-lead-next-stage-of-clinical-innovation\", \"note\": \"최고의료책임자 임명과 이전 경력을 확인했다.\"}, {\"title\": \"utah and doctronic announce groundbreaking partnership for ai prescription medication renewals\", \"url\": \"https://commerce.utah.gov/2026/01/06/news-release-utah-and-doctronic-announce-groundbreaking-partnership-for-ai-prescription-medication-renewals/\", \"note\": \"유타주 규제 완화 협약의 공식 발표다. 직접 열람은 차단되어 검색 결과 요약과 다른 보도로 내용을 확인했다.\"}, {\"title\": \"utah tests ai for routine medication refills through regulatory relief program (fierce healthcare)\", \"url\": \"https://www.fiercehealthcare.com/ai-and-machine-learning/doctronic-partners-utah-ai-sandbox\", \"note\": \"규제 샌드박스의 범위와 제외 약물, 안전 장치를 확인했다.\"}, {\"title\": \"utah dismisses medical board call to halt its pioneering ai prescription program (kuer)\", \"url\": \"https://www.kuer.org/health/2026-04-28/utah-dismisses-medical-board-call-to-halt-its-pioneering-ai-prescription-program\", \"note\": \"의료면허위원회의 중단 요청과 주 정부의 기각, 1단계에서는 면허 의사가 모든 처방 결정을 검토한다는 해명을 확인했다.\"}, {\"title\": \"new tech, familiar problems (endpoints news)\", \"url\": \"https://endpoints.news/new-tech-familiar-problems/\", \"note\": \"뉴스레터가 인용한 ngai yeung 기자의 2026년 3월 26일 체험기다. 물리치료사 의뢰를 받으려고 39달러 진료를 써 봤으나 경험이 일관되지 않았고 대표도 개선 필요를 인정했다는 내용이다. 유료 구독 벽 때문에 도입부와 매체 요약만 확인했다.\"}, {\"title\": \"is ai ready to refill prescriptions? doctors are wary of utah's automated program (kuer)\", \"url\": \"https://www.kuer.org/health/2026-07-06/is-ai-ready-to-refill-prescriptions-doctors-are-wary-of-utahs-automated-program\", \"note\": \"유타주 의료면허위원장의 발언과, 회사 검증 연구에서 사람 의사와의 일치율이 500건 기준 80%였다는 펜실베이니아대학교 eric bressman의 지적을 확인했다.\"}, {\"title\": \"here are 3 ai companies betting they can replace doctors (forbes)\", \"url\": \"https://www.forbes.com/sites/jessepines/2026/07/24/here-are-3-ai-companies-betting-they-can-replace-doctors/\", \"note\": \"처방 결정의 72%를 ai가 자율로 처리했고 그중 3%를 사람 의사가 뒤집었다는 수치가 나온 기사다. 본문을 직접 열람하지 못해 참고용으로만 두었다.\"}, {\"title\": \"ai doctor doctronic raises $40m series b, but faces controversy (telecare aware)\", \"url\": \"https://telecareaware.com/ai-doctor-doctronic-raises-40m-series-b-but-faces-controversy-on-autonomous-rx-renewals-in-utah-and-effectiveness-claims/\", \"note\": \"임상 검증 방식에 대한 jama health forum의 지적과 책임 소재 문제를 확인했다.\"}, {\"title\": \"utah's new medical chatbot can be easily hacked to give dangerous medical advice (mindgard)\", \"url\": \"https://mindgard.ai/blog/doctronic-is-now-accepting-new-patients-and-unsafe-instructions\", \"note\": \"공개 챗봇을 조작해 옥시콘틴 용량을 세 배로 제시하게 만든 실험을 확인했다.\"}, {\"title\": \"the saga of utah's rx refill bot (medcity news)\", \"url\": \"https://medcitynews.com/2026/03/utah-prescription-medication-ai-doctronic-mindgard/\", \"note\": \"보안 실험이 운영 환경이 아닌 공개 챗봇 대상이었다는 회사와 주 정부의 반박을 확인했다.\"}, {\"title\": \"key facts about the uninsured population (kff)\", \"url\": \"https://www.kff.org/uninsured/fact-sheet/key-facts-about-the-uninsured-population/\", \"note\": \"2024년 기준 무보험 인구 2,670만 명과 비용 때문에 진료를 미룬 비율을 확인했다.\"}, {\"title\": \"k health 공식 사이트\", \"url\": \"https://khealth.com/\", \"note\": \"지금은 mass general brigham, mayo clinic, cedars-sinai 등 병원을 통해 판매하는 구조로 바뀌었음을 확인했다.\"}, {\"title\": \"buoy health 공식 사이트\", \"url\": \"https://www.buoyhealth.com/\", \"note\": \"무료 증상 확인 도구까지만 제공하고 진료는 다른 곳으로 넘긴다는 점을 확인했다.\"}]}"},{"slug":"emed","name":"eMed","one_liner":"고용주를 통해 직원에게 비만 치료제(GLP-1)를 공급하고, 중간에 그만두지 않도록 관리해 주는 회사다.","sells_to":"mixed","seen_in":[{"issue":"26","section":17,"headline":"장수 의료(롱제비티) 기관으로 소개된 eMed가 기업가치 20억 달러가 넘는 조건으로 2억 달러를 조달했고, 보험 중개 회사 Aon이 라운드를 주도했으며, 환자 순응도 90%를 상품의 근거로 내세웠다."}],"card":{"problem":"미국에서는 일하는 사람 대부분이 회사를 통해 건강보험에 들기 때문에, 비만 치료제(GLP-1)를 쓰는 직원이 늘면 그 비용이 곧바로 고용주의 지출로 잡힌다. 그런데 1년 안에 절반이 넘는 사람이 약을 끊기 때문에 고용주는 결과가 남지 않은 채 약값만 치르게 된다.","solution":"eMed는 고용주와 계약해 직원에게 집에서 하는 채혈 검사와 처방, 주 1회 체크인을 묶어 공급하고, 중간에 그만두지 않도록 관리하는 대가를 받는다. 직원의 체중 감량과 복약 지속이 목표에 못 미치면 받는 돈을 깎겠다고 내걸었다.","price":"고용주를 거치는 경로는 상품마다 직원이 내는 돈이 다르고, 개인이 직접 가입하면 최초 검사비 49달러에 월 회비 149.99달러와 약값 월 149.99달러가 따로 붙어 매달 300달러 정도가 든다.","tags":["비만 치료제","고용주 판매","자가 채혈","원격진료","복약 관리"],"headline_traction":"2026년 3월에 기업가치 20억 달러가 넘는 조건으로 시리즈 A 2억 달러를 조달했고, 보험 중개 회사 Aon이 라운드를 주도했다.","watch":"상품의 근거로 내세우는 순응도 90%는 원래 프로그램 잔류율을 다른 이름으로 바꿔 적은 것이며, 회사가 스스로 낸 수치이고 제삼자가 검증하지 않았다."},"screenshots":[{"file":"emed_home.png","caption":"첫 화면. 고용주용과 개인용 두 갈래로 나뉘어 있고, 내세우는 문구가 '시작하기 쉽고 계속하기는 더 쉽다'이다.","from":"https://www.emed.com"},{"file":"emed_claims.png","caption":"순응도 90%의 실제 표기. '10명 중 9명이 처방대로 따른다', '10명 중 9명이 6개월 넘게 프로그램에 남는다'로 적혀 있고 출처는 'eMed Population Health Data (2025)'라는 자사 데이터다.","from":"https://www.emed.com/download"},{"file":"emed_pricing.png","caption":"소비자가 직접 가입할 때의 값. 최초 검사비 49달러, 약값 월 149.99달러부터, 회비 월 149.99달러가 각각 따로 붙는다.","from":"https://www.emed.com/join/home"}],"q":"{\"slug\": \"emed\", \"name\": \"emed\", \"one_liner\": \"고용주를 통해 직원에게 비만 치료제(glp-1)를 공급하고, 중간에 그만두지 않도록 관리해 주는 회사다.\", \"site\": \"https://www.emed.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"26\", \"section\": 17, \"headline\": \"장수 의료(롱제비티) 기관으로 소개된 emed가 기업가치 20억 달러가 넘는 조건으로 2억 달러를 조달했고, 보험 중개 회사 aon이 라운드를 주도했으며, 환자 순응도 90%를 상품의 근거로 내세웠다.\"}], \"card\": {\"problem\": \"미국에서는 일하는 사람 대부분이 회사를 통해 건강보험에 들기 때문에, 비만 치료제(glp-1)를 쓰는 직원이 늘면 그 비용이 곧바로 고용주의 지출로 잡힌다. 그런데 1년 안에 절반이 넘는 사람이 약을 끊기 때문에 고용주는 결과가 남지 않은 채 약값만 치르게 된다.\", \"solution\": \"emed는 고용주와 계약해 직원에게 집에서 하는 채혈 검사와 처방, 주 1회 체크인을 묶어 공급하고, 중간에 그만두지 않도록 관리하는 대가를 받는다. 직원의 체중 감량과 복약 지속이 목표에 못 미치면 받는 돈을 깎겠다고 내걸었다.\", \"price\": \"고용주를 거치는 경로는 상품마다 직원이 내는 돈이 다르고, 개인이 직접 가입하면 최초 검사비 49달러에 월 회비 149.99달러와 약값 월 149.99달러가 따로 붙어 매달 300달러 정도가 든다.\", \"tags\": [\"비만 치료제\", \"고용주 판매\", \"자가 채혈\", \"원격진료\", \"복약 관리\"], \"headline_traction\": \"2026년 3월에 기업가치 20억 달러가 넘는 조건으로 시리즈 a 2억 달러를 조달했고, 보험 중개 회사 aon이 라운드를 주도했다.\", \"watch\": \"상품의 근거로 내세우는 순응도 90%는 원래 프로그램 잔류율을 다른 이름으로 바꿔 적은 것이며, 회사가 스스로 낸 수치이고 제삼자가 검증하지 않았다.\"}, \"problem\": \"미국에서는 일하는 사람 대부분이 회사를 통해 건강보험에 든다. 폭스비즈니스 보도에 따르면 미국인의 60% 이상이 직장을 통해 의료 혜택을 받는다. 그래서 비싼 약을 쓰는 직원이 늘면 그 비용이 곧바로 고용주의 지출로 잡힌다. glp-1 계열 비만 치료제는 체중을 뺀 뒤에도 계속 써야 하는 약이라, 한 번 쓰기 시작하면 회사가 해마다 떠안는 고정 항목이 된다. 더 곤란한 대목은 돈을 낸 만큼 결과가 남지 않는다는 점이다. 과체중이거나 비만인 성인 12만 5,474명의 실사용 기록을 본 연구(jama network open, 2025년 1월)에서는 1년 안에 53.6%가 약을 끊었고, 당뇨가 없는 사람만 따로 보면 64.8%가 끊었다. 2년으로 늘리면 당뇨가 없는 사람의 84.4%가 끊었다. 중간에 그만두면 빠진 체중이 대체로 되돌아오므로 고용주는 결과 없이 약값만 치른 셈이 된다. 실제로 아직 절반이 넘는 고용주가 이 약을 보장 항목에 넣지 않았다. mercer 조사에 따르면 직원 500명 이상 고용주 가운데 체중 감량 약을 보장하는 곳은 2024년 기준 44%다. 한국은 전국민 건강보험이 있고 비만 치료제는 급여 대상이 아니어서 개인이 자기 돈으로 사기 때문에, 이 부담이 회사의 문제로 넘어오지 않는다.\", \"solution\": \"고용주가 계약하면 직원은 emed 앱으로 등록한다. 집으로 채혈 키트가 배송되고, 직원이 스스로 피를 뽑아 보내면 당화혈색소, 크레아티닌, 고감도 crp, 감마지티피, 지질 검사, 비타민 b12 여섯 가지를 측정한다. 그 결과를 계약 의료진이 검토해 약을 쓸 수 있는지 판정하고 처방까지 내린다. 약은 위고비 주사와 위고비 알약, 젭바운드처럼 fda 허가를 받은 정품만 쓰며, 약국 급여를 중개하는 사업자(pbm)를 거치지 않고 직접 조달하기 때문에 중간 마진이 붙지 않는다고 밝힌다. 처방 뒤에는 주 1회 체크인, 월 1회 진료 상담, 부작용에 대비한 상비약 꾸러미, 6개월과 12개월 시점의 재검사가 이어진다. 고용주에게는 직원의 체중 감량과 복약 지속을 보증하고 목표에 못 미치면 받는 돈을 깎겠다고 내걸었다. 소비자가 직접 가입하는 상품도 따로 있는데, 최초 검사비 49달러를 한 번 내고 월 회비 149.99달러를 내며, 약값은 월 149.99달러부터 별도로 붙는다. 셋을 합치면 첫 달에 350달러 가까이 들고 그 뒤로도 매달 300달러가 나간다. 보험은 받지 않는다.\", \"features\": [{\"name\": \"가정용 채혈 스크리닝 키트\", \"detail\": \"집으로 배송된 키트로 직접 피를 뽑아 여섯 가지 지표를 검사하고, 그 결과가 나와야 약을 처방받을 수 있다. 다른 병원에서 받은 검사지는 받아 주지 않는다.\"}, {\"name\": \"주 1회 체크인\", \"detail\": \"앱에서 1분이 채 걸리지 않는 문답으로 체중과 상태를 기록한다. 예약이 필요 없고 언제든 할 수 있다.\"}, {\"name\": \"부작용 대응 상비약 꾸러미\", \"detail\": \"메스꺼움처럼 흔한 부작용에 쓸 일반의약품을 프로그램에 포함해 함께 보낸다. 부작용 때문에 그만두는 일을 줄이려는 장치다.\"}, {\"name\": \"pbm을 거치지 않는 약 직접 조달\", \"detail\": \"약국 급여를 중개하는 사업자를 빼고 직접 조달하는 경로로 정품 약을 들여온다고 밝힌다. 고용주에게는 리베이트로 부풀려진 가격이 아니라 정해진 값을 제시한다.\"}, {\"name\": \"성과 보증 계약\", \"detail\": \"직원의 체중 감량과 복약 지속을 보증하고 목표에 미달하면 고용주가 내는 돈을 깎아 준다. 2026년 3월 조달과 함께 인두제 방식(가입자 1인당 정액 계약)도 새로 내놓겠다고 밝혔다.\"}, {\"name\": \"회사 부담이 없는 자율 가입형 상품\", \"detail\": \"고용주가 계약서에 서명만 하면 회사 비용은 0달러이고, 직원이 할인 코드를 받아 월 149.99달러에 약을 사는 방식이다. 기존 약국 급여 계약을 바꾸지 않아도 된다.\"}, {\"name\": \"의료 종사자 전용 요금제\", \"detail\": \"병원과 요양 시설 종사자를 겨냥한 별도 상품이다. 고용주가 대상자 1인당 월 25달러를 내고, 직원이 약값과 임상 지원 명목으로 월 99달러를 낸다.\"}, {\"name\": \"생활 습관 지원 연계\", \"detail\": \"thrive global과 손잡고 행동 변화와 생활 습관 지도를 프로그램에 붙였다.\"}], \"differentiator\": \"판매 경로에서 갈린다. emed는 소비자 광고가 아니라 보험 중개 회사 aon, 복리후생 운영 회사 alight, 약국 급여 사업자 cvs health를 통해 고용주에게 들어간다. hims & hers나 ro처럼 소비자에게 직접 팔아 성장한 원격진료 회사와는 들어가는 경로 자체가 다르다. 약을 다루는 방식도 다르다. 약사가 자체 조제한 복제 성분(컴파운딩 세마글루타이드)을 쓰지 않고 fda 허가를 받은 정품만 쓴다고 못 박는데, 2026년 초 fda가 조제 glp-1을 광고한 원격진료 회사 30곳에 경고장을 보냈을 때 emed가 명단에 없었던 것도 이 선택과 맞물린다. 성과를 보증하고 못 지키면 대금을 깎겠다는 계약도 흔치 않다. 다만 '순응도 90%'라는 주장 자체는 이 분야에서 특별하지 않다. omada는 12주 94%와 24주 84%를, hims & hers는 6개월 75%를 내걸고, noom은 구독 유지 기간을 순응도처럼 제시한다. 셋 다 검증받은 수치가 아니고 셋 다 분모가 유리하게 잡혀 있다. omada는 스스로 glp-1을 쓴다고 밝히고 관리 프로그램에 등록한 사람만 셌고, hims & hers는 6개월 시점 설문에 응답한 사람만 셌다. emed는 그 분모를 아예 밝히지 않았다.\", \"team\": [{\"name\": \"dr. patrice a. harris\", \"role\": \"공동창업자, emed, llc(모회사) 전 ceo\", \"background\": \"미국의사협회(ama) 174대 회장을 지낸 정신과 의사이며, 흑인 여성으로는 처음으로 그 자리에 올랐다. 2020년 emed를 공동창업했다. 2026년 8월 nemours children's health로 옮겼다.\"}, {\"name\": \"linda yaccarino\", \"role\": \"emed population health ceo\", \"background\": \"x(옛 트위터)의 ceo를 지냈고, x를 떠난 지 몇 주 만인 2025년 8월 5일 emed에 왔다. 다만 그가 맡은 곳은 창업자 harris가 이끌던 모회사가 아니라 glp-1 사업을 하는 자회사다.\"}, {\"name\": \"tom brady\", \"role\": \"founding chief wellness officer\", \"background\": \"슈퍼볼 7회 우승 미식축구 선수 출신이다. 2026년 1월 12일 최고 웰니스 책임자로 선임됐고 3월 조달 라운드에도 투자자로 참여했다.\"}, {\"name\": \"dr. dyan hes\", \"role\": \"chief medical officer\", \"background\": \"소아과 전문의이자 미국비만의학회 인증 의사로 비만 의학과 소아과에서 25년 넘게 일했다. 뉴욕에서 gramercy pediatrics를 세웠고 지금은 highline modern medicine의 의료 원장이다. 2025년 9월 30일 선임됐다.\"}, {\"name\": \"michael ferro jr.\", \"role\": \"영국 지주회사의 실질 지배자로 등기된 인물\", \"background\": \"merge healthcare를 세우고 tribune publishing(옛 tronc) 회장을 지낸 사업가다. 영국 기업등기소에 emed healthcare group holdings의 '중대한 지배력을 가진 자'로 2023년 8월 등록돼 있고, 연락처는 마이애미의 emed 본사로 적혀 있다. 그런데 emed 웹사이트의 경영진 명단에는 이 사람도, 같은 소송에서 최고 경영 책임자(executive chairman)로 지목된 justin dearborn도 나오지 않는다.\"}, {\"name\": \"eric larsen\", \"role\": \"회사 소개 페이지의 팀 명단에 오른 인물\", \"background\": \"unitedhealth group에서 부사장(evp)을 지냈다.\"}, {\"name\": \"david moore\", \"role\": \"회사 소개 페이지의 팀 명단에 오른 인물\", \"background\": \"novo nordisk에서 부사장(evp)을 지냈다. novo nordisk는 위고비를 만든 제약사다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"기업가치 20억 달러가 넘는 조건으로 시리즈 a 2억 달러를 조달했다. 보험 중개 회사 aon이 주도했고 tom brady, joe lonsdale, antonio gracias, tom ricketts, jeff aronin, ara cohen, r.j. melman, linda yaccarino가 참여했다. 돈은 인공지능 플랫폼 개발과 인두제 계약을 감당할 자기자본에 쓴다고 밝혔다.\", \"when\": \"2026-03\", \"source\": \"pr newswire 보도자료\"}, {\"type\": \"funding\", \"detail\": \"aon이 emed에 전략적 투자를 하고 자사 고용주 고객에게 emed를 공급하기로 했다. 투자 금액은 공개되지 않았다.\", \"when\": \"2025-08\", \"source\": \"pr newswire 보도자료\"}, {\"type\": \"regulatory\", \"detail\": \"abbott의 binaxnow 가정용 코로나 검사가 fda 긴급사용승인을 받았다. 화상으로 사람이 지켜보며 진행하는 첫 가정용 신속 검사였고, 그 화상 감독 플랫폼이 emed의 것이었다. 2021년 1월 23일 개당 25달러로 판매를 시작했다.\", \"when\": \"2020-12\", \"source\": \"abbott 보도자료, emed 보도자료\"}, {\"type\": \"customers\", \"detail\": \"코로나 시기에 오하이오주, 콜로라도주, 버지니아주, 매사추세츠주와 검사 키트 공급 계약을 맺었고 united airlines, american airlines, delta, procter & gamble, quest diagnostics와도 손잡았다. 2023년에는 미국 국립보건원(nih)의 '집에서 검사하고 바로 치료받기' 시범 사업에서 원격진료를 맡았다. 회사는 누적 이용자를 600만 명 이상이라고 밝힌다.\", \"when\": \"2021\", \"source\": \"emed 및 파트너사 보도자료\"}, {\"type\": \"customers\", \"detail\": \"영국 babylon health의 사업을 법정관리 절차에서 인수했다. nhs 환자를 보는 디지털 1차 진료 기관 gp at hand가 여기 포함된다. 인수 대금은 현금 679만 파운드였다. 널리 인용되는 '50만 파운드'는 잔여 지분 값일 뿐이다. 인수한 사업은 2024년 한 해 4,290만 파운드의 매출을 냈다.\", \"when\": \"2023-10\", \"source\": \"emed 보도자료, 영국 기업등기소 감사보고서\"}, {\"type\": \"customers\", \"detail\": \"나스닥 상장사 science 37 holdings를 주당 5.75달러, 약 3,800만 달러에 공개매수로 인수하고 상장을 폐지했다.\", \"when\": \"2024-03\", \"source\": \"미국 증권거래위원회(sec) 제출 서류\"}, {\"type\": \"revenue\", \"detail\": \"영국 법인의 감사보고서상 2024년 매출은 5,140만 파운드, 세후 손실은 2,040만 파운드였고 직원은 326명이었다. 미국 쪽 매출과 인원은 비상장이라 공개된 자료가 없다.\", \"when\": \"2024-12\", \"source\": \"영국 기업등기소 제출 서류\"}, {\"type\": \"partnership\", \"detail\": \"미국 최대 약국 급여 사업자 cvs health와 손잡고 고용주가 비용을 통제하며 glp-1을 제공할 수 있는 경로를 만들었다.\", \"when\": \"2026-02\", \"source\": \"emed 뉴스 페이지가 인용한 axios 보도\"}, {\"type\": \"partnership\", \"detail\": \"복리후생 운영 회사 alight, 그리고 crux와 제휴해 고용주 대상 glp-1 공급을 넓히기로 했다.\", \"when\": \"2026-08\", \"source\": \"business wire 보도자료\"}], \"caveats\": \"이 회사에서 가장 중요한 수치인 '순응도 90%'는 회사가 스스로 낸 것이고, 제삼자가 검증한 자료는 없다. 확인한 내용을 순서대로 적는다.\\n\\n첫째, 같은 숫자가 자리마다 다른 이름을 달고 있다. 회사 앱 안내 페이지는 '10명 중 9명이 처방받은 치료 계획을 따른다', '10명 중 9명이 6개월 넘게 프로그램에 남는다'로 적고 출처를 'emed population health data (2025)'라는 자사 데이터로 밝힌다. 즉 원래는 '프로그램 잔류율'이다. 보도자료는 이것을 '복약 순응도'로 바꿔 적고 업계 평균과 비교했다. 잔류율과 순응도는 다른 것을 세는 지표다.\\n\\n둘째, 표본 수도 순응도의 정의도 공개되지 않았다. emed가 유일하게 등록한 연구(영국 isrctn12421711)는 emed가 스스로 의뢰하고 스스로 돈을 대며 연구 책임자도 emed 직원이고, 단일 기관에서 대조군 없이 뒤돌아보는 방식이며 윤리 심의 대상도 아니다. 결과는 아직 없고 종료 시점은 2027년 4월로 미뤄졌다. 그 연구가 정의한 순응도는 '권고받은 프로그램 활동 가운데 환자가 완료한 비율', 곧 앱 활동 수행률이다. 약을 실제로 얼마나 썼는지를 재는 지표가 아니다.\\n\\n셋째, 회사가 내세운 독립 검증은 아직 존재하지 않는다. emed는 pitchbook에 '영국 회원 8,000명 이상을 유니버시티 칼리지 런던의 john deanfield 교수가 독립 분석했고 6개월 91% 이상이 나왔으며 nature medicine에 심사 중, 몇 주 안에 게재'라고 밝혔다. 그로부터 다섯 달 반이 지난 2026년 9월 현재 pubmed, europe pmc, crossref, nature medicine 어디에도 그 논문이 없다. 게다가 같은 연구의 표본 수가 자료마다 8,000명, 1만 3천 명, 1,000명으로 다르게 적혀 있다. pitchbook의 애널리스트는 이 주장이 '마땅히 갖춰야 할 동료 심사와 임상 검증을 갖추지 못했다'고 평했다.\\n\\n넷째, '업계 평균의 두 배'는 성립하지 않는다. 시기와 지표를 맞춘 최신 자료로 보면 prime therapeutics의 2024년 상반기 코호트(3만 3,607명, jmcp 2026)에서 1년 지속률이 60.9%, 복약 순응도(pdc 80% 이상)가 55.5%였고, 매사추세츠 메디케이드 코호트(7,493명, jmcp 2026)에서는 6개월 시점 지속률 60.8%, 순응도 60.1%였다. 이 기준으로 보면 90%는 두 배가 아니라 1.3배에서 1.5배 수준이다. '두 배'가 되려면 약이 품귀였던 2021년에서 2023년 사이의 12개월 지속률을 끌어와야 한다. 게다가 이탈은 초반에 몰려 있어서 6개월로 끊어 재면 숫자가 유리해진다. 1년 이탈의 71%가 첫 6개월에 일어난다.\\n\\n다섯째, 함께 내건 '99%가 6개월 안에 지표 하나 이상 개선'은 재는 항목이 여섯 가지여서 하나만 좋아져도 성립한다. 회사 faq도 '첫 검사에서 약 99%는 최소 한 항목이 정상 범위를 벗어난다'고 밝히고 있다.\\n\\n여섯째, 체중 감량 수치가 13개월 사이에 계속 바뀌었다. 2025년 8월 aon 발표는 22.4파운드, 2026년 1월과 3월 보도자료는 21파운드, 앱 안내 페이지는 6개월에 23파운드, 현재 고용주 페이지는 30파운드다. 어느 수치가 어느 집단인지 회사가 밝히지 않았다.\\n\\n일곱째, 라운드를 주도한 aon은 독립된 제삼자가 아니다. aon은 emed를 자사 고용주 고객에게 파는 유통 파트너이고, 웹사이트가 성과 근거로 드는 'aon workforce-focused analysis on glp-1s'도 aon이 만든 것이며, 그 분석 자체는 청구 데이터 5,000만 명 중 glp-1 사용자 13만 9천 명을 본 것이지 emed 참가자를 본 것이 아니다. 더 나아가 aon의 2025 회계연도 사업보고서(10-k) 별지에는 emed population health, inc.가 2025년 12월 31일 기준 aon의 자회사로 올라 있다. 투자자 이상의 관계다.\\n\\n여덟째, 회사를 상대로 한 소송이 진행 중이다. 체중 관리 자회사의 전 ceo였던 wendi mader가 2026년 5월 플로리다 남부 연방지방법원에 성차별과 보복 해고를 이유로 소송을 냈다(사건번호 1:26-cv-23258). 소장에는 회사가 정한 임상 절차를 건너뛰고 특정 인물에게 glp-1을 처방하도록 지시받았다는 주장도 담겨 있다. 이는 아직 입증되지 않은 원고 측 주장이고 피고들은 2026년 8월 각하 신청을 내며 전면 다투고 있으므로, 사실로 인용해서는 안 된다. 다만 '임상 관리가 붙은 glp-1'을 파는 회사에 대해 그 관리의 실행을 문제 삼는 주장이 제기됐다는 사실 자체는 기록해 둘 만하다.\\n\\n아홉째, 영국에서는 인수 뒤에 마찰이 있었다. 2024년 3월 emed는 임상의 정리해고 협의를 시작했고 영국의사협회(bma)는 이 협의가 '위법일 가능성이 매우 높고 간접 차별에 해당한다'고 밝혔다. gp at hand의 등록 환자는 11만 1천 명에서 9만 6천 명으로 줄었고 bupa 계약은 2025년 1월 종료됐다. 앞서 2022년에는 abbott가 미수금 문제로 emed를 상대로 중재를 걸었고 법원이 emed에게 중재에 응하라고 명령했다.\\n\\n열째, 소비자용 앱의 사용 흔적이 아주 적다. 미국 앱스토어는 평점 4.2에 평가 10건, 구글 플레이는 평점 2.7에 평가 6건이고 내려받기가 1,000회 이상 구간이다. 개인 가입 페이지가 내세우는 '회원 5만 명'은 영국 shemed와 hemed의 환자 수와 같은 숫자인데, 영국 앱은 평가가 6,300건대다. 미국 소비자 사업은 이제 막 시작한 것으로 보인다.\\n\\n마지막으로, 뉴스레터가 쓴 '롱제비티 진료 기관'이라는 표현은 회사의 현재 사업과 맞지 않는다. 웹사이트에 롱제비티나 펩타이드를 다루는 페이지가 없고 해당 주소는 모두 없는 문서로 나온다. ceo가 axios 인터뷰에서 앞으로 펩타이드 영역 전반을 살펴보겠다고 말했으므로, 그 표현은 현재 사업이 아니라 계획을 가리킨 것으로 보인다. 참고로 인터넷에 도는 '2022년 미국 보건복지부와 최대 12억 달러 규모 계약'이라는 내용은 근거가 없다. 연방 조달 기록에서 emed 앞으로 확인되는 계약은 연방항공청 97만 2,623달러와 교육부 4,250달러가 전부다.\", \"for_us\": \"약을 파는 대목은 우리가 할 수 없다. 그러나 emed가 값을 받아 내는 지점은 약 자체가 아니라 '끊지 않게 만드는 관리'이고, 그 관리의 실제 내용은 1분이 안 걸리는 주 1회 체크인, 투약 알림, 진도 그래프, 부작용이 생겼을 때 바로 응대하는 상담 창구다. 전부 앱 화면에서 되는 일이고 의료기기 허가도 필요 없다. 회사도 앱을 '추적·분석 도구이며 의료기기가 아니다'라고 명시한다. 우리 앱은 걸음 리워드로 매일 여는 습관을 이미 만들어 두었으므로, 비만 치료제를 이미 쓰고 있는 사람을 위한 동반 트랙(주사 요일 알림, 투여 기록, 부작용 기록, 단백질 섭취와 걷기 과제)을 3개월 안에 붙일 수 있다. 다만 대상이 약 사용자로 좁아지므로, 우리 미국 사용자 가운데 실제로 glp-1을 쓰는 사람이 시험에 충분한 수인지 먼저 세어 봐야 한다. 두 번째로 볼 것은 값을 정당화하는 방식이다. emed는 '체중 감량과 복약 지속을 보증하고 못 지키면 대금을 깎는다'는 계약을 내걸었다. 우리가 지속 이용률 자체를 상품으로 팔려면 결국 같은 형태의 약속을 숫자로 내걸 수 있어야 한다. 세 번째는 반대 방향의 교훈이다. emed는 '앱에 남아 있는 비율'을 '약을 제대로 쓰는 비율'로 바꿔 부르면서 20억 달러짜리 이야기를 만들었다. 우리가 같은 종류의 지표를 낼 때는 무엇을 세는지, 분모가 무엇인지 먼저 정해 두어야 나중에 뒤집히지 않는다.\", \"screenshots\": [{\"file\": \"emed_home.png\", \"caption\": \"첫 화면. 고용주용과 개인용 두 갈래로 나뉘어 있고, 내세우는 문구가 '시작하기 쉽고 계속하기는 더 쉽다'이다.\", \"from\": \"https://www.emed.com\"}, {\"file\": \"emed_claims.png\", \"caption\": \"순응도 90%의 실제 표기. '10명 중 9명이 처방대로 따른다', '10명 중 9명이 6개월 넘게 프로그램에 남는다'로 적혀 있고 출처는 'emed population health data (2025)'라는 자사 데이터다.\", \"from\": \"https://www.emed.com/download\"}, {\"file\": \"emed_pricing.png\", \"caption\": \"소비자가 직접 가입할 때의 값. 최초 검사비 49달러, 약값 월 149.99달러부터, 회비 월 149.99달러가 각각 따로 붙는다.\", \"from\": \"https://www.emed.com/join/home\"}, {\"file\": \"emed_ios.png\", \"caption\": \"미국 앱스토어 페이지. 앱 설명이 '회사가 지원하는 체중 관리'로 되어 있어 고용주를 거쳐 들어오는 사람을 위한 도구임을 드러낸다. 평점 4.2에 평가 10건뿐이다.\", \"from\": \"https://apps.apple.com/us/app/emed-population-health/id6741202488\"}], \"sources\": [{\"title\": \"emed 첫 화면\", \"url\": \"https://www.emed.com\", \"note\": \"고용주용과 개인용으로 갈리는 구조와 내세우는 문구를 확인했다.\"}, {\"title\": \"emed 고용주용 페이지\", \"url\": \"https://www.emed.com/employers\", \"note\": \"pbm을 빼고 약을 직접 조달한다는 설명, 성과 보증 문구, 자가 채혈 검사 여섯 항목, 회원 여정 절차를 확인했다.\"}, {\"title\": \"emed 개인 가입 페이지\", \"url\": \"https://www.emed.com/join/home\", \"note\": \"소비자가 직접 낼 값(49달러, 149.99달러, 149.99달러)과 위고비 알약 취급 사실을 확인했다.\"}, {\"title\": \"emed 개인 가입 faq\", \"url\": \"https://www.emed.com/join/faq\", \"note\": \"fda 허가 정품만 쓴다는 답변, 처방 약은 위고비라는 답변, 자사 검사 키트만 인정한다는 답변, 첫 검사에서 약 99%가 한 항목 이상 정상 범위를 벗어난다는 서술을 확인했다.\"}, {\"title\": \"emed 앱 안내 페이지\", \"url\": \"https://www.emed.com/download\", \"note\": \"순응도 90%의 실제 표기와 출처 표시('emed population health data (2025)')를 확인했다.\"}, {\"title\": \"emed 회사 소개 페이지\", \"url\": \"https://www.emed.com/about\", \"note\": \"경영진 명단, 코로나 시기 실적 주장, aon과 thrive global, cvs health 제휴 표기를 확인했다.\"}, {\"title\": \"emed 자율 가입형 상품 페이지\", \"url\": \"https://www.emed.com/voluntary\", \"note\": \"회사 부담 0달러, 직원이 월 149.99달러를 내는 방식임을 확인했다.\"}, {\"title\": \"emed 영국 사업 페이지\", \"url\": \"https://www.emed.com/uk\", \"note\": \"nhs 환자 10만 명 이상 1차 진료, shemed와 hemed로 5만 명 이상 관리를 확인했다.\"}, {\"title\": \"tom brady 최고 웰니스 책임자 선임 보도자료\", \"url\": \"https://www.emed.com/in-the-news/tom-brady-named-chief-wellness-officer-of-emed\", \"note\": \"2026년 1월 12일 자다. 순응도 90%, 평균 21파운드 감량, 99% 지표 개선, 관리받지 않는 프로그램의 35% 순응도, 3년 차 최대 3배 투자 회수라는 주장을 원문 그대로 확인했다.\"}, {\"title\": \"2억 달러 조달 보도자료\", \"url\": \"https://www.prnewswire.com/news-releases/emed-raises-200-million-at-2-billion-plus-valuation-302725381.html\", \"note\": \"2026년 3월 26일 자다. 기업가치, 투자자 명단, 인두제 방식 도입 계획을 확인했다.\"}, {\"title\": \"aon 전략적 투자 보도자료\", \"url\": \"https://www.prnewswire.com/in/news-releases/aon-announces-strategic-investment-in-emed-to-scale-glp-1-population-health-platform-302532187.html\", \"note\": \"2025년 8월 18일 자다. aon이 자사 고용주 고객에게 emed를 공급한다는 내용과 aon 사내 프로그램 실적(등록 1,200명 이상, 평균 22.4파운드 감량, 유지율 95%)을 확인했다.\"}, {\"title\": \"aon 2025 회계연도 사업보고서 자회사 목록(sec 10-k 별지 21)\", \"url\": \"https://www.sec.gov/archives/edgar/data/315293/000162828026008116/exhibit2112025.htm\", \"note\": \"emed population health, inc.가 2025년 12월 31일 기준 aon의 자회사로 올라 있음을 확인했다.\"}, {\"title\": \"aon의 glp-1 인력 분석 보도자료\", \"url\": \"https://www.prnewswire.com/news-releases/aon-unveils-first-workforce-focused-analysis-on-glp-1s-medications-and-holistic-support-can-transform-workforce-health-and-bend-the-cost-curve-302441869.html\", \"note\": \"2025년 4월 30일 자다. 청구 데이터 5,000만 명 중 glp-1 사용자 13만 9천 명을 본 분석이며 emed 참가자 대상이 아님을 확인했다.\"}, {\"title\": \"pitchbook, 업계 통념을 뒤집는 순응도 주장으로 2억 달러를 조달했다\", \"url\": \"https://pitchbook.com/news/articles/linda-yaccarinos-glp-1-telehealth-unicorn-raises-200m-on-adherence-claim-that-bucks-industry-norm\", \"note\": \"emed가 주장한 유니버시티 칼리지 런던 분석과 nature medicine 게재 예정 발언, 애널리스트의 '동료 심사와 임상 검증이 없다'는 평가를 확인했다.\"}, {\"title\": \"emed가 등록한 유일한 연구(isrctn12421711)\", \"url\": \"https://www.isrctn.com/isrctn12421711\", \"note\": \"emed가 스스로 의뢰·자금을 대고 연구 책임자도 emed 직원이며, 순응도를 '권고 활동 완료 비율'로 정의하고, 결과가 없으며 종료가 2027년 4월로 미뤄졌음을 확인했다.\"}, {\"title\": \"rodriguez 외, glp-1 중단과 재개 연구(jama network open, 2025년 1월 31일)\", \"url\": \"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2829779\", \"note\": \"과체중 또는 비만인 성인 12만 5,474명 실사용 데이터다. 1년 중단률은 전체 53.6%, 당뇨가 없는 사람은 64.8%였고, 2년 중단률은 전체 72.2%, 당뇨가 없는 사람은 84.4%였다. 문제 정의의 근거로 썼다.\"}, {\"title\": \"meyer 외, 메디케이드 glp-1 순응도 연구(jmcp 2026)\", \"url\": \"https://pmc.ncbi.nlm.nih.gov/articles/pmc12948758/\", \"note\": \"7,493명에서 6개월 시점 지속률 60.8%, 순응도(pdc 80% 이상) 60.1%임을 확인했다. emed의 '두 배' 주장을 검증하는 기준으로 썼다.\"}, {\"title\": \"emed의 babylon 인수 보도자료\", \"url\": \"https://www.prnewswire.co.uk/news-releases/emed-healthcare-uk-promises-continuity-and-expansion-following-successful-acquisition-of-babylon---marking-a-new-era-for-digital-first-primary-care-in-the-uk-301962293.html\", \"note\": \"2023년 영국 babylon health와 gp at hand 인수를 확인했다. 대금 679만 파운드와 매출 수치는 영국 기업등기소 감사보고서(법인번호 15085216)에서 확인했다.\"}, {\"title\": \"emed의 science 37 공개매수 서류(sec)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1819113/000110465924013752/tm244930-1_sctot.htm\", \"note\": \"주당 5.75달러, 약 3,800만 달러 규모의 인수와 공동창업자 patrice harris의 직함을 확인했다.\"}, {\"title\": \"abbott, binaxnow 가정용 검사 fda 긴급사용승인 보도자료\", \"url\": \"https://abbott.mediaroom.com/2020-12-16-abbotts-binaxnow-covid-19-rapid-test-receives-fda-emergency-use-authorization-for-first-virtually-guided-at-home-rapid-test-using-emeds-digital-health-platform\", \"note\": \"2020년 12월 16일 자다. 화상 감독 플랫폼이 emed의 것임을 확인했다.\"}, {\"title\": \"mader 대 emed 소송 기록(미국 법원 전자기록)\", \"url\": \"https://www.courtlistener.com/docket/73318156/mader-v-emed-llc/\", \"note\": \"2026년 5월 8일 제소, 2026년 8월 각하 신청 등 진행 경과를 확인했다. 소장 내용은 입증되지 않은 원고 측 주장이다.\"}, {\"title\": \"pulse today, emed의 영국 임상의 정리해고와 bma의 문제 제기\", \"url\": \"https://www.pulsetoday.co.uk/news/workforce/emed-gp-redundancy-consultation-likely-to-be-unlawful-and-discriminatory-claims-bma/\", \"note\": \"2024년 4월 자다. 영국의사협회가 정리해고 협의를 위법 가능성이 높고 간접 차별에 해당한다고 밝힌 내용을 확인했다.\"}, {\"title\": \"linda yaccarino ceo 선임 보도자료\", \"url\": \"https://www.prnewswire.com/news-releases/emed-population-health-announces-appointment-of-former-x-twitter-ceo-linda-yaccarino-as-new-chief-executive-officer-302521918.html\", \"note\": \"2025년 8월 5일 자다. 취임한 법인이 모회사가 아니라 emed population health임을 확인했다.\"}, {\"title\": \"dr. dyan hes 최고 의료 책임자 선임 보도자료\", \"url\": \"https://www.prnewswire.com/news-releases/emed-population-health-appoints-dr-dyan-hes-as-chief-medical-officer-302570333.html\", \"note\": \"2025년 9월 30일 자다. 경력과 선임 시점을 확인했다.\"}, {\"title\": \"axios, glp-1 유니콘이 tom brady 등에게 2억 달러를 조달했다\", \"url\": \"https://www.axios.com/2026/03/26/glp-1-yaccarino-emed-tom-brady\", \"note\": \"비용을 나누고 순응도를 높이는 임상 프로그램을 제공한다는 사업 설명, 펩타이드 영역 확장과 해외 진출 계획, 경구용 glp-1의 순응도 불확실성 언급을 확인했다.\"}, {\"title\": \"employee benefit news, 의료 종사자용 glp-1 프로그램\", \"url\": \"https://www.benefitnews.com/news/tom-bradys-new-play-making-glp-1s-affordable-for-healthcare-workers\", \"note\": \"고용주가 1인당 월 25달러, 직원이 월 99달러를 내는 별도 가격 구조를 확인했다.\"}, {\"title\": \"fox business, tom brady가 emed와 손잡고 glp-1 접근을 넓힌다\", \"url\": \"https://www.foxbusiness.com/media/tom-brady-teams-digital-health-firm-emed-expand-glp-1-weight-loss-medication-access\", \"note\": \"미국인의 60% 이상이 직장을 통해 의료 혜택을 받는다는 서술을 확인했다.\"}, {\"title\": \"emed population health 아이폰 앱\", \"url\": \"https://apps.apple.com/us/app/emed-population-health/id6741202488\", \"note\": \"앱 설명이 회사가 지원하는 프로그램 참가자를 대상으로 하며, 평점 4.2에 평가 10건, 2026년 8월 24일 갱신임을 확인했다.\"}, {\"title\": \"emed 안드로이드 앱\", \"url\": \"https://play.google.com/store/apps/details?id=com.emed.s2p\", \"note\": \"평점 2.7에 평가 6건, 내려받기 1,000회 이상, 2026년 8월 24일 갱신을 확인했다.\"}, {\"title\": \"emed 뉴스 모음 페이지\", \"url\": \"https://www.emed.com/news\", \"note\": \"alight(2026년 8월), crux(2026년 7월), cvs health 제휴 소식과 mercer 조사 인용을 확인했다.\"}]}"},{"slug":"truemed","name":"Truemed","one_liner":"미국 직장인이 세금 혜택이 붙은 의료비 전용 계좌에 쌓아 둔 돈으로 운동기구와 보조제, 사우나 같은 건강 상품을 살 수 있도록, 온라인 상점 결제 화면에서 의사 소견서를 붙여 주는 결제 연동 회사다.","sells_to":"mixed","seen_in":[{"issue":"01","section":9,"headline":"HSA와 FSA에 쌓인 혜택 자금을 쓸 수 있게 해 주는 마켓플레이스로 소개되면서, a16z가 주도한 3,400만 달러 투자를 받았다고 나왔다."}],"card":{"problem":"미국 직장인은 세금을 떼기 전에 급여 일부를 의료비 전용 계좌(HSA·FSA)에 쌓아 두는데, 이 돈은 질병의 진단과 치료에만 쓸 수 있어서 운동기구나 보조제, 헬스장 회원권에는 원칙적으로 쓰지 못한다. FSA에 남은 돈은 해가 바뀌면 대부분 사라지므로 연말이 되면 쓰지 못한 금액을 잃는다.","solution":"Truemed는 제휴 상점의 결제 화면에서 건강 설문을 받고, 계약한 면허 의료인이 그 답변을 검토해 의학적 필요 소견서를 발급하면 그 자리에서 계좌 카드로 결제되게 해 준다. 한 번 발급된 소견서는 12개월 동안 유효해서 같은 상품을 다시 살 때 재사용할 수 있다.","price":"상품을 사는 경우에는 소비자가 Truemed에 따로 내는 돈이 없고 서비스 비용이 이미 상품 가격에 포함되어 있지만, 헬스장과 스튜디오는 방식이 달라서 회원이 소견서 한 건당 20달러를 직접 낸다.","tags":["세제 혜택 계좌","결제 연동","의사 소견서","건강 상품 구매","헬스장 회원권"],"headline_traction":"2025년 12월에 a16z가 주도한 시리즈 A로 3,400만 달러를 조달했다.","watch":"미국 국세청이 2024년에 자기 보고만으로 발급한 소견서로는 생활 지출을 의료비로 바꿀 수 없다는 경고를 냈고, 회사 이용약관도 세금 문제의 책임을 이용자 본인에게 넘겨 두었다."},"screenshots":[{"file":"truemed_shop.png","caption":"소비자용 마켓플레이스 첫 화면이다. HSA·FSA 자금을 실제로 원하는 상품에 쓰라는 문구와 평균 30퍼센트 절약, 이용자 100만 명이라는 표기가 보인다.","from":"https://shopping.truemed.com/hsa-fsa-shopping"},{"file":"truemed_brands.png","caption":"같은 페이지 전체다. Peloton과 Thorne, Tonal, Plunge, Orthofeet 같은 제휴 브랜드와 결제, 건강 설문, HSA·FSA 결제로 이어지는 3단계 이용 절차가 나와 있다.","from":"https://shopping.truemed.com/hsa-fsa-shopping"},{"file":"truemed_help.png","caption":"고객 도움말의 자격 기준 안내다. 세법 213(d)조를 근거로 삼되 일반적인 건강에 이롭기만 한 지출은 인정되지 않는다고 회사가 직접 설명하고 있다.","from":"https://help.truemed.com/eligibility-qualification/eligibility-qualification-overview"}],"q":"{\"slug\": \"truemed\", \"name\": \"truemed\", \"one_liner\": \"미국 직장인이 세금 혜택이 붙은 의료비 전용 계좌에 쌓아 둔 돈으로 운동기구와 보조제, 사우나 같은 건강 상품을 살 수 있도록, 온라인 상점 결제 화면에서 의사 소견서를 붙여 주는 결제 연동 회사다.\", \"site\": \"https://www.truemed.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"01\", \"section\": 9, \"headline\": \"hsa와 fsa에 쌓인 혜택 자금을 쓸 수 있게 해 주는 마켓플레이스로 소개되면서, a16z가 주도한 3,400만 달러 투자를 받았다고 나왔다.\"}], \"card\": {\"problem\": \"미국 직장인은 세금을 떼기 전에 급여 일부를 의료비 전용 계좌(hsa·fsa)에 쌓아 두는데, 이 돈은 질병의 진단과 치료에만 쓸 수 있어서 운동기구나 보조제, 헬스장 회원권에는 원칙적으로 쓰지 못한다. fsa에 남은 돈은 해가 바뀌면 대부분 사라지므로 연말이 되면 쓰지 못한 금액을 잃는다.\", \"solution\": \"truemed는 제휴 상점의 결제 화면에서 건강 설문을 받고, 계약한 면허 의료인이 그 답변을 검토해 의학적 필요 소견서를 발급하면 그 자리에서 계좌 카드로 결제되게 해 준다. 한 번 발급된 소견서는 12개월 동안 유효해서 같은 상품을 다시 살 때 재사용할 수 있다.\", \"price\": \"상품을 사는 경우에는 소비자가 truemed에 따로 내는 돈이 없고 서비스 비용이 이미 상품 가격에 포함되어 있지만, 헬스장과 스튜디오는 방식이 달라서 회원이 소견서 한 건당 20달러를 직접 낸다.\", \"tags\": [\"세제 혜택 계좌\", \"결제 연동\", \"의사 소견서\", \"건강 상품 구매\", \"헬스장 회원권\"], \"headline_traction\": \"2025년 12월에 a16z가 주도한 시리즈 a로 3,400만 달러를 조달했다.\", \"watch\": \"미국 국세청이 2024년에 자기 보고만으로 발급한 소견서로는 생활 지출을 의료비로 바꿀 수 없다는 경고를 냈고, 회사 이용약관도 세금 문제의 책임을 이용자 본인에게 넘겨 두었다.\"}, \"problem\": \"미국 직장인은 급여에서 세금을 떼기 전에 일부를 미리 떼어 hsa나 fsa라는 의료비 전용 계좌에 쌓아 둔다. hsa는 본인이 먼저 부담하는 금액이 큰 보험에 든 사람만 열 수 있고 남은 돈을 해마다 계속 이월할 수 있는 반면, fsa는 고용주가 제공하며 그해에 쓰지 못한 돈은 고용주가 정한 제도에 따라 2025년 기준 660달러까지만 다음 해로 넘길 수 있고 나머지는 사라진다. 문제는 이 돈을 쓸 수 있는 범위가 세법 213(d)조에 따라 질병의 진단과 치료, 완화, 처치, 예방으로 좁게 묶여 있어서, 헬스장 회원권이나 보조제, 운동기구처럼 건강에 도움이 되기만 하는 지출은 원칙적으로 인정되지 않는다는 점이다. 그래서 계좌에는 돈이 쌓여 있는데 정작 쓸 곳이 마땅치 않은 상황이 생기고, fsa 가입자는 연말이 되면 남은 돈을 잃는다. 한국의 연말정산 의료비 세액공제는 이미 쓴 돈을 사후에 깎아 주는 방식이라 이런 문제가 생기지 않으며, 급여를 미리 떼어 별도 계좌에 쌓아 두는 제도 자체가 한국에는 없다.\", \"solution\": \"소비자는 truemed와 제휴한 브랜드의 온라인 상점에서 상품을 고른 뒤 결제 화면에서 truemed를 선택한다. 그러면 현재 건강 상태와 진단받은 병, 이 상품을 사려는 이유를 묻는 건강 설문이 뜨고, truemed와 계약한 독립 면허 의료인이 그 답변을 검토한다. 의료인이 그 상품을 그 사람의 건강 상태에 필요하다고 판단하면 의학적 필요 소견서(letter of medical necessity)를 발급하고, 소비자는 그 자리에서 hsa나 fsa 카드로 결제한다. 결제 화면에 truemed가 붙어 있지 않은 상점이거나 구독 상품이면 일반 카드로 먼저 결제한 다음 같은 날 설문에 답하고, 보통 24시간에서 48시간 안에 검토 결과를 받아 계좌 운영사에 환급을 신청한다. 한 번 발급된 소견서는 12개월 동안 유효하고 같은 상품을 다시 살 때 재사용할 수 있다. 상품을 사는 경우 소비자가 truemed에 따로 내는 돈은 없다. 회사는 자사 서비스 비용이 이미 상품 가격에 포함돼 있다고 고지하며, 브랜드 계약서를 보면 truemed가 주문 금액에서 수수료를 먼저 떼고 나머지를 브랜드에 정산한다. 다만 헬스장과 스튜디오는 값을 매기는 방식이 다르다. 가맹점은 750달러를 한 번만 내고 그 뒤로는 거래 수수료도 월 이용료도 최소 금액도 없는 대신, 회원이 소견서 한 건당 20달러를 직접 낸다. 소비자용 모바일 앱은 없으며, 모든 절차는 제휴 상점의 결제 화면과 웹 화면에서 이루어진다.\", \"features\": [{\"name\": \"결제 화면 연동\", \"detail\": \"shopify와 woocommerce, bigcommerce, 직접 api로 상점에 붙어서 hsa·fsa 카드 결제를 그 자리에서 처리한다. 상품 페이지에는 이 상품이 대상인지 알려 주는 안내 표시가 붙는다.\"}, {\"name\": \"건강 설문과 의료인 검토\", \"detail\": \"소비자가 답한 건강 설문을 제휴 면허 의료인이 검토해 의학적 필요 소견서를 발급하거나 거절한다. 거절되면 결제 자체가 이루어지지 않는다.\"}, {\"name\": \"환급 지원\", \"detail\": \"결제 연동이 없는 상점이나 구독 상품은 일반 카드로 먼저 결제한 뒤, 소견서를 받아 계좌 운영사에 환급을 신청하도록 돕는다.\"}, {\"name\": \"소비자 마켓플레이스\", \"detail\": \"제휴 브랜드 3,000곳과 15개가 넘는 상품 분류를 모아 보여 주고, 상품을 고르면 해당 브랜드 상점으로 보낸다. 결제는 마켓플레이스가 아니라 브랜드 상점에서 이루어진다.\"}, {\"name\": \"상품 분류\", \"detail\": \"운동기구, 헬스 기기, 수면, 보조제, 적색광 치료, 기능성 신발, 사우나와 냉수욕, 재택 건강, 헬스장과 스튜디오로 나뉜다. 헬스장과 스튜디오 분류에는 barry's와 classpass, club pilates가 올라 있고 투자 보도자료에는 24 hour fitness도 제휴처로 나오므로, 헬스장 회원권도 실제로 대상이 된다.\"}, {\"name\": \"헬스장 전용 방식\", \"detail\": \"헬스장에서는 hsa·fsa 카드로 그 자리에서 결제하는 방식을 회사가 권하지 않는다. 카드사가 매기는 가맹점 업종 분류 때문에 헬스장에서는 승인이 나지 않는 경우가 많아서, 회원이 일반 카드로 결제하고 소견서를 받아 나중에 환급받는 방식만 쓴다. 가맹점 가입 비용도 이 경우에만 공개돼 있다.\"}], \"differentiator\": \"같은 일을 하는 회사로 flex와 sika health가 있고, 결제 화면에서 건강 설문을 받아 소견서를 발급한다는 구조는 세 회사가 같다. 실질적인 차이는 어느 브랜드와 붙어 있느냐이며, 소비자는 사려는 브랜드가 어느 회사를 쓰는지에 따라 선택이 갈린다. truemed는 제휴 브랜드가 3,000곳이 넘는다고 밝혀 세 회사 가운데 가장 많은 제휴처를 확보했다고 주장하며, peloton과 eight sleep, nike strength, garmin, 24 hour fitness처럼 이름이 알려진 브랜드를 제휴처로 확보했다. 기술 자체는 세 회사가 같기 때문에, 제휴 영업의 규모가 경쟁을 가르는 시장이다.\", \"team\": [{\"name\": \"justin mares\", \"role\": \"공동창업자, ceo\", \"background\": \"식품 브랜드 kettle & fire와 perfect keto를 창업해 키운 사람이다.\"}, {\"name\": \"calley means\", \"role\": \"공동창업자\", \"background\": \"맞춤 웨딩드레스 회사 anomalie를 공동창업해 david's bridal에 매각했고, 그 전에는 식품과 제약 업계를 상대하는 컨설턴트로 일했다. 2025년 3월부터 백악관 자문 자격으로 미국 보건복지부 장관을 보좌했고, 그해 말 정부 일을 정리하는 과정에서 truemed 지분을 전량 매각했다고 밝혔다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"3,400만 달러 규모 시리즈 a를 마감했다. a16z가 주도했고 bessemer venture partners와 long journey ventures, boxgroup, trust ventures가 참여했다.\", \"when\": \"2025-12\", \"source\": \"pr newswire 보도자료, a16z 투자 공지\"}, {\"type\": \"funding\", \"detail\": \"창업 초기에 350만 달러를 safe 방식으로 모았다. mark hyman과 thrive market, eight sleep, levels 창업자들이 참여했다.\", \"when\": \"2023-09\", \"source\": \"techcrunch\"}, {\"type\": \"customers\", \"detail\": \"제휴 가맹 브랜드가 3,000곳을 넘는다고 밝혔다.\", \"when\": \"2025-12\", \"source\": \"a16z 투자 공지, truemed 마켓플레이스 페이지\"}, {\"type\": \"revenue\", \"detail\": \"2년 연속으로 전년 대비 매출이 3배 늘었다고 밝혔다.\", \"when\": \"2025-12\", \"source\": \"pr newswire 보도자료\"}, {\"type\": \"customers\", \"detail\": \"이용자가 100만 명을 넘었다고 자사 마켓플레이스에 표기하고 있다.\", \"when\": \"2026-09\", \"source\": \"shopping.truemed.com 화면\"}, {\"type\": \"partnership\", \"detail\": \"peloton과 eight sleep, nike strength, 24 hour fitness, rogue fitness, garmin, barry's, thorne, tonal, plunge, ag1 등이 제휴 브랜드로 공개돼 있다.\", \"when\": \"2025-12\", \"source\": \"a16z 투자 공지, pr newswire 보도자료, truemed 마켓플레이스 화면\"}], \"caveats\": \"미국 국세청은 2024년 3월 6일에 이 방식을 겨냥한 경고를 냈다(ir-2024-65). 본인이 스스로 보고한 건강 정보만 근거로 의사가 써 준 소견서로는 원래 개인 지출인 식품과 운동 비용을 의료비로 바꿀 수 없고, 인정되지 않는 지출을 갚아 준 계좌는 자격을 잃어 그 계좌에서 나간 돈 전부가 소득으로 잡힐 수 있다는 내용이다. 다만 이 경고는 truemed를 이름으로 지목하지 않았고, 회사는 진단받은 병이 있어야 인정된다고 안내하면서 국세청 기준을 지키고 있다고 주장한다. 공동창업자 calley means를 둘러싼 이해충돌도 계속 문제가 됐다. means는 2025년 3월 18일에 특별정부직원 신분으로 백악관 자문에 임명돼 보건복지부 장관 robert f. kennedy jr.를 보좌하면서 truemed 지분을 그대로 들고 있었다. 지분 규모는 보도마다 달라 2,000만 달러대에서 5,000만 달러 사이로 엇갈리게 전해지므로 특정 금액을 확정해서 인용하지 않는 편이 안전하다. 하원의원 jake auchincloss는 2025년 6월 16일 means 본인과 truemed 이사회에 각각 서한을 보내, truemed의 기업 가치가 2024년 1월 이후 3배 가까이 올랐고 그 시점이 means의 임명 시기와 겹친다는 점을 문제 삼았다. 같은 의원과 상원의원 adam schiff는 2025년 10월 31일 백악관 비서실장과 보건복지부 장관에게 보낸 공동 서한에서, means가 직접 만든 정책으로 자기 회사가 이득을 봤다고 지적했다. 두 사람은 그 예로 truemed가 비데(alpha jx2 bidet)까지 자가면역과 소화기, 관절 건강에 도움이 된다며 hsa 대상 상품으로 광고한다는 점을 들었고, 근거 자료로는 9,000달러짜리 사우나에 세금 혜택을 받게 해 준다는 new york times 기사(2025년 7월 18일)를 인용했다. means는 2025년 말 정부를 떠나거나 정규직으로 자리를 옮기는 과정에서 지분을 전량 매각했다고 밝혔으나, 매각 시점에 대한 보도가 서로 조금씩 다르다. 2026년 6월에는 법무법인 migliaccio & rathod가 소비자에게 예상치 못한 세금 부담이 생겼는지 조사한다고 공지했으나, 소송이 실제로 제기되지는 않았다. 제휴 브랜드 3,000곳과 이용자 100만 명, 2년 연속 매출 3배 성장은 모두 회사가 스스로 낸 수치이고 제삼자가 확인한 것이 아니다. 브랜드 수는 직접 세어 검증하지 못했다. 이커머스 상품의 수수료율도 브랜드 계약서가 요율을 계약상 비밀로 못 박고 있어 밖에서는 알 수 없다. 평균 30퍼센트 절약이라는 문구도 소득이 있는 미국 중위 납세자의 세율을 가정해 계산한 값이라고 회사가 밝히고 있어서 개인마다 실제 절감액은 달라진다. 위험을 누가 지는지도 분명하다. 회사의 이용약관은 소견서를 받았다고 해서 계좌 운영사나 고용주가 인정한다는 보장이 없고, 미국 국세청이나 주·지방 세무당국이 그 지출을 213(d)조 인정 의료비로 볼 것이라는 보장도 없다고 적은 뒤, 소견서에 기대어 자격을 입증하는 일은 전적으로 이용자 본인의 위험이며 그에 따른 금전적 책임도 본인이 전부 진다고 명시한다. 회사 블로그에서는 국세청 규정에 어긋나지 않는다는 오해 풀이를 싣고 있지만, 약관에서는 그 책임을 이용자에게 넘겨 두었다는 점을 함께 봐야 한다. 참고로 회사 소개 페이지에는 이제 justin mares만 나오고 calley means의 이름은 나오지 않는다. 한편 헬스장 회원권과 운동비를 연 500달러까지 hsa 인정 의료비로 삼는 조항은 2025년 세법 개정안 가운데 하원 통과본에는 들어 있었으나 최종 법에서 삭제됐다. 그래서 지금 헬스장 회원권에 hsa를 쓰는 길은 이 소견서 방식밖에 없다. 이 회사의 사업이 법 개정 하나에 크게 흔들릴 수 있다는 뜻이기도 하다.\", \"for_us\": \"이 회사가 파는 것은 상품이 아니라 이 지출이 의료비로 인정된다는 판정과 그 근거 문서다. 결제 화면에서 설문 몇 개를 받아 판정을 붙여 주는 것만으로 소비자가 실제로 내는 값이 30퍼센트 가까이 줄어들기 때문에, 필요한 것은 기기나 임상 데이터가 아니라 소프트웨어와 제휴다. 다만 우리가 같은 일을 직접 하려면 면허 의료인 발급 체계와 세법 판단 책임을 함께 떠안아야 해서 3개월 안에 시도하기에는 위험이 크다. 대신 우리 앱 화면 안에서 할 수 있는 일이 두 가지 있다. 첫째, 미국 이용자에게 지금 hsa나 fsa에 얼마가 남아 있는지 알려 주고, fsa라면 연말까지 쓰지 않으면 사라지는 금액을 계산해 보여 주는 안내다. 둘째, truemed나 flex의 제휴 브랜드로 연결해 주는 자리를 만드는 것이며, 이렇게 하면 세법 판단은 그 회사가 하고 우리는 이용자를 연결하는 역할만 맡는다. 연말이라는 정해진 기한이 있고 쓰지 않으면 돈이 사라진다는 조건은 앱에서 알림과 목표를 붙이기에 잘 맞는다.\", \"screenshots\": [{\"file\": \"truemed_shop.png\", \"caption\": \"소비자용 마켓플레이스 첫 화면이다. hsa·fsa 자금을 실제로 원하는 상품에 쓰라는 문구와 평균 30퍼센트 절약, 이용자 100만 명이라는 표기가 보인다.\", \"from\": \"https://shopping.truemed.com/hsa-fsa-shopping\"}, {\"file\": \"truemed_brands.png\", \"caption\": \"같은 페이지 전체다. peloton과 thorne, tonal, plunge, orthofeet 같은 제휴 브랜드와 결제, 건강 설문, hsa·fsa 결제로 이어지는 3단계 이용 절차가 나와 있다.\", \"from\": \"https://shopping.truemed.com/hsa-fsa-shopping\"}, {\"file\": \"truemed_help.png\", \"caption\": \"고객 도움말의 자격 기준 안내다. 세법 213(d)조를 근거로 삼되 일반적인 건강에 이롭기만 한 지출은 인정되지 않는다고 회사가 직접 설명하고 있다.\", \"from\": \"https://help.truemed.com/eligibility-qualification/eligibility-qualification-overview\"}, {\"file\": \"truemed_merchant.png\", \"caption\": \"가맹점용 기술 문서다. 결제 처리와 환급 지원이라는 두 갈래로 상점에 붙는다는 설명이 나와 있다.\", \"from\": \"https://docs.truemed.com/guides/get-started/how-truemed-works\"}], \"sources\": [{\"title\": \"investing in truemed\", \"url\": \"https://a16z.com/announcement/investing-in-truemed/\", \"note\": \"a16z가 밝힌 투자 이유와 제휴 브랜드 3,000곳, 평균 30퍼센트 절약 수치를 확인했다.\"}, {\"title\": \"truemed closes $34 million series a to unlock hsa/fsa funds for lifestyle interventions\", \"url\": \"https://www.prnewswire.com/news-releases/truemed-closes-34-million-series-a-to-unlock-hsafsa-funds-for-lifestyle-interventions-302647740.html\", \"note\": \"투자 규모와 참여 투자사, 본사 위치, 매출 3배 성장 발표를 확인했다.\"}, {\"title\": \"how truemed works (가맹점용 기술 문서)\", \"url\": \"https://docs.truemed.com/guides/get-started/how-truemed-works\", \"note\": \"결제 연동 방식과 소견서 12개월 유효, 24시간에서 48시간 검토 시간을 확인했다.\"}, {\"title\": \"eligibility & qualification overview (고객 도움말)\", \"url\": \"https://help.truemed.com/eligibility-qualification/eligibility-qualification-overview\", \"note\": \"인정 기준과 헬스장 회원권 포함 여부, 계좌 운영사가 최종 판단권을 가진다는 안내를 확인했다.\"}, {\"title\": \"hsa/fsa eligible products (소비자 마켓플레이스)\", \"url\": \"https://shopping.truemed.com/hsa-fsa-shopping\", \"note\": \"제휴 브랜드 목록과 3단계 이용 절차, 이용자 100만 명 표기를 확인했다.\"}, {\"title\": \"disclosures (truemed 고지 문서)\", \"url\": \"https://www.truemed.com/disclosures\", \"note\": \"서비스 비용이 상품 가격에 포함된다는 안내와, 계좌 운영사가 청구를 거절할 수 있고 사실과 다르게 답하면 세금 불이익이 생길 수 있다는 면책 문구를 확인했다.\"}, {\"title\": \"gyms & studios (truemed 상품 분류)\", \"url\": \"https://www.truemed.com/shop/gym-studios\", \"note\": \"헬스장과 스튜디오 회원권이 실제 대상 분류로 있고 barry's, classpass, club pilates가 제휴돼 있음을 확인했다.\"}, {\"title\": \"publication 969, health savings accounts and other tax-favored health plans\", \"url\": \"https://www.irs.gov/publications/p969\", \"note\": \"hsa와 fsa의 가입 조건, 이월 규칙, 인정 의료비 정의를 확인했다.\"}, {\"title\": \"irs alert: beware of companies misrepresenting nutrition, wellness and general health expenses as medical care for fsas, hsas, hras and msas (ir-2024-65)\", \"url\": \"https://www.irs.gov/newsroom/irs-alert-beware-of-companies-misrepresenting-nutrition-wellness-and-general-health-expenses-as-medical-care-for-fsas-hsas-hras-and-msas\", \"note\": \"자기 보고 정보만으로 발급한 소견서를 인정하지 않는다는 국세청 경고와 계좌 자격 상실 위험을 확인했다.\"}, {\"title\": \"truemed's payment integration platform unlocks hsa/fsa for health, not sickness\", \"url\": \"https://techcrunch.com/2023/09/18/truemed-payment-integration-hsa-fsa/\", \"note\": \"창업 배경과 초기 투자 350만 달러, 창업자 경력을 확인했다.\"}, {\"title\": \"congressman auchincloss probes corruption of healthcare executives in the trump administration\", \"url\": \"https://auchincloss.house.gov/media/press-releases/congressman-auchincloss-probes-corruption-of-healthcare-executives-in-the-trump-administration\", \"note\": \"calley means의 이해충돌을 문제 삼은 의회 서한 내용을 확인했다.\"}, {\"title\": \"헬스장·스튜디오 가맹점 가입 안내\", \"url\": \"https://www.truemed.com/partners/dtc-merchant-sign-up\", \"note\": \"가맹점 750달러 일회성, 이후 거래 수수료와 월 이용료 없음, 회원이 소견서 한 건당 20달러 부담, 업종 분류 문제로 헬스장에서는 카드 결제 대신 환급 방식을 쓴다는 안내를 원문으로 확인했다.\"}, {\"title\": \"brand agreement (가맹 브랜드 계약서)\", \"url\": \"https://www.truemed.com/legal/brand-agreement\", \"note\": \"주문 금액에서 수수료를 먼저 떼고 나머지를 브랜드에 정산한다는 조항과, 요율이 계약상 비밀이라는 조항을 확인했다.\"}, {\"title\": \"terms of service (truemed 이용약관)\", \"url\": \"https://www.truemed.com/terms\", \"note\": \"소견서에 기대어 자격을 입증하는 일이 전적으로 이용자 본인의 위험이고, 국세청이 213(d)조 인정 의료비로 볼 것이라는 보장이 없다는 조항을 원문으로 확인했다.\"}, {\"title\": \"letter from representative auchincloss to the truemed board of directors\", \"url\": \"https://auchincloss.house.gov/imo/media/doc/auchincloss_letter_to_truemed_board_of_directors.pdf\", \"note\": \"2025년 6월 16일 자 서한 원문이다. 기업 가치가 2024년 1월 이후 3배 가까이 올랐다는 지적과 본사 주소를 확인했다.\"}, {\"title\": \"what the one big beautiful bill act means for employee benefits\", \"url\": \"https://www.tasconline.com/legislative-updates/what-the-one-big-beautiful-bill-act-means-for-employee-benefits/\", \"note\": \"헬스장 회원권과 운동비를 연 500달러까지 hsa 인정 의료비로 삼는 조항이 최종 법에서 삭제됐다는 사실을 항목별 목록으로 확인했다.\"}, {\"title\": \"auchincloss and schiff letter on potential conflict of interest with calley means\", \"url\": \"https://www.schiff.senate.gov/wp-content/uploads/2025/11/auchincloss-schiff-letter-on-potential-coi-with-calley-means.pdf\", \"note\": \"2025년 10월 31일 자 공동 서한 원문이다. 임명일과 이해충돌 지적, truemed가 비데를 hsa 대상으로 광고한다는 사례를 확인했다.\"}, {\"title\": \"a kennedy aide's start-up can get you a tax break on a $9,000 sauna\", \"url\": \"https://www.nytimes.com/2025/07/18/business/truemed-fsa-hsa-calley-means-maha.html\", \"note\": \"이 방식을 비판적으로 다룬 new york times 기사다. 본문은 열지 못했고 의회 서한의 인용을 통해 존재와 논지를 확인했다.\"}, {\"title\": \"truemed hsa/fsa medical necessity investigation\", \"url\": \"https://classlawdc.com/2026/06/02/truemed-hsa-fsa-medical-necessity-investigation/\", \"note\": \"법무법인이 소비자 피해 여부를 조사 중이라는 공지를 확인했다. 소송 제기 단계는 아니다.\"}, {\"title\": \"a list of tax provisions left out of the big beautiful bill\", \"url\": \"https://bipartisanpolicy.org/explainer/tax-provisions-left-out-of-obbb/\", \"note\": \"헬스장 회원권을 hsa 대상에 넣는 조항이 최종 법에서 빠졌다는 사실을 확인했다.\"}, {\"title\": \"truemed lands $34m to grow hsa/fsa purchase platform\", \"url\": \"https://athletechnews.com/truemed-34-million-funding-hsa-fsa/\", \"note\": \"피트니스 업계 관점의 투자 보도와 창업자 발언을 확인했다.\"}]}"}],"themeLabels":{"medicare":"메디케어","medicare-advantage":"메디케어 어드밴티지","medicaid":"메디케이드","aca-exchange":"ACA 거래소","employer-insurance":"고용주 보험","payer-ops":"보험사 운영","hospital-health-system":"병원·헬스시스템","primary-care":"1차 진료","value-based-care":"성과기반 진료","rcm-billing":"청구·수납","pbm-drug-pricing":"PBM·약값","pharmacy-retail":"약국·리테일","pharma-glp1":"제약·GLP-1","price-transparency":"가격 투명성","consumer-dtc":"소비자 직접판매","cash-pay":"현금 결제 시장","employer-benefits":"복리후생","ai-clinical":"임상 AI","ai-admin":"행정 AI","data-interop":"데이터 상호운용","telehealth":"원격진료","behavioral-mental":"정신건강","chronic-care":"만성질환 관리","senior-care":"시니어 케어","women-health":"여성 건강","dental-vision":"치과·안과","devices-wearables":"기기·웨어러블","digital-health-funding":"투자·펀딩","ma-consolidation":"인수합병","regulation-cms":"CMS 규제","regulation-fda":"FDA 규제","policy-legislation":"입법·정책","public-health":"공중보건","workforce":"인력","rural-access":"의료 접근성","clinical-trials":"임상시험","insurance-brokerage":"보험 유통","startups":"스타트업","market-earnings":"실적·시장"},"split":true}</script>
<script>
(function(){
"use strict";
var DB = JSON.parse(document.getElementById('payload').textContent);
var ISSUES = DB.issues || [];
var EXTRAS = DB.extras || {};
var COMPANIES = {};
(DB.companies || []).forEach(function(c){ COMPANIES[c.slug] = c; });
var SPLIT = !!DB.split;          /* 본문을 조각 파일로 나눠 두었는가 */
var CACHE = { issue:{}, company:{}, extras:null };

function fetchJSON(path){
  return fetch(path, {cache:'no-cache'}).then(function(r){
    if(!r.ok) throw new Error(path + ' ' + r.status);
    return r.json();
  });
}
function showLoading(msg){
  document.getElementById('content').innerHTML =
    '<div class="empty">' + esc(msg || '불러오는 중입니다') + '</div>';
}
/* 본문이 필요한 화면은 조각 파일을 먼저 받아 온 뒤에 그린다. */
function need(kind, id, draw){
  if(!SPLIT){ draw(); return; }
  if(CACHE[kind][id]){ draw(); return; }
  showLoading();
  var path = kind === 'issue' ? 'site/issue-' + id + '.json' : 'site/company-' + id + '.json';
  fetchJSON(path).then(function(d){
    CACHE[kind][id] = d;
    draw();
  }).catch(function(e){
    document.getElementById('content').innerHTML =
      '<div class="empty">내용을 불러오지 못했습니다.<br><small>' + esc(String(e)) + '</small></div>';
  });
}
function needExtras(draw){
  if(!SPLIT || CACHE.extras){ draw(); return; }
  showLoading();
  fetchJSON('site/extras.json').then(function(d){ CACHE.extras = d; EXTRAS = d; draw(); })
    .catch(function(){ CACHE.extras = {}; EXTRAS = {}; draw(); });
}
var TYPE_LABEL = {reads:'테크 리즈', policy:'정책 브리핑', roundup:'그랜드 라운드업', interview:'인터뷰', event:'안내'};
var THEME_LABEL = DB.themeLabels || {};

/* ---------- theme toggle ---------- */
var root = document.documentElement;
try{ var saved = localStorage.getItem('htn-theme'); if(saved) root.setAttribute('data-theme', saved); }catch(e){}
document.getElementById('themebtn').addEventListener('click', function(){
  var cur = root.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : (cur === 'light' ? 'dark' : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark'));
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('htn-theme', next); }catch(e){}
});

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function el(html){ var d = document.createElement('div'); d.innerHTML = html; return d; }
function fmtDate(d){ if(!d) return ''; var p = d.split('-'); return p[0] + '.' + p[1] + '.' + p[2]; }
function monthKey(d){ var p = String(d||'').split('-'); return p[0] + '년 ' + parseInt(p[1],10) + '월'; }
function issueText(it){
  if(it.q) return it.q;
  if(it._txt) return it._txt;
  var buf = [it.title_ko, it.title_en, it.hook, (it.tldr||[]).join(' ')];
  (it.sections||[]).forEach(function(s){
    buf.push(s.heading_ko, s.heading_en, s.what, s.why, s.structure, s.consumer);
    (s.players||[]).forEach(function(p){ buf.push(p.name, p.what); });
    (s.terms||[]).forEach(function(t){ buf.push(t.en, t.ko, t.plain); });
    (s.numbers||[]).forEach(function(n){ buf.push(n.value, n.meaning); });
  });
  (it.glossary||[]).forEach(function(t){ buf.push(t.en, t.ko, t.plain); });
  it._txt = buf.join(' ').toLowerCase();
  return it._txt;
}

/* ---------- state ---------- */
var state = { view:'home', id:null, q:'', types:{}, theme:null, raw:null, tab:'list' };
try{ state.cmp = localStorage.getItem('htn-cmp') === '1'; }catch(e){}

/* ---------- sidebar ---------- */
var NAV = [
  {k:'home',  t:'시작하기'},
  {k:'primer',t:'미국 헬스케어 101'},
  {k:'consumer', t:'소비자 시장'},
  {k:'companies',t:'투자받은 회사'},
  {k:'themes',t:'주제별'},
  {k:'timeline',t:'타임라인'},
  {k:'glossary',t:'용어사전'}
];
function renderNav(){
  document.getElementById('navlinks').innerHTML = NAV.map(function(n){
    return '<button class="navlink' + (state.view===n.k?' on':'') + '" data-nav="' + n.k + '">' + esc(n.t) + '</button>';
  }).join('');
}
function renderFilters(){
  var counts = {};
  ISSUES.forEach(function(i){ counts[i.type] = (counts[i.type]||0)+1; });
  var keys = Object.keys(TYPE_LABEL).filter(function(k){ return counts[k]; });
  document.getElementById('filters').innerHTML = keys.map(function(k){
    return '<button class="chip' + (state.types[k]?' on':'') + '" data-type="' + k + '">' +
      esc(TYPE_LABEL[k]) + ' ' + counts[k] + '</button>';
  }).join('');
}
function filtered(){
  var q = state.q.trim().toLowerCase();
  var anyType = Object.keys(state.types).some(function(k){ return state.types[k]; });
  return ISSUES.filter(function(it){
    if(anyType && !state.types[it.type]) return false;

function qaHTML(cls, label, text){
  /* 줄바꿈으로 나뉜 덩어리를 문단으로 만든다. 줄바꿈이 없고 길기만 하면
     문장 경계를 찾아 대략 260자 단위로 끊어 읽기 부담을 줄인다. */
  var parts = String(text).split(/\n\s*\n|\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  if(parts.length === 1 && parts[0].length > 420){
    var sents = parts[0].match(/[^.!?]+[.!?]+(?:\s|$)|[^.!?]+$/g) || [parts[0]];
    var acc = [], cur = '';
    sents.forEach(function(sn){
      cur += sn;
      if(cur.length >= 260){ acc.push(cur.trim()); cur = ''; }
    });
    if(cur.trim()) {
      if(acc.length && cur.trim().length < 90) acc[acc.length-1] += ' ' + cur.trim();
      else acc.push(cur.trim());
    }
    parts = acc;
  }
  return '<div class="qa ' + cls + '"><span class="lbl">' + esc(label) + '</span>' +
    parts.map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('') + '</div>';
}

  var r = raw.sections[n];

function trackScroll(){
  if(scrollTimer) return;
  scrollTimer = setInterval(function(){
    var secsEl = document.querySelectorAll('[id^="s"]');
    var cur = -1, top = 120;
    secsEl.forEach(function(e){
      if(!/^s\d+$/.test(e.id)) return;
      if(e.getBoundingClientRect().top <= top) cur = parseInt(e.id.slice(1), 10);
    });
    document.querySelectorAll('.stoc').forEach(function(b){
      b.classList.toggle('on', parseInt(b.dataset.sn, 10) === cur);
    });
  }, 400);
}
function mdish(t){
  /* very small formatter: **bold**, `code`, paragraphs, - lists, ## heads */
  var lines = String(t||'').split('\n'), out = [], inList = false;
  function inline(s){
    return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
                 .replace(/`(.+?)`/g,'<code>$1</code>')
                 .replace(/\[\[(\d{2})\]\]/g,'<button class="tt" data-issue="$1" style="padding:1px 7px">$1회차</button>');
  }
  lines.forEach(function(l){
    var s = l.trim();
    if(!s){ if(inList){ out.push('</ul>'); inList=false; } return; }
    if(/^###\s/.test(s)){ if(inList){out.push('</ul>');inList=false;} out.push('<h4>'+inline(s.replace(/^###\s/,''))+'</h4>'); return; }
    if(/^##\s/.test(s)){ if(inList){out.push('</ul>');inList=false;} out.push('<h3>'+inline(s.replace(/^##\s/,''))+'</h3>'); return; }
    if(/^[-*]\s/.test(s)){ if(!inList){ out.push('<ul>'); inList=true; } out.push('<li>'+inline(s.replace(/^[-*]\s/,''))+'</li>'); return; }
    if(inList){ out.push('</ul>'); inList=false; }
    out.push('<p>'+inline(s)+'</p>');
  });
  if(inList) out.push('</ul>');
  return out.join('');
}

  list.sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });

  var h = ['<h2>투자받은 회사</h2>',
    '<p style="color:var(--muted);font-size:14px">뉴스레터에 한 줄로만 나온 회사를 직접 찾아보고 정리했다. ' +
    '목록에서 요약과 화면을 훑고, 더 볼 것만 눌러서 들어가면 된다. 총 ' + list.length + '곳.</p>'];
  if(!list.length) h.push('<div class="empty">아직 정리된 회사가 없습니다</div>');

  list.forEach(function(c){
    var cd = c.card || {};
    var shots = (c.screenshots || []).slice(0, 3);
    h.push('<div class="cbig">');
    /* 머리: 이름, 판매 대상, 회차 */
    h.push('<div class="cbig-h">' +
      '<button class="cname" data-company="' + esc(c.slug) + '">' + esc(c.name) + '</button>' +
      (c.sells_to ? '<span class="cs">' + esc(SELLS_LABEL[c.sells_to] || c.sells_to) + '</span>' : '') +
      ((c.seen_in||[]).map(function(x){
        return '<button class="cissue" data-issue="' + esc(x.issue) + '">' + esc(x.issue) + '회차</button>'; }).join('')) +
      '<span class="cspacer"></span>' +
      '<button class="cmore" data-company="' + esc(c.slug) + '">자세히</button>' +
      '</div>');
    h.push('<p class="cone">' + esc(c.one_liner || '') + '</p>');
    if((cd.tags||[]).length){
      h.push('<div class="ctags">' + cd.tags.map(function(t){
        return '<span>' + esc(t) + '</span>'; }).join('') + '</div>');
    }
    /* 표: 문제와 해법부터 값, 성과, 주의까지 한 자리에 놓는다. */
    var rows = [];
    if(cd.problem) rows.push(['푸는 문제', esc(cd.problem), '']);
    else if(cd.summary) rows.push(['요약', esc(cd.summary), '']);
    if(cd.solution) rows.push(['솔루션', esc(cd.solution), '']);
    if(cd.price) rows.push(['소비자가 내는 값', esc(cd.price), '']);
    if(cd.headline_traction) rows.push(['성과', esc(cd.headline_traction), '']);
    if(cd.watch) rows.push(['주의', esc(cd.watch), 'w']);
    if(rows.length){
      h.push('<table class="ctab"><tbody>' + rows.map(function(r){
        return '<tr class="' + r[2] + '"><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>'; }).join('') + '</tbody></table>');
    }
    if(shots.length){
      h.push('<div class="cthumbs">' + shots.map(function(sh){
        return '<figure><a href="assets/companies/' + esc(sh.file) + '" target="_blank" rel="noopener">' +
          '<img src="assets/companies/' + esc(sh.file) + '" alt="' + esc(sh.caption||'') + '" loading="lazy"></a>' +
          '<figcaption>' + esc((sh.caption||'').slice(0,40)) + '</figcaption></figure>'; }).join('') + '</div>');
    }
    h.push('</div>');
  });
  document.getElementById('content').innerHTML = h.join('');
}
function viewCompany(slug){
  if(!COMPANIES[slug]){ document.getElementById('content').innerHTML = '<div class="empty">해당 회사를 찾을 수 없습니다</div>'; return; }
  need('company', slug, function(){ drawCompany(slug); });
}
function drawCompany(slug){
  var c = CACHE.company[slug] || COMPANIES[slug];
  document.getElementById('crumb').textContent = '회사 · ' + c.name;
  var h = ['<button class="backlink" data-nav="companies">회사 목록으로</button>'];
  h.push('<h2>' + esc(c.name) + '</h2>');
  h.push('<div class="meta">' +
    (c.sells_to ? '<span class="badge b-reads">' + esc(SELLS_LABEL[c.sells_to] || c.sells_to) + '</span>' : '') +
    (c.site ? '<span>' + esc(c.site.replace(/^https?:\/\//,'')) + '</span>' : '') +
    ((c.seen_in||[]).map(function(x){
      return '<span>·</span><button class="tt" data-issue="' + esc(x.issue) + '">' + esc(x.issue) + '회차</button>'; }).join('')) +
    '</div>');
  if(c.one_liner) h.push('<div class="hook">' + esc(c.one_liner) + '</div>');

  function block(title, body, cls){
    if(!body) return;
    h.push('<div class="cblock ' + (cls||'') + '"><span class="lbl">' + esc(title) + '</span>' +
      String(body).split(/\n\s*\n|\n/).filter(Boolean).map(function(x){
        return '<p>' + esc(x.trim()) + '</p>'; }).join('') + '</div>');
  }
  block('푸는 문제', c.problem);
  block('솔루션', c.solution);
  if((c.features||[]).length){
    h.push('<div class="cblock"><span class="lbl">기능 상세</span><ul class="cfeat">' +
      c.features.map(function(f){
        return '<li><b>' + esc(f.name) + '</b><span>' + esc(f.detail||'') + '</span></li>'; }).join('') + '</ul></div>');
  }
  block('차별점', c.differentiator);
  if((c.screenshots||[]).length){
    h.push('<div class="cblock"><span class="lbl">화면</span><div class="cshots">' +
      c.screenshots.map(function(sh){
        var src = 'assets/companies/' + esc(sh.file);
        return '<figure><a href="' + src + '" target="_blank" rel="noopener">' +
          '<img src="' + src + '" alt="' + esc(sh.caption||'') + '" loading="lazy"></a>' +
          '<figcaption>' + esc(sh.caption||'') + '</figcaption></figure>'; }).join('') + '</div></div>');
  }
  if((c.team||[]).length){
    h.push('<div class="cblock"><span class="lbl">팀</span><ul class="cteam">' +
      c.team.map(function(t){
        return '<li><b>' + esc(t.name) + '</b>' + (t.role ? '<span class="role">' + esc(t.role) + '</span>' : '') +
          (t.background ? '<span>' + esc(t.background) + '</span>' : '') + '</li>'; }).join('') + '</ul></div>');
  }
  if((c.traction||[]).length){
    h.push('<div class="cblock"><span class="lbl">성과</span><ul class="ctrac">' +
      c.traction.map(function(t){
        return '<li><span class="tt2 t-' + esc(t.type||'') + '">' + esc(TRACTION_LABEL[t.type] || t.type || '') + '</span>' +
          '<span class="d">' + esc(t.detail||'') + '</span>' +
          (t.when ? '<span class="w">' + esc(t.when) + '</span>' : '') + '</li>'; }).join('') + '</ul></div>');
  }
  block('주의해서 볼 대목', c.caveats, 'warn');
  block('우리 목적에 비추어', c.for_us, 'forus');
  if((c.sources||[]).length){
    h.push('<div class="cblock"><span class="lbl">확인한 자료</span><ul class="csrc">' +
      c.sources.map(function(x){
        return '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.title||x.url) + '</a>' +
          (x.note ? '<span>' + esc(x.note) + '</span>' : '') + '</li>'; }).join('') + '</ul></div>');
  }
  document.getElementById('content').innerHTML = h.join('');
}
function viewHome(){
  document.getElementById('crumb').textContent = '시작하기';
  var d = EXTRAS.home;
  var h = ['<h2>Health Tech Nerds 정리 노트</h2>'];
  h.push('<div class="hook">미국 헬스케어 업계 뉴스레터 ' + ISSUES.length + '회차(2026년 1월~8월)를, 헬스케어도 영어도 익숙하지 않은 사람이 읽을 수 있게 한글로 다시 쓴 노트입니다.</div>');
  if(d && d.sections){ d.sections.forEach(function(s,n){ h.push('<h3 id="h'+n+'">' + esc(s.heading) + '</h3>'); h.push(mdish(s.body)); }); }
  h.push('<h3>회차 한눈에 보기</h3>');
  var byType = {};
  ISSUES.forEach(function(i){ (byType[i.type] = byType[i.type] || []).push(i); });
  h.push('<div class="stats">' + Object.keys(byType).map(function(k){
    return '<div class="stat"><b>' + byType[k].length + '</b><span>' + esc(TYPE_LABEL[k]||k) + '</span></div>'; }).join('') + '</div>');
  h.push('<p style="color:var(--muted);font-size:13.5px">왼쪽 목록에서 회차를 고르거나, <button class="tt" data-nav="primer">미국 헬스케어 101</button> 부터 읽어보세요.</p>');
  document.getElementById('content').innerHTML = h.join('');
}

/* ---------- router ---------- */
function render(){
  renderNav(); renderFilters(); renderList();
  var v = state.view;
  /* 회차 화면만 비교 모드로 넓어진다. 나머지 화면은 기본 폭으로 되돌린다. */
  if(v !== 'issue'){ document.getElementById('content').className = 'wrap doc';
    document.getElementById('sidetoc').innerHTML = ''; setTab('list'); }
  if(v === 'issue') viewIssue(state.id);
  else if(v === 'companies') viewCompanies();
  else if(v === 'company') viewCompany(state.id);
  else if(v === 'glossary') needExtras(viewGlossary);
  else if(v === 'themes') needExtras(viewThemes);
  else if(v === 'timeline') needExtras(viewTimeline);
  else if(v === 'primer') needExtras(function(){ viewDoc('primer','미국 헬스케어 101'); });
  else if(v === 'consumer') needExtras(function(){ viewDoc('consumer','소비자 시장'); });
  else viewHome();
  document.querySelector('.main').scrollTop = 0;
  window.scrollTo(0,0);
}
function go(view, id){
  state.view = view; state.id = id || null;
  var hash = (view === 'issue' || view === 'company') ? '#/' + view + '/' + id : '#/' + view;
  if(location.hash !== hash) location.hash = hash;
  else render();
  closeSide();
}
function fromHash(){
  var m = /^#\/issue\/(\w+)/.exec(location.hash);
  if(m){ state.view='issue'; state.id=m[1]; return; }
  var mc = /^#\/company\/([\w-]+)/.exec(location.hash);
  if(mc){ state.view='company'; state.id=mc[1]; return; }
  var m2 = /^#\/(\w+)/.exec(location.hash);
  state.view = m2 ? m2[1] : 'home'; state.id = null;
}
window.addEventListener('hashchange', function(){ fromHash(); render(); });

/* ---------- events ---------- */
function setTab(which){
  state.tab = which;
  var hasToc = document.getElementById('sidetoc').innerHTML.trim().length > 0;
  if(which === 'toc' && !hasToc) which = 'list';
  /* CSS 기본값이 display:none 이므로 빈 문자열이 아니라 값을 명시해야 한다. */
  document.getElementById('issuelist').style.display = which === 'list' ? 'block' : 'none';
  document.getElementById('sidetoc').style.display = which === 'toc' ? 'block' : 'none';
  document.getElementById('filters').style.display = which === 'list' ? 'flex' : 'none';
  document.querySelectorAll('#sidetabs button').forEach(function(b){
    b.classList.toggle('on', b.dataset.tab === which);
  });
  document.getElementById('sidetabs').style.display = hasToc ? 'flex' : 'none';
}
function closeSide(){ document.getElementById('side').classList.remove('open'); document.getElementById('scrim').classList.remove('on'); }
document.getElementById('menubtn').addEventListener('click', function(){
  document.getElementById('side').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('on');
});
document.getElementById('scrim').addEventListener('click', closeSide);
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-issue],[data-nav],[data-type],[data-theme-go],[data-anchor],[data-cmp],[data-tab],[data-company]');
  if(!t) return;
  if(t.dataset.company){ e.preventDefault(); go('company', t.dataset.company); return; }
  if(t.dataset.tab){ e.preventDefault(); setTab(t.dataset.tab); return; }
  if(t.dataset.cmp){ e.preventDefault(); state.cmp = !state.cmp;
    try{ localStorage.setItem('htn-cmp', state.cmp ? '1' : '0'); }catch(err){}
    render(); return; }
  if(t.dataset.issue){ e.preventDefault(); state.theme=null; go('issue', t.dataset.issue); return; }
  if(t.dataset.nav){ e.preventDefault(); state.theme=null; go(t.dataset.nav); return; }
  if(t.dataset.type){ e.preventDefault(); state.types[t.dataset.type] = !state.types[t.dataset.type]; renderFilters(); renderList(); return; }
  if(t.dataset.themeGo){ e.preventDefault(); state.theme = t.dataset.themeGo; state.q=''; document.getElementById('q').value=''; renderList(); closeSide();
    document.getElementById('crumb').textContent = '#' + (THEME_LABEL[state.theme]||state.theme) + ' 로 목록 필터됨'; return; }
  if(t.dataset.anchor){ e.preventDefault(); closeSide();
    var el2 = document.getElementById(t.dataset.anchor);
    if(el2) el2.scrollIntoView({behavior:'smooth', block:'start'});
    return; }
});
var qt;
document.getElementById('q').addEventListener('input', function(e){
  clearTimeout(qt); var v = e.target.value;
  qt = setTimeout(function(){ state.q = v; state.theme=null; renderList(); if(state.view==='glossary') viewGlossary(); }, 120);
});
document.addEventListener('keydown', function(e){
  if(e.key === '/' && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); document.getElementById('q').focus(); }
  if(state.view==='issue' && !e.metaKey && !e.ctrlKey && document.activeElement.tagName !== 'INPUT'){
    var i = ISSUES.findIndex(function(x){ return x.index === state.id; });
    if(e.key === 'ArrowLeft' && ISSUES[i-1]) go('issue', ISSUES[i-1].index);
    if(e.key === 'ArrowRight' && ISSUES[i+1]) go('issue', ISSUES[i+1].index);
  }
});

fromHash(); render();
})();
</script>
</body>
</html>
