aption":"영문 홈페이지 첫 화면이다. 보험과 진료, 예방을 한데 묶었다는 설명과 함께 회원 100만 명, 연간 반복 매출 8억 유로 이상이라는 수치를 앞에 내건다.","from":"https://alan.com/en"},{"file":"alan-health_businessmodel.png","caption":"사업 모델을 설명하는 페이지다. 보험료를 예상 환급액과 똑같이 맞춰 보험에서는 남기지 않고 회원이 따로 내는 구독료에서 이익을 낸다고 밝힌 대목이 들어 있다.","from":"https://alan.com/fr-fr/business-model"},{"file":"alan-health_pricing.png","caption":"자영업자용 요금제 페이지다. 월 23유로부터 66유로까지 일곱 단계의 보장 내용과 가격을 공개한다.","from":"https://alan.com/fr-fr/assurance-sante/tns"}],"q":"{\"slug\": \"alan-health\", \"name\": \"alan\", \"one_liner\": \"프랑스에서 직접 인가를 받아 건강보험을 파는 회사이며, 보험 증서와 환급 신청, 의사 상담, 예방 프로그램을 자사 앱 한 곳에 모았다. 보험료는 예상 환급액과 똑같이 맞춰 남기지 않고, 회원이 따로 내는 구독료에서 이익을 낸다고 스스로 밝힌 점이 다른 보험사와 구분되는 대목이다. 2026년 6월에 prosus가 주도한 4억 8,000만 유로 라운드를 받았다.\", \"site\": \"https://alan.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"47\", \"section\": 10, \"headline\": \"약 5억 5,500만 달러를 유치하며 약 63억 달러 가치를 인정받은 투자 소식으로 나왔고, 필자는 최고경영자가 '프랑스에서는 흑자'라고만 말한 대목을 사업 전체로는 흑자가 아니라는 뜻으로 읽었다.\"}], \"card\": {\"problem\": \"프랑스는 공적 건강보험이 진료비의 일부만 내주기 때문에 나머지를 메우는 보충 보험에 따로 들어야 한다. 그런데 기존 보험사는 환급까지 몇 주가 걸리고 보장 범위를 알아보기도 어려워서, 회사도 직원도 서류 처리에 시간을 쓴다.\", \"solution\": \"보충 보험을 직접 인가받아 팔면서 청구서를 사진으로 찍어 올리면 환급의 절반을 5분 안에 처리한다. 같은 앱 안에 의사 채팅과 화상 진료, 24시간 ai 의료 상담, 걸음 수로 보상을 모으는 예방 게임을 함께 넣었다.\", \"price\": \"회사가 들어 주는 단체 보험이면 프랑스 법에 따라 회사가 보험료의 절반 이상을 낸다. 개인으로 드는 자영업자 요금제는 보장 등급에 따라 월 23유로부터 66유로까지다.\", \"tags\": [\"보충 건강보험\", \"즉시 환급\", \"앱 통합\", \"예방 게임\", \"기업 판매\"], \"headline_traction\": \"2026년 6월에 prosus가 주도한 4억 8,000만 유로 시리즈 g를 받아 기업 가치 55억 유로를 인정받았고, 회원 110만 명과 기업 고객 3만 7,000곳을 확보했다.\", \"watch\": \"회원 수와 매출, 성장률은 모두 회사가 자기 블로그와 주주 서한에서 낸 수치이며 제삼자가 검증한 것이 아니다. 회사가 밝힌 흑자도 프랑스 한 나라에 한정되고, 8억 4,000만 유로라는 숫자는 회계상 매출이 아니라 계약 기준 연간 반복 매출이다.\"}, \"problem\": \"프랑스에는 전 국민이 드는 공적 건강보험인 sécurité sociale이 있지만, 이 제도는 진료비의 전액이 아니라 정해진 기준액의 일부만 내준다. 남는 몫을 메우려면 mutuelle이라고 부르는 보충 보험에 따로 들어야 하고, 2016년부터는 민간 기업이 직원에게 이 보험을 의무로 제공하며 보험료의 절반 이상을 회사가 내게 되어 있다. 그래서 프랑스의 직장인은 거의 모두 회사가 골라 준 보충 보험에 자동으로 가입된 상태이고, 회사의 인사 담당자는 가입과 해지, 서류 처리를 계속 떠안는다. 기존 보험사에서는 병원비를 먼저 내고 서류를 보낸 뒤 환급까지 몇 주를 기다리는 일이 흔했고, 어떤 진료가 얼마나 보장되는지 약관을 열어 보기 전에는 알기 어려웠다. 한국은 건강보험공단 한 곳이 본인부담금을 제외한 대부분을 바로 정산해 주기 때문에 이런 두 번째 보험이 필수가 아니지만, 프랑스에서는 보충 보험이 사실상 필수품이면서도 쓰기 불편한 상품으로 남아 있었다.\", \"solution\": \"회사가 alan을 도입하면 직원은 앱에서 자기 보험 증서를 띄우고, 병원비 영수증이나 공적 보험의 환급 내역서를 사진으로 찍어 올린다. 회사 발표에 따르면 환급의 50%는 5분 안에, 90%는 하루 안에 처리된다. 보장 범위가 궁금하면 약관을 읽는 대신 앱 검색창에 '물리치료'처럼 진료 종류를 넣어 확인하고, 병원에서는 앱의 제3자 지불 카드를 보여 주면 본인이 먼저 돈을 내지 않아도 된다. 몸이 아프면 같은 앱에서 alan clinic의 의사나 심리상담사, 영양사와 채팅이나 화상으로 상담하는데 주 7일 열려 있고 추가 비용이 없다. 24시간 답하는 ai 의료 상담 mo가 먼저 붙고, 안경이나 렌즈는 앱에서 주문하면 본인 부담 없이 4영업일 안에 받는다. 여기에 alan play라는 예방 기능이 붙어 있어서 걷기와 호흡, 명상으로 berries라는 가상 화폐를 모으고 동료와 걸음 수 대결을 하며, 모은 berries를 자사 상점 할인권으로 바꾸거나 단체에 기부한다. 값은 회사가 단체로 들면 프랑스 법에 따라 회사가 절반 이상을 내고 나머지를 직원이 급여에서 낸다. 개인으로 드는 자영업자 요금제는 essentiel 월 23유로, standard 25유로, confort 34유로, complet 40유로, plus 51유로, avantage 58유로, privilège 66유로로 일곱 단계가 공개돼 있다.\", \"features\": [{\"name\": \"사진 한 장으로 끝내는 환급\", \"detail\": \"병원 영수증이나 공적 보험 환급 내역서, 진료 견적서를 앱에서 사진으로 찍어 올리면 환급이 진행된다. 회사 발표로는 환급의 50%가 5분 안에, 90%가 하루 안에 처리되며 은행 입금 알림보다 앱 알림이 먼저 온다고 안내한다. 앱에서 제3자 지불 카드를 꺼내 병원에 보여 주면 애초에 본인이 먼저 낼 필요도 없다.\"}, {\"name\": \"alan clinic\", \"detail\": \"의사와 심리상담사, 영양사, 물리치료사, 성의학 전문가 등 80명 이상의 의료 전문가와 주 7일 채팅이나 화상으로 상담한다. 보험료 외에 따로 받는 돈이 없다. 회사는 지금까지 26만 건의 의료 채팅을 제공했고 이용자의 50%가 이 상담 덕분에 진료를 한 번 건너뛰었다고 답했다고 밝혔다.\"}, {\"name\": \"mo (ai 의료 상담)\", \"detail\": \"24시간 답하는 ai 의료 상담 기능이다. 회사는 답변의 95% 이상이 의료진의 일일 점검에서 좋음이나 훌륭함 평가를 받았다고 밝혔다. 2026년 2분기 주주 서한에서는 사람이 붙는 clinic보다 이용 빈도가 약 4배 높고, mo를 한 번이라도 써 본 회원의 10%가 주 단위로 다시 쓴다고 적었다.\"}, {\"name\": \"alan play (옛 alan walk)\", \"detail\": \"2024년 11월에 alan walk라는 이름으로 시작한 예방 게임이다. 휴대전화나 웨어러블로 걸음 수를 세고, 걷기와 호흡, 명상으로 berries라는 가상 화폐를 모아 자사 상점 할인권으로 바꾸거나 단체에 기부한다. 동료나 가족과 걸음 수 대결을 붙일 수 있고 자전거 종목도 추가됐다. 회사는 팀 대결과 개인 대결에 회원의 30% 이상이 주 단위로 참여한다고 밝혔으며, 출시 당시 블로그에서는 회원이 하루 평균 1,000걸음을 더 걷게 됐고 몇 달 만에 건강 서비스 이용이 세 배가 됐다고 적었다. 2026년 2분기에는 네 나라를 묶은 alan cup 대회를 열어 첫 주에 하루 참여자가 18% 늘었다고 밝혔다.\"}, {\"name\": \"alan precision\", \"detail\": \"80종이 넘는 생체 지표를 재는 혈액 검사에 ai 분석을 붙인 예방 상품이다. 2026년 2분기 기준으로 대기자가 약 1만 1,000명이라고 회사가 밝혔다.\"}, {\"name\": \"맞춤 건강 프로그램\", \"detail\": \"정신 건강과 요통, 수면, 영양 같은 주제별로 개인에게 맞춘 과정을 제공한다. 요통 과정은 앱 안에서 진행하는 2주짜리 물리치료 안내이며, 회사는 이용자의 80%가 통증이 줄거나 사라졌다고 답했다고 밝혔다.\"}, {\"name\": \"안경과 웰니스 상점\", \"detail\": \"앱에서 안경과 렌즈를 고르면 본인 부담금 없이, 미리 돈을 내지도 않고 4영업일 안에 받는다. 회사는 이 기능으로 고객이 80만 유로 넘게 아꼈다고 밝혔다. 이와 별도로 회원 전용 할인 가격으로 건강 관련 상품을 파는 상점이 앱 안에 있다.\"}, {\"name\": \"나라별 진료 접근 실험\", \"detail\": \"스페인에서는 전화로 병원 예약을 대신 잡아 주는 음성 ai를 시험 중이며 요청의 70~80%에서 예약을 잡는다고 밝혔다. 프랑스 파리에서는 prévenir라는 직장 건강 검진 센터를 직접 운영해 주당 200건 넘는 검진을 본다.\"}], \"differentiator\": \"프랑스 보충 보험 시장에는 axa와 malakoff humanis, harmonie mutuelle 같은 오래된 보험사와 공제조합이 이미 자리를 잡고 있고, alan은 자사 자료에서 스스로를 프랑스 건강보험사 매출 상위 25위 안이라고 소개한다. 파는 상품 자체는 법으로 정해진 보장 규격을 따르기 때문에 크게 다르지 않다. 첫 번째 차이는 위치에 있다. alan은 중개사가 아니라 프랑스 보험법의 적용을 받고 건전성감독기구 acpr의 감독을 받는 주식회사 형태의 보험사이며, 그래서 상품 설계부터 앱까지 한 회사가 쥐고 있다. 두 번째 차이는 돈을 버는 자리다. alan은 보험료를 예상 환급액과 똑같이 맞춰 보험에서는 남기지 않고, 회원 한 사람당 따로 받는 구독료에서 이익을 낸다고 자사 사업 모델 페이지에서 밝힌다. 보험사가 보험료 차액에서 이익을 내는 통상적인 구조와 반대 방향이며, 그 결과 앱과 상담, 예방 프로그램이 비용이 아니라 매출원이 된다. 다만 뉴스레터 필자가 견준 미국 인슈어테크와 견주면, 미국 회사들이 공적 제도의 대체재를 파는 것과 달리 alan은 공적 제도가 이미 대부분을 내주는 나라에서 남는 몫만 파는 사업이라 위험의 크기 자체가 다르다.\", \"team\": [{\"name\": \"jean-charles samuelian-werve\", \"role\": \"공동창업자 겸 최고경영자\", \"background\": \"alan을 세우기 전에 이코노미석 항공기 좌석을 만드는 expliseat을 공동 창업했다.\"}, {\"name\": \"charles gorintin\", \"role\": \"공동창업자 겸 최고기술책임자\", \"background\": \"alan을 함께 세우기 전에 facebook과 instagram, twitter에서 데이터 과학 조직을 이끌었다. 자사 사이트의 발행 책임자로도 이름이 올라 있다.\"}, {\"name\": \"fabrice staad\", \"role\": \"프랑스 총괄\", \"background\": \"공공 부문과 민간 부문에서 보험과 사회보장 업무를 했고 generali france를 거쳤다.\"}, {\"name\": \"mark goad\", \"role\": \"캐나다 총괄\", \"background\": \"디지털 헬스 스타트업 curv health를 공동 창업했고 그 전에는 연기금 운용사 omers에서 벤처 투자를 했다.\"}, {\"name\": \"bing gordon\", \"role\": \"이사\", \"background\": \"게임 회사 electronic arts를 공동 창업하고 1998년부터 2008년까지 최고창의책임자를 맡았으며, amazon 이사회에서 14년을 보냈다.\"}, {\"name\": \"jan hammer\", \"role\": \"이사\", \"background\": \"index ventures의 제너럴 파트너이며 adyen과 robinhood, wise에 초기 투자했다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"prosus가 주도한 시리즈 g로 4억 8,000만 유로를 받으며 기업 가치 55억 유로를 인정받았다. teachers' venture growth와 index ventures가 함께 들어갔고 dara holdings가 새 투자자로 참여했다. 뉴스레터는 이를 달러로 환산해 약 5억 5,500만 달러, 기업 가치 약 63억 달러로 전했다.\", \"when\": \"2026-06\", \"source\": \"alan 공식 블로그 투자 발표문\"}, {\"type\": \"customers\", \"detail\": \"회원 약 114만 명이며 투자 발표 시점에는 회원 110만 명과 기업 고객 3만 7,000곳이라고 밝혔다. 프랑스와 벨기에, 스페인, 캐나다에서 서비스한다.\", \"when\": \"2026-08\", \"source\": \"alan 2026년 2분기 주주 서한과 투자 발표문\"}, {\"type\": \"revenue\", \"detail\": \"계약 기준 연간 반복 매출이 약 8억 4,000만 유로이고 전년 대비 55% 성장했다고 밝혔다. 투자 발표 시점에는 8억 유로가 넘고 50% 이상 성장 중이라고 적었다.\", \"when\": \"2026-08\", \"source\": \"alan 2026년 2분기 주주 서한\"}, {\"type\": \"regulatory\", \"detail\": \"2025년 기준 규제 자본이 3억 7,400만 유로가 넘어 요구 수준인 약 1억 500만 유로의 3.6배를 넘었다고 밝혔다. 프랑스 시장 평균은 241%다. 프랑스 보험법의 적용을 받고 건전성감독기구 acpr의 감독을 받으며, 2025 회계연도 지급여력보고서를 공개한다.\", \"when\": \"2025\", \"source\": \"alan 재무 건전성 안내 페이지\"}, {\"type\": \"partnership\", \"detail\": \"세네갈과 코트디부아르에서 사업하는 디지털 헬스 회사 tanel 인수를 마무리했다. tanel은 기업 400곳 이상을 통해 약 7만 명을 보장하고 약국과 의료기관 1,200곳 이상과 연결돼 있다. 인수 금액은 공개하지 않았고, 2030년까지 아프리카에서 100만 명 이상을 보장하는 것을 목표로 내걸었다.\", \"when\": \"2026-09\", \"source\": \"alan 공식 블로그 인수 발표문\"}, {\"type\": \"traffic\", \"detail\": \"프랑스 아이폰 앱스토어의 alan assurance santé는 평점 4.9에 평가 12,947건이며 2017년 9월에 처음 나왔다. 구글 플레이의 alan: health insurance는 평점 4.8에 리뷰 6,600건, 설치 50만 회 이상이다. 미국 앱스토어에도 같은 앱이 올라 있으나 평가가 50건뿐이다.\", \"when\": \"2026-09\", \"source\": \"애플 앱스토어 조회 api와 구글 플레이 페이지\"}], \"caveats\": \"회원 수와 연간 반복 매출, 성장률, 흑자 여부는 모두 회사가 자기 블로그와 주주 서한에서 낸 수치이며 제삼자가 검증한 재무제표로 확인한 것이 아니다. 뉴스레터 필자도 최고경영자가 linkedin 게시글에서 밝힌 수치라는 점을 짚었다. 특히 8억 4,000만 유로는 회계상 매출이 아니라 계약 기준 연간 반복 매출이므로, 뉴스레터가 이를 매출로 옮겨 적은 대목은 그대로 받아들이면 안 된다. 흑자라는 표현도 프랑스 한 나라의 영업 단계에만 붙어 있고, 벨기에와 스페인, 캐나다를 포함한 사업 전체가 흑자라는 말은 어디에도 없다. 뉴스레터 필자는 이 점을 근거로 전체로는 적자일 것이라고 읽었다. 기업 가치 55억 유로를 연간 반복 매출 8억 4,000만 유로로 나누면 약 6.5배이며, 뉴스레터는 이를 매출 6배 멀티플이라고 불렀다. 예방 기능의 효과로 제시된 수치, 곧 하루 1,000걸음 증가와 건강 서비스 이용 세 배, 요통 개선 80%, 상담 덕분에 진료를 건너뛴 비율 50%는 전부 회사가 자체 집계한 값이고 외부 연구로 확인된 것이 아니다. 다만 규제 자본과 지급여력비율은 감독기구에 제출하는 보고서에서 나온 값이라 앞의 수치들보다 확인 가능성이 높다. alan은 미국에서 보험을 팔지 않는다. 미국 앱스토어에 앱이 올라 있기는 하나 미국 사업이 있다는 뜻은 아니다.\", \"for_us\": \"가장 눈여겨볼 대목은 alan play다. 보험사가 걸음 수와 호흡, 명상을 berries라는 가상 화폐로 바꾸고 그것을 자사 상점 할인권이나 기부로 쓰게 하는 구조는 우리 앱의 리워드 구조와 사실상 같은 설계다. 다른 점은 두 가지다. 첫째, 보상 재원이 광고가 아니라 줄어든 진료비다. 회원이 덜 아프면 회사가 낼 환급액이 줄어드는 구조여서 보상에 돈을 쓸 이유가 분명하다. 둘째, 개인 목표가 아니라 동료와 겨루는 팀 대결을 전면에 놓았고, 회사는 그 결과로 회원의 30% 이상이 주 단위로 참여한다고 밝혔다. 우리가 3개월 안에 소프트웨어만으로 시험해 볼 수 있는 대목은 팀 대결과 기부 전환이다. 특히 모은 보상을 현금이 아니라 기부로 돌리는 선택지는 지금 우리 앱에 없고, 앱 안에서 바로 붙일 수 있다. 앱을 매일 열게 만든 진짜 장치는 게임이 아니라 보험 서류 처리, 곧 영수증을 찍으면 5분 안에 돈이 들어오는 흐름이라는 점도 함께 봐야 한다. 미국에서 우리가 그에 해당하는 장치를 갖고 있지 않다는 사실이 이 사례의 한계다. ai 의료 상담 mo가 사람이 붙는 상담보다 이용 빈도가 4배 높았다는 회사 발표도 참고할 만하며, 이는 상담 창구를 사람으로 채우지 않고도 접점을 늘릴 수 있다는 뜻이다.\", \"screenshots\": [{\"file\": \"alan-health_home.png\", \"caption\": \"영문 홈페이지 첫 화면이다. 보험과 진료, 예방을 한데 묶었다는 설명과 함께 회원 100만 명, 연간 반복 매출 8억 유로 이상이라는 수치를 앞에 내건다.\", \"from\": \"https://alan.com/en\"}, {\"file\": \"alan-health_businessmodel.png\", \"caption\": \"사업 모델을 설명하는 페이지다. 보험료를 예상 환급액과 똑같이 맞춰 보험에서는 남기지 않고 회원이 따로 내는 구독료에서 이익을 낸다고 밝힌 대목이 들어 있다.\", \"from\": \"https://alan.com/fr-fr/business-model\"}, {\"file\": \"alan-health_pricing.png\", \"caption\": \"자영업자용 요금제 페이지다. 월 23유로부터 66유로까지 일곱 단계의 보장 내용과 가격을 공개한다.\", \"from\": \"https://alan.com/fr-fr/assurance-sante/tns\"}, {\"file\": \"alan-health_ios.png\", \"caption\": \"프랑스 앱스토어의 alan assurance santé 페이지다. 평점 4.9에 평가가 12,947건이다.\", \"from\": \"https://apps.apple.com/fr/app/alan-assurance-sante/id1277025964\"}], \"sources\": [{\"title\": \"alan leve 480 millions d'euros pour faire de la prevention le nouveau standard mondial de la sante\", \"url\": \"https://alan.com/fr-fr/blog/tout-alan/a/alan-leve-480-millions-deuros-pour-faire-de-la-prevention-le-nouveau-standard-mondial-de-la-sante\", \"note\": \"2026년 6월 25일 자 투자 발표문이다. 4억 8,000만 유로, prosus 주도, 기업 가치 55억 유로, 회원 110만 명, 기업 고객 3만 7,000곳, 연간 반복 매출 8억 유로 이상과 프랑스 흑자 달성을 확인했다.\"}, {\"title\": \"alan 2026 q2 letter to shareholders\", \"url\": \"https://alan.com/en/blog/discover-alan/a/alan-2026-q2-letter-to-shareholders\", \"note\": \"2026년 8월 31일 자 주주 서한이다. 계약 기준 연간 반복 매출 약 8억 4,000만 유로, 회원 약 114만 명, 전년 대비 55% 성장, 시리즈 g라는 라운드 명칭, mo와 alan play, alan precision의 지표를 확인했다.\"}, {\"title\": \"le modele economique d'alan\", \"url\": \"https://alan.com/fr-fr/business-model\", \"note\": \"보험료를 예상 환급액에 맞춰 남기지 않고 회원당 구독료에서 이익을 낸다는 구조, 2016년 2월 10일 설립, alan clinic 전문가 80명 이상, 요통 프로그램 80% 개선, 안경 서비스로 80만 유로 절감을 확인했다.\"}, {\"title\": \"notre solidite financiere\", \"url\": \"https://alan.com/fr-fr/solidite-financiere\", \"note\": \"2025년 규제 자본 3억 7,400만 유로, 요구 수준 약 1억 500만 유로, 요구치의 3.6배, 프랑스 시장 평균 241%, 프랑스 건강보험사 매출 상위 25위, 직원 800명 이상, 프랑스 영업 흑자 달성을 확인했다.\"}, {\"title\": \"alan leadership team\", \"url\": \"https://alan.com/en/leadership-team\", \"note\": \"공동창업자 두 사람의 이름과 직함, 이전 경력을 확인했다. 나라별 총괄과 이사진 경력도 여기서 확인했다.\"}, {\"title\": \"how we built alan walk in less than 6 months (part i)\", \"url\": \"https://alan.com/en/blog/discover-alan/a/how-we-built-alan-walk-in-less-than-6-months-part-i\", \"note\": \"2025년 1월 자 글이다. alan walk가 2024년 11월에 나왔다는 사실, 걸음 수를 보상으로 바꾸는 구조, 회원이 하루 평균 1,000걸음을 더 걷고 건강 서비스 이용이 세 배가 됐다는 회사 집계를 확인했다.\"}, {\"title\": \"alan acquires tanel to expand in west africa\", \"url\": \"https://alan.com/en/blog/discover-alan/a/alan-acquisition-tanel-west-africa\", \"note\": \"2026년 9월 2일 자 인수 발표문이다. 세네갈과 코트디부아르, 약 7만 명 보장, 기업 400곳 이상, 약국과 의료기관 1,200곳 이상, 2030년 아프리카 100만 명 목표를 확인했다.\"}, {\"title\": \"alan - l'assurance sante des travailleurs non-salaries\", \"url\": \"https://alan.com/fr-fr/assurance-sante/tns\", \"note\": \"자영업자용 일곱 단계 요금제와 월 23유로부터 66유로까지의 가격, madelin 법에 따른 최대 45% 세금 공제를 확인했다.\"}, {\"title\": \"participation de l'employeur a la mutuelle\", \"url\": \"https://alan.com/fr-fr/assurance-sante/mutuelle-entreprise/a/participation-mutuelle-employeur\", \"note\": \"프랑스 민간 기업이 직원에게 보충 보험을 제공하고 보험료의 50% 이상을 부담해야 한다는 의무와 그 근거인 전국 직종간 협약을 확인했다.\"}, {\"title\": \"alan 공식 홈페이지 (영문)\", \"url\": \"https://alan.com/en\", \"note\": \"고객이 기업과 개인, 정부로 나뉜다는 설명, 회원 100만 명 이상, 대결 기능 주간 참여율 30% 이상, 의료 채팅 26만 건, ai 상담 만족도 95% 이상, 환급 처리 속도, 법인 형태와 acpr 감독 사실을 확인했다.\"}, {\"title\": \"alan assurance sante (프랑스 앱스토어)\", \"url\": \"https://apps.apple.com/fr/app/alan-assurance-sante/id1277025964\", \"note\": \"평점 4.9와 평가 12,947건, 2017년 9월 최초 출시, alan play의 berries 구조와 동료 대결, 할인권 교환 및 기부 전환을 앱 설명에서 확인했다.\"}, {\"title\": \"alan: health insurance (구글 플레이)\", \"url\": \"https://play.google.com/store/apps/details?id=com.alanmobile\", \"note\": \"평점 4.8, 리뷰 6,600건, 설치 50만 회 이상을 확인했다.\"}]}"},{"slug":"ayble-health","name":"Ayble Health","one_liner":"소화기내과 의사와 영양사, 약사, 심리 담당자를 한 팀으로 묶어 배탈과 복통, 역류, 크론병 같은 소화기 문제를 온라인으로 진료하는 미국 회사다. 진료비를 환자에게 직접 받지 않고 보험에 청구하며, 고용주와 보험사가 직원 복리후생으로 깔아 주는 경로로 환자가 들어온다.","sells_to":"mixed","seen_in":[{"issue":"20","section":26,"headline":"PHTI가 버추얼 소화기 케어 제품들을 평가한 보고서를 소개하는 대목에서, 임상의가 직접 붙어 진료하는 쪽 사례로 Oshi, Salvo와 함께 이름만 언급됐다."}],"card":{"problem":"미국 성인 다섯 명 가운데 한 명이 소화기 증상을 겪지만, 소화기내과 전문의 예약 대기는 전체 전문과에서 세 번째로 길고 미국 카운티의 약 70%에는 소화기내과 의사가 한 명도 없다. 여러 직역이 한 팀으로 보는 다학제 진료는 대학병원에나 있어서, 대부분의 환자는 약을 바꿔 가며 시험해 보는 방식으로 몇 해를 보낸다.","solution":"소화기내과 의사가 처방까지 맡고 영양사와 약사, 심리 담당자, 건강코치가 같은 치료 계획에 함께 붙는 팀을 온라인으로 꾸려 준다. 4분짜리 문진으로 보험 적용 여부를 확인한 뒤 30~45분짜리 첫 진료를 받고, 그 다음부터는 앱으로 식사와 증상을 기록하면서 채팅과 화상으로 관리받는다.","price":"보험 인네트워크 진료라서 대부분 진료 1회당 본인부담금 0~30달러이며, 증상 기록 앱은 무료다. 공제액이 큰 보험에 든 사람은 처음에 더 낼 수 있다고 회사가 밝혔다.","tags":["소화기 진료","원격 진료","다학제 팀","보험 청구","고용주 복지"],"headline_traction":"2026년 3월 PHTI 평가에서 임상의 주도형 소화기 솔루션 다섯 곳 가운데 하나로 다뤄졌고, 2026년 8월에는 Castlight, 9월에는 Amazon의 복리후생 안내 창구에 소화기 분야 첫 업체로 올랐다.","watch":"회사가 내세우는 '1인당 연 2,901달러 절감'은 Ayble 환자를 실제로 측정한 값이 아니라 PHTI가 임상의 주도형 제품 전체를 놓고 특정 환자군에 겨냥했을 때를 가정해 계산한 모형값이다. PHTI는 Ayble의 비용 효과를 다룬 연구가 한 건도 없다고 적었다."},"screenshots":[{"file":"ayble-health_home.png","caption":"첫 화면이다. '소화기 증상을 혼자 감당하지 마세요'라는 문구와 함께 화상 진료를 받는 장면을 보여 주고, 맨 위 띠에 '보험 인네트워크로 소화기 전문 진료를 받는다'고 적어 두었다.","from":"https://www.ayblehealth.com"},{"file":"ayble-health_howitworks.png","caption":"환자가 겪는 흐름을 보여 주는 페이지다. 4분 문진, 30~45분 첫 진료, 이어지는 관리라는 세 단계와 진료팀 구성, 본인부담금 0~30달러 안내가 들어 있다.","from":"https://www.ayblehealth.com/how-it-works"},{"file":"ayble-health_employers.png","caption":"고용주와 보험사를 상대로 파는 페이지다. 투자 대비 3배 회수와 회원 1인당 연 2,901달러 절감을 앞세우며 PHTI가 독립적으로 검토했다고 적어 두었는데, 이 숫자의 출처는 caveats에서 따로 짚었다.","from":"https://www.ayblehealth.com/employers"}],"q":"{\"slug\": \"ayble-health\", \"name\": \"ayble health\", \"one_liner\": \"소화기내과 의사와 영양사, 약사, 심리 담당자를 한 팀으로 묶어 배탈과 복통, 역류, 크론병 같은 소화기 문제를 온라인으로 진료하는 미국 회사다. 진료비를 환자에게 직접 받지 않고 보험에 청구하며, 고용주와 보험사가 직원 복리후생으로 깔아 주는 경로로 환자가 들어온다.\", \"site\": \"https://www.ayblehealth.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"20\", \"section\": 26, \"headline\": \"phti가 버추얼 소화기 케어 제품들을 평가한 보고서를 소개하는 대목에서, 임상의가 직접 붙어 진료하는 쪽 사례로 oshi, salvo와 함께 이름만 언급됐다.\"}], \"card\": {\"problem\": \"미국 성인 다섯 명 가운데 한 명이 소화기 증상을 겪지만, 소화기내과 전문의 예약 대기는 전체 전문과에서 세 번째로 길고 미국 카운티의 약 70%에는 소화기내과 의사가 한 명도 없다. 여러 직역이 한 팀으로 보는 다학제 진료는 대학병원에나 있어서, 대부분의 환자는 약을 바꿔 가며 시험해 보는 방식으로 몇 해를 보낸다.\", \"solution\": \"소화기내과 의사가 처방까지 맡고 영양사와 약사, 심리 담당자, 건강코치가 같은 치료 계획에 함께 붙는 팀을 온라인으로 꾸려 준다. 4분짜리 문진으로 보험 적용 여부를 확인한 뒤 30~45분짜리 첫 진료를 받고, 그 다음부터는 앱으로 식사와 증상을 기록하면서 채팅과 화상으로 관리받는다.\", \"price\": \"보험 인네트워크 진료라서 대부분 진료 1회당 본인부담금 0~30달러이며, 증상 기록 앱은 무료다. 공제액이 큰 보험에 든 사람은 처음에 더 낼 수 있다고 회사가 밝혔다.\", \"tags\": [\"소화기 진료\", \"원격 진료\", \"다학제 팀\", \"보험 청구\", \"고용주 복지\"], \"headline_traction\": \"2026년 3월 phti 평가에서 임상의 주도형 소화기 솔루션 다섯 곳 가운데 하나로 다뤄졌고, 2026년 8월에는 castlight, 9월에는 amazon의 복리후생 안내 창구에 소화기 분야 첫 업체로 올랐다.\", \"watch\": \"회사가 내세우는 '1인당 연 2,901달러 절감'은 ayble 환자를 실제로 측정한 값이 아니라 phti가 임상의 주도형 제품 전체를 놓고 특정 환자군에 겨냥했을 때를 가정해 계산한 모형값이다. phti는 ayble의 비용 효과를 다룬 연구가 한 건도 없다고 적었다.\"}, \"problem\": \"미국에서 소화기 질환은 성인 다섯 명 가운데 한 명이 겪는 흔한 문제이고, 해마다 1,120억 달러가 여기에 쓰인다. 그런데 진료를 받기가 어렵다. 소화기내과는 전문과 가운데 예약 대기가 세 번째로 긴 과이고, 미국 카운티의 70% 가까이에는 소화기내과 의사가 아예 한 명도 없다. 게다가 과민성 대장 증후군이나 염증성 장질환처럼 오래 가는 병은 약만으로 잡히지 않아서 식이 조절과 심리 치료를 함께 받아야 하는데, 이렇게 여러 직역이 한 팀으로 보는 다학제 진료는 대학병원 안에나 거의 다 몰려 있다. 그래서 환자는 소화기내과, 영양사, 심리 상담을 각각 따로 찾아다니거나, 약을 바꿔 가며 시험해 보는 방식으로 몇 해를 보내게 된다. 한국은 동네 내과나 소화기내과를 바로 찾아가 진료를 받고 내시경도 비교적 쉽게 잡을 수 있으므로, 미국에서 '전문의를 만나기까지 몇 달을 기다린다'는 대목이 이 회사가 서 있는 자리를 이해하는 열쇠가 된다.\", \"solution\": \"환자는 먼저 4분 정도 걸리는 문진에 증상과 목표를 적고, 그 자리에서 자기 보험으로 진료를 받을 수 있는지 확인한다. 다음으로 30~45분짜리 첫 진료를 받는데, 소화기내과 의사나 전문간호사가 진료를 맡고 검사가 필요하면 여기서 지시한다. 진료 결과로 치료 계획이 하나 만들어지고, 그 계획 안에 약 처방과 식이 조절, 장과 뇌의 연결을 다루는 심리 프로그램이 함께 들어간다. 그 다음부터는 무료 앱으로 식사와 증상을 기록하면서 어떤 음식이 증상을 일으키는지 찾아 나가고, 영양사와 약사, 건강코치가 채팅과 화상 진료로 계속 붙는다. 회사는 대부분의 환자가 진료 1회당 0~30달러를 낸다고 밝혔고, amazon 창구를 통해 들어온 환자는 본인부담금이 10달러 미만인 경우가 많다고 했다. phti 보고서에 따르면 임상의 주도형 제품의 값은 12개월 기준으로 참여 회원 한 사람당 1,025달러 정도인데, 이 돈은 환자가 아니라 고용주나 보험사가 낸다.\", \"features\": [{\"name\": \"보험 자격 확인 문진\", \"detail\": \"증상과 목표를 묻는 4분짜리 문진을 마치면 자기 보험으로 진료를 받을 수 있는지 그 자리에서 확인된다. aetna, anthem, blue cross blue shield, cigna, unitedhealthcare, priority health와 인네트워크 계약이 되어 있다고 회사가 밝혔다.\"}, {\"name\": \"다학제 진료팀\", \"detail\": \"소화기내과 의사와 전문간호사가 처방을 포함한 치료 계획을 맡고, 영양사와 임상 약사, 심리 담당자, 건강코치가 같은 계획에 붙어 움직인다. phti 비교표에서 임상 약사를 표준 구성으로 두는 곳은 평가 대상 다섯 곳 가운데 ayble뿐이었다.\"}, {\"name\": \"개인화 식이 프로그램\", \"detail\": \"영양사가 증상을 일으키는 음식을 가려내고 제한식을 어떻게 진행할지 안내하며, 오래 유지할 수 있는 식사 습관을 잡아 준다.\"}, {\"name\": \"장과 뇌를 다루는 프로그램\", \"detail\": \"스트레스가 소화기 증상으로 이어지는 통로를 다루는 프로그램이다. 회사는 소화기 증상을 겪는 사람 열 명 가운데 일곱 명에게 이 접근이 도움이 된다고 주장한다.\"}, {\"name\": \"증상과 식사 기록 앱\", \"detail\": \"ios와 android에서 무료로 받을 수 있다. 식사와 증상을 기록해 무엇이 증상을 일으키는지 찾고, 진료팀과 채팅으로 이어진다.\"}, {\"name\": \"성과 보증 계약\", \"detail\": \"고용주와 보험사를 상대로는 임상 성과와 재무 성과에 값을 연동하는 계약을 제공한다고 phti가 적었다. 같은 분류에 든 oshi는 총진료비를 기준으로 성과를 보증한다.\"}], \"differentiator\": \"phti는 버추얼 소화기 제품을 두 갈래로 나누었는데, cylinder와 digbi처럼 의사가 직접 진료하지 않고 코치와 영양사, 심리 담당자만 붙는 랩어라운드형과, ayble과 oshi health, salvo health처럼 의사가 처방까지 맡는 임상의 주도형이다. ayble은 뒤쪽에 속하면서도 salvo와는 파는 상대가 다른데, salvo는 개원한 소화기내과 의원에 팔아서 의원이 보험에 청구하게 하는 반면 ayble은 고용주와 보험사를 상대로 팔되 자기가 인네트워크 진료 기관이 되어 직접 청구한다. oshi와는 사업 구조가 거의 같고, 차이는 ayble이 cleveland clinic에서 쓰던 진료 프로토콜을 독점으로 라이선스해 왔다는 점과 임상 약사를 팀에 상시로 두는 점 정도다. 다만 누적 투자액은 ayble이 1,140만 달러로 oshi의 1억 1,850만 달러에 견주면 열 배 이상 작아서, 같은 분류 안에서 가장 작은 회사에 해당한다.\", \"team\": [{\"name\": \"sam jactel\", \"role\": \"창업자 겸 최고경영자\", \"background\": \"2014년에 궤양성 대장염 진단을 받았고, 좋은 의사에게 진료받을 형편이 되는데도 열 해 가까이 병을 다스리지 못해 크게 악화된 일이 여섯 번 있었고 그때마다 응급실에 갔다고 회사 사이트에서 밝혔다. 그 경험을 창업 동기로 든다.\"}, {\"name\": \"trent haywood, md, jd\", \"role\": \"임상 담당\", \"background\": \"회사 사이트는 담당 영역만 밝히고 이전 경력은 적지 않았다.\"}, {\"name\": \"miguel regueiro, md\", \"role\": \"임상 자문\", \"background\": \"cleveland clinic 소화기질환연구소 소장이자 부사장으로 소개돼 있다.\"}, {\"name\": \"stephen lupe, psyd\", \"role\": \"임상 자문\", \"background\": \"cleveland clinic 소화기내과 행동의학 책임자로 소개돼 있다. phti 보고서가 인용한 ayble 관련 연구 가운데 이 사람의 이름이 붙은 2025년 연구가 있다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"2026년 2월 기준 누적 투자액은 1,140만 달러다. 회사 사이트는 투자사로 m13, upfront ventures, founder collective, digitx partners, cleveland clinic을 걸어 두었으나 각 라운드의 금액과 시점은 밝히지 않았다.\", \"when\": \"2026-02\", \"source\": \"phti 보고서가 인용한 pitchbook 집계, 회사 사이트 투자사 표기\"}, {\"type\": \"partnership\", \"detail\": \"mayo clinic과 손잡고, 증상이 심한 환자는 mayo 소화기내과로 넘기고 그 뒤 다시 ayble이 식이와 행동 관리를 맡는 방식을 만들었다.\", \"when\": \"2023-11\", \"source\": \"medcity news\"}, {\"type\": \"partnership\", \"detail\": \"cleveland clinic 소화기질환연구소와 함께 진료 경로와 행동 치료 콘텐츠를 만들어, 만성 소화기 질환 진료에 ayble 플랫폼을 붙였다.\", \"when\": \"2024-10\", \"source\": \"회사 보도자료, fierce healthcare\"}, {\"type\": \"partnership\", \"detail\": \"복리후생 안내 서비스 castlight에 소화기 분야로는 처음 올라갔다.\", \"when\": \"2026-08\", \"source\": \"fierce healthcare\"}, {\"type\": \"partnership\", \"detail\": \"amazon의 health benefits connector에 소화기 분야 첫 제공자로 들어갔다. 회사는 이 창구가 8,000만 명이 넘는 가입자를 덮는다고 밝혔다.\", \"when\": \"2026-09\", \"source\": \"pr newswire 보도자료\"}, {\"type\": \"award\", \"detail\": \"2026년 prix galien usa 최우수 디지털 헬스 솔루션 부문 후보에 올랐다.\", \"when\": \"2026-08\", \"source\": \"pr newswire 보도자료\"}, {\"type\": \"customers\", \"detail\": \"aetna, anthem, blue cross blue shield, cigna, unitedhealthcare, priority health와 인네트워크 계약이 되어 있다고 밝혔다. 개별 고용주 고객의 이름은 공개하지 않는다.\", \"when\": \"2026-09\", \"source\": \"회사 사이트\"}, {\"type\": \"traffic\", \"detail\": \"소비자용 앱은 크지 않다. 2023년 4월에 나온 android 앱의 내려받기 수는 1,000회 이상 구간이고, ios 앱의 별점은 20명이 매긴 5점 만점에 4.7이다.\", \"when\": \"2026-09\", \"source\": \"google play, apple app store\"}], \"caveats\": \"회사가 스스로 낸 수치와 제삼자가 확인한 수치를 갈라 봐야 한다. 회사 사이트에 걸린 '더부룩함 82% 감소', '복통 68% 감소', '94%가 증상이 크게 좋아졌다고 답함', '응급실 이용 47% 감소', '결근 40% 감소'는 모두 회사가 발표한 값이고 제삼자가 확인한 값이 아니다. 특히 조심할 대목은 고용주용 페이지에 '피터슨 헬스 테크놀로지 인스티튜트가 독립적으로 검토했다'는 설명과 함께 걸린 '회원 1인당 연 2,901달러 절감'이다. phti 보고서 원문을 보면 이 숫자는 ayble 환자를 측정한 값이 아니라, 임상의 주도형 제품 전체를 놓고 '과민성 대장 증후군 환자와 중등도 이상 염증성 장질환 환자에게 겨냥해 쓴다면'을 가정해 계산한 모형값이다. 같은 표에서 겨냥하지 않고 평균적인 염증성 장질환 환자까지 섞으면 절감액은 1,539달러로 떨어지고, 이는 의사가 붙지 않는 랩어라운드형의 1,889달러보다 오히려 적다. 그리고 phti는 ayble에 대해 '비용이나 의료 이용량에 미친 영향을 다룬 연구는 한 건도 없었다'고 명시했다. 임상 근거도 대조군이 없는 단일군 연구 두 건뿐이어서, phti는 임상의 주도형 전체의 근거 확실성을 '낮음'으로, 랩어라운드형은 과민성 대장 증후군에 한해 '높음'으로 매겼다. 즉 의사가 붙는 쪽이 더 비싼데 근거는 더 얇다는 것이 이 보고서의 결론에 가깝다.\", \"for_us\": \"뉴스레터의 분류대로 보면 이 회사는 의사를 고용하고 주별 면허를 갖춰야 하는 형태라서 3개월 안에 따라 만들 수 있는 대상이 아니다. 그런데 phti 보고서를 열어 보면 우리에게 쓸모 있는 판정이 따로 나온다. 의사가 붙지 않고 코치와 영양사, 심리 프로그램만으로 이루어진 랩어라운드형이 과민성 대장 증후군 환자에 대해서는 근거 확실성 '높음'을 받았고 1인당 절감액도 더 컸다는 대목이다. 다시 말해 소화기 증상 영역에서 소프트웨어와 비의료 인력만으로 돌아가는 형태가 이미 근거로 인정받은 자리다. ayble이 앱에서 하는 일 가운데 식사와 증상을 기록해 증상을 일으키는 음식을 찾아 주는 부분과 장과 뇌의 연결을 다루는 프로그램은 진료 면허가 필요 없는 영역이고, 우리 앱의 식단 기록 기능과 붙는 지점이 있다. 한 가지 더 눈여겨볼 것은 이런 회사의 환자가 앱스토어에서 오지 않는다는 사실이다. android 내려받기가 1,000회대이고 ios 별점이 20개뿐인데도 회사는 성장하고 있는데, 유입이 전부 고용주와 보험사의 복리후생 안내 창구에서 오기 때문이다. 미국에서 건강 앱을 b2c로 퍼뜨리려 할 때 이 구조를 염두에 둘 필요가 있다.\", \"screenshots\": [{\"file\": \"ayble-health_home.png\", \"caption\": \"첫 화면이다. '소화기 증상을 혼자 감당하지 마세요'라는 문구와 함께 화상 진료를 받는 장면을 보여 주고, 맨 위 띠에 '보험 인네트워크로 소화기 전문 진료를 받는다'고 적어 두었다.\", \"from\": \"https://www.ayblehealth.com\"}, {\"file\": \"ayble-health_howitworks.png\", \"caption\": \"환자가 겪는 흐름을 보여 주는 페이지다. 4분 문진, 30~45분 첫 진료, 이어지는 관리라는 세 단계와 진료팀 구성, 본인부담금 0~30달러 안내가 들어 있다.\", \"from\": \"https://www.ayblehealth.com/how-it-works\"}, {\"file\": \"ayble-health_employers.png\", \"caption\": \"고용주와 보험사를 상대로 파는 페이지다. 투자 대비 3배 회수와 회원 1인당 연 2,901달러 절감을 앞세우며 phti가 독립적으로 검토했다고 적어 두었는데, 이 숫자의 출처는 caveats에서 따로 짚었다.\", \"from\": \"https://www.ayblehealth.com/employers\"}, {\"file\": \"ayble-health_ios.png\", \"caption\": \"미국 앱스토어의 소비자용 앱 페이지다. 무료이고 평가는 20명이 매긴 4.7점이다. 이 회사의 환자가 앱스토어를 통해 들어오지 않는다는 것을 보여 준다.\", \"from\": \"https://apps.apple.com/us/app/ayble-health-gi-gut-care/id1642365544\"}], \"sources\": [{\"title\": \"ayble health 공식 사이트 첫 화면\", \"url\": \"https://www.ayblehealth.com\", \"note\": \"무엇을 파는지, 어떤 보험과 인네트워크인지, 본인부담금이 얼마인지 확인했다.\"}, {\"title\": \"ayble health 이용 흐름 안내\", \"url\": \"https://www.ayblehealth.com/how-it-works\", \"note\": \"4분 문진과 30~45분 첫 진료, 진료팀 구성, 앱의 역할을 확인했다.\"}, {\"title\": \"ayble health 고용주용 페이지\", \"url\": \"https://www.ayblehealth.com/employers\", \"note\": \"고용주와 보험사를 상대로 내세우는 절감 수치와 계약 방식을 확인했다.\"}, {\"title\": \"ayble health 창업 이야기와 구성원\", \"url\": \"https://www.ayblehealth.com/our-story\", \"note\": \"창업자 sam jactel의 진단 경험, 리더십 구성, 임상 자문, 투자사 표기를 확인했다.\"}, {\"title\": \"ayble health 뉴스룸\", \"url\": \"https://www.ayblehealth.com/newsroom\", \"note\": \"mayo clinic, cleveland clinic, castlight, amazon 관련 소식과 시점을 확인했다.\"}, {\"title\": \"phti, 버추얼 소화기 케어 솔루션 평가\", \"url\": \"https://www.phti.org/assessment/virtual-solutions-gi-conditions/\", \"note\": \"뉴스레터가 소개한 보고서다. 랩어라운드형과 임상의 주도형의 구분, 두 갈래의 임상 근거와 경제성 판정을 확인했다.\"}, {\"title\": \"phti 평가 본문 보고서(pdf)\", \"url\": \"https://www.phti.org/wp-content/uploads/2026/05/phti-virtual-gi-care-solutions-assessment-report-v1.1.pdf\", \"note\": \"ayble의 설립 연도 2020년과 누적 투자 1,140만 달러, 임상의 주도형의 값 1,025달러, ayble 근거가 단일군 연구 두 건뿐이고 비용 효과 연구는 없다는 서술을 확인했다.\"}, {\"title\": \"phti 평가 요약본(pdf)\", \"url\": \"https://www.phti.org/wp-content/uploads/2026/03/phti-virtual-gi-care-solutions-executive-summary.pdf\", \"note\": \"1인당 연 절감액 표(랩어라운드 1,889달러, 임상의 주도형 1,539달러와 2,901달러)와 근거 확실성 등급을 확인했다.\"}, {\"title\": \"ayble health, amazon 복리후생 창구 합류 보도자료\", \"url\": \"https://www.prnewswire.com/news-releases/ayble-health-joins-amazons-health-benefits-connector-to-expand-virtual-gi-care-access-to-millions-of-americans-302868228.html\", \"note\": \"2026년 9월 3일 발표, 소화기 분야 첫 제공자라는 사실과 회사가 밝힌 증상 개선 수치를 확인했다.\"}, {\"title\": \"medcity news, mayo clinic 협력 기사\", \"url\": \"https://medcitynews.com/2023/11/mayo-clinic-digestive-healthcare/\", \"note\": \"2020년 설립, 고용주와 보험사에 팔며 회원 단위로 값을 받되 상당 부분을 성과에 연동한다는 초기 사업 구조를 확인했다.\"}, {\"title\": \"cleveland clinic 협력 발표\", \"url\": \"https://www.ayblehealth.com/press/ayble-health-the-cleveland-clinic-expand-chronic-digestive-disease-care\", \"note\": \"2024년 10월 협력 내용과 회사가 내세우는 연구 기반 서술을 확인했다.\"}, {\"title\": \"apple app store, ayble health: gi & gut care\", \"url\": \"https://apps.apple.com/us/app/ayble-health-gi-gut-care/id1642365544\", \"note\": \"무료, 2023년 4월 출시, 평가 20건에 4.7점, 사업자명 agora health inc.를 확인했다.\"}, {\"title\": \"google play, ayble health\", \"url\": \"https://play.google.com/store/apps/details?id=com.ayblehealth.app\", \"note\": \"2023년 4월 출시, 내려받기 1,000회 이상 구간임을 확인했다.\"}]}"},{"slug":"betterhelp","name":"BetterHelp","one_liner":"면허를 가진 심리상담사와 이용자를 연결해 주고, 채팅과 음성 통화와 영상 통화로 상담을 받게 하는 미국 최대의 온라인 상담 서비스다. 2013년에 세워졌고, 원격진료 회사 Teladoc Health가 2015년에 사들여 지금은 그 회사의 두 사업 부문 가운데 하나로 운영된다.","sells_to":"mixed","seen_in":[{"issue":"22","section":24,"headline":"Teladoc이 소비자 직접 결제 사업의 감소를 보험 적용 사업의 성장으로 메우려 한다는 소식으로 나왔고, 회원의 80%가 비용 때문에 현금 결제를 그만둔다는 회사 설명이 함께 실렸다."}],"card":{"problem":"미국에서 심리상담을 자기 돈으로 받으면 회당 100달러에서 350달러가 든다. 값이 부담스러워 시작하지 못하거나 몇 달 만에 그만두는 사람이 많다.","solution":"질문에 답하면 면허가 있는 상담사를 붙여 주고, 채팅과 음성과 영상 가운데 원하는 방식으로 상담을 받게 한다. 주 단위 구독으로 값을 미리 정해 두었고, 최근에는 보험이 적용되는 경로를 함께 열었다.","price":"보험을 쓰지 않으면 주당 50달러에서 90달러이고 4주치를 한 번에 결제한다. 보험이 적용되면 자격이 되는 가입자가 회당 평균 23달러를 낸다.","tags":["온라인 상담","정신건강","주간 구독","보험 적용","상담사 매칭"],"headline_traction":"2025년 BetterHelp 부문 매출은 9억 5,040만 달러였지만 1년 전보다 9% 줄었고, 유료 이용자도 5% 줄어 39만 명이 됐다.","watch":"사이트에 걸린 성과 수치는 모두 회사가 스스로 낸 것이다. 소비자 직접 결제 매출이 계속 줄고 있으며, 2023년에는 이용자의 정신건강 정보를 광고에 넘긴 문제로 미국 연방거래위원회에서 780만 달러 제재를 받았다."},"screenshots":[{"file":"betterhelp_home.png","caption":"첫 화면이다. 값이나 기능을 설명하기 전에 개인, 부부, 청소년 가운데 어떤 상담을 찾는지부터 고르게 한다.","from":"https://www.betterhelp.com/"},{"file":"betterhelp_getstarted.png","caption":"가입 첫 단계다. 상단에 여덟 칸짜리 진행 막대가 있고, 상담사를 배정하기 위한 질문이 이어진다.","from":"https://www.betterhelp.com/get-started/"},{"file":"betterhelp_insurance.png","caption":"보험 안내 페이지다. 125개가 넘는 보험 플랜과 연결돼 있고 자격이 되면 회당 평균 23달러를 낸다는 안내, 보험과 구독과 대면 상담의 값을 나란히 비교한 표가 들어 있다.","from":"https://www.betterhelp.com/insurance/"}],"q":"{\"slug\": \"betterhelp\", \"name\": \"betterhelp\", \"one_liner\": \"면허를 가진 심리상담사와 이용자를 연결해 주고, 채팅과 음성 통화와 영상 통화로 상담을 받게 하는 미국 최대의 온라인 상담 서비스다. 2013년에 세워졌고, 원격진료 회사 teladoc health가 2015년에 사들여 지금은 그 회사의 두 사업 부문 가운데 하나로 운영된다.\", \"site\": \"https://www.betterhelp.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"22\", \"section\": 24, \"headline\": \"teladoc이 소비자 직접 결제 사업의 감소를 보험 적용 사업의 성장으로 메우려 한다는 소식으로 나왔고, 회원의 80%가 비용 때문에 현금 결제를 그만둔다는 회사 설명이 함께 실렸다.\"}], \"card\": {\"problem\": \"미국에서 심리상담을 자기 돈으로 받으면 회당 100달러에서 350달러가 든다. 값이 부담스러워 시작하지 못하거나 몇 달 만에 그만두는 사람이 많다.\", \"solution\": \"질문에 답하면 면허가 있는 상담사를 붙여 주고, 채팅과 음성과 영상 가운데 원하는 방식으로 상담을 받게 한다. 주 단위 구독으로 값을 미리 정해 두었고, 최근에는 보험이 적용되는 경로를 함께 열었다.\", \"price\": \"보험을 쓰지 않으면 주당 50달러에서 90달러이고 4주치를 한 번에 결제한다. 보험이 적용되면 자격이 되는 가입자가 회당 평균 23달러를 낸다.\", \"tags\": [\"온라인 상담\", \"정신건강\", \"주간 구독\", \"보험 적용\", \"상담사 매칭\"], \"headline_traction\": \"2025년 betterhelp 부문 매출은 9억 5,040만 달러였지만 1년 전보다 9% 줄었고, 유료 이용자도 5% 줄어 39만 명이 됐다.\", \"watch\": \"사이트에 걸린 성과 수치는 모두 회사가 스스로 낸 것이다. 소비자 직접 결제 매출이 계속 줄고 있으며, 2023년에는 이용자의 정신건강 정보를 광고에 넘긴 문제로 미국 연방거래위원회에서 780만 달러 제재를 받았다.\"}, \"problem\": \"미국에서 심리상담을 받으려면 두 가지 벽을 넘어야 한다. 첫째는 값이다. betterhelp가 자기 사이트에 적어 둔 바로는 보험을 쓰지 않고 대면 상담을 받을 때 회당 100달러에서 350달러가 든다. 둘째는 상담사를 찾는 일 자체다. 보험이 있어도 그 보험을 받아 주는 상담사를 직접 수소문해 예약을 잡아야 하고, 그 과정에서 몇 주가 지나가는 일이 흔하다. 한국은 정신건강의학과 진료가 건강보험 급여 대상이고 동네 의원에 그냥 가면 되지만, 미국은 상담사가 어느 보험망에 들어 있는지부터 확인해야 하므로 시작 자체가 일이 된다. 그래서 값을 미리 알 수 있고 상담사를 대신 찾아 주는 서비스에 수요가 생겼다.\", \"solution\": \"이용자는 먼저 개인 상담인지 부부 상담인지 청소년 상담인지를 고르고, 여덟 단계쯤 되는 질문에 답한다. 질문은 무엇 때문에 힘든지, 어떤 상담사를 원하는지를 묻고, 그 답을 바탕으로 회사가 상담사를 배정한다. 배정이 끝나면 상담사와 개인 대화방이 열리고, 이용자는 예약 없이 아무 때나 메시지를 남기거나 실시간 채팅, 음성 통화, 영상 통화로 상담을 받는다. 값은 보험을 쓰지 않을 경우 주당 50달러에서 90달러이며 4주치를 한 번에 결제하는 구독 방식이고, 언제든 해지할 수 있다. 2025년부터는 보험이 적용되는 경로가 생겨서, 125개가 넘는 보험 플랜의 가입자 가운데 자격이 되는 사람은 회당 평균 23달러의 본인부담금만 내고 주 1회 실시간 상담을 받는다. 다만 이 서비스의 상담사는 정식 진단을 내리거나 약을 처방할 수 없고, 법원이 명령한 상담이나 응급 상황에는 쓸 수 없다고 회사가 밝혀 두었다.\", \"features\": [{\"name\": \"설문 기반 상담사 배정\", \"detail\": \"이용자가 목적과 선호를 묻는 질문에 답하면 회사가 조건에 맞는 면허 상담사를 골라 붙여 준다. 마음에 들지 않으면 상담사를 바꿔 달라고 요청할 수 있다.\"}, {\"name\": \"네 가지 상담 방식\", \"detail\": \"메시지 주고받기, 실시간 채팅, 전화 통화, 영상 통화를 섞어 쓸 수 있다. 메시지는 예약 없이 아무 때나 보낼 수 있고 전화 상담에서는 이용자의 전화번호가 상담사에게 노출되지 않는다.\"}, {\"name\": \"보험 적용 상담\", \"detail\": \"보험 안내 페이지에 cigna, aetna, optum, unitedhealthcare, curative, blue cross blue shield, anthem, carefirst, highmark가 열거돼 있고 모두 125개가 넘는 보험 플랜과 연결돼 있다. 자격이 되는 가입자는 구독료 대신 회당 평균 23달러의 본인부담금을 낸다.\"}, {\"name\": \"자가 학습 자료와 단체 세미나\", \"detail\": \"상담 외에 150개가 넘는 디지털 워크시트와 학습 모듈, 주당 20회가 넘는 실시간 단체 세미나를 함께 제공한다고 회사가 밝히고 있다.\"}, {\"name\": \"대상별 형제 서비스\", \"detail\": \"부부 상담은 regain, 청소년 상담은 teen counseling이라는 별도 브랜드와 앱으로 운영한다. 수면 관리 앱 bettersleep도 같은 사업 부문에 들어 있다.\"}], \"differentiator\": \"teladoc이 연차보고서에서 직접 꼽은 경쟁자는 grow therapy, headway, rula, spring health, talkspace다. 이 가운데 headway와 grow therapy, rula는 처음부터 보험 청구를 대신 처리해 주는 방식으로 출발했고, spring health는 고용주에게 파는 회사다. betterhelp는 반대로 보험을 아예 거치지 않고 소비자에게 직접 구독을 파는 방식으로 규모를 키웠고, 그 결과 미국 소비자가 가장 많이 아는 온라인 정신건강 브랜드가 됐다. 지금 벌어지는 일은 그 차이가 뒤집히는 과정이다. betterhelp는 2025년 4월에 보험 청구가 가능한 상담 제공자 조직인 uplift를 사들여 뒤늦게 보험 경로를 붙이고 있으며, 이 점에서 원래 경쟁자들이 서 있던 자리로 옮겨 가는 중이다.\", \"team\": [{\"name\": \"fernando madeira\", \"role\": \"betterhelp 사업 부문 사장\", \"background\": \"teladoc health 경영진 소개 페이지에서 직함만 확인했고, 이전 경력을 밝힌 자료는 찾지 못했다.\"}, {\"name\": \"chuck divita\", \"role\": \"모회사 teladoc health 최고경영자\", \"background\": \"실적 발표 자료와 경영진 소개 페이지에서 직함만 확인했고, 이전 경력을 밝힌 자료는 찾지 못했다.\"}, {\"name\": \"michael grasher\", \"role\": \"모회사 teladoc health 최고재무책임자\", \"background\": \"2026년 8월 31일자로 부임했다. 보험업에서 경력을 쌓은 사람으로, ifg companies와 fortegra group에서 최고재무책임자를 지냈고 그 전에는 산재보험 회사 amerisafe의 최고재무책임자와 보험 담당 애널리스트로 일했다.\"}], \"traction\": [{\"type\": \"revenue\", \"detail\": \"2025년 한 해 betterhelp 부문 매출이 9억 5,040만 달러였고, 1년 전보다 9% 줄었다.\", \"when\": \"2026-02\", \"source\": \"teladoc health 2025년 4분기 및 연간 실적 발표 자료\"}, {\"type\": \"customers\", \"detail\": \"2025년 유료 이용자가 5% 줄어 39만 명이 됐다고 연차보고서에 적었다.\", \"when\": \"2026-02\", \"source\": \"teladoc health 2025 회계연도 10-k\"}, {\"type\": \"revenue\", \"detail\": \"2026년 2분기 부문 매출은 2억 1,260만 달러로 1년 전보다 12% 줄었고, 조정 영업이익률은 0.2%까지 내려갔다. 회사는 2026년 연간 부문 매출이 12.7%에서 19.0%까지 줄어들 것으로 전망을 낮췄다.\", \"when\": \"2026-07\", \"source\": \"teladoc health 2026년 2분기 실적 발표 자료\"}, {\"type\": \"partnership\", \"detail\": \"125개가 넘는 보험 플랜과 계약을 맺어 보험 적용 상담을 시작했고, 2026년 2분기에는 전국 확대 일정을 계획보다 앞당겼다.\", \"when\": \"2026-07\", \"source\": \"betterhelp 보험 안내 페이지와 teladoc health 2026년 2분기 실적 발표 자료\"}, {\"type\": \"funding\", \"detail\": \"teladoc이 2015년 1월 23일에 betterhelp의 법인 compile, inc.를 인수했다. 인수 대금은 현금 330만 달러와 3년치 순매출의 15%를 주는 성과 연동 대금, 그리고 100만 달러짜리 약속어음이었다.\", \"when\": \"2015-01\", \"source\": \"teladoc 2015년 3분기 분기보고서 10-q\"}, {\"type\": \"funding\", \"detail\": \"2025년 4월 30일에 보험 청구가 가능한 상담 제공자 조직 uplift health technologies를 현금 2,960만 달러에 사들였고, 목표 달성에 따라 1,270만 달러를 더 주기로 했다. uplift의 실적은 betterhelp 부문에 합산된다.\", \"when\": \"2025-04\", \"source\": \"teladoc health 2025 회계연도 10-k\"}, {\"type\": \"regulatory\", \"detail\": \"2023년 3월 2일 미국 연방거래위원회가 이용자의 정신건강 정보를 facebook과 snapchat 등에 광고 목적으로 넘긴 행위를 문제 삼아 780만 달러를 물리고, 건강 정보를 광고에 넘기는 행위를 금지했다.\", \"when\": \"2023-03\", \"source\": \"미국 연방거래위원회 보도자료\"}, {\"type\": \"traffic\", \"detail\": \"미국 애플 앱스토어에서 별점 4.8에 평가 149,348건이고 건강 및 피트니스 부문 63위이며, 구글 플레이에서는 별점 4.6에 후기 6만 5,300건, 내려받기 100만 회 이상이다.\", \"when\": \"2026-09\", \"source\": \"애플 앱스토어와 구글 플레이 페이지\"}], \"caveats\": \"이 회사를 볼 때 수치의 출처를 나누어 읽어야 한다. 매출과 이용자 수, 인수 금액은 teladoc이 미국 증권거래위원회에 낸 공시 자료에서 직접 확인한 것이므로 회계감사를 거친 숫자다. 반면 상담사 3만 1천 명 이상, 도움받은 사람 666만 명, 12주 만에 증상이 줄어든 이용자 72%, 상담사 매칭 선호 반영률 93% 같은 수치는 모두 betterhelp가 자기 사이트에 올린 것이고 제삼자가 확인한 것이 아니다.\\n\\n뉴스레터에 실린 '회원의 80%가 비용 때문에 현금 결제를 그만둔다'는 대목도 회사가 밝힌 내용을 전한 것이며, 공시 자료에서 같은 문장을 찾지는 못했다. 다만 방향은 공시로 뒷받침된다. 유료 이용자는 2025년에 5% 줄어 39만 명이 됐고, 부문 매출은 2025년에 9% 줄어든 데 이어 2026년 2분기에는 12% 줄었으며, 회사는 2026년 연간 감소폭 전망을 12.7%에서 19.0%까지로 낮췄다. 2026년 2분기 발표에서는 현금 결제 매출 감소가 5월 말부터 예상보다 빨라졌고, 보험 적용 상담 수요는 상담사 공급을 넘어서서 그 수요를 매출로 바꾸지 못했다고 밝혔다.\\n\\n회사 사이트가 내건 상담 효과 수치에는 적용 범위 제한이 붙어 있다. 보험 안내 페이지의 비교표 아래에는 그 수치가 구독 이용자의 결과이며 보험으로 받은 상담은 포함하지 않는다는 단서가 달려 있다. 보험을 쓰지 않는 대면 상담이 회당 100달러에서 350달러라는 비교 값도 betterhelp가 자체 조사한 것이 아니라 medical news today를 출처로 적어 둔 것이다.\\n\\n값도 페이지마다 다르게 적혀 있다. 첫 화면과 자주 묻는 질문 페이지는 주당 50달러에서 90달러라고 적었는데, 보험 안내 페이지는 같은 구독을 주당 70달러에서 100달러라고 적었다. 환불 규모도 눈여겨볼 대목으로, 2025년 한 해 환불액이 4,990만 달러였고 2023년에는 9,300만 달러였다.\\n\\n규제 이력도 있다. 2023년 연방거래위원회 제재는 이용자가 회원 가입 과정에서 적어 낸 정신건강 관련 답변을 광고 목적으로 넘긴 행위를 문제 삼은 것이었다. 지금도 애플 앱스토어의 개인정보 항목에는 이 앱이 위치와 사용 기록을 추적 목적으로 수집하고, 건강 및 피트니스 정보와 민감 정보를 이용자 신원에 연결한다고 표시돼 있다.\\n\\nbetterhelp를 세운 사람이 누구인지는 확인하지 못했다. 회사 소개 페이지는 2013년에 세워졌다는 사실만 적어 두었고 창업자 이름을 밝히지 않는다. 이 프로필에 창업자를 넣지 않은 이유가 여기에 있다.\\n\\n2026년 9월 11일 기준으로 2분기 실적 발표 이후에 나온 teladoc의 공시 세 건을 확인했으나 betterhelp 사업에 관한 내용은 없었다. 사외이사 한 명이 새로 왔고, 2014년부터 일한 사외이사 한 명이 물러났으며, 최고재무책임자가 바뀌었다. 따라서 이 프로필의 실적 수치는 2026년 2분기까지가 가장 최근 자료다.\", \"for_us\": \"첫째로 가져갈 것은 이탈의 원인이 효과가 아니라 값이라는 사실이다. 미국에서 정신건강에 자기 돈을 쓰는 사람이 분명히 있는데도 그 지출이 오래 이어지지 않는다. 상담을 그만둔 사람에게는 대신 쓸 도구가 남지 않으므로, 무료로 쓸 수 있는 기분 기록과 주간 정리 화면은 3개월 안에 소프트웨어만으로 만들 수 있으면서 지금 우리 앱에 없는 가치가 된다. 걸음 수와 수면을 이미 가지고 있다는 점이 여기서 유리하게 작용한다.\\n\\n둘째는 온보딩 구조다. betterhelp는 첫 화면에서 개인, 부부, 청소년 가운데 하나를 고르게 하고 여덟 단계 남짓한 질문으로 이어 간다. 값을 묻기 전에 사람을 분류하는 이 구조는 상담이 아니어도 그대로 쓸 수 있다.\\n\\n셋째는 하지 말아야 할 선이다. betterhelp조차 진단과 처방, 법원 명령 상담, 응급 상황을 명시적으로 제외하고 있다. 우리가 정서 관련 기능을 붙일 때 진단이나 치료를 표방하지 않고 기록과 되돌아보기에 머무르면 규제 부담을 피할 수 있다는 근거가 된다.\\n\\n넷째는 데이터 취급이다. 2023년 제재는 회원 가입 설문의 답변을 광고에 넘긴 행위에서 나왔다. 우리 앱은 광고로 매출을 내고 있으므로, 건강 관련 입력값이 광고 도구에 닿는 경로가 하나라도 있으면 같은 위험에 걸린다. 미국 진출 전에 광고 sdk와 건강 데이터의 분리를 먼저 확인해야 한다.\\n\\n다섯째로 덧붙일 것은 이 회사가 방향을 바꾸는 방식이다. teladoc은 betterhelp를 보험 쪽으로 옮기는 도중인 2026년 8월에 보험업에서만 경력을 쌓은 사람을 최고재무책임자로 앉혔다. 소비자에게 직접 파는 회사가 보험으로 넘어가려면 사람과 조직까지 바꿔야 한다는 뜻이며, 이는 3개월짜리 소프트웨어 작업으로 흉내 낼 수 있는 일이 아니다. 우리가 미국에서 가져갈 자리는 보험에 붙는 쪽이 아니라, 값 때문에 상담을 그만둔 사람이 무료로 쓸 수 있는 자리다.\", \"screenshots\": [{\"file\": \"betterhelp_home.png\", \"caption\": \"첫 화면이다. 값이나 기능을 설명하기 전에 개인, 부부, 청소년 가운데 어떤 상담을 찾는지부터 고르게 한다.\", \"from\": \"https://www.betterhelp.com/\"}, {\"file\": \"betterhelp_getstarted.png\", \"caption\": \"가입 첫 단계다. 상단에 여덟 칸짜리 진행 막대가 있고, 상담사를 배정하기 위한 질문이 이어진다.\", \"from\": \"https://www.betterhelp.com/get-started/\"}, {\"file\": \"betterhelp_insurance.png\", \"caption\": \"보험 안내 페이지다. 125개가 넘는 보험 플랜과 연결돼 있고 자격이 되면 회당 평균 23달러를 낸다는 안내, 보험과 구독과 대면 상담의 값을 나란히 비교한 표가 들어 있다.\", \"from\": \"https://www.betterhelp.com/insurance/\"}, {\"file\": \"betterhelp_ios.png\", \"caption\": \"미국 애플 앱스토어 페이지다. 별점 4.8에 평가 149,000건이고 건강 및 피트니스 부문 63위이며, 판매자 이름이 인수 전 법인명인 compile, inc.로 남아 있다.\", \"from\": \"https://apps.apple.com/us/app/betterhelp-therapy/id995252384\"}], \"sources\": [{\"title\": \"betterhelp 첫 화면과 자주 묻는 질문 페이지\", \"url\": \"https://www.betterhelp.com/faq/\", \"note\": \"주당 50달러에서 90달러라는 값과 4주 단위 결제, 언제든 해지할 수 있다는 조건, 그리고 미성년자와 응급 상황과 법원이 명령한 상담에는 쓸 수 없고 정식 진단과 약 처방도 할 수 없다는 제한을 확인했다.\"}, {\"title\": \"betterhelp 보험 안내 페이지\", \"url\": \"https://www.betterhelp.com/insurance/\", \"note\": \"125개가 넘는 보험 플랜, 회당 평균 23달러 본인부담금, cigna와 aetna를 비롯한 보험사 목록, 보험과 구독과 회당 결제 방식을 나란히 놓은 비교표, 대면 상담 회당 100달러에서 350달러라는 값과 그 출처가 medical news today라는 표시, 주당 70달러에서 100달러라는 구독 값, 효과 수치가 구독 이용자에게만 해당한다는 단서를 확인했다.\"}, {\"title\": \"teladoc health 2025년 4분기 및 연간 실적 발표 자료\", \"url\": \"https://www.sec.gov/archives/edgar/data/1477449/000147744926000010/tdoc-20251231xexx991.htm\", \"note\": \"2025년 betterhelp 부문 매출 9억 5,040만 달러와 9% 감소, 4분기 2억 3,320만 달러와 7% 감소를 확인했다.\"}, {\"title\": \"teladoc health 2026년 2분기 실적 발표 자료\", \"url\": \"https://www.sec.gov/archives/edgar/data/1477449/000147744926000036/tdoc-20260630xexx991.htm\", \"note\": \"2분기 부문 매출 2억 1,260만 달러와 12% 감소, 조정 영업이익률 0.2%, 5월 말부터 현금 결제 매출 감소가 빨라졌다는 설명, 보험 수요가 상담사 공급을 넘어섰다는 설명, 전국 확대를 앞당겼다는 내용, 2026년 연간 전망 하향을 확인했다.\"}, {\"title\": \"teladoc health 2025 회계연도 연차보고서 10-k\", \"url\": \"https://www.sec.gov/archives/edgar/data/1477449/000147744926000012/tdoc-20251231.htm\", \"note\": \"유료 이용자 39만 명과 5% 감소, 2025년 환불액 4,990만 달러, uplift 인수 금액과 날짜, 경쟁사 목록, betterhelp 이용자의 절반 가까이가 상담을 처음 받는다는 설명, 보험 전환이 매출과 이익률을 낮출 수 있다는 위험 고지를 확인했다.\"}, {\"title\": \"teladoc 2015년 3분기 분기보고서 10-q\", \"url\": \"https://www.sec.gov/archives/edgar/data/1477449/000155837015002122/tdoc-20150930x10q.htm\", \"note\": \"2015년 1월 23일 인수 사실과 현금 330만 달러, 3년치 순매출 15% 성과 연동 대금, 100만 달러 약속어음이라는 조건, betterhelp의 법인명이 compile, inc.라는 사실을 확인했다.\"}, {\"title\": \"미국 연방거래위원회 betterhelp 제재 보도자료\", \"url\": \"https://www.ftc.gov/news-events/news/press-releases/2023/03/ftc-ban-betterhelp-revealing-consumers-data-including-sensitive-mental-health-information-facebook\", \"note\": \"2023년 3월 2일 제재 사실, 780만 달러 금액, 환불 대상 기간, 건강 정보를 광고에 넘기지 못하도록 한 금지 명령을 확인했다.\"}, {\"title\": \"teladoc health 경영진 소개 페이지\", \"url\": \"https://teladochealth.com/leadership/\", \"note\": \"betterhelp 사업 부문 사장 fernando madeira와 최고경영자 chuck divita를 비롯한 경영진의 직함을 확인했다. 이 페이지에는 각자의 이전 경력을 적은 설명이 없다.\"}, {\"title\": \"애플 앱스토어 betterhelp 페이지\", \"url\": \"https://apps.apple.com/us/app/betterhelp-therapy/id995252384\", \"note\": \"별점 4.8과 평가 149,348건, 건강 및 피트니스 부문 63위, 판매자 compile, inc., 2026년 8월 26일 올라온 23.1 버전, 위치와 건강 정보를 수집한다는 개인정보 표시를 확인했다.\"}, {\"title\": \"구글 플레이 betterhelp 페이지\", \"url\": \"https://play.google.com/store/apps/details?id=com.betterhelp\", \"note\": \"별점 4.6, 후기 6만 5,300건, 내려받기 100만 회 이상을 확인했다.\"}, {\"title\": \"betterhelp 회사 소개 페이지\", \"url\": \"https://www.betterhelp.com/about/\", \"note\": \"2013년에 세워졌다는 사실, 상담사가 31,000명이 넘는다는 회사 자체 수치, 세계에서 가장 큰 상담 서비스라는 표현, 비영리 단체 100여 곳과 협력한다는 내용을 확인했다. 창업자 이름은 적혀 있지 않다.\"}, {\"title\": \"teladoc health 2026년 8월 공시 세 건 (8-k)\", \"url\": \"https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&cik=0001477449&type=8-k\", \"note\": \"2분기 실적 발표 이후 나온 공시를 모두 확인했다. 8월 3일 사외이사 mark v. anquillare 선임, 8월 13일 사외이사 david b. snow, jr. 사임 통지, 8월 31일 최고재무책임자 michael grasher 부임과 그 경력이 담겨 있으며 betterhelp 사업에 관한 내용은 없었다.\"}]}"},{"slug":"blueprint-immortals","name":"Immortals (Bryan Johnson)","one_liner":"Bryan Johnson이 5년 동안 자기 몸에 적용해 온 노화 관리 방법을 상품으로 나누어, 무료 앱과 연 365달러짜리 혈액검사 구독부터 연 100만 달러짜리 전담 의료팀 회원제까지 여러 가격대로 소비자에게 직접 파는 회사다.","sells_to":"consumer","seen_in":[{"issue":"14","section":13,"headline":"Bryan Johnson이 연 100만 달러짜리 롱제비티 상품 Immortals를 단 세 명에게 판다고 발표했고 약 1,600명이 지원했다는 소식으로, 필자는 지원자 수에 지불 능력 확인 절차가 없으니 걸러 들으라고 단서를 달았다."}],"card":{"problem":"미국에서 노화 관리는 보험이 돈을 대 주지 않는 영역이라 검사도 약도 개인이 값을 알아보고 직접 사야 한다. 무엇부터 손대야 하는지 정리해 주는 곳이 없어서, 건강에 돈을 쓸 뜻이 있는 사람조차 흩어진 정보를 스스로 모아 판단한다.","solution":"Bryan Johnson이 자기 몸에 써 온 방법을 그대로 층층이 나누어 판다. 무료 앱에 웨어러블과 이미 받아 둔 검사 결과를 넣으면 BryanAI가 오늘 무엇을 하면 되는지 알려 주고, 그 위에 혈액검사 구독과 원격 처방, 전담 의료팀 회원제를 가격대별로 붙여 둔다.","price":"앱은 무료다. 혈액검사 구독은 연 365달러이고, 전담 의료팀이 붙는 Immortals Concierge는 연 7만 5,000달러부터 100만 달러까지다.","tags":["롱제비티","무료 앱","혈액검사","원격 처방","컨시어지"],"headline_traction":"연 100만 달러짜리 상품을 발표한 뒤 약 1,600명이 지원했다고 밝혔고, 그 뒤로 연 7만 5,000달러부터 시작하는 여러 층과 무료 앱까지 갖춘 브랜드로 상품 구성을 다시 짰다.","watch":"지원자 1,600명과 매출 기회 16억 달러는 회사 발표와 뉴스레터 계산이지 제삼자가 확인한 수치가 아니고, 창업자가 내세우는 노화 지표에는 연구자들의 반박이 있다."},"screenshots":[{"file":"blueprint-immortals_home.png","caption":"Immortals 첫 화면이다. Blueprint, Medicine, Biomarkers, Concierge, App 다섯 갈래로 상품을 나누어 보여 준다.","from":"https://immortals.com/"},{"file":"blueprint-immortals_concierge.png","caption":"연 7만 5,000달러부터 100만 달러까지 받는 전담 의료팀 회원제 Immortals Concierge 안내 화면이다.","from":"https://immortals.com/pages/immortals-concierge"},{"file":"blueprint-immortals_biomarkers.png","caption":"연 365달러짜리 혈액검사 구독 안내다. 하루 1달러로 표시하고 연간 일시 결제라고 각주를 달았다.","from":"https://immortals.com/pages/biomarkers"}],"q":"{\"slug\": \"blueprint-immortals\", \"name\": \"immortals (bryan johnson)\", \"one_liner\": \"bryan johnson이 5년 동안 자기 몸에 적용해 온 노화 관리 방법을 상품으로 나누어, 무료 앱과 연 365달러짜리 혈액검사 구독부터 연 100만 달러짜리 전담 의료팀 회원제까지 여러 가격대로 소비자에게 직접 파는 회사다.\", \"site\": \"https://immortals.com\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"14\", \"section\": 13, \"headline\": \"bryan johnson이 연 100만 달러짜리 롱제비티 상품 immortals를 단 세 명에게 판다고 발표했고 약 1,600명이 지원했다는 소식으로, 필자는 지원자 수에 지불 능력 확인 절차가 없으니 걸러 들으라고 단서를 달았다.\"}], \"card\": {\"problem\": \"미국에서 노화 관리는 보험이 돈을 대 주지 않는 영역이라 검사도 약도 개인이 값을 알아보고 직접 사야 한다. 무엇부터 손대야 하는지 정리해 주는 곳이 없어서, 건강에 돈을 쓸 뜻이 있는 사람조차 흩어진 정보를 스스로 모아 판단한다.\", \"solution\": \"bryan johnson이 자기 몸에 써 온 방법을 그대로 층층이 나누어 판다. 무료 앱에 웨어러블과 이미 받아 둔 검사 결과를 넣으면 bryanai가 오늘 무엇을 하면 되는지 알려 주고, 그 위에 혈액검사 구독과 원격 처방, 전담 의료팀 회원제를 가격대별로 붙여 둔다.\", \"price\": \"앱은 무료다. 혈액검사 구독은 연 365달러이고, 전담 의료팀이 붙는 immortals concierge는 연 7만 5,000달러부터 100만 달러까지다.\", \"tags\": [\"롱제비티\", \"무료 앱\", \"혈액검사\", \"원격 처방\", \"컨시어지\"], \"headline_traction\": \"연 100만 달러짜리 상품을 발표한 뒤 약 1,600명이 지원했다고 밝혔고, 그 뒤로 연 7만 5,000달러부터 시작하는 여러 층과 무료 앱까지 갖춘 브랜드로 상품 구성을 다시 짰다.\", \"watch\": \"지원자 1,600명과 매출 기회 16억 달러는 회사 발표와 뉴스레터 계산이지 제삼자가 확인한 수치가 아니고, 창업자가 내세우는 노화 지표에는 연구자들의 반박이 있다.\"}, \"problem\": \"한국에서는 국민건강보험이 2년마다 국가건강검진을 보내 주고, 더 보고 싶은 항목이 있으면 동네 병원에서 비교적 적은 돈으로 덧붙일 수 있다. 미국에서는 아직 아프지 않은 사람이 받는 검사와 노화 관리를 보험이 의학적 필요로 인정하지 않기 때문에, 이 영역의 비용은 사실상 전액 개인이 부담한다. 그래서 검사를 받으려면 값을 스스로 알아보고 사야 하고, 나온 수치를 읽어 생활에서 무엇을 바꿀지 정하는 일까지 개인 몫으로 남는다. 인터넷에 떠도는 조언은 서로 어긋나고 근거도 제각각이어서, 건강에 돈과 시간을 쓸 뜻이 분명한 사람조차 무엇부터 시작해야 하는지 정하지 못한다. immortals는 바로 그 자리에서 한 사람이 실제로 따라 온 방법을 기준으로 내세우고, 그 기준을 여러 가격대의 상품으로 나누어 판다.\", \"solution\": \"먼저 무료 앱을 내려받아 oura, whoop, 애플워치, 핏비트, 가민, eight sleep 같은 기기를 연결하고, 다른 곳에서 받아 둔 혈액검사 결과가 있으면 형식과 검사기관을 가리지 않고 올린다. bryanai라고 부르는 알고리즘이 그 데이터를 bryan johnson의 실행 방법과 인구 단위 연구에 비추어 읽고, 지금 가장 효과가 큰 행동이 무엇인지 일상 언어로 알려 준다. 앱에서는 심박변이도가 왜 떨어졌는지, 오늘 유산소 운동을 해야 하는지 같은 질문을 대화로 물어볼 수 있다. 올릴 검사 결과가 없으면 연 365달러짜리 biomarkers 구독을 사서 quest diagnostics 채혈소에서 1년에 두 번 피와 소변을 내고, 100종이 넘는 항목을 재어 앱에 쌓는다. 약이 필요하면 immortals medicine에서 문진을 거쳐 면허 있는 의사가 판단하며, 회원비 없이 약값만 낸다. 개인 맞춤 티르제파타이드가 월 255달러, 마이크로도즈가 180달러, 일일 타다라필이 24달러다. 가장 위 단계인 immortals concierge는 전담 의사와 건강 코치, 케어 코디네이터가 붙고 전신 mri와 다중암 조기검진까지 포함하며, 값은 연 7만 5,000달러부터 100만 달러까지 여러 층으로 나뉜다.\", \"features\": [{\"name\": \"immortals 앱과 bryanai\", \"detail\": \"무료 앱이다. 웨어러블을 연결하고 아무 검사기관의 결과나 올리면, bryanai가 개인별 실행 계획과 매일의 인사이트를 만들어 준다. 회사는 진료 예약 없이 바로 시작할 수 있다는 점을 앞세운다. 미국 애플 앱스토어에 2026년 5월 28일 올라왔다.\"}, {\"name\": \"immortals biomarkers\", \"detail\": \"연 365달러짜리 검사 구독이다. 1년에 두 번 quest diagnostics 채혈소에서 피와 소변을 내고, 기준 검사에서 최대 140종, 추적 검사에서 최대 86종을 재어 연간 최대 226회를 측정한다. 결과는 95%가 2주 안에 나온다고 밝힌다. hsa·fsa 계정으로 결제할 수 있고, 애리조나·하와이·뉴저지·뉴욕·로드아일랜드에서는 가입을 받지 않는다.\"}, {\"name\": \"immortals medicine\", \"detail\": \"원격 처방 창구다. 월 회원비를 받지 않고 약값만 받는다는 점을 내세우며, 의사가 승인하기 전까지는 0달러라고 안내한다. 체중 감량용 glp-1 계열 약과 메트포르민, 아카보스, 타다라필, 미녹시딜, 트레티노인, nad+와 각종 펩타이드를 판다. 사이트에 legitscript 인증 표시를 걸어 두었다.\"}, {\"name\": \"immortals concierge\", \"detail\": \"연 7만 5,000달러부터 100만 달러까지 여러 층으로 나뉜 전담 의료팀 회원제다. 전담 의사와 건강 코치, 케어 코디네이터가 붙고, 전신 mri와 관상동맥 ct, 다중암 조기검진, dexa, vo2max, 면역 능력 검사, 200종이 넘는 혈액 항목, 유전·후성유전 분석, 미생물총과 중금속·미세플라스틱 검사가 층에 따라 들어간다. whoop과 oura 기기, blueprint 보충제와 약도 값에 포함된다. 신청은 서류 제출, 멤버십 담당자 통화, 의학적 선별, 의사 최종 통화의 네 단계를 거친다.\"}, {\"name\": \"blueprint\", \"detail\": \"보충제와 식품, 기기, 피부·모발 관리 제품을 파는 브랜드다. longevity mix가 49달러, essential microbiome이 39달러 선이다. 회사는 blueprint를 immortals의 한 부분이자 가장 문턱이 낮은 진입 지점이라고 설명한다.\"}, {\"name\": \"don't die 앱\", \"detail\": \"같은 팀이 따로 내놓은 소셜 건강 앱이다. 웨어러블을 연결하면 don't die score라는 점수가 매일 계산되고, 친구와 가족은 물론 bryan johnson과도 점수를 견주며 순위표에서 겨룬다. 지역 모임과 행사를 찾는 기능도 있다.\"}], \"differentiator\": \"같은 소비자 검사 시장에는 연 365달러짜리 function health와 연 199달러를 내세우는 superpower가 있다. immortals의 검사 구독 값은 function health와 똑같은 연 365달러이고, 채혈과 분석을 quest diagnostics에 맡기는 점도 같다. 다른 점은 두 가지다. 하나는 검사를 사지 않아도 웨어러블만 연결하면 쓸 수 있는 무료 앱을 맨 앞에 두어 돈을 내기 전에 먼저 쓰게 만든 것이고, 다른 하나는 똑같은 방법을 연 100만 달러까지 끌어올린 회원제로도 판다는 것이다. 원격 처방 쪽에서는 월 회원비를 받는 hims & hers 같은 회사와 달리 회원비를 받지 않고 약값만 받는다고 광고한다. 다만 회사는 비교 대상의 이름을 밝히지 않고 월 149달러라는 금액만 적었다.\", \"team\": [{\"name\": \"bryan johnson\", \"role\": \"공동창업자\", \"background\": \"결제 회사 braintree를 세워 2012년에 venmo를 2,620만 달러에 인수했고, 2013년 합쳐진 회사를 paypal에 8억 달러에 넘겼다. 이후 벤처투자사 os fund와 뇌 측정 기기 회사 kernel을 세웠고, 2021년 10월에 blueprint를 시작했다.\"}, {\"name\": \"kate tolo\", \"role\": \"공동창업자\", \"background\": \"회사 사이트는 blueprint와 immortals를 bryan johnson과 함께 창업한 사람으로 소개한다. 사이트 구조화 데이터에도 공동창업자로 올라 있다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"carl seger\", \"role\": \"immortals concierge 최고의료책임자\", \"background\": \"의사이며 bryan johnson의 주치의다. 예방의학과 노화 의학을 전공했고 워싱턴대학교 의과대학에서 수련한 뒤 유타대학교에서 수석 레지던트를 지냈다. 이전에 wild health의 최고경영자였다.\"}, {\"name\": \"gyre renwick\", \"role\": \"blueprint 최고경영자\", \"background\": \"2025년 7월에 blueprint 최고경영자로 선임됐고, 그 전에는 modern health의 사장이었다. bryan johnson은 제품과 프로토콜 개발을 계속 맡는다고 알려졌다.\"}], \"traction\": [{\"type\": \"customers\", \"detail\": \"연 100만 달러짜리 immortals 상품을 세 명에게 판다고 발표한 뒤 약 1,600명이 지원했다고 알려졌다. 단순 곱셈으로는 16억 달러 규모이지만, 대기자 등록에 지불 능력을 확인하는 절차가 없어 실제 계약 건수와는 다르다.\", \"when\": \"2026-02\", \"source\": \"health tech nerds 뉴스레터 14회차(2026년 2월 15일)\"}, {\"type\": \"funding\", \"detail\": \"blueprint가 외부 투자로 6,000만 달러를 받았고, 투자자 명단에 kim kardashian과 cameron·tyler winklevoss 형제가 포함됐다.\", \"when\": \"2024-10\", \"source\": \"영문 위키백과 bryan johnson 항목이 인용한 보도\"}, {\"type\": \"partnership\", \"detail\": \"혈액검사 구독의 채혈과 분석을 전국 quest diagnostics 채혈소에 맡긴다. 회사는 이 방식으로 개인이 직접 같은 검사를 주문할 때보다 값을 크게 낮췄다고 주장한다.\", \"when\": \"2026-09\", \"source\": \"immortals.com 바이오마커 페이지 faq\"}, {\"type\": \"traffic\", \"detail\": \"immortals 앱은 미국 애플 앱스토어에서 평가 19건에 평점 4.4를 받았고, 구글 플레이 설치 수는 100회 이상이다. 2026년 5월 말에 나온 앱이라 아직 규모가 작다.\", \"when\": \"2026-09\", \"source\": \"애플 itunes 검색 api와 구글 플레이 상품 페이지에서 직접 확인\"}, {\"type\": \"traffic\", \"detail\": \"같은 팀이 먼저 내놓은 don't die 앱은 구글 플레이 설치 5만 회 이상에 평점 4.9(리뷰 876건)이고, 미국 애플 앱스토어에서는 평가 657건에 평점 4.8이다.\", \"when\": \"2026-09\", \"source\": \"애플 itunes 검색 api와 구글 플레이 상품 페이지에서 직접 확인\"}, {\"type\": \"award\", \"detail\": \"bryan johnson을 다룬 넷플릭스 다큐멘터리 'don't die: the man who wants to live forever'가 2025년에 공개됐고, 2026년에는 영국 wellcome collection 전시에서 이 영상의 일부가 반복 상영됐다.\", \"when\": \"2025-01\", \"source\": \"영문 위키백과 bryan johnson 항목\"}], \"caveats\": \"뉴스레터가 전한 지원자 1,600명과 매출 기회 16억 달러는 회사 쪽 발표와 필자의 단순 곱셈이며, 제삼자가 확인한 수치가 아니다. 필자 스스로도 대기자 명단에 지불 능력을 거르는 장치가 없을 테니 걸러 들으라고 적었고, 실제로 계약이 몇 건 성사됐는지는 지금도 공개돼 있지 않다. 뉴스레터 시점에 연 6만 달러로 예고했던 중간 단계는 현재 사이트에서 연 7만 5,000달러부터로 바뀌어 있으므로, 가격 정보는 2026년 9월 기준으로 읽어야 한다. bryan johnson의 노화 속도 0.48, 근육량 98백분위 같은 지표는 모두 회사가 제시한 자기 측정값이고, mcgill 대학교의 moshe szyf 교수와 노화 연구자 andrew steele은 이 정도 결과를 지금 과학이 만들어 낼 수 있는지 회의를 표했다. 미국 식품의약국은 johnson이 받았던 종류의 혈장 수혈에 대해 이익이 없고 해로울 수 있다고 밝혔다. 뉴욕타임스는 2025년 3월 그가 비밀유지계약으로 자신과 회사의 이미지를 관리해 왔다고 보도했고, 일부 직원이 이 계약에 이의를 제기했다. 앱 설명에도 이 앱이 의료기기가 아니며 질병을 진단하거나 치료하려는 것이 아니라고 적혀 있다. 마지막으로 사이트 첫 화면은 앱을 아직 준비 중이라고 표시하지만 앱은 이미 두 스토어에 올라와 있어, 회사 안내와 실제 상태가 어긋나는 자리가 있다.\", \"for_us\": \"우리 목적에 가장 맞는 대목은 검사를 사지 않아도 쓰게 만든 무료 앱 층이다. 웨어러블을 연결하고 다른 데서 받아 둔 검사 결과를 형식에 상관없이 올리면 오늘 무엇을 하면 되는지 알려 주는 구조는 소프트웨어만으로 만들 수 있고, 우리 앱에는 걸음 데이터가 이미 쌓여 있으므로 입력의 한 축은 확보돼 있다. 두 번째는 don't die 앱의 점수와 순위 방식이다. 건강 행동을 하나의 점수로 묶어 친구·가족과 겨루게 하는 방식으로 구글 플레이 설치 5만 회 이상, 평점 4.9를 받았으니 미국 사용자에게 통하는 형태라는 증거가 된다. 세 번째는 값을 층으로 쪼갠 설계다. 무료에서 시작해 연 365달러, 그리고 연 100만 달러까지 같은 방법을 단계별로 파는 구조는, 무료 사용자를 모아 놓고 그 위에 유료 상품을 얹는 우리 처지에 그대로 옮겨 볼 만하다. 다만 이 회사가 쓰는 가장 큰 힘은 창업자 한 사람의 이름값이므로, 그 부분은 우리가 가져올 수 없다는 점을 감안해야 한다.\", \"screenshots\": [{\"file\": \"blueprint-immortals_home.png\", \"caption\": \"immortals 첫 화면이다. blueprint, medicine, biomarkers, concierge, app 다섯 갈래로 상품을 나누어 보여 준다.\", \"from\": \"https://immortals.com/\"}, {\"file\": \"blueprint-immortals_concierge.png\", \"caption\": \"연 7만 5,000달러부터 100만 달러까지 받는 전담 의료팀 회원제 immortals concierge 안내 화면이다.\", \"from\": \"https://immortals.com/pages/immortals-concierge\"}, {\"file\": \"blueprint-immortals_biomarkers.png\", \"caption\": \"연 365달러짜리 혈액검사 구독 안내다. 하루 1달러로 표시하고 연간 일시 결제라고 각주를 달았다.\", \"from\": \"https://immortals.com/pages/biomarkers\"}, {\"file\": \"blueprint-immortals_ios.png\", \"caption\": \"미국 애플 앱스토어의 immortals 앱 페이지다. 무료이며 2026년 5월 말에 올라왔다.\", \"from\": \"https://apps.apple.com/us/app/immortals-bryan-johnson/id6761206137\"}], \"sources\": [{\"title\": \"immortals 공식 사이트 첫 화면과 faq\", \"url\": \"https://immortals.com/\", \"note\": \"immortals와 blueprint의 관계, bryanai 설명, 지원 웨어러블 목록, 앱 무료 여부를 확인했다.\"}, {\"title\": \"immortals concierge 안내 페이지\", \"url\": \"https://immortals.com/pages/immortals-concierge\", \"note\": \"연 7만 5,000달러부터 100만 달러까지라는 가격 층, 포함되는 검사와 인력, 네 단계 신청 절차, 최고의료책임자 carl seger의 경력을 확인했다.\"}, {\"title\": \"immortals biomarkers 안내 페이지\", \"url\": \"https://immortals.com/pages/biomarkers\", \"note\": \"연 365달러라는 값, 1년 2회 검사, 최대 226회 측정, quest diagnostics 이용, hsa·fsa 결제, 가입 불가 주를 확인했다.\"}, {\"title\": \"immortals medicine 안내 페이지\", \"url\": \"https://immortals.com/pages/immortals-medicine\", \"note\": \"회원비를 받지 않고 약값만 받는다는 판매 방식과 취급 약 목록, legitscript 인증 표시를 확인했다.\"}, {\"title\": \"immortals 티르제파타이드 상품 페이지\", \"url\": \"https://immortals.com/collections/browse-all/products/tirzepatide\", \"note\": \"개인 맞춤 용량 255달러, 마이크로도즈 180달러라는 값과, 법인명이 continuance, llc이고 공동창업자가 bryan johnson과 kate tolo라는 구조화 데이터를 확인했다.\"}, {\"title\": \"blueprint 공식 쇼핑몰\", \"url\": \"https://blueprint.bryanjohnson.com/\", \"note\": \"보충제와 식품 가격대, blueprint가 immo 6년 6월 이 회사가 클리닉을 소유하고 통제하던 구조 자체를 불법으로 보고 450만 달러 제재금을 매겼다.\"}, \"problem\": \"미국에서 프라이머리 케어는 보험이 정해 둔 관문이다. 주치의를 구하지 못하면 전문의로 가는 길까지 함께 막히는데, 이 회차 뉴스레터가 전한 보스턴 사례에서는 진료소 열 곳에 전화를 걸어도 가장 빠른 예약이 1.5년에서 2년 뒤였다. 그렇다고 급한 증상으로 응급실에 가면 보험이 있어도 수백 달러에서 수천 달러가 나온다. 한국은 전국민 건강보험이 있어서 동네 의원이든 대학병원이든 당일에 그냥 가면 되지만, 미국에는 그 중간 자리가 비어 있다. 그 빈자리를 메우려고 생겨난 것이 어전트 케어라는 업태이며, 예약 없이 당일에 걸어 들어가 감기와 염좌와 상처를 보는 곳이다. carbon health는 이 어전트 케어로 환자를 끌어들인 뒤 같은 클리닉에서 주치의 진료까지 이어 받게 하는 구조를 만들려 했다.\", \"solution\": \"환자는 앱이나 웹에서 증상이나 진료 종류를 고르고, 가까운 클리닉의 당일 시간대를 골라 예약한다. 보험 정보를 미리 등록하면 회사가 보장 여부를 확인하고, 보험이 없으면 예약 전에 자가 부담 가격표를 볼 수 있다. 클리닉에서는 어전트 케어와 주치의 진료, 소아 진료, 엑스레이와 혈액 검사, 상처 봉합, 예방 접종까지 한자리에서 처리한다. 진료가 끝나면 진료 기록과 검사 결과가 앱에 바로 올라오고, 처방은 지정한 약국이나 집으로 보내 준다. 가벼운 증상은 클리닉에 가지 않고 화상 진료나 앱 안 메시지 상담으로 끝낼 수도 있다. 값은 보험이 있으면 보험사가 정한 본인 부담금만 내고, 보험이 없으면 베이에어리어 기준으로 어전트 케어와 주치의 진료가 각각 1회 225달러, 화상 어전트 케어가 99달러, 화상 주치의 진료가 165달러, 화상 정신건강 진료가 149달러다. 엑스레이 85달러나 독감 검사 45달러처럼 검사와 처치 값이 진료비에 더해지는 구조이며, 회사는 회원비와 구독료를 받지 않는다는 점을 첫 화면에 내세운다.\", \"features\": [{\"name\": \"당일 어전트 케어 예약\", \"detail\": \"예약 없이 걸어 들어가는 대신 앱에서 당일 시간대를 골라 잡을 수 있게 해 대기를 줄인다. 첫 화면에 다음 예약 가능 시각이 바로 표시된다.\"}, {\"name\": \"같은 클리닉의 주치의 진료\", \"detail\": \"급한 증상으로 한 번 온 환자가 같은 곳에서 주치의를 정하고 검진과 만성질환 관리까지 이어 받게 한다. 어전트 케어를 유입 통로로 쓰는 구조다.\"}, {\"name\": \"화상 진료와 메시지 상담\", \"detail\": \"클리닉에 가지 않고 앱 안에서 의료진과 영상 통화를 하거나 메시지로 상담한다. 어전트 케어, 주치의 진료, 정신건강 진료가 각각 화상으로 열려 있다.\"}, {\"name\": \"자가 부담 가격표 공개\", \"detail\": \"보험이 없는 사람을 위해 진료와 검사, 약, 처치, 보조기 값을 지역별로 나눠 사이트에 공개한다. 베이에어리어만 42개 항목이 올라와 있다.\"}, {\"name\": \"자체 개발 진료 기록 시스템 carbyos\", \"detail\": \"예약, 진료 기록, 청구, 운영 지표를 하나로 묶은 자체 소프트웨어이며, 지금은 carbyos.com이라는 별도 사이트에서 다른 의료기관에도 판다. 회사는 진료 기록 작성과 진료 코드 부여를 ai가 대신한다고 소개한다.\"}, {\"name\": \"환자용 앱과 의료진용 앱의 분리\", \"detail\": \"환자용 carby health와 의료진용 carby care를 따로 낸다. 환자용 앱 이름은 원래 carbon health였으나 현재는 carby health로 바뀌어 있다.\"}], \"differentiator\": \"같은 문제를 푸는 회사로는 one medical과 solv가 있다. one medical은 주치의 진료를 회원제로 팔며 아마존이 사들인 뒤 아마존 프라임 회원에게 연 99달러에 회원권을 내놓고 있는데, carbon health는 정반대로 회원비를 받지 않는다는 점을 첫 화면 문구로 내세운다. solv는 다른 병원의 당일 예약을 중개만 하는 반면 carbon health는 클리닉을 직접 열고 의료진을 직접 붙여 운영한다. 실제로 이 회사를 갈라놓는 것은 진료 방식이 아니라 소프트웨어를 직접 만들어 썼다는 점이며, carbyos라는 자체 진료 기록 시스템이 파산 절차를 거치고도 남아서 지금은 다른 의료기관에 파는 상품이 됐다. 다만 소프트웨어 회사로 출발해 클리닉을 사 모으는 쪽으로 방향을 튼 결과가 파산이었다는 점에서, 뉴스레터 필자는 이 회사를 관문을 새로 만들겠다던 시도가 매번 같은 자리에서 끝나는 사례로 들었다.\", \"team\": [{\"name\": \"kerem ozkay\", \"role\": \"최고경영자\", \"background\": \"\"}, {\"name\": \"eren bali\", \"role\": \"공동창업자이자 이사회 의장이며 전 최고경영자다\", \"background\": \"온라인 강의 장터 udemy를 세우고 초대 최고경영자를 지낸 뒤 2015년에 carbon health를 세웠다. 2026년 6월 캘리포니아 법무장관과의 합의에서 회사와 별도로 본인에게 10만 달러 제재금이 매겨졌다.\"}, {\"name\": \"russ fradin\", \"role\": \"이사회 부의장\", \"background\": \"\"}, {\"name\": \"sujal mandavia\", \"role\": \"최고의료책임자\", \"background\": \"법원 제출 자료를 요약한 보도에 따르면 실제 진료를 맡는 의사 소유 법인들을 이 사람 한 명이 단독으로 소유하는 구조였다. 캘리포니아 법무장관이 문제 삼은 구조가 바로 이 형태다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"코로나 유행 첫해인 2020년에 1억 2,800만 달러를 조달했다.\", \"when\": \"2020\", \"source\": \"fierce healthcare 파산 보도\"}, {\"type\": \"funding\", \"detail\": \"시리즈 d로 3억 5,000만 달러를 조달하며 기업 가치 33억 달러를 인정받았고, 2025년까지 클리닉 1,500곳을 열어 미국 최대 프라이머리 케어 사업자가 되겠다고 밝혔다.\", \"when\": \"2021-07\", \"source\": \"fierce healthcare 파산 보도\"}, {\"type\": \"funding\", \"detail\": \"cvs health ventures가 참여한 1억 달러 투자를 받았다. 당시 회사는 13개 주에 125곳이 넘는 클리닉을 운영하며 누적 100만 명 이상을 진료했다고 밝혔다.\", \"when\": \"2023-01\", \"source\": \"fierce healthcare 파산 보도\"}, {\"type\": \"revenue\", \"detail\": \"2024년 매출이 약 1억 6,600만 달러였고, 2025년 11월 30일로 끝나는 직전 12개월 매출은 약 1억 5,400만 달러였다. 회사는 매출이 줄어든 이유를 수요 감소가 아니라 빚을 줄이려고 클리닉을 팔고 사업을 정리했기 때문이라고 설명했다.\", \"when\": \"2025-11\", \"source\": \"법원 제출 자료를 요약한 chapter11cases.com 기사\"}, {\"type\": \"customers\", \"detail\": \"파산 신청 시점에 8개 주에서 클리닉 약 93곳을 운영하며 연간 80만 명 이상을 진료했고, 의료진 480명과 직원 1,400명을 두고 있었다.\", \"when\": \"2026-02\", \"source\": \"법원 제출 자료를 요약한 chapter11cases.com 기사\"}, {\"type\": \"regulatory\", \"detail\": \"carbon health technologies와 계열사 28곳이 텍사스 남부 연방파산법원에 chapter 11 회생을 신청했다. 사건 번호는 26-90306이고 담당은 christopher m. lopez 판사다.\", \"when\": \"2026-02\", \"source\": \"kroll 구조조정 사건 공식 페이지\"}, {\"type\": \"funding\", \"detail\": \"future solutions investments가 회생 절차를 유지할 운영 자금으로 최대 1,950만 달러의 dip 금융을 대기로 했다. 파산 신청서에 적힌 자산과 부채는 각각 1억 달러에서 5억 달러 사이이고 채권자는 10만 명이 넘는다.\", \"when\": \"2026-02\", \"source\": \"회사 보도자료와 fierce healthcare 보도\"}, {\"type\": \"regulatory\", \"detail\": \"법원이 제3차 수정 회생계획을 인가했고, 6월 15일에 그 계획의 효력이 발생해 절차가 끝났다. 보도에 따르면 계획에는 신규 자금 3,300만 달러와 1억 달러 규모의 출자 전환이 들어 있으며, 대주단을 이끈 future solution investments가 최대 주주가 됐다.\", \"when\": \"2026-05\", \"source\": \"kroll 사건 페이지와 bloomberg law 보도를 옮긴 기사\"}, {\"type\": \"regulatory\", \"detail\": \"캘리포니아 법무장관 rob bonta가 회사와 계열 의료법인, 공동창업자 eren bali를 상대로 합의를 발표했다. 회사에 440만 달러, bali 개인에게 10만 달러 제재금이 매겨졌고, 회사는 소유 구조를 바꾸어 의사가 진료 결정을 직접 통제하도록 해야 한다.\", \"when\": \"2026-06\", \"source\": \"캘리포니아 법무부 보도자료\"}, {\"type\": \"traffic\", \"detail\": \"환자용 앱 carby health가 미국 애플 앱스토어에서 별점 4.8에 평가 17,025건, 의료 부문 151위를 기록하고 있다. 구글 플레이에서는 별점 3.9에 후기 1,580건, 내려받기 10만 회 이상이다.\", \"when\": \"2026-09\", \"source\": \"애플 itunes 조회 api와 구글 플레이 페이지\"}, {\"type\": \"customers\", \"detail\": \"소프트웨어 부문 사이트 carbyos.com은 환자 100만 명 이상, 의료진 1,200명, 진료소 200곳이 쓰고 있으며 ai가 만든 진료 기록이 80만 건을 넘었다고 밝힌다.\", \"when\": \"2026-09\", \"source\": \"carbyos.com 첫 화면\"}], \"caveats\": \"무엇이 무너졌는지를 회사 설명과 법원 자료로 나누어 보아야 한다. 회사가 보도자료에서 댄 이유는 코로나 유행이 지나며 수요가 옮겨 갔고 헬스케어 기업을 향한 자금 시장이 닫혀 재무 부담이 커졌다는 것이다. 법원에 낸 자료를 요약한 보도는 여기에 한 줄을 더 붙이는데, 더 큰 회사에 맞춰 짜 놓은 비용 구조가 줄어든 사업 규모와 맞지 않았다는 것이다. 두 설명 모두 회사 쪽에서 나온 말이며, 제삼자가 따로 검증한 것은 아니다.\\n\\n반면 숫자는 비교적 단단하다. 2021년 7월 시리즈 d 3억 5,000만 달러와 기업 가치 33억 달러, 누적 조달 6억 달러 이상은 여러 매체가 같은 값을 전한다. 파산 신청서에 적힌 자산과 부채가 각각 1억 달러에서 5억 달러 사이이고 채권자가 10만 명을 넘는다는 것도 신청서에서 나온 값이다. 다만 매출 1억 6,600만 달러와 클리닉 93곳, 환자 80만 명 같은 수치는 법원 제출 서류를 ai 도구로 요약한 기사에서 가져온 것이므로, 원본 서류를 직접 확인한 값은 아니다.\\n\\n부채의 성격도 눈여겨볼 대목이다. 같은 요약 기사에 따르면 파산 시점 담보부 원금 7,700만 달러는 대부분 2025년 11월과 2026년 1월 사이에 future solution investments에서 새로 빌린 돈이며, 그 가운데 약 6,190만 달러는 이전 대주에게 진 빚을 갚는 데 썼다. 무담보 채무는 약 3,600만 달러로 대부분 거래처에 진 빚이다. 클리닉을 열 때 john muir health, stanford health care, prime healthcare services 같은 병원 쪽에서 빌린 돈도 남아 있다. 즉 파산 직전 몇 달 동안 빚을 빚으로 갈아 끼우다가 멈춘 모양새다.\\n\\n뉴스레터가 전한 파산 시점 최대 주주 두 곳이 dcvc 약 13.6퍼센트와 cvs 12퍼센트라는 대목은 이번 조사에서 독립적으로 확인하지 못했다. 파산 신청서의 지분 보유자 목록을 직접 열어 보지 않았으므로 뉴스레터의 서술로만 남겨 둔다.\\n\\n규제 쪽 사실은 따로 봐야 한다. 캘리포니아 법무장관은 회사가 의사 면허가 없는 회사가 진료 법인을 사실상 소유하고 통제하는 구조를 썼다고 보았고, 이를 캘리포니아가 금지하는 기업의 의료 행위 위반으로 판단했다. 법무장관 보도자료는 이 밖에도 어느 보험이 적용되는지를 잘못 알려 환자가 예상하지 못한 청구서를 받게 했고, 신용카드를 자동으로 청구하는 조항을 눈에 띄지 않게 넣었으며, 같은 진료를 두 번 청구하거나 환불을 미뤘다고 적었다. 이 내용은 법원 판결이 아니라 합의로 마무리된 것이므로 회사가 혐의를 인정했다는 뜻은 아니지만, 조사 주체가 주 정부라는 점에서 회사가 스스로 낸 수치와는 성격이 다르다.\\n\\ncarbyos 사이트가 내건 수치는 전부 회사가 스스로 낸 것이고 서로 맞지 않는 대목도 있다. 같은 첫 화면에 의료진 1,200명이 쓴다는 문구와 2,000명이 쓴다는 문구가 함께 있다.\\n\\n마지막으로 확인 환경을 밝혀 둔다. carbonhealth.com은 한국에서 접속하면 cloudflare가 막아 화면을 직접 띄울 수 없었다. 사이트 내용은 본문을 대신 읽어 주는 서비스를 거쳐 확인했고, 그래서 회사 첫 화면 갈무리는 넣지 못했다. 현재 사이트 안내 메뉴를 세면 캘리포니아 54곳을 포함해 7개 주 81곳이며, 2026년 2월 파산 신청 당시 8개 주 93곳에서 줄어든 수다.\", \"for_us\": \"첫째로 볼 것은 이 회사가 소프트웨어에서 출발해 클리닉으로 갔다가 결국 소프트웨어만 남았다는 점이다. 2015년에 진료 기록과 원격 진료, 의사와 환자 사이 메시지, 예약을 다루는 앱 회사로 시작해 2017년부터 클리닉을 직접 열었고, 파산 절차를 거친 뒤 지금 따로 사이트를 내어 파는 것은 다시 carbyos라는 소프트웨어다. 우리가 3개월 안에 소프트웨어만으로 할 수 있는 일과, 진료 자리 자체를 만드는 일 사이의 거리가 얼마나 먼지를 보여 주는 사례다. 진료 접근성 문제는 앱 화면 안에서 풀리지 않는다.\\n\\n둘째는 값에 관한 실측 자료다. 이 회사가 공개한 자가 부담 가격표는 미국 소비자가 보험 없이 진료를 받을 때 실제로 얼마를 내는지 보여 주는 몇 안 되는 공개 자료다. 어전트 케어 진료 1회 225달러, 화상 진료 99달러, 엑스레이 85달러, 독감 검사 45달러 같은 값이 지역별로 나와 있다. 우리 앱이 미국 사용자에게 건강 관련 값을 이야기하게 된다면 이 수준의 금액 감각이 기준선이 된다.\\n\\n셋째는 결제와 보험 안내에 관한 규제 위험이다. 캘리포니아 법무장관이 문제 삼은 것 가운데 두 가지는 소프트웨어 화면에서 그대로 생기는 문제다. 하나는 신용카드를 자동으로 청구하는 조항을 눈에 잘 띄지 않게 넣은 것이고, 다른 하나는 보험이 적용되는지를 실제와 다르게 안내한 것이다. 미국에서 앱이 결제 수단을 저장하거나 자동 청구를 걸 때, 그 화면 설계 자체가 주 정부의 제재 대상이 될 수 있다는 뜻이다.\\n\\n넷째는 소비자 앱 지표의 쏠림이다. 같은 회사의 같은 앱인데 애플 앱스토어는 별점 4.8에 평가 17,025건인 반면 구글 플레이는 별점 3.9에 후기 1,580건이다. 미국에서 소비자 대상 건강 앱의 평가와 사용이 아이폰 쪽에 크게 쏠린다는 신호이며, 우리가 미국에서 앱 지표를 읽을 때 안드로이드 수치를 그대로 한국 기준으로 해석하면 안 된다는 뜻이다.\\n\\n다섯째는 회원비를 받지 않는다는 문구를 첫 화면에 크게 건 점이다. one medical이 회원제를 파는 자리에서 이 회사는 회원비 없음을 차별점으로 삼았다. 미국 소비자가 건강 서비스에 매달 고정 금액을 내는 일에 얼마나 저항하는지, 그 저항을 어떤 문구로 건드리는지를 보여 주는 사례다.\", \"screenshots\": [{\"file\": \"carbon-health_ios.png\", \"caption\": \"환자용 앱 carby health의 미국 앱스토어 화면이다. 별점 4.8에 평가 17,000건이며 의료 부문 151위로, 앱 이름이 carbon health에서 carby health로 바뀐 것도 여기서 확인된다.\", \"from\": \"https://apps.apple.com/us/app/carby-health/id1152807572\"}, {\"file\": \"carbon-health_carbyos.png\", \"caption\": \"자체 진료 기록 시스템을 다른 의료기관에 파는 carbyos 사이트다. 파산 절차를 거친 뒤 회사가 앞세우는 것이 클리닉이 아니라 ai 기반 소프트웨어라는 점이 첫 화면에 드러난다.\", \"from\": \"https://www.carbyos.com/\"}, {\"file\": \"carbon-health_kroll.png\", \"caption\": \"파산 절차를 관리하는 kroll의 사건 공식 페이지다. 2026년 2월 2일 신청, 5월 29일 회생계획 인가, 6월 15일 효력 발생이라는 일정이 그대로 적혀 있다.\", \"from\": \"https://restructuring.ra.kroll.com/carbonhealth/\"}, {\"file\": \"carbon-health_ag.png\", \"caption\": \"캘리포니아 법무장관이 2026년 6월 26일 발표한 합의 보도자료다. 클리닉 소유 구조와 보험 안내, 청구 방식을 모두 문제 삼았다.\", \"from\": \"https://www.oag.ca.gov/news/press-releases/attorney-general-bonta-announces-first-its-kind-settlement-carbon-health-and-its\"}], \"sources\": [{\"title\": \"carbon health 공식 사이트 첫 화면\", \"url\": \"https://carbonhealth.com/\", \"note\": \"무엇을 파는지, 회원비를 받지 않는다는 문구, 클리닉이 있는 주와 곳 수를 확인했다.\"}, {\"title\": \"carbon health 보험과 값 안내\", \"url\": \"https://carbonhealth.com/insurance-pricing\", \"note\": \"보험 없이 낼 때의 자가 부담 가격표를 항목별로 확인했다.\"}, {\"title\": \"carbon health 회사 소개\", \"url\": \"https://carbonhealth.com/about-us\", \"note\": \"2015년 설립 사실과 경영진 네 사람의 이름과 직함을 확인했다.\"}, {\"title\": \"carbon health implements financial restructuring\", \"url\": \"https://www.prnewswire.com/news-releases/carbon-health-implements-financial-restructuring-302676586.html\", \"note\": \"회사가 직접 낸 파산 신청 보도자료다. 사전 합의형 chapter 11, 두 갈래 진행 방식, 1,950만 달러 dip 금융, 자문사 이름을 확인했다.\"}, {\"title\": \"carbon health successfully completes financial restructuring\", \"url\": \"https://seo-blog.carbonhealth.com/blog-post/emergencestatement\", \"note\": \"2026년 6월 29일 회사가 절차를 마쳤다고 알린 글이다.\"}, {\"title\": \"kroll 구조조정 관리 사건 페이지\", \"url\": \"https://restructuring.ra.kroll.com/carbonhealth/\", \"note\": \"사건 번호 26-90306, 담당 판사, 신청일과 회생계획 인가일, 효력 발생일을 확인했다.\"}, {\"title\": \"primary care provider carbon health files for chapter 11 (fierce healthcare)\", \"url\": \"https://www.fiercehealthcare.com/health-tech/carbon-health-files-chapter-11-bankruptcy-relief-more-100m-debt\", \"note\": \"조달 이력과 33억 달러 기업 가치, 클리닉 1,500곳 목표, 2022년과 2023년 인력 감축, 신청서에 적힌 자산과 부채 범위를 확인했다.\"}, {\"title\": \"carbon health files for bankruptcy: 7 things to know (becker's hospital review)\", \"url\": \"https://www.beckershospitalreview.com/finance/carbon-health-files-for-bankruptcy-7-things-to-know/\", \"note\": \"보도자료 내용을 제삼자가 정리한 기사로, 두 갈래 진행 방식과 dip 금융을 교차 확인했다.\"}, {\"title\": \"carbon health technologies files chapter 11 with dual-track restructuring plan\", \"url\": \"https://chapter11cases.com/blogs/news/carbon-health-technologies-files-chapter-11-with-dual-track-restructuring-plan-for-nationwide-healthcare-network\", \"note\": \"법원 제출 서류를 ai 도구로 요약한 기사다. 매출, 클리닉 수, 환자 수, 담보부와 무담보 채무 구성, 병원 쪽 차입을 확인했으나 원본 서류는 직접 열지 않았다.\"}, {\"title\": \"carbon health wins court approval for chapter 11 plan handing ownership to lenders\", \"url\": \"https://completeaitraining.com/news/carbon-health-wins-court-approval-for-chapter-11-plan/\", \"note\": \"bloomberg law 보도를 옮긴 기사로, 신규 자금 3,300만 달러와 1억 달러 출자 전환, 대주단이 최대 주주가 된 사실을 확인했다.\"}, {\"title\": \"캘리포니아 법무장관 합의 발표 보도자료\", \"url\": \"https://www.oag.ca.gov/news/press-releases/attorney-general-bonta-announces-first-its-kind-settlement-carbon-health-and-its\", \"note\": \"제재금 440만 달러와 10만 달러, 클리닉 80곳과 캘리포니아 54곳, 보험 안내와 청구 방식에 관한 조사 결과를 확인했다.\"}, {\"title\": \"california ag settlement again targets friendly pc model (holland & knight)\", \"url\": \"https://www.hklaw.com/en/insights/publications/2026/06/california-ag-settlement-again-targets-friendly-pc-model\", \"note\": \"법무장관이 문제 삼은 계약 구조를 항목별로 분석한 법률사무소 글이며, 누적 벤처 자금 6억 달러 가까이라는 서술도 여기서 확인했다.\"}, {\"title\": \"carbyos 소개 사이트\", \"url\": \"https://www.carbyos.com/\", \"note\": \"파산 이후 회사가 앞세우는 소프트웨어 상품의 구성과 회사가 스스로 낸 사용 규모 수치를 확인했다.\"}, {\"title\": \"carby health 앱스토어와 구글 플레이 페이지\", \"url\": \"https://apps.apple.com/us/app/carby-health/id1152807572\", \"note\": \"환자용 앱의 별점과 평가 수를 확인했다. 안드로이드 쪽은 play.google.com/store/apps/details?id=com.carbonhealth.patient.prod 에서 확인했다.\"}, {\"title\": \"eren bali (wikipedia)\", \"url\": \"https://en.wikipedia.org/wiki/eren_bali\", \"note\": \"공동창업자가 udemy를 세우고 초대 최고경영자를 지낸 사실을 확인했다.\"}, {\"title\": \"one medical 공식 사이트\", \"url\": \"https://www.onemedical.com/\", \"note\": \"비교 대상으로 삼은 회사의 회원제와 아마존 프라임 회원 연 99달러 값을 확인했다.\"}]}"},{"slug":"chapter-medicare","name":"Chapter","one_liner":"미국에서 65세가 되어 메디케어에 들어가야 하는 사람에게, 전국에 나와 있는 모든 플랜을 견주어 맞는 것을 골라 주고 가입까지 대신 처리해 주는 보험 중개 회사다. 이용자는 돈을 내지 않고 보험사가 내는 중개 수수료로 돌아간다.","sells_to":"mixed","seen_in":[{"issue":"30","section":10,"headline":"Generation Investment Management가 이끈 라운드에서 1억 달러를 모아 기업 가치 30억 달러를 인정받았고, 인원을 늘리지 않은 채 2025년 매출을 세 배로 키워 1억 달러 ARR에 이르렀다는 소식으로 실렸다. 필자는 메디케어 지형의 변화와 AI가 겹치면서 플랜 중개 시장에 기회가 열렸다고 봤다."}],"card":{"problem":"미국인은 65세가 되면 정부가 정해 주는 하나의 보험에 자동으로 들어가는 것이 아니라, 민간 보험사가 내놓은 수십 개 상품 가운데 하나를 직접 골라야 하고 해마다 다시 고를 수 있다. 회사 설명으로는 대부분의 카운티에 50개가 넘는 선택지가 있어서, 잘못 고르면 같은 보장을 받으면서 해마다 수천 달러를 더 내거나 다니던 병원이 보장 밖으로 빠진다.","solution":"전국 메디케어 상품을 모두 담은 자체 데이터베이스에 본인이 먹는 약과 다니는 병원, 예산을 넣으면 맞는 플랜을 추려 주고, 면허를 가진 상담원이 전화로 설명한 뒤 가입까지 처리해 준다. 가입한 뒤에도 1년 내내 병원 찾기와 약값 비교를 이어서 돕는다.","price":"소비자 부담 없음. 보험사가 가입 한 건마다 지급하는 중개 수수료로 운영한다.","tags":["메디케어","플랜 비교","보험 중개","전화 상담","소비자 무료"],"headline_traction":"2026년 4월 Generation Investment Management가 이끈 시리즈 E에서 1억 달러를 모아 기업 가치 30억 달러를 인정받았다. 누적 조달액은 2억 8,500만 달러이고, 1년이 채 지나지 않아 기업 가치가 두 배를 넘겼다.","watch":"매출 3배 성장과 1억 달러 ARR, 인원 동결은 모두 회사가 스스로 밝힌 수치이고 제삼자가 확인한 자료는 찾지 못했다. 모든 플랜을 편향 없이 추천한다고 내세우지만, 회사가 사이트 맨 아래에 스스로 붙인 법적 고지에는 50개 보험 조직과만 계약돼 있어 지역에 나온 모든 플랜을 다 팔지는 못한다고 적혀 있다."},"screenshots":[{"file":"chapter-medicare_home.png","caption":"첫 화면이다. '당신에게 맞는 메디케어를 찾으세요'라는 문구 아래 상담원과 통화하기와 직접 둘러보기 두 갈래를 나란히 놓았고, 모든 보험사 상품을 비교한다고 바로 아래에서 밝힌다.","from":"https://www.askchapter.org/"},{"file":"chapter-medicare_flow.png","caption":"우편번호를 넣고 시작하는 진입 화면이다. '면허를 가진 상담원의 무료이고 편향 없는 안내'라고 값을 명시하고, UnitedHealthcare, Humana, Aetna 같은 주요 보험사 로고를 늘어놓아 어디까지 비교하는지 보여 준다.","from":"https://askchapter.org/flow/default?cpc=chapterhomepage"},{"file":"chapter-medicare_otc.png","caption":"별도로 운영하는 OTC 크레딧 쇼핑 화면이다. 메디케어 어드밴티지 가입자 평균이 한 해 400달러의 크레딧을 갖고 있는데 쓰지 않으면 사라진다고 알리고, 타이레놀과 시리얼 같은 물건이 0달러로 표시된다.","from":"https://myotc.com/"}],"q":"{\"slug\": \"chapter-medicare\", \"name\": \"chapter\", \"one_liner\": \"미국에서 65세가 되어 메디케어에 들어가야 하는 사람에게, 전국에 나와 있는 모든 플랜을 견주어 맞는 것을 골라 주고 가입까지 대신 처리해 주는 보험 중개 회사다. 이용자는 돈을 내지 않고 보험사가 내는 중개 수수료로 돌아간다.\", \"site\": \"https://www.askchapter.org\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"30\", \"section\": 10, \"headline\": \"generation investment management가 이끈 라운드에서 1억 달러를 모아 기업 가치 30억 달러를 인정받았고, 인원을 늘리지 않은 채 2025년 매출을 세 배로 키워 1억 달러 arr에 이르렀다는 소식으로 실렸다. 필자는 메디케어 지형의 변화와 ai가 겹치면서 플랜 중개 시장에 기회가 열렸다고 봤다.\"}], \"card\": {\"problem\": \"미국인은 65세가 되면 정부가 정해 주는 하나의 보험에 자동으로 들어가는 것이 아니라, 민간 보험사가 내놓은 수십 개 상품 가운데 하나를 직접 골라야 하고 해마다 다시 고를 수 있다. 회사 설명으로는 대부분의 카운티에 50개가 넘는 선택지가 있어서, 잘못 고르면 같은 보장을 받으면서 해마다 수천 달러를 더 내거나 다니던 병원이 보장 밖으로 빠진다.\", \"solution\": \"전국 메디케어 상품을 모두 담은 자체 데이터베이스에 본인이 먹는 약과 다니는 병원, 예산을 넣으면 맞는 플랜을 추려 주고, 면허를 가진 상담원이 전화로 설명한 뒤 가입까지 처리해 준다. 가입한 뒤에도 1년 내내 병원 찾기와 약값 비교를 이어서 돕는다.\", \"price\": \"소비자 부담 없음. 보험사가 가입 한 건마다 지급하는 중개 수수료로 운영한다.\", \"tags\": [\"메디케어\", \"플랜 비교\", \"보험 중개\", \"전화 상담\", \"소비자 무료\"], \"headline_traction\": \"2026년 4월 generation investment management가 이끈 시리즈 e에서 1억 달러를 모아 기업 가치 30억 달러를 인정받았다. 누적 조달액은 2억 8,500만 달러이고, 1년이 채 지나지 않아 기업 가치가 두 배를 넘겼다.\", \"watch\": \"매출 3배 성장과 1억 달러 arr, 인원 동결은 모두 회사가 스스로 밝힌 수치이고 제삼자가 확인한 자료는 찾지 못했다. 모든 플랜을 편향 없이 추천한다고 내세우지만, 회사가 사이트 맨 아래에 스스로 붙인 법적 고지에는 50개 보험 조직과만 계약돼 있어 지역에 나온 모든 플랜을 다 팔지는 못한다고 적혀 있다.\"}, \"problem\": \"한국은 전국민 건강보험 하나가 모두를 덮기 때문에 어떤 보험에 들지 고민할 일이 없지만, 미국의 65세 이상 공적 보험인 메디케어는 구조가 다르다. 정부가 직접 운영하는 오리지널 메디케어로 갈지, 민간 보험사가 정부 돈을 받아 운영하는 메디케어 어드밴티지로 갈지 본인이 정해야 하고, 오리지널을 고르면 본인부담을 메우는 별도 보충 보험과 약값 보장까지 따로 붙여야 한다. 회사가 쓴 안내글에 따르면 2025년 기준으로 한 사람 앞에 메디케어 어드밴티지가 평균 42개, 보충 보험이 10개, 약값 보장 플랜이 12개에서 16개가 놓인다. 게다가 이 결정은 한 번으로 끝나지 않는다. 해마다 정해진 기간에 다시 고를 수 있고, 보험사가 그 사이 보장 범위와 병원 명단을 바꾸기 때문에 가만히 있어도 조건이 달라진다. 창업자는 자기 부모가 이 과정을 거친 뒤 같은 보장을 받으면서 더 비싼 플랜에 들어가 있었다고 적었고, 회사 ceo는 이렇게 잘못 짝지어진 보장 때문에 해마다 1,000억 달러가 낭비된다고 주장한다. 이 숫자는 회사 쪽 주장이며 검증된 값이 아니다.\", \"solution\": \"이용자는 두 갈래로 들어간다. 하나는 우편번호를 넣고 직접 플랜을 훑어보는 길이고, 다른 하나는 시간을 잡아 면허를 가진 상담원과 전화로 이야기하는 길이다. 상담원은 지금 먹는 약, 다니는 병원, 예산 같은 조건을 묻고, 회사가 만들어 둔 전국 메디케어 상품 데이터베이스에 대조해 후보를 추린다. 그 약이 보장되는지, 그 의사가 명단 안에 있는지까지 확인한 다음 가입 절차를 대신 밟아 준다. 가입으로 끝나지 않고, 그 뒤에도 전문의를 찾거나 약을 더 싸게 사는 방법을 1년 내내 상담해 준다고 회사는 밝힌다. 2026년 시리즈 e 발표와 함께 병원 명단 검색 도구와 처방약 비용 계산기를 새로 내놨다. 이용자가 내는 돈은 없다. 회사는 자사 안내글에서 메디케어 중개인은 보통 이용자에게 수수료를 받지 않고 보험사가 가입 한 건마다 주는 수수료로 돈을 번다고 직접 설명하며, chapter 역시 같은 방식으로 돈을 번다고 밝힌다.\", \"features\": [{\"name\": \"전국 플랜 데이터베이스\", \"detail\": \"미국 안의 모든 메디케어 보장 선택지를 담은 자체 데이터베이스를 두고, 어떤 의사와 어떤 약이 보장되는지까지 함께 갖춰 두었다고 회사는 밝힌다. 사이트 고지에는 현재 50개 보험 조직이 내놓은 15,778개 상품을 대리한다고 적혀 있다.\"}, {\"name\": \"성과급 없는 정규직 상담원\", \"detail\": \"상담원은 모두 정규직이며 어떤 플랜을 권하든 받는 돈이 같다고 회사는 말한다. 보험사별 수수료 차이 때문에 특정 플랜으로 몰아가는 일을 막으려는 구조다.\"}, {\"name\": \"병원 명단 검색과 약값 계산기\", \"detail\": \"2026년 4월에 내놓은 도구다. 내가 다니는 병원이 그 플랜 안에 있는지 확인하고, 처방약을 그 플랜으로 샀을 때 얼마가 드는지 계산해 준다.\"}, {\"name\": \"가입 후 연중 상담\", \"detail\": \"가입시키고 끝내지 않고, 전문의 찾기, 약을 가장 싸게 사는 방법, 보장 조건이 바뀌었을 때의 대응을 1년 내내 무료로 상담한다고 회사는 밝힌다.\"}, {\"name\": \"otc 크레딧 쇼핑 앱\", \"detail\": \"메디케어 어드밴티지 플랜 상당수는 비타민, 치약, 진통제, 식료품 같은 일반 의약품과 생활용품을 살 수 있는 월별 크레딧을 준다. chapter는 그 크레딧을 본인 돈 없이 쓰고 집으로 배송받게 하는 별도 앱과 사이트를 무료로 운영한다. 회사는 메디케어 어드밴티지 플랜의 87%가 이 크레딧을 주고 평균 금액이 한 해 400달러인데 상당수가 쓰이지 않고 사라진다고 말한다.\"}, {\"name\": \"제휴를 통한 유통\", \"detail\": \"직접 광고만으로 사람을 모으지 않고, 병원과 의료 시스템, 재무설계사, 시니어 대상 콘텐츠 제작자를 통해 이용자를 받는다. 회사가 올린 사례로는 보험사가 시장에서 빠져나가 환자들이 보장을 잃게 된 병원과 손잡은 건, 재무설계 회사 고객을 넘겨받은 건, 구독자 60만 명 규모의 은퇴 정보 유튜브 채널과 손잡은 건이 있다.\"}], \"differentiator\": \"chapter가 스스로 견주는 대상은 특정 회사가 아니라 보통의 메디케어 중개인이다. 회사 설명에 따르면 대부분의 중개인은 수수료를 주는 몇몇 보험사 상품만 권하고, 몇 개를 살펴봤는지 밝힐 의무도 없다. chapter는 전국 모든 상품을 데이터베이스에 넣어 두고 상담원 보수를 플랜과 무관하게 고정해 이 문제를 없앴다고 말한다. 다만 이 차별점은 회사의 설명이며, 밖에서 확인할 방법은 마땅치 않다. 오히려 같은 사이트의 법적 고지는 계약을 맺은 곳이 50개 조직뿐이어서 지역에 나온 모든 플랜을 다 팔 수는 없다고 적어 두었다. 즉 추천은 전체를 보고 하더라도 실제 가입시킬 수 있는 범위는 계약된 상품에 한정된다. 이번 조사에서는 상장된 대형 메디케어 중개 회사들과 성과를 나란히 견준 제삼자 자료를 찾지 못했다.\", \"team\": [{\"name\": \"cobi blumenfeld-gantz\", \"role\": \"공동창업자 겸 ceo\", \"background\": \"할아버지와 부모가 메디케어 가입 과정에서 겪은 어려움을 계기로 회사를 세웠다고 본인이 회사 블로그에 적었다. 어머니가 외할아버지의 메디케어 선택지를 알아보느라 꼬박 3주를 전화에 매달렸고, 부모 본인들도 결국 같은 보장을 훨씬 비싸게 사는 플랜에 들어갔다는 내용이다. 창업 이전의 경력은 이번 조사에서 확인하지 못했다.\"}, {\"name\": \"vivek ramaswamy\", \"role\": \"공동창업자\", \"background\": \"2020년에 chapter medicare를 공동창업했다고 위키백과가 적는다. 제약 회사 roivant sciences를 세운 사람이며, 2024년 미국 대통령 선거 공화당 경선에 출마했다. 현재 회사 사이트에는 이름이 나오지 않는다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"시리즈 e로 1억 달러를 조달해 기업 가치 30억 달러를 인정받았다. generation investment management가 이끌었고 fifth down capital, 8vc, stripes, xyz venture capital, addition, narya capital, susa ventures, maverick ventures가 참여했다. 누적 조달액은 2억 8,500만 달러다.\", \"when\": \"2026-04\", \"source\": \"medcity news 기사와 pulse 2.0 기사\"}, {\"type\": \"revenue\", \"detail\": \"2025년 한 해에 매출을 세 배로 늘려 연간 반복 매출 1억 달러를 넘겼고, 그 사이 인원은 전년과 같은 수준으로 유지했다고 회사가 밝혔다.\", \"when\": \"2026-04\", \"source\": \"회사 발표를 인용한 medcity news와, 회사 chief evangelist paul davis의 말을 인용한 pulse 2.0. 제삼자가 확인한 수치는 아니다.\"}, {\"type\": \"funding\", \"detail\": \"그 이전 라운드인 시리즈 d에서 7,500만 달러를 조달했고 기업 가치를 15억 달러로 인정받았다.\", \"when\": \"2025-04\", \"source\": \"fierce healthcare와 fast company의 당시 기사 제목. 본문은 확인하지 못했고, 시리즈 e 발표에 적힌 '1년이 채 지나지 않아 기업 가치가 두 배를 넘겼다'는 설명과 맞아떨어진다.\"}, {\"type\": \"funding\", \"detail\": \"시리즈 c로 5,000만 달러를 조달했다. xyz venture capital이 이끌었고 narya capital, addition, susa ventures, maverick ventures, health 2047, sv angel이 참여했다. 이 시점의 누적 조달액은 1억 900만 달러였다.\", \"when\": \"2024-05\", \"source\": \"alleywatch의 ceo 인터뷰\"}, {\"type\": \"customers\", \"detail\": \"지금까지 50만 명이 넘는 메디케어 가입자를 도왔다고 회사가 첫 화면에 적는다. 후기 사이트 reviews.io에서 7,565건 기준 4.9점, better business bureau a+ 등급을 함께 내건다.\", \"when\": \"2026-09\", \"source\": \"회사 홈페이지와 소개 페이지. 도운 인원은 회사가 스스로 밝힌 수치다.\"}, {\"type\": \"traffic\", \"detail\": \"무료 otc 크레딧 쇼핑 앱은 미국 앱스토어에서 2,099건 평가에 4.7점이고, 구글 플레이 내려받기는 1만 건 이상이다. 사이트에는 5만 명 넘는 시니어를 도왔고 200만 달러가 넘는 otc 크레딧이 쓰였다고 적혀 있다.\", \"when\": \"2026-09\", \"source\": \"애플 앱스토어 조회 api, 구글 플레이 페이지, myotc.com. 5만 명과 200만 달러는 회사가 밝힌 수치다.\"}, {\"type\": \"partnership\", \"detail\": \"보험사가 시장에서 철수해 환자들이 보장을 잃게 된 한 의료 시스템과 손잡아, 그 병원 환자 가운데 가입을 마친 사람의 99%가 기존 병원을 계속 다닐 수 있는 플랜에 들어갔다고 회사가 사례로 올렸다. 재무설계 회사 한 곳은 고객의 절반 이상을 chapter로 넘겼다고 적었다.\", \"when\": \"2026-09\", \"source\": \"회사 제휴 페이지에 실린 사례. 회사가 스스로 작성한 자료다.\"}, {\"type\": \"regulatory\", \"detail\": \"보험업 면허를 가진 중개 법인 chapter advisory, llc를 통해 영업한다. 모회사는 memoir, inc.이고, 캘리포니아에서는 chapter insurance services라는 이름으로 면허 번호 6003691을 받았다.\", \"when\": \"2026-09\", \"source\": \"회사 사이트 법적 고지\"}], \"caveats\": \"숫자의 출처를 나누어 볼 필요가 있다. 조달 금액 1억 달러, 기업 가치 30억 달러, 투자자 명단은 여러 매체가 함께 보도했으므로 확인된 사실로 볼 수 있다. 반면 매출 3배 성장, 1억 달러 arr, 인원 동결, 50만 명 지원, 잘못된 플랜 때문에 해마다 1,000억 달러가 낭비된다는 주장은 모두 회사가 스스로 낸 수치이고 제삼자가 검증한 자료를 찾지 못했다. 사이트에 걸린 절감액 안내에는 '가입자가 스스로 신고한 값의 평균'이라는 단서가 회사 고지에 직접 붙어 있다. 사업 구조에서 가장 눈여겨볼 대목은 돈을 내는 쪽이 이용자가 아니라 보험사라는 점이다. 회사는 상담원 보수를 플랜과 무관하게 고정해 이 문제를 없앴다고 말하지만, 회사 차원의 수입은 여전히 어느 보험사 상품을 몇 건 팔았는지에 달려 있다. 게다가 같은 사이트의 법적 고지는 계약을 맺은 곳이 50개 조직뿐이어서 지역에 나온 모든 플랜을 다 제공하지는 못한다고 적는다. '모든 플랜을 본다'는 문구와 '모든 플랜을 팔지는 못한다'는 문구가 한 화면에 같이 있는 셈이다. 투자자 구성도 특이하다. 위키백과는 2020년에 vivek ramaswamy가 이 회사를 공동창업했다고 적고, 초기 투자자에는 jd vance가 세운 narya capital과 peter thiel이 들어 있으며, 이번 라운드는 al gore가 이끄는 generation investment management가 주도했다. 미국 정치에서 대립하는 진영의 인물들이 한 회사의 주주 명부에 함께 있는 구성이며, bloomberg가 2025년에 이 대목을 다룬 기사를 냈다. 다만 그 기사 본문은 유료라 확인하지 못했다.\", \"for_us\": \"메디케어 중개 자체는 미국 보험 면허가 필요한 일이라 3개월 안에 소프트웨어 인력만으로 따라 할 수 없다. 대신 이 회사가 따로 떼어 무료로 운영하는 otc 크레딧 쪽이 우리 목적에 훨씬 가깝다. 메디케어 어드밴티지 플랜 상당수는 비타민, 치약, 진통제, 식료품을 살 수 있는 월별 크레딧을 주는데, 쓰지 않으면 그대로 사라진다. chapter는 이 하나만으로 별도 앱과 사이트를 만들어 앱스토어 평가 2,000건을 넘겼다. 이용자가 하는 일은 자기 플랜을 고르고 물건을 담는 것뿐이고, 화면 안에서 끝나며 규제를 뚫을 일도 없다. 우리 앱으로 옮겨 보면, 미국 이용자에게 '당신 보험에 이만큼 크레딧이 남아 있고 며칠 뒤에 사라진다'고 알려 주는 정도만으로도 앱을 열 이유가 생긴다. 실제로 돈이 되는 정보를 무료로 주는 자리이기 때문에, 현금 리워드와 겹치지 않으면서 같은 동기를 건드린다. 한 가지 더 볼 것은 이 회사가 사람을 모으는 방식이다. 광고보다 제휴에 기대는데, 병원, 재무설계사, 시니어 대상 유튜브 채널처럼 이미 신뢰를 쌓은 곳을 통해 들어온다. 미국에서 처음부터 신뢰를 쌓아야 하는 처지라면 참고할 만한 경로다.\", \"screenshots\": [{\"file\": \"chapter-medicare_home.png\", \"caption\": \"첫 화면이다. '당신에게 맞는 메디케어를 찾으세요'라는 문구 아래 상담원과 통화하기와 직접 둘러보기 두 갈래를 나란히 놓았고, 모든 보험사 상품을 비교한다고 바로 아래에서 밝힌다.\", \"from\": \"https://www.askchapter.org/\"}, {\"file\": \"chapter-medicare_flow.png\", \"caption\": \"우편번호를 넣고 시작하는 진입 화면이다. '면허를 가진 상담원의 무료이고 편향 없는 안내'라고 값을 명시하고, unitedhealthcare, humana, aetna 같은 주요 보험사 로고를 늘어놓아 어디까지 비교하는지 보여 준다.\", \"from\": \"https://askchapter.org/flow/default?cpc=chapterhomepage\"}, {\"file\": \"chapter-medicare_otc.png\", \"caption\": \"별도로 운영하는 otc 크레딧 쇼핑 화면이다. 메디케어 어드밴티지 가입자 평균이 한 해 400달러의 크레딧을 갖고 있는데 쓰지 않으면 사라진다고 알리고, 타이레놀과 시리얼 같은 물건이 0달러로 표시된다.\", \"from\": \"https://myotc.com/\"}, {\"file\": \"chapter-medicare_ios.png\", \"caption\": \"미국 앱스토어에 올라와 있는 otc 쇼핑 앱이다. 평가 2,099건에 4.7점이고, 메디케어 플랜 상담이 아니라 크레딧으로 물건을 주문하는 기능만 담겨 있다.\", \"from\": \"https://apps.apple.com/us/app/chapter-medicare-otc-store/id6447076886\"}], \"sources\": [{\"title\": \"chapter 공식 홈페이지\", \"url\": \"https://www.askchapter.org/\", \"note\": \"무엇을 파는지, 두 갈래 진입 흐름, 50만 명을 도왔다는 수치, 50개 보험 조직과 15,778개 상품을 대리한다는 법적 고지, 절감액이 가입자 자진 신고 평균이라는 단서를 확인했다.\"}, {\"title\": \"chapter 회사 소개 페이지\", \"url\": \"https://www.askchapter.org/about\", \"note\": \"회사가 내세우는 목적, 보험사와의 관계와 무관하게 추천한다는 주장, 모회사 memoir, inc.와 면허 법인 chapter advisory, llc의 구조를 확인했다.\"}, {\"title\": \"내가 chapter를 시작한 이유 (cobi blumenfeld-gantz)\", \"url\": \"https://askchapter.org/magazine/chapter-and-you/team/why-i-started-chapter-medicare\", \"note\": \"창업자 본인이 쓴 글이다. 창업 동기, 대부분의 카운티에 50개가 넘는 선택지가 있다는 설명, 전국 데이터베이스와 보수 구조에 관한 회사의 주장을 확인했다.\"}, {\"title\": \"메디케어 중개인은 어떻게 돈을 버는가 (회사 안내글)\", \"url\": \"https://askchapter.org/magazine/senior-health-wellness/medicare-resources/medicare-insurance-agent-do-you-need-one\", \"note\": \"이용자에게 수수료를 받지 않고 보험사가 가입 건마다 수수료를 준다는 수익 구조, 2025년 기준 평균 선택지 개수(어드밴티지 42개, 보충 보험 10개, 약값 플랜 12~16개), 상담원 보수를 플랜과 무관하게 고정했다는 주장을 확인했다.\"}, {\"title\": \"chapter 제휴 페이지\", \"url\": \"https://www.askchapter.org/partnerships\", \"note\": \"병원과 의료 시스템, 재무설계사, 콘텐츠 제작자를 통한 유통 구조와 세 건의 제휴 사례를 확인했다.\"}, {\"title\": \"my otc by chapter\", \"url\": \"https://myotc.com/\", \"note\": \"otc 크레딧 쇼핑 서비스의 이용 흐름, 평균 400달러라는 크레딧 규모, 5만 명 지원과 200만 달러 사용이라는 회사 수치, 운영 법인 chapter technologies, llc를 확인했다.\"}, {\"title\": \"with $100m raise, chapter targets medicare mismatches for seniors (medcity news)\", \"url\": \"https://medcitynews.com/2026/04/with-100m-raise-chapter-targets-medicare-mismatches-for-seniors/\", \"note\": \"시리즈 e 1억 달러, 기업 가치 30억 달러, 누적 2억 8,500만 달러, 투자자 명단, ceo 이름과 발언, 매출 3배와 1억 달러 arr이 회사 발표에 근거한다는 사실을 확인했다.\"}, {\"title\": \"chapter: $100 million at $3 billion valuation raised by medicare navigation platform (pulse 2.0)\", \"url\": \"https://pulse2.com/chapter-100-million-raised-by-medicare-navigation-platform-to-expand-ai-driven-retirement-solutions/\", \"note\": \"인원을 늘리지 않았다는 회사 측 설명, 병원 명단 검색과 약값 계산기 출시, 은퇴자용 금융 상품으로 넓히겠다는 계획, al gore와 jd vance가 각각 이 회사에 투자한 관계를 확인했다.\"}, {\"title\": \"chapter ceo 인터뷰 (alleywatch, 시리즈 c 당시)\", \"url\": \"https://www.alleywatch.com/2024/05/chapter-medicare-navigation-platform-broker-cobi-blumenfeld-gantz/\", \"note\": \"'chapter는 메디케어 중개로 돈을 벌고 이용자에게는 무료'라는 ceo의 직접 설명, 상담원이 성과급 없는 정규직이라는 구조, 시리즈 c 5,000만 달러와 당시 누적 1억 900만 달러를 확인했다.\"}, {\"title\": \"vivek ramaswamy (위키백과)\", \"url\": \"https://en.wikipedia.org/wiki/vivek_ramaswamy\", \"note\": \"2020년에 chapter medicare를 공동창업했다는 서술을 확인했다.\"}, {\"title\": \"chapter: medicare otc store (미국 앱스토어)\", \"url\": \"https://apps.apple.com/us/app/chapter-medicare-otc-store/id6447076886\", \"note\": \"무료 앱이고, 2,099건 평가에 4.7점이며, 2023년 5월 출시 후 2026년 7월에도 갱신되고 있음을 확인했다. 메디케어 상담용 앱은 따로 없다.\"}, {\"title\": \"chapter otc 앱 (구글 플레이)\", \"url\": \"https://play.google.com/store/apps/details?id=com.chapter.nightingale\", \"note\": \"내려받기 1만 건 이상, 광고 없음, 인앱 결제 없음을 확인했다.\"}]}"},{"slug":"chatgpt-health","name":"ChatGPT Health","one_liner":"OpenAI가 ChatGPT 안에 넣은 소비자용 건강 기능이다. 미국 병원의 진료 기록과 아이폰 건강 앱 자료를 본인 동의로 끌어와, 검사 수치와 복용 약, 수면과 활동 기록을 근거로 대화하게 한다. 별도 앱이 아니라 기존 ChatGPT의 한 메뉴이며 값을 따로 받지 않는다.","sells_to":"consumer","seen_in":[{"issue":"04","section":2,"headline":"OpenAI가 한 주 동안 쏟아 낸 세 가지 헬스케어 소식 가운데 수요일에 나온 소비자용 개인건강기록 도구로 짧게 소개됐다. 필자는 개인건강기록 발표를 그동안 너무 많이 겪어 들뜨지 않는다면서도, OpenAI가 함께 공개한 이용량 수치를 보면 이번은 다를지도 모른다고 적었다."}],"card":{"problem":"미국에서는 진료 기록이 병원마다 따로 보관되고 검사 결과지는 수치와 전문 용어로만 적혀 있어서, 환자가 자기 상태를 한눈에 보거나 무슨 뜻인지 알기 어렵다. 이미 수억 명이 챗봇에 건강 질문을 하고 있으나 그 대화에는 정작 본인의 검사 수치와 복용 약이 빠져 있었다.","solution":"흩어진 기록을 ChatGPT 안으로 끌어온다. 미국 병원의 환자 포털과 One Medical, Function Health 계정을 연결하고 아이폰 건강 앱을 붙이면, 검사 수치가 어떻게 변했는지와 진료 뒤 무엇이 달라졌는지를 본인 기록에 근거해 설명한다.","price":"추가 요금이 없다. 무료 요금제에서도 쓸 수 있다.","tags":["건강 기록","챗봇","검사 결과 해석","애플 건강","무료"],"headline_traction":"2026년 1월 7일 대기자 명단으로 시작해 7월 23일 미국 이용자 전체에게 열었고, OpenAI는 주당 3억 명이 넘는 사람이 ChatGPT에 건강 질문을 한다고 밝혔다.","watch":"이용량 수치는 전부 OpenAI가 자체 집계해 발표한 값이며 제삼자 검증이 없다. 또 OpenAI 스스로 이 기능에는 미국 의료정보 보호법인 HIPAA가 적용되지 않는다고 문서에 밝혀 두었다."},"screenshots":[{"file":"chatgpt-health_web.png","caption":"제품 안내 페이지 첫 화면이다. 애플 건강 앱과 미국 병원 기록을 연결하라고 권하면서, 걸음과 수면 같은 생활 기록과 백혈구, 혈당, 콜레스테롤 같은 검사 수치를 한 화면에 나란히 올려 보여 준다. 그 아래에 무료와 Go, Plus, Pro 이용자 가운데 미국에 있는 18세 이상만 쓸 수 있다고 적어 두었다.","from":"https://chatgpt.com/health"},{"file":"chatgpt-health_hipaa.png","caption":"공식 도움말 문서의 문답 부분이다. 애플 건강 앱이나 병원 기록에 무언가를 써넣을 수 없고 읽기만 한다는 답과, 이 기능은 임상용이나 의료기관용이 아니어서 HIPAA 수탁 계약을 제공하지 않는다는 답이 나란히 붙어 있다. 의료 규제를 어떻게 비켜 가는지가 이 두 문답에 드러난다.","from":"https://help.openai.com/en/articles/20001036-health-in-chatgpt"},{"file":"chatgpt-health_ios.png","caption":"미국 애플 앱스토어의 ChatGPT 앱 페이지다. 건강 전용 앱이 따로 없고 이 앱 안에 기능이 들어가 있다. 분류는 생산성이고 평가 1천만 건에 평점 4.8이며, 아래쪽 개인정보 표시에는 건강과 피트니스 자료가 신원과 연결돼 수집될 수 있다고 적혀 있다.","from":"https://apps.apple.com/us/app/chatgpt/id6448311069"}],"q":"{\"slug\": \"chatgpt-health\", \"name\": \"chatgpt health\", \"one_liner\": \"openai가 chatgpt 안에 넣은 소비자용 건강 기능이다. 미국 병원의 진료 기록과 아이폰 건강 앱 자료를 본인 동의로 끌어와, 검사 수치와 복용 약, 수면과 활동 기록을 근거로 대화하게 한다. 별도 앱이 아니라 기존 chatgpt의 한 메뉴이며 값을 따로 받지 않는다.\", \"site\": \"https://chatgpt.com/health\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"04\", \"section\": 2, \"headline\": \"openai가 한 주 동안 쏟아 낸 세 가지 헬스케어 소식 가운데 수요일에 나온 소비자용 개인건강기록 도구로 짧게 소개됐다. 필자는 개인건강기록 발표를 그동안 너무 많이 겪어 들뜨지 않는다면서도, openai가 함께 공개한 이용량 수치를 보면 이번은 다를지도 모른다고 적었다.\"}], \"card\": {\"problem\": \"미국에서는 진료 기록이 병원마다 따로 보관되고 검사 결과지는 수치와 전문 용어로만 적혀 있어서, 환자가 자기 상태를 한눈에 보거나 무슨 뜻인지 알기 어렵다. 이미 수억 명이 챗봇에 건강 질문을 하고 있으나 그 대화에는 정작 본인의 검사 수치와 복용 약이 빠져 있었다.\", \"solution\": \"흩어진 기록을 chatgpt 안으로 끌어온다. 미국 병원의 환자 포털과 one medical, function health 계정을 연결하고 아이폰 건강 앱을 붙이면, 검사 수치가 어떻게 변했는지와 진료 뒤 무엇이 달라졌는지를 본인 기록에 근거해 설명한다.\", \"price\": \"추가 요금이 없다. 무료 요금제에서도 쓸 수 있다.\", \"tags\": [\"건강 기록\", \"챗봇\", \"검사 결과 해석\", \"애플 건강\", \"무료\"], \"headline_traction\": \"2026년 1월 7일 대기자 명단으로 시작해 7월 23일 미국 이용자 전체에게 열었고, openai는 주당 3억 명이 넘는 사람이 chatgpt에 건강 질문을 한다고 밝혔다.\", \"watch\": \"이용량 수치는 전부 openai가 자체 집계해 발표한 값이며 제삼자 검증이 없다. 또 openai 스스로 이 기능에는 미국 의료정보 보호법인 hipaa가 적용되지 않는다고 문서에 밝혀 두었다.\"}, \"problem\": \"미국에서는 병원마다 전자의무기록 시스템이 따로 돌아가서, 다른 병원으로 옮기면 앞선 진료 기록이 따라오지 않는다. 환자 본인이 병원별 환자 포털에 각각 로그인해 결과지를 내려받아야 하고, 그 결과지는 수치와 전문 용어로만 적혀 있어 무슨 뜻인지 따로 물어봐야 한다. 한국은 건강보험공단과 건강보험심사평가원에 기록이 모여 있어 앱 하나로 상당 부분 확인되지만, 미국에는 그런 중앙 창구가 없다. 그래서 흩어진 기록을 한곳에 모아 주겠다는 개인건강기록 서비스가 20년 넘게 반복해서 나왔고 대부분 자리를 잡지 못했으며, 뉴스레터 필자가 이번 발
