서도, CMS가 납세자 돈의 더 나은 관리자가 되겠다는 데 진지하다는 점을 업계에 분명히 했습니다.\n\n약간 우호적인 결과가 2027년 전망에 대한 명확성을 제공하면서, 업계 반응의 상당 부분은 2028년 이후에 대한 함의에 집중됐습니다. 리스크 조정 변경의 1년 유예는 결국 이것이 2028년에 업계의 역풍으로 나타난다는 뜻일까요? 다시 말하지만, CMS가 무엇을 이루려 하는지에 대한 Klomp의 이야기를 듣고 나면, 저는 여기서의 전반적인 궤적이 꽤 분명하다고 봅니다. Klomp은 대화 중에 Final Notice 요율이 대략 GDP 성장률에 부합하는 수준으로 나왔다고 언급했고, 그 결과가 업계의 성장률로서 합리적이라는 견해를 밝혔습니다. 제게는 그것이 2028년 이후를 생각할 때의 출발점처럼 보입니다. 그 안에서 리스크 조정 변경 같은 주제는 CMS가 필요하면 당길 수 있고 또 당길 것을 아는 레버로 보입니다.\n\n이 모든 것이 맞다면, 이번 요율 고시 과정에서 나온 가장 흥미로운 질문은 리스크 조정이 아니라, 업계가 앞으로 그 medical cost trend 수치를 어떻게 통제할 것인가라고 생각합니다. 기저 의료비가 연 5% 이상 오르고 GDP가 연 3% 오른다면, 요율이 GDP와 함께 성장하도록 하겠다는 CMS의 목표에 그 계산은 당연히 맞아떨어지지 않습니다.\n\n그 격차를 어떻게 좁힐지 헤쳐 나가는 것이 CMS와 업계 전체 모두에게 당면한 핵심 질문으로 보이며, Klomp의 논평은 CMS 관점에서 답이 어디에 있을지에 대한 좋은 감을 준다고 생각합니다. 구체적으로는 페이어와 헬스 시스템 모두가 비용을 더 잘 통제해야 한다는 점, accountable care relationship의 역할, 그리고 디플레이션적 지불 메커니즘으로서의 ACCESS를 중심으로 말입니다."},{"heading_en":"MUSING: The latest in payor/provider spats: Jefferson Health sues Aetna over two midnight rule downcoding","body":"Jefferson Health가 이번 주 초 Aetna를 상대로 소송을 제기했습니다. Two Midnight 규칙과 관련된, 비교적 최근에 이뤄진 Aetna의 지불 정책 변경에 불만을 품은 것입니다. Aetna는 이제 중증도가 더 낮다고 판단한 케어를 \"다운코딩\"하고 있습니다. Jefferson은 Aetna가 계약 조건을 바꾸고 있으며 그렇게 할 수 없다고 주장합니다. 그 점을 보이기 위해 Jefferson은 저중증도로 판정된 아래의 환자 사례를 제시하는데, Aetna에게는 좋지 않아 보입니다.\n\n하지만 제가 보기에 이 사건이 일리가 있어 보이더라도, Aetna가 애초에 왜 이 정책을 시행하기로 했는지는 설명해 주지 않습니다. 잠시 Aetna가 이 정책을 시행하면서 합리적으로 행동했다고 가정해 봅시다. 왜 이런 정책을 두는 걸까요? 저는 Aetna가, 프로바이더들이 Two Midnight 규칙을 이용해 원래라면 더 낮은 요율로 지불됐을 케어를 입원 요율로 받아 왔다는 것을 보여 주는 데이터를 갖고 있기 때문이라는 데 걸겠습니다. 이런 정책을 시행하고 프로바이더와의 마찰을 감수할 만한 유일하게 그럴듯한 이유는, 그것이 의미 있는 지출 증가에 대한 대응일 때뿐이라고 생각합니다.\n\n이 사건의 구체적인 시비에서 한 걸음 물러나 보면, 페이어와 프로바이더 사이의 눈에는 눈 식 싸움이 시스템 전체의 낭비를 어떻게 키우는지 보여 주는 좋은 사례 연구로 다가옵니다. 양쪽 모두 상대가 잘못했고 자기가 옳다는 훌륭한 주장을 펼 수 있는데, 제 생각에 그것은 대체로 당면한 논쟁의 구체적인 지점을 어떻게 프레이밍하느냐의 결과입니다.\n\n금요일 Slack 스레드에서 공유했듯이, 위에서 다룬 medical cost trend를 GDP에 맞추는 더 넓은 논의의 맥락에서 이런 사건을 생각하면, 저는 이것이 다음에 뭘 볼지 정하려고 TV 리모컨을 두고 다투는 두 아이가 부모가 리모컨을 뺏으러 다가오는 줄도 모르는 상황과 조금 비슷하다는 느낌을 지울 수 없습니다."},{"heading_en":"CHART OF THE WEEK: Teladoc's BetterHelp Valuation Conundrum","body":"Teladoc은 현재 공개 시장에서의 밸류에이션을 감안하면 흥미로운 전략적 상황에 놓여 있습니다. 지난주 Teladoc은 행동주의 주주로부터 편지를 받았는데, 지금 회사가 저평가돼 있으며 그 원인은 대체로 지난 몇 년간의 일련의 전략적 실수가 사업에 대한 투자자 신뢰를 잠식했기 때문이라는 주장이었습니다. 이 투자자는 현재의 눌린 밸류에이션이 인수 제안을 부를 수 있고, 그러면 기존 주주들이 사업에 내재된 상방을 놓치게 될 것을 우려합니다. 구체적으로는 자사주 매입, 비용 절감, 그리고 BetterHelp에 대한 전략적 검토를 앞으로의 핵심 과제로 제안합니다.\n\n그리고 이번 주에는 Saki Georgiadis가 Substack에 훌륭한 글을 써서 BetterHelp에 내재된 재무적 기회를 파고들었습니다. 이 글은 BetterHelp가 보험 사업을 근거로 오늘 기준 약 10억 달러의 가치가 있다고 주장하며, Teladoc의 밸류에이션에 대해 매우 비슷한 지적을 합니다. 그는 또한 Teladoc이 BetterHelp를 10억 달러에 판다면 남은 사업은 총 약 36억 달러의 가치가 있어야 한다고 제안하는데, 이는 오늘 사업 전체의 가치인 12억 4천만 달러와 대비됩니다.\n\n이런 밸류에이션이라면, 논리적인 결론은 BetterHelp가 가까운 미래에 독립 사업이 될 가능성이 높다는 것으로 보입니다. Georgiadis의 글이 짚듯, 1분기 실적과 보험 사업 매출이 기대치대로 가고 있는지를 지켜볼 가치가 있겠습니다."},{"heading_en":"A NUMBER TO PONDER: Humana's VBC membership","body":"71%\n\nHumana가 VBC 현황에 대한 최신 연례 보고서를 발표했습니다. 글로벌 캡의 정점기 때만큼은 아니더라도, 이 보고서를 꾸준히 이어 가는 데 대해 박수를 보냅니다. Humana는 개인 MA 멤버십의 71%가 VBC 계약에 속해 있다고 보고했습니다(글로벌 캡부터 셰어드 세이빙스가 없는 퀄리티 보너스까지 아우르는 자체 VBC 정의 기준). VBC 계약 멤버십 비율은 2022년 보고서의 68%, 2017년 보고서의 66%에서 소폭 올랐습니다. 시간이 흐르며 이 수치를 구성하는 계약 유형이 어떻게 달라졌는지, 특히 글로벌 캡이 최근 몇 년간 어떤 추세를 보였을지 생각해 보는 것이 흥미롭습니다.\n\n농촌 VBC의 기회에 관한 흥미로운 메모 하나: Humana는 도시 멤버의 75%가 VBC PCP와 연결돼 있는 반면, 농촌 멤버는 54%만 VBC PCP와 연결돼 있다고 밝혔습니다. 그리고 보고서에 따르면 그 농촌 수치는 2020년 이후 19% 올랐다고 합니다."},{"heading_en":"Other Top Headlines","body":"CMS가 금요일 저녁에 또 하나의 대규모 개혁안을 발표했습니다. 상호운용성을 비롯한 여러 영역에 촉수를 뻗은 내용입니다. 특히 주목할 만한 것은 제안된 CJR-X 모델로, 기존 CJR 모델을 의무화하고 전국으로 확대하는 것입니다. 의무적이고 전국적인 번들은 CMS의 큰 움직임으로 보입니다."},{"heading_en":"Other Top Headlines","body":"여기 미네소타에서는 BCBS MN이 2026년에 손실을 예상한다고 밝혔습니다. UCare가 시장에서 철수한 뒤 밀려든 Medicare Advantage 멤버십을 감당하면서 말입니다. BCBS MN은 2025년에 3억 5,300만 달러의 영업손실을 보고했는데, 여기에는 지속되는 손실에 대비한 1억 5,000만 달러의 보험료 부족 준비금이 포함돼 있습니다. 다만 전체적으로는 BCBS MN이 투자 포트폴리오 수익 덕분에 2025년에도 8,300만 달러의 이익을 냈다는 점은 참고하시기 바랍니다. BCBS MN은 입원 케어, 전문의약품, GLP-1을 손실의 핵심 동인으로 꼽았습니다. 위에서 짚었듯, 미네소타의 시니어들은 이런 문제에 따른 베네핏 삭감에 불만을 갖고 있습니다."},{"heading_en":"Other Top Headlines","body":"유타의 Doctronic AI 파일럿이 주 Medical Board 위원들 사이에서 상당한 우려를 불러일으킨 것으로 보입니다. 금요일 Exits and Outcomes 뉴스레터에 실린 Brian Dolan의 훌륭한 보도에 따른 것입니다. Dolan은 Medical Board, Pharmacy Board, 그리고 Office of AI Policy 사이에 오간 서신을 입수했는데, 유타에서 벌어지는 혼란스러워 보이는 과정을 엿보게 해 줍니다. 임상 현장에서의 AI 도입에 조금이라도 관심이 있다면, 여기서 오간 공방을 보고 비슷한 프로그램을 검토 중인 다른 주들에 어떤 함의가 있을지 생각해 보는 것이 흥미로울 것입니다. 이런 종류의 서사에서는 당파적 전선이 드러나는 것 같습니다. 인서전트는 Medical Board가 환자보다 기존 이해관계를 보호하고 있다고 주장하고, 기존 세력은 인서전트가 환자 안전을 위험에 빠뜨리고 있다고 주장합니다. 늘 그렇듯 각 주장에 나름의 일리가 있다고 느끼지만, 정치적으로 어느 쪽이 이기는 주장인지는 제게 꽤 분명해 보입니다. 주 Medical Board를 열받게 하는 것은 지는 싸움이라고 생각합니다."},{"heading_en":"Funding Announcements","body":"Medicare 브로커리지/내비게이션 플랫폼 Chapter가 30억 달러 밸류에이션에 1억 달러를 조달했습니다. Generation Investment Management가 라운드를 리드했습니다. Chapter는 2025년에 매출을 세 배로 늘리고 1억 달러 ARR에 도달했으며, 그 사이 인원은 그대로 유지했다고 밝혔습니다. 아래 \"What I'm Reading\"에서 언급하듯, 변화하는 Medicare 지형은 (AI와 맞물려) 지금 브로커리지에 기회의 창을 열어 주고 있는 것으로 보입니다."},{"heading_en":"Funding Announcements","body":"헬스케어 오퍼레이션을 위한 AI 플랫폼 Luminai가 3,800만 달러를 조달했습니다. Peak XV Partners가 라운드를 리드했습니다. Luminai는 또한 행정 부담을 줄이기 위해 Cleveland Clinic과 파트너십을 맺었다고 발표했으며, 첫 활용 사례는 리퍼럴 관리에 초점을 맞춥니다. Cleveland Clinic의 JPM 발표로 거슬러 올라가 보면, 네 곳의 핵심 AI 파트너로 Bayseian Health, Ambience Healthcare, Palantir, Akasa를 꼽았습니다. 저는 그 목록에서 자신들이 Cleveland Clinic의 AI 오퍼레이션을 돕고 있다고 말할 만한 조직이 적어도 몇 곳은 된다고 봅니다. 이 시장이 시간이 흐르며 어떻게 진화할지 생각해 보면 흥미롭습니다."},{"heading_en":"Funding Announcements","body":"대안적 플랜 설계를 지원하는 TPA 모델 Yuzu가 3,500만 달러를 조달했습니다. General Catalyst와 Chemistry가 라운드를 리드했습니다. 대안적 플랜 설계를 위한 TPA가 어떤 모습인지 궁금하시다면, 몇 달 전에 Yuzu의 공동창업자 중 한 명과 이 주제를 파헤치는 시간을 가진 적이 있습니다."},{"heading_en":"Funding Announcements","body":"행동 건강 AI 모델 Jimini Health가 1,700만 달러를 조달했습니다. 투자자에는 Town Hall Ventures가 포함됐으며, 이들은 자사의 투자 논지를 공유했습니다. Jimini는 임상의의 연장선으로 작동해 이들이 진료 역량을 확장하도록 돕는 정신건강 챗봇 Sage를 만들고 있습니다."},{"heading_en":"Funding Announcements","body":"임상 음성 AI 기업 Insight가 1,100만 달러를 조달했습니다. Standard Capital이 라운드를 리드했습니다. 보도자료에 따르면 Insight는 The Oregon Clinic, Pacific Sports & Spine, Inland Neurosurgery, Coastal Health, Santiam Hospital 등 고객사에서 5,000만 달러 이상의 행정 비용을 절감했습니다."},{"heading_en":"Funding Announcements","body":"버추얼 모성 건강 플랫폼 SimpliFed가 1,000만 달러를 조달했습니다. Morningside와 Hesperia Capital이 라운드를 리드했습니다. SimpliFed는 대부분의 상업 플랜, 그리고 몇몇 주에서는 Medicaid와 인네트워크로 연결돼 있습니다. 내일 The Grand Round Up에서 Andrea와 SimpliFed에 대해 이야기를 나눌 예정입니다."},{"heading_en":"What I'm Reading: He Was an Insurance Executive. She's a Doctor. They're Divided.","body":"Elisabeth Potter, Troyen Brennan 씀\n\nNew York Times에 실린 잘 만들어진 대화라고 생각했습니다. 보험사와의 갈등으로 유명한 텍사스의 의사 Elisabeth Potter와, CVS의 전 CMO였던 Troyen Brennan을 한자리에 모았습니다. 이번 주 Slack에서 이야기했듯이, Potter는 평균적인 청취자의 마음을 사는 합리적인 지적을 여럿 하지만, Brennan은 시스템이 직면한 과제를 훨씬 더 직접적으로 붙잡는, 훨씬 더 일관되고 결이 촘촘한 논점들을 편다고 생각합니다."},{"heading_en":"What I'm Reading: The Most Responsible Path in Healthcare AI Is Also the Deadliest","body":"Giovanni Colella 씀\n\nColella는 문을 닫은 정신건강 AI 스타트업 Kintsugi의 이야기와, 원칙대로 헬스케어 AI를 만들려다 겪은 문제들을 조명합니다. 결국 Kintsugi는 7년과 3,000만 달러를 쓰고 정리 수순을 밟았고, 안타깝게도 헬스케어 AI의 어려움을 보여 주는 아주 좋은 사례 연구가 됐습니다. DC의 사람들이 인서전트가 업계를 뒤흔들 수 있는 공정한 운동장을 만드는 문제를 고민하는 지금, 이런 여정은 곱씹어 볼 만한 좋고도 까다로운 질문들을 던집니다."},{"heading_en":"What I'm Reading: The MEDVi Files","body":"Brendan Keeler 씀\n\nMEDVi 이야기는 이번 주 소셜 미디어의 주목을 크게 끌었습니다. 저는 Brendan Keeler의 이 분석이 제가 읽은 것 중 가장 흥미로웠다고 생각합니다. 이 이야기가 지금 골드러시처럼 느껴지는 업계 한 부분의 시대상을 보여 주는 신호 같다는 점을 짚습니다. 규제 관점에서 우리가 어떤 행동을 뒷받침하고 싶은지 고민할 때, MEDVi 이야기를 위의 Kintsugi 이야기와 나란히 놓고 보면 흥미롭습니다. 개인적으로는 지금 모든 게 거꾸로 된 느낌이지만, 혁신가는 늘 규제 변화보다 앞서 나간다는 점은 염두에 둘 만합니다."},{"heading_en":"What I'm Reading: Why Are People Injecting Themselves with Peptides?","body":"Dhruv Khullar 씀\n\n골드러시 이야기가 나온 김에, 펩타이드 열풍을 다룬 이 글이 훌륭했다고 생각합니다. 롱제비티 클리닉을 운영하며 연간 수천만 달러를 버는 찰스턴 의사의 사례가 좋은데, 특히 그 의사가 펩타이드 주사에 대한 일화적 데이터를 COVID-19 백신 연구와 견주어 평가하는 방식에 대한 논의가 그렇습니다."},{"heading_en":"What I'm Reading: The CEO of UnitedHealthcare on Fixing What Frustrates Customers Most","body":"Tim Noel 씀\n\nUHC의 CEO Tim Noel이 쓴 HBR 기사로, UHC가 곤경에 처한 멤버의 문제를 해결하기 위해 AI와 사람의 전문성을 결합한 Consumer Resolution Center를 어떻게 구축했는지 다룹니다. 인용된 성과는 정말 인상적입니다. 15만 명 이상의 멤버를 지원하며 만족도 점수를 10점 만점에 0점에서 8.8점으로 끌어올렸고, 그 멤버들이 겪은 문제의 근본 원인을 해결한 것이 UHC 전체 고객의 10%에게 경험 개선으로 이어지는 파급 효과도 있었습니다. 충분히 읽어 볼 가치가 있습니다."},{"heading_en":"What I'm Reading: UnitedHealth Group is making a $3 billion bet on AI. What does it mean for patients?","body":"Casey Ross 씀\n\nUHG가 조직 전반에 AI를 어떻게 배치하고 있는지 살펴보며, AI가 환자 안전에 가할 수 있는 잠재적 위험을 조명한 Stat 기사입니다. 위의 HBR 기사가 나온 같은 주에 이런 기사를 읽는 것이 흥미롭습니다. Stat 헤드라인이 던진 질문에 대한 제 개인적인 답은, UHG의 AI 활용이 실제로 환자에게 좋은 일로 보인다는 것입니다! UHC의 CRC는 그 아주 구체적인 예로 보입니다."},{"heading_en":"What I'm Reading: Positioning for Leadership in Medicare Advantage Brokerage","body":"Patrick Keavy, Rebecca Springer, Collin Anderson 씀\n\nMA 브로커리지 시장에 대한 Bailey & Co. 보고서로, 앞으로의 통합 가능성을 짚습니다. 마진 압축을 겪고 있는 MA 시장에서 브로커리지가 앞으로 어떤 역할을 할지 생각해 보면 흥미롭습니다. 그것이 커미션 압축으로 이어질 수도 있지만, 플랜의 인게이지먼트와 리텐션을 개선하는 브로커에게는 더 많은 기회를 만들어 줄 수도 있습니다."},{"heading_en":"What I'm Reading: Blues Plans Are Consolidating From Within. Your Pipeline May Not Reflect It Yet.","body":"Ryan Peterson 씀\n\nBlues 플랜 통합의 현주소를 흥미롭게 들여다봅니다. Second Blue Bid 과정이 이 시장의 통합을 가속할 것이라는 점을 짚는데, 이전에는 생각해 보지 못한 각도였지만 제게는 아주 말이 됩니다."},{"heading_en":"What I'm Reading: The great unbundling","body":"Neel Shah 씀\n\n2027년 1월 1일부터 CPT 코드 변경으로 모성 케어가 여러 개별 청구로 언번들되면서, 모성 케어의 지불 방식이 어떻게 달라질지에 대한 좋은 관점입니다. 당연하게도 짚어 봐야 할 하방 파급 효과가 많습니다."},{"heading_en":"HTN Content From the Week","body":"Health Tech Nerds Radio\n\n- Chris Klomp이 2027 MA final rate notice, accountable relationship, 그리고 지금이 Medicare에서 무언가를 만들기에 그 어느 때보다 좋은 시점인 이유에 대해 이야기합니다. Apple, Spotify, YouTube.\n\n- The Grand Roundup: CMMI의 LEAD 모델, Medicaid 삭감, 효과를 내고 있는 Medicare Advantage 케어 모델, 그리고 최신 헬스테크 펀딩. Apple, Spotify, YouTube.\n\n- 압박받는 Medicare Advantage: Greenbrook Medical이 풀리스크 프라이머리 케어로 정면 승부하는 이유 | Neil Machhar. Apple, Spotify, YouTube.\n\n- GLP-1을 환자와 페이어 모두에게 작동하게 만들기 | Evan Richardson (Form Health). Apple, Spotify, YouTube.\n\n- 밸류 기반 Medicaid 계약, 기술, 그리고 예방 우선 모델을 통한 소아 케어 접근성과 성과 개선 | Chris Johnson & Michael Glazier, MD (Bluebird Kids Health). Apple, Spotify, YouTube."}]},"33":{"index":"33","title_en":"Weekly Health Tech Reads 4/19/26","subtitle":"ACCESS 수가, 펩타이드를 둘러싼 더 많은 재미, ACA 질병률에 관한 초기 데이터, 그리고 Keytruda 조사","sections":[{"heading_en":"Sponsored by: UnityAI","body":"UnityAI의 창업 팀과 마주 앉았습니다. 운영 탁월성으로 잘 알려진 헬스 시스템 HCA에서의 커리어를 뒤로하고, 소규모 진료소를 위한 에이전틱 AI를 만들기로 한 경험 많은 너드 3인방입니다.\n\n여기에서 그 대화를 보거나 읽으실 수 있으며, 다음과 같은 내용을 다룹니다:\n\n- AI를 도입하기 전에 데이터와 프로세스 규율에 먼저 집중해야 하는 이유\n- 서로 조율된 에이전트들이 복잡한 워크플로우를 어떻게 관리할 수 있는지\n- AI의 ROI가 어디에서 나타나고 있는지\n- UnityAI의 850만 달러 라운드에서 투자자들에게 무엇이 통했는지\n- UnityAI가 이 자금으로 제품과 로드맵을 어떻게 시장에 내놓을 계획인지\n\n뉴스레터 스폰서십에 관심이 있으시면 알려 주세요!"},{"heading_en":"","body":"👋 이번 주 일요일 헬스케어 뉴스 정리에 오신 것을 환영합니다. 이번 주에 저는 잠깐이나마 HTN을 NewNerd AI로 방향을 틀어 리브랜딩하고 AI 컴퓨트에 올인할까 하는 생각을 해 봤습니다. 하지만 아쉽게도 이번 주 헬스케어 뉴스에는 벌어진 일이 너무 많았고, 그래서 저는 또 한 번 ACCESS 수가와 ACA 등록 데이터, 그리고 펩타이드 골드러시가 제도권으로 들어오는 이야기를 놓고 3,000단어를 늘어놓아 여러분께 보내고 있습니다.\n\n- Kevin"},{"heading_en":"ACCESS MODEL","body":"ACCESS 모델 참여, 그리고 CMMI와 VC 투자를 받은 디지털 헬스… insurgent? incumbent? 사이의 눈싸움\n\nCMS가 월요일에 약 150곳의 ACCESS 참여자 초기 명단을 공개했습니다. 7월 5일 프로그램 시작일을 앞둔 발표입니다. 아울러 참여 신청 마감을 5월 중순까지 연장했는데, CMMI가 이 프로그램에 더 많은 참여를 보고 싶어 한다는 뜻으로 읽힙니다. 초기 참여자 명단은 메디컬 그룹, 디지털 헬스 기업, 프라이머리 케어 이네이블러, D2C 소비자 모델 등이 고르게 섞여 있습니다.\n\n그러나 대체로 VC 투자를 받은 디지털 헬스 커뮤니티는 수가를 보고 나서 ACCESS에 신청하지 않기로 한 것으로 보입니다. 몇 달 전 모델 출범 당시의 슬라이드로 돌아가 보면, 이 모델에 초기 관심을 표명한 68개 기업이 표시되어 있었습니다. 저는 그 초기 명단의 기업들이 실제로 신청했는지 여부를 하나하나 표시해 봤습니다(초록 = 예; 빨강 = 아니오):\n\n출처: CMS 슬라이드, HTN 하이라이터\n\n빨간색이 정말 많습니다. 슬라이드와 발표를 제가 읽어 본 바로는, 초기 관심을 표명한 것으로 표시된 68개 기업 중 22곳만이 프로그램에 신청했습니다. 관심을 보였던 기업의 거의 70%가 결국 신청하지 않기로 한 것입니다.\n\n이 결과는 CMMI와 디지털 헬스 업계 사이에 눈싸움이 벌어지고 있음을 보여 주는 듯합니다. CMS 지도부는 이 수가가 감당 가능하다는 점을 거듭 분명히 밝혀 왔습니다. 이번 주 Stat에 실린 Mario Aguilar의 좋은 기사에서, CMMI Director인 Abe Sutton은 ACCESS Model의 설계에 대한 자신감을 드러냈습니다. CMMI는 이 모델에 자신이 있어 보이지만, 디지털 헬스 업계는 그 수가가 감당 불가능하다는 데 똑같이 자신이 있어 보입니다. 아예 신청조차 하지 않을 정도로 말이죠.\n\n예를 들어 Sword Health를 봅시다. Sword는 AI와 자사의 Sword Intelligence 플랫폼을 통해 헬스케어를 바꾸겠다는 큰 비전을 이야기해 왔습니다. 또 그 일을 정부와 함께하는 데도 관심을 보여 왔습니다 — 그리스와 손잡고 헬스케어의 첫 관문을 바꾸려 했던 파트너십을 떠올려 보세요. 거대한 비전과 그에 걸맞은 밸류에이션을 지닌 비상장 고성장 기업이라는 점을 생각하면, 개념적으로 이 프로그램에 참여하지 않는 모습은 의외입니다. 손익분기점에 이를 길이 조금이라도 있었다면, 혹은 ACCESS에서 약간의 손실을 감수하고서라도 운영할 수 있었다면, Sword 같은 회사는 그 기회에 뛰어들었으리라 생각합니다. 그래서 이는 수가라는 주제에서 이 기업들과 CMMI가 얼마나 멀리 떨어져 있는지를 잘 보여 주는 사례로 보입니다.\n\nCMS 지도부는 ACCESS가 insurgent 모델만이 성공할 수 있는 프로그램이 될 것이며, 그 insurgent들은 성공하기 위해 재무 모델을 바닥부터 새로 짜야 할 것이라고 거듭 밝혀 왔습니다. 반대로 기존 모델의 일부 요소를 덜어 내려 하는 incumbent들은 고전할 것이라고 했습니다. 이는 디플레이셔너리 모델을 출범시키는 데 따르는 당연한 일부입니다. 그리고 분명 여기서 그런 징후가 나타나는 것으로 보입니다. 하지만 동시에 Sword를 비롯해 위 슬라이드에 있는 기업들은 대부분의 사람들이 'incumbent'라고 부를 만한 곳이 결코 아니며, 바로 그 지점이 혼란스러운 부분입니다. 여러 면에서 이것은 CMMI가 업계를 더 잘하도록 구슬리려는 시도처럼 느껴집니다.\n\n궁극적으로 이 의견 차이는 답을 낼 수 있어 보입니다 — CMMI와 업계 각각의 관점을 떠받치는, 서로 맞서는 P&L 모델이 있으니까요. 문제는 누구의 P&L이 맞느냐입니다. 초기에 관심을 표명했던 디지털 헬스 기업 대부분 없이도 CMMI가 밀고 나가고 있다는 사실은, 참여한 기업들 중 일부가 이를 성사시킬 수 있으리라고 CMMI가 여전히 확신하고 있음을 시사합니다. 업계가 들여다본 뒤 참여하지 않기로 했다는 사실은, AI 기반 케어 딜리버리 비용을 모델링한 디지털 헬스 기업들이 그 계산을 맞출 수 없다는 뜻입니다. 이 모델의 성패는 CMMI가 이 숫자들을 제대로 잡느냐에 달려 있습니다.\n\n한 가지 덧붙이자면, 여기 재무를 둘러싼 이 모든 우려는 \"AI가 케어 딜리버리의 한계비용을 0으로 끌어내릴 것\"이라는 주장에는 만만치 않은 데이터 포인트로 보입니다.\n\n앞으로의 길을 찾는다는 면에서, 저는 참여하는 컨슈머 그레이드 디바이스 기업들 — 구체적으로 Whoop과 Withings — 을 특히 눈여겨보고 있습니다. 내일 The Grand Round Up에서 Withings의 Patrick Sheehan과 이야기를 나누며 그들이 ACCESS 기회를 어떻게 보고 있는지 들어 보는 것이 즐거울 것 같습니다. ACCESS의 디플레이셔너리 목표를 감안하면, 새로운 진입자를 메디케어로 초대하는 것이 여기서 최선의 베팅으로 보입니다."},{"heading_en":"PEPTIDES","body":"Wolverine Stack을 구하는 데 좋은 소식\n\n수요일에 FDA가 펩타이드(BPC-157과 TB-500 포함)에 대한 규제 완화 쪽으로 움직이는 것을 검토하고 있다는 연방 공고가 나왔습니다. 오늘날 품질이 우려될 수밖에 없는 회색시장에서 이들 펩타이드의 생산을 끌어내려는 목적도 일부 있어 보입니다.\n\n투자자와 창업자들은 여기에서 거대한 기회를 보고 있는데, 이번 주 Hims & Hers의 주가 흐름이 그 증거입니다. 수요일에 FDA 소식이 나온 뒤 이 회사 주가는 한 주 동안 약 50% 올랐습니다:\n\n출처: Google Finance\n\n물론 이 기회를 준비하는 회사가 Hims만은 아닙니다. 금요일에는 Superpower의 CEO가 LinkedIn을 통해 곧 출시할 새 펩타이드 제품을 알렸습니다. 새 스타트업 Protocole은 이번 주 스텔스에서 나오며 600만 달러의 시드 펀딩을 유치했는데, 펩타이드에 임상적으로 더 탄탄한 접근을 제공하려는 곳입니다.\n\n2026년 들어 이미 매주 펩타이드 이야기를 하고 있는 것 같은데, 이 기세가 조만간 꺾일 것 같지는 않습니다."},{"heading_en":"CHART OF THE WEEK","body":"저는 잘 만든 2×2 매트릭스에 약한데, 다가올 파마 혁명에 관한 아래 차트가 무척 흥미로웠습니다. 이 차트는 파마의 다음 단계가 분자 개발을 넘어, LillyDirect가 추구하는 것처럼 에코시스템 플레이로서 고용주 시장에서 승리하는 쪽으로 갈 것이라고 말합니다.\n\n출처: Hardcore Zen Substack\n\n이 글 전체가 흥미로운 읽을거리입니다. 파마 업계의 협회인 PhRMA의 차기 CEO에게 이상적인 역량이 무엇일지 짚어 보고, 모두가 PBM의 가치를 의심하는 지금 그 사람에게는 프레임을 바꾸는 약으로서 GLP-1을 활용해 파마에 대한 새로운 내러티브를 만들어 낼 기회가 있다고 말합니다."},{"heading_en":"A NUMBER TO PONDER","body":"1,630억 달러\n\nMerck가 블록버스터 항암제 Keytruda로 2014년부터 2025년 사이에 벌어들인 총매출입니다. International Consortium of Investigative Journalists는 Merck와 전 세계 Keytruda 판매를 두고 1년에 걸친 조사를 진행했고, 어쩌면 놀랍지 않게도 Merck가 그 매출원을 지키기 위해 온갖 수단을 동원해 왔다는 사실을 밝혀냈습니다.\n\n이번 주에 위의 PhRMA 관련 기사와 이 기사를 연달아 읽는 것이 저에게는 무척 흥미롭습니다. 파마를 옹호하는 쪽에서 왜 파마의 승리 전략이 공중보건을 뒷받침하는 에코시스템이라고 말하는지는 쉽게 이해가 됩니다. Keytruda 기사를 읽으면 그 이면에 놓인 만만찮은 트레이드오프 또한 쉽게 보입니다. 그리고 사람들이 미국 헬스케어 시스템을 아무리 비판하더라도, 만약 제 가족 중에 Keytruda가 필요한 사람이 있다면 다른 어디도 아닌 이곳에 있는 쪽을 택하겠다는 생각도 하지 않을 수 없습니다."},{"heading_en":"Other Top Headlines","body":"Abridge가 JAMA 및 NEJM과 콘텐츠 파트너십을 발표했고, 그 콘텐츠를 자사의 Clinical Decision Support 제품에 활용할 예정입니다. Abridge를 비롯한 여러 회사가 프로바이더에게 신뢰받는 AI 지원 도구가 되기 위해 경쟁하는 상황에서, 제품 라인업을 더하는 매우 논리적인 수순으로 보입니다. 지금 AI 플랫폼과 대형 프로바이더 조직 사이에 오가는 대화는 무척 흥미로울 것입니다. 예를 들어 Sutter Health를 봅시다. 이 회사는 2024년 3월 Abridge와의 파트너십을 발표했고 Abridge 웹사이트에 대표 로고로 걸려 있습니다. 2026년 2월에는 Sutter가 OpenEvidence와의 파트너십도 발표했습니다. 여러분이 Sutter라면, 제품 라인업이 점점 겹쳐 가는 상황에서 이 관계들을 어떻게 평가하시겠습니까? 여기서 복수의 관계를 유지하는 것이 합리적일까요? Abridge의 발표에는 Sutter CEO의 코멘트가 실렸지만 OpenEvidence의 발표에는 없었다는 점도 짚어 둘 만합니다. 내일 The Grand Round Up 라이브에서 Abridge의 CEO Shiv Rao와 이 콘텐츠 파트너십, 그리고 그것이 앞으로 Abridge의 전략에 갖는 함의에 대해 이야기 나눌 예정입니다."},{"heading_en":"Other Top Headlines","body":"Baylor Scott & White Health Plan이 ACA와 메디케이드 시장에서 발을 뺍니다. 현재 주 내에서 각각 해당 인구의 약 2.6%와 3.5%를 커버하고 있으며, 이번 조치의 일환으로 321개 일자리를 감축할 예정입니다."},{"heading_en":"Other Top Headlines","body":"Oregon주가 ATRIO Health Plans를 법정관리에 넘겼습니다. 손실이 쌓이고 미지급 클레임이 밀려 있는 상황에 놓였기 때문입니다. ATRIO는 현재 메디케어 어드밴티지 플랜에 약 3만 6천 명의 가입자를 두고 있습니다. 주 당국은 ATRIO가 2025년에 5,000만 달러 이상의 손실을 냈고, 자본과 잉여금이 약 1,000만 달러만 남은 채로 그해를 마쳤다고 밝혔습니다."},{"heading_en":"Other Top Headlines","body":"WSJ가 Wakely의 최신 ACA 등록 데이터를 조명하며(자세한 내용은 아래 참조), 시장의 14%가 1월에 첫 보험료를 납부하지 않았고 일부 주에서는 25%가 넘는 개인이 첫 보험료를 내지 않았다고 전했습니다. Wakely는 전체 시장 축소 폭이 2025년 대비 17%에서 26%에 이를 것으로 추정하며, 시장의 질병률 상승이 2027년 요율 신고에 불확실성을 만들 것으로 봅니다."},{"heading_en":"Other Top Headlines","body":"Trilliant Health가 행동건강 시장에 관한 리포트를 내며 공급과 수요의 역학을 둘러싼 데이터를 조명했습니다. 헤드라인은 2018년부터 2024년 사이 행동건강 이용량이 62% 증가했다는 것입니다."},{"heading_en":"Other Top Headlines","body":"President Trump가 이번 주말 사이키델릭에 관한 행정명령에 서명해, 중증 정신질환 치료에 사이키델릭을 사용하는 데 있는 장벽을 제거했습니다."},{"heading_en":"Funding Announcements","body":"임상 데이터를 위험조정에 활용하는 AI 플랫폼 Keebler Health가 1,600만 달러를 유치했습니다. Flare Capital Partners가 라운드를 리드했습니다. 이 회사는 다양한 인구집단 건강관리 활용 사례를 지원하겠다는 더 넓은 포부를 갖고 있습니다."},{"heading_en":"Funding Announcements","body":"프로바이더의 수익 확보를 돕는 레비뉴 사이클 도구 Joyful Health가 2,200만 달러를 유치했습니다. CRV가 라운드를 리드했습니다. Joyful의 게시글은 프로바이더들이 스스로 벌어들인 매출 1,250억 달러를 매년 놓치고 있다고 말합니다. 그것만으로 GDP의 0.5%라니 꽤 놀랍습니다."},{"heading_en":"Funding Announcements","body":"롱제비티 클리닉을 위한 EHR인 Ultralight가 930만 달러를 유치했습니다. The General Partnership이 라운드를 리드했습니다. 이전에 Vibrant Practice로 알려졌던 Ultralight는 현재 75개 롱제비티 클리닉에서 가동 중이라고 밝혔습니다."},{"heading_en":"Funding Announcements","body":"태아 EEG 모니터링 시스템 Wavelet Medical이 700만 달러를 유치했습니다. 벤처 스튜디오 Aegis Ventures와 파트너십을 맺고 있습니다."},{"heading_en":"Funding Announcements","body":"펩타이드를 위한 '임상 등급' 모델 Protocole이 600만 달러를 유치했습니다. Rare Capital이 라운드를 리드했습니다. Protocole은 현재 시장에 나와 있는 회색시장 브랜드들보다 더 믿을 만한 제품으로 높아지는 펩타이드 관심에 대응하려는 것으로 보입니다. 펩타이드 소비가 더 주류로 가고 있다고 본다면 논리적인 베팅으로 보입니다."},{"heading_en":"What I'm Reading","body":"Wakely 리포트가 최신 ACA 등록 데이터를 파고들며, 메탈 레벨 간 등록 이동(Bronze와 Gold는 상승, silver는 하락)을 조명합니다. 이 리포트는 2026년 시장 전체의 평균 질병률이 2.9%에서 6.5%까지 오를 것으로 보면서도, 그것은 어디까지나 평균이며 특정 시장에서는 그 범위를 벗어나는 등락이 나타날 것이라고 지적하고, 따라서 2027년 요율 신고를 면밀히 지켜볼 필요가 있다고 말합니다."},{"heading_en":"What I'm Reading","body":"Nature Health에 실린 한 논문이 Microsoft Copilot의 비식별화된 건강 관련 질의 50만 건을 분석해, 사람들이 챗봇에 무엇을 묻는지 더 잘 이해하려 했습니다. 데스크톱 검색과 모바일 검색에서 나타나는 흥미로운 사용 패턴 차이를 조명하는데, 사람들이 직장에서는 데스크톱을, 개인적인 검색에는 모바일을 쓰는 것과 맞아떨어져 보입니다."},{"heading_en":"What I'm Reading","body":"Purchaser Business Group on Health의 연례 설문조사가 나왔습니다. 대형 고용주 약 스물네 곳을 대상으로 한 조사인데, 어포더빌리티, 투명성 / 데이터 애널리틱스, 어드밴스드 프라이머리 케어가 상위 세 가지 우선순위로 꼽혔습니다. 데이터는 또한 회원사의 27%가 이미 비전통적 PBM을 쓰고 있다고 전하는데, 저에게는 놀라울 만큼 높은 수치입니다. 그렇다면 미국 40대 고용주 중 11곳이 전통적 PBM에서 이미 넘어갔다는 뜻일까요? 그게 사실이라면, 시장이 이미 스스로 감당할 수 있어 보이는데도 왜 전통적 PBM을 해체하는 데 그렇게 많은 에너지가 쓰이고 있는지 조금 혼란스럽습니다."},{"heading_en":"What I'm Reading","body":"Sherwood News 리포트는 DOJ가 이번 주 GLP-1 텔레헬스 스타트업 Zealthy를 상대로 한 소송에서 새로운 신청서를 제출했다고 전했습니다. Zealthy는 이제 파산에 가까워진 것으로 보입니다. Zealthy는 Cerebral의 공동창업자이자 CEO인 Kyle Robertson이 창업했으며, 2024년에 Cerebral 및 몇몇 관련 법인과 함께 기만 행위 혐의를 받았습니다. Robertson은 이 시점에서 꽤 놀라운 이력을 갖게 됐는데, 좋은 의미는 아닙니다. 이런 이야기를 읽다 보면 때때로 법 시스템이 더 신속하게 움직였으면 하는 바람이 듭니다."},{"heading_en":"What I'm Reading","body":"Bob Wachter는 Substack에서 Epic이 AI 시장을 어떻게 위협하는지 짚습니다. 시장 지배력을 앞세워 더 나은 스타트업 대안들을 제치고 헬스 시스템을 따내는 방식, 그리고 그것이 시장의 혁신을 어떻게 가로막을 수 있는지에 관한 이야기입니다. 개념적인 우려는 충분히 이해하지만, Abridge나 OpenEvidence 같은 회사들의 빠른 성장을 보면 고개가 조금 갸웃해집니다. Epic의 시장 지배력이 AI 혁신을 가로막고 있다는 것이라면, 지금으로서는 그다지 잘하고 있는 것 같지 않습니다."},{"heading_en":"This Week on HTN","body":"Community Brain Trust: MA final rate notice, 출산 케어 지불 코드의 언번들링, MEDVi와 더 넓은 GLP-1 지형 뜯어보기 등. 여기에서 읽어 보세요."},{"heading_en":"This Week on HTN","body":"Weekly Health Policy Briefing: ACCESS가 잘 될지 회의적이면서도 제가 이 모델을 좋아하는 이유, 그리고 주 단위 보험 실험들. 여기에서 읽어 보세요."},{"heading_en":"This Week on HTN","body":"Health Tech Nerds Radio는 Apple, Spotify, YouTube를 비롯해 팟캐스트를 듣는 어디에서나 들으실 수 있습니다.\n\n- The Grand Roundup: CMMI의 LEAD 프로그램과 CARA를 통한 전문의 참여, MA 최종 수가와 베네핏 축소, Teladoc의 밸류에이션 난제, 사모 시장에 혼란을 만드는 AI, 그리고 OB 케어를 확장하기 위한 SimpliFed의 1,080만 달러 시리즈 A.\n  - 출산 케어에 투자해야 하는 이유와 SimpliFed의 1,080만 달러 시리즈 A를 이끈 동력 | Andrea Ippolito (SimpliFed)\n  - CMMI LEAD, 그리고 ACO REACH에서 달라진 세 가지 핵심: 전문의 편입, AI로 추론한 리스크 활용, 트랙 단순화 | Gabe Drapos (Pearl Health)\n  - CMS Administered Risk Arrangements(CARA)가 ACO와 전문의 사이의 간극을 어떻게 메우는지 | Will Gordon (Manatt Health)\n  - 사모 시장에 대한 투자자의 시각, 그리고 AI가 만든 불확실성 헤쳐 나가기 | Conor Green (Truehelm)\n- 대안적 플랜 디자인의 내부: 고용주의 비용 절감을 이끄는 메커니즘과 행동 변화 | Craig Allen & Nancy Wang (Sidecar Health)"}]},"36":{"index":"36","title_en":"Weekly Health Tech Reads 4/26/26","subtitle":"1분기 실적 시즌 개막, 정치적 문제에 부딪힌 AI 파일럿들, 더 나은 헬스케어를 위한 희생에 대한 단상, 그 외","sections":[{"heading_en":"Sponsored by: Nashville Health Care Council","body":"스폰서: Nashville Health Care Council\n\n가을 컨퍼런스 일정을 짜고 있는 리더들께 Nashville Healthcare Sessions를 소개해 드리게 되어 기쁩니다!\n\nSessions는 올해로 4년째를 맞아 9월 13일부터 15일까지 열리며, 기존 사업자와 혁신 기업, 투자자 등에서 온 경영진이 모여 전략과 자본 배분, 성장을 좌우하는 의사결정에 대해 솔직한 대화를 나눕니다.\n\n참석자들은 지난해를 기준으로 보면 HCA, JPM, General Catalyst, CVS, DaVita, Turquoise Health 같은, 생태계 전반의 인상적인 조합을 이루는 조직들에서 온 수준 높은 인사들과 함께하게 됩니다.\n\n저희도 현장에서 이 컨퍼런스를 취재할 예정이며, 그곳에서 많은 분들과 다시 만나 뵙기를 기대합니다! 행사는 1,400명으로 인원이 제한되어 있으니 서둘러 티켓을 확보하시기 바랍니다.\n\n뉴스레터 스폰서십에 관심이 있으시면 저희에게 알려 주세요!"},{"heading_en":"","body":"👋 이번 주 일요일 헬스케어 뉴스 정리에 오신 것을 환영합니다. 이번 주에 1분기 실적 시즌이 시작됐는데, 그 결과를 보고 있으면 세계 곳곳의 퀀트들이 다가올 폭풍을 예측해 줄 만한 좋은 기상학자를 아는지 고민하고 있지 않을까 싶습니다(뭐, 놀랍지 않게도 실제로는 이미 그런 사람들을 데리고 있는 것으로 보입니다). 한편 저는 더 나은 헬스케어를 위해 우리가 치러야 할 희생에 관한 Ezekiel Emanuel의 글을 읽으며 이번 주 내내 이론적인 사색에 깊이 빠져 있었고, 그 생각을 No Surprises Act의 과잉을 다룬 NYT 기사와 어떻게 맞춰 볼지 고민했습니다. 두 가지 핵심 AI 시도(WISeR와 유타주의 처방 리필 파일럿)를 둘러싼 정치적 역풍이 거세진 것이 바쁜 한 주의 톱 헤드라인을 마무리합니다. 아래에서 더 깊이 들어가 보겠습니다!\n\n- Kevin"},{"heading_en":"Q1 EARNINGS SEASON: Early Q1 Takeaways: Weather Patterns, Payor Outperformance, and Provider Underperformance","body":"1월과 2월에 미국을 덮친 대형 눈폭풍 중 하나에 갇혀 있었던 분이라면, 그때 \"이게 1분기 헬스케어 실적 시즌에 어떤 영향을 줄까?\"라고 스스로 묻지 않았더라도 이해합니다. 그런데 알고 보니 그 질문의 답은 \"아주 많이!\"였습니다. 사람들이 며칠씩 눈에 갇혀 있으면 케어 딜리버리 이용량이 충분히 줄어들어 페이어와 프로바이더 양쪽 실적에 모습을 드러내는데, 이번 분기가 바로 그랬습니다.\n\n페이어 쪽에서는 United, Elevance, Molina가 이번 주에 실적을 발표했고 주가는 7%에서 19%까지 올랐습니다. 세 곳 모두 초기의 우호적인 코스트 트렌드와 운영 개선이 맞물려 기대를 웃돌았다고 밝혔으며, UHG와 Elevance는 연간 가이던스를 상향했고 Molina도 2분기 이후에는 그렇게 할 궤도에 있는 것으로 보입니다. 반대편에서는 HCA가 목요일에 1월 말의 눈폭풍(그리고 독감 시즌의 급작스러운 종료)으로 물량이 기대보다 적었다고 발표한 뒤 주가가 한 주 동안 11% 떨어졌습니다.\n\n저는 업계의 1분기 실적 전반에서 비슷한 결과가 계속 나타나리라는 데 가볍게 걸어 보겠습니다. 페이어와 리스크를 지는 그룹들은 1분기에 우호적인 트렌드를 봤다는 신호를 내비치고, 프로바이더들은 부진했던 1월 이후 다시 정상 궤도로 돌아오려 애쓰는 모습 말입니다.\n\n그런 점을 감안하면 이번 주 주식시장의 반응은 양쪽 모두 다소 과했다는 인상을 줍니다. 1분기 안에서도 1월의 이탈 이후 역학이 다시 기대치로 되돌아온 것처럼 느껴집니다. 아래에 그 주요 실적 발표들에 대해 조금 더 적어 두었는데, 사업에 대한 흥미로운 통찰을 여럿 보여 준 HCA부터 시작합니다."},{"heading_en":"HCA","body":"HCA 주가는 독감과 1월 폭풍의 영향으로 1분기 기대치를 밑돌면서 이번 주에 하락했습니다. HCA는 호흡기 질환 입원이 전년 대비 42%, 호흡기 질환 응급실 방문이 32% 줄었다고 밝혔습니다. 2월과 3월에는 반등한 것으로 보이며, 남은 해는 가이던스에 부합하는 상태입니다. 독감 시즌이 느리게 끝난 것과 폭풍이 겹치면서 이번 분기 HCA의 EBITDA에 $180의 부정적 영향이 발생했습니다. 이 영향은 조지아주와 텍사스주의 예상치 못한 주 보조 지급 프로그램에서 나온 $120의 긍정적 전개로 상쇄됐습니다. HCA는 플로리다에서도 또 한 번 의미 있는 성과를 기대하는 것으로 보이는데, 애널리스트들은 CMS가 그랜드파더 적용 신청을 승인하는 데 시간이 오래 걸리는 점을 다소 우려하는 모습이었습니다. HCA는 이번 분기에 ACA 커버리지가 15% 줄었다고 밝혔고 이는 자사 예상의 하단에 해당하지만, 동시에 ACA 커버리지를 가진 사람들 사이에서 환자 본인 부담 지불이 늘었다고도 보고했습니다. HCA의 노스캐롤라이나 시장과 그곳이 허리케인 Helene에서 어떻게 회복하고 있는지에 대한 짧은 논의도 있었는데, 수익성 기대에는 뒤처지고 있습니다. 수요는 예상보다 높지만 HCA는 인력 채용에 어려움을 겪으면서 더 높은 비용을 치르고 있습니다. 한편 허리케인 이후 상업보험 시장이 흔들리면서 이 시장의 페이어 믹스가 어긋나 있습니다. 이런 폭풍이 한 시장에 미치는 파급 효과를 들여다볼 수 있는 흥미로운 렌즈입니다."},{"heading_en":"Elevance","body":"Elevance는 1분기에 나타난 운영상의 초과 성과를 바탕으로 연간 가이던스를 상향했습니다. Elevance는 그 이유로 몇 가지를 들었습니다. 리더십 구조 개편, 임상·운영·관리 워크플로우에서의 AI, 그리고 CareBridge와 홈헬스 역량을 Carelon 안의 단일 리스크 기반 모델로 통합한 것입니다. Elevance는 Medicaid 비용 관리에 만족하는 모습으로, 표적화된 케어 코디네이션 노력, ABA 시장에 대한 임상적 감독, 물질사용장애가 있는 회원을 식별하기 위한 예측 분석을 언급했습니다. MA에서 Elevance는 2026년에 2% 이상의 영업이익률을 향해 가고 있으며, 등록 동결과 관련해 CMS와 협의하고 있고 현재로서는 사업에 아무런 영향 없이 해결될 것으로 기대하고 있습니다. ACA에서 Elevance는 회원 120만 명을 예상하는데 이는 최초 전망을 웃도는 수치이지만, 시장의 불확실성을 감안해 90만 명이라는 기대치는 아직 수정하지 않고 있습니다. 마지막으로 Elevance는 상업보험 판매에서 강한 모멘텀을 보고 있는 것으로 보입니다. 2027년을 향한 파이프라인이 사상 최고 수준에 가까울 만큼 매우 탄탄하다고 밝혔습니다. 또한 보험사를 통합하려는 고객들 사이에서 수주가 나오고 있으며, Elevance가 여러 보험사를 대체하고 있다고도 언급했습니다. 이번 콜에서 Elevance가 Second Blue Bid 기회를 낮춰 말한 점이 흥미로웠는데, 2026년에는 그것이 Elevance에 큰 호재였지만 성장의 대부분은 다른 원천에서 나온다고 했습니다."},{"heading_en":"Molina","body":"Molina는 기대보다 좋은 트렌드 성과로 1분기에 초과 성과를 냈지만 연간 가이던스는 상향하지 않았습니다. Molina의 실적 발표에는 의료비 트렌드와 그것이 시간이 지나며 어떻게 전개되는지에 대한 흥미로운 분해가 담겼습니다. Molina는 2025년에 Medicaid에서 7.5%의 트렌드를 보고했고 그중 2.5%포인트는 재심사(redetermination)에 따른 중증도 이동이었다고 밝혔습니다. Molina는 이번 콜에서 그 중증도 이동이 2025년 말에 사라졌고, 그 결과 2026년에는 5%의 트렌드를 가정하고 있다고 했습니다. 역시 Medicaid에서 Molina는 기대보다 높은 이탈을 언급했는데, 일부 주, 구체적으로는 캘리포니아, 일리노이, 텍사스에서 예상보다 많은 Medicaid 자격 상실이 나타나고 있습니다. 이제 2026년에 \"동일 매장\" 기준 회원 6% 감소를 예상하며, 이는 기존의 2%에서 올라간 수치입니다. Medicare에서 Molina는 Medicare 사업을 D-SNP, HIDE, FIDE 상품만으로 재편한 것에 만족하는 모습이며, MAPD 사업은 다른 전략적 주체로 넘기기를 바라지만 그렇게 되지 않으면 접겠다고 했습니다. ACA 사업에서는 회원 수가 기대보다 약간 높은 30만 5,000명으로 집계됐지만, 그 프로파일에 대해 좋게 보고 있으며 2027년을 앞두고 가격 책정에는 신중할 것으로 예상합니다. Molina의 Medicaid 사업에 있는 \"저이용자\"에 대한 흥미로운 논의도 있었는데, Molina는 커버리지를 갖고 있으면서도 사용하지 않는 사람의 비중이 사상 최저이며 그런 회원들은 지난 몇 년에 걸쳐 자사 사업에서 빠져나갔다고 시사했습니다."},{"heading_en":"UHG","body":"United는 애널리스트 기대치를 넘어섰고 연간 가이던스를 상향했는데, 모든 주요 사업 부문이 기대를 웃돌았습니다. UHC는 Medicare에서 가격 책정 이니셔티브가 성과를 내고 있는 반면 Medicaid는 주들로부터 받는 요율의 압박을 계속 헤쳐 나가고 있다고 밝혔습니다. UHC는 기저 이용량 트렌드가 2025년과 일관되게 보이며 트렌드에서 완만한 우호성을 보고 있다고 언급했습니다. Optum Health는 이번 분기에 크게 초과 성과를 냈는데, 운영 개선과 VBC 계약 포트폴리오 재편 덕분이라고 설명했습니다. FFS 사업에서의 운영 개선도 눈여겨볼 만한데, 조직 내 환자 대면 시간이 전년 대비 12% 늘었습니다. OptumRx 업데이트는 짧았고, 복잡하고 고가인 스페셜티 의약품이 시장에 나오는 상황에서 PBM이 하는 중요한 역할을 언급했습니다. Optum Insight는 자사의 AI 역량을 부각하면서 \"아직 활용되지 않은 잠재력\"을 언급했고, Optum Real이 다시 그 예로 인용됐습니다. Optum Financial은 HSA/FSA 자금을 관리하는 플랫폼인 Alegeus Technologies를 인수했는데, 소비자 주도 결제를 둘러싼 모멘텀을 보여 주는 또 하나의 좋은 지표입니다."},{"heading_en":"MUSING: A tough question: what sacrifices are we willing to make for better healthcare?","body":"Ezekiel Emanuel이 이번 주에 헬스케어 리더들에게 어려운 질문을 던지는 좋은 블로그 글을 썼습니다. 더 나은 헬스케어 시스템을 위해 당신은 무엇을 희생할 의향이 있는가?\n\n이번 주말에 깊이 생각해 볼 거리를 찾고 있다면 이 글을 권합니다.\n\n이 글은 업계의 각 부분이 자기가 무엇을 더 잘해야 하는지를 생각하는 경향이 있고, 그것은 대체로 더 많은 일을 할 수 있도록 더 나은 요율을 받는다는 형태를 띤다고 봅니다. 대신 그는 우리가 이미 미국에서 헬스케어에 너무 많은 돈을 쓰고 있으며, 리더들이 무엇을 내어 놓을 의향이 있는지를 함께 고민해야 한다고 제안합니다. 여기서 \"함께\"라는 부분이 중요합니다. 페이어와 프로바이더, 제약사는 그 스파이더맨 밈을 떠올리게 하는 방식으로 서로를 손가락질하곤 하지만, 결국 그들 모두가 함께 희생해야 하기 때문입니다.\n\nEmanuel은 이 글에서 여러 합리적인 제안을 내놓습니다. 소비자 대상 제약 광고 금지, PBM의 패스스루 투명 체계로의 전환, 병원에 대한 사이트 뉴트럴 지불, 보험사의 본인 부담 상한 설정 등입니다. 그는 헬스케어의 소비자들도 희생해야 한다는 점을 함께 지적합니다. 더 긴 대기 시간, 병원 내 호텔 같은 편의시설의 축소, 매년 시장에 나오는 브랜드 의약품 수의 감소 같은 것들입니다.\n\n여기서 철의 삼각형이 다시 고개를 듭니다. 헬스케어의 비싼 값을 해결하려 한다면 결국 당길 수 있는 레버는 접근성과 품질을 중심으로 돌아가게 됩니다. 그리고 그것이 바로 이 모든 문제의 핵심적인 난제입니다. 사회적으로 우리는 지금 이 시점에 그 트레이드오프에 대한 어려운 대화를 나누지 못하고 있으니까요.\n\n제가 한 가지 확신하는 것이 있다면, 저는 이것을 대단히 흥미로운 지적 훈련이라고 느끼지만 그것은 지적 훈련으로 남으리라는 점입니다. 우리가 손을 모아 흐름을 바꿀 합리적이고 집단적인 희생의 목록에 선제적으로 합의할 가능성은 0.0%입니다. 대신 우리는 각자 필요한 것을 얻겠다고 계속 다투면서, 차를 몰아 그대로 절벽 아래로 떨어뜨릴 것입니다. 조각을 주워 담는 방법은 언제나 다른 누군가가 알아낼 수 있을 테니까요.\n\nNB: 틀 밖에서 생각한다는 취지로, 저는 내일 TGR에서 Martin에게 헬스케어의 소비자로서 제가 포기할 의향이 있는 것은… 실은 이 나라에서 헬스케어에 더 많은 돈을 내는 것을 받아들이는 일이라는 주장을 펴 볼 생각입니다. 저는 GDP의 약 18%를 헬스케어에 쓰는 나라에 사는 것 자체에 개념적인 거부감은 없습니다. 다른 나라들이 더 적게 쓴다는 것도 압니다. 좋은 일이죠. 동시에 세계 각지에서 사람들이 최고급 의료를 받으러 이곳으로 오는 데에는 이유가 있다는 것도 압니다. 그래서 저는 철의 삼각형이 시사하는 대로 그 대가로 더 나은 품질과 접근성을 맞바꾼다면, 그 숫자가 올라가는 것도 실은 괜찮습니다. 더 많은 돈을 받는 대신 페이어와 프로바이더, 제약사는 오늘날 벌어지는 저가치의 헛짓에서 벗어나, 가끔 사람들이 입에 올리는 풍요로운 헬스케어라는 개념을 향해 실제로 움직이기로 합의하는 것입니다. 고가치 케어에 대한 접근성이 더 좋아진다면 헬스케어가 GDP의 25%로 올라가도 저는 괜찮습니다."},{"heading_en":"QUOTE OF THE WEEK","body":"뉴욕과 플로리다에 진료실을 둔 성형외과 의사 Dr. Norman Rowe는 자기 웹사이트에 유방 축소술 비용이 보통 1만 5,000달러에서 2만 5,000달러 사이라고 광고합니다.\n\n그런데 요즘 그의 진료소는 그 시술로 44만 달러를 벌어들이기도 합니다.\n\nThe New York Times는 이번 주 No Surprises Act를 다룬 기사에서 확실히 핵심을 뒤로 미루지 않았습니다. Independent Dispute Resolution 절차의 결과가 다소… 어리둥절하다는 점을 부각했으니까요. 물론 NSA와 IDR 절차가 생겨나게 만든, 근본적인 페이어/프로바이더 관계에 대한 정당하고 오래된 불만들도 존재합니다.\n\n그 말이 맞기는 하지만, 이 NYT 기사는 Dr. Rowe가 직면한 소송과 그의 진료소가 다섯 건의 수술로 140만 달러의 판정을 받아 냈다는 사실도 함께 부각합니다. 그중 한 건이 위에서 말한 44만 달러입니다. 의회는 아직 이 결과에 관심이 없어 보이는데, No Surprises Act의 입안자 중 한 명인 Cassidy 상원의원은 NYT 보도에서 프로바이더들의 결과에 대해 이렇게 말한 것으로 인용됐습니다.\n\n\"그들이 이기고 있다면, 그건 보험사들이 합리적인 안을 들고 오지 않기 때문입니다.\"\n\n- Senator Bill Cassidy, New York Times 인용\n\n그래서 워싱턴 D.C.는 아직 이를 알아차리지 못한 것으로 보이지만, Independent Dispute Resolution 절차는 낭비적인 지출이 헬스케어에 뿌리를 내리고 잡초처럼 자라나는 방식을 보여 주는 대표적인 사례 중 하나로 보입니다. 다시 말하지만 저는 페이어가 프로바이더에게 얼마를 지불하고 있는지, 페이어의 제안이 합리적인지에 대해 나눠야 할 대화가 있다는 점은 이해합니다. 동시에 저는 Dr. Rowe의 성형외과 사업이 대금 회수에 어떤 어려움을 겪고 있다고는 생각하지 않습니다. Mar-a-Lago 파티를 위한 연어 정자 페이셜 주사는 꽤 수익성이 좋은 모양입니다. 안 될 게 뭐 있겠습니까?\n\n페이어/프로바이더 협상의 마찰점을 풀어 보려던 논리적인 시도로 시작된 것이 말 그대로 허공에서 하나의 산업을 불러냈습니다. 이 프로그램의 과잉을 둘러싼 소송과 폭로가 날아다니는데도, 자체 협회까지 만들 만큼 잘나가고 있다는 것은 이것이 계속 남아 있으리라는 확실한 신호로 보입니다.\n\n위의 Zeke Emanuel 글과 이 이야기를 나란히 놓고 읽으니 꽤 기이합니다. 제가 고가치 케어에 더 많은 돈을 내도 괜찮다고 말할 때, 이런 것을 염두에 둔 것은 아니었습니다."},{"heading_en":"Other Top Headlines","body":"OpenAI가 임상의를 위한 새로운 클리니컬 검색 도구를 내놓습니다. Endpoints와의 인터뷰에서 OpenAI의 헬스 총괄인 Nate Gross는 엔터프라이즈 관계를 통해 접근할 수 없는 임상의들을 겨냥하고 있다고 말했습니다. Gross가 예전에 Doximity의 공동창업자였다는 점을 떠올리지 않기가 어렵고, 그 발언이 그 점을 분명히 해 주는 듯합니다. OpenAI의 전략 전반에 대한 생각이 궁금하다면 이 인터뷰를 살펴볼 만합니다."},{"heading_en":"Other Top Headlines","body":"Doctronic와 함께 진행하는 유타주의 AI 기반 처방 리필 파일럿이 겪고 있는 문제가 이번 주에 격화됐습니다. 유타주 의료면허위원회가 Office of AI Policy에 서한을 보내 추가 논의가 있을 때까지 이 프로그램을 즉시 중단할 것을 강력히 권고했기 때문입니다. 우려는 예상할 법한 그대로입니다. 의료위원회는 사람들의 안전을 지킬 책임이 있는데, 그 승인 없이 나아가는 것은 사람들을 위험에 빠뜨린다는 것입니다. 저는 개인적으로 그 논리가 꽤 설득력이 없다고 봅니다. 파일럿이 발표된 직후 Doctronic의 Dr. Adam Oskowitz와 이야기를 나눴을 때, 그는 Doctronic의 승인 방식이 오늘날의 표준 진료보다 거의 확실히 더 안전한 이유를 하나씩 짚어 주었습니다. Doctronic 경영진은 이번 주에 \"The Status Quo Is the Biggest Risk\"라는 제목의 블로그 글로 한 걸음 더 나아갔습니다. 무엇보다도 이 글은 유타 파일럿에서 처방되는 모든 약을 여전히 의사가 검토하고 있으며, 그렇게 하면서 자율적으로 운영할 자격을 얻어 가고 있다고 밝힙니다. 저는 여기서 Doctronic의 주장이 꽤 설득력 있다고 보지만, 동시에 의료위원회의 심기를 건드리는 정치를 감안하면 여전히 이길 수 없는 주장이라고 생각합니다."},{"heading_en":"Other Top Headlines","body":"워싱턴주의 한 상원의원이 WISeR 모델과 그것이 올해 초 시행된 이후 주 안에서 겪어 온 문제들을 강하게 비판하는 보고서를 냈습니다. 이 보고서는 WISeR를 두고 \"워싱턴주 병원과 의사들을 위한 행정적 미로\"라고 표현했습니다. 대기 시간이 늘었다는 점을 인용하고, AI가 케어를 거부하고 있으며 이 모델이 환자보다 이익을 앞세우고 있다고 주장합니다. 흥미로운 점은 WISeR가 시범 운영되는 다른 주들에 비해 워싱턴주에서 나오는 소음이 유독 크다는 것입니다. 이것이 다른 주에서도 겪고 있는 문제인지, 아니면 워싱턴주에 국한된 것인지 궁금해집니다. 만약 이 문제가 더 광범위하다면, 논리적인 프로그램이 눈앞의 정치에 가로막히는 또 하나의 사례로 보입니다."},{"heading_en":"Other Top Headlines","body":"새로운 AI 헬스케어 액셀러레이터인 Treehub가 출범합니다. 헬스케어 AI 투자에 초점을 맞춘 초기 단계 벤처 펀드 AI Health Fund도 함께 출범합니다."},{"heading_en":"Other Top Headlines","body":"지난주 소문이 돌았던 대로 IKS Health가 TruBridge를 최대 5억 6,500만 달러에 인수했습니다. TruBridge는 농촌 헬스케어 시장에 RCM과 EHR을 제공합니다."},{"heading_en":"Other Top Headlines","body":"EHR 플랫폼 ModMed가 AI 환자 인게이지먼트 플랫폼 Bonsai Health를 인수했습니다. ModMed는 Bonsai의 인게이지먼트 역량을 전문 진료 고객 기반에 배포할 예정입니다."},{"heading_en":"Funding Announcements","body":"제약사가 환자 경험을 관리하도록 돕는 회사 Courier Health가 5,000만 달러를 조달했습니다. Oak HC/FT가 라운드를 주도했습니다. Courier는 제약사들에 대해 인상적인 성과를 제시합니다. 치료 시작 15~20% 증가, 6개월 지속률 10~12% 증가, 팀 생산성 5~7배 증가입니다. 높은 가격표를 달고 시장에 나오는 의약품을 지원하기에 매우 논리적인 기회로 보입니다."},{"heading_en":"Funding Announcements","body":"행동건강 스타트업 Tava Health가 4,000만 달러를 조달했습니다. Centana Growth Partners가 라운드를 주도했습니다. 보도자료는 Tava가 정신건강 네트워크에서 풀스택 플랫폼으로 포지션을 바꾸고 있다고 밝힙니다. Tava는 상업보험 가입 시장의 90%에 대해 인네트워크이며, 200개 헬스플랜과 함께 일하고 있습니다."},{"heading_en":"Funding Announcements","body":"프로바이더를 위한 거부 관리 및 수익 회수 플랫폼 Amperos Health가 1,600만 달러를 조달했습니다. Bessemer가 라운드를 주도했습니다. Amperos는 3,000개 임상 현장에 서비스를 제공하며, 프로바이더를 대신해 50만 건의 클레임에서 7억 달러의 수익을 회수했다고 밝힙니다. 클레임당 회수 수익은 22% 더 높고 비용은 50% 더 낮다고 합니다."},{"heading_en":"Funding Announcements","body":"히스패닉 인구를 위한 커뮤니티 헬스 워커 모델인 Zocalo가 1,500만 달러를 조달했습니다. 보도자료는 Zocalo가 매출을 전년 대비 4배로 키웠고 2024년 2건이던 지역 헬스플랜 계약을 2025년에 12건으로 늘렸다고 밝힙니다. Zocalo는 현재 Anthem Blue Cross, Health Net 같은 Medicaid Managed Care 조직들과 일하고 있으며 Cal AIM을 준비하고 있습니다."},{"heading_en":"Funding Announcements","body":"행정 워크플로우를 자동화하는 회사 Coral이 1,250만 달러를 조달했습니다. Lightspeed와 Z47이 라운드를 주도했습니다. Coral은 현재 팩스에 의존하고 있는 환자 접수 과정을 자동화하는 작업을 하고 있습니다."},{"heading_en":"Funding Announcements","body":"임상 의사결정 지원을 위한 AI 플랫폼 Almanac Health가 1,000만 달러를 조달했습니다. F-Prime이 라운드를 주도했습니다."},{"heading_en":"Funding Announcements","body":"대기업의 효율을 높이는 AI 플랫폼 Signals가 비공개 금액을 조달하고 출범을 알렸습니다. Lightspeed가 라운드를 주도했습니다."},{"heading_en":"What I'm Reading","body":"Nature Medicine의 한 사설은 AI 도구를 뒷받침하는 근거가 도입 속도에 뒤처지고 있으며, 그 근거는 Nature Medicine 같은 과학 저널에 제시되어야 한다고 주장했습니다. 이 문장을 쓰고 나니 순환 참조 오류가 떠야 할 것 같은 기분이 들지만, 그 취지 자체에는 반대할 수 없습니다."},{"heading_en":"What I'm Reading","body":"지난 주말 WSJ의 사설은 Viz.ai의 알고리즘이 뇌졸중을 더 일찍 찾아내는 데 어떻게 도움을 주고 있는지를 조명했습니다. Viz.ai는 뇌졸중을 넘어 다른 케어 패스웨이들도 구현하며 확장하고 있는데, Microsoft를 포함한 여러 기업의 패스웨이 55개가 현재 플랫폼에서 제공된다고 인용합니다. 기사는 Viz.ai의 케어 패스웨이 사용 중 90%가 EHR 데이터로 촉발됐다고 언급하는데, 흥미로운 수치입니다. Viz.ai는 사실상 프로바이더 업무의 90%를 대체하고 있다고 말합니다."},{"heading_en":"What I'm Reading","body":"SF Standard의 한 기사는 샌프란시스코에서 연 37만 5,000달러를 버는 의사들이 급여를 늘리기 위해 AI 모델을 학습시키는 부업을 하고 있다고 조명하면서, 베이 에어리어의 높은 생활비가 많은 의사들(40%)을 그렇게 만들고 있다고 언급합니다. 기사는 또한 샌프란시스코의 중위 소득이 14만 달러라고 밝힙니다."},{"heading_en":"What I'm Reading","body":"KFF의 Larry Leavitt는 이번 주 JAMA Forum에서 건강보험사들이 우리 의료 시스템의 병폐에 책임이 있는지를 고찰했습니다. 보험사가 하는 복잡한 역할을 잘 짚어 나가면서, 우리가 이 나라의 헬스케어 지출 감독을 집단적으로 어떤 기관에 맡길 것인지를 묻습니다."},{"heading_en":"What I'm Reading","body":"Bloomberg의 John Tozzi는 Mark Cuban 등으로부터 1,000만 달러를 조달한 스타트업 Claimable의 이야기를 전했습니다. 저는 이 비즈니스 모델이 시간이 지나며 어떻게 진화해야 할지를 생각해 보는 것이 흥미롭습니다. 현재 환자들은 이의 제기 한 건당 50달러를 내고 있는데, 그것으로는 VC의 셈법이 성립하지 않으니까요. 기사는 Claimable이 앞으로의 비즈니스 모델로 제약사와 계약을 맺기 시작했다고 언급합니다. 그 움직임은 사업가로서는 논리적이면서도, 소셜미디어에서 보여 온 Cuban의 포퓰리스트적 캐릭터와는 전혀 어울리지 않아 보입니다."},{"heading_en":"HTN Content","body":"Community Brain Trust: 실적 시즌 취재, FDA의 펩타이드 규제 완화 절차 착수, 디지털 환자 동의의 법적 기준, 그 외. 여기에서 읽어 보세요."},{"heading_en":"HTN Content","body":"Weekly Health Policy Briefing: IDR 절차에서 벌어지는 진짜 공유지의 비극 상황과 주 단위 \"공공 옵션\". 여기에서 읽어 보세요."},{"heading_en":"HTN Content","body":"Health Tech Nerds Radio는 Apple, Spotify, YouTube를 비롯해 팟캐스트를 듣는 어디에서나 만날 수 있습니다.\n\n- The Grand Roundup: ACCESS에서의 디지털 헬스 대 컨슈머 헬스의 참여, 산과 케어 언번들링, Abridge와 클리니컬 인텔리전스, 대안 플랜을 뒷받침하는 쪽으로의 Yuzu의 피벗, 펩타이드 시장, 가격 투명성, AI 기반 리스크 조정 펀딩, 그 외.\n- 산과 케어 언번들링: 글로벌 지불 번들이 끝나가는 이유와 그것이 혁신, 비용, 접근성에 의미하는 것 | Neel Shah (Maven Clinic)\n- AI 스크라이빙에서 클리니컬 인텔리전스로: Abridge가 진료 전반에서 자신의 역할을 어떻게 넓히고 있는가 | Shiv Rao\n- 커넥티드 디바이스 기업이 CMMI의 ACCESS 모델에 잘 맞는 이유 | Patrick Sheehan (Withings)\n- 대안 건강보험을 만드는 일에서 그것을 뒷받침하는 일로: Yuzu가 배운 것과 피벗한 이유 | Russell Pekala & Will Gillach\n- 완화의료에 접근하는 환자가 왜 이렇게 적은지, 그리고 Empassion이 그 문제를 어떻게 풀고 있는지 | Robin Heffernan (Empassion)"}]},"39":{"index":"39","title_en":"Weekly Health Tech Reads 5/3/26","subtitle":"1분기 실적 콜 정리, Devoted가 CMS에 자신들에게 돈을 덜 달라고 요청한 일, 래디올로지스트에 관한 Apollo의 시각, Mark Cuban의 모순적인 한 주, 그리고 그 밖의 소식","sections":[{"heading_en":"","body":"👋 이번 주 일요일 헬스케어 뉴스 정리에 오신 것을 환영합니다. 이번 주 주요 헬스 시스템 CEO들이 워싱턴 DC를 방문하는 동안, 저희는 뉴스를 지켜보느라 바빴습니다. 이번 주에는 실적 발표가 많았는데, Teladoc의 흥미로운 모멘텀과 1분기에 전반적으로 좋은 성적을 낸 페이어들이 눈에 띄었습니다. Apollo의 Chief Economist는 AI와 래디올로지 시장에 관한 차트를 공유해 Health Tech Nerds 사이에서 화제를 일으켰고, 한편 Devoted의 CEO는 CMS에 업계에 돈을 덜 지급해 달라고 호소했습니다. 그 모순에 더해 Mark Cuban이 그가 가장 좋아하는 수직 통합 보험사로 보이는 Humana와 손을 잡기까지 하니, 머리가 어질어질했습니다. 여기에는 적의 적은 친구라는, 손자가 인정할 법한 전형적인 수라는 식의 이야기를 넣어야 할지도 모르겠습니다. 그런데 바로 다음 날, Cuban은 정치 지도자들에게 겁쟁이가 되지 말고 수직 통합 보험사를 해체하라고 촉구했습니다. 제가 보기에 이는 손자가 말한 또 다른 전략을 보여 주는 것 같습니다. \"한 번 승리를 가져다준 전술을 되풀이하지 말고, 무한히 변화하는 상황에 따라 방법을 조절하라.\" 여러분, 이런 걸 두고 폭이 넓다고 하는 겁니다.\n\n아, 헬스케어 뉴스를 다루는 즐거움이란!\n\n- Kevin"},{"heading_en":"Q1 EARNINGS: A busy week of earnings highlights confidence in 2026 performance and momentum ahead","body":"이번 주 실적 발표는 전반적으로 잘 진행됐습니다. 연초인 만큼 많은 실적 발표가 비슷한 기조를 따랐습니다. 1분기가 어떻게 흘러가고 있는지에 대한 자신감, 사업 궤도에 대한 만족감, 그러면서도 아직 연초라는 단서였습니다. 1분기의 폭설과 독감 관련 영향은 여전히 대부분의 콜에서 언급됩니다. 2분기 실적을 기다리며 지켜볼 만한 대목은, 몇 년간 따라잡느라 고전했던 시장이 이제 드디어 비용 트렌드 상승을 통제 범위 안에 넣고 있는지 여부입니다.\n\n전략적으로 흥미로운 시사점이라는 측면에서 제게 가장 두드러졌던 콜은 두 개, Teladoc과 Alignment였습니다. Teladoc은 사업이 전환점을 돌고 있다는 느낌이 들고 BetterHelp 보험 쪽 모멘텀이 붙고 있어서였고, Alignment는 견조한 실적이 이어졌는데도 실적 발표 후 주가가 12% 하락했기 때문입니다. 투자자들이 Alignment가 그 밸류에이션이 요구하는 규모에 얼마나 빨리 도달할 수 있을지 의문을 품고 있는 것으로 보입니다.\n\n아래 링크의 HTN Slack에 더 자세한 내용이 있고, 여기서는 이번 주 주요 콜을 간단히 정리합니다."},{"heading_en":"Q1 EARNINGS: A busy week of earnings highlights confidence in 2026 performance and momentum ahead","body":"Teladoc은 이번 주 12% 상승했고, 1분기에 전환점을 돌고 있는 것으로 보입니다. Integrated Care 세그먼트는 fee-for-service 방식 계약에 계속 적응해 나가면서 터널 끝의 빛이 보이고 있고, BetterHelp 보험 모멘텀은 확실히 체감됩니다. 1분기에 BetterHelp 보험 매출 1,300만 달러를 보고했고, 현재 ARR 7,500만 달러 수준이며, 2026년 말에는 ARR 1억 2,500만 달러에 이를 것으로 예상하고 있습니다."},{"heading_en":"Q1 EARNINGS: A busy week of earnings highlights confidence in 2026 performance and momentum ahead","body":"Alignment는 매출과 멤버십 가이던스를 상향하고 총이익과 EBITDA 가이던스의 하단도 올렸음에도, 금요일 한때 20% 하락했다가 약 12% 하락으로 마감했습니다. 콜 후반부에는 Alignment의 PPO 대 HMO 상품 접근법, 헬스 시스템과의 협상, 그리고 MA의 궤도를 바꾸려는 CMS의 시도에 관해 특히 흥미로운 전략적 대화가 오갔습니다. 주가 하락은 1분기 실적에 대한 우려라기보다, Alignment가 어느 속도로 규모를 키울 수 있는지에 대한 의문을 반영한 것으로 보입니다."},{"heading_en":"Q1 EARNINGS: A busy week of earnings highlights confidence in 2026 performance and momentum ahead","body":"Humana 주가는 1분기 의료비가 기대치보다 소폭 나은 수준으로 가고 있다고 보고한 뒤 이번 주 7% 상승했습니다. Humana는 콜을 시작하면서 자사가 예상했던 바로 그 자리에 있다고 언급했습니다. Humana는 독감과 폭설의 영향을 감안하더라도 사업 전반에서 성과가 소폭 앞서가고 있다고 보고했습니다. Humana는 2028년에 3% 마진으로 돌아가기 위해 2027년 마진 개선을 우선하면서 베네핏을 축소해야 할 것이라는 점을 좀 더 분명히 했습니다. 2분기 실적이 여기서 큰 힌트가 될 것입니다."},{"heading_en":"Q1 EARNINGS: A busy week of earnings highlights confidence in 2026 performance and momentum ahead","body":"Cigna는 1분기 기대치를 넘어서고 2026년 가이던스를 상향했음에도 이번 주 소폭 하락했으며, 스페셜티 파마와 고용주 시장으로 모델의 초점을 계속 좁혀 가고 있습니다. 2027년 ACA 시장에서 철수하고 eviCore 사업의 전략적 대안을 검토하겠다는 결정이 헤드라인을 장식했지만, 사업 전체 맥락에서 보면 전적으로 논리적으로 보였습니다. Cigna는 자사의 Clearity 코페이 전용 플랜 설계를 언급하며 고용주 세그먼트에서 시장의 관심이 강하다고 밝혔습니다."},{"heading_en":"Q1 EARNINGS: A busy week of earnings highlights confidence in 2026 performance and momentum ahead","body":"Centene 주가는 1분기 기대치를 넘고 연간 가이던스를 상향하면서 26% 상승했습니다. Medicaid 사업과 Medicare 사업 모두 기대 대비 양호한 성과를 내고 있습니다. Centene은 ACA 실버 인구에서 예상보다 높은 의료비가 발생해 2026년 ACA 사업의 세전 마진 추정치가 4%에서 3%로 낮아졌지만, 그 결과로 리스크 조정 수취액은 더 커질 것으로 예상한다고 밝혔습니다. Q&A에서는 주정부의 사기·낭비·남용 대응이 플랜에게 \"go get\"을 만들어 주고 있는지, 그 역학은 어떤지에 관한 흥미로운 대화가 있었습니다. Centene은 그런 현상을 보고 있지는 않은 듯하지만, 그런 일이 생긴다 해도 딱히 마다할 것 같지는 않아 보입니다."},{"heading_en":"Q1 EARNINGS: A busy week of earnings highlights confidence in 2026 performance and momentum ahead","body":"Tenet은 강한 1분기 실적 시즌을 보낸 뒤 소폭 상승했고, 이는 2분기 이후 가이던스를 상향할 발판을 마련해 줍니다. Tenet은 ASC에 자본을 투입하는 속도가 계획보다 앞서 있습니다. 이번 분기에 총 1억 2,500만 달러로 ASC 7곳을 인수했고, 신규 지점 3곳도 열었습니다. Tenet은 익스체인지의 영향으로 불리한 페이어 믹스 변화가 있었다고 밝혔지만, 전체적으로 매니지드 케어 세그먼트가 매출 비중 측면에서 그렇게 크게 달라지지는 않은 것으로 보입니다. Tenet의 CEO는 애널리스트들의 질문이 이어진 뒤, 세그먼트 전반에서 기저의 페이어 믹스와 중증도 믹스 변화가 어떻게 되고 있는지에 대해 투자자 커뮤니티가 더 명확한 설명을 원하고 있는 것이 분명하다고 언급했습니다."},{"heading_en":"Q1 EARNINGS: A busy week of earnings highlights confidence in 2026 performance and momentum ahead","body":"이번 1분기 실적 관련 저희 커버리지 전체는 HTN Slack에서 확인하세요."},{"heading_en":"MUSING: Why is a Medicare Advantage plan CEO telling CMS to pay MA plans less?","body":"Devoted Health의 CEO Ed Park이 드물게 공개 석상인 Medicarians 무대에 올랐는데, 아래의 묘한 발언으로 제 주의를 확실히 사로잡았습니다.\n\n❝ 정부가 그냥 MA 플랜에 돈을 덜 지급했으면 좋겠습니다.\n\n- Devoted Health CEO, Ed Park\n\n이 발언은 Med City News의 Arundhati Parmar와 한 인터뷰에서 나왔고, 전체를 다 볼 만한 가치가 충분합니다. 혹시 맥락이 잘려 나간 것 아닌가 걱정하실까 봐 덧붙이면, Park은 그 말에 이어 \"헤드라인으로 뽑아 주세요. 저희는 각오가 되어 있습니다\"라고 했습니다.\n\n좋습니다, 그 요청에 응하겠습니다.\n\n말할 것도 없이 MA 업계 협회들은 이 발언에 머리를 긁적이고 있을 것 같습니다. 제가 특히 궁금한 이유는, 지금 이 순간 수익성을 두고 가장 걱정해야 할 MA 플랜이 Devoted라는 주장도 충분히 합리적으로 펼 수 있다고 보기 때문입니다. 아래 사실관계를 보시죠.\n\n- Devoted Health는 2026년 멤버십을 120% 이상 늘려 1월 기준 46만 6천 명에 도달했습니다. 제가 알기로 올해 업계 전체 MA 플랜 가운데 단일 최고 성장률 아닌가요?\n- Devoted의 이사회 멤버 Bob Kocher는 Humana가 2026년 과도한 멤버십 성장 때문에 무너질 것이라고 공개적으로 예측했습니다(Humana는 약 20% 성장했습니다). 신규 멤버에 따르는 손실을 감안해 업계의 많은 이들이 이 예측에 동의했습니다.\n- Endpoints는 이번 주 Devoted가 가격과 베네핏을 전략적으로 조정해야 했던 탓에 2025년에 축소됐다고 전했습니다. 이는 2024년에 빠르게 성장한 뒤의 일이니, 그리 멀지 않은 과거에 이 역학과 씨름했음을 시사하는 것으로 보입니다.\n- 제 계산으로는 Devoted의 현재 기업가치를 MA 가입자 한 명당으로 환산하면… 상장 비교기업 대비… 높습니다.\n\n물론 Devoted의 경영진도 이런 역학을 모두 잘 알고 있을 것입니다. 그렇다면 도대체 무슨 일이 벌어지고 있는 걸까요? Ed Park이 더 나은 헬스케어를 위해 회사의 이익을 희생할 용의가 있다고 말하며 Zeke Emanuel에게 답을 보내고 있는 걸까요? 저는 여기서 벌어지는 일이 딱 그것은 아니라고 봅니다.\n\n위 인터뷰를 듣고, Devoted Medical Group의 채용에 관한 최근 뉴스레터 단상과 점을 이어 보면 답은 이런 것 같습니다. Devoted는 자신을 기술 플랫폼 덕분에 그 누구보다 총 케어 비용을 잘 관리하는 메디컬 그룹으로 보고 있다는 것입니다. 오늘날 돈을 버는 방식이 그렇다 해도, 스스로를 Medicare Advantage 플랜으로 보지 않습니다. 기술 플랫폼 Orinoco에 힘입은 Devoted Medical Group이야말로 시장을, 심지어 어쩌면 특히 디플레이션 국면의 시장에서 앞서 나가게 해 줄 요소라는 것입니다.\n\n위 인터뷰에서 Park이 전체 헬스케어 달러를 확보하고 관리하기 위해 MA 플랜이 필요하다고 말하는 대목을 들으면, 그 내러티브가 드러나는 것을 알 수 있습니다. Devoted가 여기서 성공한다면 몇 년 뒤 우리는 이 회사를 MA 플랜으로 이야기하지 않을 것입니다. 여러 보험 상품을 통해 헬스케어 달러 전체를 관리하는 새로운 케어 딜리버리 생태계로 이야기하게 될 것입니다. 밸류에이션도 그런 그림을 가리키는 것으로 보입니다. 최근 투자자들에게 성공적인 결말은 이 회사가 독립 기업으로 남아 UHG의 더 현대적인 버전이 되는 것뿐인 방식으로 가치가 매겨진 듯합니다. 그것이 여기서의 최종 목표일 수밖에 없습니다. 확실히 야심 차고 문샷에 가까운 발상입니다.\n\n그렇게 보면, MA CEO가 정부에 돈을 덜 달라고 말하는 낯선 장면만 넘어서고 나면, Devoted는 디플레이션 시장이 오히려 그 비전을 달성할 가능성을 높인다고 생각하고 있을 것 같습니다."},{"heading_en":"CHART OF THE WEEK","body":"Apollo가 이번 주에 스스로 \"래디올로지스트 패러독스\"라고 부르는 것을 보여 주는 차트를 공유했습니다. Slack에서도 이야기가 나왔듯, Apollo의 Chief Economist는 전체 이야기보다는 특정한 이야기를 전하는 차트를 만드는 데 무게를 뒀을 수도 있습니다. 그럼에도 세계 최대 투자사 중 한 곳의 Chief Economist가 이 이야기를 선택해 전하고 있다는 점에서, 한 번 멈춰 볼 만하다고 생각합니다.\n\n헬스케어 바깥에서 래디올로지스트를 AI 영향의 일종의 \"탄광 속 카나리아\"로 여기며 매혹되는 현상이 저는 꽤 흥미롭습니다.\n\n그 밑에 깔린 이야기는 더 흥미롭습니다. Ben White는 몇 달 전 훌륭한 블로그 글에서, 래디올로지 시장의 역학은 사실상 AI와는 아무 상관이 없고 수십 년간 존재해 온 기저의 수요·공급 역학이 전부라는 주장을 폈습니다. 앞으로 10년 동안 저 차트가 (어떤 축을 골라 그리든) 어떤 모습일지 생각해 보는 것은 흥미로운 사고 실험이 될 것 같습니다."},{"heading_en":"Other Top Headlines","body":"Mark Cuban Cost Plus Drugs와 Humana의 CenterWell Pharmacy가 새로운 파트너십을 발표했습니다. 한편으로 이는 시장 점유율 확보에 고전하는 스타트업이 규모를 갖춘 플레이어와 손잡고 그 규모를 활용하는, 꽤 단순한 파트너십으로 보입니다. 다른 한편으로는, 수직 통합 헬스케어를 헬스케어 모든 문제의 근원으로 보는 듯한 Cuban이 어떻게 수직 통합 보험사와 손을 잡게 되었는지 다소 혼란스럽다는 점을 인정해야겠습니다. 어쩌면 Cuban은 강연장을 돌며 헬스케어에 관한 포퓰리즘적 상투어를 옮기느라 너무 바빠서 신경 쓸 겨를이 없는지도 모릅니다. Cuban은 이번 주에도 또 다른 행사에 나가 의원들에게 \"겁쟁이가 되지 말라\"며 Break Up Big Medicine Act를 통과시키라고 말한 것으로 전해집니다."},{"heading_en":"Other Top Headlines","body":"Cigna가 2027년 ACA 시장에서 철수하고 eviCore에 대해 전략적 대안을 모색하고 있습니다. 실적 콜에서 언급됐듯, Cigna는 스페셜티 파머시와 고용주 사업을 중심으로 핵심 초점을 계속 정리해 나가고 있습니다. 스페셜티 파마·고용주 세그먼트의 모멘텀과 ACA 및 사전승인 영역의 불확실성 사이에서, 이런 결론에 이르게 한 내부 전략 논의가 어떤 것이었을지 상상하기는 어렵지 않습니다. eviCore에 관한 코멘트가 특히 흥미로웠는데, Cigna는 업계가 사전승인 자동화에서 상당한 진전을 이룬 것을 핵심 요인으로 지목했습니다. eviCore의 비즈니스 모델이 증발해 가고 있는 것으로 들리며, Cigna는 파트너십이나 \"다른 보완적 업계 참여자와의 결합\"이 나올 수 있다고 언급했습니다."},{"heading_en":"Other Top Headlines","body":"주요 헬스 시스템 CEO 몇 명이 이번 주 Ways and Means Committee 앞에서 열린 통상적인 전시성 청문회를 위해 DC로 불려 갔습니다. HCA, CommonSpirit, New York Presbyterian, ECU Health의 CEO들과 Protect Our Care의 President가 발언했습니다. HealthcareDive가 그 대화를 잘 정리해 주었는데, 모든 면에서 꽤 표준적인 이야기 흐름이었던 것으로 보입니다."},{"heading_en":"Other Top Headlines","body":"Washington Post는 CMS가 플로리다주의 state-directed payment 프로그램을 조건부 승인했다고 보도했습니다. 이 주제는 지난주 HCA의 실적 콜에서도 다뤄졌는데, HCA는 승인에 따르는 잠재적으로 상당한 매출 상승 여지를 언급했습니다. 왜 이렇게 오래 걸리느냐는 애널리스트들의 질문에도 HCA는 성사될 것이라고 자신하는 모습이었습니다."},{"heading_en":"Other Top Headlines","body":"HISTalk은 OpenEvidence가 규제 불확실성 때문에 영국과 EU 시장에서 임상 AI 검색 제품을 철수했다고 보도했습니다."},{"heading_en":"Other Top Headlines","body":"네브래스카가 이번 주 미국에서 처음으로 근로 요건을 시행한 주가 되었습니다."},{"heading_en":"Funding Announcements","body":"헬스 시스템용 AI 이미징 플랫폼 Aidoc이 1억 5,000만 달러를 조달했습니다. Growth Equity at Goldman Sachs Alternatives가 라운드를 주도했습니다. Aidoc은 현재 전 세계 2,000개 병원에 배포되어 6,000만 명의 환자에 대한 임상 의사결정을 지원하고 있습니다."},{"heading_en":"Funding Announcements","body":"처방전 마켓플레이스 Photon이 1,600만 달러를 조달했습니다. Healthier Capital이 라운드를 주도했습니다. Hospitalogy가 이번 주 Photon에 대한 강세론을 잘 정리했는데, 오늘날 Surescripts가 지배하는 전자처방 프로세스를 다시 생각해 보는 데 초점을 맞췄습니다."},{"heading_en":"Funding Announcements","body":"지역사회 기반 약국 네트워크 Truentity가 350만 달러를 조달했습니다. Evidenced VC가 라운드를 주도했습니다. Truentity는 기존 약국 인프라를 활용해 소외 지역을 위한 케어 모델을 구축하려는 RHTP 노력과 발을 맞추고 있는 것으로 보입니다."},{"heading_en":"Funding Announcements","body":"사전 케어 계획 소프트웨어 플랫폼 Koda Health가 최근 700만 달러 규모 시리즈 A 라운드의 일환으로 UPMC로부터 추가 투자를 유치했다고 발표했습니다."},{"heading_en":"What I'm Reading","body":"RWJF의 글이 오프익스체인지 플랜의 성장을 살펴보며, 내년에는 이들이 온익스체인지 플랜을 앞지를 수 있다고 전망합니다. 이 플랜들의 성장이 ICHRA 시장에 대한 보험사들의 낙관을 보여 준다는 주장입니다."},{"heading_en":"What I'm Reading","body":"아주 똑똑한 저자들(Alon Bergman, Bob Wachter, Zeke Emanuel)이 쓴 이 JAMA 관점 글은, AI를 의료기기처럼 평가하는 대신 의사처럼 면허를 부여하는 방식으로 규제 위기를 푸는 새로운 AI 면허 체계를 어떻게 도입할 수 있을지 탐색합니다."},{"heading_en":"What I'm Reading","body":"Myoung Cha가 Apple의 가장 큰 영향은 건강 분야라는 Tim Cook의 발언을 돌아보는 좋은 글을 썼습니다. 이를 뒷받침할 P&L 상의 정당화를 끝내 찾지 못했음에도 Apple이 그것을 어떻게 이뤄냈다고 그가 보는지도 다룹니다."},{"heading_en":"What I'm Reading","body":"Bloomberg는 비용 때문에 고용주가 제공하는 보험을 포기한 어느 건강한 가족의 이야기를 조명했습니다. 부모는 Zion Healthshare를 선택하고 아이들은 뉴욕주의 무료 CHIP으로 옮겼습니다."},{"heading_en":"What I'm Reading","body":"Virtue VC 팀이 계리적 언더라이팅 기회에 관한 자신들의 테제를 공유했습니다. 저 역시 파머시, ACO, 수술 에피소드, 의료과실, 스톱로스 전반에서 언더라이팅을 다시 생각해 볼 흥미로운 기회가 있어 보인다는 데 동의합니다."},{"heading_en":"HTN Content from the Week","body":"Community Brain Trust: 새로 분석된 주산기 정신건강 연구 이해하기, RTM 문서화 베스트 프랙티스, Slack에서의 1분기 실적 커버리지 등."},{"heading_en":"HTN Content from the Week","body":"Weekly Health Policy Briefing: 네브래스카의 커뮤니티 참여 요건 시행을 지켜보는 가운데, Devoted는 겉보기에 모순되는 헤드라인들 사이를 헤쳐 나가고 있고, Virtue는 새로운 계리 인프라 레이어에 관한 가설을 내놓습니다."},{"heading_en":"HTN Content from the Week","body":"Health Tech Nerds Radio는 Apple, Spotify, YouTube 및 팟캐스트를 듣는 곳 어디에서나 들으실 수 있습니다.\n\n- The Grand Roundup: 1분기 실적, 행동건강 시장, ACCESS를 다루는 Pair Team과 Bold, MA 브로커의 미래, Epic AI 대 스타트업, AI 처방 등.\n- 행동건강의 현주소: 수요, 공급, 다이렉트-투-컨슈머, 그리고 부상하는 치료법 | Alli Oakes (Trilliant Health)\n- AI와 ACCESS: Pair Team이 전인적 케어를 더 넓은 인구로 확장하는 방법 | Neil Batlivala\n- MA 브로커리지의 진화: 물량에서 리텐션으로, 그리고 그다음은 | Patrick Keavy & Rebecca Springer (Bailey & Company)\n- ACCESS가 오리지널 Medicare를 위한 혁신적 디지털 케어 모델을 여는 방법 | Amanda Rees (Bold)"}]},"41":{"index":"41","title_en":"Weekly Health Tech Reads 5/10/26","subtitle":"1분기 실적 발표가 알차게 이어진 한 주, 대부분의 상장 주식이 오름세를 탔고(agilon은 100% 상승!), MinuteClinic / Mass General Brigham 파트너십을 짚어 보며, 그 밖에도 많은 소식","sections":[{"heading_en":"Sponsored by: Champ AI","body":"스폰서: Champ AI\n\n헬스케어 운영 팀은 크리덴셜링, 자격 확인, 클레임 후속 처리를 위해 페이어 포털과 라이선스 위원회, 전화 안내를 헤매는 데 엄청난 시간을 씁니다.\n\nChamp AI는 API가 닿지 못하는 영역을 자동화합니다. 이들의 에이전트는 크리덴셜링 플랫폼, 클리어링하우스, 페이어 포털을 넘나들며 처음부터 끝까지 일을 처리합니다. 로그인하고, MFA를 통과하고, 데이터를 추출해 채워 넣고, 아웃바운드 전화를 겁니다. 포털 UI가 바뀌면 에이전트가 알아서 적응합니다. 몇 주 만에 실서비스로 갈 수 있고, 엔지니어링 투입은 필요하지 않습니다.\n\nHIPAA와 SOC 2를 준수합니다. Redpoint Ventures가 투자했습니다. 선도적인 정신건강 기업들이 신뢰하고 쓰고 있습니다. 어떻게 작동하는지 확인해 보세요.\n\n뉴스레터 스폰서십에 관심이 있으시면 알려 주세요!"},{"heading_en":"Q1 EARNINGS RUNDOWN","body":"1분기 실적 발표가 몰린 한 주가 전반에 걸친 안정적인 운영 성과를 보여 줍니다\n\n이번 주에는 1분기 실적 발표가 알차게 이어졌고, 대다수 기업이 강한 1분기를 보고하며 주가가 10% 넘게 올랐습니다. 그리고 의미 있게 하락한 유일한 기업인 Privia조차 사업 측면에서는 견실한 분기를 보고했습니다. 몇 년간 공개 시장이 요동친 끝에, 전반적으로 기업들이 1분기 결과에 만족감을 느낀 것으로 보입니다.\n\n좀 더 흥미로웠던 실적 발표 몇 가지를 꼽아 보면 이렇습니다."},{"heading_en":"Q1 EARNINGS RUNDOWN","body":"agilon 주가는 1분기에 큰 폭으로 기대를 웃돌면서 한 주 동안 거의 100% 올랐습니다. 한 애널리스트는 언제 \"다시 공세로 돌아설\" 것인지 물었는데, 이 질문이 콜 전체의 분위기를 잘 보여 줍니다. agilon은 필요한 데이터 인프라와 임상 모델을 갖춘 것으로 보이고, 그것이 실행에 도움이 되고 있습니다. 조직 내 AI의 영향에 대한 애널리스트의 질문, 그리고 agilon이 그 영향을 P&L의 opex 쪽보다 매출 성장 / 메디컬 매니지먼트 쪽에서 더 크게 보고 있다는 점이 눈에 띕니다. agilon은 그 예로 자사의 심부전 관리 프로그램을 들었습니다. 일반적으로 신규 심부전 진단의 40~50%가 입원 이후에 이뤄지는데, agilon은 리스크 층화 역량 덕분에 그 수치를 5%까지 낮췄다는 것입니다."},{"heading_en":"Q1 EARNINGS RUNDOWN","body":"Evolent는 여러 건의 계약 수주와 분기 중 견실한 성과를 발표하며 14% 올랐습니다. 회사는 자사 사업을 \"두 도시 이야기\"라고 표현했습니다. 종양학에서의 강한 성장이 전체 내러티브를 이끄는 한편, 다른 전문과들은 AI 자동화에서 기회를 보고 있다는 것입니다. Evolent는 자사가 오늘날 종양학 시장의 10%에 불과하고 50%는 여전히 페이어가 내재화하고 있다고 밝히면서, 종양학 시장의 복잡성을 감안할 때 외부 파트너를 찾는 페이어가 점점 늘어날 것으로 예상한다고 했습니다."},{"heading_en":"Q1 EARNINGS RUNDOWN","body":"Privia는 사업에서 강한 성과를 낸, 매우 Privia다운 분기를 보냈음에도 이번 주 7% 가까이 하락했고, 애널리스트들은 왜 아직 가이던스를 올리지 않는지 궁금해하는 듯했습니다. VBC는 내러티브에서 계속 더 큰 역할을 하고 있고, Privia는 MA에서의 기회를 이야기했습니다. 다만 여전히 리스크를 나눈다는 자사의 철학을 중심에 두고 있습니다. 흥미롭게도 Privia는 사업 개발 파이프라인이 탄탄하다고 밝혔고, 매도자들이 선택지가 많지 않다는 것을 깨달으면서 밸류에이션이 내려올 때까지 시장을 기다릴 수 있다고 사실상 느끼고 있습니다."},{"heading_en":"Q1 EARNINGS RUNDOWN","body":"Oscar는 강한 1분기와 2026 회계연도 전망 재확인 이후 15% 올랐습니다. Oscar의 초기 결과가 어떤 지표가 된다면, 2026년 ACA에 대한 종말론적 시각은 현실이 되지 않았습니다. 이환율과 가입자 수 축소가 모두 Oscar에게는 순풍으로 바뀌고 있기 때문입니다. Lucie는 새로운 전략적 성장 이니셔티브인데 — +Oscar는 계속 뒤로 물러나고 있습니다 — 경쟁 플랜들을 Lucie에 올려서 대기업들이 네트워크 규모에 대해 갖는 우려를 덜어 주려는 시도입니다. 직원들이 고를 수 있는 좁은 네트워크 플랜이 많으면 결국 가장 넓은 단일 보험사 PPO 네트워크보다 더 넓은 네트워크가 된다는 것이 기본 아이디어입니다. ACA 사업이 아무리 잘 나가고 있어도, 여기서 ICHRA 내러티브는 제게는 여전히 덜 다듬어진 느낌입니다."},{"heading_en":"Q1 EARNINGS RUNDOWN","body":"CVS는 사업 전반의 강한 모멘텀을 강조하며 10% 올랐습니다. Aetna와 Pharmacy and Consumer Wellness 부문의 개선에 힘입어 2026년 EPS 가이던스를 상향했습니다. CVS는 올해 하반기 출시 예정인 AI 네이티브 소비자 프론트 도어 마켓플레이스 Health 100을 다시 한번 강조했습니다. CVS가 소비자 헬스 테크놀로지 기업이 되겠다고 강조해 온 만큼, 출시됐을 때 그것이 어떤 모습일지 무척 궁금합니다."},{"heading_en":"Q1 EARNINGS RUNDOWN","body":"이번 주의 그 밖의 실적 발표: Clover(주간 16% 상승), Astrana(14% 상승), Hinge(22% 상승), Omada(2% 하락), Surgery Partners(거의 보합), Ardent Health(거의 보합), Lifestance(2% 상승), Amwell(30% 상승). 참고로 Molina도 금요일에 인베스터 데이를 열었는데, Martin이 Slack에서 깊이 파고들었고 다음 주에 더 시간을 들여 다룰 예정입니다.\n\n실적 콜 논의는 저희 Slack 채널에서 더 깊이 들어가 보세요."},{"heading_en":"MUSING: What is access to primary care worth in Massachusetts?","body":"이곳의 정기 독자라면 Massachusetts가 프라이머리 케어 접근성과 관련해 여러 어려움에 직면해 있다는 것을 아실 겁니다. KFF는 올해 초, 이 지역 환자들이 PCP, NP, PA와의 신규 환자 진료를 잡으려면 1년 반에서 2년을 기다려야 한다고 짚었습니다.\n\n그런 맥락에서, 지난 주말 Med City News가 Massachusetts Health Policy Commission이 CVS MinuteClinic과 Mass General Brigham 사이의 파트너십 가능성을 그리 반기지 않는 것으로 보인다고 짚은 것이 흥미로웠습니다. 이 파트너십에 따르면 MinuteClinic 지점들이 MGB의 ACO에 합류하고, MinuteClinic은 기존의 컨비니언스 케어 서비스에 더해 프라이머리 케어 서비스에 대해서도 청구를 시작하게 되는데, 전부 MGB의 수가로 이뤄집니다(다시 말해 훨씬 높은 수가로). MHPC 분석에 따르면 이 파트너십은 보수적으로 잡아도 헬스케어 비용을 연간 4,000만 달러가량 늘리게 됩니다. 그 증가를 이끄는 핵심 요인은 다음과 같습니다.\n\n출처: HTN 분석; MHPC 데이터\n\n자, 위 분석을 보면 비용을 밀어 올리는 요인은 사실상 두 가지입니다. 첫째, 이전에 PCP가 없던 3만 4,000명이 PCP에 접근할 수 있게 되는데, MHPC에 따르면 MGB에 PCP를 둔 상용 보험 환자는 클레임과 퀄리티 지급액을 합쳐 PCP가 없는 환자보다 연평균 815달러를 더 씁니다. 이것이 비용 증가분 가운데 거의 2,800만 달러를 차지합니다.\n\n나머지는 컨비니언스 케어의 가격 인상 — MGB 수가로 더 많이 청구하게 될 CVS 지점들 — 과, CVS가 일부 용량을 프라이머리 케어로 옮기게 되면서 다른 곳에서 이뤄져야 할 진료 사이에 꽤 고르게 나뉩니다.\n\nMinuteClinic이 Massachusetts에서 가장 저렴한 컨비니언스 케어 선택지라는 점을 불리하게 삼으면서, 동시에 사람들이 더 비싼 다른 프로바이더로 가야 하기 때문에 비용이 올라간다고 지적하는 것은 제게는 다소 이중 계산처럼 보입니다. 아래 차트는 MPHC 리포트에서 가져온 것으로, MinuteClinic의 주요 서비스에 대한 MinuteClinic 가격과 MGB 가격의 차이를 보여 줍니다. 놀랍지 않게도 MinuteClinic은 대체로 맨 아래에, MGB는 대체로 맨 위에 있습니다.\n\n헬스케어 비즈니스와 여기 걸린 철의 삼각형식 트레이드오프에 대한 301 수준의 사례 연구를 찾고 있다면 전체 리포트를 훑어볼 만합니다. 한발 물러서서 MinuteClinic을 운영하는 사람의 입장이 되어 보면, 여기서 무엇을 해야 할까요? 한 시장에서 가장 저렴한 컨비니언스 케어 클리닉을 운영하는 것이 꼭 가장 수익성 높은 케어 딜리버리 모델은 아닐 것 같습니다. MinuteClinic이 어떤 조직과 파트너십을 맺고 싶어 할 이유도, MGB가 파트너로 매력적인 이유도 상상이 됩니다. 그리고 주 정부가, 특히 파트너가 MGB라는 점에서 전적으로 반기지는 않는 이유도 상상이 됩니다."},{"heading_en":"QUOTE OF THE WEEK","body":"지난 금요일 늦게 North Carolina의 WakeMed / Atrium 합병이 예기치 않게 드러난 뒤, WakeMed의 CEO가 화요일 기자회견에 나와 상황을 설명했습니다. The Assembly의 보도에 따르면, 이 거래가 실제로 환자의 비용을 줄여 줄 것인지와 부담 가능성 우려에 대해 기자들이 몰아붙이자 그의 대답은 이랬습니다.\n\n\"비싸다는 게 뭔지는 어떻게 정의하느냐에 달렸습니다.\"\n\n- WakeMed CEO Donald Gintzig, WakeMed / Atrium 거래가 비용을 줄일 것인지 추궁받았을 때, The Assembly 보도\n\nWakeMed와 Atrium은 이 거래를 2년 동안 비공개로 협상해 온 것으로 보이며, 보도자료는 이 파트너십이 WakeMed가 운영되는 카운티에 20억 달러 투자와 3,300개 일자리 창출을 가능하게 할 것이라고 밝힙니다. 그럼에도 이런 접근 방식은 시장에 상당한 우려를 불러일으킨 것으로 보이는데, North Carolina 주 재무관을 비롯한 이들이 이 거래가 헬스케어 비용에 미칠 영향에 대해 우려를 표했습니다. 위와 같은 발언이 그 우려를 덜어 주는 데 조금이라도 도움이 될 것 같지는 않습니다.\n\nAHA가 이번 주 헬스케어 비용 상승에 대한 \"병원 탓\" 내러티브가 틀렸다고 주장하려 하는 가운데 — 이에 대해서는 아래에서 더 다룹니다 — 이런 과정과 발언이 AHA의 주장을 딱히 뒷받침해 주는 것 같지는 않습니다."},{"heading_en":"Other Top Headlines","body":"South Dakota에 기반을 둔 Sanford Health가 이번 주 North Memorial과 합병할 의향을 발표하며 Minneapolis 시장 진입이라는 자신들의 명백한 사명을 향해 한 걸음 내디뎠습니다. 이 움직임은 Sanford가 Fairview를 인수해 이 주에 진입하려다 실패한 지 3년 만에 나왔습니다. Minneapolis의 North Memorial과 HCMC는 둘 다 심각한 재무 문제를 겪고 있고, Sanford는 그동안 자신들의 진입 시도에 저항해 온 시장에 들어갈 기회를 본 것으로 보입니다. Sioux Falls 현지 보도에 따르면 North Memorial은 잠재적 합병 파트너로 22개 조직에 접촉했는데 Sanford Health는 그 초기 명단에 들어 있지도 않았다고 하니, 이 결과가 얼마나 가능성 낮은 일이었는지를 짐작하게 합니다."},{"heading_en":"Other Top Headlines","body":"WHOOP가 WHOOP 앱을 통한 온디맨드 화상 진료를 추가하고 있습니다. 이 시점에서 WHOOP가 임상 영역에서 상당한 기회를 보고 있다는 것은 꽤 분명해 보입니다. WHOOP의 ACCESS 모델 참여와, \"헬스케어, 나아가 Medicare 시장으로 의미 있게 확장하며 소비자와 임상 세계를 잇는\" 기회를 강조한 최근 투자 라운드를 놓고 보면 그렇습니다. 이 여정이 어떻게 흘러가는지 꽤 관심을 갖고 지켜볼 생각입니다. Apple Health의 여정과 그것이 마주했던 비즈니스 모델의 어려움을 돌아본 Myoung Cha의 최근 블로그 글과 나란히 놓고 여기서의 모델을 생각해 보면 특히 흥미롭습니다. 기회는 분명히 있습니다."},{"heading_en":"Other Top Headlines","body":"같은 D2C 웨어러블 쪽에서, Google이 Fitbit Air를 발표했습니다. WHOOP와 꽤 많이 닮아 보이는 웨어러블입니다. 소매가는 99달러이고, Stephen Curry 스페셜 에디션은 129달러에 살 수 있습니다."},{"heading_en":"Other Top Headlines","body":"Roche가 AI 병리 스타트업 PathAI를 최대 10억 5,000만 달러에 인수한다고 발표했습니다. 선지급 7억 5,000만 달러와 언아웃 3억 달러가 포함됩니다. 두 회사는 원래 2021년에 파트너십을 맺었습니다."},{"heading_en":"Other Top Headlines","body":"스태핑 회사 Cross Country Healthcare가 비상장으로 전환합니다. PE 회사 Knox Lane이 4억 3,700만 달러를 지불해 인수합니다."},{"heading_en":"Other Top Headlines","body":"Carlyle이 RCM 회사 두 곳, Knack RCM과 EqualizeRCM을 인수해 AI 네이티브 RCM 플랫폼을 만듭니다."},{"heading_en":"Funding Announcements","body":"Nitra가 2028년까지 200억 달러의 확약 금융을 발표했습니다. 미국 전역에 8,000개 개인 병원을 키워 내는 데 쓰일 자금입니다. Nitra는 독립 의료를 미국 헬스케어의 근간으로 삼아 전국적으로 지원한다는 취지의 \"Future of Care Initiative\"를 시작합니다. Nitra의 고객 명단에는 피부과, 비뇨기과, 안과, 메드스파, 에스테틱 클리닉이 포함되는데, 이 나라에서 독립 의료를 지원해야 한다고 할 때 제가 떠올리는 진료과 목록과 꼭 같지는 않습니다. 다만 여기서 재무적 기회는 꽤 단순명료해 보입니다."},{"heading_en":"Funding Announcements","body":"홈 헬스 기관을 위한 AI 플랫폼 Enzo Health가 2,000만 달러를 조달했습니다. N47이 라운드를 리드했습니다. 보도자료는 Enzo가 출시 24개월 만에 매출을 40배로 키웠고, 연간 50만 명의 환자를 보는 기관들과 일하고 있다고 밝힙니다."},{"heading_en":"Funding Announcements","body":"제약 / 라이프 사이언스를 위한 AI 플랫폼 Dandelion Health가 1,600만 달러를 조달했습니다."},{"heading_en":"Funding Announcements","body":"소아 언어치료, 작업치료, 물리치료 모델인 Village가 950만 달러를 조달했습니다. Upfront Ventures가 라운드를 리드했습니다. The Village는 400명의 프로바이더 네트워크와 여러 페이어와의 계약을 갖고 있습니다."},{"heading_en":"Funding Announcements","body":"행정 낭비를 줄이는 AI 운영 플랫폼 XCaliber Health가 650만 달러를 조달했습니다. ManchesterStory가 라운드를 리드했습니다."},{"heading_en":"Funding Announcements","body":"주택 개조에 초점을 맞춘 에이징 인 플레이스 모델 Rosarium Health가 600만 달러를 조달했습니다. Kalos Ventures가 라운드를 리드했습니다. Rosarium은 California와 북동부에서 MA 및 Managed Medicaid 플랜과 일합니다. 현재 120만 명의 Medicare, Medicaid 가입자에 대해 인네트워크이며, 연말까지 400만 명으로 늘어날 것으로 예상합니다."},{"heading_en":"Funding Announcements","body":"의료 코딩 플랫폼 Fathom이 CVS Ventures로부터 자금을 조달했습니다."},{"heading_en":"What I'm Reading","body":"OpenAI가 환자를 돕는 데 AI가 최대한 활용되도록 하려면 어떻게 해야 하는지에 대한 자사의 관점을 담은 백서를 공유했습니다. 지금 그 주제를 둘러싼 논의가 한창인 만큼 특히 규제 제안 섹션이 흥미로운데, 주 정부가 AI가 케어 딜리버리에 통합되는 방식을 감독하고 연방 정부는 AI를 의료기기로서 감독해야 한다고 제안합니다."},{"heading_en":"What I'm Reading","body":"의사인 Dr. Danielle Ofri가 NYTimes에 임상의와 비교했을 때 AI가 할 수 없는 것에 대한 의견을 밝혔습니다. 요컨대 환자를 둘러싼 인간적 맥락을 해석하는 일입니다."},{"heading_en":"What I'm Reading","body":"WSJ 편집위원회가 340B 프로그램을 강하게 비판했습니다. WSJ 편집위원회는 최근 강경한 의견을 이어 가고 있는데, 이번에는 340B 프로그램을 \"최악의 형태의 정부 이권 챙기기\"라고 표현했습니다."},{"heading_en":"What I'm Reading","body":"Zack Cooper가 이번 주 NY Times에 병원이 미국의 높은 가격을 이끄는 가장 큰 비용 요인이며 이 문제를 더 많이 논의해야 한다는 의견을 밝혔습니다. AHA는 이에 반발해 \"병원 탓\" 내러티브가 틀렸다고 주장하며 반박했습니다."},{"heading_en":"What I'm Reading","body":"JAMA 아티클이 병원의 컨설턴트 활용을 살펴봤습니다. 2010~2022년 사이에 처음으로 컨설팅 회사를 이용한 비영리 병원 306곳을 대상으로, 컨설턴트를 쓰지 않은 병원 513곳과 form 990 데이터를 기반으로 성과를 비교했습니다. 비영리 병원들은 컨설턴트에게 평균 1,570만 달러를 지불했고, 총 78억 달러를 썼습니다."},{"heading_en":"What I'm Reading","body":"고용주가 부담하는 GLP-1 비용에 관한 Business Group on Health의 설문에 따르면, 고용주의 67%가 현재 체중 감량용 GLP-1을 제공하고 있으며, 그 가운데 10%는 비용을 감안할 때 2027년에는 보장을 이어 가지 않을 가능성이 높습니다."},{"heading_en":"What I'm Reading","body":"Brendan Schwartz가 PE 투자를 받은 정형외과 MSO를 흥미롭게 파고들었습니다. PE 투자 사례의 경제 구조, 최근 들어 그것이 왜 더 어려워졌는지, 그리고 앞으로의 잠재적 기회 경로를 정말 잘 짚어 냅니다."},{"heading_en":"What I'm Reading","body":"Olivia Webb Kosloff와 Lawson Mansell이 미국의 의사 공급 문제에 대해 짧은 인터뷰를 했습니다. 요즘 AI 진영의 논의는 헬스케어에 인적 자본 문제, 즉 의사 공급 부족 문제가 있다는 전제를 중심으로 많이 돌아갑니다. Mansell은 그 밖의 몇 가지 대안을 잘 짚어 줍니다."},{"heading_en":"HTN Content of the Week","body":"Weekly Health Tech Reads: 1분기 실적 콜 총정리, Devoted가 CMS에 자기들에게 돈을 덜 달라고 요청하다, 방사선과 의사에 대한 Apollo의 시각, Mark Cuban의 모순적인 한 주, 그 밖의 소식."},{"heading_en":"HTN Content of the Week","body":"Community Brain Trust: 병원 컨설팅은 성과를 내는가, AI가 왜 생산성 지표를 움직이지 못하는가, 계속되는 1분기 실적 시즌, 5월 HTN 밋업 오픈, 그 밖의 소식."},{"heading_en":"HTN Content of the Week","body":"Health Tech Nerds Radio는 Apple, Spotify, YouTube를 비롯해 팟캐스트를 듣는 곳 어디에서나 들을 수 있습니다.\n\n- The Grand Roundup: Devoted의 장기 베팅, Anthropic의 AI 서비스 회사, 1분기 실적, 헬스케어 금융 인프라, 유전자 치료 엑시트, 헬스케어에 대한 대중의 신뢰, NC 주 건강보험 플랜의 반등, 그 밖의 소식\n- 레비뉴 사이클의 근본 문제, 데이터 파편화 해결하기 | Eliana Berger (Joyful Health)\n- Kelonia의 엑시트 여정이 세포·유전자 치료에 의미할 수 있는 것 | Bryan Roberts (Venrock)\n- 헬스케어 부담 가능성, 하락하는 신뢰, 그리고 개혁의 현실 | Natalie Davis (United States of Care)\n- The NC State Health Plan: 매니지드 케어, 베네핏 설계, 헬스케어 부담 가능성에 관한 사례 연구 | Brian Miller (NC State Health Plan)"}]},"42":{"index":"42","title_en":"Weekly Health Tech Reads: 5/17/26","subtitle":"PhRMA의 접근성 논거와 의약품의 TAM에 대한 단상, 실적 발표로 급락한 HCAT·HIMS·DOCS, ACCESS에 반발하는 디지털 헬스, 그 밖의 소식","sections":[{"heading_en":"Sponsored by: Lorikeet","body":"스폰서: Lorikeet\n\nEucalyptus는 규제 체계가 서로 다른 네 개 국가에 걸쳐 환자 지원을 확장해야 했을 때, AI 고객 지원 플랫폼인 Lorikeet을 도입했습니다.\n\nLorikeet은 단순한 문의 차단을 넘어 처방, 사전 승인, 베네핏 확인, 보험 클레임, 케어 코디네이션을 처음부터 끝까지 처리하고, 사람의 판단이 필요할 때는 환자 컨텍스트와 함께 에스컬레이션합니다.\n\nEucalyptus는 기존 팀 그대로 환자 물량을 4배로 늘렸고, 티켓의 60~70%를 사람 개입 없이 해결했으며, CSAT를 10포인트 높였습니다.\n\nEucalyptus, Talkspace, SonderMind 등의 고객 지원을 뒷받침하는 Lorikeet에 대해 자세히 알아보기\n\n뉴스레터 스폰서십에 관심이 있으시면 알려 주세요!"},{"heading_en":"MUSING: Musing on PhRMA’s take and the TAM for drug development","body":"제약 산업의 무역 협회인 PhRMA가 이번 주 흥미로운 백서를 공개했습니다. 여러 국가에서 신약에 대한 접근성이 어떠한지를 조명하면서, 미국의 MFN 가격제가 나쁜 아이디어라는 주장을 폅니다. 이 주장을 부각하기 위해 만든 차트는 보기 좋은 시각 자료인데, 미국이 신약의 88%에 접근할 수 있고 이는 다른 나라들의 대략 두 배임을 보여 줍니다:\n\n출처: PhRMA 백서\n\n자, 여러분은 어떨지 모르겠지만, 저는 저 차트를 보면 적어도 이 지표에서는 제가 어느 헬스케어 시스템을 선호할지 꽤 분명합니다. 새롭고 혁신적인 의약품에 접근할 수 있는 쪽입니다. 물론 여기서 우리는 트레이드오프라는 얽히고설킨 그물, 구체적으로는 그 새로운 의약품의 비용을 어떻게 관리할 것인가의 문제로 들어가게 됩니다. PhRMA가 이 주제를 이야기하는 이유는 MFN 가격제에 맞서 싸우고 있기 때문이며, 위 차트가 보여 주듯 미국이 다른 나라들처럼 의약품 가격을 매기면 생명을 살리는 약에 대한 접근을 잃을 위험이 있다고 주장합니다.\n\nPhRMA가 자기 시대의 결정적 전투를 치르고 있다고 느끼는 동안, 테크 커뮤니티는 X에서 신약 개발의 TAM 기회를 두고 군침을 흘리고 있습니다. 요즘 점점 더 자주 보게 되는 흥미로운 정서인데, 특히 Keytruda 같은 블록버스터 의약품의 연 매출을 AI 랩이나 AI 기반 컨설팅과 비교하며 눈독을 들이는 사람들이 그렇습니다:\n\n저는 위 TBPN 클립에서 Asparouhov가 표현한 기저의 정서에 대체로 동의합니다. AI가 신약 개발을 가속할 기회를 제시하면서 자본이 제약 쪽으로 회전하고 있다는 것입니다. 헬스케어 서비스 투자자들과 나누는 대화도 점점 이 방향으로 움직이는 듯합니다. 라이프 사이언스에 직접 투자하지 않더라도, 파생적인 플레이로 라이프 사이언스 인프라·이네이블먼트에 투자하는 것을 들여다보고 있을 가능성이 큽니다. 그 증거로 이번 주 가장 큰 펀딩 라운드 세 건(Forus, BranchLab, Tokaido)을 보십시오.\n\n저는 위 PhRMA 차트를 제약에 대한 기업가적 관점과 나란히 놓고 보는 것이 흥미롭습니다. 한쪽에는 신약 개발의 TAM이 AI 랩의 TAM보다 크다고 이야기하는 기업가들이 있습니다. 이는 거품이 끼었던 ZIRP 시절 디지털 헬스와 버추얼 케어를 둘러싸고 테크 커뮤니티에 감돌던 에너지와 무척 비슷하게 느껴집니다. 이 나라의 헬스케어를 바꾸겠다는 들뜬 아이디어, 풀기 어려운 문제를 해결하면서 재정적으로도 잘되리라는 기대로 테크 인재를 끌어들이던 모습 말입니다. 다른 한쪽에는 우리가 이 약들에 지불하는 가격에 나라 전체가 주춤하는 가운데, 그 TAM을 지켜 내기 위해 사실상 싸우고 있는 제약사 협회가 있습니다. 결국 저에게는 우리의 가장 뛰어난 인재들이 암 치료 같은 문제에 매달리는 것이 좋은 일로 보입니다. 그리고 재정적 성과에 대한 기대는 그런 일이 일어나는 데 따라붙는 요소라고도 생각합니다. 바로 거기에 트레이드오프가 있습니다.\n\n여러 면에서, 제약 혁신의 개발을 어떻게 재원 조달하고 그 접근에 어떻게 값을 치를 것인가라는 질문은 앞으로 이 나라 헬스케어의 결정적 질문처럼 느껴집니다. 언제나 그렇듯 아이언 트라이앵글은 이것이 어떻게 전개될지에 대한 유용한 렌즈를 제공합니다. 예를 들어 비용이 계속 올라가기만 할 수는 없다고 가정하고, 또 어떤 정치인도 제약 혁신의 속도를 늦추고 싶어 하지 않으리라고 가정하면, 필연적인 답은 신약에 대한 접근이 줄어들리라는 것입니다."},{"heading_en":"Q1 EARNINGS WRAP-UP: Earnings season slows down with some major misses","body":"이번 주에는 몇몇 뒤늦은 기업들이 실적을 발표했는데, 이들은 헬스케어 전반의 서로 다른 내러티브에 대해 상당히 흥미로운 전략적 업데이트 세 가지를 제공했습니다. D2C 롱제비티 플레이(Hims), 헬스케어 엔터프라이즈를 위한 AI 플레이(Health Catalyst), 그리고 의사를 대상으로 한 제약 광고 플레이(Doximity)입니다. 세 곳 모두 각자의 사업에 대해 투자자들에게 고유한 우려 요인을 던지면서 주가가 한 주 동안 10% 넘게 빠졌습니다. 들어가 봅시다:"},{"heading_en":"Q1 EARNINGS WRAP-UP: Earnings season slows down with some major misses","body":"Hims & Hers 주가는 이번 주 14% 하락했습니다. Hims가 매출 가이던스를 올리면서 동시에 2026년 EBITDA 가이던스를 낮춘 혼재된 실적 보고 때문입니다. 이번 분기에는 컴파운딩 GLP-1에서 브랜드 GLP-1로 방향을 틀면서 2,800만 달러의 구조조정 비용도 발생했는데, 다시 살아난 Novo와의 파트너십을 통한 전환이었습니다. Hims는 Q&A에서 브랜드 제품 고객과 컴파운딩 제품 고객의 유닛 이코노믹스가 \"대체로 비슷하다\"고 언급했는데, 액면 그대로는 저에게 그다지 말이 되지 않습니다. Hims는 단기적인 출렁임에도 불구하고 장기 목표(2030년까지 매출 65억 달러 이상, 조정 EBITDA 13억 달러 이상)는 그대로라고 보는 듯합니다."},{"heading_en":"Q1 EARNINGS WRAP-UP: Earnings season slows down with some major misses","body":"Health Catalyst는 매출과 조정 EBITDA가 가이던스를 웃돌았음에도 이번 주 약 20% 하락했습니다. 현재 시가총액은 8,800만 달러에 불과한데, 실적 콜에서 HCAT가 인프라를 제공하던 레거시 플랫폼에서 새로운 AI 중심 애플리케이션 제공으로 넘어가는 대대적인 전략적 전환이 진행 중임이 부각되었기 때문입니다. HCAT는 고객사들이 자체 인프라로 옮겨 가면서 전환 기간 동안 5,200만 달러의 매출이 위험에 놓여 있지만, 그럼에도 대부분의 고객사를 새로운 애플리케이션 레이어의 고객으로 유지할 것으로 기대하고 있습니다. 앞으로 HCAT에 무슨 일이 일어나는지 지켜볼 만합니다."},{"heading_en":"Q1 EARNINGS WRAP-UP: Earnings season slows down with some major misses","body":"Doximity 주가는 2026년 4분기 실적을 발표한 뒤 이번 주 크게 두들겨 맞았습니다. 제약 광고 시장의 부진과 AI 투자 확대로 인한 마진 하락을 보고하며 28% 떨어졌습니다. AI 지출이 늘면서 매출총이익률은 2% 하락했고, 조정 EBITDA 마진은 전년 대비 5% 떨어졌습니다. 그럼에도 Doximity는 AI 플레이에 자신감을 보이며, 프로바이더 \"유료 검색\" 시장에 진입하는 것이 회사에 수십억 달러 규모의 새로운 TAM이라고 언급했고, 한 대목에서는 AI가 구글이 옐로 페이지에 했던 것과 같은 역할을 하리라고 시사했습니다. 주가는 가파르게 떨어졌지만 Doximity가 이번 분기에도 여전히 45%의 조정 EBITDA 마진과 1억 700만 달러의 잉여현금흐름을 만들어 냈다는 점은 짚어 둘 만합니다.\n\n여담이지만, Doximity는 이제 OpenEvidence 가치의 약 30% 수준인데, 이번 분기에 만들어 낸 잉여현금흐름이 OpenEvidence가 2025년에 올린 매출과 맞먹습니다. 비상장 시장과 상장 시장이 가치를 다르게 매긴다는 것은 이해하지만, 그래도 저에게는 그저 우스워 보입니다. 저 두 밸류에이션 중 하나는 어긋나 있는 것 같습니다."},{"heading_en":"Q1 EARNINGS WRAP-UP: Earnings season slows down with some major misses","body":"이번 주의 다른 실적 커버리지는 여기 Slack 디스커션에서 확인하시고, 주중 BofA에서 열린 상장기업 발표에 대한 Martin의 커버리지도 함께 보십시오."},{"heading_en":"CHART OF THE WEEK: Healthcare: America’s Jobs Program","body":"Bijan Salehizadeh가 이번 주 X에서 이 점을 짚으며, 가장 최근 고용 보고서를 다룬 WSJ 게시물의 데이터를 조명했습니다. 헬스케어 산업을 기본적으로 이 나라의 일자리 프로그램으로 보고, 거기서 따라 나오는 후속 함의를 생각해 보는 것은 흥미로운 사고 실험이라고 생각합니다. 우리가 헬스케어 비용을 GDP 대비 비중으로 줄이는 데 진지하다면, 그 절감이 어디에서 나올지 저는 말씀드릴 수 있습니다. 그리고 실업률 급등의 여파를 감당하고 싶어 하는 사람이 있을지는 잘 모르겠습니다."},{"heading_en":"A QUOTE TO PONDER: Digital health pushes back on ACCESS","body":"Endpoints와 Stat 모두 이번 주 디지털 헬스의 중진들이 ACCESS를 두고 내놓은 견해를 다루며, 이 프로그램이 핵심을 놓치고 있다고 지적했습니다. Hinge Health의 CEO Daniel Perez는 제가 지금까지 본 것 중 가장 직접적인 공개 질책을 내놓으며 Stat에 이렇게 말했습니다:\n\n\"그것은 성과를 개선하지 못할 것이고, 경험을 개선하지도 못할 것이며, 비용을 줄이는 일은 더더욱 없을 것입니다. 그리고 지금 짜여 있는 방식대로라면 디지털 헬스 기업들은 사실상 임상적인 사람의 감독을 전부 걷어내야 합니다.\"\n\n출처: Hinge Health CEO Daniel Perez; Stat News 인용\n\n말씀드리자면, ACCESS에 예측 시장이 있다면 저는 위에서 Perez가 시사한 것이 유력한 결과라고 봅니다. 미국 헬스케어의 전반적인 궤적을 감안하면 그것은 늘 안전한 베팅처럼 보입니다. 심지어 지금 헬스케어의 상태를 감안하면, 지난 10년간 붐이 일어난 이래 디지털 헬스 산업이 크게 봐서 만들어 낸 임팩트에 대해서도 같은 일반론을 펼 수 있다고 생각합니다. 이런 일들의 속성이 그렇습니다.\n\n그렇긴 해도, CMMI와 ACCESS에 참여하는 150곳 이상의 기업들은 ACCESS가 성과나 경험을 개선하지 못하고 비용도 줄이지 못하리라는 것이 이미 정해진 결론이라는 데 다르게 생각할 것입니다. 그래서 저는 ACCESS가 아주 흥미로운 실험이라고 봅니다. 궁극적으로 성공하든 아니든, 규제 당국이 이런 전선에서 밀어붙이고 있다는 것은 좋은 일이라고 생각합니다."},{"heading_en":"Other Top Headlines","body":"OpenAI가 이번 주 OpenAI Deployment Company를 출범시키며, \"Forward Deployed Engineers\"를 활용해 엔터프라이즈의 AI 도구 도입을 돕는 컨설팅 회사를 세운 Anthropic에 합류했습니다. 열아홉 곳의 투자사와 컨설팅 회사가 참여하기로 했고, 그중 다수는 Welsh Carson을 비롯해 헬스케어 관련 투자를 갖고 있습니다. AI에서 벌어지는 모든 일의 결과 중 하나를 제가 확신한다면, 그것은 우리가 컨설팅의 황금기로 들어서고 있다는 것입니다. 지난 몇 주간 헬스케어 상장사 실적에서 AI의 가장 뚜렷한 임팩트는 AI 컴퓨트 비용 때문에 EBITDA 마진이 5% 떨어지면서 Doximity 주가가 30% 폭락한 것이었다는 점을 기억해 두십시오. 왜 대형 랩들이 여기서 컨설턴트, 아니 Forward Deployed Engineers를 데려오려고 경쟁하는지 이해가 갑니다."},{"heading_en":"Other Top Headlines","body":"OptumRx가 더 투명한 PBM 가격 구조로 옮겨 가면서, 고객사에 GPO와 관련된 것을 포함해 OptumRx의 수수료를 들여다볼 수 있는 수수료 기반 모델을 제공합니다. 현재 시장 상황을 감안하면 논리적인 움직임으로 보입니다."},{"heading_en":"Other Top Headlines","body":"Function이 개인화된 보충제 \"스택\"을 제공하는 스타트업 SuppCo를 비공개 금액에 인수했습니다. SuppCo는 앞서 Union Square Ventures 등으로부터 550만 달러의 시드 자금을 유치한 바 있는데, 당시 USV가 내놓은 이 논지도 한번 볼 만합니다. 새로운 헬스케어 시스템을 구축한다는 것을 중심으로 한 롱제비티 시장 강세론의 핵심을 잘 짚어 냅니다. 저는 이 비전이 실현되리라는 데 여전히 깊이 회의적이지만, 제가 틀렸으면 좋겠습니다."},{"heading_en":"Other Top Headlines","body":"Mass General Brigham이 이번 주 다시 뉴스에 올랐습니다. Boston Globe가 K Health와의 파트너십을 통해 버추얼 진료를 출범시키려는 MGB의 노력을 조명했습니다. 9월 출범 이후 이 서비스는 1만 4,000건이 넘는 버추얼 진료를 기록했고 환자들에게 좋은 반응을 얻고 있는 것으로 보입니다. MGB의 프라이머리 케어 프로바이더들은 이 시도에 여전히 불만이며, MGB가 대신 프라이머리 케어에 투자해야 한다고 말합니다. 어느 주에는 MGB가 프라이머리 케어 접근을 늘려 비용을 올렸다는 이유로 매사추세츠 Health Policy Commission에게 두들겨 맞고, 그다음 주에는 자기네 프라이머리 케어 프로바이더들에게서 프로바이더에 투자하는 대신 값싼 진료 접근을 제공하는 서비스에 투자한다고 비판받습니다. 제가 학술 의료센터의 처지에 공감하는 일이 그리 잦지는 않지만, 여기서 우리가 MGB에게 달리 무엇을 하기를 바라는지는 잘 모르겠습니다."},{"heading_en":"Other Top Headlines","body":"Hippocratic AI가 회사를 겨냥한 Sergei Polevikov의 도를 넘은 비판 시리즈에 공개적으로 대응했습니다. 사람들 사이의 드라마를 걷어내고 나면, Hippocratic의 대응에는 현재 사업 상태에 대한 흥미로운 데이터 포인트가 몇 가지 담겨 있었습니다. 오늘 기준으로 월 매출이 거의 500만 달러에 이르는 한편 월 300만 달러의 현금을 태우고 있는 것으로 보입니다. 제공된 데이터를 근거로 보면 Hippocratic은 2025년에 많아야 2,000만 달러의 매출을 올린 것으로 보이며, 그렇다면 2025년 11월 시리즈 C에서의 35억 달러 밸류에이션은 트레일링 매출의 150배 배수가 됩니다."},{"heading_en":"Other Top Headlines","body":"OpenEvidence가 이번 주 NBC News에 소개되었는데, 이 보도는 현재 65만 명의 미국 의사가 이 플랫폼을 활발히 사용하고 있으며 2026년 4월에 2,700만 건의 검색이 있었다고 전했습니다. 기사에서 가장 흥미로운 대목은, NBC News가 취재한 의사들이 OpenEvidence의 광고가 \"거슬리지 않거나 아예 없다\"고 말했다고 짚은 부분이었습니다. 이를 제약 광고 시장의 부진에 대한 위 Doximity 이야기와 나란히 놓고 보면, 이 모델에 어떤 함의가 있을지 생각해 보게 됩니다."},{"heading_en":"Other Top Headlines","body":"CMS가 헬스케어의 사기, 낭비, 남용에 맞선 압박을 여러 전선에서 이어 가고 있습니다. 수요일 CMS는 신규 호스피스 및 홈헬스 기관의 메디케어 등록에 대해 6개월 모라토리엄을 발표했습니다. CMS는 또한 캘리포니아에 대한 13억 달러의 연방 메디케이드 자금 지급을 연기하겠다고 발표했습니다. 한편 DOJ는 한 개인이 플로리다에서 10억 달러가 넘는 사기 계획으로 연방 배심원단에게 유죄 판결을 받았다는 보도자료를 냈습니다."},{"heading_en":"Other Top Headlines","body":"Marty Makary가 공식적으로 FDA Commissioner 자리에서 물러났습니다."},{"heading_en":"Funding Announcements","body":"처방을 위한 AI 인프라 레이어인 Forus(구 Tandem)가 1억 6,000만 달러를 유치했습니다. Thrive Capital, General Catalyst 등이 참여했습니다. Forus는 프로바이더 네트워크를 빠르게 확장하고 있으며, 지난 2년간 매년 전년 대비 10배 성장했고 현재 미국 우편번호 지역의 80%에서 환자를 지원하고 있습니다."},{"heading_en":"Funding Announcements","body":"버추얼 전문 진료 플랫폼인 9am Health가 2,600만 달러를 유치했습니다. Define Ventures가 라운드를 리드했습니다. 보도자료에 따르면 9amHealth는 두 곳의 포춘 100 고용주를 대상으로 심장대사 케어에서 5,000만 달러의 의료비·약제비 절감을 만들어 냈으며, 이를 넘어 다른 고비용 만성질환으로 확장하고 있습니다"},{"heading_en":"Funding Announcements","body":"제약사의 신약 상업화를 지원하는 플랫폼인 BranchLab이 2,600만 달러를 유치했습니다. McKesson Ventures가 라운드를 리드했습니다."},{"heading_en":"Funding Announcements","body":"약국 내비게이션을 위한 행동경제학 모델인 Tokaido Health가 Primary Ventures의 리드로 2,500만 달러를 유치했습니다. Tokaido는 AI 기반 행동경제학 제안과 화이트글러브 지원을 결합해 고용주가 비용을 관리하도록 돕는 첫 기회군으로 인퓨전과 바이오시밀러에 집중하고 있는 것으로 보입니다."},{"heading_en":"Funding Announcements","body":"헬스케어 엔터프라이즈를 위한 AI ROI 계산기인 Optura가 Salesforce Ventures의 리드로 1,750만 달러 규모의 시리즈 A를 발표했습니다. Optura는 Independence Blue Cross, Prime Therapeutics, Ardent Health를 포함해 엔터프라이즈 헬스 플랜과 프로바이더를 고객으로 꼽습니다. 플랫폼에서 20억 달러가 넘는 AI 이니셔티브가 추적되고 있다고 밝힙니다."},{"heading_en":"Funding Announcements","body":"AI 레비뉴 사이클 플랫폼인 Anomaly Insights가 Sound Ventures의 리드로 1,700만 달러를 유치했습니다. Anomaly는 페이어와 프로바이더 사이의 정보 비대칭 때문에 발생하는 과소지급분을 프로바이더 조직이 회수하도록 돕는 데 집중하고 있습니다. Anomaly는 순 환자 매출이 평균 40억 달러가 넘는 20곳 이상의 헬스 시스템에 도입되어 있다고 밝힙니다."},{"heading_en":"Funding Announcements","body":"AI PCP 모델인 Clara가 1,200만 달러를 유치하고 YCombinator에 합류했습니다. A.Captial이 YC와 함께 라운드를 리드했습니다."},{"heading_en":"Funding Announcements","body":"행동 건강을 위한 LLM인 Knit Health가 Uncork Capital과 Frist Cressey의 리드로 1,160만 달러 규모의 시드 라운드를 발표했습니다. 30개 헬스 시스템에 걸친 1억 3,000만 명 환자의 Truveta EMR 데이터로 모델을 학습시켰습니다."},{"heading_en":"Funding Announcements","body":"프로바이더 스태핑 마켓플레이스인 Saile이 Matchstick Ventures와 Headwater Ventures가 공동 리드한 220만 달러 규모의 프리시드 라운드를 발표했습니다."},{"heading_en":"What I’m Reading","body":"Olivia Webb Kosloff와 Alice Qin이 American Economic Liberties Project를 위해 독립 프로바이더들이 맞닥뜨린 자본 제약과 이들을 지원할 수 있는 정책 옵션에 관한 페이퍼를 썼습니다."},{"heading_en":"What I’m Reading","body":"Grant Hesser가 X에 매니지드 케어가 1분기에 어떻게 반등했는지에 관한 글을 썼습니다. 메디케어 어드밴티지, 메디케이드, ACA 사업 전반에 걸쳐 업계가 맞닥뜨린 100년 만의 폭풍을 헤쳐 나오면서 말입니다. COVID가 계리 모델에 남긴 파급 효과를 되짚어 보고 업계가 마침내 그것을 지나왔을지 생각해 보는 것은 무척 흥미롭습니다."},{"heading_en":"What I’m Reading","body":"Brendan Keeler의 Daily Ping이 WISeR에 대한 워싱턴 D.C.의 문제 제기를 조명했습니다. Government Accountability Office가 WISeR는 발효되기 전에 의회에 제출되었어야 하는 규칙이라는 통지를 냈습니다."},{"heading_en":"What I’m Reading","body":"Zach Davis가 LI에 흥미로운 관점을 공유하며, 물량이 많고 변동성이 큰 전문의 지출이 ACO가 LEAD 안에서 전문 진료 리스크를 위임하는 메커니즘인 CARA를 고민해 볼 좋은 기회임을 짚었습니다.\n\nCARA를 더 깊이 파고들고 싶다면, 최근에 Manatt의 Will Gordon을 인터뷰하며 이 주제를 두고 아주 너드하게 들어간 적이 있습니다. CARA는 확실히 눈여겨볼 만한 모델로 보입니다."}]},"43":{"index":"43","title_en":"Weekly Health Tech Reads 5/31/26","subtitle":"1,000억 달러짜리 헬스케어 AI 기업에 대한 단상, GLP-1의 영향, 프라이머리 케어 접근성을 둘러싼 대화, 그리고 그 밖의 소식","sections":[{"heading_en":"Sponsored by: Limina","body":"모두가 임상 데이터를 AI에 집어넣으려 경쟁하고 있지만, 그 안에 묻혀 있는 PHI를 신경 쓰는 곳은 훨씬 적습니다. 가장 큰 리스크를 만드는 것은 눈에 뻔히 보이는 PHI인 경우가 드뭅니다. 임상적 맥락, 암시된 신원, 민감한 질환은 훨씬 탐지하기 어렵습니다.\n\nLimina의 벤치마크 리포트는 범용 클라우드 도구들이 PHI의 13.8%에서 46.5%를 놓친다는 것을 확인했습니다. 독립 감사에서는 Limina의 정확도가 99.5% 이상으로 측정됐습니다. Doximity, Spring Health, Providence Health 같은 회사들이 Limina를 선택하는 것도 놀랄 일이 아닙니다.\n\n이 벤치마크 리포트는 꽤 눈이 번쩍 뜨이게 합니다. 여기에서 확인해 보세요.\n\n뉴스레터 스폰서십에 관심이 있으시다면 알려 주세요!"},{"heading_en":"AI: How many $100 billion AI healthcare admin platforms will there be?","body":"지난 몇 주 사이의 펀딩 라운드 중 더 흥미로웠던 것 하나가 70억 달러 밸류에이션에 7,000만 달러를 조달한 Commure의 라운드였다고 생각합니다. 특히 두 가지가 눈에 띄었습니다.\n\n- GC의 Hemant Taneja는 LI에 Commure가 미국 헬스케어의 1조 달러가 넘는 행정 지출을 공략하는 그 잠재력을 실현하려면 1,000억 달러 규모의 회사가 되어야 한다고 올렸습니다.\n- Commure의 CEO인 Tanay Tandon은 Sourcery 팟캐스트에 출연해, 인수를 통해 지배적인 플랫폼을 구축한다는 Rockefeller식 접근을 언급하면서 자신의 표현으로는 포인트 솔루션들을 열정적으로 도려내겠다고 했습니다. 같은 대화에서 Tandon은 Commure가 헬스 시스템과의 계약을 종종 포인트 솔루션으로서 따낸다고 언급했습니다.\n\nTandon과 Taneja는 여기서의 야심이 무엇인지 꽤 분명히 밝힙니다. Commure가 HCA나 Tenet 같은 시스템에서의 시장 지위를 지렛대 삼아 여러 포인트 솔루션을 롤업해 나가면서 1,000억 달러짜리 사업이 되고, 헬스케어 AI의 승리한 플랫폼이 되겠다는 것입니다. Anthropic, SpaceX, OpenAI 같은 테크 AI 기업들이 1조 달러 언저리의 밸류에이션을 받고 있는 시장에서, 미국 GDP의 약 20%를 차지하는 산업에 AI를 적용하는 경주에서 승리한다는 것의 개념적 매력은 이해가 갑니다.\n\n미래에 미국 헬스케어 시스템을 위한 1,000억 달러짜리 AI 인프라 회사가 존재할 가능성이 얼마나 되는지 곱씹어 보는 것은 흥미로운 사고 실험이라고 생각합니다. Commure는 이 플랫폼을 구축하겠다는 몇 안 되는 큰 베팅 중 하나이고, M&A 전략 면에서는 아마 가장 야심 찬 축이지만, 이 시도가 여기 하나뿐인 것은 결코 아닙니다.\n\nTandon은 Sourcery 인터뷰에서 이 시장이 앞으로 몇 년에 걸쳐 필연적으로 통합될 것이고, 규모를 달성하지 못한 자금이 넉넉한 스타트업들이 시간이 지나면서 고객이 플랫폼 제품으로 옮겨 감에 따라 계약 매출이 증발하는 것을 보게 되면서 포인트 솔루션 시장에 참혹한 결과가 벌어질 것이라고 말합니다. 이는 시장의 자연스러운 진화로 보이고, 얼마나 많은 헬스케어 AI 스타트업이 실패할 것인가에 대해서는 안전한 베팅으로 보입니다. 오늘날 시장에 나와 있는 포인트 솔루션 대부분이 살아남지 못하리라는 것은 분명해 보이지만, 어떤 플랫폼이 이 시장의 승자로 부상할지를 예측하는 것은 더 어려워 보입니다.\n\n그런 점에서, Tandon이 인터뷰에서 Summa Health(GC가 이제 소유한 오하이오 기반 헬스 시스템)에서의 Commure 배포를 어떻게 설명했는지가 무척 흥미로웠습니다. 본질적으로 Commure는 Summa 현장에 컨설턴트 Forward Deployed Engineer 팀을 두고 효율화 기회를 찾아내고 있으며, Summa는 AI가 어려움에 처한 헬스 시스템을 구할 수 있다는 것을 보여 주는 테스트 케이스 역할을 하고 있습니다. 지금까지 제가 들어 본 것 중 Commure의 가치 제안을 가장 명확하게 표현한 것이었습니다. 동시에 이는 컨설턴트들이 오랫동안 헬스 시스템에 제시해 온 가치 제안과도 상당히 비슷하게 들립니다(보아하니 별로 성공적이지는 않았지만요).\n\n그 모델에 대한 강세 시나리오는 아마 헬스케어판 Palantir처럼 들릴 것입니다. 반면 Health Catalyst는 공개 시장에서 꽤 직접적인 비교 대상인데, 그 시가총액 1억 달러는 이런 회사들에 대한 매우 현실적인 약세 시나리오를 제공합니다. 이 문제를 풀려던 이전 시도들이 맞닥뜨린 어려움(즉 Olive AI)은 말할 것도 없고요.\n\n개인적으로는, 10년이나 20년 뒤에 이 시기를 돌아보며 새로운 1,000억 달러짜리 헬스케어 기업이 모습을 갖춰 간 시기였다고 말하게 되는 것이 터무니없어 보이지는 않습니다. UHG가 2000년대 후반에 본격적으로 도약하기 시작한 것과 비슷하게 말이죠. 또한 저는 그 회사가 헬스케어판 Palantir 모델과 조금이라도 닮아 있으리라고는 생각하지 않습니다. 1,000억 달러가 넘는 회사가 그런 규모에 이르려면, 오늘날의 UHG / CVS / HCA와 비슷하게 케어 딜리버리 / 파이낸싱 달러를 더 많이 소유해야 할 것이 필연적으로 보입니다. 어느 쪽이든, Taneja와 Tandon이 그런 결과를 향해 인수로 길을 내려는 과정에서 자기 안의 Rockefeller를 어떻게 발현하는지 지켜보는 것은 분명 흥미로울 것입니다."},{"heading_en":"GLP-1s: GLP-1s and their impact on obesity rates","body":"Epic Research가 지난 5년간의 BMI를 살펴본 흥미로운 데이터셋을 공개했습니다. 2025년 GLP-1의 문화적 영향력에, Eli Lilly와 Novo Nordisk가 2025년에 GLP-1으로 약 360억 달러의 매출을 올렸다는 사실까지 감안하면, 성인 인구 분포가 과체중 / 비만에서 건강 체중 쪽으로 눈에 띄게 이동한 모습을 볼 수 있으리라 생각했습니다. 제 생각이 틀렸습니다. 2021년부터 2026년 사이 Epic의 전체 성인 인구는 다음과 같습니다.\n\n출처: Epic Research\n\n건강한 BMI를 가진 사람은 지난 5년간 0.5% 늘었고, 과체중과 비만 BMI는 인구의 73%에서 72.5%로 0.5% 줄었는데, 위 차트에서는 거의 알아보기 힘든 수준입니다. Epic 데이터를 보면 GLP-1을 복용하는 인구에서는 더 뚜렷한 변화가 있어서, 2024년에서 2026년 사이 건강한 BMI가 2% 증가했습니다.\n\n그래도 GLP-1이 비만을 해결할 것이라는 일반적인 이론이 맞고, 2025년에 인구의 12%가 GLP-1을 복용했다고 응답했다면, 그것이 언젠가는 위와 같은 차트에 나타나야 하는 것 아닐까요?\n\n이번 주에 Slack에서 시간을 들여 이야기를 나눴습니다. 1. 저 차트에는 움직임의 조짐이 없고, 2. GLP-1이 2025년에 360억 달러의 매출을 냈으며, 3. 여론조사에서는 인구의 12%가 복용했다고 나오는 이 세 가지가 어떻게 동시에 참일 수 있는지에 대해서요."},{"heading_en":"CLINICAL AI: Early Utah AI pilot data provides a glimpse into rollout","body":"유타주가 Doctronic의 AI 파일럿 초기 결과에 관한 보고서를 공개했습니다. 지금까지 AI는 처방의 72%에 대해 승인을 권고했고, 그중 91%는 의사가 추가 정보를 요구하지 않고 그 권고를 승인했습니다. 28%의 경우에는 AI가 의사에게 에스컬레이션했는데, 그 사례의 31%에서는 의사가 AI의 에스컬레이션이 지나치게 신중했다고 판단했습니다.\n\n출처: 유타주 데이터, HTN 분석\n\n여기서 두 가지가 눈에 띕니다.\n\n1. 이 파일럿이 AI가 의사를 대체한다는 우려를 그토록 많이 불러일으켰지만, 이 파일럿 과정의 모든 부분에 여전히 사람이 개입되어 있는 것으로 보이며 그런 우려는 과장된 것으로 보입니다. 여기 있는 모든 감독 장치를 감안하면, 우려에도 불구하고 이 과정이 현재 상태보다 훨씬 더 안전하지 않다고 상상하기는 어렵습니다.\n2. 유타주는 이 파일럿을 거치는 환자 수가 아직 상당히 적다고 언급했습니다. 환자 채택이라는 그 문제가, 특히 주 의사회의 반발과 맞물려 더 흥미롭게 지켜볼 데이터 포인트로 보입니다."},{"heading_en":"Sponsored by: Abridge","body":"6월 11일, Abridge가 뉴욕에서 첫 Keynote를 열고 전 세계로 스트리밍합니다. Abridge는 시간을 아끼고, 비용을 아끼고, 생명을 구한다는 미션을 갖고 있습니다. 그 목표를 향한 지금까지의 가장 의미 있는 진전에 대해 온라인으로 함께 들어 보세요. 여기에서 등록하세요."},{"heading_en":"Key Trends to Keep an Eye On","body":"Clover Health가 CMS를 상대로 한 잠재적으로 중대한 Stars 소송에서 승리했습니다.\n\n판사가 Clover의 손을 들어 주며 여러 Stars 지표를 무효화하자 목요일 Clover의 주가는 16% 올랐습니다. CMS는 항소하고 있지만, 이 판결이 유지될 경우 Clover의 플랜은 3.5 Stars에서 4 Stars로 올라가 2027년에 약 1억 2,000만 달러의 보너스 지급을 받게 됩니다. Andrew Schwab은 LI에서 이 판결과 Chevron 판결이 맞물리면서 그 결과가 Stars 프로그램의 더 큰 변화를 예고할 수도 있다고 추측했습니다."},{"heading_en":"Key Trends to Keep an Eye On","body":"Oura가 헬스케어 야심을 내비치면서 IPO 후보 대열에 합류했습니다.\n\n지난주 Oura는 S-1을 비공개로 제출하며 IPO 절차에서 큰 걸음을 내디뎠습니다. 이번 주에는 주요 제품 업데이트를 내놓았는데, 기기에 여러 건강 관련 기능(혈압 모니터링, 야간 호흡, GLP-1 추적)을 추가하고 Counsel Health와 파트너십을 맺어 앱 내에서 AI 기반 케어 딜리버리에 접근할 수 있게 했습니다. 여기서 Counsel Health 파트너십이 특히 흥미로운데, Whoop에 이어 이제 Oura까지 임상의 접근을 경험 안에 통합하는 흐름을 만들고 있기 때문입니다. Oura는 현재 CMMI의 ACCESS 모델에 참여하고 있지 않지만, Abe Sutton은 곧 더 많은 참여자가 이 모델에 추가될 것이라고 밝혔고, Oura가 좋은 후보가 되리라고 상상해 볼 수 있습니다."},{"heading_en":"Key Trends to Keep an Eye On","body":"No Surprises Act는 계속 헤드라인을 만들어 내고 있습니다. 프로바이더들이 페이어(구체적으로는 BCBS Texas)의 미지급에 반발하고 있습니다.\n\n지난주 Radiology Associates of North Texas는 BCBS TX가 IDR 중재 절차에서 나온 구속력 있는 판정 금액의 2%만 지급했으며, 이 절차에 얽힌 행정적 낭비에 5,100만 달러 이상을 쓰게 될 것이라는 보도자료를 냈습니다. 이번 주에는 HaloMD가 연방 법원이 BCBS Texas의 소를 각하했다고 알리는 보도자료를 냈습니다. 이 법이 양쪽 어느 편에게도 말이 안 되게 느껴질 수는 있지만, 그럼에도 그것이 법입니다. 또 이번 주에 CMS는 IDR 절차를 간소화하기 위한 몇 가지 조정을 했습니다."},{"heading_en":"Key Trends to Keep an Eye On","body":"지역 헬스 플랜들이 계속 고전하는 가운데 태평양 북서부의 두 플랜이 문을 닫습니다.\n\nProvidence Health Plan과 PacificSource가 모두 보험 시장에서 철수할 계획을 발표했습니다. Providence는 2027년에 ACA, Medicaid, 고용주 사업을 접고 Medicare Advantage에서는 전국 단위 보험사와 파트너십을 맺습니다. Williamette Week는 Providence의 상황을 냉정하게 평가하며, 헬스 플랜을 운영하는 것보다 스타트업 파트너십에 더 집중한 리더십 팀의 경영 부실로 인식되는 부분을 짚었습니다. 이유가 무엇이든 이 헬스 플랜은 2025년에 1억 달러의 손실을 냈고, 이에 Providence는 사업을 접게 됐습니다. Legacy Health가 일부 지분을 보유한 비영리 지역 헬스 플랜 PacificSource는 몬태나의 모든 사업 라인을 포함해 ACA 시장에서 완전히 철수하며, 이는 PacificSource의 약 50만 명 회원 중 약 4만 2,000명에게 영향을 미칩니다. 이번 결정은 지난 몇 년간 사업 규모를 적정화하려는 여러 시도를 거친 뒤에 나온 것입니다. 현재 환경에서 지역 헬스 플랜들이 맞고 있는 역풍을 보여 주는 또 하나의 신호이지만, 어쩌면 2026년 1분기 실적 발표가 2026년은 더 나은 해가 되리라는 한 줄기 희망을 줄지도 모릅니다."},{"heading_en":"Other Headlines","body":"WakeMed는 UNC Health의 50억 달러 규모 합병 제안을 거절하고, UNC의 제안이 두 배 넘게 컸음에도 Atrium Health와의 거래를 선택했습니다. WakeMed 경영진은 자사가 시장의 다른 곳들보다 10~30% 낮은 가격을 받고 있어 이것이 경쟁상 불리한 점이라고 언급했는데, 이는 이번 거래 이후 헬스케어 비용에 어떤 일이 벌어질지를 시사하는지도 모릅니다."},{"heading_en":"Other Headlines","body":"CMS가 금요일 Elevance에 서한을 보내, Elevance가 가입 제재를 피하기 위해 6월 30일까지 마쳐야 하는 네 단계 중 두 번째를 완료했다고 알렸습니다."},{"heading_en":"Other Headlines","body":"Amazon Health Services가 새 리더로 AmWell의 co-founder인 Dr. Roy Schoenberg를 영입했습니다. 요즘 Amazon 버추얼 케어 광고를 얼마나 자주 보고 있는지를 생각하면, 앞으로의 전략을 보여 주는 인선으로 보입니다."},{"heading_en":"Other Headlines","body":"매사추세츠주 법무장관이 2014년부터 2025년까지 D-SNP 프로그램에서 1억 달러 규모의 업코딩이 있었다는 혐의로 UnitedHealthcare를 제소했습니다. 듀얼 시장에 있는 분들에게 이 사건은 이 프로그램들이 얼마나 복잡한지를 잘 보여 주는 읽을거리입니다."},{"heading_en":"Other Headlines","body":"Open Evidence가 Cedars-Sinai와 파트너십을 맺고 환자 데이터를 OE 검색 경험에 통합합니다. 특히 헬스 시스템 대상 엔터프라이즈 세일즈와 관련해 OE에게 괜찮은 움직임으로 보입니다. 이것이 Doximity가 최근 제약 광고 시장이 부진하다고 이야기한 시점과 겹친다는 점을 감안하면, OE의 go-to-market 전략에 미칠 함의를 지켜볼 만합니다."},{"heading_en":"Other Headlines","body":"WISeR는 워싱턴에서 계속 반발에 부딪히고 있으며, 하원과 상원의 민주당 의원들이 프로그램 중단을 요구하고 있습니다."},{"heading_en":"Other Headlines","body":"CVS가 PBM이 주 내에서 약국을 함께 소유하는 것을 금지하는 새 법률을 두고 테네시주를 상대로 소송을 제기했습니다."},{"heading_en":"Other Headlines","body":"HCA가 The College of Health Care Professions를 인수하는 계약을 발표했습니다. 이 기관은 텍사스 내 10개 캠퍼스와 온라인을 통해 매년 8,000명 이상의 학생에게 헬스케어 교육을 제공합니다."},{"heading_en":"Other Headlines","body":"K Health가 UPenn Medicine과 파트너십을 맺고 AI 중심의 버추얼 케어 제품을 선보입니다. 케어 딜리버리에서의 AI를 둘러싼 온갖 기대를 감안하면, UPenn, MGB, Northwell, Mayo와의 파트너십으로 이어진 K Health의 상대적으로 조용한 모멘텀은 주목할 만해 보입니다."},{"heading_en":"Other Headlines","body":"Innovaccer가 레비뉴 사이클 역량을 확장하기 위해 CaduceusHealth를 인수했습니다."},{"heading_en":"Funding Announcements","body":"고용주를 위한 데이터 애널리틱스 플랫폼을 제공하는 Garner Health가 27억 4,000만 달러 밸류에이션에 1억 달러를 조달했습니다.\n\nIndex Ventures가 라운드를 주도했습니다. 이는 13억 5,000만 달러 밸류에이션에 1억 1,800만 달러 시리즈 D를 발표한 지 3개월 만입니다. Garner는 고객 800곳과 ARR 2억 달러를 제시하는데, 이는 지난 5년간 매년 두 배 이상 성장한 수치입니다. Bloomberg에 따르면 매출은 3개월 전 13억 5,000만 달러 밸류에이션 이후로도 두 배가 된 것으로 보이는데, 계산이 잘 맞지는 않습니다. 어느 쪽이든 전반적인 인상은 Garner가 고용주 쪽에서 상당한 모멘텀을 갖고 있다는 것입니다. Garner의 피치는 점점 고용주를 위한 헬스케어 내비게이션 플레이처럼 들리고, 궁극적인 증명 지점은 12%의 비용 절감을 이끌어 내도록 돕는 것입니다. 고용주 비용 상황을 감안하면 이 시장에서 활동이 활발한 것이 딱히 놀랍지는 않으며, 앞으로 몇 달 사이 승자가 드러나기 시작하면서 이 시장에 통합이 나타나는지를 눈여겨보려 합니다."},{"heading_en":"Funding Announcements","body":"영양사가 이끄는 버추얼 임상 모델 Nourish가 17억 5,000만 달러 밸류에이션에 1억 달러를 조달했습니다.\n\nMenlo Ventures가 라운드를 주도했고, 이로써 Nourish의 총 조달액은 2억 1,500만 달러가 됐습니다. Menlo는 이번 라운드에 관한 블로그 포스트에서, Nourish가 제약사 스타일의 필드 세일즈 방식을 활용해 영업 담당자가 프로바이더를 Nourish 케어 모델의 리퍼럴 엔진으로 만들면서 환자 확보 문제를 풀어냈다고 본다고 밝혔습니다. 이 사례와 정신건강 시장을 함께 보면, 프로바이더를 핵심 go-to-market 전략으로 삼는다는 이 발상을 더 많은 스타트업이 받아들이고 있다는 점이 흥미롭습니다."},{"heading_en":"Funding Announcements","body":"D2C 연속혈당측정 브랜드 Signos가 2,000만 달러를 조달했습니다.\n\nCheyenne Ventures와 GV가 라운드를 주도했고 DexCom과 BCBS Alabama가 참여했습니다. Dexcom의 참여가 눈에 띄는데, Dexcom은 Signos가 사용하는 자체 D2C CGM인 Stelo를 제조하고 있기 때문입니다. Dexcom은 최근 실행력 부족을 두고 행동주의 투자자(Elliott Management)로부터 압박을 받고 있습니다."},{"heading_en":"Funding Announcements","body":"환자가 진료 방문을 녹음할 수 있게 돕는 앱 Kin이 900만 달러를 조달했습니다.\n\nMaveron이 라운드를 주도했고 Town Hall Ventures 등이 참여했습니다. 전에도 여기서 언급했듯이 이 모델은 개념적으로 Abridge가 처음 시작했던 지점과 비슷하게 들립니다. 이번 라운드의 시점이, Shiv Rao가 최근 20VC에서 Abridge의 \"제품 시장 적합성에 이르기까지의 5년간의 사막\"에 대해 나눈 대화와 겹친 것은 우연치고는 절묘하게 느껴졌습니다. 저희는 Kin의 Co-Founder 겸 CEO인 Arpan Parikh와 무료 환자 대상 앱의 비즈니스 모델을 어떻게 고민하고 있는지 이야기를 나눴는데, 그 논지는 개인을 위한 헬스케어 베네핏을 조율하고 헬스케어의 \"라스트 마일\" 과제를 푸는 데 상당히 초점이 맞춰져 있는 것으로 들립니다. GoodRx의 co-founder들이 Kin의 co-founder이기도 하다는 점은 짚어 둘 만하고, 여기서도 비슷한 모델이 펼쳐지리라 예상합니다. 지켜볼 만한 멋진 콘셉트에 더해진 분명 흥미로운 변주입니다."},{"heading_en":"Funding Announcements","body":"Paralign Health가 미국 농촌 지역에서 예방 건강 서비스를 제공하는 구급대원 네트워크를 구축하기 위해 300만 달러를 조달했습니다.\n\nFlyover Capital이 라운드를 주도했습니다. Paralign은 소방서와 EMS 기관이 Mobile Integrated Health and Community Paramedicine(MIH-CP) 프로그램을 운영 측면에서 구현하도록 돕습니다. 저희가 이해하기로 농촌 환경에서는 케어 딜리버리의 상당 부분이 이미 소방서/EMS에 맡겨져 있고, 재원 조달만 정리된다면 이런 것이 말이 됩니다."},{"heading_en":"What I'm Reading","body":"지난주에는 Function Health가 1년 전 인수한 D2C MRI 브랜드 Ezra의 근황을 살펴보는 데 시간을 좀 썼습니다. 인수 당시 Function은 Ezra가 몇 달 안에 1,000곳 이상의 클리닉에서 499달러 가격으로 제공될 것으로 기대한다고 밝혔습니다. 이번 주 Function의 웹사이트에는 189곳에서 999달러 가격으로 이용할 수 있다고 나와 있습니다. Ezra의 모델이 Akumin 같은 외래 영상의학 프로바이더로부터 물량 할인을 협상하는 데 기반하고 있다는 점을 감안하면, 그 D2C 시장의 성장이 기대보다 더디다는 분명한 지표로 보입니다."},{"heading_en":"What I'm Reading","body":"WSJ는 얼마 전 주말에 Nurse Practitioner가 더 낮은 비용으로 \"의사 같은\" 서비스를 제공할 수 있기 때문에 헬스케어에서 가장 뜨거운 직업이라는 취지의 글을 실어 온라인 의사 커뮤니티를 자극했습니다. 대부분의 주제가 그렇듯 이 논의에도 뉘앙스가 있다는 것은 이해합니다만, 이 나라 헬스케어 접근성과 비용의 현 상황을 감안하면,"},{"heading_en":"What I'm Reading","body":"프라이머리 케어를 공공 유틸리티로 다뤄야 한다고 주장하는 JAMA Network 기사는, 프라이머리 케어를 공공 유틸리티로 생각한다는 것이 무슨 의미인지에 대한 Slack 대화에 흥미로운 소재를 제공했습니다. 위 WSJ 기사에 대한 반응은 프라이머리 케어에 대한 접근이 무엇을 뜻하는지 정의하는 일의 어려움을 시사합니다(AI 챗봇? NP? MinuteClinic 매장? 의사?). 여기서의 과제 일부는, 평균적인 미국인이 그 질문에 내놓을 답이 프라이머리 케어 의사가 내놓을 답과 상당히 다를 것이라는 점이라고 생각합니다."},{"heading_en":"What I'm Reading","body":"프라이머리 케어에 대한 접근이 지역 독점 사업자와 수직 통합된 대기업들이 우리에게 떠안긴, 미국만의 고유한 과제라고 생각하실까 봐 덧붙이자면, Financial Times는 NHS가 인력을 안정화하기 위해 케어 딜리버리에 AI를 더 많이 활용하는 인력 계획을 마무리하고 있다고 보도합니다. 예상대로 이는 이미 British Medical Association으로부터 \"거대하고 위험한 도박\"이라는 비난을 받고 있습니다."}]},"44":{"index":"44","title_en":"Weekly Health Tech Reads 6/7/26","subtitle":"사기에 관한 단상, 계속 커져 가는 자폐 치료 시장, 네트워크 외 진료 가격을 둘러싼 법적 공방, 그리고 그 밖의 소식","sections":[{"heading_en":"Sponsored by: Ursa Health","body":"스페셜티 밸류 기반 케어에 몸담고 계신 분들께, Atlas Oncology Partners의 공동창업자이자 Chief Physician Executive인 Dr. David Johnson, 그리고 Ursa Health의 CEO인 Dr. Robin Clarke에게서 배울 수 있는 이번 기회를 소개하게 되어 기쁩니다.\n\nAtlas의 풀리스크 온콜로지 케어 모델, 지금까지 스페셜티 VBC의 성공을 가로막아 온 과제들을 이들이 어떻게 헤쳐 왔는지, 그리고 Ursa와의 파트너십이 이들이 리스크를 모델링하고 관리하는 방식에 어떤 영향을 주었는지를 깊이 파고듭니다.\n\n합쳐서 20년이 넘는 VBC 경험을 가진 두 사람인 만큼, 아주 너드한 대화를 기대하셔도 좋습니다. 자세한 내용과 등록은 여기에서 확인하세요.\n\n뉴스레터 스폰서십에 관심이 있으시면 알려 주세요!"},{"heading_en":"MUSING","body":"헬스케어 사기의 최적 수준은 얼마인가?\n\n몇 년 전 정책에 밝은 친구와 나눈, 제게 큰 영향을 준 대화가 있습니다. 헬스케어 정책을
