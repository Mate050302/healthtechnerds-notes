 순응도 90% 주장","note":"순응도 90%는 회사 보도자료의 자기 주장이며 제3자가 검증한 수치가 아니다."}],"notes":[{"term":"환자 순응도(adherence)","ko":"정해진 대로 계속 약을 쓰는 비율","plain":"처방받은 약을 정해진 용법대로 끊지 않고 계속 쓰는 비율이다. 고용주에게 GLP-1 관리 상품을 팔 때 이 숫자가 곧 상품의 값어치가 되는데, eMed가 골드 스탠더드를 주장하며 내민 근거도 임상 결과가 아니라 이 숫자다. 약효 자체보다 계속 쓰게 만드는 관리 능력을 파는 셈이다."}]},{"heading_ko":"펀딩: Blossom Health 2,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"정신과 진료 기관의 업무를 돕는 AI 도구를 만드는 회사가 투자를 받았다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Blossom Health","what":"정신과 진료 기관을 위한 AI 코파일럿을 만들며 Headline이 주도한 라운드로 자금을 조달했다.","scale":"2,000만 달러, 임상의 수백 명이 환자 1만 명 이상 진료","note":""}],"notes":[]},{"heading_ko":"펀딩: Clasp 2,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"학자금 대출 상환을 지원해 병원이 채용한 임상 인력을 오래 근무하게 돕는 회사가 투자를 받았다. 앞선 꼭지의 인건비 상승 전망과 같은 문제를 다른 쪽에서 푸는 사업이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Clasp","what":"대출 상환 프로그램을 통해 고용주가 채용한 임상 인력을 유지하도록 돕는 스타트업이며 Crosslink Capital과 Digitalis Ventures가 주도한 라운드로 자금을 조달했다.","scale":"2,000만 달러, 다른 모델 대비 유지율 2.5배 주장","note":"Boston Children's Hospital, Memorial Sloan Kettering, Northwestern Medicine, Novant Health, Ohio Health가 이미 고객이다. 유지율 2.5배는 회사 주장이다."}],"notes":[]},{"heading_ko":"펀딩: Dimer Health 1,350만 달러","heading_en":"Funding Announcements","skip":null,"summary":"퇴원한 환자를 이후에 관리하는 AI 중심 플랫폼이 투자를 받았다는 한 줄짜리 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Dimer Health","what":"AI 중심의 퇴원 후 관리 플랫폼이며 Team8과 Table Management가 주도한 라운드로 자금을 조달했다.","scale":"1,350만 달러","note":""}],"notes":[]},{"heading_ko":"펀딩: Prax Health 1,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"간호사 자격으로 독립 진료소를 여는 사람에게 개원에 필요한 것을 한 묶음으로 제공하는 회사가 투자를 받았다. 미국 일부 주에서 간호사가 의사 감독 없이 진료할 수 있다는 제도 위에서 성립하는 모델이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Prax Health","what":"NP가 이끄는 클리닉을 위한 business-in-a-box 모델을 팔며 두 번의 라운드에 걸쳐 자금 조달을 발표했다.","scale":"1,000만 달러, NP 200명 이상 개원 지원, 올해 5배에서 10배 성장 전망","note":"개원 지원 인원과 성장 전망은 뉴스레터가 회사 쪽 설명을 그대로 전한 수치이며, 별도의 검증 근거는 붙어 있지 않다. Martin이 공동창업자 겸 CEO인 Meghan Jewitt와 마주 앉아 이 모델을 더 들었다는 언급이 함께 실렸다."}],"notes":[{"term":"NP(Nurse Practitioner)","ko":"전문 간호사","plain":"일정한 대학원 교육과 자격을 갖춘 간호사로, 주에 따라 의사의 감독 없이 진단하고 처방할 수 있다. 한국의 간호사와 달리 자기 이름으로 진료소를 열 수 있는 주가 있어서, 이 꼭지의 사업 모델이 성립한다. 의사보다 인건비가 낮아 1차 진료 공백을 메우는 인력으로 쓰인다."}]},{"heading_ko":"펀딩: Certuma 1,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"AI 닥터를 만드는 초기 단계 회사가 6,000만 달러 기업가치로 투자를 받았다는 한 줄짜리 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Certuma","what":"AI 닥터를 만드는 스타트업이며 8VC가 주도한 라운드로 자금을 조달했다.","scale":"1,000만 달러 조달, 기업가치 6,000만 달러","note":""}],"notes":[]},{"heading_ko":"펀딩: VITL 750만 달러","heading_en":"Funding Announcements","skip":null,"summary":"조제 약국과 롱제비티 클리닉을 연결하는 중개 플랫폼이 투자를 받았다. 필자가 앞선 단상에서 투자자의 펩타이드 기대를 보여 주는 신호로 꼽은 두 건 가운데 하나다.","insight":null,"signal":"조제 약국과 롱제비티 클리닉을 연결하는 VITL은 클리닉 고객이 630곳을 넘고 연환산 매출이 1,000만 달러를 넘는다고 밝혔다. 필자는 앞선 단상에서 롱제비티 클리닉을 소비자가 스스로 찾아가 펩타이드를 받는 곳으로 적었으므로, 이 630곳은 소비자가 직접 돈을 내고 주사를 받는 창구가 이미 그만큼 촘촘하게 깔려 있다는 뜻이 된다. 승인된 완제품이 아니라 개별 처방에 맞춰 조제한 주사제를 공급하는 유통망이 이미 매출을 내는 사업으로 서 있다는 점도 함께 드러난다. 필자는 이번 주 eMed와 VITL의 펀딩 발표를 앞으로 올 펩타이드 붐에 대한 투자자의 기대를 보여 주는 신호로 읽는다.","author":[],"experts":[],"cases":[{"name":"VITL","what":"조제 약국과 롱제비티 클리닉을 연결하는 플랫폼이다.","scale":"750만 달러 조달, 클리닉 고객 630곳 이상, ARR 1,000만 달러 이상","note":"고객 수와 ARR은 회사 발표다. 클리닉이 630곳이나 된다는 것은 이 시장의 공급 측이 이미 촘촘하다는 뜻이다."}],"notes":[{"term":"조제 약국(compounding pharmacy)","ko":"개별 처방에 맞춰 직접 조제하는 약국","plain":"완제품 의약품을 그대로 파는 것이 아니라 성분을 받아 개별 처방에 맞춰 직접 만들어 주는 약국이다. 미국에서는 승인된 약이 품절이거나 승인된 용도 밖으로 쓰일 때 이 경로가 활용되며, 롱제비티 클리닉의 주사제 공급도 여기에 기댄다. 한국에는 이 정도 규모의 조제 유통 산업이 없다."}]},{"heading_ko":"읽을거리: 메디케이드와 AI","heading_en":"What I'm Reading: Medicaid + AI: A New Standard for Innovation","skip":null,"summary":"저소득층 공공 의료 부조 대상자를 진료하는 회사의 CEO가 자사의 AI 도입 방식을 정리한 글을 소개한다. 원칙과 실제 적용 지점을 함께 다룬다는 것이 필자의 평이다.","insight":null,"signal":null,"author":[{"claim":"이론적 원칙과 멤버 여정에 AI를 어떻게 녹여 넣고 있는지를 양쪽에서 다룬 좋은 관점이다.","evidence":"글의 구성을 근거로 들 뿐 구체적인 내용은 옮기지 않았다."}],"experts":[{"who":"Toyin Ajayi","role":"메디케이드 대상자를 진료하는 Cityblock의 공동창업자 겸 CEO이며, 자사 방식을 소개하는 당사자다","claim":"Cityblock은 메디케이드 인구를 대상으로 AI를 도입하고 있으며 멤버 여정 안에 AI를 넣고 있다.","evidence":"뉴스레터는 글의 존재와 주제만 전하고 근거를 옮기지 않았다."}],"cases":[],"notes":[{"term":"메디케이드(Medicaid)","ko":"저소득층 대상 공공 의료 부조","plain":"소득이 낮은 사람을 위해 연방과 주가 함께 돈을 대는 미국의 공공 의료 제도다. 주마다 운영 방식과 자격 기준이 달라서 전국이 하나의 제도로 굴러가지 않는다. 노인을 대상으로 하는 메디케어와는 별개의 제도이며, 한국의 의료급여에 가깝다."}]},{"heading_ko":"읽을거리: CMS 질 측정 컨퍼런스 시사점","heading_en":"What I'm Reading: The Future of Quality in Medicare and Medicaid: Themes from the CMS Quality Conference","skip":null,"summary":"미국 공보험을 운영하는 연방 기관이 무엇을 잘한 진료로 볼 것인지를 다시 정하는 자리의 시사점을 정리한 글이다. 첫 번째 시사점이 치료에서 예방 서비스로의 초점 이동이라는 점을 필자가 짚는다.","insight":null,"signal":null,"author":[{"claim":"첫 번째 시사점이 치료에서 예방 서비스로의 초점 이동이라는 점이 흥미로웠지만 아주 놀랍지는 않았다.","evidence":"왜 놀랍지 않은지는 밝히지 않아 근거를 대지 않았다."},{"claim":"연례 웰니스 방문과 영양, 생활습관 개입이 이 전환에서 핵심 역할을 한다.","evidence":"필자가 컨퍼런스 시사점을 요약하며 덧붙인 문장이고, 어떤 근거로 이 세 가지를 꼽았는지는 밝히지 않았다."}],"experts":[{"who":"Avalere Health 팀","role":"헬스케어 정책·전략 컨설팅 회사이며, 이 변화를 고객에게 설명해 주는 것이 사업인 쪽이다","claim":"최근 열린 CMS 질 측정 컨퍼런스의 첫 번째 시사점은 초점이 치료에서 예방 서비스로 옮겨 가고 있다는 것이다.","evidence":"컨퍼런스에 직접 참석해 얻은 시사점이라고 밝힐 뿐, 뉴스레터는 그 근거를 옮기지 않았다."}],"cases":[],"notes":[{"term":"CMS와 질 측정(quality measures)","ko":"미국 공보험 운영 기관과 그 성적표","plain":"CMS는 노인 대상 메디케어와 저소득층 대상 메디케이드를 운영하는 연방 기관이다. 질 측정은 CMS가 병원과 보험 플랜에 돈을 더 줄지 덜 줄지 정할 때 쓰는 성적표이며, 무엇을 재느냐가 바뀌면 현장이 무엇에 힘을 쏟을지도 함께 바뀐다. 한국의 심평원 적정성 평가와 성격이 비슷하지만, 금액 차이가 훨씬 크게 벌어진다."},{"term":"연례 웰니스 방문(Annual Wellness Visit)","ko":"해마다 한 번 받는 예방 목적 면담","plain":"아픈 데를 치료하는 진료가 아니라, 위험 요인을 점검하고 앞으로의 예방 계획을 세우는 자리다. 미국 공보험 가입자가 정기적으로 받을 수 있게 마련해 둔 제도이며, 이 꼭지에서 예방 중심 전환의 대표 수단으로 꼽힌다. 한국의 국가건강검진과 목적이 비슷하지만, 검사보다 면담과 계획 수립이 중심이다."}]},{"heading_ko":"읽을거리: 2026년 헬스케어 시장이 말해 주는 열 가지","heading_en":"What I'm Reading: Break Stuff: Ten Things the Healthcare Market Is Telling Us in 2026","skip":null,"summary":"앞서 88% 수치가 나온 HEP 연례 설문의 원문을 소개하는 자리다. AI가 이끄는 변화의 현주소와 헬스케어 조직에 가해지는 비용 압박을 다룬다.","insight":null,"signal":null,"author":[{"claim":"이 연례 설문은 AI가 이끄는 변화의 현주소와 비용 압박에 대해 유용한 인사이트를 제공했다.","evidence":"설문 대상이 헬스케어 임원 150명 이상이라는 사실만 덧붙일 뿐, 어떤 내용이 유용했는지에 대한 근거는 대지 않았다."}],"experts":[],"cases":[],"notes":[]},{"heading_ko":"읽을거리: 에이전틱 EHR의 부상","heading_en":"What I'm Reading: Rise of the Agentic EHR","skip":null,"summary":"병원 전자의무기록 시장을 흔들 주체가 무엇이 될지에 대한 짧은 글을 소개한다. 필자는 결론보다 왜 지금이냐를 설명하는 논점들이 곱씹어 볼 만하다고 본다.","insight":null,"signal":null,"author":[{"claim":"이 글이 제시한 왜 지금인가에 대한 논점들은 곱씹어 볼 만하다.","evidence":"글에 담긴 네 가지 논점을 그대로 옮길 뿐 따로 검증하지 않았다."}],"experts":[{"who":"Colton Ortolf","role":"X에 이 글을 올린 사람이며, 원문은 소속을 밝히지 않는다","claim":"에이전틱 EHR이 헤드리스 EHR 개념을 대체하며 EHR 시장의 파괴자가 될 가능성이 있다.","evidence":"AI로 유통 비용이 낮아지는 점, 더 나아진 기술, 더 많은 중소 프로바이더 고객, 혁신가의 딜레마에 빠진 기존 강자 집단을 근거로 든다."}],"cases":[],"notes":[{"term":"EHR","ko":"전자의무기록 시스템","plain":"병원이 진료 기록과 처방, 검사 결과를 넣어 두고 쓰는 기간 시스템이다. 미국에서는 소수 업체가 시장을 사실상 나눠 갖고 있고 병원이 한번 도입하면 바꾸기 어려워서, 기존 업체를 밀어내는 일이 헬스테크의 오랜 화두다."},{"term":"헤드리스 EHR과 에이전틱 EHR","ko":"화면 없는 EHR과 에이전트가 일하는 EHR","plain":"헤드리스 EHR은 화면 없이 데이터와 기능만 제공해 다른 앱들이 그 위에 붙어 각자의 화면을 만들게 하자는 구상이다. 에이전틱 EHR은 AI 에이전트가 기록 작성과 사무를 대신 처리하면서 기존 시스템의 자리를 밀어내는 구상이다. 이 글의 요지는 앞의 것보다 뒤의 것이 실제 파괴자가 될 가능성이 크다는 것이다."}]},{"heading_ko":"읽을거리: 건강하게 지켜 낸 만큼 의사에게 지급하라","heading_en":"What I'm Reading: Doctors should be paid to keep patients healthy","skip":null,"summary":"진료 건수가 아니라 환자를 건강하게 유지한 결과로 돈을 받는 방식을 더 밀어붙이자는 주장을 담은 시리즈다. 필자는 업계 사람에게는 새로울 것이 없지만 일반 독자를 향해 이 주장이 어떻게 펼쳐지는지가 흥미롭다고 본다.","insight":null,"signal":null,"author":[{"claim":"이 분야에 밝은 사람에게는 새로울 것이 많지 않지만, 좀 더 일반적인 독자를 향해 이 주장이 어떻게 펼쳐지는지 보는 것은 흥미롭다.","evidence":"왜 일반 독자에게 유효한지는 밝히지 않아 근거를 대지 않았다."}],"experts":[{"who":"Ashish Jha, Tom Tsai","role":"Substack과 Boston Globe에 이 시리즈를 함께 쓴 저자들이며, 원문은 소속과 이해관계를 밝히지 않는다","claim":"밸류 기반 케어가 나아갈 길은 진료 기관이 지는 책임의 크기를 키우는 것이며, 전문 진료를 포함한 상방·하방 리스크와 더 긴 계약 기간이 필요하다.","evidence":"뉴스레터는 주장의 골자만 전하고 근거는 옮기지 않았다."}],"cases":[],"notes":[{"term":"밸류 기반 케어(value-based care)와 상방·하방 리스크","ko":"성과에 따라 지급하는 방식과 이익·손실을 함께 지는 구조","plain":"진료를 많이 할수록 더 받는 행위별 수가 대신, 환자를 건강하게 유지하고 총 진료비를 줄인 결과에 따라 돈을 받는 방식이다. 상방 리스크는 비용을 아끼면 그만큼 나눠 갖는 것이고, 하방 리스크는 예상보다 많이 쓰면 그만큼 물어내는 것이다. 하방까지 지면 진료 기관이 실제로 손해를 볼 수 있으므로, 책임의 크기를 키운다는 표현이 쓰인다. 한국은 대부분 행위별 수가라 이런 계약이 드물다."}]},{"heading_ko":"읽을거리: 세포·유전자 치료제의 값과 가치","heading_en":"What I'm Reading: High-Stakes Medicine: Rethinking Policies for the Cost and Value of Cell and Gene Therapies","skip":null,"summary":"한 번 투여로 큰 효과를 노리는 고가 치료제가 지불 구조 안에서 겪는 어려움을 다룬 글이다. 필자는 특히 병원 쪽 재정 부담에 관한 대목을 흥미롭게 봤다.","insight":null,"signal":null,"author":[{"claim":"병원이 이런 프로그램에 투자할 때 겪는 재정적 어려움에 대한 지적이 특히 흥미로웠다.","evidence":"CGT 프로그램을 시작하는 데 선불로 100만 달러가 들 수 있는데 이후의 환자 유입에 대한 가시성은 제한적이라는 글의 지적을 든다."}],"experts":[{"who":"Alison Sexton Ward, Elizabeth Fowler, Jeremy Shane, Darius Lakdawalla","role":"이 글을 함께 쓴 저자들이며, 원문은 소속과 이해관계를 밝히지 않는다","claim":"세포·유전자 치료제는 보상 경로 측면에서 고유한 어려움을 안고 있으며, 병원이 프로그램에 투자하기 어렵게 만드는 재정 구조가 그 하나다.","evidence":"프로그램 개설에 선불 100만 달러가 들 수 있다는 점과 이후 환자 유입 예측이 어렵다는 점을 든다."}],"cases":[],"notes":[{"term":"세포·유전자 치료제(CGT)","ko":"한 번 투여로 효과를 노리는 초고가 치료제","plain":"환자의 세포나 유전자를 손봐 병을 근본적으로 고치려는 치료제로, 한 번 쓰는 데 수억 원이 드는 경우가 많다. 미국은 병원이 약을 먼저 사서 환자에게 쓴 다음 보험사에 청구하는 구조여서, 환자가 얼마나 올지 모르는 상태로 큰돈을 미리 들여야 하는 문제가 생긴다. 여러 해에 걸쳐 나눠 받는 식의 새로운 지불 방식이 논의되는 이유가 여기에 있다."}]},{"heading_ko":"이번 주 HTN 콘텐츠: 커뮤니티","heading_en":"HTN Content From the Week","skip":"promo","summary":"뉴스레터가 운영하는 커뮤니티의 이번 주 글을 알리는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"이번 주 HTN 콘텐츠: 정책 브리핑","heading_en":"HTN Content From the Week","skip":"promo","summary":"뉴스레터가 따로 내는 주간 정책 브리핑을 알리는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"이번 주 HTN 콘텐츠: 팟캐스트","heading_en":"HTN Content From the Week","skip":"promo","summary":"뉴스레터가 운영하는 팟캐스트의 이번 주 에피소드 네 편을 알리는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]}],"themes":["pharma-glp1","consumer-dtc","digital-health-funding","ai-clinical","rcm-billing","hospital-health-system"],"for_later":[]},{"index":"33","date":"2026-04-19","type":"reads","title_en":"Weekly Health Tech Reads 4/19/26","title_ko":"ACCESS 수가 불참, 펩타이드 골드러시","hook":"정부가 정한 수가를 보고 디지털 헬스가 발을 뺐고, 규제가 풀릴 조짐이 보인 펩타이드로는 돈이 몰렸다.","tldr":[{"point":"CMS가 7월 5일 시작하는 ACCESS 모델의 초기 참여자 약 150곳을 공개했는데, 출범 당시 관심을 표명했던 68개 기업 중 22곳만 실제로 신청했고 거의 70%가 수가를 보고 빠졌다.","note":"미국 정부가 새 지불 모델을 시범 운영할 때는 참여를 강제하지 않고 기업이 스스로 신청하게 하므로, 신청률 자체가 업계가 그 단가로 돈을 벌 수 있다고 보는지에 대한 투표가 된다."},{"point":"FDA가 펩타이드(BPC-157, TB-500 포함) 규제 완화를 검토한다는 연방 공고가 나오자 Hims & Hers 주가가 한 주 만에 약 50% 올랐고, Superpower는 새 펩타이드 제품을 예고했으며 신생 회사 Protocole이 600만 달러를 유치했다.","note":"이 펩타이드들은 지금 미국에서 정식 허가 없이 회색시장으로 유통되고 있어 품질을 믿기 어려운데, 그런데도 사람들이 자기 돈으로 사고 있기 때문에 규제가 풀리면 곧바로 큰 소비자 시장이 열린다고 보는 것이다."},{"point":"ACA 시장에서 1월에 첫 보험료를 내지 않은 사람이 14%였고 일부 주에서는 25%가 넘었으며, Wakely는 시장 규모가 2025년 대비 17~26% 줄고 평균 질병률이 2.9~6.5% 오를 것으로 봤다.","note":"첫 보험료를 내지 않으면 가입 신청을 했더라도 보험이 시작되지 않으므로, 이 숫자는 '보험료를 감당하지 못해 결국 무보험으로 남은 사람'의 규모에 가깝다."},{"point":"Merck가 항암제 Keytruda 하나로 2014~2025년에 1,630억 달러를 벌었고 ICIJ가 1년에 걸친 조사로 그 매출을 지키기 위한 행위를 밝혔는데, 필자는 같은 주에 읽은 파마 옹호 글과 이 기사를 나란히 놓고 트레이드오프를 이야기한다.","note":"필자는 비판에 동의하면서도 가족에게 그 약이 필요하다면 미국에 있는 쪽을 택하겠다고 덧붙였다."},{"point":"Nature Health에 실린 논문이 Microsoft Copilot의 건강 관련 질의 50만 건을 분석해 사람들이 챗봇에 무엇을 묻는지 살폈고, 데스크톱과 모바일에서 질문의 성격이 다르게 나타났다.","note":"필자는 그 차이가 직장에서는 데스크톱을, 개인적인 검색에는 모바일을 쓰는 습관과 맞아떨어져 보인다고 해석했다."},{"point":"Trilliant Health는 행동건강 이용량이 2018~2024년에 62% 늘었다고 밝혔고, 같은 주말 Trump 대통령은 중증 정신질환 치료에 사이키델릭을 쓰는 장벽을 없애는 행정명령에 서명했다.","note":"행동건강은 정신질환과 중독 치료를 함께 묶어 부르는 미국식 용어다."}],"issue_insight":{"verdict":"yes","summary":"이번 회차의 큰 이야기(정부 수가, 보험사 철수, 청구 업무)는 우리가 손댈 자리가 아니다. 다만 사람들이 자기 돈과 시간을 어디에 쓰는지 보여 주는 대목이 여러 개 있고, 그중 두 가지는 3개월 안에 앱 화면으로 시험해 볼 수 있다.","build":[{"title":"건강 질문을 받아 주는 앱 안의 창구","detail":"Copilot 건강 질의 50만 건 분석은 사람들이 이미 챗봇에 건강을 묻고 있고 모바일에서는 그 질문이 더 개인적이라는 것을 보여 준다. 우리 앱은 모바일 전용이므로, 걸음과 건강 나이 옆에 질문 창구를 붙이고 실제로 무엇을 묻는지 로그로 모으면 다음 기능의 근거까지 함께 얻는다.","section":19},{"title":"스스로 사서 먹는 것의 기록장","detail":"펩타이드처럼 병원 밖에서 자기 돈으로 사 먹는 것이 늘고 있는데 무엇을 언제 얼마나 썼는지 남기는 곳은 마땅치 않다. 복용 기록과 걸음·수면 같은 기존 지표를 나란히 보여 주는 자가 기록 화면은 소프트웨어만으로 만들 수 있고, 제품을 팔거나 복용을 권하지 않으므로 규제 문제도 피한다.","section":4}],"signal":[{"title":"허가 밖 펩타이드를 자기 돈으로 사는 흐름","detail":"회색시장에서 이미 거래되던 펩타이드에 규제 완화 조짐이 보이자 상장사 주가가 한 주에 50% 오르고 신생 회사가 시드 600만 달러를 받았다. 미국 소비자가 제도권 밖 건강 제품에 지갑을 여는 규모를 보여 준다.","section":4},{"title":"보험을 놓고 자기 부담으로 돌아서는 사람들","detail":"ACA 시장에서 첫 보험료를 내지 않은 사람이 14%, 일부 주는 25% 이상이고 시장 자체가 17~26% 줄어들 전망이다. 보험 없이 값을 직접 치르는 소비자가 늘어난다는 뜻이다.","section":10},{"title":"정신건강 수요의 지속적인 증가","detail":"행동건강 이용량이 2018~2024년 사이 62% 늘었다. 미국에서 사람들이 시간과 비용을 계속 더 쓰고 있는 몇 안 되는 영역이다.","section":11},{"title":"노화 관리 클리닉이라는 업태의 등장","detail":"롱제비티 클리닉 전용 EHR을 만드는 회사가 930만 달러를 받았고 이미 75곳에서 쓰인다. 원문이 대는 근거는 이 숫자 하나뿐이지만, 질병 치료가 아닌 건강 최적화에 돈을 쓰는 시장이 업태로 자리 잡는 방향은 보인다.","section":15}]},"sections":[{"heading_ko":"후원: UnityAI","heading_en":"Sponsored by: UnityAI","skip":"sponsor","summary":"소규모 진료소용 에이전틱 AI를 만드는 UnityAI 창업 팀과 나눈 대화를 소개하는 후원 자리다. 850만 달러 투자 유치와 AI 도입 순서에 관한 이야기를 다룬다고 밝힌다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"여는 말","heading_en":"","skip":"admin","summary":"필자 Kevin이 이번 주에 다룰 세 가지를 미리 알려 주는 인사말이다. ACCESS 수가, ACA 등록 데이터, 펩타이드 골드러시의 제도권 편입이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"ACCESS 모델 신청 결과와 정부·업계의 눈싸움","heading_en":"ACCESS MODEL","skip":null,"summary":"미국 정부가 새로 만든 메디케어 지불 모델 ACCESS의 참여자 명단이 공개됐고, 처음에 관심을 보였던 디지털 헬스 기업 대부분이 결국 신청하지 않았다는 이야기다. 정부는 이 수가로 사업이 된다고 하고 업계는 안 된다고 하는데, 양쪽 모두 자기 손익 계산서를 근거로 삼는다. 필자는 어느 쪽 계산이 맞느냐가 이 모델의 성패라고 본다. 미국 헬스케어 지불 구조를 모르면 가장 막히는 꼭지이므로 아래 용어 설명을 먼저 보는 편이 낫다.","insight":null,"signal":null,"author":[{"claim":"관심을 표명했던 68개 기업 중 22곳만 신청했고, 거의 70%가 결국 빠졌다.","evidence":"CMS가 모델 출범 때 쓴 슬라이드의 기업 목록을 직접 하나씩 대조해 신청 여부를 표시했다."},{"claim":"이 결과는 CMMI와 디지털 헬스 업계 사이의 눈싸움을 보여 준다.","evidence":"CMS 지도부는 수가가 감당 가능하다고 거듭 말했고, 업계는 신청조차 하지 않는 것으로 반대 의견을 표시했다."},{"claim":"Sword Health의 불참은 양쪽 계산이 얼마나 멀리 떨어져 있는지 보여 주는 사례다.","evidence":"Sword는 큰 비전과 그에 걸맞은 밸류에이션을 지닌 고성장 기업이고 그리스 정부와 손잡은 전례도 있으므로, 손익분기에 이를 길이나 약간의 손실을 감수할 여지만 있었어도 뛰어들었으리라고 봤다."},{"claim":"이 재무 논란은 'AI가 케어 딜리버리의 한계비용을 0으로 만든다'는 주장에 만만치 않은 반증이다.","evidence":"AI 기반 케어 딜리버리 비용을 실제로 모델링한 기업들이 계산이 맞지 않는다며 참여를 접었다는 사실을 든다."},{"claim":"새로운 진입자를 메디케어로 초대하는 것이 이 모델에서 최선의 베팅으로 보인다.","evidence":"ACCESS의 목표가 지출을 줄이는 것이라는 점만 들었고, 그 이상의 근거는 대지 않았다."}],"experts":[{"who":"Abe Sutton","role":"이 모델을 설계한 정부 조직 CMMI의 Director","claim":"ACCESS Model의 설계에 자신이 있다.","evidence":"필자는 Stat에 실린 Mario Aguilar의 기사를 인용했을 뿐, 그가 어떤 근거를 들었는지는 옮기지 않았다."},{"who":"CMS 지도부","role":"메디케어를 운영하며 이 수가를 정한 쪽","claim":"이 수가는 감당 가능하며, ACCESS는 기존 모델을 조금 덜어 내는 incumbent가 아니라 재무 모델을 바닥부터 새로 짠 insurgent만 성공할 수 있는 프로그램이다.","evidence":"근거를 대지 않았다. 필자는 CMS가 이 말을 되풀이해 왔다고만 전한다."}],"cases":[{"name":"CMS ACCESS 모델 초기 참여자 명단","what":"CMS가 월요일에 약 150곳의 초기 참여자를 공개하고, 신청 마감을 5월 중순까지 연장했다. 명단에는 메디컬 그룹, 디지털 헬스 기업, 프라이머리 케어 이네이블러, 소비자 직접 판매 모델이 섞여 있다.","scale":"참여자 약 150곳, 프로그램 시작일 7월 5일, 초기 관심 68곳 중 신청 22곳","note":"마감 연장은 정부가 참여자 수에 만족하지 못했다는 신호로 읽힌다.","sells_to":"other"},{"name":"Sword Health","what":"AI와 자사 Sword Intelligence 플랫폼으로 헬스케어를 바꾸겠다는 비전을 내건 비상장 고성장 기업이며, 그리스 정부와 손잡은 전례가 있는데도 ACCESS에 신청하지 않았다.","scale":"","note":"원문은 이 회사가 누구에게 서비스를 파는지는 밝히지 않는다.","sells_to":"other"},{"name":"Whoop, Withings","what":"소비자용 건강 측정 기기를 만드는 회사인데 ACCESS에 참여했다.","scale":"","note":"필자가 이 모델에서 가장 눈여겨보는 참여자다. 소비자에게 기기를 팔던 회사가 메디케어에서 돈을 받는 자리로 들어온다는 뜻이다.","sells_to":"mixed"}],"notes":[{"term":"메디케어(Medicare)","ko":"65세 이상 등을 대상으로 하는 연방 공적 보험","plain":"미국에는 전 국민 건강보험이 없고, 65세 이상과 일부 장애인만 연방 정부가 운영하는 메디케어에 들어간다. 나머지 사람들은 직장 보험이나 개인 보험을 따로 사야 한다. 한국의 건강보험을 노인에게만 적용한다고 생각하면 가깝다."},{"term":"CMS와 CMMI","ko":"메디케어 운영 기관과 그 안의 시범사업 조직","plain":"CMS는 연방 정부에서 메디케어와 메디케이드를 운영하는 기관이다. CMMI는 그 안에서 새로운 지불 방식을 시범 운영하는 조직으로, 기존처럼 진료 건마다 값을 치르는 대신 다른 방식으로 돈을 주는 실험을 설계한다. 한국으로 치면 건강보험공단과 심사평가원이 하는 일 가운데 '새 수가 모델 시범사업' 부분만 떼어 놓은 조직이다."},{"term":"ACCESS 모델과 수가","ko":"CMMI가 만든 새 지불 모델과 그 단가","plain":"여기서 수가는 참여 기업이 메디케어 환자 한 명을 맡을 때 정부가 주는 값이다. 이 모델은 지출을 줄이는 것이 목적이라 정부가 의도적으로 낮은 값을 제시했고, 그래서 기업들이 그 값으로 사람을 고용하고 서비스를 굴려서 남길 수 있는지를 각자 계산했다. 참여 여부가 기업의 선택이므로 낮은 수가는 곧 낮은 신청률로 나타난다. 원문은 이 모델이 구체적으로 어떤 진료를 다루는지는 설명하지 않는다."},{"term":"insurgent와 incumbent","ko":"새로 판을 짜는 쪽과 기존 사업자","plain":"정부가 쓰는 구분이다. incumbent는 이미 하던 사업에서 비용을 조금 덜어 내며 들어오는 쪽이고, insurgent는 이 낮은 값에 맞춰 사업 구조를 처음부터 새로 짜는 쪽이다. 필자는 Sword 같은 신생 기업까지 빠진 것을 보면 이 구분이 실제 상황을 설명하지 못한다고 지적한다."}]},{"heading_ko":"펩타이드 규제 완화 신호와 몰리는 돈","heading_en":"PEPTIDES","skip":null,"summary":"FDA가 일부 펩타이드에 대한 규제를 완화하는 쪽을 검토한다는 공고가 나왔고, 그 하루 만에 관련 상장사 주가와 신생 회사 투자가 함께 움직인 이야기다. 지금까지 회색시장에서 팔리던 물건이 제도권으로 들어올 수 있다는 기대가 값을 매기고 있다. 필자는 2026년 들어 이 주제가 매주 반복되고 있다고 적는다.","insight":"병원 밖에서 자기 돈으로 사 먹는 것을 기록하는 화면은 3개월 안에 소프트웨어만으로 만들 수 있다. 무엇을 언제 얼마나 썼는지 남기고 걸음이나 수면 같은 기존 지표와 나란히 보여 주면, 지금 사람들이 흩어진 메모로 하고 있는 자가 실험을 앱 안으로 가져올 수 있다. 제품을 팔거나 복용을 권하지 않고 기록만 받으므로 규제 허가가 필요 없다는 점이 이 방향의 장점이다.","signal":"미국 소비자가 정식 허가 없이 유통되는 건강 제품에 이미 자기 돈을 쓰고 있다는 신호다. 규제 완화 검토 공고 하나에 상장사 주가가 한 주 만에 약 50% 오르고 신생 회사가 시드 600만 달러를 받은 것은, 시장이 이 수요를 실재한다고 본다는 뜻이다.","author":[{"claim":"이번 FDA의 움직임에는 회색시장에 있던 생산을 제도권으로 끌어내려는 목적도 일부 있어 보인다.","evidence":"지금 회색시장에서 만들어지는 제품의 품질을 우려할 수밖에 없다는 점을 든다."},{"claim":"펩타이드를 둘러싼 기세가 조만간 꺾일 것 같지 않다.","evidence":"2026년 들어 거의 매주 이 주제를 다루고 있다는 자신의 관찰만 들었다."}],"experts":[{"who":"Superpower의 CEO","role":"소비자를 상대하는 건강 관리 회사의 경영자로, 펩타이드 시장에 진입하려는 당사자","claim":"곧 새 펩타이드 제품을 내놓겠다.","evidence":"LinkedIn에 알렸다는 사실만 전할 뿐, 근거는 원문에 없다."}],"cases":[{"name":"FDA 연방 공고","what":"수요일에 FDA가 BPC-157과 TB-500을 포함한 펩타이드의 규제 완화를 검토 중이라는 공고가 나왔다.","scale":"","note":"아직 결정이 아니라 검토 단계인데도 시장이 곧바로 반응했다.","sells_to":"none"},{"name":"Hims & Hers","what":"온라인으로 소비자에게 직접 약과 치료를 파는 상장사로, FDA 소식이 나온 뒤 한 주 동안 주가가 약 50% 올랐다.","scale":"주가 한 주 약 50% 상승","note":"투자자들이 펩타이드 판매의 최대 수혜자로 소비자 직접 판매 채널을 꼽았다는 뜻이다.","sells_to":"consumer"},{"name":"Superpower","what":"CEO가 금요일 LinkedIn을 통해 곧 출시할 새 펩타이드 제품을 알렸다.","scale":"","note":"","sells_to":"consumer"},{"name":"Protocole","what":"펩타이드에 임상적으로 더 탄탄한 접근을 제공하겠다며 이번 주 스텔스에서 나온 신생 회사다.","scale":"시드 600만 달러","note":"회색시장 브랜드와 구별되는 신뢰성을 팔겠다는 전략이다.","sells_to":"consumer"}],"notes":[{"term":"펩타이드(BPC-157, TB-500)","ko":"아미노산이 짧게 이어진 물질","plain":"몸속 단백질보다 짧은 사슬 형태의 물질로, 회복이나 재생을 돕는다는 기대로 쓰인다. 본문에 나오는 BPC-157과 TB-500은 미국에서 정식 의약품으로 허가받지 않은 상태라 처방으로 살 수 없다. 그래서 규제 완화 검토라는 소식만으로도 시장이 크게 움직인 것이다."},{"term":"회색시장(grey market)","ko":"불법은 아니지만 정식 허가도 없는 유통","plain":"연구용이라는 이름으로 팔거나 조제 약국을 통해 우회 유통되는 경로다. 완전한 암시장은 아니지만 정식 허가 절차를 거치지 않으므로 성분과 순도를 보증하는 주체가 없다. 한국에는 이 정도 규모로 형성된 대체 유통 경로가 없어 낯선 개념이다."},{"term":"Wolverine Stack","ko":"회복 목적으로 함께 쓰는 조합의 별칭","plain":"이 꼭지의 부제에 나오는 표현이다. 상처가 빨리 아무는 영화 속 인물의 이름을 따서, 회복과 재생을 노리고 몇 가지 펩타이드를 함께 쓰는 조합을 사용자들끼리 부르는 말이다. 정식 제품명이 아니라 소비자 커뮤니티에서 만들어진 이름이라는 점이 이 시장의 성격을 보여 준다."}]},{"heading_ko":"이번 주의 차트: 제약사의 다음 판","heading_en":"CHART OF THE WEEK","skip":null,"summary":"제약 산업의 다음 단계를 2×2로 정리한 남의 글을 소개하는 짧은 꼭지다. 요지는 신약 분자를 만드는 일을 넘어서 고용주 시장에서 하나의 생태계로 이기는 쪽으로 간다는 것이다. 그 글은 제약 협회 PhRMA의 차기 수장에게 필요한 역량도 함께 짚는다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Hardcore Zen 뉴스레터 필자","role":"제약 산업의 방향을 다루는 글쓴이로, 원문에 이름과 소속이 밝혀져 있지 않다","claim":"제약사의 다음 단계는 분자 개발을 넘어 LillyDirect처럼 생태계를 만들어 고용주 시장에서 이기는 것이며, 모두가 PBM의 가치를 의심하는 지금 GLP-1을 프레임을 바꾸는 약으로 삼아 제약 산업의 새 내러티브를 만들 기회가 있다.","evidence":"2×2 매트릭스와 LillyDirect 사례를 들었다. 필자는 그 이상의 근거를 옮기지 않았다."}],"cases":[{"name":"LillyDirect","what":"제약사 Eli Lilly가 중간 유통을 거치지 않고 환자에게 직접 닿는 통로로, 원문은 이를 생태계 전략의 사례로 든다.","scale":"","note":"약을 만들던 회사가 소비자와 직접 만나는 통로를 스스로 갖는 흐름이다.","sells_to":"consumer"},{"name":"PhRMA","what":"미국 제약 업계의 협회로, 차기 CEO를 찾고 있다.","scale":"","note":"","sells_to":"other"}],"notes":[{"term":"PBM","ko":"약제비 관리 회사","plain":"보험사를 대신해 어떤 약을 보장 목록에 넣을지 정하고 제약사와 할인을 협상하는 중간 회사다. 제약사가 정가를 올리고 PBM이 비공개 할인을 받아 차액을 나눠 갖는 구조라 값이 왜 그렇게 정해지는지 아무도 알기 어렵다는 비판을 받는다. 한국에는 이 역할이 없고 정부가 약값을 직접 정하기 때문에 대응하는 제도를 찾기 어렵다."},{"term":"고용주 시장","ko":"회사가 직원에게 사 주는 보험 시장","plain":"미국에서는 65세 미만 대다수가 다니는 회사를 통해 건강보험에 든다. 그래서 어떤 약과 서비스를 쓸지 고르는 힘이 개인이 아니라 회사와 그 회사가 고용한 관리 업체에 있다. 제약사가 고용주 시장에서 이기겠다는 말은 개인 환자가 아니라 기업 인사·복리후생 담당자를 설득하겠다는 뜻이다."},{"term":"GLP-1","ko":"비만·당뇨 치료제 계열","plain":"원래 당뇨 치료제로 나왔다가 체중 감량 효과로 폭발적으로 팔린 주사제 계열이다. 값이 비싸고 쓰는 사람이 많아 미국 의료비 논쟁의 한복판에 있다. 이 글은 제약사가 이 약을 계기로 '비용을 늘리는 쪽'이 아니라 '건강을 떠받치는 쪽'이라는 이야기를 새로 쓸 수 있다고 본다."}]},{"heading_ko":"숫자 하나: 1,630억 달러","heading_en":"A NUMBER TO PONDER","skip":null,"summary":"항암제 Keytruda 한 품목이 12년 동안 벌어들인 매출과, 그 매출을 지키기 위해 제약사가 한 일을 파헤친 국제 탐사보도를 소개한다. 필자는 앞 꼭지의 제약 옹호 글과 이 기사를 같은 주에 나란히 읽은 소회를 적는다. 판단을 한쪽으로 몰지 않고 트레이드오프로 남겨 둔다.","insight":null,"signal":null,"author":[{"claim":"제약을 옹호하는 글과 Keytruda 조사 기사를 나란히 읽으면 양쪽 논리가 모두 이해된다.","evidence":"제약을 공중보건을 떠받치는 생태계로 보는 관점과, 매출을 지키려 온갖 수단을 쓴 조사 결과를 각각 들었다."},{"claim":"사람들이 미국 헬스케어를 아무리 비판해도, 가족에게 Keytruda가 필요하다면 다른 곳이 아니라 미국에 있는 쪽을 택하겠다.","evidence":"근거를 대지 않았다. 개인적인 소회로 적었다."}],"experts":[],"cases":[{"name":"Merck의 Keytruda","what":"항암제 한 품목이 2014년부터 2025년 사이에 올린 총매출이다.","scale":"1,630억 달러","note":"한 회사의 한 제품이 12년 동안 우리 돈으로 200조 원이 넘는 매출을 냈다는 뜻이다.","sells_to":"pharma"},{"name":"International Consortium of Investigative Journalists 조사","what":"전 세계 Keytruda 판매를 두고 1년에 걸친 탐사보도를 진행해, Merck가 그 매출원을 지키기 위해 온갖 수단을 동원해 왔다는 사실을 밝혔다.","scale":"조사 기간 1년","note":"원문은 구체적으로 어떤 수단이었는지는 옮기지 않는다.","sells_to":"none"}],"notes":[{"term":"미국의 약값 구조","ko":"정부가 값을 일괄로 정하지 않는다","plain":"한국은 건강보험이 약값을 정해 전국에 같은 값이 적용되지만, 미국은 제약사가 값을 매기고 보험사와 PBM이 각자 협상한다. 그래서 같은 약도 보험에 따라 부담이 다르고, 잘 듣는 신약 하나가 오래 독점을 유지하면 매출이 매우 커진다. 이 꼭지의 1,630억 달러라는 숫자가 나오는 배경이다."}]},{"heading_ko":"Abridge, 의학저널 콘텐츠와 손잡다","heading_en":"Other Top Headlines","skip":null,"summary":"의료진용 AI 회사 Abridge가 유력 의학저널의 콘텐츠를 자사 제품에 넣기로 한 소식이다. 필자의 관심은 계약 자체보다, 비슷한 제품을 파는 AI 회사 여러 곳과 동시에 파트너십을 맺은 대형 병원이 앞으로 어떻게 정리할 것인가에 있다. 보도자료에 병원 CEO의 코멘트가 있었는지 없었는지까지 읽어 내는 대목이 이 꼭지의 요점이다.","insight":null,"signal":null,"author":[{"claim":"Abridge가 의학저널 콘텐츠를 제품에 더한 것은 매우 논리적인 수순이다.","evidence":"여러 회사가 프로바이더에게 신뢰받는 AI 지원 도구가 되려고 경쟁하는 상황을 든다."},{"claim":"제품 라인업이 겹쳐 가는 지금 AI 플랫폼과 대형 병원 사이의 대화는 무척 흥미로울 것이다.","evidence":"Sutter Health가 2024년 3월 Abridge와, 2026년 2월 OpenEvidence와 각각 파트너십을 맺었고 Abridge 발표에만 Sutter CEO의 코멘트가 실렸다는 점을 든다."}],"experts":[],"cases":[{"name":"Abridge","what":"의료진을 상대로 AI 도구를 파는 회사로, JAMA 및 NEJM과 콘텐츠 파트너십을 맺고 그 내용을 임상 의사결정 지원 제품에 쓸 예정이다.","scale":"","note":"대형 병원 Sutter Health와 2024년부터 파트너십을 맺어 왔고 대표 사례로 걸려 있다.","sells_to":"provider"},{"name":"OpenEvidence","what":"의료진용 AI 회사로, 2026년 2월 Sutter Health와 파트너십을 발표했다.","scale":"","note":"그 발표에는 Sutter CEO의 코멘트가 실리지 않았다는 점을 필자가 짚는다.","sells_to":"provider"}],"notes":[{"term":"임상 의사결정 지원(Clinical Decision Support)","ko":"진료 중 판단을 돕는 소프트웨어","plain":"의사가 진료하는 동안 근거 자료나 권고를 띄워 주는 기능이다. 이런 도구는 무엇을 근거로 답하는지가 신뢰를 좌우하므로, JAMA와 NEJM 같은 최상위 의학저널의 글을 쓸 권리를 확보하는 일이 곧 제품 경쟁력이 된다. 이 꼭지의 계약이 중요한 이유다."}]},{"heading_ko":"Baylor Scott & White, ACA와 메디케이드에서 철수","heading_en":"Other Top Headlines","skip":null,"summary":"대형 병원 그룹이 운영하던 보험사가 개인 보험 시장과 저소득층 보험 시장에서 발을 뺀다는 소식이다. 뒤에 나오는 ACA 시장 축소 전망과 같은 흐름에 놓인 사건이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Baylor Scott & White Health Plan","what":"ACA와 메디케이드 시장에서 철수하며 인력을 감축한다.","scale":"주 내 해당 인구의 약 2.6%와 3.5%를 커버 중, 321개 일자리 감축","note":"보험사가 특정 시장에서 나가면 그 지역 가입자는 다른 보험사를 찾아야 한다.","sells_to":"payer"}],"notes":[{"term":"ACA","ko":"오바마케어로 알려진 개인 보험 거래소","plain":"직장 보험도 없고 메디케어 대상도 아닌 사람이 개인 자격으로 보험을 사는 온라인 장터다. 소득에 따라 정부 보조금을 받아 보험료를 깎아 주는 구조인데, 보조금이 줄면 그대로 개인 부담이 커진다. 한국처럼 자동 가입되는 제도가 아니라 매년 스스로 신청하고 보험료를 내야 유지된다."},{"term":"메디케이드(Medicaid)","ko":"저소득층 대상 공적 보험","plain":"연방과 주 정부가 함께 돈을 대는 저소득층 보험으로, 기준과 운영이 주마다 다르다. 실제 운영은 주 정부가 민간 보험사에 위탁하는 경우가 많아 이런 철수 소식이 나온다. 한국의 의료급여와 비슷한 자리다."}]},{"heading_ko":"오리건주, ATRIO Health Plans 법정관리","heading_en":"Other Top Headlines","skip":null,"summary":"메디케어 어드밴티지 보험사 한 곳이 손실과 미지급 청구가 쌓여 주 정부 관리로 넘어갔다는 소식이다. 남은 자본에 견줘 손실 규모가 크다는 점이 숫자로 드러난다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"ATRIO Health Plans","what":"손실이 쌓이고 병원에 지급하지 못한 청구가 밀리면서 오리건주가 법정관리에 넘겼다.","scale":"메디케어 어드밴티지 가입자 약 3만 6천 명, 2025년 손실 5,000만 달러 이상, 연말 자본과 잉여금 약 1,000만 달러","note":"한 해 손실이 남은 자본의 다섯 배라는 뜻이라 사실상 자력 회복이 어려운 상태였다.","sells_to":"payer"}],"notes":[{"term":"메디케어 어드밴티지","ko":"민간 보험사가 대신 운영하는 메디케어","plain":"정부가 직접 진료비를 치르는 대신, 민간 보험사에 가입자 한 명당 정해진 금액을 매달 주고 그 안에서 진료를 책임지게 하는 방식이다. 보험사는 실제 진료비가 적게 들면 남기고 많이 들면 손실을 본다. 그래서 진료비가 예상보다 늘면 이 꼭지처럼 보험사가 무너지는 일이 생긴다."},{"term":"법정관리(receivership)","ko":"주 정부가 회사 운영을 넘겨받는 절차","plain":"보험사가 가입자에게 약속한 보장을 이행하지 못할 위험에 처하면 주 보험 당국이 경영권을 넘겨받아 정리한다. 가입자와 병원에 줄 돈을 최대한 챙기기 위한 절차다. 한국의 기업 법정관리와 이름은 비슷하지만, 보험 감독 당국이 직접 개입한다는 점이 다르다."}]},{"heading_ko":"ACA 첫 보험료 미납 14%와 시장 축소 전망","heading_en":"Other Top Headlines","skip":null,"summary":"가입 신청은 했지만 1월에 첫 보험료를 내지 않은 사람이 얼마나 되는지, 그리고 시장이 얼마나 줄어들 것으로 보는지를 전한다. 남는 사람들이 더 아픈 사람 쪽으로 쏠리면 내년 보험료 산정이 흔들린다는 점도 함께 짚는다.","insight":null,"signal":"보험을 사려다 결국 자기 부담으로 돌아서는 사람이 늘고 있다는 신호다. 신청까지 마치고도 첫 달 보험료를 내지 않은 사람이 14%, 일부 주에서는 25%를 넘었고 시장 자체가 2025년 대비 17~26% 줄어들 것으로 전망된다. 보험이 값을 대신 내 주지 않는 사람이 늘면 진료비를 직접 알아보고 직접 치르는 소비자가 그만큼 늘어난다.","author":[],"experts":[],"cases":[{"name":"Wakely의 ACA 등록 데이터(WSJ 보도)","what":"1월에 첫 보험료를 내지 않은 사람의 비율과 시장 축소 전망을 담았다.","scale":"첫 보험료 미납 14%, 일부 주 25% 초과, 시장 축소 2025년 대비 17~26%","note":"질병률 상승이 2027년 요율 신고에 불확실성을 만든다고 봤다.","sells_to":"other"}],"notes":[{"term":"첫 보험료 미납","ko":"가입 신청을 했으나 보험이 시작되지 않은 상태","plain":"미국 개인 보험은 신청만으로 효력이 생기지 않고 첫 달 보험료를 내야 보장이 시작된다. 따라서 이 14%는 신청 화면까지 갔다가 값을 보고 포기한 사람에 가깝다. 등록자 수 통계와 실제 보장을 받는 사람 수가 벌어지는 이유이기도 하다."},{"term":"질병률(morbidity)과 요율 신고(rate filing)","ko":"가입자 집단이 얼마나 아픈지, 그리고 내년 보험료를 미리 신고하는 절차","plain":"건강한 사람이 먼저 빠져나가면 남은 집단의 평균 의료비가 올라가는데 이것을 질병률 상승이라 부른다. 미국 보험사는 내년 보험료를 미리 계산해 주 당국에 신고하고 승인받아야 하므로, 지금의 이탈이 다음 해 보험료 인상으로 이어진다. 보험료가 오르면 또 건강한 사람이 빠져나가는 악순환이 이 대목의 걱정거리다."}]},{"heading_ko":"행동건강 이용량 6년간 62% 증가","heading_en":"Other Top Headlines","skip":null,"summary":"정신건강과 중독 치료를 아우르는 행동건강 시장의 공급과 수요를 다룬 리포트 소개다. 헤드라인 숫자 하나만 전한다.","insight":null,"signal":"미국에서 사람들이 정신건강에 쓰는 시간과 비용이 계속 늘고 있다는 신호다. 2018년부터 2024년 사이 이용량이 62% 늘었다는 숫자가 원문이 대는 근거의 전부이지만, 6년 동안 꾸준히 커진 몇 안 되는 수요 영역이라는 점은 분명하다.","author":[],"experts":[],"cases":[{"name":"Trilliant Health 행동건강 리포트","what":"행동건강 시장의 공급과 수요 데이터를 정리해 발표했다.","scale":"2018~2024년 이용량 62% 증가","note":"원문은 공급이 그만큼 따라왔는지는 전하지 않는다.","sells_to":"other"}],"notes":[{"term":"행동건강(behavioral health)","ko":"정신질환과 중독을 함께 묶어 부르는 말","plain":"미국에서는 우울, 불안 같은 정신질환과 알코올·약물 중독 치료를 하나로 묶어 이 이름으로 부른다. 보험 보장 범위와 진료 공급이 신체 질환과 따로 관리되어 온 역사 때문에 굳어진 구분이다. 한국에서 정신건강의학과 진료라고 부르는 범위보다 넓다."}]},{"heading_ko":"사이키델릭 관련 행정명령","heading_en":"Other Top Headlines","skip":null,"summary":"중증 정신질환 치료에 사이키델릭을 쓰는 데 있던 장벽을 없애는 행정명령이 서명됐다는 한 줄 소식이다. 앞의 행동건강 수요 증가와 같은 주에 놓인 소식이라는 점만 확인하면 된다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"사이키델릭 관련 행정명령","what":"Trump 대통령이 중증 정신질환 치료에 사이키델릭을 사용하는 데 있는 장벽을 제거하는 행정명령에 서명했다.","scale":"","note":"원문은 어떤 장벽이 어떻게 없어지는지는 설명하지 않는다.","sells_to":"none"}],"notes":[{"term":"사이키델릭","ko":"환각 작용이 있는 물질","plain":"실로시빈이나 MDMA처럼 의식 상태를 바꾸는 물질이다. 미국 연방법에서 강하게 규제되는 물질로 분류되어 연구와 처방 모두 절차가 까다로웠다. 이 행정명령은 치료 목적 사용에 걸려 있던 그 절차를 푸는 방향이다."}]},{"heading_ko":"Keebler Health, 1,600만 달러 유치","heading_en":"Funding Announcements","skip":null,"summary":"임상 데이터를 위험조정에 쓰는 AI 회사가 투자를 받았다는 소식이다. 미국 보험 지불 구조 안쪽에서 돈이 정산되는 방식을 다루는 회사다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Keebler Health","what":"임상 데이터를 위험조정에 활용하는 AI 플랫폼으로, 인구집단 건강관리로 범위를 넓히려 한다.","scale":"1,600만 달러, Flare Capital Partners 리드","note":"","sells_to":"payer"}],"notes":[{"term":"위험조정(risk adjustment)","ko":"가입자가 아플수록 더 많은 돈을 주는 정산 방식","plain":"메디케어 어드밴티지 같은 방식에서는 보험사가 가입자 한 명당 정액을 받는데, 아픈 사람만 맡으면 손해가 되므로 정부가 진단명에 따라 지급액을 올려 준다. 그래서 환자의 진단을 빠짐없이 기록해 제출하는 일이 곧 매출이 되고, 이 자리를 노리는 소프트웨어 회사가 많다. 한국에는 이런 정산 구조가 없어 대응하는 산업 자체가 없다."}]},{"heading_ko":"Joyful Health, 2,200만 달러 유치","heading_en":"Funding Announcements","skip":null,"summary":"병원이 이미 제공한 진료의 값을 제대로 받아 내도록 돕는 청구 도구가 투자를 받았다. 필자는 이 회사가 내세운 시장 규모 숫자에 눈길을 준다.","insight":null,"signal":null,"author":[{"claim":"프로바이더가 매년 놓친다는 1,250억 달러가 GDP의 0.5%나 된다는 점이 놀랍다.","evidence":"Joyful이 게시글에서 밝힌 숫자를 그대로 인용했다."}],"experts":[],"cases":[{"name":"Joyful Health","what":"프로바이더의 수익 확보를 돕는 레비뉴 사이클 도구다.","scale":"2,200만 달러, CRV 리드. 회사 주장으로 프로바이더가 매년 놓치는 매출 1,250억 달러","note":"1,250억 달러는 회사가 스스로 내놓은 수치이므로 그대로 받아들일 숫자는 아니다.","sells_to":"provider"}],"notes":[{"term":"레비뉴 사이클(revenue cycle)","ko":"진료비를 청구해 받아 내기까지의 업무 전체","plain":"미국 병원은 환자를 본 뒤 보험사에 청구서를 넣고, 거절당하면 다시 고쳐 넣는 과정을 반복해야 값을 받는다. 이 과정이 복잡해 실제로 제공한 진료인데도 받지 못하고 넘어가는 돈이 크게 생긴다. 한국은 심사평가원을 통한 청구 절차가 표준화되어 있어 이 정도 규모의 누락이 생기지 않는다."}]},{"heading_ko":"Ultralight, 930만 달러 유치","heading_en":"Funding Announcements","skip":null,"summary":"노화 관리를 표방하는 클리닉 전용 전자의무기록 회사가 투자를 받았다. 이미 75곳에서 쓰이고 있다는 숫자가 이 업태의 규모를 짐작하게 한다.","insight":null,"signal":"질병 치료가 아니라 노화 지연과 건강 최적화를 파는 클리닉이 전용 소프트웨어 시장을 만들 만큼 늘었다는 신호다. 원문이 대는 근거는 한 회사가 75곳에서 가동 중이라는 숫자 하나뿐이므로 방향만 읽는 것이 맞다.","author":[],"experts":[],"cases":[{"name":"Ultralight","what":"롱제비티 클리닉을 위한 EHR로, 이전 이름은 Vibrant Practice다.","scale":"930만 달러, The General Partnership 리드. 현재 75개 클리닉에서 가동","note":"","sells_to":"provider"}],"notes":[{"term":"EHR","ko":"전자의무기록","plain":"환자의 진료 기록을 남기고 청구까지 연결하는 병원의 기본 소프트웨어다. 미국에서는 이 시스템이 병원 업무의 중심이라 어떤 EHR을 쓰느냐가 다른 도구의 도입까지 좌우한다. 뒤에 나오는 Epic 이야기가 같은 맥락이다."},{"term":"롱제비티 클리닉","ko":"노화 관리를 표방하는 클리닉","plain":"질병을 치료하기보다 각종 검사와 처치로 노화를 늦추고 건강 상태를 최적화하겠다고 내세우는 업태다. 보험이 잘 보장하지 않는 항목을 다루는 경우가 많아 이용자가 직접 비용을 부담하는 구조로 알려져 있다. 다만 원문은 이 클리닉들의 수익 구조를 설명하지 않는다."}]},{"heading_ko":"Wavelet Medical, 700만 달러 유치","heading_en":"Funding Announcements","skip":null,"summary":"태아의 뇌파를 측정하는 모니터링 시스템을 만드는 회사가 투자를 받았다는 한 줄 소식이다. 기기 개발이 필요한 영역이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Wavelet Medical","what":"태아 EEG 모니터링 시스템을 만들며, 벤처 스튜디오 Aegis Ventures와 파트너십을 맺고 있다.","scale":"700만 달러","note":"","sells_to":"provider"}],"notes":[]},{"heading_ko":"Protocole, 600만 달러 유치","heading_en":"Funding Announcements","skip":null,"summary":"앞의 펩타이드 꼭지에 나왔던 신생 회사의 투자 소식이다. 회색시장 브랜드보다 믿을 만한 제품을 내세워 높아지는 관심을 받겠다는 전략이다.","insight":null,"signal":"펩타이드 소비를 주류 시장으로 보고 벤처 자금이 들어가기 시작했다는 신호다. 규제가 아직 정리되지 않은 단계인데도 시드 투자가 이루어졌다는 점이 수요를 얼마나 크게 보는지 보여 준다.","author":[{"claim":"펩타이드 소비가 더 주류로 간다고 본다면 Protocole은 논리적인 베팅이다.","evidence":"지금 시장에 나와 있는 회색시장 브랜드보다 더 믿을 만한 제품을 내세운다는 점을 들었다."}],"experts":[],"cases":[{"name":"Protocole","what":"펩타이드를 위한 임상 등급 모델을 표방한다.","scale":"600만 달러, Rare Capital 리드","note":"신뢰성 자체를 상품으로 삼는다는 점이 이 시장의 성격을 보여 준다.","sells_to":"consumer"}],"notes":[]},{"heading_ko":"Wakely 리포트: 플랜 이동과 질병률","heading_en":"What I'm Reading","skip":null,"summary":"앞서 WSJ 보도로 소개된 ACA 등록 데이터의 원 리포트다. 사람들이 어느 등급 플랜으로 옮겨 갔는지, 남은 집단의 평균 의료비가 얼마나 오를 것으로 보는지를 담았다. 평균값 뒤에 지역별 편차가 크다는 단서도 함께 붙는다.","insight":null,"signal":"보험을 아예 놓지 않은 사람들도 더 싼 등급으로 옮겨 가고 있다는 신호다. Bronze 가입이 늘었다는 것은 매달 내는 보험료를 줄이는 대신 실제로 아플 때 자기 주머니에서 나가는 돈을 늘리는 선택을 했다는 뜻이다.","author":[],"experts":[{"who":"Wakely","role":"ACA 시장 등록 데이터를 분석해 리포트를 내는 회사","claim":"2026년 시장 전체의 평균 질병률이 2.9%에서 6.5%까지 오를 것이며, 다만 그것은 평균이고 특정 시장에서는 그 범위를 벗어나는 등락이 나타날 것이다.","evidence":"메탈 레벨 간 등록 이동(Bronze와 Gold 상승, Silver 하락)을 근거로 든다."}],"cases":[{"name":"Wakely ACA 등록 데이터 리포트","what":"최신 등록 데이터를 분석해 등급 간 이동과 질병률 전망을 정리했다.","scale":"2026년 평균 질병률 상승 2.9~6.5%","note":"2027년 요율 신고를 지켜봐야 한다는 것이 리포트의 결론이다.","sells_to":"other"}],"notes":[{"term":"메탈 레벨(Bronze, Silver, Gold)","ko":"보장 수준에 따른 플랜 등급","plain":"ACA 플랜은 보험이 의료비의 몇 퍼센트를 부담하는지에 따라 Bronze, Silver, Gold 등으로 나뉜다. Bronze는 매달 내는 보험료가 싼 대신 실제로 병원에 갈 때 자기가 내는 돈이 크고, Gold는 그 반대다. Silver는 저소득층 추가 보조금이 붙는 등급이라 보조금 정책이 바뀌면 가장 먼저 흔들린다."}]},{"heading_ko":"챗봇에 건강을 묻는 50만 건을 분석한 논문","heading_en":"What I'm Reading","skip":null,"summary":"Microsoft Copilot에 들어온 건강 관련 질문 50만 건을 비식별화해 분석한 논문 소개다. 사람들이 챗봇에 실제로 무엇을 묻는지, 그리고 데스크톱과 모바일에서 질문의 성격이 어떻게 갈리는지를 다룬다.","insight":"우리 앱 안에 건강 질문을 받아 주는 창구를 붙이는 일은 3개월 안에 소프트웨어만으로 가능하다. 이 논문이 보여 주듯 사람들은 이미 챗봇에 건강을 묻고 있고 모바일에서는 그 질문이 더 개인적인 쪽으로 기운다. 우리 앱은 모바일 전용이고 걸음과 건강 나이라는 개인 데이터를 이미 갖고 있으므로, 질문 창구를 붙이면 답을 주는 동시에 사람들이 실제로 무엇을 궁금해하는지를 로그로 모아 다음 기능의 근거로 쓸 수 있다.","signal":"미국 소비자가 건강에 관해 궁금한 것을 병원이 아니라 챗봇에 먼저 묻고 있다는 신호다. 한 서비스에서만 비식별화된 건강 관련 질의 50만 건이 분석 대상이 될 만큼 쌓였다는 점이 규모를 보여 준다.","author":[{"claim":"데스크톱과 모바일의 사용 패턴 차이는 직장에서는 데스크톱을, 개인적인 검색에는 모바일을 쓰는 습관과 맞아떨어져 보인다.","evidence":"근거를 대지 않았다. 논문이 보여 준 패턴 차이에 대한 필자의 해석이다."}],"experts":[],"cases":[{"name":"Nature Health 게재 논문","what":"Microsoft Copilot의 비식별화된 건강 관련 질의를 분석해 사람들이 챗봇에 무엇을 묻는지 살폈다.","scale":"질의 50만 건","note":"데스크톱과 모바일 사이에 사용 패턴 차이가 나타났다.","sells_to":"other"}],"notes":[]},{"heading_ko":"대형 고용주 설문: 27%가 이미 비전통적 PBM","heading_en":"What I'm Reading","skip":null,"summary":"직원 보험을 사는 대형 고용주 단체의 연례 설문 결과다. 우선순위 세 가지와 함께, 회원사의 27%가 전통적 PBM에서 이미 벗어났다는 숫자가 나온다. 필자는 그 숫자를 미국 최대 고용주 규모로 환산해 보며 정책 논쟁의 전제에 의문을 던진다.","insight":null,"signal":null,"author":[{"claim":"회원사 27%가 이미 비전통적 PBM을 쓴다는 수치는 놀라울 만큼 높다.","evidence":"설문 대상이 대형 고용주 약 스물네 곳이라는 점을 근거로, 미국 40대 고용주 중 11곳이 넘어간 셈이라고 스스로 환산했다."},{"claim":"시장이 이미 스스로 감당할 수 있어 보이는데 전통적 PBM을 해체하는 데 그렇게 많은 에너지가 쓰이는 이유가 혼란스럽다.","evidence":"위의 환산 결과 하나에 기대고 있으며, 필자 자신도 확정이 아니라 질문 형태로 적었다."}],"experts":[],"cases":[{"name":"Purchaser Business Group on Health 연례 설문","what":"대형 고용주를 대상으로 한 설문에서 어포더빌리티, 투명성과 데이터 애널리틱스, 어드밴스드 프라이머리 케어가 상위 세 우선순위로 꼽혔다.","scale":"대상 대형 고용주 약 스물네 곳, 회원사 27%가 비전통적 PBM 사용","note":"직원 보험을 사는 쪽이 무엇을 문제로 보는지 드러내는 자료다.","sells_to":"other"}],"notes":[{"term":"비전통적 PBM","ko":"기존 대형 약제비 관리 회사를 대체하는 방식","plain":"기존 PBM은 제약사에서 비공개 할인을 받아 그 일부를 수익으로 남기는 구조라 값이 어떻게 정해지는지 알기 어렵다. 비전통적 PBM은 약값을 원가에 정해진 수수료만 붙여 공개하는 식으로 그 구조를 바꾼 사업자를 가리킨다. 고용주가 이쪽으로 옮겨 간다는 것은 정부가 규제로 손대기 전에 시장이 먼저 움직이고 있다는 뜻이다."},{"term":"어드밴스드 프라이머리 케어","ko":"강화된 1차 진료","plain":"동네 주치의 진료를 진료 건별 수납이 아니라 정액 계약으로 묶고, 상담 시간과 관리 범위를 늘린 형태다. 미국은 1차 진료 접근성이 나빠 작은 문제를 응급실에서 해결하는 일이 많은데 그 비용을 줄이려는 시도다. 한국에서 동네 의원에 쉽게 가는 것과 같은 상태를 돈을 들여 만드는 셈이다."}]},{"heading_ko":"GLP-1 텔레헬스 Zealthy, 파산 문턱","heading_en":"What I'm Reading","skip":null,"summary":"DOJ가 소송에서 새 신청서를 내면서 GLP-1 텔레헬스 회사 한 곳이 파산에 가까워졌다는 소식이다. 이 회사 창업자가 앞서 다른 회사에서도 기만 행위 혐의를 받았다는 이력이 함께 붙는다. 필자는 법적 절차가 느리다는 소회로 마무리한다.","insight":null,"signal":null,"author":[{"claim":"이런 이야기를 읽다 보면 법 시스템이 더 신속하게 움직였으면 한다.","evidence":"창업자 Kyle Robertson이 2024년 Cerebral 등과 함께 혐의를 받은 뒤 지금에 이른 이력을 근거로 들었다."}],"experts":[],"cases":[{"name":"Zealthy","what":"GLP-1을 온라인으로 처방·배송하는 텔레헬스 회사로, DOJ가 이번 주 소송에서 새 신청서를 제출한 뒤 파산에 가까워진 것으로 보인다. Cerebral의 공동창업자이자 CEO였던 Kyle Robertson이 창업했고 2024년 Cerebral 등과 함께 기만 행위 혐의를 받았다.","scale":"","note":"소비자가 직접 결제하는 온라인 처방 시장에서 같은 인물이 두 번째로 문제를 일으켰다는 점이 핵심이다.","sells_to":"consumer"}],"notes":[{"term":"GLP-1 텔레헬스","ko":"비만 치료제를 온라인 진료로 받아 배송받는 서비스","plain":"화상이나 문진만으로 처방을 받아 약을 집으로 받는 구독형 서비스다. 보험을 거치지 않고 소비자가 매달 직접 돈을 내는 경우가 많아 빠르게 커졌다. 대신 진료의 실질이 얼마나 있었는지, 광고가 과장은 아니었는지를 두고 규제 당국과 부딪히는 일이 반복된다."}]},{"heading_ko":"Epic이 AI 시장을 위협한다는 주장과 반론","heading_en":"What I'm Reading","skip":null,"summary":"미국 병원 소프트웨어 시장을 장악한 Epic이 AI 시장까지 가져가면서 혁신을 막을 수 있다는 남의 글을 소개하고, 필자가 곧바로 반론을 붙인다. 개념적 우려는 이해하지만 실제 시장의 성장세는 그 우려와 다르게 보인다는 것이 필자의 입장이다.","insight":null,"signal":null,"author":[{"claim":"Epic의 시장 지배력이 AI 혁신을 가로막고 있다면 지금으로서는 그다지 잘하고 있는 것 같지 않다.","evidence":"Abridge와 OpenEvidence 같은 회사의 빠른 성장을 근거로 든다."}],"experts":[{"who":"Bob Wachter","role":"Substack에 글을 쓰는 필자로, 원문에는 소속이 밝혀져 있지 않다","claim":"Epic이 시장 지배력을 앞세워 더 나은 스타트업 대안들을 제치고 헬스 시스템을 따내고 있으며, 그것이 시장의 혁신을 가로막을 수 있다.","evidence":"필자는 그가 든 구체적 근거를 옮기지 않았다."}],"cases":[{"name":"Epic","what":"미국 병원의 전자의무기록 시장을 장악한 회사로, 자사 AI 기능으로 헬스 시스템 계약을 따내고 있다는 지적을 받는다.","scale":"","note":"","sells_to":"provider"}],"notes":[{"term":"Epic의 시장 지배력","ko":"병원 기본 시스템을 쥔 회사의 힘","plain":"Epic은 미국 대형 병원 대부분이 쓰는 전자의무기록을 공급한다. 진료 기록과 청구가 모두 그 안에서 돌아가므로, 병원은 새 기능이 필요할 때 이미 쓰는 시스템의 부가 기능을 고르는 쪽이 편하다. 스타트업 제품이 더 낫더라도 선택을 받기 어렵다는 우려가 여기서 나온다."}]},{"heading_ko":"이번 주 HTN: Community Brain Trust","heading_en":"This Week on HTN","skip":"promo","summary":"뉴스레터가 자사 커뮤니티 글을 알리는 자리다. MA 최종 수가 안내, 출산 케어 지불 코드 분리, GLP-1 지형 등을 다뤘다고 밝힌다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"이번 주 HTN: 정책 브리핑","heading_en":"This Week on HTN","skip":"promo","summary":"자사 정책 브리핑을 알리는 자리다. ACCESS 모델에 회의적이면서도 좋아하는 이유와 주 단위 보험 실험을 다뤘다고 밝힌다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"이번 주 HTN: 팟캐스트","heading_en":"This Week on HTN","skip":"promo","summary":"자사 팟캐스트 에피소드 목록을 알리는 자리다. CMMI의 LEAD 프로그램, MA 최종 수가, 출산 케어 투자, 고용주 비용 절감 등 게스트별 주제를 나열한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]}],"themes":["medicare","value-based-care","aca-exchange","consumer-dtc","pharma-glp1","digital-health-funding"],"for_later":[]},{"index":"54","date":"2026-08-23","type":"reads","title_en":"Weekly Health Tech Reads 8/23/26","title_ko":"값 올리기 게임, 부담은 개인에게","hook":"응급실 체인 한 곳이 중재 절차로 값을 두 배 받아 내면서 San Antonio 시 직원 보험 예산이 4,000만 달러 초과했고, 시는 2027년부터 직원 보험료를 올린다.","tldr":[{"point":"San Antonio 시 직원 건강보험 플랜이 응급실 체인 한 곳 때문에 한 해 예산 2억 5,000만 달러를 4,000만 달러 넘겼는데, 그 체인은 No Surprises Act의 중재 절차로 값을 대략 두 배로 올리고 넘긴 건의 99.6%에서 이기면서 환자에게는 본인부담금과 코페이를 면제해 이용을 끌어모았다.","note":"이 법은 응급 상황에서 계약 밖 병원에 실려 간 환자에게 차액을 청구하지 못하게 하는 대신 병원과 보험사가 각자 값을 하나씩 써 내면 중재인이 둘 중 하나를 통째로 고르게 했기 때문에, 높은 값을 써서 이기면 중간에서 깎이는 일 없이 쓴 값을 그대로 다 받는다."},{"point":"Devoted Health가 250억 달러 가치로 자금을 조달 중이며, 이는 메디케어 어드밴티지 가입자 한 명당 약 5만 달러다.","note":"같은 사업을 하는 상장사 Clover Health는 오늘 가입자 한 명당 1만 1,000달러 수준이어서, 같은 잣대를 대면 Devoted는 55억 달러가 된다."},{"point":"필자는 Hims CEO가 내놓은 저가 웨어러블과 블루투스 약통 비전에 극도로 회의적이며 소비자는 센서가 아니라 브랜드화된 경험에 돈을 낸다고 보는데, 정작 그 Hims는 체중 감량 구독의 청구 방식에 대한 소비자 불만이 몰리면서 Visa의 가맹점 감시 프로그램에 올랐다.","note":"Hims는 처방약을 멤버십 구독과 함께 온라인으로 파는 회사여서 소비자가 같은 약을 다른 곳에서 더 싸게 살 수 있는데도 멤버십 비용까지 내고 사는데, 그 비용이 첫 달 39달러에서 그다음 달 149달러가 되는 구조가 불만이 몰린 원인으로 지목됐다."},{"point":"AI가 임상의를 능가한다는 미국의사협회지(JAMA) 기고가 논란이 됐지만, 필자는 'AI가 의사를 대체하는가'라는 물음 자체가 정작 필요한 논의에서 주의를 돌린다고 본다.","note":"필자가 보기에 실제로 벌어지는 일은 아주 구체적인 용도에 대해 FDA 허가를 받은 AI를 병원이 환자에게 처방하는 쪽이며, 그것은 자율이냐 사람이 끼느냐로 딱 잘라 가를 수 없다."}],"issue_insight":{"verdict":"yes","summary":"이번 회차는 병원과 보험사, 고용주, 정부 사이에서 돈이 오가는 이야기가 대부분이고, 소비자는 마지막에 인상된 보험료를 받아 드는 쪽으로만 등장한다. 그래서 3개월 안에 만들 것은 Virta 꼭지 하나에서만 나오고, 나머지 소득은 미국 소비자가 어디에 돈을 내고 있는지 보여 주는 신호 쪽에 몰려 있다.","build":[{"title":"걸음과 식단을 심장대사라는 한 축으로 묶어 보여 준다","detail":"미국에서 팔리는 이름은 걸음이나 식단이 아니라 심장대사라는 하나의 묶음이며, GLP-1이 그 관심을 이미 키워 놓았다. 지금 따로 놓인 두 화면을 하나의 위험 축으로 묶고 GLP-1을 쓰고 있는지 묻는 문항을 붙이면 기록과 화면만으로 3개월 안에 가능하다.","section":4},{"title":"진단과 처방에 닿는 기능은 이번 후보에서 뺀다","detail":"FDA 허가를 받은 AI를 병원이 환자에게 처방하는 경로는 3개월 안에 갈 수 없다. 대신 검사 결과지와 진료 후 요약을 쉬운 말로 풀어 주고 다음 진료에서 물어볼 질문을 정리해 주는 화면은 새로 판정을 내리지 않는 선을 지키는 한 허가 대상이 아니다.","section":16}],"signal":[{"title":"본인부담금을 면제해 주는 곳으로 이용이 몰린다","detail":"응급실 네 곳짜리 체인이 본인부담금과 코페이를 면제하자 시 플랜 응급실 이용량의 53%를 가져갔고, 고용주가 다른 곳을 쓰라고 알린 뒤에도 석 달 만에 적자가 두 배로 늘었다. 미국 소비자에게 방문 한 번에 붙는 본인부담이 그만큼 무겁다는 뜻이다.","section":2},{"title":"더 싼 약을 두고도 멤버십 비용을 내고 브랜드 경험을 산다","detail":"소비자가 다른 곳에서 더 싸게 살 수 있는 약을 굳이 Hims에서 멤버십 비용까지 내고 사는 것이 이 회사가 존재하는 이유라고 필자는 적었다. 의료비 전용 계좌를 개인에게 맡기자는 지지와 공급자를 중간상으로 보는 불신이 이 흐름을 받치고 있다.","section":7},{"title":"구독 요금이 오르는 지점에서 카드사 이의 제기로 반응한다","detail":"첫 달 39달러에서 그다음 달 149달러가 되는 구조에 이의 제기가 몰려 9월 벌금이 약 7만 5,000달러로 예상되며, 이는 한 달 분쟁이 9,000건을 넘는다는 뜻이다. 온라인 처방약 구독에 돈을 내면서도 청구 방식에는 카드사를 통해 항의한다.","section":8}]},"sections":[{"heading_ko":"자체 행사 안내: Differential","heading_en":"Announcing Differential","skip":"promo","summary":"뉴스레터가 직접 여는 초기 단계 창업자 초대 모임을 알리고 지원을 받는 자리다. 연사 명단과 후원사, 지원 마감일을 안내한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"No Surprises Act가 만들어 낸 새 문제","heading_en":"The No Surprises Act Saga","skip":null,"summary":"텍사스 San Antonio 시가 직원 건강보험 예산을 크게 넘긴 사건을 들여다보는 꼭지다. 원인으로 지목된 것은 응급실 체인 한 곳이 예상치 못한 청구서를 막으려고 만든 법의 중재 절차를 활용하기 시작한 일이다. 필자는 이 사건을 한 도시의 사고가 아니라 앞으로 전국에서 반복될 구조의 첫 사례로 읽고, 공급자들이 값을 올려 받는 새 수단을 손에 넣었다고 본다.","insight":null,"signal":"San Antonio 시 플랜에 든 직원 2만 8,000명은 본인부담금과 코페이를 면제해 주는 응급실 체인 한 곳으로 몰렸고, 그 체인은 지역 응급실 50곳 가운데 네 곳뿐인데도 시 플랜 응급실 이용량의 53%를 차지했다. 시 매니저가 5월에 다른 곳을 이용하라고 알렸는데도 석 달 만에 적자가 두 배로 늘었다는 것은, 고용주의 권고보다 방문할 때 당장 내야 하는 금액이 갈 곳을 정한다는 뜻이다. 미국 소비자에게는 방문 한 번에 붙는 본인부담이 그만큼 무겁게 걸려 있고, 그것을 없애 주는 곳이 생기면 이용이 그쪽으로 옮겨 간다.","author":[{"claim":"No Surprises Act는 예상치 못한 청구서라는 문제 하나를 풀었지만 이제 또 다른 문제를 만들어 내고 있다.","evidence":"San Antonio 시 플랜이 응급실 체인 한 곳 때문에 예산을 4,000만 달러 넘겼고, 그 체인의 가격이 중재 절차를 거치며 대략 두 배가 됐다는 보도를 들었다."},{"claim":"Prestige는 물량과 가격 양쪽에서 이기고 있어 인네트워크 계약 협상에 나설 유인이 실제로 없어 보인다.","evidence":"Prestige가 시 플랜 응급실 이용량의 53%를 차지하고 중재로 넘긴 건의 99.6%에서 이기고 있다는 수치를 들었다."},{"claim":"공급자들의 중재 참여는 S자 곡선을 그릴 것이며, 최근 몇 달의 법원 판결이 얼리어답터에서 주류 공급자 조직으로 넘어가는 고비를 지금 넘게 하고 있다.","evidence":"Prestige가 2025년 말에야 참여를 시작했다는 사실을 들었을 뿐, 공급자 전체의 참여 추이를 보여 주는 데이터는 대지 않았다."},{"claim":"인센티브가 공급자에게 더 많이 받아내는 게임을 하라고 대놓고 가리키고 있어, 프로그램의 작동 방식에 v28 같은 변화가 오기 전까지 과열은 계속된다.","evidence":"메디케어 어드밴티지의 리스크 조정에서 벌어진 일과 같은 분위기라고 견주었을 뿐, 별도의 데이터는 대지 않았다."}],"experts":[{"who":"Prestige Emergency Rooms","role":"San Antonio에서 응급실 네 곳을 운영하는 체인이며, 중재로 값을 올려 받는 당사자다. 그 결과를 옹호할 위치에 있다.","claim":"그동안 BCBS 요율 아래에서 낮게 지급받아 왔고 이제야 합리적인 수가를 받는 것뿐이다.","evidence":"과거에 낮게 지급받았다는 주장 외에 구체적인 수치를 대지 않았다. 필자는 이것이 중재 결과를 옹호하는 공급자들이 흔히 내세우는 논리라고 적었다."},{"who":"San Antonio 시 매니저","role":"시 직원 건강보험 플랜의 예산을 책임지는 자리에 있다. 원문은 이름을 밝히지 않았다.","claim":"직원들은 Prestige 대신 병원 응급실을 이용해야 한다.","evidence":"5월 시점에 이미 플랜이 예산을 2,000만 달러 초과했다는 사실을 메모로 알렸다. 필자는 석 달 만에 적자가 두 배로 늘었다는 점을 들어 이 권고가 통하지 않았다고 판단했다."},{"who":"San Antonio 시 직원들","role":"이 플랜의 가입자이자 Prestige의 이용자다. 기사에 인용된 이용자 진술이다.","claim":"Prestige를 이용하는 이유는 그곳이 개인의 본인부담금과 코페이를 면제해 주기 때문이다.","evidence":"자신들의 이용 경험을 들었다. 필자는 고용주에게서 두 배를 받아낼 수 있다면 이 면제가 효과적인 전략이 된다고 해석했다."}],"cases":[{"name":"San Antonio 시 직원 건강보험 플랜","what":"시 직원 2만 8,000명을 보장하는 플랜으로, BCBS가 네트워크와 청구 처리를 맡는다.","scale":"2026년 연간 예산 2억 5,000만 달러 대비 4,000만 달러를 초과했으며, 이는 16%에 해당한다. 5월 시점에는 2,000만 달러 초과였다.","note":"5월에 병원 응급실을 쓰라고 권고했으나 석 달 만에 적자가 두 배로 늘었다. 시는 2027년부터 가입자 보험료를 올릴 예정이다."},{"name":"Prestige Emergency Rooms","what":"San Antonio 지역에서 응급실 네 곳을 운영하는 체인으로, 2025년 말부터 No Surprises Act의 중재 절차를 쓰기 시작했다.","scale":"지역 응급실 50곳 가운데 4곳이지만 시 플랜 응급실 이용량의 53%를 차지한다. 중재를 거치며 가격이 대략 두 배가 됐고 넘긴 건의 99.6%에서 이겼다.","note":"환자에게는 본인부담금과 코페이를 면제해 이용을 끌어모으고, 고용주에게는 중재로 두 배를 받아내는 구조다."}],"notes":[{"term":"No Surprises Act (NSA)","ko":"예상치 못한 청구서 금지법","plain":"미국은 병원마다 보험사와 따로 계약을 맺어서, 계약 안에 있는 병원(인네트워크)에 가야 보험이 제값을 쳐 준다. 그런데 응급 상황에서는 환자가 병원을 고를 수 없어, 계약 밖 병원에 실려 가면 보험이 안 내는 차액을 병원이 환자에게 그대로 청구해 왔다. 2022년부터 이 법이 그 청구를 금지해, 환자는 인네트워크 수준만 내고 나머지 다툼은 병원과 보험사 사이로 넘어갔다. 한국은 전 국민 건강보험이라 병원마다 계약이 따로 없어 이런 일 자체가 없다."},{"term":"IDR (독립 분쟁 해결 절차)","ko":"병원과 보험사를 붙이는 중재","plain":"위 법이 병원과 보험사에게 넘긴 다툼을 처리하는 중재 절차다. 양쪽이 각자 값을 하나씩 써 내면 중재인이 둘 중 하나를 통째로 고르며, 중간값으로 깎지 않는다. 그래서 높은 값을 써서 이기면 그대로 다 받는다. Prestige가 99.6%를 이겼다는 것은 이 절차에서 자기가 쓴 값이 거의 언제나 채택됐다는 뜻이다."},{"term":"본인부담금·코페이 면제","ko":"환자가 낼 몫을 병원이 깎아 주는 것","plain":"미국 보험은 보험사가 돈을 내기 전에 환자가 먼저 채워야 하는 자기부담 한도(deductible)와, 방문할 때마다 내는 정액(copay)이 있다. 병원이 이 몫을 면제해 주면 환자는 공짜처럼 느껴 그 병원에 몰린다. 대신 병원은 보험사와 고용주에게 청구하는 값을 올려 회수한다. 한국에서 본인부담금 할인이 불법인 것과 견주면 왜 이것이 문제가 되는지 짐작할 수 있다."},{"term":"자가보험 고용주 플랜","ko":"고용주가 의료비를 직접 무는 방식","plain":"미국의 대형 고용주는 보험사에서 보험을 사는 대신, 직원의 의료비를 자기 돈으로 직접 물고 보험사에는 네트워크와 청구 처리만 맡긴다. 원문이 이 표현을 쓰지는 않았지만, BCBS가 협상과 처리를 맡고 초과분은 시가 떠안는 이 사례의 구조가 그것이다. 돈이 시 예산에서 병원으로 바로 흐르므로, 직원들이 비싼 곳을 많이 쓰면 그 초과분이 고스란히 시의 예산 적자가 된다."}]},{"heading_ko":"Devoted Health의 250억 달러와 메디케어 어드밴티지 시장","heading_en":"Medicare Advantage","skip":null,"summary":"비상장 보험사 Devoted Health가 250억 달러 가치로 자금을 조달 중이라는 보도를 놓고, 그 값이 말이 되는지를 따지는 꼭지다. 필자는 가입자 수로 나눈 단가를 상장사와 견주어 지나치게 비싸다고 보면서도, 2026년 메디케어 어드밴티지 실적이 전반적으로 좋았던 배경과 2027년에 성장 쪽으로 앞서 나가려는 구도를 함께 설명한다. 뒷부분은 Centene의 철수와 SCAN·Costco 제휴 같은 시장 신호를 짧게 덧붙인다.","insight":null,"signal":null,"author":[{"claim":"오늘의 숫자로만 보면 250억 달러는 천문학적이며, 이 밸류에이션은 현실과 동떨어져 보인다.","evidence":"가입자 50만 명으로 나누면 한 명당 약 5만 달러인데, 오늘 Clover Health가 한 명당 1만 1,000달러 수준이므로 같은 잣대라면 Devoted는 55억 달러가 된다는 계산을 들었다."},{"claim":"투자자들은 Devoted를 평균에서 표준편차 3에서 6 사이에 있는 결과에 맞춰 가격 매기고 있다.","evidence":"근거를 대지 않았다. 요즘 사모 시장 성장 자본의 속성이 그런 듯하다고만 적었다."},{"claim":"Devoted의 메디케어 어드밴티지 사업은 수익성 면에서 계획보다 의미 있게 앞서 있을 것이다.","evidence":"2026년 메디케어 어드밴티지 실적이 전반적으로 기대를 웃돌아 지불자들이 일제히 가이던스를 상회하고 상향했다는 점과, Devoted가 2026년에 수익성이 좋은 C-SNP 상품으로 크게 무게를 옮겼다는 점 두 가지를 들었다. 본인도 짐작이라고 밝혔다."},{"claim":"케어 딜리버리에 쏟는 투자 수준을 감안하면 Devoted가 전사 차원에서 흑자라고 보기는 여전히 어렵다.","evidence":"투자 수준 자체를 들었을 뿐 구체적인 금액은 대지 않았다."},{"claim":"CMS는 2026년의 초과 성과를 근거 삼아 2027년 지급을 더 깎는 대화를 반드시 다시 꺼낼 것이다.","evidence":"메디케어 어드밴티지 보험사들이 곳곳에서 가이던스를 상회하고 상향하는 상황과, Devoted CEO 본인이 몇 달 전 CMS에 업계에 돈을 덜 주라고 공개 요구한 사실을 들었다."},{"claim":"점유율을 빠르게 가져가려 한 보험사들에게 이런 서사는 대체로 좋게 끝나지 않았다.","evidence":"Devoted 자신이 2025년에 신규 가입자의 적자로 고전했다는 사실을 들었다. 다만 2026년 Humana는 새 가입자 유입을 소화하면서도 사업 전체를 흔들지 않아 예상을 뒤집었다고 덧붙였다."}],"experts":[{"who":"Alignment Health의 CEO","role":"메디케어 어드밴티지 보험사의 CEO다. 원문은 이름을 밝히지 않았다. 자신도 경쟁 보험사이므로 시장 구도를 말할 이해관계가 있다.","claim":"2027년에 소규모 보험사 몇 곳이 튀어나와 의미 있는 시장 점유율을 가져가려 시도할 것이다.","evidence":"2분기 실적 시즌에 내놓은 전망이며, 원문은 그가 든 근거를 옮기지 않았다."},{"who":"Chris Klomp","role":"2026년 초 요율 발표 국면에서 업계에 대한 지급을 낮추는 안을 내놓은 인물이다. 원문은 직함을 밝히지 않았으나 CMS의 요율 결정을 이야기하는 대목에서 등장하므로, 지급을 깎는 편에 선 사람으로 읽힌다.","claim":"업계가 세금의 더 나은 청지기가 되어야 하며, 업계에 대한 지급을 낮춰야 한다.","evidence":"원문은 그가 든 근거를 옮기지 않았다."},{"who":"Devoted Health의 CEO","role":"Devoted의 CEO다. 원문은 이름을 밝히지 않았다. 자기 회사가 속한 업계에 돈을 덜 주라고 요구한 이례적인 위치다.","claim":"CMS는 업계에 돈을 덜 줘야 한다.","evidence":"몇 달 전 공개적으로 요구했다는 사실만 소개됐고, 그가 든 근거는 원문에 옮겨지지 않았다."}],"cases":[{"name":"Devoted Health","what":"메디케어 어드밴티지 보험사이면서 자체 케어 딜리버리에도 투자하는 회사로, 250억 달러 가치로 추가 자본을 조달 중이라고 Business Insider가 보도했다.","scale":"직전 라운드에서 3억 1,700만 달러를 160억 달러 가치로 조달했다고 발표한 지 1년도 채 지나지 않았다. 가입자는 올해 들어 50만 명을 막 넘겼고, 한 명당 약 5만 달러다.","note":"상장사였다면 Centene을 제치고 다섯 번째 또는 여섯 번째로 큰 관리의료 회사가 된다. 이 가격에서는 사실상 인수 불가능한 회사가 된다는 것이 필자의 지적이다."},{"name":"Clover Health","what":"메디케어 어드밴티지 보험사로 2021년 SPAC으로 상장했다. 필자가 밸류에이션 비교 기준으로 든 회사다.","scale":"2021년에는 가입자 5만 7,000명에 37억 달러로 한 명당 6만 5,000달러였고, 오늘은 가입자가 대략 세 배인데 가치는 20억 달러에 가까워 한 명당 1만 1,000달러다.","note":"가입자가 세 배로 늘었는데 회사 가치는 오히려 줄었다. 시장이 메디케어 어드밴티지 가입자 한 명에게 매기는 값이 얼마나 달라졌는지를 보여 준다."},{"name":"Centene","what":"대형 관리의료 회사로, 지난주 브로커들에게 메디케어 어드밴티지 플랜 철수 계획을 공유한 것으로 전해진다.","scale":"현재 34만 명 이상이 가입한 플랜을 158개 이상 카운티에서 접으며, 여기에는 Oklahoma, Tennessee, Hawaii 전역이 포함된다.","note":"수익성을 우선해 가입자를 줄이는 쪽이며, 이렇게 비는 자리가 Devoted 같은 성장 지향 보험사에게 기회가 된다."},{"name":"SCAN과 Costco의 공동 브랜드 플랜","what":"메디케어 어드밴티지 보험사 SCAN이 Costco와의 파트너십을 확대해, 비공개 세 개 시장에서 공동 브랜드 플랜을 출시한다고 발표했다.","scale":"세 시장의 메디케어 가입자는 합쳐서 500만 명이다.","note":"보험 상품에 소비자 소매 브랜드를 붙여 파는 시도다."}],"notes":[{"term":"Medicare Advantage (MA)","ko":"메디케어 어드밴티지","plain":"65세 이상을 위한 공보험 메디케어를 정부가 직접 운영하지 않고 민간 보험사에 맡기는 방식이다. 정부가 가입자 한 명당 매달 정해진 금액을 보험사에 주면, 보험사는 그 안에서 진료비를 대고 남는 만큼 이익을 가져간다. 가입자가 아플수록 정부가 더 많이 주기 때문에 보험사는 질병 코드를 빠짐없이 붙이려 하고, 그 지점에서 늘 말썽이 난다. 한국에는 이런 민간 위탁이 없다."},{"term":"care delivery","ko":"케어 딜리버리","plain":"보험사가 보험금만 지급하는 데 그치지 않고 의원과 방문 간호, 원격 진료 같은 진료 조직을 직접 갖춰 환자를 돌보는 것을 가리킨다. 메디케어 어드밴티지는 가입자 한 명당 정액을 받는 구조여서, 진료를 직접 관리해 입원을 줄이면 그만큼 이익이 남는다. 그래서 보험사가 진료 조직에 큰돈을 넣는데, 그 투자가 회수되기 전까지는 회사 전체가 적자로 보일 수 있다. 한국은 보험사가 병원을 소유할 수 없어 이런 구조 자체가 없다."},{"term":"v28","ko":"지급액 산정 방식의 개정판","plain":"위에서 말한 질병 코드로 보험사에 줄 돈을 계산하는 방식을 리스크 조정이라 하는데, CMS가 2024년부터 단계적으로 적용한 개정판이 v28이다. 값을 부풀리기 쉬웠던 코드를 걷어내 보험사에 가는 돈을 줄였다. 필자가 다른 꼭지에서 'v28 같은 변화'라고 말할 때는, 과열된 게임의 규칙을 정부가 바꿔 열기를 식히는 조치를 뜻한다."},{"term":"C-SNP / D-SNP","ko":"특정 대상만 받는 메디케어 어드밴티지 상품","plain":"아무나 들 수 있는 일반 상품이 아니라 조건을 갖춘 사람만 가입하는 상품이다. C-SNP는 당뇨나 심부전 같은 만성질환이 있는 사람을, D-SNP는 메디케어와 저소득층 공보험 메디케이드를 함께 받는 사람을 대상으로 한다. 대상자가 아플수록 정부가 주는 금액이 커지므로, 관리를 잘하면 수익성이 특히 좋은 구간이 된다."},{"term":"beat and raise","ko":"실적은 넘고 전망은 올리는 것","plain":"원래는 상장사 실적 용어다. 분기 실적이 시장 기대를 넘고(beat), 동시에 남은 기간의 전망치까지 올려 잡는(raise) 상황을 가리킨다. 회사가 잘 굴러간다는 가장 강한 신호로 읽힌다. 필자는 비상장인 Devoted가 사모 시장에서 그와 같은 상황을 맞았다는 뜻으로 이 표현을 썼고, 이번 회차의 부제에도 올렸다."}]},{"heading_ko":"Virta Health가 밝힌 규모와 앞으로의 경로","heading_en":"Company Spotlight","skip":null,"summary":"영양으로 심장대사 질환의 근본 원인을 다룬다는 Virta Health가 자사 실적과 확장 계획을 뉴스레터에 공개한 자리다. 사장이 밝힌 숫자와 100배 성장 구상을 소개한 뒤, 필자가 그 구상에서 읽어 낸 전략 방향을 덧붙인다. 요점은 고용주용 종합 플랫폼으로 넓히는 대신 지금 하는 일을 고객 유형 전반으로 깊이 파고드는 쪽을 택했다는 것이다.","insight":"Virta가 파는 것은 새 기기가 아니라 '심장대사'라는 하나의 묶음이며, GLP-1이 그 묶음에 대한 관심을 이미 키워 놓았다는 것이 이 꼭지의 요지다. 우리 앱은 걸음과 식단을 각각 다른 화면에서 따로 보여 준다. 미국 사용자에게는 그 둘을 심장대사 위험이라는 한 축으로 묶어 보여 주는 화면 자체가 지금 없는 가치가 된다. 여기에 GLP-1을 쓰고 있는지 묻는 한 문항을 붙이면, 약만으로는 채워지지 않는 단백질 섭취와 근육량, 약을 멈춘 뒤의 체중 반등에 맞춰 안내를 다르게 내보낼 수 있다. 셋 다 기록과 화면으로 해결되는 일이어서 3개월 안에 가능하고, 먼저 확인할 것은 미국 사용자 가운데 GLP-1을 쓰는 사람의 비율이 시험에 충분한지다.","signal":null,"author":[{"claim":"Virta는 앞으로 몇 년간 지켜볼 만한 회사다.","evidence":"영양으로 심장대사 문제의 근본 원인을 다룬다는 접근과 임상 결과가 인상적이라는 점을 들었다. 다만 그 결과는 여러 개의 링크로만 걸었고 수치를 본문에 옮기지는 않았다."},{"claim":"GLP-1이 심장대사 건강에 대한 인식을 높여, 처방을 넘어선 더 넓은 심장대사 지원 모델에 기회가 열리고 있다.","evidence":"근거를 대지 않았다."},{"claim":"Virta가 택한 길은 고용주를 위한 종합 디지털 헬스 솔루션이 되는 Teladoc식 경로가 아니라 현재 모델을 고객 유형 전반으로 깊이 파고드는 쪽이며, 더 어렵지만 더 오래 가는 사업적·사회적 가치를 준다.","evidence":"Shah가 밝힌 100배 계획의 구성, 즉 대상 인원을 50배로 늘리면서 고객당 수익률을 2배로 높인다는 조합에서 그 방향을 읽었다."}],"experts":[{"who":"Amit Shah","role":"Virta Health의 사장이다. 자기 회사의 규모와 전망을 발표하는 자리이므로 좋게 말할 위치에 있다.","claim":"Virta는 사업을 100배로 키울 기회가 있다. 대상이 되는 커버드 라이브를 300만 명에서 1억 5,000만 명으로 50배 늘리는 동시에, 고객당 수익률을 지금의 2배로 높인다는 것이다.","evidence":"런레이트 매출 2억 달러와 EBITDA 흑자라는 현재 실적을 함께 제시했다. 다만 100배라는 목표 자체를 뒷받침하는 근거는 대지 않았다."}],"cases":[{"name":"Virta Health","what":"영양을 통해 심장대사 문제의 근본 원인을 다루는 임상 모델을 고용주 등에게 파는 회사다.","scale":"런레이트 매출은 2억 달러이고 EBITDA 기준으로 흑자다. 현재 대상 커버드 라이브는 300만 명이다.","note":"GLP-1이 만들어 놓은 심장대사 관심을 처방 바깥의 지원으로 받아내는 위치에 서 있다는 것이 필자의 평가다."}],"notes":[{"term":"cardiometabolic","ko":"심장대사","plain":"심장병과 대사질환, 즉 당뇨와 비만과 고지혈증을 하나로 묶어 부르는 말이다. 원인과 위험 요인을 공유하기 때문에 미국에서는 이들을 따로 보지 않고 한 덩어리로 다루며, 회사들은 이 이름을 걸고 고용주와 보험사에 상품을 판다. 한국에서 대사증후군이라 부르는 범위와 겹치지만, 심장 쪽까지 더 넓게 끌어안는다."},{"term":"GLP-1","ko":"위고비·오젬픽 계열의 체중 감량 주사약","plain":"원래 당뇨약으로 나왔다가 체중을 크게 줄여 주는 효과 때문에 미국에서 폭발적으로 쓰이게 된 약 계열이다. 이 약 덕분에 체중과 혈당, 심장 위험을 한 덩어리로 관리하려는 수요가 크게 늘었다. 다만 약만으로는 근육 감소와 단백질 섭취 부족, 복약을 멈춘 뒤의 체중 반등까지 해결되지 않아서, 그 빈자리를 채우려는 서비스가 여럿 생겼다. 한국에서도 위고비라는 이름으로 팔린다."},{"term":"런레이트 매출 (run-rate revenue)","ko":"지금 속도를 1년으로 환산한 매출","plain":"가장 최근 한 달이나 한 분기의 매출에 12나 4를 곱해 1년치로 바꾼 값이다. 실제로 지난 1년 동안 번 돈이 아니라 지금 속도가 그대로 이어진다고 가정한 숫자여서, 빠르게 크는 회사가 자기 규모를 크게 보이려 할 때 흔히 쓴다."},{"term":"EBITDA 흑자","ko":"이자·세금·감가상각 빼기 전 이익이 난 상태","plain":"회계상 순이익이 아니라 영업 단계에서 남는 돈이 플러스가 됐다는 뜻이다. 순이익 흑자보다 느슨한 기준이지만, 적자가 당연시되던 디지털 헬스 회사에게는 의미 있는 문턱으로 취급된다."},{"term":"covered lives","ko":"커버드 라이브","plain":"그 회사의 서비스를 쓸 자격이 있는 사람의 수다. 실제 이용자가 아니라 계약이 닿는 모집단이어서, 300만에서 1억 5,000만으로 늘린다는 말은 이용자를 50배 늘린다는 뜻이 아니라 팔 수 있는 대상 범위가 50배 넓어진다는 뜻이다."}]},{"heading_ko":"다가오는 컴퍼니 프레젠테이션 일정","heading_en":"Upcoming Company Presentations","skip":"promo","summary":"뉴스레터가 여는 회사 발표 세션 세 건의 일정과 신청 안내다. 여성 건강, 메디케어 어드밴티지, 아웃오브네트워크 가격 책정이 각각의 주제다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"고용주 의료비 상승이 전국 뉴스가 되다","heading_en":"Chart of the Week","skip":null,"summary":"고용주가 직원 의료비로 쓰는 돈이 얼마나 빠르게 오르는지를 보여 주는 Aon의 자료가 나왔고, 주요 매체가 이를 크게 다뤘다는 짧은 꼭지다. 필자는 숫자 자체는 새롭지 않다고 하면서도, 이것이 전국적 주목을 받는 시점에 주목한다.","insight":null,"signal":null,"author":[{"claim":"이 데이터는 이 뉴스레터를 꾸준히 읽는 독자에게 새롭지 않다.","evidence":"2027년 비용 트렌드가 한 자릿수 후반에서 두 자릿수 초반이 될 것이라고 한동안 이야기해 왔다는 점을 들었다."},{"claim":"그럼에도 이 문제가 전국적 주목을 받고 있다는 점은 흥미롭다.","evidence":"중간선거 시즌과 부담 가능성을 둘러싼 더 넓은 전국적 논의가 앞에 놓여 있다는 점을 들었다."}],"experts":[],"cases":[{"name":"Aon의 고용주 비용 트렌드 자료","what":"고용주 시장의 의료비 상승 폭에 관한 데이터를 목요일에 공개했고, WSJ 등 주요 매체가 이를 조명했다.","scale":"","note":"필자가 그동안 말해 온 2027년 전망은 한 자릿수 후반에서 두 자릿수 초반이다."}],"notes":[{"term":"cost trend","ko":"비용 트렌드","plain":"고용주가 직원 의료비로 쓰는 돈이 해마다 몇 퍼센트씩 오르는지를 가리키는 업계 용어다. 한 자릿수 후반에서 두 자릿수 초반이라는 말은 매년 8~12% 안팎 오른다는 뜻이며, 고용주는 그 인상분의 상당 부분을 직원이 내는 몫을 늘려 넘긴다. 그래서 이 숫자가 곧 개인의 부담으로 이어진다."},{"term":"Aon","ko":"복리후생 컨설팅·보험 중개 회사","plain":"대형 고용주를 대신해 직원 보험과 복리후생을 설계하고 협상해 주는 회사다. 수백 곳의 고용주 데이터를 쥐고 있어서 매년 내놓는 비용 전망이 업계 기준으로 인용된다."}]},{"heading_ko":"Hims CEO의 비전에 대한 회의","heading_en":"Other Top Headlines","skip":null,"summary":"Hims의 CEO가 방송 인터뷰에서 내놓은 미래 구상을 필자가 정면으로 반박하는 꼭지다. 저가 웨어러블과 블루투스 약통에서 데이터를 모아 AI 코치가 개인화한다는 구상인데, 필자는 그것이 Hims가 지금까지 소비자를 얻어 온 이유와 정반대라고 본다. 그러면서도 이 회사를 낙관할 이유로 두 가지 사회적 흐름을 따로 짚는다.","insight":null,"signal":"필자는 소비자가 다른 곳에서 더 싸게 살 수 있는 약을 굳이 Hims에서 멤버십 비용까지 내고 산다는 사실을 Hims라는 사업이 존재하는 이유로 들었다. 미국 소비자가 약값 자체보다 주문과 상담과 배송이 하나로 묶인 브랜드 경험에 웃돈을 낸다는 뜻이다. 필자는 이 흐름을 받치는 사회적 배경으로 두 가지를 덧붙였다. 개인에게 의료비 전용 계좌 예산을 주고 알아서 쓰게 하자는 주장에 지지가 넓어지고 있다는 것, 그리고 공급자를 원하는 약에 닿지 못하게 막는 중간상으로 보는 소비자 불신이 커지고 있다는 것이다.","author":[{"claim":"Hims가 헬스케어를 어떻게 바꾸겠다는 것인지에 대한 Dudum의 비전에 극도로 회의적이다.","evidence":"인터뷰의 첫 몇 분이 유럽에서 10달러에 만든 웨어러블 모조품과 블루투스 약통에서 나오는 데이터를 AI 코치가 활용한다는 설명에 쓰였다는 점을 들었다."},{"claim":"블루투스 약통은 근 20년 가까이 시도돼 온 타르 웅덩이 같은 아이디어다.","evidence":"그런 아이디어를 다룬 글을 링크로 걸었을 뿐, 과거의 실패 사례를 본문에 적지는 않았다."},{"claim":"지금 Hims 고객 중에 Hims 브랜드의 블루투스 약통이나 10달러짜리 웨어러블 모조품을 사고 싶다고 말한 사람은 0명일 것이다.","evidence":"스스로 짐작이라고 밝혔으며, 소비자 조사 같은 근거는 대지 않았다."},{"claim":"소비자는 브랜드화된 소비자 경험에 더 많은 돈을 내며, 그것이 Hims라는 사업이 존재하는 이유다.","evidence":"소비자들이 다른 곳에서 더 싸게 살 수 있는 약을 굳이 Hims에 멤버십 비용까지 내면서 산다는 사실을 들었다."},{"claim":"이런 수순은 소비자 데이터를 둘러싼 해자를 쌓으려 할 때 두는 수처럼 보인다.","evidence":"Dudum이 인터뷰에서 말한 내용 자체를 근거로 들었다."},{"claim":"그럼에도 Hims는 대단히 강력한 사회적 순풍을 등에 업고 있어 이 모델을 낙관할 이유가 여전히 있다.","evidence":"두 가지를 들었다. 하나는 '지불자로서의 환자'와, 개인에게 HSA·FSA 예산을 주고 원하는 대로 쓰게 하자는 흐름에 대한 지지 확대다. 다른 하나는 모든 것에 대한 소비자 불신의 증가와, 공급자는 원하는 약에 접근하지 못하게 막는 중간상이라는 인식이다. 필자는 이 순풍들이 반드시 좋은 것이라고 보지는 않지만 실재한다고 덧붙였다."}],"experts":[{"who":"Andrew Dudum","role":"Hims의 CEO다. 방송에서 자기 회사의 비전을 설명하는 자리이므로 투자자 인식과 주가에 이해관계가 있다.","claim":"Hims의 AI 코치가 저가 웨어러블과 블루투스 약통 같은 기기에서 나오는 데이터를 활용해 헬스케어 경험을 개인화할 것이며, 약통은 앞으로 12개월간 추진할 개념이다. 또한 개인에게 HSA·FSA 예산을 주는 흐름이 중요하다.","evidence":"원문은 그가 이 비전을 뒷받침할 데이터나 고객 요구를 제시했다고 적지 않았다. 다만 필자는 HSA·FSA를 짚은 대목만큼은 그가 제대로 짚었다고 평가했다."}],"cases":[{"name":"Hims","what":"약을 멤버십과 함께 소비자에게 직접 파는 회사다. CEO가 CNBC 인터뷰에서 AI 코치와 기기 데이터 기반 개인화 구상을 밝혔다.","scale":"","note":"개인 투자자 커뮤니티는 이 서사에 반응한 것으로 보이나, 필자는 Hims가 소비자를 얻어 온 이유와 놀랍도록 동떨어진 방향이라고 봤다."}],"notes":[{"term":"HSA / FSA","ko":"의료비 전용 세제 계좌","plain":"근로자가 세금을 떼기 전 급여의 일부를 떼어 두었다가 의료비에만 쓰는 계좌다. HSA는 쓰지 않은 돈이 계속 이월되고 본인 소유로 남지만, FSA는 그해에 쓰지 않으면 대개 사라진다. 미국인은 이 돈으로 무엇을 살 수 있는지 잘 몰라 연말마다 쓸 곳을 찾는다. 한국에는 대응하는 제도가 없고, 굳이 견주면 연말정산 의료비 공제에 가깝지만 계좌에 실제로 돈이 들어 있다는 점이 다르다."},{"term":"tarpit idea","ko":"타르 웅덩이 아이디어","plain":"겉으로는 명백히 좋아 보여서 창업자들이 계속 뛰어들지만, 실제로는 아무도 빠져나오지 못하고 가라앉는 아이디어를 가리키는 말이다. 필자는 블루투스 약통이 근 20년째 그런 아이디어로 남아 있다고 본다."},{"term":"patients as payers","ko":"지불자로서의 환자","plain":"보험사나 고용주가 아니라 환자 본인이 자기 돈으로 의료비를 내는 쪽으로 무게가 옮겨 가는 흐름을 가리킨다. 그렇게 되면 환자는 값과 경험을 직접 비교하는 소비자가 되고, 병원이 아니라 소비자 브랜드가 들어설 여지가 생긴다. 필자가 Hims를 낙관할 이유로 든 첫 번째 순풍이 이것이다."}]},{"heading_ko":"Hims, 구독 청구 불만으로 Visa 감시 대상에 오르다","heading_en":"Other Top Headlines","skip":null,"summary":"앞 꼭지와 같은 회사에 대한 후속 소식이다. 체중 감량 구독의 청구 방식을 두고 소비자 불만이 몰리면서 카드 결제망의 감시 목록에 올랐다. 필자는 벌금 액수 자체보다, 대외적으로 말하는 서사와 실제로 벌어지는 일 사이의 간극에 무게를 둔다.","insight":null,"signal":"Hims의 체중 감량 구독은 첫 달에 39달러였다가 그다음 달부터 149달러가 되는데, 이 청구 방식을 두고 카드 결제 이의 제기가 몰리면서 Visa의 가맹점 감시 목록에 올랐다. 분쟁 한 건당 8달러가 붙어 9월 벌금이 약 7만 5,000달러로 예상된다는 것은 한 달 분쟁이 9,000건을 넘는다는 뜻이고, 감시에서 빠지려면 분쟁률을 거래의 1.5% 아래로 낮춰야 한다는 조건은 지금 그 비율을 넘고 있다는 뜻이다. 미국 소비자가 온라인 처방약 구독에 실제로 돈을 내면서도, 청구 금액이 예고 없이 오르는 대목에서는 회사에 항의하는 대신 카드사에 이의를 제기하는 수단을 쓴다는 것을 보여 준다.","author":[{"claim":"Hims의 청구 구조는 마치 소비자를 위한 예상치 못한 의료비 청구서를 제1원리에서 다시 생각해 낸 것 같다.","evidence":"첫 달 39달러였던 멤버십 비용이 이후 149달러로 오르는 구조를 들었다."},{"claim":"9월에 예상되는 약 7만 5,000달러의 벌금은 Hims 전체 손익에 비하면 푼돈이다.","evidence":"분쟁 한 건당 8달러라는 단가를 들었다."},{"claim":"더 큰 문제는 Hims가 대외적으로 말하는 서사와 실체가 다르다는 점이다.","evidence":"이번 감시 프로그램 등록과, 기만적 마케팅 관행에 대한 최근 FTC 소송을 함께 들었다."}],"experts":[],"cases":[{"name":"Hims의 Visa 감시 프로그램 등록","what":"체중 감량 구독의 청구 방식을 두고 소비자 불만이 급증해, Hims가 Visa의 Acquirer Monitoring Program에 등록됐다고 Bloomberg가 보도했다.","scale":"첫 달 멤버십은 39달러이고 브랜드 GLP-1 약값은 별도이며, 그다음 달부터는 149달러다. 분쟁 한 건당 8달러가 붙어 9월에는 약 7만 5,000달러가 된다. 프로그램에서 빠지려면 분쟁률을 3개월 연속 거래의 1.5% 아래로 낮춰야 한다.","note":"결제 대행사 Stripe가 이 문제를 통보했다. 기만적 마케팅에 대한 FTC 소송도 함께 걸려 있다."}],"notes":[{"term":"Acquirer Monitoring Program","ko":"카드망의 가맹점 감시 제도","plain":"Visa 같은 카드 결제망이 결제 분쟁이 유난히 많은 가맹점을 따로 감시 목록에 올려 두는 제도다. 목록에 오르면 분쟁 한 건마다 별도 수수료가 붙고, 정해진 기간 안에 개선하지 못하면 카드 결제 자체를 받지 못하게 될 수도 있다. 그래서 벌금 액수보다 요주의 가맹점으로 지목됐다는 사실이 더 무겁다."},{"term":"분쟁률 (dispute rate)","ko":"결제 이의 제기 비율","plain":"소비자가 카드사에 이 결제는 부당하다고 이의를 제기해 돈을 되돌려 받는 절차를 차지백이라 하고, 전체 거래 대비 그 건수 비율이 분쟁률이다. 구독 요금이 예고 없이 오르거나 해지가 어려울 때 소비자가 가장 흔히 쓰는 수단이라, 이 비율이 높다는 것은 청구 방식에 문제가 있다는 신호로 읽힌다."}]},{"heading_ko":"Summa Health와 General Catalyst의 기술 전환 스택","heading_en":"Other Top Headlines","skip":null,"summary":"고전하던 지역 병원 그룹 하나를 벤처캐피털이 투자한 회사들의 기술로 통째로 바꿔 보겠다는 실험이다. 투입되는 아홉 곳이 모두 같은 투자사의 포트폴리오라는 점이 쟁점이 된다. 병원에서 혁신 업무를 해 본 필자는 현장이 어떻게 굴러갈지를 근거로 이 방식이 역효과를 낼 것으로 보고, 대신 급진적 투명성을 제안한다.","insight":null,"signal":null,"author":[{"claim":"Summa에게 최선의 솔루션인지와 무관하게 GC 포트폴리오라는 이유로 선정된 것으로 보이는 파트너 아홉 곳을 위에서 덮어씌우는 방식은 역효과가 날 것이 거의 확실하다.","evidence":"자신이 헬스 시스템에서 이노베이션 업무를 해 본 경험을 들었다. 그 경험에서 시스템 리더들은 대체로 시장의 스타트업과 선호 파트너에 대해 감을 잘 잡고 있었고, 다만 시스템 자체에 발목이 잡혔을 뿐이라고 적었다."},{"claim":"이는 여전히 미국 케어 딜리버리에서 가장 흥미로운 이노베이션 실험 중 하나이지만, 파트너십의 초기 성과는 회의를 품을 만한 이유를 준다.","evidence":"초기 성과가 구체적으로 어떠했는지는 적지 않았다."},{"claim":"시스템 전체의 전환이 정말 목표라면 급진적 투명성이 필요하다.","evidence":"공개해야 할 항목을 하나씩 열거했다. 통상적인 재무 공시를 넘어선 손익 구조, 전환 스택의 세부와 임상·재무 영향, GC 계열사들 사이의 거래, 아홉 곳이 다른 벤더가 아니라 왜 선정됐는지, 현장 직원들의 경험이다. RFK가 이미 초대를 받았다는 점을 들어 다른 사람에게도 열지 못할 이유가 없다고 적었다."}],"experts":[],"cases":[{"name":"Summa Health와 General Catalyst의 기술 전환 스택","what":"고전하는 지역 공급자였던 Summa Health를 최고 수준 기술을 활용한 미래의 선도 공급자로 바꾸겠다는 계획을 두 곳이 함께 발표했다.","scale":"General Catalyst 포트폴리오 회사 아홉 곳으로 구성된다. Aidoc, Clarium, Commure, Fabric, Hippocratic AI, Judi Health, Transcarent, Verse Medical, Percepta이며 Percepta가 전환 파트너로 총괄한다.","note":"아홉 곳이 어떻게 선정됐고 Summa 직원들에게 어떻게 설명됐는지는 공개되지 않았다. 필자가 가장 듣고 싶다고 한 대목이 그것이다."}],"notes":[{"term":"health system","ko":"헬스 시스템","plain":"병원 여러 곳과 외래 진료소를 한 지붕 아래 묶어 운영하는 지역 의료 기업이다. 미국은 국가가 병원을 배치하지 않기 때문에 이런 민간·비영리 시스템이 지역 의료를 사실상 도맡는다. Summa Health는 오하이오 Akron 지역의 그런 조직이다."}]},{"heading_ko":"R1 RCM, 사전승인 플랫폼 Humata 인수","heading_en":"Other Top Headlines","skip":null,"summary":"청구·수납을 대행하는 대형 사업자가 사전승인 소프트웨어 회사를 사들였다는 소식이다. 인수된 회사의 자산은 이전에 무너진 회사에서 되사 온 것이라, 같은 기술이 여러 손을 거쳐 왔다는 이력이 함께 정리된다. 필자는 그 회사 창업자와 나눈 팟캐스트 대화를 함께 소개한다.","insight":null,"signal":null,"author":[{"claim":"사전승인 절차를 다룬 이 팟캐스트 대화는 AI가 마찰을 줄일 수 있는 지점과 사람이 여전히 필요한 지점을 함께 보여 준다.","evidence":"대화에서 다룬 주제를 열거했을 뿐, 구체적인 결론이나 창업자의 발언은 옮기지 않았다."}],"experts":[],"cases":[{"name":"R1 RCM의 Humata 인수","what":"병원 청구·수납 대행 사업자 R1 RCM이 사전승인 플랫폼 Humata를 조건 비공개로 인수했다.","scale":"Humata는 2023년 Olive AI가 사업을 접은 뒤 그 자산을 되사들이며 시작됐고, Olive는 2021년 Verata Health를 1억 2,000만 달러에 인수하며 그 자산을 확보했다.","note":"같은 자산이 Verata에서 Olive로, 다시 Humata로, 이번에 R1으로 세 번 손바뀜한 셈이다. Humata는 Oklahoma 주에서 WISeR 프로그램의 참여 벤더로 활동하고 있으며, 창업자 겸 CEO Jeremy Friese는 Verata에서도 같은 자리에 있었고 최근 이 뉴스레터의 팟캐스트에 출연했다."}],"notes":[{"term":"prior authorization","ko":"사전승인","plain":"의사가 검사나 약을 정하기 전에 보험사에게 미리 허락을 받아야 하는 절차다. 보험사는 불필요한 지출을 막는 장치라고 하고, 의사와 환자는 진료가 며칠에서 몇 주씩 밀리는 원인으로 지목한다. 한국은 급여 기준에 맞으면 일단 진료하고 나중에 심사를 받으므로, 이렇게 미리 허락을 받는 단계 자체가 없다."},{"term":"RCM (revenue cycle management)","ko":"청구·수납 대행","plain":"병원이 진료를 마친 뒤 보험사에 청구서를 보내고 실제로 돈을 받아 내기까지의 모든 사무 작업을 대신 처리해 주는 사업이다. 미국은 보험사마다 청구 규칙이 달라 이 작업만으로 큰 산업이 만들어졌다. R1 RCM이 그 대표 사업자다."},{"term":"WISeR 프로그램","ko":"메디케어 원조에 사전승인을 시험하는 CMS 프로그램","plain":"메디케어에는 정부가 직접 값을 치르는 부분(원조 메디케어)과 민간 보험사에 맡기는 부분(메디케어 어드밴티지)이 있는데, 사전승인은 그동안 주로 민간 쪽에서만 쓰였다. WISeR는 정부 직영 부분에서도 일부 시술에 사전승인을 붙여 보는 시험 프로그램이며, 주 단위로 참여 벤더가 지정된다. Humata가 Oklahoma의 벤더다."}]},{"heading_ko":"Ascension 병원의 약물 혼동 사고","heading_en":"Other Top Headlines","skip":null,"summary":"대형 병원 그룹이 수술 중 약물이 뒤바뀐 사고를 인정했다는 짧은 소식이다. 필자는 이 사고를 계기로, 아직 오지 않은 AI의 위험을 걱정하는 데 쓰는 에너지와 지금 벌어지고 있는 사고 사이의 불균형을 지적한다.","insight":null,"signal":null,"author":[{"claim":"이런 이야기가 현재 진행형인데도 우리가 집단적으로 의료에서 AI가 미래에 미칠 영향을 걱정하는 데 그토록 많은 에너지를 쓴다는 사실이 놀랍다.","evidence":"이번 사고 자체를 들었다."},{"claim":"병원은 복잡한 환경이고 실수는 인간적인 일이지만, 2026년에 이 사고는 충분히 피할 수 있었던 일로 보인다.","evidence":"근거를 대지 않았다."}],"experts":[],"cases":[{"name":"Ascension","what":"미국의 대형 헬스 시스템으로, Nashville의 자사 병원 한 곳에서 정기 관절 치환 수술 도중 마취제 대신 인산칼륨이 주입된 사고를 인정했다.","scale":"환자 한 명이 마비되고 세 명이 상해를 입었다.","note":""}],"notes":[]},{"heading_ko":"Weave, 6억 5,000만 달러에 비상장 전환","heading_en":"Other Top Headlines","skip":null,"summary":"의료기관의 접수와 환자 응대 업무를 돕는 AI 회사가 사모펀드에 인수되어 상장을 접는다는 한 줄 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Weave","what":"의료기관의 여러 프론트오피스 환자 응대 업무를 돕는 에이전틱 AI 플랫폼으로, Francisco Partners에 인수되며 비상장 전환된다.","scale":"인수 금액은 약 6억 5,000만 달러다.","note":""}],"notes":[]},{"heading_ko":"Cityblock, 1억 1,600만 달러 조달과 Homeward Health 인수","heading_en":"Funding Announcements","skip":null,"summary":"복합 질환을 가진 공보험 인구를 맡아 온 회사가 자금을 조달하면서 같은 시장의 다른 회사를 주식으로 인수했다. 필자가 창업자와 직접 나눈 대화를 바탕으로, 이 회사가 지금 어느 국면에 들어섰는지를 정리한다. 요점은 시장의 역풍을 견디며 갖춘 운영 기반을 이제 확장에 쓰면서, 이 시장에서 다른 회사를 사들이는 쪽으로 돌아서려 한다는 것이다.","insight":null,"signal":null,"author":[{"claim":"Cityblock은 이번 발표를 사업의 새 장을 여는 출발점으로 보고 있다.","evidence":"Ajayi와의 대화에서 받은 분명한 인상이라고 밝혔다."},{"claim":"VBC 시장의 역풍이 이 회사에게는 순풍으로 바뀌고 있다.","evidence":"근거를 대지 않았다."},{"claim":"Cityblock이 플랫폼이 될 만한 규모에 도달해 이 시장에서 자산을 사들이는 인수자가 되기에 좋은 위치에 섰으며, 그것이 맞다면 시장 전반의 스타트업에게 좋은 소식이다.","evidence":"이번 라운드와 Homeward Health 인수, 그리고 Ajayi가 밝힌 비유기적 성장 계획을 들었다."}],"experts":[{"who":"Toyin Ajayi","role":"Cityblock의 공동창업자 겸 CEO다. 자금 조달과 인수를 막 발표한 자리이므로 전망을 좋게 말할 위치에 있다.","claim":"앞으로 유기적 성장과 비유기적 성장을 함께 추구하며, 비유기적 성장의 우선순위는 중증 정신질환과 물질사용장애, 특수 요구 인구 같은 다른 복합 인구로 확장하는 것과 그 인구를 지원하는 역량에 맞춰져 있다.","evidence":"원문은 그가 든 근거를 옮기지 않았다."}],"cases":[{"name":"Cityblock","what":"복합 질환을 가진 메디케이드·메디케어 인구를 맡아 VBC 방식으로 진료를 제공하는 회사로, 자금을 조달하면서 Homeward Health를 전액 주식 거래로 인수한다고 발표했다.","scale":"조달 금액은 1억 1,600만 달러이며, General Catalyst가 라운드를 주도했다.","note":"주정부와 CMS, 보험사에게 고가치 케어를 제공하는 AI 기반 파트너가 되겠다는 것이 다음 국면의 목표로 제시됐다."}],"notes":[{"term":"Medicaid","ko":"메디케이드","plain":"저소득층을 위한 미국의 공보험이다. 연방과 주가 함께 돈을 대고 주가 운영하므로 자격 기준과 보장 범위가 주마다 다르다. 노인을 위한 메디케어와 헷갈리기 쉬운데 메디케이드는 소득 기준이며, 둘 다 받는 사람도 있다."},{"term":"VBC (value-based care)","ko":"성과 기반 지불","plain":"진료 건수마다 값을 치르는 방식 대신, 맡은 인구의 건강 결과와 총 의료비를 기준으로 돈을 주고받는 방식이다. 회사가 환자를 잘 관리해 입원과 응급실 이용을 줄이면 아낀 돈의 일부를 가져가고, 반대의 경우에는 손실을 떠안는다. 미국은 지난 10년간 이 방식으로 옮겨 가는 흐름을 밀어붙였지만, 자금 조달이 어려워지고 성과가 늦게 나오면서 여러 회사가 고전했다. 본문에서 말하는 역풍이 그것이다."},{"term":"복합 질환 인구 (complex populations)","ko":"돌보기 어려운 고비용 환자군","plain":"만성질환 여러 개에 정신질환이나 주거 불안 같은 생활 문제까지 겹쳐 의료비가 유난히 많이 드는 사람들을 가리킨다. 인원은 적지만 전체 의료 지출에서 차지하는 비중이 커서, 이들의 비용을 낮추는 데 성공하면 돌아오는 보상이 크다. 이 회차의 자금 조달 세 건이 모두 이 인구나 농촌 쪽을 향한 이유이기도 하다."}]},{"heading_ko":"Deon Health, 지적·발달장애 인구 관리의료로 투자 유치","heading_en":"Funding Announcements","skip":null,"summary":"지적·발달장애가 있는 사람들을 관리의료 모델로 옮기는 회사가 보험사로부터 전략적 투자를 받았다. 필자가 CEO와 나눈 대화를 소개하는데, 이 인구가 왜 비용이 높으면서도 그동안 제도 바깥에 있었는지가 설명된다. 마지막에 나오는 사망 원인 이야기가 이 꼭지에서 가장 무게가 실린 대목이다.","insight":null,"signal":null,"author":[{"claim":"Deon이 만들고 있는 모델은 흥미롭다.","evidence":"지역 공급자들과의 조인트벤처를 통해 직접지원 전문인력을 지원한다는 구조를 들었다."},{"claim":"요로감염에서 비롯된 패혈증이 이 인구의 주요 사망 원인이라는 것은 2026년 미국에서 충분히 풀 수 있는 문제로 보인다.","evidence":"많은 이들이 말을 하지 못해 문제를 전달할 수 없다는 Ratner의 설명을 들었다."}],"experts":[{"who":"Sara Ratner","role":"Deon Health의 CEO다. 이 인구를 관리의료 모델로 옮기는 사업을 하는 쪽이므로 그 전환이 좋다고 말할 이해관계가 있다.","claim":"이 인구를 관리의료 모델로 옮기면 메디케이드 전반의 부정수급 우려를 어느 정도 해소하는 동시에 독특한 의료 수요를 더 잘 지원할 수 있고, 응급실에 오는 빈도가 줄면서 비용 절감도 따라온다. 요로감염에서 비롯된 패혈증이 이 인구의 주요 사망 원인 중 하나다.","evidence":"많은 이들이 말을 하지 못해 문제를 전달할 수 없다는 점을 들었다. 다만 부정수급이 얼마나 줄고 비용이 얼마나 절감되는지는 수치로 제시되지 않았다."}],"cases":[{"name":"Deon Health","what":"지적·발달장애가 있는 인구를 위한 관리의료 모델을 만드는 회사로, 지역 공급자들과의 조인트벤처를 통해 직접지원 전문인력을 지원한다. AmeriHealth Caritas로부터 새로운 전략적 투자 라운드를 유치했다.","scale":"금액은 공개되지 않았다.","note":"투자자가 재무 투자사가 아니라 메디케이드 관리의료를 하는 보험사라는 점이 눈에 띈다. 사업 파트너가 지분으로 들어온 형태다."}],"notes":[{"term":"I/DD","ko":"지적·발달장애","plain":"지적장애와 자폐를 비롯한 발달장애를 함께 부르는 말이다. 이 인구는 의료비가 가장 많이 드는 환자군 가운데 하나인데도, 미국의 여러 주에서 관리의료 대상 밖에 놓여 왔다."},{"term":"DSP (direct support professional)","ko":"직접지원 전문인력","plain":"지적·발달장애가 있는 사람의 일상생활을 곁에서 돕는 인력이다. 미국에서 이 일은 임금이 낮고 이직률이 높아 인력난이 만성이며, 그 때문에 돌봄의 질과 건강 문제를 알아채는 능력이 사람에 따라 크게 달라진다. Deon이 이 인력을 지원하겠다고 나선 배경이 그것이다."},{"term":"관리의료 모델로 옮긴다","ko":"주정부가 직접 치르던 몫을 민간에 맡기는 전환","plain":"그전에는 주정부가 서비스 건마다 값을 직접 치렀다. 관리의료로 옮기면 주정부가 민간 회사에 사람당 정액을 주고 전체를 맡기며, 받는 쪽은 덜 쓸수록 이익이 남으므로 응급실 방문을 줄일 유인이 생긴다. 다만 필요한 서비스까지 줄일 위험도 함께 생기는 대목이다. 본문에서 이 인구가 역사적으로 제외돼 왔다는 것은 이 전환이 아직 안 됐다는 뜻이다."}]},{"heading_ko":"Hopscotch Health, 농촌 1차 진료로 5,300만 달러","heading_en":"Funding Announcements","skip":null,"summary":"농촌 지역의 1차 진료를 돕는 회사가 자금을 조달했다는 짧은 소식이다. 필자는 이번 주에 나온 세 건의 라운드를 묶어 농촌과 복합 질환 시장에 돈이 몰리고 있다고 읽는다.","insight":null,"signal":null,"author":[{"claim":"지금 농촌과 복합 질환 시장에 모멘텀이 있다.","evidence":"이번 주에 Cityblock, Deon Health, Hopscotch Health 세 건의 라운드가 함께 나왔다는 점을 들었다."}],"experts":[],"cases":[{"name":"Hopscotch Health","what":"원문이 농촌 지역 1차 진료 이네이블러라고 소개한 회사로, 새 자금을 조달했다.","scale":"조달 금액은 5,300만 달러이며 8VC와 Town Hall Ventures가 라운드를 주도했다. 현재 주로 North Carolina 서부에서 1만 5,000명의 환자를 진료한다.","note":""}],"notes":[{"term":"primary care enabler","ko":"1차 진료 이네이블러","plain":"동네 의원을 직접 사들여 소유하는 대신, 개원의가 성과 기반 계약을 감당할 수 있도록 데이터와 인력과 자금을 대주는 사업 모델이다. 성과 기반 계약은 절감액을 나중에 정산받는 구조여서 작은 의원 혼자서는 버티기 어렵기 때문에, 그 부담을 대신 져 주는 회사가 필요해진다."}]},{"heading_ko":"AI가 의사를 대체하느냐는 논쟁을 가라앉히기","heading_en":"What I'm Reading","skip":null,"summary":"AI가 임상의를 능가할 것이라는 기고가 의학 학술지에 실리면서 벌어진 소동을 다룬다. 필자는 글 자체보다 그에 대한 반발이 과했다고 보고, 인용된 인물이 실제로 그리는 그림은 의사를 없애는 쪽이 아니라고 짚는다. 그러면서 이 논쟁이 정작 필요한 대화를 가리는 미끼라고 결론짓는다.","insight":"이 꼭지는 무엇을 만들지보다 어디까지가 규제 밖인지를 갈라 준다. 필자가 든 예, 즉 FDA 허가를 받은 AI 에이전트를 병원이 환자에게 처방하는 경로는 3개월 안에 갈 수 없는 길이므로, 진단이나 치료 결정에 닿는 기능은 이번 후보에서 빼는 편이 낫다. 반대로 규제 밖에 남는 자리는 사용자가 이미 받아 든 것을 이해시키는 쪽이다. 검사 결과지나 진료 후 요약을 쉬운 말로 풀어 주고 다음 진료에서 물어볼 질문을 정리해 주는 화면은 새로 판정을 내리지 않는 선을 지키는 한 허가 대상이 아니고, 영어가 편하지 않거나 설명을 듣지 못한 미국 사용자가 실제로 막히는 지점이기도 하다.","signal":null,"author":[{"claim":"이 글에 대한 소셜미디어의 반박들이 얼마나 쓸모 있는지 의문이며, 알고리즘에 영합해 분노를 자극하도록 설계된 것처럼 보인다.","evidence":"근거를 대지 않았다."},{"claim":"Khosla의 실제 입장을 들어 보면 의사가 AI 에이전트 팀을 관리하는 세계이므로, 자율 AI냐 사람이 낀 AI냐라는 이 논쟁의 구분 자체가 흐릿하다.","evidence":"작년 말 Eric Larsen과의 팟캐스트 18분 지점 발언을 들었고, 이 팀이 기고를 쓴 8개월 남짓 동안 그가 그 입장에서 크게 멀어지지 않았을 것이라고 짐작했다."},{"claim":"병원이 FDA 승인 AI 에이전트를 환자에게 처방하는 것은 디지털 치료제가 10년 넘게 약속해 온 것의 다음 반복과 크게 다르지 않으며, 바로 그 지점에서 지금의 논쟁은 사실상 무의미해진다.","evidence":"Cleveland Clinic이 그렇게 하는 상황을 가정해 물었고, FDA 510k 절차도 이를 그렇게 보는 듯하다는 점을 덧붙였다."},{"claim":"'AI가 의사를 대체할 것인가'라는 서사는 정작 이뤄져야 할 훨씬 결이 섬세한 대화에서 주의를 돌리는 미끼다.","evidence":"Mark Cuban의 비판을 읽어 보니 그도 사실 Khosla와 Emanuel 등의 입장에 대체로 동의하고 있다고 본 점을 들었다. 각자가 자기 이익 풀을 지키려는 태도를 넘어서면 합의점이 훨씬 많다는 것이다."},{"claim":"AI의 임상 확산 자체는 불가피해 보이므로 사람들을 양극단으로 몰아붙이는 일은 역효과다.","evidence":"근거를 대지 않았다."}],"experts":[{"who":"Zeke Emanuel, Abe Baker-Butler, Neal Khosla, Vinod Khosla","role":"이 기고를 함께 쓴 네 사람이다. 원문은 이들의 소속을 밝히지 않았다. 필자는 이 논쟁 전반을 두고 각자가 자기 이익 풀을 지키려 한다고 적었을 뿐, 이 네 사람을 지목해 그렇게 말하지는 않았다.","claim":"AI 단독이 의사와 AI의 하이브리드를 능가할 것이며, 2030년이면 실제 진료 워크플로에 투입될 수 있다.","evidence":"이 주제에 관한 최근 연구를 정리해 근거로 삼았다. 필자는 글 자체가 그것이 불러일으킨 반응에 비하면 꽤 온건했다고 평가했다."},{"who":"Vinod Khosla","role":"위 기고의 공동 저자다. 원문은 그의 소속을 밝히지 않았고, 작년 말 팟캐스트 발언을 인용했다.","claim":"의사가 자신을 대신해 일종의 레지던트 역할을 하는 AI 에이전트 팀을 관리하면서 의사의 도달 범위가 넓어지는 세계가 온다. 그 세계에서 의사는 재정적으로 오히려 더 낫다.","evidence":"원문은 그가 든 근거를 옮기지 않았다."},{"who":"소셜미디어의 전문가들","role":"원문은 개별 이름을 밝히지 않았다. 임상의를 방어하는 쪽에 선 사람들이다.","claim":"연구가 결함투성이다, 의학은 예술이자 과학이다, AI는 사람에게 손을 얹을 수 없다.","evidence":"원문은 이들이 든 근거를 하나씩 옮기지 않았고, 필자는 이 반박들이 분노를 자극하도록 설계된 것처럼 보인다고 평가했다."}],"cases":[{"name":"JAMA Viewpoint 기고","what":"AI가 임상의를 능가할 것이라고 주장하는 관점 글이 미국의사협회지의 의견란에 실렸다.","scale":"저자는 네 명이며, 이 팀이 글을 쓰는 데 8개월 남짓 걸렸다.","note":"필자는 글 자체가 그것이 불러일으킨 반응에 비하면 꽤 온건했다고 평가했다."},{"name":"Cleveland Clinic","what":"FDA 승인을 받은 AI 에이전트를 환자에게 처방하는 상황의 예로 언급됐다. 원문은 만약 그렇게 한다면 어떻게 볼 것이냐는 가정문으로 적고 관련 기사를 링크로 걸었다.","scale":"","note":"필자는 이것이 자율 AI인지 사람이 루프 안에 있는 것인지 딱 잘라 가를 수 없는 예로 들었다."}],"notes":[{"term":"JAMA Viewpoint","ko":"미국의사협회지의 의견란","plain":"연구 논문이 아니라 저자의 주장을 싣는 자리다. 새 데이터를 담지 않아도 실릴 수 있지만, 실린 곳이 미국 의학계에서 가장 무게 있는 학술지 가운데 하나여서 업계가 크게 반응한다. 이번 소동도 주장의 새로움보다 실린 자리 때문에 커진 면이 있다."},{"term":"FDA 510(k)","ko":"기존 제품과 같다고 인정받아 시장에 나오는 허가 경로","plain":"이미 승인된 제품과 실질적으로 같다는 것을 보여 시장에 내놓는 미국 의료기기 허가 경로다. 처음부터 임상시험을 새로 하는 전면 승인보다 훨씬 빠르고 싸서, 소프트웨어 형태의 의료기기 대부분이 이 경로로 시장에 나온다. 그래도 서류와 심사가 필요해 몇 달에서 1년 이상이 걸리므로, 3개월짜리 계획에는 들어가지 않는다."},{"term":"디지털 치료제 (digital therapeutics)","ko":"처방받는 치료용 소프트웨어","plain":"약 대신 앱이 치료 효과를 낸다고 주장하며 규제 허가를 받아 의사가 처방하는 소프트웨어다. 2010년대에 큰 기대를 모았으나 처방과 보험 수가를 받아 내는 데 실패해 대표 회사들이 무너졌다. 필자는 지금의 AI 에이전트 논의가 그 흐름의 다음 반복이라고 본다."},{"term":"human-in-the-loop","ko":"사람이 루프 안에 있는 구조","plain":"AI가 스스로 결정을 끝내지 않고 중간이나 마지막에 사람이 확인하고 승인하는 구조를 가리킨다. 규제와 책임 소재가 이 구분에 걸려 있어서, 같은 제품을 두고도 자율 AI인지 사람이 낀 AI인지를 두고 논쟁이 벌어진다. 필자가 이 구분이 흐릿하다고 말하는 이유가 그것이다."}]}],"themes":["policy-legislation","medicare-advantage","consumer-dtc","employer-insurance","value-based-care","ai-clinical"],"for_later":[]}],"extras":{"glossary":{"items":[]}},"themeLabels":{"medicare":"메디케어","medicare-advantage":"메디케어 어드밴티지","medicaid":"메디케이드","aca-exchange":"ACA 거래소","employer-insurance":"고용주 보험","payer-ops":"보험사 운영","hospital-health-system":"병원·헬스시스템","primary-care":"1차 진료","value-based-care":"성과기반 진료","rcm-billing":"청구·수납","pbm-drug-pricing":"PBM·약값","pharmacy-retail":"약국·리테일","pharma-glp1":"제약·GLP-1","price-transparency":"가격 투명성","consumer-dtc":"소비자 직접판매","cash-pay":"현금 결제 시장","employer-benefits":"복리후생","ai-clinical":"임상 AI","ai-admin":"행정 AI","data-interop":"데이터 상호운용","telehealth":"원격진료","behavioral-mental":"정신건강","chronic-care":"만성질환 관리","senior-care":"시니어 케어","women-health":"여성 건강","dental-vision":"치과·안과","devices-wearables":"기기·웨어러블","digital-health-funding":"투자·펀딩","ma-consolidation":"인수합병","regulation-cms":"CMS 규제","regulation-fda":"FDA 규제","policy-legislation":"입법·정책","public-health":"공중보건","workforce":"인력","rural-access":"의료 접근성","clinical-trials":"임상시험","insurance-brokerage":"보험 유통","startups":"스타트업","market-earnings":"실적·시장"},"raw":{"01":{"index":"01","title_en":"Weekly Health Tech Reads 1/4/26","subtitle":"AI와 헬스케어에 관한 단상, VBC에 대한 토론, 버몬트의 가격 투명성 노력, 그리고 그 밖의 소식","sections":[{"heading_en":"AscendRural's Senior Care Accelerator","body":"스폰서: AscendRural\n\nAscendRural's Senior Care Accelerator는 농촌 지역의 고령 인구를 지원하는, 파일럿이 가능한 솔루션을 대상으로 이번 주 금요일인 1월 9일까지 지원서를 받고 있습니다.\n\n이들의 4주 프로그램은 초기 단계 스타트업이 실제 농촌 현장에서 솔루션을 파일럿하고, 검증하고, 확장하도록 돕고, 최대 15만 달러 규모의 자금이 지원되는 파일럿 계약을 확보할 기회를 함께 제공합니다.\n\n선정된 팀은 멘토십, 농촌 시장 인사이트, 체계적인 준비 지원, 그리고 AscendRural의 전국 및 지역 파트너 생태계와의 연결도 얻게 됩니다.\n\n이번 주 금요일 1월 9일까지 지원하세요"},{"heading_en":"","body":"부디 편안한 휴가철이었기를 바라며, 다시 오신 것을 환영합니다. 연휴 동안 헬스케어 뉴스는 비교적 조용한 몇 주였는데, 다음 주 JPMorgan을 앞두고 모두가 준비에 들어가는 이번 주에는 분명 금세 달라질 것입니다. 올해 JPM의 기업 발표에 대해 제가 진행할 팝업 커버리지에 관해 이번 주에 저희가 보낼 또 다른 소식을 기다려 주세요.\n\n- Kevin"},{"heading_en":"My Reflection: Arts and crafts and business","body":"지난 몇 년 동안 여러 번 받은 질문이 있습니다. 왜 뉴스레터 제작 과정을 더 자동화하지 않느냐는 것입니다. 매주 제가 하는 일 가운데 얼마나 많은 부분이 자동화될 수 있고 그 과정에서 시간을 얼마나 아낄 수 있는지 그려 보는 것은 어렵지 않습니다. 그런데도 저는 늘 이 과정을 자동화하려는 충동을 눌러 왔습니다.\n\n오해하지는 마세요. 여러분과 주고받는 이야기를 즐기기는 하지만, 뉴스레터를 쓰려고 새벽 5시에 일어나고 싶지 않은 일요일도 분명 있습니다. 하지만 자동화하지 않은 가장 큰 이유는 이기적인 것입니다. 이 뉴스레터를 만드는 일은 매주 제가 하게 되는 저만의 개인 예술 프로젝트 같은 것이기 때문입니다. 뉴스레터 한 편 한 편은 제가 푸는 퍼즐이고, 제 솜씨를 다듬는 기회입니다. 저는 매주 이런 식으로 깊이 생각할 기회를 소중히 여기게 되었습니다.\n\n우리의 여러 세계가 AI가 만들어 낸 온갖 것에 잠식되면서, 이 뉴스레터 같은 것에 들어가는 솜씨는 점점 더 두드러질 것이라고 저는 믿습니다. 연휴 동안 Scott Belsky가 쓴 블로그 글도 비슷한 이야기를 했는데, 여러 주제 가운데 2026년 제품에 들어가는 솜씨의 중요성을 다뤘습니다. 제가 편향돼 있는 것은 분명하지만, 저에게는 확실히 와닿았습니다.\n\n이렇게 물으실 수도 있습니다. 알겠어요 Kevin, 그런데 이게 헬스케어와 무슨 상관이죠? 저는 더 많은 \"front of house\" 인간을 향한 움직임에 관한 Belsky 글의 아래 대목이 꽤 관련이 있다고 생각했습니다:\n\n2025년 헬스케어 AI 혁신의 상당 부분이 역사적으로 형편없었던 \"front of house\" 환자 경험을 자동화해 없애는 데 집중된 것으로 보였다는 점을 생각하면, 이런 정서를 보는 것은 특히 흥미로웠습니다.\n\n저는 2025년 뉴스레터에서 이를 폭넓게 다뤘습니다. AI 증상 체커로서 Doctronic이 성장한 것부터, 진료소의 자동 전화 안내 시스템으로 Assort Health가 채택된 것, 의료 시스템의 아웃바운드 전화를 처리하는 Hippocratic AI까지, 헬스케어의 \"front of house\" 경험을 자동화하려는 시도에 자금을 대려는 열기가 넘쳐 보입니다. 그 뒤에 있는 사업적 당위는 분명해 보입니다. 인건비를 줄여 영업이익률을 넓히는 것은 의료 제공 조직에 의미 있는 지렛대입니다. 그리고 현재 상태의 기준선이 워낙 낮기 때문에, 이는 단기적으로 개선하기 쉬운 기회를 제공합니다.\n\nWellSpan Health의 CEO는 지난 10월 이곳에서 Hippocratic AI와의 파트너십 비전을 잘 설명하면서, 그것이 그 사업적 당위를 어떻게 뒷받침하는지 감을 줬습니다:\n\n지금 저희 비전은 언제 어디서나 케어를 받을 수 있게 하는 것이고, 앞으로 사람들이 헬스케어를 그렇게 소비하게 될 것이라고 생각합니다. 그래서 Anna가 그 비전의 큰 부분이 될 수 있고, 저희는 이미 그녀를 저희 케어 팀의 일원으로 여기고 있습니다.\n\n그래서 그녀는 저희의 AI 케어 어시스턴트로 소개됩니다. 환자들이 그녀와 상호작용하는데, 미래의 비전은 WellSpan에 연락하는 모든 사람이 처음에 Anna의 인사를 받는 것일 수 있습니다. 웹이든 전화든 무엇이든, 모든 통화와 모든 접촉에 대해 그녀가 정말로 저희의 현관문이 되는 것이죠. 그리고 그녀는 지금까지 아주 잘하고 있습니다. 저희는 Anna로 160만 통이 넘는 전화를 걸었습니다. 그녀는 아주 열심히 일합니다. 그리고 지난주에 그녀는 그 주 1차 진료 방문의 50% 이상을 예약했습니다. 그 예약을 끝까지 완료했다는 것은 분명히 환자들이 Anna와 상호작용하는 것을 좋아한다는 뜻이고, 그렇지 않았다면 통화를 끝까지 마치지 않았을 것입니다.\n\n출처: Roxanna Gapstur, WellSpan Health CEO (명확성을 위해 약간 편집함)\n\n그런데 그 글을 읽으면서, 모든 상호작용을 자동화한다는 이 비전이 의료 제공 조직이 향할 방향으로는 틀린 것이 아닌가 하는 생각을 떨칠 수 없습니다. Belsky의 주장을 생각하면, 이런 자동화된 상호작용은 싸구려처럼 느껴지고 나쁜 경험을 낳을 것입니다. WellSpan에서의 Hippocratic 도입에 대한 페이스북의 반응이 이미 그 단면을 보여 줬습니다. 사람들은 기회가 주어지면 사람의 손길이 있는 경험을 선택할 것입니다. 단적인 예로, Private Medical 같은 고급 컨시어지 경험의 웹사이트를 보면, 핵심 가치 제안은 언제든 담당 의사에게 직접 연결되는 것이지 상호작용하게 될 LLM의 품질이 아닙니다.\n\n그래서 Belsky의 환대에 관한 생각 풍선을 헬스케어의 현관문에 적용해 보면, 의료 제공 조직에서 나올 더 흥미로운 비전은 애초에 환자가 증상 체커와 상호작용하거나, 자동 전화 안내를 듣거나, 자동 메시지를 받을 필요가 더 이상 없는 비전이라고 생각합니다. 환자에게 개인화된, 사람이 있는 경험에 편리하게 접근할 수 있게 해 주는 것? 그런 세상이라면 얼마나 좋을까요!\n\n오늘날의 컨시어지 경험보다 더 저렴한 가격대에서 그런 경험을 가능하게 하는 데 AI와 기술이 중요한 역할을 한다는 것은 분명합니다. 하지만 인건비를 아끼려고 사람 간 상호작용을 그저 자동화해 없애기보다는, 근본적으로 인간적인 경험의 배경으로 스며듭니다. 노동을 로봇으로 대체하는 차익거래 기회는 빠르게 닫힐 것입니다. 특히 그토록 많은 것이 인간관계로 굴러가는 산업에서는, 받아들일 만한 마진으로 이런 경험을 가능하게 하는 방법을 알아내는 것이 미션 크리티컬해 보입니다.\n\n그러니 저 같은 창작자든 의료 제공 조직을 운영하는 사람이든, 2026년에는 우리 각자의 제품에 들어가는 인간다움과 솜씨를 AI가 자동화해 없애는 것이 아니라 어떻게 뒷받침할지를 우리 모두 많이 고민하게 될 것 같습니다."},{"heading_en":"Community Discussion Topic: Is VBC Succeeding?","body":"지난 11월에 제가 Aledade의 Farzad Mostashari와 Brown의 Andrew Ryan의 대화를 소개했던 것을 기억하실 것입니다. 그 대화에서 두 사람은 이 질문에 정반대 편에 섰습니다. Mostashari는 value-based care의 원칙과 MSSP 프로그램의 성공을 탄탄하게 옹호했습니다. VBC에 반대하는 Ryan의 주장은 구체적인 내용은 적었지만, 미국 헬스케어의 병폐를 고치는 수단으로서 VBC에서 이제 넘어갈 때가 됐을지도 모른다는 씨앗을 심는 데는 그럼에도 효과적이었습니다. 다른 건 몰라도, 그 대화는 이 주제에 대한 의견의 격차를 분명히 보여 줬습니다.\n\n2026년에 들어서면서, 올해는 value-based care의 모멘텀에 결정적인 해가 될 것으로 보입니다. 그래서 이번 주 커뮤니티에서 아래 설문을 시작으로 더 풀어서 이야기해 보면 좋은 주제라고 생각했습니다:\n\n15년이 지난 지금, value-based care는 성공하고 있는가?\n\n그렇다, 명백한 성공이었다\n\n아직은 아니지만, 올바른 방향으로 가고 있다\n\n아직은 아니고, 잘못된 방향으로 가고 있다\n\n아니다, 이제 넘어갈 때다\n\n모르겠다, 장단점이 있다\n\n모르겠다, 답할 만큼 충분히 알지 못한다\n\nHTN 커뮤니티 멤버 여러분께:\n\n2026년에 커뮤니티에서 더 많은 시간을 쓰고 싶은 일 중 하나는, 함께 배우기에 특히 임팩트가 크다고 생각하는 몇 가지 주제로 대화를 모으는 것입니다. 이를 어떻게 가장 잘 뒷받침할지 실험하는 차원에서, 위의 VBC 질문에 대한 이어지는 토론으로 한 해를 열어 보려고 합니다.\n\n주중에 저희는 이 주제 전용의 새 채널에 커뮤니티 멤버들이 토론할 몇 가지 프롬프트를, 저희의 생각을 자극한 기사들과 함께 올릴 예정입니다. 목요일에는 제가 Aledade의 공동창업자 Farzad Mostashari를 모시고, 최근 발표된 Aledade의 크레딧 퍼실리티와 value-based care 파이낸싱에 대한 그의 더 넓은 관점에 관해 대화를 나눕니다. 금요일에는 커뮤니티 멤버들이 이 주제에 대해 배운 것을 나누는 토론을 열어 한 주를 마무리합니다.\n\n이번 주에 VBC의 현재 상태에 대해 더 생각해 보고 싶다면, 여기서 신청하시기를 권합니다:"},{"heading_en":"Chart of the Week: BCBS VT's transparency push","body":"Blue Cross Blue Shield of Vermont는 이번 주에 버몬트의 고비용 학술 의료 센터에서 이용을 다른 곳으로 돌리려는 상당히 대담한 조치를 취했습니다. 이 보험사는 더 저렴한 네 곳의 의료 제공 조직과 협력해 Vermont Affordable Care라는 웹사이트를 띄웠는데, 버몬트 주민들이 여러 장소에서 서비스 비용이 얼마인지 이해하도록 돕는 것을 목표로 합니다. 비용 데이터를 이용해 버몬트 주민들이 어디서 진료를 받는지에 영향을 주려는 흥미로운 시도입니다:\n\n출처: Vermont Affordable Care 웹사이트\n\n지난 몇 달 동안 여러 Blues 플랜이 헬스케어의 높은 비용을 이야기하려고 공론장에 나섰습니다. 최근 BCBSM이나 BCBSNC의 기고문이 그 예입니다. 이번 시도는 시장 지배적인 의료 제공자인 University of Vermont Medical Center(UVMMC)를 콕 집어 지목했다는 점에서 눈에 띕니다. 지역 뉴스 보도는 이것이 왜 통상적이지 않은지에 대한 좋은 힌트를 줍니다. BCBS VT는 줄타기를 하고 있습니다. 사람들을 UVMMC에서 멀어지게 유도하면서도, 동시에 UVMMC가 너무 화가 나서 네트워크를 떠나 버리지는 않도록 해야 하는 것이죠.\n\n전반적으로 저는 가격 투명성이 실제로 비용을 줄이는 데 도움이 될 것이라는 데 여전히 꽤 회의적입니다. 기본적인 논리는, 높은 가격을 받는 의료 제공자는 그럴 수 있으니 계속 높게 유지할 것이고, 낮은 가격을 받는 의료 제공자는 그 높은 가격을 근거로 자신들의 가격을 올리는 것을 정당화할 것이라는 점입니다. No Surprises Act나 North Carolina State Health Plan의 Clear Pricing Project의 결과를 예로 보세요.\n\n하지만 투명성이 비용을 줄이는 데 도움이 될 수 있다면, 저는 그것이 BCBS VT의 이번 같은 시도를 통해서일 것이라고 생각합니다. 경계를 밀어붙인 그들에게 박수를 보내며, 이것이 그 시장에서 비용을 줄이는 데 도움이 되기를 바랍니다."},{"heading_en":"Other Top Headlines","body":"CMS가 500억 달러 규모 Rural Health Transformation Program의 2026년 자금 배분을 발표했습니다. 2026년에 100억 달러가 50개 주 전체에 배분되며, Texas와 Alaska가 각각 2억 8,100만 달러와 2억 7,200만 달러로 선두입니다. New Jersey는 1억 4,700만 달러로 가장 적은 금액을 받았습니다. 각 주의 농촌 인구를 기준으로 1인당으로 계산해 보면 Rhode Island가 압도적인 1위이고, Texas는 실제로는 맨 아래에 있습니다."},{"heading_en":"Other Top Headlines","body":"Prenuvo와 한 영상의학과 의사가, 2023년 Prenuvo 스캔을 받은 뒤 뇌졸중을 겪은 환자로부터 의료과실 소송을 당했습니다. 소송은 이들이 뇌졸중을 막을 수 있었던 주요 경고 신호를 놓치고 오히려 결과가 정상이라고 알렸다고 주장합니다. 사건은 진행 중이지만, 판사는 캘리포니아 법에 따라 의료과실 배상액에 상한을 두려는 Prenuvo의 시도를 기각했습니다. 이 사건에 연루된 Prenuvo의 영상의학과 의사는 별건으로 2024년 1월 New York에서 7,000만 달러가 넘는 보험 사기 계획에 가담한 혐의를 인정한 것으로 보입니다. 저만 그런지 모르겠지만, 이는 2025년 초 Prenuvo의 1억 2,000만 달러 투자 유치 발표에서 나온 최첨단 기술 서사의 상당 부분과 모순되는, 꽤 우려스러운 데이터 포인트로 보입니다."},{"heading_en":"Other Top Headlines","body":"FDA가 Novo Nordisk의 경구용 알약 버전 Wegovy를 승인했습니다."},{"heading_en":"Funding Announcements","body":"HSA / FSA 혜택 자금을 쓸 수 있는 마켓플레이스인 TrueMed가 3,400만 달러를 유치했습니다. a16z가 라운드를 주도했습니다. 롱제비티 상품에 대한 관심이 커지고 HSA 계좌에 대한 정치적 지지가 있는 상황을 감안하면, TrueMed는 이 시장의 파도를 탈 좋은 위치에 있는 것으로 보입니다."},{"heading_en":"What I'm Reading: Town Hall Ventures' 2026 Predictions","body":"Town Hall Ventures' 2026 Predictions, Andy Slavitt, Josh Loria, Andie Steinberg 씀\n\n저는 2026년 예측 기사 대부분을 피해 왔지만, 이 글은 특히 정책 지형에 관해 흥미로운 관점이 몇 가지 있다고 생각했습니다. 구체적으로는, CMMI의 새 LEAD 모델의 핵심 요소로서 CARA를 다룬 대목이 특히 흥미로웠는데, 이것이 서브 캐피테이션 모델의 의미 있는 증가로 이어질 수 있다고 짚었습니다."},{"heading_en":"What I'm Reading: Mark Cuban Tells Us How He Can Fix America's Sh!tty Health Care","body":"Mark Cuban Tells Us How He Can Fix America's Sh!tty Health Care, Jonathan Cohn 씀\n\nMark Cuban은 요즘 헬스케어를 ~~망치는~~ 고치는 방법에 대한 자신의 관점을 여기저기서 늘어놓고 있습니다. 저는 The Bulwark에 실린 그와 Jonathan Cohn의 이 인터뷰가 그런 생각의 일부를 담은 좋은 인터뷰라고 생각했습니다. Cuban이 말하는 것 중 어떤 것은 말이 되고 어떤 것은 그렇지 않다는, 그 글에 담긴 Cohn의 정서에 저도 동의합니다. 전체 서사의 일관성을 표현하는 방식치고는 꽤 정중한 편으로 보입니다.\n\n솔직히 말하면 이 서사는 조금 Groundhog Day 같은 느낌입니다. 기억하실지 모르겠지만, 저는 2025년도 Cuban의 다른 블로그 글에 대한 불만을 나누며 시작했습니다. 올해 연휴 동안 새로 알게 된 한 가지는, Mark Cuban이 몇 년 전에 이 나라의 헬스케어 재원 조달에 대한 자기 나름의 계획을 실제로 내놓았고 그것을 10Plan이라고 불렀다는 사실입니다. Cost Plus Drugs가 만들어 낸 임팩트에 대해서는 Cuban이 분명 인정받을 자격이 있습니다. 하지만 전반적인 과도한 단순화와 손가락질은 대화를 생산적으로 진전시키는 데 전혀 도움이 되지 않아 보입니다. 10Plan이나 Cost Plus Wellness 같은 시도에서 Cuban이 겪은 확산 실패는(Cost Plus Drugs에서 Humana와 파트너십을 맺고 싶어 했던 것은 말할 것도 없고) 그가 이번 같은 대화에서 드러내는 것보다 이곳의 복잡성을 더 잘 알고 있음을 분명히 보여 줍니다. 그런 대화에서 그는 마치 다른 거의 모든 사람이 헬스케어를 아직 고치지 못했다는 이유로 바보이거나 악하다고 생각하는 것처럼 보입니다."}]},"04":{"index":"04","title_en":"Weekly Health Tech Reads 1/11/26","subtitle":"HTN이 JPM에 가고, OpenAI의 홍보 총공세, Doctronic과 Utah의 AI 시험, CMS가 새 클레임 플랫폼에 대한 RFI를 내고, 그 밖의 소식","sections":[{"heading_en":"Last day to sign up for our pop-up coverage of JPM this week!","body":"많은 분들과 마찬가지로 저도 오늘 늦게 JP Morgan 2026을 위해 SF로 떠납니다. 올해는 기업 발표들을 취재하면서 그 자리에서 논의되는 내용에 대한 제 관점을 팝업 뉴스레터로 공유하게 되어 기대가 큽니다. 이번 주 내내 매일 태평양 시간 오전 6시경에 보내드릴 예정입니다.\n\n매일 무슨 일이 벌어지는지에 대한 제 정리가 궁금하시다면 아래에서 신청하시기를 권합니다. 제가 특히 눈여겨보고 있는 주제 몇 가지는 다음과 같습니다.\n\nAI: 모두가 좋아하는 화제의 주제입니다. Abridge, Open Evidence, Open AI이 모두 발표 명단에 올라 있고 그 외에도 더 있습니다. 지난주에 나온 소식들을 감안하면 OpenAI는 특히 시의적절할 것입니다.\n\nVBC: Astrana, Cityblock, Somatus, ThymeCare 등이 VBC의 현주소에 대해 흥미로운 업데이트를 들려줄 것입니다. 저는 특히 전문 진료 영역의 VBC 시장이 어떻게 진화하고 있는지가 궁금합니다.\n\nGovernment programs: 대형 보험사들은 빠져 있지만 Clover와 Alignment가 MA 시장에 대한 업데이트를 내놓을 것이고, 저는 ACA/Medicaid 시장 변화에 대해 프로바이더들이 어떤 이야기를 하는지 듣고 싶습니다.\n\nMartin과 제가 다룰 예정인 기업들의 현재 목록을 비롯해 더 자세한 내용은 이 페이지에서 확인하실 수 있습니다.\n\n위의 여러 발표와 주제에서 나온 핵심 정리를 따라가고 싶으시다면 아래 버튼으로 신청해서 확인해 보세요. 이 별도의 심층 분석은 349달러에 제공합니다.\n\nSign up for HTN's Coverage of JPM 2026"},{"heading_en":"OpenAI's healthcare PR efforts go warp speed this week","body":"OpenAI는 이번 주 여러 소식을 전하며 온통 뉴스를 채웠습니다.\n\n먼저 OpenAI는 \"AI as a Healthcare Ally\"라는 꽤 흥미로운 리포트를 냈습니다. 이 리포트는 사람들이 AI를 어떻게 쓰고 있는지를 파고들기 때문에 그 자체로 시간을 들여 곱씹어 볼 만합니다. Axios가 5일에 이 리포트를 잘 다뤘는데, 전 세계에서 4천만 명 넘는 사람들이 매일 ChatGPT를 건강 정보를 얻는 데 쓰고 있다는 점을 짚었습니다. 제게 가장 흥미로웠던 수치는 건강보험을 이해하기 위해 ChatGPT에 보내는 메시지가 주당 거의 200만 건에 달한다는 것이었습니다. 이 리포트에 누가 신이 났을지 아시겠죠? 헬스플랜과 헬스시스템 양쪽에 프런트도어 전략을 다시 짜자고 제안하는 컨설턴트들입니다. 당연하게도 이 새로운 환경에서 헬스케어 브랜드들이 어떻게 관심을 놓고 경쟁할지
