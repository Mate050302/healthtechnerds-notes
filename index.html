<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Health Tech Nerds 정리 노트 — 미국 헬스케어 읽기</title>
<meta name="description" content="Health Tech Nerds 뉴스레터 55회차를, 미국 헬스케어를 처음 보는 사람 기준으로 한글로 풀어 쓴 정리 노트">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#faf9f7; --surface:#fff; --surface-2:#f4f2ee; --text:#1b1a18; --muted:#6d6860;
  --line:#e5e1d9; --line-soft:#efece6;
  --accent:#1c6d5b; --accent-soft:#e4f1ed; --accent-ink:#12503f;
  --warn:#8a5a10; --warn-soft:#fbf0dc;
  --t-reads:#1f5fa8; --t-reads-bg:#e6eefa;
  --t-policy:#8a5a10; --t-policy-bg:#fbf0dc;
  --t-roundup:#6b3f9e; --t-roundup-bg:#f0e9fb;
  --t-interview:#a33a6b; --t-interview-bg:#fbe8f1;
  --t-event:#5a5a5a; --t-event-bg:#ececec;
  --radius:12px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
:root:not([data-theme="light"]){ color-scheme:light }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131519; --surface:#1a1d22; --surface-2:#20242b; --text:#e9e7e3; --muted:#9aa0a8;
    --line:#2b3038; --line-soft:#232830;
    --accent:#63c3a8; --accent-soft:#173028; --accent-ink:#8fd9c2;
    --warn:#d9ab63; --warn-soft:#2e2415;
    --t-reads:#7fb0e8; --t-reads-bg:#182634;
    --t-policy:#d9ab63; --t-policy-bg:#2e2415;
    --t-roundup:#b493e0; --t-roundup-bg:#241c33;
    --t-interview:#e08bb2; --t-interview-bg:#331823;
    --t-event:#a8a8a8; --t-event-bg:#26262a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131519; --surface:#1a1d22; --surface-2:#20242b; --text:#e9e7e3; --muted:#9aa0a8;
  --line:#2b3038; --line-soft:#232830;
  --accent:#63c3a8; --accent-soft:#173028; --accent-ink:#8fd9c2;
  --t-reads:#7fb0e8; --t-reads-bg:#182634;
  --t-policy:#d9ab63; --t-policy-bg:#2e2415;
  --t-roundup:#b493e0; --t-roundup-bg:#241c33;
  --t-interview:#e08bb2; --t-interview-bg:#331823;
  --t-event:#a8a8a8; --t-event-bg:#26262a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:anywhere;
}
a{color:var(--accent-ink); text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit; font-size:inherit; color:inherit}

/* ---------- layout ---------- */
.app{display:grid; grid-template-columns:308px minmax(0,1fr); min-height:100vh}
.side{
  border-right:1px solid var(--line); background:var(--surface);
  position:sticky; top:0; height:100vh; display:flex; flex-direction:column; min-width:0;
}
.main{min-width:0; display:flex; flex-direction:column}

/* ---------- sidebar ---------- */
.brand{padding:18px 18px 12px; border-bottom:1px solid var(--line-soft)}
.brand h1{margin:0; font-size:15px; font-weight:700; letter-spacing:-.01em}
.brand p{margin:4px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5}
.searchwrap{padding:12px 14px 8px}
.search{
  width:100%; padding:9px 12px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--text); font-size:13.5px;
}
.search::placeholder{color:var(--muted)}
.search:focus{outline:2px solid var(--accent); outline-offset:-1px; background:var(--surface)}
.navlinks{display:flex; flex-wrap:wrap; gap:6px; padding:2px 14px 10px}
.navlink{
  border:1px solid var(--line); background:var(--surface-2); border-radius:999px;
  padding:5px 11px; font-size:12.5px; cursor:pointer; color:var(--muted);
}
.navlink:hover{border-color:var(--accent); color:var(--accent-ink)}
.navlink.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.filters{display:flex; flex-wrap:wrap; gap:5px; padding:0 14px 10px; border-bottom:1px solid var(--line-soft)}
.chip{
  border:1px solid var(--line); background:transparent; border-radius:999px;
  padding:3px 9px; font-size:11.5px; cursor:pointer; color:var(--muted);
}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .chip.on{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#0e1a16}}
.issuelist{overflow-y:auto; flex:1; padding:6px 8px 24px}
.ilist-head{
  font-size:11px; color:var(--muted); padding:10px 8px 4px; letter-spacing:.04em;
  text-transform:uppercase; font-weight:700; position:sticky; top:0; background:var(--surface);
}
.ilist-month{
  font-size:11.5px; color:var(--muted); font-weight:700; padding:12px 8px 4px;
  border-top:1px solid var(--line-soft); margin-top:6px;
}
.ilist-month:first-child{border-top:0; margin-top:0}
.irow{
  display:block; width:100%; text-align:left; border:0; background:transparent;
  padding:8px 10px; border-radius:9px; cursor:pointer; line-height:1.45;
}
.irow:hover{background:var(--surface-2)}
.irow.on{background:var(--accent-soft)}
.irow .r1{display:flex; align-items:center; gap:6px; margin-bottom:2px}
.irow .num{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.irow .ttl{font-size:13px; font-weight:600; color:var(--text); display:block}
.irow.on .ttl{color:var(--accent-ink)}
.irow .sub{font-size:11.5px; color:var(--muted); display:block; margin-top:2px}
.badge{
  font-size:10px; font-weight:700; padding:1.5px 6px; border-radius:5px; white-space:nowrap;
  letter-spacing:.01em;
}
.b-reads{background:var(--t-reads-bg); color:var(--t-reads)}
.b-policy{background:var(--t-policy-bg); color:var(--t-policy)}
.b-roundup{background:var(--t-roundup-bg); color:var(--t-roundup)}
.b-interview{background:var(--t-interview-bg); color:var(--t-interview)}
.b-event{background:var(--t-event-bg); color:var(--t-event)}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--line); padding:10px 16px;
  display:flex; align-items:center; gap:10px;
}
.menubtn{display:none; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 10px; cursor:pointer}
.crumb{font-size:12.5px; color:var(--muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.iconbtn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:5px 10px; cursor:pointer; font-size:12.5px; color:var(--muted)}
.iconbtn:hover{border-color:var(--accent); color:var(--accent-ink)}

/* ---------- content ---------- */
.wrap{padding:26px 30px 120px; max-width:860px; width:100%; margin:0 auto}
.doc h2{font-size:25px; line-height:1.35; margin:0 0 6px; letter-spacing:-.02em}
.doc h3{font-size:18px; margin:34px 0 10px; letter-spacing:-.01em; scroll-margin-top:70px}
.doc h4{font-size:15px; margin:22px 0 6px}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{margin:0 0 14px; padding-left:20px}
.doc li{margin-bottom:5px}
.meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 16px; font-size:12.5px; color:var(--muted)}
.hook{
  font-size:17px; line-height:1.7; font-weight:600; letter-spacing:-.01em;
  padding:14px 16px; border-left:3px solid var(--accent); background:var(--accent-soft);
  border-radius:0 10px 10px 0; margin:0 0 22px; color:var(--accent-ink);
}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin:0 0 14px}
.tldr{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 18px 6px; margin:0 0 26px}
.tldr .lbl{font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--muted); text-transform:uppercase}
.tldr ol{margin:8px 0 10px; padding-left:20px}
.tldr li{margin-bottom:7px}

.sec{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin:0 0 16px; overflow:hidden}
.sec > h3{margin:0; padding:14px 18px 12px; font-size:17px; border-bottom:1px solid var(--line-soft); background:var(--surface)}
.sec > h3 .en{display:block; font-size:11.5px; font-weight:500; color:var(--muted); margin-top:3px; letter-spacing:0}
.secbody{padding:14px 18px 6px}
.qa{margin:0 0 14px}
.qa .lbl{
  display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.05em;
  padding:2px 7px; border-radius:5px; margin-bottom:6px;
  background:var(--surface-2); color:var(--muted); border:1px solid var(--line-soft);
}
.qa.what .lbl{background:var(--t-reads-bg); color:var(--t-reads); border-color:transparent}
.qa.why .lbl{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent}
.qa.struct .lbl{background:var(--t-roundup-bg); color:var(--t-roundup); border-color:transparent}
.qa.consumer .lbl{background:var(--t-policy-bg); color:var(--t-policy); border-color:transparent}
.qa p{margin:0 0 10px}
.qa p:last-child{margin-bottom:0}
.stats{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px}
.stat{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:9px; padding:8px 11px; min-width:0}
.stat b{display:block; font-size:15px; font-family:var(--mono); letter-spacing:-.02em}
.stat span{display:block; font-size:11.5px; color:var(--muted); line-height:1.45; margin-top:2px}
.players{display:flex; flex-direction:column; gap:6px; margin:0 0 14px}
.player{font-size:13px; line-height:1.6; padding:7px 11px; background:var(--surface-2); border-radius:8px; border:1px solid var(--line-soft)}
.player b{color:var(--text)}
.player span{color:var(--muted)}
.terms{margin:0 0 16px; padding:12px 15px 13px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:10px}
.terms .lbl{font-size:11px; font-weight:800; letter-spacing:.04em; color:var(--accent-ink); display:block; margin-bottom:9px}
.term{font-size:13px; line-height:1.65; margin-bottom:9px}
.term:last-child{margin-bottom:0}
.term.core{
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:8px; padding:11px 13px; margin-bottom:10px; font-size:13.5px; line-height:1.75;
}
.term.core b{font-size:14px}
.term.core .pl{margin-top:4px}
.term b{color:var(--text)}
.term .ko{color:var(--accent-ink); font-weight:600}
.term .pl{color:var(--muted); display:block}
/* ---------- 투자받은 회사 ---------- */
.cbig{border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); padding:16px 18px; margin:0 0 16px}
.cbig-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px}
.cspacer{flex:1}
.cname{border:0; background:transparent; padding:0; font-size:18px; font-weight:700; cursor:pointer; letter-spacing:-.01em}
.cname:hover{color:var(--accent-ink); text-decoration:underline}
.cs{font-size:11px; font-weight:700; padding:2px 8px; border-radius:5px; background:var(--t-reads-bg); color:var(--t-reads)}
.cissue{border:1px solid var(--line); background:var(--surface-2); color:var(--muted); border-radius:5px;
  font-size:11px; padding:1px 7px; cursor:pointer; font-family:var(--mono)}
.cissue:hover{border-color:var(--accent); color:var(--accent-ink)}
.cmore{border:1px solid var(--accent); background:var(--surface); color:var(--accent-ink); border-radius:8px;
  font-size:12.5px; font-weight:600; padding:5px 12px; cursor:pointer}
.cmore:hover{background:var(--accent); color:#fff}
:root[data-theme="dark"] .cmore:hover{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cmore:hover{color:#0e1a16}}
.cone{margin:0 0 9px; font-size:14.5px; line-height:1.7; font-weight:600}
.ctags{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 10px}
.ctags span{font-size:11.5px; padding:2px 9px; border-radius:999px; background:var(--surface-2);
  border:1px solid var(--line-soft); color:var(--muted)}
.csum{margin:0 0 12px; font-size:14px; line-height:1.8; color:var(--muted)}
.ctab{width:100%; border-collapse:collapse; margin:0 0 12px; font-size:13.5px}
.ctab th{
  text-align:left; width:126px; vertical-align:top; padding:7px 10px 7px 0; font-weight:700;
  color:var(--muted); font-size:12px; white-space:nowrap; border-top:1px solid var(--line-soft);
}
.ctab td{padding:7px 0; line-height:1.7; border-top:1px solid var(--line-soft)}
.ctab tr:first-child th, .ctab tr:first-child td{border-top:0}
.ctab tr.w th{color:var(--t-policy)}
.ctab tr.w td{color:var(--t-policy)}
.cthumbs{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.cthumbs figure{margin:0; min-width:0}
.cthumbs a{display:block; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface-2)}
.cthumbs img{width:100%; height:132px; object-fit:cover; object-position:top; display:block}
.cthumbs figcaption{font-size:11px; color:var(--muted); margin-top:4px; line-height:1.5}
@media (max-width:760px){ .cthumbs{grid-template-columns:1fr 1fr} .ctab th{width:92px} }
.backlink{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; margin:0 0 14px;
}
.backlink:hover{border-color:var(--accent); color:var(--accent-ink)}
.cblock{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 18px; margin:0 0 12px}
.cblock .lbl{display:block; font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--muted); margin-bottom:8px}
.cblock p{margin:0 0 10px; font-size:14.5px; line-height:1.8}
.cblock p:last-child{margin-bottom:0}
.cblock.warn{border-color:var(--t-policy); background:var(--t-policy-bg)}
.cblock.warn .lbl{color:var(--t-policy)}
.cblock.forus{border-color:var(--accent); background:var(--accent-soft)}
.cblock.forus .lbl, .cblock.forus p{color:var(--accent-ink)}
.cfeat, .cteam, .ctrac, .csrc{list-style:none; margin:0; padding:0}
.cfeat li{padding:8px 0 8px 12px; border-left:3px solid var(--line); margin-bottom:8px}
.cfeat b{display:block; font-size:14px}
.cfeat span{display:block; font-size:13.5px; color:var(--muted); margin-top:2px; line-height:1.7}
.cteam li{padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:14px}
.cteam li:last-child{border-bottom:0}
.cteam .role{font-size:11.5px; color:var(--muted); background:var(--surface-2); padding:1px 7px; border-radius:5px; margin-left:7px}
.cteam span:not(.role){display:block; font-size:13px; color:var(--muted); margin-top:3px}
.ctrac li{display:flex; gap:9px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
.ctrac li:last-child{border-bottom:0}
.tt2{font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:5px; background:var(--surface-2); color:var(--muted); flex:none}
.tt2.t-funding{background:var(--accent-soft); color:var(--accent-ink)}
.tt2.t-regulatory{background:var(--t-policy-bg); color:var(--t-policy)}
.tt2.t-partnership{background:var(--t-roundup-bg); color:var(--t-roundup)}
.tt2.t-revenue, .tt2.t-customers, .tt2.t-traffic{background:var(--t-reads-bg); color:var(--t-reads)}
.ctrac .d{flex:1; min-width:0; font-size:14px; line-height:1.7}
.ctrac .w{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
/* 세로로 긴 갈무리가 섞여 있어 단 배치로 빈 공간을 줄인다. */
.cshots{columns:2; column-gap:12px}
.cshots figure{margin:0 0 14px; break-inside:avoid}
.cshots a{display:block; position:relative; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--surface-2)}
.cshots img{width:100%; display:block; max-height:520px; object-fit:cover; object-position:top}
.cshots a::after{
  content:'원본 보기'; position:absolute; right:8px; bottom:8px; font-size:10.5px; font-weight:700;
  background:rgba(0,0,0,.62); color:#fff; padding:3px 8px; border-radius:5px; opacity:0; transition:opacity .15s;
}
.cshots a:hover::after{opacity:1}
.cshots figcaption{font-size:12px; color:var(--muted); margin-top:5px; line-height:1.6}
@media (max-width:900px){ .cshots{columns:1} }
.csrc li{padding:6px 0; font-size:13.5px; border-bottom:1px solid var(--line-soft)}
.csrc li:last-child{border-bottom:0}
.csrc span{display:block; font-size:12.5px; color:var(--muted); margin-top:2px}

/* ---------- 회차 머리: 요약 → 건질 것 → 꼭지 고르기 ---------- */
.ihead{margin:0 0 26px}
.tldr{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 20px 8px; margin:0 0 14px}
.tldr .lbl{font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--muted)}
.tldr ol{margin:10px 0 8px; padding-left:20px}
.tldr li{margin-bottom:12px}
.tldr .pt{display:block; font-size:15px; line-height:1.7; font-weight:600}
.tldr .nt{display:block; font-size:13.5px; line-height:1.7; color:var(--muted); margin-top:3px}

.issueins{border-radius:var(--radius); padding:15px 20px; margin:0 0 16px}
.issueins.yes{background:var(--accent-soft); border:1px solid var(--accent); border-left:4px solid var(--accent)}
.issueins.no{background:var(--surface); border:1px dashed var(--line)}
.issueins .lbl{display:block; font-size:11px; font-weight:800; letter-spacing:.05em; margin-bottom:7px}
.issueins.yes .lbl{color:var(--accent-ink)}
.issueins.no .lbl{color:var(--muted)}
.issueins p{margin:0; font-size:14.5px; line-height:1.8}
.issueins.yes p{color:var(--accent-ink)}
.issueins.no p{color:var(--muted)}
.issueins .jump{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px}
.issueins .jump button{
  border:1px solid var(--accent); background:var(--surface); color:var(--accent-ink);
  border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; font-weight:600;
}
.issueins .jump button:hover{background:var(--accent); color:#fff}

.issueins .igrp{margin-top:13px}
.issueins .gl{
  display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.04em;
  padding:2px 9px; border-radius:5px; margin-bottom:8px;
}
.issueins .igrp.b .gl{background:var(--accent); color:#fff}
.issueins .igrp.s .gl{background:var(--t-policy-bg); color:var(--t-policy)}
:root[data-theme="dark"] .issueins .igrp.b .gl{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .issueins .igrp.b .gl{color:#0e1a16}}
.ibul{list-style:none; margin:0; padding:0}
.ibul li{
  padding:9px 0 9px 13px; border-left:3px solid var(--accent); margin-bottom:8px;
  background:var(--surface); border-radius:0 8px 8px 0; padding-right:12px;
}
.ibul.s li{border-left-color:var(--t-policy)}
.ibul li:last-child{margin-bottom:0}
.ibul b{display:block; font-size:14px; line-height:1.6; color:var(--text)}
.ibul span{display:block; font-size:13.5px; line-height:1.7; color:var(--muted); margin-top:3px}
.ibul .src{
  display:inline-block; margin-top:6px; border:1px solid var(--line); background:var(--surface-2);
  color:var(--muted); border-radius:5px; font-size:11px; padding:2px 8px; cursor:pointer;
}

분한지를 먼저 봐야 한다.","section":8}],"signal":[{"title":"예약 전화에 쓰는 시간이 사람에서 AI로 옮겨 가고 있다","detail":"WellSpan은 AI 케어 어시스턴트로 160만 통이 넘는 전화를 걸었고, 지난주 1차 진료 예약의 절반 이상을 그 AI가 잡았다. 반대편에서는 연회비를 내고 담당 의사에게 바로 닿는 상품이 사람에게 연결된다는 점을 앞세워 팔린다.","section":3},{"title":"증상이 없는 사람이 자기 돈으로 검진 상품을 산다","detail":"Prenuvo는 몸 전체를 훑는 영상 검사를 소비자에게 직접 팔아 2025년 초에 1억 2,000만 달러를 유치했다. 소비자가 그 돈으로 사는 것은 치료가 아니라 숨은 병이 없다는 확인이며, 이번 소송은 그 확인이 틀렸을 때 생기는 손해를 보여 준다.","section":7},{"title":"의료비 전용 계좌에 쌓인 돈을 쓰게 해 주는 일이 상품이 된다","detail":"TrueMed는 세금 혜택이 붙은 의료비 전용 계좌의 돈을 쓸 수 있는 상품을 모아 팔아 3,400만 달러를 유치했고, a16z가 라운드를 주도했다. 소비자에게 이미 있는 돈인데도 무엇이 의료비로 인정되는지가 분명하지 않아서 쓰기 어렵다는 사정이 이 시장을 만든다.","section":9}]},"sections":[{"heading_ko":"후원: AscendRural 시니어 케어 액셀러레이터","heading_en":"AscendRural's Senior Care Accelerator","skip":"sponsor","summary":"농촌 고령 인구를 지원하는 초기 단계 스타트업을 모집하는 액셀러레이터 광고다. 지원 마감과 파일럿 계약 규모를 안내한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"인사말","heading_en":"","skip":"admin","summary":"연휴 뒤 첫 회차라는 인사와, 다음 주 JPMorgan 헬스케어 컨퍼런스 관련 별도 소식을 예고하는 짧은 안내다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"필자의 생각: 솜씨와 사업","heading_en":"My Reflection: Arts and crafts and business","skip":null,"summary":"필자가 왜 뉴스레터 제작을 자동화하지 않는지에서 이야기를 시작해, 2025년 헬스케어 AI 투자가 어디로 몰렸는지에 대한 진단으로 넘어간다. 진단의 요지는, 투자가 진료 자체가 아니라 예약 전화와 증상 문진처럼 환자가 병원과 처음 마주치는 접점을 사람 대신 자동화하는 데 집중됐다는 것이다. 필자는 그 방향이 단기적으로는 인건비를 아껴 주지만 장기적으로는 틀렸다고 보고, 반대편 사례로 사람이 직접 응대하는 고급 진료 서비스를 든다.","insight":null,"signal":"WellSpan은 AI 케어 어시스턴트 Anna로 160만 통이 넘는 전화를 걸었고, 지난주 1차 진료 예약의 50% 이상을 Anna가 잡았다. 미국에서는 진료를 받기 전에 전화로 예약을 잡아야 하는데, 소비자가 그 단계에서 쓰는 시간이 사람 응대에서 AI 응대로 옮겨 가고 있다는 뜻이다. 필자가 반대편 사례로 든 Private Medical은 연회비를 내고 담당 의사에게 언제든 직접 연락할 권리를 파는데, 이 상품이 앞세우는 것은 AI의 품질이 아니라 사람에게 바로 닿는다는 점이다. 같은 단계를 두고 한쪽에서는 소비자가 시간을 쓰고, 다른 쪽에서는 돈을 더 내서 그 시간을 건너뛴다.","author":[{"claim":"AI가 만들어 낸 결과물이 넘쳐날수록 사람의 솜씨가 들어간 결과물이 오히려 더 두드러진다.","evidence":"Scott Belsky의 블로그 글이 비슷한 이야기를 했다고 소개했을 뿐이며, 자신이 편향돼 있다고 스스로 인정했다."},{"claim":"환자와의 모든 상호작용을 자동화한다는 비전은 의료 제공 조직이 갈 방향으로 틀렸다.","evidence":"WellSpan의 AI 도입에 대한 페이스북 반응이 이미 나쁜 신호를 보여 줬다는 점과, 고급 컨시어지 서비스 Private Medical의 핵심 가치 제안이 상호작용하는 LLM의 품질이 아니라 담당 의사에게 언제든 직접 연결되는 것이라는 점을 들었다."},{"claim":"사람을 로봇으로 대체해 얻는 차익거래 기회는 빠르게 닫힐 것이다.","evidence":"근거를 대지 않았다."},{"claim":"더 흥미로운 비전은 애초에 환자가 증상 체커나 자동 전화 안내를 거칠 필요가 없는 쪽이며, AI는 그런 사람 중심 경험을 더 싼 값에 가능하게 만드는 배경 역할을 맡아야 한다.","evidence":"Belsky가 말한 환대의 논지를 헬스케어의 현관문에 적용한 것이며, 별도의 데이터는 대지 않았다."}],"experts":[{"who":"Roxanna Gapstur","role":"WellSpan Health CEO다. Hippocratic AI를 도입한 당사자이므로 그 도입을 옹호할 위치에 있다.","claim":"AI 케어 어시스턴트 Anna를 이미 케어 팀의 일원으로 여기고 있으며, 앞으로 WellSpan에 연락하는 모든 사람을 처음에 Anna가 맞이하는 현관문이 될 수 있다. 환자들은 Anna와의 상호작용을 좋아한다.","evidence":"Anna로 160만 통이 넘는 전화를 걸었고 지난주 1차 진료 방문의 50% 이상을 Anna가 예약했다는 수치를 들었다. 환자가 좋아한다는 근거로는 예약을 끝까지 완료했다는 사실 하나를 들었는데, 만족의 증거로 보기에는 약한 해석이다."},{"who":"Scott Belsky","role":"필자가 인용한 블로그 글의 저자다. 원문은 그의 소속을 밝히지 않았고, 2026년 제품에 들어가는 솜씨를 다룬 글이라고만 소개했다.","claim":"2026년에는 제품에 들어가는 솜씨가 중요해지며, 사람이 앞에 나서서 응대하는 쪽으로 흐름이 움직인다.","evidence":"원문에는 해당 대목의 링크만 있고 내용이 본문에 옮겨지지 않아, 그가 어떤 근거를 들었는지는 확인할 수 없다."}],"cases":[{"name":"WellSpan Health","what":"미국의 의료 시스템으로, Hippocratic AI와 손잡고 AI 케어 어시스턴트 Anna에게 환자 전화 응대와 예약을 맡겼다.","scale":"Anna로 160만 통이 넘는 전화, 지난주 1차 진료 방문 예약의 50% 이상","note":"CEO는 예약을 끝까지 마쳤다는 사실만으로 환자가 좋아한다고 해석했으나, 필자는 페이스북 반응을 근거로 반대 신호를 읽었다."},{"name":"Hippocratic AI","what":"의료 시스템을 대신해 환자에게 거는 전화를 처리하는 AI를 파는 회사다.","scale":"","note":""},{"name":"Doctronic","what":"AI 증상 체커를 파는 회사로, 2025년에 성장했다.","scale":"","note":""},{"name":"Assort Health","what":"진료소의 전화 안내를 자동으로 받아 주는 AI를 파는 회사로, 진료소들이 채택했다.","scale":"","note":""},{"name":"Private Medical","what":"돈을 더 내고 담당 의사에게 직접 닿는 고급 컨시어지 진료를 파는 곳이다.","scale":"","note":"필자가 반대 사례로 든 곳이다. 이곳의 홈페이지는 AI 품질이 아니라 사람 의사에게 언제든 연결된다는 점을 앞세운다."}],"notes":[{"term":"front of house","ko":"손님을 맞는 앞쪽","plain":"원래는 식당 용어로, 손님 눈에 보이는 접객 구역을 가리킨다. 주방처럼 보이지 않는 쪽은 back of house라고 부른다. 헬스케어에서는 진료 자체가 아니라 예약 전화, 접수, 안내처럼 환자가 병원과 처음 마주치는 접점을 뜻한다. 필자는 미국의 이 접점이 역사적으로 형편없었다고 평가한다."},{"term":"컨시어지 의료","ko":"연회비를 내고 담당 의사에게 직접 닿는 진료","plain":"미국에는 전 국민 건강보험이 없어서, 어떤 보험을 들었느냐에 따라 의사를 얼마나 빨리 만나는지가 크게 갈린다. 컨시어지 의료는 환자가 보험과 별개로 연회비를 내고 담당 의사에게 언제든 직접 연락할 권리를 사는 방식이다. 한국에서 동네 의원에 그냥 걸어 들어가 진료받는 일을, 미국에서는 돈을 더 내야 얻는 셈이다."}]},{"heading_ko":"커뮤니티 토론 주제: 성과 기반 진료는 성공하고 있는가","heading_en":"Community Discussion Topic: Is VBC Succeeding?","skip":null,"summary":"필자가 지난 11월에 소개했던 논쟁을 다시 꺼내는 대목이다. 성과 기반 진료를 옹호하는 쪽과 이제 그만 넘어가자는 쪽이 정면으로 갈렸고, 필자는 2026년이 그 흐름의 분기점이 될 것으로 본다. 뒷부분은 이번 주에 진행할 커뮤니티 설문과 토론 일정을 알리는 안내다.","insight":null,"signal":null,"author":[{"claim":"2026년은 성과 기반 진료의 모멘텀에 결정적인 해가 될 것이다.","evidence":"근거를 대지 않았다."},{"claim":"성과 기반 진료를 두고 업계 의견이 크게 갈린다.","evidence":"11월에 소개한 두 사람의 대화에서 정반대 입장이 부딪혔다는 점을 들었다."}],"experts":[{"who":"Farzad Mostashari","role":"Aledade 공동창업자다. Aledade는 개원의 그룹이 성과 기반 진료에 참여하도록 돕는 회사이므로, 이 방식이 성공했다고 말할 이해관계가 있다.","claim":"성과 기반 진료의 원칙과 MSSP 프로그램은 성공했다.","evidence":"필자는 그가 탄탄하게 옹호했다고만 적었고, 그가 든 구체적인 근거는 옮기지 않았다."},{"who":"Andrew Ryan","role":"Brown 대학 소속이다. 원문은 그를 대학 쪽 인물로만 소개했고, 그가 어떤 이해관계를 갖는지는 밝히지 않았다.","claim":"미국 헬스케어의 병폐를 고치는 수단으로서 성과 기반 진료에서 이제 넘어갈 때가 됐을 수 있다.","evidence":"필자는 그의 주장이 구체적인 내용은 적었지만 의심의 씨앗을 심는 데는 효과적이었다고 평가했다."}],"cases":[{"name":"Aledade의 크레딧 퍼실리티(대출 약정)","what":"성과 기반 진료 참여를 돕는 Aledade가 최근 발표한 자금 조달 수단으로, 목요일 대화의 주제로 예고됐다.","scale":"","note":"성과 기반 진료는 절감액을 나중에 정산받는 구조라 참여 기관이 자금 압박을 받는데, 그 공백을 메우는 자금 조달이 화두로 올라왔다는 뜻이다."}],"notes":[{"term":"VBC (value-based care)","ko":"성과 기반 진료","plain":"미국은 원래 행위별 수가제여서, 검사와 시술을 많이 할수록 병원이 더 벌었다. 성과 기반 진료는 그 대신 환자 한 명을 맡아 총 진료비를 얼마나 줄이고 건강 결과를 얼마나 좋게 만들었는지로 보상한다. 돈은 메디케어를 운영하는 연방 기관에서 의사 그룹으로 흐르고, 미리 정한 기준선보다 적게 쓴 금액의 일부를 그 그룹이 나눠 갖는다. 한국은 지금도 대부분 행위별 수가제이므로 이 구조가 낯설다."},{"term":"MSSP","ko":"메디케어 절감액 공유 프로그램","plain":"메디케어에서 10년 넘게 돌아간 가장 큰 성과 기반 진료 프로그램이다. 의사 그룹이 맡은 환자들의 총 진료비가 미리 정한 기준선보다 적게 나오면, 그 차액의 일부를 정부와 나눠 갖는다. 이 프로그램이 실제로 나라 전체의 돈을 아꼈는지가 이 꼭지에서 벌어지는 논쟁의 핵심이다."}]},{"heading_ko":"이번 주의 차트: 버몬트 블루크로스의 가격 공개","heading_en":"Chart of the Week: BCBS VT's transparency push","skip":null,"summary":"버몬트의 보험사가 고비용 대학병원에서 환자를 다른 곳으로 돌리려고, 값이 싼 의료기관 네 곳과 함께 가격 비교 웹사이트를 열었다. 보험사가 특정 병원을 실명으로 지목하는 일은 드물다. 필자는 가격을 공개한다고 비용이 내려간다는 데는 회의적이지만, 그럼에도 이번 시도만큼은 응원한다고 밝힌다.","insight":"미국에서는 같은 검사라도 어디서 받느냐에 따라 값이 크게 달라지는데, 소비자가 그 차이를 미리 알기는 어렵다. 이번 꼭지의 보험사도 전체 가격표를 펼치는 대신 값이 싼 네 곳으로 좁혀 보여 주는 방식을 골랐다. 앱에서도 MRI나 혈액검사처럼 값 차이가 큰 흔한 항목을 열 개 안쪽으로 골라, 사용자가 사는 지역의 기준가와 그보다 눈에 띄게 싼 곳을 짚어 주는 화면은 3개월 안에 만들 수 있다. 다만 이 기능의 성패는 화면이 아니라 가격 자료를 구하는 데 달려 있으므로, 메디케어의 지역별 수가표처럼 이미 공개되어 있고 정리된 자료부터 붙여 보고, 값을 보여 주는 것만으로 실제로 가는 곳이 바뀌는지를 먼저 확인해야 한다.","signal":null,"author":[{"claim":"가격 투명성이 실제로 비용을 줄이는 데 도움이 될 것이라는 데 여전히 꽤 회의적이다.","evidence":"비싸게 받는 의료 제공자는 그래도 되니 계속 비싸게 유지하고, 싸게 받던 쪽은 공개된 높은 가격을 근거로 자기 가격을 올린다는 논리를 폈다. 실제 사례로 No Surprises Act의 결과와 노스캐롤라이나 주 공무원 건강보험의 Clear Pricing Project 결과를 들었다."},{"claim":"그럼에도 투명성이 비용을 줄일 수 있다면 이번 BCBS VT 같은 시도를 통해서일 것이다.","evidence":"근거를 대지 않았고, 경계를 밀어붙였다는 점을 높이 산다고만 적었다."},{"claim":"BCBS VT는 서로 어긋나는 두 가지를 동시에 맞춰야 하는 처지에 놓여 있다.","evidence":"지역 뉴스 보도를 근거로, 환자를 UVMMC에서 멀어지게 하면서도 UVMMC가 화가 나 네트워크를 떠나지 않게 해야 한다고 설명했다."}],"experts":[],"cases":[{"name":"Blue Cross Blue Shield of Vermont","what":"버몬트주 민간 보험사로, 값이 더 싼 의료기관 네 곳과 함께 Vermont Affordable Care라는 가격 비교 웹사이트를 열었다.","scale":"협력 의료기관 4곳","note":"보험사가 지역 최대 병원을 실명으로 지목했다는 점이 이례적이다. 가격 협상으로 이기지 못하니 환자의 선택을 움직여 우회하는 방식이다."},{"name":"University of Vermont Medical Center (UVMMC)","what":"버몬트에서 시장을 지배하는 대학병원으로, 비싼 곳으로 지목당한 쪽이다.","scale":"","note":"이 병원이 네트워크에서 빠지면 보험 상품 자체가 팔리지 않으므로, 지목당한 쪽이 오히려 협상에서 우위에 있다."},{"name":"BCBSM, BCBSNC","what":"미시간과 노스캐롤라이나의 블루크로스 계열 보험사로, 최근 의료비가 비싸다는 기고문을 실었다.","scale":"","note":"보험사들이 잇따라 공론장에 나서는 흐름이 있다는 것을 보여 주는 사례다."}],"notes":[{"term":"네트워크","ko":"보험사가 값을 미리 협상해 둔 병원 목록","plain":"미국 민간 보험사는 병원마다 따로 가격을 협상해 계약을 맺고, 그렇게 계약된 병원과 의사의 묶음을 네트워크라고 부른다. 가입자는 네트워크 안에서 진료받아야 제대로 보장을 받고, 밖으로 나가면 훨씬 많이 낸다. 그래서 지역에 대체할 곳이 없는 대형 병원은 네트워크 이탈을 무기로 삼아 협상에서 절대적으로 유리하다. 한국에는 이런 구분이 없어서 어느 병원에 가든 건강보험이 적용된다."},{"term":"Blues 플랜","ko":"블루크로스 블루실드 계열 보험사들","plain":"블루크로스 블루실드는 하나의 회사가 아니라 주 단위로 나뉜 여러 회사가 같은 상표를 함께 쓰는 형태다. 버몬트, 미시간, 노스캐롤라이나 조직이 각각 별개 회사이며 그래서 하는 말도 서로 다르다. 한국에서 건강보험공단 하나가 전국을 맡는 것과 대비된다."},{"term":"학술 의료 센터","ko":"의대에 딸린 대형 병원","plain":"연구와 교육을 함께 하는 대학병원을 말한다. 미국에서는 대개 이런 곳의 가격이 가장 비싸고, 지역에 하나뿐인 경우가 많아 사실상 대체지가 없다."},{"term":"No Surprises Act","ko":"예상 밖 청구서 금지법","plain":"환자가 네트워크 안의 병원에서 진료를 받았는데 그 안에 있던 일부 의사가 계약 밖이어서 나중에 큰 청구서를 따로 받는 일이 흔했고, 그것을 막으려고 만든 법이다. 필자는 이 법의 결과를 두고, 가격 정보가 드러났다고 해서 값이 내려가지는 않았다는 사례로 인용한다."}]},{"heading_ko":"다른 주요 소식: CMS 농촌 의료 전환 자금 배분","heading_en":"Other Top Headlines","skip":null,"summary":"CMS가 500억 달러 규모 농촌 의료 전환 프로그램의 2026년 몫을 주별로 배분했다. 필자가 짚는 대목은 절대 금액 순위와 농촌 인구 1인당 금액 순위가 완전히 뒤집힌다는 점이다.","insight":null,"signal":null,"author":[{"claim":"각 주의 농촌 인구를 기준으로 1인당으로 계산하면 로드아일랜드가 압도적 1위이고 텍사스는 오히려 맨 아래다.","evidence":"'계산해 보면'이라고만 적었고, 계산 과정이나 농촌 인구 자료의 출처는 밝히지 않았다."}],"experts":[],"cases":[{"name":"Rural Health Transformation Program","what":"CMS가 운영하는 농촌 의료 전환 지원 프로그램으로, 2026년 배분액을 발표했다.","scale":"총 500억 달러 규모, 2026년 100억 달러를 50개 주 전체에 배분. 텍사스 2억 8,100만 달러, 알래스카 2억 7,200만 달러, 뉴저지 1억 4,700만 달러","note":"금액이 가장 큰 주가 1인당으로는 가장 적을 수 있다는 점을 필자가 지적한다."}],"notes":[{"term":"CMS","ko":"메디케어·메디케이드 서비스 센터","plain":"미국 연방 정부 기관으로, 노인 대상 공보험인 메디케어와 저소득층 대상 공보험인 메디케이드를 운영한다. 전 국민을 맡는 것이 아니라 이 두 집단만 맡는다는 점이 한국 건강보험공단과 결정적으로 다르다. 미국에서 나머지 사람들은 대부분 직장에서 받는 민간 보험을 쓴다. 가격과 지불 방식을 바꾸는 실험도 이 기관이 주도한다."}]},{"heading_ko":"다른 주요 소식: Prenuvo 의료과실 소송","heading_en":"Other Top Headlines","skip":null,"summary":"스캔 검사를 파는 Prenuvo가, 스캔을 받은 뒤 뇌졸중을 겪은 환자에게 소송을 당했다. 필자는 이 사건과 담당 영상의학과 의사의 별건 유죄 인정을 묶어, 이 회사가 내세워 온 첨단 기술 서사와 어긋나는 신호로 읽는다.","insight":null,"signal":"Prenuvo는 증상이 없는 사람이 직접 돈을 내고 받는 몸 전체 영상 검사를 파는 회사이며, 2025년 초에 1억 2,000만 달러를 유치했다. 이번 소송을 낸 사람은 2023년에 이 검사를 받고 결과가 정상이라는 통보를 받은 뒤 뇌졸중을 겪은 환자다. 미국에는 국가 건강검진 제도가 없어서 검진을 받으려면 소비자가 상품을 직접 사야 하고, 그 돈은 치료가 아니라 숨은 병이 없다는 확인을 사는 데 쓰인다. 그 확인이 틀렸을 때 소비자가 무엇을 잃는지를 이번 사건이 함께 보여 준다.","author":[{"claim":"이 사건은 Prenuvo가 투자 유치 때 내세운 첨단 기술 서사와 모순되는, 꽤 우려스러운 대목으로 보인다.","evidence":"소송 내용과 함께, 이 사건에 연루된 영상의학과 의사가 별건으로 2024년 1월 뉴욕에서 7,000만 달러가 넘는 보험 사기 계획에 가담한 혐의를 인정한 것으로 보인다는 점을 들었다. 필자 스스로 '저만 그런지 모르겠지만'이라고 단서를 달았다."}],"experts":[],"cases":[{"name":"Prenuvo","what":"몸을 훑는 영상 스캔 검사를 파는 회사로, 2023년 스캔을 받은 뒤 뇌졸중을 겪은 환자에게 담당 영상의학과 의사와 함께 의료과실 소송을 당했다. 소송은 뇌졸중을 막을 수 있었던 주요 경고 신호를 놓치고 결과가 정상이라고 알렸다고 주장한다.","scale":"2025년 초 1억 2,000만 달러 투자 유치, 담당 의사의 별건 보험 사기 규모 7,000만 달러 이상","note":"판사가 캘리포니아 법에 따라 배상액에 상한을 두려는 회사 측 시도를 기각했다. 사건은 아직 진행 중이다."}],"notes":[{"term":"전신 스캔 검진","ko":"증상이 없는 사람이 돈을 내고 받는 몸 전체 영상 검사","plain":"미국에는 한국 같은 국가 건강검진 제도가 없어서, 검진을 받으려면 개인이 직접 돈을 내고 상품을 사야 한다. Prenuvo가 파는 것은 증상이 없는 사람이 몇 천 달러를 내고 몸 전체를 영상으로 훑어 숨은 병을 찾는 검사다. 보험이 아니라 소비자가 직접 결제하기 때문에 광고와 기술 서사가 판매의 중심이 된다. 그래서 '정상'이라는 결과를 받은 사람이 곧바로 뇌졸중을 겪었다는 사실이 이 사업 모델 자체에 대한 문제 제기가 된다."},{"term":"의료과실 배상 상한","ko":"캘리포니아 법상 배상액 한도","plain":"캘리포니아에는 의료과실 소송에서 정신적 피해에 대한 배상액을 법으로 제한하는 규정이 있다. 병원과 의사가 소송 위험 때문에 진료를 꺼리는 일을 막으려고 만든 장치인데, 피고 입장에서는 물어 줄 금액의 상한이 미리 정해지므로 유리하게 작용한다. 이번 사건에서 판사가 그 상한을 적용하지 않았다는 것은, 회사 쪽이 지게 될 금전적 위험이 그만큼 커졌다는 뜻이다."}]},{"heading_ko":"다른 주요 소식: 먹는 Wegovy 승인","heading_en":"Other Top Headlines","skip":null,"summary":"FDA가 노보 노디스크의 먹는 Wegovy를 승인했다는 한 줄 소식이다. 필자는 별도의 의견을 붙이지 않았다.","insight":"먹는 형태가 나오면 주삿바늘 때문에 시작하지 못하던 사람에게도 문이 열리므로, 이 약을 쓰는 사람은 더 늘어날 여지가 있다. 약을 쓰기 시작한 사람에게는 메스꺼움 같은 부작용을 견디는 문제, 근육량이 함께 빠지지 않도록 단백질을 챙기는 문제, 약을 끊은 뒤 체중이 되돌아오는 문제가 곧바로 따라온다. 이런 일은 기록 화면과 알림만으로 다룰 수 있고 처방권이나 규제 허가가 필요하지 않으므로, 약을 파는 자리가 아니라 이미 약을 쓰는 사람의 하루를 돕는 자리를 3개월 안에 시험해 볼 수 있다.","signal":null,"author":[],"experts":[],"cases":[{"name":"Novo Nordisk","what":"비만 치료제 Wegovy를 만드는 제약사로, 주사가 아니라 먹는 알약 형태의 Wegovy를 FDA에서 승인받았다.","scale":"","note":""}],"notes":[{"term":"Wegovy","ko":"GLP-1 계열 비만 치료제","plain":"식욕을 억제하는 호르몬과 비슷하게 작용해 체중을 줄이는 약이며, 지금까지는 주 1회 스스로 놓는 주사 형태였다. 미국에서는 이 계열 약이 몇 년 사이 크게 퍼지면서 체중 관리 시장 전체를 바꿔 놓았다."}]},{"heading_ko":"투자 소식: TrueMed","heading_en":"Funding Announcements","skip":null,"summary":"미국 근로자가 세금 혜택이 붙은 의료비 계좌에 쌓아 둔 돈을 쓸 수 있게 해 주는 마켓플레이스 TrueMed가 투자를 받았다. 필자는 노화 관리 상품에 대한 관심과 이 계좌에 대한 정치적 지지가 겹치는 국면이라 이 회사가 유리한 자리에 있다고 본다.","insight":null,"signal":"TrueMed는 세금 혜택이 붙은 의료비 전용 계좌에 쌓인 돈을 쓸 수 있는 상품을 모아 파는 마켓플레이스이며, a16z가 주도한 라운드에서 3,400만 달러를 유치했다. 필자는 노화를 늦추고 오래 살기 위한 상품에 관심이 커지는 상황과 이 계좌에 정치적 지지가 붙은 상황이 겹친다는 점을 들어, 이 회사가 유리한 자리에 있다고 봤다. 미국 소비자에게는 의료비로만 쓸 수 있게 떼어 둔 자기 돈이 있는데, 무엇이 의료비로 인정되는지가 분명하지 않아서 쓰기가 어렵다. 이미 자기 손에 있는 돈을 쓰게 해 주는 일 자체가 상품이 된다는 것을 이 꼭지가 보여 준다.","author":[{"claim":"TrueMed는 이 시장이 커지는 국면에서 유리한 위치에 있어 보인다.","evidence":"노화를 늦추고 오래 살기 위한 상품(롱제비티)에 대한 관심이 커지고 있다는 점과 HSA 계좌에 정치적 지지가 있다는 점을 들었을 뿐, 구체적인 수치는 대지 않았다."}],"experts":[],"cases":[{"name":"TrueMed","what":"HSA와 FSA에 쌓인 혜택 자금을 쓸 수 있는 상품을 모아 파는 마켓플레이스다.","scale":"3,400만 달러 유치, a16z 주도","note":"쓰기 어려운 돈을 쓰게 만들어 주는 것 자체가 상품이 된다는 점을 보여 주는 사례다."}],"notes":[{"term":"HSA / FSA","ko":"세금 혜택이 붙은 의료비 전용 계좌","plain":"미국 근로자가 세금을 떼기 전 급여의 일부를 따로 떼어 두었다가 의료비에만 쓰는 계좌다. HSA는 본인이 먼저 부담하는 금액이 큰 보험에 든 사람만 열 수 있고 남은 돈을 다음 해로 넘길 수 있는 반면, FSA는 고용주가 제공하며 연말에 남은 돈은 대개 사라진다. 문제는 무엇이 의료비로 인정되는지가 분명하지 않다는 점이며, 인정받으려면 의사가 써 준 의학적 필요 소견서가 있어야 하는 품목도 있다. 한국의 연말정산 의료비 공제와 목적은 비슷하지만, 돈을 따로 쌓아 두는 별도 계좌라는 점이 다르다."}]},{"heading_ko":"읽고 있는 글: Town Hall Ventures의 2026년 예측","heading_en":"What I'm Reading: Town Hall Ventures' 2026 Predictions","skip":null,"summary":"필자가 2026년 예측 글은 대부분 피했지만 이 글만은 정책 지형에 관해 볼 만하다고 소개하는 짧은 대목이다. 짚은 지점은 CMS 산하 혁신센터가 새로 내놓는 지불 모델의 한 요소이며, 그것이 진료비를 미리 정액으로 넘기는 방식을 늘릴 수 있다는 관측이다.","insight":null,"signal":null,"author":[{"claim":"이 글은 특히 정책 지형에 관해 흥미로운 관점이 몇 가지 있다.","evidence":"CMMI의 새 LEAD 모델에서 CARA를 다룬 대목을 구체적인 이유로 들었다."}],"experts":[{"who":"Andy Slavitt, Josh Loria, Andie Steinberg","role":"헬스케어에 투자하는 벤처 회사 Town Hall Ventures에서 2026년 예측 글을 쓴 사람들이다. 자신들이 투자한 분야가 커진다고 말할 이해관계가 있다.","claim":"CARA가 CMMI의 새 LEAD 모델에서 핵심 요소이며, 이것이 서브 캐피테이션 모델의 의미 있는 증가로 이어질 수 있다.","evidence":"뉴스레터는 이 관측만 옮겼을 뿐, 그들이 든 근거는 옮기지 않았다. 다만 원문 문장 구조상 서브 캐피테이션이 늘어날 수 있다는 관측을 글쓴이들이 한 것인지 필자가 덧붙인 것인지는 분명하지 않다."}],"cases":[],"notes":[{"term":"CARA, LEAD 모델","ko":"원문이 풀어 쓰지 않은 약어","plain":"LEAD는 CMS 산하 혁신센터가 새로 내놓는 지불 모델의 이름이고, CARA는 필자가 그 모델의 핵심 요소라고 소개한 구성 부분이다. 원문은 두 약어를 풀어 쓰지도, 내용을 설명하지도 않았으므로 이 뉴스레터만 읽어서는 무엇인지 알 수 없다. 여기서 읽어 낼 수 있는 것은 지불 방식이 정액제 쪽으로 더 옮겨 갈 수 있다는 방향뿐이다."},{"term":"CMMI","ko":"CMS 산하 혁신센터","plain":"메디케어와 메디케이드를 운영하는 연방 기관 안에 있는 조직으로, 새로운 진료비 지불 방식을 시범 사업으로 돌려 보고 효과가 있으면 넓히는 일을 한다. 미국에서 지불 방식이 바뀔 때 그 실험은 대개 여기서 시작된다. 한국에는 이렇게 지불 방식을 바꿔 보는 상설 조직이 사실상 없다."},{"term":"캐피테이션 / 서브 캐피테이션","ko":"환자 1인당 월정액 방식 / 그 정액을 다시 나눠 넘기는 방식","plain":"행위별 수가제에서는 진료를 한 건 할 때마다 돈을 받지만, 캐피테이션에서는 환자 한 명당 한 달에 얼마씩 미리 받고 그 안에서 진료를 책임진다. 많이 진료할수록 자기 손해가 되므로 불필요한 진료를 줄일 동기가 생기지만, 반대로 필요한 진료까지 미룰 위험이 함께 생긴다. 서브 캐피테이션은 그렇게 받은 정액의 일부를 다시 하위 진료 그룹에 넘겨 위험까지 함께 떠넘기는 방식이다."}]},{"heading_ko":"읽고 있는 글: 마크 큐번의 헬스케어 처방","heading_en":"What I'm Reading: Mark Cuban Tells Us How He Can Fix America's Sh!tty Health Care","skip":null,"summary":"마크 큐번이 미국 헬스케어를 어떻게 고칠지 이야기한 인터뷰를 소개하는 대목이다. 필자는 이 서사가 작년과 똑같이 반복된다고 느끼며, 큐번의 과도한 단순화와 손가락질을 비판한다. 다만 저가 약 판매 사업이 만든 성과는 인정한다.","insight":null,"signal":null,"author":[{"claim":"큐번이 하는 말 중 어떤 것은 말이 되고 어떤 것은 그렇지 않다는 Cohn의 평가에 동의한다.","evidence":"이 평가는 필자가 따로 검증한 것이 아니라 인터뷰를 진행한 Cohn의 평가에 동의한다고 밝힌 것이며, 어떤 대목이 왜 말이 되지 않는지는 짚지 않았다."},{"claim":"큐번의 전반적인 과도한 단순화와 손가락질은 대화를 생산적으로 진전시키는 데 전혀 도움이 되지 않는다.","evidence":"근거를 대지 않았다."},{"claim":"큐번은 자신이 대화에서 드러내는 것보다 이 문제의 복잡성을 훨씬 잘 알고 있음이 분명하다.","evidence":"10Plan과 Cost Plus Wellness가 확산에 실패했다는 점, 그리고 Cost Plus Drugs에서 Humana와 파트너십을 맺고 싶어 했다는 점을 들었다."},{"claim":"Cost Plus Drugs가 만들어 낸 임팩트에 대해서는 큐번이 인정받을 자격이 있다.","evidence":"근거를 대지 않았다."}],"experts":[{"who":"Jonathan Cohn","role":"The Bulwark에서 큐번을 인터뷰한 기자다. 원문은 그의 이력을 따로 소개하지 않았다.","claim":"큐번이 하는 말 중 일부는 말이 되고 일부는 그렇지 않다.","evidence":"필자가 그 글의 정서를 요약했을 뿐, Cohn이 든 근거는 옮기지 않았다."},{"who":"Mark Cuban","role":"억만장자 사업가이자 저가 약 판매 사업 Cost Plus Drugs의 창업자다. 자기 사업 방식이 해법이라고 말할 이해관계가 있다.","claim":"미국 헬스케어는 망가져 있고 자신은 그것을 고칠 방법을 알고 있다는 입장이다.","evidence":"뉴스레터는 그 방법의 구체적인 내용을 옮기지 않았다. 필자는 그가 이 대화에서 다른 거의 모든 사람을 바보이거나 악한 사람으로 취급하는 것처럼 보인다고 평가했는데, 이 평가는 필자의 것이지 큐번이 한 말이 아니다."}],"cases":[{"name":"Cost Plus Drugs","what":"큐번이 만든 회사로, 약의 원가에 정해진 마진만 붙여 값을 공개하고 파는 방식을 내세운다.","scale":"","note":"필자가 유일하게 성과를 인정하는 대목이다. 다만 Humana와 손잡고 싶어 했다는 사실은, 기존 유통 구조를 우회하기가 그만큼 어렵다는 뜻으로 읽힌다."},{"name":"10Plan","what":"큐번이 몇 년 전에 내놓은 미국 헬스케어 재원 조달 계획이다.","scale":"","note":"필자가 연휴 동안 새로 알게 됐다고 밝힌 사실이며, 확산에는 실패했다."},{"name":"Cost Plus Wellness","what":"큐번이 벌인 또 다른 시도로, 확산에 실패한 사례로 언급된다.","scale":"","note":""}],"notes":[{"term":"원가 공개 방식의 약 판매","ko":"Cost Plus Drugs가 내세우는 판매 방식","plain":"미국에서는 같은 복제약이라도 약국과 보험에 따라 값이 몇 배씩 달라진다. 보험사와 약국 사이에 약값 협상과 정산을 대신 맡는 중간 사업자가 끼어 있고, 그 단계에서 붙는 금액이 밖에서 보이지 않기 때문이다. Cost Plus Drugs는 그 중간 단계를 건너뛰고 매입 원가에 정해진 마진과 배송비만 붙여 값을 공개해서 판다. 필자가 이 회사의 성과만은 인정한다고 적은 이유가 여기에 있다."}]}],"themes":["ai-admin","value-based-care","price-transparency","consumer-dtc","rural-access","pharma-glp1"],"for_later":[]},{"index":"04","date":"2026-01-11","type":"reads","title_en":"Weekly Health Tech Reads 1/11/26","title_ko":"OpenAI 총공세와 AI 약 재처방","hook":"OpenAI가 이틀 사이에 소비자용과 병원용 AI를 함께 내놓고, 유타주는 AI 약 재처방을 시험한다.","tldr":[{"point":"OpenAI가 한 주 사이에 소비자용 개인건강기록 도구 ChatGPT Health와 헬스시스템용 기업 상품 OpenAI for Healthcare를 잇따라 내놓았고, 그 배경에는 전 세계에서 매일 4천만 명이 넘는 사람이 ChatGPT로 건강 정보를 찾고 건강보험을 이해하려는 질문만 주당 거의 200만 건에 이른다는 자사 리포트가 있다. 필자는 두 전략을 동시에 실행하는 난이도가 거의 불가능해 보인다면서도, 이용량과 이미 이름을 올린 헬스시스템을 함께 놓고 보면 해낼 추진력이 있을지도 모른다고 적는다.","note":"개인건강기록은 여러 병원에 흩어진 자기 진료 기록을 한곳에 모아 두는 도구인데, 미국은 병원마다 기록이 따로 놀기 때문에 여러 회사가 오래 시도해 온 영역이고 필자도 그동안 너무 많은 발표를 겪었다고 말한다."},{"point":"Doctronic과 유타주가 AI로 환자의 약 재처방을 돕는 파일럿을 지난달 시작했고 지금까지 수백 명이 등록했다. Doctronic은 이 활동을 의료행위로 보고 의료과실 보험까지 들었으며, 환자를 자사 재처방 웹사이트로 데려오는 방법으로 동네 약국을 직접 찾아다니고 있다.","note":"미국에서는 이미 먹던 약이라도 처방 기간이 끝나면 의사의 재승인을 다시 받아야 해서, 약을 계속 먹으려면 진료 절차를 또 거치는 마찰이 반복된다."},{"point":"지난주 성과 기반 진료 설문에 답한 379명 가운데 41%는 아직 거기까지 가지는 못했지만 방향은 옳다는 쪽이었고, 12%인 47명은 이제 넘어갈 때가 됐다고 답했다. 명백한 성공으로 보는 사람은 소수였다.","note":"성과 기반 진료는 검사와 시술을 많이 할수록 더 버는 방식 대신 환자의 총 진료비를 줄이고 건강 결과를 좋게 만든 만큼 보상하는 방식이며, 미국에서 십수 년째 시도되고 있다."},{"point":"CMS가 소비자가전전시회에서 1970년대 COBOL로 돌아가는 메디케어 청구 처리 시스템을 교체하겠다며 제안요청서를 냈다.","note":"낡은 시스템 때문에 실제로 손해가 난 적이 있는데, Next Generation ACO 모델은 시스템이 수천 건의 청구에 시범사업 코드를 잘못 붙이는 바람에 5,000만 달러 손실을 봤다."},{"point":"FDA도 같은 전시회에서 일부 AI 및 웰니스 제품에 대한 감독을 완화하겠다고 밝혔고, 2025년 7월 혈압 인사이트 기능으로 FDA 경고 서한을 받았던 Whoop 같은 곳이 이를 반겼다.","note":"미국에서는 같은 기능이라도 병을 진단하거나 치료한다고 내세우면 의료기기 허가 대상이 되고 일반 웰니스라고 두면 대상이 아닌데, 그 경계에 걸리면 경고 서한이 날아온다."},{"point":"Novo의 먹는 Wegovy가 CVS와 Costco 약국뿐 아니라 Ro, LifeMD, Weight Watchers, NovoCare Pharmacy, GoodRx 같은 채널을 통해 미국 소비자에게 풀렸고, 필자는 GLP-1 시장이 소비자를 자기 사이트로 데려오는 브랜딩 경쟁의 실습장이 되고 있다고 본다.","note":"GLP-1은 원래 당뇨약으로 나왔다가 체중감량 효과로 널리 퍼진 약이고, 이번 소식의 핵심은 주사가 아닌 알약 형태가 약국과 온라인 채널에 한꺼번에 열렸다는 점이다."}],"issue_insight":{"verdict":"yes","summary":"이 회차는 미국 소비자가 이미 어디에 시간과 돈을 쓰고 있는지를 숫자로 보여 준다. 3개월 안에 만들 것은 보험을 쉬운 말로 풀어 주는 자리와 약을 계속 먹게 돕는 자리에서 나온다.","build":[{"title":"보험 서류를 쉬운 말로 풀어 주는 화면","detail":"건강보험을 이해하려고 ChatGPT에 보내는 메시지가 주당 거의 200만 건이라는 것은 미국 사용자가 자기 보험을 스스로 읽어 내지 못한다는 뜻이다. 보험 안내문이나 청구 명세를 찍어 올리면 무엇이 얼마나 커버되는지와 다음에 할 일을 짚어 주는 화면은 소프트웨어만으로 만들 수 있다.","section":2},{"title":"복약과 재처방 시점을 챙겨 주는 화면","detail":"처방 자체는 의료행위여서 우리가 맡을 수 없지만, 남은 약의 일수를 받아 재처방 시점을 미리 알려 주고 받을 수 있는 경로로 넘겨 주는 데까지는 규제 밖이다. 미국 사용자가 반복해서 겪는 마찰이라 앱을 여는 이유가 된다.","section":3},{"title":"체중감량 약을 막 시작한 사람을 위한 트랙","detail":"먹는 Wegovy가 여러 소비자 채널로 동시에 풀린 만큼 약을 이제 막 시작한 사용자가 늘어난다. 복용 기록과 체중 추이, 걷기 목표를 기존 리워드와 묶는 화면은 3개월 안에 만들 수 있다.","section":7},{"title":"비대면 진료와 약 배송 선택지 정리대","detail":"월마트가 고객에게 비대면 진료 상품을 골라 주는 웹사이트를 낸 것처럼, 사용자가 자기 돈으로 살 수 있는 선택지를 증상과 상황별로 정리해 주는 자리는 진료를 하지 않고도 만들 수 있다.","section":12}],"signal":[{"title":"채팅창이 미국의 첫 번째 건강 상담 창구가 됐다","detail":"전 세계에서 매일 4천만 명이 넘는 사람이 ChatGPT로 건강 정보를 찾고, 그 가운데 건강보험을 이해하려는 질문만 주당 거의 200만 건이다.","section":2},{"title":"체중감량 약은 소비자가 직접 사는 상품이 됐다","detail":"먹는 Wegovy가 대형 약국과 함께 Ro, LifeMD, Weight Watchers, GoodRx 같은 소비자 채널로 한꺼번에 열렸고, 각 채널이 소비자를 자기 사이트로 데려오는 경쟁을 벌이고 있다.","section":7},{"title":"약을 계속 받는 일 자체가 팔 수 있는 서비스가 된다","detail":"아직 수백 명 규모의 파일럿이지만 재처방을 받으려고 별도 웹사이트를 찾아가는 행동이 확인됐고, Doctronic은 2026년에 몇 개 주가 비슷한 조치를 할 것으로 본다.","section":3}]},"sections":[{"heading_ko":"JPM 팝업 뉴스레터 신청 안내","heading_en":"Last day to sign up for our pop-up coverage of JPM this week!","skip":"promo","summary":"필자가 JP Morgan 헬스케어 컨퍼런스 현장을 매일 정리해 보내는 유료 팝업 뉴스레터를 349달러에 파는 안내다. 눈여겨볼 주제로 AI, 성과 기반 진료, 정부 프로그램을 꼽는다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"OpenAI의 헬스케어 홍보 총공세","heading_en":"OpenAI's healthcare PR efforts go warp speed this week","skip":null,"summary":"OpenAI가 한 주 동안 낸 세 가지 소식을 필자가 순서대로 정리한 꼭지다. 사람들이 AI를 건강에 어떻게 쓰는지 담은 자체 리포트, 소비자용 개인건강기록 도구, 헬스시스템용 기업 상품이 차례로 나왔다. 필자는 소비자와 병원 양쪽을 동시에 공략하는 것이 가능한 일인지 의문을 던지면서도, 이용량 숫자와 초기 고객 명단을 보면 밀어붙일 힘이 있을지 모른다고 본다.","insight":"건강보험을 이해하려는 질문이 주당 거의 200만 건이라는 숫자는, 미국 사용자가 진료보다 먼저 막히는 곳이 자기 보험 서류라는 뜻이다. 보험 안내문이나 청구 명세를 찍어 올리면 무엇이 얼마나 커버되는지와 다음에 할 일을 쉬운 말로 알려 주는 화면은 3개월 안에 소프트웨어만으로 만들 수 있고, 지금 우리 앱에 없는 가치다. 답을 다 주지 못하더라도 무엇을 누구에게 물어야 하는지 정리해 주는 것만으로 쓸모가 생긴다.","signal":"매일 4천만 명이 넘는 사람이 ChatGPT로 건강 정보를 찾고 있다. 미국 소비자가 건강 질문을 들고 가는 첫 창구가 병원 예약 전화가 아니라 채팅창이 됐고, 그 질문의 큰 덩어리가 증상이 아니라 보험 해석이다.","author":[{"claim":"이번 주 가장 흥미로운 전개는 기업용 ChatGPT for Healthcare다. OpenAI가 OpenEvidence나 UpToDate, Doximity 같은 곳들과 의료진의 관심을 놓고 더 직접 경쟁하는 자리로 옮겨 갔기 때문이다.","evidence":"함께 출발한 헬스시스템 이름들이 묵직해 보인다는 점을 든다."},{"claim":"다른 회사가 이틀 사이에 소비자용 개인건강기록과 병원용 기업 AI 플랫폼을 동시에 발표했다면 조직 내부의 혼란을 의심받았을 것이고, 이 전부를 실행하는 난이도는 거의 불가능해 보인다.","evidence":"근거를 대지 않았다. 필자 자신의 판단으로 적는다."},{"claim":"그럼에도 OpenAI에는 이걸 해낼 추진력이 있을지도 모른다.","evidence":"주 초 리포트의 이용량 수치와 기업 상품에 이미 이름을 올린 헬스시스템들을 함께 놓고 본다."},{"claim":"이 환경에서는 더 사람다운 응대 전략을 갖추는 것이 이기는 수다.","evidence":"근거를 대지 않았다. 최근 여러 자리에서 해 온 이야기라고만 밝힌다."}],"experts":[],"cases":[{"name":"OpenAI \"AI as a Healthcare Ally\" 리포트","what":"사람들이 AI를 건강에 어떻게 쓰는지 파고든 자체 리포트를 냈고, Axios가 5일에 이를 다뤘다.","scale":"전 세계 4천만 명 이상이 매일 ChatGPT를 건강 정보에 사용, 건강보험 이해 관련 메시지 주당 거의 200만 건","note":"필자가 가장 흥미롭게 본 수치는 진료 관련이 아니라 보험을 이해하려는 질문 쪽이었다.","sells_to":"consumer"},{"name":"ChatGPT Health","what":"수요일에 발표된 소비자용 개인건강기록 성격의 도구다.","scale":"","note":"필자는 그동안 개인건강기록 발표를 너무 많이 겪어 들뜨지 않는다면서도, 이용량을 보면 이번은 다를지 모른다고 적는다.","sells_to":"consumer"},{"name":"OpenAI for Healthcare (ChatGPT for Healthcare, OpenAI API)","what":"목요일에 발표된 기업용 상품으로, 임상 검색과 케어 패스웨이 관리, 의뢰서 생성 등을 묶었다.","scale":"AdventHealth, Baylor Scott & White Health, HCA, Memorial Sloan Kettering 등에서 이미 사용","note":"소비자용과 병원용을 이틀 간격으로 함께 내놓은 점이 이 꼭지의 논점이다.","sells_to":"provider"},{"name":"b.well","what":"OpenAI가 기반이 되는 상호운용성 인프라를 위해 파트너십을 맺은 헬스케어 스타트업이다.","scale":"","note":"필자는 이번 발표의 잠재적 큰 수혜자로 지목한다.","sells_to":"other"}],"notes":[{"term":"PHR (개인건강기록)","ko":"개인건강기록","plain":"여러 병원에 흩어진 자기 진료 기록과 검사 결과를 한곳에 모아 본인이 들고 다니는 도구다. 한국은 건강보험공단과 심사평가원에 기록이 모여 있어 앱 하나로 상당 부분 확인되지만, 미국은 병원마다 전자의무기록이 따로 놀아 환자가 옮겨 다니면 기록이 끊긴다. 그래서 이 문제를 풀겠다는 발표가 20년 넘게 반복됐고, 필자가 시큰둥한 이유도 그것이다."},{"term":"front-door / front of house 전략","ko":"환자가 처음 닿는 창구 전략","plain":"보험사나 병원이 고객과 처음 만나는 접점을 어디에 둘지 정하는 전략이다. 미국에서는 아파도 바로 병원에 가는 것이 아니라 전화나 앱으로 예약을 잡고 자기 보험이 그 병원을 받아 주는지부터 확인해야 해서, 이 첫 창구를 누가 쥐느냐가 곧 환자를 누가 데려가느냐가 된다. 사람들이 그 창구를 병원 대신 ChatGPT로 삼기 시작했다는 것이 이 꼭지의 위기감이다."},{"term":"OpenEvidence / UpToDate / Doximity","ko":"의사가 진료 중에 찾아보는 정보 서비스들","plain":"의사가 환자를 보면서 근거 자료나 최신 진료 지침을 확인하는 데 쓰는 도구들이며, Doximity는 의사들의 직업 네트워크에 가깝다. 미국 의사는 이런 서비스에 매일 접속하기 때문에 광고와 구독으로 큰 사업이 된다. OpenAI가 기업 상품으로 병원에 들어가면 이 자리를 놓고 겨루게 된다는 것이 필자의 관점이다."}]},{"heading_ko":"Doctronic과 유타주의 AI 약 재처방 파일럿","heading_en":"Doctronic & Utah launch pilot testing AI for medication refills","skip":null,"summary":"AI가 환자의 약 재처방을 돕는 시범 프로그램이 유타주에서 지난달 시작됐다는 소식이다. 범위가 제한적이고 안전장치가 여럿 걸려 있지만, 회사가 의료과실 보험까지 들었다는 점을 필자는 눈여겨본다. 뒷부분은 필자가 공동창업자와 나눈 인터뷰에서 얻은 인상이며, 환자를 웹사이트로 데려오는 방법이 동네 약국을 발로 도는 일이라는 대목을 다룬다.","insight":"재처방은 미국 사용자가 반복해서 겪는 마찰이고, 처방 자체는 의료행위여서 우리가 맡을 수 없다. 다만 복용 중인 약과 남은 일수를 입력받아 떨어지기 전에 알려 주고 재처방을 받을 수 있는 경로로 넘겨 주는 데까지는 소프트웨어만으로 3개월 안에 가능하다. 매달 돌아오는 일이라 앱을 여는 이유가 되고, 걸음 리워드와 묶기도 쉽다.","signal":"아직 수백 명 규모지만, 약을 계속 먹으려고 별도의 웹사이트를 스스로 찾아가는 행동이 확인됐다. Doctronic은 2026년에 몇 개 주가 비슷한 조치를 할 것으로 보고 있다.","author":[{"claim":"범위가 제한적인데도 이 파일럿은 Doctronic에게도, AI가 임상 진료에 통합되는 흐름 전반에도 의미 있는 진전이다.","evidence":"회사가 이 작업을 위해 의료과실 보험에 가입했고, 이는 스스로 이 활동을 의료행위로 본다는 관점을 뒷받침한다는 점을 든다."},{"claim":"이 모든 일에 사람의 요소가 있다는 점을 다시 일깨우는 사례이며, Doctronic은 지역 시장에서 인지도와 신뢰를 쌓는 데 사려 깊게 접근하고 있다.","evidence":"동네 약국을 직접 찾아가 이점을 설명하고 거기서부터 넓혀 가는 방식을 든다."}],"experts":[{"who":"Dr. Adam Oskowitz","role":"AI로 처방 재발급을 돕는 회사 Doctronic의 공동창업자","claim":"필자와의 인터뷰에서 규제 전략과 파일럿 전개 방식, 'Doctronic 2.0'의 함의를 이야기했다.","evidence":"원문에는 그의 발언이 직접 인용되지 않았고, 영상 링크와 대화 주제만 소개된다."}],"cases":[{"name":"Doctronic × 유타주 파일럿","what":"AI로 환자의 약 재처방을 돕는 시범 프로그램을 지난달 시작했다. Doctronic은 소비자가 직접 찾아오는 처방 재발급 웹사이트를 운영한다.","scale":"현재까지 수백 명 등록","note":"안전장치를 두고 범위를 좁혔으며, 회사는 이 작업을 위해 의료과실 보험에 가입했다.","sells_to":"consumer"},{"name":"유타주","what":"주정부가 이 파일럿의 상대방으로 참여했다.","scale":"","note":"Doctronic은 2026년에 몇 개 주가 비슷한 조치를 취할 것으로 예상한다.","sells_to":"other"}],"notes":[{"term":"medication refill (약 재처방)","ko":"처방 다시 받기","plain":"미국에서는 처방전에 재조제 가능 횟수가 정해져 있어 그 횟수를 쓰고 나면 의사의 재승인을 다시 받아야 같은 약을 계속 살 수 있다. 만성질환 약을 먹는 사람은 이 절차가 주기적으로 돌아오는데, 진료를 다시 잡기가 번거로워 약이 끊기는 일이 흔하다. AI로 이 재승인을 대신하겠다는 것이 이 파일럿의 내용이다."},{"term":"medical malpractice policy (의료과실 보험)","ko":"의료과실 배상책임 보험","plain":"의사가 진료 중 실수로 환자에게 피해를 입혔을 때 배상을 대비해 드는 보험이다. 미국에서는 의료행위를 하는 쪽이 반드시 드는 보험이어서, 이 보험에 들었다는 사실 자체가 '우리가 하는 일은 단순 정보 제공이 아니라 의료행위'라고 스스로 선언하는 신호가 된다. 필자가 이 대목을 짚은 이유다."}]},{"heading_ko":"성과 기반 진료 설문 결과와 Aledade 인터뷰","heading_en":"Revisiting the VBC Topic of the Week","skip":null,"summary":"지난주 독자 설문의 결과를 공개하는 자리다. 성과 기반 진료를 두고 업계 종사자들이 어디에 서 있는지 비율로 보여 준다. 이어 필자가 이 분야의 대표 사례로 꼽는 Aledade의 CEO와 나눈 인터뷰를 소개한다.","insight":null,"signal":null,"author":[{"claim":"Aledade는 성과 기반 진료를 원칙을 지키면서 성공적으로 실행하는 대표 사례이며, 스펙트럼에서 더 낙관적인 쪽을 보여 준다.","evidence":"자신이 이 주제로 나누는 어떤 대화에서든 Aledade가 대표 사례로 등장한다는 경험을 든다."}],"experts":[{"who":"Farzad Mostashari","role":"성과 기반 진료로 사업하는 회사 Aledade의 CEO 겸 공동창업자","claim":"최근 발표한 크레딧 퍼실리티와 모델의 기술적인 면, MSSP를 넘어 메디케어 어드밴티지와 민간 보험, 메디케이드로 확장하는 구상, 이 분야가 어디로 향하는지를 이야기했다.","evidence":"원문에는 그의 발언이 직접 인용되지 않았고, 대화의 주제 목록만 전한다."}],"cases":[{"name":"HTN 1/4 뉴스레터 독자 설문","what":"성과 기반 진료가 지금 어디에 와 있다고 보는지 물었다.","scale":"총 379명 응답, 41%는 아직 아니지만 방향은 옳다, 12%(47명)는 이제 넘어갈 때가 됐다","note":"명백한 성공이라고 본 사람은 소수였다. 응답자는 일반 소비자가 아니라 업계 종사 독자층이다.","sells_to":"none"},{"name":"Aledade","what":"동네 의원들이 성과 기반 진료 계약을 하도록 돕는 회사이며, 최근 크레딧 퍼실리티를 발표했다.","scale":"","note":"MSSP를 넘어 메디케어 어드밴티지와 민간 보험, 메디케이드로 넓히려는 구상이 인터뷰의 주제였다.","sells_to":"provider"}],"notes":[{"term":"VBC (value-based care, 성과 기반 진료)","ko":"성과 기반 진료","plain":"검사와 시술을 많이 할수록 병원이 더 버는 행위별 수가제 대신, 환자 한 명에게 드는 총 진료비를 얼마나 줄이고 건강 결과를 얼마나 좋게 만들었는지로 보상하는 방식이다. 한국은 건강보험공단이 수가를 정해 두고 대부분 행위별로 지불하므로 이런 구분이 낯설다. 미국에서 십수 년째 밀어 온 방향인데, 이 설문은 그 성과를 두고 업계 안에서도 평가가 갈린다는 점을 보여 준다."},{"term":"MSSP","ko":"메디케어 공유절감 프로그램","plain":"노인 공보험인 메디케어가 운영하는 대표적인 성과 기반 진료 프로그램이다. 의원들이 모여 맡은 환자 집단의 진료비를 기준치보다 아끼면 그 절감분을 정부와 나눠 갖는 구조다. Aledade는 주로 이 프로그램에 동네 의원들을 참여시켜 왔고, 인터뷰의 주제는 여기서 다른 보험으로 넓혀 갈 수 있느냐였다."},{"term":"credit facility (크레딧 퍼실리티)","ko":"약정 대출 한도","plain":"필요할 때 정해진 한도 안에서 끌어다 쓸 수 있도록 금융기관과 미리 맺어 두는 대출 약정이다. 성과 기반 진료는 절감분을 정산받기까지 1년 넘게 걸리는 일이 흔해서 그동안 쓸 현금이 필요하다. 그래서 이 소식이 이 분야에서는 재무 구조 이야기로 읽힌다."}]},{"heading_ko":"CMS, 1970년대 청구 처리 시스템 교체 검토","heading_en":"Other Top Headlines","skip":null,"summary":"메디케어의 진료비 청구를 처리하는 시스템을 새로 짓겠다며 CMS가 제안요청서를 냈다는 소식이다. 지금 시스템이 1970년대 COBOL로 돌아간다는 점, 그리고 낡은 시스템이 실제로 큰 손실을 낸 전례가 함께 언급된다.","insight":null,"signal":null,"author":[{"claim":"CMS가 실제로 옛 시스템에서 현대적인 시스템으로 갈아탄다면 큰 움직임이며, 어디로 옮겨 갈지 생각해 보는 것도 흥미롭다. 실현 가능한 선택지가 많아 보이지 않기 때문이다.","evidence":"낡은 시스템이 초래한 과거 사례로 Next Generation ACO 모델의 5,000만 달러 손실을 든다."}],"experts":[{"who":"Brad Smith","role":"CMMI의 10년 성과를 다뤄 자주 인용되는 NEJM 기고문을 쓴 사람","claim":"CMMI 모델들의 발목을 잡은 운영상의 난제 가운데 하나로, 낡은 시스템이 수천 건의 청구에 시범사업 코드를 잘못 적용해 5,000만 달러 손실이 났던 일을 들었다.","evidence":"Next Generation Accountable Care Organization 모델의 실제 사례를 들었다."}],"cases":[{"name":"CMS 청구 처리 플랫폼 RFI","what":"메디케어 행위별 수가 청구를 처리할 새 플랫폼에 대한 제안요청서를 소비자가전전시회 자리에서 예고하고 공개했다.","scale":"","note":"현재 시스템은 1970년대 COBOL 기반이다.","sells_to":"other"},{"name":"Next Generation ACO 모델","what":"낡은 시스템이 수천 건의 청구에 시범사업 코드를 잘못 붙여 손실이 발생했다.","scale":"5,000만 달러 손실","note":"시스템 교체가 왜 큰 문제인지 보여 주는 전례로 인용된다.","sells_to":"none"}],"notes":[{"term":"Medicare FFS (행위별 수가 메디케어)","ko":"행위별 수가로 지불하는 메디케어","plain":"미국 노인 공보험 메디케어 가운데 민간 보험사에 맡기지 않고 정부가 직접 병원에 진료비를 지불하는 부분이다. 진료 하나하나에 값을 매겨 청구를 받고 지불하므로 처리해야 할 청구 건수가 어마어마하다. 이 청구를 실제로 계산하고 돈을 내보내는 전산 시스템이 여기서 말하는 교체 대상이다."},{"term":"RFI (제안요청서)","ko":"정보 요청서","plain":"정부 기관이 무언가를 새로 도입하기 전에 시장에 어떤 해법이 있는지 업체들에게 먼저 묻는 공고다. 계약을 바로 주는 입찰이 아니라 그 앞 단계이므로, 실제 교체까지는 시간이 더 걸린다. 그럼에도 필자가 큰 움직임이라고 보는 이유는 이런 규모의 시스템을 바꾸겠다는 신호 자체가 드물기 때문이다."},{"term":"CMMI","ko":"메디케어·메디케이드 혁신센터","plain":"진료비를 어떻게 지불할지 새로운 방식을 시범사업으로 돌려 보는 CMS 산하 조직이다. 성과 기반 진료 모델 대부분이 여기서 출발한다. 인용된 기고문은 그 10년을 평가하면서, 좋은 모델도 낡은 전산 시스템 같은 운영 문제에 발목을 잡혔다고 지적했다."}]},{"heading_ko":"FDA, 일부 AI·웰니스 제품 감독 완화","heading_en":"Other Top Headlines","skip":null,"summary":"FDA가 같은 전시회에서 일부 AI 및 웰니스 제품에 대한 감독을 완화하겠다고 밝혔다는 짧은 소식이다. 과거 혈압 관련 기능으로 경고 서한을 받았던 웨어러블 회사가 이를 반겼다는 반응이 함께 실렸다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"FDA","what":"소비자가전전시회에서 일부 AI 및 웰니스 제품에 대한 감독을 완화하겠다고 발표했다.","scale":"","note":"원문은 완화의 구체적인 범위까지는 전하지 않는다.","sells_to":"other"},{"name":"Whoop","what":"손목에 차는 건강 추적 기기를 소비자에게 파는 회사이며, 이번 조치를 반겼다.","scale":"","note":"2025년 7월 혈압 인사이트 기능과 관련해 FDA로부터 경고 서한을 받은 적이 있다.","sells_to":"consumer"}],"notes":[{"term":"general wellness product (일반 웰니스 제품)","ko":"일반 웰니스 제품","plain":"미국에서는 같은 기능이라도 병을 진단하거나 치료한다고 내세우면 의료기기 허가 절차를 밟아야 하고, 건강한 생활을 돕는다는 선에 머무르면 그 대상이 아니다. 그래서 웨어러블 회사들은 표현 하나로 규제 경계를 넘나든다. Whoop의 혈압 기능이 경고 서한을 받은 것도 그 경계를 넘었다는 판단이었다."},{"term":"warning letter (경고 서한)","ko":"FDA 경고 서한","plain":"FDA가 규정 위반을 확인했을 때 회사에 보내는 공식 통지이며, 시정하지 않으면 제품 압류나 판매 금지로 이어질 수 있다. 회사 입장에서는 기능을 내리거나 표현을 바꿔야 하는 실질적인 제재다. 이번 완화 발표를 웨어러블 업계가 반긴 배경이다."}]},{"heading_ko":"먹는 Wegovy, 소비자 채널로 풀리다","heading_en":"Other Top Headlines","skip":null,"summary":"Novo가 알약 형태의 Wegovy를 미국 소비자에게 여러 채널로 동시에 열었다는 소식이다. 대형 약국과 원격진료 플랫폼, 약값 비교 서비스까지 이름이 함께 오른다. 필자는 이 시장을 소비자를 자기 사이트로 데려오는 브랜딩 경쟁으로 읽는다.","insight":"약을 시작한 사람이 늘어나는 만큼, 시작한 뒤에 겪는 일을 다루는 자리가 비어 있다. 복용 여부와 체중 변화를 기록하고 걷기 목표를 함께 두는 트랙은 3개월 안에 앱 화면으로 만들 수 있으며, 이미 가진 리워드를 그 기록에 붙이면 계속 열게 만드는 고리가 된다. 약을 팔지 않아도 되는 일이라 규제 부담도 없다.","signal":"체중감량 약이 대형 약국과 함께 Ro, LifeMD, Weight Watchers, GoodRx 같은 소비자 채널로 한꺼번에 열렸다. 미국 소비자가 이 약을 직접 찾아 사는 상품으로 다루고 있고, 채널들은 소비자를 자기 사이트로 데려오는 경쟁을 벌이고 있다.","author":[{"claim":"이번 소식은 Ro를 비롯해 목록에 오른 브랜드들에 2026년 견실한 성장을 가져다줄 것이며, GLP-1 시장은 계속해서 브랜딩의 흥미로운 실습장이 되고 있다.","evidence":"여러 플레이어가 소비자를 자사 사이트로 데려와 체중감량 약을 사게 만드는 방법을 헤쳐 나가고 있다는 점을 든다."}],"experts":[],"cases":[{"name":"Novo Nordisk 먹는 Wegovy","what":"알약 형태의 체중감량 약을 CVS와 Costco 약국, Ro, LifeMD, Weight Watchers, NovoCare Pharmacy, GoodRx 등 여러 채널로 미국 소비자에게 열었다.","scale":"","note":"주사가 아닌 알약이 소비자 채널에 한꺼번에 풀렸다는 점이 핵심이다.","sells_to":"consumer"},{"name":"Ro","what":"온라인으로 진료와 약 배송을 이어 주는 소비자 서비스이며, 이번 소식에 맞춰 별도 보도자료를 냈다.","scale":"","note":"필자는 이 채널들이 2026년 성장의 수혜자가 될 것으로 본다.","sells_to":"consumer"},{"name":"Novo \"State of Weight and Health Report\"","what":"첫 리포트를 내며 이 나라의 이른바 Obesity Trap과 비만을 안고 살아가는 사람들이 마주하는 어려움을 조명했다.","scale":"","note":"약을 파는 회사가 직접 이 문제의 서사를 만들고 있다.","sells_to":"consumer"}],"notes":[{"term":"GLP-1","ko":"GLP-1 계열 약","plain":"원래 당뇨 치료제로 나왔다가 체중감량 효과가 확인되면서 널리 퍼진 약이며, Wegovy가 대표 상품이다. 지금까지는 주사가 중심이었는데 이번에 알약이 소비자 채널로 열렸다. 한국과 달리 미국에서는 이런 약을 온라인 진료로 처방받아 집으로 배송받는 경로가 이미 자리 잡았다."},{"term":"Ro, LifeMD, GoodRx","ko":"소비자가 직접 쓰는 처방·약값 서비스들","plain":"Ro와 LifeMD는 온라인으로 진료를 받고 약을 배송받는 소비자 서비스이고, GoodRx는 약국마다 다른 약값을 비교해 할인 쿠폰을 주는 서비스다. 미국은 같은 약도 약국과 보험에 따라 값이 크게 달라서 이런 서비스가 필요하다. 이번에 알약 Wegovy가 이 채널들에 동시에 실렸다는 것은, 보험을 거치지 않고 소비자가 직접 사는 경로가 열렸다는 뜻이다."}]},{"heading_ko":"Altaris Capital, Tegria 인수","heading_en":"Other Top Headlines","skip":null,"summary":"사모펀드가 병원 대상 기술 서비스 회사를 병원 그룹으로부터 사들였다는 짧은 소식이다. 이 회사가 처음 어떻게 만들어졌는지도 함께 언급된다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Altaris Capital의 Tegria 인수","what":"헬스시스템에 기술 서비스를 파는 Tegria를 Providence로부터 인수했다.","scale":"Tegria는 2020년 아홉 개 서비스 사업을 합쳐 출범했고, 당시 직원 2,500명이 350개 의료 기관을 지원","note":"병원 그룹이 직접 세운 기술 사업을 다시 떼어 내 파는 흐름이다.","sells_to":"provider"}],"notes":[]},{"heading_ko":"TPG, Optum UK 인수 협상","heading_en":"Other Top Headlines","skip":null,"summary":"UnitedHealth Group이 영국에서 산 전자의무기록 사업을 사모펀드에 되파는 협상 중이라는 보도다. 처음 인수했을 때의 금액과 지금 거론되는 금액이 함께 나온다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"TPG의 Optum UK 인수 협상","what":"Sky News 보도에 따르면 TPG가 UHG로부터 잉글랜드 동네 의원용 전자의무기록 사업을 인수하기 위해 협상 중이며, 몇 주 안에 발표될 수 있다.","scale":"12억~14억 파운드(16억~18억 달러), UHG는 2022년 6월 발표된 거래에서 EMIS를 15억 달러에 인수","note":"원 인수가와 거론되는 매각가가 비슷한 수준이다.","sells_to":"provider"}],"notes":[{"term":"EMR (전자의무기록)","ko":"전자의무기록","plain":"의사가 진료 내용과 처방을 입력하고 보관하는 병의원 전산 시스템이다. 한 번 깔면 바꾸기 어려워서 사실상 진료 현장을 장악하는 소프트웨어이고, 그래서 인수합병의 단골 대상이 된다. 여기서 말하는 GP는 영국에서 주민이 먼저 등록해 두고 찾아가는 동네 주치의를 가리킨다."}]},{"heading_ko":"CMS, 미네소타 메디케이드 자금 지급 유예 경고","heading_en":"Other Top Headlines","skip":null,"summary":"연방 CMS가 미네소타 주지사에게 서한을 보내, 부정수급에 대응하기 위해 필요하면 메디케이드 자금 지급을 유예하고 보류하겠다고 통보했다는 소식이다. 고위험으로 지목된 프로그램의 수와 그 지출 규모가 함께 제시된다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"CMS의 미네소타 메디케이드 통보","what":"Dr Oz가 주지사 Tim Walz에게 서한을 보내 과거 분기별 수령 내역을 검토 중이며 필요하면 앞으로 자금 지급을 유예하고 보류하겠다고 알렸다. 부정수급 고위험군으로 14개 메디케이드 프로그램을 지목했다.","scale":"14개 프로그램에 주와 연방 납세자 돈 37억 5,000만 달러 지출","note":"CMS는 프로바이더 등록과 지급액의 이례적인 증가를 발견했는데도 주가 조치를 취하지 않았다고 지적했다.","sells_to":"none"}],"notes":[{"term":"Medicaid (메디케이드)","ko":"저소득층 공보험","plain":"저소득층을 대상으로 하는 미국의 공보험이며, 주 정부가 운영하고 비용은 연방 정부와 주가 나눠 부담한다. 한국의 의료급여에 가깝지만 규모가 훨씬 크고 주마다 제도가 다르다. 연방이 돈줄을 쥐고 있기 때문에 지급을 보류하겠다는 통보는 주 정부에 강한 압박이 된다."}]},{"heading_ko":"Amazon One Medical, 시카고 파트너 교체","heading_en":"Other Top Headlines","skip":null,"summary":"아마존이 인수한 1차 진료 브랜드가 시카고에서 오랜 병원 파트너를 바꿨다는 소식이다. 맨해튼에서도 같은 일이 있었다는 점을 필자가 함께 짚는다.","insight":null,"signal":null,"author":[{"claim":"다른 시장에서도 이 흐름을 지켜볼 만하다.","evidence":"맨해튼에서도 2019년 Mount Sinai와 맺은 파트너십을 최근 다른 곳으로 바꿔, 파트너를 교체한 지역이 두 곳이 됐다는 점을 든다."}],"experts":[],"cases":[{"name":"Amazon One Medical","what":"동네 1차 진료를 제공하는 브랜드로, 시카고에서 Rush University System for Health와 파트너십을 맺으면서 2019년부터 이어 온 Advocate Aurora와의 관계를 정리했다.","scale":"","note":"맨해튼에서도 파트너를 바꿔, 교체 지역이 두 곳이 됐다.","sells_to":"mixed"}],"notes":[{"term":"1차 진료와 헬스시스템 파트너십","ko":"동네 진료와 대형 병원의 제휴","plain":"미국에서 1차 진료 브랜드는 감기나 만성질환 관리처럼 가벼운 진료만 맡고, 검사나 수술, 입원이 필요하면 제휴한 대형 병원으로 환자를 넘긴다. 병원 쪽은 그 대가로 환자를 안정적으로 공급받는다. 파트너를 바꾼다는 것은 그 지역에서 환자가 흘러가는 방향이 통째로 바뀐다는 뜻이다."}]},{"heading_ko":"월마트, 비대면 진료 큐레이션 사이트 개설","heading_en":"Other Top Headlines","skip":null,"summary":"월마트가 고객을 위해 비대면 진료 상품을 골라 모아 주는 웹사이트를 냈다는 한 줄 소식이다. 여기에 제약사가 직접 운영하는 채널도 포함된다.","insight":"직접 진료를 하지 않아도 소비자에게 가치를 줄 수 있는 형태를 보여 준다. 사용자가 자기 돈으로 살 수 있는 비대면 진료와 약 배송 선택지를 증상과 상황별로 정리해 보여 주는 자리는 앱 화면만으로 3개월 안에 만들 수 있다. 미국 사용자는 어디로 가야 하는지부터 모르기 때문에, 고르는 일을 대신해 주는 것만으로 쓸모가 생긴다.","signal":null,"author":[],"experts":[],"cases":[{"name":"Walmart Better Care Services","what":"고객을 위해 비대면 진료 상품을 큐레이션해 주는 웹사이트를 새로 열었으며 LillyDirect를 포함한다.","scale":"","note":"직접 진료를 제공하는 대신 고르는 일을 대신해 주는 형태다.","sells_to":"consumer"}],"notes":[{"term":"LillyDirect","ko":"일라이 릴리의 소비자 직판 채널","plain":"제약사 일라이 릴리가 자사 약을 소비자에게 직접 연결해 주는 채널이며, 온라인 진료와 약 배송까지 이어진다. 원래 약은 도매와 약국, 보험을 거쳐 환자에게 가는데 그 사이 단계를 건너뛰는 구조다. 월마트가 이런 채널을 자기 사이트에 모아 준다는 것은, 소비자가 직접 사는 시장이 소매업체의 취급 품목이 됐다는 뜻이다."}]},{"heading_ko":"CVAUSA, 피닉스 심장내과 그룹 인수","heading_en":"Other Top Headlines","skip":null,"summary":"심장내과 진료 그룹을 사 모으는 회사가 피닉스에서 또 한 곳을 인수했다는 짧은 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"CVAUSA의 Cardiovascular Consultants 인수","what":"피닉스에 기반을 둔 심장내과 그룹을 인수했으며, 이 그룹은 2024년 4월에 인수한 또 다른 피닉스 심장내과 그룹 Atria Heart의 일부가 된다.","scale":"","note":"같은 도시에서 전문 진료 그룹을 이어 붙이는 방식이다.","sells_to":"provider"}],"notes":[]},{"heading_ko":"IntelyCare, CareRev 인수","heading_en":"Other Top Headlines","skip":null,"summary":"의료 인력을 병원에 연결해 주는 두 플랫폼이 하나로 합쳐졌다는 한 줄 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"IntelyCare의 CareRev 인수","what":"간호 인력 등을 병원에 공급하는 두 플랫폼이 결합했다.","scale":"","note":"","sells_to":"provider"}],"notes":[]},{"heading_ko":"투자: 산모 케어 Pomelo Care","heading_en":"Funding Announcements","skip":null,"summary":"임신과 출산을 관리하는 케어 모델이 큰 규모의 투자를 받았다는 소식이다. 대상 인구와 미국 출산에서 차지하는 비중, 앞으로 넓히려는 영역이 함께 나온다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Pomelo Care","what":"주로 메디케이드와 고용주 인구를 대상으로 산모 케어를 제공하는 모델이며, Stripes가 리드한 라운드로 자금을 조달했다. 산모를 넘어 여성과 아동 헬스케어 전반으로 넓히는 데 쓴다.","scale":"9,200만 달러 조달, 밸류에이션 17억 달러, 커버드 라이프 2,500만 명, 미국 출산의 7% 지원","note":"소비자가 직접 고르고 돈을 내는 구조가 아니라 보험과 고용주를 통해 닿는다.","sells_to":"payer"}],"notes":[{"term":"covered lives (커버드 라이프)","ko":"적용 대상 인원","plain":"그 서비스를 쓸 수 있도록 계약에 포함된 사람의 수이며, 실제 이용자 수가 아니다. 보험사나 고용주와 계약을 맺으면 그 집단 전체가 한꺼번에 숫자로 잡힌다. 2,500만 명이라는 숫자를 실제 이용자로 읽으면 크게 어긋난다."}]},{"heading_ko":"투자: 수술실 AI Apella","heading_en":"Funding Announcements","skip":null,"summary":"병원 수술실 운영을 돕는 AI 플랫폼이 시리즈 B를 마쳤다는 소식이다. 고객 병원 이름과 성과 수치가 함께 제시된다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Apella","what":"수술실용 AI 플랫폼이며, HighlandX가 리드하고 Houston Methodist 등이 참여한 시리즈 B를 마쳤다.","scale":"지분과 부채로 8,000만 달러 조달, 병원 고객 평균 수술 볼륨 5% 증가","note":"성과 수치의 출처는 회사 보도자료다.","sells_to":"provider"}],"notes":[]},{"heading_ko":"투자: 리얼월드 데이터 Protege","heading_en":"Funding Announcements","skip":null,"summary":"실제 진료 현장에서 쌓인 데이터를 다루는 플랫폼이 a16z가 리드한 라운드로 자금을 조달했다는 한 줄 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Protege","what":"리얼월드 데이터 플랫폼이며 a16z가 리드한 라운드로 자금을 조달했다.","scale":"3,000만 달러","note":"원문은 고객이 누구인지 밝히지 않는다.","sells_to":"other"}],"notes":[{"term":"real-world data (리얼월드 데이터)","ko":"실제 진료 현장 데이터","plain":"임상시험처럼 통제된 환경이 아니라 실제 진료와 처방, 청구에서 쌓인 데이터를 말한다. 약이 실제 환자들에게 어떻게 쓰였고 어떤 결과가 났는지 보여 주기 때문에 값이 나간다. 미국은 진료 기록이 여러 곳에 흩어져 있어 이를 모으고 이어 붙이는 것 자체가 사업이 된다."}]},{"heading_ko":"투자: 병원 안전 플랫폼 Canopy","heading_en":"Funding Announcements","skip":null,"summary":"헬스시스템의 안전 관리를 돕는 플랫폼이 자금을 조달했다는 소식이며, 현재 함께 일하는 규모가 함께 제시된다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Canopy","what":"헬스시스템용 안전 플랫폼이며 111° West Capital과 ACME Capital이 리드한 라운드로 자금을 조달했다.","scale":"2,200만 달러, 60개 헬스시스템 30만 명 이상의 직원과 협업","note":"","sells_to":"provider"}],"notes":[]},{"heading_ko":"투자: 행동건강 클리닉 운영 AI Oasys","heading_en":"Funding Announcements","skip":null,"summary":"정신건강 진료 기관의 운영을 맡는 AI 시스템이 소규모 라운드를 마쳤다는 한 줄 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Oasys","what":"행동건강 클리닉을 위한 AI 운영체제이며 Pathlight Ventures가 리드한 라운드로 자금을 조달했다.","scale":"460만 달러","note":"","sells_to":"provider"}],"notes":[]},{"heading_ko":"투자: 사전승인 모델 Ethicos Health","heading_en":"Funding Announcements","skip":null,"summary":"값비싼 전문 의약품의 보험 사전승인 절차를 새로 짜겠다는 회사가 프리시드 자금을 받았다는 한 줄 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Ethicos Health","what":"전문 의약품의 사전승인을 위한 새로운 모델이며 Flare Capital 등이 투자했다.","scale":"프리시드 단계, 금액 비공개","note":"","sells_to":"pharma"}],"notes":[{"term":"prior auth (사전승인)","ko":"보험사 사전승인","plain":"값비싼 약이나 시술은 의사가 처방했더라도 보험사가 미리 승인해야 비용을 내주는 절차다. 서류를 주고받는 데만 며칠에서 몇 주가 걸려 환자의 치료가 늦어지는 대표적인 병목이다. 한국은 급여 기준이 정해져 있어 이런 개별 승인 절차가 일상적이지 않다."}]},{"heading_ko":"읽을거리: 헬스시스템 CEO의 AI 과제 (Manatt)","heading_en":"What I'm Reading","skip":null,"summary":"로펌 컨설팅 팀이 병원 경영진을 위해 낸 AI 도입 리포트를 소개하는 자리다. 필자는 빠르게 훑어본 인상만 전한다.","insight":null,"signal":null,"author":[{"claim":"빠르게 훑어본 바로는 헬스시스템 리더십이 AI 도입을 어떻게 바라봐야 하는지에 대한 사려 깊은 정리가 여럿 담긴 것 같다.","evidence":"근거를 대지 않았다. 오늘 아침 나온 리포트를 훑어본 인상이라고 밝힌다."}],"experts":[{"who":"Tom Cassels, Seth Frazier, Tracey Massel, Jared Augenstein","role":"병원과 보험사를 상대로 자문하는 Manatt 소속 리포트 저자들","claim":"헬스시스템 리더십이 AI 도입을 어떻게 바라봐야 하는지를 다뤘다.","evidence":"원문은 리포트의 구체적인 내용을 전하지 않는다."}],"cases":[{"name":"Manatt 리포트","what":"2026년 헬스시스템 CEO의 핵심 리더십 과제로 AI 활용을 다룬 리포트를 냈다.","scale":"","note":"","sells_to":"provider"}],"notes":[]},{"heading_ko":"읽을거리: 병원이 AI의 시험장이 되다 (WSJ)","heading_en":"What I'm Reading","skip":null,"summary":"병원이 AI를 실제로 어떻게 도입하고 있는지 다룬 기사를 소개한다. 돈이 되는 쪽에서는 성과가 나왔고, 환자에게 직접 말을 거는 쪽에서는 문제가 생겨 중단했다는 두 장면이 나란히 실린다.","insight":null,"signal":null,"author":[{"claim":"일부 시스템이 AI를 구현하는 과정에서 드러나는 가능성과 어려움을 모두 잘 그려 낸 좋은 기사다.","evidence":"Mount Sinai가 보험 지급 거절을 뒤집어 1,200만 달러 효과를 본 사례와, 환자에게 보내는 메시지를 생성하던 Epic 도구를 중단한 사례를 함께 든다."}],"experts":[{"who":"Te-Ping Chen, Chao Deng","role":"이 기사를 쓴 월스트리트저널 기자","claim":"헬스시스템의 AI 도입에는 가능성과 한계가 함께 드러난다.","evidence":"Menlo Ventures 리포트를 인용해 현재 27%가 상용 AI 라이선스를 유료로 쓰고 있다고 짚고, Mount Sinai의 두 사례를 든다."}],"cases":[{"name":"Mount Sinai","what":"AI로 보험 지급 거절을 뒤집는 작업에서 성과를 냈고, 의사가 환자에게 보내는 메시지를 생성하던 Epic 도구는 사용을 중단했다.","scale":"지급 거절을 뒤집어 1,200만 달러 효과","note":"중단한 도구는 보행보조기를 요청한 환자에게 도울 수 없다고 답하는 식의 실수를 저질렀는데, 다행히 위험이 낮은 상황들이었다.","sells_to":"provider"},{"name":"Menlo Ventures 리포트","what":"헬스시스템의 상용 AI 라이선스 유료 사용 비율을 집계했다.","scale":"현재 27%","note":"","sells_to":"none"}],"notes":[{"term":"insurance denial (보험 지급 거절)","ko":"보험사의 지급 거절","plain":"병원이 진료비를 청구해도 보험사가 필요한 진료가 아니었다거나 서류가 미비하다며 지불을 거절하는 일이다. 병원은 근거를 붙여 이의를 제기해 뒤집을 수 있는데, 그 문서 작업에 사람이 많이 든다. AI로 이 작업을 자동화하면 곧바로 돈이 되기 때문에 병원이 가장 먼저 손대는 영역이다."},{"term":"Epic","ko":"미국 최대 전자의무기록 회사","plain":"미국 대형 병원 대부분이 쓰는 전자의무기록 시스템을 만드는 회사다. 진료 기록부터 환자와 주고받는 메시지까지 이 시스템 안에서 이뤄지기 때문에, Epic이 붙인 AI 기능은 곧바로 수많은 병원에 퍼진다. 그만큼 실수가 났을 때의 파장도 크다."}]},{"heading_ko":"읽을거리: PBM이 소유한 GPO 폭로 기사","heading_en":"What I'm Reading","skip":null,"summary":"3대 약제비 관리 회사가 소유한 구매 대행 조직을 파헤친 폭로 기사를 다룬다. 필자는 이 기사에 새로운 내용이 별로 없다고 보면서, 이런 서사가 힘을 얻는 이유를 지금의 문화적 분위기에서 찾는다. 마지막에는 기사 논리 자체에 대한 의문을 던진다.","insight":null,"signal":null,"author":[{"claim":"이 기사에는 PBM 소유 구매 대행 조직이 원격으로 일할 수도 있다는 사실 말고는 새로운 내용이 그리 많지 않다.","evidence":"기사의 재무 관련 논의가 대부분 2023년 Nephron Research 리포트에 기대고 있다는 점을 든다."},{"claim":"복잡성과 불투명성이 회의를 부르는 문화적 국면에 있는 만큼 이런 기사가 힘을 얻는 이유는 쉽게 알 수 있다.","evidence":"근거를 대지 않았다. 자신도 이 구조를 종잡을 수 없는 난장판으로 본다고 밝힌다."},{"claim":"구매 대행 조직이 고용주로부터 이익을 숨기는 그렇게 노골적인 방법이라면 시장이 이 문제를 빠르게 정리해야 하는 것 아닌가.","evidence":"기사 스스로 고용주들이 이미 3대 PBM을 넘어 더 투명한 상품으로 옮겨 가고 있다고 적었다는 점을 든다."}],"experts":[{"who":"Laura Wadsten, Nathaniel Horwitz","role":"탐사 보도로 기업을 다루는 Hunterbrook Media의 기사 저자","claim":"3대 PBM이 소유한 구매 대행 조직이 수십억 달러의 이익을 숨기는 새로운 방법이 되고 있다.","evidence":"재무 관련 논의는 대부분 2023년 Nephron Research 리포트에 기대고 있다고 필자가 정리한다."}],"cases":[{"name":"Hunterbrook Media 폭로 기사","what":"3대 PBM이 소유한 GPO를 다룬 기사를 냈고 업계에서 회자되고 있다.","scale":"","note":"필자는 이 기사가 새로 밝힌 것은 이들 조직이 원격으로 일할 수도 있다는 점 정도라고 본다.","sells_to":"none"},{"name":"2023년 Nephron Research 리포트","what":"PBM의 재무 구조와, 구매 대행 조직 및 전문 의약품이 PBM 이익에서 차지하는 비중이 커져 온 과정을 다뤘다.","scale":"","note":"필자는 폭로 기사보다 이 리포트가 훨씬 결이 섬세하다고 평가한다.","sells_to":"none"}],"notes":[{"term":"PBM","ko":"약제비 관리 회사","plain":"보험사와 고용주를 대신해 어떤 약을 얼마에 보장할지 정하고 제약사와 값을 협상하는 중간 회사다. 한국은 건강보험공단이 이 일을 하나로 맡지만 미국은 민간 회사 세 곳이 시장 대부분을 쥐고 있다. 협상으로 받아 낸 할인을 어디까지 고객에게 돌려주는지가 늘 논란거리다."},{"term":"GPO (구매 대행 조직)","ko":"공동 구매 조직","plain":"여러 곳의 구매를 한데 모아 제약사와 값을 협상하는 조직이다. 원래는 병원들이 물품을 싸게 사려고 만든 형태인데, 3대 PBM이 각자 이런 조직을 따로 세우고 종종 해외에 두면서 할인의 일부가 그쪽에 남는다는 지적이 나온다. 폭로 기사의 요지는 그렇게 남긴 몫이 고용주에게 보이지 않는다는 것이다."}]},{"heading_ko":"읽을거리: UHG 리스크 조정 검토 리포트","heading_en":"What I'm Reading","skip":null,"summary":"UnitedHealth Group이 자사의 리스크 조정 관행을 외부 컨설팅에 맡겨 검토한 리포트를 공개했다는 소식이다. 결론은 내부에 적절한 정책과 통제가 갖춰져 있다는 것이다. 필자는 앞의 폭로 기사와 이 리포트가 받는 관심의 차이를 짚는다.","insight":null,"signal":null,"author":[{"claim":"큰 조직이 무슨 일이 벌어지고 있는지 설명하는데 그 내용이 실제로는 꽤 밋밋할 때는, 앞선 손가락질보다 훨씬 적은 관심을 받는 것으로 보인다. 이 역시 지금의 문화적 국면을 보여 준다.","evidence":"회자되는 폭로 기사와 이 33쪽짜리 리포트의 대비를 든다."}],"experts":[{"who":"FTI Consulting","role":"UHG의 의뢰를 받아 리스크 조정 관행을 검토한 컨설팅 회사","claim":"UHG 내부에 적절한 정책과 통제가 갖춰져 있다.","evidence":"UHG의 리스크 조정 정책을 훑어 나가는 33쪽 분량의 문서를 근거로 제시한다."}],"cases":[{"name":"UHG 리스크 조정 검토 리포트","what":"UHG가 FTI Consulting에 의뢰해 자사의 메디케어 어드밴티지 리스크 조정 관행을 검토한 리포트를 공개했다.","scale":"33쪽","note":"의뢰인이 검토 대상 회사 자신이라는 점을 감안해 읽어야 한다.","sells_to":"none"}],"notes":[{"term":"risk adjustment (리스크 조정)","ko":"위험도 보정","plain":"메디케어 어드밴티지는 정부가 민간 보험사에 가입자 한 명당 정해진 금액을 매달 주는 방식인데, 병이 많은 가입자일수록 더 많이 준다. 그래서 보험사가 가입자의 병명을 얼마나 촘촘히 기록하느냐에 따라 받는 돈이 달라지고, 실제보다 아프게 기록하는 것 아니냐는 의심이 반복해서 제기된다. 이 리포트는 그 의심에 대한 회사 쪽 답변이다."}]}],"themes":["ai-clinical","consumer-dtc","pharma-glp1","value-based-care","regulation-fda","digital-health-funding"],"for_later":[]},{"index":"06","date":"2026-01-18","type":"reads","title_en":"Weekly Health Tech Reads 1/18/26","title_ko":"JPM 2026과 소비자 건강 앱의 자리","hook":"JPM 2026은 조용한 흑자 기업의 무대였고, 소비자 건강은 AI 쪽으로 옮겨 가고 있다.","tldr":[{"point":"필자와 Martin이 JPM 2026에서 약 30건의 기업 발표를 직접 듣고 정리한 결론은, 화려한 벤처 투자 기업들이 사라진 자리를 매출 성장과 수익성을 함께 내는 이른바 \"Rule of 50\" 비상장 기업들이 채웠다는 것이다.","note":"Rule of 40은 소프트웨어 업계에서 매출 성장률과 이익률을 더해 40을 넘으면 건강한 회사로 보는 잣대이며, Rule of 50은 그 기준을 더 높인 변형이다."},{"point":"병원 청구·수납 사업(RCM)에 돈이 몰리고 있으나, 필자는 이것이 10년 전 리스크 조정과 같은 궤적을 밟아 일시적으로 끝나리라고 본다.","note":"리스크 조정은 정부가 가입자의 질병 기록에 따라 보험사에 주는 돈을 올려 주는 장치인데, 그 돈을 더 받으려는 경쟁이 결국 과다 청구 논란과 규제로 이어진 전례가 있다."},{"point":"리스크 조정을 둘러싼 소식이 한 주에 몰렸다. Kaiser가 2009~2018년 리스크 점수를 부풀렸다는 혐의로 5억 5,600만 달러를 내기로 했고, Grassley 상원의원은 UnitedHealth가 리스크 점수를 극대화했다는 보고서를 냈으며, MedPAC은 2026년 메디케어 어드밴티지 지급액이 행위별 수가보다 760억 달러 많다고 밝혔다.","note":"미국은 65세 이상 공보험을 민간 보험사가 대신 운영하는 길을 열어 두었고, 그 대가로 정부가 가입자 1인당 정액을 주기 때문에 병명을 얼마나 붙였는지가 곧 매출이 된다."},{"point":"ACA 가입자는 1월 3일 기준 2,280만 명으로 작년 2,420만 명에서 약 6% 줄어, 의회예산처가 내다본 1,890만 명보다 훨씬 나았지만, 보험료를 내지 않는 사람들의 이탈이 얼마나 더 나올지는 아직 남아 있다.","note":"ACA는 직장 보험도 공보험도 없는 사람이 정부가 운영하는 장터에서 민간 보험을 직접 사는 제도라서, 가입과 실제 보험료 납부가 따로 논다."},{"point":"소비자 건강 쪽에서는 OpenAI가 개인 건강 기록 스타트업 Torch를 약 1억 달러에 인수해 ChatGPT Health를 만들고 있고, 같은 회차에 실린 글은 건강에 관심 많은 사람들이 자기 데이터를 훑는 개인 AI 어시스턴트를 스스로 만들고 있다며 소비자 건강 앱의 자리를 묻는다.","note":"필자는 이 분야에서 이기려면 신뢰에서 이기는 것이 충분조건은 아니어도 필요조건이라고 덧붙인다."},{"point":"Rock Health의 2025년 리포트는 가진 자와 못 가진 자로 갈린 한 해였다고 정리했다. 딜 건수는 509건에서 482건으로 줄었으나 조달 금액은 105억 달러에서 142억 달러로 늘었다.","note":"건수는 줄고 금액이 늘었다는 것은 소수의 큰 회사에 돈이 몰렸다는 뜻이다."}],"issue_insight":{"verdict":"yes","summary":"회차의 대부분은 병원·보험사·정부 사이의 돈 이야기라서 우리와 직접 관계가 없다. 다만 마지막 읽을거리 세 꼭지가 소비자 건강 앱의 자리를 정면으로 다루고 있어, 여기서 3개월 안에 시험할 것이 나온다.","build":[{"title":"내 데이터에 묻는 대화 화면","detail":"앱이 이미 쌓아 온 걸음·건강 기록을 놓고 사용자가 질문하면 답하는 화면을 붙인다. 개인 AI 어시스턴트를 직접 만드는 사람은 소수이므로, 기본으로 제공하는 것 자체가 차이가 된다.","section":26},{"title":"건강 데이터 신뢰 화면","detail":"어떤 데이터를 받아 어디에 보관하고 누구에게 넘기는지, 학습에 쓰는지 아닌지를 평이한 말로 한 화면에 밝히고 삭제와 내보내기를 버튼으로 제공한다.","section":25},{"title":"데이터 내보내기와 챗봇 연결","detail":"사용자가 자기 기록을 표준 형식으로 내려받거나 외부 챗봇에 넘길 수 있게 한다. 데이터를 가두지 않는다는 신호가 되고, 연결 규격 자체는 소프트웨어 작업으로 끝난다.","section":24}],"signal":[{"title":"자기 데이터를 훑는 개인 AI를 직접 만든다","detail":"필자는 건강에 관심 많은 친구들에게서 개인 데이터를 훑는 AI 어시스턴트를 만들고 있다는 이야기를 점점 더 자주 듣는다고 전한다. 돈이 아니라 시간을 들여서라도 흩어진 자기 기록을 한데 놓고 묻고 싶다는 수요다.","section":26},{"title":"보험료가 소비자의 실질 부담선이다","detail":"ACA 가입은 예측만큼 무너지지 않았으나, 업계가 지켜보는 다음 관문은 가입해 놓고 보험료를 내지 않는 사람들의 이탈이다.","section":11},{"title":"보험 밖에서 소비자가 직접 내는 영역으로 돈이 향한다","detail":"필자는 사모펀드 쪽 정리에서 롱제비티에 대한 관심과 컨시어지 시장의 임박한 거래를 흥미롭게 봤다고 적었다. 둘 다 보험이 값을 쳐 주지 않아 소비자가 자기 돈을 내는 영역이다.","section":27}]},"sections":[{"heading_ko":"스폰서: 10Pearls","heading_en":"Sponsored by: 10Pearls","skip":"sponsor","summary":"AI 도입 워크숍을 파는 회사의 광고 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"JPM 2026 총정리 서문","heading_en":"The JPMorgan 2026 Round Up","skip":null,"summary":"필자와 Martin이 JPM 컨퍼런스 현장에서 약 30건의 기업 발표를 직접 듣고 약 2만 단어로 정리했다는 서문이다. 소셜 미디어의 인상 비평이 아니라 발표장에서 투자자들이 실제로 듣는 이야기를 옮긴다는 점을 앞세운다. 이어지는 여섯 꼭지가 그 총평이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[{"term":"JPM","ko":"JP모건 헬스케어 컨퍼런스","plain":"해마다 1월 샌프란시스코에서 열리는 헬스케어 업계 최대 투자 행사다. 기업이 투자자 앞에서 실적과 계획을 발표하고, 그 자리에서 한 해의 분위기가 정해진다. 비상장 기업, 상장 기업, 병원 그룹의 세 갈래 발표 트랙으로 나뉘어 있다."}]},{"heading_ko":"\"Rule of 50\" 기업들","heading_en":"The JPMorgan 2026 Round Up","skip":null,"summary":"비상장 기업 발표 트랙의 성격이 예년과 달라졌다는 관찰이다. 이름이 알려지지 않았어도 매출 성장과 이익을 함께 내는 회사들이 무대를 채웠고, 벤처 자금을 받아 빠르게 몸집을 키우던 기업들은 대체로 사라졌다. 필자는 이것을 헬스케어 투자 수익률에 대한 벤처 업계의 환멸에 맞서는 반례로 읽는다.","insight":null,"signal":null,"author":[{"claim":"벤처 업계가 헬스케어 수익률에 환멸을 느껴 온 가운데, JPMorgan에서 발표한 기업들은 훌륭한 반례를 제시했다.","evidence":"여러 기업이 매출 성장과 조정 EBITDA 성장의 합이 50%를 넘는다고 밝혔고, 30년 전 부트스트랩으로 창업한 PointClickCare가 현재 9억 달러 매출에 40% EBITDA 마진을 내고 있다는 발표를 근거로 들었다."}],"experts":[],"cases":[{"name":"PointClickCare","what":"30년 전 외부 투자 없이 창업해 2011년에 그로스 에쿼티 투자를 받은 회사로, 이번 비상장 기업 트랙에서 발표했다.","scale":"매출 9억 달러, EBITDA 마진 40%, 2020년 이후 연평균 18% 성장","note":"빠른 성장과 수익성을 함께 낸 회사가 어떤 모습인지 보여 주는 예로 필자가 골랐다.","sells_to":"provider"}],"notes":[{"term":"Rule of 40 / Rule of 50","ko":"40의 법칙","plain":"소프트웨어 업계에서 회사의 건강함을 한 숫자로 보려고 쓰는 잣대다. 매출 성장률과 이익률을 더해 40을 넘으면 합격으로 본다. 빠르게 크지만 돈은 못 버는 회사와, 돈은 벌지만 크지 않는 회사를 한꺼번에 걸러 내려는 것이다. Rule of 50은 그 기준선을 50으로 올린 변형이다."},{"term":"조정 EBITDA","ko":"이자·세금·감가상각 차감 전 영업이익","plain":"회사가 본업에서 현금을 얼마나 남기는지 보려고 쓰는 이익 지표다. 회계상의 비용을 걷어 낸 값이라 회사끼리 견주기 쉬워, 투자자들이 성장률과 함께 자주 본다."}]},{"heading_ko":"RCM이 새로운 리스크 조정","heading_en":"The JPMorgan 2026 Round Up","skip":null,"summary":"병원이 보험사에서 받을 돈을 빠짐없이 받아 내는 청구·수납 사업이 과열되고 있다는 이야기다. 병원들은 조각난 소프트웨어를 수십 개 붙이는 데 지쳐 규모 있는 플랫폼과 손잡으려 한다. 필자는 이 구도가 10년 전 리스크 조정과 판박이이며, 협상 테이블의 반대편에 섰다는 점만 다르다고 본다.","insight":null,"signal":null,"author":[{"claim":"헬스 시스템이 RCM을 전략적 역량으로 봐야 할 이유가 분명하지 않으며, RCM 시장의 호황은 리스크 조정과 비슷한 궤적을 따라 일시적으로 끝날 것이다.","evidence":"리스크 조정이 어떤 페이어에게도 전략적 우위가 되어서는 안 된다는 메디케어 국장 Chris Klomp의 기조연설 발언을 끌어와 같은 개념이 RCM에도 적용될 것이라고 유추했다."}],"experts":[{"who":"Chris Klomp","role":"메디케어를 총괄하는 정부 쪽 인사","claim":"리스크 조정은 어떤 페이어에게도 전략적 우위가 되어서는 안 되며, 페이어 간 가입자 집단의 상대적 건강 상태를 반영해 공평한 경쟁의 장을 만들어 주는 장치여야 한다.","evidence":"근거를 대지 않았다."}],"cases":[{"name":"Ensemble","what":"병원의 청구·수납 업무를 규모 있게 대행하는 회사로, 헬스 시스템들이 RCM을 전략적 역량으로 보고 받아야 할 돈을 모두 확보하려 한다고 발표했다.","scale":"","note":"받을 돈을 더 받아 내는 일이 병원의 핵심 역량으로 격상되고 있다는 주장인데, 필자는 여기에 동의하지 않는다.","sells_to":"provider"},{"name":"Smarter Technologies","what":"Ensemble과 함께, 병원 리더들이 포인트 솔루션 피로를 겪고 있어 AI로 이 시장을 풀겠다는 초기 스타트업의 전화를 더 이상 받지 않는다고 설명했다.","scale":"","note":"AI를 내세운 신생 기업이 병원 문턱을 넘기 어려워졌다는 신호다.","sells_to":"provider"}],"notes":[{"term":"RCM","ko":"청구·수납 관리","plain":"미국 병원은 진료를 마치면 보험사에 청구서를 보내 돈을 받는데, 환자 등록부터 진료 코드 부여, 청구, 거절 대응, 수납까지 과정이 길고 복잡하다. 이 전 과정을 대신 관리해 병원이 받을 돈을 빠짐없이 받게 해 주는 사업이 RCM이다. 한국은 건강보험공단 한 곳에 정해진 서식으로 청구하면 되지만, 미국은 보험사마다 규칙이 달라 이 업무 자체가 거대한 시장이 되었다."},{"term":"리스크 조정","ko":"가입자 건강 상태에 따른 지급액 보정","plain":"정부가 민간 보험사에 가입자 1인당 정해진 돈을 주면, 아픈 사람을 많이 받은 보험사만 손해를 본다. 그래서 가입자의 질병 기록에 따라 지급액을 올려 주는데, 결과적으로 병명을 더 많이 붙일수록 보험사가 받는 돈이 늘어난다. 여기서 과다 청구 논란이 10년 넘게 이어지고 있다."},{"term":"포인트 솔루션","ko":"업무 한 조각만 푸는 소프트웨어","plain":"전체 업무가 아니라 한 단계만 해결해 주는 도구를 말한다. 병원이 이런 것을 수십 개씩 사서 붙이다 관리에 지친 상태를 \"포인트 솔루션 피로\"라고 부른다."}]},{"heading_ko":"Thoreau와 거래 자동화","heading_en":"The JPMorgan 2026 Round Up","skip":null,"summary":"Thoreau라는 이름을 두고 업계의 기대가 높지만, 공개된 정보가 적어 필자도 판단을 미룬다. 대신 그 아래 모일 것으로 보이는 Datavant, Machinify, Smarter Technologies가 모두 JPMorgan에서 강한 실적을 내세웠다는 점을 짚는다. 병원과 보험사 사이에 오가는 서류와 정산을 자동화하는 자리에 큰 플랫폼이 설 기회가 있다는 이야기다.","insight":null,"signal":null,"author":[{"claim":"Thoreau가 무엇인지 아닌지를 말하기에는 아직 이르지만, 헬스케어에서 거대한 플랫폼을 만들 꽤 분명한 기회를 갖고 있다.","evidence":"Datavant, Machinify, Smarter Technologies가 모두 2025년 자사 사업의 강한 모멘텀을 강조했다는 점을 들었다."}],"experts":[],"cases":[{"name":"Datavant, Machinify, Smarter Technologies","what":"세 회사 모두 JPMorgan에서 발표했고 각각 2025년의 강한 성장세를 내세웠다. 필자는 이 자산들이 Thoreau 아래 어떻게 모이는지 지켜볼 만하다고 적었다.","scale":"","note":"개별 회사의 성장보다, 이들이 하나로 묶였을 때 생길 규모를 보고 있다.","sells_to":"mixed"}],"notes":[{"term":"거래 레이어","ko":"병원과 보험사 사이의 서류가 오가는 층","plain":"미국에서는 진료 한 건이 끝날 때마다 자격 확인, 사전 승인, 청구, 지급, 이의 제기 같은 서류가 병원과 보험사 사이를 오간다. 이 흐름 전체를 가리켜 거래 레이어라고 부른다. 한국에는 심사평가원이라는 단일 통로가 있어 이만한 시장이 생기지 않는다."}]},{"heading_ko":"AI 활용은 기대에 못 미쳤다","heading_en":"The JPMorgan 2026 Round Up","skip":null,"summary":"모든 발표에 AI가 등장했지만 필자는 감탄하지 않았다. 예상 가능한 방식으로 마진을 개선하는 수준일 뿐, 구현에서 두드러진 곳이 없었다는 평가다. 유일한 예외는 OpenEvidence였는데, 그마저도 기업 발표라기보다 CEO의 미래 구상에 가까웠다.","insight":null,"signal":null,"author":[{"claim":"제약사에 광고를 파는 것을 핵심 비즈니스 모델로 삼는 회사가 AI 시대의 Mayo Clinic이 되는 데에는 낙관적이지 않다.","evidence":"기술은 시간이 지나면 거기까지 가겠지만 OpenEvidence에는 무엇보다 비즈니스 모델의 혁신이 더 필요하다는 판단을 근거로 들었다."},{"claim":"기업들이 AI로 마진을 개선하는 것은 분명하지만, 구현 방식에서 정말로 두드러진 곳은 없었다.","evidence":"약 30건의 발표를 모두 듣고 받은 인상 외에 별도의 근거를 대지 않았다."}],"experts":[{"who":"Daniel Nadler","role":"제약사 광고를 핵심 수익원으로 삼는 의료 AI 회사 OpenEvidence의 CEO","claim":"의료 초지능의 미래를 그리며, 여러 분야 전문의 집단에 대한 디지털 트윈에 가까운 그림을 제시했다.","evidence":"필자는 설득력 있는 내러티브였다고만 적었고, 제시된 근거는 옮기지 않았다."}],"cases":[],"notes":[{"term":"디지털 트윈","ko":"소프트웨어로 본뜬 쌍둥이","plain":"현실의 대상을 소프트웨어 안에 똑같이 본떠 놓은 것을 말한다. 여기서는 여러 과 전문의가 한자리에 모여 한 환자를 함께 보는 집단 자체를 AI로 흉내 낸다는 뜻이다."},{"term":"Mayo Clinic","ko":"메이요 클리닉","plain":"미국에서 가장 이름난 병원 가운데 하나로, 진단이 어려운 환자를 여러 과 전문의가 함께 보는 방식으로 유명하다. 그래서 \"AI 시대의 Mayo Clinic\"이라는 말은 어려운 문제를 여러 관점으로 함께 푸는 자리를 대신한다는 뜻이 된다."}]},{"heading_ko":"밸류 기반 케어는 버리지 말자","heading_en":"The JPMorgan 2026 Round Up","skip":null,"summary":"정부는 성과 기반 진료를 여전히 지지하지만 지금까지의 구현 방식은 작동하지 않는다고 인정한다. 비상장 기업 트랙에서는 이 분야의 열기가 확실히 식었으나, 동시에 의미 있는 규모에 이른 회사들이 나타나기 시작했다. 필자는 여기에 낙관할 이유가 있다고 본다.","insight":null,"signal":null,"author":[{"claim":"밸류 기반 케어에 낙관할 이유가 있어 보인다.","evidence":"ThymeCare가 Humana와 Aetna를 통해 종양 시장에서 2024년 1만 명에서 2025년 8만 5천 명으로 늘었고, Duly Health and Care가 오늘날 매우 수익성 있는 밸류 기반 사업을 갖고 있다고 발표한 점을 들었다."}],"experts":[{"who":"Chris Klomp","role":"메디케어를 총괄하는 정부 쪽 인사","claim":"목욕물과 함께 아이까지 버리지는 말자는 태도로, 행정부는 밸류 기반 케어를 여전히 지지하되 지금의 구현 방식은 작동하지 않는다고 보며, 행위별 수가 진료를 더 늘리는 데에는 관심이 전혀 없다.","evidence":"근거를 대지 않았다."}],"cases":[{"name":"ThymeCare","what":"종양 환자를 맡아 성과 기반 계약으로 관리하는 회사로, Humana와 Aetna 두 보험사를 통해 크게 성장했다.","scale":"관리 대상 2024년 1만 명에서 2025년 8만 5천 명","note":"성과 기반 계약의 성장을 이끄는 주체가 정부 프로그램이 아니라 특정 대형 보험사 두 곳이라는 점이 여러 발표에서 반복됐다.","sells_to":"payer"},{"name":"Duly Health and Care","what":"실적을 되돌린 사례로 언급됐으며, 오늘날 매우 수익성 있는 밸류 기반 사업을 갖고 있다고 밝혔다.","scale":"","note":"필자가 이번 컨퍼런스에서 특히 인상 깊게 본 반전 사례다.","sells_to":"payer"}],"notes":[{"term":"행위별 수가","ko":"진료 건마다 값을 매겨 지급하는 방식","plain":"진료 한 번, 검사 한 번마다 값이 정해져 있고 한 만큼 돈을 받는 방식이다. 많이 할수록 수입이 늘기 때문에 과잉 진료를 부른다는 지적을 받아 왔다. 한국 건강보험도 기본적으로 이 방식이다."},{"term":"밸류 기반 케어","ko":"성과 기반 진료","plain":"진료를 얼마나 많이 했는지가 아니라 환자의 결과와 총비용으로 값을 치르는 방식이다. 환자 집단을 맡아 1인당 정액을 받고, 입원이나 응급실 이용을 줄여 돈이 남으면 그 일부를 갖는 식이다. 취지는 좋지만 성과를 무엇으로 재고 어떻게 정산할지가 복잡해 자리 잡기 어려웠다."}]},{"heading_ko":"CMS 리더십이 내다보는 전망","heading_en":"The JPMorgan 2026 Round Up","skip":null,"summary":"이례적으로 많은 CMS 인사가 JP Morgan에 와서 발표했고, ACA와 메디케어 어드밴티지, 메디케이드에 걸쳐 여러 변화를 예고했다. 최근 몇 달의 움직임이 시작에 불과하다는 것이 필자가 받은 인상이다. 그래서 연방 정책을 해석해 주는 컨설턴트들이 특히 바빠질 것으로 본다.","insight":null,"signal":null,"author":[{"claim":"연방 정책을 헤쳐 나가는 데 전문성을 가진 컨설턴트들이 대단한 한 해를 맞을 것이다.","evidence":"조직들이 AHEAD, LEAD, Rural Transformation Project 같은 프로그램에서 기회를 이해하고 극대화하려 한다는 점을 들었다."}],"experts":[{"who":"Dr Oz","role":"CMS 소속 관계자","claim":"다른 CMS 관계자들과 함께 ACA, 메디케어 어드밴티지, 메디케이드 등 여러 분야에 걸쳐 다수의 업데이트를 전했다.","evidence":"원문은 개별 발언 내용을 옮기지 않았다."}],"cases":[],"notes":[{"term":"CMS","ko":"메디케어·메디케이드 서비스 센터","plain":"65세 이상이 받는 공보험 메디케어와 저소득층 공보험 메디케이드를 운영하는 연방 기관이다. 미국 의료비의 큰 몫이 이곳을 거쳐 나가기 때문에 여기서 규칙 하나가 바뀌면 업계 전체가 흔들린다. 한국으로 치면 보건복지부와 건강보험공단을 합쳐 놓은 자리에 가깝다."}]},{"heading_ko":"JPM 커버리지 신청 안내","heading_en":"The JPMorgan 2026 Round Up","skip":"promo","summary":"약 30건의 기업 발표를 다룬 유료 커버리지를 신청받는 안내와, 그 커버리지를 후원한 Havarti Risk에 대한 감사 인사다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"이번 주의 차트: Rock Health 2025 펀딩","heading_en":"Chart of the Week","skip":null,"summary":"Rock Health의 2025년 연말 펀딩 리포트를 소개한다. 딜 건수는 줄었는데 조달 금액은 늘었다는 것이 핵심이다. 가진 자와 못 가진 자로 갈린 한 해였다는 것이 리포트를 관통하는 주제다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Rock Health 2025 연말 펀딩 리포트","what":"디지털 헬스 투자 동향을 집계하는 기관이 한 해를 정리해 발표했다.","scale":"딜 건수 2024년 509건에서 2025년 482건으로 감소, 조달 자본은 105억 달러에서 142억 달러로 증가","note":"건수가 줄고 금액이 늘었다는 것은 소수의 큰 회사에 돈이 몰렸다는 뜻이다.","sells_to":"other"}],"notes":[]},{"heading_ko":"ACA 가입자 수","heading_en":"Other Top Headlines","skip":null,"summary":"보조금 축소로 ACA 가입이 무너질 것이라는 예측이 많았으나, 초기 수치는 그 정도는 아니었다. 다만 가입과 실제 보험료 납부는 다른 문제라서, 최종 숫자를 말하기에는 이르다는 지적이 따라붙는다. 보험사들은 이미 서류상으로만 존재하는 가입자를 걱정하고 있다.","insight":null,"signal":"소비자가 자기 돈으로 보험을 사는 시장이 예상만큼 무너지지는 않았지만, 업계가 지켜보는 다음 관문은 가입해 놓고 보험료를 내지 못해 빠져나가는 사람들이다. 미국 소비자에게 매달 나가는 보험료가 어디까지 감당 가능한지가 이 시장의 실질 경계선이라는 뜻이다. 건강 관련 유료 상품을 미국에서 붙일 때 참고할 만한 부담선이다.","author":[],"experts":[{"who":"Martin","role":"이 뉴스레터의 정책 브리핑을 쓰는 공동 필진","claim":"보험료를 내지 않는 사람들의 이탈이 얼마나 더 발생하는지 봐야 하므로 최종 가입자 수를 두고 결론을 내리기에는 이르다.","evidence":"이 분야를 가까이 추적하는 사람들의 지적을 전하는 형태로 제시했다."}],"cases":[{"name":"WSJ 보도","what":"1월 3일 기준 ACA 가입자 수를 전하며, 예측만큼의 급감은 없었다고 짚었다.","scale":"2,280만 명 가입, 작년 2,420만 명에서 약 6% 감소. 의회예산처 전망치는 1,890만 명이었다.","note":"전망치와 실측치의 차이가 커서, 앞으로의 정책 논쟁에서 양쪽이 서로 다른 숫자를 인용할 여지가 있다.","sells_to":"none"},{"name":"Modern Healthcare 보도","what":"\"유령 가입자\"를 우려하는 보험 플랜들의 이야기를 일화 수준으로 전했다.","scale":"","note":"집계된 수치가 아니라 현장의 이야기라는 점을 필자도 명시했다.","sells_to":"none"}],"notes":[{"term":"ACA","ko":"오바마케어","plain":"직장 보험도 공보험도 없는 사람이 정부가 운영하는 온라인 장터에서 민간 보험을 직접 골라 사는 제도다. 소득에 따라 보험료 보조금을 받는다. 한국처럼 전 국민이 자동으로 가입되는 제도가 없기 때문에 만들어진 장치이며, 보조금 규모가 바뀔 때마다 가입자 수가 크게 흔들린다."},{"term":"CBO","ko":"의회예산처","plain":"미국 의회에 딸린 기관으로, 정당에 속하지 않고 법안과 제도가 재정에 미칠 영향을 미리 계산해 내놓는다. 여기서 나온 숫자가 정책 논쟁의 기준선이 되는 경우가 많다."},{"term":"유령 가입자","ko":"이름만 올라 있는 가입자","plain":"서류상으로는 가입되어 있으나 보험료를 내지 않아 실제로는 보장을 받지 못하는 사람을 말한다. 보험사 입장에서는 예상 수입이 어긋나고, 정부 통계에서는 가입자 수가 실제보다 커 보인다."}]},{"heading_ko":"메디케어 어드밴티지 가입자 증가","heading_en":"Other Top Headlines","skip":null,"summary":"Alignment와 Clover가 JP Morgan 발표에 앞서 가입자 증가 수치를 내놓았다. 두 회사 모두 30~50%대의 높은 증가율을 기록했다. 다만 신규 가입자가 한꺼번에 몰리면 뒤이어 수익성 문제가 따라오는 것이 이 업계의 오랜 경험이다.","insight":null,"signal":null,"author":[{"claim":"역사적으로 신규 가입자의 유입은 뒤이은 수익성 문제와 상관관계가 있었다.","evidence":"근거를 대지 않았다. 다만 Alignment와 Clover 모두 이번에는 관리할 수 있다고 자신하는 듯하다고 덧붙였다."}],"experts":[],"cases":[{"name":"Alignment","what":"메디케어 어드밴티지 플랜을 운영하는 회사로, 1월 1일 기준 가입자 수를 발표했다.","scale":"약 275,300명, 전년 대비 31% 증가","note":"","sells_to":"other"},{"name":"Clover","what":"메디케어 어드밴티지 플랜을 운영하는 회사로, 가입자 수를 발표했다.","scale":"약 153,000명, 전년 대비 53% 증가","note":"증가율은 더 높지만 절대 규모는 Alignment의 절반 수준이다.","sells_to":"other"}],"notes":[{"term":"메디케어 어드밴티지","ko":"민간이 대신 운영하는 노인 공보험","plain":"65세 이상이 받는 공보험을 정부가 직접 운영하는 대신, 민간 보험사가 대신 맡아 운영하는 형태다. 정부가 보험사에 가입자 1인당 정액을 주고, 보험사는 그 돈 안에서 진료비를 감당하고 남기면 이익이 된다. 그래서 가입자를 많이 모으면 매출이 크게 늘지만, 예상보다 아픈 사람이 많이 들어오면 곧바로 손실로 돌아온다. 소비자가 플랜을 직접 고르되 보험료는 정부가 내는 구조다."},{"term":"Annual Enrollment Period","ko":"연간 가입 기간","plain":"해마다 정해진 기간에만 플랜을 새로 고르거나 바꿀 수 있다. 그래서 이 기간의 성적이 이듬해 회사의 매출을 사실상 결정한다."}]},{"heading_ko":"백악관의 Great Healthcare Plan","heading_en":"Other Top Headlines","skip":null,"summary":"의료비 상승, 특히 ACA에 대한 여론을 겨냥한 백악관의 발표다. 함께 나온 팩트시트에 담긴 것은 방향뿐이고 구체적인 방법은 거의 없다. 필자도 세부 내용이 부실하다고 평가한다.","insight":null,"signal":null,"author":[{"claim":"발표와 함께 나온 팩트시트는 세부 내용이 부실했다.","evidence":"약값 인하, 보험료 인하, 보험사에 대한 책임 부과, 약값 극대화 같은 중점 분야만 나열되어 있었다는 점을 들었다."}],"experts":[],"cases":[{"name":"Great Healthcare Plan","what":"백악관이 미국인의 의료비 우려를 다루기 위해 내놓은 일련의 논점이다.","scale":"","note":"중점 분야에 약값 인하와 약값 극대화가 나란히 적혀 있는데, 원문도 그대로 옮겨 놓았다.","sells_to":"none"}],"notes":[]},{"heading_ko":"OpenAI의 Torch 인수","heading_en":"Other Top Headlines","skip":null,"summary":"OpenAI가 개인 건강 기록 스타트업을 사들였다는 The Information의 보도다. 금액의 상당 부분이 직원 4명의 잔류와 묶여 있어, 제품보다 사람을 데려온 거래로 읽힌다. 소비자용 ChatGPT Health를 만들어 가는 흐름 위에 있는 움직임이다.","insight":null,"signal":null,"author":[{"claim":"이는 OpenAI가 소비자 대상 ChatGPT Health 상품을 구축해 나가는 과정에서 사실상 대규모 애퀴하이어로 보인다.","evidence":"인수 대금 약 1억 달러 중 선지급은 6천만 달러이고 나머지는 직원 4명의 잔류와 연동되어 있다는 보도 내용을 들었다."}],"experts":[],"cases":[{"name":"OpenAI의 Torch 인수","what":"개인이 자기 진료 기록을 모아 두는 개인 건강 기록 스타트업 Torch를 인수했다. Torch는 2024년 문을 닫은 Forward Health의 창업자와 전 동료 3명이 시작한 회사다.","scale":"약 1억 달러 규모의 지분, 선지급 6천만 달러, 나머지는 직원 4명 잔류와 연동","note":"소비자 건강 기록을 다루는 인력을 직접 사들일 만큼, 소비자용 AI 건강 상품에 무게가 실려 있다.","sells_to":"consumer"}],"notes":[{"term":"개인 건강 기록","ko":"개인이 직접 모아 두는 진료 기록","plain":"병원마다 흩어져 있는 진료·검사·처방 기록을 개인이 한곳에 모아 스스로 보관하는 것을 말한다. 미국은 병원과 보험사가 제각각이고 서로 기록을 잘 넘기지 않아, 자기 기록을 모으는 일
