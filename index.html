lution\": \"질문에 답하면 면허가 있는 상담사를 붙여 주고, 채팅과 음성과 영상 가운데 원하는 방식으로 상담을 받게 한다. 주 단위 구독으로 값을 미리 정해 두었고, 최근에는 보험이 적용되는 경로를 함께 열었다.\", \"price\": \"보험을 쓰지 않으면 주당 50달러에서 90달러이고 4주치를 한 번에 결제한다. 보험이 적용되면 자격이 되는 가입자가 회당 평균 23달러를 낸다.\", \"tags\": [\"온라인 상담\", \"정신건강\", \"주간 구독\", \"보험 적용\", \"상담사 매칭\"], \"headline_traction\": \"2025년 betterhelp 부문 매출은 9억 5,040만 달러였지만 1년 전보다 9% 줄었고, 유료 이용자도 5% 줄어 39만 명이 됐다.\", \"watch\": \"사이트에 걸린 성과 수치는 모두 회사가 스스로 낸 것이다. 소비자 직접 결제 매출이 계속 줄고 있으며, 2023년에는 이용자의 정신건강 정보를 광고에 넘긴 문제로 미국 연방거래위원회에서 780만 달러 제재를 받았다.\"}, \"problem\": \"미국에서 심리상담을 받으려면 두 가지 벽을 넘어야 한다. 첫째는 값이다. betterhelp가 자기 사이트에 적어 둔 바로는 보험을 쓰지 않고 대면 상담을 받을 때 회당 100달러에서 350달러가 든다. 둘째는 상담사를 찾는 일 자체다. 보험이 있어도 그 보험을 받아 주는 상담사를 직접 수소문해 예약을 잡아야 하고, 그 과정에서 몇 주가 지나가는 일이 흔하다. 한국은 정신건강의학과 진료가 건강보험 급여 대상이고 동네 의원에 그냥 가면 되지만, 미국은 상담사가 어느 보험망에 들어 있는지부터 확인해야 하므로 시작 자체가 일이 된다. 그래서 값을 미리 알 수 있고 상담사를 대신 찾아 주는 서비스에 수요가 생겼다.\", \"solution\": \"이용자는 먼저 개인 상담인지 부부 상담인지 청소년 상담인지를 고르고, 여덟 단계쯤 되는 질문에 답한다. 질문은 무엇 때문에 힘든지, 어떤 상담사를 원하는지를 묻고, 그 답을 바탕으로 회사가 상담사를 배정한다. 배정이 끝나면 상담사와 개인 대화방이 열리고, 이용자는 예약 없이 아무 때나 메시지를 남기거나 실시간 채팅, 음성 통화, 영상 통화로 상담을 받는다. 값은 보험을 쓰지 않을 경우 주당 50달러에서 90달러이며 4주치를 한 번에 결제하는 구독 방식이고, 언제든 해지할 수 있다. 2025년부터는 보험이 적용되는 경로가 생겨서, 125개가 넘는 보험 플랜의 가입자 가운데 자격이 되는 사람은 회당 평균 23달러의 본인부담금만 내고 주 1회 실시간 상담을 받는다. 다만 이 서비스의 상담사는 정식 진단을 내리거나 약을 처방할 수 없고, 법원이 명령한 상담이나 응급 상황에는 쓸 수 없다고 회사가 밝혀 두었다.\", \"features\": [{\"name\": \"설문 기반 상담사 배정\", \"detail\": \"이용자가 목적과 선호를 묻는 질문에 답하면 회사가 조건에 맞는 면허 상담사를 골라 붙여 준다. 마음에 들지 않으면 상담사를 바꿔 달라고 요청할 수 있다.\"}, {\"name\": \"네 가지 상담 방식\", \"detail\": \"메시지 주고받기, 실시간 채팅, 전화 통화, 영상 통화를 섞어 쓸 수 있다. 메시지는 예약 없이 아무 때나 보낼 수 있고 전화 상담에서는 이용자의 전화번호가 상담사에게 노출되지 않는다.\"}, {\"name\": \"보험 적용 상담\", \"detail\": \"cigna, aetna, optum, unitedhealthcare, blue cross blue shield 계열 등 125개가 넘는 보험 플랜과 연결돼 있다. 자격이 되는 가입자는 구독료 대신 회당 평균 23달러의 본인부담금을 낸다.\"}, {\"name\": \"자가 학습 자료와 단체 세미나\", \"detail\": \"상담 외에 150개가 넘는 디지털 워크시트와 학습 모듈, 주당 20회가 넘는 실시간 단체 세미나를 함께 제공한다고 회사가 밝히고 있다.\"}, {\"name\": \"대상별 형제 서비스\", \"detail\": \"부부 상담은 regain, 청소년 상담은 teen counseling이라는 별도 브랜드와 앱으로 운영한다. 수면 관리 앱 bettersleep도 같은 사업 부문에 들어 있다.\"}], \"differentiator\": \"teladoc이 연차보고서에서 직접 꼽은 경쟁자는 grow therapy, headway, rula, spring health, talkspace다. 이 가운데 headway와 grow therapy, rula는 처음부터 보험 청구를 대신 처리해 주는 방식으로 출발했고, spring health는 고용주에게 파는 회사다. betterhelp는 반대로 보험을 아예 거치지 않고 소비자에게 직접 구독을 파는 방식으로 규모를 키웠고, 그 결과 미국 소비자가 가장 많이 아는 온라인 정신건강 브랜드가 됐다. 지금 벌어지는 일은 그 차이가 뒤집히는 과정이다. betterhelp는 2025년 4월에 보험 청구가 가능한 상담 제공자 조직인 uplift를 사들여 뒤늦게 보험 경로를 붙이고 있으며, 이 점에서 원래 경쟁자들이 서 있던 자리로 옮겨 가는 중이다.\", \"team\": [{\"name\": \"fernando madeira\", \"role\": \"betterhelp 사업 부문 사장\", \"background\": \"teladoc health가 공개한 경영진 명단에서 직함만 확인했고, 이전 경력은 확인할 수 있는 자료를 찾지 못했다.\"}, {\"name\": \"chuck divita\", \"role\": \"모회사 teladoc health 최고경영자\", \"background\": \"실적 발표 자료에서 직함만 확인했고, 이전 경력은 확인할 수 있는 자료를 찾지 못했다.\"}], \"traction\": [{\"type\": \"revenue\", \"detail\": \"2025년 한 해 betterhelp 부문 매출이 9억 5,040만 달러였고, 1년 전보다 9% 줄었다.\", \"when\": \"2026-02\", \"source\": \"teladoc health 2025년 4분기 및 연간 실적 발표 자료\"}, {\"type\": \"customers\", \"detail\": \"2025년 유료 이용자가 5% 줄어 39만 명이 됐다고 연차보고서에 적었다.\", \"when\": \"2026-02\", \"source\": \"teladoc health 2025 회계연도 10-k\"}, {\"type\": \"revenue\", \"detail\": \"2026년 2분기 부문 매출은 2억 1,260만 달러로 1년 전보다 12% 줄었고, 조정 영업이익률은 0.2%까지 내려갔다. 회사는 2026년 연간 부문 매출이 12.7%에서 19.0%까지 줄어들 것으로 전망을 낮췄다.\", \"when\": \"2026-07\", \"source\": \"teladoc health 2026년 2분기 실적 발표 자료\"}, {\"type\": \"partnership\", \"detail\": \"125개가 넘는 보험 플랜과 계약을 맺어 보험 적용 상담을 시작했고, 2026년 2분기에는 전국 확대 일정을 계획보다 앞당겼다.\", \"when\": \"2026-07\", \"source\": \"betterhelp 보험 안내 페이지와 teladoc health 2026년 2분기 실적 발표 자료\"}, {\"type\": \"funding\", \"detail\": \"teladoc이 2015년 1월 23일에 betterhelp의 법인 compile, inc.를 인수했다. 인수 대금은 현금 330만 달러와 3년치 순매출의 15%를 주는 성과 연동 대금, 그리고 100만 달러짜리 약속어음이었다.\", \"when\": \"2015-01\", \"source\": \"teladoc 2015년 3분기 분기보고서 10-q\"}, {\"type\": \"funding\", \"detail\": \"2025년 4월 30일에 보험 청구가 가능한 상담 제공자 조직 uplift health technologies를 현금 2,960만 달러에 사들였고, 목표 달성에 따라 1,270만 달러를 더 주기로 했다. uplift의 실적은 betterhelp 부문에 합산된다.\", \"when\": \"2025-04\", \"source\": \"teladoc health 2025 회계연도 10-k\"}, {\"type\": \"regulatory\", \"detail\": \"2023년 3월 2일 미국 연방거래위원회가 이용자의 정신건강 정보를 facebook과 snapchat 등에 광고 목적으로 넘긴 행위를 문제 삼아 780만 달러를 물리고, 건강 정보를 광고에 넘기는 행위를 금지했다.\", \"when\": \"2023-03\", \"source\": \"미국 연방거래위원회 보도자료\"}, {\"type\": \"traffic\", \"detail\": \"미국 애플 앱스토어에서 별점 4.8에 평가 149,348건이고 건강 및 피트니스 부문 63위이며, 구글 플레이에서는 별점 4.6에 후기 6만 5,300건, 내려받기 100만 회 이상이다.\", \"when\": \"2026-09\", \"source\": \"애플 앱스토어와 구글 플레이 페이지\"}], \"caveats\": \"이 회사를 볼 때 수치의 출처를 나누어 읽어야 한다. 매출과 이용자 수, 인수 금액은 teladoc이 미국 증권거래위원회에 낸 공시 자료에서 직접 확인한 것이므로 회계감사를 거친 숫자다. 반면 상담사 31,582명, 도움받은 사람 666만 명, 12주 만에 증상이 줄어든 이용자 72%, 상담사 매칭 선호 반영률 93% 같은 수치는 모두 betterhelp가 자기 사이트에 올린 것이고 제삼자가 확인한 것이 아니다.\\n\\n뉴스레터에 실린 '회원의 80%가 비용 때문에 현금 결제를 그만둔다'는 대목도 회사가 밝힌 내용을 전한 것이며, 공시 자료에서 같은 문장을 찾지는 못했다. 다만 방향은 공시로 뒷받침된다. 유료 이용자는 2025년에 5% 줄어 39만 명이 됐고, 부문 매출은 2025년에 9% 줄어든 데 이어 2026년 2분기에는 12% 줄었으며, 회사는 2026년 연간 감소폭 전망을 12.7%에서 19.0%까지로 낮췄다. 2026년 2분기 발표에서는 현금 결제 매출 감소가 5월 말부터 예상보다 빨라졌고, 보험 적용 상담 수요는 상담사 공급을 넘어서서 그 수요를 매출로 바꾸지 못했다고 밝혔다.\\n\\n값도 페이지마다 다르게 적혀 있다. 첫 화면과 자주 묻는 질문 페이지는 주당 50달러에서 90달러라고 적었는데, 보험 안내 페이지는 같은 구독을 주당 70달러에서 100달러라고 적었다. 환불 규모도 눈여겨볼 대목으로, 2025년 한 해 환불액이 4,990만 달러였고 2023년에는 9,300만 달러였다.\\n\\n규제 이력도 있다. 2023년 연방거래위원회 제재는 이용자가 회원 가입 과정에서 적어 낸 정신건강 관련 답변을 광고 목적으로 넘긴 행위를 문제 삼은 것이었다. 지금도 애플 앱스토어의 개인정보 항목에는 이 앱이 위치와 사용 기록을 추적 목적으로 수집하고, 건강 및 피트니스 정보와 민감 정보를 이용자 신원에 연결한다고 표시돼 있다.\", \"for_us\": \"첫째로 가져갈 것은 이탈의 원인이 효과가 아니라 값이라는 사실이다. 미국에서 정신건강에 자기 돈을 쓰는 사람이 분명히 있는데도 그 지출이 오래 이어지지 않는다. 상담을 그만둔 사람에게는 대신 쓸 도구가 남지 않으므로, 무료로 쓸 수 있는 기분 기록과 주간 정리 화면은 3개월 안에 소프트웨어만으로 만들 수 있으면서 지금 우리 앱에 없는 가치가 된다. 걸음 수와 수면을 이미 가지고 있다는 점이 여기서 유리하게 작용한다.\\n\\n둘째는 온보딩 구조다. betterhelp는 첫 화면에서 개인, 부부, 청소년 가운데 하나를 고르게 하고 여덟 단계 남짓한 질문으로 이어 간다. 값을 묻기 전에 사람을 분류하는 이 구조는 상담이 아니어도 그대로 쓸 수 있다.\\n\\n셋째는 하지 말아야 할 선이다. betterhelp조차 진단과 처방, 법원 명령 상담, 응급 상황을 명시적으로 제외하고 있다. 우리가 정서 관련 기능을 붙일 때 진단이나 치료를 표방하지 않고 기록과 되돌아보기에 머무르면 규제 부담을 피할 수 있다는 근거가 된다.\\n\\n넷째는 데이터 취급이다. 2023년 제재는 회원 가입 설문의 답변을 광고에 넘긴 행위에서 나왔다. 우리 앱은 광고로 매출을 내고 있으므로, 건강 관련 입력값이 광고 도구에 닿는 경로가 하나라도 있으면 같은 위험에 걸린다. 미국 진출 전에 광고 sdk와 건강 데이터의 분리를 먼저 확인해야 한다.\", \"screenshots\": [{\"file\": \"betterhelp_home.png\", \"caption\": \"첫 화면이다. 값이나 기능을 설명하기 전에 개인, 부부, 청소년 가운데 어떤 상담을 찾는지부터 고르게 한다.\", \"from\": \"https://www.betterhelp.com/\"}, {\"file\": \"betterhelp_getstarted.png\", \"caption\": \"가입 첫 단계다. 상단에 여덟 칸짜리 진행 막대가 있고, 상담사를 배정하기 위한 질문이 이어진다.\", \"from\": \"https://www.betterhelp.com/get-started/\"}, {\"file\": \"betterhelp_insurance.png\", \"caption\": \"보험 안내 페이지다. 125개가 넘는 보험 플랜과 연결돼 있고 자격이 되면 회당 평균 23달러를 낸다는 안내, 보험과 구독과 대면 상담의 값을 나란히 비교한 표가 들어 있다.\", \"from\": \"https://www.betterhelp.com/insurance/\"}, {\"file\": \"betterhelp_ios.png\", \"caption\": \"미국 애플 앱스토어 페이지다. 별점 4.8에 평가 149,000건이고 건강 및 피트니스 부문 63위이며, 판매자 이름이 인수 전 법인명인 compile, inc.로 남아 있다.\", \"from\": \"https://apps.apple.com/us/app/betterhelp-therapy/id995252384\"}], \"sources\": [{\"title\": \"betterhelp 첫 화면과 자주 묻는 질문 페이지\", \"url\": \"https://www.betterhelp.com/faq/\", \"note\": \"주당 50달러에서 90달러라는 값과 4주 단위 결제, 네 가지 상담 방식, 언제든 해지 가능하다는 조건, 진단과 처방과 법원 명령 상담을 할 수 없다는 제한, 상담사 31,582명과 도움받은 사람 666만 명이라는 수치를 확인했다.\"}, {\"title\": \"betterhelp 보험 안내 페이지\", \"url\": \"https://www.betterhelp.com/insurance/\", \"note\": \"125개가 넘는 보험 플랜, 회당 평균 23달러 본인부담금, 보험사 목록, 대면 상담 회당 100달러에서 350달러라는 비교 값, 주당 70달러에서 100달러라는 다른 구독 값, 12주 증상 감소 72%를 비롯한 회사 자체 통계를 확인했다.\"}, {\"title\": \"teladoc health 2025년 4분기 및 연간 실적 발표 자료\", \"url\": \"https://www.sec.gov/archives/edgar/data/1477449/000147744926000010/tdoc-20251231xexx991.htm\", \"note\": \"2025년 betterhelp 부문 매출 9억 5,040만 달러와 9% 감소, 4분기 2억 3,320만 달러와 7% 감소를 확인했다.\"}, {\"title\": \"teladoc health 2026년 2분기 실적 발표 자료\", \"url\": \"https://www.sec.gov/archives/edgar/data/1477449/000147744926000036/tdoc-20260630xexx991.htm\", \"note\": \"2분기 부문 매출 2억 1,260만 달러와 12% 감소, 조정 영업이익률 0.2%, 5월 말부터 현금 결제 매출 감소가 빨라졌다는 설명, 보험 수요가 상담사 공급을 넘어섰다는 설명, 전국 확대를 앞당겼다는 내용, 2026년 연간 전망 하향을 확인했다.\"}, {\"title\": \"teladoc health 2025 회계연도 연차보고서 10-k\", \"url\": \"https://www.sec.gov/archives/edgar/data/1477449/000147744926000012/tdoc-20251231.htm\", \"note\": \"유료 이용자 39만 명과 5% 감소, 2025년 환불액 4,990만 달러, uplift 인수 금액과 날짜, 경쟁사 목록, betterhelp 이용자의 절반 가까이가 상담을 처음 받는다는 설명, 보험 전환이 매출과 이익률을 낮출 수 있다는 위험 고지를 확인했다.\"}, {\"title\": \"teladoc 2015년 3분기 분기보고서 10-q\", \"url\": \"https://www.sec.gov/archives/edgar/data/1477449/000155837015002122/tdoc-20150930x10q.htm\", \"note\": \"2015년 1월 23일 인수 사실과 현금 330만 달러, 3년치 순매출 15% 성과 연동 대금, 100만 달러 약속어음이라는 조건, betterhelp의 법인명이 compile, inc.라는 사실을 확인했다.\"}, {\"title\": \"미국 연방거래위원회 betterhelp 제재 보도자료\", \"url\": \"https://www.ftc.gov/news-events/news/press-releases/2023/03/ftc-ban-betterhelp-revealing-consumers-data-including-sensitive-mental-health-information-facebook\", \"note\": \"2023년 3월 2일 제재 사실, 780만 달러 금액, 환불 대상 기간, 건강 정보를 광고에 넘기지 못하도록 한 금지 명령을 확인했다.\"}, {\"title\": \"teladoc health 경영진 소개 페이지\", \"url\": \"https://teladochealth.com/leadership/\", \"note\": \"betterhelp 사업 부문 사장 fernando madeira와 최고경영자 chuck divita의 직함을 확인했다.\"}, {\"title\": \"애플 앱스토어 betterhelp 페이지\", \"url\": \"https://apps.apple.com/us/app/betterhelp-therapy/id995252384\", \"note\": \"별점 4.8과 평가 149,348건, 건강 및 피트니스 부문 63위, 판매자 compile, inc., 2026년 8월 26일 올라온 23.1 버전, 위치와 건강 정보를 수집한다는 개인정보 표시를 확인했다.\"}, {\"title\": \"구글 플레이 betterhelp 페이지\", \"url\": \"https://play.google.com/store/apps/details?id=com.betterhelp\", \"note\": \"별점 4.6, 후기 6만 5,300건, 내려받기 100만 회 이상을 확인했다.\"}]}"},{"slug":"claimable","name":"Claimable","one_liner":"미국 건강보험사가 지급을 거절한 약값과 진료비에 대해, 환자 이름으로 낼 이의 제기 서류를 인공지능이 작성하고 우편과 팩스 발송까지 대신 처리해 주는 회사다.","sells_to":"mixed","seen_in":[{"issue":"36","section":27,"headline":"블룸버그가 다룬 회사로 소개되면서, Mark Cuban 등에게서 1,000만 달러를 조달했고 환자가 이의 제기 한 건당 50달러를 낸다는 대목이 나왔다. 필자는 그 가격으로는 벤처 투자 셈법이 성립하지 않으며 회사가 제약사 계약으로 돈줄을 옮기고 있다고 지적했다."}],"card":{"problem":"미국 보험사는 의사가 처방한 약과 치료도 지급을 거절하는 일이 흔하고, 보험에 가입한 성인 다섯 명 가운데 한 명이 거절을 겪는다. 다시 판단해 달라고 요구할 권리가 법으로 보장돼 있는데도 실제로 이의를 제기하는 사람은 1%에 미치지 못한다.","solution":"거절 통지서와 보험 정보를 올리고 몇 가지 질문에 답하면, 인공지능이 임상 연구와 그 보험사의 보장 규정, 환자 본인의 병력을 엮어 이의 제기 서류를 만들어 준다. 환자가 확인하고 승인하면 회사가 인쇄해서 우편과 팩스로 대신 보내고 이후 일정까지 관리한다.","price":"이의 제기 1건당 39.95달러에 발송비를 더해 내며, 제약사나 의료기관이 후원하는 약이면 환자가 내는 돈이 없다.","tags":["보험 거절","이의 제기","AI 서류작성","건당 정액","제약사 후원"],"headline_traction":"2026년 4월 블룸버그 보도 기준으로 Mark Cuban 등에게서 1,000만 달러를 조달했고, 회사는 거절됐던 진료비 3,000만 달러 이상을 환자 대신 되찾았다고 밝힌다.","watch":"성공률 80%와 회수액 3,000만 달러는 모두 회사가 스스로 낸 수치이고 제삼자가 검증한 자료를 찾지 못했다. 환자가 내는 39.95달러 대신 제약사가 비용을 대는 쪽으로 옮겨 가고 있어서, 어떤 약의 거절에 힘을 쏟을지가 그 약을 파는 회사의 이해관계와 맞물릴 수 있다."},"screenshots":[{"file":"claimable_home.png","caption":"첫 화면이다. 이의 제기를 시작하라는 버튼과 함께, 다섯 명 가운데 한 명이 거절을 겪고 1%도 이의를 제기하지 않으며 자사 성공률은 80%가 넘는다는 세 숫자를 나란히 내건다.","from":"https://www.getclaimable.com/"},{"file":"claimable_pharma.png","caption":"제약사용 페이지다. 거절률이 올라가면 약을 계속 쓰는 환자가 줄어든다는 문제 제기로 시작해, 거절을 더 많이 뒤집고 치료 중단을 줄인다는 문구로 제약사에 판다.","from":"https://www.getclaimable.com/for-pharma"},{"file":"claimable_providers.png","caption":"의사와 병원용 페이지다. 병원이 내는 이의 제기를 대체하는 것이 아니라, 환자가 자기 이름으로 한 번 더 내도록 돕는 구조라고 설명한다.","from":"https://www.getclaimable.com/for-providers"}],"q":"{\"slug\": \"claimable\", \"name\": \"claimable\", \"one_liner\": \"미국 건강보험사가 지급을 거절한 약값과 진료비에 대해, 환자 이름으로 낼 이의 제기 서류를 인공지능이 작성하고 우편과 팩스 발송까지 대신 처리해 주는 회사다.\", \"site\": \"https://www.getclaimable.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"36\", \"section\": 27, \"headline\": \"블룸버그가 다룬 회사로 소개되면서, mark cuban 등에게서 1,000만 달러를 조달했고 환자가 이의 제기 한 건당 50달러를 낸다는 대목이 나왔다. 필자는 그 가격으로는 벤처 투자 셈법이 성립하지 않으며 회사가 제약사 계약으로 돈줄을 옮기고 있다고 지적했다.\"}], \"card\": {\"problem\": \"미국 보험사는 의사가 처방한 약과 치료도 지급을 거절하는 일이 흔하고, 보험에 가입한 성인 다섯 명 가운데 한 명이 거절을 겪는다. 다시 판단해 달라고 요구할 권리가 법으로 보장돼 있는데도 실제로 이의를 제기하는 사람은 1%에 미치지 못한다.\", \"solution\": \"거절 통지서와 보험 정보를 올리고 몇 가지 질문에 답하면, 인공지능이 임상 연구와 그 보험사의 보장 규정, 환자 본인의 병력을 엮어 이의 제기 서류를 만들어 준다. 환자가 확인하고 승인하면 회사가 인쇄해서 우편과 팩스로 대신 보내고 이후 일정까지 관리한다.\", \"price\": \"이의 제기 1건당 39.95달러에 발송비를 더해 내며, 제약사나 의료기관이 후원하는 약이면 환자가 내는 돈이 없다.\", \"tags\": [\"보험 거절\", \"이의 제기\", \"ai 서류작성\", \"건당 정액\", \"제약사 후원\"], \"headline_traction\": \"2026년 4월 블룸버그 보도 기준으로 mark cuban 등에게서 1,000만 달러를 조달했고, 회사는 거절됐던 진료비 3,000만 달러 이상을 환자 대신 되찾았다고 밝힌다.\", \"watch\": \"성공률 80%와 회수액 3,000만 달러는 모두 회사가 스스로 낸 수치이고 제삼자가 검증한 자료를 찾지 못했다. 환자가 내는 39.95달러 대신 제약사가 비용을 대는 쪽으로 옮겨 가고 있어서, 어떤 약의 거절에 힘을 쏟을지가 그 약을 파는 회사의 이해관계와 맞물릴 수 있다.\"}, \"problem\": \"미국에서는 의사가 처방한 약이라도 보험사가 지급을 거절하는 일이 흔하다. claimable은 미국에서 해마다 8억 5,000만 건의 청구가 거절된다고 밝히고, 보험에 가입한 성인 다섯 명 가운데 한 명이 거절을 겪는다고 적는다. 거절 통지를 받은 환자에게는 다시 판단해 달라고 요구할 권리가 법으로 보장되지만, 실제로 이의를 제기하는 사람은 1%에 미치지 못한다. 제출 기한이 정해져 있고, 임상 연구와 보험사가 스스로 공개한 보장 규정을 인용해 반박해야 하며, 1차 거절 뒤에도 2차와 3차 심사가 이어지기 때문이다. 회사 설명으로는 전문 대리인이나 경험 많은 환자도 서류 한 건을 만드는 데 15시간에서 100시간까지 쓴다. 여기에 걸린 돈이 크다. 블룸버그가 소개한 환자는 크론병 때문에 12세부터 맞아 온 remicade를 보험이 바꾸자 거절당했는데, 이 약은 한 해에 수만 달러가 든다. 한국은 건강보험이 진료비를 자동으로 처리하므로 개인이 이런 서류 절차를 밟을 일이 거의 없고, 그래서 이 문제 자체가 미국에서만 사업으로 성립한다.\", \"solution\": \"환자는 보험사가 보낸 거절 통지서와 보험 정보를 올리는 것으로 시작한다. 다음으로 자신의 건강 상태와 거절에 이르기까지의 경과를 묻는 질문에 답한다. 그러면 회사의 인공지능이 그 약을 뒷받침하는 임상 연구, 해당 보험사가 공개한 보장 규정, 환자가 적어 낸 개인 사정을 엮어 이의 제기 서류를 작성한다. 완성된 서류는 환자가 직접 읽고 승인한 뒤에야 나가며, 인쇄와 우편, 팩스 발송, 어디로 보낼지 정하는 일, 회신이 늦어질 때의 대응까지 회사가 맡는다. 값은 1건당 39.95달러에 발송비를 더한 금액이고, 성공했을 때 따로 떼는 성공 보수는 없다. 다만 제약사나 의료기관이 후원하는 약이면 환자가 내는 돈이 0달러가 되는데, 회사 이용약관은 요금을 면제하는 경우로 의료기관이나 제약사의 후원을 직접 명시한다. 미국 앱스토어에서 claimable이 낸 소비자용 앱은 찾지 못했고, 모든 절차는 웹에서 이뤄진다.\", \"features\": [{\"name\": \"거절 통지서 판독\", \"detail\": \"환자가 올린 거절 통지서와 보험 정보를 읽어, 보험사가 어떤 사유로 거절했고 어떤 규정을 근거로 삼았는지를 뽑아낸다.\"}, {\"name\": \"근거 검색 후 인용\", \"detail\": \"일반 지식으로 문장을 짓지 않고, 임상 연구와 치료 지침, 보험사별 보장 규정, 연방법과 주법, 과거 이의 제기 결과를 모아 둔 자체 자료에서 근거를 찾아 인용한다. 회사는 이 방식을 검색 증강 생성이라고 부른다.\"}, {\"name\": \"사람이 설계하고 검수하는 절차\", \"detail\": \"약과 질환마다 어떤 논리로 다툴지는 임상과 이의 제기 전문가가 미리 설계해 두고, 인공지능이 만든 초안은 열 가지가 넘는 평가 기준을 통과해야 한다. 최종 서류는 환자가 확인하고 승인한 뒤에 제출된다.\"}, {\"name\": \"발송 대행과 일정 관리\", \"detail\": \"어느 부서로 보내야 하는지 수신처를 제안하고, 우편과 팩스로 대신 보내며 발송 기록을 남긴다. 긴급한 사안이면 긴급 심사를 요청하고, 회신 기한이 지나면 무엇을 해야 하는지 알려 준다.\"}, {\"name\": \"지원 범위를 약 단위로 한정\", \"detail\": \"85종이 넘는 약을 지원하며, 천식, glp-1 계열(비만과 2형 당뇨), 편두통, 류마티스와 자가면역, pans/pandas, 아토피 피부염 영역을 다룬다. 서류 누락이나 행정 착오로 인한 거절은 다루지 않고, 그런 건은 의사와 함께 다시 제출하는 편이 낫다고 안내한다.\"}, {\"name\": \"제약사와 병원을 상대로 하는 기업용 상품\", \"detail\": \"제약사, 병원, 전문 약국에 같은 기능을 묶어 판다. 보험사별, 주별, 약별, 거절 사유별로 거절 현황을 보여 주는 대시보드를 함께 준다. 회사는 이 상품을 2026년 4월에 공식 발표했다.\"}], \"differentiator\": \"회사가 스스로 견주는 대상은 변호사와 전문 환자 대리인이다. 이들에게 맡기면 비용이 크고 한 건에 수십 시간이 걸리는데, claimable은 성공 보수 없이 건당 39.95달러 정액만 받고 작성 시간을 몇 분으로 줄인다고 말한다. 더 중요한 차별점은 서류를 의사 이름이 아니라 환자 이름으로 낸다는 점이다. 환자가 내는 이의 제기에는 법이 정한 회신 기한과 외부 독립 심사를 요구할 권리가 함께 걸리기 때문에, 의사나 병원이 내는 것보다 강제력이 크다는 것이 회사의 설명이다. 그래서 의사 쪽 사전승인 업무를 대행하는 회사들과는 겨루는 자리가 아니라, 병원이 하던 이의 제기를 환자 쪽에서 한 번 더 거는 구조를 만든다. 다만 인공지능으로 이의 제기 서류를 만든다는 방식 자체가 기술적으로 독점적이라고 볼 근거는 이번 조사에서 찾지 못했다.\", \"team\": [{\"name\": \"warris bokhari\", \"role\": \"공동창업자 겸 ceo\", \"background\": \"영국 국가보건서비스(nhs)에서 일한 의사이며, ge, apple health, anthem, amazon에서 15년 넘게 의료 전략과 혁신을 맡았다고 회사가 소개한다. time은 그가 미국 대형 보험사에서 일하다가 이 문제를 발견했다고 적었고, 2026년 time100 health 명단에 올렸다.\"}, {\"name\": \"zach veigulis\", \"role\": \"공동창업자 겸 최고인공지능책임자\", \"background\": \"미국 재향군인부 산하 협력의료혁신센터에서 수석 데이터 과학자로 일했고, 의료 데이터 과학 경력이 10년을 넘는다. 논문 인용이 150회가 넘는 연구자라고 회사가 소개한다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"mark cuban 등에게서 1,000만 달러를 조달했다.\", \"when\": \"2026-04\", \"source\": \"블룸버그 john tozzi 기사와 이를 인용한 뉴스레터 36회차. 기사 본문이 유료라 투자자 명단과 라운드 종류는 직접 확인하지 못했다.\"}, {\"type\": \"customers\", \"detail\": \"거절됐던 진료비 3,000만 달러 이상을 환자를 대신해 되찾았다고 회사가 밝힌다.\", \"when\": \"2026-04\", \"source\": \"회사 보도자료와 time100 health 소개글\"}, {\"type\": \"customers\", \"detail\": \"제약사와 병원 쪽 프로그램 10곳에서 서비스가 돌아가고 있으며, 그 프로그램이 다루는 치료제를 쓰는 환자가 전국에 100만 명이 넘는다고 회사가 밝힌다. 회사가 대상으로 삼는 프로그램에서는 최초 거절률이 70%에 이르는 경우도 있다고 적었다.\", \"when\": \"2026-04\", \"source\": \"회사 보도자료 '기업용 환자 접근 플랫폼 공개'\"}, {\"type\": \"partnership\", \"detail\": \"제약사, 병원, 전문 약국을 상대로 하는 기업용 상품을 공식 발표했다. 이용약관에는 제약사나 의료기관이 후원하면 환자 요금을 면제한다고 적혀 있다.\", \"when\": \"2026-04\", \"source\": \"회사 사이트 for-pharma 페이지와 이용약관\"}, {\"type\": \"award\", \"detail\": \"창업자 warris bokhari가 time의 2026년 time100 health 명단에 올랐다.\", \"when\": \"2026-02\", \"source\": \"time\"}, {\"type\": \"award\", \"detail\": \"fierce healthcare가 뽑은 2026년 fierce 15에 선정됐고, fast company의 2025년 world changing ideas에도 선정됐다.\", \"when\": \"2026-03\", \"source\": \"회사 소개 페이지와 fierce healthcare\"}], \"caveats\": \"성공률 80%, 열흘 안에 결과가 나온다는 것, 되찾은 금액 3,000만 달러, 의뢰받은 환자의 70%가 이의 제기를 끝까지 낸다는 것은 모두 회사가 스스로 낸 수치이며, 제삼자가 검증한 자료는 찾지 못했다. 회사가 같은 화면에서 인용하는 외부 연구는 이의 제기의 절반 이상이 성공한다고 적는데, 80%가 그보다 높은 값인 이유와 비교 기준이 같은지는 공개돼 있지 않다. 애초에 이길 만한 사건만 받는지도 확인할 수 없다. 값도 자료마다 다르다. 회사 사이트는 1건당 39.95달러에 발송비를 더한 금액이라고 적고, time과 뉴스레터는 약 50달러라고 적는다. 창업 시점도 어긋난다. 회사 블로그의 서비스 출시 발표는 2024년 9월 29일이고 time은 2024년 창업이라고 적었는데, 블룸버그는 2026년 4월 기사에서 3년 전에 공동창업했다고 적었다. inc.의 2026년 female founders 500 수상자로 alicia graham이 회사 소개 페이지에 걸려 있으나, 그 페이지에 직함이 없어 어떤 역할을 맡고 있는지 확인하지 못했다. 사업 구조에서 가장 눈여겨볼 대목은 돈을 내는 쪽이 환자에서 제약사로 옮겨 가는 중이라는 점이다. 이용약관은 제약사가 후원하면 환자 요금을 면제한다고 명시하고, 제약사용 페이지는 '치료 중단을 줄인다'와 '지원 프로그램 규모를 키운다'를 판매 문구로 내건다. 제약사 입장에서 이의 제기는 자사 약을 계속 쓰게 만드는 수단이므로, 어느 약의 거절에 힘을 쏟을지가 그 약을 파는 회사의 이해관계와 맞물릴 수 있다. 뉴스레터 필자도 같은 지점을 짚으면서, 환자에게 받는 건당 50달러로는 벤처 투자 셈법이 서지 않으니 이 전환이 사업으로는 합리적이지만 투자자 mark cuban이 그동안 보여 온 모습과는 어울리지 않는다고 적었다.\", \"for_us\": \"이 회사가 증명한 것은 미국 사용자가 보험 거절 앞에서 자기 돈을 낼 만큼 곤란을 겪는다는 사실이다. 다만 서류 작성 자체를 그대로 따라 만들기는 어렵다. 임상 연구와 보험사별 보장 규정을 모아 둔 자료, 우편과 팩스 발송 대행, 개인 건강정보를 다루는 체계가 함께 있어야 하기 때문에 3개월 안에 소프트웨어 인력만으로는 재현되지 않는다. 대신 그 앞단은 앱 화면 안에서 만들 수 있다. 거절 통지서를 찍어 올리면 어떤 사유로 거절됐는지, 이의 제기 기한이 며칠 남았는지, 다음에 무엇을 준비해야 하는지를 읽어 주는 정도다. claimable이 스스로 다루지 않겠다고 밝힌 영역, 곧 서류 누락과 행정 착오로 인한 거절이 오히려 이런 안내만으로 풀리는 자리다. claimable이 건당 39.95달러를 받는 일을 무료로 붙여 두면 리워드 앱이 앱을 열 이유를 하나 더 갖게 된다. 실제 작업의 절반은 기능 구현이 아니라 문구를 다듬는 일이다. claimable조차 자사 도구를 두고 '행정과 법률 절차를 돕는 도구이며 진단하거나 치료를 권하지 않고 의사의 판단을 대신하지 않는다'고 못박아 둔다. 같은 선을 우리도 그어야 하고, 개인 건강정보를 어디까지 받을지도 함께 정해야 한다.\", \"screenshots\": [{\"file\": \"claimable_home.png\", \"caption\": \"첫 화면이다. 이의 제기를 시작하라는 버튼과 함께, 다섯 명 가운데 한 명이 거절을 겪고 1%도 이의를 제기하지 않으며 자사 성공률은 80%가 넘는다는 세 숫자를 나란히 내건다.\", \"from\": \"https://www.getclaimable.com/\"}, {\"file\": \"claimable_pharma.png\", \"caption\": \"제약사용 페이지다. 거절률이 올라가면 약을 계속 쓰는 환자가 줄어든다는 문제 제기로 시작해, 거절을 더 많이 뒤집고 치료 중단을 줄인다는 문구로 제약사에 판다.\", \"from\": \"https://www.getclaimable.com/for-pharma\"}, {\"file\": \"claimable_providers.png\", \"caption\": \"의사와 병원용 페이지다. 병원이 내는 이의 제기를 대체하는 것이 아니라, 환자가 자기 이름으로 한 번 더 내도록 돕는 구조라고 설명한다.\", \"from\": \"https://www.getclaimable.com/for-providers\"}, {\"file\": \"claimable_glp1.png\", \"caption\": \"glp-1 계열 비만 치료제 거절을 다루는 페이지다. 약 이름 단위로 별도 페이지를 두고 그 약에 맞는 이의 제기를 안내한다.\", \"from\": \"https://www.getclaimable.com/glp-1-appeals\"}], \"sources\": [{\"title\": \"claimable 공식 홈페이지\", \"url\": \"https://www.getclaimable.com/\", \"note\": \"값(1건당 39.95달러에 발송비), 4단계 이용 흐름, 지원하는 85종이 넘는 약과 여섯 개 질환 영역, 자주 묻는 질문에 실린 성공률과 심사 기한 설명을 확인했다.\"}, {\"title\": \"claimable 회사 소개 페이지\", \"url\": \"https://www.getclaimable.com/about-us\", \"note\": \"공동창업자 두 사람의 이름과 직함, 경력, 수상 실적을 확인했다.\"}, {\"title\": \"claimable 제약사용 페이지\", \"url\": \"https://www.getclaimable.com/for-pharma\", \"note\": \"제약사에게 무엇을 파는지, 제약사가 후원하면 환자에게 무료가 된다는 설명, 거절 현황 대시보드 제공 내용을 확인했다.\"}, {\"title\": \"claimable 의사와 병원용 페이지\", \"url\": \"https://www.getclaimable.com/for-providers\", \"note\": \"환자 이름으로 내는 이의 제기가 병원이 내는 것과 어떻게 다른지, 병원과 어떤 방식으로 협업하는지를 확인했다.\"}, {\"title\": \"claimable 이용약관\", \"url\": \"https://www.getclaimable.com/terms-of-service\", \"note\": \"의료기관이나 제약사가 후원하는 경우 이의 제기 요금을 면제한다는 조항과, 이의 제기가 실패해도 환불하지 않는다는 조항을 확인했다.\"}, {\"title\": \"claimable의 인공지능이 환자를 위해 작동하는 방식\", \"url\": \"https://www.getclaimable.com/post/how-claimables-ai-works-for-patients\", \"note\": \"어떤 자료를 근거로 서류를 만드는지, 사람이 어디까지 개입하는지, 진단이나 치료 권고를 하지 않는다는 선 긋기를 확인했다.\"}, {\"title\": \"claimable, 인공지능 기업용 환자 접근 플랫폼 공개\", \"url\": \"https://www.getclaimable.com/post/claimable-debuts-ai-powered-enterprise-patient-access-platform\", \"note\": \"2026년 4월 기업용 상품 발표문이다. 성공률 80%, 회수액 3,000만 달러, 프로그램 10곳, 환자 100만 명 등 회사가 밝힌 수치의 출처다.\"}, {\"title\": \"claimable 서비스 출시 발표\", \"url\": \"https://www.getclaimable.com/post/introducing-claimable\", \"note\": \"2024년 9월 29일 출시와 초기 지원 범위를 확인했다.\"}, {\"title\": \"ai startup has helped reverse thousands of denied health insurance claims (bloomberg)\", \"url\": \"https://www.bloomberg.com/news/features/2026-04-22/ai-and-mark-cuban-among-startup-s-tools-to-fight-denied-health-care-claims\", \"note\": \"뉴스레터가 인용한 원 기사다. 유료 기사여서 앞부분만 확인했고, remicade를 거절당한 환자 사례와 창업자 소개까지만 읽었다.\"}, {\"title\": \"warris bokhari (time100 health 2026)\", \"url\": \"https://time.com/collections/time100-health-2026/7362601/warris-bokhari/\", \"note\": \"해마다 8억 5,000만 건이 거절되고 이의 제기 비율이 1% 미만이라는 수치, 건당 약 50달러, 성공률 80%, 회수액 3,000만 달러 이상을 확인했다.\"}, {\"title\": \"미국 앱스토어 검색\", \"url\": \"https://itunes.apple.com/search?term=claimable&entity=software&country=us\", \"note\": \"claimable이 낸 소비자용 앱이 없다는 사실을 확인했다.\"}]}"},{"slug":"doctronic","name":"Doctronic","one_liner":"증상을 적으면 AI가 무료로 진단과 치료 계획을 내주고, 처방전이 필요해지는 순간에만 39달러짜리 면허 의사 화상 진료를 파는 소비자용 서비스다.","sells_to":"mixed","seen_in":[{"issue":"26","section":15,"headline":"AI가 진료 상담을 맡는 서비스가 12개월도 안 되어 세 번째 라운드로 4,000만 달러를 받았고, 필자는 공개 수치를 역산해 주간 방문자 30만 명 가운데 2%도 유료 진료로 넘어가지 않는다고 짚었다."}],"card":{"problem":"미국에서는 보험이 없거나 있어도 비용 때문에 진료를 미루는 사람이 많아서, 지금 겪는 증상이 병원에 갈 일인지 판단하는 단계부터 돈이 든다.","solution":"가입도 로그인도 없이 익명으로 증상을 물어보는 무료 AI 상담을 열어 두고 상담마다 진료 기록 형식의 문서를 만들어 주며, 처방전이나 검사 의뢰처럼 사람 의사가 필요해지는 순간에만 화상 진료를 유료로 판다.","price":"AI 상담은 횟수 제한 없이 무료이고, 면허 의사 화상 진료는 구독 없이 1회 39달러다. 보험이 있으면 본인부담금만 낸다.","tags":["AI 상담","원격진료","현금 결제","익명 이용","고용주 판매"],"headline_traction":"2026년 3월에 시리즈 B로 4,000만 달러를 받았다. 12개월이 안 되는 기간에 세 번째 라운드이며 누적 조달액은 6,500만 달러가 넘는다.","watch":"매출 15배 성장과 주간 방문자 30만 명 같은 성장 수치는 전부 회사가 스스로 낸 것이고 제삼자가 확인한 것이 아니다."},"screenshots":[{"file":"doctronic_home.png","caption":"첫 화면 가운데에 증상 입력창 하나만 놓여 있고, 그 아래에 무료이고 익명이며 의사들이 만들었다는 문구가 붙어 있다. 위쪽에는 39달러 방문당 결제와 모든 보험을 받는다는 안내가 함께 적혀 있다.","from":"https://www.doctronic.ai"},{"file":"doctronic_how.png","caption":"AI 의사가 어떻게 작동하는지 네 단계로 설명하는 페이지다. 무료 AI 상담에서 면허 의사 화상 진료로 넘어가는 지점이 어디인지, 대기 시간과 값이 얼마인지 보여 준다.","from":"https://www.doctronic.ai/how-your-ai-doctor-works/"},{"file":"doctronic_pricing.png","caption":"값 안내 페이지다. AI 상담은 영원히 0달러, 면허 의사 진료는 39달러 또는 보험 본인부담금, 기업은 직원 한 사람당 월정액으로 세 갈래를 나눠 놓았다.","from":"https://www.doctronic.ai/quality-care-in-seconds-pricing-that-makes-sense/"}],"q":"{\"slug\": \"doctronic\", \"name\": \"doctronic\", \"one_liner\": \"증상을 적으면 ai가 무료로 진단과 치료 계획을 내주고, 처방전이 필요해지는 순간에만 39달러짜리 면허 의사 화상 진료를 파는 소비자용 서비스다.\", \"site\": \"https://www.doctronic.ai\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"26\", \"section\": 15, \"headline\": \"ai가 진료 상담을 맡는 서비스가 12개월도 안 되어 세 번째 라운드로 4,000만 달러를 받았고, 필자는 공개 수치를 역산해 주간 방문자 30만 명 가운데 2%도 유료 진료로 넘어가지 않는다고 짚었다.\"}], \"card\": {\"problem\": \"미국에서는 보험이 없거나 있어도 비용 때문에 진료를 미루는 사람이 많아서, 지금 겪는 증상이 병원에 갈 일인지 판단하는 단계부터 돈이 든다.\", \"solution\": \"가입도 로그인도 없이 익명으로 증상을 물어보는 무료 ai 상담을 열어 두고 상담마다 진료 기록 형식의 문서를 만들어 주며, 처방전이나 검사 의뢰처럼 사람 의사가 필요해지는 순간에만 화상 진료를 유료로 판다.\", \"price\": \"ai 상담은 횟수 제한 없이 무료이고, 면허 의사 화상 진료는 구독 없이 1회 39달러다. 보험이 있으면 본인부담금만 낸다.\", \"tags\": [\"ai 상담\", \"원격진료\", \"현금 결제\", \"익명 이용\", \"고용주 판매\"], \"headline_traction\": \"2026년 3월에 시리즈 b로 4,000만 달러를 받았다. 12개월이 안 되는 기간에 세 번째 라운드이며 누적 조달액은 6,500만 달러가 넘는다.\", \"watch\": \"매출 15배 성장과 주간 방문자 30만 명 같은 성장 수치는 전부 회사가 스스로 낸 것이고 제삼자가 확인한 것이 아니다.\"}, \"problem\": \"한국은 전국민 건강보험이 있어서 아프면 동네 의원에 가면 되고 진료비 본인부담금도 몇천 원 수준이다. 미국은 그렇지 않다. kff 집계에 따르면 2024년 기준으로 65세 미만 인구 가운데 2,670만 명, 비율로는 9.8%가 건강보험이 없다. 무보험 성인의 38.6%는 비용 때문에 필요한 진료나 약을 미루거나 아예 받지 못했다고 답했고, 민간보험이 있는 성인도 17.0%가 같은 답을 했다. 그래서 미국 소비자에게는 진료를 받는 일 자체보다 앞서, 지금 겪는 증상이 병원에 갈 일인지 판단하는 단계부터가 돈이 드는 문제가 되며, 그 판단을 공짜로 대신해 주는 창구에 수요가 생긴다.\", \"solution\": \"사용자는 첫 화면 가운데에 있는 입력창에 증상을 적고 대화를 시작한다. 가입도 로그인도 필요 없고 익명으로 쓸 수 있으며, ai 상담 자체는 횟수 제한 없이 무료다. ai는 동료 심사를 거친 논문과 진료 지침을 근거로 가능한 진단 목록과 치료 선택지를 제시하고, 상담마다 soap 노트라는 진료 기록 형식의 문서를 만들어 준다. 회사는 이 문서를 다른 병원에 그대로 가져가서 쓰라고 안내한다. 처방전이나 검사 의뢰, 진단서가 필요해지는 순간에만 실제 면허 의사와의 화상 진료로 넘어가는데, 값은 1회 39달러이고 구독이 아니며 보험이 있으면 본인부담금만 낸다. 진료를 맡는 의사들은 본사와 분리된 별도 법인인 doctronic physicians group 소속이고, 회사는 50개 주 전체에서 진료가 가능하다고 밝히고 있다.\", \"features\": [{\"name\": \"무료 ai 상담\", \"detail\": \"가입과 로그인 없이 익명으로 증상을 물어볼 수 있고 횟수 제한이 없다. 회사는 값 안내 페이지에서 이 부분을 영원히 0달러라고 표기한다.\"}, {\"name\": \"무료 soap 노트\", \"detail\": \"상담이 끝날 때마다 진단과 치료 계획이 담긴 진료 기록 형식의 문서를 만들어 준다. 회사는 이 문서를 자기가 다니던 병원에 가져가면 진료가 더 빨라진다고 안내한다.\"}, {\"name\": \"39달러 원격진료\", \"detail\": \"면허 의사와의 화상 진료 1회 값이다. 처방전 발급, 검사 의뢰와 결과 해석, 전문의 의뢰, 진단서 발급이 이 값에 포함되며 별도로 더 받지 않는다고 적혀 있다.\"}, {\"name\": \"유타주 ai 처방 갱신\", \"detail\": \"이미 다른 의사가 처방한 약 191개 품목에 한해 ai가 30일, 60일, 90일 단위 갱신을 처리한다. 규제 약물과 adhd 약, 주사제는 대상에서 빠진다.\"}, {\"name\": \"glp-1 처방 관리 구독\", \"detail\": \"비만 치료제 처방을 매달 써 주고 필요할 때 의사 화상 진료와 영양사 상담을 붙여 주는 상품이다. 월 99달러와 199달러 두 가지가 있고 약값은 포함되지 않는다.\"}, {\"name\": \"checkup 컨시어지\", \"detail\": \"연 1회 건강검진 상품이다. 기본 혈액검사와 흔히 쓰는 약의 재처방이 포함되고, 1만 곳이 넘는 의료기관에서 의무기록을 모아 준다고 밝히고 있다.\"}, {\"name\": \"검색 유입용 건강 정보 페이지\", \"detail\": \"질환, 증상, 약, 검사, 비교 글로 사이트를 채워 검색에서 사람을 끌어들인다. 사이트맵을 직접 세어 보면 2만 4천 개가 넘고 그 가운데 블로그 글만 1만 2천 개가 넘는다.\"}, {\"name\": \"기업과 보험사 대상 판매\", \"detail\": \"고용주, 제3자 관리기관, 보험사, 병원을 상대로 직원 한 사람당 월정액을 받는 별도 판매선이 있다. 관련 소개 페이지가 사이트에 스무 개 넘게 있다.\"}], \"differentiator\": \"k health은 같은 발상에서 출발했지만 지금은 mass general brigham, mayo clinic, cedars-sinai 같은 병원을 통해 파는 쪽으로 방향을 틀어서, 환자는 이 서비스를 병원 이름으로 만난다. ada health와 buoy health는 증상을 확인해 주는 데까지만 하고 실제 진료는 다른 곳으로 넘기기 때문에, 무료 상담과 유료 진료를 한 회사 안에서 잇지 못한다. doctronic은 무료 ai 상담과 자체 의사망을 한 회사 안에 붙여 두고 39달러라는 현금가를 공개 웹에 그대로 걸어 둔 점이 다르지만, 여기까지는 결합 방식의 차이일 뿐이다. 진짜로 다른 한 가지는 유타주와 맺은 규제 완화 협약인데, 사람 의사를 거치지 않고 ai가 처방을 갱신하도록 주 정부가 승인한 첫 사례이며 위에 든 회사 가운데 이것을 가진 곳은 없다.\", \"team\": [{\"name\": \"matt pavelle\", \"role\": \"공동 창업자 겸 co-ceo\", \"background\": \"패션 이커머스 회사 moda operandi의 창립 cto를 지냈고 렌트 리워드 스타트업 piñata rent를 공동 창업했다.\"}, {\"name\": \"adam oskowitz\", \"role\": \"공동 창업자\", \"background\": \"ucsf 혈관외과 조교수로 지금도 진료하는 외과 의사다.\"}, {\"name\": \"byron crowe\", \"role\": \"최고의료책임자\", \"background\": \"solera health 최고의료책임자와 하버드 의과대학 교원을 지낸 내과 전문의이며 2025년 10월에 합류했다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"union square ventures가 주도한 시드로 500만 달러를 받았다.\", \"when\": \"2025\", \"source\": \"sacra와 fundz의 회사 정보. 1차 보도자료를 찾지 못해 정확한 발표일은 확인하지 못했다.\"}, {\"type\": \"funding\", \"detail\": \"lightspeed venture partners가 주도한 시리즈 a로 2,000만 달러를 받았다. union square ventures, tusk ventures, hf0가 참여했고 fei-fei li가 엔젤로 들어왔다.\", \"when\": \"2025-09\", \"source\": \"pr newswire 보도자료, lightspeed 투자 소개글\"}, {\"type\": \"funding\", \"detail\": \"abstract와 lightspeed가 공동 주도한 시리즈 b로 4,000만 달러를 받았다. 12개월이 안 되는 기간에 세 번째 라운드이며 누적 조달액은 6,500만 달러가 넘는다.\", \"when\": \"2026-03\", \"source\": \"business wire 보도자료, stat news\"}, {\"type\": \"regulatory\", \"detail\": \"유타주 상무부 인공지능정책국과 규제 완화 협약을 맺어, 이미 다른 의사가 처방한 약 191개 품목에 한해 ai가 처방 갱신을 처리하는 12개월 파일럿을 시작했다. 협약 조건으로 갱신 문서에 이름이 들어가는 면허 의사를 두어야 하고 ai 위험을 포함한 의료과실보험을 유지해야 한다.\", \"when\": \"2026-01\", \"source\": \"유타주 상무부 보도자료, fierce healthcare, deseret news\"}, {\"type\": \"regulatory\", \"detail\": \"유타주 의료면허위원회 위원 14명 가운데 11명이 이 파일럿을 즉시 중단하라는 서한을 보냈으나 주 상무부가 요청을 기각했고 파일럿은 계속되고 있다.\", \"when\": \"2026-04\", \"source\": \"kuer, utah news dispatch\"}, {\"type\": \"revenue\", \"detail\": \"시리즈 a를 마감한 뒤 6개월 안에 매출이 15배 늘어 연환산으로 8자리, 즉 1,000만 달러 이상이 되었다고 밝혔다.\", \"when\": \"2026-03\", \"source\": \"회사 보도자료(business wire). 제삼자가 확인한 수치가 아니다.\"}, {\"type\": \"traffic\", \"detail\": \"주간 순방문자가 30만 명이 넘는다고 밝혔다.\", \"when\": \"2026-03\", \"source\": \"회사 보도자료(business wire). 제삼자가 확인한 수치가 아니다.\"}, {\"type\": \"traffic\", \"detail\": \"사이트맵을 직접 세어 보면 검색 유입용 건강 정보 페이지가 2만 4천 개가 넘는다. 방문자 대부분이 진료를 사러 온 것이 아니라 검색으로 들어온 사람이라는 뜻이다.\", \"when\": \"2026-09\", \"source\": \"https://www.doctronic.ai/sitemap.xml 의 하위 사이트맵 19개를 직접 집계\"}, {\"type\": \"partnership\", \"detail\": \"병원, 제3자 관리기관, 자가보험 고용주와 공동 브랜드 제휴를 맺고 있다고 밝혔다.\", \"when\": \"2026-03\", \"source\": \"회사 보도자료를 옮긴 the ai insider 기사. 제휴처 이름은 공개되지 않았다.\"}], \"caveats\": \"성장 수치는 전부 회사가 낸 것이고 제삼자가 확인한 것이 아니다. 15배 성장, 주간 방문자 30만 명, 연환산 매출 1,000만 달러가 모두 여기에 해당한다. 뉴스레터 필자가 계산한 2% 미만이라는 전환율은 매출 전액이 39달러 진료에서 나온다고 가정한 역산인데, 실제로는 월 99달러와 199달러짜리 glp-1 구독과 기업 대상 매출이 섞여 있으므로 진료 건수는 더 적고 전환율은 더 낮아질 가능성이 크다. 회사가 재방문 진료가 세 배 가까이 늘었다고 밝힌 점을 감안하면 월 21,000건이 21,000명을 뜻하지도 않는다. 회사가 내세우는 치료 계획 일치율 99.2%는 시리즈 a 발표 때 쓰던 수치가 그대로 다시 쓰인 것으로 보이며, 근거가 되는 연구는 회사 지분을 가진 사람들이 쓴 medrxiv 사전 공개 논문이고 대상도 기존 웹사이트 챗봇이다. 여기에 더해 펜실베이니아대학교의 eric bressman은 회사가 내놓은 검증 연구에서 원격진료 사례 500건을 놓고 ai와 사람 의사의 판단이 일치한 비율이 80%에 그쳤다고 지적했다. 99.2%와 80%가 모두 회사 쪽 자료에서 나온 수치이므로 어느 것을 인용하느냐에 따라 그림이 완전히 달라진다. 뉴스레터가 인용한 endpoints news의 체험기는 기자가 물리치료사 의뢰를 받으려고 39달러 진료를 직접 써 본 기록인데, 경험이 일관되지 않았고 matt pavelle 대표도 개선이 필요하다는 점을 인정했다고 매체가 정리했다. 보안업체 mindgard는 공개된 챗봇에 존재하지 않는 규제 공지를 만들어 넣어, 옥시콘틴 표준 용량의 세 배를 제시하게 만들었다고 발표했다. 회사와 유타주는 그것이 실제 환자 처방을 처리하는 운영 환경이 아니라고 반박했다. jama health forum은 유타주 협약이 회사에 환자 의무기록 보관과 제공 의무를 면제해 주고, 이용약관은 정확성과 그로 인한 피해에 대한 책임을 부인한다고 지적했다. 유타주 의료면허위원회 위원장 alan smith는 사망자가 나올 때까지 아무 조치도 취해지지 않을까 두렵다고 말했고, 미국의사협회도 처방 갱신이 단순히 확인만 하고 넘어갈 일이 아니라고 논평했다. forbes는 2026년 7월 기사에서 처방 결정의 72%를 ai가 스스로 처리했고 그 가운데 3%는 나중에 사람 의사가 뒤집었다고 전했는데, 본문을 직접 확인하지 못해 참고로만 둔다. 앱스토어 설명 맨 끝과 회사 소개 페이지 하단에는 doctronic이 ai 의사이지 면허 의사가 아니며 의료 행위를 하지 않고 의학적 조언을 제공하지 않는다는 문구가 붙어 있어, ai 의사라는 마케팅 표현과 어긋난다. 사이트 안에서도 표기가 갈린다. 진료비는 39달러와 40달러가 함께 쓰이고, 의사 연결 대기 시간은 30분 이내, 평균 15분, 평균 5분이 페이지마다 다르게 적혀 있다. 앱 평가 수가 매우 적어서(아이폰 23개, 구글 플레이 35개, 설치 1천 회 이상) 실제 사용은 앱이 아니라 웹에 몰려 있다고 보아야 한다.\", \"for_us\": \"가장 눈여겨볼 대목은 낮은 전환율이 아니라 그 분모다. 주간 30만 명이 ai에게 건강을 물어보려고 찾아오는데 그 가운데 2%도 유료 진료로 넘어가지 않는다면, 무료로 물어볼 창구에 대한 수요가 진료 수요보다 훨씬 크다는 뜻이다. 우리는 진료를 팔 이유가 없으므로 이 수요가 그대로 앱을 열 이유가 된다. 설계에서 가져올 것이 세 가지 있다. 첫째, 가입도 로그인도 요구하지 않고 익명으로 바로 물어보게 한 진입 방식이다. 둘째, 상담 결과를 soap 노트라는 문서로 만들어 주고 그것을 자기가 다니던 병원에 가져가라고 안내하는 방식인데, 답변의 역할을 정보 제공과 기록 정리로 묶어 두면 진단이나 처방으로 읽히지 않게 하면서도 사용자에게 손에 잡히는 결과물을 남길 수 있다. 셋째, 면책 문구를 앱 설명과 서비스 안에 명시적으로 붙여 둔 방식이다. 증상과 검진 수치, 복용 중인 약에 대해 물어보는 상담 창구는 3개월 안에 소프트웨어만으로 붙일 수 있고, 우리 앱에는 이미 검진 수치와 식단 기록이 있으므로 물어볼 재료도 갖춰져 있다. 다만 트래픽 엔진인 검색 유입용 2만 페이지는 앱에서 그대로 따라 할 수 없는 부분이고, 유타주 규제 협약이나 50개 주 의사망은 3개월과 소프트웨어 인력이라는 조건 밖에 있으므로 제외한다.\", \"screenshots\": [{\"file\": \"doctronic_home.png\", \"caption\": \"첫 화면 가운데에 증상 입력창 하나만 놓여 있고, 그 아래에 무료이고 익명이며 의사들이 만들었다는 문구가 붙어 있다. 위쪽에는 39달러 방문당 결제와 모든 보험을 받는다는 안내가 함께 적혀 있다.\", \"from\": \"https://www.doctronic.ai\"}, {\"file\": \"doctronic_how.png\", \"caption\": \"ai 의사가 어떻게 작동하는지 네 단계로 설명하는 페이지다. 무료 ai 상담에서 면허 의사 화상 진료로 넘어가는 지점이 어디인지, 대기 시간과 값이 얼마인지 보여 준다.\", \"from\": \"https://www.doctronic.ai/how-your-ai-doctor-works/\"}, {\"file\": \"doctronic_pricing.png\", \"caption\": \"값 안내 페이지다. ai 상담은 영원히 0달러, 면허 의사 진료는 39달러 또는 보험 본인부담금, 기업은 직원 한 사람당 월정액으로 세 갈래를 나눠 놓았다.\", \"from\": \"https://www.doctronic.ai/quality-care-in-seconds-pricing-that-makes-sense/\"}, {\"file\": \"doctronic_ios.png\", \"caption\": \"미국 아이폰 앱스토어 페이지다. 무료 앱이고 2025년 11월에 나왔으며 평점 4.4에 평가가 23개뿐이어서, 실제 사용이 앱이 아니라 웹에 몰려 있음을 보여 준다.\", \"from\": \"https://apps.apple.com/us/app/doctronic/id6753094320\"}], \"sources\": [{\"title\": \"doctronic 공식 사이트 첫 화면\", \"url\": \"https://www.doctronic.ai\", \"note\": \"무료와 익명 상담, 39달러 방문당 결제, 50개 주 진료 가능이라는 핵심 문구를 확인했다.\"}, {\"title\": \"quality care in seconds, pricing that makes sense\", \"url\": \"https://www.doctronic.ai/quality-care-in-seconds-pricing-that-makes-sense/\", \"note\": \"ai 상담 0달러, 의사 진료 39달러, 기업용 월정액이라는 세 갈래 값 구조를 확인했다.\"}, {\"title\": \"how your ai doctor works\", \"url\": \"https://www.doctronic.ai/how-your-ai-doctor-works/\", \"note\": \"증상 입력에서 의사 연결까지의 네 단계 흐름과 평균 대기 15분이라는 표기를 확인했다.\"}, {\"title\": \"doctronic resource center\", \"url\": \"https://www.doctronic.ai/resource-center/\", \"note\": \"무료와 유료의 경계, 진단서가 39달러 진료에 포함된다는 점, 로그인 없이 쓸 수 있다는 점을 확인했다.\"}, {\"title\": \"glp-1 처방 관리 값 안내\", \"url\": \"https://www.doctronic.ai/glp-99/\", \"note\": \"월 99달러 구독이며 약값은 포함되지 않는다는 문구를 확인했다. 199달러 상품도 같은 형식으로 따로 있다.\"}, {\"title\": \"doctronic physicians group\", \"url\": \"https://www.doctronicpg.com/\", \"note\": \"실제 진료를 맡는 의사들이 본사와 분리된 별도 법인 소속이며 50개 주에서 진료한다는 설명을 확인했다.\"}, {\"title\": \"doctronic 사이트맵\", \"url\": \"https://www.doctronic.ai/sitemap.xml\", \"note\": \"하위 사이트맵 19개를 직접 세어 검색 유입용 페이지가 2만 4천 개가 넘는다는 것을 확인했다.\"}, {\"title\": \"doctronic 아이폰 앱\", \"url\": \"https://apps.apple.com/us/app/doctronic/id6753094320\", \"note\": \"무료 soap 노트 제공, 평균 대기 5분, 평점 4.4에 평가 23개, 그리고 의료 행위를 하지 않는다는 면책 문구를 확인했다.\"}, {\"title\": \"doctronic 안드로이드 앱\", \"url\": \"https://play.google.com/store/apps/details?id=ai.doctronic.app\", \"note\": \"설치 1천 회 이상, 평점 4.2에 리뷰 35개, 본사 주소가 뉴욕이라는 것을 확인했다.\"}, {\"title\": \"doctronic raises $40m series b (business wire)\", \"url\": \"https://www.businesswire.com/news/home/20260324814372/en/doctronic-raises-$40m-series-b-following-breakthrough-as-first-ai-to-legally-renew-prescriptions-in-the-u.s.\", \"note\": \"시리즈 b 4,000만 달러, 주도 투자사, 15배 성장과 주간 방문자 30만 명이라는 회사 발표 수치를 확인했다.\"}, {\"title\": \"doctronic raises $40 million as race to apply ai in clinical care heats up (stat news)\", \"url\": \"https://www.statnews.com/2026/03/23/ai-doctor-startup-doctronic-raises-40-million/\", \"note\": \"누적 조달 6,500만 달러와 올해 매출 1,000만 달러 전망을 확인했다. 유료 구독 기사라 본문 일부만 열람했다.\"}, {\"title\": \"doctronic raises $20 million series a (pr newswire)\", \"url\": \"https://www.prnewswire.com/news-releases/doctronic-raises-20-million-series-a-to-bring-private-and-personalized-ai-doctor-to-the-masses-302556195.html\", \"note\": \"2025년 9월 시리즈 a 2,000만 달러와 참여 투자자 명단을 확인했다.\"}, {\"title\": \"investing in doctronic (lightspeed venture partners)\", \"url\": \"https://lsvp.com/stories/investing-in-doctronic-ai-healthcares-24-7-digital-doctor/\", \"note\": \"창업자 두 사람의 경력과 투자사의 판단 근거를 확인했다.\"}, {\"title\": \"doctronic ai appoints dr. byron crowe as chief medical officer\", \"url\": \"https://www.businesswire.com/news/home/20251015771722/en/doctronic-ai-appoints-dr.-byron-crowe-as-chief-medical-officer-to-lead-next-stage-of-clinical-innovation\", \"note\": \"최고의료책임자 임명과 이전 경력을 확인했다.\"}, {\"title\": \"utah and doctronic announce groundbreaking partnership for ai prescription medication renewals\", \"url\": \"https://commerce.utah.gov/2026/01/06/news-release-utah-and-doctronic-announce-groundbreaking-partnership-for-ai-prescription-medication-renewals/\", \"note\": \"유타주 규제 완화 협약의 공식 발표다. 직접 열람은 차단되어 검색 결과 요약과 다른 보도로 내용을 확인했다.\"}, {\"title\": \"utah tests ai for routine medication refills through regulatory relief program (fierce healthcare)\", \"url\": \"https://www.fiercehealthcare.com/ai-and-machine-learning/doctronic-partners-utah-ai-sandbox\", \"note\": \"규제 샌드박스의 범위와 제외 약물, 안전 장치를 확인했다.\"}, {\"title\": \"utah dismisses medical board call to halt its pioneering ai prescription program (kuer)\", \"url\": \"https://www.kuer.org/health/2026-04-28/utah-dismisses-medical-board-call-to-halt-its-pioneering-ai-prescription-program\", \"note\": \"의료면허위원회의 중단 요청과 주 정부의 기각, 1단계에서는 면허 의사가 모든 처방 결정을 검토한다는 해명을 확인했다.\"}, {\"title\": \"new tech, familiar problems (endpoints news)\", \"url\": \"https://endpoints.news/new-tech-familiar-problems/\", \"note\": \"뉴스레터가 인용한 ngai yeung 기자의 2026년 3월 26일 체험기다. 물리치료사 의뢰를 받으려고 39달러 진료를 써 봤으나 경험이 일관되지 않았고 대표도 개선 필요를 인정했다는 내용이다. 유료 구독 벽 때문에 도입부와 매체 요약만 확인했다.\"}, {\"title\": \"is ai ready to refill prescriptions? doctors are wary of utah's automated program (kuer)\", \"url\": \"https://www.kuer.org/health/2026-07-06/is-ai-ready-to-refill-prescriptions-doctors-are-wary-of-utahs-automated-program\", \"note\": \"유타주 의료면허위원장의 발언과, 회사 검증 연구에서 사람 의사와의 일치율이 500건 기준 80%였다는 펜실베이니아대학교 eric bressman의 지적을 확인했다.\"}, {\"title\": \"here are 3 ai companies betting they can replace doctors (forbes)\", \"url\": \"https://www.forbes.com/sites/jessepines/2026/07/24/here-are-3-ai-companies-betting-they-can-replace-doctors/\", \"note\": \"처방 결정의 72%를 ai가 자율로 처리했고 그중 3%를 사람 의사가 뒤집었다는 수치가 나온 기사다. 본문을 직접 열람하지 못해 참고용으로만 두었다.\"}, {\"title\": \"ai doctor doctronic raises $40m series b, but faces controversy (telecare aware)\", \"url\": \"https://telecareaware.com/ai-doctor-doctronic-raises-40m-series-b-but-faces-controversy-on-autonomous-rx-renewals-in-utah-and-effectiveness-claims/\", \"note\": \"임상 검증 방식에 대한 jama health forum의 지적과 책임 소재 문제를 확인했다.\"}, {\"title\": \"utah's new medical chatbot can be easily hacked to give dangerous medical advice (mindgard)\", \"url\": \"https://mindgard.ai/blog/doctronic-is-now-accepting-new-patients-and-unsafe-instructions\", \"note\": \"공개 챗봇을 조작해 옥시콘틴 용량을 세 배로 제시하게 만든 실험을 확인했다.\"}, {\"title\": \"the saga of utah's rx refill bot (medcity news)\", \"url\": \"https://medcitynews.com/2026/03/utah-prescription-medication-ai-doctronic-mindgard/\", \"note\": \"보안 실험이 운영 환경이 아닌 공개 챗봇 대상이었다는 회사와 주 정부의 반박을 확인했다.\"}, {\"title\": \"key facts about the uninsured population (kff)\", \"url\": \"https://www.kff.org/uninsured/fact-sheet/key-facts-about-the-uninsured-population/\", \"note\": \"2024년 기준 무보험 인구 2,670만 명과 비용 때문에 진료를 미룬 비율을 확인했다.\"}, {\"title\": \"k health 공식 사이트\", \"url\": \"https://khealth.com/\", \"note\": \"지금은 mass general brigham, mayo clinic, cedars-sinai 등 병원을 통해 판매하는 구조로 바뀌었음을 확인했다.\"}, {\"title\": \"buoy health 공식 사이트\", \"url\": \"https://www.buoyhealth.com/\", \"note\": \"무료 증상 확인 도구까지만 제공하고 진료는 다른 곳으로 넘긴다는 점을 확인했다.\"}]}"},{"slug":"emed","name":"eMed","one_liner":"고용주를 통해 직원에게 비만 치료제(GLP-1)를 공급하고, 중간에 그만두지 않도록 관리해 주는 회사다.","sells_to":"mixed","seen_in":[{"issue":"26","section":17,"headline":"장수 의료(롱제비티) 기관으로 소개된 eMed가 기업가치 20억 달러가 넘는 조건으로 2억 달러를 조달했고, 보험 중개 회사 Aon이 라운드를 주도했으며, 환자 순응도 90%를 상품의 근거로 내세웠다."}],"card":{"problem":"미국에서는 일하는 사람 대부분이 회사를 통해 건강보험에 들기 때문에, 비만 치료제(GLP-1)를 쓰는 직원이 늘면 그 비용이 곧바로 고용주의 지출로 잡힌다. 그런데 1년 안에 절반이 넘는 사람이 약을 끊기 때문에 고용주는 결과가 남지 않은 채 약값만 치르게 된다.","solution":"eMed는 고용주와 계약해 직원에게 집에서 하는 채혈 검사와 처방, 주 1회 체크인을 묶어 공급하고, 중간에 그만두지 않도록 관리하는 대가를 받는다. 직원의 체중 감량과 복약 지속이 목표에 못 미치면 받는 돈을 깎겠다고 내걸었다.","price":"고용주를 거치는 경로는 상품마다 직원이 내는 돈이 다르고, 개인이 직접 가입하면 최초 검사비 49달러에 월 회비 149.99달러와 약값 월 149.99달러가 따로 붙어 매달 300달러 정도가 든다.","tags":["비만 치료제","고용주 판매","자가 채혈","원격진료","복약 관리"],"headline_traction":"2026년 3월에 기업가치 20억 달러가 넘는 조건으로 시리즈 A 2억 달러를 조달했고, 보험 중개 회사 Aon이 라운드를 주도했다.","watch":"상품의 근거로 내세우는 순응도 90%는 원래 프로그램 잔류율을 다른 이름으로 바꿔 적은 것이며, 회사가 스스로 낸 수치이고 제삼자가 검증하지 않았다."},"screenshots":[{"file":"emed_home.png","caption":"첫 화면. 고용주용과 개인용 두 갈래로 나뉘어 있고, 내세우는 문구가 '시작하기 쉽고 계속하기는 더 쉽다'이다.","from":"https://www.emed.com"},{"file":"emed_claims.png","caption":"순응도 90%의 실제 표기. '10명 중 9명이 처방대로 따른다', '10명 중 9명이 6개월 넘게 프로그램에 남는다'로 적혀 있고 출처는 'eMed Population Health Data (2025)'라는 자사 데이터다.","from":"https://www.emed.com/download"},{"file":"emed_pricing.png","caption":"소비자가 직접 가입할 때의 값. 최초 검사비 49달러, 약값 월 149.99달러부터, 회비 월 149.99달러가 각각 따로 붙는다.","from":"https://www.emed.com/join/home"}],"q":"{\"slug\": \"emed\", \"name\": \"emed\", \"one_liner\": \"고용주를 통해 직원에게 비만 치료제(glp-1)를 공급하고, 중간에 그만두지 않도록 관리해 주는 회사다.\", \"site\": \"https://www.emed.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"26\", \"section\": 17, \"headline\": \"장수 의료(롱제비티) 기관으로 소개된 emed가 기업가치 20억 달러가 넘는 조건으로 2억 달러를 조달했고, 보험 중개 회사 aon이 라운드를 주도했으며, 환자 순응도 90%를 상품의 근거로 내세웠다.\"}], \"card\": {\"problem\": \"미국에서는 일하는 사람 대부분이 회사를 통해 건강보험에 들기 때문에, 비만 치료제(glp-1)를 쓰는 직원이 늘면 그 비용이 곧바로 고용주의 지출로 잡힌다. 그런데 1년 안에 절반이 넘는 사람이 약을 끊기 때문에 고용주는 결과가 남지 않은 채 약값만 치르게 된다.\", \"solution\": \"emed는 고용주와 계약해 직원에게 집에서 하는 채혈 검사와 처방, 주 1회 체크인을 묶어 공급하고, 중간에 그만두지 않도록 관리하는 대가를 받는다. 직원의 체중 감량과 복약 지속이 목표에 못 미치면 받는 돈을 깎겠다고 내걸었다.\", \"price\": \"고용주를 거치는 경로는 상품마다 직원이 내는 돈이 다르고, 개인이 직접 가입하면 최초 검사비 49달러에 월 회비 149.99달러와 약값 월 149.99달러가 따로 붙어 매달 300달러 정도가 든다.\", \"tags\": [\"비만 치료제\", \"고용주 판매\", \"자가 채혈\", \"원격진료\", \"복약 관리\"], \"headline_traction\": \"2026년 3월에 기업가치 20억 달러가 넘는 조건으로 시리즈 a 2억 달러를 조달했고, 보험 중개 회사 aon이 라운드를 주도했다.\", \"watch\": \"상품의 근거로 내세우는 순응도 90%는 원래 프로그램 잔류율을 다른 이름으로 바꿔 적은 것이며, 회사가 스스로 낸 수치이고 제삼자가 검증하지 않았다.\"}, \"problem\": \"미국에서는 일하는 사람 대부분이 회사를 통해 건강보험에 든다. 폭스비즈니스 보도에 따르면 미국인의 60% 이상이 직장을 통해 의료 혜택을 받는다. 그래서 비싼 약을 쓰는 직원이 늘면 그 비용이 곧바로 고용주의 지출로 잡힌다. glp-1 계열 비만 치료제는 체중을 뺀 뒤에도 계속 써야 하는 약이라, 한 번 쓰기 시작하면 회사가 해마다 떠안는 고정 항목이 된다. 더 곤란한 대목은 돈을 낸 만큼 결과가 남지 않는다는 점이다. 과체중이거나 비만인 성인 12만 5,474명의 실사용 기록을 본 연구(jama network open, 2025년 1월)에서는 1년 안에 53.6%가 약을 끊었고, 당뇨가 없는 사람만 따로 보면 64.8%가 끊었다. 2년으로 늘리면 당뇨가 없는 사람의 84.4%가 끊었다. 중간에 그만두면 빠진 체중이 대체로 되돌아오므로 고용주는 결과 없이 약값만 치른 셈이 된다. 실제로 아직 절반이 넘는 고용주가 이 약을 보장 항목에 넣지 않았다. mercer 조사에 따르면 직원 500명 이상 고용주 가운데 체중 감량 약을 보장하는 곳은 2024년 기준 44%다. 한국은 전국민 건강보험이 있고 비만 치료제는 급여 대상이 아니어서 개인이 자기 돈으로 사기 때문에, 이 부담이 회사의 문제로 넘어오지 않는다.\", \"solution\": \"고용주가 계약하면 직원은 emed 앱으로 등록한다. 집으로 채혈 키트가 배송되고, 직원이 스스로 피를 뽑아 보내면 당화혈색소, 크레아티닌, 고감도 crp, 감마지티피, 지질 검사, 비타민 b12 여섯 가지를 측정한다. 그 결과를 계약 의료진이 검토해 약을 쓸 수 있는지 판정하고 처방까지 내린다. 약은 위고비 주사와 위고비 알약, 젭바운드처럼 fda 허가를 받은 정품만 쓰며, 약국 급여를 중개하는 사업자(pbm)를 거치지 않고 직접 조달하기 때문에 중간 마진이 붙지 않는다고 밝힌다. 처방 뒤에는 주 1회 체크인, 월 1회 진료 상담, 부작용에 대비한 상비약 꾸러미, 6개월과 12개월 시점의 재검사가 이어진다. 고용주에게는 직원의 체중 감량과 복약 지속을 보증하고 목표에 못 미치면 받는 돈을 깎겠다고 내걸었다. 소비자가 직접 가입하는 상품도 따로 있는데, 최초 검사비 49달러를 한 번 내고 월 회비 149.99달러를 내며, 약값은 월 149.99달러부터 별도로 붙는다. 셋을 합치면 첫 달에 350달러 가까이 들고 그 뒤로도 매달 300달러가 나간다. 보험은 받지 않는다.\", \"features\": [{\"name\": \"가정용 채혈 스크리닝 키트\", \"detail\": \"집으로 배송된 키트로 직접 피를 뽑아 여섯 가지 지표를 검사하고, 그 결과가 나와야 약을 처방받을 수 있다. 다른 병원에서 받은 검사지는 받아 주지 않는다.\"}, {\"name\": \"주 1회 체크인\", \"detail\": \"앱에서 1분이 채 걸리지 않는 문답으로 체중과 상태를 기록한다. 예약이 필요 없고 언제든 할 수 있다.\"}, {\"name\": \"부작용 대응 상비약 꾸러미\", \"detail\": \"메스꺼움처럼 흔한 부작용에 쓸 일반의약품을 프로그램에 포함해 함께 보낸다. 부작용 때문에 그만두는 일을 줄이려는 장치다.\"}, {\"name\": \"pbm을 거치지 않는 약 직접 조달\", \"detail\": \"약국 급여를 중개하는 사업자를 빼고 직접 조달하는 경로로 정품 약을 들여온다고 밝힌다. 고용주에게는 리베이트로 부풀려진 가격이 아니라 정해진 값을 제시한다.\"}, {\"name\": \"성과 보증 계약\", \"detail\": \"직원의 체중 감량과 복약 지속을 보증하고 목표에 미달하면 고용주가 내는 돈을 깎아 준다. 2026년 3월 조달과 함께 인두제 방식(가입자 1인당 정액 계약)도 새로 내놓겠다고 밝혔다.\"}, {\"name\": \"회사 부담이 없는 자율 가입형 상품\", \"detail\": \"고용주가 계약서에 서명만 하면 회사 비용은 0달러이고, 직원이 할인 코드를 받아 월 149.99달러에 약을 사는 방식이다. 기존 약국 급여 계약을 바꾸지 않아도 된다.\"}, {\"name\": \"의료 종사자 전용 요금제\", \"detail\": \"병원과 요양 시설 종사자를 겨냥한 별도 상품이다. 고용주가 대상자 1인당 월 25달러를 내고, 직원이 약값과 임상 지원 명목으로 월 99달러를 낸다.\"}, {\"name\": \"생활 습관 지원 연계\", \"detail\": \"thrive global과 손잡고 행동 변화와 생활 습관 지도를 프로그램에 붙였다.\"}], \"differentiator\": \"판매 경로에서 갈린다. emed는 소비자 광고가 아니라 보험 중개 회사 aon, 복리후생 운영 회사 alight, 약국 급여 사업자 cvs health를 통해 고용주에게 들어간다. hims & hers나 ro처럼 소비자에게 직접 팔아 성장한 원격진료 회사와는 들어가는 경로 자체가 다르다. 약을 다루는 방식도 다르다. 약사가 자체 조제한 복제 성분(컴파운딩 세마글루타이드)을 쓰지 않고 fda 허가를 받은 정품만 쓴다고 못 박는데, 2026년 초 fda가 조제 glp-1을 광고한 원격진료 회사 30곳에 경고장을 보냈을 때 emed가 명단에 없었던 것도 이 선택과 맞물린다. 성과를 보증하고 못 지키면 대금을 깎겠다는 계약도 흔치 않다. 다만 '순응도 90%'라는 주장 자체는 이 분야에서 특별하지 않다. omada는 12주 94%와 24주 84%를, hims & hers는 6개월 75%를 내걸고, noom은 구독 유지 기간을 순응도처럼 제시한다. 셋 다 검증받은 수치가 아니고 셋 다 분모가 유리하게 잡혀 있다. omada는 스스로 glp-1을 쓴다고 밝히고 관리 프로그램에 등록한 사람만 셌고, hims & hers는 6개월 시점 설문에 응답한 사람만 셌다. emed는 그 분모를 아예 밝히지 않았다.\", \"team\": [{\"name\": \"dr. patrice a. harris\", \"role\": \"공동창업자, emed, llc(모회사) 전 ceo\", \"background\": \"미국의사협회(ama) 174대 회장을 지낸 정신과 의사이며, 흑인 여성으로는 처음으로 그 자리에 올랐다. 2020년 emed를 공동창업했다. 2026년 8월 nemours children's health로 옮겼다.\"}, {\"name\": \"linda yaccarino\", \"role\": \"emed population health ceo\", \"background\": \"x(옛 트위터)의 ceo를 지냈고, x를 떠난 지 몇 주 만인 2025년 8월 5일 emed에 왔다. 다만 그가 맡은 곳은 창업자 harris가 이끌던 모회사가 아니라 glp-1 사업을 하는 자회사다.\"}, {\"name\": \"tom brady\", \"role\": \"founding chief wellness officer\", \"background\": \"슈퍼볼 7회 우승 미식축구 선수 출신이다. 2026년 1월 12일 최고 웰니스 책임자로 선임됐고 3월 조달 라운드에도 투자자로 참여했다.\"}, {\"name\": \"dr. dyan hes\", \"role\": \"chief medical officer\", \"background\": \"소아과 전문의이자 미국비만의학회 인증 의사로 비만 의학과 소아과에서 25년 넘게 일했다. 뉴욕에서 gramercy pediatrics를 세웠고 지금은 highline modern medicine의 의료 원장이다. 2025년 9월 30일 선임됐다.\"}, {\"name\": \"michael ferro jr.\", \"role\": \"영국 지주회사의 실질 지배자로 등기된 인물\", \"background\": \"merge healthcare를 세우고 tribune publishing(옛 tronc) 회장을 지낸 사업가다. 영국 기업등기소에 emed healthcare group holdings의 '중대한 지배력을 가진 자'로 2023년 8월 등록돼 있고, 연락처는 마이애미의 emed 본사로 적혀 있다. 그런데 emed 웹사이트의 경영진 명단에는 이 사람도, 같은 소송에서 최고 경영 책임자(executive chairman)로 지목된 justin dearborn도 나오지 않는다.\"}, {\"name\": \"eric larsen\", \"role\": \"회사 소개 페이지의 팀 명단에 오른 인물\", \"background\": \"unitedhealth group에서 부사장(evp)을 지냈다.\"}, {\"name\": \"david moore\", \"role\": \"회사 소개 페이지의 팀 명단에 오른 인물\", \"background\": \"novo nordisk에서 부사장(evp)을 지냈다. novo nordisk는 위고비를 만든 제약사다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"기업가치 20억 달러가 넘는 조건으로 시리즈 a 2억 달러를 조달했다. 보험 중개 회사 aon이 주도했고 tom brady, joe lonsdale, antonio gracias, tom ricketts, jeff aronin, ara cohen, r.j. melman, linda yaccarino가 참여했다. 돈은 인공지능 플랫폼 개발과 인두제 계약을 감당할 자기자본에 쓴다고 밝혔다.\", \"when\": \"2026-03\", \"source\": \"pr newswire 보도자료\"}, {\"type\": \"funding\", \"detail\": \"aon이 emed에 전략적 투자를 하고 자사 고용주 고객에게 emed를 공급하기로 했다. 투자 금액은 공개되지 않았다.\", \"when\": \"2025-08\", \"source\": \"pr newswire 보도자료\"}, {\"type\": \"regulatory\", \"detail\": \"abbott의 binaxnow 가정용 코로나 검사가 fda 긴급사용승인을 받았다. 화상으로 사람이 지켜보며 진행하는 첫 가정용 신속 검사였고, 그 화상 감독 플랫폼이 emed의 것이었다. 2021년 1월 23일 개당 25달러로 판매를 시작했다.\", \"when\": \"2020-12\", \"source\": \"abbott 보도자료, emed 보도자료\"}, {\"type\": \"customers\", \"detail\": \"코로나 시기에 오하이오주, 콜로라도주, 버지니아주, 매사추세츠주와 검사 키트 공급 계약을 맺었고 united airlines, american airlines, delta, procter & gamble, quest diagnostics와도 손잡았다. 2023년에는 미국 국립보건원(nih)의 '집에서 검사하고 바로 치료받기' 시범 사업에서 원격진료를 맡았다. 회사는 누적 이용자를 600만 명 이상이라고 밝힌다.\", \"when\": \"2021\", \"source\": \"emed 및 파트너사 보도자료\"}, {\"type\": \"customers\", \"detail\": \"영국 babylon health의 사업을 법정관리 절차에서 인수했다. nhs 환자를 보는 디지털 1차 진료 기관 gp at hand가 여기 포함된다. 인수 대금은 현금 679만 파운드였다. 널리 인용되는 '50만 파운드'는 잔여 지분 값일 뿐이다. 인수한 사업은 2024년 한 해 4,290만 파운드의 매출을 냈다.\", \"when\": \"2023-10\", \"source\": \"emed 보도자료, 영국 기업등기소 감사보고서\"}, {\"type\": \"customers\", \"detail\": \"나스닥 상장사 science 37 holdings를 주당 5.75달러, 약 3,800만 달러에 공개매수로 인수하고 상장을 폐지했다.\", \"when\": \"2024-03\", \"source\": \"미국 증권거래위원회(sec) 제출 서류\"}, {\"type\": \"revenue\", \"detail\": \"영국 법인의 감사보고서상 2024년 매출은 5,140만 파운드, 세후 손실은 2,040만 파운드였고 직원은 326명이었다. 미국 쪽 매출과 인원은 비상장이라 공개된 자료가 없다.\", \"when\": \"2024-12\", \"source\": \"영국 기업등기소 제출 서류\"}, {\"type\": \"partnership\", \"detail\": \"미국 최대 약국 급여 사업자 cvs health와 손잡고 고용주가 비용을 통제하며 glp-1을 제공할 수 있는 경로를 만들었다.\", \"when\": \"2026-02\", \"source\": \"emed 뉴스 페이지가 인용한 axios 보도\"}, {\"type\": \"partnership\", \"detail\": \"복리후생 운영 회사 alight, 그리고 crux와 제휴해 고용주 대상 glp-1 공급을 넓히기로 했다.\", \"when\": \"2026-08\", \"source\": \"business wire 보도자료\"}], \"caveats\": \"이 회사에서 가장 중요한 수치인 '순응도 90%'는 회사가 스스로 낸 것이고, 제삼자가 검증한 자료는 없다. 확인한 내용을 순서대로 적는다.\\n\\n첫째, 같은 숫자가 자리마다 다른 이름을 달고 있다. 회사 앱 안내 페이지는 '10명 중 9명이 처방받은 치료 계획을 따른다', '10명 중 9명이 6개월 넘게 프로그램에 남는다'로 적고 출처를 'emed population health data (2025)'라는 자사 데이터로 밝힌다. 즉 원래는 '프로그램 잔류율'이다. 보도자료는 이것을 '복약 순응도'로 바꿔 적고 업계 평균과 비교했다. 잔류율과 순응도는 다른 것을 세는 지표다.\\n\\n둘째, 표본 수도 순응도의 정의도 공개되지 않았다. emed가 유일하게 등록한 연구(영국 isrctn12421711)는 emed가 스스로 의뢰하고 스스로 돈을 대며 연구 책임자도 emed 직원이고, 단일 기관에서 대조군 없이 뒤돌아보는 방식이며 윤리 심의 대상도 아니다. 결과는 아직 없고 종료 시점은 2027년 4월로 미뤄졌다. 그 연구가 정의한 순응도는 '권고받은 프로그램 활동 가운데 환자가 완료한 비율', 곧 앱 활동 수행률이다. 약을 실제로 얼마나 썼는지를 재는 지표가 아니다.\\n\\n셋째, 회사가 내세운 독립 검증은 아직 존재하지 않는다. emed는 pitchbook에 '영국 회원 8,000명 이상을 유니버시티 칼리지 런던의 john deanfield 교수가 독립 분석했고 6개월 91% 이상이 나왔으며 nature medicine에 심사 중, 몇 주 안에 게재'라고 밝혔다. 그로부터 다섯 달 반이 지난 2026년 9월 현재 pubmed, europe pmc, crossref, nature medicine 어디에도 그 논문이 없다. 게다가 같은 연구의 표본 수가 자료마다 8,000명, 1만 3천 명, 1,000명으로 다르게 적혀 있다. pitchbook의 애널리스트는 이 주장이 '마땅히 갖춰야 할 동료 심사와 임상 검증을 갖추지 못했다'고 평했다.\\n\\n넷째, '업계 평균의 두 배'는 성립하지 않는다. 시기와 지표를 맞춘 최신 자료로 보면 prime therapeutics의 2024년 상반기 코호트(3만 3,607명, jmcp 2026)에서 1년 지속률이 60.9%, 복약 순응도(pdc 80% 이상)가 55.5%였고, 매사추세츠 메디케이드 코호트(7,493명, jmcp 2026)에서는 6개월 시점 지속률 60.8%, 순응도 60.1%였다. 이 기준으로 보면 90%는 두 배가 아니라 1.3배에서 1.5배 수준이다. '두 배'가 되려면 약이 품귀였던 2021년에서 2023년 사이의 12개월 지속률을 끌어와야 한다. 게다가 이탈은 초반에 몰려 있어서 6개월로 끊어 재면 숫자가 유리해진다. 1년 이탈의 71%가 첫 6개월에 일어난다.\\n\\n다섯째, 함께 내건 '99%가 6개월 안에 지표 하나 이상 개선'은 재는 항목이 여섯 가지여서 하나만 좋아져도 성립한다. 회사 faq도 '첫 검사에서 약 99%는 최소 한 항목이 정상 범위를 벗어난다'고 밝히고 있다.\\n\\n여섯째, 체중 감량 수치가 13개월 사이에 계속 바뀌었다. 2025년 8월 aon 발표는 22.4파운드, 2026년 1월과 3월 보도자료는 21파운드, 앱 안내 페이지는 6개월에 23파운드, 현재 고용주 페이지는 30파운드다. 어느 수치가 어느 집단인지 회사가 밝히지 않았다.\\n\\n일곱째, 라운드를 주도한 aon은 독립된 제삼자가 아니다. aon은 emed를 자사 고용주 고객에게 파는 유통 파트너이고, 웹사이트가 성과 근거로 드는 'aon workforce-focused analysis on glp-1s'도 aon이 만든 것이며, 그 분석 자체는 청구 데이터 5,000만 명 중 glp-1 사용자 13만 9천 명을 본 것이지 emed 참가자를 본 것이 아니다. 더 나아가 aon의 2025 회계연도 사업보고서(10-k) 별지에는 emed population health, inc.가 2025년 12월 31일 기준 aon의 자회사로 올라 있다. 투자자 이상의 관계다.\\n\\n여덟째, 회사를 상대로 한 소송이 진행 중이다. 체중 관리 자회사의 전 ceo였던 wendi mader가 2026년 5월 플로리다 남부 연방지방법원에 성차별과 보복 해고를 이유로 소송을 냈다(사건번호 1:26-cv-23258). 소장에는 회사가 정한 임상 절차를 건너뛰고 특정 인물에게 glp-1을 처방하도록 지시받았다는 주장도 담겨 있다. 이는 아직 입증되지 않은 원고 측 주장이고 피고들은 2026년 8월 각하 신청을 내며 전면 다투고 있으므로, 사실로 인용해서는 안 된다. 다만 '임상 관리가 붙은 glp-1'을 파는 회사에 대해 그 관리의 실행을 문제 삼는 주장이 제기됐다는 사실 자체는 기록해 둘 만하다.\\n\\n아홉째, 영국에서는 인수 뒤에 마찰이 있었다. 2024년 3월 emed는 임상의 정리해고 협의를 시작했고 영국의사협회(bma)는 이 협의가 '위법일 가능성이 매우 높고 간접 차별에 해당한다'고 밝혔다. gp at hand의 등록 환자는 11만 1천 명에서 9만 6천 명으로 줄었고 bupa 계약은 2025년 1월 종료됐다. 앞서 2022년에는 abbott가 미수금 문제로 emed를 상대로 중재를 걸었고 법원이 emed에게 중재에 응하라고 명령했다.\\n\\n열째, 소비자용 앱의 사용 흔적이 아주 적다. 미국 앱스토어는 평점 4.2에 평가 10건, 구글 플레이는 평점 2.7에 평가 6건이고 내려받기가 1,000회 이상 구간이다. 개인 가입 페이지가 내세우는 '회원 5만 명'은 영국 shemed와 hemed의 환자 수와 같은 숫자인데, 영국 앱은 평가가 6,300건대다. 미국 소비자 사업은 이제 막 시작한 것으로 보인다.\\n\\n마지막으로, 뉴스레터가 쓴 '롱제비티 진료 기관'이라는 표현은 회사의 현재 사업과 맞지 않는다. 웹사이트에 롱제비티나 펩타이드를 다루는 페이지가 없고 해당 주소는 모두 없는 문서로 나온다. ceo가 axios 인터뷰에서 앞으로 펩타이드 영역 전반을 살펴보겠다고 말했으므로, 그 표현은 현재 사업이 아니라 계획을 가리킨 것으로 보인다. 참고로 인터넷에 도는 '2022년 미국 보건복지부와 최대 12억 달러 규모 계약'이라는 내용은 근거가 없다. 연방 조달 기록에서 emed 앞으로 확인되는 계약은 연방항공청 97만 2,623달러와 교육부 4,250달러가 전부다.\", \"for_us\": \"약을 파는 대목은 우리가 할 수 없다. 그러나 emed가 값을 받아 내는 지점은 약 자체가 아니라 '끊지 않게 만드는 관리'이고, 그 관리의 실제 내용은 1분이 안 걸리는 주 1회 체크인, 투약 알림, 진도 그래프, 부작용이 생겼을 때 바로 응대하는 상담 창구다. 전부 앱 화면에서 되는 일이고 의료기기 허가도 필요 없다. 회사도 앱을 '추적·분석 도구이며 의료기기가 아니다'라고 명시한다. 우리 앱은 걸음 리워드로 매일 여는 습관을 이미 만들어 두었으므로, 비만 치료제를 이미 쓰고 있는 사람을 위한 동반 트랙(주사 요일 알림, 투여 기록, 부작용 기록, 단백질 섭취와 걷기 과제)을 3개월 안에 붙일 수 있다. 다만 대상이 약 사용자로 좁아지므로, 우리 미국 사용자 가운데 실제로 glp-1을 쓰는 사람이 시험에 충분한 수인지 먼저 세어 봐야 한다. 두 번째로 볼 것은 값을 정당화하는 방식이다. emed는 '체중 감량과 복약 지속을 보증하고 못 지키면 대금을 깎는다'는 계약을 내걸었다. 우리가 지속 이용률 자체를 상품으로 팔려면 결국 같은 형태의 약속을 숫자로 내걸 수 있어야 한다. 세 번째는 반대 방향의 교훈이다. emed는 '앱에 남아 있는 비율'을 '약을 제대로 쓰는 비율'로 바꿔 부르면서 20억 달러짜리 이야기를 만들었다. 우리가 같은 종류의 지표를 낼 때는 무엇을 세는지, 분모가 무엇인지 먼저 정해 두어야 나중에 뒤집히지 않는다.\", \"screenshots\": [{\"file\": \"emed_home.png\", \"caption\": \"첫 화면. 고용주용과 개인용 두 갈래로 나뉘어 있고, 내세우는 문구가 '시작하기 쉽고 계속하기는 더 쉽다'이다.\", \"from\": \"https://www.emed.com\"}, {\"file\": \"emed_claims.png\", \"caption\": \"순응도 90%의 실제 표기. '10명 중 9명이 처방대로 따른다', '10명 중 9명이 6개월 넘게 프로그램에 남는다'로 적혀 있고 출처는 'emed population health data (2025)'라는 자사 데이터다.\", \"from\": \"https://www.emed.com/download\"}, {\"file\": \"emed_pricing.png\", \"caption\": \"소비자가 직접 가입할 때의 값. 최초 검사비 49달러, 약값 월 149.99달러부터, 회비 월 149.99달러가 각각 따로 붙는다.\", \"from\": \"https://www.emed.com/join/home\"}, {\"file\": \"emed_ios.png\", \"caption\": \"미국 앱스토어 페이지. 앱 설명이 '회사가 지원하는 체중 관리'로 되어 있어 고용주를 거쳐 들어오는 사람을 위한 도구임을 드러낸다. 평점 4.2에 평가 10건뿐이다.\", \"from\": \"https://apps.apple.com/us/app/emed-population-health/id6741202488\"}], \"sources\": [{\"title\": \"emed 첫 화면\", \"url\": \"https://www.emed.com\", \"note\": \"고용주용과 개인용으로 갈리는 구조와 내세우는 문구를 확인했다.\"}, {\"title\": \"emed 고용주용 페이지\", \"url\": \"https://www.emed.com/employers\", \"note\": \"pbm을 빼고 약을 직접 조달한다는 설명, 성과 보증 문구, 자가 채혈 검사 여섯 항목, 회원 여정 절차를 확인했다.\"}, {\"title\": \"emed 개인 가입 페이지\", \"url\": \"https://www.emed.com/join/home\", \"note\": \"소비자가 직접 낼 값(49달러, 149.99달러, 149.99달러)과 위고비 알약 취급 사실을 확인했다.\"}, {\"title\": \"emed 개인 가입 faq\", \"url\": \"https://www.emed.com/join/faq\", \"note\": \"fda 허가 정품만 쓴다는 답변, 처방 약은 위고비라는 답변, 자사 검사 키트만 인정한다는 답변, 첫 검사에서 약 99%가 한 항목 이상 정상 범위를 벗어난다는 서술을 확인했다.\"}, {\"title\": \"emed 앱 안내 페이지\", \"url\": \"https://www.emed.com/download\", \"note\": \"순응도 90%의 실제 표기와 출처 표시('emed population health data (2025)')를 확인했다.\"}, {\"title\": \"emed 회사 소개 페이지\", \"url\": \"https://www.emed.com/about\", \"note\": \"경영진 명단, 코로나 시기 실적 주장, aon과 thrive global, cvs health 제휴 표기를 확인했다.\"}, {\"title\": \"emed 자율 가입형 상품 페이지\", \"url\": \"https://www.emed.com/voluntary\", \"note\": \"회사 부담 0달러, 직원이 월 149.99달러를 내는 방식임을 확인했다.\"}, {\"title\": \"emed 영국 사업 페이지\", \"url\": \"https://www.emed.com/uk\", \"note\": \"nhs 환자 10만 명 이상 1차 진료, shemed와 hemed로 5만 명 이상 관리를 확인했다.\"}, {\"title\": \"tom brady 최고 웰니스 책임자 선임 보도자료\", \"url\": \"https://www.emed.com/in-the-news/tom-brady-named-chief-wellness-officer-of-emed\", \"note\": \"2026년 1월 12일 자다. 순응도 90%, 평균 21파운드 감량, 99% 지표 개선, 관리받지 않는 프로그램의 35% 순응도, 3년 차 최대 3배 투자 회수라는 주장을 원문 그대로 확인했다.\"}, {\"title\": \"2억 달러 조달 보도자료\", \"url\": \"https://www.prnewswire.com/news-releases/emed-raises-200-million-at-2-billion-plus-valuation-302725381.html\", \"note\": \"2026년 3월 26일 자다. 기업가치, 투자자 명단, 인두제 방식 도입 계획을 확인했다.\"}, {\"title\": \"aon 전략적 투자 보도자료\", \"url\": \"https://www.prnewswire.com/in/news-releases/aon-announces-strategic-investment-in-emed-to-scale-glp-1-population-health-platform-302532187.html\", \"note\": \"2025년 8월 18일 자다. aon이 자사 고용주 고객에게 emed를 공급한다는 내용과 aon 사내 프로그램 실적(등록 1,200명 이상, 평균 22.4파운드 감량, 유지율 95%)을 확인했다.\"}, {\"title\": \"aon 2025 회계연도 사업보고서 자회사 목록(sec 10-k 별지 21)\", \"url\": \"https://www.sec.gov/archives/edgar/data/315293/000162828026008116/exhibit2112025.htm\", \"note\": \"emed population health, inc.가 2025년 12월 31일 기준 aon의 자회사로 올라 있음을 확인했다.\"}, {\"title\": \"aon의 glp-1 인력 분석 보도자료\", \"url\": \"https://www.prnewswire.com/news-releases/aon-unveils-first-workforce-focused-analysis-on-glp-1s-medications-and-holistic-support-can-transform-workforce-health-and-bend-the-cost-curve-302441869.html\", \"note\": \"2025년 4월 30일 자다. 청구 데이터 5,000만 명 중 glp-1 사용자 13만 9천 명을 본 분석이며 emed 참가자 대상이 아님을 확인했다.\"}, {\"title\": \"pitchbook, 업계 통념을 뒤집는 순응도 주장으로 2억 달러를 조달했다\", \"url\": \"https://pitchbook.com/news/articles/linda-yaccarinos-glp-1-telehealth-unicorn-raises-200m-on-adherence-claim-that-bucks-industry-norm\", \"note\": \"emed가 주장한 유니버시티 칼리지 런던 분석과 nature medicine 게재 예정 발언, 애널리스트의 '동료 심사와 임상 검증이 없다'는 평가를 확인했다.\"}, {\"title\": \"emed가 등록한 유일한 연구(isrctn12421711)\", \"url\": \"https://www.isrctn.com/isrctn12421711\", \"note\": \"emed가 스스로 의뢰·자금을 대고 연구 책임자도 emed 직원이며, 순응도를 '권고 활동 완료 비율'로 정의하고, 결과가 없으며 종료가 2027년 4월로 미뤄졌음을 확인했다.\"}, {\"title\": \"rodriguez 외, glp-1 중단과 재개 연구(jama network open, 2025년 1월 31일)\", \"url\": \"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2829779\", \"note\": \"과체중 또는 비만인 성인 12만 5,474명 실사용 데이터다. 1년 중단률은 전체 53.6%, 당뇨가 없는 사람은 64.8%였고, 2년 중단률은 전체 72.2%, 당뇨가 없는 사람은 84.4%였다. 문제 정의의 근거로 썼다.\"}, {\"title\": \"meyer 외, 메디케이드 glp-1 순응도 연구(jmcp 2026)\", \"url\": \"https://pmc.ncbi.nlm.nih.gov/articles/pmc12948758/\", \"note\": \"7,493명에서 6개월 시점 지속률 60.8%, 순응도(pdc 80% 이상) 60.1%임을 확인했다. emed의 '두 배' 주장을 검증하는 기준으로 썼다.\"}, {\"title\": \"emed의 babylon 인수 보도자료\", \"url\": \"https://www.prnewswire.co.uk/news-releases/emed-healthcare-uk-promises-continuity-and-expansion-following-successful-acquisition-of-babylon---marking-a-new-era-for-digital-first-primary-care-in-the-uk-301962293.html\", \"note\": \"2023년 영국 babylon health와 gp at hand 인수를 확인했다. 대금 679만 파운드와 매출 수치는 영국 기업등기소 감사보고서(법인번호 15085216)에서 확인했다.\"}, {\"title\": \"emed의 science 37 공개매수 서류(sec)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1819113/000110465924013752/tm244930-1_sctot.htm\", \"note\": \"주당 5.75달러, 약 3,800만 달러 규모의 인수와 공동창업자 patrice harris의 직함을 확인했다.\"}, {\"title\": \"abbott, binaxnow 가정용 검사 fda 긴급사용승인 보도자료\", \"url\": \"https://abbott.mediaroom.com/2020-12-16-abbotts-binaxnow-covid-19-rapid-test-receives-fda-emergency-use-authorization-for-first-virtually-guided-at-home-rapid-test-using-emeds-digital-health-platform\", \"note\": \"2020년 12월 16일 자다. 화상 감독 플랫폼이 emed의 것임을 확인했다.\"}, {\"title\": \"mader 대 emed 소송 기록(미국 법원 전자기록)\", \"url\": \"https://www.courtlistener.com/docket/73318156/mader-v-emed-llc/\", \"note\": \"2026년 5월 8일 제소, 2026년 8월 각하 신청 등 진행 경과를 확인했다. 소장 내용은 입증되지 않은 원고 측 주장이다.\"}, {\"title\": \"pulse today, emed의 영국 임상의 정리해고와 bma의 문제 제기\", \"url\": \"https://www.pulsetoday.co.uk/news/workforce/emed-gp-redundancy-consultation-likely-to-be-unlawful-and-discriminatory-claims-bma/\", \"note\": \"2024년 4월 자다. 영국의사협회가 정리해고 협의를 위법 가능성이 높고 간접 차별에 해당한다고 밝힌 내용을 확인했다.\"}, {\"title\": \"linda yaccarino ceo 선임 보도자료\", \"url\": \"https://www.prnewswire.com/news-releases/emed-population-health-announces-appointment-of-former-x-twitter-ceo-linda-yaccarino-as-new-chief-executive-officer-302521918.html\", \"note\": \"2025년 8월 5일 자다. 취임한 법인이 모회사가 아니라 emed population health임을 확인했다.\"}, {\"title\": \"dr. dyan hes 최고 의료 책임자 선임 보도자료\", \"url\": \"https://www.prnewswire.com/news-releases/emed-population-health-appoints-dr-dyan-hes-as-chief-medical-officer-302570333.html\", \"note\": \"2025년 9월 30일 자다. 경력과 선임 시점을 확인했다.\"}, {\"title\": \"axios, glp-1 유니콘이 tom brady 등에게 2억 달러를 조달했다\", \"url\": \"https://www.axios.com/2026/03/26/glp-1-yaccarino-emed-tom-brady\", \"note\": \"비용을 나누고 순응도를 높이는 임상 프로그램을 제공한다는 사업 설명, 펩타이드 영역 확장과 해외 진출 계획, 경구용 glp-1의 순응도 불확실성 언급을 확인했다.\"}, {\"title\": \"employee benefit news, 의료 종사자용 glp-1 프로그램\", \"url\": \"https://www.benefitnews.com/news/tom-bradys-new-play-making-glp-1s-affordable-for-healthcare-workers\", \"note\": \"고용주가 1인당 월 25달러, 직원이 월 99달러를 내는 별도 가격 구조를 확인했다.\"}, {\"title\": \"fox business, tom brady가 emed와 손잡고 glp-1 접근을 넓힌다\", \"url\": \"https://www.foxbusiness.com/media/tom-brady-teams-digital-health-firm-emed-expand-glp-1-weight-loss-medication-access\", \"note\": \"미국인의 60% 이상이 직장을 통해 의료 혜택을 받는다는 서술을 확인했다.\"}, {\"title\": \"emed population health 아이폰 앱\", \"url\": \"https://apps.apple.com/us/app/emed-population-health/id6741202488\", \"note\": \"앱 설명이 회사가 지원하는 프로그램 참가자를 대상으로 하며, 평점 4.2에 평가 10건, 2026년 8월 24일 갱신임을 확인했다.\"}, {\"title\": \"emed 안드로이드 앱\", \"url\": \"https://play.google.com/store/apps/details?id=com.emed.s2p\", \"note\": \"평점 2.7에 평가 6건, 내려받기 1,000회 이상, 2026년 8월 24일 갱신을 확인했다.\"}, {\"title\": \"emed 뉴스 모음 페이지\", \"url\": \"https://www.emed.com/news\", \"note\": \"alight(2026년 8월), crux(2026년 7월), cvs health 제휴 소식과 mercer 조사 인용을 확인했다.\"}]}"},{"slug":"function-health","name":"Function Health","one_liner":"연 365달러 회원제로 혈액검사 160여 종을 1년에 두 번 받게 하고, 그 결과를 임상의가 검토해 앱에서 항목별 설명과 실행 지침으로 돌려주는 소비자용 검사 구독 서비스다.","sells_to":"mixed","seen_in":[{"issue":"14","section":16,"headline":"소비자에게 직접 파는 롱제비티 회사 Function Health가 경쟁사 Superpower를 기만 광고로 고소했고, 필자는 이 다툼을 시장이 커지는 신호가 아니라 모멘텀이 식는 신호로 읽었다."}],"card":{"problem":"미국에서는 어떤 혈액검사를 받을지 의사가 정하고 보험이 의학적 필요를 인정해야 비용이 처리된다. 아직 증상이 없는 사람은 검사를 받기 어렵고, 비용을 미리 알기도 어려우며 진료 예약도 몇 달씩 기다려야 한다.","solution":"연 365달러를 내면 전국 채혈소나 집에서 피를 뽑아 혈액검사 160여 종을 1년에 두 번 받고, 임상의가 검토한 결과를 앱에서 항목별 설명과 식단·보충제 지침까지 붙여 받는다.","price":"연 365달러(하루 1달러)다. 전신 MRI는 회원 899달러, 비회원 999달러이고 심장 CT는 349달러, 폐 CT는 399달러로 따로 받는다.","tags":["혈액검사","연 구독","전신 MRI","자가 주문 검사","롱제비티"],"headline_traction":"2025년 11월 시리즈 B로 2억 9,800만 달러를 기업가치 25억 달러에 받았고, 2026년 7월에는 General Catalyst 고객가치펀드에서 성장자금 4억 5,000만 달러를 추가로 받았다.","watch":"회원 수와 누적 검사 건수는 모두 회사가 스스로 낸 수치이고, 건강한 사람이 해마다 이만큼 혈액검사를 받는 것은 미국 진료 표준이 아니라고 반박하는 의사들이 있다."},"screenshots":[{"file":"function-health_home.png","caption":"공식 사이트 첫 화면이다. 연 160여 종 검사와 하루 1달러라는 값을 앞세운다.","from":"https://www.functionhealth.com"},{"file":"function-health_pricing.png","caption":"가격 안내 페이지다. 연 365달러 단일 회원제와 포함 항목, 추가 결제 항목을 보여 준다.","from":"https://www.functionhealth.com/pricing"},{"file":"function-health_imaging.png","caption":"영상검사 안내 페이지다. Ezra와 함께 제공하는 전신 MRI와 심장·폐 CT의 회원가와 정가, 촬영 시간이 나온다.","from":"https://www.functionhealth.com/imaging"}],"q":"{\"slug\": \"function-health\", \"name\": \"function health\", \"one_liner\": \"연 365달러 회원제로 혈액검사 160여 종을 1년에 두 번 받게 하고, 그 결과를 임상의가 검토해 앱에서 항목별 설명과 실행 지침으로 돌려주는 소비자용 검사 구독 서비스다.\", \"site\": \"https://www.functionhealth.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"14\", \"section\": 16, \"headline\": \"소비자에게 직접 파는 롱제비티 회사 function health가 경쟁사 superpower를 기만 광고로 고소했고, 필자는 이 다툼을 시장이 커지는 신호가 아니라 모멘텀이 식는 신호로 읽었다.\"}], \"card\": {\"problem\": \"미국에서는 어떤 혈액검사를 받을지 의사가 정하고 보험이 의학적 필요를 인정해야 비용이 처리된다. 아직 증상이 없는 사람은 검사를 받기 어렵고, 비용을 미리 알기도 어려우며 진료 예약도 몇 달씩 기다려야 한다.\", \"solution\": \"연 365달러를 내면 전국 채혈소나 집에서 피를 뽑아 혈액검사 160여 종을 1년에 두 번 받고, 임상의가 검토한 결과를 앱에서 항목별 설명과 식단·보충제 지침까지 붙여 받는다.\", \"price\": \"연 365달러(하루 1달러)다. 전신 mri는 회원 899달러, 비회원 999달러이고 심장 ct는 349달러, 폐 ct는 399달러로 따로 받는다.\", \"tags\": [\"혈액검사\", \"연 구독\", \"전신 mri\", \"자가 주문 검사\", \"롱제비티\"], \"headline_traction\": \"2025년 11월 시리즈 b로 2억 9,800만 달러를 기업가치 25억 달러에 받았고, 2026년 7월에는 general catalyst 고객가치펀드에서 성장자금 4억 5,000만 달러를 추가로 받았다.\", \"watch\": \"회원 수와 누적 검사 건수는 모두 회사가 스스로 낸 수치이고, 건강한 사람이 해마다 이만큼 혈액검사를 받는 것은 미국 진료 표준이 아니라고 반박하는 의사들이 있다.\"}, \"problem\": \"한국에서는 국민건강보험이 2년마다 국가건강검진을 보내 주고, 항목을 늘리고 싶으면 동네 병원에서 비교적 적은 돈으로 추가할 수 있다. 미국은 검사를 주문할 권한이 사실상 의사에게 있고, 보험이 의학적 필요를 인정해야 비용이 처리되기 때문에 아직 증상이 없는 사람은 검사를 받기가 어렵다. 값을 미리 알기 어렵고 진료 예약이 몇 달씩 밀리는 사정도 겹친다. 그래서 자기 건강을 스스로 관리하려는 사람들이 의료 체계 밖에서 검사를 직접 주문하는 흐름이 생겼고, 미국 공영 라디오 npr은 이 흐름을 두고 의사가 검사를 지시하고 결과를 알려 주던 오래된 방식이 뒤집히는 중이라고 정리했다. function health는 바로 그 자리를 겨냥해, 의사를 거치지 않고 소비자가 값을 알고 사는 검사 상품을 판다.\", \"solution\": \"가입하면 먼저 건강 이력 문진을 채우고 첫 검사 예약을 잡는다. 채혈은 전국 2,000곳이 넘는 quest diagnostics 채혈소에서 하거나, 자격을 갖춘 채혈 전문가가 집이나 사무실로 찾아오는 방문 채혈을 고를 수 있다. 회사 설명으로는 결과가 대략 2주 뒤에 나오고, 임상의가 모든 항목을 검토해 문제가 되는 값을 표시한다. 회원은 앱에서 항목별 설명과 함께 식단·보충제를 포함한 개인별 실행 지침을 받고, 3~6개월 뒤 60여 종을 다시 검사해 변화를 추적한다. 값은 연 365달러이며 하루 1달러라고 광고한다. 전신 mri와 심장·폐 ct, 다중암 혈액검사인 galleri, 뇌 건강 패널 같은 항목은 회원이라도 따로 결제해야 한다.\", \"features\": [{\"name\": \"연 160여 종 혈액검사\", \"detail\": \"첫 검사에서 100여 종을 재고 3~6개월 뒤 60여 종을 다시 잰다. 회사는 호르몬과 갑상선 16종, 암을 포함한 조용한 위험 34종, 심장·대사 18종, 노화 34종, 정신건강·집중력 20종처럼 영역을 나눠 보여 준다.\"}, {\"name\": \"임상의 검토와 실행 지침\", \"detail\": \"모든 결과를 임상의가 개인 건강 이력에 비춰 검토하고 문제 항목을 표시하며, 그에 맞춘 식단·보충제 지침을 함께 준다.\"}, {\"name\": \"전신 mri와 ct\", \"detail\": \"2025년 5월에 인수한 영상 검사 회사 ezra를 통해 제공한다. 22분짜리 전신 mri는 회원 899달러, 비회원 999달러이고 척추를 포함하면 1,499달러, 골격·신경까지 보는 약 2시간 55분짜리는 3,999달러다. 심장 ct는 349달러, 폐 ct는 399달러다.\"}, {\"name\": \"방문 채혈\", \"detail\": \"채혈 전문가가 집이나 사무실로 와서 20분 안에 채혈을 끝낸다. 2026년 4월에 인수한 방문 채혈 회사 getlabs가 이 부분을 맡는다.\"}, {\"name\": \"외부 ai 도구 연결\", \"detail\": \"회원이 자기 검사 결과를 chatgpt, claude, perplexity, microsoft copilot health 같은 외부 ai 서비스로 연결해 질문할 수 있게 커넥터를 열어 두었다. 앱 안에도 자체 ai 대화 기능이 있다.\"}, {\"name\": \"보충제 정보\", \"detail\": \"2026년에 보충제 정보 서비스 suppco를 인수해 보충제 선택을 돕는 기능을 붙였다.\"}, {\"name\": \"기업 판매\", \"detail\": \"직원 500명 이상 대기업, 복리후생 컨설턴트, 499명 이하 소규모 팀으로 나눠 같은 검사 상품을 복리후생으로 판다. 기업 대상 가격은 공개하지 않는다.\"}], \"differentiator\": \"같은 자리에는 연 199달러에 100종이 넘는 검사를 내세우는 superpower, 연 499달러를 349달러로 할인해 130종 넘는 검사를 파는 hims & hers, 99달러짜리 소규모 패널을 반지 사용자에게 파는 oura가 있다. function health는 검사 종수를 가장 많이 내세우면서, 혈액검사 구독에 전신 mri와 ct까지 한 회사 안에 묶었다는 점이 다르다. 전신 mri만 파는 prenuvo와 달리 피검사가 본체이고 영상은 추가 결제 항목이다. 다만 실제 채혈과 분석은 superpower와 마찬가지로 quest diagnostics에 맡기기 때문에, 검사 자체의 품질이 아니라 결과를 어떻게 보여 주고 무엇을 하라고 알려 주는 층에서 경쟁한다.\", \"team\": [{\"name\": \"jonathan swerdlin\", \"role\": \"공동창업자 겸 최고경영자\", \"background\": \"회사 소개 페이지에 공동창업자 겸 ceo로 올라 있다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"mark hyman\", \"role\": \"공동창업자 겸 최고의료책임자\", \"background\": \"의사이며 cleveland clinic에서 일했다. npr은 그를 기능의학을 가장 목소리 높여 주장하는 사람 가운데 하나로 소개한다.\"}, {\"name\": \"pranitha patil\", \"role\": \"공동창업자 겸 최고사업책임자\", \"background\": \"회사 소개 페이지에서 확인했다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"seth weisfeld\", \"role\": \"공동창업자 겸 최고디자인책임자\", \"background\": \"회사 소개 페이지에서 확인했다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"dan swerdlin\", \"role\": \"공동창업자 겸 법무총괄\", \"background\": \"회사 소개 페이지에서 확인했다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"neil shah\", \"role\": \"최고운영책임자\", \"background\": \"slack에서 일하다 2025년에 합류했다.\"}, {\"name\": \"daniel k. sodickson\", \"role\": \"최고의학과학책임자\", \"background\": \"의사이자 연구자이며 병렬 mri 기술을 만든 사람으로 소개된다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"redpoint ventures가 이끈 시리즈 b로 2억 9,800만 달러를 받았고 기업가치를 25억 달러로 인정받았다. andreessen horowitz와 samsung next가 참여했고 matt damon, magic johnson 같은 유명인도 투자자로 이름을 올렸다.\", \"when\": \"2025-11\", \"source\": \"function health 공식 발표(functionhealth.com/article/function-announcement), athletech news\"}, {\"type\": \"funding\", \"detail\": \"general catalyst의 고객가치펀드에서 성장자금 4억 5,000만 달러를 받았다. 회사는 이 돈을 사업 확장과 최근 인수 건을 뒷받침하는 데 쓴다고 밝혔다.\", \"when\": \"2026-07\", \"source\": \"pr newswire 보도자료(2026년 7월 30일)\"}, {\"type\": \"partnership\", \"detail\": \"전신 mri 회사 ezra를 인수해 499달러짜리 22분 전신 mri를 내놓았다. ezra는 emi gal이 창업했고 인수 전까지 4,100만 달러를 조달한 상태였다. 거래 금액은 공개하지 않았다.\", \"when\": \"2025-05\", \"source\": \"athletech news, function health 공식 발표\"}, {\"type\": \"partnership\", \"detail\": \"방문 채혈 회사 getlabs와 보충제 정보 서비스 suppco를 인수해 집에서 피를 뽑는 경로와 보충제 기능을 붙였다.\", \"when\": \"2026-04\", \"source\": \"pr newswire 보도자료, function health 뉴스룸\"}, {\"type\": \"customers\", \"detail\": \"npr은 function health가 수십만 명 규모의 회원에게 검사를 제공한다고 적었다. 회사는 자사 소개 페이지에서 회원에게 전달한 검사 결과가 누적 7,500만 건을 넘었다고 밝힌다.\", \"when\": \"2026-04\", \"source\": \"npr(2026년 4월 14일), function health 소개 페이지\"}, {\"type\": \"traffic\", \"detail\": \"미국 애플 앱스토어에서 평가 24,473건에 평점 4.9를 받았다. 구글 플레이 설치 수는 1만 회 이상으로, 안드로이드 쪽 규모가 훨씬 작다.\", \"when\": \"2026-09\", \"source\": \"애플 itunes 검색 api와 구글 플레이 상품 페이지에서 직접 확인\"}, {\"type\": \"award\", \"detail\": \"time 100 most influential companies, fast company most innovative companies 2024, linkedin 2025 top startups에 이름을 올렸다.\", \"when\": \"\", \"source\": \"function health 소개 페이지(회사 자체 표기)\"}], \"caveats\": \"회원 수, 누적 검사 건수, 회원의 40퍼센트가 가구 중위소득 9만 5,000달러 미만 지역에 산다는 소득 분포는 모두 회사가 낸 수치이고 제삼자가 확인한 것이 아니다. 값도 확인이 필요하다. 2025년 5월 ezra 인수를 알릴 때는 전신 mri가 499달러라고 발표했으나, 2026년 9월 현재 공식 사이트에는 회원 899달러, 비회원 999달러로 올라 있다. 뉴스레터가 다룬 소송은 그 뒤 끝났다. function health가 2026년 1월 26일 캘리포니아 중부연방지방법원에 낸 소송(사건번호 2:26-cv-00810)은 2026년 6월 12일 양측이 합의했다는 신고와 함께 각하됐다. 판사는 7월 13일까지 재개할 수 있는 조건을 달았고 그 뒤에는 다시 제기할 수 없는 각하로 굳는다고 밝혔다. 합의 내용은 공개되지 않았다. 의학적으로도 반론이 있다. npr 기사에서 노스웨스턴대 의대의 jeffrey linder는 건강한 사람이 해마다, 또는 반년마다 혈액검사를 받는 것은 미국의 진료 표준이 아니라고 말한다. 정상 범위를 조금 벗어난 값 하나가 불필요한 추가 검사로 이어지는 문제도 지적하는데, 그가 인용한 연구에서는 그런 연쇄가 시작된 사례의 33퍼센트에서 처음 검사 자체가 임상적으로 부적절했다. 공동창업자 mark hyman이 대표하는 기능의학은 주류 의학과 거리가 있는 접근이라는 점도 같은 기사가 짚는다.\", \"for_us\": \"검사 자체는 3개월 안에 소프트웨어 인력만으로 만들 수 없지만, 이 회사가 실제로 파는 것은 채혈이 아니라 결과를 해석해 주는 층이다. npr 기사가 보여 주는 공백이 정확히 그 자리다. 사람들이 검사 결과를 받아 들고도 무엇을 해야 할지 몰라 검색을 하고, 자기 주치의를 만나기까지 두 달을 기다린다. 이미 가지고 있는 건강 데이터를 항목별로 풀어 설명하고 다음에 무엇을 할지 알려 주는 화면은 소프트웨어만으로 만들 수 있다. 재검사 시점을 3~6개월 뒤로 잡아 다시 불러들이는 구조도 앱의 재방문 설계로 그대로 옮길 수 있다. 회원이 자기 데이터를 chatgpt나 claude 같은 외부 ai로 내보내 질문하게 열어 둔 점도 눈여겨볼 만하다. 검사 데이터를 자기 앱 안에 가두지 않고 밖으로 흘려보내는 쪽을 택했고, 그것이 오히려 유입 경로가 됐다. 다만 미국 의사들이 잦은 검사 자체를 표준이 아니라고 보는 만큼, 검사 권유가 아니라 이미 나온 결과의 해석을 돕는 방향이 안전하다.\", \"screenshots\": [{\"file\": \"function-health_home.png\", \"caption\": \"공식 사이트 첫 화면이다. 연 160여 종 검사와 하루 1달러라는 값을 앞세운다.\", \"from\": \"https://www.functionhealth.com\"}, {\"file\": \"function-health_pricing.png\", \"caption\": \"가격 안내 페이지다. 연 365달러 단일 회원제와 포함 항목, 추가 결제 항목을 보여 준다.\", \"from\": \"https://www.functionhealth.com/pricing\"}, {\"file\": \"function-health_imaging.png\", \"caption\": \"영상검사 안내 페이지다. ezra와 함께 제공하는 전신 mri와 심장·폐 ct의 회원가와 정가, 촬영 시간이 나온다.\", \"from\": \"https://www.functionhealth.com/imaging\"}, {\"file\": \"function-health_ios.png\", \"caption\": \"미국 애플 앱스토어 페이지다. 평가 24,473건에 평점 4.9로, 소비자용 앱이 주된 창구임을 보여 준다.\", \"from\": \"https://apps.apple.com/us/app/function-health/id6471280307\"}], \"sources\": [{\"title\": \"function health 공식 사이트 첫 화면\", \"url\": \"https://www.functionhealth.com\", \"note\": \"검사 종수, 연 365달러라는 값, 검사 영역별 항목 수를 확인했다.\"}, {\"title\": \"function health 가격 안내\", \"url\": \"https://www.functionhealth.com/pricing\", \"note\": \"단일 회원제 구조와 추가 결제 항목을 확인했다.\"}, {\"title\": \"function health 이용 흐름 안내\", \"url\": \"https://www.functionhealth.com/how-it-works\", \"note\": \"가입부터 채혈, 결과 2주, 임상의 검토, 재검사까지의 순서를 확인했다.\"}, {\"title\": \"function health 영상검사 안내\", \"url\": \"https://www.functionhealth.com/imaging\", \"note\": \"전신 mri와 ct의 회원가·정가와 촬영 시간을 확인했다.\"}, {\"title\": \"function health 회사 소개\", \"url\": \"https://www.functionhealth.com/about\", \"note\": \"공동창업자 다섯 명의 이름과 직함, 누적 검사 결과 7,500만 건, 수상 이력을 확인했다.\"}, {\"title\": \"function health 기업 대상 페이지\", \"url\": \"https://www.functionhealth.com/for-business\", \"note\": \"고용주와 복리후생 컨설턴트에게도 같은 상품을 판다는 사실을 확인했다.\"}, {\"title\": \"function, 의료 인텔리전스 랩 출범과 기업가치 25억 달러 발표\", \"url\": \"https://www.functionhealth.com/article/function-announcement\", \"note\": \"시리즈 b 2억 9,800만 달러, 기업가치 25억 달러, ezra 인수와 499달러 mri, 신규 경영진을 확인했다. 회사가 낸 발표다.\"}, {\"title\": \"function secures $450 million growth financing from general catalyst's customer value fund\", \"url\": \"https://www.prnewswire.com/news-releases/function-secures-450-million-growth-financing-from-general-catalysts-customer-value-fund-cvf-302838766.html\", \"note\": \"2026년 7월 30일 자 보도자료로 4억 5,000만 달러 성장자금과 getlabs·suppco 인수를 확인했다.\"}, {\"title\": \"function health raises $298 million at $2.5 billion valuation (athletech news)\", \"url\": \"https://athletechnews.com/function-health-raises-298-million-at-2-5-billion-valuation/\", \"note\": \"투자 주체와 회원비가 499달러에서 365달러로 내려간 사실을 제삼자 보도로 확인했다.\"}, {\"title\": \"function health acquires ezra, launches $499 full-body mri (athletech news)\", \"url\": \"https://athletechnews.com/function-health-acquires-ezra-launches-499-full-body-mri/\", \"note\": \"2025년 5월 5일 인수 발표, ezra 창업자와 조달액, 거래 금액 비공개를 확인했다.\"}, {\"title\": \"function sues rival lab-testing startup superpower, alleging false marketing (athletech news)\", \"url\": \"https://athletechnews.com/function-superpower-lawsuit-lab-testing/\", \"note\": \"소송의 핵심 주장과 양쪽 회원비, 조달액을 확인했다.\"}, {\"title\": \"competing biomarker providers clash: function health sues superpower health (arentfox schiff)\", \"url\": \"https://www.afslaw.com/perspectives/longevity-lens/competing-biomarker-providers-clash-function-health-sues-superpower\", \"note\": \"법무법인이 정리한 소장 내용으로 사건번호, 청구 근거, 구체적 광고 주장 네 가지를 확인했다.\"}, {\"title\": \"function health, inc. v. superpower health inc. 사건 기록\", \"url\": \"https://www.courtlistener.com/docket/72191232/function-health-inc-v-superpower-health-inc/\", \"note\": \"2026년 1월 26일 제소와 2026년 6월 12일 합의에 따른 각하 명령 전문을 법원 기록에서 직접 확인했다.\"}, {\"title\": \"you can order your own blood work now. interpreting the results is another story (npr)\", \"url\": \"https://www.npr.org/2026/04/14/nx-s1-5780066/oura-function-wearables-blood-testing-bloodwork\", \"note\": \"회원 규모, 경쟁사 가격 비교, 잦은 검사에 대한 의사들의 반론과 불필요한 추가 검사 연쇄 문제를 확인했다.\"}, {\"title\": \"function sues superpower over biomarker claims (fitt insider)\", \"url\": \"https://insider.fitt.co/function-sues-superpower-over-biomarker-claims/\", \"note\": \"두 회사 모두 채혈과 분석을 quest에 맡긴다는 점을 확인했다.\"}, {\"title\": \"미국 애플 앱스토어 function health 앱\", \"url\": \"https://apps.apple.com/us/app/function-health/id6471280307\", \"note\": \"평점 4.9, 평가 24,473건, 무료 배포, 2024년 8월 공개를 확인했다.\"}, {\"title\": \"구글 플레이 function health 앱\", \"url\": \"https://play.google.com/store/apps/details?id=com.functionhealth\", \"note\": \"설치 1만 회 이상과 앱 소개 문구를 확인했다.\"}, {\"title\": \"ezra 공식 사이트\", \"url\": \"https://ezra.com\", \"note\": \"function과 하나가 되었다는 안내와 현재 촬영 가격표를 확인했다.\"}]}"},{"slug":"goodrx","name":"GoodRx","one_liner":"미국에서 처방약을 보험을 쓰지 않고 현금으로 살 때, 약국마다 다른 값을 비교해 주고 할인가를 받을 수 있는 코드를 무료로 발급하는 회사다. 소비자에게는 돈을 받지 않고, 그 거래를 성사시킨 대가로 약값 협상 대행사와 제약사, 약국에서 수수료를 받는다.","sells_to":"mixed","seen_in":[{"issue":"18","section":11,"headline":"2026년 매출 가이던스를 시장 기대보다 낮게 내놓아 주가가 18% 빠졌다는 한 줄 소식으로 나왔다."}],"card":{"problem":"미국은 같은 약이라도 약국마다 값이 다르고, 보험이 있어도 본인부담금이 커서 보험을 쓰는 것보다 현금으로 사는 편이 싼 경우가 자주 생긴다. 소비자는 창구에서 값을 부르기 전까지 얼마를 내야 하는지 알 방법이 없다.","solution":"약 이름과 사는 곳을 넣으면 근처 약국별 할인가를 비교해 주고, 무료 코드를 발급해 그 코드를 창구에 보여 주면 그 값에 살 수 있게 한다. 소비자는 돈을 내지 않고, 거래가 성사되면 약값 협상 대행사와 제약사, 약국이 GoodRx에 수수료를 낸다.","price":"가격 비교와 쿠폰 코드는 무료다. 유료 회원제 GoodRx Companion은 개인 월 14.99달러이고, 1년치를 미리 내면 119.88달러로 월 9.99달러가 된다.","tags":["처방약 할인","가격 비교","쿠폰","현금 결제","구독"],"headline_traction":"2025년 매출 7억 9,690만 달러를 냈고, 연간 약 2,500만 명이 쓴다고 회사가 밝혔다.","watch":"핵심인 쿠폰 사업이 줄고 있다. 2026년 2분기 처방 거래 매출이 1년 전보다 26% 줄었고, 성장은 제약사가 비용을 내는 사업에서 나온다. 2023년에는
