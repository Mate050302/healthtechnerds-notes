자체가 하나의 사업이 된다."},{"term":"애퀴하이어","ko":"사람을 데려오려는 인수","plain":"제품이나 매출이 아니라 그 회사의 인력을 통째로 데려오려고 회사를 사는 것을 말한다. 인수 대금의 큰 부분을 직원 잔류 조건에 묶어 두는 것이 전형적인 형태다."}]},{"heading_ko":"Anthropic의 Claude for Healthcare","heading_en":"Other Top Headlines","skip":null,"summary":"Anthropic이 헬스케어용 도구 모음을 발표했다는 한 줄 소식이다. 지난 10월에 나온 생명과학용 도구를 보완하는 성격이다. 원문은 구체적인 기능이나 대상 고객을 설명하지 않는다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Claude for Healthcare","what":"Anthropic이 일요일에 발표한 새로운 도구 모음으로, 지난 10월 발표된 Claude for Life Sciences를 보완한다.","scale":"","note":"원문은 대상 고객을 밝히지 않았다.","sells_to":"other"}],"notes":[]},{"heading_ko":"Abridge와 Availity의 제휴","heading_en":"Other Top Headlines","skip":null,"summary":"진료 현장의 대화형 AI 플랫폼과 보험사 연결망이 손을 잡았다. 의사가 진료 중에 보험사의 사전 승인을 실시간으로 받게 하는 것이 골자다. 필자는 조각난 도구가 아니라 전 과정을 아우르는 청구·수납 상품을 원하는 고객 수요 때문에, 이런 제휴가 2026년에 더 늘 것으로 본다.","insight":null,"signal":null,"author":[{"claim":"2026년에는 이런 제휴가 더 많이 나올 것이다.","evidence":"RCM 니즈의 일부만이 아니라 전 영역을 다루는 상품에 대한 고객의 관심을 근거로 들었다."}],"experts":[],"cases":[{"name":"Abridge와 Availity 제휴","what":"Availity의 실시간 사전 승인을 Abridge의 진료 현장 대화형 플랫폼 안에 심는다.","scale":"","note":"진료실 안에서 벌어지는 대화와 보험 승인 절차가 한 화면으로 붙는 방향이다.","sells_to":"provider"}],"notes":[{"term":"사전 승인","ko":"보험사의 사전 허락","plain":"의사가 어떤 검사나 약을 처방하기 전에 보험사에 미리 허락을 받아야 하는 절차다. 서류와 대기가 길어 미국 의료 현장에서 원성이 가장 큰 업무 가운데 하나이며, 환자는 그 사이 치료를 기다리게 된다. 한국에는 이에 해당하는 일상적 절차가 없다."}]},{"heading_ko":"Kaiser의 5억 5,600만 달러 합의","heading_en":"Other Top Headlines","skip":null,"summary":"미 법무부가 Kaiser 계열사들과 리스크 점수 부풀리기 혐의를 두고 합의했다. 금액도 크지만 필자가 더 주목하는 것은 시차다. 문제가 된 행위는 7년에서 16년 전의 일이다.","insight":null,"signal":null,"author":[{"claim":"리스크 조정 논의는 민간 업계의 행위에 초점을 맞추지만, 규제 당국이 대응하는 데 왜 그렇게 오래 걸렸는지에 대해서도 할 말이 더 있다.","evidence":"합의 대상이 된 행위가 2009년에서 2018년 사이에 일어났다는 점을 들었다."}],"experts":[],"cases":[{"name":"DOJ와 Kaiser Permanente 계열사 합의","what":"Kaiser가 2009년부터 2018년 사이에 리스크 점수를 부풀렸다는 혐의를 해소하기 위해 합의금을 내기로 했다.","scale":"5억 5,600만 달러","note":"적발과 회수까지 10년 안팎이 걸린다는 점이, 부풀리기가 계속 반복되는 이유를 설명해 준다.","sells_to":"none"}],"notes":[]},{"heading_ko":"Grassley의 UnitedHealth 보고서","heading_en":"Other Top Headlines","skip":null,"summary":"상원의원 한 명이 UnitedHealth Group의 리스크 점수 운영을 두고 보고서를 냈다. 회사가 제출한 5만 페이지 분량의 내부 문서가 공개되어 누구나 내려받을 수 있다. 앞의 Kaiser 합의와 같은 주제가 같은 주에 겹쳤다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Chuck Grassley","role":"리스크 조정 관행을 조사해 온 미 상원의원","claim":"UnitedHealth Group이 리스크 점수를 극대화했다는 결론을 담은 보고서를 냈다.","evidence":"UHG가 리스크 조정 정책과 관련해 제출한 5만 페이지 분량의 문서를 근거로 삼았고, 그 문서를 공개했다."}],"cases":[],"notes":[]},{"heading_ko":"MedPAC 연례 보고서","heading_en":"Other Top Headlines","skip":null,"summary":"민간이 운영하는 노인 공보험에 정부가 얼마나 더 쓰고 있는지를 집계한 보고서다. 2026년 기준 초과 지급 규모가 760억 달러로 추산된다. 다만 코딩 때문에 생기는 과다 지급은 계산식이 바뀌면서 줄고 있다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Medicare Payment Advisory Commission 연례 현황 보고서","what":"메디케어 어드밴티지 지급액을 행위별 수가 방식으로 지급했을 경우와 비교해 내놓았다.","scale":"2026년 기준 760억 달러 초과 지급. 코딩 관련 과다 지급은 2023년 380억 달러에서 2026년 220억 달러로 감소","note":"총 초과 지급은 여전히 크지만, 계산식을 손보는 것만으로 코딩 관련 부분은 실제로 줄었다.","sells_to":"none"}],"notes":[{"term":"MedPAC","ko":"메디케어 지급자문위원회","plain":"메디케어에 돈을 어떻게 지급할지 의회에 권고하는 독립 기구다. 정부 기관도 보험사도 아니어서, 이곳의 추산치가 업계와 정부 양쪽에서 기준으로 인용된다."},{"term":"v28","ko":"리스크 점수 계산식의 새 판","plain":"가입자의 병명에 점수를 매겨 지급액을 정하는 계산식을 개정한 것이다. 점수를 부풀리기 쉬운 병명 코드를 덜어 내는 방향으로 바뀌었고, 여러 해에 걸쳐 단계적으로 도입되면서 과다 지급이 실제로 줄고 있다."}]},{"heading_ko":"Epic의 Health Gorilla 소송","heading_en":"Other Top Headlines","skip":null,"summary":"전자의무기록 회사와 여러 병원 그룹이, 환자 기록에 부적절하게 접근했다며 데이터 중개 회사를 상대로 소송을 냈다. 원문은 한 줄로 전하고 자세한 내용은 다른 필자의 글로 넘긴다. 기록을 누가 어디까지 볼 수 있는가를 두고 벌어지는 다툼이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Epic 등의 Health Gorilla 상대 소송","what":"Epic과 여러 헬스 시스템이 환자 의무기록에 부적절하게 접근했다는 이유로 Health Gorilla를 제소했다.","scale":"","note":"의료 기록의 이동을 누가 통제하는가라는 문제가 소송으로 번진 사례다.","sells_to":"none"}],"notes":[{"term":"Epic","ko":"미국 대형 병원이 널리 쓰는 전자의무기록 회사","plain":"병원 안의 진료 기록을 담는 시스템을 만드는 회사로, 미국 대형 병원 상당수가 여기에 기록을 쌓아 둔다. 그래서 이 회사가 기록의 외부 반출을 어디까지 허용하느냐가 곧 업계 전체의 데이터 통로가 된다."},{"term":"Health Gorilla","ko":"의료 기록 중개망","plain":"여러 기관에 흩어진 환자 기록을 한 통로로 조회할 수 있게 해 주는 중개 사업자다. 흩어진 기록을 모아 주는 역할이라, 어디까지가 정당한 조회인지를 두고 병원 쪽과 부딪히기 쉽다."}]},{"heading_ko":"UnitedHealth의 농촌 병원 지급 파일럿","heading_en":"Other Top Headlines","skip":null,"summary":"보험사가 농촌 병원에 돈을 더 빨리 지급하는 시범 사업을 벌인다. 수금까지 걸리는 기간을 30일 미만에서 15일 미만으로 줄이는 것이 목표다. 자금 사정이 빠듯한 병원에게는 지급 속도 자체가 생존 문제다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"UnitedHealth 농촌 병원 지급 파일럿","what":"몇몇 주에서 6개월 동안 농촌 병원에 대한 지급을 앞당기는 시범 사업을 진행한다.","scale":"수금 기간을 30일 미만에서 15일 미만으로 단축","note":"","sells_to":"none"}],"notes":[]},{"heading_ko":"펀딩: VieCure","heading_en":"Funding Announcements","skip":null,"summary":"지역 종양내과 클리닉을 위한 AI 플랫폼이 4,300만 달러를 조달했다. 산업 장비 대기업 창업자와 벤처 펀드가 함께 이끌었다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"VieCure","what":"커뮤니티 종양내과 클리닉을 위한 AI 플랫폼을 만드는 회사가 투자를 유치했다.","scale":"4,300만 달러. Danaher 공동창업자 Mitch Rales와 Northpond Ventures가 주도","note":"","sells_to":"provider"}],"notes":[]},{"heading_ko":"펀딩: Vista AI","heading_en":"Funding Announcements","skip":null,"summary":"MRI 촬영 소프트웨어를 만드는 회사가 2,950만 달러를 조달했다. 투자자 명단에 병원 그룹들이 직접 들어 있다는 점이 눈에 띈다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Vista AI","what":"MRI 스캐닝 소프트웨어를 만드는 회사가 투자를 유치했다.","scale":"2,950만 달러. Cedars-Sinai와 Intermountain Health를 비롯한 여러 헬스 시스템이 투자자로 참여","note":"쓸 병원이 직접 돈을 넣었다는 점에서, 판로가 어느 정도 보장된 형태다.","sells_to":"provider"}],"notes":[]},{"heading_ko":"읽을거리: ChatGPT Health 커넥터 시연","heading_en":"What I'm Reading: Comparing OpenAI Health Connector with my open-source Health Skillz","skip":null,"summary":"Microsoft Healthcare의 최고 아키텍트가 ChatGPT Health에 자기 건강 데이터를 연결하는 과정을 직접 보여 준다. 자신이 만든 오픈소스 방식과 견주는 형식이다. 개인 건강 데이터가 챗봇으로 들어가는 통로가 실제로 열려 있다는 것을 확인해 주는 영상이다.","insight":"미국 사용자는 자기 건강 데이터를 챗봇에 물어보는 쪽으로 움직이고 있으므로, 앱이 쌓아 온 걸음과 건강 기록을 사용자가 직접 내려받거나 외부 챗봇에 넘길 수 있는 내보내기·연결 화면을 3개월 안에 붙일 수 있다. 표준 형식으로 내보내는 것만으로도 시작이 되며, 데이터를 가두지 않는다는 신호 자체가 신뢰로 돌아온다.","signal":null,"author":[],"experts":[{"who":"Josh Mandel","role":"Microsoft Healthcare의 최고 아키텍트이며, 경쟁 관계인 오픈소스 연결 방식을 직접 만든 사람","claim":"ChatGPT Health 인터페이스에 연결하는 과정을 시연했다.","evidence":"직접 연결해 보이는 시연 영상 자체를 근거로 삼았다."}],"cases":[],"notes":[{"term":"커넥터","ko":"외부 서비스를 챗봇에 잇는 연결 규격","plain":"어떤 앱이 가진 데이터를 챗봇이 읽어 갈 수 있도록 정해 놓은 통로다. 이 통로가 열리면 사용자는 앱을 따로 열지 않고 챗봇 안에서 자기 데이터를 놓고 바로 물어볼 수 있게 된다."}]},{"heading_ko":"읽을거리: 의료 기록을 AI에 올릴 때","heading_en":"What I'm Reading: When You Upload Your Medical Records to AI, Who's Actually Protecting Them?","skip":null,"summary":"소비자용 AI 플랫폼에 자기 의료 데이터를 넘길 때 법적으로 무슨 일이 벌어지는지 짚은 글이다. 필자는 읽어 볼 만하다고만 소개하고 결론을 옮기지는 않는다. 바로 뒤 꼭지의 신뢰 논의와 이어서 읽으라는 배치다.","insight":"미국에서 건강 데이터를 다루는 소비자 앱은 신뢰가 선결 조건이므로, 어떤 데이터를 받아 어디에 보관하며 누구에게 넘기는지, 학습에 쓰는지 아닌지를 평이한 말로 한 화면에 밝히고 삭제와 내보내기를 버튼으로 제공하는 것을 3개월 안에 만들 수 있다. 약관 링크가 아니라 화면 안의 설명으로 두는 것이 요점이다.","signal":null,"author":[],"experts":[{"who":"Myoung Cha","role":"이 글을 쓴 필자","claim":"여러 소비자용 AI 플랫폼과 자신의 의료 데이터를 공유하는 것에는 살펴봐야 할 법적 함의가 있다.","evidence":"원문은 글을 소개만 했을 뿐 근거를 옮기지 않았다."}],"cases":[],"notes":[{"term":"의료정보 보호법의 울타리","ko":"HIPAA가 미치는 범위","plain":"미국의 의료정보 보호법은 병원, 보험사, 그리고 그들과 계약한 협력사에 적용된다. 반대로 소비자가 스스로 일반 챗봇 서비스에 올린 기록은 그 울타리 안에 있다고 보기 어렵다. 이 글이 다루는 것이 바로 그 경계 문제다."}]},{"heading_ko":"읽을거리: 소비자 건강 앱은 죽었다","heading_en":"What I'm Reading: Consumer health apps are dead","skip":null,"summary":"건강에 관심 많은 사람들이 자기 개인 데이터 전부를 훑는 개인 AI 어시스턴트를 스스로 만들고 있다는 관찰에서 출발한 글이다. 그렇다면 기능 하나씩 파는 소비자 앱은 어떻게 되느냐는 물음이 따라온다. 필자는 앞의 두 글과 묶어 읽으면서, 이 분야의 승부가 결국 신뢰에서 갈린다고 덧붙인다.","insight":"우리 앱은 이미 걸음과 건강 기록을 쌓고 있으므로, 사용자가 자기 기록을 놓고 질문하면 답하는 대화 화면을 3개월 안에 붙일 수 있다. 개인 AI 어시스턴트를 직접 만들 수 있는 사람은 소수이므로, 기본으로 제공하는 것 자체가 차이가 된다. 다만 필자가 말한 신뢰 조건과 함께 가야 하므로, 앞 꼭지의 데이터 설명 화면과 한 묶음으로 내는 편이 낫다.","signal":"필자는 건강에 관심 많은 친구들에게서 자기 개인 데이터를 훑는 AI 어시스턴트를 만들고 있다는 이야기를 점점 더 자주 듣는다고 전한다. 돈이 아니라 시간을 들여서라도 흩어진 자기 기록을 한데 모아 묻고 싶어 하는 수요가 미국 소비자 쪽에 있다는 뜻이다. 그 수요는 지금 도구를 만들 줄 아는 소수만 채우고 있다.","author":[{"claim":"이 분야에서 이기려면 신뢰 측면에서 이기는 것이 충분조건은 아니어도 필요조건이다.","evidence":"의료 데이터를 소비자용 AI에 넘길 때의 법적 함의를 다룬 앞 글과 이 글을 함께 놓고 생각한 결과라고 밝혔다."}],"experts":[{"who":"Ashwin Sharma","role":"이 글을 쓴 필자","claim":"개인용 AI 어시스턴트가 개인 데이터를 훑게 되면서 소비자 대상 앱의 자리가 달라진다.","evidence":"원문은 글을 소개만 했을 뿐 구체적인 근거를 옮기지 않았다."}],"cases":[],"notes":[]},{"heading_ko":"읽을거리: Bailey & Co의 JPM 정리","heading_en":"What I'm Reading: 2026 JP Morgan Healthcare Conference Recap","skip":null,"summary":"사모펀드 쪽 시각에서 JP Morgan의 대화를 정리한 글이다. 2026년 인수 시장에 어떤 함의가 있는지를 다룬다. 필자는 그중에서 롱제비티에 대한 관심과, 컨시어지 시장에서 곧 거래가 나올 것이라는 대목을 흥미롭게 봤다.","insight":null,"signal":"투자자의 관심이 롱제비티와 컨시어지 의료로 향하고 있다는 관찰이다. 둘 다 보험이 값을 쳐 주지 않아 소비자가 자기 돈을 직접 내는 영역이라는 공통점이 있다. 미국에서 소비자가 건강에 지갑을 여는 자리가 어디인지 보여 주는 방향 신호다.","author":[{"claim":"롱제비티에 대한 관심과, 컨시어지 시장에서 조만간 몇몇 거래가 나올 것이라는 점이 흥미로웠다.","evidence":"Bailey & Co가 정리한 JP Morgan 현장 대화를 근거로 들었다."}],"experts":[{"who":"Rebecca Springer, Collin Anderson","role":"사모펀드 시장을 다루는 자문사 Bailey & Co 소속 필자들","claim":"JP Morgan에서 나눈 대화를 토대로 2026년 사모펀드 시장에 대한 시사점을 정리했다.","evidence":"현장에서 나눈 대화를 근거로 삼았다."}],"cases":[],"notes":[{"term":"컨시어지 의료","ko":"회비를 내고 받는 밀착 진료","plain":"환자가 보험과 별도로 매달 또는 매년 회비를 내고, 의사에게 빠른 예약과 긴 진료 시간, 직접 연락 같은 대우를 받는 방식이다. 보험이 값을 정하지 않으므로 환자가 자기 돈을 낸다. 한국에는 건강보험 밖의 건강검진 패키지가 그나마 가까운 형태다."},{"term":"롱제비티","ko":"노화를 늦추는 것을 목표로 하는 분야","plain":"이미 생긴 병을 고치는 것이 아니라 노화 속도를 늦추고 건강한 기간을 늘리는 것을 목표로 삼는 분야다. 보험이 값을 쳐 주지 않는 항목이 많아, 소비자가 직접 값을 치르는 시장으로 자란다."}]},{"heading_ko":"읽을거리: 노동자 가정의 의료비","heading_en":"What I'm Reading: The High Cost of Living: What Working Families Pay For Health Care","skip":null,"summary":"미국 노동자 가정이 의료에 얼마를 쓰는지 들여다본 연구 기관의 글이다. 원문은 한 줄로 소개할 뿐 수치를 옮기지 않는다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Emma Curchin, John Scmitt","role":"CEPR에서 이 글을 쓴 연구자들","claim":"미국 노동자 가정의 의료비 부담을 분석했다.","evidence":"원문은 글을 소개만 했을 뿐 근거를 옮기지 않았다."}],"cases":[],"notes":[{"term":"CEPR","ko":"경제정책연구센터","plain":"워싱턴에 있는 비영리 경제 연구 기관이다. 노동과 가계 부담을 다루는 분석을 자주 내놓는다."}]}],"themes":["value-based-care","rcm-billing","medicare-advantage","aca-exchange","consumer-dtc","digital-health-funding"],"for_later":[]},{"index":"08","date":"2026-01-25","type":"reads","title_en":"Weekly Health Tech Reads 1/25/2026","title_ko":"120억 달러 AI, 파는 것은 의사의 주목","hook":"의사에게 무료로 주고 제약사 광고를 파는 AI 의학 검색이 120억 달러가 됐는데, 필자는 그 값을 의심한다.","tldr":[{"point":"의사용 AI 의학 검색 OpenEvidence가 120억 달러 밸류에이션으로 자금을 조달했고 연 매출 런레이트 1억 달러에 이르렀는데, 그 매출은 전부 의사의 주목을 제약사에 판 광고이며, 필자는 2009년 Epocrates와 같은 구조라서 회사가 내세우는 메디컬 슈퍼인텔리전스 비전과 어긋난다고 본다.","note":"미국 제약사는 규정 때문에 의사에게 돈을 직접 줄 수 없어서 의사에게 닿는 채널에 광고비를 쓰는데, 처방권을 가진 사람이 60만 명뿐이라 그 채널을 쥔 쪽이 큰 값을 받는다."},{"point":"필자는 2014년 Uber 밸류에이션을 두고 벌어진 Damodaran과 Gurley의 논쟁을 끌어와 자신은 고평가라고 본 Damodaran 쪽이라고 밝히고, 소송에서 공개된 CEO의 문자에 2~3년 안에 은퇴 계획이 적혀 있다는 점을 근거로 최선의 결말이 고점 매각일 것이라고 적는다.","note":"Gurley 쪽 논리는 시장을 새로 만드는 회사의 값은 기존 시장을 전제로 계산하는 현금흐름 할인법에 잡히지 않는다는 것이었고, Uber는 결국 그쪽이 맞았다."},{"point":"McKinsey의 최신 프로핏 풀 분석에서 2027년 메디케이드가 산업 세그먼트로서 마이너스 EBITDA로 전망됐고, 필자는 이런 차트에서 그런 모습을 본 기억이 처음이라고 적는다.","note":"메디케이드는 저소득층 공보험인데 운영을 민간 보험사가 위탁받아 하기 때문에, 세그먼트가 적자라는 말은 그 사업을 맡은 민간 회사들이 전체적으로 손해를 본다는 뜻이다."},{"point":"보험사 CEO들이 의회 청문회에 불려 나갔고 그에 앞서 UnitedHealth Group CEO는 2026년 ACA 익스체인지에서 나오는 이익을 자발적으로 환급하겠다고 밝혔는데, 필자는 청문회는 알맹이가 없었고 환급 발표는 영리한 정치적 수라고 평가한다.","note":"ACA 익스체인지는 고용주 보험도 공보험도 없는 사람이 개인 자격으로 보험을 사는 장터이며, 지금 그 앞날을 둘러싼 정치적 다툼이 진행 중이라 보험사들이 몸을 낮추는 국면이다."},{"point":"Amazon One Medical이 AI 헬스 어시스턴트를 출시했고, 필자는 앞으로 몇 달간 같은 성격의 미투 발표가 줄을 이어 곧 뉴스가 되지 않을 것으로 본다.","note":"원문은 그 어시스턴트의 기능도 이용 규모도 밝히지 않았고, 필자의 관심은 제품이 아니라 이런 발표가 흔해지는 흐름 쪽에 있다."},{"point":"필자는 메디케어 어드밴티지의 진단명 부풀리기를 v28이 상당 부분 해결했다는 정부 쪽 글과, AI 문서 작성 도구 Suki가 진료 단계 코드를 위로 끌어올렸다는 KLAS 케이스 스터디를 나란히 놓고 둘이 무엇이 다른지 모르겠다고 적는다.","note":"미국 외래 진료비는 기록에 적힌 내용으로 진료의 복잡함 등급이 정해지고 등급이 높을수록 값을 더 받기 때문에, 기록을 더 자세히 쓰는 도구는 그 자체로 청구액을 올리는 도구가 된다."}],"issue_insight":{"verdict":"yes","summary":"이 회차의 무게는 의사와 제약사 사이의 돈 이야기에 실려 있어 소비자 앱으로 곧장 옮길 것은 많지 않다. 다만 자가 주사 약을 거르지 않게 돕는 일에 제약사가 돈을 내고 있다는 대목 하나와, 광고로 돈을 버는 플랫폼이 의학 정보를 다룰 때 생기는 신뢰 문제가 우리 앱에 그대로 걸린다는 대목이 건질 자리다.","build":[{"title":"자가 주사 약을 쓰는 사람을 위한 기록·알림 화면","detail":"주사 맞은 날 기록, 다음 주사일 알림, 주사 부위 번갈아 쓰기 안내, 부작용 메모를 묶은 화면은 규제 허가나 기기 없이 소프트웨어만으로 3개월 안에 만들 수 있다. 제약사가 같은 목적의 앱에 돈을 대고 있다는 것은 이 문제가 값이 나간다는 뜻이며, 우리가 이미 가진 보상 엔진이 약을 거르지 않게 만드는 지렛대가 된다.","section":14},{"title":"건강 정보 화면과 광고 화면을 눈에 보이게 분리한다","detail":"필자는 제약사 광고를 띄우는 플랫폼을 의사가 의학 지식의 기준으로 신뢰하지 않을 것이라고 본다. 광고로 돈을 버는 우리 앱이 미국에서 건강 정보나 건강 답변을 다루려면, 그 화면에는 광고를 붙이지 않고 광고는 보상을 받는 구간에만 두는 분리를 처음부터 설계에 넣어야 한다.","section":4}],"signal":[{"title":"AI 건강 어시스턴트는 곧 기본 기능이 된다","detail":"아마존이 One Medical에 AI 헬스 어시스턴트를 붙였고, 필자는 몇 달 안에 같은 발표가 줄을 이어 더는 뉴스가 되지 않을 것으로 본다. 미국 소비자가 건강을 묻는 창구가 앱 안의 AI로 옮겨 가고 있다는 방향은 읽히지만, 그 말은 AI 상담 창구 자체로는 우리가 앞설 자리가 없다는 뜻이기도 하다.","section":9}]},"sections":[{"heading_ko":"후원: Wing Assistant","heading_en":"Sponsored by: Wing Assistant","skip":"sponsor","summary":"진료 조직에 스케줄링과 청구, 문서 작성을 대신 맡을 원격 어시스턴트를 연결해 주는 회사의 광고다. 협업 고객으로 Cedars Sinai와 Curana Health를 든다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"AI 펀딩 단상: OpenEvidence 120억 달러","heading_en":"A MUSING ON AI FUNDING","skip":null,"summary":"이번 호의 절반을 차지하는 긴 논평이 시작되는 자리다. OpenEvidence의 조달 소식과 성장 수치를 먼저 늘어놓은 다음, 그 밸류에이션이 성립하려면 무엇이 참이어야 하는지를 따진다. 마지막 문단에서 최대 경쟁자 Doximity의 실제 규모와 미국 헬스케어 디지털 광고 시장 전체 규모를 나란히 놓는데, 이 대비가 뒤에 이어지는 회의론의 토대다.","insight":null,"signal":null,"author":[{"claim":"120억 달러에 들어온 이번 시리즈 D 투자자들은 OpenEvidence가 500억 달러 이상의 사업이 될 경로를 보고 있어야 하고, 1,000억 달러 이상이 될 가능성도 어느 정도 보고 있어야 한다.","evidence":"별도 계산을 제시하지 않고, 그 값에 투자한다는 사실에서 요구 수익률을 역산했다."},{"claim":"새 투자자가 수익을 보려면 OpenEvidence가 시장 자체를 새로 정의해야 한다.","evidence":"최대 경쟁자 Doximity가 연 매출 약 6억 2,000만 달러에 시가총액 약 75억 달러라는 점과, 미국 헬스케어 디지털 광고 시장 전체 지출이 260억 달러로 추정된다는 점을 들었다."}],"experts":[],"cases":[{"name":"OpenEvidence","what":"의학 논문 근거를 찾아 요약해 주는 도구를 의사에게 무료로 주고, 그 의사들의 주목을 제약사 광고로 파는 회사다. Thrive Capital과 DST Global 주도로 120억 달러 밸류에이션에 자금을 조달했다.","scale":"연 매출 런레이트 1억 달러, 2025년 12월 임상 컨설트 1,790만 건(2024년 12월은 월 260만 건), 지난 1년간 4개 라운드로 약 6억 3,500만 달러 조달, 밸류에이션 12배 상승","note":"이번 조달 금액이 원문 안에서 어긋난다. 이 꼭지는 1억 5,000만 달러로, 뒤의 펀딩 소식 꼭지는 2억 5,000만 달러로 적었다.","sells_to":"pharma"},{"name":"Doximity","what":"의사들이 모이는 온라인 네트워크를 운영하며 그 주목을 제약사에 파는 상장사다. 필자가 OpenEvidence의 현실적인 도달점으로 드는 비교 대상이다.","scale":"연 매출 약 6억 2,000만 달러, 시가총액 약 75억 달러","note":"OpenEvidence의 밸류에이션은 이 회사 시가총액의 1.6배인데, 매출은 6분의 1 수준이다.","sells_to":"pharma"},{"name":"Sequoia Capital","what":"2025년 2월 시리즈 A를 주도한 벤처 투자사다.","scale":"7,500만 달러 투자분이 1년 만에 10억 달러에 가까운 규모가 됐다","note":"","sells_to":"other"}],"notes":[{"term":"런레이트(annual revenue run rate)","ko":"최근 실적을 1년치로 환산한 매출","plain":"가장 최근 한 달이나 한 분기의 매출에 12나 4를 곱해 연 매출인 것처럼 표시하는 방식이다. 실제로 1년 동안 그만큼 벌었다는 뜻이 아니라, 지금 속도가 유지되면 이만큼이 된다는 추정이다. 빠르게 크는 회사가 자기 규모를 크게 보이게 하려고 쓰는 표현이므로, 실제 연간 매출과 구분해서 읽어야 한다."},{"term":"임상 컨설트(clinical consult)","ko":"의사가 플랫폼에 던진 질문 한 건","plain":"의사가 환자를 보다가 막히는 대목을 이 도구에 물어보고 근거와 함께 답을 받는 것을 한 건으로 센다. 사람 수가 아니라 질문 건수이므로, 1,790만 건이라는 숫자는 이용자가 몇 명인지는 알려 주지 않는다. 한 의사가 하루에 여러 번 쓰면 그만큼 늘어난다."}]},{"heading_ko":"메디컬 슈퍼인텔리전스라는 서사","heading_en":"The Medical Superintelligence Narrative","skip":null,"summary":"회사가 이번 라운드로 무엇을 하겠다고 말하는지, 그리고 그 말이 왜 투자자를 움직이는지를 정리하는 대목이다. 필자는 이 구상이 기술적으로는 몇 년 안에 가능하다고 인정하면서, 자신이 의심하는 것은 그 뒤에 있는 사업 모델이라고 미리 밝히며 다음 꼭지로 넘어간다.","insight":null,"signal":null,"author":[{"claim":"전문과목마다 최고 수준인 AI 모델들이 협력해 의사의 어려운 질문에 답하는 구상은 기술 관점에서 앞으로 몇 년 안에 실현 가능해 보인다.","evidence":"자신이 AI 전문가가 아니라고 전제했을 뿐, 기술적 근거는 대지 않았다."},{"claim":"회의적인 쪽은 기술이 아니라 그 뒤에 있는 비즈니스 모델이다.","evidence":"이 꼭지에서는 근거를 대지 않고 다음 꼭지로 미뤘다."}],"experts":[{"who":"Daniel Nadler","role":"OpenEvidence CEO이며 회사 지분 58%를 보유하고 있다. 이번 라운드로 지분 가치가 가장 크게 오른 당사자이므로 이 비전을 크게 말할 위치에 있다.","claim":"지난주 JPMorgan 발표에서 메디컬 슈퍼인텔리전스 구상을 이야기했다.","evidence":"필자는 그 발표가 Mayo Clinic의 디지털 트윈처럼 들렸다고 자기 해석을 옮겼을 뿐, Nadler가 어떤 근거를 들었는지는 옮기지 않았다."}],"cases":[],"notes":[{"term":"메디컬 슈퍼인텔리전스","ko":"의학 초지능","plain":"회사가 보도자료에서 내세우는 표현이며 업계의 확립된 용어가 아니다. 전문과목별로 최고 수준인 AI 모델을 여러 개 두고 그들이 서로 협력해 의사의 질문에 답하게 한다는 구상이다. 필자가 이를 Mayo Clinic의 디지털 트윈 같다고 옮긴 것은, 미국 최고 병원의 전문의 집단을 소프트웨어로 복제하는 것에 가깝다는 뜻이다."},{"term":"JPMorgan 헬스케어 컨퍼런스","ko":"매년 1월 열리는 업계 최대 행사","plain":"미국 헬스케어 기업과 투자자가 한자리에 모여 한 해 계획을 발표하는 자리이며, 업계에서는 그냥 JPM이라고 부른다. 여기서 나온 발표와 수치가 그해 업계 대화의 기준이 되기 때문에, 이 뉴스레터의 1월 회차들은 대부분 이 행사에서 나온 이야기를 다룬다."}]},{"heading_ko":"오늘의 사업은 의사의 주목을 파는 일","heading_en":"OpenEvidence's Business Today: Selling Provider Attention","skip":null,"summary":"필자가 2009년 Epocrates CEO 인터뷰를 25년 뒤 OpenEvidence 위에 겹쳐 놓는 대목이다. 기술만 PalmPilot에서 AI로 바뀌었을 뿐 구조는 같다는 것이 논지이며, 그래서 앞으로 문제가 되는 것은 기술이 아니라 신뢰라고 주장한다. 마지막에는 영업 인력이 어디에서 왔는지를 근거로 회사의 실제 방향을 읽는다.","insight":"우리 앱도 광고로 돈을 버는 앱이므로 이 꼭지의 경고가 그대로 걸린다. 미국에서 건강 정보나 건강 답변을 다루는 화면을 만든다면, 그 화면에는 광고를 붙이지 않고 광고는 보상을 받는 구간에만 남기는 분리를 처음부터 설계에 넣는 것이 3개월 안에 할 수 있는 일이다. 정보의 출처와 이 화면이 광고와 무관하다는 사실을 화면 안에 적어 두는 것까지가 같은 작업에 들어간다.","signal":null,"author":[{"claim":"제약사 광고를 띄우는 플랫폼을 의사가 의학 지식의 기본 운영체제로 신뢰하기는 어려우며, OpenEvidence의 발목을 잡을 것은 기술이 아니라 사람이다.","evidence":"조지아주 시골의 암 전문의가 종양 치료제 제조사의 광고를 보면서 그 플랫폼을 신뢰하겠느냐는 가정적 물음을 들었다. 실제 의사 대상 조사 결과는 대지 않았다."},{"claim":"OpenEvidence 앞에 놓인 더 어려운 질문은 기술이 아니라 비즈니스 모델 혁신이며, 현재 모델은 회사가 내세우는 더 큰 비전과 근본적으로 어긋나 있다.","evidence":"Epocrates가 상장 후 같은 긴장에 부딪혔고, EHR을 포함해 다른 제품군을 만들려다 휘청인 끝에 2012년 athenahealth에 인수된 경로를 들었다."},{"claim":"AI 시대의 Doximity를 만드는 길은 분명하지만, 그 사업은 결국 오늘의 Doximity와 매우 비슷한 모습이 될 것이다.","evidence":"OpenEvidence 커머셜 팀 대부분이 지난 12개월 사이 Doximity에서 영입된 인력이며, 소수의 제약사 바이어들과 이미 맺어 온 관계를 활용하려는 것으로 보인다는 점을 들었다."}],"experts":[{"who":"Kirk Loevner","role":"2009년 당시 Epocrates CEO다. 같은 사업 모델로 회사를 키우던 당사자이므로 이 시장을 크게 말할 위치에 있었다.","claim":"제약 산업이 처방권자에게 영향을 주려고 연 140억 달러를 쓰는데 규정 때문에 돈을 직접 줄 수는 없으니, 그 의사들에게 닿는 채널을 가진 것은 금광이다.","evidence":"연 140억 달러와 처방권자 60만 명이라는 두 숫자를 들었다. 다만 2009년 시점의 수치이며, 필자는 이를 오늘의 OpenEvidence를 설명하는 데 그대로 가져다 썼다."}],"cases":[{"name":"Epocrates","what":"PalmPilot 시절 의사에게 약물 정보 도구를 무료로 주고 제약사 광고로 돈을 번 회사다. 상장 후 광고 모델의 긴장에 부딪혀 EHR을 포함한 다른 제품군을 시도했으나 크게 휘청였고, 2012년 athenahealth에 인수됐다.","scale":"","note":"필자가 OpenEvidence의 25년 전 판본으로 제시한 선례다. 무료로 주고 주목을 파는 구조가 어디까지 갈 수 있었는지를 보여 준다.","sells_to":"pharma"}],"notes":[{"term":"프로바이더(provider)","ko":"진료를 제공하는 쪽","plain":"의사, 병원, 의원, 간호사 등 실제로 환자를 보는 쪽을 한데 묶어 부르는 말이다. 미국 헬스케어는 돈을 내는 쪽(페이어)과 진료하는 쪽(프로바이더)이 분리돼 있어서 이 구분이 늘 따라다닌다. 한국은 건강보험공단이 페이어이고 병원이 프로바이더인데, 미국은 페이어가 수백 개의 민간 보험사로 쪼개져 있다는 점이 다르다."},{"term":"EHR","ko":"전자의무기록","plain":"병원이 진료 기록을 남기고 청구까지 처리하는 기간 소프트웨어다. 한번 깔면 바꾸기 어렵고 의사가 하루 종일 붙어 있는 화면이라 헬스케어 소프트웨어에서 가장 값나가는 자리로 꼽힌다. Epocrates가 광고 말고 다른 매출원을 찾다가 뛰어들었던 시장이 여기다."},{"term":"PalmPilot","ko":"1990년대 말 손바닥만 한 휴대용 단말기","plain":"스마트폰이 나오기 전에 일정과 메모를 담아 들고 다니던 기기다. Epocrates는 이 기기에 약물 정보를 담아 의사들에게 무료로 뿌렸다. 필자가 이 이름을 꺼낸 것은, 새 기술이 등장할 때마다 같은 사업 구조가 반복된다는 말을 하기 위해서다."}]},{"heading_ko":"Uber 밸류에이션 논쟁에 비춰 보기","heading_en":"Open Evidence & the Gurley-Damodaran Debate on Valuation","skip":null,"summary":"2014년 Uber의 기업가치를 두고 벌어진 유명한 공개 논쟁을 끌어와 OpenEvidence에 같은 렌즈를 대 보는 대목이다. 필자는 자신이 고평가라고 본 쪽에 선다고 밝히고, 투자자에게 최선의 결말은 시장 고점에 대형 기업에 팔리는 것이라고 적는다. 근거로는 소송 과정에서 공개된 CEO의 문자를 든다. 꼭지 끝은 독자 설문이다.","insight":null,"signal":null,"author":[{"claim":"OpenEvidence에 관해서라면 자신은 Damodaran 진영에 속하며, 투자자들이 보고 있을 시장 기회로 가는 경로가 보이지 않는다.","evidence":"앞 꼭지에서 든 광고 시장 규모와 비즈니스 모델의 불일치를 그대로 근거로 삼았고, 이 꼭지에서 새로운 계산을 더하지는 않았다."},{"claim":"이 투자자들에게 최선의 시나리오는 Livongo나 Oak Street 같은 방식으로 시장 고점에 대형 플레이어에게 매각되는 것이다.","evidence":"근거를 대지 않았다."},{"claim":"Nadler의 행동은 사람들이 진료에 접근하는 방식을 근본적으로 바꾸려는 리더의 행동으로 보이지 않는다.","evidence":"Doximity와의 법적 분쟁 과정에서 공개된 문자에 앞으로 2~3년 안에 은퇴할 계획이 적혀 있다는 점을 들었다."}],"experts":[{"who":"Aswath Damodaran","role":"기업가치 평가를 가르치는 교수이며 현금흐름 할인법에 관한 책을 썼다. 회사와 이해관계가 없는 학계 쪽 인물이다.","claim":"2014년 당시 Uber는 크게 고평가돼 있으며 60억 달러가 더 적절하다.","evidence":"자신의 현금흐름 할인 분석을 들었다. 원문은 링크만 걸었고 계산의 내용은 옮기지 않았다."},{"who":"Bill Gurley","role":"당시 Uber 이사회에 있던 벤처 투자자다. Uber에 이미 투자한 쪽이므로 높은 값을 옹호할 이해관계가 있었다.","claim":"Damodaran이 핵심을 놓쳤다. Uber는 시장 자체를 근본적으로 재정의할 수 있기 때문에 현금흐름 할인법에는 드러나지 않는 방식으로 오히려 크게 저평가돼 있다.","evidence":"원문은 그의 반론 링크만 걸었고 구체적 근거는 옮기지 않았다. 다만 필자는 오늘 Uber 시가총액이 약 1,700억 달러라는 점을 들어 결과적으로 Gurley가 옳았다고 평가한다."}],"cases":[{"name":"Uber","what":"2014년 6월 180억 달러 밸류에이션으로 자금을 조달했고, 그 값을 두고 학계와 투자자가 공개 논쟁을 벌였다.","scale":"2014년 180억 달러 밸류에이션, 오늘 시가총액 약 1,700억 달러","note":"필자가 이 사례를 꺼낸 것은 자기 회의론이 틀릴 수 있다는 가능성을 스스로 열어 두기 위해서다.","sells_to":"consumer"},{"name":"Doximity와 OpenEvidence의 법적 분쟁","what":"두 회사가 법정에서 다투는 중이며, 그 과정에서 OpenEvidence CEO가 Doximity 영업팀에 보낸 문자가 공개됐다.","scale":"","note":"필자가 CEO의 속내를 읽는 근거가 소송 기록이라는 점이 이 대목의 특징이다. 회사가 공식적으로 밝힌 내용이 아니다.","sells_to":"none"}],"notes":[{"term":"DCF","ko":"현금흐름 할인법","plain":"회사가 앞으로 벌어들일 현금을 예측한 뒤 지금 가치로 환산해 기업가치를 매기는 방법이다. 이미 존재하는 시장의 크기를 전제로 계산하기 때문에, 회사가 시장 자체를 새로 만들어 내는 경우를 담아내지 못한다는 것이 Gurley 쪽 반론의 핵심이었다. 두 사람의 논쟁은 결국 시장 크기를 고정된 것으로 볼 것이냐 아니냐의 다툼이었다."},{"term":"Livongo나 Oak Street 같은 엑싯","ko":"시장 분위기가 좋을 때 대기업에 비싸게 팔린 결말","plain":"둘 다 미국 헬스케어 스타트업이 대기업에 인수되며 끝난 사례로 업계에서 자주 인용된다. 필자가 이 이름들을 꺼낸 것은 회사가 스스로 커져서 성공했다는 뜻이 아니라, 값이 높을 때 팔고 나가는 것이 투자자에게 가능한 최선이라는 뜻이다. 창업자가 내세운 비전과는 다른 결말이라는 함의가 붙어 있다."}]},{"heading_ko":"McKinsey 프로핏 풀과 2027년 메디케이드 적자","heading_en":"McKinsey's Profit Pools","skip":null,"summary":"McKinsey가 해마다 내는 세그먼트별 이익 전망을 소개하는 짧은 꼭지다. 전체 그림은 단기적으로 어렵고 2028년과 2029년에 기회가 온다는 것인데, 필자가 실제로 짚는 대목은 하나다. 2027년 전망에서 메디케이드가 산업 세그먼트로서 마이너스 EBITDA를 기록한다는 것이며, 근거 차트는 원문에 이미지로만 들어 있어 다른 세그먼트의 수치는 본문에 없다.","insight":null,"signal":null,"author":[{"claim":"헬스케어가 어디로 가는지 읽으려면 McKinsey의 프로핏 풀 분석이 늘 가장 좋은 출발점 중 하나다.","evidence":"근거를 대지 않았다."},{"claim":"2027년 메디케이드가 마이너스 EBITDA로 전망된 것은 이례적이다.","evidence":"이런 차트에서 그런 모습을 본 기억이 자신에게는 이번이 처음이라는 경험을 들었다."}],"experts":[],"cases":[{"name":"McKinsey 프로핏 풀 분석","what":"미국 헬스케어 산업을 세그먼트로 나눠 이익이 어디에 얼마나 고이는지 전망하는 연례 분석이며, 지난주 최신판이 나왔다.","scale":"2027년 메디케이드 세그먼트 EBITDA가 마이너스로 전망됨. 2028년과 2029년에는 기회가 있는 것으로 봄","note":"업계 전체가 이 분석을 기준선처럼 참고하기 때문에, 여기 실린 전망 자체가 투자와 사업 방향을 움직인다.","sells_to":"other"}],"notes":[{"term":"프로핏 풀(profit pool)","ko":"이익이 고이는 자리","plain":"산업을 여러 세그먼트로 나눈 뒤 각 세그먼트에 이익이 얼마나 남는지를 그려 보는 분석이다. 매출이 큰 곳과 이익이 남는 곳이 다르기 때문에, 어디에 돈을 넣을지 정할 때 이 그림을 본다."},{"term":"EBITDA","ko":"이자·세금·감가상각 전 이익","plain":"영업으로 실제로 얼마나 벌었는지를 대략 보여 주는 지표로, 산업 간 비교에 흔히 쓰인다. 이 값이 마이너스라는 것은 그 사업을 하는 회사들이 전체적으로 손해를 보고 있다는 뜻이다."},{"term":"메디케이드(Medicaid)","ko":"저소득층 공보험","plain":"연방정부와 주정부가 함께 돈을 대는 저소득층 대상 공보험이며, 실제 운영은 주정부가 민간 보험사에 사람당 정액을 주고 위탁하는 경우가 많다. 그래서 메디케이드가 산업 세그먼트로 잡히고 그 세그먼트의 이익을 따질 수 있다. 세그먼트 EBITDA가 마이너스라는 말은 위탁받은 민간 회사들이 받는 정액보다 나가는 의료비가 더 많다는 뜻이다. 한국의 의료급여와 비슷한 자리이지만, 운영을 민간이 맡고 그 민간이 이익을 남기려 한다는 점이 다르다."}]},{"heading_ko":"보험사 CEO들의 의회 증언","heading_en":"Other Top Headlines","skip":null,"summary":"보험사 CEO들이 하원 두 위원회에 불려 나가 미국의 의료비를 끌어올리는 요인에 대해 증언한 일을 다룬다. 필자는 내용보다 분위기를 전하는데, 정치적 연출만 넘치고 알맹이가 없었다는 평가다. 무엇이 논의됐는지보다 왜 논의가 되지 않았는지를 짚는 꼭지다.","insight":null,"signal":null,"author":[{"claim":"이번 청문회는 정치적 연출은 넘치고 알맹이는 적었으며, 대부분의 세션에 보험사 CEO들이 굳이 있어야 했는지 모르겠다.","evidence":"공화당과 민주당이 각자의 헬스케어 정책이 가진 결함을 두고 간접적으로 다투고, 수직 통합에 대한 전반적인 반감이 뒤섞이며, 소셜미디어용 사운드바이트를 만들어 내려는 자리처럼 느껴졌다는 자신의 관찰을 들었다."}],"experts":[],"cases":[{"name":"하원 Ways & Means 위원회와 Energy and Commerce 보건 소위원회 청문회","what":"목요일에 보험사 CEO들을 불러 미국 헬스케어 비용을 끌어올리는 요인을 주제로 증언을 들었다.","scale":"","note":"같은 주에 UnitedHealth Group의 이익 환급 발표가 나온 배경이 이 청문회다. 두 소식은 이어서 읽어야 한다.","sells_to":"none"}],"notes":[{"term":"수직 통합","ko":"보험사가 진료하는 쪽까지 함께 소유하는 구조","plain":"미국의 대형 보험사들은 보험만 파는 것이 아니라 약제비를 관리하는 회사, 약국, 의원, 재택 의료까지 함께 갖고 있다. 같은 회사가 돈을 내는 쪽과 받는 쪽을 모두 쥐게 되므로, 자기 계열사에 값을 비싸게 쳐 주는 방식으로 비용을 부풀린다는 의심이 따라다닌다. 이번 청문회에서 양당이 공통으로 반감을 보인 대목이 이것이다. 한국에는 이런 구조가 없다."},{"term":"Ways & Means 위원회","ko":"미 하원 세입위원회","plain":"세금과 메디케어를 비롯한 재정 지출을 다루는 하원 위원회다. 헬스케어 지출이 연방 예산에서 차지하는 몫이 크기 때문에 이 위원회가 보험사를 부르는 일이 잦다."}]},{"heading_ko":"UnitedHealth의 ACA 이익 자진 환급","heading_en":"Other Top Headlines","skip":null,"summary":"UnitedHealth Group CEO가 의회 증언에 앞선 준비 발언에서 2026년 ACA 익스체인지 이익을 자발적으로 환급하겠다고 밝힌 소식이다. 필자는 이를 선의가 아니라 정치적 계산으로 읽는다. 앞 꼭지의 청문회와 같은 날 이야기이므로 함께 읽어야 뜻이 잡힌다.","insight":null,"signal":null,"author":[{"claim":"지금의 정치적 환경과 익스체인지에서의 향후 경로를 생각하면 UHG로서는 영리한 수다.","evidence":"동료 Martin이 목요일 Health Policy Briefing에서 같은 취지로 이야기했다는 점을 들었고, 자신이 별도 분석을 더하지는 않았다."}],"experts":[{"who":"Steve Hemsley","role":"UnitedHealth Group CEO다. 청문회에 불려 나가는 당사자이므로 정치적 압력을 낮출 발표를 할 위치에 있었다.","claim":"UnitedHealthcare는 2026년 ACA 익스체인지에서 내는 이익을 자발적으로 환급하겠다.","evidence":"청문회 준비 발언에서 밝혔을 뿐, 환급의 방식과 규모는 원문에 나오지 않는다."},{"who":"Martin","role":"필자와 함께 이 뉴스레터의 팟캐스트와 Health Policy Briefing을 진행하는 동료다.","claim":"이번 발표는 페이어들이 지금의 정치적 환경과 익스체인지의 앞날을 헤쳐 나가려는 국면에서 나온 영리한 수다.","evidence":"필자가 그 취지만 옮겼고 구체적 근거는 옮기지 않았다."}],"cases":[{"name":"UnitedHealth Group / UnitedHealthcare","what":"미국 최대 민간 보험 그룹이며, 2026년 ACA 익스체인지 사업에서 나오는 이익을 자진 환급하겠다고 발표했다.","scale":"","note":"이익을 스스로 내놓겠다는 발표가 같은 날 청문회 직전에 나왔다는 점이 핵심이다. 규모가 아니라 시점이 메시지다.","sells_to":"mixed"}],"notes":[{"term":"ACA 익스체인지","ko":"개인이 직접 보험을 사는 온라인 장터","plain":"미국에는 전 국민 건강보험이 없어서 대부분 직장에서 주는 보험이나 노인·저소득층 공보험으로 나뉘는데, 그 어디에도 속하지 않는 사람이 개인 자격으로 보험을 사는 곳이 이 장터다. 소득에 따라 연방 정부가 보험료의 상당 부분을 보조한다. 보조금 규모와 제도의 앞날을 두고 정치적 다툼이 계속되고 있어서, 이 시장에서 보험사가 이익을 많이 남기는 모습은 정치적으로 위험하다. 한국에는 전 국민 건강보험이 있어 대응물이 없다."},{"term":"페이어(payer)","ko":"진료비를 내는 쪽","plain":"보험사와 정부처럼 진료비를 실제로 지불하는 주체를 통칭한다. 미국 헬스케어 기사에서 페이어와 프로바이더는 늘 짝으로 등장하며, 둘 사이의 돈 다툼이 산업 뉴스의 상당 부분을 차지한다. 한국은 건강보험공단이 사실상 유일한 페이어이지만, 미국은 수백 개의 민간 보험사와 공보험이 뒤섞여 있다."}]},{"heading_ko":"Amazon One Medical의 AI 헬스 어시스턴트","heading_en":"Other Top Headlines","skip":null,"summary":"아마존이 인수한 1차 진료 브랜드 One Medical이 AI 기반 헬스 어시스턴트를 출시했다는 짧은 소식이다. 필자의 관심은 제품 자체가 아니라, 이런 발표가 앞으로 몇 달 사이 흔해질 것이라는 전망에 있다. 원문은 그 어시스턴트가 무엇을 하는지도, 얼마나 쓰이는지도 적지 않았다.","insight":null,"signal":"소비자를 직접 만나는 대형 플랫폼이 AI 건강 어시스턴트를 기본 기능으로 붙이기 시작했다는 신호다. 필자는 경영진들이 AI로 인한 시장 변화에 대응하면서 같은 성격의 미투 발표가 몇 달간 줄을 이을 것이고, 곧 이런 일이 뉴스가 되지 않을 것으로 본다. 미국 소비자가 건강을 묻는 창구가 앱 안의 AI로 옮겨 가고 있다는 방향은 읽히지만, 원문에는 이용자 수나 사용량 같은 규모 근거가 없다. 우리 팀에게 이 신호가 뜻하는 바는, AI 상담 창구 자체로는 3개월 뒤에 차별점이 남지 않는다는 것이다.","author":[{"claim":"앞으로 몇 달간 이런 미투 성격의 AI 제품 출시 발표가 줄을 이을 것이며, 곧 이런 일이 더 이상 뉴스가 되지 않을 것이다.","evidence":"경영진들이 AI로 인한 시장 변화에 대응하고 있다는 흐름을 들었을 뿐, 다른 회사의 출시 계획 같은 구체적 근거는 대지 않았다."}],"experts":[],"cases":[{"name":"Amazon One Medical","what":"아마존이 2022년에 인수한 1차 진료 브랜드이며, 이번 주 AI 기반 헬스 어시스턴트를 출시했다고 밝혔다.","scale":"","note":"원문은 기능도 이용 규모도 밝히지 않았다. 소비자를 가장 많이 만나는 기업이 건강 상담 창구를 앱 안에 넣었다는 사실 자체가 이 소식의 내용이다.","sells_to":"mixed"}],"notes":[]},{"heading_ko":"Healthier Capital의 첫 펀드 2억 2,000만 달러","heading_en":"Other Top Headlines","skip":null,"summary":"One Medical을 상장과 아마존 인수까지 이끈 전 CEO가 세운 벤처 펀드가 첫 펀드를 마감했다는 소식이다. 이미 여러 곳에 투자했고, 그중 하나가 뒤의 펀딩 소식에 나오는 소아과 회사다. 이 꼭지에는 필자의 평가가 붙지 않았다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Healthier Capital","what":"Amir Dan Rubin이 세운 헬스케어 벤처 펀드로, 첫 펀드의 클로징을 발표했다. Hyro, Qualified Health, Ezra, Zarminali Pediatrics 등에 이미 투자했다.","scale":"펀드 규모 2억 2,000만 달러","note":"이 펀드가 뒤에 나오는 Zarminali Pediatrics 1억 1,000만 달러 라운드를 주도했다. 자기 펀드 규모의 절반에 해당하는 금액이므로 다른 투자자들과 함께 넣은 것으로 읽힌다.","sells_to":"other"}],"notes":[{"term":"One Medical","ko":"회비를 받는 1차 진료 브랜드","plain":"예약이 잘 잡히고 앱으로 소통되는 동네 의원을 표준화된 브랜드로 묶어 판 회사다. 2020년에 상장했고 2022년에 아마존이 인수했다. Amir Dan Rubin이 2017년부터 2023년까지 이 회사를 이끌었고, 이번 소식과 뒤의 소아과 투자 소식 모두 그 이력을 배경으로 한다."}]},{"heading_ko":"펀딩: OpenEvidence 2억 5,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"앞의 긴 논평에서 다룬 라운드를 펀딩 목록에 다시 올린 자리이며, 상세 내용은 위를 보라고만 적혀 있다. 다만 여기서는 조달액을 2억 5,000만 달러로 적어 앞 본문의 1억 5,000만 달러와 어긋난다. 원문 안에서 숫자가 갈리므로 인용할 때 주의해야 한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"OpenEvidence","what":"원문이 프로바이더를 위한 ChatGPT라고 표현한 회사이며, 120억 달러 밸류에이션으로 자금을 조달했다.","scale":"이 꼭지 기준 2억 5,000만 달러, 앞 본문 기준 1억 5,000만 달러","note":"같은 뉴스레터 안에서 금액이 두 가지로 적혀 있다. 어느 쪽이 맞는지는 원문만으로 가릴 수 없다.","sells_to":"pharma"}],"notes":[]},{"heading_ko":"펀딩: Zarminali Pediatrics 1억 1,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"소아 진료 클리닉 체인이 큰 금액을 조달하고 공격적인 확장 계획을 밝힌 소식이다. 필자는 이를 One Medical이 1차 진료 시장에서 했던 일의 소아과 판본으로 읽는다. 즉 흩어져 있던 동네 의원을 하나의 전국 브랜드로 묶으려는 시도다.","insight":null,"signal":null,"author":[{"claim":"One Medical이 1차 진료 시장에서 했던 것과 크게 다르지 않은, 새로운 전국 단위 소아과 브랜드를 향한 큰 승부수로 보인다.","evidence":"여덟 개 주에서 28개 클리닉을 운영 중이며 2026년에 15개를 신규로 열고 인수합병으로 기존 진료소도 더한다는 계획을 들었다."}],"experts":[],"cases":[{"name":"Zarminali Pediatrics","what":"소아 진료 딜리버리 모델을 운영하는 회사로, Healthier Capital이 주도한 라운드에서 자금을 조달했다.","scale":"1억 1,000만 달러 조달, 여덟 개 주 28개 클리닉, 2026년 신규 15개 개설 계획","note":"원문은 진료비를 누가 내는지 밝히지 않았다. 미국에서 소아 진료비는 보험이나 공보험이 지불하는 것이 일반적이므로, 소비자가 직접 값을 치르는 사업으로 읽어서는 안 된다.","sells_to":"payer"}],"notes":[]},{"heading_ko":"펀딩: AnswersNow 4,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"자폐 치료법인 ABA를 화상으로 제공하는 회사가 4,000만 달러를 조달했다는 한 줄 소식이다. 원문은 금액 외에 아무 정보도 덧붙이지 않았다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"AnswersNow","what":"가상 ABA 플랫폼으로, 4,000만 달러를 조달했다.","scale":"4,000만 달러","note":"원문은 지불 주체도 이용 규모도 밝히지 않았다.","sells_to":"payer"}],"notes":[{"term":"ABA","ko":"응용행동분석","plain":"자폐가 있는 아동에게 필요한 행동을 잘게 나눠 반복 훈련으로 익히게 하는 치료법이다. 훈련 시간이 길고 치료사가 곁에 붙어야 해서 비용이 크게 든다. 가상 ABA는 이 훈련의 상당 부분을 치료사와 화상으로 진행한다는 뜻이다."}]},{"heading_ko":"펀딩: BrightInsight 1,300만 달러","heading_en":"Funding Announcements","skip":null,"summary":"제약사를 대신해 환자용 앱을 만들어 주는 회사가 자금을 조달한 소식이다. 예로 든 Patient App은 Sanofi와 Regeneron이 만든 자가 주사형 바이오의약품을 환자가 거르지 않고 맞도록 돕는다. 앱을 쓰는 사람은 환자이지만 돈을 내는 쪽은 제약사라는 구조가 이 꼭지에서 눈여겨볼 대목이다.","insight":"자가 주사 약을 쓰는 사람이 약을 거르지 않게 돕는 일이 제약사가 돈을 낼 만큼 값이 나가는 문제라는 뜻이다. 우리가 3개월 안에 만들 수 있는 것은 주사 맞은 날 기록, 다음 주사일 알림, 주사 부위를 번갈아 쓰도록 하는 안내, 부작용 메모를 한 화면에 묶는 것이며, 규제 허가도 기기도 필요하지 않다. 이미 있는 보상 엔진을 여기에 붙이면 약을 거르지 않는 것 자체가 앱을 여는 이유가 된다. 다만 대상이 자가 주사 약을 이미 쓰는 사람으로 좁아지므로, 미국 사용자 가운데 그 수가 시험에 충분한지부터 확인해야 한다.","signal":null,"author":[],"experts":[],"cases":[{"name":"BrightInsight","what":"제약사가 자사 약을 쓰는 환자에게 배포할 컴패니언 앱을 만들어 주는 회사다. 예로 든 Patient App은 Sanofi와 Regeneron이 만든 자가 주사형 바이오의약품의 복약 순응도를 높이는 데 쓰인다.","scale":"1,300만 달러 조달","note":"Mayo Clinic, General Catalyst, Insight Partners, Eclipse, New Leaf Venture Partners가 투자했다. 환자가 쓰는 앱인데도 값을 치르는 쪽이 제약사라는 점이 이 사업의 구조다.","sells_to":"pharma"}],"notes":[{"term":"컴패니언 앱","ko":"특정 약에 딸려 나오는 환자용 앱","plain":"제약사가 자사의 특정 약을 쓰는 환자를 위해 만들어 배포하는 앱이다. 투약 시점 알림, 사용법 안내, 부작용 기록 같은 기능이 들어간다. 돈은 제약사가 대고 환자는 무료로 쓰며, 제약사에게 이 앱의 목적은 약을 중간에 끊는 환자를 줄이는 것이다."},{"term":"자가 주사형 바이오의약품","ko":"환자가 집에서 스스로 놓는 주사약","plain":"병원에 가서 맞지 않고 환자가 정해진 주기마다 스스로 놓는 주사약이다. 주기가 몇 주 단위로 길고 통증이나 부작용이 따르기 때문에 제때 맞지 않고 거르는 일이 생기는데, 이 앱이 겨냥하는 문제가 바로 그것이다. 비만 치료제로 널리 쓰이는 GLP-1 계열 약도 같은 형태의 자가 주사다."},{"term":"복약 순응도(adherence)","ko":"약을 정해진 대로 계속 쓰는 정도","plain":"환자가 처방대로 약을 빠뜨리지 않고 이어서 쓰는지를 가리키는 말이다. 제약사 입장에서는 환자가 약을 중간에 끊으면 그만큼 매출이 사라지므로, 순응도를 올리는 소프트웨어에 돈을 쓸 이유가 분명하다."}]},{"heading_ko":"펀딩: One to One Health 1,200만 달러","heading_en":"Funding Announcements","skip":null,"summary":"고용주를 상대로 사업장 내 진료와 원격 진료를 묶어 파는 1차 진료 모델이 소수 지분 투자를 받은 소식이다. 필자가 짚는 대목은 보도자료에 적힌 절감 효과 수치이며, 그 계산이 어떻게 나오는지 보고 싶다며 에둘러 의심을 표한다.","insight":null,"signal":null,"author":[{"claim":"직원 한 명당 연간 최대 4,000달러를 절감할 수 있다는 보도자료의 수치는 계산 근거가 궁금하다.","evidence":"근거를 대지 않고, 그 계산을 보고 싶다는 표현으로 의심만 드러냈다."}],"experts":[],"cases":[{"name":"One to One Health","what":"고용주를 대상으로 사업장 내 진료소와 원격 진료를 묶어 제공하는 1차 진료 모델이며, Frist Cressey Ventures로부터 소수 지분 그로스 캐피털 투자를 받았다.","scale":"1,200만 달러 투자, 650개 조직과 협업, 멤버 50만 명, 보도자료 기준 직원 한 명당 연 최대 4,000달러 절감","note":"절감 효과 수치는 회사 보도자료의 주장이며 검증된 수치가 아니다. 필자도 그 점을 짚었다.","sells_to":"employer"}],"notes":[{"term":"온사이트 1차 진료","ko":"회사가 사업장 안에 두는 의원","plain":"미국은 직원의 의료비를 회사가 상당 부분 부담하기 때문에, 큰 회사는 사업장 안이나 근처에 의원을 두고 직원이 싸게 이용하게 한다. 직원이 값비싼 응급실이나 전문의에게 가기 전에 여기서 먼저 해결하게 만들어 회사가 내는 총액을 줄이려는 것이다. 한국은 건강보험이 이 역할을 하므로 대응하는 사업이 거의 없다."}]},{"heading_ko":"펀딩: Salvo Health 500만 달러","heading_en":"Funding Announcements","skip":null,"summary":"소화기 질환 환자를 의사 대신 곁에서 관리해 주는 회사가 자금을 조달한 소식이다. 눈여겨볼 대목은 사업 구조인데, 환자에게 돈을 받는 것이 아니라 협업하는 지역 의사들이 원격 관리 청구 코드로 돈을 받을 수 있게 해 주는 방식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Salvo Health","what":"소화기 질환과 대사성 간 질환 환자에게 래퍼라운드 케어를 제공하는 케어 익스텐더로, 지역 프로바이더와 협업해 그들이 RPM과 CCM 코드로 청구할 수 있게 해 준다.","scale":"500만 달러 조달","note":"환자를 실제로 돌보는 것은 이 회사이지만 청구는 협업하는 의사 이름으로 나간다. 미국에서 원격 관리 스타트업이 매출을 만드는 전형적인 구조다.","sells_to":"provider"}],"notes":[{"term":"RPM·CCM 코드","ko":"원격 관리와 만성질환 관리에 붙는 청구 코드","plain":"메디케어가 만든 청구 항목이다. RPM은 환자가 집에서 잰 혈압이나 혈당 같은 수치를 의사 쪽이 원격으로 확인하고 관리하면 매달 값을 쳐 주는 것이고, CCM은 만성질환 환자를 진료실 밖에서 관리한 시간에 값을 쳐 주는 것이다. 환자가 진료실에 오지 않아도 돈이 나오는 통로이기 때문에, 원격 관리 스타트업들이 이 코드를 매출원으로 삼는다. 한국 건강보험에는 이에 해당하는 수가가 거의 없다."},{"term":"케어 익스텐더(care extender)","ko":"의사 곁에서 환자 관리를 대신 맡는 서비스","plain":"의사를 대체하는 것이 아니라 의사가 다 못 챙기는 진료실 밖 관리를 대신 맡는 서비스를 가리킨다. 래퍼라운드 케어는 진료 사이사이를 감싸듯 이어서 돌본다는 뜻으로 쓰인 표현이다."}]},{"heading_ko":"펀딩: Claim Health 440만 달러","heading_en":"Funding Announcements","skip":null,"summary":"병원 이후 단계의 요양·재택 간호 기관을 대상으로 보험 청구 업무를 대신 처리해 주는 회사가 자금을 조달한 소식이다. 초기 고객들의 개선 수치가 여럿 제시되는데, 모두 회사가 밝힌 값이며 필자의 논평은 붙지 않았다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Claim Health","what":"포스트 어큐트 케어 기관을 위한 레비뉴 사이클 플랫폼으로, Maverick Ventures가 주도한 라운드에서 자금을 조달했다.","scale":"440만 달러 조달, 1년이 채 안 되는 기간에 매출 30배 성장, 초기 고객 기준 행정 업무량 50% 감소·리퍼럴 처리량 4배 증가·예방 가능한 거절 30~50% 감소","note":"개선 수치는 모두 회사가 전한 값이며 제3자 검증이 아니다. 초기 고객으로 Ascend Health, Interim HealthCare, Home Care RN을 들었다.","sells_to":"provider"}],"notes":[{"term":"레비뉴 사이클(RCM)","ko":"진료비를 청구해 실제로 받아 내기까지의 업무","plain":"환자를 본 뒤 보험사에 청구서를 넣고, 거절당하면 고쳐서 다시 넣고, 끝내 못 받으면 환자에게 청구하는 일련의 과정 전체를 말한다. 미국은 보험사마다 규칙이 달라 거절이 잦기 때문에 이 업무만 대신해 주는 회사들이 하나의 산업을 이룬다. 한국의 심사평가원 청구 업무와 비슷한 자리이지만, 상대해야 할 보험사가 수백 곳이라 훨씬 복잡하다."},{"term":"포스트 어큐트 케어","ko":"급성기 치료 이후 단계","plain":"병원에서 수술이나 급한 치료를 마친 뒤 이어지는 재활병원, 요양시설, 가정 간호 단계를 가리킨다. 이 단계의 기관들은 규모가 작고 행정 인력이 부족해서 청구 업무가 특히 부담이 된다."}]},{"heading_ko":"읽을거리: v28과 MA 진단명 부풀리기","heading_en":"What I'm Reading","skip":null,"summary":"메디케어를 운영하는 정부 기관의 리더들이 쓴 글을 소개하는 자리다. 요지는 메디케어 어드밴티지에서 보험사가 진단명을 부풀려 돈을 더 받아 가던 문제를 새 산식 v28이 이미 상당 부분 해결한 것으로 보인다는 것이다. 필자는 흥미로웠다고만 적고 자신의 판단은 붙이지 않았으며, 근거 차트는 원문에 이미지로만 들어 있다.","insight":null,"signal":null,"author":[{"claim":"이번 주에 접한 글 가운데 무척 흥미로웠다.","evidence":"v28이 코딩에 미친 영향을 보여 주는 시각 자료를 들었으나, 그 수치를 본문에 옮기지는 않았다."}],"experts":[{"who":"Chris Klomp, Joe Albanese, Alec Aramanda, John Brooks","role":"Center for Medicare의 리더들이다. 메디케어를 운영하는 정부 쪽 인사이므로, 자신들이 시행한 산식 변경이 효과를 냈다고 말할 위치에 있다.","claim":"v28이 메디케어 어드밴티지의 리스크 어저스트먼트 게이밍 문제를 이미 상당 부분 해결한 것으로 보인다.","evidence":"v28이 코딩 행태에 미친 영향을 보여 주는 시각 자료를 들었다. 원문 본문에는 그 수치가 옮겨지지 않아 크기를 확인할 수 없다."}],"cases":[{"name":"v28","what":"메디케어 어드밴티지에서 보험사에 줄 돈을 계산할 때 쓰는 위험도 보정 산식의 새 버전이며, 부풀리기 쉬운 진단 코드를 걸러 내도록 바뀌었다.","scale":"","note":"정부가 직접 만든 규칙이 시장의 행태를 실제로 바꿨다고 정부 스스로 평가하는 글이라는 점을 감안하고 읽어야 한다.","sells_to":"none"}],"notes":[{"term":"메디케어 어드밴티지(MA)","ko":"노인 공보험을 민간에 맡긴 방식","plain":"메디케어는 65세 이상을 위한 미국의 공보험인데, 정부가 직접 진료비를 치르는 대신 민간 보험사에 가입자 한 명당 정액을 주고 전체를 맡기는 방식이 메디케어 어드밴티지다. 받는 쪽은 덜 쓸수록 이익이 남는다. 지금 미국 노인의 절반 이상이 이 방식을 택하고 있어서, 여기서 벌어지는 일이 헬스케어 뉴스의 큰 몫을 차지한다."},{"term":"리스크 어저스트먼트와 게이밍","ko":"위험도 보정과 그 허점을 노린 부풀리기","plain":"정부가 보험사에 주는 정액은 가입자가 얼마나 아픈지에 따라 달라진다. 아픈 사람을 많이 받은 보험사가 손해를 보지 않게 하려는 장치인데, 반대로 보험사가 가입자에게 진단명을 최대한 많이 붙일수록 돈을 더 받게 되는 유인도 함께 생긴다. 이 유인을 노려 실제보다 아프게 기록하는 행태를 게이밍이라 부르며, v28은 그 계산식에서 부풀리기 쉬운 코드를 걸러 내도록 바꾼 것이다. 한국 건강보험에는 이런 위험도 보정 지불 방식이 없다."}]},{"heading_ko":"읽을거리: Bessemer의 헬스케어 AI 지형 보고서","heading_en":"What I'm Reading","skip":null,"summary":"벤처 투자사 Bessemer가 정리한 2026년 헬스케어 AI 지형 보고서를 소개하는 한 줄짜리 자리다. 필자는 좋은 조망이라고만 적었고 내용은 옮기지 않았다.","insight":null,"signal":null,"author":[{"claim":"Bessemer 팀이 정리한 AI 헬스케어 지형에 대한 좋은 조망이다.","evidence":"근거를 대지 않았다."}],"experts":[],"cases":[],"notes":[]},{"heading_ko":"읽을거리: Suki의 효과와 청구 등급 상승","heading_en":"What I'm Reading","skip":null,"summary":"의사의 진료 대화를 받아 적어 기록을 자동으로 만들어 주는 AI 도구 Suki의 도입 효과를 KLAS가 정리한 케이스 스터디다. 눈길이 가는 대목은 진료비 청구 등급이 위로 올라갔다는 수치이며, 필자는 이것이 보험사가 하는 진단명 부풀리기와 무엇이 다른지 모르겠다고 적는다. 앞 꼭지의 v28 이야기와 짝을 이루는 자리다.","insight":null,"signal":null,"author":[{"claim":"Suki가 이끄는 이 행태가 지금 문제가 되고 있는 페이어의 리스크 어저스트먼트 농간과 무엇이 크게 다른지 모르겠다.","evidence":"McLeod Health에서 재진 인카운터 기준으로 Level 5가 5% 늘고 Level 4가 7.3% 늘었으며 Level 3이 18.2% 줄었다는 수치를 들었다."}],"experts":[],"cases":[{"name":"Suki","what":"의사와 환자의 대화를 받아 적어 진료 기록을 자동으로 만들어 주는 AI를 병원에 파는 회사다. Rush 같은 시스템에서 쓰이고 있다.","scale":"McLeod Health 재진 인카운터 기준 Level 5 인카운터 5% 증가, Level 4 인카운터 7.3% 증가, Level 3 인카운터 18.2% 감소","note":"효과로 제시되는 것이 진료의 질이 아니라 프로바이더당 매출 증가와 문서 작성·코딩의 개선이다. 같은 진료가 더 높은 등급으로 청구된다는 뜻이기도 하다.","sells_to":"provider"},{"name":"KLAS","what":"헬스케어 IT 제품의 도입 효과를 조사해 보고서로 내는 리서치 기관이며, 이번 Suki 케이스 스터디를 냈다.","scale":"","note":"","sells_to":"other"}],"notes":[{"term":"Level 3·4·5 인카운터","ko":"외래 진료비의 복잡함 등급","plain":"미국에서 외래 진료비를 청구할 때는 그 진료가 얼마나 복잡했는지를 등급으로 나눠 적고, 등급이 높을수록 값을 더 받는다. 등급을 정하는 근거가 진료 기록에 적힌 내용이기 때문에, 기록을 더 자세하고 빠짐없이 쓰는 도구는 같은 진료의 등급을 올리는 도구가 될 수 있다. 인카운터는 환자와 의사가 만난 한 번의 진료를 뜻하고, 재진은 처음 온 환자가 아니라 이미 다니던 환자를 가리킨다. 한국의 진찰료에는 이런 등급 구분이 없다."}]},{"heading_ko":"읽을거리: 환자 한 명을 위한 약의 승인","heading_en":"What I'm Reading","skip":null,"summary":"환자 한 명에게만 맞춘 초희귀 질환 치료제를 어떻게 승인할지에 대한 영국의 시도를 다룬 The Economist 기사를 소개한다. 약 자체가 아니라 약을 만드는 과정을 심사해 승인하자는 발상이다. 필자는 승인 속도와 개발 비용 양쪽에 흥미로운 접근으로 보인다고 평한다.","insight":null,"signal":null,"author":[{"claim":"승인 속도를 높이는 동시에 이런 약의 개발 비용을 낮추는 흥미로운 접근으로 보인다.","evidence":"영국이 의약품 개발 과정에 기반해 n=1 치료의 승인을 시도한다는 기사 내용을 들었을 뿐, 별도 근거는 대지 않았다."}],"experts":[],"cases":[{"name":"영국의 n=1 치료 승인 시도","what":"의약품 개발 과정 자체를 심사해 환자 한 명을 위한 맞춤 치료의 승인을 시도하는 임상시험을 시작하려는 움직임이다.","scale":"","note":"약마다 따로 심사하는 대신 만드는 방법을 한 번 심사한다는 발상이며, 승인 제도의 전제를 바꾸는 시도다.","sells_to":"none"}],"notes":[{"term":"n=1 치료","ko":"환자 한 명만을 위한 약","plain":"그 사람에게만 있는 유전자 변이에 맞춰 만드는 약을 뜻한다. 대상 환자가 한 명뿐이므로 여러 명을 모아 효과를 비교하는 기존 임상시험 방식을 적용할 수 없고, 그래서 기존 승인 절차로는 허가를 받을 길이 없다는 것이 문제다."}]},{"heading_ko":"HTN Radio","heading_en":"HTN Radio","skip":"promo","summary":"뉴스레터가 자체 팟캐스트 최근 녹음분을 안내하는 자리다. JPMorgan 컨퍼런스와 ACA 등록을 다룬 대담과 인터뷰 세 건이 소개된다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]}],"themes":["ai-clinical","digital-health-funding","policy-legislation","aca-exchange","medicaid","medicare-advantage"],"for_later":[]},{"index":"10","date":"2026-02-01","type":"reads","title_en":"Weekly Health Tech Reads 2/1/26","title_ko":"메디케어 요율 동결의 파장","hook":"CMS의 MA 지급률 사실상 동결이 하룻밤에 시총 1,000억 달러를 지웠고, 그 여파가 스타트업까지 번진다.","tldr":[{"point":"CMS가 2027년 Medicare Advantage 지급률 변동을 0.09%로 예고하면서 상장 MA 보험사 주가가 일제히 10% 넘게 빠졌고, 대형 4개사에서만 하룻밤에 시가총액 약 1,000억 달러가 사라졌다. 그런데 CMS의 Medicare 디렉터 Chris Klomp는 바로 다음 날 MA를 전폭 지지한다고 말했다.","note":"미국 정부는 65세 이상 공보험을 민간 보험사에 위탁하면서 가입자 1인당 정액을 지급하는데, 그 지급률을 해마다 CMS가 정하기 때문에 이 숫자 하나가 보험사 이익 전체를 좌우한다."},{"point":"필자는 이 조치가 MA 보험사만의 문제가 아니라고 본다. Oak Street, Signify, VillageMD 같은 지난 10년의 대형 엑싯이 모두 MA 프로그램의 성장에 기대어 있었으므로, 첫 파도는 성과 기반 진료 프로바이더를, 다음 파도는 그들에게 솔루션을 파는 회사들을 덮칠 것이라고 한다.","note":"정부가 돈을 대 주던 시장이 좁아지면 그 시장을 고객으로 삼아 만들어진 회사들도 팔 곳이 없어지는데, IPO 시장은 얼어붙어 있고 인수해 줄 대기업마저 지금 자기 앞가림에 바쁘다."},{"point":"같은 주에 ACA·Medicaid·Medicare 시장이 두들겨 맞는 동안 Ro와 Hims는 슈퍼볼 광고 하나에 총비용 1,500만 달러 이상을 쓴다고 밝혔고, 필자는 미국이 현금 지불·상용 보험 시장과 대규모 정부 재원 위험 풀로 갈라지는 이중 의료 체계로 빠르게 가고 있는지도 모른다고 본다.","note":"Ro와 Hims는 보험을 거치지 않고 소비자가 자기 돈으로 약과 진료를 사는 온라인 회사들이라, 정부 프로그램이 조여들수록 오히려 시장이 커지는 쪽에 서 있다."},{"point":"4분기 실적에서는 병원 체인 HCA가 20% 넘는 영업이익률을 지속할 수 있느냐는 질문을 받는 반면, 보험사 UHG와 Elevance는 한 자릿수 중반대 마진 목표가 가능하기는 하냐는 추궁을 받았다. UHG는 30여 년 만에 처음으로 연간 매출이 줄어들 것으로 전망했다.","note":"미국 헬스케어에서 돈이 보험사와 병원 중 어느 쪽으로 흐르고 있는지가 이 대비 하나로 드러난다."},{"point":"디지털 헬스 M&A가 몰렸다. Sword Health가 Kaia Health를 2억 8,500만 달러에 인수했고, 정신건강에서는 Spring Health와 Alma가 합병했으며, 고용주 대상 1차 진료에서는 Crossover Health와 Premise Health가 합쳤다.","note":"세 건 모두 소비자가 아니라 고용주와 보험사에 파는 회사들끼리의 결합이다."},{"point":"고령자 1차 진료 회사 ChenMed는 GLP-1을 복용하는 회원들에게서 제지방 근육량 감소와 그에 따른 낙상으로 입원이 급증한 것을 확인하고, 더 이상 회원들에게 GLP-1 복용을 권하지 않기로 했다. 약 1만 명 규모 인구에서 6개월 동안 500건의 초과 입원이 나왔다.","note":"GLP-1은 체중을 줄이면서 지방만이 아니라 근육도 함께 빼기 때문에, 고령자에게는 살이 빠진 대가로 넘어져 다칠 위험이 커진다."}],"issue_insight":{"verdict":"yes","summary":"이 회차의 큰 줄기는 정부가 돈을 대던 시장이 조여드는 동안 소비자가 자기 돈으로 사는 시장에는 돈이 쏟아지고 있다는 대비다. 앱에서 당장 시험해 볼 만한 것은 GLP-1 복용자의 근육 손실과 낙상 문제 하나이고, 나머지는 시장이 어디로 가는지 알아 두는 신호에 가깝다.","build":[{"title":"GLP-1 복용자용 근육 지키기 코스","detail":"GLP-1을 맞는 사람은 지방과 함께 근육이 빠져 넘어지는 사고가 늘어난다. 걸음 데이터를 이미 갖고 있으므로 복용 여부를 물어 보고, 근력 운동 체크, 단백질 섭취 기록, 보행량과 보행 속도 변화 알림을 묶은 별도 코스를 붙이는 일은 소프트웨어만으로 3개월 안에 가능하다.","section":16}],"signal":[{"title":"현금 지불 소비자 시장에 쏟아지는 광고비","detail":"Ro는 슈퍼볼 광고 하나에 총비용 1,500만 달러 이상을 쓴다고 밝혔고 Hims도 슈퍼볼 광고를 준비 중이다. 보험을 거치지 않고 소비자가 직접 돈을 내는 건강 상품 쪽에 그만한 고객 획득 비용을 감당할 시장이 있다는 뜻이다.","section":5},{"title":"보험을 놓는 사람이 늘어난다","detail":"Elevance는 보조금 만료 여파로 올해 ACA 시장에서 최대 38%의 이탈을 볼 수 있다고 밝혔다는 것이 필자의 계산이다. 보험료가 오르자 가입을 접는 사람이 그만큼 많다는 뜻이고, 이들은 자기 돈으로 의료를 해결하는 쪽으로 밀려난다.","section":9},{"title":"GLP-1이 바꾸는 유통 경로","detail":"필자는 GLP-1이 헬스케어 유통의 새로운 시대를 열고 있다는 글을 골라, 현금 지불·상용 시장 혁신과 이어서 읽으라고 권한다. 소비자가 보험 밖에서 약을 직접 사는 경로가 커지는 방향은 보이지만, 규모를 보여 주는 수치는 이 회차에 없다.","section":23}]},"sections":[{"heading_ko":"스폰서: Lyft Healthcare","heading_en":"Sponsored by: Lyft Healthcare","skip":"sponsor","summary":"Lyft의 의료 이송 사업 광고다. 병원까지 가는 교통편을 의료 기관과 보험 플랜 대신 관리해 준다는 내용이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"이번 호 안내","heading_en":"","skip":"admin","summary":"이번 호부터 기사 링크 대신 커뮤니티 Slack 대화로 링크를 건다는 안내다. 내용은 없다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"2027 Advance Notice, 하룻밤에 시총 1,000억 달러","heading_en":"A MUSING","skip":null,"summary":"미국 정부가 내년에 민간 Medicare 보험사에 얼마를 줄지 예고했는데, 그 인상률이 사실상 0에 가깝게 나오면서 업계가 뒤집힌 이야기다. 업계는 한 자릿수 중반대 인상을 기대하고 있었다. 필자는 인상률 자체보다 5% 가까이 빗나간 예측 오차, 즉 이 시장이 더 이상 예측 가능하지 않다는 점을 문제로 본다. 상장 보험사뿐 아니라 지역 보험사 단체까지 반발한 정황이 이어진다.","insight":null,"signal":null,"author":[{"claim":"요율이 5%가량 출렁이는 것은 이 시장이 얼마나 예측하기 어려운지를 보여 준다.","evidence":"애널리스트들은 한 자릿수 중반대를 기대했고 Humana 3분기 실적 콜에서는 9% 초과 전망까지 나왔으나, 실효 성장률은 4.97%로 나왔다."},{"claim":"이번 Advance Notice는 이 시장의 안정성과 예측 가능성이라는 개념에 큰 망치를 휘둘렀고, 이는 업계와 협력한다는 CMS의 기조와도 어긋나 보인다.","evidence":"상장 MA 종목이 모두 10% 이상 하락했고, WSJ 계산으로 대형 4개사에서만 하룻밤에 약 1,000억 달러의 시가총액이 사라졌으며, Humana는 한 주를 26% 하락으로 마감했다."},{"claim":"반발의 대상은 위험 조정이 아니라 전체 계산이다.","evidence":"반발 성명을 낸 ACHP가 위험 조정을 현대화하려는 CMS의 노력은 지지한다고 함께 밝혔다는 점을 들었다."},{"claim":"MA 시장의 경쟁 조건을 평평하게 만드는 것이 의도였다면 이번 조치는 문제로 보인다.","evidence":"HealthScape Advisors 보고서가 지역 플랜의 절반 이상이 2027년을 버텨 낼 자본 준비금을 갖추지 못했다고 짚었고, 그것도 이번 소식 이전 이야기였다는 점을 들었다."}],"experts":[{"who":"Alliance of Community Health Plans(ACHP)","role":"병원과 의사 조직이 세운 지역 건강보험 플랜들의 이익 단체로, 이번 요율에 직접 타격을 받는 쪽이다","claim":"이번 Advance Notice는 실망스럽고 전혀 현실적이지 않으며, 이 요율이 확정되면 더 많은 보험사가 시장에서 철수할 것이다. 다만 위험 조정을 현대화하려는 CMS의 노력 자체는 지지한다.","evidence":"근거를 대지 않았다."},{"who":"Humana 3분기 실적 콜의 한 애널리스트","role":"MA 보험사를 분석하는 증권 애널리스트","claim":"실효 성장률이 9%를 넘을 수도 있다.","evidence":"비용 트렌드가 오르고 있다는 점을 들었다."},{"who":"HealthScape Advisors","role":"건강보험 플랜을 고객으로 두는 컨설팅 회사","claim":"지역 플랜의 절반 이상이 2027년을 버텨 낼 자본 준비금을 갖추지 못했다.","evidence":"몇 달 전 발표한 보고서인데, 뉴스레터는 산출 근거를 옮기지 않았다."}],"cases":[{"name":"CMS 2027 Advance Notice","what":"CMS가 월요일 저녁에 2027년 Medicare Advantage 지급률 예고안을 냈다. 지급자에 대한 실효 평균 변동률은 0.09%였다.","scale":"실효 평균 변동률 0.09%, 실효 성장률 4.97%","note":"업계가 기대한 한 자릿수 중반대와 약 5% 어긋났다는 점이 핵심이다.","sells_to":"none"},{"name":"MA 상장 보험사 주가 급락","what":"발표 직후 상장 MA 종목이 모두 10% 이상 떨어졌다. Alignment를 빼면 주 후반에 반등한 곳이 없었고, Elevance의 주중 상승은 실적 발표 덕분이었다.","scale":"대형 4개사(UNH, HUM, CVS, ELV) 시가총액 약 1,000억 달러 증발, Humana 주간 26% 하락","note":"월스트리트가 Final Notice 결과에 대해 이미 패를 내보인 것으로 필자는 읽는다.","sells_to":"none"}],"notes":[{"term":"CMS","ko":"연방 메디케어·메디케이드 서비스 센터","plain":"미국 연방 정부에서 노인 공보험인 Medicare와 저소득층 공보험인 Medicaid를 운영하는 기관이다. 한국의 보건복지부와 건강보험공단을 합쳐 놓은 자리에 가깝다. 민간 보험사에 얼마를 줄지, 어떤 조건으로 줄지를 이 기관이 정하기 때문에, CMS의 결정 하나가 여러 회사의 이익을 한꺼번에 바꾼다."},{"term":"Medicare Advantage(MA)","ko":"민간 보험사가 대신 운영하는 노인 공보험","plain":"미국 65세 이상 공보험인 Medicare를 정부가 직접 운영하는 대신, 민간 보험사가 가입자를 받아 운영하는 방식이다. 정부가 가입자 1인당 정액을 보험사에 주고, 보험사는 그 돈으로 진료비를 부담한 뒤 남는 만큼 이익을 가져간다. 한국에는 대응하는 제도가 없고, 건강보험공단이 할 일을 민간 보험사가 위탁받아 하는 구조라고 보면 이해가 쉽다. 그래서 정부가 정하는 지급률이 보험사 손익을 그대로 결정한다."},{"term":"Advance Notice / Final Notice","ko":"지급률 예고안과 확정안","plain":"CMS가 이듬해 MA 보험사에 지급할 금액을 어떻게 바꿀지 먼저 알리는 것이 Advance Notice이고, 몇 달 뒤 의견 수렴을 거쳐 확정하는 것이 Final Notice다. 보험사는 이 숫자를 보고 이듬해 보험 상품의 혜택과 보험료를 설계한다. 원문에 따르면 Final Notice는 지난 10년간 Advance Notice보다 대체로 1%가량 높게 나왔다."},{"term":"실효 평균 변동률 / 실효 성장률","ko":"보험사가 실제로 더 받게 되는 비율","plain":"실효 성장률은 의료비가 얼마나 오를 것으로 보는지를 반영한 기본 인상률이고, 실효 평균 변동률은 거기에 위험 조정 방식 변경 같은 다른 조정을 모두 더한 최종 결과다. 이번에는 기본 인상률이 4.97%였는데도 다른 조정이 그것을 거의 다 깎아 최종 0.09%가 되었다. 즉 사실상 동결이다."}]},{"heading_ko":"화요일 Klomp의 발언","heading_en":"Klomp's Commentary on Tuesday","skip":null,"summary":"발표 다음 날 CMS의 Medicare 디렉터가 공개 대담에서 한 말을 그대로 옮기고, 필자가 그 말과 실제 조치가 왜 앞뒤가 안 맞아 보이는지 따져 보는 대목이다. 디렉터는 MA를 전폭 지지한다고 했고, 이번 조치의 주된 의도는 진단 코딩 관행을 손보는 것이며 나머지는 그냥 계산이라고 했다. 필자는 이 부조화를 설명할 가설 두 개를 세우되, 어느 쪽인지는 모르겠다고 밝힌다.","insight":null,"signal":null,"author":[{"claim":"시총 1,000억 달러를 날린 바로 그날에 MA를 목청 높여 지지한다는 것은 앞뒤가 맞지 않아 보인다.","evidence":"같은 날 지역 보험사들이 이 조치가 자신들의 생존을 위협한다는 성명을 냈다는 점, 그리고 Klomp 본인이 불과 몇 주 전 JPM에서 시장에 안정성과 예측 가능성이 필요하다고 말했다는 Politico 보도를 들었다."},{"claim":"첫 번째 가설은 CMS가 MA 산업을 리셋하겠다는 의지를 보이며 반창고를 확 떼어 냈다는 것이다.","evidence":"Klomp가 여러 차례 CMS가 납세자 돈을 잘 관리해 오지 못했다는 견해를 밝혀 왔다는 점을 들었다."},{"claim":"두 번째 가설은 CMS가 계산을 잘못했고 보험계리적 수치의 영향을 과소평가했다는 것이다. Advance Notice의 나머지를 그저 계산이라고 치부한 것은 큰 전술적 실수였다.","evidence":"CMS의 계리사와 업계의 계리사가 매우 다른 계산을 하고 있다는 점, 그리고 경쟁 조건을 평평하게 만드는 것이 목표였다면 지역 플랜의 철수와 통합을 불러오는 것은 그 목적을 무너뜨린다는 점을 들었다."},{"claim":"두 설명 가운데 어느 쪽이 더 그럴듯한지는 모르겠고, 설명이 갈린다는 것 자체가 업계에는 큰 숙제다.","evidence":"근거를 대지 않았다."}],"experts":[{"who":"Chris Klomp","role":"CMS의 현직 Medicare 디렉터로, 이번 조치를 내놓은 정부 쪽 당사자다","claim":"CMS는 Medicare Advantage를 전폭적으로 지지하며, 그것은 Medicare의 미래에서 핵심 구성 요소다. 이번에 제안한 것은 연결되지 않은 차트 리뷰 코딩에 대한 수정이고, 목표는 프로그램의 인센티브가 실제로 수혜자의 진료를 개선하는 활동에 보상하도록 만드는 것이다.","evidence":"CMS가 책임지는 6,800만 명의 수혜자에게 최선의 의료 경험을 제공하면서 프로그램의 장기 지속 가능성을 확보한다는 목표를 들었으나, 지급률 결과 자체에 대해서는 수치로 설명하지 않았다."},{"who":"Chris Klomp","role":"위와 같은 사람이며, 아래는 같은 대담에서 나온 별개의 발언이다","claim":"Advance Notice의 나머지는 그냥 계산이다. 보험계리사들이 기저 의료비 트렌드를 산정해 실효 성장률에 넣으면 나머지는 거기서 계산으로 흘러나온다.","evidence":"근거를 대지 않았다."}],"cases":[],"notes":[{"term":"risk adjustment(위험 조정)","ko":"가입자가 아플수록 보험사가 더 받는 구조","plain":"MA 보험사는 가입자 1인당 정액을 받는데, 건강한 사람만 받으면 이득이고 아픈 사람을 받으면 손해가 되므로, 정부는 가입자의 진단명을 보고 아픈 사람이 많은 보험사에 더 많이 준다. 문제는 진단명을 많이 붙일수록 보험사가 더 받는다는 데 있고, 그래서 실제 치료와 무관하게 진단명을 찾아내는 일이 산업이 되었다. 논쟁은 이 구조 자체가 아니라 계산 방식에 있다."},{"term":"unlinked chart review","ko":"연결되지 않은 차트 검토","plain":"실제 진료 기록과 연결되지 않은 채, 과거 의무기록만 뒤져서 진단명을 추가로 찾아 정부에 청구하는 관행이다. 진료를 더 해 준 것이 아니라 서류에서 병명을 더 찾아낸 것이므로 지급액만 올라간다. Klomp가 말한 수정안은 이 경로로 붙은 진단을 인정하지 않겠다는 뜻이다."},{"term":"MFN","ko":"최혜국 약값","plain":"미국이 다른 선진국이 지불하는 가장 싼 약값에 맞춰 약값을 낮추겠다는 정책 기조를 가리킨다. 이번 행정부가 제약사와 협상해 온 대표적 사안이라, 필자는 CMS가 민간 시장과 협상을 풀어 가는 방식의 예로 이것을 든다."}]},{"heading_ko":"스타트업과 투자자에게 번지는 파장","heading_en":"The ripple effect for startups and investors","skip":null,"summary":"요율 이야기가 왜 헬스케어 스타트업 전체의 문제인지 설명하는 대목이다. 필자는 지난 10년간 헬스케어 서비스 분야의 대형 엑싯 대부분이 MA 시장에 기대어 있었다고 짚는다. 정부가 이 성과에 더 이상 납세자 돈을 쓰지 않겠다는 신호라면, 정부 프로그램을 상대로 일하는 회사들에게 남는 출구가 무엇인지 묻는다. 끝에서는 미국이 이중 의료 체계로 갈라지고 있다는 관측을 내놓는다.","insight":null,"signal":"필자는 ACA·Medicaid·Medicare 시장이 두들겨 맞는 같은 주에 Ro와 Hims가 슈퍼볼 광고 세부 내용을 공개했고, Ro는 광고 하나에 총비용 1,500만 달러 이상을 쓴다고 밝혔다는 대비를 든다. 보험을 거치지 않고 소비자가 직접 돈을 내는 건강 상품 쪽에 그만한 고객 획득 비용을 감당할 시장이 있다는 뜻이다. 미국에서 우리가 노릴 자리도 정부 프로그램 바깥, 소비자가 스스로 고르고 스스로 내는 쪽이다.","author":[{"claim":"보험 시장, 특히 Medicare Advantage는 시장에서 벌어지는 스타트업 활동의 상당 부분을 떠받치는 핵심 엔진이다.","evidence":"Oak Street, Signify, VillageMD, Landmark, CareBridge 등 MA 프로그램의 성공에 힘입어 만들어진 유니콘들을 들었다."},{"claim":"이런 사업에 투자하고 있다면, 정부가 더 이상 납세자 돈으로 이런 성과를 뒷받침하고 싶지 않다는 신호인지 스스로 물어봐야 한다.","evidence":"IPO 시장이 여전히 얼어붙어 있고 유일한 전략적 인수자 집단마저 무력해졌다는 점을 들었다."},{"claim":"첫 번째 파도는 v28 때처럼 VBC 프로바이더를 덮치고, 이어지는 파도는 그 시장에 솔루션을 파는 회사들을 덮칠 것이다.","evidence":"v28 개편 때 같은 순서로 충격이 번졌다는 선례를 들었다."},{"claim":"미국이 감당할 수 있는 쪽의 현금 지불·상용 보험 시장과 나머지 국민을 위한 대규모 정부 재원 위험 풀로 갈라지는 임계점에 와 있는지도 모른다.","evidence":"정부 프로그램 시장이 두들겨 맞는 동안 Ro와 Hims가 슈퍼볼 광고에 큰돈을 쓰는 같은 주의 헤드라인 대비를 들었다."}],"experts":[],"cases":[{"name":"Ro","what":"보험을 거치지 않고 소비자가 직접 가입해 약과 진료를 받는 온라인 회사다. 곧 나올 슈퍼볼 광고의 세부 내용을 공개했다.","scale":"광고 하나에 총비용 1,500만 달러 이상","note":"정부 프로그램이 조여드는 시기에 소비자 직접 판매 쪽은 오히려 대규모 광고를 집행하고 있다.","sells_to":"consumer"},{"name":"Hims","what":"Ro와 마찬가지로 소비자가 직접 돈을 내는 온라인 건강 상품 회사이며, 슈퍼볼 광고 세부 내용을 공개했다.","scale":"","note":"","sells_to":"consumer"}],"notes":[{"term":"VBC(value-based care)","ko":"성과 기반 진료","plain":"진료를 한 건 할 때마다 돈을 받는 대신, 환자 집단의 건강을 맡아 정해진 예산 안에서 관리하고 결과가 좋으면 더 가져가는 방식이다. 한국의 행위별 수가제와 대비되는 구조라고 보면 된다. MA 보험사가 받은 정액을 다시 이런 프로바이더에게 넘기는 경우가 많아, 정부 지급률이 깎이면 이 회사들이 먼저 충격을 받는다."},{"term":"v28","ko":"직전 위험 조정 모델 개편","plain":"CMS가 진단명에 따라 얼마를 더 줄지 계산하는 모델을 바꾼 직전 사례다. 이때도 지급액이 줄면서 성과 기반 진료 회사들이 먼저 타격을 받았고, 업계는 그 여파가 끝나면 2027년에는 시장이 안정을 되찾으리라 기대하고 있었다."}]},{"heading_ko":"이번 주의 질문","heading_en":"Question of the Week","skip":"promo","summary":"Final Notice가 얼마나 올라올지 커뮤니티 회원에게 묻는 설문이다. 선택지에 지난 10년의 실제 인상 폭 구간이 함께 적혀 있다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"4분기 실적 시즌","heading_en":"Q4 Earnings Season","skip":null,"summary":"실적 시즌 도입부다. 필자는 병원 체인과 보험사가 애널리스트에게 받는 질문의 성격이 정반대라는 점에 주목한다. 한쪽은 20% 영업이익률을 계속 유지할 수 있느냐는 질문을 받고, 다른 쪽은 한 자릿수 중반대 목표가 가능하기는 하냐는 추궁을 받는다.","insight":null,"signal":null,"author":[{"claim":"미국 헬스케어에서 돈이 어떻게 흐르는지 고민하고 있다면 이 실적 콜의 대비에서 파고들 거리가 많다.","evidence":"HCA는 20% 영업이익률의 지속 가능성을 질문받는 반면 UHG와 Elevance는 한 자릿수 중반대 마진 목표의 달성 가능성을 추궁받는다는 대비를 들었다."}],"experts":[],"cases":[],"notes":[]},{"heading_ko":"4분기 실적: UHG","heading_en":"Q4 Earnings Season","skip":null,"summary":"미국 최대 보험사 UnitedHealth Group의 실적 요약이다. 2026년을 핵심 사업 재정비의 해로 잡았고, 30여 년 만에 처음으로 연간 매출이 줄 것으로 전망한다. MA 회원 이탈이 예상보다 크지만 회사는 이 방향에 자신감을 보였다. 회사는 준비된 발언에서 2027 Advance Notice를 정면으로 반박했다.","insight":null,"signal":null,"author":[{"claim":"이 모든 것이 앞으로를 향해 스스로를 재배치하고 있는 조직 안에서 변화가 진행 중임을 보여 준다.","evidence":"매출 감소 전망, 보험 포트폴리오 재가격 책정, Optum Health의 4분기 약 6억 달러 미달을 들었다."}],"experts":[{"who":"UnitedHealthcare(UHC) 경영진","role":"이번 요율 결정으로 직접 손실을 보는 최대 MA 보험사의 경영진이다","claim":"2027 Advance Notice는 의료 이용량과 비용 트렌드의 현실을 전혀 반영하지 못한다.","evidence":"근거를 대지 않았다."}],"cases":[{"name":"UnitedHealth Group","what":"보험 사업 UHC와 진료·약제·데이터 사업 Optum을 함께 가진 미국 최대 헬스케어 회사다. 2026년 매출 소폭 감소를 전망하고 보험 포트폴리오의 가격을 다시 책정했다.","scale":"30여 년 만의 첫 연간 매출 감소 전망(Bloomberg), Optum Health 4분기 약 6억 달러 미달","note":"Optum의 마진 회복은 보험 쪽보다 더 오래 걸릴 것이라고 밝혔고, 목표 마진 달성 근거로 텍사스 시장 결과를 들었다.","sells_to":"other"}],"notes":[{"term":"UHG / UHC / Optum","ko":"지주사 · 보험 사업 · 진료 사업","plain":"UnitedHealth Group이 지주사이고, 그 안에 보험을 파는 UnitedHealthcare와 병원·약국·데이터 사업을 하는 Optum이 함께 들어 있다. 즉 보험료를 받는 쪽과 그 돈을 쓰는 쪽을 한 회사가 다 갖고 있는 구조다. 그래서 정부 지급률이 깎이면 보험 쪽만이 아니라 그 돈으로 먹고사는 진료 쪽도 같이 눌린다."}]},{"heading_ko":"4분기 실적: Elevance","heading_en":"Q4 Earnings Season","skip":null,"summary":"또 다른 대형 보험사 Elevance의 실적 요약이다. 2026년은 이익이 줄어드는 해로 잡고 2027년 이후 회복을 계획한다. UHG와 마찬가지로 MA 사업의 예상보다 큰 감소를 받아들이는 분위기였다. 이 회차에서 소비자와 가장 가까운 숫자가 여기 나오는데, ACA 시장에서 보조금이 끊기며 가입자가 대거 빠질 것이라는 대목이다.","insight":null,"signal":"Elevance가 보조금 만료 여파로 올해 ACA 시장에서 최대 38%의 이탈을 볼 수 있다고 밝힌 셈이라는 것이 필자의 계산이다. 보험료 부담이 커지자 스스로 가입을 접는 사람이 그만큼 많다는 뜻이고, 이들은 보험 없이 자기 돈으로 의료를 해결하는 쪽으로 밀려난다. 미국에서 현금으로 건강을 챙겨야 하는 소비자 층이 올해 크게 늘어나는 방향을 보여 준다.","author":[{"claim":"전반적으로 앞으로 보험 시장이 맞닥뜨릴 어려움을 보여 주는 실적이며, Carelon 사업의 긍정적 모멘텀이 그것을 상쇄하고 있다.","evidence":"2026년 조정 EPS 감소 전망, MA 사업의 예상보다 큰 감소, Medicaid의 저점 구간 판단을 들었다."}],"experts":[],"cases":[{"name":"Elevance Health","what":"여러 주에서 Blue Cross 브랜드로 보험을 파는 대형 보험사다. 2026년 조정 EPS 감소를 전망하면서 2027년 이후 12% EPS 성장 복귀를 계획한다고 밝혔다.","scale":"실적 발표 후 주가 7% 반등, ACA 시장 최대 38% 이탈 전망(필자 계산)","note":"MA에서는 HMO 계약과 D-SNP 인구 중심으로 재배치하고, ASO 시장에서는 두 번째 블루 입찰 현상 덕에 성장하고 있다고 밝혔다.","sells_to":"other"}],"notes":[{"term":"ACA 거래소와 보조금 만료","ko":"개인이 직접 사는 보험 장터","plain":"직장 보험도 없고 공보험 대상도 아닌 사람이 정부가 운영하는 온라인 장터에서 직접 보험을 사는 시장이다. 지금까지는 정부가 보험료의 상당 부분을 보조금으로 대 줘서 감당할 만했는데, 그 보조금이 만료되면 본인 부담이 크게 뛴다. 그러면 상당수가 보험을 아예 놓게 되고, 병원비를 스스로 내야 하는 사람이 늘어난다."},{"term":"Medicaid","ko":"저소득층 공보험","plain":"소득이 낮은 사람에게 주와 연방 정부가 함께 돈을 대 주는 공보험이다. 한국의 의료급여에 해당한다. 대상자가 줄거나 예산이 깎이면 보험사도 관리 수수료가 함께 줄어드는데, Elevance는 올해를 그 바닥 구간으로 본다고 밝혔다."},{"term":"D-SNP","ko":"이중 수급자 전용 플랜","plain":"노인 공보험 Medicare와 저소득층 공보험 Medicaid를 동시에 받는 사람만 가입하는 특수 MA 플랜이다. 대상자가 가난하고 동시에 아픈 경우가 많아 1인당 지급액이 크고, 그만큼 잘 관리하면 남길 여지도 크다. 보험사들이 일반 MA를 줄이면서도 이쪽으로 옮겨 가는 이유다."},{"term":"ASO와 두 번째 블루 입찰","ko":"보험 위험은 고용주가 지고 관리만 대행하는 계약","plain":"큰 회사는 직원 의료비를 자기 돈으로 직접 부담하고, 보험사에는 청구 처리와 병원 네트워크 이용료만 낸다. 보험사 입장에서는 위험이 없고 수수료만 받는 안정적인 사업이다. 두 번째 블루 입찰은 이미 다른 Blue Cross 계열이 들어가 있는 고용주에게 또 다른 Blue 계열이 함께 제안을 넣는 현상을 가리킨다."}]},{"heading_ko":"4분기 실적: HCA","heading_en":"Q4 Earnings Season","skip":null,"summary":"미국 최대 영리 병원 체인 HCA의 실적이다. 보험사들이 제자리걸음을 하는 동안 눈에 띄게 좋은 분기를 냈고 주가도 잠시 11% 뛰었다. 대부분의 병원이 겨우 손익분기를 맞추는 업계에서 20%가 넘는 영업이익률을 유지할 수 있느냐는 질문을 받았다는 점 자체가 이 회사의 위치를 보여 준다.","insight":null,"signal":null,"author":[{"claim":"20% 넘는 마진을 유지할 수 있느냐는 질문이 나왔다는 것 자체가 최근 HCA가 얼마나 잘하고 있는지를 보여 준다.","evidence":"대부분의 병원 시스템이 영업이익률에서 겨우 손익분기를 맞추는 이야기를 하고 있다는 업계 상황을 들었다."}],"experts":[],"cases":[{"name":"HCA Healthcare","what":"미국 최대 영리 병원 체인이다. 애널리스트 예상치를 웃도는 분기 실적을 냈다.","scale":"실적 발표 후 주가 잠시 11% 상승, 2026년 조정 EBITDA에 6억~9억 달러 부정적 영향 예상","note":"정책 역풍을 인정하면서도 20% 마진 지속 여부에는 답을 내놓지 않았다.","sells_to":"other"}],"notes":[]},{"heading_ko":"이번 주의 차트: 주별 병원 이익률 하락 폭","heading_en":"Chart of the Week","skip":null,"summary":"컨설팅 회사 Oliver Wyman이 주마다 병원 영업이익률이 얼마나 떨어질지 추정한 분석이다. 가장 크게 영향을 받는 곳은 New York이고 가장 작은 곳은 Wyoming이다. 필자는 앞의 HCA 실적과 함께 읽으면서, 운영 규율의 차이가 결과를 가른다고 본다.","insight":null,"signal":null,"author":[{"claim":"이런 시장 여건에서 훨씬 많은 병원이 HCA 수준의 운영 규율에서 도움을 받을 수 있을 것이다.","evidence":"같은 여건에서 HCA는 20%대 마진을 내는 반면 대부분의 병원은 겨우 손익분기를 맞춘다는 대비를 들었다."}],"experts":[{"who":"Oliver Wyman","role":"병원과 보험사를 고객으로 두는 경영 컨설팅 회사다","claim":"여러 주에서 병원 영업이익률이 낮아질 것이며, 그 폭은 주마다 크게 다르다.","evidence":"주별 추정치를 제시했다. New York은 5.8% 하락, Wyoming은 0.2% 하락이다."}],"cases":[],"notes":[]},{"heading_ko":"Sword Health의 Kaia 인수","heading_en":"Other Top Headlines","skip":null,"summary":"원격으로 근골격계 통증을 관리해 주는 회사 Sword Health가 독일 회사 Kaia Health를 인수했다. 필자의 관심은 인수 자체보다 자금 조달 방식에 있다. Sword는 기존 사업 운영에 외부 자본이 필요 없다고 하면서도 5억 달러를 조달하려 하는데, 필자는 이것이 현금으로 스타트업을 사기 위해 지분을 발행하는 것으로 읽는다고 밝힌다.","insight":null,"signal":null,"author":[{"claim":"Sword가 현금흐름 흑자라면서도 5억 달러를 조달한다는 것은, 그 현금으로 스타트업을 사기 위해 투자자에게 지분을 발행하려는 뜻으로 읽힌다. 왜 부채로 조달하지 않는지 생각해 볼 만하다.","evidence":"Sword가 2025년에 빠르게 성장하면서도 현금흐름 흑자를 냈고 기존 사업 운영에는 외부 자본이 필요 없다고 밝힌 점을 들었다."}],"experts":[],"cases":[{"name":"Sword Health","what":"원격으로 근골격계 치료 프로그램을 제공하는 회사다. Kaia Health를 인수하면서 7주 연속 뉴스를 내놓을 계획이고, 5억 달러 조달과 올해 적극적인 인수 계획을 내비쳤다.","scale":"인수가 2억 8,500만 달러, 조달 추진액 5억 달러","note":"2025년에 빠르게 성장하면서도 현금흐름 흑자를 냈다고 밝혔다.","sells_to":"employer"},{"name":"Kaia Health","what":"근골격계 통증을 원격으로 다루는 회사이며, 이번 인수로 Sword에 독일 시장의 교두보를 마련해 준다.","scale":"","note":"뉴스레터는 Kaia가 무엇을 어떻게 하는 회사인지는 설명하지 않았다.","sells_to":"employer"}],"notes":[{"term":"MSK","ko":"근골격계","plain":"허리, 목, 무릎, 어깨처럼 뼈와 근육, 관절에 생기는 통증을 묶어 부르는 말이다. 미국 고용주가 직원 의료비로 가장 많이 쓰는 항목 가운데 하나여서, 병원에 보내지 않고 앱으로 운동과 재활을 시켜 비용을 줄이려는 회사들이 이 시장에 몰려 있다."}]},{"heading_ko":"Spring Health와 Alma 합병","heading_en":"Other Top Headlines","skip":null,"summary":"정신건강 시장에서 두 회사가 합쳤다. 재무 조건은 공개되지 않았다. 한쪽은 고용주와 보험 플랜을 통해 계약 인원을 확보한 회사이고, 다른 쪽은 상담사 네트워크와 보험사 계약을 가진 회사다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Spring Health","what":"고용주와 건강보험 플랜을 통해 직원과 가입자에게 정신건강 서비스를 제공하는 회사다. IPO 후보로 거론돼 왔다.","scale":"계약 인원 5,000만 명, 누적 조달 4억 7,000만 달러 이상, 2024년 6월 밸류에이션 33억 달러","note":"합병에서 AI 역량을 담당하는 쪽으로 설명된다.","sells_to":"employer"},{"name":"Alma","what":"상담사를 모아 보험 청구와 운영을 대신 처리해 주는 프로바이더 네트워크 회사다.","scale":"전국 및 일부 지역 보험사와의 계약으로 1억 2,000만 명 포괄, 누적 조달 2억 2,000만 달러 이상, 2022년 밸류에이션 8억 달러","note":"합병에서 프로바이더 인프라와 네트워크를 담당하는 쪽이다.","sells_to":"provider"}],"notes":[{"term":"계약 인원(lives)","ko":"그 서비스를 쓸 자격이 있는 사람 수","plain":"실제 이용자 수가 아니라, 고용주나 보험사와 계약이 맺어져 있어 마음만 먹으면 쓸 수 있는 사람의 수다. 미국 헬스케어 회사가 규모를 말할 때 흔히 쓰는 단위인데, 실제 이용률은 그보다 훨씬 낮은 경우가 많으므로 매출 규모와 혼동하면 안 된다."}]},{"heading_ko":"Crossover와 Premise 합병","heading_en":"Other Top Headlines","skip":null,"summary":"고용주가 직원을 위해 마련하는 1차 진료 클리닉 시장에서 두 회사가 합쳤다. 한쪽은 44개 주에 800개 센터를, 다른 쪽은 사업장 안과 인근에 50개 클리닉을 두고 있다. 필자는 이 시장에서 논리적인 결합이라고 짧게 평가한다.","insight":null,"signal":null,"author":[{"claim":"이 시장에서 논리적인 자산 결합으로 보인다.","evidence":"근거를 대지 않았다."}],"experts":[],"cases":[{"name":"Premise Health","what":"고용주와 계약해 직원용 웰니스 센터를 운영하는 회사다.","scale":"44개 주에 800개 웰니스 센터","note":"","sells_to":"employer"},{"name":"Crossover Health","what":"고용주 사업장 안이나 인근에 1차 진료 클리닉을 운영하는 회사다.","scale":"50개 클리닉 중 26개는 사업장 내, 24개는 여러 고용주가 함께 쓰는 인근 지점","note":"","sells_to":"employer"}],"notes":[{"term":"고용주 1차 진료(on-site / near-site)","ko":"회사가 직접 차려 주는 사내 의원","plain":"미국은 직장 보험이 기본이라 직원 의료비를 회사가 부담하는데, 병원비가 비싸다 보니 아예 사업장 안이나 근처에 의원을 차려 직원을 그리로 보내는 방식이 자리 잡았다. 여러 회사가 한 지점을 나눠 쓰기도 한다. 한국의 사내 의무실과 비슷해 보이지만, 여기서는 진짜 1차 진료를 대체하는 규모다."}]},{"heading_ko":"Included Health의 새 플랜 설계","heading_en":"Other Top Headlines","skip":null,"summary":"직원이 어디서 진료를 받을지 안내해 주던 회사가, 이번에는 보험 상품 설계 자체를 내놓았다. 필자는 고용주가 비용 상승에 시달리는 만큼 앞으로 이 방향으로 움직이는 회사가 늘 것으로 본다. CEO와 나눈 대화 내용은 커뮤니티에 따로 공유하겠다고 예고한다.","insight":null,"signal":null,"author":[{"claim":"고용주들이 비용 상승을 헤쳐 나가느라 씨름하는 가운데, 앞으로 몇 년간 고용주에게 판매하는 내비게이터를 비롯한 여러 회사가 이 방향으로 움직일 것이다.","evidence":"근거를 대지 않았다."},{"claim":"고용주 시장이 최근 공개 시장에서 두들겨 맞긴 했지만, 오히려 앞으로 여기에 기회가 많다는 인상을 받는다.","evidence":"근거를 대지 않았다."}],"experts":[{"who":"Owen Tripp","role":"이 플랜을 내놓은 Included Health의 CEO로, 자사 상품을 알리는 쪽이다","claim":"이 플랜이 이미 시장에서 반응을 얻고 있고, AI 기반 회원 경험이 플랜 작동의 핵심이며, 브로커는 이런 상품을 고용주의 성과 관리를 돕는 또 하나의 도구로 본다.","evidence":"흥미로운 데이터 포인트를 이야기했다고만 적혀 있고, 뉴스레터에는 수치가 실리지 않았다."}],"cases":[{"name":"Included Health","what":"고용주와 계약해 직원이 어디서 어떤 진료를 받을지 안내하던 회사가, 고용주를 위한 대안적 플랜 설계를 새로 선보였다.","scale":"","note":"안내만 해 주던 회사가 보험 상품 설계로 올라선 사례다.","sells_to":"employer"}],"notes":[{"term":"내비게이터(navigator)","ko":"진료 길 안내 회사","plain":"미국은 병원마다 가격이 다르고 보험이 어디까지 대 주는지도 복잡해서, 직원이 어디로 가야 할지 스스로 판단하기 어렵다. 그 판단을 대신해 주고 값싸고 좋은 곳으로 안내하는 회사를 내비게이터라고 한다. 돈은 고용주가 낸다. 한국에는 병원 선택이 자유롭고 값도 거의 같아 이런 사업이 성립하지 않는다."},{"term":"플랜 설계(plan design)","ko":"보험 상품의 조건 짜기","plain":"자기부담금을 얼마로 할지, 어떤 병원에 가야 보험이 되는지, 어떤 절차를 밟아야 하는지를 정하는 일이다. 이 설계를 어떻게 바꾸느냐에 따라 직원이 어디로 가는지가 달라지고, 회사가 부담할 총액도 달라진다. 지금까지 이 설계는 보험사의 몫이었는데, 안내를 해 주던 회사가 여기까지 손을 뻗은 것이 이번 소식의 요점이다."}]},{"heading_ko":"ChenMed, GLP-1 권고 중단","heading_en":"Other Top Headlines","skip":null,"summary":"고령자를 전담해 진료하는 회사가 자기 회원들에게서 GLP-1 부작용의 실제 결과를 확인하고 권고를 거둬들인 이야기다. 살이 빠지면서 근육까지 함께 빠졌고, 그 결과 넘어져 입원하는 사람이 급증했다. 회사가 사후에야 이 문제를 확인했다는 점이 눈에 띈다.","insight":"GLP-1은 살을 빼면서 근육도 함께 빼고, 그래서 넘어져 다치는 사람이 늘어난다는 것이 이 사례의 요지다. 우리는 이미 걸음 수를 재고 있으므로, GLP-1 복용 여부를 물어 보고 그 사람에게만 붙는 별도 코스를 3개월 안에 만들 수 있다. 근력 운동 체크, 단백질 섭취 기록, 하루 보행량과 보행 속도의 변화 알림을 묶는 정도면 웨어러블 개발도 규제 허가도 필요 없다. 프로바이더조차 500건이 쌓인 뒤에야 알아차렸다는 대목이, 복용자 본인은 더더욱 모르고 있다는 뜻으로 읽힌다.","signal":null,"author":[{"claim":"이 집단에서의 GLP-1 사용에 대한 꽤 경고적인 사례로 보인다.","evidence":"약 1만 명 규모 인구에서 6개월 동안 500건의 초과 입원이 발생했다는 수치를 들었다."}],"experts":[{"who":"ChenMed","role":"고령자 1차 진료를 전담하며 MA 플랜에서 정액을 받아 운영하는 회사로, 회원이 입원하면 비용을 자기가 떠안는 쪽이다","claim":"더 이상 회원들에게 GLP-1 복용을 권하지 않는다.","evidence":"제지방 근육량 감소와 그에 따른 낙상 증가로 회원들의 입원이 급증한 것을 확인했다고 밝혔다. 약 1만 명 규모 인구에서 6개월 동안 500건의 초과 입원이다."}],"cases":[{"name":"ChenMed","what":"고령자 1차 진료 회사가 온라인 행사에서 GLP-1 권고 중단을 밝혔다.","scale":"약 1만 명 인구에서 6개월간 초과 입원 500건","note":"회원이 입원하면 비용을 회사가 떠안는 구조여서 이 문제를 숫자로 먼저 발견할 수 있었다.","sells_to":"payer"}],"notes":[{"term":"GLP-1","ko":"비만·당뇨 주사제 계열","plain":"식욕을 줄여 체중을 크게 떨어뜨리는 주사제 계열이며, 미국에서 성인 상당수가 쓰는 대중적 약이 되었다. 살이 빠지는 속도가 빠른 만큼 지방만이 아니라 근육도 함께 빠지는 것이 알려진 문제다."},{"term":"제지방 근육량 감소","ko":"지방을 뺀 몸무게 가운데 근육이 줄어드는 것","plain":"체중계 숫자는 내려가는데 그 안에서 근육이 함께 빠지는 현상이다. 고령자에게는 다리 힘이 떨어져 균형을 잃기 쉬워지고, 한 번 넘어지면 골절과 입원으로 이어진다. 그래서 체중 감량 자체보다 근력을 지켰느냐가 더 중요한 지표가 된다."}]},{"heading_ko":"Reed Jobs의 종양학 펀드 Yosemite","heading_en":"Other Top Headlines","skip":null,"summary":"암 치료 분야에 집중하는 벤처 펀드가 새 펀드의 일부를 클로징했다. 제약사와 병원, 대학이 출자자로 들어갔다. 필자는 아직 신생 펀드이지만 접근과 트랙 레코드가 인상적이라고 짧게 평가한다.","insight":null,"signal":null,"author":[{"claim":"아직 신생 펀드이긴 하지만 Yosemite는 흥미로운 접근과 종양학 분야에서 인상적인 트랙 레코드를 갖고 있다.","evidence":"근거를 대지 않았다."}],"experts":[],"cases":[{"name":"Yosemite","what":"Reed Jobs가 시작한 종양학 중심 벤처 펀드가 신규 펀드의 일부를 클로징했다고 발표했다.","scale":"3억 5,000만 달러 목표 중 2억 달러 클로징","note":"출자자에 Amgen, Memorial Sloan Kettering, MIT, John Doerr가 포함된다.","sells_to":"other"}],"notes":[]},{"heading_ko":"Tandem, 처방약 사전 승인","heading_en":"Funding Announcements","skip":null,"summary":"약을 처방했는데 보험사가 승인해 주지 않으면 환자가 약을 받지 못하는데, 그 승인 절차를 대신 처리해 주는 회사가 큰돈을 조달했다. 사용자는 의사와 병원 직원이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Tandem","what":"처방약 사전 승인을 처리해 주는 회사가 Accel 주도로 라운드를 받았다.","scale":"1억 달러 조달, 밸류에이션 10억 달러, 누적 조달 1억 3,700만 달러","note":"자사 사이트 기준 수천 명의 프로바이더가 매일 쓰고 연간 수백만 건의 처방을 처리한다고 밝혔다.","sells_to":"provider"}],"notes":[{"term":"사전 승인(prior authorization)","ko":"보험사의 사전 허가","plain":"의사가 약이나 검사를 처방해도, 보험사가 미리 승인해 주지 않으면 보험이 적용되지 않는 제도다. 서류를 넣고 답을 기다리는 동안 환자는 약을 못 받고, 병원은 이 일에만 사람을 따로 둔다. 한국에는 사실상 없는 절차라 감이 잘 안 오는데, 처방전을 받고도 며칠씩 약국에 못 가는 상황이라고 보면 된다."}]},{"heading_ko":"Gyde, 보험 브로커리지 롤업","heading_en":"Funding Announcements","skip":null,"summary":"보험을 중개하는 소규모 회사들을 사들여 한데 묶고, AI로 업무 효율을 올려 이익률을 개선하는 모델이다. 필자는 구조가 단순명료하다고 보면서 확장 속도를 지켜보겠다고 한다.","insight":null,"signal":null,"author":[{"claim":"AI로 효율을 높여 브로커리지 안의 마진을 개선하는, 브로커리지 소유주와 Gyde 모두에게 윈윈이 되는 단순명료한 모델로 보인다.","evidence":"근거를 대지 않았다."}],"experts":[],"cases":[{"name":"Gyde","what":"AI를 활용해 보험 중개 회사들을 사들여 묶는 롤업 회사가 자금을 조달했다.","scale":"6,000만 달러 조달","note":"소프트웨어를 파는 것이 아니라 회사를 사서 직접 운영해 마진을 남기는 구조다.","sells_to":"other"}],"notes":[{"term":"브로커리지 롤업","ko":"중개 회사 사 모으기","plain":"미국에서는 고용주가 직원 보험을 고를 때 보험 중개인을 거치는 것이 일반적이라, 지역마다 작은 중개 회사가 흩어져 있다. 롤업은 그런 회사들을 하나씩 사들여 한 지붕 아래 묶고, 중복되는 사무 업무를 자동화해 이익을 남기는 방식이다. 사업의 성패가 기술이 아니라 인수와 통합 실행에 달려 있다."}]},{"heading_ko":"Indigo, 의료 과실 배상","heading_en":"Funding Announcements","skip":null,"summary":"의사가 의료 사고에 대비해 드는 배상 책임 보험을 AI로 인수 심사하는 회사가 자금을 조달했다. 보도자료 기준 수치가 함께 실려 있다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Indigo","what":"AI 중심의 의료 과실 배상 보험 회사가 Rubicon Founders와 Town Hall Ventures로부터 투자를 받았다.","scale":"5,000만 달러 조달, 전국 1만 명 프로바이더 서비스, 인수 보험료 100억 달러, 제출 건의 20% 완전 자동화","note":"수치는 모두 보도자료 기준이다.","sells_to":"provider"}],"notes":[{"term":"의료 과실 배상 보험","ko":"의사가 드는 사고 배상 보험","plain":"환자가 의료 사고로 소송을 걸었을 때 배상금을 대 주는 보험이며, 미국 의사에게는 필수 비용이다. 소송 위험이 커서 보험료가 매우 비싸고, 어떤 의사가 얼마나 위험한지 가려내는 심사가 이 사업의 핵심이다. 여기서 AI가 하는 일은 진료가 아니라 그 심사다."}]},{"heading_ko":"읽을거리: Klomp 대담","heading_en":"What I'm Reading","skip":null,"summary":"앞에서 길게 인용한 CMS 대담을 통째로 추천하는 대목이다. 전임 Medicare 디렉터가 현직 디렉터를 인터뷰하는 구성이며, Advance Notice 외에 약값 정책 같은 다른 주제도 다룬다.","insight":null,"signal":null,"author":[{"claim":"Advance Notice 외에 MFN에 대한 접근을 비롯해 유용한 다른 주제도 여럿 다루므로 들어볼 만하다.","evidence":"근거를 대지 않았다."}],"experts":[],"cases":[{"name":"Paragon Health Institute 대담","what":"CMS의 전임 Medicare 디렉터 Demetrios Kouzoukas와 현직 디렉터 Chris Klomp가 나눈 온라인 대담이다.","scale":"","note":"이 회차 앞부분의 인용은 모두 여기에서 나왔다.","sells_to":"none"}],"notes":[]},{"heading_ko":"읽을거리: 수급 자격 심사 산업","heading_en":"What I'm Reading","skip":null,"summary":"저소득층 공보험에 근로 요건이 붙으면서, 그 자격을 확인해 주는 일이 큰 사업이 되었다는 심층 기사를 추천한다. 신용정보 회사와 회계법인이 그 일을 맡고 있다.","insight":null,"signal":null,"author":[{"claim":"Equifax와 Deloitte가 Medicaid 근로 요건을 관리하며 일궈 낸 거대한 사업에 대한 좋은 심층 분석이다.","evidence":"근거를 대지 않았다."}],"experts":[{"who":"Luke Farrell","role":"이 글을 쓴 필자이며 뉴스레터 필자와는 다른 사람이다","claim":"저소득층 공보험의 수급 자격을 가려내는 일이 하나의 산업 복합체가 되었다.","evidence":"근거를 대지 않았다. 뉴스레터는 글의 내용을 옮기지 않았다."}],"cases":[{"name":"Equifax, Deloitte","what":"Medicaid 근로 요건 관리를 맡아 큰 사업을 만들었다.","scale":"","note":"돈을 내는 쪽은 주 정부다.","sells_to":"other"}],"notes":[{"term":"Medicaid 근로 요건","ko":"일을 해야 저소득층 공보험을 준다는 조건","plain":"저소득층 공보험을 받으려면 일정 시간 이상 일하거나 구직 활동을 했다는 것을 증명하게 하는 제도다. 증명을 매달 받아 확인해야 하므로 행정 업무가 폭증하고, 주 정부는 그 확인 작업을 민간 회사에 맡긴다. 그 결과 자격을 가려내는 일 자체가 돈이 되는 시장이 되었고, 서류를 못 내서 자격을 잃는 사람도 함께 생긴다."}]},{"heading_ko":"읽을거리: GLP-1과 유통","heading_en":"What I'm Reading","skip":null,"summary":"GLP-1이 헬스케어의 유통 방식을 새로운 시대로 밀어 넣고 있다는 글을 추천한다. 필자는 앞에서 말한 현금 지불·상용 시장 혁신 이야기와 이어서 읽으라고 권한다.","insight":null,"signal":"필자는 이 글을 앞의 이중 의료 체계 논의와 묶어 소개한다. 즉 소비자가 보험과 병원을 거치지 않고 약을 직접 사는 경로가 커지고 있고, 그것이 GLP-1을 계기로 자리를 잡고 있다는 방향이다. 다만 그 규모를 보여 주는 수치는 이 회차 안에 없으므로 방향만 받아 두면 된다.","author":[{"claim":"GLP-1이 헬스케어 유통의 새로운 시대를 열고 있다는 좋은 생각거리다.","evidence":"근거를 대지 않았다."}],"experts":[{"who":"Sophia Ye, Sachin Maini","role":"이 글을 쓴 필자들이며 뉴스레터 필자와는 다른 사람이다","claim":"GLP-1이 헬스케어 유통을 무너뜨렸다.","evidence":"근거를 대지 않았다. 뉴스레터는 글의 내용을 옮기지 않았다."}],"cases":[],"notes":[]},{"heading_ko":"읽을거리: AI와 저소득층 진료","heading_en":"What I'm Reading","skip":null,"summary":"AI가 1차 진료에 들어오면서 저소득층 환자만 의사 대신 기계를 만나게 될 위험을 다룬 오피니언을 소개한다. 뉴스레터 필자는 이 주장에 반대편에 선 사람도 함께 소개하며, 앞으로 이런 논쟁이 계속될 것으로 본다.","insight":null,"signal":null,"author":[{"claim":"AI가 필연적으로 더 큰 역할을 하게 되면서 앞으로 몇 년간 이런 논쟁을 아주 많이 하게 될 것이다.","evidence":"근거를 대지 않았다."}],"experts":[{"who":"Leah Goodridge, Oni Blackstock","role":"이 오피니언을 쓴 저자들이며 AI 확대에 비판적인 쪽이다","claim":"AI가 저소득층 환자의 진료에서 의사를 밀어내게 두어서는 안 되며, 그렇게 되면 계층 격차가 커진다.","evidence":"근거를 대지 않았다. 뉴스레터는 글의 내용을 옮기지 않았다."},{"who":"Andy Slavitt","role":"헬스케어에 투자하는 Town Hall Ventures 소속이며 AI 확대에서 얻을 것이 있는 쪽이다","claim":"위 주장의 반대편에 섰다.","evidence":"근거를 대지 않았다. 뉴스레터는 반대 논거를 옮기지 않았다."}],"cases":[],"notes":[]},{"heading_ko":"HTN Radio 안내","heading_en":"HTN Radio","skip":"promo","summary":"뉴스레터가 자기네 라이브 대담 코너를 소개하는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"HTN Radio: Town Hall Ventures 대담","heading_en":"HTN Radio","skip":"promo","summary":"Town Hall Ventures의 두 사람과 2026년 정책 환경을 이야기한 자사 대담 소개다. 2027 Advance Notice 직후에 녹음했다는 점을 덧붙였다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"HTN Radio: Pair Team 대담","heading_en":"HTN Radio","skip":"promo","summary":"Pair Team과 두 차례 나눈 자사 대담 소개다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]}],"themes":["medicare-advantage","regulation-cms","market-earnings","ma-consolidation","pharma-glp1","consumer-dtc"],"for_later":[]},{"index":"12","date":"2026-02-08","type":"reads","title_en":"Weekly Health Tech Reads 2/8/25","title_ko":"AI 주치의 열풍과 Hims의 49달러 알약","hook":"AI가 주치의를 다시 발명하겠다고 선언한 주에, 같은 약속을 했던 앞 세대는 파산 신청을 했다.","tldr":[{"point":"이 회차의 중심 글은 필자가 AI 프라이머리 케어 모델을 두고 쓴 단상이다. 같은 주에 어전트 케어 체인 Carbon Health가 Chapter 11 파산을 신청했고, AI 프라이머리 케어를 내건 Lotus Health AI는 3,600만 달러를 조달했는데, 필자가 직접 가입해 보니 AI 뒤에 있는 인간 의사들이 정원이 차서 대기자 명단에 올랐다.","note":"미국에서 프라이머리 케어(주치의 진료)는 보험이 정해 둔 관문이라, 이 자리가 막히면 전문의로 가는 길까지 함께 막힌다."},{"point":"필자는 AI로 의사 한 명이 맡는 환자 수를 열 배로 늘리겠다는 모델의 진짜 숙제가 기술이 아니라 조직 설계라고 주장하며, 이미 과로를 이유로 노조를 만들려는 Mass General Brigham의 주치의들이 AI 가상 진료 도입에 더 화가 난 사례를 근거로 든다.","note":"미국 병원은 프라이머리 케어를 그 자체로는 돈이 안 되는 미끼 상품으로 취급해 왔고, 그래서 이 직군이 업계에서 가장 박하게 대우받는다는 것이 필자가 깔고 있는 전제다."},{"point":"Devoted Health가 3억 6,600만 달러를 조달하고 Medicare Advantage 가입자를 466,000명으로 전년 대비 121% 늘렸다고 거의 알리지 않은 채 발표했는데, 정작 Devoted 창업팀에 속한 Venrock은 두 달 전 신규 MA 가입자를 잘못 받으면 큰돈을 잃는다며 Humana의 붕괴를 예측했다.","note":"Medicare Advantage는 정부가 노인 한 명당 정해진 돈을 민간 보험사에 주고 그 사람의 의료비를 통째로 책임지게 하는 방식이라, 새 가입자의 병력을 모르는 첫해에 손실이 몰린다."},{"point":"Hims가 목요일 아침 복합조제 GLP-1 알약을 월 49달러에 내놓아 주가가 9% 뛰고 Eli Lilly와 Novo Nordisk 주가를 끌어내렸지만, FDA와 HHS가 즉각 반응하고 법무부에 조사가 회부되면서 금요일 늦게 제품을 내렸고 주가는 주간 30% 하락으로 끝났다.","note":"복합조제란 약국이 승인된 완제 의약품 대신 성분을 직접 조합해 만드는 것으로, 원래는 개별 환자의 사정에 맞추라고 열어 둔 예외 경로다."},{"point":"정부 프로그램에 의존하는 보험사와 그 밖의 회사가 실적에서 정반대로 갈렸다. Molina는 28%, Centene은 10%, Doximity는 25% 하락했고, 스페셜티 약 유통을 키운 Cigna는 7% 올랐으며 PACE 사업자 Innovage는 50% 급등했다.","note":"Molina는 연초에 조정 주당순이익 25.50달러를 제시했다가 실제로는 11.03달러로 마감했는데, Medicaid 요율을 주 정부가 정하기 때문에 보험사가 값을 스스로 고칠 수 없다는 점이 이 격차의 배경이다."},{"point":"인디애나에서 병원 재정을 두고 상반된 자료가 부딪혔다. Kaufmann Hall은 2025년 마진이 전국 평균을 밑돈다고 발표했지만, 고용주 연합은 2024년 인디애나 병원의 거의 20%가 순이익률 20%를 넘겼고 Fort Wayne의 비영리 정형외과 병원 한 곳은 영업이익률 37%를 냈다는 데이터를 내놓았다.","note":"미국의 비영리 병원은 이익을 주주에게 나눠 주지 않는 대신 세금을 면제받는 것이지, 이익을 적게 내야 한다는 뜻은 아니다."}],"issue_insight":{"verdict":"yes","summary":"서른한 꼭지 가운데 스물 넘는 자리가 보험사 실적, 병원 마진, 청구 업무처럼 소비자가 보지 못하는 돈 이야기다. 소비자가 직접 등장하는 몇 자리를 겹쳐 놓으면 하나의 그림이 나오는데, 미국 소비자는 의사에게 닿지 못한 채 기다리거나 값 때문에 진료를 미루고 있고 그 사이를 메우는 것은 진료가 아니라 기록과 안내라는 것이다.","build":[{"title":"처방 리필 만료일 계산기","detail":"사용자가 약 이름과 처방 시작일, 남은 리필 횟수만 넣으면 약이 떨어지는 날과 예약을 잡아야 하는 날을 역산해 알려 준다. 예약이 1년 넘게 걸리는 지역에서는 이 시점을 놓치는 것이 곧 약이 끊기는 것이므로, 계산과 알림만으로도 값이 생긴다.","section":2},{"title":"폐경기 증상 기록과 되짚어 보기","detail":"안면홍조 횟수, 밤에 깨는 횟수, 기분을 매일 몇 초 만에 남기게 하고 이미 받고 있는 걸음·수면 데이터와 겹쳐 몇 주 단위 변화를 보여 준다. 치료를 권하지 않고 기록과 요약에 머무르면 허가가 필요 없다.","section":19}],"signal":[{"title":"미국 소비자는 주치의를 만나려고 1년 넘게 기다린다","detail":"KFF가 전한 보스턴 사례에서 주치의를 잃은 여성이 진료소 열 곳에 전화했지만 가장 빠른 예약이 1.5~2년 뒤였다. 무료 AI 프라이머리 케어를 내건 Lotus도 인간 의사 정원이 차서 신규 환자를 받지 못했다.","section":2},{"title":"보험을 유지하지 못하는 사람이 몇 달 사이 크게 늘어난다","detail":"Centene은 ACA 거래소 가입자가 12월 500만 명에서 1분기 말 350만 명으로 줄 것으로 본다. 몇 달 만에 150만 명이 보험 없이 자기 돈으로 의료를 사는 쪽으로 옮겨 간다는 뜻이다.","section":5},{"title":"GLP-1에서 소비자를 움직이는 방아쇠는 값이다","detail":"Hims가 월 49달러라는 값을 내걸자 하루 만에 두 제약사 주가가 흔들렸고 규제 당국이 즉각 움직였다. 소비자가 직접 돈을 내는 경로에서 값이 얼마나 강한 신호인지 보여 준다.","section":11},{"title":"폐경기 케어에 주당 25,000명이 찾아온다","detail":"Midi는 주당 25,000명을 진료하고 4,500만 명 이상이 보험을 통해 이용할 수 있다고 밝히며 10억 달러가 넘는 밸류에이션에 1억 달러를 조달했다. 검사 수치가 아니라 본인이 느끼는 증상으로 판단하는 영역에 이만한 수요가 서 있다.","section":19},{"title":"보험이 있어도 값 때문에 진료를 포기한다","detail":"JAMA Network Open 연구는 고액공제 보험 가입이 암 환자의 생존 결과 악화와 상관관계가 있다고 보고하며, 그 통로로 재정 장벽 때문에 필요한 진료를 미루는 행동을 지목한다. 미국 소비자에게 보험 가입 여부와 실제 지출 여력은 다른 문제다.","section":28}]},"sections":[{"heading_ko":"후원: Candor Health","heading_en":"Sponsored by: Candor Health","skip":"sponsor","summary":"프로바이더 데이터를 정리해 주는 Candor Health의 광고 자리다. 고객사 Sana Benefits가 리퍼럴 처리 시간을 절반으로 줄였다는 사례를 싣고 있다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"단상: AI로 주치의를 다시 발명한다는 이야기","heading_en":"MY MUSING: AI and the nuances of reinventing primary care","skip":null,"summary":"미국 헬스케어의 관문인 프라이머리 케어를 새로 만들겠다는 시도가 왜 매번 같은 자리에서 끝나는지 짚는 필자의 단상이다. 같은 주에 앞 세대 주자인 Carbon Health가 파산을 신청했고, 새 세대인 AI 프라이머리 케어 회사들이 큰돈을 받았다. 필자의 결론은 AI 모델의 숙제가 기술이 아니라 이미 지쳐 있는 의사들을 어떻게 설득하느냐는 조직 문제이며, 승자가 나오더라도 비용은 결국 올라간다는 것이다.","insight":"KFF 사례의 여성이 새 의사를 찾아야 했던 이유는 혈압약 처방을 이어 받을 사람이 없어서였다. 미국은 처방전에 남은 리필 횟수와 만료일이 있어 그것이 끝나면 의사를 다시 만나야 하는데, 예약이 1년 넘게 걸리는 지역에서는 이 시점을 놓치는 것이 곧 약이 끊기는 것이다. 사용자가 약 이름과 처방 시작일, 남은 리필 횟수만 넣으면 약이 떨어지는 날과 지금 예약을 잡아야 하는 날을 계산해 알려 주는 기능은 3개월 안에 만들 수 있고 허가도 필요 없다. 같은 화면에 진단과 처방을 하지 않는 질문 창구를 붙이면, 진료를 하지 않기 때문에 Lotus와 달리 대기자 명단이 생기지 않는다.","signal":"미국 소비자는 주치의 한 명을 구하려고 진료소 열 곳에 전화를 걸고 1.5~2년을 기다린다. 무료 프라이머리 케어를 내건 Lotus조차 인간 의사 정원이 차서 신규 환자를 받지 못했고, 필자는 일요일까지 대기자 명단에 남아 있었다. 접근 자체가 팔릴 만한 값을 가진 자리라는 뜻이다.","author":[{"claim":"헬스케어의 관문을 재발명하겠다는 시도는 지금까지 불타 사라지거나 기존 사업자를 돕는 쪽으로 방향을 트는 둘 중 하나로 끝났고, 기존 사업자를 도우려 해도 불타 사라지기는 마찬가지다.","evidence":"Carbon Health가 2021년에 2025년까지 클리닉 1,500곳을 열겠다고 했으나 Chapter 11을 신청했고, 파산 시점 최대 주주 두 곳이 VC 펀드 DCVC(약 13.6%)와 CVS(12%)였으며 CVS가 2023년 1월 1억 달러 시리즈 D를 주도했다는 사실을 든다."},{"claim":"AI 중심 프라이머리 케어 모델이 앞으로 몇 년간 풀어야 할 핵심 문제는 기술이 아니라 조직 설계이며, 의사 한 명의 역량을 열 배로 만들려면 기술보다 신뢰를 먼저 지어야 한다.","evidence":"Mass General Brigham의 주치의들이 근무 조건에 불만을 품고 노조를 추진하는 와중에 K Health와의 AI 가상 진료 파트너십이 이들을 더 화나게 했다는 사례, 그리고 담당 환자 2,000명을 20,000명으로 늘려 주겠다고 말하는 장면을 든다."},{"claim":"2026년 AI 증강 케어 경쟁의 승자는 임상의를 대체하는 것이 아니라 증강한다는, Intuitive Surgical과 매우 비슷한 내러티브를 발전시킬 것이다.","evidence":"Intuitive Surgical이 프로바이더가 더 나은 케어를 제공하고 환자를 더 보게 해 주는 도구로 스스로를 자리매김해 2000년 상장 이후 주가가 약 24,000% 오르고 시가총액 1,800억 달러가 됐다는 점을 든다."},{"claim":"AI 기반 프라이머리 케어의 승자는 접근성과 품질에서 이기고, 그 대가로 기본적으로 비용을 올릴 것이다.","evidence":"접근성·품질·비용 가운데 셋을 동시에 얻을 수 없다는 철의 삼각형 개념을 전제로 삼을 뿐, 비용이 오른다는 예측 자체를 뒷받침하는 수치는 대지 않았다."}],"experts":[{"who":"Andy Slavitt, Toyin Ajayi","role":"전 CMS 대행 수장이자 헬스케어 투자사 공동창업자, 그리고 저소득층 대상 케어 딜리버리 회사를 이끄는 공동창업자. 둘 다 AI를 쓰는 케어 모델에 사업적 이해가 걸려 있다.","claim":"가장 강력한 결과는 임상의를 대체하는 AI가 아니라 AI로 증강된 케어에서 나온다.","evidence":"이 회차에는 문장만 인용돼 있고 근거를 대지 않았다."},{"who":"Mass General Brigham의 프라이머리 케어 의사들","role":"근무 조건에 불만을 품고 노조 결성을 추진 중인 당사자로, AI 도입 예산과 자기 보수가 직접 맞물려 있다.","claim":"스타트업에 돈을 줄 바에는 MGB가 자기네 주치의들에게 보수를 더 주고 사람을 더 뽑을 수도 있다.","evidence":"근거를 대지 않았다."}],"cases":[{"name":"Carbon Health","what":"어전트 케어와 프라이머리 케어 클리닉을 직접 운영하며 환자를 보던 회사로, 이번 주 초 Chapter 11 파산을 신청했다.","scale":"2021년 정점 기업가치 33억 달러, 2023년 1월 시리즈 D 1억 달러 당시 약 13억 달러","note":"파산 시점 최대 주주가 VC 펀드 DCVC(약 13.6%)와 CVS(12%)였다. 파괴자로 출발해 기존 사업자의 자금을 받고도 결국 무너진 경로를 그대로 보여 준다.","sells_to":"mixed"},{"name":"Lotus Health AI","what":"AI를 중심에 둔 프라이머리 케어 프로바이더로, Kleiner Perkins와 CRV에서 3,600만 달러를 조달하며 출범했다. 원문은 지불 주체를 밝히지 않고, 모두에게 무료 접근을 연다는 내러티브만 전한다.","scale":"3,600만 달러","note":"필자가 수요일 밤 가입을 시도했으나 AI 뒤의 인간 주치의들이 정원 초과라 대기자 명단에 올랐고 일요일까지 그대로였다.","sells_to":"mixed"},{"name":"Mass General Brigham","what":"보스턴의 대형 병원 그룹으로, 2025년 초 5년간 4억 달러를 프라이머리 케어 인력에 투자하겠다고 약속하는 한편 K Health와 손잡고 AI 가상 진료를 내놓았다.","scale":"5년간 4억 달러","note":"같은 조직 안에서 인력 투자와 AI 도입이 동시에 진행되는데, 정작 의사들은 AI 도입을 자기 몫을 빼앗는 일로 읽었다.","sells_to":"mixed"},{"name":"KFF가 전한 보스턴 환자 사례","what":"주치의가 세상을 떠나 혈압약 처방을 이어 줄 새 주치의가 필요해진 여성이 진료소 열 곳에 전화를 걸었다.","scale":"가장 빠른 예약이 1.5~2년 뒤","note":"의사가 부족한 지역에서는 약을 계속 받는 일 자체가 접근성 문제가 된다.","sells_to":"none"},{"name":"Intuitive Surgical","what":"수술 로봇 플랫폼을 병원에 파는 회사로, 프로바이더가 더 나은 케어를 하고 환자를 더 보게 해 재무적으로도 나아지게 하는 도구라는 자리를 잡았다.","scale":"2000년 상장 이후 주가 약 24,000% 상승, 현재 가치 1,800억 달러","note":"필자가 AI 회사들이 따라야 할 본보기로 드는 사례다. 대체가 아니라 증강이라는 점이 핵심이다.","sells_to":"provider"}],"notes":[{"term":"primary care / PCP","ko":"프라이머리 케어, 주치의","plain":"감기부터 만성질환 관리, 검진까지 처음 만나는 의사를 가리킨다. 미국은 보험이 이 의사를 관문으로 두어 전문의 진료도 대개 이쪽의 소개를 거쳐야 하므로, 주치의를 구하지 못하면 의료 체계 전체에 들어가지 못한다. 한국은 동네 의원이든 대학병원이든 원하는 곳에 바로 갈 수 있어 이 관문 자체가 없다."},{"term":"iron triangle","ko":"철의 삼각형","plain":"접근성, 품질, 비용 셋 가운데 둘까지만 동시에 얻을 수 있고 나머지 하나는 포기해야 한다는 헬스케어의 오래된 통념이다. 필자는 창업자들이 셋을 다 잡겠다고 말하지만 VC 자금으로 손실을 메우지 못하게 되는 순간 어느 하나를 버리게 된다는 뜻으로 이 말을 반복해 쓴다."},{"term":"panel size","ko":"담당 환자 명부 크기","plain":"의사 한 명이 계속 책임지고 보는 환자 수를 말한다. 미국 주치의는 대개 2,000명 안팎을 맡는데, AI로 이를 20,000명까지 늘리겠다는 것이 이번에 등장한 모델들의 주장이다. 의사 입장에서는 같은 보수로 열 배를 맡으라는 말로 들릴 수 있다는 것이 필자가 짚는 대목이다."},{"term":"Chapter 11","ko":"미국 파산법 11장","plain":"회사 문을 닫고 자산을 파는 청산이 아니라, 법원 보호 아래 빚을 조정하며 사업을 이어 가려는 절차다. 한국의 기업회생절차에 해당한다. 다만 이 절차에 들어가면 기존 주주의 지분은 대개 가치를 잃는다."}]},{"heading_ko":"메디케어 어드밴티지: Devoted Health의 조용한 대형 조달","heading_en":"MEDICARE ADVANTAGE: Devoted Health very quietly announces a very large funding round","skip":null,"summary":"Medicare Advantage 신생 보험사 Devoted Health가 큰 조달과 가입자 급증을 거의 알리지 않고 발표한 일을 다룬다. 필자는 이 조용함 자체를 MA 시장의 불확실성을 보여 주는 신호로 읽는다. 업계 통념상 신규 가입자가 몰리면 손실이 나기 쉬운데, Devoted는 정반대로 가고 있고 Humana도 같은 길을 택했다는 점이 이 꼭지의 쟁점이다.","insight":null,"signal":null,"author":[{"claim":"이 발표가 그렇게 조용히 나간 것은 이상하며, Medicare Advantage 시장의 불확실성을 보여 주는 듯하다.","evidence":"Bill Frist가 월요일 LinkedIn에 가입자 성장을 올리지 않았다면 자신도 이 소식을 알아차리지 못했을 것이라는 점을 든다."},{"claim":"MA 대형 플랜들의 최근 어려움과 v28, 그리고 Devoted가 자체 메디컬 그룹을 짓고 있다는 점을 합치면 재무적 재앙의 레시피처럼 보이는데도 Devoted가 이렇게 빠르게 크는 것은 흥미롭다.","evidence":"지난 몇 년간 대형 MA 플랜들이 겪은 어려움을 가장 최근의 증거로 들고, v28이 플랜과 프로바이더 양쪽에 제기하는 수익성 문제를 근거로 삼는다."}],"experts":[{"who":"Venrock 팀","role":"2017년 Devoted의 시드 라운드를 주도하고 2018년부터 Devoted 창업팀에 속해 온 벤처캐피털로, 경쟁사인 Humana의 실패를 예측하는 쪽에 이해가 걸려 있다.","claim":"Humana는 2026년에 신규 MA 가입자의 무게에 눌려 무너질 것이다. MA 성장의 문제는 조심하지 않으면 신규 가입자에게서 큰돈을 잃을 수 있다는 점이다.","evidence":"12월 예측 글에서 인용된 문장만 실려 있고 근거를 대지 않았다."}],"cases":[{"name":"Devoted Health","what":"노인 대상 Medicare Advantage 플랜을 운영하며 자체 인하우스 메디컬 그룹까지 짓고 있는 신생 보험사로, 신규 지분 투자를 유치하고 가입자 급증을 함께 발표했다.","scale":"3억 6,600만 달러 조달, 2026년 1월 기준 가입자 466,000명 이상, 전년 대비 121% 성장","note":"보험료를 내는 쪽이 정부이므로 가입자가 늘어도 첫해에는 손실이 나기 쉬운데, Devoted는 자기 기술 플랫폼으로 이를 감당할 수 있다고 보는 듯하다는 것이 필자의 추정이다.","sells_to":"other"}],"notes":[{"term":"Medicare Advantage (MA)","ko":"메디케어 어드밴티지","plain":"65세 이상을 위한 공적 보험 메디케어를 정부가 직접 운영하는 대신, 민간 보험사가 가입자 한 명당 정해진 월정액을 받고 그 사람의 의료비를 통째로 책임지는 방식이다. 돈은 정부에서 보험사로 흐르고, 가입자는 여러 민간 상품 가운데 하나를 고른다. 남기면 보험사 이익이 되므로 건강한 사람을 모으고 의료 이용을 줄이려는 힘이 항상 작동한다. 한국의 건강보험공단이 하는 일을 민간 회사가 지역별로 나눠 맡는 셈이다."},{"term":"v28","ko":"위험 조정 모델 개정판","plain":"정부가 보험사에 얼마를 줄지 정할 때 쓰는 계산식이다. 가입자가 아플수록 더 많은 돈을 주는데, 그동안 보험사들이 병명을 최대한 많이 붙여 받는 돈을 부풀린다는 지적이 이어졌다. v28은 그 계산식을 조여 돈이 덜 나가게 바꾼 판이라, 플랜과 프로바이더 양쪽의 수익성을 동시에 깎는다."},{"term":"in-house medical group","ko":"보험사가 직접 소유한 의원 조직","plain":"보험사가 의사와 의원을 직접 고용해 자기 가입자를 보게 하는 구조다. 진료를 통제해 비용을 줄일 수 있지만, 사람을 뽑고 건물을 세우는 고정비가 먼저 나가기 때문에 규모가 차기 전까지는 손실이 커진다. 필자가 이 대목을 재무적 위험으로 꼽는 이유가 여기에 있다."}]},{"heading_ko":"실적: Molina, 가이던스의 절반에도 못 미치다","heading_en":"Public Markets Earnings Updates","skip":null,"summary":"Medicaid를 주력으로 하는 보험사 Molina의 실적 발표다. 연초에 제시한 이익 전망의 절반에도 못 미치는 숫자로 한 해를 끝냈고 주가는 28% 빠졌다. 회사는 2026년이 바닥이며 주 정부가 요율을 올리면 나아진다고 보지만, 애널리스트들은 그 시점을 그만큼 믿지 않는다는 것이 이 꼭지의 대립이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Molina Healthcare","what":"저소득층 공적 보험 Medicaid를 주 정부에서 위탁받아 운영하는 보험사로, 4분기 실적이 다시 기대에 못 미쳤다.","scale":"주가 28% 하락, 연간 조정 EPS 가이던스 25.50달러 대비 실제 11.03달러, 플로리다 RFP 수주로 연 60억 달러 보험료 예상","note":"4분기 미스는 캘리포니아의 소급 조정과 계속되는 의료비 압박에서 비롯됐다. 회사는 지금 시장이 3~4% 과소 재정 지원 상태라고 본다.","sells_to":"other"}],"notes":[{"term":"Medicaid","ko":"메디케이드","plain":"저소득층을 위한 공적 보험으로, 연방과 주 정부가 함께 돈을 대고 주 정부가 운영한다. 대부분의 주는 이를 민간 보험사에 위탁하고 가입자 한 명당 월정액을 지급한다. 한국의 의료급여에 해당하지만 규모가 훨씬 크고, 값을 정하는 주체가 주 정부라 보험사가 스스로 값을 올릴 수 없다."},{"term":"RFP","ko":"주 정부 사업자 선정 입찰","plain":"주 정부가 자기 주의 Medicaid를 맡길 보험사를 공모로 뽑는 절차다. 한 번 따면 몇 년치 매출이 통째로 붙기 때문에 이 업계의 성장은 대부분 입찰 결과로 결정된다. Molina가 플로리다에서 아동 대상 프로그램의 단독 파트너가 된 것이 그 예다."}]},{"heading_ko":"실적: Centene, ACA 가입자가 몇 달 만에 줄어든다","heading_en":"Public Markets Earnings Updates","skip":null,"summary":"ACA 거래소, Medicare Advantage, Medicaid를 함께 하는 보험사 Centene의 실적이다. 마진 회복을 밀고 있지만 주가는 10% 빠졌다. 이 꼭지에서 가장 눈여겨볼 숫자는 ACA 가입자가 12월 500만 명에서 1분기 말 350만 명으로 줄어든다는 전망이다.","insight":null,"signal":"Centene은 자사 ACA 가입자가 몇 달 사이 500만 명에서 350만 명으로 줄어들 것으로 본다. 보험료 부담으로 가입을 유지하지 못하는 사람들이 그만큼 늘어난다는 뜻이며, 이들은 보험 없이 자기 돈으로 의료를 사는 쪽으로 옮겨 간다. 미국 소비자의 지출 구조가 몇 달 단위로 바뀌고 있다는 신호다.","author":[],"experts":[],"cases":[{"name":"Centene","what":"ACA 거래소, Medicare Advantage, Medicaid 세 정부 프로그램 보험을 운영하는 회사로, 4분기 실적 발표 후 주가가 빠졌다.","scale":"주가 10% 하락, ACA 가입자 12월 500만 명에서 1분기 말 350만 명 예상, NSA 충당금으로 연간 의료비 1% 상승, Duals가 MA 사업의 약 40%","note":"행동건강 비용을 핵심 비용 동인으로 다시 지목했고, 여러 주에서 자폐 아동 대상 ABA 치료 비용을 잡는 조치를 취해 왔다고 밝혔다.","sells_to":"other"},{"name":"Centene의 뉴욕 프로바이더 상대 소송","what":"프로바이더들이 No Surprises Act의 독립 분쟁 해결 절차를 통해 이익을 뽑아내고 있다며 이번 주 뉴욕의 한 프로바이더를 상대로 소송을 제기했다.","scale":"","note":"환자를 보호하려고 만든 절차가 보험사와 프로바이더 사이의 새로운 돈싸움 통로가 됐다는 사례다.","sells_to":"none"}],"notes":[{"term":"ACA exchange","ko":"ACA 거래소","plain":"직장 보험도 공적 보험도 없는 사람이 개인 자격으로 민간 보험을 사는 정부 운영 장터다. 소득에 따라 보조금이 붙고, 보조금이 줄면 보험료 부담이 커져 가입자가 빠져나간다. 한국에는 대응하는 제도가 없는데, 한국은 직장이 없어도 지역가입자로 건강보험에 자동으로 남기 때문이다."},{"term":"No Surprises Act (NSA)와 독립 분쟁 해결(IDR)","ko":"예상치 못한 청구서 금지법과 그 중재 절차","plain":"보험 네트워크에 속하지 않은 의사에게 진료를 받아 환자가 갑자기 큰 청구서를 받는 일을 막으려고 만든 법이다. 이제 환자에게 청구할 수 없게 된 대신, 보험사와 의사가 얼마를 주고받을지는 제3자 중재에 넘긴다. 문제는 중재에서 의사 쪽이 이기는 비율이 높아 결국 보험사 비용이 올라가고, 그 비용이 다음 해 보험료에 얹힌다는 것이다."},{"term":"ABA therapy","ko":"응용행동분석 치료","plain":"주로 자폐 아동에게 하는 행동 치료로, 한 아이에게 주당 수십 시간이 들어가는 경우가 있어 보험사 입장에서는 비용이 빠르게 불어나는 항목이다. 여러 주가 보험 적용을 의무화하면서 지출이 급증했고, 그래서 보험사가 이용 한도를 조이려 하는 대표적 영역이 됐다."},{"term":"Duals","ko":"메디케어와 메디케이드를 동시에 받는 사람","plain":"나이가 많으면서 소득도 낮아 두 공적 보험에 함께 해당하는 사람들이다. 만성질환을 여럿 가진 경우가 많아 의료비가 가장 많이 드는 집단이고, 그래서 보험사들이 별도의 운영 모델을 따로 만든다. Centene은 이 집단이 자사 MA 사업의 약 40%를 차지한다고 밝혔다."}]},{"heading_ko":"실적: Cigna, 보험에서 약 유통 쪽으로 무게를 옮기다","heading_en":"Public Markets Earnings Updates","skip":null,"summary":"이번 주 실적 발표에서 유일하게 오른 대형 보험사 Cigna의 이야기다. 어려운 보험 사업에서 발을 빼고 스페셜티 약 유통 쪽으로 무게 중심을 옮기고 있다. PBM 규제와 FTC 합의라는 악재가 정작 주가에는 영향을 주지 않았다는 점이 이 꼭지의 요지다.","insight":null,"signal":null,"author":[{"claim":"FTC 합의와 PBM 입법 소식은 다소 뉴스가 아닌 것처럼 보였다.","evidence":"Cigna가 사업의 마진 구조가 달라질 것으로 예상하지 않는다는 점을 근거로 든다."}],"experts":[],"cases":[{"name":"Cigna","what":"건강보험과 함께 PBM 자회사 Express Scripts로 약값 유통을 하는 회사로, 4분기 실적 발표 후 주간 상승으로 마감했다.","scale":"주가 7% 상승, 스페셜티 케어가 사업의 35%로 3년 전 25%에서 상승, 코페이 전용 상품 Clarity가 고객사에 최대 10% 절감","note":"TrumpRx 협업, Shields 투자, Cigna Healthcare 안에서 Progyny·Carrot·Headspace와의 협력까지 파트너십을 여럿 강조했다. 보험보다 약 유통에서 돈을 벌겠다는 방향이 분명하다.","sells_to":"employer"}],"notes":[{"term":"PBM","ko":"약제비 관리 회사","plain":"보험사와 제약사 사이에서 어떤 약을 보험이 대 줄지 목록을 정하고 제약사에서 리베이트를 받아 오는 중간 사업자다. 미국에는 전국 단일 약가가 없어
