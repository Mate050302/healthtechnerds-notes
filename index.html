lth Tech Reads 8/2/26","subtitle":"2분기 실적 시사점(TDOC, HUM, CNC, ALHC, WAY, CI), 프로바이더와 AI의 미래에 관한 단상, 그리고 그 밖의 소식","sections":[{"heading_en":"Today's newsletter is brought to you by: Elation","body":"임상의의 52%가 거의 매일 진료 시간이 끝난 뒤에 차트를 마무리하고 있습니다. 이것은 문서화 문제가 아닙니다. 사람들이 그만두는 이유입니다. Elation의 AI 네이티브 운영 체제가 문서화, 코딩, 클레임 스크러빙을 대신 처리합니다. 그 일은 더 이상 퇴근 후까지 기다리지 않습니다.\n\n실제 작동 모습 보기\n\n뉴스레터 스폰서십에 관심이 있으시면 알려 주세요!"},{"heading_en":"Q2 Earnings Takeaways: A number of earnings calls continue to highlight a favorable payer market; concerns over cash pay","body":"실적 발표가 몰렸던 한 주에서 제 눈길을 끈 콜과 핵심 전략적 시사점을 정리했습니다. 이번 분기의 특이한 테마는 “비트 앤 드롭(beat-and-drop)” 역학이었습니다. 기업들이 일관되게 기대치를 웃도는 실적을 내놓고도 주가는 의미 있게 떨어지는 모습이었습니다."},{"heading_en":"Q2 Earnings Takeaways: A number of earnings calls continue to highlight a favorable payer market; concerns over cash pay","body":"Teladoc: 5월 중순 BetterHelp의 캐시페이 사업에 무슨 일이 있었나\n\nTeladoc 주가는 BetterHelp 전망을 하향 조정한 뒤 25% 하락했습니다. 4월까지는 궤도에 올라 있었는데 5월 중순에 BetterHelp의 캐시페이 수요가 절벽처럼 꺾였다고 밝혔습니다. Teladoc은 이제 사용자의 70~80%가 자사 보험 상품을 선호한다고 언급했지만, 보험 상품을 찾는 캐시페이 사용자들의 수요를 맞출 만큼 빠르게 치료사를 늘리지 못했습니다. 여러 애널리스트의 질문이 이 공급/수요 불일치의 원인을 파악하려 했습니다. 그중 한 질문이 핵심 문제를 짚은 것으로 보이는데, 치료사 입장에서 경제성이 보험보다 캐시페이 쪽이 의미 있게 더 나은지를 물은 것이었습니다. Teladoc은 그에 대해서도, 더 일반적으로 왜 수요를 맞출 만큼 빠르게 치료사를 확충하지 못했는지에 대해서도 명확한 답을 주지 않았지만, 앞으로 이 문제를 푸는 데 집중하겠다고 밝혔습니다. 그 정도가 단기적으로 OUS 성장을 후순위로 미룰 만큼이었습니다. 최근 OUS가 Teladoc 내러티브에서 더 강한 축으로 느껴졌던 만큼 이는 눈에 띄는 대목입니다. 긍정적으로 보자면 BetterHelp 보험 사업은 여전히 궤도에 있고, 지금 공급 측 문제를 해결할 수 있다면 수요는 존재하는 것으로 보입니다."},{"heading_en":"Q2 Earnings Takeaways: A number of earnings calls continue to highlight a favorable payer market; concerns over cash pay","body":"Humana: 2026년의 큰 시험은 통과했지만, 2027년의 후퇴가 불안을 낳다\n\nHumana의 실적은 애널리스트 기대치를 웃돌았고, 2026년 신규 가입자 유입과 관련된 실존적 수익성 문제는 넘어선 것으로 보입니다. 다만 2028년까지 3% 이상 마진으로 돌아가는 여정은 아직 초기 단계인데, 2027년에 약 60만 명 규모의 저마진 플랜에서 철수할 계획이라고 밝힌 데서도 이 점이 드러납니다. Humana는 그 가입자의 약 40%를 다른 플랜으로 옮길 것으로 예상하는데, 특히 플랜 철수의 대다수가 3.5 Star 플랜에서 이뤄질 것이라고 언급한 만큼 잔류 가입자의 수익성 개선에 도움이 될 것입니다. Humana는 또한 자사 VBC 플랜이 non-VBC 플랜보다 나은 성과를 내고 있다고 했지만 구체적인 내용은 거의 밝히지 않았습니다. 그것이 업계가 수년째 씨름해 온 HMO 대 PPO 역학과 같은 것을 보여주는 신호인지 지켜볼 만합니다. Humana의 2027년 전환은 아래에서 Alignment가 짚은, 2~3개 플랜이 2027년에 점유율을 노릴 수 있다는 역학과 함께 생각해 볼 만합니다. 지금까지의 2026년 성과가 실력보다는 운이었다고 보는 회의론자들에게, 2027년은 가입자를 붙잡는 베네핏을 설계하면서 동시에 수익성으로의 전환을 우선하려는 시도를 다시 시험대에 올릴 것으로 보입니다."},{"heading_en":"Q2 Earnings Takeaways: A number of earnings calls continue to highlight a favorable payer market; concerns over cash pay","body":"Centene: ACA 마진 회복에서 기대 이상, 주가는 잠시 10% 하락\n\nMolina가 Silver 메탈 레벨 역학 때문에 자사 ACA 북에서 데스 스파이럴 비슷한 기류가 느껴진다고 밝힌 지 일주일 만에, Centene은 ACA 마진 목표를 기존 3%에서 4.5~5%로 높였습니다. 이는 ACA 시장 전반의 성과를 더 잘 보여주는 것으로 보입니다. 전반적으로 Centene은 전 영역에서 긍정적인 HBR을 보고 있으며, 5%의 메디케이드 요율 인상과 4%대의 트렌드가 시장이 바닥을 쳤다는 낙관을 준다고 언급했습니다. Centene 주가는 실적 발표 후 잠시 10% 떨어졌다가 반등했습니다. AI를 위한 데이터 인프라 투자에 대한 Centene의 초점과 관련해 애널리스트 Q&A에서 나온 흥미로운 코멘트는 아래에서 더 다루겠습니다. Centene의 ICHRA 사업은 5만 명 가입자로 2.5배 성장했고, 이제 Centene 임직원 일부에게도 ICHRA를 제공하고 있습니다."},{"heading_en":"Q2 Earnings Takeaways: A number of earnings calls continue to highlight a favorable payer market; concerns over cash pay","body":"Alignment: 2분기 기대 상회, 가이던스 상향, 주가는 하락\n\nAlignment는 사업에서 계속 강한 성과를 보여주며 기대치를 웃돌고 모든 지표의 가이던스를 상향했습니다. 주가는 실적 발표에 17% 넘게 밀렸는데, Alignment가 3분기에 사업에 더 많은 돈을 투자하기로 한 것이 원인으로 보입니다. 2027년 이후의 신규 시장 성장을 준비하기 위해 임상 운영과 신규 시장 브랜딩에 투자하면서 MBR과 SG&A 비율 모두에 완만한 부정적 영향이 있을 것입니다. 흥미롭게도 Alignment는 2~3개 보험사가 “숨어 있다가 튀어나와” 2027년 가입자 확보 경쟁을 공격적으로 벌일 것으로 예상한다고 언급했습니다. 지켜볼 만한 흥미로운 역학입니다. 어떤 의미에서는 Humana가 2026년 신규 가입자를 관리해 낸 성공을 보고 다른 보험사들이 “우리라고 못 할 게 뭔가?”라고 생각하는 시나리오를 상상해 볼 수 있습니다."},{"heading_en":"Q2 Earnings Takeaways: A number of earnings calls continue to highlight a favorable payer market; concerns over cash pay","body":"Cigna: 스페셜티 약국이 계속 성장을 견인하며 실적 전망 상향, GLP-1은 감속\n\nCigna는 Accredo와 병원·헬스 시스템을 지원하는 상품을 포함한 스페셜티 약국 사업이 Specialty and Care Services 부문에서 22%의 이익 성장을 견인하고 있다고 밝히며, 스페셜티 의약품을 복용하는 환자가 빠르게 늘고 있는 시장에서 330종 이상의 유통 제한 의약품에 대한 접근권이 갖는 전략적 가치를 강조했습니다. Cigna는 2분기에 GLP-1 처방의 감속을 보고했는데, 이는 약제 급여 부문 실적에 완만한 부정적 영향을 미쳤고 이 부문은 스페셜티 제네릭 도입에도 불구하고 현재 기대치를 밑돌고 있습니다. Cigna는 이 변화가 자사 기업 보험 북에는 거의 영향을 주지 않았다고 언급했는데, 소규모 그룹 고용주 중 15~20%만이 체중 관리 목적의 GLP-1을 커버하기 때문입니다. Q&A에서는 Cigna 자신도 비용 문제로 임직원 대상 체중 감량용 GLP-1을 중단했다는 흥미로운 논의가 있었는데, 이는 자사 고객사들이 내리고 있는 결정과 비슷합니다."},{"heading_en":"Q2 Earnings Takeaways: A number of earnings calls continue to highlight a favorable payer market; concerns over cash pay","body":"Waystar, 강한 고객 모멘텀을 강조, 주가는 하락\n\nWaystar는 2분기 추정치를 상회하고 연간 가이던스를 상향했으며, 그러자 당연하다는 듯 실적 발표에 주가가 약 15% 떨어졌습니다. 그 점에 제가 얼마나 어리둥절한지는 접어두더라도, 실적 콜은 상당히 강한 모멘텀을 보여줬습니다. 플랫폼 RCM 상품이 호응을 얻으면서 100만 달러 이상 ACV의 신규 수주를 따내는 동시에 기존 고객 내에서도 확대되고 있다는 것입니다. Iodine 인수는 성과를 내고 있는 것으로 보이는데, Waystar 고객이 Iodine 기능을 구매하면서 600만 달러의 수주가 나왔다고 강조했습니다. Waystar는 또한 헬스 시스템의 페이어 믹스 변화를 짚으며 셀프페이 인구가 늘고 있고 헬스 시스템은 상환을 지키기 위한 역량에 투자해야 한다고 했고, 셀프페이로 접수된 환자에 대해 1,000만 달러의 청구 가능 기회를 찾아낸 Promedica 사례를 소개했습니다.\n\n소셜 미디어에서 캐시페이 모델이 보험 급여보다 얼마나 좋은지 이야기하는 모든 분들에게, 저는 이것을 캐시페이가 보험보다 싸다는 일반적 정서가 완전한 신기루라고 보는 이유의 증거 1A로 제시합니다. 그 캐시페이 가격은 헬스 시스템이 캐시페이 = 지불 능력 없음이라고 여기던 환경의 유물이고, 매출에서 아주 작은 비중이니 그렇게 가격을 매긴 것입니다. 상업 시장이 언젠가 의미 있게 캐시페이로 옮겨간다면 그 캐시 가격에 무슨 일이 일어날지 저는 강한 직감이 있습니다. 헬스 시스템은 상업 요율을 요구할 것이고, X 사용자 상당수는 크게 실망할 것입니다."},{"heading_en":"Company Spotlight: Ilant Health Overview","body":"Ilant Health의 CEO Elina Onishantsky가 화요일에 저와 함께 Ilant의 가치 기반 비만 케어 모델 구축 접근법에 대해 이야기를 나눴습니다. 6월에 발표된 1,500만 달러 시리즈 A 펀딩에 뒤이은 자리였습니다. Ilant는 현재 주로 고용주와 일하고 있으며, 비만 케어의 센터 오브 엑설런스에 가까운 모델입니다. 위의 Cigna 2분기 실적 논의에서 보듯 고용주들이 비용 우려로 GLP-1 커버리지에서 멀어지기 시작하는 증거가 나오는 지금, 시의적절한 대화로 보입니다.\n\n위 슬라이드가 특히 흥미로웠는데, 서로 다른 인구 집단에는 맞춤형 상품이 필요하다는 Elina의 지적을 잘 보여줍니다. 이 시장이 비만 치료에서 더 정교해지면서 자연스러운 진화로 보입니다. 시장이 어떻게 전개되는지 Ilant와 다른 플레이어들을 계속 지켜보겠습니다."},{"heading_en":"Chart of the Week: UHG data highlights commercial cost drivers","body":"UHG가 2024년과 2025년 UHC 완전보험 상업 클레임 데이터를 공개하며, 2025년 상업 시장의 9% 비용 증가를 이끈 주요 동인들을 분해했습니다. 처방약 비용이 가장 큰 동인으로 전년 대비 14% 증가했는데, 스페셜티 브랜드 의약품(이용량 +13%)과 HOPD에서 투여되는 약물, 즉 주입 치료(이용량 +21%)가 이끌었습니다. 흥미롭게도 인기 있는 GLP-1을 포함하는 브랜드 비스페셜티 의약품은 이 기간 이용량 관점에서 6% 증가에 그쳤습니다.\n\n이 차트를 2분기 실적 시즌에서 들려오는 이야기와 비교해 보는 것도 흥미롭습니다. 특히 UHC는 2026년에 11% 이상의 트렌드를 보고하는 반면, 병원들은 입원 수술 물량이 부진하다고 보고하고 있습니다. 그 두 숫자를 넣고 나머지를 풀어 보면, 전체 약 1,000달러의 증가를 감안할 때 제약/외래 쪽에서 상당히 큰 증가가 있었음을 시사합니다."},{"heading_en":"Quote of the Week: Centene's take on AI infrastructure","body":"저희는 시장의 AI 분위기를 전반적으로 점검하려고 2분기 실적 시즌 콜에서 AI 관련 업데이트를 열심히 들어왔습니다. 위에서 Waystar가 RCM 시장에서 어떻게 이기고 있는지에 대한 흥미로운 업데이트를 공유했다고 이야기했지만, 저는 Centene의 CEO Sarah London이 실적 콜에서 한 이 발언이 시장에서 가장 흥미로운 업데이트라고 생각했습니다.\n\nLondon은 기업 리더들 사이에서 커지고 있는 것으로 보이는 AI 도입에 대한 정서를 표현하는데, 거슬러 올라가면 6월 Alex Karp의 화제가 된 CNBC 인터뷰에서 AI 랩들이 길을 잃고 경영진의 신뢰를 잃었다고 논한 대목과 닿아 있습니다. 며칠 전 WSJ 기사도 이 테마를 다루며 기업들이 “토크노미컬(tokenomical)”해지는 것을 우선하고 있다고 짚었는데, 이 표현은 타이핑하면서 스스로를 판단하게 되는 말입니다.\n\n토크노믹스에 관한 촌스러운 표현은 제쳐두고, London의 진단은 AI가 조직 변화를 실제로 어떻게 이끌고 있는지는 설명하지 않은 채 여전히 대체로 AI의 개념적 이점만 홍보하는 더 넓은 헬스케어 시장 내러티브에 대한, 신선하게 솔직하고 흥미로운 반론으로 느껴집니다. 인프라를 제대로 갖추는 것이 여기서 장기적 성공의 필요조건으로 보이고, 그렇게 하면 애플리케이션 레이어 전반에서 다양한 이니셔티브를, 그 애플리케이션이 내부에서 개발됐든 외부에서 개발됐든, 빠르게 플러그 앤 플레이할 수 있는 유연성이 생긴다는 London의 말에 저도 동의합니다. 다만 주 정부들이 관리의료보다 FFS가 더 나은 길인지 점점 더 의문을 제기하는 듯한 단기적 환경에서 이런 장기 유스케이스를 우선하는 것이 옳은 선택인지에 대해서는 흥미로운 논쟁의 여지가 있습니다. 이 발언은 성공에 대해 깊이 고민하는 장기 지향적 파트너를 보여주는 걸까요? 아니면 레거시 플랫폼과 기술 부채에 발목 잡힌 오늘날 MCO의 비효율을 드러내는 걸까요? 저는 양쪽 모두 일리가 있다고 봅니다.\n\n저희는 이번 주 Health Enterprise Partners의 Ezra Mehlman이 인프라 레이어야말로 헬스케어 투자자에게 지속 가능한 수익이 있는 곳이라고 주장하는 게스트 포스트를 쓴 뒤, 그와 함께 이 테마를 다뤘습니다. 대기업들의 이니셔티브가 수년간 사일로로 인수해 온 레거시 시스템에 가로막히면서, 앞으로 몇 달간 시장에서 점점 더 흔한 대화가 될 것 같습니다.\n\n반대로, 데이터 인프라가 훨씬 깨끗할 것으로 추정되는 Oscar나 Devoted 같은 신생 업체들을 지켜보기에도 흥미로운 시점입니다. 이론적으로는 이들이 시장의 나머지보다 여기서 더 빠르게 움직일 수 있어야 합니다. 바로 지금이 이 모델들이 진짜로 빛나야 할 순간 아닐까요?"},{"heading_en":"Other Top Headlines","body":"임상 AI 스타트업 Doctronic이 버추얼 소아과 모델 Summer Health를 인수했습니다. 유타에서의 AI 처방 갱신 파일럿으로 최근 뉴스에 오르내린 Doctronic은 이것이 앞으로 1~2년간 발표될 여러 신규 제품 확장, 즉 유기적 확장과 비유기적 확장 모두의 첫 번째라고 밝혔습니다. 다음 분기에는 행동 건강 프로그램을 출시할 계획입니다."},{"heading_en":"Other Top Headlines","body":"Akido가 자사 AI 플랫폼에 대한 업데이트를 공유하며, 캘리포니아, 뉴욕시, 로드아일랜드의 100개 클리닉과 100만 명의 환자에게 사용되고 있다고 밝혔습니다. Akido는 지난 몇 년간 인기를 얻은 전략에 일찍 발을 들여, 자사 AI 플랫폼을 진료 현장 안에 배치하기 위해 몇몇 프로바이더 그룹(캘리포니아의 Chapparal Medical Group, 로드아일랜드의 Rhode Island Primary Care Physicians Corp)의 지분을 인수했습니다. 최근의 Thrive Holdings Long Humans 논지가 떠오르는데, Akido는 이미 2022년에 이 길을 걷기 시작했습니다. Akido는 또한 캘리포니아의 스트리트 메디신 모델, 뉴욕시의 Uber / Lyft 기사 의료 수요 등 다양한 다른 임상 유스케이스에 소프트웨어를 배치하고 있습니다. Akido가 더 많은 진료소를 인수하는지, 그렇지 않다면 플랫폼을 어떻게 계속 확장하는지 지켜보고 싶습니다."},{"heading_en":"Other Top Headlines","body":"Included Health가 Firefly Health를 인수했는데, 고용주 대상 대안적 플랜 디자인 시장의 모멘텀을 보여주는 가장 최근 신호입니다. 버추얼 1차 진료 모델로 시작해 대안적 플랜 디자인 래퍼를 더한 Firefly는 Included의 임상 역량을 강화할 것입니다. 고용주의 관심이 커지는 상황에서 두 회사에 논리적인 결합으로 보입니다. 고용주에게 총 케어 비용 관리를 제안하고 있다면, 내비게이션 상품의 프론트 도어로서 강한 임상 요소를 갖추는 것은 요즘 필요한 기능으로 보입니다. 늘 그렇듯 고용주에게 핵심 질문은 제공하는 여러 복리후생을 직원들이 실제로 쓰게 만드는 방법일 것입니다."},{"heading_en":"Other Top Headlines","body":"Dispatch Health는 앞으로 hospital-at-home을 위한 화이트라벨 플랫폼으로서의 성장에만 집중하겠다고 발표하며, 작년에 인수한 Medically Home 사업을 위해 역사적 핵심 모델을 사실상 버리는 것으로 보입니다. Hospital-at-home은 포스트 코로나 시대에 지불 모델의 불확실성 때문에 상당한 모멘텀을 잃은 듯하지만, 복합 질환 환자군에 집중하는 Current Health의 포스트 Best Buy 전략에서 희망의 빛이 조금 보일지도 모릅니다."},{"heading_en":"Other Top Headlines","body":"Hippocratic AI가 WellSpan에서의 배치를 시스템 전체로 확대하며 “일회성 파일럿을 지나 플랫폼 전반 배치로” 넘어가고 있다고 밝혔습니다. 확대된 관계의 일환으로 Hippocratic은 임상, 기술, 배치 인력으로 구성된 팀을 투입해 WellSpan 팀들과 함께 이 새로운 도구들의 도입을 돕게 됩니다. 보도자료를 요약한 앞의 두 문장에서 현재 배치 상태와 두 조직이 보는 기회 양쪽에 대해 꽤 많은 것을 추론할 수 있어 보입니다. 이 시장에서 플랫폼 배치로의 전환이 매우 빠르게 일어나고 있고, 승리하는 모델은 사람의 비중이 클 것으로 보입니다."},{"heading_en":"Other Top Headlines","body":"FTC가 Hims & Hers를 상대로 오도하는 마케팅 관행과 프라이버시 위반을 주장하며 소송을 제기했습니다. Hims는 그 주장이 근거 없다고 시사하며 대응했습니다. D2C 헬스케어 업계 상당수가 Hims를 모범 사례의 원천으로 삼는 것으로 보이는 만큼, 이 소송의 파급 효과를 지켜볼 필요가 있습니다."},{"heading_en":"Upcoming HTN Member Conversations","body":"전문가 인터뷰: The Queen's Health Systems의 CEO Jason Chang과 함께하는 알로하 스테이트의 수직 통합과 가치 기반 케어\n\n8월 4일 화요일 동부 시간 오후 3시"},{"heading_en":"Upcoming HTN Member Conversations","body":"기업 프레젠테이션: Vytalize Health 공동창업자 Faris Ghawi, Amer Alnajar, M.D.와 함께하는 가치 기반 케어의 다음 장\n\n8월 5일 수요일 동부 시간 오후 1시 30분"},{"heading_en":"Funding Announcements","body":"Function Health가 General Catalyst의 Consumer Growth Fund로부터 4억 5,000만 달러의 매출 기반 파이낸싱을 확보했습니다. General Catalyst의 Consumer Growth Fund는 영업 및 마케팅 비용을 조달하는 데 쓰이는 부채 수단으로, 그 대가로 GC는 향후 발생하는 매출의 일부를 가져갑니다. 솔직히 말하면 저는 이 움직임을 전혀 이해하지 못하겠습니다. GC는 이 Consumer Growth Fund 수단이 명확한 CAC:LTV 비율을 갖춘 후기 단계 기업들이 CAC와 관련된 손실로 인한 지분 희석을 피하기 위해 매출 기반 파이낸싱을 쓸 수 있게 하는 것이라고 설명합니다. 좋습니다, 그 부분은 말이 됩니다. 제가 갈피를 잃는 지점은 그것을 Function에 적용하는 것인데, 특히 4억 5,000만 달러의 파이낸싱이 Function의 트레일링 매출의 4.5배라는 점에서 그렇습니다. 그 매출은 2025년 1억 달러로 알려졌습니다. 여기에 Function이 제품 라인업을 채우기 위해 최근 인수에 열을 올려 왔고 그 인수 대상들이 수요 관점에서 뒤처지는 것으로 보인다는 사실을 더해 보십시오. 전신 MRI를 제공하는 시설 네트워크인 Ezra가 발표된 것보다 느리게 성장하고 있으면서도 여전히 원래 약속된 비용의 2배라는 이야기를 저희 슬랙에서 나눴습니다. 여기에 상장 헬스케어 기업들로부터 부담 능력 문제가 들려온다는 점, 그리고 이 시장이 역사적으로 얼리어답터의 모멘텀을 대중 시장의 호응으로 옮기기 어려웠던 시장이라는 점까지 더해 보십시오. 지금 D2C 캐시페이 사업에 대해 어떻게 느끼는지 BetterHelp에게 물어보십시오. 제가 떠올릴 수 있는 가장 그럴듯한 설명은 Function이 이 시점에 하이퍼스케일링 롤러코스터에 올라타 버렸다는 것입니다. 천문학적인 밸류에이션으로 자금을 모으고 기업들을 인수한 뒤, 이제는 그에 뒤이어 빠르게 성장할 수 있음을 보여줘야 하고, 동시에 모델이 무너지지 않도록 CAC:LTV 비율이 유지되기를 바라야 합니다. 이 자본은 스케일링에 도움이 되거나, 그렇지 않다면 어차피 결과는 나쁠 테니, 성장에 더블 다운하지 않을 이유가 뭐냐는 것이겠죠. 앞으로 나올 Function의 광고/마케팅 캠페인을 호기심을 갖고 지켜보겠습니다."},{"heading_en":"Funding Announcements","body":"맞벌이 가정이 배우자 중 한쪽의 고용주를 통해 의료비 지출을 줄이도록 돕는 모델인 Healia Health가 1,400만 달러를 유치했습니다. 흥미로운 모델인데, 고용주와 제휴해 해당 직원이 자기 플랜을 해지하고 다른 고용주에 다니는 배우자의 플랜으로 옮기는 대가로 의료비를 커버하는 HRA를 제공하는 것으로 보입니다. 논리적으로 직원과 Healia와 일하는 고용주 모두 이 이동에서 이득을 본다는 것은 말이 되지만, 이 시나리오에서 배우자의 고용주도 그만큼 반길지는 확신이 덜 듭니다. 어느 쪽이든 지금 고용주들이 의료비 지출 관리에 창의적으로 접근하도록 돕는 개념들에 대한 관심 수준을 보여주는 듯합니다. 그 방법 중 하나는 사람들에게 배우자 플랜으로 옮기라고 돈을 주는 것입니다."},{"heading_en":"What I'm Reading","body":"Primary Ventures 팀이 AI 중심 세계에서 프로바이더의 역할에 대해 사유하며, AI가 PCP 한 명당 패널 규모를 1만 2,000명까지 끌어올릴 수 있다는 점과 그 논의에 내재된 청구, 규제, 책임, 비용의 여러 긴장을 짚었습니다. 여기서 주장하는 미래의 PCP는 수만 명의 환자를 대상으로 인구 건강 관리 역할을 하면서, 일의 대부분을 하는 AI를 감독하는 사람입니다. AI 케어 딜리버리의 셈법이 FFS 헬스 시스템에 강세라고(방문이 더 많아집니다!) 언급한 점이 흥미로운데, 이는 많은 이들이 지금 도달하고 있는 것으로 보이는 답, 즉 AI가 조직이 더 많이 청구하도록 도움으로써 인플레이션 효과를 내고 있다는 답을 시사하는 듯합니다. 흥미롭게도 2만~3만 명 PCP 패널 규모라는 이 아이디어를 이야기하는 또 다른 저명인사인 Vinod Khosla는 리스크를 지는 프로바이더가 AI 상호작용으로 비용을 낮추며 이 전환의 수혜를 가장 잘 볼 위치에 있다고 주장해 왔습니다. 이 역학과, 기존 조직들이 FFS와 VBC 환경에서 이 도구들을 어떻게 도입하는지 지켜볼 만합니다. 납세자의 렌즈로 보자면 저는 분명 후자를 선호합니다."},{"heading_en":"What I'm Reading","body":"뉴욕 매거진인 The Cut이 컨시어지 1차 진료 모델의 부상을 다룬 기사를 실었습니다. DPC 환경에서 일하기를 선호하는 프로바이더들과 그것이 환자에게 야기하는 접근성 문제를, 이론적으로도 실제 사례로도 살펴봅니다. Primary Ventures의 글과 이 글을 나란히 놓고 읽으면서 1차 진료 공급 측의 두 상반된 힘이 어떻게 풀릴지 생각해 보는 것은 흥미롭습니다. 한편으로 기술은 이론상 Primary Ventures가 말하듯 더 큰 패널 규모를 가능하게 해야 합니다. 다른 한편으로 컨시어지 클리닉은 부유한 동네마다 생겨나며 더 작은 패널 규모를 환자와 프로바이더 모두에게 혜택으로 약속하고 있습니다. PCP의 선택지가 점점 AI 항공 관제사로서 2만 명의 환자를 관리하거나, 컨시어지 클리닉에서 200명을 관리하며 아마도 더 많이 버는 쪽, 둘 중 하나가 된다면, 의사들이 컨시어지 쪽을 택하는 것을 탓할 수 없습니다. 동시에 자신들이 청구하는 연 2만 달러 가격에 대해 쑥스러워하는 듯한 컨시어지 조직들을 향한 비판도 눈여겨볼 만합니다."},{"heading_en":"What I'm Reading","body":"Kaiser의 VBC 헬스 시스템 플랫폼 Risant에 지금 뭔가 묘한 일이 벌어지고 있는 듯합니다. 이번 주 창립 CEO Jaewon Ryu가 물러났고, 전국 단위 후임 물색이 진행되는 동안 임시 CEO가 임명됐습니다. 이는 Risant가 VBC에서 어떻게 성공하고 있는지에 대한 기사 두 편을 내보낸 바로 그 주에 일어났습니다. 하나는 Ryu와의 NEJM Catalyst 인터뷰, 다른 하나는 Cone Health CEO와의 Modern Healthcare 인터뷰입니다. Modern Healthcare 인터뷰는 한 대목에서 시사적인데, Cone의 VBC 이니셔티브에 대해 묻자 답이 본질적으로 이랬습니다. 우리가 그저 급성기 진료 시설을 늘리는 데 투자하는 것처럼 보일 수 있지만, 그건 VBC를 확산시킨다는 궁극적 목표를 이루기 위한 것이다. 아 그렇죠, 모든 VBC 플랫폼의 중심에 있는 그 익숙한 “VBC를 위한 트로이 목마로 병원을 짓겠다” 논지 말입니다. Risant가 수년에 걸쳐 5~6개 헬스 시스템을 인수할 계획이었다는 점을 기억하십시오. 2024년 Geisinger와 Cone을 인수한 이후 여전히 두 곳에 머물러 있습니다."},{"heading_en":"What I'm Reading","body":"Redesign Health가 Epic 기반 헬스 시스템의 경영진을 대상으로 한 설문을 공개하며, 이들이 Epic을 헤쳐 나가면서 스타트업과 일하는 것을 어떻게 생각하는지 살펴봤습니다. 헬스 시스템들은 여기서 Epic이 이길 것으로 예상하는 게 분명해 보이는데, 경영진의 80%가 앞으로 Epic이 더 높은 우선순위가 될 것으로 예상했습니다. 앞으로 몇 년간 Epic과 어떻게 잘 지낼지 고민하는 스타트업, 투자자, 경영진이라면 훑어볼 만합니다."},{"heading_en":"What I'm Reading","body":"Morgan Health와 EBRI가 고용주 984곳, 대략 1/3은 직원 100명 이상이고 2/3는 100명 미만인 곳들을 대상으로 ICHRA 시장 현황에 대한 설문을 발표했습니다. ICHRA 도입에 대한 고용주들의 관심 수준이 눈여겨볼 만한데, 가장 큰 요구는 ICHRA 플랜이 베네핏 수준과 커버리지 면에서 오늘날의 고용주 플랜과 더 비슷해 보이는 것이었습니다. ICHRA가 이 시장의 일부 벤처 투자가 기대했을 만큼 빠르게 현실화되지 않고 있을지는 몰라도, 장기적으로 이 시장에 대해 낙관할 이유는 여전히 충분해 보입니다."},{"heading_en":"What I'm Reading","body":"Vizient가 향후 10년의 이용 수요 트렌드를 살펴본 좋은 보고서를 냈습니다. 외래 자산 대비 입원 성장이 둔화되는 점을 짚으며, 외래 물량은 20% 성장하는 반면 입원 퇴원 건수는 7% 성장할 것으로 예상합니다. 특히 암 외래 물량은 20% 성장이 예상되는 반면 입원은 2%입니다."}]},"52":{"index":"52","title_en":"Weekly Health Tech Reads 8/9/26","subtitle":"Hinge의 GI 시장 진출, BofA의 GLP-1 지출, AI 검색 도구에 대한 강한 수요를 확인한 Doximity, HCMC를 둘러싼 싸움, 그 외","sections":[{"heading_en":"Today's newsletter is brought to you by: Champ AI","body":"Champ AI는 API가 닿지 못하는 일을 자동화한다. 멀티모달 워크플로를 직접 찾아내고, 만들고, 처음부터 끝까지 운영한다. 브라우저, 포털, 비정형 문서, 전화 통화에 걸쳐 안정적으로 작동하는 단일 플랫폼으로, 운영팀이 하루 동안 손대는 모든 일을 아우른다.\n\n이들의 맞춤형 접근 방식은 AI 도입을 가로막곤 하는 \"라스트 마일\" 격차를 조직이 메우도록 돕는다. Pair Team, Float Health 같은 헬스케어 기업들이 Champ AI로 운영을 자동화하는 방식을 확인해 보라.\n\n어떻게 작동하는지 보기\n\n뉴스레터 스폰서십에 관심이 있다면 알려 달라!"},{"heading_en":"Q2 Earnings Spotlight","body":"Hinge의 Cylinder 인수가 돋보였던, 2분기 실적으로 분주했던 한 주\n\nHinge의 견조한 실적은 계속됐고, GI 시장에 진입하기 위해 Cylinder Health를 1억 500만 달러에 인수했다\n\nHinge는 이번 주 2분기 실적에서도 상장사로서의 질주를 이어갔다. 작년 IPO 이후 주가가 약 112% 오른 것이 그 증거다. 현재 시가총액은 약 65억 달러로, IPO 밸류에이션을 둘러쌌던 온갖 우려는 이제 백미러 속으로 사라졌다. 고용주 대상 고 투 마켓 방식을 확실히 손에 넣었고, 지금 그 과실을 거두고 있다. 이번 콜의 가장 큰 관심사는 Hinge의 Cylinder 인수였다. Cylinder는 과거 Vivante Health로 알려졌던, GI 케어를 위한 버추얼 랩어라운드 모델이다. Hinge는 Cylinder를 현금 1억 500만 달러에 인수했는데, 올해 예상 매출 2,000만~2,500만 달러 기준으로 약 4.7배의 매출 배수에 해당한다. 실적 콜을 들어 보면 Hinge가 Cylinder를 고용주에게 파는 데서 어떤 매력을 보고 있는지 어렵지 않게 알 수 있다. Hinge는 크로스셀 기회를 통해서도, 자사의 노하우를 적용해 Cylinder의 직원 참여율을 끌어올리는 방식으로도 매출을 키울 방법을 아주 잘 파악하고 있는 것으로 보인다. 여기에 Hinge가 Cylinder 매출에 대해 누리게 될 것으로 보이는 매출 배수 확장까지 더하면 — Hinge는 현재 2026년 매출 배수 약 6.9배에 거래되고 있다 — 단기적으로는 꽤 분명한 성공 경로가 보인다.\n\n그렇긴 하지만 나는 이번 주 Slack에서 이 결정이 Hinge에게 전략적으로 마음에 들지 않는 이유를 이야기했다. 이 결정은 Hinge를 최고 수준의 MSK 제공자가 되는 길에서 떼어내, 고용주를 위한 디지털 헬스 플랫폼을 만들려는 길로 밀어넣는 것처럼 보이기 때문이다. 나는 전략적으로 전자를 훨씬 선호한다. 올해 초에 나온 PHTI의 GI 시장 보고서도 이 점을 짚는데, Cylinder 같은 랩어라운드 솔루션을 뒷받침하는 임상 데이터가 상대적으로 부족하다는 것을 지적한다. Hinge가 최고 수준의 임상 모델을 파는 회사라면, Cylinder가 여기서의 선택지가 되지는 않았을 것 같다. 오히려 이번 움직임은 단기적인 고용주 고 투 마켓 기회에 근거한 것으로 보인다. 이는 Livongo처럼 고용주 중심 디지털 헬스 모델들이 과거에 부딪혔던 문제를 떠올리게 한다. 즉, 고 투 마켓 전략으로 이기는 방식은 통하다가, 어느 순간 통하지 않게 된다. 그리고 통하지 않게 됐을 때, 남는 지속 가능한 자산이 무엇인지는 — 있기는 한지조차 — 불분명하다.\n\n올여름 초 Hinge의 인베스터 데이에서 Hinge는 MSK 플랫폼으로서의 버추얼·대면 역량을 Medicare, Medicaid 같은 인접 시장으로 확장하는 성장 전략을 제시했다. 그 전략을 설명한 슬라이드가 여기 있다.\n\n그 인베스터 데이 직후에 이런 움직임이 나온 것이 나로서는 이상하게 느껴진다. 해당 전략을 뒤로 미루고 고용주를 대상으로 다른 버티컬로 확장하는 쪽을 택한 것처럼 보이기 때문이다. 개인적으로는 Hinge가 최고 수준의 MSK 역량을 계속 키워 나가고, GI나 다른 질환으로 확장한다면 랩어라운드 솔루션이 아니라 최고 수준의 임상 모델을 인수하는 방식이었으면 훨씬 좋았을 것 같다. 단기적으로는 난이도가 더 높은 선택으로 보이지만, 장기적으로는 전략적 가치가 더 오래가는 선택이었을 것이고, Hinge를 차세대 전국 단위 버추얼 퍼스트 헬스 시스템의 애그리게이터로 자리매김하게 했을 것이다.\n\n물론 Hinge 경영진은 지난 1년간 공개 시장을 다루는 데 있어 탁월한 능력을 보여 줬고, 나도 이 계획이 어떻게 맞아 들어가는지 지켜볼 것이다. 다만 내가 그 코퍼레이트 디벨롭먼트 회의에 있었다면, M&A는 다른 방향으로 — 즉 MSK 시장에서 더 깊이 들어가는 쪽으로 — 가자고 강하게 밀어붙였을 것이다."},{"heading_en":"Q2 Earnings Spotlight","body":"이번 주 있었던 다른 흥미로운 실적 콜들을 정리하면 다음과 같다.\n\nCVS는 2분기 기대치를 상회했음에도 실적 발표 후 주가가 떨어졌다. 340B 사업에서 2027년에 대한 역풍을 경고하고 Caremark의 멤버십 감소를 시사했기 때문이다. CVS는 MinuteClinic에서 현금 지불 방식의 GLP-1을 제공하는, Eli Lilly와의 흥미로운 파트너십을 발표했다."},{"heading_en":"Q2 Earnings Spotlight","body":"Doximity의 AI 전략은 탄력을 받고 있는 것으로 보인다. 회사는 스스로를 Anthropic이 OpenAI를 앞지르는 상황에 여러 차례 비유했는데, 이 특정 경주에서 어느 회사가 OpenAI 역할을 맡게 될지는 상상에 맡겨 두었다. AI Search는 아직 초기 단계지만, Doximity는 도구를 쓰는 의료 제공자들과 광고비를 쓰려는 제약사 임원들 양쪽에서 오는 관심에 확실히 고무돼 있다."},{"heading_en":"Q2 Earnings Spotlight","body":"Oscar Health는 핵심 ACA 사업의 견조한 실적을 바탕으로 2026 회계연도 전망을 상향했다. ICHRA 서사는 여전히 매우 이론적으로 느껴진다. Oscar가 개념적 매력을 잘 설명해 주기는 하지만, 시장으로서는 아직 매우 초기 단계라는 느낌이 강하다. 9월에 예정된 인베스터 데이에서 Oscar가 성장 전략을 어떻게 설명할지 들어 보는 것이 흥미로울 것이다."},{"heading_en":"Q2 Earnings Spotlight","body":"Clover도 Oscar와 비슷한 서사를 따른다. 모든 지표에 걸쳐 2026년 가이던스를 상향한 데서 보이듯 핵심 보험 사업이 잘 돌아가고 있다. Clover는 앞으로 수익성을 끌어올릴 두 가지 핵심 요인으로 Stars의 순풍과 코호트 성숙을 언급했다. 2027년에는 성장과 수익성 확대를 동시에 이룰 것으로 기대하고 있다. 한편 Counterpart에 대해서는 고 투 마켓 역량에 투자하고 있다는 언급 외에 상업적 업데이트를 전혀 내놓지 않았는데, 이는 시사하는 바가 있어 보인다."},{"heading_en":"Q2 Earnings Spotlight","body":"agilon은 견조한 분기 실적을 내놨지만, 주가는 이번 주 롤러코스터를 탄 끝에 주간 기준으로는 거의 보합으로 마감했다. 2025년의 대규모 손실 이후 올해는 흑자로 돌아서 2분기에 1,400만 달러의 순이익을 기록했는데, 작년 같은 기간의 1억 400만 달러 순손실과 대비된다. agilon은 의료비 트렌드가 완화되는 것이 보이고 운영 실행의 기본으로 돌아가고 있다며 연간 가이던스를 상향했다."},{"heading_en":"Q2 Earnings Spotlight","body":"Omada는 강한 모멘텀에 힘입어 추정치를 상회했고 연간 전망을 상향했다. 동시에 창업자이자 CEO인 Sean Duffy가 이그제큐티브 체어맨 역할로 옮긴다고 발표했다."},{"heading_en":"Q2 Earnings Spotlight","body":"Privia는 또 한 번 매우 Privia다운 분기를 보여 줬고, 핵심 사업에서 탄탄한 실행을 이어갔다. 가치 기반 케어의 비중은 여기서 여전히 천천히 늘고 있다. 주가는 실적 발표 후 약 20% 하락했는데, 일부는 CMS 공유 절감액 지급 시점 때문으로 보이며, 이후 대부분 회복해 한 주를 마감했다."},{"heading_en":"Q2 Earnings Spotlight","body":"Health Catalyst 주가는 금요일에 또다시 25% 폭락했다. RCM 플랫폼인 VitalWare를 매각한 뒤 가이던스를 하향 조정했기 때문인데, 이 매각으로 HCAT의 연간 EBITDA 가이던스가 거의 절반으로 줄었다."},{"heading_en":"A Number to Ponder","body":"Bank of America의 놀라운 GLP-1 지출\n\n2억 5,000만 달러\nBank of America가 직원들의 GLP-1에 쓰는 연간 지출\n\nBank of America의 CEO Brian Moynihan은 CNBC의 Andrew Ross Sorkin과의 인터뷰에서, 20만 명이 넘는 직원의 GLP-1에 약 2억 5,000만 달러를, 의료비 전체로는 연간 20억 달러를 쓰고 있다고 말했다. 참고로 Bank of America는 2025년에 1,130억 달러의 매출과 305억 달러의 순이익을 냈다. 헤드라인 못지않게 인상적인 것은 Moynihan이 Bank of America의 GLP-1 접근 방식에 대해 얼마나 잘 알고 있는가 하는 점인데, 적정성을 담보하기 위한 프로그램을 갖추고 있는 것으로 들린다. Moynihan은 그 잠재적 건강 편익에 상당히 만족해 보인다.\n\n이 소식은 Slack에서 흥미로운 대화를 촉발했다. 나는 내가 Moynihan의 입장이라면 이것을 매출의 0.2%를 쓰는 방법 중 최선으로 볼 것이라고 주장했다. 다른 대형 고용주들이 GLP-1을 하느냐 마느냐의 이분법적 결정으로 보고, 일부는 마진을 지키려고 복리후생을 줄이는 환경에서, 내가 Moynihan이라면 사람이 직접 고객을 대하는 일이 그 어느 때보다 중요해지는 미래에 맞춰 내 비즈니스를 포지셔닝하는 것을 생각할 것이다. GLP-1을 제공해서 전체 의료비에서 직접적인 재무적 절감이 보이지 않는다 해도, 모두가 부담 가능성을 최우선으로 생각하는 시장에서 선택받는 고용주로 돋보이게 되는 간접적 편익과 매출의 0.2%를 맞바꾸는 것은 기꺼이 하겠다."},{"heading_en":"Chart of the Week","body":"고액 청구에 관한 Elevance의 데이터\n\nElevance는 이번 주 보고서에서 고액 청구의 현황에 대해 훌륭한 통찰을 제공했다. 몇 달 전 나는 이 뉴스레터 독자들을 대상으로 한 해 동안 가장 높은 청구액이 얼마일 것 같은지 설문한 적이 있다. 이 차트는 시각적으로는 악몽 같지만, Elevance의 대규모 단체/상업 보험 사업에서 2025년에 1,540만 달러짜리 청구자가 있었음을 시사하는 것으로 보인다. 이 보고서는 고액 청구자(비용 10만 달러 초과)의 증가를 잘 설명하는데, 이들은 가입자의 0.78%에 불과하지만 지출의 34%를 차지한다."},{"heading_en":"Company Spotlight","body":"VBC 인에이블러 Vytalize가 커지는 수익성을 보여 주다\n\nVytalize의 공동창업자 Faris Ghawi와 Dr. Amer Alnajar가 지난주 HTN에 들러 현재 사업 현황과, 자사의 VBC 모델이 전통적 Medicare, Commercial, Medicaid, Medicare Advantage 인구 전반에서 어떻게 긍정적인 임상·비용 성과를 내고 있는지에 대해 발표했다. 나에게 가장 인상적인 대목은 Vytalize가 도달한 규모와 커지고 있는 수익성이다. 위 발표 슬라이드를 보면 현재 30개 주에서 40만 명의 환자를 보고 있고, 2025년에 5,000만 달러의 조정 EBITDA를 냈으며 2026년에는 7,000만 달러로 늘어날 전망이다. 비교하자면 agilon은 2026년에 조정 EBITDA 중간값 8,500만 달러와 환자 약 54만 명을 가이던스로 제시하고 있다.\n\n우리는 Vytalize 모델이 어떻게 비용 절감을 만들어 내는지, 그리고 최근 화제가 된 2024년 ACO REACH 결과에 대해서도 이야기를 나눌 수 있었다. Vytalize는 2024년에 여섯 개의 ACO를 운영했고 그중 하나가 고필요 환자에 크게 집중돼 있어 해당 ACO의 벤치마크가 왜곡됐고, 그해에 상당한 손실이 발생했다고 밝혔다. 지난 2년간 Vytalize가 내놓은 최근 EBITDA 수치를 보면 그 문제는 빠르게 지나간 것으로 보인다. 지난 몇 년간 어려운 시장 환경을 헤쳐 온 기업들이 2026년 하반기에 들어서는 지금, 이는 VBC 시장의 모멘텀을 보여 주는 또 하나의 좋은 신호다."},{"heading_en":"Other Upcoming HTN Company Presentations","body":"다가오는 다른 HTN 컴퍼니 프레젠테이션:\n\nPearl Health, 8월 12일 오후 3시 30분 ET\n\nEnnoble Care, 8월 13일 오후 2시 ET"},{"heading_en":"Other Top Headlines","body":"Axios에 따르면 Datavant가 25억 달러의 부채를 리캡하고 있으며, 리캡이 완료되면 SmarterDx와 합병할 것으로 전해진다. SmarterDx는 New Mountain Capital이 2025년 5월 Thoughtful.ai, Access Healthcare와 함께 Smarter Technologies라는 우산 아래 묶은 세 회사 중 하나다. 짚고 넘어갈 만한 점은, Datavant와 Smarter Technologies가 올해 초 무산된 Thoreau 거래의 핵심 자산 두 개였다는 것, 그리고 최근 New Mountain이 Thoreau의 또 다른 핵심 자산이었던 Machinify를 매각하려 한다는 뉴스도 나왔다는 것이다."},{"heading_en":"Other Top Headlines","body":"Financial Times는 지난 일요일 Bristol Myers Squibb과 AstraZeneca가 두 회사 간 4,000억 달러 규모의 합병 가능성을 논의하고 있다고 보도했고, 이는 업계 애널리스트들을 대체로 어리둥절하게 만들며 주 초반 AstraZeneca 주가를 8% 끌어내렸다. 수요일에는 Reuters가 AstraZeneca의 고위 소식통을 인용해 거래는 없으며 진행 중인 논의도 없다고 보도했다."},{"heading_en":"Other Top Headlines","body":"SDOH 플랫폼 Unite Us가 Vircho Health를 인수했다. Vircho Health는 SDOH 이니셔티브의 성과를 추적할 수 있도록 감독·리포팅 도구를 제공하는 스타트업으로, 많은 SDOH 노력의 가치를 입증하는 일은 악명 높은 난제다."},{"heading_en":"Funding Announcements","body":"이번 주에는 펀딩 측면에서 특별히 다룰 만한 소식이 없었다."},{"heading_en":"What I'm Reading","body":"지난 몇 년간 Hims에 대해 가장 목소리가 컸던 베어 투자자 중 하나인 Cedar Grove Capital Management가 이번 주에 보고서를 내고, 이제 Hims에 롱 포지션을 잡은 이유에 대한 자신들의 논지를 공유했다. 이 보고서는 시장이 미래의 현금 지불 헬스케어 전달 시스템으로서의 Hims를 과소평가하고 있다고 주장한다. 전통적 의료 시스템이 자신을 실망시키는 수많은 방식에 좌절한 헬스케어 소비자를 상대한다는 점, 그리고 그 경험을 개인화하기 위해 Hims가 갖게 될 데이터를 중심에 둔 흥미로운 논지다. Hims 같은 많은 텔레헬스 사업자에 대한 비판은 그들이 약을 무분별하게 내주기만 한다는 것이지만, 케어 전달이 점점 GLP-1 같은 약에 사람들이 접근하도록 돕는 일이 되어 가고 사람들이 그 비용을 점점 더 본인 부담으로 지불하는 환경에서, 이 영역의 선도 소비자 브랜드를 보유하는 것은 좋은 전략적 위치로 보인다. 업계 리더들이 헬스케어의 소비자화를 이야기해 온 그 오랜 시간 동안, Hims는 업계가 그 방식을 어떻게 생각하든 상관없이 바로 그 플레이를 실행하고 있는 것으로 보인다."},{"heading_en":"What I'm Reading","body":"더 소비자 지향적인 현금 지불 헬스케어 시스템의 미래를 생각해 보는 김에, 이번 주 Hims에 대한 Gizmodo의 보도도 읽어 볼 만하다. Gizmodo는 기만적 마케팅 관행을 이유로 한 FTC의 최근 Hims 상대 소송으로 이어진 고객 불만들을 정보공개청구로 확보했는데, FTC가 지난 5년간 4,800건의 불만을 접수했다고 전한다. Gizmodo가 공유한 불만 사례들을 훑어보면 Hims는 이 부분에서 아직 할 일이 많아 보인다."},{"heading_en":"What I'm Reading","body":"Minneapolis에서는 Hennepin County Medical Center가 어려움을 겪는 세이프티넷 제공자를 유지하는 일의 지역 정치가 어떤 것인지 보여 주는 힘든 사례를 제공한다. 올여름 초 HCMC는 문을 계속 열어 두기 위해 현금 보유고를 소진한 끝에 주 정부로부터 7억 500만 달러의 긴급 구제를 받았다. 이번 주 Star Tribune은 HCMC 이사회가 정리해고를 수반했을 예산 삭감안을 두고 지역 선출직 공무원들과 충돌한 과정을 조명했다. 2023년 말 이사회는 HCMC 예산을 8% 줄이는 계획을 준비했다. 그런데 선출직 공무원들이 그 삭감을 뒤집고 정리해고 금지를 부과했고, 이에 일부 이사가 사임했다. 현금 보유고는 더 줄어들었고, 2025년에 Hennepin County 커미셔너들은 상황을 바로잡겠다며 이사회 해산을 의결했다. 이것이 정치적으로 껄끄러운 대화라는 것은 말할 필요도 없지만, 어느 시점에는 계산은 계산이고, 계속되는 예산 부족 앞에서 모래에 머리를 처박는 것이 이기는 전략으로 보이지는 않는다. 선출직 공무원들이 단기적으로 문제를 뒤로 미루는 데는 도움이 될지 몰라도 말이다. 이 모든 것이 절벽을 향해 곧장 달리면서 가속 페달을 밟고 있는 것처럼 느껴진다."},{"heading_en":"What I'm Reading","body":"지역 선출직 공무원들이 마주하는 어려운 헬스케어 결정 이야기가 나온 김에, Martin이 헬스케어 M&A에 관한 단상을 공유했다. 그는 최근 Colorado에서 제안된 AventHealth와 Intermountain 간의 JV를 짚었는데, 현재 Colorado 주 법무장관의 심사를 받고 있다. 한편으로, 거래를 승인할 경우 시장 집중도가 높아진다는 잠재적 우려는 분명하다. 다른 한편으로, 거래를 거부하면 JetBlue/Spirit Airlines 같은 결말을 감수해야 한다. 2년 뒤 Spirit은 더 이상 존재하지 않고, JetBlue는 그러지 않았을 경우보다 더 약해진 상태다. 혹은 Spirit 같은 결말 대신 위에서 설명한 HCMC 같은 결말을 맞아, 핵심 세이프티넷 제공자를 살려 두기 위해 주 정부가 긴급 구제금을 계속 지불해야 하는 상황에 갇힐 수도 있다. 어려운 트레이드오프지만, 다시 말하지만 어느 시점에는 계산은 계산이다. 개인적으로는 내가 Colorado 주 법무장관이라면 AdventHealth와 Intermountain의 JV를 진행하게 두겠다는 Martin의 의견에 동의한다."},{"heading_en":"What I'm Reading","body":"지역 시장 통합이라는 주제가 나온 김에, 이번 주에는 더 서쪽으로 가서 The Queen's Health System의 CEO Jason Chang과 함께 Hawai'i의 지역 시장 역학을 따라잡을 기회를 가졌다. 올여름 초 나는 현지 Blues 플랜인 HMSA의 다소 아리송한 소식에 대해 쓴 적이 있다. HMSA는 VBC 원칙을 중심에 둔 Hawai'i Pacific Health와의 수직 통합 합병을 추진하면서, 동시에 주 내 프라이머리 케어에 대한 VBC 지불에서는 멀어지고 있다. 이 모든 것은 헬스케어의 힘든 예산 현실과 지역 시장 안의 여러 제공자·페이어 사이의 조율 문제를 놓고 씨름하는 또 하나의 주(州)를 실시간으로 보여 주는 흥미로운 사례다. 한 가지 분명한 것은, 주 내 헬스케어 재원 조달의 최선의 길을 두고 Hawai'i 주지사가 씨름해야 할 결정들이 나는 조금도 부럽지 않다는 것이다."}]},"53":{"index":"53","title_en":"Weekly Health Tech Reads 8/16/26","subtitle":"2분기 실적 시즌의 테마 정리, Pearl Health의 회사 업데이트, STAT의 Commure 취재, 그 외","sections":[{"heading_en":"Today's newsletter is brought to you by: Knack Health","body":"AI 도구를 쓰면 헬스케어 앱을 빠르게 만들어 띄울 수 있다. 복잡해지는 곳은 백엔드다. PHI가 개입되는 순간, 규정을 지키는 데이터 저장과 기록 보존, 그리고 서명된 BAA가 필요해진다.\n\nKnack Health는 헬스케어 앱을 위해 만들어진 HIPAA 준수 백엔드다. 500개가 넘는 연동, 서명된 BAA 포함, 사용자 수 제한 없이 월 499달러부터 시작한다. 컴플라이언스 레이어를 이들이 처리해 주기 때문에 프로토타입에서 프로덕션까지 갈 수 있다.\n\nHealth Tech Nerds 스폰서가 되기"},{"heading_en":"Q2 Earnings Season","body":"분주했던 2분기 실적 시즌을 마무리하며\n\n이번 주에는 2분기 실적 시즌에서 얻은 핵심 시사점을 정리하는 데 시간을 썼고, 그 내용은 아래에서 볼 수 있다. Hims가 월요일에 이번 시즌의 마지막을 장식했다.\n\n우리는 Hims가 소비자 수요를 어떻게 설명할지 무척 궁금했다. 분기 내내 다른 곳들에서 엇갈린 신호를 봤기 때문이다. 일부 헬스 시스템은 비용 부담 우려가 이용량 감소로 이어지고 있다고 짚었고, BetterHelp는 현금 결제 사업이 무너지고 있다고 말했다. 그것이 Hims 같은 사업에도 현금 결제 압박으로 이어질까, 아니면 D2C 현금 결제 사업, 특히 GLP-1 쪽은 다른 소비자 행동을 보이고 있을까?\n\n후자였던 것으로 보인다. Hims는 FY 2026 매출 가이던스를 10% 올렸고, 구독자는 전년 대비 19%, 구독자당 매출은 21% 늘었는데, 이는 브랜드 GLP-1로의 전환이 미친 영향을 반영한다. 다만 브랜드 GLP-1로의 전환이 Hims에 좋은 소식만은 아니었다. 매출총이익률이 2025년 2분기 76%에서 2026년 2분기 64%로 떨어졌기 때문이다. Hims는 이 브랜드 제품들의 재무적 이점을, 소비자에게 다른 품목을 교차 판매할 수 있게 해주는 포트폴리오의 일부라고 설명했다. 여기서 짚어둘 점은 바로 지난 분기에 Hims가 월스트리트에 브랜드 제품과 조제 제품의 단위 경제성이 비슷하다고 말했다는 것이고, 이는 당혹스럽다.\n\nHims는 2026년을 Adj EBITDA 마진 약 12%로 마감할 것으로 보이며, 매출 65억 달러와 Adj EBITDA 13억 달러라는 2030년 목표를 재확인했다. 앞으로 몇 년에 걸쳐 Adj EBITDA 마진 20%까지 끌어올릴 것으로 기대한다는 뜻이다. 특히 브랜드 GLP-1이 매출총이익률에 주는 영향을 감안하면, 그 마진 목표가 어떻게 전개될지 지켜볼 만하다. Hims는 7월에 내놓은 AI 네이티브 Hers 제품을 비롯한 자사 AI 역량도 내세웠고, 펩타이드에 전력을 다하고 있으며 FDA가 펩타이드를 공식 승인하면 빠르게 움직일 준비가 돼 있다고 밝혔다.\n\nHims에서 한 발 물러나 보면, 2분기는 섹터 전반의 핵심 테마에 대해 흥미로운 전략적 업데이트를 여럿 보여줬고, 이를 아래 슬라이드에 정리했다.\n\n- AI에 대한 좀 더 신중한 시각, 다만 일부 낙관적인 구간도 존재\n- 관리 가능한 트렌드가 지급자와 VBC 제공자를 떠받침\n- 고용주 대상 헬스 솔루션의 강세장\n- 헬스케어 소비자의 비용 부담 문제\n- ACA와 수술 물량 전반에 걸친 제공자 측 역풍\n\n출처: HTN Research"},{"heading_en":"Q2 Earnings Season","body":"HTN 라이브 실적 리캡\n\n목요일에 2분기 실적 시즌 라이브 리캡을 진행한다. 이 트렌드들과 그 함의에 대한 우리의 해설을 짚어볼 예정이다. 여기서 라이브로 참여하기:\n\n- HTN's Q2 Earnings Season Debrief. 8월 20일 목요일 미국 동부시간 낮 12시"},{"heading_en":"Company Spotlight","body":"Pearl Health, 1%의 관리비 비율을 내세우다\n\nPearl Health의 CEO Michael Kopko와 COO Gabriel Drapos가 이번 주 HTN에 회사 업데이트를 전하며, 기술 중심의 1차 진료 이네이블먼트 접근이 어떻게 긍정적인 재무·임상 성과를 만들어내면서 동시에 규모 있는 수익성까지 이끌어내고 있는지 설명했다(Pearl은 2027년 순이익 5,000만 달러를 전망하는데, 이는 2026년 1,600만 달러에서 늘어난 수치다).\n\n논의에서 가장 흥미로웠던 대목은 아마 아래 슬라이드였을 것이다. Pearl이 관리비 비율을 2023년 4.6%에서 지금은 1%를 조금 넘는 수준까지 낮췄고, 2029년에는 1% 아래로 떨어질 것으로 전망된다는 내용이다. 이를 관리비 비율 6.2%인 비슷한 이네이블먼트 업체들, 그리고 12.3%인 헬스 플랜과 비교한다.\n\n출처: Pearl Health의 HTN 회사 발표 자료\n\n이네이블러와 헬스 플랜의 비율 비교가 꼭 동일 조건 비교인 것은 아니다. 이를테면 보험사는 청구를 처리하고 브로커 수수료를 지급하는 등의 일을 해야 하지만 Pearl은 그렇지 않다. 그럼에도 Pearl이 그렇게 낮은 수치로 운영하면서 긍정적인 임상 성과를 내고 있다는 점은, 특히 이네이블먼트 동종 업체들과 비교하면 인상적이고, Pearl이 기술 우선 접근에서 얻고 있는 레버리지를 가늠하게 해준다.\n\n한 발 물러나서 보자. 내가 모든 메디케어 수급자를 제공자와의 책임 있는 관계 안으로 들여보내겠다는 목표를 고민하는 CMS의 누군가라면, Pearl이 여기서 인용하는 이 관리비 비율 수치와 그것이 다른 이네이블러 및 지급자와 어떻게 비교되는지를 오래, 진지하게 들여다볼 것이다. CMS가 관리비로 1%를 지불하면서 사람들을 책임 있는 케어 관계로 이끌 수 있다면, 그건 승리처럼 보인다. 나는 이 발표를 보고 나서, 이것이 본질적으로 MSSP와 메디케어 어드밴티지를 CMS가 VBC를 구현하는 두 가지 이론에 대한 라이브 A/B 테스트로 만들어 놓는다는 생각을 하게 됐다. 하나는 CMS가 지급자가 되어 이네이블러와 계약해 리스크를 직접 관리하는 방식(MSSP)이고, 다른 하나는 CMS가 헬스 플랜에 돈을 지불해 모든 것을 관리하게 하는 방식(MA)이다.\n\n기술 중심 접근이 더 나은 마진 구조로 긍정적인 임상 성과를 낼 수 있다는 Pearl Health의 논지가 성립한다면, 아마도 그것은 시장이 Pearl과 경쟁하기 위해 시간이 지나면서 더 낮은 관리비 수치로 내려가야 한다는 것을 시사한다. 그리고 궁극적으로 목표가 비용 곡선을 꺾는 것이라면, 내게는 그것이 좋은 일로 보인다."},{"heading_en":"Company Spotlight","body":"예정된 회사 발표:\n\n- Virta Health. 8월 18일 화요일 미국 동부시간 낮 12시\n  GLP-1 시대에 지속 가능한 대사 질환 케어 사업 만들기: Virta Health 회사 발표와 Amit Shah와의 Q&A"},{"heading_en":"Chart of the Week","body":"고용주 대상 설문이 소규모 그룹 시장의 PBM 변화를 보여주다\n\nNational Alliance of Healthcare Purchaser Coalitions가 400곳이 넘는 고용주를 대상으로 실시한 설문은, 고용주들이 제약과 병원 가격을 비롯해 지출이 큰 항목 전반에서 빠르게 오르는 헬스케어 비용을 어떻게 헤쳐 나가고 있는지 살펴봤다. 한 번 훑어볼 만한 가치가 충분하다. 내게 특히 흥미로웠던 차트 두 개는 다음과 같다.\n\n대안적 계약 전략의 부상\n\n출처: Pulse of the Purchaser Survey, 2026년 8월\n\n- 고용주가 의료 지출을 관리하는 데 도움이 될 수 있는 다양한 핵심 전략들이 크게 늘었다. centers of excellence, site of care, advanced primary care, tiered networks, direct contracting, reference-based pricing이 여기에 포함된다. 이 각각의 항목이 지난 3년간 12%에서 19%의 성장을 보였다. 이 데이터를 고용주 규모별로 쪼개서 세그먼트 간 차이가 있는지 볼 수 있다면 무척 흥미로울 텐데, 어쨌든 이런 전략을 다루는 스타트업들이 체감하고 있을 모멘텀을 보여주는 강력한 지표다."},{"heading_en":"Chart of the Week","body":"소규모 그룹 시장에서 밀려난 Big 3 PBM\n\n출처: Pulse of the Purchaser Survey, 2026년 8월\n\n- 이 리포트의 헤드라인 중 하나는, 설문에 응한 고용주들 사이에서 Big 3 PBM의 점유율이 전년 대비 9% 떨어져 2025년 63.4%에서 2026년 54.3%가 됐다는 것이다. 그 데이터 밑을 들여다보면 세그먼트별로 조금 다른 이야기가 보인다. 이 변화는 거의 전적으로 소규모 그룹 수준에서 일어난 것으로 보이며, 이 구간은 전년 대비 70%에서 44%로 하락했다. Big 3 PBM은 중간 규모 시장(1,000~9,999명)에서는 오히려 점유율을 키웠고, 대규모 그룹(10,000명 이상)에서는 3% 떨어졌다."},{"heading_en":"Other Top Headlines","body":"STAT이 Commure의 영업 전략에 대한 훌륭한 취재를 내놨다. 여기에는 의료 그룹에 추천 대가를 지급하는 공격적인 영업 수법의 구체적인 내용이 담겼다. 기사는 그로 인한 Stark Law 위반 우려를 제기하고, STAT은 Commure가 최근 며칠 사이 추천 파트너십 프로그램을 종료하기로 했다고도 보도했다. STAT이 조사하는 와중에 Commure가 이 프로그램을 종료하는 그림은 좋아 보이지 않고, STAT이 기사에서 든 구체적 사례들도 마찬가지다. 게다가 Commure가 실제로 무엇을 하는 회사인지 아무도 간결하게 설명하지 못하는 듯하다는 점에서 특히 우려스럽다. 다른 건 몰라도, 헬스케어를 바꿔놓겠다는 Commure와 General Catalyst의 서사에 큰 균열이 생긴 것이며, 여기서의 성장이 실제 산업의 변화라기보다 VC 자금이 공격적인 영업 수법을 보조한 결과일 수 있음을 시사한다. 이 모든 것이 2022년 Axios가 Olive AI를 취재하며 바퀴가 빠지기 시작하던 그 시점에 Olive 모델의 균열을 비췄던 때를 섬뜩하게 떠올리게 한다."},{"heading_en":"Other Top Headlines","body":"가치 기반 농촌 1차 진료 이네이블먼트 스타트업 Main Street Health가 가장 빠르게 성장한 기업을 뽑는 Inc 5000 리스트에서 1위에 올랐다. 지난 3년간 매출이 546,533% 증가해 현재 매출 약 40억 달러 수준이라고 한다. 창업자 Brad Smith가 최근 3년 사이 Inc 5000 1위에 올린 두 번째 회사로, CareBridge가 2023년 리스트 1위였고 2024년 말 Elevance에 약 27억 달러에 매각됐다. Inc 보도에 따르면 Main Street는 현재 24개 시장에서 운영 중이며, 이는 2024년 26개에서 줄어든 것이다."},{"heading_en":"Other Top Headlines","body":"Axios Pro에 따르면 Innovaccer가 2억 5,000만 달러 규모의 자금 조달을 추진하고 있다고 한다. 이 금액은 지난 4월 에이전틱 AI에 투입하겠다고 약속한 지출 규모와 같은데, 당시 포인트 솔루션이 아니라 헬스케어 기업을 위한 엔드투엔드 AI 플랫폼을 구축할 필요가 있다는 점을 들었다. Innovaccer는 5월에 수익 주기 플랫폼 CaduceusHealth를 인수했다. 헬스 시스템이 선호하는 플랫폼 파트너 자리를 두고 기업들이 경쟁하는 가운데, 이번 자금 조달은 앞으로 더 많은 거래가 있을 것이라는 신호일 수도 있다."},{"heading_en":"Other Top Headlines","body":"Cityblock이 Humana와의 첫 파트너십으로 노스캐롤라이나에서 사업을 확장한다. 주 내 Humana MA 및 Dual 가입자 약 2만 명을 대상으로 하며, 복합 만성질환 환자를 위해 기존 PCP를 감싸는 래퍼 형태로 Cityblock의 모델을 배치한다. Humana는 Cityblock에게 주목할 만한 성과이며, 가까운 시일 내에 이것이 다른 시장으로 확대되는지 지켜볼 만하다."},{"heading_en":"Other Top Headlines","body":"Cadence의 HypertensionOS가 FDA의 TEMPO 파일럿 프로그램의 두 번째 참여자로 발표됐다. 이 프로그램은 CMMI의 ACCESS 모델과 연결된 디지털 헬스 기기 승인 경로다."},{"heading_en":"Other Top Headlines","body":"K Health이 기세를 이어가며 Atlantic Health와의 새로운 파트너십을 발표했다. EMR과 연동되는 환자용 임상 AI 도구인 Atlantic Health PatientGPT를 K Health의 가상 1차 진료 모델과 함께 선보인다. AI 중심 세계에서 헬스 시스템들이 자신들의 \"프런트 도어\" 전략을 고민하면서 활동이 많아지고 있는 듯하고, 상당수가 자체 ChatGPT 클론이 필요하다고 생각하게 되는 것도 논리적인 귀결로 보인다. 소비자들이 이런 헬스 시스템 전용 챗봇을 실제로 쓰기로 할지가 지켜볼 큰 질문이 될 것이다."},{"heading_en":"Other Top Headlines","body":"제공자 측이 거둔 최신 No Surprises Act 법적 승리로, 제5순회 항소법원은 지급자의 자격 요건을 갖춘 제안에 \"유령 요율(ghost rates)\"을 포함할 수 없다고 판결했다. 이런 법정 승리가 IDR 절차의 결과에 정당성을 부여하고, 그에 따라 더 많은 제공자가 이를 주목하게 될 것으로 보이는 만큼, NSA를 둘러싼 논의는 여전히 초반부에 있다는 느낌이 계속된다."},{"heading_en":"Funding Announcements","body":"MSK 진료를 위한 AI 기반 운영 체계 Flagler Health가 5,000만 달러를 조달했다. Bessemer Venture Partners가 라운드를 주도했다. Flagler는 36개 주에서 수천 명의 제공자로 규모를 키웠고, 제공자당 평균 16만 4,000달러의 추가 매출을 냈으며, 환자의 87%가 통증, 기분, 수면 또는 활동성의 개선을 보고했다고 밝혔다. 여기서 핵심 수치는 제공자당 추가 매출 16만 4,000달러로 보이는데, AI 수익 주기 역량이 진료소의 매출을 늘릴 의미 있는 기회를 찾아내고 있는 것으로 보이기 때문이다. 이 매출 창출 기회는 고객을 확보하는 훌륭한 쐐기로 보이며, 진료소와의 관계를 확보하고 확장해 나가는 방식이 초기 VBC 1.0 이네이블러 모델을 무척 연상시킨다. 그 경우에는 PCP가 VBC 계약을 통해 추가 매출을 확보하도록 도우면서 성장했다. 여기서 이 매출 확보 기회가 얼마나 지속 가능한지, 그리고 Flagler의 지속적인 진료소 성장에 어떤 함의가 있는지 지켜볼 만하다."},{"heading_en":"Funding Announcements","body":"직접 1차 진료 클리닉 네트워크 Aligned Marketplace가 1,600만 달러를 조달했다. Venrock이 시리즈 A를 주도했다. Aligned는 네트워크에 3,000곳 이상의 오프라인 클리닉(여기에 더해 가상 진료)을 두고 있다고 하며, 소규모 독립 진료소부터 Marathon Health, Galileo, One Medical 같은 그룹까지 아우르고, 성장 중인 가상 전문 진료 영역도 포함하는 것으로 보인다.\n\n앞서 언급한 고용주 설문 결과에서 케어 접근성을 제공하는 다양한 계약 전략에 대한 관심이 커지고 있다는 점을 보면, 고용주들이 감당 가능한 1차 진료 선택지를 제공하려 하는 가운데 Aligned가 좋은 모멘텀을 타고 있으리라 상상하기 어렵지 않다. 마침내 DPC/advanced primary care가 \"캐즘을 넘어\" 시장의 의미 있는 축이 되는 지점에 온 것인지 궁금해진다. Aligned는 직원 7만 5,000명 규모의 포춘 500대 고용주 사례 연구를 소개하는데, 고위험군 구성원들의 유의미한 참여와 임상 성과 개선이 나타났다고 한다. 이런 모델에 참여한 직원들의 임상 성과가 좋아지는 것 자체는 그리 놀랍지 않다. 더 흥미롭게 지켜볼 질문은 얼마나 많은 직원이 이 모델에 참여하고 있는지, 그리고 Aligned가 자사 케어 전달 네트워크를 대신해 그 참여를 어떻게 이끌어내고 있는지다."},{"heading_en":"What I'm Reading","body":"Inova의 Chief Data and AI Officer가 이번 주 Inova의 AI 전략에 대해 인터뷰했다. AI를 성공적으로 도입하려면 조직이 어떤 역량과 인프라를 갖춰야 하는지에 대해 읽어볼 만한 글이다. 최근 Centene의 Sarah London을 비롯한 여러 사람에게서 들어온, AI를 조직 전반에 성공적으로 도입하는 데 필요한 데이터와 인프라에 초점을 맞추는 흐름을 이어받는다. 업계의 서사가 AI에 관한 한두 가지 빠른 성공 사례를 이야기하는 데서, 제대로 뛰어들기 위해 필요한 조직 재설계라는 훨씬 넓은 대화로 옮겨가는 것을 보는 일은 흥미롭다. 당연하게도 그쪽이 대기업에게는 더 지속 가능한 길로 보인다. 지난주 Doximity가 실적 발표에서 업계가 \"AI 서부 개척 시대\" 단계를 지나고 있다고 말하는 것을 들었는데, 이런 인터뷰에서도 그 변화의 증거를 볼 수 있다."},{"heading_en":"What I'm Reading","body":"Manatt의 팀이 다가오는 산과 진료 지불 코드 변경의 영향에 대한 백서를 공유했다. 업계는 2027년 1월 1일에 지불 모델의 묶음을 해체한다. 이 산과 지불 모델의 변화는 매혹적인 변화인데도 마땅히 받아야 할 주목을 받지 못한 채 계속 레이더 아래로 지나가는 듯하다. 업계 전반에서 가치 기반 케어로의 이동이 갖는 장점을 이야기하고 있는 지금, 여기서는 VBC에서 크게 멀어져 다시 fee-for-service 청구로 돌아가는 움직임을 보고 있다. 오늘날 케어가 실제로 전달되는 방식을 반영한다는 명분에서다. Manatt의 백서는 이를 깊이 파고들어 관련된 여러 이해관계자에 대한 함의를 짚어주는 좋은 역할을 한다."}]},"54":{"index":"54","title_en":"Weekly Health Tech Reads 8/23/26","subtitle":"Devoted의 \"Beat and Raise\", San Antonio의 No Surprises Act 딜레마, AI 대 의사 논쟁의 수위 낮추기, Hims의 실망스러운 비전, 그 외","sections":[{"heading_en":"Announcing Differential","body":"Health Tech Nerds가 주최하고 Oak HC/FT가 후원하는, 가장 유망한 초기 단계 헬스테크 창업자 100명을 위한 초대 전용 모임 Differential을 알립니다.\n\nAI와 정책, 자본시장, 구매자 행동이 한꺼번에 움직이는 지금, 흔들리지 않는 헬스테크 회사를 세우려면 무엇이 필요할까요?\n\nMario Schlosser(Oscar Health), Toyin Ajayi(Cityblock), Kate Ryder(Maven Clinic), Jacob Shiff(CMMI), Vincent Tammaro(Mount Sinai) 등과의 비공개 대화를 통해 그 질문에 답해 보려 합니다. 행사 전과 도중, 그리고 이후에 야심 찬 다른 창업자들과 만날 기회도 많습니다.\n\n10월 1일 뉴욕에서 함께하시려면 지원해 주세요. 지원은 9월 9일에 마감됩니다.\n\n스폰서 Oak HC/FT, Davis Polk, Lazard, Lorikeet에 큰 감사를 전합니다.\n\nDifferential 스폰서 문의"},{"heading_en":"The No Surprises Act Saga","body":"San Antonio의 No Surprises Act 딜레마\n\n이번 주 텍사스에서 접한 이야기 하나가 내내 흥미로웠다. San Antonio 시 직원 건강보험 플랜이 2026년 연간 예산 2억 5,000만 달러를 4,000만 달러 초과하고 있다는 소식이다. 시는 San Antonio에서 응급실 네 곳을 운영하는 체인 Prestige Emergency Rooms가 2025년 말부터 NSA의 IDR 절차를 활용하기 시작한 것이 원인이라고 본다.\n\nPrestige는 San Antonio 지역 응급실 50곳 중 네 곳만 운영하지만, 시가 보장하는 2만 8,000명의 응급실 이용량 가운데 53%를 차지한다. IDR 절차를 거치면서 Prestige의 가격은 대략 두 배가 됐고, IDR로 넘긴 건의 99.6%에서 이기고 있다. Prestige는 그동안 BCBS 요율 아래에서 낮게 지급받아 왔고 이제야 합리적인 수가를 받는 것뿐이라고 주장하는데, IDR 결과를 옹호하는 공급자들이 흔히 내세우는 논리다. 한편 기사에 따르면 Prestige 쪽에서 얼마간의 술수가 벌어지고 있을 가능성도 있다. 시 직원들은 Prestige가 개인의 본인부담금과 코페이를 면제해 주기 때문에 그곳을 이용한다고 말했는데, IDR 절차를 활용해 고용주에게서 두 배를 받아낼 수 있다면 이는 효과적인 전략이다.\n\n여기서 질문이 하나 생긴다. 직원들이 하나같이 좋아하는 단일 공급자 그룹 때문에 올해 예산을 16% 넘겨 앉아 있는 시라면, 이제 무엇을 하겠는가? 시 매니저는 5월에 직원들에게 메모를 보내, 너무 많은 사람이 Prestige를 이용한 탓에 그 시점에 이미 플랜이 예산을 2,000만 달러 초과했다고 알렸다고 한다. 그는 메모에서 Prestige 대신 병원 응급실을 이용하라고 권했다. 그 전략은 통하지 않은 듯한데, 불과 석 달 만에 예산 적자가 두 배로 늘었다는 사실이 이를 보여 준다. 시 전체도 불어나는 예산 적자에 직면해 있어 상황은 한층 더 복잡하다. 시와 BCBS는 Prestige를 인네트워크로 데려오기 위해 협상을 시도하고 있지만, 오늘날 Prestige가 물량과 가격 양쪽에서 이기고 있는 마당에 협상에 나설 유인이 실제로 무엇일지 잘 모르겠다. 그래서 2027년에 시는 IDR 절차로 인한 비용 증가를 반영해 가입자 보험료를 인상하기 시작할 것이다.\n\n이는 No Surprises Act의 IDR 절차가 현실에서 어떤 결과를 낳는지 아주 잘 보여 주는 사례다. No Surprises Act는 예상치 못한 청구서라는 문제 하나를 풀었지만, San Antonio에서 드러나듯 이제 또 다른 문제를 만들어 내고 있다. 공급자들은 이 절차가 지불자와의 협상력 구도를 바꾸고 있다는 사실을, 그리고 청구를 IDR 절차로 몰아넣으면 갑자기 두 배(혹은 그 이상!)의 수가를 받을 수 있다는 사실을 깨달은 듯하다.\n\n이런 종류의 대화는 이제 막 시작됐을 뿐이라고 본다. Prestige 사례가 보여 주듯, 이 회사도 2025년 말에야 IDR 절차에 참여하기로 했다. 공급자들의 IDR 참여를 그래프로 그리면 S자 곡선이 나올 것 같고, 지난 몇 달 사이 그 결과에 정당성을 부여한 법원 판결들이 바로 지금 얼리어답터에서 더 주류인 공급자 조직으로 캐즘을 넘게 만들고 있다. 공급자 조직을 운영하는 입장에서 Prestige 같은 결과를 본다면, 똑같은 수를 두지 않을 이유가 있겠는가?\n\n이 모든 것이 공급자 쪽에서 리스크 조정 같은 분위기를 풍긴다. 인센티브가 공급자들에게 더 많이 받아내는 게임을 하라고 대놓고 가리키고 있고, 프로그램의 작동 방식에 v28 같은 변화가 오기 전까지 과열은 계속될 것이다."},{"heading_en":"Medicare Advantage","body":"Devoted Health의 가치가 얼마라고? 그 외 Medicare Advantage 시장의 움직임들\n\n금요일 늦은 오후, Business Insider는 Devoted Health가 250억 달러 가치로 추가 자본을 조달하고 있다고 보도했다. 3억 1,700만 달러를 160억 달러 가치로 조달했다고 발표한 지 채 1년도 되지 않은 시점이다. Cigna를 여전히 포함해 세느냐에 따라 다르지만, 이는 Devoted가 상장사였다면 Centene을 제치고 다섯 번째 또는 여섯 번째로 큰 관리의료 회사가 된다는 뜻이다.\n\n출처: HTN 분석, 재무상태표 데이터는 Perplexity의 도움을 받음\n\n오늘의 숫자로만 보면 Medicare Advantage 보험 사업치고는 천문학적인 가치다. Devoted는 올해 들어서야 MA 가입자 50만 명을 막 넘겼기 때문이다. MA 가입자 1인당 가치로 환산하면 대략 5만 달러(250억 달러 / 50만 명)인데, 이는 ZIRP 정점기 MA에서 보던 밸류에이션에 근접한 수준이다. 비교하자면 Clover Health는 2021년에 가입자 5만 7,000명으로 37억 달러 가치에 SPAC 상장했고, MA 가입자 1인당 6만 5,000달러였다. 오늘날 Clover는 가입자를 대략 세 배로 늘렸음에도 가치는 20억 달러에 가까워졌고, 이는 MA 가입자 1인당 1만 1,000달러라는 훨씬 합리적인 수치다. Devoted가 비슷하게 평가받는다면 오늘 기준 55억 달러 가치일 것이다.\n\n지금 보도된 가치에서는 사실상 Devoted를 어떤 합리적인 의미에서도 인수 불가능한 회사로 만든다. 물론 AI 회사라면 가능하겠지만, 데이터센터 위에 관리의료라는 PR 악몽까지 얹는 일은 금방 다시 생각하기를 바란다. 인터넷의 이 구석에서 전에도 이야기했듯, Devoted는 자신의 베팅을 꽤 분명히 밝혔다. 위 목록의 다른 이름들보다 CMS에게 더 효과적인 파트너가 되는 현대적 관리의료 사업을 다시 지을 수 있다고 보고, 그것을 해내면 앞으로 몇 년간 점유율을 가져가며 MA뿐 아니라 모든 보험 시장에서 지배적 사업자가 되어 그 목록의 1위까지 가치가 올라간다는 것이다. AI 시대를 위해 만들어진 전국 단위 Kaiser를 생각하면 된다. 거기까지 가려면 Devoted가 꽤 많이 성장해야 한다는 말로는 부족하고, 2027년에 Devoted가 가속 페달을 밟는 모습을 보게 될 듯하다.\n\n2분기 실적 시즌에 Alignment Health의 CEO는 2027년에 소규모 보험사 몇 곳이 튀어나와 의미 있는 시장 점유율을 가져가려 시도할 것이라고 전망했다. Devoted가 그런 보험사 중 하나가 되려 한다는 꽤 좋은 신호로 보이지 않는가? 나는 Devoted의 MA 북이 수익성 측면에서 현재 계획보다 의미 있게 앞서 있어 이런 성장 전략에 자신감을 주고 있으리라 짐작하는데, 근거는 두 가지다.\n\n- Medicare Advantage의 2026년 실적은 전반적으로 기대를 웃돌았고, 지불자들이 일제히 가이던스를 상회하고 상향했다. 업계가 트렌드를 어느 정도 손에 쥔 것으로 보인다.\n- Devoted는 2026년에 C-SNP 상품으로 크게 무게를 옮겼는데, D-SNP와 함께 C-SNP는 MA 시장에서 특히 수익성이 좋은 구간으로 보인다.\n\n케어 딜리버리에 쏟는 투자 수준을 감안하면 Devoted가 전사 차원에서 흑자라고 보기는 여전히 어렵지만, 투자자들은 2026년 반환점에서 계획 대비 현재 위치에 상당히 만족하고 있을 것이고, 2027년에 성장과 수익성의 트레이드오프를 잘 헤쳐 나갈 수 있다고 자신하고 있으리라 짐작한다. 어떤 의미에서 이건 사모 시장에서 성장하는 사업에게 일어난 비트 앤드 레이즈 상황처럼 느껴진다.\n\n이 모든 것이 2027년에 Devoted가 다시 매우 빠르게 성장할 태세를 갖춘 그림을 만든다. 특히 기존 사업자들이 수익성을 우선하는 더 신중한 자세를 이어가는 가운데 그렇다. 이미 Humana와 Centene 모두 가입자를 줄이겠다고 밝혔다. 우리는 이런 서사가 전에도 펼쳐지는 것을 봤고, 점유율을 빠르게 낚아채려 한 보험사들에게 대체로 좋게 끝나지 않았다. Devoted 자신도 2025년에 신규 가입자의 적자 때문에 고전했다. 그런데 2026년은 과거와 다르게 흘러간 듯하고, 특히 Humana는 새 가입자 유입을 소화하면서도 전체 사업을 흔들지 않으며 모두의 예상을 뒤집었다.\n\n흥미로운 질문은 결국 2026년의 성공을 신기루로 돌아보게 될지, 아니면 v28 이후 Medicare Advantage 시장의 새로운 길로 보게 될지다. 자본이 관리의료로 다시 돌아오면서 분위기가 좋은 것은 분명하지만, 헬스케어 부담 가능성에 대한 더 넓은 논의를 생각하면 지금의 초과 성과가 얼마나 지속 가능한지 궁금해지지 않을 수 없다.\n\n이 모든 것을 쓰다 보니 생각은 CMS와 올해 초의 Advanced Notice / Final Notice 소동으로 돌아간다. 업계는 2026년 초 Advanced Notice가 촉발한 짧은 위기를 빠르게 지나쳐 온 듯하다. 당시 Chris Klomp는 업계에 세금의 더 나은 청지기가 되라고 호소하면서 업계에 대한 지급을 낮추는 안을 내놓았다. 내 기억으로 업계는 Advanced Notice 요율이 재앙적이었을 것이고, Final Notice는 낫지만 여전히 부담이라고 말했다. 내가 Klomp의 입장이고 MA 보험사들이 지금 곳곳에서 가이던스를 상회·상향하는 것을 본다면, 2026년을 내가 생각했던 것보다 더 깊이 깎을 수 있다는 증거로 삼아 2027년을 두고 그 대화를 반드시 다시 꺼낼 것이다. 좋은 예를 찾으려면 Devoted만 봐도 된다. 불과 몇 달 전 Devoted의 CEO는 CMS에 업계에 돈을 덜 주라고 공개적으로 요구했다. CMS 입장에서 바로 그렇게 할 절호의 기회 아닌가?\n\n전체적으로 Devoted가 기존 사업자들이 주목해야 할 관리의료 산업의 흥미로운 변혁 이론을 제시한다고 생각하지만, 여기서의 밸류에이션은 내가 이해하기 어려운 방식으로 현실과 동떨어져 보인다. 투자자들은 Devoted를 평균에서 표준편차 3에서 6 사이에 있는 결과에 맞춰 가격 매기고 있는 것으로 보이는데, 요즘 사모 시장 성장 자본의 속성이 그런 듯하다. 내가 Devoted의 경영진이라면 시장이 뜨거울 때 이 기회를 활용해 실탄을 쌓아 둘 것이다. 그리고 직원들에게는 밸류에이션을 둘러싼 소음에 신경 쓰지 말라고 말할 텐데, 보상의 상당 부분이 Devoted의 기업가치 성장에 묶여 있을 것을 생각하면 설득하기 어려운 이야기이긴 하다.\n\n이번 자금조달 소식에 대해 너드들이 어떻게 생각하는지 궁금하다. 여기에 투자할 기회가 있다면 하겠는가? 그 이유도 듣고 싶다.\n\n이 라운드에 참여할 수 있다면, 오늘 250억 달러 가치의 Devoted에 당신의 돈을 넣겠는가?\n\n예, 전 재산을 걸겠다\n\n예, 분산된 포트폴리오에서 적당한 금액을 투자하겠다\n\n아니오, 나는 다른 곳에 투자하겠다\n\n금요일 늦게 나온 Devoted 소식 외에도, 각 조직이 미래를 대비해 성장과 수익성에 대해 서로 다른 입장을 잡아 가는 가운데 2027년 MA 시장의 찻잎으로 읽을 만한 흥미로운 신호가 여럿 있었다.\n\n- Centene은 지난주 브로커들에게 현재 34만 명 이상이 가입한 플랜에서 158개 이상의 카운티에 걸쳐 철수하겠다고 공유한 것으로 전해진다. 여기에는 Oklahoma, Tennessee, Hawaii 전역이 포함된다.\n- SCAN은 Costco와의 파트너십을 확대해, Medicare 가입자가 합쳐서 500만 명인 비공개 세 개 시장에서 공동 브랜드 MA 플랜을 출시한다고 발표했다."},{"heading_en":"Company Spotlight","body":"Virta Health가 자사 임상 모델의 규모를 공개하다: 런레이트 매출 2억 달러 + EBITDA 흑자\n\n출처: Virta Health의 HTN 컴퍼니 프레젠테이션\n\n화요일에 Virta Health의 사장 Amit Shah가 HTN에 현재 사업 상황을 업데이트해 주었다. 나는 늘 Virta의 서사가 흥미롭다고 생각한다. 영양을 통해 심장대사 문제의 근본 원인을 다루는 것을 목표로 하고, 그들이 보여 주는 임상 결과는 정말 인상적이다(참고로 저 링크들은 전부 다른 자료다). GLP-1이 심장대사 건강에 대한 인식을 높인 것은 분명하고, 이는 처방을 넘어 더 넓은 심장대사 지원을 제공하는 이런 모델에 기회를 만들어 주고 있다.\n\n앞으로 몇 년간 계속 확장해 나갈 회사로 지켜볼 만하다. Shah는 Virta가 사업을 100배로 키울 기회가 있다고 말했다. 대상이 되는 커버드 라이브를 50배(300만 명에서 1억 5,000만 명으로) 늘리는 동시에 고객당 수익률을 지금의 2배로 높인다는 것이다. 이는 앞으로의 경로를 보여 주는 듯한데, 고용주를 위한 디지털 헬스 솔루션이 되려는 Teladoc식 길을 가기보다 현재 모델을 고객 유형 전반으로 더 깊이 파고드는(즉 고용주 세그먼트를 넘어 확장하는) 방향이다. 어떤 면에서는 더 어려운 길처럼 보이지만, 그 길을 헤쳐 나갈 수 있는 사업에게는 더 오래 가는 사업적(그리고 사회적) 가치를 주는 길이기도 하다."},{"heading_en":"Upcoming Company Presentations","body":"다가오는 컴퍼니 프레젠테이션:\n\n- 8월 25일 화요일 오후 4시 ET\n  여성 건강에서 기업과 소비자를 잇다: Wildflower Health 컴퍼니 프레젠테이션, CEO 겸 창업자 Leah Sparks와 함께\n  여기서 신청하세요.\n\n- 8월 26일 수요일 오후 4시 ET\n  전국 사업자들이 후퇴하는 사이 MA 가입자를 50% 늘리다: Clever Care Health Plan 컴퍼니 프레젠테이션, CEO Karen Walker Johnson과 함께\n  여기서 신청하세요.\n\n- 8월 27일 목요일 오후 1시 ET\n  아웃오브네트워크 가격 책정을 소프트웨어 문제로 바꾸다: Daffodil Health 컴퍼니 프레젠테이션과 Q&A, 공동창업자 겸 CEO Navin Nagiah와 함께\n  여기서 신청하세요."},{"heading_en":"Chart of the Week","body":"고용주 비용 트렌드 상승의 북소리는 계속된다\n\n목요일에 Aon이 고용주 시장의 비용 트렌드 상승에 관한 데이터를 공개했고, WSJ 같은 매체에서 전국적인 주목을 받으며 아래 차트 등이 조명됐다.\n\n출처: WSJ\n\n이 뉴스레터를 꾸준히 읽는 독자들에게 새로운 데이터는 아니다. 우리는 2027년 비용 트렌드가 한 자릿수 후반에서 두 자릿수 초반이 될 것이라고 한동안 이야기해 왔다. 그럼에도 중간선거 시즌과 부담 가능성을 둘러싼 더 넓은 전국적 논의를 앞두고 이 문제가 전국적 주목을 받고 있다는 점은 흥미롭다."},{"heading_en":"Other Top Headlines","body":"Hims의 CEO Andrew Dudum이 이번 주 CNBC의 Andrew Ross Sorkin과 헬스케어의 미래에 관한 여러 주제로 인터뷰를 했다. 이번 주 Slack에서도 공유했듯, 나는 Hims가 헬스케어를 어떻게 바꾸겠다는 것인지에 대한 Dudum의 비전에 극도로 회의적인 상태로 인터뷰를 마쳤다. Dudum은 인터뷰의 첫 몇 분을, 유럽에서 10달러에 만든 Whoop과 Oura 모조품이나 블루투스가 달린 약통 같은 것에서 나오는 데이터를 자사 AI 코치가 활용해 헬스케어 경험을 개인화할 것이라는 설명에 썼다. 이 서사가 Hims의 개인 투자자 커뮤니티를 흥분시킨 것으로 보이지만, 2026년에 Dudum이 앞으로 12개월간 추진할 개념으로 약통을 이야기하는 것을 듣는 건 다소 충격적이다. 그것이 근 20년 가까이 시도돼 온 타르 웅덩이 같은 아이디어라는 사실을 모르는 듯하다. 헬스케어 산업이 하지 못했거나 하려 하지 않았던 방식으로 소비자 니즈를 기회주의적으로 충족시키는 데 놀랍도록 기민했던 회사치고, 여기서의 서사는 Hims가 그 소비자 정서를 얻어낸 이유와 놀라울 만큼 동떨어져 있다. 지금 Hims 고객 중에 Hims 브랜드의 블루투스 약통이나 10달러짜리 유럽산 Whoop 모조품을 사고 싶다는 피드백을 준 사람이 몇 명이나 될 것 같은가? 나는 0명이라고 본다. 소비자들이 다른 곳에서 더 싸게 살 수 있는 약을 굳이 Hims에 멤버십 비용을 내면서 사는 것과 정확히 같은 이유다. 소비자는 브랜드화된 소비자 경험에 더 많은 돈을 낸다. 이것이 말 그대로 Hims라는 사업이 존재하는 이유다! 그런데 Dudum이 인터뷰에서 말하는 내용을 보면, 그런 수순은 소비자 데이터를 둘러싼 해자를 쌓으려 할 때 두는 수처럼 보인다.\n\n이 인터뷰의 앞부분을 들으며 나는 Billy Madison에서 Adam Sandler를 나무라던 교장 선생님이 된 기분이었지만, 그럼에도 Hims는 지금 대단히 강력한 사회적 순풍을 등에 업고 있고, 그 점은 이 모델을 낙관할 만한 이유로 여전히 유효하다. 내가 보기에 그 순풍은 1. '지불자로서의 환자', 그리고 개인에게 HSA / FSA 예산을 주고 원하는 대로 쓰게 하자는 흐름에 대한 지지 확대(인터뷰에서 Dudum이 제대로 짚은 부분), 2. 모든 것에 대한 소비자 불신의 증가와, 그에 상응하는 정서, 즉 공급자는 소비자가 원하는 약에 접근하지 못하게 막는 중간상이라는 인식이다. 참고로 나는 이 순풍들이 반드시 좋은 것이라고 생각하지 않지만, 실재하는 흐름이라고는 생각하고, Hims는 거의 스스로에도 불구하고 그것을 활용하기에 좋은 위치에 있다."},{"heading_en":"Other Top Headlines","body":"Hims에 대해 그 모든 이야기를 쓰고 있던 중, 금요일 늦게 Bloomberg는 Hims가 높은 고객 불만 접수율 때문에 Visa의 Acquirer Monitoring Program에 등록됐다고 보도했다. 이는 올여름 Hims의 체중 감량 구독 모델 청구 방식을 두고 소비자 불만이 급증한 데 뒤이은 것이다. Hims는 첫 달에 39달러의 멤버십 비용을 받고(브랜드 GLP-1 약값은 제외) 이후에는 149달러로 올리는 것으로 보이는데, 마치 Hims가 소비자를 위한 예상치 못한 의료비 청구서를 제1원리에서 다시 생각해 낸 것 같다. Stripe가 Hims에 이 문제를 통보했고, Hims는 프로그램에서 빠지려면 분쟁률을 3개월 연속으로 거래의 1.5% 아래로 낮춰야 한다. 분쟁 한 건마다 8달러가 들어 9월에는 약 7만 5,000달러의 벌금이 되는데, 이는 Hims의 전체 손익에 비하면 푼돈이다. 더 큰 문제는, Hims가 대외적으로는 소비자가 신뢰하고 선택하는 공급자가 되겠다는 서사를 말하고 있지만, 이 사건과 최근의 기만적 마케팅 관행에 대한 FTC 소송이 Hims가 무엇인지(혹은 무엇이 아닌지)에 대한 다른 실체를 가리키는 것으로 보인다는 점이다."},{"heading_en":"Other Top Headlines","body":"Summa Health와 General Catalyst는 Summa Health의 운영을 고전하는 지역 공급자에서 최고 수준의 기술을 활용한 미래의 선도 공급자로 바꿔 놓을 '기술 전환 스택'을 발표했다. Summa의 스택은 General Catalyst 포트폴리오 회사 아홉 곳으로 구성된다. Aidoc, Clarium, Commure, Fabric, Hippocratic AI, Judi Health, Transcarent, Verse Medical, Percepta다. Percepta는 이 작업을 총괄하는 전환 파트너 역할을 맡는다고 한다. 나 자신이 헬스 시스템에서 이노베이션 업무를 해 본 사람으로서, 양쪽 현장이 얼마나 악몽 같을지 상상만 할 수 있을 뿐이다. 전환 과정에서 자기 역할이 무엇인지 파악하려 애쓰는 Summa의 기존 직원들에게도, 그리고 상당수는 진심으로 돕고자 할 것이라 짐작되는 GC 포트폴리오 회사들이 한꺼번에 이 시스템에 몰려드는 상황에서도 그렇다. 이 아홉 곳이 어떻게 선정됐고 Summa 직원들에게 어떻게 설명됐는지 그 이야기를 정말 듣고 싶다. 헬스 시스템에서 이노베이션을 하던 시절 내가 얻은 가장 큰 교훈 중 하나는, 시스템 리더들이 대체로 시장의 스타트업과 선호 파트너에 대해 감을 잘 잡고 있다는 점이었다. 다만 시스템 자체에 발목이 잡히는 경우가 많았을 뿐이다. Summa에게 최선의 솔루션인지와 무관하게 GC 포트폴리오라는 이유로 선정된 것으로 보이는 새 파트너 아홉 곳을 위에서 덮어씌우는 방식은 역효과가 날 것이 거의 확실해 보인다.\n\n이는 오늘날 이 나라의 케어 딜리버리에서 가장 흥미로운 이노베이션 실험 중 하나로 남아 있다. 다만 파트너십의 초기 성과는 회의를 품을 만한 이유를 주는 듯한데, 눈앞에 놓인 기회를 생각하면 안타까운 일이다. 시스템 전체의 전환이 정말 목표라면, GC와 Summa 쪽 사람들이 Summa의 운영에 급진적 투명성을 도입하는 것을 고려해 보라고 제안하고 싶다. 그래야 산업 전체가 지금 Summa에서 진행 중인 모든 작업에서 배울 수 있다. 통상적인 재무 공시를 넘어 Summa의 손익이 어떻게 돌아가는지 공유하라. 이 전환 스택의 세부 내용과 그것이 임상적으로, 재무적으로 Summa와 스택 자체에 어떤 영향을 미치는지 공유하라. 여기 있는 여러 GC 회사들 사이의 계열사 간 거래는 어떤 모습인가? 다른 벤더가 아니라 이들이 어떻게, 왜 선정됐는지 공유하라. 현장에 있는 Summa 직원들의 경험을 공유하라. 나라면 기꺼이 Akron까지 내려가 Summa와 GC 직원들을 인터뷰하고 그곳에서 무슨 일이 벌어지는지 업계와 나누겠다. RFK는 이미 초대를 받았는데, 다른 사람들에게도 확대하지 못할 이유가 있는가? 산업의 전환이 실제로 목표라면, 더 많은 투명성은 반드시 필요한 요소로 보인다."},{"heading_en":"Other Top Headlines","body":"R1 RCM이 사전승인 플랫폼 Humata를 조건 비공개로 인수했다. Humata는 Olive AI가 사업을 접은 뒤 그 자산을 되사들이며 2023년에 시작됐다. Olive는 원래 2021년에 Verata Health를 1억 2,000만 달러에 인수하면서 Humata 자산을 확보했다.\n\n우리는 최근 팟캐스트에 Humata의 창업자 겸 CEO Jeremy Friese(Verata에서도 같은 자리에 있었다)를 모시고 사전승인 절차와 WISeR 프로그램에 대해 이야기를 나눴다. Humata는 Oklahoma 주에서 참여 벤더로 활동하고 있다. AI가 사전승인 절차의 마찰 지점을 어디서 해결할 수 있는지, 투명성은 왜 필요한지, 그리고 어디서는 여전히 사람이 문제를 정리해야 하는지를 들여다보는 흥미로운 렌즈다."},{"heading_en":"Other Top Headlines","body":"Ascension은 이번 주 후반, Nashville의 자사 병원 한 곳에서 발생한 약물 혼동으로 정기 관절 치환 수술 중 마취제 대신 인산칼륨이 주입되어 환자 한 명이 마비되고 세 명이 상해를 입었다고 인정했다. 이런 이야기가 현재 진행형인데도 우리가 집단적으로 의료에서 AI가 미래에 미칠 영향을 걱정하는 데 그토록 많은 에너지를 쓴다는 사실이 가끔 놀랍다. 병원은 복잡한 환경이고 실수는 인간적인 일이지만, 2026년에 이 이야기는 충분히 피할 수 있었던 일로 보인다."},{"heading_en":"Other Top Headlines","body":"의료기관의 다양한 프론트오피스 환자 응대 업무를 돕는 에이전틱 AI 플랫폼 Weave가 Francisco Partners에 약 6억 5,000만 달러에 인수되며 비상장 전환된다."},{"heading_en":"Funding Announcements","body":"복합 질환을 가진 Medicaid·Medicare 인구를 위한 가치 기반 케어 모델 Cityblock이 1억 1,600만 달러를 조달하고 Homeward Health를 전액 주식 거래로 인수한다고 발표했다. General Catalyst가 이번 라운드를 주도했다. 나는 소식이 공개된 뒤 목요일에 Cityblock의 공동창업자 겸 CEO Toyin Ajayi와 이야기를 나눴고, 그는 현재 사업 상황과 앞으로의 궤적에 대해 훌륭한 관점을 들려주었다. Cityblock이 이번 발표를 사업의 새 장을 여는 출발점으로 보고 있다는 인상을 분명히 받았다. VBC 시장의 역풍을 헤쳐 나가면서 지난 몇 년간 갖추는 데 집중해 온 운영 플랫폼을 확장하는 것이다. 그 역풍은 이 사업에게 순풍으로 바뀌고 있는 것으로 보이며, 이제 복합 질환 인구에게 고가치 케어(즉 고품질·저비용 케어)를 제공하려는 주정부, CMS, 지불자에게 AI 기반 파트너가 되는 새로운 성장 국면에 들어선다. Ajayi는 Cityblock이 앞으로 유기적 성장과 비유기적 성장을 함께 추구할 것이며, 비유기적 성장의 우선순위는 중증 정신질환, 물질사용장애, 특수 요구 인구 등 다른 복합 인구로 확장하는 것과 그 인구를 지원하는 역량에 맞춰져 있다고 말했다. Cityblock은 이제 플랫폼 플레이가 될 만한 규모에 도달하면서 이 시장에서 자산을 사들이는 인수자가 되기에 좋은 위치에 있는 것으로 보이는데, 그것이 맞다면 이 시장 전반의 스타트업들에게 좋은 소식으로 보인다."},{"heading_en":"Funding Announcements","body":"지적·발달장애(I/DD) 인구를 위한 관리의료 모델 Deon Health가 AmeriHealth Caritas로부터 새로운 전략적 투자 라운드를 유치했다고 발표했다. Deon은 지역 공급자들과의 조인트벤처를 통해 직접지원 전문인력(DSP)을 지원하는 흥미로운 모델을 만들고 있다. 나는 Deon의 CEO Sara Ratner와 그 접근법에 대해 이야기를 나눌 기회가 있었다(녹화본은 곧 HTN 멤버들에게 공개된다). 그는 I/DD 인구의 구체적인 특성에 대해 훌륭한 렌즈를 제공해 주었는데, 이 인구는 비용이 가장 높은 환자군 중 하나이면서도 역사적으로 주정부의 관리의료 노력에서 대체로 제외돼 왔다. Sara가 말했듯, 이 인구를 관리의료 모델로 옮기면 Medicaid 전반의 부정수급 우려를 어느 정도 해소하는 동시에 이 인구의 독특한 의료 수요를 더 잘 지원할 수 있고, 응급실에 오는 빈도가 줄면서 그에 상응하는 비용 절감도 따라온다. Sara는 요로감염에서 비롯된 패혈증이 이 인구의 주요 사망 원인 중 하나라고 전했다. 많은 이들이 말을 하지 못해 문제를 전달할 수 없기 때문인데, 2026년 미국에서 충분히 풀 수 있는 문제로 보인다."},{"heading_en":"Funding Announcements","body":"농촌 지역 1차 진료 이네이블러 Hopscotch Health가 5,300만 달러를 조달했다. 8VC와 Town Hall Ventures가 라운드를 주도했다. Hopscotch는 현재 주로 North Carolina 서부에서 1만 5,000명의 환자를 진료한다. 이번 주 세 건의 라운드를 보면, 지금 농촌과 복합 질환 시장에 모멘텀이 있다는 것을 분명히 느낄 수 있다."},{"heading_en":"What I'm Reading","body":"이번 주 인터넷은 Zeke Emanuel, Abe Baker-Butler, Neal Khosla, Vinod Khosla가 AI가 임상의를 능가할 것이라고 주장하는 관점을 JAMA Viewpoint에 공동 게재하면서 떠들썩했다. 정작 글 자체는 그것이 불러일으킨 반응에 비하면 꽤 온건해 보였다. 이 주제에 관한 최근 연구를 정리한 뒤, AI 단독이 의사와 AI의 하이브리드를 능가할 것이며 2030년이면 실제 워크플로에 투입될 수 있을 것이라고 제안하는 내용이었다. 이 글은 예상 가능한 반발을 낳았고, 소셜미디어의 전문가들이 여러 근거를 들어 초지능으로부터 의사를 방어했다(연구가 결함투성이다, 의학은 예술이자 과학이다, AI는 사람에게 손을 얹을 수 없다 등등).\n\n지금 소셜미디어를 휩쓰는 이 글에 대한 반박들이 얼마나 쓸모 있는지 나는 개인적으로 고개를 갸웃하게 된다. 알고리즘에 영합해 분노를 수확하도록 설계된 것처럼 보인다. 무슨 뜻이냐면, 작년 말 Vinod Khosla는 Eric Larsen과 함께한 팟캐스트에서 이번에 나올 이 글에 대해 이야기했다(약 18분 지점). 그 인터뷰에서 Khosla의 입장을 들어 보면, 그는 의사가 자신을 대신해 일종의 레지던트 역할을 하는 AI 에이전트 팀을 관리하면서 의사의 도달 범위를 넓히는 세계를 그린다(참고로 그 새로운 세계에서 의사는 재정적으로 오히려 더 낫다). 이 팀이 이 관점 글을 쓰는 데 걸린 8개월 남짓 동안 Khosla가 그 입장에서 크게 멀어졌을 것 같지는 않다. 그렇다면 그것은 AI가 자율적으로 행동하는 사례인가, 아니면 임상의가 루프 안에 있는 사례인가? Khosla의 서사는 아주 구체적인 용도에 대해 FDA 승인을 받은 AI 에이전트라는 아이디어와 맞닿아 보이고, 우리는 이미 그 초기 신호를 보고 있다. Cleveland Clinic이 FDA 승인을 받은 AI 에이전트를 환자에게 처방한다면, 그것은 자율 AI의 사례인가, 아니면 사람이 루프에 있는 사례인가? 디지털 치료제가 지난 10년 넘게 약속해 온 것의 다음 반복과 그렇게 다른가? 나는 아니라고 생각하며(위 사례를 보면 FDA 510k 절차도 그렇게 보지 않는 듯하다), 바로 그 지점에서 지금의 논쟁이 나에게는 사실상 무의미해진다.\n\n오히려 'AI가 의사를 대체할 것인가'라는 서사는, 반드시 이뤄져야 할 훨씬 더 결이 섬세한 대화에서 주의를 돌리는 미끼처럼 점점 더 느껴진다. 또한 각자가 자기 이익 풀을 지키려는 태도를 넘어설 수 있다면 실제로는 합의점이 훨씬 더 많을 대화이기도 하다. 예를 들어 나는 Mark Cuban의 비판을 읽었는데, 그는 사실 Khosla, Emanuel 등의 입장에 대체로 동의하고 있다고 생각한다. 물론 이 변화가 어떻게 일어나는지, 미래에 사람과 AI의 역할은 무엇인지에 대해 중요한 대화가 남아 있다. 그리고 임상의학에서 AI를 어떻게 펼칠 것인가의 구체적인 지점에서는 불가피하게 이견이 생길 것이다. 하지만 그 확산 자체는 불가피해 보이고, 그렇다면 이 논쟁에서 사람들을 양극단으로 몰아붙이는 일은 역효과로 보인다. 앞으로 수십 년간 케어 딜리버리의 핵심 조직 원리 중 하나가 될 법한 문제를 함께 정리해 나가는 마당에는, 모여서 이 대화의 미묘한 지점들을 생산적으로 논의하는 편이 더 유용해 보인다."}]},"55":{"index":"55","title_en":"Weekly Health Tech Reads 8/30/26","subtitle":"Sword/Hinge 합병, 계속되는 No Surprises Act 논쟁, 의료진 보상에 관한 Doximity 데이터, 그 외","sections":[{"heading_en":"Today's newsletter is brought to you by: Elation Health","body":"EHR를 고르는 일은 위험 부담이 큰 결정이고, 나중에 되돌리기도 어렵습니다.\n\nElation Health의 EHR Platform Buyer's Guide는 주요한 임상적·기술적 고려사항을 한자리에 모아, 상호운용성, AI, 환자 인게이지먼트, 도입, 애널리틱스, 수익주기관리 등을 다루는 체크리스트를 제공합니다. 팀이 올바른 판단을 내리는 데 필요한 정보를 모두 갖추도록 돕는 유용한 자료입니다.\n\n가이드 다운로드\n\n뉴스레터 스폰서십에 관심이 있으시다면 알려 주세요!"},{"heading_en":"M&A","body":"Sword가 Headspace를 2억~3억 달러로 알려진 금액에 인수한다\n\nAxios는 이번 인수가 2억~3억 달러의 현금 거래라고 보도했는데, 이는 2021년 Ginger와의 합병 이후 Headspace에 매겨졌던 30억 달러 기업가치와 비교하면 실망스러워 보이는 수치다. 당시 Headspace와 Ginger는 두 회사를 합쳐 4억 3,600만 달러를 조달한 것으로 알려졌다.\n\nHeadspace/Ginger 합병 당시 이 거래는 명상부터 정신과 진료까지 폭넓은 정신건강 서비스를 제공하는 “파워하우스”를 만들겠다는 취지였다. 그 무렵 Ginger는 매출 3배 성장, 500개 고용주 고객, 1,000만 명의 커버드 라이브를 내세우며 Blackstone으로부터 10억 달러 기업가치에 1억 달러를 막 조달한 참이었다. 최근 BetterHelp와 함께 D2C 정신건강 시장에서 벌어진 일을 보면, 오늘날 Headspace에 남은 가치는 Ginger와 그동안 쌓아온 B2B 관계에 있는 듯하다.\n\n2010년 무렵 디지털 헬스 업계에서 일을 시작한 너드로서, Ginger.io가 16년의 여정 끝에 결국 Sword Health에 합류하는 모습을 보는 것은 운명의 흥미로운 반전이다. Ginger를 깊이 들여다본 적 없는 분들을 위해 덧붙이면, Ginger는 그 시절 가장 흥미로운 스타트업 중 하나였고 원래는 MIT Media Lab의 연구 프로젝트로, 스마트폰 사용 데이터를 수동적으로 수집해 건강 상태의 변화를 추론하는 것이었다. 처음 시작했을 때 Ginger는 정신건강 회사조차 아니었다. 첫 상업적 시도는 당뇨 영역이었다. Vinod Khosla를 비롯한 초기 투자자들은 Ginger를, 사실상 제로에 가까운 비용으로 헬스케어를 더 예방적이고 종단적으로 만들 수 있는 기술을 통해 접근성을 민주화함으로써 전통적인 에피소드 중심 의료 시스템을 파괴할 기회라고 치켜세웠다.\n\n그 서사는 매우 익숙하게 들린다. 거의 20년이 지난 지금 Sword는 AI를 활용해 헬스케어 접근성을 무한히 확장 가능하게 만들고 있다고 이야기하기 때문이다. 역사는 그대로 반복되진 않아도 운율은 맞는다고 믿는 편인 사람으로서, Ginger와 Headspace가 지난 15년 남짓 걸어온 여정은 Sword에게 예상해야 할 경로가 무엇인지, 그리고 특히 헬스케어 민주화라는 목표와 견줄 때 자본시장에서의 성공이 얼마나 덧없을 수 있는지를 보여 주는 것 같다."},{"heading_en":"No Surprises Act","body":"No Surprises Act를 둘러싼 싸움은 계속된다\n\nGeorgetown CHIR 소속 인사들이 쓴 Health Affairs Forefront 기사가 이번 주 소셜미디어에서 공급자 단체들의 분노를 샀다. 이 기사는 CMS가 공개한 공개 이용 데이터를 바탕으로 No Surprises Act의 IDR 절차가 224억 달러의 비용을 초래했다는 점을 다뤘다. 아래 차트의 분쟁 건수 증가에서 드러나듯, 2025년 IDR 절차를 활용한 주체 중 Radiology Partners, HaloMD, Team Health 세 곳이 압도적으로 규모가 컸다:\n\n출처: Health Affairs Paper\n\n이 기사는 IDR 절차에 이해관계가 있는 일부 공급자 단체로부터 즉각적인 반응을 이끌어냈다. Radiology Partners의 CEO는 LinkedIn에 나서 해당 기사를 “수치스럽다”고 부르며 지불자 쪽으로 기울어진 편향을 시사했다. American College of Radiology도 뒤이어 블로그 글을 올려 그 결과에 이의를 제기했다. 전반적인 주장은, 지불자들이 아예 오퍼를 제출하지 않거나 사실상 0에 가까운 “유령 요율”로 오퍼를 제출하는 식으로 QPA를 가지고 장난을 치고 있다는 것이다. 인용된 비용 증가는 QPA를 기준으로 하기 때문에 이론적으로 224억 달러라는 증가분은 과장된 것이며, 특히 공개 이용 파일에 이상치 판정액을 과대하게 잡는 부정확한 데이터가 담긴 것으로 보인다는 점을 감안하면 더욱 그렇다는 이야기다.\n\n224억 달러라는 수치가 전적으로 정확하지는 않을 수 있지만, 이 기사에 대한 즉각적인 반응은 이들 공급자 그룹에게 IDR 절차가 전략적으로 얼마나 중요한지를 보여 주며, 비용이 실제로 오르고 있음을 시사한다. 그렇지 않다면 CMS의 공개 데이터를 분석한 Health Affairs Forefront 논문에 왜 그토록 강하게 반응하겠는가? 지불자와 공급자가 서로를 손가락질하는 동안 이 모든 삿대질에서 분명해지는 것은 어느 쪽도 결백하지 않다는 사실뿐이며, 그러면서도 양쪽 모두 지불자/공급자 협상이 늘 도달하는 것처럼 보이는 내시 균형에 대해 불평한다.\n\n이 논쟁에서 점점 더 분명해지는 또 한 가지는, 고용주와 근로자가 IDR 절차의 재정적 영향을 체감하기 시작했다는 점인 듯하다. 지난주 뉴스레터에서 다뤘듯이 San Antonio 시는 IDR 절차 때문에 연간 2억 5,000만 달러 헬스케어 예산을 4,000만 달러 초과하고 있다. Health Affairs 기사는 또한 New York Department of Civil Service가 2억 달러가 넘는 추가 청구를 떠안았고 United Service Workers Union은 보험료를 1.75% 인상해야 했다고 전하는데, 둘 다 IDR 절차의 결과다.\n\n흥미로운 점은 기사에 대한 반박이 이 대목들을 전혀 다루지 않는 것으로 보인다는 것이다. 결국 그 부분이야말로 기사 전체에서 가장 많은 것을 말해 주는 데이터로 보이기 때문이다. QPA를 둘러싼 지불자와 공급자의 다툼이나 데이터 오류 가능성과 무관하게, 고용주들은 이 절차의 결과로 비용이 올라가고 있다는 신호를 분명히 보내고 있다. 협상 테이블의 어느 쪽에 앉아 있느냐에 따라, 그것은 지불자들이 그동안 공급자에게 과소 지급해 왔기 때문이거나, 공급자들이 더 받아내려고 IDR 절차를 악용하고 있기 때문이다.\n\n어느 쪽이든 IDR이 헬스케어 비용을 부풀리고 있다는 것은 분명해 보인다. 헬스케어 시스템에 대한 신뢰가 그 어느 때보다 낮고 감당 가능성이 최대 화두인 더 넓은 정치적 환경에서, 이는 양쪽 모두 미국 대중의 눈에 나쁘게 비치고 마는 또 하나의 시나리오처럼 보인다. San Antonio의 급격한 비용 증가 같은 이야기에서 드러나듯 더 많은 공급자가 IDR 절차의 전략적 이점을 인식하고 있는 것으로 보이는 만큼, 여기서는 특히 그렇다는 생각이 든다. 돌고 돌고 또 돌아간다."},{"heading_en":"Physician Compensation","body":"Doximity 설문 데이터가 의사 보상 트렌드를 보여 준다\n\nDoximity가 2025년 의사 2만 3,000명이 참여한 연례 의사 설문 결과를 발표했다. 보고서는 의사 보상 트렌드와 AI 도입에 대한 의사들의 견해 등을 다룬다. 특히 AI 덕분에 같은 시간에 더 많은 일을 처리하게 된다면 그 재정적 가치가 어디로 돌아가야 하느냐는 질문에 응답자의 44%는 의사에게 가야 한다고 답한 반면, 더 낮은 비용의 형태로 환자에게 돌아가야 한다고 본 응답자는 17%였다.\n\n공급자 보수를 이야기하는 것은 늘 민감한 주제지만, 그럼에도 여기서 한 번 들어가 볼 만하다고 본다. 특히 위에서 적절한 지급을 확보하려는 영상의학 진료그룹에 관한 NSA 논의를 했으니 더 그렇다. Doximity 데이터에 따르면 영상의학과 의사의 평균 연봉은 현재 61만 달러이며 보상은 연 6.6%씩 증가하고 있다. 영상의학은 여덟 번째로 보수가 높은 전문과이자 보상 증가 속도로는 아홉 번째로 빠른 전문과다. 인터벤션 영상의학은 아래 차트에서 보듯 두 항목 모두에서 더 높다:\n\n출처: Doximity\n\nAI 때문에 사라질 것이라던 직군이자, 최근에는 NSA 주장을 액면 그대로 받아들인다면 끊임없이 과소 지급하는 짓궂은 지불자들과 씨름해 왔다는 직군인데, 저 평균 보상 데이터를 보면 고개를 갸웃하게 된다. 내가 뭔가 놓치고 있는지도 모르지만, 평균 연봉 61만 달러는 하나의 직업으로서 꽤 합리적인 숫자로 보인다. 이 데이터를, 지불자들이 영상의학 그룹에 급격한 수가 삭감을 요구하고 있다고 불평하는 American College of Radiology의 No Surprises Act 관련 성명과 나란히 놓고 보면 흥미롭다.\n\n보험사들이 영상의학과 의사에게 지급을 삭감하고 있었다면, 그 기간 동안 영상의학과 의사들이 받는 보상이 줄어들었어야 하는 것 아닌가? 어떻게 된 일일까? 돌고 돌고 또 돌아간다."},{"heading_en":"Chart of the Week","body":"(Eli Lilly가 자금을 댄) 한 연구가 tirzepatide의 잠재적 비용 절감 가능성을 가리킨다\n\n아래 차트는 최근 한 연구의 핵심 시사점을 보여 준다. 이 연구는 tirzepatide 사용자가 12~18개월 후 대조군 코호트와 비교해 헬스케어 비용에서 PPPM 기준 319달러를 덜 지출했다고 제시하며, 여기에는 tirzepatide 자체의 비용은 제외돼 있다. Medicare의 GLP-1 Bridge 프로그램 비용이 월 195달러라는 점을 감안하면, 이 데이터는 GLP-1을 통해 헬스케어 비용을 줄이는 개념적 경로를 제시하는 것으로 보인다.\n\n출처: https://dom-pubs.onlinelibrary.wiley.com/doi/epdf/10.1111/dom.71250"},{"heading_en":"","body":"Health Tech Nerds와 Ursa Health가 9월 14일 월요일 저녁 Nashville에서 가치 기반 케어 분야의 시니어 리더들을 위한 디너를 엽니다. 관심 있으시면 알려 주세요! 자리는 한정돼 있습니다.\n\n저희는 9월 14~15일 Healthcare Sessions 참석차 현지에 있을 예정입니다. 참석을 고민 중이지만 아직 등록하지 않으셨다면 코드 HTNSESSIONS로 100달러를 할인받으세요."},{"heading_en":"Other Top Headlines","body":"Oura는 다가오는 IPO에서 160억 달러가 넘는 기업가치로 최대 30억 달러를 조달할 계획이라고 Bloomberg가 전했다. IPO는 이르면 9월에 이뤄질 수 있다."},{"heading_en":"Other Top Headlines","body":"The Villages Health System(TVH)이 자진 신고한 업코딩 문제를 두고 DOJ와 합의하며 5억 4,150만 달러를 지급하기로 했다. 이 합의는 TVH의 기묘한 한 장을 마무리하는 것으로 보이는데, TVH는 2024년 말 정부에 위험조정 문제를 자진 신고한 뒤 지난여름 파산을 신청했다. TVH는 2025년 9월 자사 클리닉을 Humana의 CenterWell에 매각한다고 발표했고, 이 과정은 Villages를 소유한 가문에 돌아가는 재정적 이익을 두고 다른 지불자들의 이의 제기를 불렀다."},{"heading_en":"Other Top Headlines","body":"VBC 재택의료 공급자 Monogram Health도 이번 주 DOJ와의 합의를 발표하며, 부정확한 위험조정 제출에 관한 내부고발자의 주장을 240만 달러를 지급하고 마무리했다."},{"heading_en":"Other Top Headlines","body":"Radiology Partners가 Everlight Radiology를 인수하며 영국, 아일랜드, 호주, 뉴질랜드, 남아프리카공화국을 포함한 국제 시장으로 확장했다."},{"heading_en":"Funding Announcements","body":"헬스 시스템을 위한 “revenue assurance” 플랫폼 Arintra가 2,500만 달러를 조달했다. Define Ventures가 라운드를 주도했다. Arintra의 서사는 공급자 조직이 조직 내부의 파편화된 수익주기 워크플로 탓에 마땅히 받아야 할 만큼 지급받지 못하고 있으며, 자사는 여러 포인트 솔루션을 이어 붙인 것이 아니라 플랫폼이라는 점에서 우위가 있다는 생각을 중심에 둔다. Arintria는 웹사이트에서 컴플라이언트 수익 확보 5.3% 증가와 코딩 관련 거절 43% 감소를 내세우는데, AI를 활용해 공급자 조직이 추가 수익을 확보하도록 돕는 기회를 보여 주는 듯하다. 동시에 Arintra는 스스로를 공급자를 위한 플랫폼이라고 설명하지만, 보도자료에는 UC Davis Health의 Executive Director of Mid-Revenue Cycle의 고객 인용이 실려 있다는 점도 짚어둘 만하다. 이 직함은 이런 대형 공급자 조직에서 RCM 지형이 얼마나 복잡하고 파편화돼 있는지를 잘 보여 준다."},{"heading_en":"Funding Announcements","body":"행동건강 분야의 임상 AI 플랫폼 Onos Health가 1,700만 달러를 조달했다. Costanoa가 라운드를 주도했다. Onos는 건강보험사들과 협력해 행동건강 케어를 더 잘 관리하고 있으며, 정형·비정형 데이터를 활용해 보험사와 그들의 공급자 네트워크가 케어의 질과 비용을 개선하도록 돕는다. Onos는 Aetna를 포함해 상위 6개 건강보험사 중 3곳을 고객으로 두고 있다고 밝혔다. CVS Ventures가 이번 라운드의 전략적 투자자다. Onos의 웹사이트를 보면 ABA 치료, 물질사용장애, 중증 정신질환 등 행동건강 세그먼트를 위한 상품을 갖추고 있는데, 최근 비용이 크게 오른 영역들인 만큼 보험사들이 주목할 만한 분야로 모두 납득이 된다."},{"heading_en":"Funding Announcements","body":"건강정보 교환에 접속하는 온램프 Metriport가 2,600만 달러를 조달했다. Matrix가 라운드를 주도했다. Metriport는 Amazon One Medical, Sollis Health, Color Health를 고객으로 꼽는다."},{"heading_en":"What I'm Reading","body":"Bob Wachter가 지난주 Emanuel, Khosla 등이 쓴 JAMA의 AI 관련 글에 대해 사려 깊은 반박을 썼다. Wachter는 논의의 미묘한 지점까지 들어가, 어떤 경우에는 AI만으로 하는 케어가 사람보다 나을 수 있다는 데 동의한다고 밝힌 뒤, AI 단독 케어가 직면한다고 보는 몇 가지 과제로 넘어간다. 즉 AI는 투입되는 데이터 입력만큼만 좋을 수 있다는 점, 그리고 AI가 의사들이 수행하는 수많은 “도어맨” 업무를 무시한다는 점이다."},{"heading_en":"What I'm Reading","body":"Protege의 Bobby Samuels는 데이터의 어려움과, 임상 AI를 평가할 때 “이 AI는 좋은가?”라는 질문에 답하는 데 내재된 어려움에 관한 Wachter의 지적과 비슷한 주제를 이어받았다."},{"heading_en":"What I'm Reading","body":"Ambulatory Surgery Center News에 실린 이 글도 흥미로웠다. Philadelphia의 두 건강보험사 Independence Blue Cross와 Highmark가 선택적 시술에 대해 환자를 ASC로 유도하려 한다는 내용이다. 지역 병원들은 예상할 만한 반응을 보이고 있다. Jefferson Health는 환자를 ASC로 유도하는 것이 네트워크 계약 위반이라고 주장하며 Independence Blue Cross를 상대로 3,540만 달러의 손해배상 소송을 제기했다."},{"heading_en":"","body":"9월 9일까지 지원해, 가장 유망한 초기 단계 헬스테크 창업자 100명을 위한 초대 전용 모임 Differential에 참석하세요."}]}},"companies":{"doctronic":{"slug":"doctronic","name":"Doctronic","one_liner":"증상을 적으면 AI가 무료로 진단과 치료 계획을 내주고, 처방전이 필요해지는 순간에만 39달러짜리 면허 의사 화상 진료를 파는 소비자용 서비스다.","site":"https://www.doctronic.ai","sells_to":"mixed","seen_in":[{"issue":"26","section":15,"headline":"AI가 진료 상담을 맡는 서비스가 12개월도 안 되어 세 번째 라운드로 4,000만 달러를 받았고, 필자는 공개 수치를 역산해 주간 방문자 30만 명 가운데 2%도 유료 진료로 넘어가지 않는다고 짚었다."}],"card":{"problem":"미국에서는 보험이 없거나 있어도 비용 때문에 진료를 미루는 사람이 많아서, 지금 겪는 증상이 병원에 갈 일인지 판단하는 단계부터 돈이 든다.","solution":"가입도 로그인도 없이 익명으로 증상을 물어보는 무료 AI 상담을 열어 두고 상담마다 진료 기록 형식의 문서를 만들어 주며, 처방전이나 검사 의뢰처럼 사람 의사가 필요해지는 순간에만 화상 진료를 유료로 판다.","price":"AI 상담은 횟수 제한 없이 무료이고, 면허 의사 화상 진료는 구독 없이 1회 39달러다. 보험이 있으면 본인부담금만 낸다.","tags":["AI 상담","원격진료","현금 결제","익명 이용","고용주 판매"],"headline_traction":"2026년 3월에 시리즈 B로 4,000만 달러를 받았다. 12개월이 안 되는 기간에 세 번째 라운드이며 누적 조달액은 6,500만 달러가 넘는다.","watch":"매출 15배 성장과 주간 방문자 30만 명 같은 성장 수치는 전부 회사가 스스로 낸 것이고 제삼자가 확인한 것이 아니다."},"problem":"한국은 전국민 건강보험이 있어서 아프면 동네 의원에 가면 되고 진료비 본인부담금도 몇천 원 수준이다. 미국은 그렇지 않다. KFF 집계에 따르면 2024년 기준으로 65세 미만 인구 가운데 2,670만 명, 비율로는 9.8%가 건강보험이 없다. 무보험 성인의 38.6%는 비용 때문에 필요한 진료나 약을 미루거나 아예 받지 못했다고 답했고, 민간보험이 있는 성인도 17.0%가 같은 답을 했다. 그래서 미국 소비자에게는 진료를 받는 일 자체보다 앞서, 지금 겪는 증상이 병원에 갈 일인지 판단하는 단계부터가 돈이 드는 문제가 되며, 그 판단을 공짜로 대신해 주는 창구에 수요가 생긴다.","solution":"사용자는 첫 화면 가운데에 있는 입력창에 증상을 적고 대화를 시작한다. 가입도 로그인도 필요 없고 익명으로 쓸 수 있으며, AI 상담 자체는 횟수 제한 없이 무료다. AI는 동료 심사를 거친 논문과 진료 지침을 근거로 가능한 진단 목록과 치료 선택지를 제시하고, 상담마다 SOAP 노트라는 진료 기록 형식의 문서를 만들어 준다. 회사는 이 문서를 다른 병원에 그대로 가져가서 쓰라고 안내한다. 처방전이나 검사 의뢰, 진단서가 필요해지는 순간에만 실제 면허 의사와의 화상 진료로 넘어가는데, 값은 1회 39달러이고 구독이 아니며 보험이 있으면 본인부담금만 낸다. 진료를 맡는 의사들은 본사와 분리된 별도 법인인 Doctronic Physicians Group 소속이고, 회사는 50개 주 전체에서 진료가 가능하다고 밝히고 있다.","features":[{"name":"무료 AI 상담","detail":"가입과 로그인 없이 익명으로 증상을 물어볼 수 있고 횟수 제한이 없다. 회사는 값 안내 페이지에서 이 부분을 영원히 0달러라고 표기한다."},{"name":"무료 SOAP 노트","detail":"상담이 끝날 때마다 진단과 치료 계획이 담긴 진료 기록 형식의 문서를 만들어 준다. 회사는 이 문서를 자기가 다니던 병원에 가져가면 진료가 더 빨라진다고 안내한다."},{"name":"39달러 원격진료","detail":"면허 의사와의 화상 진료 1회 값이다. 처방전 발급, 검사 의뢰와 결과 해석, 전문의 의뢰, 진단서 발급이 이 값에 포함되며 별도로 더 받지 않는다고 적혀 있다."},{"name":"유타주 AI 처방 갱신","detail":"이미 다른 의사가 처방한 약 191개 품목에 한해 AI가 30일, 60일, 90일 단위 갱신을 처리한다. 규제 약물과 ADHD 약, 주사제는 대상에서 빠진다."},{"name":"GLP-1 처방 관리 구독","detail":"비만 치료제 처방을 매달 써 주고 필요할 때 의사 화상 진료와 영양사 상담을 붙여 주는 상품이다. 월 99달러와 199달러 두 가지가 있고 약값은 포함되지 않는다."},{"name":"Checkup 컨시어지","detail":"연 1회 건강검진 상품이다. 기본 혈액검사와 흔히 쓰는 약의 재처방이 포함되고, 1만 곳이 넘는 의료기관에서 의무기록을 모아 준다고 밝히고 있다."},{"name":"검색 유입용 건강 정보 페이지","detail":"질환, 증상, 약, 검사, 비교 글로 사이트를 채워 검색에서 사람을 끌어들인다. 사이트맵을 직접 세어 보면 2만 4천 개가 넘고 그 가운데 블로그 글만 1만 2천 개가 넘는다."},{"name":"기업과 보험사 대상 판매","detail":"고용주, 제3자 관리기관, 보험사, 병원을 상대로 직원 한 사람당 월정액을 받는 별도 판매선이 있다. 관련 소개 페이지가 사이트에 스무 개 넘게 있다."}],"differentiator":"K Health은 같은 발상에서 출발했지만 지금은 Mass General Brigham, Mayo Clinic, Cedars-Sinai 같은 병원을 통해 파는 쪽으로 방향을 틀어서, 환자는 이 서비스를 병원 이름으로 만난다. Ada Health와 Buoy Health는 증상을 확인해 주는 데까지만 하고 실제 진료는 다른 곳으로 넘기기 때문에, 무료 상담과 유료 진료를 한 회사 안에서 잇지 못한다. Doctronic은 무료 AI 상담과 자체 의사망을 한 회사 안에 붙여 두고 39달러라는 현금가를 공개 웹에 그대로 걸어 둔 점이 다르지만, 여기까지는 결합 방식의 차이일 뿐이다. 진짜로 다른 한 가지는 유타주와 맺은 규제 완화 협약인데, 사람 의사를 거치지 않고 AI가 처방을 갱신하도록 주 정부가 승인한 첫 사례이며 위에 든 회사 가운데 이것을 가진 곳은 없다.","team":[{"name":"Matt Pavelle","role":"공동 창업자 겸 Co-CEO","background":"패션 이커머스 회사 Moda Operandi의 창립 CTO를 지냈고 렌트 리워드 스타트업 Piñata Rent를 공동 창업했다."},{"name":"Adam Oskowitz","role":"공동 창업자","background":"UCSF 혈관외과 조교수로 지금도 진료하는 외과 의사다."},{"name":"Byron Crowe","role":"최고의료책임자","background":"Solera Health 최고의료책임자와 하버드 의과대학 교원을 지낸 내과 전문의이며 2025년 10월에 합류했다."}],"traction":[{"type":"funding","detail":"Union Square Ventures가 주도한 시드로 500만 달러를 받았다.","when":"2025","source":"Sacra와 Fundz의 회사 정보. 1차 보도자료를 찾지 못해 정확한 발표일은 확인하지 못했다."},{"type":"funding","detail":"Lightspeed Venture Partners가 주도한 시리즈 A로 2,000만 달러를 받았다. Union Square Ventures, Tusk Ventures, HF0가 참여했고 Fei-Fei Li가 엔젤로 들어왔다.","when":"2025-09","source":"PR Newswire 보도자료, Lightspeed 투자 소개글"},{"type":"funding","detail":"Abstract와 Lightspeed가 공동 주도한 시리즈 B로 4,000만 달러를 받았다. 12개월이 안 되는 기간에 세 번째 라운드이며 누적 조달액은 6,500만 달러가 넘는다.","when":"2026-03","source":"Business Wire 보도자료, STAT News"},{"type":"regulatory","detail":"유타주 상무부 인공지능정책국과 규제 완화 협약을 맺어, 이미 다른 의사가 처방한 약 191개 품목에 한해 AI가 처방 갱신을 처리하는 12개월 파일럿을 시작했다. 협약 조건으로 갱신 문서에 이름이 들어가는 면허 의사를 두어야 하고 AI 위험을 포함한 의료과실보험을 유지해야 한다.","when":"2026-01","source":"유타주 상무부 보도자료, Fierce Healthcare, Deseret News"},{"type":"regulatory","detail":"유타주 의료면허위원회 위원 14명 가운데 11명이 이 파일럿을 즉시 중단하라는 서한을 보냈으나 주 상무부가 요청을 기각했고 파일럿은 계속되고 있다.","when":"2026-04","source":"KUER, Utah News Dispatch"},{"type":"revenue","detail":"시리즈 A를 마감한 뒤 6개월 안에 매출이 15배 늘어 연환산으로 8자리, 즉 1,000만 달러 이상이 되었다고 밝혔다.","when":"2026-03","source":"회사 보도자료(Business Wire). 제삼자가 확인한 수치가 아니다."},{"type":"traffic","detail":"주간 순방문자가 30만 명이 넘는다고 밝혔다.","when":"2026-03","source":"회사 보도자료(Business Wire). 제삼자가 확인한 수치가 아니다."},{"type":"traffic","detail":"사이트맵을 직접 세어 보면 검색 유입용 건강 정보 페이지가 2만 4천 개가 넘는다. 방문자 대부분이 진료를 사러 온 것이 아니라 검색으로 들어온 사람이라는 뜻이다.","when":"2026-09","source":"https://www.doctronic.ai/sitemap.xml 의 하위 사이트맵 19개를 직접 집계"},{"type":"partnership","detail":"병원, 제3자 관리기관, 자가보험 고용주와 공동 브랜드 제휴를 맺고 있다고 밝혔다.","when":"2026-03","source":"회사 보도자료를 옮긴 The AI Insider 기사. 제휴처 이름은 공개되지 않았다."}],"caveats":"성장 수치는 전부 회사가 낸 것이고 제삼자가 확인한 것이 아니다. 15배 성장, 주간 방문자 30만 명, 연환산 매출 1,000만 달러가 모두 여기에 해당한다. 뉴스레터 필자가 계산한 2% 미만이라는 전환율은 매출 전액이 39달러 진료에서 나온다고 가정한 역산인데, 실제로는 월 99달러와 199달러짜리 GLP-1 구독과 기업 대상 매출이 섞여 있으므로 진료 건수는 더 적고 전환율은 더 낮아질 가능성이 크다. 회사가 재방문 진료가 세 배 가까이 늘었다고 밝힌 점을 감안하면 월 21,000건이 21,000명을 뜻하지도 않는다. 회사가 내세우는 치료 계획 일치율 99.2%는 시리즈 A 발표 때 쓰던 수치가 그대로 다시 쓰인 것으로 보이며, 근거가 되는 연구는 회사 지분을 가진 사람들이 쓴 medRxiv 사전 공개 논문이고 대상도 기존 웹사이트 챗봇이다. 여기에 더해 펜실베이니아대학교의 Eric Bressman은 회사가 내놓은 검증 연구에서 원격진료 사례 500건을 놓고 AI와 사람 의사의 판단이 일치한 비율이 80%에 그쳤다고 지적했다. 99.2%와 80%가 모두 회사 쪽 자료에서 나온 수치이므로 어느 것을 인용하느냐에 따라 그림이 완전히 달라진다. 뉴스레터가 인용한 Endpoints News의 체험기는 기자가 물리치료사 의뢰를 받으려고 39달러 진료를 직접 써 본 기록인데, 경험이 일관되지 않았고 Matt Pavelle 대표도 개선이 필요하다는 점을 인정했다고 매체가 정리했다. 보안업체 Mindgard는 공개된 챗봇에 존재하지 않는 규제 공지를 만들어 넣어, 옥시콘틴 표준 용량의 세 배를 제시하게 만들었다고 발표했다. 회사와 유타주는 그것이 실제 환자 처방을 처리하는 운영 환경이 아니라고 반박했다. JAMA Health Forum은 유타주 협약이 회사에 환자 의무기록 보관과 제공 의무를 면제해 주고, 이용약관은 정확성과 그로 인한 피해에 대한 책임을 부인한다고 지적했다. 유타주 의료면허위원회 위원장 Alan Smith는 사망자가 나올 때까지 아무 조치도 취해지지 않을까 두렵다고 말했고, 미국의사협회도 처방 갱신이 단순히 확인만 하고 넘어갈 일이 아니라고 논평했다. Forbes는 2026년 7월 기사에서 처방 결정의 72%를 AI가 스스로 처리했고 그 가운데 3%는 나중에 사람 의사가 뒤집었다고 전했는데, 본문을 직접 확인하지 못해 참고로만 둔다. 앱스토어 설명 맨 끝과 회사 소개 페이지 하단에는 Doctronic이 AI 의사이지 면허 의사가 아니며 의료 행위를 하지 않고 의학적 조언을 제공하지 않는다는 문구가 붙어 있어, AI 의사라는 마케팅 표현과 어긋난다. 사이트 안에서도 표기가 갈린다. 진료비는 39달러와 40달러가 함께 쓰이고, 의사 연결 대기 시간은 30분 이내, 평균 15분, 평균 5분이 페이지마다 다르게 적혀 있다. 앱 평가 수가 매우 적어서(아이폰 23개, 구글 플레이 35개, 설치 1천 회 이상) 실제 사용은 앱이 아니라 웹에 몰려 있다고 보아야 한다.","for_us":"가장 눈여겨볼 대목은 낮은 전환율이 아니라 그 분모다. 주간 30만 명이 AI에게 건강을 물어보려고 찾아오는데 그 가운데 2%도 유료 진료로 넘어가지 않는다면, 무료로 물어볼 창구에 대한 수요가 진료 수요보다 훨씬 크다는 뜻이다. 우리는 진료를 팔 이유가 없으므로 이 수요가 그대로 앱을 열 이유가 된다. 설계에서 가져올 것이 세 가지 있다. 첫째, 가입도 로그인도 요구하지 않고 익명으로 바로 물어보게 한 진입 방식이다. 둘째, 상담 결과를 SOAP 노트라는 문서로 만들어 주고 그것을 자기가 다니던 병원에 가져가라고 안내하는 방식인데, 답변의 역할을 정보 제공과 기록 정리로 묶어 두면 진단이나 처방으로 읽히지 않게 하면서도 사용자에게 손에 잡히는 결과물을 남길 수 있다. 셋째, 면책 문구를 앱 설명과 서비스 안에 명시적으로 붙여 둔 방식이다. 증상과 검진 수치, 복용 중인 약에 대해 물어보는 상담 창구는 3개월 안에 소프트웨어만으로 붙일 수 있고, 우리 앱에는 이미 검진 수치와 식단 기록이 있으므로 물어볼 재료도 갖춰져 있다. 다만 트래픽 엔진인 검색 유입용 2만 페이지는 앱에서 그대로 따라 할 수 없는 부분이고, 유타주 규제 협약이나 50개 주 의사망은 3개월과 소프트웨어 인력이라는 조건 밖에 있으므로 제외한다.","screenshots":[{"file":"doctronic_home.png","caption":"첫 화면 가운데에 증상 입력창 하나만 놓여 있고, 그 아래에 무료이고 익명이며 의사들이 만들었다는 문구가 붙어 있다. 위쪽에는 39달러 방문당 결제와 모든 보험을 받는다는 안내가 함께 적혀 있다.","from":"https://www.doctronic.ai"},{"file":"doctronic_how.png","caption":"AI 의사가 어떻게 작동하는지 네 단계로 설명하는 페이지다. 무료 AI 상담에서 면허 의사 화상 진료로 넘어가는 지점이 어디인지, 대기 시간과 값이 얼마인지 보여 준다.","from":"https://www.doctronic.ai/how-your-ai-doctor-works/"},{"file":"doctronic_pricing.png","caption":"값 안내 페이지다. AI 상담은 영원히 0달러, 면허 의사 진료는 39달러 또는 보험 본인부담금, 기업은 직원 한 사람당 월정액으로 세 갈래를 나눠 놓았다.","from":"https://www.doctronic.ai/quality-care-in-seconds-pricing-that-makes-sense/"},{"file":"doctronic_ios.png","caption":"미국 아이폰 앱스토어 페이지다. 무료 앱이고 2025년 11월에 나왔으며 평점 4.4에 평가가 23개뿐이어서, 실제 사용이 앱이 아니라 웹에 몰려 있음을 보여 준다.","from":"https://apps.apple.com/us/app/doctronic/id6753094320"}],"sources":[{"title":"Doctronic 공식 사이트 첫 화면","url":"https://www.doctronic.ai","note":"무료와 익명 상담, 39달러 방문당 결제, 50개 주 진료 가능이라는 핵심 문구를 확인했다."},{"title":"Quality Care in Seconds, Pricing That Makes Sense","url":"https://www.doctronic.ai/quality-care-in-seconds-pricing-that-makes-sense/","note":"AI 상담 0달러, 의사 진료 39달러, 기업용 월정액이라는 세 갈래 값 구조를 확인했다."},{"title":"How Your AI Doctor Works","url":"https://www.doctronic.ai/how-your-ai-doctor-works/","note":"증상 입력에서 의사 연결까지의 네 단계 흐름과 평균 대기 15분이라는 표기를 확인했다."},{"title":"Doctronic Resource Center","url":"https://www.doctronic.ai/resource-center/","note":"무료와 유료의 경계, 진단서가 39달러 진료에 포함된다는 점, 로그인 없이 쓸 수 있다는 점을 확인했다."},{"title":"GLP-1 처방 관리 값 안내","url":"https://www.doctronic.ai/glp-99/","note":"월 99달러 구독이며 약값은 포함되지 않는다는 문구를 확인했다. 199달러 상품도 같은 형식으로 따로 있다."},{"title":"Doctronic Physicians Group","url":"https://www.doctronicpg.com/","note":"실제 진료를 맡는 의사들이 본사와 분리된 별도 법인 소속이며 50개 주에서 진료한다는 설명을 확인했다."},{"title":"Doctronic 사이트맵","url":"https://www.doctronic.ai/sitemap.xml","note":"하위 사이트맵 19개를 직접 세어 검색 유입용 페이지가 2만 4천 개가 넘는다는 것을 확인했다."},{"title":"Doctronic 아이폰 앱","url":"https://apps.apple.com/us/app/doctronic/id6753094320","note":"무료 SOAP 노트 제공, 평균 대기 5분, 평점 4.4에 평가 23개, 그리고 의료 행위를 하지 않는다는 면책 문구를 확인했다."},{"title":"Doctronic 안드로이드 앱","url":"https://play.google.com/store/apps/details?id=ai.doctronic.app","note":"설치 1천 회 이상, 평점 4.2에 리뷰 35개, 본사 주소가 뉴욕이라는 것을 확인했다."},{"title":"Doctronic Raises $40M Series B (Business Wire)","url":"https://www.businesswire.com/news/home/20260324814372/en/Doctronic-Raises-$40M-Series-B-Following-Breakthrough-as-First-AI-to-Legally-Renew-Prescriptions-in-the-U.S.","note":"시리즈 B 4,000만 달러, 주도 투자사, 15배 성장과 주간 방문자 30만 명이라는 회사 발표 수치를 확인했다."},{"title":"Doctronic raises $40 million as race to apply AI in clinical care heats up (STAT News)","url":"https://www.statnews.com/2026/03/23/ai-doctor-startup-doctronic-raises-40-million/","note":"누적 조달 6,500만 달러와 올해 매출 1,000만 달러 전망을 확인했다. 유료 구독 기사라 본문 일부만 열람했다."},{"title":"Doctronic Raises $20 Million Series A (PR Newswire)","url":"https://www.prnewswire.com/news-releases/doctronic-raises-20-million-series-a-to-bring-private-and-personalized-ai-doctor-to-the-masses-302556195.html","note":"2025년 9월 시리즈 A 2,000만 달러와 참여 투자자 명단을 확인했다."},{"title":"Investing in Doctronic (Lightspeed Venture Partners)","url":"https://lsvp.com/stories/investing-in-doctronic-ai-healthcares-24-7-digital-doctor/","note":"창업자 두 사람의 경력과 투자사의 판단 근거를 확인했다."},{"title":"Doctronic AI Appoints Dr. Byron Crowe as Chief Medical Officer","url":"https://www.businesswire.com/news/home/20251015771722/en/Doctronic-AI-Appoints-Dr.-Byron-Crowe-as-Chief-Medical-Officer-to-Lead-Next-Stage-of-Clinical-Innovation","note":"최고의료책임자 임명과 이전 경력을 확인했다."},{"title":"Utah and Doctronic Announce Groundbreaking Partnership for AI Prescription Medication Renewals","url":"https://commerce.utah.gov/2026/01/06/news-release-utah-and-doctronic-announce-groundbreaking-partnership-for-ai-prescription-medication-renewals/","note":"유타주 규제 완화 협약의 공식 발표다. 직접 열람은 차단되어 검색 결과 요약과 다른 보도로 내용을 확인했다."},{"title":"Utah tests AI for routine medication refills through regulatory relief program (Fierce Healthcare)","url":"https://www.fiercehealthcare.com/ai-and-machine-learning/doctronic-partners-utah-ai-sandbox","note":"규제 샌드박스의 범위와 제외 약물, 안전 장치를 확인했다."},{"title":"Utah dismisses medical board call to halt its pioneering AI prescription program (KUER)","url":"https://www.kuer.org/health/2026-04-28/utah-dismisses-medical-board-call-to-halt-its-pioneering-ai-prescription-program","note":"의료면허위원회의 중단 요청과 주 정부의 기각, 1단계에서는 면허 의사가 모든 처방 결정을 검토한다는 해명을 확인했다."},{"title":"New tech, familiar problems (Endpoints News)","url":"https://endpoints.news/new-tech-familiar-problems/","note":"뉴스레터가 인용한 Ngai Yeung 기자의 2026년 3월 26일 체험기다. 물리치료사 의뢰를 받으려고 39달러 진료를 써 봤으나 경험이 일관되지 않았고 대표도 개선 필요를 인정했다는 내용이다. 유료 구독 벽 때문에 도입부와 매체 요약만 확인했다."},{"title":"Is AI ready to refill prescriptions? Doctors are wary of Utah's automated program (KUER)","url":"https://www.kuer.org/health/2026-07-06/is-ai-ready-to-refill-prescriptions-doctors-are-wary-of-utahs-automated-program","note":"유타주 의료면허위원장의 발언과, 회사 검증 연구에서 사람 의사와의 일치율이 500건 기준 80%였다는 펜실베이니아대학교 Eric Bressman의 지적을 확인했다."},{"title":"Here Are 3 AI Companies Betting They Can Replace Doctors (Forbes)","url":"https://www.forbes.com/sites/jessepines/2026/07/24/here-are-3-ai-companies-betting-they-can-replace-doctors/","note":"처방 결정의 72%를 AI가 자율로 처리했고 그중 3%를 사람 의사가 뒤집었다는 수치가 나온 기사다. 본문을 직접 열람하지 못해 참고용으로만 두었다."},{"title":"AI doctor Doctronic raises $40M Series B, but faces controversy (Telecare Aware)","url":"https://telecareaware.com/ai-doctor-doctronic-raises-40m-series-b-but-faces-controversy-on-autonomous-rx-renewals-in-utah-and-effectiveness-claims/","note":"임상 검증 방식에 대한 JAMA Health Forum의 지적과 책임 소재 문제를 확인했다."},{"title":"Utah's new medical chatbot can be easily hacked to give dangerous medical advice (Mindgard)","url":"https://mindgard.ai/blog/doctronic-is-now-accepting-new-patients-and-unsafe-instructions","note":"공개 챗봇을 조작해 옥시콘틴 용량을 세 배로 제시하게 만든 실험을 확인했다."},{"title":"The Saga of Utah's Rx Refill Bot (MedCity News)","url":"https://medcitynews.com/2026/03/utah-prescription-medication-ai-doctronic-mindgard/","note":"보안 실험이 운영 환경이 아닌 공개 챗봇 대상이었다는 회사와 주 정부의 반박을 확인했다."},{"title":"Key Facts about the Uninsured Population (KFF)","url":"https://www.kff.org/uninsured/fact-sheet/key-facts-about-the-uninsured-population/","note":"2024년 기준 무보험 인구 2,670만 명과 비용 때문에 진료를 미룬 비율을 확인했다."},{"title":"K Health 공식 사이트","url":"https://khealth.com/","note":"지금은 Mass General Brigham, Mayo Clinic, Cedars-Sinai 등 병원을 통해 판매하는 구조로 바뀌었음을 확인했다."},{"title":"Buoy Health 공식 사이트","url":"https://www.buoyhealth.com/","note":"무료 증상 확인 도구까지만 제공하고 진료는 다른 곳으로 넘긴다는 점을 확인했다."}]},"emed":{"slug":"emed","name":"eMed","one_liner":"고용주를 통해 직원에게 비만 치료제(GLP-1)를 공급하고, 중간에 그만두지 않도록 관리해 주는 회사다.","site":"https://www.emed.com","sells_to":"mixed","seen_in":[{"issue":"26","section":17,"headline":"장수 의료(롱제비티) 기관으로 소개된 eMed가 기업가치 20억 달러가 넘는 조건으로 2억 달러를 조달했고, 보험 중개 회사 Aon이 라운드를 주도했으며, 환자 순응도 90%를 상품의 근거로 내세웠다."}],"card":{"problem":"미국에서는 일하는 사람 대부분이 회사를 통해 건강보험에 들기 때문에, 비만 치료제(GLP-1)를 쓰는 직원이 늘면 그 비용이 곧바로 고용주의 지출로 잡힌다. 그런데 1년 안에 절반이 넘는 사람이 약을 끊기 때문에 고용주는 결과가 남지 않은 채 약값만 치르게 된다.","solution":"eMed는 고용주와 계약해 직원에게 집에서 하는 채혈 검사와 처방, 주 1회 체크인을 묶어 공급하고, 중간에 그만두지 않도록 관리하는 대가를 받는다. 직원의 체중 감량과 복약 지속이 목표에 못 미치면 받는 돈을 깎겠다고 내걸었다.","price":"고용주를 거치는 경로는 상품마다 직원이 내는 돈이 다르고, 개인이 직접 가입하면 최초 검사비 49달러에 월 회비 149.99달러와 약값 월 149.99달러가 따로 붙어 매달 300달러 정도가 든다.","tags":["비만 치료제","고용주 판매","자가 채혈","원격진료","복약 관리"],"headline_traction":"2026년 3월에 기업가치 20억 달러가 넘는 조건으로 시리즈 A 2억 달러를 조달했고, 보험 중개 회사 Aon이 라운드를 주도했다.","watch":"상품의 근거로 내세우는 순응도 90%는 원래 프로그램 잔류율을 다른 이름으로 바꿔 적은 것이며, 회사가 스스로 낸 수치이고 제삼자가 검증하지 않았다."},"problem":"미국에서는 일하는 사람 대부분이 회사를 통해 건강보험에 든다. 폭스비즈니스 보도에 따르면 미국인의 60% 이상이 직장을 통해 의료 혜택을 받는다. 그래서 비싼 약을 쓰는 직원이 늘면 그 비용이 곧바로 고용주의 지출로 잡힌다. GLP-1 계열 비만 치료제는 체중을 뺀 뒤에도 계속 써야 하는 약이라, 한 번 쓰기 시작하면 회사가 해마다 떠안는 고정 항목이 된다. 더 곤란한 대목은 돈을 낸 만큼 결과가 남지 않는다는 점이다. 과체중이거나 비만인 성인 12만 5,474명의 실사용 기록을 본 연구(JAMA Network Open, 2025년 1월)에서는 1년 안에 53.6%가 약을 끊었고, 당뇨가 없는 사람만 따로 보면 64.8%가 끊었다. 2년으로 늘리면 당뇨가 없는 사람의 84.4%가 끊었다. 중간에 그만두면 빠진 체중이 대체로 되돌아오므로 고용주는 결과 없이 약값만 치른 셈이 된다. 실제로 아직 절반이 넘는 고용주가 이 약을 보장 항목에 넣지 않았다. Mercer 조사에 따르면 직원 500명 이상 고용주 가운데 체중 감량 약을 보장하는 곳은 2024년 기준 44%다. 한국은 전국민 건강보험이 있고 비만 치료제는 급여 대상이 아니어서 개인이 자기 돈으로 사기 때문에, 이 부담이 회사의 문제로 넘어오지 않는다.","solution":"고용주가 계약하면 직원은 eMed 앱으로 등록한다. 집으로 채혈 키트가 배송되고, 직원이 스스로 피를 뽑아 보내면 당화혈색소, 크레아티닌, 고감도 CRP, 감마지티피, 지질 검사, 비타민 B12 여섯 가지를 측정한다. 그 결과를 계약 의료진이 검토해 약을 쓸 수 있는지 판정하고 처방까지 내린다. 약은 위고비 주사와 위고비 알약, 젭바운드처럼 FDA 허가를 받은 정품만 쓰며, 약국 급여를 중개하는 사업자(PBM)를 거치지 않고 직접 조달하기 때문에 중간 마진이 붙지 않는다고 밝힌다. 처방 뒤에는 주 1회 체크인, 월 1회 진료 상담, 부작용에 대비한 상비약 꾸러미, 6개월과 12개월 시점의 재검사가 이어진다. 고용주에게는 직원의 체중 감량과 복약 지속을 보증하고 목표에 못 미치면 받는 돈을 깎겠다고 내걸었다. 소비자가 직접 가입하는 상품도 따로 있는데, 최초 검사비 49달러를 한 번 내고 월 회비 149.99달러를 내며, 약값은 월 149.99달러부터 별도로 붙는다. 셋을 합치면 첫 달에 350달러 가까이 들고 그 뒤로도 매달 300달러가 나간다. 보험은 받지 않는다.","features":[{"name":"가정용 채혈 스크리닝 키트","detail":"집으로 배송된 키트로 직접 피를 뽑아 여섯 가지 지표를 검사하고, 그 결과가 나와야 약을 처방받을 수 있다. 다른 병원에서 받은 검사지는 받아 주지 않는다."},{"name":"주 1회 체크인","detail":"앱에서 1분이 채 걸리지 않는 문답으로 체중과 상태를 기록한다. 예약이 필요 없고 언제든 할 수 있다."},{"name":"부작용 대응 상비약 꾸러미","detail":"메스꺼움처럼 흔한 부작용에 쓸 일반의약품을 프로그램에 포함해 함께 보낸다. 부작용 때문에 그만두는 일을 줄이려는 장치다."},{"name":"PBM을 거치지 않는 약 직접 조달","detail":"약국 급여를 중개하는 사업자를 빼고 직접 조달하는 경로로 정품 약을 들여온다고 밝힌다. 고용주에게는 리베이트로 부풀려진 가격이 아니라 정해진 값을 제시한다."},{"name":"성과 보증 계약","detail":"직원의 체중 감량과 복약 지속을 보증하고 목표에 미달하면 고용주가 내는 돈을 깎아 준다. 2026년 3월 조달과 함께 인두제 방식(가입자 1인당 정액 계약)도 새로 내놓겠다고 밝혔다."},{"name":"회사 부담이 없는 자율 가입형 상품","detail":"고용주가 계약서에 서명만 하면 회사 비용은 0달러이고, 직원이 할인 코드를 받아 월 149.99달러에 약을 사는 방식이다. 기존 약국 급여 계약을 바꾸지 않아도 된다."},{"name":"의료 종사자 전용 요금제","detail":"병원과 요양 시설 종사자를 겨냥한 별도 상품이다. 고용주가 대상자 1인당 월 25달러를 내고, 직원이 약값과 임상 지원 명목으로 월 99달러를 낸다."},{"name":"생활 습관 지원 연계","detail":"Thrive Global과 손잡고 행동 변화와 생활 습관 지도를 프로그램에 붙였다."}],"differentiator":"판매 경로에서 갈린다. eMed는 소비자 광고가 아니라 보험 중개 회사 Aon, 복리후생 운영 회사 Alight, 약국 급여 사업자 CVS Health를 통해 고용주에게 들어간다. Hims & Hers나 Ro처럼 소비자에게 직접 팔아 성장한 원격진료 회사와는 들어가는 경로 자체가 다르다. 약을 다루는 방식도 다르다. 약사가 자체 조제한 복제 성분(컴파운딩 세마글루타이드)을 쓰지 않고 FDA 허가를 받은 정품만 쓴다고 못 박는데, 2026년 초 FDA가 조제 GLP-1을 광고한 원격진료 회사 30곳에 경고장을 보냈을 때 eMed가 명단에 없었던 것도 이 선택과 맞물린다. 성과를 보증하고 못 지키면 대금을 깎겠다는 계약도 흔치 않다. 다만 '순응도 90%'라는 주장 자체는 이 분야에서 특별하지 않다. Omada는 12주 94%와 24주 84%를, Hims & Hers는 6개월 75%를 내걸고, Noom은 구독 유지 기간을 순응도처럼 제시한다. 셋 다 검증받은 수치가 아니고 셋 다 분모가 유리하게 잡혀 있다. Omada는 스스로 GLP-1을 쓴다고 밝히고 관리 프로그램에 등록한 사람만 셌고, Hims & Hers는 6개월 시점 설문에 응답한 사람만 셌다. eMed는 그 분모를 아예 밝히지 않았다.","team":[{"name":"Dr. Patrice A. Harris","role":"공동창업자, eMed, LLC(모회사) 전 CEO","background":"미국의사협회(AMA) 174대 회장을 지낸 정신과 의사이며, 흑인 여성으로는 처음으로 그 자리에 올랐다. 2020년 eMed를 공동창업했다. 2026년 8월 Nemours Children's Health로 옮겼다."},{"name":"Linda Yaccarino","role":"eMed Population Health CEO","background":"X(옛 트위터)의 CEO를 지냈고, X를 떠난 지 몇 주 만인 2025년 8월 5일 eMed에 왔다. 다만 그가 맡은 곳은 창업자 Harris가 이끌던 모회사가 아니라 GLP-1 사업을 하는 자회사다."},{"name":"Tom Brady","role":"Founding Chief Wellness Officer","background":"슈퍼볼 7회 우승 미식축구 선수 출신이다. 2026년 1월 12일 최고 웰니스 책임자로 선임됐고 3월 조달 라운드에도 투자자로 참여했다."},{"name":"Dr. Dyan Hes","role":"Chief Medical Officer","background":"소아과 전문의이자 미국비만의학회 인증 의사로 비만 의학과 소아과에서 25년 넘게 일했다. 뉴욕에서 Gramercy Pediatrics를 세웠고 지금은 Highline Modern Medicine의 의료 원장이다. 2025년 9월 30일 선임됐다."},{"name":"Michael Ferro Jr.","role":"영국 지주회사의 실질 지배자로 등기된 인물","background":"Merge Healthcare를 세우고 Tribune Publishing(옛 Tronc) 회장을 지낸 사업가다. 영국 기업등기소에 eMed Healthcare Group Holdings의 '중대한 지배력을 가진 자'로 2023년 8월 등록돼 있고, 연락처는 마이애미의 eMed 본사로 적혀 있다. 그런데 eMed 웹사이트의 경영진 명단에는 이 사람도, 같은 소송에서 최고 경영 책임자(Executive Chairman)로 지목된 Justin Dearborn도 나오지 않는다."},{"name":"Eric Larsen","role":"회사 소개 페이지의 팀 명단에 오른 인물","background":"UnitedHealth Group에서 부사장(EVP)을 지냈다."},{"name":"David Moore","role":"회사 소개 페이지의 팀 명단에 오른 인물","background":"Novo Nordisk에서 부사장(EVP)을 지냈다. Novo Nordisk는 위고비를 만든 제약사다."}],"traction":[{"type":"funding","detail":"기업가치 20억 달러가 넘는 조건으로 시리즈 A 2억 달러를 조달했다. 보험 중개 회사 Aon이 주도했고 Tom Brady, Joe Lonsdale, Antonio Gracias, Tom Ricketts, Jeff Aronin, Ara Cohen, R.J. Melman, Linda Yaccarino가 참여했다. 돈은 인공지능 플랫폼 개발과 인두제 계약을 감당할 자기자본에 쓴다고 밝혔다.","when":"2026-03","source":"PR Newswire 보도자료"},{"type":"funding","detail":"Aon이 eMed에 전략적 투자를 하고 자사 고용주 고객에게 eMed를 공급하기로 했다. 투자 금액은 공개되지 않았다.","when":"2025-08","source":"PR Newswire 보도자료"},{"type":"regulatory","detail":"Abbott의 BinaxNOW 가정용 코로나 검사가 FDA 긴급사용승인을 받았다. 화상으로 사람이 지켜보며 진행하는 첫 가정용 신속 검사였고, 그 화상 감독 플랫폼이 eMed의 것이었다. 2021년 1월 23일 개당 25달러로 판매를 시작했다.","when":"2020-12","source":"Abbott 보도자료, eMed 보도자료"},{"type":"customers","detail":"코로나 시기에 오하이오주, 콜로라도주, 버지니아주, 매사추세츠주와 검사 키트 공급 계약을 맺었고 United Airlines, American Airlines, Delta, Procter & Gamble, Quest Diagnostics와도 손잡았다. 2023년에는 미국 국립보건원(NIH)의 '집에서 검사하고 바로 치료받기' 시범 사업에서 원격진료를 맡았다. 회사는 누적 이용자를 600만 명 이상이라고 밝힌다.","when":"2021","source":"eMed 및 파트너사 보도자료"},{"type":"customers","detail":"영국 Babylon Health의 사업을 법정관리 절차에서 인수했다. NHS 환자를 보는 디지털 1차 진료 기관 GP at Hand가 여기 포함된다. 인수 대금은 현금 679만 파운드였다. 널리 인용되는 '50만 파운드'는 잔여 지분 값일 뿐이다. 인수한 사업은 2024년 한 해 4,290만 파운드의 매출을 냈다.","when":"2023-10","source":"eMed 보도자료, 영국 기업등기소 감사보고서"},{"type":"customers","detail":"나스닥 상장사 Science 37 Holdings를 주당 5.75달러, 약 3,800만 달러에 공개매수로 인수하고 상장을 폐지했다.","when":"2024-03","source":"미국 증권거래위원회(SEC) 제출 서류"},{"type":"revenue","detail":"영국 법인의 감사보고서상 2024년 매출은 5,140만 파운드, 세후 손실은 2,040만 파운드였고 직원은 326명이었다. 미국 쪽 매출과 인원은 비상장이라 공개된 자료가 없다.","when":"2024-12","source":"영국 기업등기소 제출 서류"},{"type":"partnership","detail":"미국 최대 약국 급여 사업자 CVS Health와 손잡고 고용주가 비용을 통제하며 GLP-1을 제공할 수 있는 경로를 만들었다.","when":"2026-02","source":"eMed 뉴스 페이지가 인용한 Axios 보도"},{"type":"partnership","detail":"복리후생 운영 회사 Alight, 그리고 Crux와 제휴해 고용주 대상 GLP-1 공급을 넓히기로 했다.","when":"2026-08","source":"Business Wire 보도자료"}],"caveats":"이 회사에서 가장 중요한 수치인 '순응도 90%'는 회사가 스스로 낸 것이고, 제삼자가 검증한 자료는 없다. 확인한 내용을 순서대로 적는다.\n\n첫째, 같은 숫자가 자리마다 다른 이름을 달고 있다. 회사 앱 안내 페이지는 '10명 중 9명이 처방받은 치료 계획을 따른다', '10명 중 9명이 6개월 넘게 프로그램에 남는다'로 적고 출처를 'eMed Population Health Data (2025)'라는 자사 데이터로 밝힌다. 즉 원래는 '프로그램 잔류율'이다. 보도자료는 이것을 '복약 순응도'로 바꿔 적고 업계 평균과 비교했다. 잔류율과 순응도는 다른 것을 세는 지표다.\n\n둘째, 표본 수도 순응도의 정의도 공개되지 않았다. eMed가 유일하게 등록한 연구(영국 ISRCTN12421711)는 eMed가 스스로 의뢰하고 스스로 돈을 대며 연구 책임자도 eMed 직원이고, 단일 기관에서 대조군 없이 뒤돌아보는 방식이며 윤리 심의 대상도 아니다. 결과는 아직 없고 종료 시점은 2027년 4월로 미뤄졌다. 그 연구가 정의한 순응도는 '권고받은 프로그램 활동 가운데 환자가 완료한 비율', 곧 앱 활동 수행률이다. 약을 실제로 얼마나 썼는지를 재는 지표가 아니다.\n\n셋째, 회사가 내세운 독립 검증은 아직 존재하지 않는다. eMed는 PitchBook에 '영국 회원 8,000명 이상을 유니버시티 칼리지 런던의 John Deanfield 교수가 독립 분석했고 6개월 91% 이상이 나왔으며 Nature Medicine에 심사 중, 몇 주 안에 게재'라고 밝혔다. 그로부터 다섯 달 반이 지난 2026년 9월 현재 PubMed, Europe PMC, Crossref, Nature Medicine 어디에도 그 논문이 없다. 게다가 같은 연구의 표본 수가 자료마다 8,000명, 1만 3천 명, 1,000명으로 다르게 적혀 있다. PitchBook의 애널리스트는 이 주장이 '마땅히 갖춰야 할 동료 심사와 임상 검증을 갖추지 못했다'고 평했다.\n\n넷째, '업계 평균의 두 배'는 성립하지 않는다. 시기와 지표를 맞춘 최신 자료로 보면 Prime Therapeutics의 2024년 상반기 코호트(3만 3,607명, JMCP 2026)에서 1년 지속률이 60.9%, 복약 순응도(PDC 80% 이상)가 55.5%였고, 매사추세츠 메디케이드 코호트(7,493명, JMCP 2026)에서는 6개월 시점 지속률 60.8%, 순응도 60.1%였다. 이 기준으로 보면 90%는 두 배가 아니라 1.3배에서 1.5배 수준이다. '두 배'가 되려면 약이 품귀였던 2021년에서 2023년 사이의 12개월 지속률을 끌어와야 한다. 게다가 이탈은 초반에 몰려 있어서 6개월로 끊어 재면 숫자가 유리해진다. 1년 이탈의 71%가 첫 6개월에 일어난다.\n\n다
