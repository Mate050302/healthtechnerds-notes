es":[],"notes":[]},{"heading_ko":"읽을거리: LEAD 모델과 이중수급자","heading_en":"What I'm Reading: Will The New CMS ACO Model LEAD To Better Care For High-Need Medicare Beneficiaries?","skip":null,"summary":"CMS 산하 혁신 조직의 또 다른 새 모델이 메디케어와 메디케이드를 함께 받는 사람들에게 어떤 어려움을 겪을 수 있는지 짚은 기고를 소개한다. 핵심 지적은 이전 모델에 있던 형평성 기반 지급 조정을 이 모델이 없앴다는 점이다.","insight":null,"signal":null,"author":[],"experts":[{"who":"William Roberts, José Figueroa","role":"Health Affairs Forefront에 실린 관점 글의 저자들이며, 원문은 이들의 소속이나 이해관계를 밝히지 않았다.","claim":"CMMI의 LEAD 모델이 이중수급자 인구와 관련해 어려움을 겪을 수 있다고 본다.","evidence":"이 모델이 REACH 모델에 있던 명시적인 형평성 기반 지불 조정을 없앴다는 점을 근거로 든다."}],"cases":[],"notes":[{"term":"dual eligible","ko":"이중수급자","plain":"메디케어와 메디케이드를 동시에 받는 사람들로, 대개 나이가 많으면서 소득도 낮아 의료 필요가 크고 비용도 많이 든다. 두 제도가 따로 굴러가기 때문에 누가 어디까지 책임지는지가 계속 문제가 된다."},{"term":"equity-based payment adjustment","ko":"형평성 기반 지급 조정","plain":"여건이 나쁜 지역이나 취약한 환자를 맡은 진료 기관에 지급액을 더 얹어 주는 장치다. 이런 조정이 없으면 돌보기 어려운 환자를 맡는 쪽이 손해를 보게 되어, 결국 그런 환자를 피하는 유인이 생긴다는 것이 저자들의 걱정이다."}]},{"heading_ko":"지난 콘텐츠: 주간 정책 브리핑","heading_en":"More from Health Tech Nerds","skip":"promo","summary":"뉴스레터가 같은 주에 낸 정책 브리핑을 소개하는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"지난 콘텐츠: 커뮤니티 브레인 트러스트","heading_en":"More from Health Tech Nerds","skip":"promo","summary":"뉴스레터가 운영하는 커뮤니티 콘텐츠를 소개하는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"지난 콘텐츠: 게스트 포스트","heading_en":"More from Health Tech Nerds","skip":"promo","summary":"외부 필자가 쓴 기고문을 소개하는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"지난 콘텐츠: HTN 라디오","heading_en":"More from Health Tech Nerds","skip":"promo","summary":"뉴스레터가 운영하는 팟캐스트의 최근 회차 네 편을 나열하는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]}],"themes":["pharma-glp1","regulation-cms","medicare-advantage","hospital-health-system","consumer-dtc","digital-health-funding"],"for_later":[]},{"index":"22","date":"2026-03-15","type":"reads","title_en":"Weekly Health Tech Reads 3/15/26","title_ko":"온라인 정신상담 인수와 AI 책임 공백","hook":"병원 체인이 온라인 상담사 6,000명을 사들이고, 필자는 AI 사고의 책임을 물을 법이 아직 없다고 말한다.","tldr":[{"point":"병원 운영사 UHS가 온라인 상담 회사 Talkspace를 약 8억 3,500만 달러에 인수했고, 인수 이유로 꼽은 핵심 자산은 치료사 6,000명 네트워크였다.","note":"이 치료사들은 Talkspace에 고용된 직원이 아니라 계약으로 연결된 사람들이고, 그중에는 자기 진료소를 가진 사람도 있어서 UHS는 이들과 더 깊은 관계를 만들 기회로 봤다."},{"point":"Hims는 조제 GLP-1을 광고하지 않기로 하고 Novo는 소송을 취하하면서 1년 전 깨졌던 파트너십이 되살아났고, 발표 뒤 Hims 주가는 약 52% 올랐다.","note":"조제(compounded) 약은 약국이 성분을 직접 조합해 만드는 약이고, Novo는 예전에 Hims를 불법 대량 조제로 비난했으나 이번 보도자료에는 환자가 여전히 플랫폼을 통해 그 제품에 접근할 수 있다고 적혔다."},{"point":"필자는 AI 시대의 책임 규칙이 정해지려면 앞으로 몇 년간 사고가 더 나야 한다고 말한다.","note":"1916년 MacPherson 판결이 나오기까지 수십 년간 이상하게 결론 난 제조물 사고 판례가 먼저 쌓여야 했다는 법 역사를 근거로 든다."},{"point":"Devoted Health는 임상의 약 700명과 AI 에이전트 5,000개를 두고 있지만 지난해 진료는 20만 건에 그쳐, 필자 계산으로 임상의 한 명이 근무일 하루 1.1건을 본 셈이다.","note":"Devoted는 보험사인데 채용 공고 47건이 케어 딜리버리 조직처럼 읽혀서, 필자는 이 회사가 버추얼 헬스 시스템으로 가고 있다고 본다."},{"point":"개인이 직접 사는 ACA 보험에서 사람들이 빠져나가고 있고, Centene의 ACA 회원은 한 해 40% 줄었으며 HCA는 2026년에 6억~9억 달러의 매출 역풍을 예상한다.","note":"ACA는 직장 보험도 공보험도 없는 사람이 정부 거래소에서 소득에 따라 보조금을 받아 사는 개인 보험이고, 보조금이 없어지면 보험료 전액을 가구가 떠안는다."},{"point":"BetterHelp 회원의 80%는 비용 때문에 현금 결제 모델을 그만두고, Teladoc은 그래서 보험이 적용되는 상담 사업 쪽으로 무게를 옮기고 있다.","note":"미국에서 온라인 상담은 오랫동안 보험을 끼지 않고 매달 자기 돈을 내는 구독으로 팔려 왔다."}],"issue_insight":{"verdict":"yes","summary":"병원과 보험사 사이의 돈 이야기가 대부분인 회차다. 다만 소비자가 자기 돈으로 사는 시장에서는 체중 감량 약과 정신건강 두 곳에서 방향이 뚜렷하게 드러나고, 앱에서 3개월 안에 시험해 볼 만한 것도 몇 가지 보인다.","build":[{"title":"검색을 대신하는 설명 화면","detail":"미국 환자가 온라인에서 스스로 진단하는 흐름을 병원 쪽에서 영상 콘텐츠로 되돌리려는 움직임이 이 인수다. 같은 문제를 소비자 쪽에서 풀어, 사용자가 증상이나 검사 용어를 입력하면 출처를 밝힌 짧은 설명과 병원에 가야 할 기준을 보여 주는 화면을 만들 수 있다.","section":4},{"title":"만성질환 자가 측정 체크인","detail":"Cadence는 한 달에 한 번 사람이 개입하던 원격 모니터링을 AI 에이전트가 대신하는 방향으로 옮겨 간다. 기기 연동 없이 혈압과 혈당, 체중을 직접 입력하게 하고 값이 흐트러질 때 AI가 무엇이 달라졌는지 짚어 주는 체크인은 소프트웨어만으로 만들 수 있다.","section":7},{"title":"상담을 그만둔 사람을 위한 무료 기록 화면","detail":"미국에서 상담 구독을 시작한 사람의 80%가 가격 때문에 그만둔다. 상담을 대신할 수는 없어도, 기분과 수면을 걸음과 함께 기록하고 주 단위로 짧게 정리해 주는 무료 화면은 그만둔 사람이 기댈 자리가 된다.","section":24},{"title":"AI 건강 상담을 넣는다면 공개판 안전장치부터","detail":"Doctronic은 일반 공개 챗봇과 주정부 파일럿용 버전을 나눠 두었고, 안전장치가 약한 공개판이 뚫려 문제가 됐다. 공개 화면에는 답변 범위를 더 좁게 걸고, 출시 전에 일부러 오용해 보는 점검과 제보를 받는 창구를 함께 만들어야 한다.","section":11}],"signal":[{"title":"체중 감량 약은 소비자 직판 플랫폼이 쥐고 있다","detail":"Novo는 1년 전 소송까지 걸었던 Hims와 다시 손을 잡았고 발표 뒤 Hims 주가는 약 52% 올랐다. 제약사가 소비자 직판 플랫폼과 합의해야 했다는 점에서 미국 소비자가 이 약을 어디서 사는지가 드러난다.","section":3},{"title":"자비 부담 상담 구독은 가격에서 무너진다","detail":"BetterHelp 회원의 80%가 비용 때문에 현금 결제 모델을 그만둔다. 미국 소비자가 정신건강에 자기 돈을 쓰기는 하지만 그 지출이 오래 이어지지 않는다는 뜻이다.","section":24},{"title":"개인 보험에서 사람들이 빠져나간다","detail":"Centene의 ACA 회원은 한 해 40% 줄었고 업계 전반도 10%대 후반에서 30%대 중반까지 줄었다. 보험 없이 스스로 부담해야 하는 사람이 늘어나는 방향이다.","section":14}]},"sections":[{"heading_ko":"여는 인사","heading_en":"","skip":"admin","summary":"필자 Kevin이 이번 회차에서 다룰 내용을 한 문단으로 소개하는 인사말이다. UHS의 Talkspace 인수와 Hims·Novo 소식이 이번 주 가장 큰 화제였다고 적었다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"UHS의 Talkspace 인수","heading_en":"BIG NEWS","skip":null,"summary":"병원 운영사가 온라인 정신건강 회사를 통째로 사들인 거래를 다룬다. 무엇을 보고 샀는지, 그리고 그 값이 적정한지를 매출 배수로 따져 보는 것이 이 꼭지의 뼈대다. 필자는 여기서 디지털 헬스 회사의 값어치는 결국 임상 인력에서 나온다는 자기 결론으로 넘어간다.","insight":null,"signal":null,"author":[{"claim":"최고 수준의 임상 조직을 가진 회사가 인수 시장에서 유리한 자리에 있다.","evidence":"UHS가 인수 이유로 꼽은 것이 Talkspace의 치료사 6,000명 네트워크였다는 점을 든다. 다만 계약 관계인 버추얼 치료사 집단이 최고 수준 기준을 충족하는지는 다른 질문이라고 스스로 단서를 단다."},{"claim":"자신이 디지털 헬스 창업자라면 임상 팀을 키우고 수익이 나는 페이어 계약을 찾는 데 자원을 쓰겠다.","evidence":"정신건강 시장과 케어 딜리버리 전반의 인수 흐름을 관찰한 결과라고만 적었고 별도 데이터는 대지 않았다."},{"claim":"몇 해 전 보유 현금보다 낮은 값에 거래되던 사업치고는 괜찮은 결말이다.","evidence":"2026년 매출 전망 약 2억 8,000만 달러, 조정 EBITDA 약 3,200만 달러에 대비한 선행 매출 배수 3배, EBITDA 배수 26배를 계산해 제시했다."}],"experts":[],"cases":[{"name":"United Health Services(UHS)","what":"병원을 운영하며 진료비를 보험사에 청구하는 회사다. 외래 행동건강 부문의 성장이 더뎌 파트너십을 찾던 중 Talkspace가 매각 절차에 들어가자 인수에 나섰다.","scale":"주당 5.25달러, 약 8억 3,500만 달러","note":"버추얼 서비스가 입원 치료 이후 단계를 받아 주는 통로가 되고 그 반대 방향도 된다는 점, Talkspace 회원이 더 젊고 상업보험 비중이 높다는 점을 이유로 들었다.","sells_to":"payer"},{"name":"Talkspace","what":"온라인으로 정신건강 상담을 제공하는 회사다. 2021년 6월 SPAC으로 상장했고 소비자 직접 판매에서 보험 중심 사업으로 옮겨 왔다.","scale":"2026년 매출 전망 약 2억 8,000만 달러, 조정 EBITDA 약 3,200만 달러, 치료사 네트워크 6,000명","note":"치료사들이 회사에 고용된 인력이 아니라는 점이 이 거래의 특이한 대목이다.","sells_to":"mixed"}],"notes":[{"term":"behavioral health","ko":"행동건강","plain":"정신건강 진료와 중독 치료를 함께 묶어 부르는 미국식 표현이다. 한국에서는 정신건강의학과 하나로 묶이지만 미국에서는 보험 상품과 네트워크가 일반 진료와 따로 짜이는 경우가 많아 별도 사업 부문으로 다룬다."},{"term":"step-down","ko":"스텝다운","plain":"입원처럼 강도가 센 치료를 받은 환자를 덜 강한 치료 단계로 내려보내는 것을 말한다. UHS는 자기 병원에서 퇴원한 환자를 Talkspace의 온라인 상담으로 이어 주고, 반대로 온라인 상담에서 상태가 나빠진 사람을 자기 병원으로 받을 수 있다고 봤다."},{"term":"SPAC","ko":"기업인수목적회사","plain":"돈만 모아 껍데기로 먼저 상장한 회사가 비상장 기업과 합병해 그 기업을 상장시키는 방식이다. 정식 상장 절차보다 빠르고 심사가 느슨해 2021년 무렵 디지털 헬스 회사들이 몰려 썼고, 그 뒤 주가가 크게 무너진 사례가 많다."}]},{"heading_ko":"Hims와 Novo의 재결합","heading_en":"Other Top Headlines","skip":null,"summary":"체중 감량 약을 두고 1년 넘게 싸운 제약사와 소비자 직판 플랫폼이 다시 손을 잡았다. 무엇을 주고받았는지와 주가가 어떻게 움직였는지가 이 꼭지의 내용이다. 합의문의 표현이 미묘해서, 광고는 안 하지만 환자는 여전히 그 약에 접근할 수 있다고 적혀 있다.","insight":null,"signal":"Novo는 기만적 마케팅과 불법 대량 조제로 비난하며 소송까지 걸었던 상대와 다시 손을 잡았고, 그 발표로 Hims 주가는 약 52% 올랐다. 같은 기간 Novo는 한 달 사이 23% 내렸다. 제약사가 자기 유통 경로 대신 소비자 직판 플랫폼과 합의해야 했다는 뜻이고, 필자도 이를 Hims 브랜드와 유통 역량의 힘으로 읽는다. 미국 소비자가 체중 감량 약을 어디서 사는지가 이미 플랫폼 쪽으로 기울어 있다는 신호다.","author":[{"claim":"이 사건은 Hims의 브랜드와 유통 역량이 세다는 것을 보여 준다.","evidence":"Novo의 태도가 완전히 뒤집힌 점과 발표 뒤의 주가 흐름을 근거로 들었다."}],"experts":[{"who":"Hunterbrook 공매도 리포트의 저자(이름은 원문에 없다)","role":"Hims 주가 하락에 베팅하는 관점에서 비판 리포트를 낸 쪽이다. 즉 Hims에 우호적이지 않았던 사람이다.","claim":"Hims가 이번에 Novo를 완전히 압도했다.","evidence":"X에 남긴 표현만 인용됐고 근거는 옮겨지지 않았다."}],"cases":[{"name":"Hims & Hers","what":"앱과 웹에서 소비자가 직접 가입해 처방과 약을 받는 회사다. 조제 GLP-1 제품을 광고하지 않기로 합의했다.","scale":"발표 뒤 주가 약 52% 상승, 공매도 잔고 비율 41% 근처","note":"보도자료 표현상 광고만 하지 않을 뿐 환자는 여전히 플랫폼을 통해 그 제품에 접근할 수 있다.","sells_to":"consumer"},{"name":"Novo Nordisk","what":"GLP-1 계열 체중 감량 약을 만드는 제약사다. 파트너십의 대가로 Hims를 상대로 한 소송을 취하하기로 했다.","scale":"지난 한 달간 주가 23% 하락","note":"약 1년 전 같은 파트너십을 맺었다가 몇 주 만에 발을 뺀 전력이 있다.","sells_to":"mixed"}],"notes":[{"term":"compounded GLP-1","ko":"조제 GLP-1","plain":"약국이나 조제 전문 시설이 성분을 직접 조합해 만드는 약이다. 제약사가 만든 정품과 달리 개별 환자를 위한 조제라는 명목으로 유통되며, Novo는 이전에 Hims를 두고 불법 대량 조제라고 비난했다. 한국에는 이런 규모의 조제 유통 시장이 없어서 낯선 개념이다."},{"term":"short interest","ko":"공매도 잔고 비율","plain":"주가가 떨어질 것에 베팅해 빌려서 판 주식이 유통 주식 가운데 얼마나 되는지를 나타내는 수치다. 41%는 시장에 이 회사를 의심하는 세력이 아주 많다는 뜻이다."}]},{"heading_ko":"Elsevier의 Mytonomy 인수","heading_en":"Other Top Headlines","skip":null,"summary":"학술 출판사가 병원용 환자 교육 영상 회사를 사들였다. 인수 명분으로 내건 것이 환자가 온라인에서 스스로 진단하는 흐름과 그로 인한 잘못된 정보다. 규모를 보여 주는 숫자는 병원 70여 곳, 클리닉 200여 곳이라는 도입처뿐이다.","insight":"미국 소비자가 검색으로 스스로 진단하는 흐름은 이미 전제로 깔려 있고, 병원들은 영상 콘텐츠를 사서 그것을 되돌리려 한다. 같은 문제를 소비자 쪽에서 풀어 볼 수 있다. 사용자가 증상이나 검사 결과 용어를 입력하면 출처를 밝힌 짧은 설명과 함께 언제 병원에 가야 하는지 기준을 보여 주는 화면이다. 콘텐츠 정리와 LLM 응답만으로 3개월 안에 만들 수 있고, 지금 앱에 없는 가치다.","signal":null,"author":[],"experts":[],"cases":[{"name":"Elsevier","what":"의학 학술 콘텐츠를 만드는 출판사다. 영상 기반 환자 교육 플랫폼을 사들여 자사 콘텐츠 역량을 넓히려 한다.","scale":"","note":"인수 금액은 원문에 없다.","sells_to":"provider"},{"name":"Mytonomy","what":"병원과 클리닉에 영상 기반 환자 교육 도구를 파는 SaaS 회사다.","scale":"병원 70곳 이상, 클리닉 200곳 이상에서 사용","note":"보도자료는 앞으로 2~3년 안에 대부분의 환자가 온라인에서 스스로 진단하게 되면서 임상의들이 잘못된 정보를 걱정하고 있다고 적었다. 이는 인수 당사자의 주장이고 뒷받침하는 수치는 없다.","sells_to":"provider"}],"notes":[{"term":"patient engagement platform","ko":"환자 인게이지먼트 플랫폼","plain":"병원이 환자에게 시술 설명, 퇴원 후 관리법, 복약 안내 등을 영상이나 메시지로 보내는 도구를 말한다. 환자가 직접 사는 물건이 아니라 병원이 사서 환자에게 내려보내는 도구여서, 소비자는 이런 회사의 이름을 알지 못한다."}]},{"heading_ko":"MedPAC 연례 보고서","heading_en":"Other Top Headlines","skip":null,"summary":"의회 자문기구가 민간 운영 메디케어에 세금이 얼마나 더 들어가는지 계산한 보고서다. 같은 사람을 정부가 직접 관리했을 때와 비교해 14% 더 나간다는 것이 핵심이다. 원인으로 코딩보다 건강한 사람이 몰리는 현상을 앞세운 점이 눈에 띈다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"MedPAC 연례 의회 보고서","what":"메디케어 지불 정책을 의회에 자문하는 기구가 매년 내는 보고서다. 2026년 Medicare Advantage 플랜 지급액이 같은 가입자를 기존 방식으로 두었을 때보다 약 14% 높다고 지적했다.","scale":"2026년 연방정부의 MA 지급액 6,150억 달러, 초과분 약 14%","note":"주된 원인을 유리한 선택으로, 코딩을 이차 요인으로 봤다.","sells_to":"none"}],"notes":[{"term":"Medicare Advantage(MA)","ko":"메디케어 어드밴티지","plain":"미국의 65세 이상 공보험인 메디케어를 민간 보험사가 대신 운영하는 상품이다. 정부는 가입자 한 명당 월 정액을 보험사에 주고, 보험사는 그 돈으로 진료비를 감당하며 남으면 이익으로 가져간다. 한국의 건강보험공단이 하는 일을 민간 회사가 대신 맡고 정부가 인두제로 돈을 주는 구조라고 보면 된다."},{"term":"fee-for-service(FFS) Medicare","ko":"행위별 수가 메디케어","plain":"정부가 민간 보험사를 끼지 않고 진료 건마다 병원에 직접 값을 치르는 원래 방식의 메디케어다. 한국 건강보험이 진료 행위마다 수가를 지급하는 방식과 비슷하다. MedPAC은 같은 사람을 이 방식에 두었을 때 들 비용과 MA 지급액을 견주었다."},{"term":"favorable selection","ko":"유리한 선택","plain":"상대적으로 건강해서 돈이 덜 드는 사람들이 민간 플랜에 몰리는 현상이다. 정부는 가입자의 진단 기록을 보고 돈을 주는데, 실제로는 그 기록이 말하는 것보다 건강한 사람이 모이면 보험사에 남는 돈이 커진다. 보험사가 진단 코드를 부풀리는 코딩 문제와는 원인이 다르다."}]},{"heading_ko":"MUSC의 프라이머리 케어 그룹 인수","heading_en":"Other Top Headlines","skip":null,"summary":"사우스캐롤라이나에서 가장 큰 독립 의원 그룹이 대학 병원 산하로 들어갔다. 이 그룹은 4년 전에 위험을 통째로 떠안는 성과 기반 계약으로 옮겨 갔던 곳이다. 필자는 인수 발표문의 표현에서 그 계약이 재무적으로 힘들어졌다는 신호를 읽는다.","insight":null,"signal":null,"author":[{"claim":"장기적 안정성을 말한 PPCP의 발표문은 글로벌 캡 모델에서 v28이 불러온 재무 부담을 에둘러 말한 것으로 보인다.","evidence":"PPCP가 2022년에 사우스캐롤라이나에서 처음으로 풀리스크 모델로 옮겼다고 밝힌 이력과 이번 발표문의 표현을 나란히 놓았을 뿐 별도 자료는 대지 않았다."}],"experts":[],"cases":[{"name":"MUSC와 Palmetto Primary Care Physicians(PPCP)","what":"대학 병원 조직인 MUSC가 사우스캐롤라이나 최대 독립 의원 그룹 PPCP를 인수했다. PPCP는 MUSC 산하 비영리 법인이 된다.","scale":"1억 1,100만 달러, 진료소 40곳, 의사 31명, APP 95명","note":"PPCP는 2022년에 agilon과 손잡고 주 안에서 처음으로 풀리스크 성과 기반 모델로 전환했다고 밝힌 바 있다.","sells_to":"payer"}],"notes":[{"term":"value-based care(VBC), full-risk, global cap","ko":"성과 기반 케어, 풀리스크, 글로벌 캡","plain":"진료를 한 건 할 때마다 돈을 받는 대신, 환자 한 명당 1년치 예산을 통째로 받고 그 안에서 다 해결하는 방식이다. 남으면 의료진의 이익이고 모자라면 손실이다. 풀리스크와 글로벌 캡은 그 위험을 전부 떠안은 가장 센 형태를 가리킨다. 한국에는 이런 계약이 거의 없다."},{"term":"v28","ko":"위험조정 모델 개정판","plain":"정부가 MA 플랜에 줄 돈을 정할 때 쓰는 진단 코드 계산식을 바꾼 개정판이다. 값을 쳐주던 코드가 줄어들어 같은 환자를 봐도 들어오는 돈이 작아졌다. 환자 예산을 통째로 받는 의료진은 예산 자체가 깎이는 셈이라 타격이 크다."},{"term":"APP","ko":"진료 보조 인력","plain":"간호사 개업 인력(NP)이나 의사 보조 인력(PA)처럼 의사가 아니면서 진료의 상당 부분을 맡는 직군을 묶어 부르는 말이다. 미국에서는 이들이 1차 진료의 실무를 폭넓게 담당하며, 한국에는 대응하는 제도가 없다."}]},{"heading_ko":"Cadence의 ACCESS 모델 참여","heading_en":"Other Top Headlines","skip":null,"summary":"원격 모니터링 회사가 새 정부 지불 모델에 참여하겠다고 공개적으로 밝혔다. 눈여겨볼 대목은 참여 자체보다 그 회사가 밝힌 이유다. 한 달에 한 번 사람이 개입하던 일을 AI 에이전트가 더 많이 맡는 쪽으로 사업을 옮기겠다고 말했다.","insight":"ACCESS 모델은 우리가 참여할 수 없는 미국 정부의 지불 제도이지만, 이 꼭지가 가리키는 고객 문제는 앱에서 다룰 수 있다. 만성질환자가 한 달에 한 번 통화하는 것 말고는 자기 수치를 봐 주는 상대가 없다는 문제다. 혈압, 혈당, 체중처럼 사용자가 직접 재는 값을 기록하게 하고 값이 흐트러질 때 AI가 무엇이 달라졌는지 짚어 주는 체크인은 기기 개발 없이 소프트웨어만으로 만들 수 있다. 수동 입력에서 시작해도 성립한다.","signal":null,"author":[{"claim":"Cadence가 이 모델을 사업의 AI 전환에 쓰겠다고 말한 대목이 흥미롭다.","evidence":"월 1회 사람 개입을 전제로 한 기존 RPM 코드에서 AI 에이전트가 더 많은 일을 하는 모델로 옮겨 간다는 회사 측 발언을 근거로 들었다."}],"experts":[],"cases":[{"name":"Cadence","what":"환자의 측정값을 원격으로 지켜보는 플랫폼이다. CMMI의 ACCESS 모델에 참여하겠다고 공개적으로 밝힌 첫 회사 가운데 하나가 됐다.","scale":"","note":"지불 방식이 바뀌면 사람이 맡던 월 1회 접촉을 AI 에이전트로 옮길 수 있다고 밝힌 점이 핵심이다.","sells_to":"payer"}],"notes":[{"term":"RPM codes","ko":"원격 환자 모니터링 청구 코드","plain":"환자가 집에서 잰 혈압이나 혈당을 의료진이 지켜보고 그 대가로 메디케어에 청구하는 코드다. 값을 받으려면 한 달에 한 번은 사람이 환자와 접촉해야 한다는 조건이 붙어 있어서, 인력 비용이 사업의 한계를 만든다."},{"term":"CMMI ACCESS model","ko":"CMS 혁신센터의 ACCESS 모델","plain":"미국 공보험 운영기관인 CMS 산하 혁신센터가 새 지불 방식을 시험하는 모델이다. 제도를 바꾸기 전에 참여 기관을 모아 다른 방식으로 돈을 지급해 보는 실험이라고 보면 된다. 이 회차 뒤쪽에서는 이 모델이 책임을 1차 진료 의사에게 떠넘긴다는 반발도 언급된다."}]},{"heading_ko":"Aetna 업코딩 합의금","heading_en":"Other Top Headlines","skip":null,"summary":"대형 보험사가 메디케어 어드밴티지에서 진단 코드를 부풀렸다는 혐의를 돈으로 해소했다. 두 개의 별개 사안이 하나로 묶여 있고, 하나는 10년 전 운영한 차트 리뷰 프로그램이다. 내부고발자에게 돌아가는 몫이 따로 적혀 있다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Aetna 합의","what":"보험사 Aetna가 Medicare Advantage 프로그램의 업코딩 혐의를 해소하기 위해 합의금을 내기로 했다.","scale":"총 1억 1,770만 달러(차트 리뷰 프로그램 관련 1억 600만 달러, 고도비만 코드 관련 1,150만 달러), 내부고발자 몫 200만 달러","note":"고도비만 코드 사안의 기간을 원문은 2018년에서 2013년 사이라고 적었다.","sells_to":"none"}],"notes":[{"term":"upcoding","ko":"업코딩","plain":"환자의 상태를 실제보다 무겁게 코드로 기록해 받을 돈을 늘리는 행위다. MA에서는 정부가 가입자의 진단 코드에 따라 보험사에 줄 돈을 정하기 때문에, 코드를 하나 더 붙이면 그만큼 수입이 늘어난다. 그래서 정부와 보험사 사이의 소송이 끊이지 않는다."},{"term":"chart review","ko":"차트 리뷰","plain":"이미 지나간 진료 기록을 다시 뒤져서 빠진 진단 코드를 찾아 추가하는 작업이다. 새 진료 없이 서류만으로 수입을 늘릴 수 있어 보험사들이 널리 써 왔고, 정부는 이 관행을 계속 문제 삼고 있다."}]},{"heading_ko":"Moxe Health 경영권 인수","heading_en":"Other Top Headlines","skip":null,"summary":"사모펀드가 임상 데이터 교환 회사의 경영권 지분을 사들였다는 한 줄짜리 소식이다. 금액이나 배경은 원문에 없다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Moxe Health","what":"임상 데이터를 주고받게 해 주는 플랫폼이다. BV Investment Partners가 경영권 지분을 인수했다.","scale":"","note":"원문은 회사의 고객이 누구인지 밝히지 않았다.","sells_to":"provider"}],"notes":[]},{"heading_ko":"숫자 하나: Devoted의 임상의 700명","heading_en":"A Number to Ponder","skip":null,"summary":"필자가 채용 공고에서 숫자를 뽑아 한 보험사의 실체를 추론하는 꼭지다. 임상의 수와 진료 건수를 나눠 생산성을 계산하고, AI 에이전트 5,000개라는 문구와 나란히 놓는다. 결론은 이 회사가 보험사가 아니라 온라인 병원 조직으로 가고 있다는 관찰이다.","insight":null,"signal":null,"author":[{"claim":"AI가 케어 딜리버리를 더 효율적으로 만들고 있다면 Devoted의 데이터에는 아직 드러나지 않는다.","evidence":"임상의 약 700명이 지난해 20만 건 이상을 진료했다는 채용 공고 문구를 근무일로 나눠 하루 1.1건이라는 자기 계산을 내놓았고, 같은 공고의 AI 에이전트 5,000개 문구와 나란히 놓았다."},{"claim":"Devoted의 채용 공고는 보험사보다 케어 딜리버리 조직처럼 읽힌다.","evidence":"공개된 채용 공고 47건을 훑은 인상을 근거로 들고, Alignment와 Clover에서도 같은 흐름을 봤다고 덧붙인다."},{"claim":"머지않아 Devoted를 MA 플랜이 아니라 모든 사업 라인과 계약하는 버추얼 헬스 시스템으로 부르게 될지도 모른다.","evidence":"채용 공고에서 읽은 인상 외에 별도 근거를 대지 않았다."}],"experts":[],"cases":[{"name":"Devoted Health","what":"Medicare Advantage 플랜을 운영하면서 자체 메디컬 그룹으로 직접 진료도 한다. 흔한 만성질환 회원을 위한 버추얼 센터 오브 엑설런스를 만드는 방향으로 사람을 뽑고 있다.","scale":"임상의 약 700명, 지난해 진료 20만 건 이상, AI 에이전트 5,000개, 공개 채용 공고 47건","note":"가입자가 직접 고르는 상품이지만 재원은 연방정부에서 나온다. 임상의 상당수는 풀타임 NP로 보인다고 필자가 LinkedIn 공고에서 추정했다.","sells_to":"payer"}],"notes":[{"term":"NP","ko":"간호사 개업 인력","plain":"석사 이상 교육을 받은 간호사로, 미국의 많은 주에서 의사 없이도 진찰하고 처방할 수 있다. 인건비가 의사보다 낮아 1차 진료와 만성질환 관리의 실무를 맡는 경우가 많다. 한국에는 이만큼 권한이 넓은 직군이 없다."},{"term":"center of excellence","ko":"센터 오브 엑설런스","plain":"특정 질환이나 시술을 한곳에 몰아서 전담하는 조직을 말한다. 사례가 모이면 결과가 좋아지고 비용도 관리하기 쉬워진다는 논리다. 여기서는 물리적 시설이 아니라 온라인으로 만성질환 회원을 전담하는 조직을 가리킨다."},{"term":"Kaiser","ko":"카이저 퍼머넌트","plain":"보험사와 병원, 의사 조직을 한 회사가 모두 가지고 있는 미국의 대표적인 통합 조직이다. 보험료를 받아 자기 병원에서 자기 의사로 진료하기 때문에 진료를 적게 할수록 이익이 남는 구조다. 필자는 Devoted가 건물 없이 온라인으로 그 형태를 만들고 있다고 본다."}]},{"heading_ko":"단상: Cardozo 판사와 AI 책임","heading_en":"A MUSING","skip":null,"summary":"필자가 로스쿨에서 배운 100년 전 제조물 책임 판례를 끌어와 지금의 AI 책임 문제를 비춰 보는 에세이다. 산업혁명 뒤 계약 관계가 없으면 책임을 물을 수 없던 시절이 어떻게 뒤집혔는지가 앞부분이고, 그 뒤에 AI 챗봇 보안 취약점 보고를 둘러싼 논쟁이 이어진다. 결론은 규칙이 정리되기까지 사고가 더 나야 한다는 다소 불편한 전망이다.","insight":"AI 건강 상담을 앱에 넣는다면 이 꼭지가 설계 조건을 알려 준다. Doctronic은 일반에 공개된 챗봇과 주정부 파일럿용 버전을 나눠 두었고, 안전장치가 약한 공개판이 뚫려 문제가 됐다. 공개 화면에서는 답변 범위를 더 좁게 걸고, 출시 전에 일부러 오용해 보는 점검을 붙이고, 취약점 제보가 들어왔을 때 답하는 창구를 만들어 두는 일이 기능 자체만큼 중요하다. 세 가지 모두 3개월 안에 소프트웨어 인력만으로 붙일 수 있다.","signal":null,"author":[{"claim":"혁신은 늘 규제보다 앞서 있고, 기존 틀의 결함을 드러내려면 그래야만 한다.","evidence":"Cardozo가 새 기준을 세우기까지 수십 년간 이상하게 결론 난 제조물 사고 판례가 먼저 쌓여야 했다는 법 역사를 근거로 든다."},{"claim":"Mindgard 리포트를 둘러싼 소셜 미디어의 우려는 다소 과하다.","evidence":"그런 답을 끌어내려면 사용자가 스스로 소스 코드를 해킹하고 가짜 공문서를 넣어 시스템을 의도적으로 오용해야 한다는 점, 그리고 유타에서 쓰는 버전은 공개판과 달리 안전장치가 훨씬 많은 것으로 보인다는 자기 이해를 든다."},{"claim":"가장 걱정스러운 대목은 제보를 받고도 Doctronic 지원팀이 별다른 대응을 하지 않은 것으로 보인다는 점이다.","evidence":"Mindgard가 문제를 알린 뒤의 정황을 근거로 들었다."},{"claim":"일관된 새 규제 기준에 이르기까지 앞으로 몇 년간 더 많은 일이 잘못되어야 한다.","evidence":"제조물 책임 법사에서 끌어온 비유가 유일한 근거이고, 그 밖의 자료는 대지 않았다."},{"claim":"해를 끼치지 말라는 우려를 이유로 진보를 멈추자는 주장은, 지금의 의료 시스템도 여전히 사람을 해친다는 사실을 외면한 것이다.","evidence":"근거를 대지 않았다."}],"experts":[{"who":"Chris Klomp","role":"원문은 소속이나 직함을 밝히지 않았고, Better Medicare Alliance 임원 서밋에서 한 발언이라고만 적었다.","claim":"헬스케어가 AI의 긍정적 효과를 보려면 새로운 규제 프레임워크가 필요하다.","evidence":"원문에 근거는 옮겨지지 않았다."}],"cases":[{"name":"Doctronic","what":"AI 건강 상담 챗봇을 운영한다. 일반에 공개된 버전과 유타주 파일럿에 쓰이는 버전이 나뉘어 있는 것으로 보인다고 필자는 이해하고 있다.","scale":"","note":"소비자는 공개 챗봇을 무료로 쓰고, 유타 파일럿의 지불 주체는 주정부 쪽이다. 필자는 공개판보다 유타 버전에 안전장치가 훨씬 많을 것으로 본다.","sells_to":"other"},{"name":"Mindgard","what":"AI 보안 회사로, Doctronic 챗봇의 취약점을 찾아 리포트로 공개했다.","scale":"","note":"챗봇이 크리올어로 답하게 만든 사례는 가볍게 다뤄졌지만, 오해를 부르는 SOAP 노트를 만들어 낸 대목은 필자도 걱정스럽다고 적었다.","sells_to":"other"},{"name":"Prenuvo 소송","what":"스캔을 잘못 해석했다는 이유로 최근 몇 달 사이 제소됐다.","scale":"","note":"원문은 회사의 사업 방식이나 소송의 진행 상황을 설명하지 않았다.","sells_to":"other"},{"name":"뉴욕주 AI 챗봇 책임 법안","what":"AI 회사가 자사 챗봇에 대해 책임을 지도록 하는 법을 뉴욕주가 제안했다.","scale":"","note":"주 단위에서 먼저 길을 내려는 시도로 소개됐다.","sells_to":"none"}],"notes":[{"term":"privity of contract","ko":"계약의 상호성","plain":"두 사람 사이에 직접 계약이 있어야만 책임을 물을 수 있다는 옛 법리다. 이 틀에서는 자동차 회사가 딜러에게만 팔았다면 그 차를 산 사람이 다쳐도 회사에 책임이 없었다. 1916년 MacPherson 판결이 이를 뒤집어, 계약이 없어도 제품을 잘못 만든 회사가 최종 사용자에게 책임을 지게 됐다."},{"term":"red team","ko":"레드팀","plain":"일부러 공격자 입장이 되어 시스템을 뚫어 보고 약점을 찾아내는 팀이다. AI 서비스에서는 금지된 답을 끌어내거나 위험한 지시를 따르게 만들어 보는 식으로 점검한다. 여기서는 외부 보안 회사가 자발적으로 그 역할을 했고, 회사가 그 제보에 응하지 않은 것이 문제가 됐다."},{"term":"SOAP note","ko":"SOAP 노트","plain":"의료진이 진료 내용을 적을 때 쓰는 표준 서식이다. 환자의 말, 관찰된 소견, 판단, 계획의 네 부분으로 나뉜다. AI가 그럴듯하지만 사실과 다른 SOAP 노트를 만들어 내면 뒤에 오는 의료진이 그것을 진짜 기록으로 읽을 수 있어 위험하다."}]},{"heading_ko":"상장사 업데이트: 들어가며","heading_en":"Public Markets Updates","skip":null,"summary":"실적 발표 시즌이 끝난 뒤 은행들이 연 컨퍼런스에서 나온 경영진 발언을 정리하는 자리다. 아래로 보험사 일곱 곳과 병원·의료 조직 다섯 곳의 발언이 한 꼭지씩 이어진다. 확정된 실적이 아니라 발언과 전망이므로 톤을 읽는 자료로 보는 것이 맞다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"Alignment: 2027년 성장 기회와 요율 전망","heading_en":"Public Markets Updates","skip":null,"summary":"MA 보험사가 내년 경쟁 구도와 정부 요율 고시를 어떻게 보는지 밝힌 대목이다. 대형사가 이익을 지키느라 성장을 미루는 사이 자기에게 기회가 온다는 것이 앞부분이다. 뒷부분은 요율이 얼마나 오를지에 대한 숫자 다툼이다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Kao","role":"MA 보험사 Alignment의 경영진이다. 원문은 직함을 밝히지 않았고, 요율이 오르면 이득을 보는 쪽에 서 있다.","claim":"최종 요율 고시가 전체적으로 4%까지 갈 수 있으며, 이는 대다수가 예상하는 2~3%를 웃도는 수준이다.","evidence":"피부 대체재 산정 오류가 요율을 1.5~2% 끌어올릴 수 있다는 점을 근거로 들었다."}],"cases":[{"name":"Alignment Healthcare","what":"MA 플랜을 운영하는 보험사다. 대형 플랜이 계속 마진을 우선시하고 2026년에 크게 성장한 소규모 플랜들이 문제를 겪으면서 2027년에 성장 기회가 온다고 봤다.","scale":"차트 리뷰 디링킹 시 일부 플랜 요율 6% 삭감 가능(Wakely 리포트), 피부 대체재 산정 오류로 1.5~2% 상향 가능","note":"회사가 자기 사업에 유리한 방향을 말하고 있다는 점을 감안해야 한다.","sells_to":"payer"}],"notes":[{"term":"Advance Notice / final notice","ko":"요율 예고 고시와 최종 고시","plain":"CMS가 다음 해에 MA 플랜에 줄 돈을 얼마나 올리고 내릴지 먼저 예고했다가 나중에 확정하는 절차다. 몇 퍼센트가 되느냐에 따라 보험사의 이익과 가입자에게 줄 혜택이 통째로 달라지기 때문에, 이 시기 보험사들의 발언은 대부분 이 숫자를 향한다."},{"term":"de-linking chart reviews","ko":"차트 리뷰 분리","plain":"지난 기록을 뒤져 뒤늦게 붙인 진단 코드를 지급액 계산에서 빼겠다는 정책 방향이다. 그 코드로 수입을 늘려 온 보험사는 요율이 실질적으로 깎인다."},{"term":"skin substitutes","ko":"피부 대체재","plain":"잘 낫지 않는 상처를 덮는 데 쓰는 인공 피부 계열 제품이다. 미국에서 지출이 급격히 늘어 지급 기준이 여러 차례 손질됐고, 그 계산이 틀리면 전체 요율 산정까지 흔들린다."}]},{"heading_ko":"Centene: ACA 회원 40% 감소","heading_en":"Public Markets Updates","skip":null,"summary":"개인이 직접 사는 ACA 보험에서 회원이 얼마나 빠졌는지 알려 주는 꼭지다. 회사는 예상대로라고 말하지만 숫자 자체는 크다. 업계 전반의 감소 폭과 견주어 자기 회사의 위치를 설명한다.","insight":null,"signal":"Centene의 ACA 회원은 한 해 동안 40% 줄었고, 업계 전반도 10%대 후반에서 30%대 중반 범위로 줄고 있다. 개인이 매달 자기 보험료를 내고 사는 시장에서 사람들이 대규모로 빠져나가는 중이라는 뜻이다. 보험 없이 스스로 돈을 내고 건강을 관리해야 하는 사람이 늘어나는 방향이며, 이런 사람에게 무료로 쓸 수 있는 건강 도구의 값어치는 커진다.","author":[],"experts":[],"cases":[{"name":"Centene","what":"정부 프로그램 중심의 보험사다. ACA 회원 감소가 예상대로 진행되고 있다고 밝혔다.","scale":"자사 ACA 사업 한 해 40% 감소, 업계 전반은 10%대 후반에서 30%대 중반","note":"자사 감소 폭이 업계보다 크다는 사실을 예상 범위 안이라는 표현으로 넘겼다.","sells_to":"payer"}],"notes":[{"term":"ACA exchange","ko":"ACA 거래소","plain":"직장 보험도 공보험도 없는 사람이 정부가 운영하는 온라인 장터에서 개인 자격으로 보험을 사는 곳이다. 소득이 낮으면 보조금을 받아 보험료를 덜 낸다. 전국민이 자동으로 가입되는 한국 건강보험과 달리, 미국에서는 이렇게 스스로 사지 않으면 무보험 상태가 된다."}]},{"heading_ko":"Clover: AI 모델과 요율 게임","heading_en":"Public Markets Updates","skip":null,"summary":"요율이 거의 오르지 않아도 환영한다고 말한 보험사의 발언을 다룬다. 요율이 낮을수록 경쟁사가 힘들어지므로 자기 모델의 강점이 드러난다는 논리다. 필자는 이 대목을 게임 이론으로 읽는다.","insight":null,"signal":null,"author":[{"claim":"여기서 벌어지는 게임 이론이 흥미롭다.","evidence":"요율 인상이 거의 없어도 환영한다는 Clover의 발언을 근거로 들었고, 최근 Martin과 나눈 대화를 언급했을 뿐 별도 자료는 대지 않았다."}],"experts":[],"cases":[{"name":"Clover Health","what":"AI를 앞세운 MA 보험사다. 업계가 최종 요율 고시에서 2~5% 인상을 예상한다고 언급하면서, 거의 제로에 가까운 인상도 환영한다고 말했다.","scale":"업계 예상 요율 인상 2~5%","note":"요율이 낮으면 경쟁사가 먼저 무너진다는 전제가 깔린 발언이다.","sells_to":"payer"}],"notes":[]},{"heading_ko":"CVS: 소비자 대상 AI Health 100","heading_en":"Public Markets Updates","skip":null,"summary":"미국 최대 약국·보험 회사가 소비자를 향한 새 AI 이니셔티브를 설명하는 데 발표 시간을 상당히 썼다는 짧은 기록이다. 다만 필자는 그것이 무엇인지 아직 이해하지 못하겠다고 적었다. 내용이 없다는 점 자체가 이 꼭지의 정보다.","insight":null,"signal":null,"author":[{"claim":"Health 100이 무엇인지 아직 이해하지 못하겠다.","evidence":"발표 내용을 들은 소감으로만 적었다."}],"experts":[],"cases":[{"name":"CVS Health","what":"약국과 보험을 함께 운영하는 회사다. 소비자를 대상으로 한 새 AI 이니셔티브 Health 100을 설명하는 데 발표 시간의 상당 부분을 썼다.","scale":"","note":"구체적인 내용은 원문에 나오지 않는다.","sells_to":"mixed"}],"notes":[]},{"heading_ko":"Elevance: CMS 문제와 ACA 유지율","heading_en":"Public Markets Updates","skip":null,"summary":"정부와 겪고 있는 분쟁의 성격을 회사가 어떻게 규정하는지가 앞부분이다. 데이터 전송 사고가 아니라 정책 해석 문제라는 주장이다. 뒷부분에는 ACA 이탈이 예상보다 적을 수 있다는 초기 신호가 나온다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Elevance Health","what":"대형 보험사다. CMS와의 최근 문제를 데이터 전송 문제가 아니라 2023년 이전 리스크 조정 데이터에 관한 정책 문제로 본다고 밝혔다.","scale":"","note":"ACA 초기 가입 효력 발생 데이터가 예년과 비슷하게 흘러 이탈이 업계 예상보다 적을 수 있다고 봤다. 앞선 Centene 꼭지의 큰 감소 폭과는 결이 다른 관측이라 나란히 놓고 볼 필요가 있다.","sells_to":"payer"}],"notes":[{"term":"effectuation","ko":"가입 효력 발생","plain":"보험을 신청했다고 끝이 아니라 첫 달 보험료를 실제로 내야 보장이 시작되는 절차를 말한다. 신청자 가운데 몇 명이 실제로 돈을 냈는지가 그해 회원 수를 좌우하기 때문에 보험사들이 초기에 이 수치를 본다."}]},{"heading_ko":"Humana: 베네핏 조정과 회원 획득 비용","heading_en":"Public Markets Updates","skip":null,"summary":"요율 환경이 나빠지면 가입자에게 주던 혜택을 줄여야 한다는 인정이 앞부분이다. 뒷부분에는 회원 한 명을 데려오는 비용이 2년 차에 절반으로 떨어진다는 숫자가 나온다. 그래서 한 번 온 회원을 오래 붙잡는 것이 이 회사 수익 논리의 뼈대다.","insight":null,"signal":null,"author":[{"claim":"회원 획득 비용이 절반으로 떨어지는 것만으로 마진이 약 4% 개선된다.","evidence":"1년 차 신규 회원당 1,000달러 이상에서 2년 차 약 500달러로 떨어진다는 회사 설명을 자기가 대략 계산한 결과라고 밝혔다."}],"experts":[],"cases":[{"name":"Humana","what":"MA 중심의 대형 보험사다. 앞으로 요율 환경에 맞춰 가입자 혜택을 조정해야 할 것이라고 더 분명하게 밝혔다.","scale":"회원 획득 비용 1년 차 1,000달러 이상, 2년 차 약 500달러","note":"혜택을 줄이면 회원이 떠나기 쉬워지므로, 오래 남을수록 이익이 커진다는 이 회사의 논리가 시험대에 오른다.","sells_to":"payer"}],"notes":[]},{"heading_ko":"UHG: 적자 성과 기반 계약 철수","heading_en":"Public Markets Updates","skip":null,"summary":"미국 최대 헬스케어 회사가 손해가 나는 성과 기반 계약에서 발을 빼고 있다는 내용이다. 얼마나 적자였는지 범위가 숫자로 나온다. 회원 수를 줄이는 것이 오히려 실적에 도움이 된다는 설명이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"UnitedHealth Group(OptumHealth)","what":"보험과 진료 조직을 함께 가진 회사의 진료 부문이다. 마진이 마이너스인 성과 기반 계약에서 철수하고 있다.","scale":"철수 대상 계약의 마진 -2%에서 -11%","note":"회원 규모를 적정화하는 것이 2027년으로 넘어가며 순풍이 된다고 밝혔다.","sells_to":"payer"}],"notes":[]},{"heading_ko":"HCA: ACA 해지에 따른 역풍","heading_en":"Public Markets Updates","skip":null,"summary":"보험을 잃은 사람이 늘면 병원 매출이 어떻게 줄어드는지 금액으로 보여 준다. 2026년보다 2027년이 더 나빠질 수 있다는 전망이 붙는다. 그 이유로 보조금 없는 보험료를 가구가 감당해 나가는 과정을 든다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"HCA Healthcare","what":"미국 최대 규모의 영리 병원 체인이다. 2026년 ACA 가입 해지에 따른 매출 역풍을 설명했다.","scale":"2026년 6억~9억 달러 역풍, 2026년은 예상 범위 하단","note":"가정들이 보조금 없는 ACA 플랜의 재정적 부담을 감당해 나가면서 2027년에 해지가 더 늘어날 수 있다고 봤다.","sells_to":"payer"}],"notes":[{"term":"disenrollment","ko":"가입 해지","plain":"가입자가 보험을 유지하지 않고 빠져나가는 것을 말한다. 보조금이 줄면 보험료 전액을 가구가 떠안게 되고, 그 부담을 못 견딘 사람이 무보험 상태가 된다. 무보험 환자가 병원에 오면 진료비를 받지 못하는 경우가 많아 병원 매출이 함께 줄어든다."}]},{"heading_ko":"Tenet: 사이트 뉴트럴 지불","heading_en":"Public Markets Updates","skip":null,"summary":"같은 시술이면 어디서 하든 같은 값을 준다는 정책이 현실화될지에 대한 질의응답이다. 회사는 복잡한 수술까지 그렇게 되는 것에 대해 크게 걱정하지 않는 모습이다. 값이 같아지면 외래 수술 센터가 무엇으로 차별화할지가 함께 논의됐다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Tenet Healthcare","what":"병원과 외래 수술 센터를 운영하는 회사다. 사이트 뉴트럴 지불이 복잡한 수술 케이스까지 의미 있게 현실화되는 것에 대해서는 특별히 걱정하지 않는 것으로 보인다.","scale":"","note":"필자는 이 회사가 전반적으로 좋은 위치를 잡아 가고 있다고 봤다.","sells_to":"payer"}],"notes":[{"term":"site-neutral payment","ko":"사이트 뉴트럴 지불","plain":"같은 시술이면 병원 외래에서 하든 독립 시설에서 하든 같은 값을 주자는 정책이다. 지금은 병원 외래에서 하면 더 많이 받을 수 있어서 병원들이 의원과 시설을 사들일 동기가 생긴다. 정책이 바뀌면 병원 쪽 수입이 줄어든다."},{"term":"ASC","ko":"외래 수술 센터","plain":"입원하지 않고 당일에 수술을 받고 집에 가는 독립 시설이다. 병원보다 비용이 낮아 보험사와 정부가 선호하며, 미국에서는 이런 시설이 하나의 산업을 이루고 있다."}]},{"heading_ko":"agilon: 고비용 회원과 트렌드 가정","heading_en":"Public Markets Updates","skip":null,"summary":"의료비 증가율 가정을 올린 뒤 초고액 환자 이야기를 다시 꺼낸 대목이다. 1년에 두세 명일 것으로 보던 환자가 한 분기에만 그만큼 나왔다는 내용이다. 원문 문장이 중간에 끊겨 있어 마지막 대목은 확인할 수 없다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"agilon health","what":"1차 진료 의사 그룹이 위험을 떠안는 성과 기반 계약을 하도록 돕는 회사다. 연간 트렌드 가정을 5%에서 6.5%로 올린 뒤 고비용 회원 문제를 다시 설명했다.","scale":"연간 트렌드 가정 5%에서 6.5%, 의료비 100만 달러 이상 회원이 통상 연 2~3명인데 한 분기에 2~3명 발생","note":"원문은 한 환자에 대한 설명을 하다가 문장이 끊긴 채로 끝난다.","sells_to":"provider"}],"notes":[{"term":"trend assumption","ko":"트렌드 가정","plain":"1년 동안 의료비가 몇 퍼센트 오를지 미리 잡아 두는 숫자다. 환자 한 명당 예산을 통째로 받는 회사에게는 이 가정이 틀리면 그대로 손실이 된다. 가정을 5%에서 6.5%로 올렸다는 것은 실제 비용이 예상보다 빠르게 늘고 있다는 뜻이다."}]},{"heading_ko":"Surgery Partners: MA 물량 쏠림","heading_en":"Public Markets Updates","skip":null,"summary":"다른 병원들이 보험 계약에서 빠지자 한 수술 시설로 환자가 몰린 사례다. 환자가 늘었는데도 실적이 나빠진 이유가 여기에 있다. 값을 덜 쳐주는 MA 환자가 늘고 값을 더 쳐주는 상업보험 환자가 밀려났기 때문이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Surgery Partners","what":"외래 수술 시설을 운영하는 회사다. 최근 부진을 이끈 세 개 시장을 설명했고, 그중 한 곳에서 다른 프로바이더들이 네트워크에서 빠지면서 MA 물량을 예상 밖으로 많이 받게 됐다.","scale":"","note":"환자가 이용할 수 있는 유일한 독립 수술 시설로 남아 MA 회원이 몰렸고, 그만큼 상업보험 물량이 밀려났다.","sells_to":"payer"}],"notes":[{"term":"network / out-of-network","ko":"네트워크와 네트워크 이탈","plain":"미국 보험은 미리 계약을 맺은 병원 목록 안에서만 제값에 쓸 수 있고, 목록 밖 병원에 가면 환자 부담이 크게 늘어난다. 병원이 계약 조건에 불만이 생기면 이 목록에서 빠지고, 그러면 남은 몇몇 시설로 환자가 몰린다. 한국에는 이런 병원 목록 개념이 없다."}]},{"heading_ko":"Teladoc: BetterHelp의 보험 전환","heading_en":"Public Markets Updates","skip":null,"summary":"자기 돈으로 매달 내는 온라인 상담 구독이 왜 흔들리는지가 한 문장으로 나온다. 회원의 80%가 비용 때문에 그만둔다는 회사 자체 설명이다. 그래서 회사는 보험이 적용되는 상담 쪽으로 무게를 옮기고 있다.","insight":"가격 때문에 상담을 그만둔 사람이 미국에 아주 많다는 뜻이고, 그 사람들은 지금 아무 도구도 없이 남는다. 상담을 대신할 수는 없지만, 기분과 수면을 걸음과 함께 기록하고 주 단위로 짧게 정리해 주는 무료 화면은 만들 수 있다. 3개월 안에 소프트웨어만으로 가능하고 지금 앱에 없는 가치다. 의학적 진단이나 치료를 표방하지 않고 기록과 되돌아보기에 머무르면 규제 부담도 피할 수 있다.","signal":"BetterHelp 회원의 80%가 비용 때문에 현금 결제 모델을 그만둔다고 회사가 밝혔다. 미국 소비자가 정신건강에 자기 돈을 쓰기는 하지만 그 지출이 오래 이어지지 않는다는 뜻이며, Teladoc은 그래서 보험이 적용되는 경로로 수요를 옮기려 한다. 자비 부담 구독 모델은 가격에서 무너진다는 신호다.","author":[],"experts":[],"cases":[{"name":"Teladoc / BetterHelp","what":"원격진료 회사 Teladoc과 그 산하 온라인 상담 서비스 BetterHelp다. 소비자가 직접 결제하는 사업이 줄어드는 것을 보험이 적용되는 사업의 성장으로 상쇄할 것으로 본다.","scale":"회원의 80%가 비용 때문에 현금 결제 모델을 그만둔다","note":"미국 중심의 인수합병이 계속될 것으로 예상한다고 밝혔다.","sells_to":"mixed"}],"notes":[{"term":"cash-pay model","ko":"현금 결제 모델","plain":"보험을 거치지 않고 소비자가 매달 자기 돈을 내는 방식이다. 보험 청구 절차가 없어 시작하기 쉽고 회사도 빨리 키울 수 있지만, 가격이 그대로 소비자 부담이라 오래 이어지기 어렵다. 한국에서는 비급여 진료가 이와 비슷한 자리에 있다."}]},{"heading_ko":"AMI Labs 10억 3,000만 달러 시드","heading_en":"Funding Announcements","skip":null,"summary":"제품이 나오기 전 단계에서 조 단위 가치를 인정받은 AI 회사의 자금 조달이다. 헬스케어와의 연결 고리는 AI 스크라이브 회사 Nabla와의 독점 관계다. 두 회사 사이에 사람까지 옮겨 갔다는 점이 눈에 띈다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"AMI Labs","what":"AI 월드 모델을 만드는 회사다. Nabla를 첫 파트너로 두고 있으며, 12월에 양측이 독점 파트너십을 발표했다.","scale":"시드 라운드 10억 3,000만 달러, 프리머니 기업가치 35억 달러","note":"Nabla의 창업 투자자이자 어드바이저인 Yann LeCun이 설립했고, Nabla의 전 CEO였던 Alex LeBrun이 AMI의 CEO가 됐다.","sells_to":"other"}],"notes":[{"term":"AI scribe","ko":"AI 스크라이브","plain":"의사와 환자의 대화를 듣고 진료 기록을 자동으로 작성해 주는 도구다. 미국 의사들이 기록 작성에 많은 시간을 쓰기 때문에 최근 몇 년 사이 가장 빠르게 팔린 임상 AI 제품군이다. Nabla는 그중 한 회사다."}]},{"heading_ko":"Nitra 시리즈 B","heading_en":"Funding Announcements","skip":null,"summary":"개인 진료소의 돈 관리를 돕는 회사가 자금을 모았다. 매출이 1년 만에 여덟 배 넘게 늘었다는 숫자가 나온다. 고객이 미용과 안과, 피부과처럼 자비 부담 비중이 큰 전문 진료소로 보인다는 점이 특징이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Nitra","what":"진료소의 재무 관리를 돕는 AI 플랫폼이다. 안과, 피부과, 비뇨기과, 메드스파 시장의 전문 진료소를 고객으로 두고 있는 것으로 보인다.","scale":"시리즈 B 7,200만 달러, 총 조달 1억 8,700만 달러, 2025년 매출 3,300만 달러(2024년 400만 달러), 2026년 연환산 매출 목표 1억 5,000만 달러, 현재 700개 클리닉, 2026년 거래액 40억 달러 예상","note":"연환산 매출이라는 표현은 실제 1년 매출이 아니라 특정 시점의 매출을 1년치로 환산한 값이다.","sells_to":"provider"}],"notes":[{"term":"medspa","ko":"메드스파","plain":"보톡스나 레이저 시술처럼 미용 목적의 의료 시술을 하는 클리닉이다. 보험이 적용되지 않아 손님이 전액을 직접 낸다. 그래서 이런 곳은 병원보다 소매점에 가까운 방식으로 돈을 관리한다."},{"term":"warehouse facility","ko":"웨어하우스 시설","plain":"고객에게 돈을 빌려주는 사업을 하려고 금융기관에서 미리 확보해 두는 대출 한도다. 회사의 자기 자본이 아니라 빌려온 돈이므로, 자금 조달 총액에 함께 적혀 있어도 성격이 다르다."}]},{"heading_ko":"Translucent 2,700만 달러","heading_en":"Funding Announcements","skip":null,"summary":"병원 재무 부서를 위한 AI 에이전트 회사가 1년도 안 되어 다시 자금을 모았다. 고객으로 이름이 알려진 병원 조직 두 곳이 나온다. 필자는 이를 병원을 돕는 AI의 잘 표적화된 사례로 평가한다.","insight":null,"signal":null,"author":[{"claim":"병원을 지원하는 데 AI를 활용한 아주 멋지고 표적화된 사례로 보인다.","evidence":"더 나은 재무 데이터를 제공해 병원이 마진을 개선하도록 돕는다는 회사 설명 외에 별도 근거는 대지 않았다."}],"experts":[],"cases":[{"name":"Translucent","what":"병원 재무 부서를 위한 AI 에이전트다. 병원이 마진을 개선하도록 더 나은 재무 데이터를 제공한다.","scale":"2,700만 달러 조달, Google Ventures 주도, 2025년 8월 시드 이후 1년이 채 안 된 시점","note":"고객으로 Northwestern Medicine과 Duly Health and Care가 언급됐다.","sells_to":"provider"}],"notes":[]},{"heading_ko":"Amigo AI 1,100만 달러","heading_en":"Funding Announcements","skip":null,"summary":"임상 AI를 위한 디지털 레지던시를 표방하는 회사가 자금을 모았다. 완료한 환자 진료 건수가 300만 건으로 적혀 있다. 1년 전 시드 때 내세운 방향에서 살짝 옮겨 갔다는 관찰이 붙는다.","insight":null,"signal":null,"author":[{"claim":"2025년 1월 시드 라운드 당시의 방향에서 살짝 튼 것으로 보인다.","evidence":"당시에는 전문가의 디지털 클론을 지향했다는 점과 지금의 디지털 레지던시 표현을 견주었다."}],"experts":[],"cases":[{"name":"Amigo AI","what":"임상 AI를 위한 디지털 레지던시를 표방하는 회사다. Madrona가 이번 라운드를 주도했다.","scale":"1,100만 달러, 환자 진료 300만 건 완료","note":"고객으로 Eucalptus, Diverge Health, the Care Clinic이 언급됐다. 회사 이름 표기는 원문 그대로다.","sells_to":"provider"}],"notes":[{"term":"digital residency","ko":"디지털 레지던시","plain":"레지던시는 의사가 면허를 딴 뒤 선배 의사의 감독 아래 실제 환자를 보며 배우는 수련 과정이다. 임상 AI에도 같은 과정을 두어, 실제 진료에 투입하기 전에 감독 아래 훈련하고 평가하겠다는 비유로 쓴 말이다."}]},{"heading_ko":"Malama Health 920만 달러","heading_en":"Funding Announcements","skip":null,"summary":"저소득층 공보험 가입자를 위한 산모 케어 회사가 자금을 모았다. 조달액 안에 정부 보조금과 주 지원금이 상당 부분 섞여 있다. 모델의 중심에 의료 자격이 없는 출산 도우미를 둔 점이 특징이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Malama Health","what":"Medicaid 가입자를 대상으로 하는 산모 케어 회사다. 둘라를 모델의 중심에 두고 캘리포니아, 텍사스, 콜로라도의 Medicaid 플랜과 인네트워크로 계약돼 있으며 성과 기반 계약으로 옮겨 갈 계획이다.","scale":"920만 달러(NIH 보조금 230만 달러와 캘리포니아 주 지원금 100만 달러 이상 포함), Acumen America 주도","note":"FQHC와 커뮤니티 헬스 센터에서 환자를 의뢰받는다.","sells_to":"payer"}],"notes":[{"term":"Medicaid","ko":"메디케이드","plain":"소득이 낮은 사람을 위한 미국의 공보험이다. 연방정부와 주정부가 함께 돈을 대고 주마다 운영 방식이 다르다. 65세 이상을 위한 메디케어와는 대상도 재원도 다르며, 한국처럼 전국민이 같은 제도에 들어가 있는 구조가 아니다."},{"term":"doula","ko":"둘라","plain":"의료 자격은 없지만 임신과 출산, 산후 기간에 산모 곁에서 정서적으로 돕고 필요한 정보를 알려 주는 사람이다. 미국에서는 저소득층 산모의 출산 결과가 나쁜 문제를 완화하는 수단으로 여러 주가 Medicaid에서 비용을 대기 시작했다."},{"term":"FQHC","ko":"연방 지정 보건센터","plain":"연방정부의 지원을 받아 저소득층과 무보험자에게 진료를 제공하는 지역 진료소다. 돈이 없거나 보험이 없는 사람이 처음 찾아가는 곳이라 환자를 다른 프로그램으로 연결하는 통로 역할도 한다."}]},{"heading_ko":"읽을거리: 헬스케어에는 전용 AI가 필요하다","heading_en":"What I'm Reading: Healthcare Uses Specialized Language. It Needs Specialized AI, Too.","skip":null,"summary":"필자가 이번 주에 읽은 글을 소개하는 자리다. 헬스케어에 대규모 언어 모델을 배포하는 일과 해를 끼치지 말라는 원칙의 관계를 다룬 글이라고만 적었다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Amber Nigam, John Glaser","role":"필자가 아닌 외부 필진이며, 원문은 두 사람의 소속이나 이해관계를 밝히지 않았다.","claim":"헬스케어는 특수한 언어를 쓰므로 그에 맞는 전용 AI가 필요하다.","evidence":"원문은 글의 제목과 한 줄 소개만 옮겼고 근거는 담지 않았다."}],"cases":[],"notes":[]},{"heading_ko":"읽을거리: AI가 임상시험을 저절로 앞당기지는 않는다","heading_en":"What I'm Reading: AI Won't Automatically Accelerate Clinical Trials","skip":null,"summary":"두 번째로 소개하는 글이다. 신약 개발의 병목이 기술이 아니라 운영과 규제에 있어서 AI만으로는 임상시험 기간이 줄지 않는다는 주장을 담고 있다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Ruxandra Teslo","role":"필자가 아닌 외부 필진이며, 원문은 소속이나 이해관계를 밝히지 않았다.","claim":"병목이 운영과 규제 문제에서 비롯되기 때문에 AI만으로는 임상시험 기간을 단축하기 어렵다.","evidence":"원문은 글의 한 줄 소개만 옮겼고 근거는 담지 않았다."}],"cases":[],"notes":[]},{"heading_ko":"HTN 소식: 커뮤니티 브레인 트러스트","heading_en":"This week on HTN","skip":"promo","summary":"뉴스레터가 운영하는 유료 커뮤니티에서 이번 주에 오간 대화를 소개하는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"HTN 소식: 주간 정책 브리핑","heading_en":"This week on HTN","skip":"promo","summary":"같은 매체가 따로 내는 정책 브리핑을 안내하는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"HTN 소식: 팟캐스트","heading_en":"This week on HTN","skip":"promo","summary":"이번 주에 공개된 자체 팟캐스트 세 편을 안내하는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]}],"themes":["consumer-dtc","behavioral-mental","pharma-glp1","medicare-advantage","ai-clinical","aca-exchange"],"for_later":[]},{"index":"24","date":"2026-03-22","type":"reads","title_en":"Weekly Health Tech Reads 3/22/26","title_ko":"규모 경쟁과 기본 등록, 그리고 펩타이드","hook":"병원은 몸집으로, 정부는 기본 등록으로 움직인 한 주였고, 소비자 신호는 회색시장 펩타이드 하나였다.","tldr":[{"point":"California의 Sutter Health가 Minnesota의 Allina Health와 합병 의향서를 맺어, 승인되면 세 개 주에 걸쳐 병원 39곳을 운영하고 연매출 약 250억 달러를 내는 시스템이 된다.","note":"미국 병원은 보험사와 값을 하나하나 협상해서 정하기 때문에 몸집이 클수록 협상에서 유리해지며, 그래서 규모를 키우는 것 자체가 병원 경영의 기본 전략이 되어 있다."},{"point":"Medicare를 총괄하는 Chris Klomp가 수급자를 fee-for-service 대신 ACO나 Medicare Advantage에 기본값으로 넣는 방안을 검토 중이라고 말했는데, 같은 주에 Medicare Advantage가 비용을 충분히 관리하지 못한다는 취지의 발언도 했다.","note":"미국 노인 공적보험은 진료 건마다 값을 치르는 방식과 민간 보험사가 1인당 정액을 받고 관리하는 방식으로 갈리는데, 가입자가 아무것도 고르지 않았을 때 어느 쪽으로 넣느냐가 곧 수천만 명의 기본 경로를 정하는 문제다."},{"point":"Trilliant Health가 AI 스크라이브를 도입한 헬스 시스템 여섯 곳에서 외래 진료의 코딩 인텐시티가 신규 환자와 기존 환자 모두에서 꾸준히 올라갔다는 데이터를 내놓았다.","note":"미국 의사는 진료 내용을 등급으로 매겨 청구하는데, 기록이 자세할수록 높은 등급을 붙일 근거가 생기므로 AI가 대신 받아 적으면 같은 진료라도 청구 등급이 올라갈 수 있다."},{"point":"North Carolina 주 공무원 보험은 2027년 말 약 10억 달러 적자가 예상되자 참조가격 실험을 접었고, 지금은 Lantern과 함께 특정 수술을 본인부담 0원 번들로 묶어 값싼 프로바이더로 사람을 유도하고 있다.","note":"앞선 참조가격 실험이 실패한 이유는, 원래 받던 돈이 기준가보다 낮던 프로바이더만 참여하고 이미 더 많이 받던 곳은 참여할 이유가 없었기 때문이라는 것이 필자의 설명이다."},{"point":"Providence가 44만 명이 가입한 자사 헬스 플랜의 매각을 검토하고 있으며, CEO는 약값 상승과 가격 유지 압박, 계속되는 기술 투자 부담 때문에 작은 플랜이 따라가기 어려워졌다고 밝혔다.","note":"Providence는 병원을 운영하면서 보험도 함께 파는 조직인데, 가입자 수가 적은 지역 보험은 약값 같은 큰 비용 변동을 흡수할 여력이 부족하다."},{"point":"승인 절차 밖에서 펩타이드를 사고 쓰는 회색시장 열풍이 The Atlantic 기사와 Martin Shkreli의 게시물을 거치며 주류 논의로 올라오고 있다.","note":"펩타이드는 몸 안의 신호 물질을 흉내 낸 주사제로, 미국에서는 정식 승인 경로를 거치지 않고 개인이 직접 구해 쓰는 거래가 커지고 있다."}],"issue_insight":{"verdict":"yes","summary":"이번 회차는 병원과 보험사와 정부 사이에서 돈이 오가는 이야기가 대부분이라 앱 화면으로 바로 옮길 것이 많지 않다. 다만 승인 절차 밖에서 스스로 약을 구하는 흐름과, 보험이 이미 공짜로 주는 것을 정작 가입자가 모른다는 대목 두 군데는 소비자 쪽으로 열려 있다.","build":[{"title":"내 보험에서 이미 본인부담 0원인 것 찾아 주기","detail":"주 공무원 보험은 값싼 프로바이더로 사람을 옮기려고 특정 수술을 본인부담 0원 번들로 묶고 있지만, 가입자가 그런 항목의 존재를 알아야 움직인다. 유저가 가진 보험 정보를 입력받아 지금 본인부담이 0원인 항목을 목록으로 보여 주는 화면은 소프트웨어 인력만으로 만들 수 있다.","section":12},{"title":"승인 밖 자가 투여 기록 화면","detail":"회색시장에서 펩타이드를 구해 쓰는 사람은 무엇을 언제 얼마나 맞았고 몸이 어땠는지 적어 둘 곳이 없다. 주사와 복용 기록에 증상 체크를 붙이는 정도는 3개월 안에 가능하며, 규제 허가가 필요한 진단이나 처방 영역은 건드리지 않는다.","section":22}],"signal":[{"title":"승인 절차 밖 주사제를 자기 돈으로 사는 흐름","detail":"미국 소비자가 정식 승인 경로 밖에서 펩타이드를 사서 쓰는 거래가 유명 매체와 소셜 미디어를 통해 주류 논의로 올라오고 있다.","section":22},{"title":"사전승인 절차에 대한 불신","detail":"약을 제때 받지 못하는 개인의 사례가 지역 신문 1면에 실릴 만큼 사전승인에 대한 불만이 커져 있다. 다만 원문은 그 규모를 숫자로 보여 주지 않는다.","section":7}]},"sections":[{"heading_ko":"여는 글","heading_en":"","skip":"admin","summary":"필자가 이번 주에 다룰 네 가지를 미리 소개하는 인사말이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"스폰서: Ursa Health","heading_en":"Sponsored by: Ursa Health","skip":"sponsor","summary":"데이터 인프라 회사 Ursa Health가 돈을 내고 실은 광고 자리다. agilon health와 함께 만든 재무 데이터 파이프라인 사례를 소개한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"톱뉴스: Sutter와 Allina의 합병 의향","heading_en":"TOP NEWS: Sutter and Allina announce intent to merge","skip":null,"summary":"서로 다른 지역에서 병원을 운영하던 두 대형 병원 그룹이 하나로 합치겠다고 발표한 소식이다. 규모와 이름 붙이기에서 Sutter의 다음 계획을 읽어 내는 것이 이 꼭지의 핵심이다. 필자가 Allina에서 일했던 이력을 스스로 밝히고 있다는 점도 감안하고 읽으면 좋다.","insight":null,"signal":null,"author":[{"claim":"Allina를 'Sutter Health의 Upper Midwest Division'이라고 부르는 명명법은 Sutter가 앞으로 더 확장하겠다는 신호다.","evidence":"Sutter가 최근 M&A 담당 리더를 영입했다는 사실을 함께 들었다. 다만 회사가 확장 계획을 밝힌 발언은 인용하지 않았다."},{"claim":"양쪽 경영진 모두에게 합리적인 선택이며, 헬스케어에서는 대체로 규모가 큰 쪽이 이기는 패다.","evidence":"Sutter는 전국구 헬스 시스템 경쟁에 들어가려는 야심을 실현하고 Allina는 불확실한 Minnesota 환경에서 장기 안정성을 얻는다는 점을 들었다. 다만 교차 시장 합병에 실제 시너지가 있는지, 사회적으로 어떤 가치가 있는지는 스스로 옆으로 치워 두었다고 밝혔다."}],"experts":[],"cases":[{"name":"Sutter Health와 Allina Health","what":"California의 Sutter Health가 Minnesota의 Allina Health와 합병하겠다는 의향서에 서명했다. 두 곳 모두 병원을 직접 운영하는 조직이다.","scale":"승인되면 연매출 약 250억 달러, California·Minnesota·Wisconsin에 걸쳐 병원 39곳. Sutter는 Minnesota와 서부 Wisconsin에 20억 달러를 투자한다.","note":"Allina는 지역 브랜드와 리더십을 유지하면서 'Sutter Health's Upper Midwest Division'이라는 이름을 달게 된다.","sells_to":"payer"}],"notes":[{"term":"LOI","ko":"합병 의향서","plain":"합치기로 뜻을 모았다는 문서이며, 아직 합병이 확정된 것은 아니다. 미국에서 큰 병원끼리 합치려면 경쟁 당국과 주 정부의 심사를 통과해야 하므로, 의향서에서 실제 합병까지 1년 이상 걸리거나 무산되기도 한다."},{"term":"health system","ko":"헬스 시스템","plain":"병원 여러 곳과 외래 진료소를 묶어 운영하는 사업체다. 한국의 대학병원 재단과 비슷하지만, 미국에서는 보험사와 값을 개별 협상하기 때문에 산하 병원이 많을수록 협상력이 커진다. 그래서 헬스 시스템끼리의 합병은 곧 가격 협상력을 사는 일이기도 하다."},{"term":"cross-market merger","ko":"교차 시장 합병","plain":"같은 지역에서 경쟁하던 병원끼리가 아니라, 서로 다른 지역의 병원끼리 합치는 것이다. 같은 지역이 아니니 경쟁이 줄어들지 않는다는 논리로 규제 심사를 비교적 수월하게 넘길 수 있지만, 환자에게 돌아가는 이득이 있는지는 논쟁거리다."}]},{"heading_ko":"짧은 소식: Qualtrics와 Press Ganey 합병 무산","heading_en":"TOP HEADLINES","skip":null,"summary":"설문 소프트웨어 회사와 환자 경험 조사 회사의 합병이 은행 단계에서 멈춰 섰다는 소식이다. 헬스케어 자체의 문제가 아니라 인수 자금을 대는 금융 쪽 사정이 이유로 지목되었다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Qualtrics의 Press Ganey 인수","what":"2025년 10월에 발표되었던 인수가 무산된 것으로 보인다. 은행들이 부채 시장에서의 AI 관련 우려를 이유로 딜을 중단시켰다.","scale":"발표 당시 인수 금액 67억 5,000만 달러","note":"헬스케어 안의 사정이 아니라 인수 자금을 빌려주는 쪽의 판단이 딜을 멈췄다는 점이 눈에 띈다.","sells_to":"other"}],"notes":[]},{"heading_ko":"짧은 소식: Providence의 헬스 플랜 매각 검토","heading_en":"TOP HEADLINES","skip":null,"summary":"병원을 운영하면서 보험도 함께 팔던 조직이 보험 사업을 내놓는다는 소식이다. 필자는 이를 지역 단위 보험사들이 처한 어려움을 보여 주는 신호로 읽는다.","insight":null,"signal":null,"author":[{"claim":"지역 헬스 플랜들이 지금 처한 상황이 암울하다는 또 하나의 지표다.","evidence":"44만 명 규모 플랜이 매물로 나온다는 사실과 Providence CEO가 밝힌 매각 검토 이유를 들었다."}],"experts":[{"who":"Providence CEO","role":"보험 사업 매각을 검토 중인 헬스 시스템의 최고경영자. 매각을 정당화해야 하는 쪽이다. 원문에 이름은 나오지 않는다.","claim":"처방 의약품 비용 상승, 가격을 감당 가능한 수준으로 유지해야 한다는 압박, 지속적인 기술 업그레이드 필요 때문에 소규모 플랜이 따라가기 더 어려워지고 있다.","evidence":"근거를 대지 않았다. the Lund Report에 보낸 이메일에서 요인을 열거했을 뿐이다."}],"cases":[{"name":"Providence Health Plan","what":"Providence가 자사 보험 사업의 매각을 검토하고 있다.","scale":"ACA, 커머셜, Medicare, Medicaid 시장을 통틀어 회원 44만 명","note":"가입자를 개인·고용주·정부에서 두루 받는 구조인데도 규모가 부족하다는 이야기다.","sells_to":"mixed"}],"notes":[{"term":"ACA·커머셜·Medicare·Medicaid","ko":"미국 보험 시장의 네 갈래","plain":"미국에는 전 국민 단일 건강보험이 없고 시장이 갈라져 있다. ACA는 직장 보험이 없는 개인이 정부 거래소에서 직접 사는 보험, 커머셜은 회사가 직원에게 주는 보험, Medicare는 65세 이상 노인용 공적보험, Medicaid는 저소득층용 공적보험이다. 한 보험사가 이 네 시장에 각각 다른 상품을 팔며, 시장마다 규칙과 돈을 내는 주체가 다르다."}]},{"heading_ko":"짧은 소식: Verily의 3억 달러 조달","heading_en":"TOP HEADLINES","skip":null,"summary":"구글 모회사 Alphabet의 헬스케어 자회사가 외부 투자를 받으면서 Alphabet이 소수 투자자로 물러났다는 소식이다. 대기업이 헬스케어 사업을 핵심에서 떼어 내는 흐름을 보여 준다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Verily","what":"3억 달러 규모의 펀딩을 발표했고 Alphabet은 소수 투자자로 내려앉았다. Series X Capital이 라운드를 주도했고 Alphabet, UCHealth, University of Colorado Anschutz가 참여했다.","scale":"3억 달러","note":"라운드를 주도한 Series X는 Alphabet이 자사 X 프로젝트를 독립시키려고 2024년에 만든 곳이어서 Alphabet과 가깝다. 완전한 외부 자금 유치와는 결이 다르다.","sells_to":"other"}],"notes":[]},{"heading_ko":"짧은 소식: WISeR 프로그램의 도입 초기 진통","heading_en":"TOP HEADLINES","skip":null,"summary":"Medicare에 사전승인 절차를 시험 도입한 프로그램이 Washington주에서 겪은 문제를 지역 신문이 1면으로 다뤘다. 필자는 기사에 사실관계 오류가 있다고 보면서도, 사전승인에 대한 대중의 불신이 이 프로그램의 정치적 부담이 되고 있다고 읽는다.","insight":null,"signal":"약을 제때 받지 못하는 한 사람의 이야기가 지역 신문 1면에 실릴 만큼, 승인 절차 때문에 치료가 막히는 경험이 미국인에게 익숙한 화제가 되어 있다. 다만 원문이 제시하는 것은 개별 사례와 필자의 관찰뿐이며 규모를 보여 주는 숫자는 없다.","author":[{"claim":"기사가 WISeR 모델에 대한 사실관계 일부를 틀리게 썼다.","evidence":"근거를 대지 않았다. 어느 대목이 틀렸는지는 밝히지 않았다."},{"claim":"그럼에도 이 기사는 사람들이 사전승인에 대해 갖고 있는 광범위한 불신과 그에 따른 WISeR의 정치적 어려움을 보여 준다.","evidence":"1면에 실렸다는 사실과 약을 받는 데 문제를 겪은 한 사람의 사례를 들었다."}],"experts":[],"cases":[{"name":"WISeR 프로그램","what":"Medicare 일부 항목에 사전승인 절차를 시험 도입한 정부 프로그램이며, Washington주에서 도입 초기 문제를 겪었다.","scale":"","note":"제도가 사람을 막는 장면이 지역 신문 1면 기사가 되었다는 점이 정치적 부담의 크기를 보여 준다.","sells_to":"none"}],"notes":[{"term":"prior auth","ko":"사전승인","plain":"의사가 어떤 검사나 약을 정하면, 보험이 값을 내주기 전에 미리 승인을 받아야 하는 절차다. 한국에서는 의사가 처방하면 대체로 그대로 진행되지만, 미국에서는 이 승인이 며칠에서 몇 주 걸리거나 거절되기도 해서 환자가 치료를 못 받고 기다리는 일이 흔하다. 보험사가 불필요한 지출을 막는 장치이면서, 동시에 미국인이 보험사를 불신하는 가장 큰 이유이기도 하다."},{"term":"WISeR","ko":"Medicare 사전승인 시범 프로그램","plain":"원래 Medicare는 민간 보험과 달리 사전승인이 거의 없었는데, 낭비성 진료를 걸러 내겠다며 일부 항목에 승인 절차를 넣은 시범 사업이다. 즉 민간 보험에서 욕을 먹던 장치를 공적보험에 들여오는 셈이라, 시작부터 반발이 예상되던 프로그램이다."}]},{"heading_ko":"짧은 소식: Chartis의 Leap AI 인수","heading_en":"TOP HEADLINES","skip":null,"summary":"헬스케어 컨설팅 회사가 AI 벤처 스튜디오를 사들였다. 사업을 사기보다 사람을 데려오려는 성격의 거래로 읽힌다.","insight":null,"signal":null,"author":[{"claim":"일종의 애퀴하이어로 보인다.","evidence":"Chartis가 Leap AI 팀을 활용해 고객사를 위한 AI 솔루션을 개발하고 배포하려 한다는 점을 들었다."}],"experts":[],"cases":[{"name":"Chartis와 Leap AI","what":"헬스케어 컨설팅 회사 Chartis가 AI 벤처 스튜디오 Leap AI를 인수했다.","scale":"Leap AI는 포트폴리오에 다섯 개 사업을 두고 있고 그중 셋은 유전학·롱제비티·임상시험 영역에서 아직 스텔스 상태다.","note":"인수 금액은 원문에 없다.","sells_to":"provider"}],"notes":[]},{"heading_ko":"짧은 소식: MedArrive의 Inbound Health 자산 인수","heading_en":"TOP HEADLINES","skip":null,"summary":"입원 대신 집에서 치료하는 모델을 운영하던 회사가 사업을 접었고, 그 자산을 다른 회사가 사 갔다. 한 줄 소식이지만 hospital-at-home 모델이 자립하기 어려웠다는 사실이 드러난다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"MedArrive와 Inbound Health","what":"MedArrive가 Inbound Health의 자산을 인수했다. Inbound는 그에 앞서 자사 hospital-at-home 모델 운영을 접었다.","scale":"","note":"원문에 인수 금액이나 지불 주체는 나오지 않는다.","sells_to":"other"}],"notes":[{"term":"hospital-at-home","ko":"재택 입원","plain":"원래 입원해야 할 환자를 집에 두고 방문 인력과 원격 모니터링으로 치료하는 방식이다. 미국에서는 코로나 시기에 Medicare가 한시적으로 값을 쳐 주면서 크게 늘었는데, 그 지불 근거가 흔들리면 사업 자체가 성립하지 않는다. 여기서 한 회사가 운영을 접었다는 것은 그 어려움을 보여 준다."}]},{"heading_ko":"짧은 소식: Oasis Health Partners의 Premier Health 인수","heading_en":"TOP HEADLINES","skip":null,"summary":"성과 기반 진료를 돕는 회사가 청구·수납과 진료 운영을 다루는 회사를 사들였다. 진료의 질을 다루는 쪽이 돈 받는 업무까지 함께 쥐려는 움직임이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Oasis Health Partners와 Premier Health","what":"VBC 이네이블러인 Oasis Health Partners가 레비뉴 사이클 및 진료 운영 플랫폼인 Premier Health를 인수했다.","scale":"","note":"보도자료는 Oasis가 최근 PreferCare와의 파트너십으로 North Carolina에 진출했다는 점을 언급한다.","sells_to":"provider"}],"notes":[{"term":"VBC enabler","ko":"성과 기반 진료 이네이블러","plain":"동네 의원이 환자 수 대신 환자 건강 성과로 돈을 받는 계약을 감당할 수 있게, 데이터와 인력과 자금을 대신 대 주는 회사다. 미국 개원의는 혼자서 이런 계약의 위험을 질 수 없기 때문에 이런 중간 사업자가 생겼다."},{"term":"revenue cycle","ko":"레비뉴 사이클, 청구·수납","plain":"진료를 하고 나서 보험사에 청구서를 넣고, 거절당하면 다시 넣고, 환자에게 본인부담금을 받아 내는 일련의 사무 업무다. 미국은 보험사마다 규칙이 달라 이 업무만 전담하는 산업이 따로 존재한다. 한국의 심사평가원 청구 업무와 비슷하지만 상대가 수백 곳으로 쪼개져 있다고 보면 된다."}]},{"heading_ko":"이번 주의 차트: AI 스크라이브와 코딩 인텐시티","heading_en":"CHART OF THE WEEK: Trilliant's exploration of hospital coding intensity","skip":null,"summary":"의사의 말을 대신 받아 적는 AI를 도입한 병원에서 진료비 청구 등급이 올라가고 있다는 분석이다. 같은 진료를 더 비싸게 청구하게 되는 것인지, 원래 놓치던 것을 제대로 적게 된 것인지가 쟁점이다. 원문은 어느 쪽이라고 단정하지 않고 가능한 요인들을 짚는 데 그친다.","insight":null,"signal":null,"author":[{"claim":"Trilliant의 관점이 유익하고 결이 섬세하며, 이 글은 원인이 될 만한 여러 요인을 잘 짚어 준다.","evidence":"근거를 대지 않았다. 어떤 요인이 설득력 있는지는 직접 평가하지 않았다."}],"experts":[{"who":"Trilliant Health 팀","role":"헬스케어 데이터를 분석해 발표하는 회사. 병원의 청구 행태를 바깥에서 관찰하는 쪽이다.","claim":"AI 스크라이브를 도입한 헬스 시스템에서 외래 E/M 방문의 인텐시티가 신규 환자와 기존 환자 모두에서 일관되게 올라가는 추세가 나타난다.","evidence":"AI 스크라이브를 도입한 헬스 시스템 여섯 곳의 데이터를 살폈고, 신규 환자 방문의 코딩 인텐시티 추이를 차트로 제시했다."}],"cases":[],"notes":[{"term":"AI scribe","ko":"AI 스크라이브","plain":"진료실 대화를 듣고 진료 기록을 자동으로 작성해 주는 도구다. 미국 의사는 청구를 위해 기록을 아주 자세히 남겨야 해서 진료 시간만큼 기록 시간을 쓰는데, 그 부담을 덜어 주는 용도로 빠르게 퍼졌다."},{"term":"coding intensity, E/M visit","ko":"코딩 인텐시티, 진찰 등급","plain":"미국 의사는 진찰 한 건을 얼마나 복잡했는지에 따라 등급으로 나눠 청구하며, 등급이 높을수록 받는 돈이 많다. 코딩 인텐시티는 그 등급이 평균적으로 얼마나 높은지를 뜻한다. 기록이 자세할수록 높은 등급의 근거가 생기므로, 진료 내용이 그대로여도 기록 도구만 바뀌면 청구액이 올라갈 수 있다는 것이 이 분석의 문제의식이다."}]},{"heading_ko":"필자의 생각: 헬스케어 혁신과 신뢰 쌓기","heading_en":"MY MUSING: A reflection on building trust in healthcare innovation","skip":null,"summary":"North Carolina 주 공무원 보험을 정상화하는 작업을 다룬 팟캐스트 후기다. 가격을 공개해 비용을 낮추려던 이전 실험이 어떻게 거꾸로 비용을 올렸는지, 그리고 지금은 본인부담 0원 번들로 가입자를 값싼 곳으로 옮기려 한다는 이야기가 나온다. 필자가 붙잡는 대목은 제도 설계가 아니라, 보험료를 올린 직후에 가입자의 신뢰를 어떻게 얻느냐는 문제다.","insight":"보험이 이미 본인부담 0원으로 주는 항목이 있어도 가입자가 그것을 모르면 아무 일도 일어나지 않는다는 것이 이 꼭지의 구조다. 유저에게 보험 정보를 받아 지금 자기 보험에서 공짜인 항목을 목록으로 보여 주고, 해당 시기가 되면 알려 주는 화면은 소프트웨어 인력만으로 3개월 안에 만들 수 있다. 우리는 보험사가 아니어서 절약을 권할 때 이해관계 의심을 덜 받는데, 필자와 Friedman이 지적한 신뢰 문제가 바로 그 자리다.","signal":null,"author":[{"claim":"Clear Pricing Project는 비용을 줄이려던 시도가 어떻게 정반대 결과를 낳는지 보여 주는 훌륭한 사례 연구다.","evidence":"과거에 참조가격보다 적게 받던 프로바이더는 참여를 선택했고 이미 더 많이 받던 곳은 참여할 이유가 없었으므로, 결과적으로 주 내 비용이 올라갔다는 설명을 들었다."},{"claim":"신뢰 쌓기를 혁신 도입 성공의 결정적 재료로 보는 프레이밍이 흥미롭고, 어떤 헬스케어 시도에서든 핵심 요소로 느껴진다.","evidence":"요즘 자신이 나누는 대화 대부분에서 신뢰 이야기가 나온다는 개인적 관찰을 들었다."}],"experts":[{"who":"Tom Friedman","role":"North Carolina State Health Plan 소속. 적자를 메우려고 주 공무원의 보험료를 올린 뒤 그 직원들에게 새 프로그램을 받아들이게 해야 하는 쪽이다.","claim":"페이어는 역사적으로 신뢰를 쌓는 데 그리 능하지 못했고, SHP가 이런 프로그램을 펼쳐 나가려면 신뢰 구축이 핵심이다.","evidence":"근거를 대지 않았다."}],"cases":[{"name":"North Carolina State Health Plan","what":"주 공무원과 그 가족에게 보험을 제공하는 제도이며, 적자를 메우기 위한 정상화 작업을 진행 중이다. Friedman과 동료들이 그 내용을 Health Affairs Forefront에 글로 정리했다.","scale":"North Carolina에서 약 75만 명을 커버하며, 2027년 말까지 약 10억 달러의 적자가 예상되던 상황이었다. 팟캐스트 제목에서는 플랜 규모를 55억 달러로 표기한다.","note":"정상화의 일부로 가입자의 보험료를 올렸고, 그 직후에 새 프로그램을 도입해야 하는 순서가 신뢰 문제를 낳았다.","sells_to":"other"},{"name":"Clear Pricing Project","what":"참조가격 모델로 가격 투명성을 높여 시장의 비용을 낮추려던 이전 이니셔티브이며, 이번에 접기로 결정되었다.","scale":"","note":"참여가 자율이었기 때문에 이득을 보는 프로바이더만 들어왔고, 그 결과 비용이 올랐다는 것이 필자의 설명이다.","sells_to":"none"},{"name":"Lantern과 Novant Health","what":"SHP가 Lantern과 손잡고 특정 수술 유형에 대해 본인부담이 없는 번들을 제공하며, 가입자를 더 저렴한 프로바이더로 유도하고 있다. Novant Health도 여기에 합류했다.","scale":"","note":"값을 깎는 것이 아니라 사람이 가는 곳을 바꾸는 방식이며, 그래서 가입자의 행동 변화가 성패를 가른다.","sells_to":"employer"}],"notes":[{"term":"State Health Plan","ko":"주 공무원 보험","plain":"주 정부가 자기 공무원과 교사, 그 가족에게 제공하는 건강보험이다. 주 정부가 곧 고용주이자 돈을 내는 쪽이라 규모가 크고, 새로운 시도를 해 볼 수 있는 실험장이 된다. 한국에는 직장 단위로 이런 별도 보험을 설계하는 관행이 없어 대응되는 제도가 없다."},{"term":"reference-based pricing","ko":"참조가격","plain":"병원마다 제각각인 값을 그대로 인정하지 않고, 보험이 낼 상한선을 미리 정해 두는 방식이다. 상한을 넘는 부분은 환자나 병원이 감당하게 해서 값을 끌어내리려는 의도다. 문제는 참여가 자율일 때인데, 원래 그보다 적게 받던 병원만 들어오고 더 받던 병원은 빠지면 오히려 평균 지출이 올라간다."},{"term":"active purchaser","ko":"능동적 구매자","plain":"보험이 청구서를 받아 값을 치르기만 하는 것이 아니라, 어디서 진료받을지까지 직접 설계하고 유도하는 역할을 뜻한다. 본인부담 0원 번들은 그 수단으로, 지정된 병원에 가면 환자가 한 푼도 내지 않게 만들어 사람이 스스로 옮기게 한다."}]},{"heading_ko":"곱씹어 볼 인용: Klomp의 기본 등록 발언","heading_en":"A QUOTE TO PONDER","skip":null,"summary":"Medicare를 총괄하는 정부 인사가 수급자를 어디에 기본값으로 등록시킬지를 검토 중이라고 밝힌 인터뷰다. 같은 주에 Medicare Advantage가 비용 관리를 못한다는 비판도 했기 때문에, 두 발언을 나란히 놓으면 모순처럼 보인다는 것이 이 꼭지의 출발점이다. 필자는 모순이 아니라 하나의 방향으로 읽는다.","insight":null,"signal":null,"author":[{"claim":"지난 몇 달간 Klomp의 발언을 이어 붙이면 CMS에서 나오는 공통의 실마리가 보이며, 그 발언들은 서로 잘 맞아떨어진다.","evidence":"가입자와 장기적이고 어카운터블한 관계를 장려한다는 축과, Medicare Advantage가 납세자의 돈을 잘 관리하게 만든다는 축 두 가지로 설명했다. 다만 이어 붙였다는 이전 발언들을 구체적으로 제시하지는 않았다."}],"experts":[{"who":"Chris Klomp","role":"CMS에서 Medicare를 총괄하는 정부 인사. 제도의 방향을 정하는 쪽이며, 동시에 MA에 나가는 지출을 방어해야 하는 위치다.","claim":"모든 수급자가 어카운터블한 관계 안에 있게 하는 것이 CMS의 목표이며, 기본 등록을 ACO나 후속 CMMI 모델로 하는 것도, Medicare Advantage로 하는 것도 가능하다. 어느 쪽이든 fee-for-service로 기본 등록하는 것보다 낫다.","evidence":"어카운터블한 관계가 더 높은 품질 지표와 더 나은 임상 경험, 더 나은 임상 성과로 이어진다고 말했으나 수치나 연구를 제시하지는 않았다. 이번 행정부에서 실제로 시행할 것이냐는 질문에는 '검토하고 있는 사안'이라고만 답했다."},{"who":"Mario Aguilar","role":"STAT 소속 기자. 이 인터뷰를 진행했다.","claim":"질문자로 등장할 뿐 자기 주장을 하지 않는다.","evidence":"해당 없음."}],"cases":[{"name":"Bloomberg 보도","what":"같은 행사에서 나온 Klomp의 발언 일부를 목요일에 보도했으며, Medicare Advantage가 비용을 충분히 관리하지 못하고 있다는 취지였다.","scale":"","note":"같은 사람의 같은 날 발언인데도 한쪽은 MA 비판으로, 다른 쪽은 MA 기본 등록 검토로 읽힌다는 점이 이 꼭지의 핵심이다.","sells_to":"none"}],"notes":[{"term":"Medicare Advantage","ko":"메디케어 어드밴티지","plain":"Medicare는 65세 이상을 위한 공적보험이고, MA는 그 사람을 민간 보험사가 대신 맡는 방식이다. 정부가 보험사에 1인당 정액을 주고 보험사가 진료비를 관리하므로, 보험사는 적게 쓸수록 이득을 본다. 그래서 값싸게 관리한다는 장점과, 환자에게 필요한 진료를 막는다는 비판이 늘 함께 따라다닌다."},{"term":"fee-for-service","ko":"행위별 수가","plain":"진료 행위 하나하나에 값을 매겨 그때그때 치르는 방식이며, 한국 건강보험이 쓰는 방식과 같다. 환자 선택이 자유롭다는 장점이 있지만, 많이 할수록 병원이 더 버는 구조라 관리하는 주체가 아무도 없다. Klomp가 '지속적인 관계가 없다'고 말한 것이 이 지점이다."},{"term":"ACO, MSSP","ko":"책임의료조직, 메디케어 절감 공유 프로그램","plain":"의사와 병원이 한 무리로 묶여 자기들에게 배정된 수급자 전체의 비용과 성과를 함께 책임지는 구조다. 예상보다 적게 쓰고 품질 기준을 지키면 아낀 돈의 일부를 나눠 받는다. 환자는 여전히 자유롭게 병원을 고를 수 있고, 자기가 어느 ACO에 속했는지 모르는 경우도 많다."},{"term":"CMMI","ko":"메디케어·메디케이드 혁신 센터","plain":"CMS 안에서 새로운 지불 방식을 시범 사업으로 돌려 보는 조직이다. 여기서 성과가 나면 전국 제도로 확대할 수 있는 권한이 있어, 미국 지불 제도 변화는 대체로 이곳을 거친다."}]},{"heading_ko":"펀딩: Latent 8,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"전문 의약품의 승인 절차를 AI로 처리하는 회사가 큰돈을 모았다. 고객은 환자가 아니라 병원이며, 승인 업무의 병목이 그만큼 크다는 뜻이기도 하다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Latent","what":"전문 의약품 승인을 처리하는 AI 플랫폼이며, 헬스 시스템에 판다. Spark Capital과 Transformation Capital이 참여했다.","scale":"6억 달러 밸류에이션에 8,000만 달러 조달. 헬스 시스템 45곳이 고객이며 미국 상위 20개 시스템 중 절반을 포함한다.","note":"Ochsner Health가 Latent와 협업하며 자사 전문 약국 사업에서 전년 대비 30% 성장을 보고했다고 하나, 이 수치는 보도자료에서 나온 것이다.","sells_to":"provider"}],"notes":[{"term":"specialty medicine","ko":"전문 의약품","plain":"항암제나 자가면역 치료제처럼 값이 아주 비싸고 취급이 까다로운 약이다. 값이 크기 때문에 보험이 내주기 전에 승인 절차를 반드시 거치게 하는데, 이 서류 작업이 병원 입장에서는 큰 부담이라 대신 처리해 주는 사업이 성립한다."}]},{"heading_ko":"펀딩: Turquoise Health 4,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"가격 투명성 데이터를 다루던 회사가 계약 플랫폼으로 방향을 넓히며 자금을 모았다. 고객이 소비자가 아니라 병원·보험사·제약사·브로커라는 점이 이 회사의 성격을 말해 준다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Turquoise Health","what":"가격 투명성 플랫폼이며, 헬스케어 조직들을 위한 계약 플랫폼이 되겠다는 목표를 갖고 있다. Oak HC/FT가 라운드를 주도했다.","scale":"4,000만 달러 조달, 누적 조달액 1억 달러에 근접. 고객 280곳 이상.","note":"고객이 선도적인 헬스 시스템, 페이어, 제약사, 보험 브로커에 걸쳐 있다. 값을 알고 싶어 하는 소비자는 고객 목록에 없다.","sells_to":"provider"}],"notes":[{"term":"price transparency","ko":"가격 투명성","plain":"미국은 같은 시술이라도 병원마다, 보험마다 값이 다르고 그 값이 공개되지 않아 환자가 미리 알 수 없었다. 이를 바로잡겠다며 병원과 보험사가 협상 가격을 공개하도록 하는 규제가 도입되었고, 그 데이터를 정리해 파는 사업이 생겼다. 한국처럼 수가가 전국 단일로 정해져 있는 나라에는 없는 산업이다."}]},{"heading_ko":"펀딩: Lantern 3,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"고용주를 위해 수술 진료 네트워크를 운영하는 회사가 자금을 모았다. 앞의 North Carolina 주 공무원 보험 꼭지에 나온 파트너가 이 회사다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Lantern","what":"고용주를 위한 수술 진료 네트워크이며, 값싸고 성과가 좋은 병원을 골라 묶어 준다. Morgan Health와 Echo Health Ventures가 라운드를 주도했다.","scale":"3,000만 달러","note":"직원이 쓰더라도 고르고 돈을 내는 쪽은 고용주와 주 정부다.","sells_to":"employer"}],"notes":[]},{"heading_ko":"펀딩: Conduit Health 1,700만 달러","heading_en":"Funding Announcements","skip":null,"summary":"의료 기기와 용품 유통을 다루는 플랫폼이 자금을 모았다는 한 줄 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Conduit Health","what":"DME 플랫폼이며 Drive Capital이 라운드를 주도했다.","scale":"1,700만 달러","note":"원문에 고객이나 지불 주체는 나오지 않는다.","sells_to":"other"}],"notes":[{"term":"DME","ko":"내구성 의료 기기","plain":"휠체어, 산소 발생기, 혈당 측정기처럼 집에서 오래 쓰는 의료 기기와 용품을 뜻한다. 미국에서는 보험이 값을 내주는 대상이라 처방과 승인, 배송, 청구가 얽혀 있고, 그 과정을 다루는 사업이 따로 존재한다."}]},{"heading_ko":"펀딩: Nadia Care 1,200만 달러","heading_en":"Funding Announcements","skip":null,"summary":"임신과 출산 전후를 돌보는 진료 모델 회사가 자금을 모았다. 상대는 저소득층 공적보험 플랜이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Nadia Care","what":"산모 케어 모델이며 이전에는 Cayaba Care로 알려져 있었다. DC, Maryland, Tennessee의 지역 Medicaid 플랜들과 일해 왔다. Valtruis가 이름을 밝히지 않은 전국 단위 페이어와 함께 라운드를 주도했다.","scale":"1,200만 달러","note":"산모를 직접 돌보지만 돈은 Medicaid 플랜이 낸다. 투자자에 페이어가 끼어 있다는 점도 판로를 함께 사는 성격을 보여 준다.","sells_to":"payer"}],"notes":[{"term":"Medicaid plan","ko":"메디케이드 플랜","plain":"저소득층을 위한 공적보험을 주별로 민간 보험사가 위탁 운영하는 형태다. 미국 출산의 상당 부분이 이 제도 안에서 이뤄지기 때문에, 산모 케어 사업의 고객은 산모가 아니라 이 플랜이 된다."}]},{"heading_ko":"읽을거리: 역대 최고의 NBPP 제안","heading_en":"What I'm Reading: CMS Proposes Its Best NBPP Yet","skip":null,"summary":"개인이 직접 사는 보험 시장의 내년 규칙안을 호평하는 글이다. 필자는 소개만 하고 자기 평가를 덧붙이지 않았다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Brian Blase","role":"이 글의 필자. 원문에 소속이나 이해관계는 나오지 않는다.","claim":"이번 안은 자신이 본 것 중 최고의 Notice of Benefit and Payment Parameters다.","evidence":"선택지 확대, 경쟁 강화, 지급 무결성 개혁 등을 이유로 들었다. 구체적인 조항이나 수치는 이 뉴스레터에 인용되지 않았다."}],"cases":[],"notes":[{"term":"NBPP","ko":"혜택·지급 기준 고시","plain":"ACA 거래소에서 개인이 사는 보험이 내년에 어떤 규칙으로 운영될지를 정부가 해마다 정해 내놓는 문서다. 보험이 무엇을 반드시 보장해야 하는지, 보조금을 어떻게 계산하는지, 네트워크 기준이 어떤지가 여기서 정해지므로 시장 참여자 모두가 이 문서를 기다린다."}]},{"heading_ko":"읽을거리: 유령 네트워크보다 나쁜 것은 네트워크 없는 플랜","heading_en":"What I'm Reading: What's Worse than a Ghost Network Plan? A No-Network Plan","skip":null,"summary":"앞 꼭지에서 호평받은 그 규칙안을 정반대로 비판하는 글이다. 같은 문서를 두고 평가가 갈린다는 점을 필자가 나란히 배치했다. 네트워크가 없는 보험은 곧 환자가 값을 스스로 감당해야 한다는 뜻이라 소비자에게 직접 영향을 준다.","insight":null,"signal":null,"author":[],"experts":[{"who":"Sabrina Corlette, Jason Levitis, Lindsey Murtagh","role":"Georgetown CHIR 소속 연구진. 소비자 보호 관점에서 보험 시장 규제를 연구하는 쪽이다.","claim":"NBPP가 ACA 시장에서 네트워크 없는 플랜을 장려하는 것은 오늘날 미국 헬스케어의 현실을 무시하는 처사다.","evidence":"이 뉴스레터에는 주장만 요약되어 있고 근거는 인용되지 않았다."}],"cases":[],"notes":[{"term":"network, ghost network, no-network plan","ko":"네트워크, 유령 네트워크, 네트워크 없는 플랜","plain":"미국 보험은 미리 계약을 맺은 병원 목록 안에서만 제값을 내주며 이 목록을 네트워크라고 한다. 유령 네트워크는 목록에는 올라 있는데 실제로는 예약이 안 되거나 그만둔 의사가 남아 있는 상태이고, 네트워크 없는 플랜은 아예 목록 자체가 없는 상품이다. 목록이 없으면 협상된 값도 없어서 환자가 병원이 부르는 값을 그대로 마주하게 된다. 한국에는 이런 구분 자체가 없다."}]},{"heading_ko":"읽을거리: 의사들의 빠른 AI 도입과 정확도 우려","heading_en":"What I'm Reading: Doximity Study Finds Physicians Rapidly Adopting AI, But Accuracy Concerns Persist","skip":null,"summary":"의사 대상 네트워크 회사가 자체 진행한 AI 도입 실태 조사다. 필자도 새로울 것은 없다고 평가한다.","insight":null,"signal":null,"author":[{"claim":"획기적인 내용은 없지만 의사들이 실제 진료에서 AI를 어떻게 쓰는지 보여 주는 좋은 데이터 포인트가 담겨 있다.","evidence":"근거를 대지 않았다. 어떤 수치가 눈여겨볼 만한지는 인용하지 않았다."}],"experts":[],"cases":[{"name":"Doximity","what":"의사들의 AI 도입에 대해 자체적으로 진행한 연구 결과를 공유했다.","scale":"","note":"조사 대상인 의사들이 곧 이 회사의 이용자이고 연구도 자체 진행이라, 도입률이 높게 나오는 방향이 회사에 유리하다는 점을 감안해야 한다.","sells_to":"other"}],"notes":[]},{"heading_ko":"읽을거리: 도를 넘고 있는 펩타이드 열풍","heading_en":"What I'm Reading: The Peptide Boom Is Getting Out of Hand","skip":null,"summary":"정식 승인 경로 밖에서 펩타이드를 사서 쓰는 회색시장이 커지고 있다는 기사를 소개한다. 필자는 평소 관심이 없다가 이번 주에 눈이 갔다고 밝히며, 이 논의가 얼마나 주류로 올라올지 지켜보겠다고 한다. 이번 회차에서 소비자가 자기 돈을 쓰는 행동이 드러나는 유일한 자리다.","insight":"승인 밖에서 스스로 주사제를 구해 쓰는 사람은 무엇을 언제 얼마나 썼고 몸이 어땠는지 남길 곳이 마땅치 않다. 주사와 복용 기록, 부위와 용량, 그날의 몸 상태를 적는 화면은 진단이나 처방을 건드리지 않으므로 소프트웨어 인력만으로 3개월 안에 만들 수 있다. 다만 원문은 열풍의 규모를 숫자로 보여 주지 않으므로, 만들기 전에 실제로 얼마나 많은 사람이 그렇게 하고 있는지는 따로 확인해야 한다.","signal":"미국 소비자가 정식 승인 절차를 기다리지 않고 자기 돈으로 주사제를 구해 쓰는 거래가 커지고 있으며, 그 논의가 The Atlantic 같은 대중 매체와 소셜 미디어로 번지고 있다. 승인과 처방이라는 관문 바깥에 수요가 고여 있다는 뜻이다.","author":[{"claim":"이 회색시장 펩타이드 열풍에 대한 논의가 얼마나 주류로 올라오게 될지 지켜보는 것이 흥미로울 것이다.","evidence":"The Atlantic의 기사와 Martin Shkreli의 X 게시물 두 가지를 들었다."}],"experts":[],"cases":[{"name":"회색시장 펩타이드","what":"정식 승인 경로 밖에서 펩타이드를 사고 쓰는 거래가 커지고 있으며, 대중 매체와 소셜 미디어에서 논의되기 시작했다.","scale":"","note":"소비자가 자기 돈을 직접 내는 시장이지만, 원문에는 시장 규모를 보여 주는 숫자가 없다.","sells_to":"consumer"}],"notes":[{"term":"peptide, grey market","ko":"펩타이드, 회색시장","plain":"펩타이드는 몸 안의 신호 물질을 흉내 낸 짧은 단백질 조각이며 대체로 주사로 쓴다. 미국에서는 이 가운데 상당수가 정식 의약품 승인을 받지 않은 채 연구용 등의 이름으로 팔린다. 완전한 불법도 아니고 합법 의약품도 아닌 이 중간 지대를 회색시장이라고 부르며, 값과 품질과 안전이 판매자에 따라 제각각이다."}]},{"heading_ko":"HTN 콘텐츠: Community Brain Trust","heading_en":"HTN Content","skip":"promo","summary":"뉴스레터가 자기 커뮤니티 콘텐츠를 알리는 자리다. 난임 치료 전달 방식, Medicaid 개편안, 정신건강 AI 도구 평가를 다룬다고 소개한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"HTN 콘텐츠: 주간 정책 브리핑","heading_en":"HTN Content","skip":"promo","summary":"자사 정책 브리핑을 알리는 자리다. MedPAC 권고안, 주 지정 지급, ESRD 번들 지급을 다룬다고 소개한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"HTN 콘텐츠: Imagine Pediatrics 인터뷰","heading_en":"HTN Content","skip":"promo","summary":"자사 인터뷰 콘텐츠를 알리는 자리다. 특별한 의료적 요구가 있는 아동이 집에서 안전하게 보내는 날을 늘리는 주제를 다룬다고 소개한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"HTN 콘텐츠: 팟캐스트 목록","heading_en":"HTN Content","skip":"promo","summary":"자사 팟캐스트 네 편을 링크와 함께 알리는 자리다. 이번 회차 본문에 나온 Tom Friedman 인터뷰도 여기에 포함된다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]}],"themes":["hospital-health-system","medicare-advantage","value-based-care","rcm-billing","price-transparency","digital-health-funding"],"for_later":[]},{"index":"26","date":"2026-03-29","type":"reads","title_en":"Weekly Health Tech Reads 3/29/26","title_ko":"펩타이드 열풍과 펀딩 열두 건","hook":"미국 소비자가 정체를 모르는 주사를 스스로 사는 동안, 투자자는 그 흐름에 돈을 걸었다.","tldr":[{"point":"필자는 2026년 1분기를 마무리하며 올해 헬스케어 논의를 지배하는 흐름으로 임상 진료의 AI와 롱제비티 모델 두 가지를 꼽는데, 이번 주에 발표된 스타트업 펀딩 열두 건도 대부분 이 두 가지 안에 들어간다. 병원 안에 엔지니어를 들여보내 AI 과제를 함께 만드는 Qualified Health가 1억 2,500만 달러를, 병원의 청구서를 보험사에 중계하는 Stedi가 5,000만 달러를 조달한 것이 그 예다.","note":"롱제비티 모델이란 아픈 데를 고치는 진료가 아니라, 건강한 사람이 자기 돈을 내고 노화를 늦추겠다며 검사와 주사를 받는 시장을 가리킨다."},{"point":"이번 회차의 중심 글은 필자가 회색 시장 펩타이드 열풍을 두고 쓴 단상이며, 그는 논쟁의 진짜 쟁점이 효능의 증거가 아니라 FDA 같은 기관에 대한 불신이라고 보고, 나쁜 결과와 규제 당국의 조사를 거쳐 펩타이드가 결국 자리 잡힌 시장으로 정착할 것이라고 예측한다. 같은 주에 롱제비티 진료 기관 eMed가 기업가치 20억 달러가 넘는 조건으로 2억 달러를, 조제 약국과 롱제비티 클리닉을 연결하는 VITL이 750만 달러를 조달했고, 필자는 이 두 건을 투자자가 앞으로 올 펩타이드 붐을 기대하고 있다는 신호로 읽는다. eMed가 고용주에게 자사 GLP-1 관리 상품을 팔면서 내세운 근거도 임상 결과가 아니라 환자 순응도 90%다.","note":"펩타이드는 아미노산이 짧게 이어진 물질을 통틀어 가리키는 말이지만, 미국에서 요즘 펩타이드라고 하면 대개 FDA가 그 용도로 승인하지 않은 채 롱제비티 클리닉이나 개인 수입 경로로 도는 주사제를 뜻한다."},{"point":"임상 진료용 AI 모델을 만드는 Doctronic이 12개월도 안 되는 사이 세 번째로 4,000만 달러를 조달했지만, 주간 방문자 30만 명 가운데 실제 유료 원격진료 방문으로 이어지는 비율은 2%가 되지 않는다.","note":"이 2%는 회사가 발표한 값이 아니라, 필자가 회사가 밝힌 연환산 매출 1,000만 달러와 상담 단가 39달러를 놓고 직접 역산한 추정치다."},{"point":"헬스케어 프로바이더 임원의 88%가 앞으로 12개월간 입원 건당 인건비가 오를 것이라고 답했고, 필자는 이 숫자가 AI 덕분에 곧 의료 공급 비용이 거의 사라진다는 여러 주장과 어긋난다고 본다. 같은 문제를 인력 쪽에서 푸는 회사도 이번 주에 돈을 받았는데, 학자금 대출 상환을 지원해 병원이 채용한 임상 인력이 오래 근무하도록 돕는 Clasp가 2,000만 달러를 조달했다.","note":"설문을 진행한 곳은 헬스케어 전문 투자사 Health Enterprise Partners이고 응답자는 이 회사에 돈을 댄 기관 150곳이므로, 표본이 업계 안쪽 시각에 치우쳐 있다는 점을 감안해야 한다."},{"point":"매사추세츠에서 고중증도 퇴원 건수가 최근 몇 년 사이 크게 늘었는데, 환자가 실제로 더 위중해진 것인지 아니면 AI 문서화 도구 덕분에 청구서에 무거운 코드가 더 많이 붙게 된 것인지를 두고 신문 기사가 의문을 제기한다. 같은 주에 의학 정보 검색으로 의사들 사이에 자리 잡은 OpenEvidence가 의사가 벌어들인 돈을 빠짐없이 받게 해 준다는 취지의 청구 코드 제품을 내놓아, 같은 흐름이 이미 상품으로 팔리고 있음을 보여 준다.","note":"미국은 진단이 무겁게 기록될수록 병원이 받는 금액이 커지기 때문에, 빠뜨린 코드를 찾아 붙여 주는 소프트웨어가 곧바로 병원 매출로 이어진다."},{"point":"미국 법무부가 뉴욕의 대형 병원 그룹 New York Presbyterian을 반독점으로 제소했고, 쟁점은 진료의 질이 아니라 보험사가 값싼 병원을 우대하거나 환자를 그쪽으로 안내하지 못하게 막는 계약 조항이다. 필자는 소장을 직접 읽어 본 뒤 특별히 강력한 사건으로 보이지는 않았다고 평가한다.","note":"미국은 전국민이 함께 드는 건강보험이 없어 보험사와 병원이 개별 계약으로 값을 정하기 때문에, 그 계약서에 적힌 문구 하나가 소비자가 내는 보험료와 본인 부담금을 좌우한다."},{"point":"직원 의료비를 회사 돈으로 직접 부담하는 고용주를 상대로 대안적 보험 플랜을 파는 XO Health가 전국으로 확장했고, 필자는 이를 몇 년째 말만 오가던 대안적 플랜 설계를 고용주들이 실제로 채택하기 시작하는 변곡점으로 읽는다.","note":"미국 직장인 상당수는 회사를 통해 건강보험에 드는데, 회사가 의료비를 직접 지급하는 방식에서는 의료비가 줄어든 만큼 회사가 이익을 보기 때문에 새로운 플랜을 시험할 동기가 생긴다."},{"point":"미국 공보험을 운영하는 연방 기관이 무엇을 잘한 진료로 볼 것인지 다시 정하는 자리에서 나온 첫 번째 시사점은 초점이 치료에서 예방 서비스로 옮겨 가고 있다는 것이며, 필자가 함께 소개한 다른 글도 의사에게 진료 건수가 아니라 환자를 건강하게 유지한 결과로 돈을 지급하자는 주장을 편다.","note":"연방 기관이 무엇을 측정하느냐에 따라 병원과 보험 플랜이 받는 금액이 달라지므로, 측정 항목이 바뀌면 현장이 힘을 쏟는 곳도 함께 바뀐다."}],"issue_insight":{"verdict":"yes","summary":"이번 회차의 서른두 꼭지 가운데 스물아홉 꼭지는 병원과 보험사, 청구 업무를 상대로 하는 B2B 소식이거나 뉴스레터 자체 홍보여서 B2C 앱 화면으로 옮길 것이 없다. 미국 소비자가 직접 등장하는 자리를 겹쳐 놓으면 하나의 판단이 나오는데, 소비자는 이미 자기 돈과 시간을 쓰고 있는데 그 결정이 맞는지 확인해 줄 곳이 없다는 것이다.","build":[{"title":"펩타이드와 GLP-1 자가 실험 일지","detail":"사용자가 무엇을 언제 시작했는지 표시해 두면, 이미 매일 받고 있는 걸음과 수면 데이터로 시작 전 4주와 시작 후 4주를 자동으로 대조해 보여 줄 수 있다. 효능을 주장하지 않고 본인 데이터만 비교하는 형태로 두면 규제 허가가 필요하지 않다.","section":9},{"title":"진단이 아니라 정보 제공으로 묶은 건강 상담 창구","detail":"증상과 검진 수치, 복용 중인 약에 대해 물어볼 수 있는 상담 창구는 3개월 안에 붙일 수 있다. 답변 범위를 정보 제공으로 묶어 진단이나 처방으로 읽히지 않게 설계하는 것이 관건이다.","section":15},{"title":"GLP-1 사용자를 계속 맞게 만드는 동반 트랙","detail":"주사 요일 알림과 투여 기록, 몸 상태 기록, 단백질 섭취와 걷기 과제를 한 묶음으로 엮으면 걸음 리워드가 이미 만들어 놓은 반복 행동에 얹을 수 있다. 약을 팔지 않으므로 허가는 필요 없지만, 미국 사용자 가운데 약을 쓰는 사람 수가 시험에 충분한지 먼저 확인해야 한다.","section":17}],"signal":[{"title":"승인 절차 밖의 주사제를 소비자가 스스로 사서 맞는다","detail":"필자는 소비자가 지갑을 열어 중국산 회색 시장 펩타이드를 주사하는 것으로 선호를 드러내고 있다고 적었고, 관심도가 지난 1년간 급등한 차트를 근거로 들었다. Gameday Men's Health가 미국 전역에 400개가 넘는 프랜차이즈 클리닉을 두고 있어, 이 수요가 오프라인 점포로도 규모를 갖췄다.","section":9},{"title":"무료 AI 상담에는 몰리지만 진료비는 2%도 내지 않는다","detail":"주간 방문자 30만 명이 무료 AI 상담 창구로 찾아오는데, 필자가 매출과 상담 단가로 역산한 유료 원격진료 전환은 2%에 미치지 못한다. 건강을 물어볼 곳을 찾는 수요와 진료비를 내는 수요는 크기가 다르다.","section":15},{"title":"GLP-1 시장에서 값이 붙는 것은 약이 아니라 계속 맞게 만드는 관리다","detail":"eMed는 골드 스탠더드를 주장하며 임상 결과가 아니라 환자 순응도 90%를 근거로 내걸고 2억 달러를 조달했다. 이 숫자는 회사의 자기 주장이지만, 시작한 사람이 계속 맞기 어려워하는 사정이 그만큼 흔하다는 것을 보여 준다.","section":17},{"title":"소비자가 직접 돈을 내는 롱제비티 클리닉이 630곳을 넘는다","detail":"조제 약국과 롱제비티 클리닉을 연결하는 VITL이 클리닉 고객 630곳과 연환산 매출 1,000만 달러를 밝혔다. 소비자가 스스로 찾아가 주사를 받는 창구와 그 공급망이 이미 매출을 내는 사업으로 서 있다는 뜻이다.","section":23}]},"sections":[{"heading_ko":"인사말","heading_en":"","skip":"admin","summary":"1분기를 마무리하며 이번 주에 다룰 주제를 예고하는 짧은 인사다. 다음 주는 부활절이라 쉬고 4월 6일에 라이브를 진행한다는 안내가 붙는다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"라이브 방송 예고","heading_en":"Catch The Grand Round Up LIVE, Tomorrow @ 12pm ET / 9am PT","skip":"promo","summary":"뉴스레터가 직접 운영하는 주간 라이브 방송을 알리는 자리다. 이번 주 게스트와 다룰 주제를 소개한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"법무부, New York Presbyterian 반독점 제소","heading_en":"Top Headlines","skip":null,"summary":"미국 법무부가 최근 몇 달 사이 두 번째로 대형 병원 그룹을 반독점으로 제소한 사건이다. 쟁점은 진료의 질이 아니라 병원이 보험사와 맺는 계약서의 조항들, 곧 그룹 병원을 전부 받아야 한다는 조항과 병원을 등급으로 나누거나 환자를 다른 병원으로 유도하지 못하게 막는 조항이다. 필자는 소장을 읽어 본 소감을 덧붙이는데, 사건 자체가 그리 강해 보이지 않는다는 쪽이다.","insight":null,"signal":null,"author":[{"claim":"특별히 강력한 반독점 사건이라는 느낌을 받지 못했으며, NYP는 자신이 고비용 상품임을 알고 그 위치를 편안해하는 조직처럼 읽힌다.","evidence":"소장에 실린 뉴욕시 지도들의 조합, 더 낮은 가격을 제시하는 경쟁자 이야기, NYP의 25% 시장 점유율에 대한 논의를 직접 읽은 인상을 근거로 든다."},{"claim":"가격을 낮추는 것이 주된 목표라면, 지금의 트레이드오프를 감안할 때 경쟁을 키우고 값을 내릴 가능성이 더 높은 다른 길들이 있다.","evidence":"그 다른 길이 무엇인지는 밝히지 않아 근거를 대지 않았다."}],"experts":[],"cases":[{"name":"미국 법무부(DOJ) 대 New York Presbyterian","what":"뉴욕시의 대형 병원 그룹인 New York Presbyterian이 보험사와 맺은 all-or-nothing 조항과 anti-tiering 및 steering 제한 조항을 걸어 반독점 소송을 제기했다.","scale":"NYP 시장 점유율 25%","note":"DOJ는 NYP가 내부 분석에서 티어링이 도입되면 매년 수억 달러의 이익이 사라진다는 결과를 얻었다고 지적한다. 병원이 그 조항의 값어치를 스스로 계산해 두었다는 뜻이다."}],"notes":[{"term":"티어링(tiering)과 anti-tiering, steering 조항","ko":"병원 등급 나누기와 그것을 금지하는 계약 조항","plain":"티어링은 보험사가 값이 싼 병원을 우대 등급에 넣어 환자 본인 부담을 낮춰 주고, 비싼 병원으로 가면 더 내게 만드는 방식이다. 미국은 전국민 단일 건강보험이 없고 보험사와 병원이 개별 계약으로 값을 정하므로, 병원을 등급으로 나누는 것이 보험사가 값을 누를 수 있는 몇 안 되는 수단이다. anti-tiering 조항은 계약서에 우리를 불리한 등급에 넣지 말라고 못 박아 그 수단을 막고, steering 제한 조항은 보험사가 환자를 더 싼 병원으로 안내하는 행위 자체를 막는다. 한국은 병원마다 수가가 다르지 않으므로 대응하는 제도 자체가 없다."},{"term":"all-or-nothing 조항","ko":"전부 아니면 전무 계약 조항","plain":"한 병원 그룹과 계약하려면 그 그룹에 속한 병원을 하나도 빼지 않고 모두 보험 네트워크에 넣어야 한다는 조건이다. 보험사가 값싼 병원만 골라 담아 보험료가 저렴한 상품을 만드는 길이 막힌다. DOJ가 더 저렴한 보험 상품이 시장에 들어오지 못한다고 보는 이유가 여기에 있다."}]},{"heading_ko":"뉴욕시 공공병원, Palantir 계약 종료","heading_en":"Top Headlines","skip":null,"summary":"뉴욕시 공공병원 시스템이 Palantir와의 계약을 갱신하지 않기로 했다. 제품 성능이나 성과가 아니라 Palantir가 이민 단속 기관을 포함한 정부 고객을 지원하는 데 대한 정치적 반발이 이유다. 계약 규모 자체는 크지 않다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"New York City Health + Hospitals","what":"청구와 수납 업무를 지원받으려고 써 온 Palantir와의 계약을 갱신하지 않기로 했다.","scale":"2023년 이후 지급액 약 400만 달러","note":"의료 소프트웨어 계약이 성능이 아니라 공급사의 다른 사업 때문에 끊긴 사례다."}],"notes":[{"term":"레비뉴 사이클 매니지먼트(RCM)","ko":"진료비 청구·수납 관리","plain":"환자를 진료한 뒤 보험사와 환자에게 실제로 돈을 받아 내기까지의 모든 과정을 관리하는 일이다. 미국은 보험사가 수천 곳이고 청구가 거절되면 근거를 붙여 다시 다투는 절차가 길어서, 병원 수익이 이 과정의 성패에 크게 좌우된다. 한국의 심평원 청구 업무보다 훨씬 손이 많이 가고, 그래서 이 영역만 다루는 회사와 소프트웨어가 따로 큰 시장을 이룬다."}]},{"heading_ko":"Infosys, Optimum Healthcare IT 인수","heading_en":"Top Headlines","skip":null,"summary":"헬스케어 IT 컨설팅 회사가 4억 6,500만 달러에 팔린 소식이다. 눈에 띄는 대목은 인수 금액보다 매출이 1년 만에 두 배 넘게 늘어난 속도와, 그 성장의 원인으로 지목된 것이 기술이 아니라 사람을 길러 낸 도제식 교육 프로그램이라는 점이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Infosys의 Optimum Healthcare IT 인수","what":"IT 서비스 기업 Infosys가 헬스케어 IT 컨설팅 회사 Optimum Healthcare IT를 인수한다고 발표했다.","scale":"인수가 4억 6,500만 달러, Optimum 매출 2024년 1억 700만 달러에서 2025년 2억 7,600만 달러","note":"Optimum의 대주주인 사모펀드(PE) 운용사는 지난 몇 년의 성장 요인으로 더 많은 인력을 업계로 끌어들인 도제식 교육 프로그램을 꼽는다."}],"notes":[]},{"heading_ko":"OpenEvidence, 청구 코드 제품 출시","heading_en":"Top Headlines","skip":null,"summary":"의학 정보 검색으로 의사들 사이에 자리 잡은 OpenEvidence가 청구 코드 영역까지 사업을 넓혔다. 의사가 벌어들인 돈을 빠짐없이 받게 해 준다는 취지의 제품이다. 필자는 전략의 논리는 이해하면서도 이미 경쟁이 치열한 시장에서 그 기세가 이어질지 의문을 남긴다.","insight":null,"signal":null,"author":[{"claim":"핵심인 검색 상품을 넘어 전통적인 청구·수납 기능으로 확장하는 것은 OpenEvidence로서 흥미로운 전략적 움직임이지만, 그 기세가 경쟁이 치열한 시장에서 어떻게 이어질지는 지켜봐야 한다.","evidence":"논리는 이해가 간다고만 밝힐 뿐 별도의 근거를 대지 않았으며, OpenEvidence가 이 제품의 사용량을 어떻게 발표하는지 보고 판단하겠다고 말한다."}],"experts":[],"cases":[{"name":"OpenEvidence Coding Intelligence","what":"의학 정보 검색 서비스인 OpenEvidence가 진료 내용을 청구 코드로 옮기는 작업을 돕는 새 제품을 출시했다.","scale":"","note":"제품 문구가 진료의 질이 아니라 의사가 받는 돈을 앞세운다."}],"notes":[{"term":"메디컬 코딩(coding)","ko":"진료 내용을 청구 코드로 옮겨 적는 일","plain":"프로그래밍과는 아무 상관이 없다. 의사가 무엇을 진단하고 무엇을 했는지를 정해진 번호 체계로 바꿔 적는 사무 작업이다. 어떤 코드를 붙이느냐에 따라 병원과 의사가 받는 금액이 달라지므로, 빠뜨린 코드를 찾아 주는 소프트웨어가 곧바로 매출로 이어진다. 한국은 수가 항목이 비교적 단순하고 심평원 한 곳이 심사하지만, 미국은 코드 체계가 방대하고 보험사마다 규칙이 달라 전문 직군이 따로 있다."}]},{"heading_ko":"XO Health 전국 확장","heading_en":"Top Headlines","skip":null,"summary":"직원 의료비를 회사가 직접 부담하는 고용주를 상대로 대안적 보험 플랜을 파는 회사가 전국으로 확장한다. 필자가 주목하는 것은 이 회사 자체보다, 몇 년째 말만 오가던 대안적 플랜 설계를 고용주들이 실제로 채택하기 시작하는 변곡점이라는 판단이다.","insight":null,"signal":null,"author":[{"claim":"지난 몇 년간 대안적 플랜 설계를 이야기해 온 끝에 이제 고용주들이 실제로 움직이기 시작하는 변곡점에 와 있다.","evidence":"XO Health가 전국으로 확장한다는 사실 하나를 앞에 두었을 뿐, 고용주들이 실제로 움직이고 있다는 수치나 다른 사례는 대지 않았다."}],"experts":[],"cases":[{"name":"XO Health","what":"자가보험 고용주, level-funded 플랜, TPA를 대상으로 성과 기반 진료 네트워크를 묶어 파는 회사이며 전국 단위로 확장한다.","scale":"","note":"보험사를 거치지 않고 고용주가 직접 의료비를 관리하는 쪽에 붙은 사업이다."}],"notes":[{"term":"자가보험(self-insured) 고용주","ko":"직원 의료비를 회사 돈으로 직접 지급하는 고용주","plain":"미국 직장인 상당수는 회사를 통해 건강보험에 든다. 자가보험이란 회사가 보험사에서 완제품 보험 상품을 사는 대신, 직원의 의료비를 회사 돈으로 직접 지급하고 보험사에는 청구 처리 같은 사무만 맡기는 방식이다. 의료비가 줄면 그만큼 회사가 이익을 보기 때문에, 새로운 플랜 설계를 실험할 동기가 생긴다. 한국은 건강보험공단이 이 역할을 하므로 회사가 직원 의료비를 직접 떠안는 구조 자체가 없다."},{"term":"TPA와 level-funded 플랜","ko":"제3자 관리 업체와 준자가보험 플랜","plain":"TPA는 자가보험 회사를 대신해 청구 처리와 병원 네트워크 운영 같은 사무를 맡는 업체다. level-funded 플랜은 그 중간 형태로, 회사가 매달 정해진 금액을 내되 실제 의료비가 적게 나오면 남은 돈의 일부를 돌려받는 구조다. 규모가 작아 완전한 자가보험은 부담스러운 중소 고용주가 주로 쓴다."}]},{"heading_ko":"HMA, 메디케이드 애널리틱스 회사 인수","heading_en":"Top Headlines","skip":null,"summary":"컨설팅 회사 Health Management Associates가 저소득층 공공 의료 부조 프로그램에 특화된 데이터 분석 회사를 인수한다는 한 줄짜리 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Health Management Associates의 HealthTech Solutions 인수","what":"헬스케어 컨설팅 회사가 메디케이드에 특화된 애널리틱스 플랫폼을 인수한다고 발표했다.","scale":"","note":""}],"notes":[]},{"heading_ko":"단상: 나도 펩타이드를 맞아야 하나","heading_en":"MUSING: Should I be injecting myself with peptides?","skip":null,"summary":"필자가 미국의 펩타이드 열풍을 두고 자기 생각을 정리한 글이다. 본인은 회의적이지만 임상의 친구의 절제된 낙관론과 TBPN 방송에서 열린 Shkreli 대 Marchione의 30분짜리 공개 토론을 거치면서, 논쟁의 진짜 축이 효능의 증거가 아니라 FDA 같은 기관에 대한 불신이라고 본다. 마지막에는 이 시장이 어떻게 흘러갈지를 순서대로 예측한다.","insight":"미국 소비자가 자기 돈으로 정체를 정확히 모르는 물질을 몸에 넣고 있다는 것이 이 꼭지의 사실이고, 그 불안을 채워 주는 곳이 아직 없다. 앱에서 3개월 안에 만들 수 있는 것은 지금 무엇을 쓰고 있는지 기록하고 몸의 반응과 대조해 주는 자가 실험 일지다. 이미 걸음과 수면 데이터를 매일 받고 있으므로, 사용자가 펩타이드나 GLP-1, 보충제를 시작한 날짜를 표시해 두면 시작 전 4주와 시작 후 4주를 자동으로 비교해 보여 줄 수 있다. 효능을 주장하지 않고 본인 데이터만 대조하는 형태로 두면 규제 허가가 필요하지 않고, 어떤 물질을 얼마나 쓰는지에 대한 실사용 데이터가 우리 쪽에 쌓인다.","signal":"필자는 미국 소비자가 지갑을 열어 중국산 회색 시장 펩타이드를 몸에 주사하는 방식으로 자기 선호를 드러내고 있다고 적었고, 그 근거로 지난 1년간 펩타이드 관심도가 급등한 흐름을 보여 주는 2026년 3월 26일 Sherwood 기사의 차트를 들었다. 사는 이유는 승인 여부가 아니라 운동선수가 BPC-157로 회복이 빨라진다고 여기니 자기라고 못 쓸 이유가 없다는 판단이고, 사는 곳은 롱제비티 클리닉과 정식 유통 경로 밖의 회색 시장이다. 남성 대상 클리닉 브랜드 Gameday Men's Health가 미국 전역에 400개가 넘는 프랜차이즈 클리닉을 두고 있다는 사실은, 이 수요가 온라인의 화제에 그치지 않고 오프라인 점포로도 이미 규모를 갖췄음을 보여 준다. 미국 소비자가 승인 절차와 의료계 주류의 판단을 기다리지 않고 자기 돈으로 먼저 시험하고 있다는 뜻이다.","author":[{"claim":"필자는 회색 시장 펩타이드에 회의적이며, 자신은 이 시장에서 뒤늦게 따라가는 쪽이어도 괜찮다고 말한다.","evidence":"회색 시장 화합물은 사이클이 흘러가는 동안 다른 사람들이 실험하도록 두겠다고 밝히며, 앞으로 5년 안에 승인된 약이 나오면 답이 바뀔 것이라고 덧붙인다."},{"claim":"Shkreli가 내용상으로는 꽤 분명하게 토론에서 이겼지만, Marchione가 전투에서 지고 전쟁에서는 이기게 될 수 있다.","evidence":"Superpower와 Hims 같은 회사가 다가오는 연방 차원의 규제 완화를 배경으로 이 흐름에서 이익을 얻기 좋은 위치에 있다는 점, 이번 주 eMed와 VITL의 펀딩, Gameday Men's Health가 미국 전역에 400개 넘는 프랜차이즈 클리닉을 늘려 온 사실을 든다."},{"claim":"의료계 주류와 시티즌 사이언티스트는 서로 엇갈려 이야기하면서, FDA 같은 기관에 대한 불신이라는 훨씬 더 큰 사회적 대화를 정면으로 다루지 않고 주변만 이야기하고 있다.","evidence":"한쪽은 효과의 증거가 없다고 외치고 다른 쪽은 효과가 없다면 왜 이렇게 많이 쓰느냐고 되묻는 토론의 구도 자체를 근거로 삼는다."},{"claim":"결말은 예측 가능하다. 인기가 커지면 나쁜 행위자와 나쁜 결과가 나오고, 그것이 헤드라인이 되어 규제 당국의 조사를 부르며, 펩타이드는 결국 자리 잡힌 시장으로 정착한다.","evidence":"소비자들이 이미 지갑을 열어 중국산 회색 시장 펩타이드를 주사하며 선호를 드러내고 있다는 점을 근거로 들지만, 이 흐름이 실제로 그 순서를 밟는다는 증거는 대지 않았다."}],"experts":[{"who":"이름을 밝히지 않은 임상의 친구","role":"필자의 지인인 임상의이며, 원문은 이름과 소속, 이해관계를 밝히지 않는다","claim":"지금의 회색 시장은 후미진 곳일 수 있지만, 염증을 억제하면 건강상 상당한 이득이 따른다는 일반적인 발상 자체에는 근거가 있다. 10년 뒤 펩타이드를 GLP-1과 같은 혁명적 잠재력을 가진 것으로 보게 될 가능성도 충분하다.","evidence":"염증 억제라는 기전의 일반적 타당성만 들 뿐 특정 연구나 데이터를 제시하지 않았다."},{"who":"Martin Shkreli","role":"원문이 이른바 파마 브로라고 소개한 인물이며, 펩타이드 회의론 쪽에서 토론에 나섰다","claim":"TBPN 토론에서 펩타이드의 유용성에 회의적인 입장을 폈다.","evidence":"뉴스레터는 토론 내용을 옮기지 않고 필자가 내용상 그가 이겼다고 평가한 사실만 전한다."},{"who":"Max Marchione","role":"롱제비티 검사·관리 서비스를 파는 Superpower의 CEO이며, 필자가 이 흐름에서 이익을 얻기 좋은 위치라고 꼽은 회사의 당사자다","claim":"TBPN 토론에서 펩타이드의 유용성을 옹호하는 입장을 폈다.","evidence":"뉴스레터는 토론 내용을 옮기지 않았고, 필자는 그가 내용상으로는 밀렸다고 평가한다."}],"cases":[{"name":"Gameday Men's Health","what":"남성 대상 클리닉 브랜드이며, 프랜차이즈 방식으로 조용히 점포 수를 늘려 왔다.","scale":"미국 전역 400개 이상 프랜차이즈 클리닉","note":"이 시장이 온라인 화제만이 아니라 오프라인 점포로도 이미 규모를 갖췄다는 신호다."},{"name":"Sherwood 기사의 펩타이드 관심도 차트","what":"2026년 3월 26일 Sherwood 기사에 실린 차트로, 지난 1년간 펩타이드에 대한 관심이 급등한 흐름을 보여 준다.","scale":"","note":"필자가 이 열풍을 실재하는 현상으로 다루는 근거다."}],"notes":[{"term":"펩타이드(peptide)","ko":"아미노산이 짧게 이어진 물질","plain":"아미노산이 짧게 연결된 물질을 통틀어 가리키는 말이다. 비만·당뇨 주사제인 GLP-1도 펩타이드지만, 요즘 미국에서 사람들이 펩타이드라고 말할 때는 대개 FDA가 그 용도로 승인하지 않은 채 롱제비티 클리닉이나 개인 수입 경로로 도는 주사제를 뜻한다. 필자도 이 둘을 다른 범주로 구분해 쓴다."},{"term":"회색 시장(grey market)","ko":"정식 승인·유통 경로 밖의 거래 영역","plain":"완전한 암거래는 아니지만 정식 승인과 유통 경로를 벗어나 사고파는 영역이다. 성분과 함량을 보증하는 주체가 없어서, 소비자가 자기가 무엇을 얼마나 맞고 있는지 확인할 방법이 사실상 없다. 필자가 나쁜 결과와 이목을 끄는 헤드라인을 예상하는 이유가 여기에 있다."},{"term":"시티즌 사이언티스트(citizen scientist)","ko":"스스로 실험하고 결과를 공유하는 비전문가","plain":"의료 전문가가 아니면서 자기 몸으로 직접 시도해 보고 결과를 인터넷에 공유하는 사용자들을 가리킨다. 이 꼭지의 대립 구도가 바로 의료계 주류 대 이들이다. 이들은 승인 여부보다 실제로 쓰는 사람이 많다는 사실을 근거로 삼는다."},{"term":"BPC-157과 retatrutide","ko":"회색 시장 펩타이드와 파이프라인의 차세대 약","plain":"BPC-157은 운동선수들 사이에서 회복을 빠르게 해 준다고 여겨지는 회색 시장 펩타이드로, 필자가 소비자 심리를 설명할 때 예로 든다. retatrutide는 아직 개발 단계에 있는 약으로, 필자가 5년 안에 자기 답이 바뀔 계기로 꼽는 승인된 선택지의 예다."}]},{"heading_ko":"곱씹어 볼 숫자: 88%","heading_en":"A NUMBER TO PONDER","skip":null,"summary":"헬스케어 투자사 HEP의 연례 설문에서 나온 숫자 하나를 짚는 자리다. 프로바이더 임원의 88%가 앞으로 1년간 입원 건당 인건비가 오를 것으로 본다는 결과이며, 필자는 이를 AI가 곧 의료 공급 비용을 극적으로 낮춘다는 전망과 나란히 놓는다.","insight":null,"signal":null,"author":[{"claim":"이 88%라는 수치는 AI가 가까운 미래에 비용 제로에 가까운 의료 공급의 풍요를 가져올 것이라는 여러 사설류의 주장과 상반되어 보인다.","evidence":"HEP가 자사 출자 기관 150곳을 상대로 진행한 설문 결과를 근거로 든다."}],"experts":[{"who":"Ezra Mehlman, Tom Cassels","role":"각각 헬스케어 전문 투자사 HEP의 Managing Partner와 Operating Partner이며, 이 설문 리포트를 낸 당사자다","claim":"AI가 촉발할 파괴의 가능성이 있는 동시에, 조직 재설계는 시간이 오래 걸리는 과정이다.","evidence":"필자가 팟캐스트 대화에서 들은 내용을 요약해 전할 뿐 구체적인 근거는 옮기지 않았다."}],"cases":[{"name":"Health Enterprise Partners 연례 설문","what":"헬스케어 전문 투자사가 자사에 출자한 기관 150곳을 상대로 업계 전망을 물었다.","scale":"응답자 150곳, 입원 건당 인건비 상승 전망 88%","note":"응답자가 이 투자사에 돈을 댄 업계 안쪽 조직들이므로, 표본이 업계 내부의 시각에 치우쳐 있다는 점을 감안해야 한다."}],"notes":[{"term":"입원 건당 인건비(labor costs per admit)","ko":"환자 한 명을 입원시켜 퇴원시킬 때까지 드는 인건비","plain":"병원 비용을 환자 수로 나눈 단위 지표다. 미국 병원은 보험사와 이미 정해 둔 값 때문에 진료비를 마음대로 올릴 수 없으므로, 이 숫자가 오르면 이익이 그만큼 그대로 깎인다. 그래서 병원들이 사람이 많이 드는 자리부터 자동화하려는 압력이 생긴다."},{"term":"LP","ko":"펀드에 돈을 대는 출자자","plain":"투자 펀드에 자금을 대는 쪽을 가리킨다. 여기서는 헬스케어 전문 투자사 HEP에 출자한 업계 조직들을 뜻하므로, 설문 응답자가 곧 업계 임원들이다."}]},{"heading_ko":"이번 주의 차트: 매사추세츠 패혈증 급증","heading_en":"CHART OF THE WEEK","skip":null,"summary":"매사추세츠에서 고중증도 퇴원 건수가 최근 몇 년 사이 크게 늘었다는 신문 기사의 차트를 옮긴 자리다. 환자가 실제로 더 위중해진 것인지, 아니면 AI 문서화 도구 덕에 청구서에 무거운 코드가 더 많이 붙게 된 것인지가 쟁점이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Boston Globe의 매사추세츠 패혈증 기사","what":"2026년 3월 20일 Boston Globe 기사로, 매사추세츠에서 고중증도 퇴원 건수가 지난 몇 년 사이 극적으로 증가한 현상을 다루고 그 원인 후보로 AI가 이끄는 코딩 인텐시티를 거론했다.","scale":"","note":"AI 도구의 효과를 문서화 품질 개선으로 볼지 청구 부풀리기로 볼지가 갈리는 지점이다."}],"notes":[{"term":"코딩 인텐시티(coding intensity)","ko":"청구 코드가 점점 무거워지는 현상","plain":"환자의 실제 상태는 그대로인데 청구서에 붙는 진단 코드가 갈수록 무거워지는 현상을 가리킨다. 미국은 중증도가 높게 기록될수록 병원이 받는 금액이 커지므로, 빠진 진단을 찾아 붙여 주는 AI 도구가 퍼지면 진짜 중증 환자가 늘지 않아도 고중증도 퇴원 건수가 늘어난다. 한국도 상병 코드에 따라 수가가 달라지지만, 미국은 그 차이가 훨씬 커서 이 문제가 오래된 논쟁거리다."}]},{"heading_ko":"펀딩: Qualified Health 1억 2,500만 달러","heading_en":"Funding Announcements","skip":null,"summary":"병원 그룹 안에 엔지니어를 들여보내 AI 과제를 함께 만들어 주는 회사가 큰 규모의 투자를 받았다. 소프트웨어만 파는 것이 아니라 사람을 붙여 파는 모델이다.","insight":null,"signal":null,"author":[{"claim":"Qualified Health는 Palantir나 Health Catalyst와 비슷한 접근을 취하는 것으로 보인다.","evidence":"엔지니어를 헬스 시스템 내부에 투입해 여러 AI 기회를 구축하고 실행하도록 돕는 방식이라는 점을 든다."}],"experts":[],"cases":[{"name":"Qualified Health","what":"헬스 시스템용 AI 플랫폼을 파는 회사이며 New Enterprise Associates가 주도한 라운드로 자금을 조달했다.","scale":"1억 2,500만 달러","note":"Mercy, Emory Healthcare, University of Rochester Medicine, Jefferson Health, University of Texas System을 고객으로 꼽는다."}],"notes":[]},{"heading_ko":"펀딩: Stedi 5,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"병원의 청구서를 보험사에 중계하는 회사가 직전 라운드 7개월 만에 다시 투자를 받았다. 유료 고객과 처리 건수가 배수로 늘었다는 점을 근거로 내세운다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Stedi","what":"클레임 클리어링하우스를 운영하며 Addition이 주도한 라운드로 자금을 조달했다.","scale":"5,000만 달러 조달, 누적 1억 4,200만 달러, 유료 고객 6배·청구 트랜잭션 7배 증가, 연간 10억 건 이상 처리","note":"직전 라운드로부터 겨우 7개월 만이라는 점을 필자가 짚는다. 고객 수와 처리 건수는 회사 발표다."}],"notes":[{"term":"클레임 클리어링하우스(claims clearinghouse)","ko":"청구서 중계 회사","plain":"병원이 보낸 진료비 청구서를 각 보험사가 읽을 수 있는 형식으로 바꿔 전달하고, 자격 확인 같은 조회도 중계하는 회사다. 미국은 보험사가 수천 곳이고 저마다 요구하는 형식이 달라서 이 중계업이 독립된 산업으로 성립한다. 한국은 심평원이 창구를 하나로 모아 두어 이런 회사가 아예 필요 없다."}]},{"heading_ko":"펀딩: Thesis Care 4,500만 달러","heading_en":"Funding Announcements","skip":null,"summary":"임상의의 업무를 대신 처리하는 AI 에이전트를 만드는 회사가 투자를 받았다. 이전 사명은 Trovo Health였다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Thesis Care","what":"임상의를 위한 AI 에이전트를 만드는 스타트업이며 Oak HC/FT가 주도한 라운드로 자금을 조달했다.","scale":"4,500만 달러","note":"1차 진료와 전문 진료 조직에 걸쳐 수천 명의 프로바이더를 고객으로 두고 있다고 밝히며, 그 가운데 US Heart and Vascular를 이름으로 꼽는다."}],"notes":[]},{"heading_ko":"펀딩: Doctronic 4,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"AI가 진료 상담을 맡는 서비스가 12개월도 안 되어 세 번째 라운드를 받았다. 필자는 회사가 공개한 매출과 방문자 수를 역산해, 방문자 대비 실제 유료 진료 전환이 매우 낮다는 점을 짚는다.","insight":"여기서 눈여겨볼 것은 낮은 전환율이 아니라 그 분모다. 주간 30만 명이 AI에게 건강을 물어보려고 찾아오는데 그중 2%도 유료 진료로 넘어가지 않는다는 것은, 무료로 물어볼 창구에 대한 수요가 진료 수요보다 훨씬 크다는 뜻이다. 우리는 진료로 전환시킬 이유가 없으므로 이 수요가 그대로 앱을 여는 이유가 된다. 증상과 검진 수치, 복용 중인 약에 대해 물어보는 상담 창구는 3개월 안에 붙일 수 있고, 답변 범위를 정보 제공으로 묶어 진단이나 처방으로 읽히지 않게 설계하는 것이 관건이다.","signal":"Doctronic의 무료 AI 상담 창구에는 주간 방문자가 30만 명 넘게 찾아오지만, 회사가 밝힌 연환산 매출 1,000만 달러와 상담 단가 39달러를 놓고 필자가 역산한 결과 실제 유료 원격진료 방문으로 이어지는 비율은 2%가 되지 않는다. 이 2%는 회사 발표가 아니라 필자의 추정치이고, 월 약 21,000건의 상담에 해당한다. 건강을 물어볼 곳을 찾는 데 시간을 쓰는 사람은 아주 많지만 그 자리에서 진료비를 내는 사람은 그중 일부에 그친다는 뜻이다. Endpoints의 기자 Ngai Yeung도 이 서비스를 직접 써 본 뒤 AI 중심의 케어가 아직 갈 길이 남아 있다고 적었다.","author":[{"claim":"공개된 수치대로면 Doctronic은 현재 월 약 21,000건의 원격진료 상담을 하고 있으며, 이는 주간 방문자 30만 명 중 2% 미만에 대해서만 실제 방문이 이뤄진다는 뜻이다.","evidence":"회사가 밝힌 연환산 매출 1,000만 달러 이상과 주간 방문자 30만 명에, 상담 단가 39달러를 넣어 직접 역산한 계산식을 제시한다."}],"experts":[{"who":"Ngai Yeung","role":"Endpoints에 이 글을 쓴 기자다","claim":"기대와 달리 AI 중심의 케어는 아직 갈 길이 남아 있다.","evidence":"Doctronic을 직접 써 본 경험을 근거로 든다."}],"cases":[{"name":"Doctronic","what":"임상 진료를 위한 AI 모델을 만드는 회사이며 Abstract와 Lightspeed Venture Partners가 주도한 라운드로 자금을 조달했다.","scale":"4,000만 달러 조달, 12개월 내 세 번째 라운드, 시리즈 A 이후 6개월간 15배 성장, 연환산 매출 1,000만 달러 이상, 주간 방문자 30만 명 이상","note":"성장률과 방문자 수는 회사 발표이고, 전환율 2% 미만은 필자의 추정이다."}],"notes":[]},{"heading_ko":"펀딩: Adonis 4,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"AI로 청구와 수납을 처리하는 회사가 투자를 받았다. 보도자료가 내세운 근거는 매출 성장률과 기존 고객이 지출을 늘렸다는 지표다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Adonis","what":"AI 중심의 청구·수납 관리 플랫폼이며 Quadrille Capital이 주도하고 General Catalyst와 Bling Capital이 참여한 라운드로 자금을 조달했다.","scale":"4,000만 달러 조달, 누적 9,400만 달러, 2025년 매출 4배 성장, 순유지율 130% 이상","note":"Mount Sinai가 고객으로 인용되어 있다. 매출 성장률과 순유지율은 보도자료에 실린 회사 발표다."}],"notes":[]},{"heading_ko":"펀딩: eMed 2억 달러","heading_en":"Funding Announcements","skip":null,"summary":"롱제비티 진료 기관이 20억 달러가 넘는 기업가치로 대형 투자를 받았다. 리드 투자자가 보험 중개 회사라는 점, Tom Brady를 최고 웰니스 책임자로 두었다는 점이 이례적이다. 회사가 자기 상품의 근거로 내세운 숫자가 치료 성적이 아니라 환자 순응도라는 대목이 눈에 띈다.","insight":"eMed가 고용주에게 골드 스탠더드를 주장하며 내민 근거가 임상 결과가 아니라 환자 순응도 90%라는 점이 중요하다. 미국 GLP-1 시장에서 값을 인정받는 것은 약 자체가 아니라 계속 맞게 만드는 관리이며, 그것은 진료 행위가 아니라 습관 설계의 문제다. 우리 앱은 이미 걸음 리워드로 매일 반복하는 행동을 만들고 있으므로, 주사 요일 알림과 투여 기록, 몸 상태 기록, 단백질 섭취와 걷기 과제를 한 묶음으로 엮은 GLP-1 동반 트랙을 3개월 안에 붙일 수 있다. 약을 팔지 않고 이미 쓰는 사람을 돕는 형태이므로 허가가 필요하지 않지만, 대상이 약 사용자로 좁아지는 만큼 미국 사용자 가운데 그 수가 시험에 충분한지를 먼저 확인해야 한다.","signal":"eMed는 고용주를 상대로 자사가 골드 스탠더드 GLP-1 상품이라고 주장하면서 그 근거로 임상 결과가 아니라 환자 순응도 90%를 내걸었고, 기업가치 20억 달러가 넘는 조건으로 2억 달러를 조달했다. 순응도를 상품의 값어치로 내세운다는 것은, 비만 치료제를 시작한 사람이 정해진 대로 계속 맞기 어려워하는 사정이 그만큼 흔하다는 뜻이다. 다만 순응도 90%는 회사 보도자료의 자기 주장이며 제3자가 검증한 수치가 아니다. eMed는 소비자에게 직접 파는 상품도 함께 갖고 있어서, 필자는 이 회사가 롱제비티와 펩타이드 수요를 곧바로 받아 낼 자리에 있다고 본다.","author":[{"claim":"AON Consulting이 이런 라운드의 리드 투자자로 등장한 것은 이례적이며, 회사 자체도 좀 이례적이다.","evidence":"Tom Brady를 Chief Wellness Officer로 두고 있다는 점을 든다."},{"claim":"eMed의 D2C 상품은 롱제비티와 펩타이드 수요를 곧바로 공략할 준비가 된 것으로 보인다.","evidence":"그 상품이 이미 존재한다는 사실 외에 별도의 근거를 대지 않았다."}],"experts":[],"cases":[{"name":"eMed","what":"롱제비티 진료 기관이며 고용주를 상대로 GLP-1 관리 상품을 팔고, 소비자에게 직접 파는 상품도 갖고 있다.","scale":"2억 달러 조달, 기업가치 20억 달러 이상, 환자
