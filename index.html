표에도 시큰둥했던 이유가 그것이다. 그러는 사이 사람들은 이미 챗봇을 첫 창구로 삼기 시작했는데, openai 자체 집계로는 전 세계 주간 이용자 네 명 가운데 한 명이 매주 건강 질문을 보내고 하루 4천만 명이 넘는 사람이 건강 질문을 하면서도, 그 대화에는 본인의 검사 수치와 복용 약이 빠져 있었다.\", \"solution\": \"사용자는 chatgpt 왼쪽 메뉴에서 health를 열고 연결을 시작한다. 연결할 수 있는 것은 세 갈래인데, 미국 병원의 환자 포털 계정과 1차 진료 체인 one medical 및 혈액 검사 회사 function health의 계정, 그리고 아이폰의 건강 앱이다. 동기화가 끝나면 끌려 들어온 진단명과 복용 약, 가족력을 사용자가 직접 확인하고 더는 해당하지 않는 항목을 지우거나 빠진 것을 채운다. 그 뒤로는 health 메뉴 안에서든 바깥의 평범한 대화에서든 콜레스테롤 수치가 어떻게 변했는지, 지난 진료 이후 무엇이 달라졌는지를 물으면 본인 기록을 근거로 답한다. 기본 설정에서는 chatgpt가 건강 정보를 쓰기 전에 매번 허락을 구하고, 사용자가 원하면 항상 허용으로 바꿀 수 있다. 값은 따로 받지 않아 무료 요금제에서도 쓸 수 있으나, 미국에 등록된 18세 이상 계정만 웹과 아이폰에서 쓸 수 있고 안드로이드는 대상이 아니다.\", \"features\": [{\"name\": \"의료 기록 연결\", \"detail\": \"미국 병원의 환자 포털 계정을 연결해 검사 결과와 진료 요약, 과거 병력을 끌어온다. 이 연결은 openai가 직접 만든 것이 아니라 b.well이라는 헬스케어 회사의 데이터 연결망을 쓴다. 목록에 없는 병원은 고객센터에 추가를 요청하라고 안내한다.\"}, {\"name\": \"애플 건강 앱 연결\", \"detail\": \"아이폰의 건강 앱에 쌓인 걸음과 이동 거리, 수면, 활동 기록을 읽어 온다. 아이폰이 있어야 연결된다.\"}, {\"name\": \"웨어러블 간접 연결\", \"detail\": \"whoop, oura, garmin, strava, myfitnesspal 같은 기기와 앱은 chatgpt와 직접 연결되지 않고 애플 건강 앱을 거쳐 들어온다. 그래서 각 회사가 자체 계산해 보여 주는 수면 점수 같은 값은 넘어오지 않을 수 있다고 공식 문서가 밝힌다.\"}, {\"name\": \"one medical, function health 연결\", \"detail\": \"아마존이 소유한 1차 진료 체인 one medical과 혈액 검사 구독 회사 function health의 계정을 따로 연결할 수 있다.\"}, {\"name\": \"기록 검토와 수정\", \"detail\": \"연결된 기록에서 현재 진단명과 복용 약 목록을 뽑아 사용자에게 확인시키고, 이미 끊은 약처럼 더는 맞지 않는 항목을 지우거나 가족력을 직접 보태게 한다. 병원이 보관한 원본 기록은 고칠 수 없다.\"}, {\"name\": \"health 전용 화면\", \"detail\": \"최근 수치와 추세, 동기화된 기록 목록, 추천 질문, 지난 건강 대화, 연결한 계정 관리를 한자리에서 본다. 2026년 1월 처음 나왔을 때는 이 화면 안에서만 건강 대화를 할 수 있었으나, 7월 개편으로 바깥 대화에서도 건강 정보를 쓰게 바뀌었다.\"}, {\"name\": \"사용 허락 요청과 호출\", \"detail\": \"기본값은 chatgpt가 건강 정보를 쓰기 전에 매번 물어보는 것이다. 한 번만 허용하거나 항상 허용을 고를 수 있다. 원하는데도 쓰지 않으면 메시지에 @health를 붙여 직접 부른다.\"}, {\"name\": \"읽기 전용\", \"detail\": \"chatgpt는 연결된 의료 기록과 애플 건강 앱에서 읽기만 한다. 애플 건강 앱이나 병원 기록에 무언가를 써넣을 수 없다.\"}, {\"name\": \"의사가 참여한 평가\", \"detail\": \"openai는 60개국 260명이 넘는 의사 네트워크와 함께 모델 답변을 평가해 왔고 검토한 답변 예시가 70만 건이 넘는다고 밝힌다. 평가 틀로는 의사가 쓴 채점 기준을 쓰는 healthbench를 내세운다.\"}, {\"name\": \"쓸 수 없는 자리\", \"detail\": \"음성 모드에서는 연결된 앱과 플러그인을 지원하지 않아 health가 동작하지 않는다. 코딩 도구인 codex에서도 지원하지 않는다.\"}], \"differentiator\": \"가장 큰 차이는 새 앱을 만들지 않았다는 점이다. 지금까지 개인건강기록 서비스는 기록을 모아 주는 별도 앱을 내려받게 했고 대부분 사용자를 모으지 못했는데, openai는 사람들이 이미 매일 쓰는 chatgpt 안에 건강 메뉴를 하나 붙였다. 상호운용성 분야 분석가 brendan keeler는 발표 다음 날 쓴 글에서 이 점을 짚으며, 기술 대기업의 진짜 자산은 새 앱이 아니라 이미 확보한 일간 사용자라고 정리했다. 기록을 실제로 끌어오는 연결망은 직접 만들지 않고 b.well에서 사 왔기 때문에, 데이터 연결 자체로는 다른 개인건강기록 회사와 크게 다르지 않다. 함께 발표된 기업용 상품 chatgpt for healthcare가 openevidence나 uptodate, doximity 같은 의사용 서비스와 겨루는 자리라면, chatgpt health는 그 반대편인 소비자 쪽에 서 있고 function health와 myfitnesspal 같은 회사를 경쟁자가 아니라 연결 상대로 들여왔다.\", \"team\": [{\"name\": \"sam altman\", \"role\": \"openai 최고경영자\", \"background\": \"2025년 8월 gpt-5 발표 자리에서 chatgpt가 자기 건강 여정을 스스로 끌고 가게 해 준다고 말하며 헬스케어 쪽 의지를 미리 드러냈다.\"}, {\"name\": \"nate gross\", \"role\": \"openai 헬스케어 전략 총괄\", \"background\": \"의사용 직업 네트워크 doximity를 공동창업하고 최고전략책임자를 지냈으며, 디지털 헬스 투자와 조사 기관 rock health의 공동창업자이기도 하다. 2025년 6월에 openai에 합류했다.\"}, {\"name\": \"ashley alexander\", \"role\": \"openai 건강 부문 제품 부사장\", \"background\": \"메타에서 12년을 일했고 그 가운데 11년을 인스타그램 제품팀에서 광고와 창작자 수익화, 동영상 기능을 만들며 보냈다. 2025년 8월에 합류해 소비자와 의료진용 제품을 맡는다고 openai 대변인이 밝혔다.\"}, {\"name\": \"karan singhal\", \"role\": \"openai 헬스케어 ai 연구 총괄\", \"background\": \"구글에서 의료용 대규모 언어 모델 med-palm 개발을 이끈 연구자 출신이다.\"}], \"traction\": [{\"type\": \"customers\", \"detail\": \"2026년 1월 7일 대기자 명단을 받는 제한 공개로 시작했다. 이때는 유럽경제지역과 스위스, 영국을 뺀 지역의 free, go, plus, pro 이용자 가운데 소수만 쓸 수 있었다.\", \"when\": \"2026-01\", \"source\": \"openai 발표문 introducing chatgpt health\"}, {\"type\": \"customers\", \"detail\": \"2026년 7월 23일에 미국의 18세 이상 로그인 이용자 전체로 열었다. free, go, plus, pro 네 요금제 모두 대상이며 웹과 아이폰에서 쓴다.\", \"when\": \"2026-07\", \"source\": \"openai 발표문 launching health in chatgpt, help.openai.com 공식 문서\"}, {\"type\": \"traffic\", \"detail\": \"openai 자체 집계로 매주 3억 명이 넘는 사람이 chatgpt에 건강 관련 질문을 한다. 2026년 1월 발표 때는 같은 기준으로 2억 3천만 명이었다.\", \"when\": \"2026-07\", \"source\": \"openai 발표문 launching health in chatgpt\"}, {\"type\": \"traffic\", \"detail\": \"openai 리포트 ai as a healthcare ally에 따르면 전 세계 chatgpt 메시지의 5% 이상이 헬스케어에 관한 것이고, 8억 명이 넘는 정기 이용자 가운데 네 명에 한 명이 매주 건강 질문을 보내며, 하루 4천만 명이 넘는 사람이 건강 질문을 한다.\", \"when\": \"2026-01\", \"source\": \"openai 리포트 ai as a healthcare ally (2026년 1월) 원문 pdf\"}, {\"type\": \"traffic\", \"detail\": \"같은 리포트에서 건강보험을 다루는 메시지가 주당 160만 건에서 190만 건이라고 밝혔다. 보험 상품 비교, 가격 이해, 청구와 청구서 처리, 자격과 가입, 보장 범위와 본인부담 확인이 여기에 들어간다.\", \"when\": \"2026-01\", \"source\": \"openai 리포트 ai as a healthcare ally (2026년 1월) 원문 pdf\"}, {\"type\": \"customers\", \"detail\": \"제한 공개 기간에 건강 관련 대화의 70% 이상이 전용 health 화면 바깥에서 일어났다고 openai가 밝혔고, 이를 근거로 전용 공간에 가두는 구조를 걷어냈다.\", \"when\": \"2026-07\", \"source\": \"openai 발표문 launching health in chatgpt\"}, {\"type\": \"partnership\", \"detail\": \"미국 병원 기록 연결은 b.well connected health의 연결망을 쓴다. openai는 b.well을 미국 소비자를 위한 가장 크고 안전한 실시간 건강 데이터 네트워크라고 소개했다. b.well은 2025년 12월에 건강 ai 비서용 sdk를 내놓으면서 의료진 220만 명과 건강보험 300곳이 넘는 연결 범위를 내세웠다.\", \"when\": \"2026-01\", \"source\": \"openai 발표문, b.well sdk 보도자료(pr newswire), brendan keeler 분석\"}, {\"type\": \"partnership\", \"detail\": \"출시 당시 연결 상대로 애플 건강 앱, function, myfitnesspal, weight watchers, alltrails, instacart, peloton이 이름을 올렸다. 이 가운데 alltrails, instacart, peloton은 이미 chatgpt 앱 생태계에 있던 곳이다. 7월 개편 뒤 공식 문서가 연결 대상으로 밝히는 것은 애플 건강 앱, 미국 병원 환자 포털, one medical, function health다.\", \"when\": \"2026-07\", \"source\": \"openai 발표문 두 건, help.openai.com 공식 문서\"}, {\"type\": \"regulatory\", \"detail\": \"openai는 공식 문서에서 health가 임상용이나 의료기관용이 아니며 hipaa 수탁 계약(baa)을 제공하지 않는다고 밝혔다. 대신 별도로 낸 건강 개인정보 고지에서 워싱턴주 my health my data act와 네바다주 소비자 건강정보 보호법의 적용을 받는다고 인정한다.\", \"when\": \"2026-07\", \"source\": \"help.openai.com 공식 문서, openai health privacy notice\"}], \"caveats\": \"이용량 수치는 전부 openai가 자기 서비스의 익명 처리된 메시지를 스스로 집계해 발표한 값이고, 제삼자가 확인한 것이 아니다. 나누어 볼 대목도 있다. 하루 4천만 명과 네 명 가운데 한 명은 리포트가 전 세계 기준이라고 못 박은 값이지만, 보험 관련 주당 160만에서 190만 건은 미국을 다루는 장 안에 놓여 있으면서도 미국만의 수치인지는 리포트가 밝히지 않는다. 규제 쪽은 더 조심해서 봐야 한다. 미국의 의료정보 보호법 hipaa는 병원과 보험사, 그리고 그들의 수탁 사업자에게만 적용되는 법이어서, 소비자가 openai에 직접 건네는 건강 정보는 애초에 그 법의 보호 범위 밖이다. openai도 이 점을 부인하지 않고 공식 문서에 임상용이 아니며 수탁 계약을 제공하지 않는다고 적어 두었다. 한국 독자가 흔히 전제하는 의료 정보는 법으로 보호된다는 감각이 여기에는 그대로 적용되지 않는다. 의료 행위 쪽도 같은 방식으로 비켜 간다. 진단과 치료를 목적으로 하지 않는다고 선언하고 기록을 읽기만 하며 병원 기록에는 쓰지 않는 구조이고, openai 이용정책은 여전히 면허를 요구하는 맞춤 의료 조언을 면허 전문가의 적절한 관여 없이 제공하는 것을 금지한다. 모델 학습에서 빼겠다는 약속에도 단서가 있다. 기초 모델 학습에는 쓰지 않지만, 안전성 개선 목적으로는 승인된 소수 인원과 위탁 사업자가 접근할 수 있다고 건강 개인정보 고지가 밝힌다. 광고도 갈라서 봐야 한다. openai는 연결된 의료 기록과 애플 건강 정보를 광고 표적화에 쓰지 않는다고 밝히지만, go 요금제 자체에는 광고가 붙을 수 있다고 가격 안내가 적고 있고, 애플 앱스토어의 개인정보 표시에는 건강과 피트니스 자료가 신원과 연결된 채 분석과 제품 개인화 목적으로 수집될 수 있다고 나와 있다. 제품 완성도에도 의문이 제기됐다. brendan keeler는 발표 다음 날 쓴 글에서 기존 chatgpt 앱 연동을 직접 써 본 결과 오래된 일정을 답하거나 기본 질문에 실패하거나 사실 근거 없는 말을 만들어 냈다고 적으면서, 같은 수준의 불안정함이 건강 영역에서 벌어지면 감당하기 어렵다고 지적했다. 병원 연결 범위에도 구멍이 있다. 미국에서 환자가 기록을 가져오는 통로는 크게 두 갈래인데 한쪽은 주요 전자의무기록만 연결돼 있고 다른 쪽은 병원 포털 아이디와 비밀번호를 일일이 넣어야 해서, 어느 쪽이든 사용자가 겪는 경험이 고르지 않다는 것이다. 마지막으로 2026년 1월 발표 내용 가운데 상당수는 7월 개편으로 이미 달라졌다. 건강 대화를 가두던 전용 공간과 별도 메모리 구조가 사라졌고, 초기에 이름을 올렸던 myfitnesspal과 weight watchers는 지금 공식 문서의 연결 대상 목록에 없다.\", \"for_us\": \"우리 목적에 비추어 건질 대목은 세 가지다. 첫째는 openai가 자기 돈을 들여 확인해 준 실측이다. 건강 기능을 전용 화면 안에 가두었더니 건강 대화의 70% 이상이 그 바깥에서 일어났고, 그래서 전용 공간을 걷어내고 건강 맥락을 앱 전체로 풀었다. 우리가 앱에 건강 탭을 따로 만들려 할 때 그대로 대입할 수 있는 결론이다. 둘째는 범위를 가르는 선이다. 아이폰 건강 앱 읽기와 검사 결과지 사진 또는 pdf 해석은 3개월 안에 소프트웨어 인력만으로 닿는 자리이지만, 미국 병원의 진료 기록을 직접 끌어오는 일은 b.well 같은 연결망을 사야 하는 일이라 3개월 밖이다. openai조차 직접 만들지 않고 사 왔다는 사실이 그 난이도를 말해 준다. 셋째는 규제를 비켜서는 설계의 본보기다. 진단과 치료 목적이 아니라고 선언하고, 기록을 읽기만 하고 쓰지 않으며, 18세 이상 미국 이용자로 한정하고, 별도의 건강 개인정보 고지를 두어 주 단위 소비자 건강정보법에 맞추는 방식이다. 우리가 미국에서 건강 기능을 낼 때 그대로 참고할 틀이다. 다만 경쟁 관점에서 경고도 같이 봐야 한다. 검사 결과를 쉬운 말로 풀어 주는 일 자체는 이제 무료로 제공되므로, 그것만으로는 우리 앱을 쓸 이유가 되지 못한다. 뉴스레터가 짚은 보험 이해 질문이 주당 160만에서 190만 건이라는 수치는 여전히 열려 있는 자리이고, 보험 안내문과 청구 명세를 사진으로 올리면 어디까지 보장되는지 풀어 주는 화면이 여기에서 곧바로 따라 나온다.\", \"screenshots\": [{\"file\": \"chatgpt-health_web.png\", \"caption\": \"제품 안내 페이지 첫 화면이다. 애플 건강 앱과 미국 병원 기록을 연결하라고 권하면서, 걸음과 수면 같은 생활 기록과 백혈구, 혈당, 콜레스테롤 같은 검사 수치를 한 화면에 나란히 올려 보여 준다. 그 아래에 무료와 go, plus, pro 이용자 가운데 미국에 있는 18세 이상만 쓸 수 있다고 적어 두었다.\", \"from\": \"https://chatgpt.com/health\"}, {\"file\": \"chatgpt-health_hipaa.png\", \"caption\": \"공식 도움말 문서의 문답 부분이다. 애플 건강 앱이나 병원 기록에 무언가를 써넣을 수 없고 읽기만 한다는 답과, 이 기능은 임상용이나 의료기관용이 아니어서 hipaa 수탁 계약을 제공하지 않는다는 답이 나란히 붙어 있다. 의료 규제를 어떻게 비켜 가는지가 이 두 문답에 드러난다.\", \"from\": \"https://help.openai.com/en/articles/20001036-health-in-chatgpt\"}, {\"file\": \"chatgpt-health_ios.png\", \"caption\": \"미국 애플 앱스토어의 chatgpt 앱 페이지다. 건강 전용 앱이 따로 없고 이 앱 안에 기능이 들어가 있다. 분류는 생산성이고 평가 1천만 건에 평점 4.8이며, 아래쪽 개인정보 표시에는 건강과 피트니스 자료가 신원과 연결돼 수집될 수 있다고 적혀 있다.\", \"from\": \"https://apps.apple.com/us/app/chatgpt/id6448311069\"}], \"sources\": [{\"title\": \"introducing chatgpt health (openai 발표문)\", \"url\": \"https://openai.com/index/introducing-chatgpt-health/\", \"note\": \"2026년 1월 7일 최초 발표문이다. 초기 구조와 연결 상대 목록, 대기자 명단 방식, 유럽경제지역과 스위스, 영국 제외 조건을 확인했다.\"}, {\"title\": \"launching health in chatgpt (openai 발표문)\", \"url\": \"https://openai.com/index/health-in-chatgpt/\", \"note\": \"2026년 7월 23일 미국 전체 공개 발표문이다. 주당 3억 명 수치, 전용 공간을 걷어낸 이유와 70% 관련 수치, 개인정보 보호 정책을 확인했다.\"}, {\"title\": \"health in chatgpt (openai 공식 도움말)\", \"url\": \"https://help.openai.com/en/articles/20001036-health-in-chatgpt\", \"note\": \"이용 조건과 연결 방법, 웨어러블 간접 연결, 읽기 전용이라는 점, 음성 모드와 codex 미지원, hipaa 수탁 계약을 제공하지 않는다는 문답을 확인했다.\"}, {\"title\": \"health in chatgpt 제품 안내 페이지\", \"url\": \"https://chatgpt.com/health\", \"note\": \"소비자에게 내거는 문구와 이용 자격 안내를 확인했다.\"}, {\"title\": \"openai health privacy notice (건강 개인정보 고지)\", \"url\": \"https://openai.com/policies/health-privacy-policy/\", \"note\": \"수집 항목, 워싱턴주 my health my data act와 네바다주 소비자 건강정보법 적용 사실, 안전성 개선 목적의 인력 접근 단서를 확인했다.\"}, {\"title\": \"hipaa eligible products and functionality (openai 공식 도움말)\", \"url\": \"https://help.openai.com/en/articles/20001069-hipaa-eligible-products-and-functionality\", \"note\": \"수탁 계약을 맺을 수 있는 제품 목록에 소비자용 health가 들어 있지 않다는 사실을 확인했다.\"}, {\"title\": \"openai usage policies (이용정책)\", \"url\": \"https://openai.com/policies/usage-policies/\", \"note\": \"면허를 요구하는 맞춤 의료 조언을 면허 전문가의 적절한 관여 없이 제공하는 것을 금지한다는 조항을 확인했다.\"}, {\"title\": \"ai as a healthcare ally (openai 리포트, 2026년 1월)\", \"url\": \"https://cdn.openai.com/pdf/2cb29276-68cd-4ec6-a5f4-c01c5e7a36e9/openai-ai-as-a-healthcare-ally-jan-2026.pdf\", \"note\": \"원문 pdf다. 전체 메시지의 5% 이상, 하루 4천만 명, 주간 이용자 네 명 중 한 명이 전 세계 기준이라는 점과 보험 관련 주당 160만에서 190만 건 수치를 직접 확인했다.\"}, {\"title\": \"improving health intelligence in chatgpt (openai)\", \"url\": \"https://openai.com/index/improving-health-intelligence-in-chatgpt/\", \"note\": \"60개국 260명 이상의 의사 네트워크와 70만 건이 넘는 답변 검토, healthbench 평가 방식을 확인했다.\"}, {\"title\": \"introducing openai for healthcare (openai 발표문)\", \"url\": \"https://openai.com/index/openai-for-healthcare/\", \"note\": \"같은 주에 나온 기업용 상품이다. 소비자용 health와 달리 수탁 계약을 제공하고 병원에 파는 상품이라는 대비를 확인했다.\"}, {\"title\": \"the end of the standalone phr (brendan keeler, health api guy)\", \"url\": \"https://healthapiguy.substack.com/p/the-end-of-the-standalone-phr\", \"note\": \"발표 다음 날 나온 제삼자 분석이다. 새 앱을 만들지 않은 전략의 의미, b.well 연결망의 위치, 기존 chatgpt 앱 연동을 직접 써 본 결과의 불안정함, 미국 병원 기록 연결의 구멍을 확인했다.\"}, {\"title\": \"openai taps instagram and doximity execs to lead its next ai healthcare push (business insider)\", \"url\": \"https://www.businessinsider.com/openai-taps-doximity-cofounder-to-lead-its-next-healthcare-push-2025-8\", \"note\": \"nate gross와 ashley alexander, karan singhal의 직함과 이전 경력을 확인했다.\"}, {\"title\": \"미국 애플 앱스토어 chatgpt 앱 페이지\", \"url\": \"https://apps.apple.com/us/app/chatgpt/id6448311069\", \"note\": \"건강 전용 앱이 따로 없다는 점, 분류가 생산성이라는 점, 평가 1천만 건에 평점 4.8, 개인정보 표시에 건강과 피트니스 자료가 신원과 연결돼 수집된다는 내용을 확인했다.\"}, {\"title\": \"chatgpt 요금제 안내\", \"url\": \"https://openai.com/chatgpt/pricing/\", \"note\": \"free, go, plus, pro 네 요금제 구성과 go 요금제에 광고가 붙을 수 있다는 안내를 확인했다.\"}, {\"title\": \"b.well connected health 공식 사이트\", \"url\": \"https://www.icanbwell.com/\", \"note\": \"openai가 의료 기록 연결에 쓰는 회사다. 소비자 매개 건강 데이터 연결망과 자체 ai 비서 상품을 파는 곳임을 확인했다.\"}]}"},{"slug":"claimable","name":"Claimable","one_liner":"미국 건강보험사가 지급을 거절한 약값과 진료비에 대해, 환자 이름으로 낼 이의 제기 서류를 인공지능이 작성하고 우편과 팩스 발송까지 대신 처리해 주는 회사다.","sells_to":"mixed","seen_in":[{"issue":"36","section":27,"headline":"블룸버그가 다룬 회사로 소개되면서, Mark Cuban 등에게서 1,000만 달러를 조달했고 환자가 이의 제기 한 건당 50달러를 낸다는 대목이 나왔다. 필자는 그 가격으로는 벤처 투자 셈법이 성립하지 않으며 회사가 제약사 계약으로 돈줄을 옮기고 있다고 지적했다."}],"card":{"problem":"미국 보험사는 의사가 처방한 약과 치료도 지급을 거절하는 일이 흔하고, 보험에 가입한 성인 다섯 명 가운데 한 명이 거절을 겪는다. 다시 판단해 달라고 요구할 권리가 법으로 보장돼 있는데도 실제로 이의를 제기하는 사람은 1%에 미치지 못한다.","solution":"거절 통지서와 보험 정보를 올리고 몇 가지 질문에 답하면, 인공지능이 임상 연구와 그 보험사의 보장 규정, 환자 본인의 병력을 엮어 이의 제기 서류를 만들어 준다. 환자가 확인하고 승인하면 회사가 인쇄해서 우편과 팩스로 대신 보내고 이후 일정까지 관리한다.","price":"이의 제기 1건당 39.95달러에 발송비를 더해 내며, 제약사나 의료기관이 후원하는 약이면 환자가 내는 돈이 없다.","tags":["보험 거절","이의 제기","AI 서류작성","건당 정액","제약사 후원"],"headline_traction":"2026년 4월 블룸버그 보도 기준으로 Mark Cuban 등에게서 1,000만 달러를 조달했고, 회사는 거절됐던 진료비 3,000만 달러 이상을 환자 대신 되찾았다고 밝힌다.","watch":"성공률 80%와 회수액 3,000만 달러는 모두 회사가 스스로 낸 수치이고 제삼자가 검증한 자료를 찾지 못했다. 환자가 내는 39.95달러 대신 제약사가 비용을 대는 쪽으로 옮겨 가고 있어서, 어떤 약의 거절에 힘을 쏟을지가 그 약을 파는 회사의 이해관계와 맞물릴 수 있다. 보험 약관이 처음부터 제외한 치료는 회사도 다루지 못한다."},"screenshots":[{"file":"claimable_home.png","caption":"첫 화면이다. 이의 제기를 시작하라는 버튼과 함께, 다섯 명 가운데 한 명이 거절을 겪고 1%도 이의를 제기하지 않으며 자사 성공률은 80%가 넘는다는 세 숫자를 나란히 내건다.","from":"https://www.getclaimable.com/"},{"file":"claimable_providers.png","caption":"의사와 병원용 페이지다. 병원이 내는 이의 제기를 대체하는 것이 아니라, 환자가 자기 이름으로 한 번 더 내도록 돕는 구조라고 설명한다.","from":"https://www.getclaimable.com/for-providers"},{"file":"claimable_pharma.png","caption":"제약사용 페이지다. 거절률이 올라가면 약을 계속 쓰는 환자가 줄어든다는 문제 제기로 시작해, 거절을 더 많이 뒤집고 치료 중단을 줄인다는 문구로 제약사에 판다.","from":"https://www.getclaimable.com/for-pharma"}],"q":"{\"slug\": \"claimable\", \"name\": \"claimable\", \"one_liner\": \"미국 건강보험사가 지급을 거절한 약값과 진료비에 대해, 환자 이름으로 낼 이의 제기 서류를 인공지능이 작성하고 우편과 팩스 발송까지 대신 처리해 주는 회사다.\", \"site\": \"https://www.getclaimable.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"36\", \"section\": 27, \"headline\": \"블룸버그가 다룬 회사로 소개되면서, mark cuban 등에게서 1,000만 달러를 조달했고 환자가 이의 제기 한 건당 50달러를 낸다는 대목이 나왔다. 필자는 그 가격으로는 벤처 투자 셈법이 성립하지 않으며 회사가 제약사 계약으로 돈줄을 옮기고 있다고 지적했다.\"}], \"card\": {\"problem\": \"미국 보험사는 의사가 처방한 약과 치료도 지급을 거절하는 일이 흔하고, 보험에 가입한 성인 다섯 명 가운데 한 명이 거절을 겪는다. 다시 판단해 달라고 요구할 권리가 법으로 보장돼 있는데도 실제로 이의를 제기하는 사람은 1%에 미치지 못한다.\", \"solution\": \"거절 통지서와 보험 정보를 올리고 몇 가지 질문에 답하면, 인공지능이 임상 연구와 그 보험사의 보장 규정, 환자 본인의 병력을 엮어 이의 제기 서류를 만들어 준다. 환자가 확인하고 승인하면 회사가 인쇄해서 우편과 팩스로 대신 보내고 이후 일정까지 관리한다.\", \"price\": \"이의 제기 1건당 39.95달러에 발송비를 더해 내며, 제약사나 의료기관이 후원하는 약이면 환자가 내는 돈이 없다.\", \"tags\": [\"보험 거절\", \"이의 제기\", \"ai 서류작성\", \"건당 정액\", \"제약사 후원\"], \"headline_traction\": \"2026년 4월 블룸버그 보도 기준으로 mark cuban 등에게서 1,000만 달러를 조달했고, 회사는 거절됐던 진료비 3,000만 달러 이상을 환자 대신 되찾았다고 밝힌다.\", \"watch\": \"성공률 80%와 회수액 3,000만 달러는 모두 회사가 스스로 낸 수치이고 제삼자가 검증한 자료를 찾지 못했다. 환자가 내는 39.95달러 대신 제약사가 비용을 대는 쪽으로 옮겨 가고 있어서, 어떤 약의 거절에 힘을 쏟을지가 그 약을 파는 회사의 이해관계와 맞물릴 수 있다. 보험 약관이 처음부터 제외한 치료는 회사도 다루지 못한다.\"}, \"problem\": \"미국에서는 의사가 처방한 약이라도 보험사가 지급을 거절하는 일이 흔하다. claimable은 미국에서 해마다 8억 5,000만 건의 청구가 거절된다고 밝히고, 보험에 가입한 성인 다섯 명 가운데 한 명이 거절을 겪는다고 적는다. 거절 통지를 받은 환자에게는 다시 판단해 달라고 요구할 권리가 법으로 보장되지만, 실제로 이의를 제기하는 사람은 1%에 미치지 못한다. 제출 기한이 정해져 있고, 임상 연구와 보험사가 스스로 공개한 보장 규정을 인용해 반박해야 하며, 1차 거절 뒤에도 2차와 3차 심사가 이어지기 때문이다. 회사 설명으로는 전문 대리인이나 경험 많은 환자도 서류 한 건을 만드는 데 15시간에서 100시간까지 쓴다. 회사는 대형 보험사의 84%가 이미 인공지능으로 거절을 처리하고 있고 환자의 46%는 아예 치료를 포기한다고 주장하면서, 거절하는 쪽만 자동화된 상태라고 설명한다. 여기에 걸린 돈이 크다. 블룸버그가 소개한 환자는 크론병 때문에 12세부터 맞아 온 remicade를 보험이 바꾸자 거절당했는데, 이 약은 한 해에 수만 달러가 든다. 한국은 건강보험이 진료비를 자동으로 처리하므로 개인이 이런 서류 절차를 밟을 일이 거의 없고, 그래서 이 문제 자체가 미국에서만 사업으로 성립한다.\", \"solution\": \"환자는 보험사가 보낸 거절 통지서와 보험 정보를 올리는 것으로 시작한다. 다음으로 자신의 건강 상태와 거절에 이르기까지의 경과를 묻는 질문에 답한다. 그러면 회사의 인공지능이 그 약을 뒷받침하는 임상 연구, 해당 보험사가 공개한 보장 규정, 환자가 적어 낸 개인 사정을 엮어 이의 제기 서류를 작성한다. 완성된 서류는 환자가 직접 읽고 승인한 뒤에야 나가며, 인쇄와 우편, 팩스 발송, 어디로 보낼지 정하는 일, 회신이 늦어질 때의 대응까지 회사가 맡는다. 값은 1건당 39.95달러에 발송비를 더한 금액이고, 성공했을 때 따로 떼는 성공 보수는 없다. 다만 제약사나 의료기관이 후원하는 약이면 환자가 내는 돈이 0달러가 되는데, 회사 이용약관은 요금을 면제하는 경우로 의료기관이나 제약사의 후원을 직접 명시한다. 돈을 내지 않는 사람을 위해서는 약 이름별로 이의 제기 서식을 무료로 내려받게 해 두고, 그 서식을 출발점이라고 부르면서 근거를 찾아 넣는 작업은 유료 서비스로 안내한다. 미국 앱스토어에서 claimable이 낸 소비자용 앱은 찾지 못했고, 모든 절차는 웹에서 이뤄진다.\", \"features\": [{\"name\": \"거절 통지서 판독\", \"detail\": \"환자가 올린 거절 통지서와 보험 정보를 읽어, 보험사가 어떤 사유로 거절했고 어떤 규정을 근거로 삼았는지를 뽑아낸다.\"}, {\"name\": \"근거 검색 후 인용\", \"detail\": \"일반 지식으로 문장을 짓지 않고, 임상 연구와 치료 지침, 보험사별 보장 규정, 연방법과 주법, 과거 이의 제기 결과를 모아 둔 자체 자료에서 근거를 찾아 인용한다. 회사는 이 방식을 검색 증강 생성이라고 부른다.\"}, {\"name\": \"사람이 설계하고 검수하는 절차\", \"detail\": \"약과 질환마다 어떤 논리로 다툴지는 임상과 이의 제기 전문가가 미리 설계해 두고, 인공지능이 만든 초안은 열 가지가 넘는 평가 기준을 통과해야 한다. 최종 서류는 환자가 확인하고 승인한 뒤에 제출된다.\"}, {\"name\": \"발송 대행과 일정 관리\", \"detail\": \"어느 부서로 보내야 하는지 수신처를 제안하고, 우편과 팩스로 대신 보내며 발송 기록을 남긴다. 긴급한 사안이면 긴급 심사를 요청하고, 회신 기한이 지나면 무엇을 해야 하는지 알려 준다.\"}, {\"name\": \"환자 이름으로 내서 기한을 강제하는 구조\", \"detail\": \"회사는 보험 계약을 맺은 당사자가 환자이므로 환자가 내는 이의 제기에만 법이 정한 회신 기한이 걸린다고 설명한다. 일반 건은 30일, 사전승인 건은 15일, 긴급 건과 처방집 예외 요청은 72시간 안에 보험사가 답해야 하고, 환자에게는 여러 단계로 다시 다툴 권리와 보험사 바깥의 독립 심사를 요구할 권리, 주 보험당국에 민원을 넣을 권리가 함께 붙는다.\"}, {\"name\": \"지원 범위를 약 단위로 한정\", \"detail\": \"85종이 넘는 약을 지원하며, 천식, glp-1 계열(비만과 2형 당뇨), 편두통, 류마티스와 자가면역, pans/pandas, 아토피 피부염 영역을 다룬다. 서류 누락이나 행정 착오로 인한 거절은 다루지 않고, 그런 건은 의사와 함께 다시 제출하는 편이 낫다고 안내한다.\"}, {\"name\": \"약 이름별 무료 서식과 안내 글\", \"detail\": \"wegovy, advair, rinvoq, entyvio처럼 거절이 잦은 약마다 별도 안내 글을 올리고 이의 제기 서식을 무료로 내려받게 한다. 이 글들이 검색으로 환자를 데려오는 통로가 되고, 그 끝에서 39.95달러짜리 대행 서비스를 권한다.\"}, {\"name\": \"제약사, 병원, 의사를 상대로 하는 기업용 상품\", \"detail\": \"판매 대상을 세 갈래로 나누어 각각 별도 페이지를 둔다. 제약사에게는 자사 약이 거절돼 치료가 끊기는 것을 막아 준다고 팔고, 병원에게는 거절을 대량으로 뒤집어 수익 주기 업무를 덜어 준다고 팔며, 의사에게는 이의 제기 업무 부담을 줄여 준다고 판다. 보험사별, 주별, 약별, 거절 사유별 거절 현황을 보여 주는 대시보드를 함께 준다.\"}], \"differentiator\": \"회사가 스스로 견주는 대상은 변호사와 전문 환자 대리인이다. 이들에게 맡기면 비용이 크고 한 건에 수십 시간이 걸리는데, claimable은 성공 보수 없이 건당 39.95달러 정액만 받고 작성 시간을 몇 분으로 줄인다고 말한다. 더 중요한 차별점은 서류를 의사 이름이 아니라 환자 이름으로 낸다는 점이다. 환자가 보험 계약의 당사자이므로 환자가 내는 이의 제기에만 법이 정한 회신 기한과 외부 독립 심사를 요구할 권리가 걸리고, 그래서 병원이 내는 것보다 강제력이 크다는 것이 회사의 설명이다. 같은 회차 뉴스레터에 나온 amperos health는 똑같이 보험 거절을 다투지만 병원 쪽에 서서 수익을 회수해 주는 회사이고, 3,000개 진료 현장을 고객으로 둔다. 두 회사를 나란히 놓으면 claimable이 고른 자리가 환자 쪽이라는 점이 분명해지는데, 다만 그 환자 쪽 요금을 제약사가 대신 내기 시작하면서 자리가 옮겨 가는 중이다. 인공지능으로 이의 제기 서류를 만든다는 방식 자체가 기술적으로 독점적이라고 볼 근거는 이번 조사에서 찾지 못했다.\", \"team\": [{\"name\": \"warris bokhari\", \"role\": \"공동창업자 겸 ceo\", \"background\": \"영국 국가보건서비스(nhs)에서 일한 의사이며, ge, apple health, anthem, amazon에서 15년 넘게 의료 전략과 혁신을 맡았다고 회사가 소개한다. time은 그가 미국 대형 보험사에서 일하다가 이 문제를 발견했다고 적었고, 2026년 time100 health 명단에 올렸다.\"}, {\"name\": \"zach veigulis\", \"role\": \"공동창업자 겸 최고인공지능책임자\", \"background\": \"미국 재향군인부 산하 협력의료혁신센터에서 수석 데이터 과학자로 일했고, 의료 데이터 과학 경력이 10년을 넘는다. 논문 인용이 150회가 넘는 연구자라고 회사가 소개한다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"mark cuban 등에게서 1,000만 달러를 조달했다.\", \"when\": \"2026-04\", \"source\": \"블룸버그 john tozzi 기사와 이를 인용한 뉴스레터 36회차. 기사 본문이 유료라 투자자 명단과 라운드 종류는 직접 확인하지 못했다.\"}, {\"type\": \"customers\", \"detail\": \"거절됐던 진료비 3,000만 달러 이상을 환자를 대신해 되찾았다고 회사가 밝힌다.\", \"when\": \"2026-04\", \"source\": \"회사 보도자료와 time100 health 소개글\"}, {\"type\": \"customers\", \"detail\": \"제약사와 병원 쪽 프로그램 10곳에서 서비스가 돌아가고 있으며, 그 프로그램이 다루는 치료제를 쓰는 환자가 전국에 100만 명이 넘는다고 회사가 밝힌다. 회사가 대상으로 삼는 프로그램에서는 최초 거절률이 70%에 이르는 경우도 있다고 적었다.\", \"when\": \"2026-04\", \"source\": \"회사 보도자료 '기업용 환자 접근 플랫폼 공개'\"}, {\"type\": \"partnership\", \"detail\": \"제약사, 병원, 전문 약국을 상대로 하는 기업용 상품을 공식 발표했다. 이용약관에는 제약사나 의료기관이 후원하면 환자 요금을 면제한다고 적혀 있다.\", \"when\": \"2026-04\", \"source\": \"회사 사이트 for-pharma 페이지와 이용약관\"}, {\"type\": \"partnership\", \"detail\": \"판매 대상을 제약사, 병원, 의사 세 갈래로 나눈 별도 페이지를 운영한다. 병원용 페이지는 이의 제기 한 건당 15시간 넘게 아낀다는 문구와 함께 성공률 80%, 회신 10일 이내, 회수액 3,000만 달러라는 소비자용과 같은 수치를 내건다.\", \"when\": \"2026-09\", \"source\": \"회사 사이트 for-health-systems 페이지를 2026년 9월에 직접 확인\"}, {\"type\": \"award\", \"detail\": \"창업자 warris bokhari가 time의 2026년 time100 health 명단에 올랐다.\", \"when\": \"2026-02\", \"source\": \"time\"}, {\"type\": \"award\", \"detail\": \"fierce healthcare가 뽑은 2026년 fierce 15에 선정됐고, fast company의 2025년 world changing ideas에도 선정됐다.\", \"when\": \"2026-03\", \"source\": \"회사 소개 페이지와 fierce healthcare\"}, {\"type\": \"traffic\", \"detail\": \"약 이름별 안내 글과 무료 서식을 꾸준히 올린다. 2026년 7월과 8월에만 wegovy, advair, symbicort, rinvoq, entyvio 관련 글이 새로 올라왔고, 공동창업자 zach veigulis가 팟캐스트에 출연한 기록도 함께 걸려 있다.\", \"when\": \"2026-08\", \"source\": \"회사 블로그 목록을 2026년 9월에 직접 확인\"}], \"caveats\": \"성공률 80%, 열흘 안에 결과가 나온다는 것, 되찾은 금액 3,000만 달러, 의뢰받은 환자의 70%가 이의 제기를 끝까지 낸다는 것은 모두 회사가 스스로 낸 수치이며, 제삼자가 검증한 자료는 찾지 못했다. 같은 수치가 소비자용 첫 화면과 병원용 판매 페이지에 그대로 다시 쓰이므로, 두 곳에 적힌 숫자가 서로 다른 근거를 가진 것은 아니다. 회사가 같은 화면에서 인용하는 외부 연구는 이의 제기의 절반 이상이 성공한다고 적는데, 80%가 그보다 높은 이유와 비교 기준이 같은지는 공개돼 있지 않다. 애초에 이길 만한 사건만 받는지도 확인할 수 없다. 값도 자료마다 다르다. 회사 사이트는 1건당 39.95달러에 발송비를 더한 금액이라고 적고, time과 뉴스레터는 약 50달러라고 적는다. 창업 시점도 어긋난다. 회사 블로그의 서비스 출시 발표는 2024년 9월 29일이고 time은 2024년 창업이라고 적었는데, 블룸버그는 2026년 4월 기사에서 3년 전에 공동창업했다고 적었다. 회사 소개 페이지는 inc.의 female founders 500 수상 사실을 걸면서 alicia graham의 inc. 프로필로 연결하는데, 그 프로필 페이지가 접속을 막아 두어 그가 이 회사에서 어떤 역할을 맡고 있는지는 이번에도 확인하지 못했다. 서비스가 닿지 않는 영역도 분명하다. 보험 약관이 특정 치료를 아예 보장 대상에서 빼 두면 회사 스스로도 이의 제기 절차 자체가 없다고 설명하며, 그런 경우에는 고용주에게 직접 요구하거나 현금으로 사는 길을 안내한다. 의학적으로 필요한지를 다투는 거절과, 처음부터 계약에 없는 거절은 서로 다른 문제라는 뜻이다. 사업 구조에서 가장 눈여겨볼 대목은 돈을 내는 쪽이 환자에서 제약사로 옮겨 가는 중이라는 점이다. 이용약관은 제약사가 후원하면 환자 요금을 면제한다고 명시하고, 제약사용 페이지는 치료 중단을 줄인다는 것과 지원 프로그램 규모를 키운다는 것을 판매 문구로 내건다. 제약사 입장에서 이의 제기는 자사 약을 계속 쓰게 만드는 수단이므로, 어느 약의 거절에 힘을 쏟을지가 그 약을 파는 회사의 이해관계와 맞물릴 수 있다. 뉴스레터 필자도 같은 지점을 짚으면서, 환자에게 받는 건당 50달러로는 벤처 투자 셈법이 서지 않으니 이 전환이 사업으로는 합리적이지만 투자자 mark cuban이 그동안 보여 온 모습과는 어울리지 않는다고 적었다.\", \"for_us\": \"이 회사가 증명한 것은 미국 사용자가 보험 거절 앞에서 자기 돈을 낼 만큼 곤란을 겪는다는 사실이다. 다만 서류 작성 자체를 그대로 따라 만들기는 어렵다. 임상 연구와 보험사별 보장 규정을 모아 둔 자료, 우편과 팩스 발송 대행, 개인 건강정보를 다루는 체계가 함께 있어야 하기 때문에 3개월 안에 소프트웨어 인력만으로는 재현되지 않는다. 대신 그 앞단은 앱 화면 안에서 만들 수 있다. 거절 통지서를 찍어 올리면 어떤 사유로 거절됐는지, 이의 제기 기한이 며칠 남았는지, 다음에 무엇을 준비해야 하는지를 읽어 주는 정도다. 기한 안내는 특히 값이 분명하다. 보험사가 답해야 하는 기한이 일반 건 30일, 사전승인 건 15일, 긴급 건 72시간으로 법에 정해져 있으므로, 남은 날짜를 세어 주는 화면은 사실 확인이 끝난 정보만으로 만들 수 있다. claimable이 스스로 다루지 않겠다고 밝힌 영역, 곧 서류 누락과 행정 착오로 인한 거절이 오히려 이런 안내만으로 풀리는 자리다. claimable이 39.95달러를 받고 해 주는 일의 앞부분을 무료로 붙여 두면 리워드 앱이 앱을 열 이유를 하나 더 갖게 된다. 회사 스스로 약 이름별 무료 서식을 미끼로 쓰고 있다는 점도 참고할 만하다. 무료로 줄 수 있는 부분과 돈을 받는 부분이 어디서 갈리는지를 이미 시장에서 확인해 둔 셈이다. 실제 작업의 절반은 기능 구현이 아니라 문구를 다듬는 일이다. claimable조차 자사 도구를 두고 행정과 법률 절차를 돕는 도구이며 진단하거나 치료를 권하지 않고 의사의 판단을 대신하지 않는다고 못박아 둔다. 같은 선을 우리도 그어야 하고, 개인 건강정보를 어디까지 받을지도 함께 정해야 한다.\", \"screenshots\": [{\"file\": \"claimable_home.png\", \"caption\": \"첫 화면이다. 이의 제기를 시작하라는 버튼과 함께, 다섯 명 가운데 한 명이 거절을 겪고 1%도 이의를 제기하지 않으며 자사 성공률은 80%가 넘는다는 세 숫자를 나란히 내건다.\", \"from\": \"https://www.getclaimable.com/\"}, {\"file\": \"claimable_providers.png\", \"caption\": \"의사와 병원용 페이지다. 병원이 내는 이의 제기를 대체하는 것이 아니라, 환자가 자기 이름으로 한 번 더 내도록 돕는 구조라고 설명한다.\", \"from\": \"https://www.getclaimable.com/for-providers\"}, {\"file\": \"claimable_pharma.png\", \"caption\": \"제약사용 페이지다. 거절률이 올라가면 약을 계속 쓰는 환자가 줄어든다는 문제 제기로 시작해, 거절을 더 많이 뒤집고 치료 중단을 줄인다는 문구로 제약사에 판다.\", \"from\": \"https://www.getclaimable.com/for-pharma\"}, {\"file\": \"claimable_healthsystems.png\", \"caption\": \"병원용 페이지다. 거절을 대량으로 뒤집는다는 문구와 함께 데모 예약 버튼만 두고 값은 밝히지 않는다. 환자에게는 39.95달러를 공개하면서 기업 고객에게는 값을 숨기는 차이가 드러난다.\", \"from\": \"https://www.getclaimable.com/for-health-systems\"}], \"sources\": [{\"title\": \"claimable 공식 홈페이지\", \"url\": \"https://www.getclaimable.com/\", \"note\": \"값(1건당 39.95달러에 발송비), 4단계 이용 흐름, 지원하는 85종이 넘는 약과 여섯 개 질환 영역, 자주 묻는 질문에 실린 성공률과 심사 기한 설명을 확인했다.\"}, {\"title\": \"claimable 회사 소개 페이지\", \"url\": \"https://www.getclaimable.com/about-us\", \"note\": \"공동창업자 두 사람의 이름과 직함, 경력, 수상 실적을 확인했다.\"}, {\"title\": \"claimable 제약사용 페이지\", \"url\": \"https://www.getclaimable.com/for-pharma\", \"note\": \"제약사에게 무엇을 파는지, 제약사가 후원하면 환자에게 무료가 된다는 설명, 거절 현황 대시보드 제공 내용을 확인했다.\"}, {\"title\": \"claimable 의사와 병원용 페이지\", \"url\": \"https://www.getclaimable.com/for-providers\", \"note\": \"환자 이름으로 내는 이의 제기가 병원이 내는 것과 어떻게 다른지, 병원과 어떤 방식으로 협업하는지를 확인했다.\"}, {\"title\": \"claimable 이용약관\", \"url\": \"https://www.getclaimable.com/terms-of-service\", \"note\": \"의료기관이나 제약사가 후원하는 경우 이의 제기 요금을 면제한다는 조항과, 이의 제기가 실패해도 환불하지 않는다는 조항을 확인했다.\"}, {\"title\": \"claimable의 인공지능이 환자를 위해 작동하는 방식\", \"url\": \"https://www.getclaimable.com/post/how-claimables-ai-works-for-patients\", \"note\": \"어떤 자료를 근거로 서류를 만드는지, 사람이 어디까지 개입하는지, 진단이나 치료 권고를 하지 않는다는 선 긋기를 확인했다.\"}, {\"title\": \"claimable, 인공지능 기업용 환자 접근 플랫폼 공개\", \"url\": \"https://www.getclaimable.com/post/claimable-debuts-ai-powered-enterprise-patient-access-platform\", \"note\": \"2026년 4월 기업용 상품 발표문이다. 성공률 80%, 회수액 3,000만 달러, 프로그램 10곳, 환자 100만 명 등 회사가 밝힌 수치의 출처다.\"}, {\"title\": \"claimable 서비스 출시 발표\", \"url\": \"https://www.getclaimable.com/post/introducing-claimable\", \"note\": \"2024년 9월 29일 출시와 초기 지원 범위를 확인했다.\"}, {\"title\": \"ai startup has helped reverse thousands of denied health insurance claims (bloomberg)\", \"url\": \"https://www.bloomberg.com/news/features/2026-04-22/ai-and-mark-cuban-among-startup-s-tools-to-fight-denied-health-care-claims\", \"note\": \"뉴스레터가 인용한 원 기사다. 유료 기사여서 앞부분만 확인했고, remicade를 거절당한 환자 사례와 창업자 소개까지만 읽었다.\"}, {\"title\": \"warris bokhari (time100 health 2026)\", \"url\": \"https://time.com/collections/time100-health-2026/7362601/warris-bokhari/\", \"note\": \"해마다 8억 5,000만 건이 거절되고 이의 제기 비율이 1% 미만이라는 수치, 건당 약 50달러, 성공률 80%, 회수액 3,000만 달러 이상을 확인했다.\"}, {\"title\": \"미국 앱스토어 검색\", \"url\": \"https://itunes.apple.com/search?term=claimable&entity=software&country=us\", \"note\": \"claimable이 낸 소비자용 앱이 없다는 사실을 확인했다.\"}, {\"title\": \"claimable 병원용 페이지\", \"url\": \"https://www.getclaimable.com/for-health-systems\", \"note\": \"병원에게 무엇을 파는지, 이의 제기 한 건당 15시간 이상 절감과 대형 보험사 84%가 인공지능으로 거절을 처리한다는 주장, 값을 공개하지 않고 데모 예약만 받는다는 사실을 확인했다.\"}, {\"title\": \"의사에게만 맡기지 말고 직접 이의를 제기해야 하는 이유\", \"url\": \"https://www.getclaimable.com/post/why-you-should-appeal-your-insurance-denial-yourself-not-just-leave-it-to-your-doctor\", \"note\": \"보험 계약 당사자가 환자라는 논리, 일반 30일과 사전승인 15일과 긴급 72시간이라는 회신 기한, 외부 독립 심사와 주 보험당국 민원 권리를 확인했다.\"}, {\"title\": \"wegovy 이의 제기 서식 안내\", \"url\": \"https://www.getclaimable.com/post/wegovy-appeal-letter\", \"note\": \"약 이름별 무료 서식을 내려받게 하면서 39.95달러 유료 대행으로 연결하는 구조를 확인했다.\"}, {\"title\": \"보험 약관이 glp-1을 아예 제외한 경우\", \"url\": \"https://www.getclaimable.com/post/glp-1-insurance-plan-exclusion\", \"note\": \"약관에서 처음부터 제외된 치료는 이의 제기 절차 자체가 없다는 회사 설명과, 고용주 직접 요구나 현금 구매라는 대안 안내를 확인했다.\"}, {\"title\": \"claimable 블로그 목록\", \"url\": \"https://www.getclaimable.com/blog\", \"note\": \"2026년 7월과 8월까지 약 이름별 글이 계속 올라오고 있으며, 2026년 4월 이후 새로운 투자나 제휴 발표는 없다는 사실을 확인했다.\"}]}"},{"slug":"climatic","name":"Climatic","one_liner":"천연 성분 분말을 전용 흡입 기기로 하루 한 번 들이마시게 해서 폐의 점액과 이물질 배출을 돕는다고 주장하는 비처방 웰니스 제품 L Max를 소비자에게 직접 파는 뉴욕 브랜드다.","sells_to":"consumer","seen_in":[{"issue":"12","section":24,"headline":"펀딩 소식 한 줄로만 나왔다. 호흡기 건강을 다루는 웰니스 모델 Climatic이 Lerer Hippeau가 주도한 라운드에서 1,000만 달러를 받았다는 내용이며, 무엇을 파는지도 누가 돈을 내는지도 원문에는 없다."}],"card":{"problem":"미국인은 산불 연기와 대기오염, 꽃가루에 일상적으로 노출되지만 폐를 위해 매일 하는 일은 사실상 없다. 폐는 천식이나 만성폐쇄성폐질환처럼 병이 생긴 뒤에야 처방 흡입기로 다루는 대상이었다.","solution":"아침에 전용 기기에 분말 한 알을 넣고 30초 안에 한 번 깊게 들이마시게 한다. 처방이 필요 없는 제품을 직접 배송으로 팔고, 수면이나 장 건강처럼 폐도 매일 챙기는 습관으로 만들겠다고 내세운다.","price":"스타터 세트 95달러로 기기와 여행용 케이스, 28일치 분말이 들어 있다. 구독은 월 55달러이며 첫 주문에 기기를 함께 준다. HSA와 FSA 세전 자금 환급 신청 경로를 붙여 두었다.","tags":["폐 건강","흡입 기기","구독 판매","운동 수행","공기오염"],"headline_traction":"2026년 1월 Lerer Hippeau가 주도한 시드 1,000만 달러를 받고 스텔스에서 나왔고, 4월에 첫 제품 L Max를 출시했다.","watch":"효능 수치가 전부 회사가 수행하거나 의뢰한 연구에서 나왔고, 핵심 수치인 점액 배출 50퍼센트 개선은 사람 대상 임상이 아니라 동물 실험 모델 결과다. 위약 대조 임상시험은 아직 진행 중이다."},"screenshots":[{"file":"climatic_home.png","caption":"첫 화면이다. 한 번의 깊은 숨으로 매일 폐를 관리한다는 문구와 함께 파란 흡입 기기를 입에 물고 있는 장면을 크게 걸었고, 임상 연구, 천연 성분, 폐 직접 전달 세 가지를 내세운다.","from":"https://www.climatichealth.com/"},{"file":"climatic_product.png","caption":"제품 판매 화면이다. 스타터 세트 95달러와 월 55달러 구독이 나란히 놓여 있고, 첫 물량이 14일 만에 완판돼 지금은 선주문이며 배송에 4주에서 6주가 걸린다고 적혀 있다. 임상의 316명이 대가 없이 공유했다는 배지도 여기에 붙어 있다.","from":"https://www.climatichealth.com/products/l-max"},{"file":"climatic_science.png","caption":"근거를 정리한 Science 페이지의 첫 화면이다. 실내 공기와 먼지, 꽃가루, 오염물질이 매일 폐에 쌓인다는 문제 제기로 시작해 아래에서 성분별 근거와 연구 일정을 보여 준다.","from":"https://www.climatichealth.com/pages/science"}],"q":"{\"slug\": \"climatic\", \"name\": \"climatic\", \"one_liner\": \"천연 성분 분말을 전용 흡입 기기로 하루 한 번 들이마시게 해서 폐의 점액과 이물질 배출을 돕는다고 주장하는 비처방 웰니스 제품 l max를 소비자에게 직접 파는 뉴욕 브랜드다.\", \"site\": \"https://www.climatichealth.com\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"12\", \"section\": 24, \"headline\": \"펀딩 소식 한 줄로만 나왔다. 호흡기 건강을 다루는 웰니스 모델 climatic이 lerer hippeau가 주도한 라운드에서 1,000만 달러를 받았다는 내용이며, 무엇을 파는지도 누가 돈을 내는지도 원문에는 없다.\"}], \"card\": {\"problem\": \"미국인은 산불 연기와 대기오염, 꽃가루에 일상적으로 노출되지만 폐를 위해 매일 하는 일은 사실상 없다. 폐는 천식이나 만성폐쇄성폐질환처럼 병이 생긴 뒤에야 처방 흡입기로 다루는 대상이었다.\", \"solution\": \"아침에 전용 기기에 분말 한 알을 넣고 30초 안에 한 번 깊게 들이마시게 한다. 처방이 필요 없는 제품을 직접 배송으로 팔고, 수면이나 장 건강처럼 폐도 매일 챙기는 습관으로 만들겠다고 내세운다.\", \"price\": \"스타터 세트 95달러로 기기와 여행용 케이스, 28일치 분말이 들어 있다. 구독은 월 55달러이며 첫 주문에 기기를 함께 준다. hsa와 fsa 세전 자금 환급 신청 경로를 붙여 두었다.\", \"tags\": [\"폐 건강\", \"흡입 기기\", \"구독 판매\", \"운동 수행\", \"공기오염\"], \"headline_traction\": \"2026년 1월 lerer hippeau가 주도한 시드 1,000만 달러를 받고 스텔스에서 나왔고, 4월에 첫 제품 l max를 출시했다.\", \"watch\": \"효능 수치가 전부 회사가 수행하거나 의뢰한 연구에서 나왔고, 핵심 수치인 점액 배출 50퍼센트 개선은 사람 대상 임상이 아니라 동물 실험 모델 결과다. 위약 대조 임상시험은 아직 진행 중이다.\"}, \"problem\": \"미국 서부와 캐나다의 산불은 해마다 심해져 2023년에는 뉴욕까지 연기가 덮쳤고, 2026년 여름에도 대형 산불이 100건 넘게 이어졌다. 세계보건기구 기준으로 세계 인구의 99퍼센트가 권고치를 넘는 공기를 마시고 산다. 그런데도 폐는 수면이나 장 건강과 달리 매일 관리하는 대상이 아니었고, 천식이나 만성 기침처럼 증상이 생긴 뒤에야 병원에서 다루는 기관이었다. 미국에서 흡입기는 전부 처방 의약품이라 의사를 만나야 살 수 있고, 처방 없이 폐를 위해 쓸 수 있는 소비자 제품은 공기청정기나 마스크처럼 공기를 막는 쪽뿐이었다. 한국은 이비인후과와 호흡기내과 문턱이 낮고 진료비 부담도 작아서 숨이 답답하면 병원에 가면 되지만, 미국에서는 전문의를 만나는 일 자체가 시간과 비용을 요구하기 때문에 병원 밖에서 쓰는 예방 제품이 비집고 들어갈 자리가 생긴다. 창업자들은 천식이 있는 형제, 만성 기침을 앓는 어머니, 수면무호흡을 관리하는 형제자매를 곁에서 지켜보다가 2023년 캐나다 산불 때 쓸 만한 해법이 없다는 것을 확인하고 회사를 만들었다고 밝힌다.\", \"solution\": \"웹사이트에서 스타터 세트를 주문하면 재사용 기기와 여행용 케이스, 28일치 분말 블리스터가 온다. 아침에 기기 뚜껑을 열고 블리스터 한 알을 넣은 뒤 문을 끝까지 닫으면 알이 뚫린다. 숨을 깊게 내쉬어 폐를 비우고 입에 물고 5초 이상 천천히 들이마신 다음 5초 정도 숨을 참았다가 내쉬면 끝이며, 전체가 30초 안에 끝난다. 회사는 이 분말이 기도 점액의 산성도와 수분을 조절하고 섬모 운동을 도와 폐가 원래 하던 청소 작용을 거들 뿐, 증상을 억누르거나 몸에 없던 반응을 강제로 일으키는 것은 아니라고 설명한다. 쓰기 시작하면 점액이 일시적으로 늘어나는 것이 정상이라고 안내하며, 1주차에 숨쉬기가 편해지고 2주에서 3주차에 지구력이 붙고 4주차부터 새 기준선이 만들어진다는 식으로 기대치를 제시한다. 값은 스타터 세트 95달러, 월 구독 55달러, 3개월 구독 123.75달러이고 리필만 한 번 사면 55달러다. 미국 본토 무료 배송과 30일 환불 보장이 붙고, burst라는 업체를 거쳐 문진표를 작성하고 의료필요성확인서를 받으면 hsa와 fsa 세전 자금으로 환급을 신청할 수 있다.\", \"features\": [{\"name\": \"l max 기기와 분말 블리스터\", \"detail\": \"기기는 재사용하고 분말은 1회분씩 밀봉된 블리스터로 넣는다. 액체도 배터리도 가압 부품도 없어서 기내 반입이 되며, 물로 씻지 말고 마른 천으로 닦으라고 안내한다.\"}, {\"name\": \"하루 한 번 30초 흡입 절차\", \"detail\": \"블리스터를 넣고 문을 닫아 알을 뚫은 뒤 5초 들이마시고 5초 참았다가 내쉬는 세 단계다. 아침에 양치처럼 붙여서 하라고 권하고, 저녁 운동이나 수면용으로 하루 두 번까지는 괜찮지만 그 이상은 효과가 더 늘지 않는다고 적는다.\"}, {\"name\": \"다섯 가지 성분을 내세운 분말 조합\", \"detail\": \"회사가 앞세우는 성분은 탄산수소나트륨, 구연산 계열, 아르기닌, 포스콜린, 테오브로민 다섯 가지다. 실제 전성분 표기는 여기에 트레할로스 이수화물, l류신, 정제수, 페퍼민트와 스피어민트와 백도 향이 더 들어간다. 미국 내 gmp 인증 공장에서 만든다고 밝힌다.\"}, {\"name\": \"근거 자료실(evidence library)\", \"detail\": \"성분별 근거로 삼은 외부 논문 11편을 pubmed 링크와 함께 걸어 두고, 자체 연구 2편을 따로 표시한다. 자체 연구 중 하나는 2026년 5월 aaps pharmscitech에 실렸고, 다른 하나는 지구력 선수를 다룬 탐색적 사례 시리즈다.\"}, {\"name\": \"구독과 환불 조건\", \"detail\": \"월 55달러 구독은 첫 주문에 기기와 케이스를 무료로 얹어 주고 언제든 건너뛰거나 해지할 수 있다. 3개월 단위로 묶으면 리필 값을 25퍼센트 깎아 준다. 30일 환불 보장과 미국 본토 무료 배송이 붙는다.\"}, {\"name\": \"hsa와 fsa 환급 연결\", \"detail\": \"결제는 일반 카드로 하고, 그 뒤 burst의 문진표를 작성해 제휴 의료진이 검토한 의료필요성확인서를 받으면 세전 의료비 계좌에서 환급을 신청할 수 있다. 회사는 최대 100퍼센트까지 돌려받을 수 있다고 안내한다.\"}, {\"name\": \"성능 자문단(performance advisory board)\", \"detail\": \"2026년 7월에 지구력 스포츠 인물 여섯 명을 자문단으로 발표했다. 철인3종 세계챔피언 tim o'donnell, 장거리 선수 sara hall, 아이언맨 챔피언이자 코치인 matt hanson, 심박변이도 전문가 dan plews, kayla jeter, citius mag 창업자 chris chavez다.\"}, {\"name\": \"임상의 공유 표시(frontrowmd)\", \"detail\": \"제품 페이지에 임상의 316명이 대가 없이 이 제품을 공유했다는 배지를 frontrowmd 위젯으로 붙여 두었다. 의사 추천을 판매 페이지에서 신뢰 장치로 쓰는 방식이다.\"}], \"differentiator\": \"회사 스스로는 직접 경쟁자가 없다고 말하며, 인접한 것으로 처방 호흡기 약, 의료기기, 일반 보충제를 든다. 실제로 호흡 쪽 소비자 제품은 airofit처럼 호흡근을 훈련시키는 기기나 소금방처럼 환경을 바꾸는 쪽이었고, 기도 점액 배출 자체를 겨냥해 매일 들이마시게 하는 소비자 제품은 찾기 어렵다. 다만 사업 방식 자체는 새롭지 않다. 창업자 eric kau는 유산균 브랜드 seed health의 최고운영책임자 출신이고, 미생물군 개념을 교육해 시장을 만든 seed의 문법을 그대로 가져왔다고 본인이 인정한다. 정기구독, 과학 근거를 앞세운 마케팅, 운동선수 자문단, hsa와 fsa 환급 연결은 ag1이나 seed 같은 구독형 건강 브랜드가 이미 쓰는 장치이며, hsa와 fsa 연결은 truemed이 대중화한 구조와 같은 갈래다.\", \"team\": [{\"name\": \"eric kau\", \"role\": \"공동창업자 겸 최고경영자\", \"background\": \"유산균 브랜드 seed health의 최고운영책임자로 유통과 제품군 확장을 이끌었고, 그 전에는 반려동물 커머스 chewy 창업 초기 팀에 있었으며 amazon에서 비타민과 보충제 부문을 맡았다. glossy 인터뷰에는 target과 best buy 경력도 함께 언급된다.\"}, {\"name\": \"allie melnick\", \"role\": \"공동창업자 겸 최고사업책임자\", \"background\": \"면도기 브랜드 harry's inc.에서 브랜드 총괄과 대표를 맡아 여러 소비자 브랜드를 만들고 해외로 넓힌 경력이 있다.\"}, {\"name\": \"dr. dale christensen\", \"role\": \"최고과학책임자\", \"background\": \"듀크대학교 의료원 의학 겸임 부교수다. 3년 넘게 이어진 회사의 기초 연구를 이끌었고, 2026년 5월 aaps pharmscitech에 실린 논문의 제1저자다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"스텔스에서 나오면서 시드 1,000만 달러를 발표했다. lerer hippeau가 주도했고 bbgv, brand foundry, cade ventures, good friends, space station이 참여했다. 연구 확대와 인력 충원, 첫 제품 출시에 쓰겠다고 밝혔다.\", \"when\": \"2026-01\", \"source\": \"climatic 보도자료(fitt insider), medcity news, pulse 2.0\"}, {\"type\": \"partnership\", \"detail\": \"mount sinai medical center of florida의 폐 연구 책임자 juan sabater와 함께 진행한 연구가 aaps pharmscitech에 'safety and efficacy of inhaled natural product powders that enhance mucociliary clearance'라는 제목으로 실렸다. 저자에 회사의 최고과학책임자 dale christensen과 sabater가 함께 들어 있다.\", \"when\": \"2026-05\", \"source\": \"crossref(10.1208/s12249-026-03454-y), climatic 근거 자료실\"}, {\"type\": \"customers\", \"detail\": \"2026년 4월 l max를 정식 출시했고 첫 물량이 14일 만에 완판됐다고 밝혔다. 이후 다시 선주문을 받고 있으며 배송까지 4주에서 6주가 걸린다고 안내한다. 제품 페이지의 후기 수는 37건이다.\", \"when\": \"2026-04\", \"source\": \"athletech news, climatichealth.com 제품 페이지\"}, {\"type\": \"partnership\", \"detail\": \"지구력 스포츠 인물 여섯 명으로 성능 자문단을 꾸렸다고 발표했다. 별도로 mayo clinic의 bruce johnson, 매사추세츠종합병원과 하버드의 raghu chivukula를 과학 자문으로 사이트에 올려 두었다.\", \"when\": \"2026-07\", \"source\": \"climatic 보도자료(fitt insider), climatichealth.com\"}, {\"type\": \"traffic\", \"detail\": \"런클럽과 strava 동호회를 주된 획득 경로로 쓴다고 밝혔다. 근거 자료실 페이지에 자체 strava 클럽 링크를 걸어 두었고, 인스타그램과 틱톡 계정을 운영한다. 별도 모바일 앱은 미국 앱스토어와 구글 플레이 어디에도 없다.\", \"when\": \"2026-08\", \"source\": \"glossy 인터뷰, climatichealth.com, 앱스토어 검색 결과\"}], \"caveats\": \"효능 수치는 전부 회사가 수행하거나 의뢰한 연구에서 나왔고 제삼자가 독립적으로 확인한 것이 아니다. 가장 많이 인용되는 점액 배출 50에서 55퍼센트 개선은 사람을 대상으로 한 임상시험이 아니라 점액섬모 청소가 손상된 in vivo 모델, 곧 동물 실험 모델에서 한 번 투여했을 때 나온 값이다. 이 연구가 실린 aaps pharmscitech 논문의 저자에는 회사의 최고과학책임자와 협력 연구자가 들어 있다. 선수 대상 수치인 호흡 편해짐 98퍼센트, 기록 6퍼센트 향상, 심박변이도 개선 80퍼센트는 5주 사용자 시험에서 나온 것이고, 근거 자료실에 걸린 해당 논문의 제목 자체가 탐색적 사례 시리즈(exploratory case series)다. 대조군이 있는 시험이 아니며 회사는 위약 대조 이중맹검 임상이 지금 진행 중이라고만 밝힌다. 규제 측면에서는 회사가 성분을 fda gras라고 표기하는데, gras는 식품으로 먹었을 때를 전제로 한 안전성 판정이지 흡입 경로에 대한 판정이 아니다. 사이트 모든 페이지 아래에는 fda가 이 표현을 평가하지 않았고 질병을 진단하거나 치료하는 제품이 아니라는 고지가 붙어 있으며, 처방 흡입기를 대신하지 않고 어린이 안전성은 확립되지 않았다고 회사가 직접 적는다. 첫 물량 14일 완판과 임상의 316명이 대가 없이 공유했다는 표시도 회사와 제휴 위젯이 낸 숫자이고 확인할 방법이 없다. 지금도 선주문 상태라 실제 출하 규모를 알 수 없다. 창업 시점 표기도 자료마다 갈린다. athletech news는 2023년 창업이라고 적고, lerer hippeau 포트폴리오는 투자 시점을 2025년으로 표시하며, glossy 인터뷰에서 창업자는 2024년 무렵 회사가 막 만들어지던 때라고 말한다. 회사 소개 페이지는 창업자를 allie, eric, nick 세 사람의 이름으로 적는데 보도자료는 공동창업자를 kau와 melnick 두 사람으로만 밝히며, nick의 성과 직함은 확인하지 못했다.\", \"for_us\": \"물리 제품이라 3개월 안에 그대로 따라 할 수는 없지만, 이 회사가 찾아낸 문제와 판매 장치는 소프트웨어로 옮길 여지가 있다. 첫째, 문제 정의 자체가 앱으로 건드릴 수 있는 자리다. 미국 사용자는 산불 연기와 꽃가루, 대기오염에 매일 노출되면서도 그날 무엇을 해야 하는지 모른다. 위치 기반 공기질과 꽃가루 수치를 받아 오늘 야외 활동을 할지 말지, 걷는 시간을 언제로 옮길지 알려 주는 일은 우리 걸음 데이터와 바로 붙는다. 둘째, 이 회사의 획득 경로가 런클럽과 strava 동호회다. 걸음과 달리기를 다루는 우리 앱이 미국에서 접점을 만들 자리가 같다. 셋째, hsa와 fsa 세전 자금 환급을 결제 단계에 붙이는 구조는 truemed과 같은 갈래이며, 미국에서 건강 관련 유료 상품을 파는 회사가 공통으로 다는 장치라는 점을 다시 확인해 준다. 넷째, 카테고리를 만드는 화법이 참고가 된다. 수면과 수분 섭취와 장 건강이라는 이미 인정받은 축 옆에 폐를 나란히 세우고, 아침 양치처럼 기존 습관에 붙이라고 말한다. 우리가 미국인에게 새 건강 가치를 설명할 때도 없던 개념을 새로 세우기보다 이미 자리 잡은 습관 옆에 붙이는 편이 빠르다. 다섯째, 반대 방향의 교훈도 있다. 이 회사의 수치는 전부 자사 연구에서 나왔고 규제 표기가 애매한데도 투자와 언론 주목을 받았다. 우리가 건강 효과를 말할 때 어디까지가 검증된 것인지 구분해 적어야 한다는 사례로 삼을 만하다.\", \"screenshots\": [{\"file\": \"climatic_home.png\", \"caption\": \"첫 화면이다. 한 번의 깊은 숨으로 매일 폐를 관리한다는 문구와 함께 파란 흡입 기기를 입에 물고 있는 장면을 크게 걸었고, 임상 연구, 천연 성분, 폐 직접 전달 세 가지를 내세운다.\", \"from\": \"https://www.climatichealth.com/\"}, {\"file\": \"climatic_product.png\", \"caption\": \"제품 판매 화면이다. 스타터 세트 95달러와 월 55달러 구독이 나란히 놓여 있고, 첫 물량이 14일 만에 완판돼 지금은 선주문이며 배송에 4주에서 6주가 걸린다고 적혀 있다. 임상의 316명이 대가 없이 공유했다는 배지도 여기에 붙어 있다.\", \"from\": \"https://www.climatichealth.com/products/l-max\"}, {\"file\": \"climatic_science.png\", \"caption\": \"근거를 정리한 science 페이지의 첫 화면이다. 실내 공기와 먼지, 꽃가루, 오염물질이 매일 폐에 쌓인다는 문제 제기로 시작해 아래에서 성분별 근거와 연구 일정을 보여 준다.\", \"from\": \"https://www.climatichealth.com/pages/science\"}], \"sources\": [{\"title\": \"climatic 공식 홈페이지\", \"url\": \"https://www.climatichealth.com/\", \"note\": \"제품 구성과 값(스타터 세트 95달러, 구독 월 55달러, 3개월 123.75달러, 리필 55달러), 30초 흡입 절차, 회사가 내건 효능 수치 세 가지, fda 미평가 고지, hsa와 fsa 환급 경로를 확인했다.\"}, {\"title\": \"climatic 회사 소개 페이지\", \"url\": \"https://www.climatichealth.com/pages/about\", \"note\": \"2023년 캐나다 산불을 계기로 창업했다는 이야기와 창업자를 allie, eric, nick으로 적은 표기를 확인했다.\"}, {\"title\": \"climatic science 페이지\", \"url\": \"https://www.climatichealth.com/pages/science\", \"note\": \"다섯 가지 성분과 각각의 작용 설명, 2020년 성분 탐색부터 2026년 임상 시험까지의 연구 일정, 자문 의사들의 발언을 확인했다.\"}, {\"title\": \"climatic 근거 자료실\", \"url\": \"https://www.climatichealth.com/pages/evidence-library\", \"note\": \"성분 근거로 삼은 외부 논문 11편과 자체 연구 2편의 제목과 링크를 확인했다. 선수 대상 연구가 탐색적 사례 시리즈라는 점을 여기서 확인했다.\"}, {\"title\": \"climatic l max 제품 페이지\", \"url\": \"https://www.climatichealth.com/products/l-max\", \"note\": \"전성분 표기, 사용법, 주차별 기대 효과, 구독 조건, 후기 37건, 임상의 316명 공유 배지를 확인했다.\"}, {\"title\": \"climatic 고객 지원 문답\", \"url\": \"https://climatichealth.gorgias.help/en-us\", \"note\": \"처방 흡입기를 대신하지 않는다는 안내, 어린이 안전성 미확립, 성분이 fda gras라는 표기, 미국 내 제조, 기내 반입 가능 여부를 확인했다.\"}, {\"title\": \"climatic raises $10m seed round to pioneer daily lung health category (회사 보도자료)\", \"url\": \"https://insider.fitt.co/press-release/climatic-raises-10m-seed-round-to-pioneer-daily-lung-health-category/\", \"note\": \"2026년 1월 28일 발표된 시드 1,000만 달러의 주도사와 참여사, 창업자 두 사람의 경력, mount sinai의 juan sabater와 한 in vivo 연구 내용, 선수 대상 5주 시험 수치를 확인했다.\"}, {\"title\": \"climatic emerges from stealth with $10m to build a daily lung health category (medcity news)\", \"url\": \"https://medcitynews.com/2026/01/climatic-startup-lung/\", \"note\": \"뉴욕 소재라는 점, 비처방 흡입 제품이라는 점, 직접 경쟁자가 없다고 보는 회사의 인식, 늦봄 출시 예정이라는 계획을 확인했다.\"}, {\"title\": \"climatic: $10 million seed funding raised for pioneering daily lung health (pulse 2.0)\", \"url\": \"https://pulse2.com/climatic-10-million-seed-funding/\", \"note\": \"창업자 eric kau와 allie melnick의 이전 경력, 최고과학책임자 dale christensen의 소속, 점액 배출 50퍼센트 이상 개선이 in vivo 모델 결과라는 점을 확인했다.\"}, {\"title\": \"ceo corner: climatic's eric kau on bringing lung health into the mainstream (athletech news)\", \"url\": \"https://athletechnews.com/ceo-corner-climatic-eric-kau-bringing-lung-health-into-the-mainstream-exclusive-interview/\", \"note\": \"2023년 창업 표기, 4월 출시 후 14일 완판 주장, 목표 고객층, 위약 대조 이중맹검 임상이 진행 중이라는 언급, 환경 적응 건강으로 넓히겠다는 장기 구상을 확인했다.\"}, {\"title\": \"vc-backed climatic launches inhalable lung health device (athletech news)\", \"url\": \"https://athletechnews.com/climatic-launches-inhalable-lung-health-device-l-max/\", \"note\": \"2026년 4월 21일 출시 사실, 엘리트 선수 200명 이상 대상 시험 주장, 직접 판매 방식과 값을 확인했다.\"}, {\"title\": \"wellness briefing: the emerging lung health category is top of mind after more brutal wildfires (glossy)\", \"url\": \"https://www.glossy.co/beauty/wellness/wellness-briefing-the-emerging-lung-health-category-is-top-of-mind-after-more-brutal-wildfires-plus-news\", \"note\": \"런클럽과 strava를 주요 획득 경로로 쓴다는 점, 초기 목표 고객이 해안 대도시의 바이오해커와 선수라는 점, 창업자가 말한 창업 시점, seed 마케팅 방식을 그대로 가져왔다는 발언을 확인했다.\"}, {\"title\": \"climatic launches performance advisory board (회사 보도자료)\", \"url\": \"https://insider.fitt.co/press-release/climatic-launches-performance-advisory-board-to-advance-daily-lung-health-as-the-next-frontier-in-wellness/\", \"note\": \"2026년 7월 7일 발표된 성능 자문단 여섯 명의 명단과 역할을 확인했다.\"}, {\"title\": \"lerer hippeau 포트폴리오\", \"url\": \"https://www.lererhippeau.com/portfolio\", \"note\": \"climatic이 포트폴리오에 올라 있고 climatichealth.com으로 연결되며 투자 시점이 2025년으로 표기돼 있음을 확인했다. 뉴스레터가 말한 그 회사가 이 사이트의 회사와 같다는 근거다.\"}, {\"title\": \"safety and efficacy of inhaled natural product powders that enhance mucociliary clearance (aaps pharmscitech)\", \"url\": \"https://link.springer.com/content/pdf/10.1208/s12249-026-03454-y.pdf\", \"note\": \"crossref로 2026년 5월 15일 게재와 저자 명단(christensen, sabater 포함)을 확인했다.\"}, {\"title\": \"effect of enhanced lung cleansing on observed changes in performance of endurance athletes: an exploratory case series\", \"url\": \"https://auctoresonline.org/article/effect-of-enhanced-lung-cleansing-on-observed-changes-in-performance-of-endurance-athletes-with-breathing-limitations-an-exploratory-case-series\", \"note\": \"선수 대상 수치의 출처가 대조군 없는 탐색적 사례 시리즈라는 점을 제목과 게재처에서 확인했다.\"}, {\"title\": \"미국 앱스토어와 구글 플레이 검색\", \"url\": \"https://itunes.apple.com/search?term=climatic&country=us&entity=software\", \"note\": \"climatic 이름의 소비자 앱이 없음을 확인했다. 판매와 사용이 모두 웹과 물리 제품으로만 이뤄진다.\"}]}"},{"slug":"cost-plus-drugs","name":"Mark Cuban Cost Plus Drugs","one_liner":"보험을 거치지 않고 처방약을 파는 미국의 우편 배송 온라인 약국이다. 약을 사 오는 값에 15%를 붙이고 조제비 5달러를 더한 금액을 그대로 공개해서 판다.","sells_to":"mixed","seen_in":[{"issue":"39","section":12,"headline":"원가에 정해진 마진만 붙여 파는 이 약국이 수직 통합 보험사 Humana의 약국 사업과 제휴한 다음 날, 창업자 Mark Cuban이 수직 통합 보험사를 해체하라고 요구한 모순을 지적하는 대목에서 나왔다."}],"card":{"problem":"미국에서는 같은 약도 약국과 보험, 약제비 관리 회사를 거치며 값이 제각각이 되고, 소비자는 창구에서 값을 부르기 전까지 얼마를 낼지 알 수 없다. 보험이 없거나 자기부담금이 큰 사람은 흔한 약조차 감당하기 어려운 금액을 낸다.","solution":"약을 사 오는 값에 15%와 조제비 5달러를 더한 금액을 그대로 공개하고, 그 값에 우편으로 보내 준다. 의사가 이 회사의 약국으로 처방전을 보내면 소비자가 직접 결제해서 받는다.","price":"아토르바스타틴 10mg 30알이 5.25달러이고, 배송비 5.25달러가 따로 붙는다. 리시노프릴 10mg 30알은 5.38달러, 이매티닙 400mg 30알은 34.50달러다.","tags":["온라인 약국","원가 공개","현금 결제","우편 배송","처방 필요"],"headline_traction":"2026년 4월 Humana의 약국 사업 CenterWell Pharmacy와 제휴해, 이 회사가 만든 약국 운영 소프트웨어 SwiftyRx를 CenterWell이 쓰기로 했다.","watch":"'최대 80% 절약'과 화면에 뜨는 비교 가격은 회사가 정한 기준으로 낸 수치다. 제삼자 연구에서는 보험 가입자의 처방 가운데 이곳이 더 싼 경우가 5~12%에 그쳤다."},"screenshots":[{"file":"cost-plus-drugs_home.png","caption":"첫 화면이다. '중간상 없음, 가격 장난 없음, 큰 약값 절약'과 '최대 80% 절약'을 내걸고 약 검색창을 가운데 둔다.","from":"https://costplusdrugs.com/"},{"file":"cost-plus-drugs_product.png","caption":"아토르바스타틴 10mg 30알 상품 화면이다. 값 5.25달러와 함께 다른 약국 소매가 55.20달러, 절약 49.95달러가 표시된다.","from":"https://costplusdrugs.com/medications/atorvastatin-10mg-tablet/"},{"file":"cost-plus-drugs_mission.png","caption":"사명 페이지에 실린 Mark Cuban의 창업 편지다. 보험이 없거나 자기부담금이 큰 사람에게는 기본적인 약조차 큰 돈이 든다는 문제 인식을 앞세운다.","from":"https://costplusdrugs.com/mission/"}],"q":"{\"slug\": \"cost-plus-drugs\", \"name\": \"mark cuban cost plus drugs\", \"one_liner\": \"보험을 거치지 않고 처방약을 파는 미국의 우편 배송 온라인 약국이다. 약을 사 오는 값에 15%를 붙이고 조제비 5달러를 더한 금액을 그대로 공개해서 판다.\", \"site\": \"https://costplusdrugs.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"39\", \"section\": 12, \"headline\": \"원가에 정해진 마진만 붙여 파는 이 약국이 수직 통합 보험사 humana의 약국 사업과 제휴한 다음 날, 창업자 mark cuban이 수직 통합 보험사를 해체하라고 요구한 모순을 지적하는 대목에서 나왔다.\"}], \"card\": {\"problem\": \"미국에서는 같은 약도 약국과 보험, 약제비 관리 회사를 거치며 값이 제각각이 되고, 소비자는 창구에서 값을 부르기 전까지 얼마를 낼지 알 수 없다. 보험이 없거나 자기부담금이 큰 사람은 흔한 약조차 감당하기 어려운 금액을 낸다.\", \"solution\": \"약을 사 오는 값에 15%와 조제비 5달러를 더한 금액을 그대로 공개하고, 그 값에 우편으로 보내 준다. 의사가 이 회사의 약국으로 처방전을 보내면 소비자가 직접 결제해서 받는다.\", \"price\": \"아토르바스타틴 10mg 30알이 5.25달러이고, 배송비 5.25달러가 따로 붙는다. 리시노프릴 10mg 30알은 5.38달러, 이매티닙 400mg 30알은 34.50달러다.\", \"tags\": [\"온라인 약국\", \"원가 공개\", \"현금 결제\", \"우편 배송\", \"처방 필요\"], \"headline_traction\": \"2026년 4월 humana의 약국 사업 centerwell pharmacy와 제휴해, 이 회사가 만든 약국 운영 소프트웨어 swiftyrx를 centerwell이 쓰기로 했다.\", \"watch\": \"'최대 80% 절약'과 화면에 뜨는 비교 가격은 회사가 정한 기준으로 낸 수치다. 제삼자 연구에서는 보험 가입자의 처방 가운데 이곳이 더 싼 경우가 5~12%에 그쳤다.\"}, \"problem\": \"미국에서 처방약 값은 하나로 정해져 있지 않다. 제조사에서 도매상과 약제비 관리 회사, 보험사, 약국을 차례로 거치는 동안 각 단계가 값을 다시 매기기 때문에, 같은 약이라도 어느 약국에서 어떤 보험으로 사느냐에 따라 금액이 크게 달라진다. 그 계산이 밖에서 보이지 않아서, 소비자는 약국 창구에서 금액을 부를 때까지 자기가 얼마를 낼지 알 수 없다. 보험이 아예 없는 사람과, 보험은 있어도 연간 자기부담 한도를 채우기 전까지 사실상 전액을 내야 하는 고액공제형 보험 가입자에게는 흔한 만성질환 약조차 부담이 된다. 한국은 건강보험이 전 국민에게 적용되고 급여 약값이 전국에서 같기 때문에 이런 종류의 문제 자체가 생기지 않는다.\", \"solution\": \"소비자는 먼저 사이트에서 약 이름을 검색해 값을 확인한다. 값을 보는 데는 회원 가입도 결제도 필요하지 않고, 제조사에서 사 온 값과 15% 마진, 조제비 5달러, 배송비가 각각 얼마인지 항목별로 나뉘어 표시된다. 마음에 들면 자기 의사에게 이 회사의 조제 협력사인 healthdyne 약국으로 처방전을 보내 달라고 요청한다. 처방전이 도착하면 계정을 만들어 결제하고, 약은 집으로 배송된다. 조제에 2~3영업일이 걸리고 일반 배송은 그 뒤로 5~7영업일이 더 걸리므로, 오늘 당장 약이 필요한 사람에게는 맞지 않는다. 2026년 9월 11일에 직접 확인한 값으로는 아토르바스타틴 10mg 30알이 5.25달러(사 온 값 0.22달러, 마진 0.03달러, 조제비 5달러), 리시노프릴 10mg 30알이 5.38달러, 설트랄린 50mg 30알이 5.69달러, 백혈병 약 이매티닙 400mg 30알이 34.50달러였다. 배송비는 처방 1~2건에 5.25달러이고 건수가 늘면 7.50달러, 9.50달러, 16달러로 올라가며, 냉장 배송은 건당 55달러다.\", \"features\": [{\"name\": \"항목별 원가 공개 가격 계산기\", \"detail\": \"약을 고르고 용량과 개수를 누르면 제조사에서 사 온 값, 15% 마진, 조제비 5달러, 배송비가 각각 얼마인지 나뉘어 나온다. 옆에는 '다른 약국의 소매가'와 절약 금액도 함께 표시된다.\"}, {\"name\": \"의사가 처방전을 보내는 방식의 주문\", \"detail\": \"쿠폰을 받아 동네 약국에 가는 방식이 아니라, 의사가 이 회사의 조제 협력사인 healthdyne 약국으로 처방전을 새로 보내야 한다. 다른 약국에 이미 보낸 처방전을 옮겨 오는 것도 가능하지만, 마약류로 분류된 약은 취급하지 않는다.\"}, {\"name\": \"보험 청구 지원\", \"detail\": \"처음에는 보험을 아예 받지 않았으나, 2026년 9월 기준으로 affirmedrx, capital blue cross, selecthealth, smithrx, welldyne 등 29곳의 처방 보험과 약제비 관리 회사를 인네트워크로 받는다. 회사는 보험을 쓰더라도 결제 금액이 보험을 안 쓴 값보다 높아지지는 않는다고 밝힌다. 보험으로 결제하면 그 금액이 본인부담 한도 계산에 들어간다는 점이 소비자에게 실익이다.\"}, {\"name\": \"제조사가 비용을 대는 브랜드 약\", \"detail\": \"모든 약이 원가에 15%를 붙이는 방식은 아니다. 혈액 항응고제 eliquis 5mg 60알은 345달러로 표시되는데, 이 경우 마진과 배송비, 조제비를 제조사인 bristol myers squibb이 부담한다고 화면에 적혀 있다. 아달리무맙과 우스테키누맙 같은 바이오시밀러도 취급한다.\"}, {\"name\": \"고용주와 보험사를 상대로 한 약국 혜택\", \"detail\": \"자가보험을 운영하는 기업과 관리의료 조직, 제삼자 관리 회사를 상대로, 기존 약제비 관리 회사의 약국 망에 들어가거나 그 위에 얹는 형태로 원가 기반 가격을 제공한다고 안내한다. 가입자는 평소 쓰던 처방 카드를 그대로 쓰면 된다.\"}, {\"name\": \"병원과 클리닉을 상대로 한 도매 구매 플랫폼\", \"detail\": \"병원, 투석 센터, 수술 센터, 종양 센터, 약국을 상대로 graphiterx 기반 구매 플랫폼을 운영한다. 주문과 추적, 보고를 한 화면에서 하도록 만든 기업용 서비스다.\"}, {\"name\": \"약국 운영 소프트웨어 swiftyrx\", \"detail\": \"약 주문 처리를 자동화하는 자체 소프트웨어다. 2026년 4월 제휴로 humana의 centerwell pharmacy가 이 소프트웨어를 쓰기로 했고, 우선 humana 임직원 보험 가입자를 대상으로 한 우편 배송 약국에 적용된다. 약을 파는 회사가 소프트웨어도 판다는 점이 이 제휴의 핵심이다.\"}, {\"name\": \"모바일 앱 없음\", \"detail\": \"회사는 공식 자주 묻는 질문에서 앱이 없으며 휴대폰 브라우저로 쓰도록 만들었다고 밝힌다. 취급 품목은 2026년 9월 11일 기준 사이트맵에 상품 페이지 2,398개로, 성분과 용량, 제형 조합 단위로 세어 그렇다.\"}], \"differentiator\": \"가장 자주 비교되는 goodrx와는 사업의 성격 자체가 다르다. goodrx는 약국을 갖지 않고, 약제비 관리 회사가 이미 정해 둔 할인가를 쿠폰으로 보여 주는 비교 서비스이며 소비자에게 돈을 받지 않는다. 반면 cost plus drugs는 스스로 약을 사 오는 약국이고, 자기가 얼마에 사 왔는지를 공개한 뒤 그 위에 붙는 마진을 15%로 못 박는다. 대신 goodrx는 동네 약국에서 오늘 바로 약을 받을 수 있는 데 비해, 이쪽은 의사가 처방전을 새로 보내야 하고 일주일 넘게 기다려야 한다. amazon pharmacy와 costco의 회원 가격도 같은 자리를 노리지만, 사 온 값을 그대로 공개하는 곳은 이 회사뿐이다.\", \"team\": [{\"name\": \"alexander oshmyansky\", \"role\": \"창업자 겸 최고경영자\", \"background\": \"영상의학과 의사다. 공식 사이트 설명에 따르면 18세에 콜로라도 대학교 볼더 캠퍼스에서 생화학 학사를 마치고 듀크 의대에서 의학 박사를, 마셜 장학생으로 옥스퍼드에서 수학 박사를 받았다. 브리검 여성병원에서 외과 인턴을, 존스홉킨스에서 영상의학 전공의와 소아 영상의학 전임의를 마쳤고 스탠퍼드 의대 겸임 교수를 지냈다. 환자들이 내는 제네릭 약값이 치솟는 것에 분개해 이 회사를 세웠다고 밝힌다. 대학원 재학 중 병원 내 감염을 줄이는 회사 altitude medical을 창업한 경력도 있다.\"}, {\"name\": \"mark cuban\", \"role\": \"공동창업자 겸 투자자\", \"background\": \"회사 이름에 자기 이름이 들어가 있고, 공식 사이트의 사명 페이지에 실린 창업 편지를 쓴 사람이다. 자주 묻는 질문에서는 투자자로, 2026년 4월 제휴 보도에서는 공동창업자로 소개된다. 이 세션에서 그 밖의 경력은 확인하지 않았다.\"}], \"traction\": [{\"type\": \"partnership\", \"detail\": \"humana의 약국 사업 centerwell pharmacy와 제휴했다. centerwell이 cost plus drugs의 약국 운영 소프트웨어 swiftyrx를 주문 처리에 쓰고, 우선 humana 임직원 보험 가입자에게 우편 배송 약국을 제공한다.\", \"when\": \"2026-04\", \"source\": \"healthcare finance news 2026년 4월 29일 기사, business wire 2026년 4월 27일 보도자료\"}, {\"type\": \"customers\", \"detail\": \"mark cuban이 2024년 3월에 '아마도 200만 명 정도'의 환자에게 약을 보냈고 제네릭 약 약 2,500종을 취급한다고 말했다. 회사가 스스로 낸 수치이며 제삼자가 확인한 것은 아니다.\", \"when\": \"2024-03\", \"source\": \"fierce healthcare 2024년 6월 18일 기사에 인용된 발언\"}, {\"type\": \"partnership\", \"detail\": \"처방 보험과 약제비 관리 회사 29곳을 인네트워크로 받는다. affirmedrx, capital blue cross, selecthealth, smithrx, welldyne 등이 이름을 올리고 있다.\", \"when\": \"2026-09\", \"source\": \"공식 사이트 자주 묻는 질문(2026년 9월 11일 확인)\"}, {\"type\": \"partnership\", \"detail\": \"병원과 클리닉, 수술 센터, 종양 센터를 상대로 graphiterx 기반 도매 구매 플랫폼을 운영한다.\", \"when\": \"2026-09\", \"source\": \"business.costplusdrugs.com(2026년 9월 11일 확인)\"}], \"caveats\": \"회사가 낸 수치와 제삼자가 확인한 수치를 구분해서 볼 필요가 크다. 첫째, 첫 화면의 '최대 80% 절약'과 상품 화면의 '다른 약국의 소매가'는 회사가 정한 기준으로 낸 값이다. 자주 묻는 질문에는 그 소매가가 제삼자 자료로 만든 다른 약국들의 평균이며 약을 처음 등록할 때 적어 둔 값이라 지금 시세와 다를 수 있다고 적혀 있다. 아토르바스타틴 10mg 30알의 비교 가격 55.20달러가 그런 예다. 둘째, 값이 싼 대상이 한정된다. 2024년 6월 jama health forum에 실린 연구는 2019년 제네릭 약 124종의 처방 8억 4,400만 건을 따져, 이 회사에서 샀을 때 본인 부담이 줄어드는 처방은 11.8%뿐이었다고 보고했다. 무보험자는 28.9%였지만 메디케어 5.5%, 민간 보험 7.1%, 메디케이드는 0%였고 절감액 중앙값은 처방 한 건당 4.96달러였다. 2025년 8월 jama network open의 신경과 약 연구에서는 보험 가입자 기준 본인 부담이 오히려 75% 높았고, 조사한 33종 가운데 본인 부담이 더 싼 약은 두 종뿐이었다. 셋째, 제도 전체로 보면 절감 여지가 크다는 연구도 함께 있다. 2024년 pharmacoeconomics 연구는 90일분 기준으로 메디케어 파트 d가 86억 달러를 아낄 수 있다고 봤고, 2026년 2월 health services research의 혈압약 연구는 87종 가운데 90알 기준 58종에서 절감이 나오며 평균 인하율이 23.2%라고 보고했다. 다만 같은 연구에서 30알 기준으로는 87종 중 39종만 더 쌌다. 넷째, 조제비 5달러와 배송비 5.25달러가 고정으로 붙기 때문에 아주 싼 제네릭은 총액이 10달러 아래로 내려가지 않는다. 값이 크게 벌어지는 구간은 이매티닙처럼 원래 비쌌던 제네릭이다. 다섯째, 마약류는 취급하지 않고 쿠폰이나 할인 카드를 받지 않으며, 조제와 배송에 일주일 이상 걸린다.\", \"for_us\": \"약을 파는 일 자체는 우리가 할 수 없지만, 세 가지가 참고가 된다. 첫째, 이 회사가 소비자에게 준 가치의 핵심은 싼 값이 아니라 '값이 어떻게 만들어졌는지 항목별로 보여 준 것'이다. 사 온 값, 마진, 조제비, 배송비를 나눠 보여 주는 화면 하나로 신뢰를 만들었고, 그 화면은 순수하게 소프트웨어로 만든 것이다. 둘째, 정작 소비자에게 실제로 싼지는 그 사람의 보험 상태에 따라 갈린다. 제삼자 연구가 보여 준 대로 무보험자와 비싼 제네릭에서만 이득이 크므로, '당신 상황에서 이게 정말 싼가'를 판정해 주는 기능이 값 자체보다 더 큰 가치가 될 수 있다. 다만 우리 쪽에서는 이미 미국 약값 최저가 판정을 검토하면서 탐색과 실행을 분리해야 하고 기대 금액이 크지 않다는 결론을 냈으므로, 그 결론을 뒤집을 근거가 되지는 않는다. 셋째, 이 회사에는 모바일 앱이 없다. 앱 없이 웹만으로 운영하는 서비스가 미국 헬스케어에 흔하다는 사실 자체가, 앱 화면을 이미 갖고 있는 우리 쪽 강점이 무엇인지 보여 준다.\", \"screenshots\": [{\"file\": \"cost-plus-drugs_home.png\", \"caption\": \"첫 화면이다. '중간상 없음, 가격 장난 없음, 큰 약값 절약'과 '최대 80% 절약'을 내걸고 약 검색창을 가운데 둔다.\", \"from\": \"https://costplusdrugs.com/\"}, {\"file\": \"cost-plus-drugs_product.png\", \"caption\": \"아토르바스타틴 10mg 30알 상품 화면이다. 값 5.25달러와 함께 다른 약국 소매가 55.20달러, 절약 49.95달러가 표시된다.\", \"from\": \"https://costplusdrugs.com/medications/atorvastatin-10mg-tablet/\"}, {\"file\": \"cost-plus-drugs_mission.png\", \"caption\": \"사명 페이지에 실린 mark cuban의 창업 편지다. 보험이 없거나 자기부담금이 큰 사람에게는 기본적인 약조차 큰 돈이 든다는 문제 인식을 앞세운다.\", \"from\": \"https://costplusdrugs.com/mission/\"}, {\"file\": \"cost-plus-drugs_employers.png\", \"caption\": \"고용주와 보험사를 상대로 한 페이지다. 기존 약제비 관리 회사의 약국 망에 들어가거나 그 위에 얹는 두 가지 방식을 제안한다.\", \"from\": \"https://www.markcubancostplusdrugcompany.com/payers\"}], \"sources\": [{\"title\": \"cost plus drugs 첫 화면\", \"url\": \"https://costplusdrugs.com/\", \"note\": \"무엇을 파는지, '최대 80% 절약' 문구, 가격 구성 항목을 확인했다.\"}, {\"title\": \"cost plus drugs 사명 페이지\", \"url\": \"https://costplusdrugs.com/mission/\", \"note\": \"mark cuban의 창업 편지와 15% 마진 계산 방식, 최고경영자 alexander oshmyansky의 경력을 확인했다.\"}, {\"title\": \"cost plus drugs 자주 묻는 질문\", \"url\": \"https://costplusdrugs.com/faq/\", \"note\": \"배송비 구간, 조제와 배송 소요일, 취급 보험 29곳, 마약류 미취급, 쿠폰 미사용, 앱이 없다는 사실, 소매가 비교 기준을 확인했다.\"}, {\"title\": \"아토르바스타틴 10mg 상품 페이지\", \"url\": \"https://costplusdrugs.com/medications/atorvastatin-10mg-tablet/\", \"note\": \"30알 5.25달러와 항목별 내역(0.22달러, 0.03달러, 5달러, 배송 5.25달러)을 직접 확인했다.\"}, {\"title\": \"이매티닙 400mg 상품 페이지\", \"url\": \"https://costplusdrugs.com/medications/imatinib-400mg-tablet/\", \"note\": \"30알 34.50달러와 회사가 제시한 비교 소매가 9,657.30달러를 확인했다.\"}, {\"title\": \"eliquis 5mg 60정 상품 페이지\", \"url\": \"https://costplusdrugs.com/medications/eliquis-5mg-bottle-of-60-tablets-60-eliquis/\", \"note\": \"브랜드 약은 345달러이며 마진과 배송비, 조제비를 제조사가 부담한다는 표시를 확인했다.\"}, {\"title\": \"cost plus drugs 고용주와 보험사 페이지\", \"url\": \"https://www.markcubancostplusdrugcompany.com/payers\", \"note\": \"기업과 관리의료 조직을 상대로 한 약국 혜택 구조를 확인했다.\"}, {\"title\": \"cost plus drugs 기업 구매 사이트\", \"url\": \"https://business.costplusdrugs.com/\", \"note\": \"병원과 클리닉을 상대로 한 graphiterx 기반 도매 구매 플랫폼을 확인했다.\"}, {\"title\": \"cost plus drugs 사이트맵\", \"url\": \"https://costplusdrugs.com/sitemap.xml\", \"note\": \"2026년 9월 11일 기준 약 상품 페이지 2,398개를 세었다.\"}, {\"title\": \"humana teams with mark cuban's cost-plus drug company (healthcare finance news)\", \"url\": \"https://www.healthcarefinancenews.com/news/humana-teams-mark-cubans-cost-plus-drug-company\", \"note\": \"centerwell pharmacy 제휴의 내용과 swiftyrx 소프트웨어, humana 임직원 대상 적용을 확인했다.\"}, {\"title\": \"mark cuban's d2c pharmacy won't beat most insured patients' out of pocket drug prices (fierce healthcare)\", \"url\": \"https://www.fiercehealthcare.com/payers/mark-cubans-d2c-pharmacy-wont-beat-most-insured-patients-out-pocket-drug-prices-study-finds\", \"note\": \"jama health forum 연구의 11.8%, 보험 종류별 비율, 절감액 중앙값 4.96달러와 cuban의 200만 명 발언을 확인했다.\"}, {\"title\": \"potential medicare part d savings on generic drugs from the mark cuban cost plus drug company (annals of internal medicine)\", \"url\": \"https://pubmed.ncbi.nlm.nih.gov/35724381/\", \"note\": \"메디케어 파트 d 36억 달러 절감 추정의 원 논문이다.\"}, {\"title\": \"medicare could save billions buying generic drugs at mark cuban's prices (nbc news)\", \"url\": \"https://www.nbcnews.com/health/health-news/medicare-drug-prices-us-billions-generics-buying-mark-cuban-prices-stu-rcna33949\", \"note\": \"위 논문의 89종 중 77종, 81억 달러 대 45억 달러라는 세부 수치를 확인했다.\"}, {\"title\": \"projected savings for generic oncology drugs purchased via mark cuban cost plus drug company versus in medicare (journal of clinical oncology)\", \"url\": \"https://pubmed.ncbi.nlm.nih.gov/37290029/\", \"note\": \"항암 제네릭 7종에서 6억 6,180만 달러(78.8%) 절감, 다만 3종은 절감 없음을 확인했다.\"}, {\"title\": \"drug pricing stewardship from mark cuban's cost plus generic drug program (pharmacoeconomics)\", \"url\": \"https://pubmed.ncbi.nlm.nih.gov/39167355/\", \"note\": \"90일분 기준 메디케어 파트 d 86억 달러 절감 추정을 확인했다.\"}, {\"title\": \"disrupting drug costs: the role of cost-plus pricing in reducing medicare spending on hypertension treatments (health services research)\", \"url\": \"https://pubmed.ncbi.nlm.nih.gov/40971147/\", \"note\": \"혈압약 87종 가운데 30알 기준 39종, 90알 기준 58종만 더 싸다는 결과를 확인했다.\"}, {\"title\": \"neurologic medication costs in a direct-to-consumer pharmacy vs commercial insurance plans (jama network open)\", \"url\": \"https://pubmed.ncbi.nlm.nih.gov/40828537/\", \"note\": \"보험 가입자 기준 본인 부담이 75% 높고 33종 중 2종만 더 싸다는 결과를 확인했다.\"}]}"},{"slug":"doctronic","name":"Doctronic","one_liner":"증상을 적으면 AI가 무료로 진단과 치료 계획을 내주고, 처방전이 필요해지는 순간에만 39달러짜리 면허 의사 화상 진료를 파는 소비자용 서비스다.","sells_to":"mixed","seen_in":[{"issue":"26","section":15,"headline":"AI가 진료 상담을 맡는 서비스가 12개월도 안 되어 세 번째 라운드로 4,000만 달러를 받았고, 필자는 공개 수치를 역산해 주간 방문자 30만 명 가운데 2%도 유료 진료로 넘어가지 않는다고 짚었다."}],"card":{"problem":"미국에서는 보험이 없거나 있어도 비용 때문에 진료를 미루는 사람이 많아서, 지금 겪는 증상이 병원에 갈 일인지 판단하는 단계부터 돈이 든다.","solution":"가입도 로그인도 없이 익명으로 증상을 물어보는 무료 AI 상담을 열어 두고 상담마다 진료 기록 형식의 문서를 만들어 주며, 처방전이나 검사 의뢰처럼 사람 의사가 필요해지는 순간에만 화상 진료를 유료로 판다.","price":"AI 상담은 횟수 제한 없이 무료이고, 면허 의사 화상 진료는 구독 없이 1회 39달러다. 보험이 있으면 본인부담금만 낸다.","tags":["AI 상담","원격진료","현금 결제","익명 이용","고용주 판매"],"headline_traction":"2026년 3월에 시리즈 B로 4,000만 달러를 받았다. 12개월이 안 되는 기간에 세 번째 라운드이며 누적 조달액은 6,500만 달러가 넘는다.","watch":"매출 15배 성장과 주간 방문자 30만 명 같은 성장 수치는 전부 회사가 스스로 낸 것이고 제삼자가 확인한 것이 아니다."},"screenshots":[{"file":"doctronic_home.png","caption":"첫 화면 가운데에 증상 입력창 하나만 놓여 있고, 그 아래에 무료이고 익명이며 의사들이 만들었다는 문구가 붙어 있다. 위쪽에는 39달러 방문당 결제와 모든 보험을 받는다는 안내가 함께 적혀 있다.","from":"https://www.doctronic.ai"},{"file":"doctronic_how.png","caption":"AI 의사가 어떻게 작동하는지 네 단계로 설명하는 페이지다. 무료 AI 상담에서 면허 의사 화상 진료로 넘어가는 지점이 어디인지, 대기 시간과 값이 얼마인지 보여 준다.","from":"https://www.doctronic.ai/how-your-ai-doctor-works/"},{"file":"doctronic_pricing.png","caption":"값 안내 페이지다. AI 상담은 영원히 0달러, 면허 의사 진료는 39달러 또는 보험 본인부담금, 기업은 직원 한 사람당 월정액으로 세 갈래를 나눠 놓았다.","from":"https://www.doctronic.ai/quality-care-in-seconds-pricing-that-makes-sense/"}],"q":"{\"slug\": \"doctronic\", \"name\": \"doctronic\", \"one_liner\": \"증상을 적으면 ai가 무료로 진단과 치료 계획을 내주고, 처방전이 필요해지는 순간에만 39달러짜리 면허 의사 화상 진료를 파는 소비자용 서비스다.\", \"site\": \"https://www.doctronic.ai\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"26\", \"section\": 15, \"headline\": \"ai가 진료 상담을 맡는 서비스가 12개월도 안 되어 세 번째 라운드로 4,000만 달러를 받았고, 필자는 공개 수치를 역산해 주간 방문자 30만 명 가운데 2%도 유료 진료로 넘어가지 않는다고 짚었다.\"}], \"card\": {\"problem\": \"미국에서는 보험이 없거나 있어도 비용 때문에 진료를 미루는 사람이 많아서, 지금 겪는 증상이 병원에 갈 일인지 판단하는 단계부터 돈이 든다.\", \"solution\": \"가입도 로그인도 없이 익명으로 증상을 물어보는 무료 ai 상담을 열어 두고 상담마다 진료 기록 형식의 문서를 만들어 주며, 처방전이나 검사 의뢰처럼 사람 의사가 필요해지는 순간에만 화상 진료를 유료로 판다.\", \"price\": \"ai 상담은 횟수 제한 없이 무료이고, 면허 의사 화상 진료는 구독 없이 1회 39달러다. 보험이 있으면 본인부담금만 낸다.\", \"tags\": [\"ai 상담\", \"원격진료\", \"현금 결제\", \"익명 이용\", \"고용주 판매\"], \"headline_traction\": \"2026년 3월에 시리즈 b로 4,000만 달러를 받았다. 12개월이 안 되는 기간에 세 번째 라운드이며 누적 조달액은 6,500만 달러가 넘는다.\", \"watch\": \"매출 15배 성장과 주간 방문자 30만 명 같은 성장 수치는 전부 회사가 스스로 낸 것이고 제삼자가 확인한 것이 아니다.\"}, \"problem\": \"한국은 전국민 건강보험이 있어서 아프면 동네 의원에 가면 되고 진료비 본인부담금도 몇천 원 수준이다. 미국은 그렇지 않다. kff 집계에 따르면 2024년 기준으로 65세 미만 인구 가운데 2,670만 명, 비율로는 9.8%가 건강보험이 없다. 무보험 성인의 38.6%는 비용 때문에 필요한 진료나 약을 미루거나 아예 받지 못했다고 답했고, 민간보험이 있는 성인도 17.0%가 같은 답을 했다. 그래서 미국 소비자에게는 진료를 받는 일 자체보다 앞서, 지금 겪는 증상이 병원에 갈 일인지 판단하는 단계부터가 돈이 드는 문제가 되며, 그 판단을 공짜로 대신해 주는 창구에 수요가 생긴다.\", \"solution\": \"사용자는 첫 화면 가운데에 있는 입력창에 증상을 적고 대화를 시작한다. 가입도 로그인도 필요 없고 익명으로 쓸 수 있으며, ai 상담 자체는 횟수 제한 없이 무료다. ai는 동료 심사를 거친 논문과 진료 지침을 근거로 가능한 진단 목록과 치료 선택지를 제시하고, 상담마다 soap 노트라는 진료 기록 형식의 문서를 만들어 준다. 회사는 이 문서를 다른 병원에 그대로 가져가서 쓰라고 안내한다. 처방전이나 검사 의뢰, 진단서가 필요해지는 순간에만 실제 면허 의사와의 화상 진료로 넘어가는데, 값은 1회 39달러이고 구독이 아니며 보험이 있으면 본인부담금만 낸다. 진료를 맡는 의사들은 본사와 분리된 별도 법인인 doctronic physicians group 소속이고, 회사는 50개 주 전체에서 진료가 가능하다고 밝히고 있다.\", \"features\": [{\"name\": \"무료 ai 상담\", \"detail\": \"가입과 로그인 없이 익명으로 증상을 물어볼 수 있고 횟수 제한이 없다. 회사는 값 안내 페이지에서 이 부분을 영원히 0달러라고 표기한다.\"}, {\"name\": \"무료 soap 노트\", \"detail\": \"상담이 끝날 때마다 진단과 치료 계획이 담긴 진료 기록 형식의 문서를 만들어 준다. 회사는 이 문서를 자기가 다니던 병원에 가져가면 진료가 더 빨라진다고 안내한다.\"}, {\"name\": \"39달러 원격진료\", \"detail\": \"면허 의사와의 화상 진료 1회 값이다. 처방전 발급, 검사 의뢰와 결과 해석, 전문의 의뢰, 진단서 발급이 이 값에 포함되며 별도로 더 받지 않는다고 적혀 있다.\"}, {\"name\": \"유타주 ai 처방 갱신\", \"detail\": \"이미 다른 의사가 처방한 약 191개 품목에 한해 ai가 30일, 60일, 90일 단위 갱신을 처리한다. 규제 약물과 adhd 약, 주사제는 대상에서 빠진다.\"}, {\"name\": \"glp-1 처방 관리 구독\", \"detail\": \"비만 치료제 처방을 매달 써 주고 필요할 때 의사 화상 진료와 영양사 상담을 붙여 주는 상품이다. 월 99달러와 199달러 두 가지가 있고 약값은 포함되지 않는다.\"}, {\"name\": \"checkup 컨시어지\", \"detail\": \"연 1회 건강검진 상품이다. 기본 혈액검사와 흔히 쓰는 약의 재처방이 포함되고, 1만 곳이 넘는 의료기관에서 의무기록을 모아 준다고 밝히고 있다.\"}, {\"name\": \"검색 유입용 건강 정보 페이지\", \"detail\": \"질환, 증상, 약, 검사, 비교 글로 사이트를 채워 검색에서 사람을 끌어들인다. 사이트맵을 직접 세어 보면 2만 4천 개가 넘고 그 가운데 블로그 글만 1만 2천 개가 넘는다.\"}, {\"name\": \"기업과 보험사 대상 판매\", \"detail\": \"고용주, 제3자 관리기관, 보험사, 병원을 상대로 직원 한 사람당 월정액을 받는 별도 판매선이 있다. 관련 소개 페이지가 사이트에 스무 개 넘게 있다.\"}], \"differentiator\": \"k health은 같은 발상에서 출발했지만 지금은 mass general brigham, mayo clinic, cedars-sinai 같은 병원을 통해 파는 쪽으로 방향을 틀어서, 환자는 이 서비스를 병원 이름으로 만난다. ada health와 buoy health는 증상을 확인해 주는 데까지만 하고 실제 진료는 다른 곳으로 넘기기 때문에, 무료 상담과 유료 진료를 한 회사 안에서 잇지 못한다. doctronic은 무료 ai 상담과 자체 의사망을 한 회사 안에 붙여 두고 39달러라는 현금가를 공개 웹에 그대로 걸어 둔 점이 다르지만, 여기까지는 결합 방식의 차이일 뿐이다. 진짜로 다른 한 가지는 유타주와 맺은 규제 완화 협약인데, 사람 의사를 거치지 않고 ai가 처방을 갱신하도록 주 정부가 승인한 첫 사례이며 위에 든 회사 가운데 이것을 가진 곳은 없다.\", \"team\": [{\"name\": \"matt pavelle\", \"role\": \"공동 창업자 겸 co-ceo\", \"background\": \"패션 이커머스 회사 moda operandi의 창립 cto를 지냈고 렌트 리워드 스타트업 piñata rent를 공동 창업했다.\"}, {\"name\": \"adam oskowitz\", \"role\": \"공동 창업자\", \"background\": \"ucsf 혈관외과 조교수로 지금도 진료하는 외과 의사다.\"}, {\"name\": \"byron crowe\", \"role\": \"최고의료책임자\", \"background\": \"solera health 최고의료책임자와 하버드 의과대학 교원을 지낸 내과 전문의이며 2025년 10월에 합류했다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"union square ventures가 주도한 시드로 500만 달러를 받았다.\", \"when\": \"2025\", \"source\": \"sacra와 fundz의 회사 정보. 1차 보도자료를 찾지 못해 정확한 발표일은 확인하지 못했다.\"}, {\"type\": \"funding\", \"detail\": \"lightspeed venture partners가 주도한 시리즈 a로 2,000만 달러를 받았다. union square ventures, tusk ventures, hf0가 참여했고 fei-fei li가 엔젤로 들어왔다.\", \"when\": \"2025-09\", \"source\": \"pr newswire 보도자료, lightspeed 투자 소개글\"}, {\"type\": \"funding\", \"detail\": \"abstract와 lightspeed가 공동 주도한 시리즈 b로 4,000만 달러를 받았다. 12개월이 안 되는 기간에 세 번째 라운드이며 누적 조달액은 6,500만 달러가 넘는다.\", \"when\": \"2026-03\", \"source\": \"business wire 보도자료, stat news\"}, {\"type\": \"regulatory\", \"detail\": \"유타주 상무부 인공지능정책국과 규제 완화 협약을 맺어, 이미 다른 의사가 처방한 약 191개 품목에 한해 ai가 처방 갱신을 처리하는 12개월 파일럿을 시작했다. 협약 조건으로 갱신 문서에 이름이 들어가는 면허 의사를 두어야 하고 ai 위험을 포함한 의료과실보험을 유지해야 한다.\", \"when\": \"2026-01\", \"source\": \"유타주 상무부 보도자료, fierce healthcare, deseret news\"}, {\"type\": \"regulatory\", \"detail\": \"유타주 의료면허위원회 위원 14명 가운데 11명이 이 파일럿을 즉시 중단하라는 서한을 보냈으나 주 상무부가 요청을 기각했고 파일럿은 계속되고 있다.\", \"when\": \"2026-04\", \"source\": \"kuer, utah news dispatch\"}, {\"type\": \"revenue\", \"detail\": \"시리즈 a를 마감한 뒤 6개월 안에 매출이 15배 늘어 연환산으로 8자리, 즉 1,000만 달러 이상이 되었다고 밝혔다.\", \"when\": \"2026-03\", \"source\": \"회사 보도자료(business wire). 제삼자가 확인한 수치가 아니다.\"}, {\"type\": \"traffic\", \"detail\": \"주간 순방문자가 30만 명이 넘는다고 밝혔다.\", \"when\": \"2026-03\", \"source\": \"회사 보도자료(business wire). 제삼자가 확인한 수치가 아니다.\"}, {\"type\": \"traffic\", \"detail\": \"사이트맵을 직접 세어 보면 검색 유입용 건강 정보 페이지가 2만 4천 개가 넘는다. 방문자 대부분이 진료를 사러 온 것이 아니라 검색으로 들어온 사람이라는 뜻이다.\", \"when\": \"2026-09\", \"source\": \"https://www.doctronic.ai/sitemap.xml 의 하위 사이트맵 19개를 직접 집계\"}, {\"type\": \"partnership\", \"detail\": \"병원, 제3자 관리기관, 자가보험 고용주와 공동 브랜드 제휴를 맺고 있다고 밝혔다.\", \"when\": \"2026-03\", \"source\": \"회사 보도자료를 옮긴 the ai insider 기사. 제휴처 이름은 공개되지 않았다.\"}], \"caveats\": \"성장 수치는 전부 회사가 낸 것이고 제삼자가 확인한 것이 아니다. 15배 성장, 주간 방문자 30만 명, 연환산 매출 1,000만 달러가 모두 여기에 해당한다. 뉴스레터 필자가 계산한 2% 미만이라는 전환율은 매출 전액이 39달러 진료에서 나온다고 가정한 역산인데, 실제로는 월 99달러와 199달러짜리 glp-1 구독과 기업 대상 매출이 섞여 있으므로 진료 건수는 더 적고 전환율은 더 낮아질 가능성이 크다. 회사가 재방문 진료가 세 배 가까이 늘었다고 밝힌 점을 감안하면 월 21,000건이 21,000명을 뜻하지도 않는다. 회사가 내세우는 치료 계획 일치율 99.2%는 시리즈 a 발표 때 쓰던 수치가 그대로 다시 쓰인 것으로 보이며, 근거가 되는 연구는 회사 지분을 가진 사람들이 쓴 medrxiv 사전 공개 논문이고 대상도 기존 웹사이트 챗봇이다. 여기에 더해 펜실베이니아대학교의 eric bressman은 회사가 내놓은 검증 연구에서 원격진료 사례 500건을 놓고 ai와 사람 의사의 판단이 일치한 비율이 80%에 그쳤다고 지적했다. 99.2%와 80%가 모두 회사 쪽 자료에서 나온 수치이므로 어느 것을 인용하느냐에 따라 그림이 완전히 달라진다. 뉴스레터가 인용한 endpoints news의 체험기는 기자가 물리치료사 의뢰를 받으려고 39달러 진료를 직접 써 본 기록인데, 경험이 일관되지 않았고 matt pavelle 대표도 개선이 필요하다는 점을 인정했다고 매체가 정리했다. 보안업체 mindgard는 공개된 챗봇에 존재하지 않는 규제 공지를 만들어 넣어, 옥시콘틴 표준 용량의 세 배를 제시하게 만들었다고 발표했다. 회사와 유타주는 그것이 실제 환자 처방을 처리하는 운영 환경이 아니라고 반박했다. jama health forum은 유타주 협약이 회사에 환자 의무기록 보관과 제공 의무를 면제해 주고, 이용약관은 정확성과 그로 인한 피해에 대한 책임을 부인한다고 지적했다. 유타주 의료면허위원회 위원장 alan smith는 사망자가 나올 때까지 아무 조치도 취해지지 않을까 두렵다고 말했고, 미국의사협회도 처방 갱신이 단순히 확인만 하고 넘어갈 일이 아니라고 논평했다. forbes는 2026년 7월 기사에서 처방 결정의 72%를 ai가 스스로 처리했고 그 가운데 3%는 나중에 사람 의사가 뒤집었다고 전했는데, 본문을 직접 확인하지 못해 참고로만 둔다. 앱스토어 설명 맨 끝과 회사 소개 페이지 하단에는 doctronic이 ai 의사이지 면허 의사가 아니며 의료 행위를 하지 않고 의학적 조언을 제공하지 않는다는 문구가 붙어 있어, ai 의사라는 마케팅 표현과 어긋난다. 사이트 안에서도 표기가 갈린다. 진료비는 39달러와 40달러가 함께 쓰이고, 의사 연결 대기 시간은 30분 이내, 평균 15분, 평균 5분이 페이지마다 다르게 적혀 있다. 앱 평가 수가 매우 적어서(아이폰 23개, 구글 플레이 35개, 설치 1천 회 이상) 실제 사용은 앱이 아니라 웹에 몰려 있다고 보아야 한다.\", \"for_us\": \"가장 눈여겨볼 대목은 낮은 전환율이 아니라 그 분모다. 주간 30만 명이 ai에게 건강을 물어보려고 찾아오는데 그 가운데 2%도 유료 진료로 넘어가지 않는다면, 무료로 물어볼 창구에 대한 수요가 진료 수요보다 훨씬 크다는 뜻이다. 우리는 진료를 팔 이유가 없으므로 이 수요가 그대로 앱을 열 이유가 된다. 설계에서 가져올 것이 세 가지 있다. 첫째, 가입도 로그인도 요구하지 않고 익명으로 바로 물어보게 한 진입 방식이다. 둘째, 상담 결과를 soap 노트라는 문서로 만들어 주고 그것을 자기가 다니던 병원에 가져가라고 안내하는 방식인데, 답변의 역할을 정보 제공과 기록 정리로 묶어 두면 진단이나 처방으로 읽히지 않게 하면서도 사용자에게 손에 잡히는 결과물을 남길 수 있다. 셋째, 면책 문구를 앱 설명과 서비스 안에 명시적으로 붙여 둔 방식이다. 증상과 검진 수치, 복용 중인 약에 대해 물어보는 상담 창구는 3개월 안에 소프트웨어만으로 붙일 수 있고, 우리 앱에는 이미 검진 수치와 식단 기록이 있으므로 물어볼 재료도 갖춰져 있다. 다만 트래픽 엔진인 검색 유입용 2만 페이지는 앱에서 그대로 따라 할 수 없는 부분이고, 유타주 규제 협약이나 50개 주 의사망은 3개월과 소프트웨어 인력이라는 조건 밖에 있으므로 제외한다.\", \"screenshots\": [{\"file\": \"doctronic_home.png\", \"caption\": \"첫 화면 가운데에 증상 입력창 하나만 놓여 있고, 그 아래에 무료이고 익명이며 의사들이 만들었다는 문구가 붙어 있다. 위쪽에는 39달러 방문당 결제와 모든 보험을 받는다는 안내가 함께 적혀 있다.\", \"from\": \"https://www.doctronic.ai\"}, {\"file\": \"doctronic_how.png\", \"caption\": \"ai 의사가 어떻게 작동하는지 네 단계로 설명하는 페이지다. 무료 ai 상담에서 면허 의사 화상 진료로 넘어가는 지점이 어디인지, 대기 시간과 값이 얼마인지 보여 준다.\", \"from\": \"https://www.doctronic.ai/how-your-ai-doctor-works/\"}, {\"file\": \"doctronic_pricing.png\", \"caption\": \"값 안내 페이지다. ai 상담은 영원히 0달러, 면허 의사 진료는 39달러 또는 보험 본인부담금, 기업은 직원 한 사람당 월정액으로 세 갈래를 나눠 놓았다.\", \"from\": \"https://www.doctronic.ai/quality-care-in-seconds-pricing-that-makes-sense/\"}, {\"file\": \"doctronic_ios.png\", \"caption\": \"미국 아이폰 앱스토어 페이지다. 무료 앱이고 2025년 11월에 나왔으며 평점 4.4에 평가가 23개뿐이어서, 실제 사용이 앱이 아니라 웹에 몰려 있음을 보여 준다.\", \"from\": \"https://apps.apple.com/us/app/doctronic/id6753094320\"}], \"sources\": [{\"title\": \"doctronic 공식 사이트 첫 화면\", \"url\": \"https://www.doctronic.ai\", \"note\": \"무료와 익명 상담, 39달러 방문당 결제, 50개 주 진료 가능이라는 핵심 문구를 확인했다.\"}, {\"title\": \"quality care in seconds, pricing that makes sense\", \"url\": \"https://www.doctronic.ai/quality-care-in-seconds-pricing-that-makes-sense/\", \"note\": \"ai 상담 0달러, 의사 진료 39달러, 기업용 월정액이라는 세 갈래 값 구조를 확인했다.\"}, {\"title\": \"how your ai doctor works\", \"url\": \"https://www.doctronic.ai/how-your-ai-doctor-works/\", \"note\": \"증상 입력에서 의사 연결까지의 네 단계 흐름과 평균 대기 15분이라는 표기를 확인했다.\"}, {\"title\": \"doctronic resource center\", \"url\": \"https://www.doctronic.ai/resource-center/\", \"note\": \"무료와 유료의 경계, 진단서가 39달러 진료에 포함된다는 점, 로그인 없이 쓸 수 있다는 점을 확인했다.\"}, {\"title\": \"glp-1 처방 관리 값 안내\", \"url\": \"https://www.doctronic.ai/glp-99/\", \"note\": \"월 99달러 구독이며 약값은 포함되지 않는다는 문구를 확인했다. 199달러 상품도 같은 형식으로 따로 있다.\"}, {\"title\": \"doctronic physicians group\", \"url\": \"https://www.doctronicpg.com/\", \"note\": \"실제 진료를 맡는 의사들이 본사와 분리된 별도 법인 소속이며 50개 주에서 진료한다는 설명을 확인했다.\"}, {\"title\": \"doctronic 사이트맵\", \"url\": \"https://www.doctronic.ai/sitemap.xml\", \"note\": \"하위 사이트맵 19개를 직접 세어 검색 유입용 페이지가 2만 4천 개가 넘는다는 것을 확인했다.\"}, {\"title\": \"doctronic 아이폰 앱\", \"url\": \"https://apps.apple.com/us/app/doctronic/id6753094320\", \"note\": \"무료 soap 노트 제공, 평균 대기 5분, 평점 4.4에 평가 23개, 그리고 의료 행위를 하지 않는다는 면책 문구를 확인했다.\"}, {\"title\": \"doctronic 안드로이드 앱\", \"url\": \"https://play.google.com/store/apps/details?id=ai.doctronic.app\", \"note\": \"설치 1천 회 이상, 평점 4.2에 리뷰 35개, 본사 주소가 뉴욕이라는 것을 확인했다.\"}, {\"title\": \"doctronic raises $40m series b (business wire)\", \"url\": \"https://www.businesswire.com/news/home/20260324814372/en/doctronic-raises-$40m-series-b-following-breakthrough-as-first-ai-to-legally-renew-prescriptions-in-the-u.s.\", \"note\": \"시리즈 b 4,000만 달러, 주도 투자사, 15배 성장과 주간 방문자 30만 명이라는 회사 발표 수치를 확인했다.\"}, {\"title\": \"doctronic raises $40 million as race to apply ai in clinical care heats up (stat news)\", \"url\": \"https://www.statnews.com/2026/03/23/ai-doctor-startup-doctronic-raises-40-million/\", \"note\": \"누적 조달 6,500만 달러와 올해 매출 1,000만 달러 전망을 확인했다. 유료 구독 기사라 본문 일부만 열람했다.\"}, {\"title\": \"doctronic raises $20 million series a (pr newswire)\", \"url\": \"https://www.prnewswire.com/news-releases/doctronic-raises-20-million-series-a-to-bring-private-and-personalized-ai-doctor-to-the-masses-302556195.html\", \"note\": \"2025년 9월 시리즈 a 2,000만 달러와 참여 투자자 명단을 확인했다.\"}, {\"title\": \"investing in doctronic (lightspeed venture partners)\", \"url\": \"https://lsvp.com/stories/investing-in-doctronic-ai-healthcares-24-7-digital-doctor/\", \"note\": \"창업자 두 사람의 경력과 투자사의 판단 근거를 확인했다.\"}, {\"title\": \"doctronic ai appoints dr. byron crowe as chief medical officer\", \"url\": \"https://www.businesswire.com/news/home/20251015771722/en/doctronic-ai-appoints-dr.-byron-crowe-as-chief-medical-officer-to-lead-next-stage-of-clinical-innovation\", \"note\": \"최고의료책임자 임명과 이전 경력을 확인했다.\"}, {\"title\": \"utah and doctronic announce groundbreaking partnership for ai prescription medication renewals\", \"url\": \"https://commerce.utah.gov/2026/01/06/news-release-utah-and-doctronic-announce-groundbreaking-partnership-for-ai-prescription-medication-renewals/\", \"note\": \"유타주 규제 완화 협약의 공식 발표다. 직접 열람은 차단되어 검색 결과 요약과 다른 보도로 내용을 확인했다.\"}, {\"title\": \"utah tests ai for routine medication refills through regulatory relief program (fierce healthcare)\", \"url\": \"https://www.fiercehealthcare.com/ai-and-machine-learning/doctronic-partners-utah-ai-sandbox\", \"note\": \"규제 샌드박스의 범위와 제외 약물, 안전 장치를 확인했다.\"}, {\"title\": \"utah dismisses medical board call to halt its pioneering ai prescription program (kuer)\", \"url\": \"https://www.kuer.org/health/2026-04-28/utah-dismisses-medical-board-call-to-halt-its-pioneering-ai-prescription-program\", \"note\": \"의료면허위원회의 중단 요청과 주 정부의 기각, 1단계에서는 면허 의사가 모든 처방 결정을 검토한다는 해명을 확인했다.\"}, {\"title\": \"new tech, familiar problems (endpoints news)\", \"url\": \"https://endpoints.news/new-tech-familiar-problems/\", \"note\": \"뉴스레터가 인용한 ngai yeung 기자의 2026년 3월 26일 체험기다. 물리치료사 의뢰를 받으려고 39달러 진료를 써 봤으나 경험이 일관되지 않았고 대표도 개선 필요를 인정했다는 내용이다. 유료 구독 벽 때문에 도입부와 매체 요약만 확인했다.\"}, {\"title\": \"is ai ready to refill prescriptions? doctors are wary of utah's automated program (kuer)\", \"url\": \"https://www.kuer.org/health/2026-07-06/is-ai-ready-to-refill-prescriptions-doctors-are-wary-of-utahs-automated-program\", \"note\": \"유타주 의료면허위원장의 발언과, 회사 검증 연구에서 사람 의사와의 일치율이 500건 기준 80%였다는 펜실베이니아대학교 eric bressman의 지적을 확인했다.\"}, {\"title\": \"here are 3 ai companies betting they can replace doctors (forbes)\", \"url\": \"https://www.forbes.com/sites/jessepines/2026/07/24/here-are-3-ai-companies-betting-they-can-replace-doctors/\", \"note\": \"처방 결정의 72%를 ai가 자율로 처리했고 그중 3%를 사람 의사가 뒤집었다는 수치가 나온 기사다. 본문을 직접 열람하지 못해 참고용으로만 두었다.\"}, {\"title\": \"ai doctor doctronic raises $40m series b, but faces controversy (telecare aware)\", \"url\": \"https://telecareaware.com/ai-doctor-doctronic-raises-40m-series-b-but-faces-controversy-on-autonomous-rx-renewals-in-utah-and-effectiveness-claims/\", \"note\": \"임상 검증 방식에 대한 jama health forum의 지적과 책임 소재 문제를 확인했다.\"}, {\"title\": \"utah's new medical chatbot can be easily hacked to give dangerous medical advice (mindgard)\", \"url\": \"https://mindgard.ai/blog/doctronic-is-now-accepting-new-patients-and-unsafe-instructions\", \"note\": \"공개 챗봇을 조작해 옥시콘틴 용량을 세 배로 제시하게 만든 실험을 확인했다.\"}, {\"title\": \"the saga of utah's rx refill bot (medcity news)\", \"url\": \"https://medcitynews.com/2026/03/utah-prescription-medication-ai-doctronic-mindgard/\", \"note\": \"보안 실험이 운영 환경이 아닌 공개 챗봇 대상이었다는 회사와 주 정부의 반박을 확인했다.\"}, {\"title\": \"key facts about the uninsured population (kff)\", \"url\": \"https://www.kff.org/uninsured/fact-sheet/key-facts-about-the-uninsured-population/\", \"note\": \"2024년 기준 무보험 인구 2,670만 명과 비용 때문에 진료를 미룬 비율을 확인했다.\"}, {\"title\": \"k health 공식 사이트\", \"url\": \"https://khealth.com/\", \"note\": \"지금은 mass general brigham, mayo clinic, cedars-sinai 등 병원을 통해 판매하는 구조로 바뀌었음을 확인했다.\"}, {\"title\": \"buoy health 공식 사이트\", \"url\": \"https://www.buoyhealth.com/\", \"note\": \"무료 증상 확인 도구까지만 제공하고 진료는 다른 곳으로 넘긴다는 점을 확인했다.\"}]}"},{"slug":"emed","name":"eMed","one_liner":"고용주를 통해 직원에게 비만 치료제(GLP-1)를 공급하고, 중간에 그만두지 않도록 관리해 주는 회사다.","sells_to":"mixed","seen_in":[{"issue":"26","section":17,"headline":"장수 의료(롱제비티) 기관으로 소개된 eMed가 기업가치 20억 달러가 넘는 조건으로 2억 달러를 조달했고, 보험 중개 회사 Aon이 라운드를 주도했으며, 환자 순응도 90%를 상품의 근거로 내세웠다."}],"card":{"problem":"미국에서는 일하는 사람 대부분이 회사를 통해 건강보험에 들기 때문에, 비만 치료제(GLP-1)를 쓰는 직원이 늘면 그 비용이 곧바로 고용주의 지출로 잡힌다. 그런데 1년 안에 절반이 넘는 사람이 약을 끊기 때문에 고용주는 결과가 남지 않은 채 약값만 치르게 된다.","solution":"eMed는 고용주와 계약해 직원에게 집에서 하는 채혈 검사와 처방, 주 1회 체크인을 묶어 공급하고, 중간에 그만두지 않도록 관리하는 대가를 받는다. 직원의 체중 감량과 복약 지속이 목표에 못 미치면 받는 돈을 깎겠다고 내걸었다.","price":"고용주를 거치는 경로는 상품마다 직원이 내는 돈이 다르고, 개인이 직접 가입하면 최초 검사비 49달러에 월 회비 149.99달러와 약값 월 149.99달러가 따로 붙어 매달 300달러 정도가 든다.","tags":["비만 치료제","고용주 판매","자가 채혈","원격진료","복약 관리"],"headline_traction":"2026년 3월에 기업가치 20억 달러가 넘는 조건으로 시리즈 A 2억 달러를 조달했고, 보험 중개 회사 Aon이 라운드를 주도했다.","watch":"상품의 근거로 내세우는 순응도 90%는 원래 프로그램 잔류율을 다른 이름으로 바꿔 적은 것이며, 회사가 스스로 낸 수치이고 제삼자가 검증하지 않았다."},"screenshots":[{"file":"emed_home.png","caption":"첫 화면. 고용주용과 개인용 두 갈래로 나뉘어 있고, 내세우는 문구가 '시작하기 쉽고 계속하기는 더 쉽다'이다.","from":"https://www.emed.com"},{"file":"emed_claims.png","caption":"순응도 90%의 실제 표기. '10명 중 9명이 처방대로 따른다', '10명 중 9명이 6개월 넘게 프로그램에 남는다'로 적혀 있고 출처는 'eMed Population Health Data (2025)'라는 자사 데이터다.","from":"https://www.emed.com/download"},{"file":"emed_pricing.png","caption":"소비자가 직접 가입할 때의 값. 최초 검사비 49달러, 약값 월 149.99달러부터, 회비 월 149.99달러가 각각 따로 붙는다.","from":"https://www.emed.com/join/home"}],"q":"{\"slug\": \"emed\", \"name\": \"emed\", \"one_liner\": \"고용주를 통해 직원에게 비만 치료제(glp-1)를 공급하고, 중간에 그만두지 않도록 관리해 주는 회사다.\", \"site\": \"https://www.emed.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"26\", \"section\": 17, \"headline\": \"장수 의료(롱제비티) 기관으로 소개된 emed가 기업가치 20억 달러가 넘는 조건으로 2억 달러를 조달했고, 보험 중개 회사 aon이 라운드를 주도했으며, 환자 순응도 90%를 상품의 근거로 내세웠다.\"}], \"card\": {\"problem\": \"미국에서는 일하는 사람 대부분이 회사를 통해 건강보험에 들기 때문에, 비만 치료제(glp-1)를 쓰는 직원이 늘면 그 비용이 곧바로 고용주의 지출로 잡힌다. 그런데 1년 안에 절반이 넘는 사람이 약을 끊기 때문에 고용주는 결과가 남지 않은 채 약값만 치르게 된다.\", \"solution\": \"emed는 고용주와 계약해 직원에게 집에서 하는 채혈 검사와 처방, 주 1회 체크인을 묶어 공급하고, 중간에 그만두지 않도록 관리하는 대가를 받는다. 직원의 체중 감량과 복약 지속이 목표에 못 미치면 받는 돈을 깎겠다고 내걸었다.\", \"price\": \"고용주를 거치는 경로는 상품마다 직원이 내는 돈이 다르고, 개인이 직접 가입하면 최초 검사비 49달러에 월 회비 149.99달러와 약값 월 149.99달러가 따로 붙어 매달 300달러 정도가 든다.\", \"tags\": [\"비만 치료제\", \"고용주 판매\", \"자가 채혈\", \"원격진료\", \"복약 관리\"], \"headline_traction\": \"2026년 3월에 기업가치 20억 달러가 넘는 조건으로 시리즈 a 2억 달러를 조달했고, 보험 중개 회사 aon이 라운드를 주도했다.\", \"watch\": \"상품의 근거로 내세우는 순응도 90%는 원래 프로그램 잔류율을 다른 이름으로 바꿔 적은 것이며, 회사가 스스로 낸 수치이고 제삼자가 검증하지 않았다.\"}, \"problem\": \"미국에서는 일하는 사람 대부분이 회사를 통해 건강보험에 든다. 폭스비즈니스 보도에 따르면 미국인의 60% 이상이 직장을 통해 의료 혜택을 받는다. 그래서 비싼 약을 쓰는 직원이 늘면 그 비용이 곧바로 고용주의 지출로 잡힌다. glp-1 계열 비만 치료제는 체중을 뺀 뒤에도 계속 써야 하는 약이라, 한 번 쓰기 시작하면 회사가 해마다 떠안는 고정 항목이 된다. 더 곤란한 대목은 돈을 낸 만큼 결과가 남지 않는다는 점이다. 과체중이거나 비만인 성인 12만 5,474명의 실사용 기록을 본 연구(jama network open, 2025년 1월)에서는 1년 안에 53.6%가 약을 끊었고, 당뇨가 없는 사람만 따로 보면 64.8%가 끊었다. 2년으로 늘리면 당뇨가 없는 사람의 84.4%가 끊었다. 중간에 그만두면 빠진 체중이 대체로 되돌아오므로 고용주는 결과 없이 약값만 치른 셈이 된다. 실제로 아직 절반이 넘는 고용주가 이 약을 보장 항목에 넣지 않았다. mercer 조사에 따르면 직원 500명 이상 고용주 가운데 체중 감량 약을 보장하는 곳은 2024년 기준 44%다. 한국은 전국민 건강보험이 있고 비만 치료제는 급여 대상이 아니어서 개인이 자기 돈으로 사기 때문에, 이 부담이 회사의 문제로 넘어오지 않는다.\", \"solution\": \"고용주가 계약하면 직원은 emed 앱으로 등록한다. 집으로 채혈 키트가 배송되고, 직원이 스스로 피를 뽑아 보내면 당화혈색소, 크레아티닌, 고감도 crp, 감마지티피, 지질 검사, 비타민 b12 여섯 가지를 측정한다. 그 결과를 계약 의료진이 검토해 약을 쓸 수 있는지 판정하고 처방까지 내린다. 약은 위고비 주사와 위고비 알약, 젭바운드처럼 fda 허가를 받은 정품만 쓰며, 약국 급여를 중개하는 사업자(pbm)를 거치지 않고 직접 조달하기 때문에 중간 마진이 붙지 않는다고 밝힌다. 처방 뒤에는 주 1회 체크인, 월 1회 진료 상담, 부작용에 대비한 상비약 꾸러미, 6개월과 12개월 시점의 재검사가 이어진다. 고용주에게는 직원의 체중 감량과 복약 지속을 보증하고 목표에 못 미치면 받는 돈을 깎겠다고 내걸었다. 소비자가 직접 가입하는 상품도 따로 있는데, 최초 검사비 49달러를 한 번 내고 월 회비 149.99달러를 내며, 약값은 월 149.99달러부터 별도로 붙는다. 셋을 합치면 첫 달에 350달러 가까이 들고 그 뒤로도 매달 300달러가 나간다. 보험은 받지 않는다.\", \"features\": [{\"name\": \"가정용 채혈 스크리닝 키트\", \"detail\": \"집으로 배송된 키트로 직접 피를 뽑아 여섯 가지 지표를 검사하고, 그 결과가 나와야 약을 처방받을 수 있다. 다른 병원에서 받은 검사지는 받아 주지 않는다.\"}, {\"name\": \"주 1회 체크인\", \"detail\": \"앱에서 1분이 채 걸리지 않는 문답으로 체중과 상태를 기록한다. 예약이 필요 없고 언제든 할 수 있다.\"}, {\"name\": \"부작용 대응 상비약 꾸러미\", \"detail\": \"메스꺼움처럼 흔한 부작용에 쓸 일반의약품을 프로그램에 포함해 함께 보낸다. 부작용 때문에 그만두는 일을 줄이려는 장치다.\"}, {\"name\": \"pbm을 거치지 않는 약 직접 조달\", \"detail\": \"약국 급여를 중개하는 사업자를 빼고 직접 조달하는 경로로 정품 약을 들여온다고 밝힌다. 고용주에게는 리베이트로 부풀려진 가격이 아니라 정해진 값을 제시한다.\"}, {\"name\": \"성과 보증 계약\", \"detail\": \"직원의 체중 감량과 복약 지속을 보증하고 목표에 미달하면 고용주가 내는 돈을 깎아 준다. 2026년 3월 조달과 함께 인두제 방식(가입자 1인당 정액 계약)도 새로 내놓겠다고 밝혔다.\"}, {\"name\": \"회사 부담이 없는 자율 가입형 상품\", \"detail\": \"고용주가 계약서에 서명만 하면 회사 비용은 0달러이고, 직원이 할인 코드를 받아 월 149.99달러에 약을 사는 방식이다. 기존 약국 급여 계약을 바꾸지 않아도 된다.\"}, {\"name\": \"의료 종사자 전용 요금제\", \"detail\": \"병원과 요양 시설 종사자를 겨냥한 별도 상품이다. 고용주가 대상자 1인당 월 25달러를 내고, 직원이 약값과 임상 지원 명목으로 월 99달러를 낸다.\"}, {\"name\": \"생활 습관 지원 연계\", \"detail\": \"thrive global과 손잡고 행동 변화와 생활 습관 지도를 프로그램에 붙였다.\"}], \"differentiator\": \"판매 경로에서 갈린다. emed는 소비자 광고가 아니라 보험 중개 회사 aon, 복리후생 운영 회사 alight, 약국 급여 사업자 cvs health를 통해 고용주에게 들어간다. hims & hers나 ro처럼 소비자에게 직접 팔아 성장한 원격진료 회사와는 들어가는 경로 자체가 다르다. 약을 다루는 방식도 다르다. 약사가 자체 조제한 복제 성분(컴파운딩 세마글루타이드)을 쓰지 않고 fda 허가를 받은 정품만 쓴다고 못 박는데, 2026년 초 fda가 조제 glp-1을 광고한 원격진료 회사 30곳에 경고장을 보냈을 때 emed가 명단에 없었던 것도 이 선택과 맞물린다. 성과를 보증하고 못 지키면 대금을 깎겠다는 계약도 흔치 않다. 다만 '순응도 90%'라는 주장 자체는 이 분야에서 특별하지 않다. omada는 12주 94%와 24주 84%를, hims & hers는 6개월 75%를 내걸고, noom은 구독 유지 기간을 순응도처럼 제시한다. 셋 다 검증받은 수치가 아니고 셋 다 분모가 유리하게 잡혀 있다. omada는 스스로 glp-1을 쓴다고 밝히고 관리 프로그램에 등록한 사람만 셌고, hims & hers는 6개월 시점 설문에 응답한 사람만 셌다. emed는 그 분모를 아예 밝히지 않았다.\", \"team\": [{\"name\": \"dr. patrice a. harris\", \"role\": \"공동창업자, emed, llc(모회사) 전 ceo\", \"background\": \"미국의사협회(ama) 174대 회장을 지낸 정신과 의사이며, 흑인 여성으로는 처음으로 그 자리에 올랐다. 2020년 emed를 공동창업했다. 2026년 8월 nemours children's health로 옮겼다.\"}, {\"name\": \"linda yaccarino\", \"role\": \"emed population health ceo\", \"background\": \"x(옛 트위터)의 ceo를 지냈고, x를 떠난 지 몇 주 만인 2025년 8월 5일 emed에 왔다. 다만 그가 맡은 곳은 창업자 harris가 이끌던 모회사가 아니라 glp-1 사업을 하는 자회사다.\"}, {\"name\": \"tom brady\", \"role\": \"founding chief wellness officer\", \"background\": \"슈퍼볼 7회 우승 미식축구 선수 출신이다. 2026년 1월 12일 최고 웰니스 책임자로 선임됐고 3월 조달 라운드에도 투자자로 참여했다.\"}, {\"name\": \"dr. dyan hes\", \"role\": \"chief medical officer\", \"background\": \"소아과 전문의이자 미국비만의학회 인증 의사로 비만 의학과 소아과에서 25년 넘게 일했다. 뉴욕에서 gramercy pediatrics를 세웠고 지금은 highline modern medicine의 의료 원장이다. 2025년 9월 30일 선임됐다.\"}, {\"name\": \"michael ferro jr.\", \"role\": \"영국 지주회사의 실질 지배자로 등기된 인물\", \"background\": \"merge healthcare를 세우고 tribune publishing(옛 tronc) 회장을 지낸 사업가다. 영국 기업등기소에 emed healthcare group holdings의 '중대한 지배력을 가진 자'로 2023년 8월 등록돼 있고, 연락처는 마이애미의 emed 본사로 적혀 있다. 그런데 emed 웹사이트의 경영진 명단에는 이 사람도, 같은 소송에서 최고 경영 책임자(executive chairman)로 지목된 justin dearborn도 나오지 않는다.\"}, {\"name\": \"eric larsen\", \"role\": \"회사 소개 페이지의 팀 명단에 오른 인물\", \"background\": \"unitedhealth group에서 부사장(evp)을 지냈다.\"}, {\"name\": \"david moore\", \"role\": \"회사 소개 페이지의 팀 명단에 오른 인물\", \"background\": \"novo nordisk에서 부사장(evp)을 지냈다. novo nordisk는 위고비를 만든 제약사다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"기업가치 20억 달러가 넘는 조건으로 시리즈 a 2억 달러를 조달했다. 보험 중개 회사 aon이 주도했고 tom brady, joe lonsdale, antonio gracias, tom ricketts, jeff aronin, ara cohen, r.j. melman, linda yaccarino가 참여했다. 돈은 인공지능 플랫폼 개발과 인두제 계약을 감당할 자기자본에 쓴다고 밝혔다.\", \"when\": \"2026-03\", \"source\": \"pr newswire 보도자료\"}, {\"type\": \"funding\", \"detail\": \"aon이 emed에 전략적 투자를 하고 자사 고용주 고객에게 emed를 공급하기로 했다. 투자 금액은 공개되지 않았다.\", \"when\": \"2025-08\", \"source\": \"pr newswire 보도자료\"}, {\"type\": \"regulatory\", \"detail\": \"abbott의 binaxnow 가정용 코로나 검사가 fda 긴급사용승인을 받았다. 화상으로 사람이 지켜보며 진행하는 첫 가정용 신속 검사였고, 그 화상 감독 플랫폼이 emed의 것이었다. 2021년 1월 23일 개당 25달러로 판매를 시작했다.\", \"when\": \"2020-12\", \"source\": \"abbott 보도자료, emed 보도자료\"}, {\"type\": \"customers\", \"detail\": \"코로나 시기에 오하이오주, 콜로라도주, 버지니아주, 매사추세츠주와 검사 키트 공급 계약을 맺었고 united airlines, american airlines, delta, procter & gamble, quest diagnostics와도 손잡았다. 2023년에는 미국 국립보건원(nih)의 '집에서 검사하고 바로 치료받기' 시범 사업에서 원격진료를 맡았다. 회사는 누적 이용자를 600만 명 이상이라고 밝힌다.\", \"when\": \"2021\", \"source\": \"emed 및 파트너사 보도자료\"}, {\"type\": \"customers\", \"detail\": \"영국 babylon health의 사업을 법정관리 절차에서 인수했다. nhs 환자를 보는 디지털 1차 진료 기관 gp at hand가 여기 포함된다. 인수 대금은 현금 679만 파운드였다. 널리 인용되는 '50만 파운드'는 잔여 지분 값일 뿐이다. 인수한 사업은 2024년 한 해 4,290만 파운드의 매출을 냈다.\", \"when\": \"2023-10\", \"source\": \"emed 보도자료, 영국 기업등기소 감사보고서\"}, {\"type\": \"customers\", \"detail\": \"나스닥 상장사 science 37 holdings를 주당 5.75달러, 약 3,800만 달러에 공개매수로 인수하고 상장을 폐지했다.\", \"when\": \"2024-03\", \"source\": \"미국 증권거래위원회(sec) 제출 서류\"}, {\"type\": \"revenue\", \"detail\": \"영국 법인의 감사보고서상 2024년 매출은 5,140만 파운드, 세후 손실은 2,040만 파운드였고 직원은 326명이었다. 미국 쪽 매출과 인원은 비상장이라 공개된 자료가 없다.\", \"when\": \"2024-12\", \"source\": \"영국 기업등기소 제출 서류\"}, {\"type\": \"partnership\", \"detail\": \"미국 최대 약국 급여 사업자 cvs health와 손잡고 고용주가 비용을 통제하며 glp-1을 제공할 수 있는 경로를 만들었다.\", \"when\": \"2026-02\", \"source\": \"emed 뉴스 페이지가 인용한 axios 보도\"}, {\"type\": \"partnership\", \"detail\": \"복리후생 운영 회사 alight, 그리고 crux와 제휴해 고용주 대상 glp-1 공급을 넓히기로 했다.\", \"when\": \"2026-08\", \"source\": \"business wire 보도자료\"}], \"caveats\": \"이 회사에서 가장 중요한 수치인
