다. 창구에서 값을 부를 때까지 얼마인지 알 수 없다는 점이 문제의 핵심이며, 그래서 값이 무서워 처방을 받고도 약을 타지 않는 사람이 생긴다. 한국은 건강보험이 전 국민에게 적용되고 약값도 전국이 같아서 이런 문제 자체가 성립하지 않는다. goodrx는 이 값의 차이와 불투명함이 만든 자리에서 사업을 한다.\", \"solution\": \"소비자는 앱이나 웹에서 약 이름과 있는 곳을 넣는다. 그러면 근처 약국별로 goodrx가 받아 온 할인가가 나란히 나오고, 가장 싼 곳을 골라 코드를 저장한다. 회원 가입도, 결제도 필요 없다. 그 코드를 약국 창구에서 보여 주면 보험 대신 그 값으로 계산된다. 회사 설명에 따르면 한 번 쓴 코드는 그 약국 전산에 남기 때문에, 다음 조제부터는 다시 보여 주지 않아도 같은 할인이 이어진다. 소비자가 goodrx에 내는 돈은 없고, 대신 그 거래를 처리한 약값 협상 대행사가 받은 몫에서 일정 비율이나 정액을 goodrx가 받는다. 약국과 직접 계약한 경우에는 약국이, 브랜드 약의 현금가를 낮추는 프로그램은 제약사가 비용을 낸다. 더 싼 값과 부가 혜택을 원하는 사람을 위한 유료 회원제 goodrx companion이 따로 있는데, 개인은 월 14.99달러 또는 연 119.88달러이고 가족용은 월 24.99달러 또는 연 203.88달러다. 온라인 진료도 붙어 있어서, 체중 감량 진료는 월 39달러, 회원이 받는 일반 온라인 진료는 1회 19달러로 안내한다.\", \"features\": [{\"name\": \"약국별 가격 비교와 무료 코드\", \"detail\": \"약 이름과 위치를 넣으면 근처 약국의 할인가를 한 화면에 비교해 주고, 코드를 저장해 창구에서 보여 주면 그 값에 살 수 있다. 회사는 하루 4,200억 건이 넘는 가격 데이터를 처리하며 미국에서 가장 큰 약값 통합 데이터베이스를 갖고 있다고 밝힌다. 앱 설명에는 7만 곳이 넘는 약국에서 쓸 수 있다고 적혀 있다.\"}, {\"name\": \"goodrx companion 유료 회원제\", \"detail\": \"250종이 넘는 약을 값 없이 받고 수백 종을 10달러 미만에 사며, 치과와 안과, 혈액 검사와 영상 촬영 할인, 1회 19달러 온라인 진료가 함께 붙는다. 본인 외 4명까지 넣을 수 있고 반려동물도 포함된다. 예전 이름은 goodrx gold였고, 지금은 옛 주소로 들어가도 이 페이지가 열린다.\"}, {\"name\": \"약국 창구 자동 적용\", \"detail\": \"2023년에 시작한 통합 절감 프로그램이다. 약값 협상 대행사와 제휴해, 보험 가입자가 평소 쓰던 보험 카드만 내밀어도 goodrx 할인가가 자동으로 적용된다. 소비자는 따로 할 일이 없다. 다만 이 프로그램은 대행사가 운영 방식을 정하기 때문에 goodrx가 통제하지 못한다.\"}, {\"name\": \"pharma direct(제약사 직접 가격)\", \"detail\": \"제약사가 브랜드 약의 현금가를 낮추거나 본인부담금을 대신 내 주는 프로그램을 goodrx 화면에 붙여 주고 제약사에서 비용을 받는다. 2025년에 41% 성장해 매출 1억 5,140만 달러가 됐고, 2026년 2분기에는 1년 전보다 76% 늘었다. 2026년 2월 미국 정부가 연 직접 판매 사이트 trumprx.gov에서도 제약사 현금가를 붙이는 핵심 연동 파트너라고 회사가 밝힌다.\"}, {\"name\": \"질환별 구독과 온라인 진료(goodrx care)\", \"detail\": \"2025년 6월부터 발기부전, 탈모, 체중 감량 같은 질환별 구독을 시작했다. 진료와 약, 배송을 하나의 구독 가격으로 묶어 판다. 체중 감량은 월 39달러 온라인 진료와 함께 foundayo 149달러부터, wegovy 149달러부터, zepbound 299달러부터로 안내한다.\"}, {\"name\": \"복약 관리와 반려동물 약\", \"detail\": \"앱에는 복약 알림과 약 목록 관리 기능이 있고, 반려동물 약 할인도 제공한다. 아이폰 앱은 평가 70만 건에 평점 4.8이고, 안드로이드 앱은 내려받기 1,000만 회를 넘었다.\"}], \"differentiator\": \"같은 방식의 쿠폰 서비스로 singlecare와 rxsaver, buzzrx가 있고, 약값 협상 대행사에게서 받아 온 할인가를 코드로 보여 준다는 구조는 모두 같다. 실제 차이는 규모다. 2026년 9월 미국 앱스토어 기준으로 평가 건수가 goodrx는 70만 건인 데 비해 singlecare는 2.7만 건, rxsaver는 2.4만 건, buzzrx는 0.4만 건이다. 여러 대행사의 가격을 한 화면에서 비교한다는 점, 그리고 2025년 이후 제약사가 비용을 내는 브랜드 약 현금가와 질환별 구독으로 수익의 축을 옮긴 점이 goodrx가 내세우는 차이다. 다만 쿠폰 자체만 놓고 보면 경쟁사도 같은 대행사의 가격을 받아 오기 때문에 크게 다르지 않다.\", \"team\": [{\"name\": \"wendy barnes\", \"role\": \"최고경영자 겸 사장\", \"background\": \"2024년 12월에 선임돼 2025년 1월 1일부터 일하고 있다. 그 전에는 약제비 관리 회사 rxbenefits의 최고경영자였고, 2013년부터 2022년까지 약값 협상 대행사 express scripts에서 일하며 2019년 8월부터 2022년 4월까지 사장을 맡았다.\"}, {\"name\": \"douglas hirsch\", \"role\": \"공동창업자, 이사\", \"background\": \"2011년 9월 창업 때부터 이사이며 2023년 4월까지 공동 최고경영자였다. 창업 전에는 온라인 환자 모임 서비스 dailystrength의 최고경영자였고, 그 전에는 facebook과 yahoo에서 일했다.\"}, {\"name\": \"trevor bezdek\", \"role\": \"공동창업자, 공동 이사회 의장\", \"background\": \"2011년 9월 창업 때부터 이사이며 2015년 1월부터 2023년 4월까지 공동 최고경영자였다. 창업 전에는 정보기술 컨설팅 회사 tryarc의 대표였다.\"}, {\"name\": \"christopher mcginnis\", \"role\": \"최고재무책임자 겸 재무담당\", \"background\": \"2026년 2분기 실적 발표 자료에서 justin fengler가 차기 최고재무책임자로 소개됐으므로, 재무 책임자 교체가 진행 중이다.\"}], \"traction\": [{\"type\": \"revenue\", \"detail\": \"2025년 매출 7억 9,690만 달러로 1년 전보다 1% 늘었고, 조정 ebitda는 2억 7,050만 달러, 순이익은 3,040만 달러였다.\", \"when\": \"2026-02\", \"source\": \"sec 제출 8-k 부속서류(2025년 4분기·연간 실적 보도자료)\"}, {\"type\": \"revenue\", \"detail\": \"제약사가 비용을 내는 pharma direct 매출이 2025년에 41% 늘어 1억 5,140만 달러가 됐다. 반면 핵심인 처방 거래 매출은 6% 줄어 5억 4,400만 달러였다.\", \"when\": \"2026-02\", \"source\": \"sec 제출 8-k 부속서류, 10-k\"}, {\"type\": \"revenue\", \"detail\": \"2026년 연간 매출 가이던스를 2월에 7억 5,000만~7억 8,000만 달러(1년 전보다 6% 감소에서 2% 감소)로 제시했다가, 5월에 7억 6,500만~7억 8,500만 달러로, 8월에 7억 9,000만~8억 500만 달러로 두 차례 올렸다.\", \"when\": \"2026-08\", \"source\": \"sec 제출 8-k 부속서류(2026년 1분기·2분기 실적 보도자료)\"}, {\"type\": \"customers\", \"detail\": \"연간 약 2,500만 명의 소비자와 100만 명이 넘는 의료 전문가가 쓴다고 회사가 밝혔다. 2011년 이후 미국인이 1,000억 달러 넘게 아꼈다는 것도 회사 자체 집계다.\", \"when\": \"2026-02\", \"source\": \"goodrx 실적 보도자료\"}, {\"type\": \"traffic\", \"detail\": \"미국 아이폰 앱스토어에서 평점 4.8에 평가 70만 1,118건이고 의료 분야 순위 12위이며, 구글 플레이에서는 내려받기 1,000만 회 이상에 리뷰 33.6만 건이다.\", \"when\": \"2026-09\", \"source\": \"애플 앱스토어 조회 api, 구글 플레이 페이지\"}, {\"type\": \"partnership\", \"detail\": \"2026년 2월 미국 정부가 연 직접 판매 사이트 trumprx.gov에서, 제약사가 내놓는 현금 할인가를 붙이는 핵심 연동 파트너라고 회사가 10-k에 적었다.\", \"when\": \"2026-02\", \"source\": \"goodrx 10-k\"}, {\"type\": \"regulatory\", \"detail\": \"2023년 2월 미국 연방거래위원회가 건강 정보를 광고 목적으로 facebook과 google 등에 넘긴 문제로 150만 달러 과징금과 시정명령을 부과했다. 건강정보 유출 통지 규정을 적용한 첫 집행 사례였고, goodrx는 지금도 그 명령의 적용을 받는다.\", \"when\": \"2023-02\", \"source\": \"미국 연방거래위원회 보도자료, goodrx 10-k\"}, {\"type\": \"funding\", \"detail\": \"2020년 9월 나스닥에 gdrx로 상장했다.\", \"when\": \"2020-09\", \"source\": \"goodrx 10-k\"}], \"caveats\": \"수치의 성격을 나눠 볼 필요가 있다. 매출과 순이익, 부문별 매출은 미국 증권거래위원회에 낸 연차보고서에 담긴 감사받은 숫자다. 반면 조정 ebitda와 조정 순이익은 회계 기준 밖의 자체 계산이며, 회사도 그렇게 밝히고 있다. 월간 이용자 수와 구독 건수, 연간 2,500만 명, 1,000억 달러 절감 같은 숫자는 회사 내부 집계이고 제삼자가 검증하지 않았다고 10-k에 스스로 적어 두었다. 뉴스레터가 전한 주가 18% 하락은 실제 종가로 확인된다. 2026년 2월 25일 종가 2.45달러에서 다음 날 1.99달러로 18.8% 떨어졌다. 2020년 9월 상장 직후 월간 고가는 64.22달러였고 2026년 9월 10일 종가는 3.34달러다. 성장이 꺾인 이유는 회사가 밝힌 대로 두 가지다. 하나는 약국 폐점이다. 2025년 5월 rite aid가 자산 대부분을 매각하는 파산 절차를 밟으면서 약값 협상 대행사들이 rite aid를 취급 약국에서 빼 청구가 즉시 끊겼고, 회사는 2026년 매출에도 계속 영향이 있을 것이라고 밝혔다. 다른 하나는 약국 창구 자동 적용 프로그램 가운데 한 곳에서 물량이 크게 줄어든 것이다. 두 가지를 합친 2025년 매출 영향만 3,500만~4,000만 달러로 회사가 추산했다. 월간 이용자는 2024년 4분기 660만 명에서 2025년 4분기 530만 명으로 줄었고, 구독 건수도 68만 4,000건에서 67만 4,000건으로 줄었다. 마지막으로 시점 문제가 있다. 뉴스레터가 다룬 2026년 2월 가이던스는 이후 5월과 8월에 두 번 올라갔으므로, 2월 시점의 숫자만 인용해 지금을 말하면 사실과 어긋난다.\", \"for_us\": \"우리가 3개월 동안 소프트웨어만으로 미국인에게 건강 가치를 주려 한다는 목적에 비추면 세 가지가 눈에 띈다. 첫째, 약값은 미국인이 매달 실제로 겪는 통증이고 앱 화면만으로 돈을 아껴 줄 수 있는 몇 안 되는 영역이다. goodrx는 약을 팔지 않고 기존 약국으로 보내기만 하므로, 재고도 면허도 없이 소프트웨어로 성립한다는 점을 증명한다. 둘째, 그러나 단순 가격 비교로 새로 들어갈 자리는 남아 있지 않다. 2026년 2분기에 쿠폰에서 나오는 처방 거래 매출은 1년 전보다 26% 줄었고, 늘어난 것은 제약사가 비용을 내는 pharma direct(76% 증가)와 질환별 구독(39% 증가)이었다. 값을 비교해 주는 일 자체가 아니라 누가 비용을 내는가가 사업을 가른다. 셋째, goodrx companion이 약에서 그치지 않고 치과와 안과, 혈액 검사, 영상 촬영 할인까지 월 9.99달러 회원제로 묶은 방향은 참고할 만하다. 우리 앱이 이미 현금 리워드를 갖고 있으므로, 미국 이용자에게 절감 가능 금액을 보여 주는 방식은 리워드와 성질이 비슷하면서도 다른 가치가 된다. 다만 위험도 같이 봐야 한다. goodrx는 건강 정보를 광고 목적으로 넘긴 문제로 2023년에 연방거래위원회 제재를 받았고 지금도 시정명령을 받고 있다. 광고 소프트웨어를 붙인 앱이 미국에서 건강 데이터를 다룰 때 무엇이 문제가 되는지 보여 주는 가장 가까운 사례다.\", \"screenshots\": [{\"file\": \"goodrx_home.png\", \"caption\": \"첫 화면. 약 이름을 넣는 검색창 아래에 glp-1 체중 감량 약 값과 월 9.99달러 회원제 안내가 함께 놓여 있어, 무료 쿠폰 회사에서 유료 구독과 브랜드 약 판매로 무게가 옮겨간 것이 드러난다.\", \"from\": \"https://www.goodrx.com/\"}, {\"file\": \"goodrx_companion.png\", \"caption\": \"유료 회원제 goodrx companion 안내. 250종이 넘는 무료 약과 치과, 안과, 검사, 영상 할인을 묶어 개인 월 9.99달러, 가족 월 16.99달러(연납 기준)로 판다.\", \"from\": \"https://www.goodrx.com/companion\"}, {\"file\": \"goodrx_ios.png\", \"caption\": \"미국 아이폰 앱스토어 페이지. 평점 4.8에 평가 70만 건, 의료 분야 12위이며 7만 곳이 넘는 약국에서 최대 80% 아낀다고 안내한다.\", \"from\": \"https://apps.apple.com/us/app/goodrx-prescription-savings/id485357017\"}], \"sources\": [{\"title\": \"goodrx 2025년 4분기·연간 실적 보도자료(sec 8-k 부속서류 99.1)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1809519/000180951926000028/gdrxq425-exx991pressrelease.htm\", \"note\": \"2025년 매출 7억 9,690만 달러, 부문별 매출, 2026년 가이던스 7억 5,000만~7억 8,000만 달러를 확인했다.\"}, {\"title\": \"goodrx 2025년 연차보고서(10-k)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1809519/000180951926000031/gdrx-20251231.htm\", \"note\": \"수익 구조, 월간 이용자 추이, rite aid 파산과 창구 자동 적용 프로그램 축소의 영향, trumprx 연동, 연방거래위원회 명령을 확인했다.\"}, {\"title\": \"goodrx 2026년 2분기 실적 보도자료\", \"url\": \"https://www.sec.gov/archives/edgar/data/1809519/000180951926000151/gdrxq226-exx991pressrelease.htm\", \"note\": \"처방 거래 매출 26% 감소, pharma direct 76% 증가, 구독 39% 증가, 가이던스 상향을 확인했다.\"}, {\"title\": \"goodrx 2026년 1분기 실적 보도자료\", \"url\": \"https://www.sec.gov/archives/edgar/data/1809519/000180951926000110/gdrxq126-exx991pressrelease.htm\", \"note\": \"5월 시점의 가이던스 상향과 pharma direct 82% 성장을 확인했다.\"}, {\"title\": \"goodrx 최고경영자 선임 공시(8-k)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1809519/000180951924000213/gdrx-20241212.htm\", \"note\": \"wendy barnes의 선임 시점과 이전 경력을 확인했다.\"}, {\"title\": \"goodrx 2026년 주주총회 소집 통지(def 14a)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1809519/000180951926000091/gdrx-20260429.htm\", \"note\": \"공동창업자 douglas hirsch와 trevor bezdek의 약력과 창업 시점을 확인했다.\"}, {\"title\": \"미국 연방거래위원회, goodrx 제재 보도자료\", \"url\": \"https://www.ftc.gov/news-events/news/press-releases/2023/02/ftc-enforcement-action-bar-goodrx-sharing-consumers-sensitive-health-info-advertising\", \"note\": \"2023년 2월 150만 달러 과징금과 시정명령의 내용을 확인했다.\"}, {\"title\": \"goodrx 첫 화면\", \"url\": \"https://www.goodrx.com/\", \"note\": \"현재 무엇을 앞세워 파는지, glp-1 값과 회원제 안내를 확인했다.\"}, {\"title\": \"goodrx companion 안내 페이지\", \"url\": \"https://www.goodrx.com/companion\", \"note\": \"개인 월 14.99달러와 연 119.88달러, 가족 월 24.99달러와 연 203.88달러, 1회 19달러 온라인 진료 같은 구체적인 값을 확인했다.\"}, {\"title\": \"미국 아이폰 앱스토어의 goodrx 앱\", \"url\": \"https://apps.apple.com/us/app/goodrx-prescription-savings/id485357017\", \"note\": \"평점과 평가 건수, 7만 곳이 넘는 약국이라는 안내, 경쟁 앱의 평가 건수를 확인했다.\"}, {\"title\": \"구글 플레이의 goodrx 앱\", \"url\": \"https://play.google.com/store/apps/details?id=com.goodrx\", \"note\": \"내려받기 1,000만 회 이상과 리뷰 33.6만 건을 확인했다.\"}, {\"title\": \"야후 파이낸스 gdrx 시세 자료\", \"url\": \"https://finance.yahoo.com/quote/gdrx/history/\", \"note\": \"2026년 2월 25일 종가 2.45달러에서 26일 1.99달러로 18.8% 하락한 사실과 상장 이후 주가 흐름을 확인했다.\"}]}"},{"slug":"hims-hers","name":"Hims & Hers","one_liner":"탈모와 발기부전, 체중 감량, 정신건강처럼 미국 보험이 잘 보장하지 않는 처방 진료를 앱과 웹의 문진만으로 받게 해 주고, 면허 의료인이 처방한 약을 집으로 보내 월 구독료를 받는 미국 상장 원격진료 회사다.","sells_to":"consumer","seen_in":[{"issue":"10","section":5,"headline":"정부 프로그램 시장이 지급률 동결로 두들겨 맞는 같은 주에, 보험을 거치지 않고 소비자가 직접 내는 쪽인 Ro와 Hims가 나란히 슈퍼볼 광고 세부 내용을 공개했다는 대비를 보여 주는 사례로 나왔다."}],"card":{"problem":"미국에서 탈모와 성기능, 체중 감량 같은 문제는 보험이 거의 보장하지 않아 환자가 값을 전액 부담하는데, 그런데도 처방을 받으려면 병원 예약을 잡고 대면 진료를 거쳐야 한다. 부끄러워서 병원을 찾지 않고 그냥 참는 사람도 많다.","solution":"앱이나 웹에서 문진표를 채우면 면허 의료인이 검토해 처방하고, 약이 집으로 배송된다. 진료비를 따로 청구하지 않고 약값과 관리비를 묶어 월 구독료로 받으며, 복용 중에는 앱 안에서 담당 의료인에게 메시지를 보낼 수 있다.","price":"남성 탈모 치료는 월 15달러부터, 발기부전 치료는 월 22달러부터, 정신건강 약은 월 49달러부터다. 체중 감량은 멤버십이 첫 달 39달러이고 이후 월 149달러로 자동 갱신되며, 약값은 여기에 더해 월 149달러부터 따로 붙는다.","tags":["원격진료","처방약 배송","월 구독","보험 미사용","GLP-1"],"headline_traction":"2025년 매출이 23억 5천만 달러로 전년보다 59퍼센트 늘었고, 2026년 6월 말 구독자는 289만 명이다.","watch":"2026년 7월에 미국 연방거래위원회가 건강정보 광고 공유와 해지 방해를 이유로 소송을 냈고, 8월에는 Visa가 결제 분쟁이 지나치게 많은 가맹점을 넣는 감시 프로그램에 이 회사를 올렸다."},"screenshots":[{"file":"hims-hers_news.png","caption":"회사 뉴스룸 첫 화면이다. 호주 진출 소식이 맨 위에 있고, 그 아래로 여성용 Hers 앱이 담당 의료인과 케어팀, AI를 한 대화창에 모은 화면이 보인다.","from":"https://news.hims.com/"},{"file":"hims-hers_ios.png","caption":"미국 애플 앱스토어의 남성용 Hims 앱 페이지다. 평점 4.8에 평가 9만 5천 건이고 의료 분야 순위 안에 든다. 아래 개인정보 항목에는 건강, 금융, 민감 정보가 이용자 신원과 연결돼 수집된다고 적혀 있다.","from":"https://apps.apple.com/us/app/hims-telehealth-for-men/id1455690574"},{"file":"hims-hers_android.png","caption":"구글 플레이의 같은 앱 페이지다. 내려받기 100만 건이 넘고 평점은 4.5인데, 화면 아래쪽 후기 목록에는 결제와 해지를 문제 삼는 이용자 불만과 그에 대한 회사 답변이 나란히 붙어 있다.","from":"https://play.google.com/store/apps/details?id=com.himshers.hims"}],"q":"{\"slug\": \"hims-hers\", \"name\": \"hims & hers\", \"one_liner\": \"탈모와 발기부전, 체중 감량, 정신건강처럼 미국 보험이 잘 보장하지 않는 처방 진료를 앱과 웹의 문진만으로 받게 해 주고, 면허 의료인이 처방한 약을 집으로 보내 월 구독료를 받는 미국 상장 원격진료 회사다.\", \"site\": \"https://www.hims.com\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"10\", \"section\": 5, \"headline\": \"정부 프로그램 시장이 지급률 동결로 두들겨 맞는 같은 주에, 보험을 거치지 않고 소비자가 직접 내는 쪽인 ro와 hims가 나란히 슈퍼볼 광고 세부 내용을 공개했다는 대비를 보여 주는 사례로 나왔다.\"}], \"card\": {\"problem\": \"미국에서 탈모와 성기능, 체중 감량 같은 문제는 보험이 거의 보장하지 않아 환자가 값을 전액 부담하는데, 그런데도 처방을 받으려면 병원 예약을 잡고 대면 진료를 거쳐야 한다. 부끄러워서 병원을 찾지 않고 그냥 참는 사람도 많다.\", \"solution\": \"앱이나 웹에서 문진표를 채우면 면허 의료인이 검토해 처방하고, 약이 집으로 배송된다. 진료비를 따로 청구하지 않고 약값과 관리비를 묶어 월 구독료로 받으며, 복용 중에는 앱 안에서 담당 의료인에게 메시지를 보낼 수 있다.\", \"price\": \"남성 탈모 치료는 월 15달러부터, 발기부전 치료는 월 22달러부터, 정신건강 약은 월 49달러부터다. 체중 감량은 멤버십이 첫 달 39달러이고 이후 월 149달러로 자동 갱신되며, 약값은 여기에 더해 월 149달러부터 따로 붙는다.\", \"tags\": [\"원격진료\", \"처방약 배송\", \"월 구독\", \"보험 미사용\", \"glp-1\"], \"headline_traction\": \"2025년 매출이 23억 5천만 달러로 전년보다 59퍼센트 늘었고, 2026년 6월 말 구독자는 289만 명이다.\", \"watch\": \"2026년 7월에 미국 연방거래위원회가 건강정보 광고 공유와 해지 방해를 이유로 소송을 냈고, 8월에는 visa가 결제 분쟁이 지나치게 많은 가맹점을 넣는 감시 프로그램에 이 회사를 올렸다.\"}, \"problem\": \"미국에서는 탈모약이나 발기부전 치료제, 체중 감량약처럼 당장 생명을 위협하지 않는 처방약을 보험이 거의 보장하지 않는다. 그래서 환자가 약값을 전부 낸다. 그런데도 이 약들은 처방전이 있어야만 살 수 있기 때문에, 값을 스스로 내는 사람조차 병원 예약을 잡고 대면 진료를 한 번 거쳐야 한다. 한국이라면 동네 의원에 걸어 들어가 건강보험이 적용된 진료비를 내고 끝날 일이, 미국에서는 예약을 잡고 기다리는 시간과 진료비를 따로 부담하는 일이 겹쳐 두 겹의 문턱이 된다. 여기에 수치심이 더해진다. 탈모와 성기능, 비만은 의사 앞에서 먼저 말을 꺼내기 어려운 주제여서, 문제를 알면서도 아무 조치를 하지 않고 지내는 사람이 많다. glp-1 계열 비만약이 퍼지면서 이 구조가 더 뚜렷해졌다. 보험이 비만약을 보장 목록에서 빼는 경우가 많아 한 달에 수백 달러를 현금으로 내야 하는데, 그 돈을 낼 뜻이 있는 사람에게도 처방을 받을 통로가 마땅치 않았다.\", \"solution\": \"이용자는 앱이나 웹에서 증상과 병력을 묻는 문진표를 채운다. 면허를 가진 의료인이 그 답변을 검토하고, 필요하면 추가로 질문을 보낸 뒤 처방 여부를 정한다. 처방이 나오면 약이 집으로 배송되고, 그다음부터는 정해진 주기에 맞춰 자동으로 온다. 회사는 진료비를 따로 청구하지 않고 약값과 관리비를 묶어 월 구독료로 받는다. 복용을 시작한 뒤에도 앱 안에서 담당 의료인과 케어팀에게 메시지를 보낼 수 있고, 체중 감량 회원에게는 앱과 연동되는 체중계를 추가 비용 없이 보내 매일 잰 몸무게가 자동으로 올라오게 한다. 값은 항목마다 다르다. 남성 탈모는 월 15달러부터, 발기부전은 월 22달러부터, 정신건강 약은 월 49달러부터 시작한다. 체중 감량만 구조가 달라서 멤버십과 약값을 따로 받는다. 멤버십은 첫 달 39달러이고 그 뒤 월 149달러로 자동 갱신되며, 약값은 wegovy 알약이 월 149달러부터, zepbound가 월 299달러부터 별도로 붙는다.\", \"features\": [{\"name\": \"온라인 문진과 처방\", \"detail\": \"증상과 병력을 묻는 문진표를 채우면 면허 의료인이 검토해 처방 여부를 정한다. 화상 진료가 필수는 아니며 대부분 글로 주고받는다.\"}, {\"name\": \"정기 배송 구독\", \"detail\": \"처방이 나온 약을 정해진 주기로 집에 보낸다. 회사는 문진과 진료 연결, 약 조제와 배송, 그 뒤의 관리까지를 한 회사가 모두 맡는다고 스스로 밝힌다.\"}, {\"name\": \"앱 안 의료인 메시지\", \"detail\": \"복용 중에 생기는 질문을 앱에서 담당 의료인과 케어팀에게 바로 물어볼 수 있다. 배송 일정도 앱에서 조정한다.\"}, {\"name\": \"labs 혈액검사와 실행 계획\", \"detail\": \"1년에 130가지가 넘는 혈액 지표를 재고, 그 결과를 바탕으로 의사가 만든 실행 계획을 앱에 띄운다. 보험을 쓰지 않는다. 2026년 2월부터는 한 번의 채혈로 50가지가 넘는 암 신호를 살피는 galleri 검사를 선택 항목으로 붙였다.\"}, {\"name\": \"체중 감량 프로그램\", \"detail\": \"wegovy와 ozempic, zepbound 같은 fda 승인 glp-1 약을 처방받는다. 부작용을 줄이려고 용량을 잘게 나누어 쓰는 방식도 고를 수 있고, 앱과 연동되는 체중계가 멤버십에 포함된다.\"}, {\"name\": \"hers 앱의 ai 진료 경험\", \"detail\": \"2026년 8월에 여성용 hers 앱을 새로 만들어, 이용자와 담당 의료인, 케어팀, ai가 하나의 대화 안에서 이어지게 했다. 진료와 진료 사이의 빈 시간을 ai가 메우고 판단이 필요한 순간에 의료인을 불러들이는 구조이며, 체중 감량 회원부터 적용한 뒤 남성용 hims 앱과 다른 항목으로 넓힐 계획이라고 밝혔다.\"}, {\"name\": \"hims & hers benefits\", \"detail\": \"2026년 3월부터 구독자에게 다른 건강·웰니스 상품 할인을 제공한다.\"}], \"differentiator\": \"같은 자리에 있는 회사는 ro다. 보험을 거치지 않고 소비자가 직접 값을 내며, 온라인 문진으로 처방을 받아 약을 배송받는 구조가 두 회사 모두 같다. 2026년 슈퍼볼에 나란히 광고를 낸 것도 이 둘이다. 차이는 규모와 방향에 있다. hims & hers는 뉴욕증권거래소에 상장돼 있어 매출과 구독자 수를 분기마다 공개하며, 2025년 매출은 23억 5천만 달러였다. 또 영국의 zava, 캐나다의 livewell, 호주의 eucalyptus를 차례로 사들여 영국과 독일, 캐나다, 호주, 일본으로 넓혔는데, 이렇게 국경을 넘어 확장한 소비자 원격진료 회사는 아직 드물다. teladoc처럼 보험사와 고용주를 상대로 파는 원격진료 회사와는 고객 자체가 다르다. 저쪽은 보험이 값을 치르고 이쪽은 이용자가 직접 치른다.\", \"team\": [{\"name\": \"andrew dudum\", \"role\": \"공동창업자, 최고경영자\", \"background\": \"2016년 9월부터 최고경영자와 이사를 맡고 있다. 그 전에는 스타트업 스튜디오이자 투자 펀드인 atomic labs를 공동창업해 제너럴 파트너로 일했다.\"}, {\"name\": \"yemi okupe\", \"role\": \"최고재무책임자\", \"background\": \"2019년부터 2021년까지 uber에서 ubereats와 글로벌 모빌리티 부문의 사업부 재무책임자로 일했고, 그 전에는 ebay와 paypal, google에서 재무를 맡았다.\"}, {\"name\": \"mo elshenawy\", \"role\": \"최고기술책임자\", \"background\": \"2025년 5월에 합류했다. 그 전에는 general motors의 자율주행 자회사 cruise에서 사장 겸 최고기술책임자를 지냈고, amazon에서도 엔지니어링 조직을 이끌었다.\"}, {\"name\": \"dheerja kaur\", \"role\": \"최고제품책임자\", \"background\": \"2025년 7월에 합류했다. 그 전에는 robinhood의 제품 부사장으로 유료 멤버십인 robinhood gold를 맡았다.\"}, {\"name\": \"patrick carroll\", \"role\": \"글로벌 최고의료책임자\", \"background\": \"2014년부터 2019년까지 walgreens의 최고의료책임자를 지냈고, whoop과 vida health에서도 같은 자리를 맡았다.\"}, {\"name\": \"deb autor\", \"role\": \"최고정책책임자\", \"background\": \"2001년부터 2013년까지 미국 fda에서 일했고 마지막 직책은 글로벌 규제 운영·정책을 총괄하는 부청장이었다. 2024년 11월부터 이 회사 이사를 맡다가 2025년 11월에 최고정책책임자가 됐다.\"}], \"traction\": [{\"type\": \"revenue\", \"detail\": \"2025년 매출이 23억 5천만 달러로 전년보다 59퍼센트 늘었다. 순이익은 1억 2,800만 달러, 조정 ebitda는 3억 1,800만 달러였다.\", \"when\": \"2026-02\", \"source\": \"2025년 4분기·연간 실적 발표\"}, {\"type\": \"revenue\", \"detail\": \"2026년 2분기 매출이 7억 5,320만 달러로 전년 동기보다 38퍼센트 늘었으나, 같은 분기에 8,630만 달러 순손실을 냈다. 총이익률은 1년 사이 76퍼센트에서 64퍼센트로 떨어졌다.\", \"when\": \"2026-08\", \"source\": \"2026년 2분기 실적 발표\"}, {\"type\": \"customers\", \"detail\": \"2026년 6월 말 구독자가 289만 명으로 전년 동기보다 19퍼센트 늘었다. 구독자 한 사람이 한 달에 내는 금액은 평균 92달러다.\", \"when\": \"2026-08\", \"source\": \"2026년 2분기 실적 발표\"}, {\"type\": \"partnership\", \"detail\": \"novo nordisk와 협업 계약을 맺고 ozempic과 wegovy를 플랫폼에서 팔기 시작했다. 같은 날 novo nordisk는 2월에 제기했던 소송을 취하했다.\", \"when\": \"2026-03\", \"source\": \"회사 보도자료, reuters\"}, {\"type\": \"partnership\", \"detail\": \"호주의 원격진료 회사 eucalyptus를 최대 11억 5천만 달러에 인수하는 절차를 마쳤다. eucalyptus는 juniper와 pilot 브랜드를 운영하며 고객 85만 명을 모았고 연 환산 매출이 4억 5천만 달러를 넘는다고 밝혔다.\", \"when\": \"2026-06\", \"source\": \"회사 보도자료\"}, {\"type\": \"funding\", \"detail\": \"국제 확장과 ai 투자에 쓰겠다며 3억 5천만 달러 규모 전환사채를 발행했다.\", \"when\": \"2026-05\", \"source\": \"회사 보도자료\"}, {\"type\": \"regulatory\", \"detail\": \"미국 연방거래위원회가 유타주, 캘리포니아주와 함께 캘리포니아 북부 연방지방법원에 소송을 냈다. 민감한 건강정보를 meta와 snap 같은 광고 플랫폼에 넘겼고, 문진표를 낸 직후 바로 결제를 걸었으며, 해지 버튼을 여러 단계 뒤에 숨겼다는 내용이다. 회사는 근거 없는 주장이라며 다투겠다고 밝혔다.\", \"when\": \"2026-07\", \"source\": \"ftc 보도자료, 회사 입장문\"}, {\"type\": \"regulatory\", \"detail\": \"visa가 결제 분쟁이 지나치게 많은 가맹점을 넣는 감시 프로그램에 이 회사를 올렸다. 분쟁 한 건마다 8달러가 붙어 9월에 약 7만 5천 달러를 물게 됐고, 프로그램에서 빠지려면 분쟁 비율을 석 달 연속 1.5퍼센트 아래로 낮춰야 한다.\", \"when\": \"2026-08\", \"source\": \"bloomberg 보도(내부 문서 기반), medical daily 정리\"}, {\"type\": \"traffic\", \"detail\": \"2025년 슈퍼볼 광고 뒤 트래픽이 650퍼센트 늘었다고 보도됐다.\", \"when\": \"2025-02\", \"source\": \"fierce healthcare 기사 제목(본문은 열지 못해 확인하지 못했다)\"}], \"caveats\": \"먼저 뉴스레터 대목부터 정리한다. 2026년 슈퍼볼 광고는 실제로 집행됐다. 2월 8일에 내보낸 광고 이름은 'rich people live longer'이고, 래퍼 common이 목소리를 맡았으며, 부자가 더 오래 사는 나라라는 문제를 정면으로 꺼내는 내용이다. 다만 이 광고에 얼마를 썼는지는 회사가 밝히지 않았다. 뉴스레터에 나온 1,500만 달러는 ro가 밝힌 금액이므로 hims에 그대로 옮겨 쓰면 안 된다.\\n\\n조제 glp-1 광고를 멈춘 일은 성격을 정확히 볼 필요가 있다. 규제 당국이 명령했거나 합의를 강제한 것이 아니라, 2026년 3월 9일에 회사가 스스로 전략을 바꾼다고 발표한 것이다. fda 승인 약으로 무게중심을 옮기면서 조제 glp-1은 더 이상 광고하지 않고 임상적으로 꼭 필요한 경우에만 제한적으로 제공하겠다고 했다. 그런데 같은 날 novo nordisk가 판매 협업 계약을 맺고 2월 9일에 냈던 특허 침해 소송을 취하했으므로, 자발적 결정과 소송 타결이 사실상 한 묶음이었다고 보는 편이 맞다.\\n\\n수치의 출처가 서로 다르다. 매출과 구독자 수, 순손익은 상장사가 공시한 실적이므로 감사받는 재무제표에 근거한다. 다만 조정 ebitda는 회계 기준 밖의 지표이고 계산 방식을 회사가 정한다. 반면 eucalyptus의 고객 85만 명과 연 환산 매출 4억 5천만 달러는 회사가 인수를 알리며 밝힌 값이고 제삼자가 확인한 것이 아니다. 2030년까지 매출 65억 달러라는 목표도 회사의 전망이다.\\n\\n법적 위험은 아직 진행 중이다. 연방거래위원회 소송은 제소 단계이고 법원이 어떤 판단도 내리지 않았다. 회사는 3년 가까운 조사에서 제출한 자료를 무시한 소송이라고 반박했다. visa 감시 프로그램 편입은 bloomberg가 내부 문서를 근거로 보도한 것이고, 회사는 분쟁 건수가 상대적으로 적다고만 답하고 프로그램 자체에 대한 질문에는 답하지 않았다. 이 둘은 성격이 다르다. 앞의 것은 정부 기관의 법 집행이고 뒤의 것은 카드 회사가 가맹점에 매기는 상업적 제재다.\\n\\n광고를 둘러싼 시비는 이번이 처음이 아니다. 2025년 슈퍼볼 광고 때도 상원의원 두 명과 업계 단체가 환자를 오도할 위험이 있다며 fda에 검토를 요청했다. 갈무리한 구글 플레이 화면에는 결제와 해지를 문제 삼는 이용자 후기가 상단에 올라와 있는데, 이는 개별 이용자의 주장이지 확인된 사실은 아니다. 다만 연방거래위원회가 문제 삼은 대목과 방향이 같다는 점은 눈여겨볼 만하다.\", \"for_us\": \"이 회사가 파는 것은 약이 아니라 구독이다. 슈퍼볼 광고 같은 큰돈을 감당할 수 있는 이유는 한 번 들어온 사람이 매달 계속 내기 때문이고, 그래서 회사의 가장 큰 약점도 거기서 나왔다. 해지와 청구를 둘러싼 분쟁이 쌓여 규제 기관 소송과 카드 회사 제재로 이어졌다. 우리가 미국에서 구독을 붙인다면, 해지 경로를 앱 안에서 두 번 안에 끝내도록 만드는 일이 나중에 붙일 기능이 아니라 처음부터 지켜야 할 조건이라는 뜻이다.\\n\\n제품 쪽에서 가져올 것은 hers 앱이 잡은 문제 정의다. 이 회사는 진료와 진료 사이의 빈 시간을 문제로 규정했다. 밤 아홉 시에 생긴 부작용, 용량을 바꾼 뒤의 질문, 아무도 알아주지 않는 작은 성취처럼 다음 예약까지 기다리라는 말밖에 들을 수 없는 구간이다. 이 구간을 메우는 일은 처방권도 약국도 필요 없고 소프트웨어만으로 할 수 있다. 우리 앱은 이미 걸음 데이터를 매일 받고 있으므로 붙일 자리가 있다.\\n\\n특히 glp-1 복용자라는 집단이 눈에 띈다. 미국에서 이 약을 쓰는 사람이 빠르게 늘었고, 이들은 메스꺼움 같은 부작용과 단백질 섭취, 근육 손실, 약을 끊은 뒤의 요요처럼 매일 판단해야 할 문제를 안고 있다. 처방한 의료인은 매일 곁에 없다. 우리는 약을 팔 수 없지만 약을 쓰는 사람 옆에서 매일 쓰이는 앱은 될 수 있다. hims가 체중계를 무료로 보내 매일 수치를 받아 가는 것도 같은 목적이며, 우리는 기기 없이 이미 그 자리를 갖고 있다.\\n\\n마지막으로 값의 감각을 참고할 만하다. 미국 소비자는 보험을 거치지 않는 건강 상품에 월 15달러에서 149달러까지 현금으로 낸다. 한국에서 흔히 가정하는 지불 의사보다 훨씬 높은 수준이며, 우리가 미국에서 유료 기능을 붙일 때 기준으로 삼을 만한 실측값이다.\", \"screenshots\": [{\"file\": \"hims-hers_news.png\", \"caption\": \"회사 뉴스룸 첫 화면이다. 호주 진출 소식이 맨 위에 있고, 그 아래로 여성용 hers 앱이 담당 의료인과 케어팀, ai를 한 대화창에 모은 화면이 보인다.\", \"from\": \"https://news.hims.com/\"}, {\"file\": \"hims-hers_ios.png\", \"caption\": \"미국 애플 앱스토어의 남성용 hims 앱 페이지다. 평점 4.8에 평가 9만 5천 건이고 의료 분야 순위 안에 든다. 아래 개인정보 항목에는 건강, 금융, 민감 정보가 이용자 신원과 연결돼 수집된다고 적혀 있다.\", \"from\": \"https://apps.apple.com/us/app/hims-telehealth-for-men/id1455690574\"}, {\"file\": \"hims-hers_android.png\", \"caption\": \"구글 플레이의 같은 앱 페이지다. 내려받기 100만 건이 넘고 평점은 4.5인데, 화면 아래쪽 후기 목록에는 결제와 해지를 문제 삼는 이용자 불만과 그에 대한 회사 답변이 나란히 붙어 있다.\", \"from\": \"https://play.google.com/store/apps/details?id=com.himshers.hims\"}], \"sources\": [{\"title\": \"hims & hers returns to the big game with a message to all americans\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-returns-to-the-big-game-with-a-message-to-all-americans-the-era-of-health-as-a-luxury-is-over/default.aspx\", \"note\": \"2026년 슈퍼볼 광고의 이름과 내용, 출연자를 확인했다. 광고비는 밝히지 않았다.\"}, {\"title\": \"hims & hers announces strategic shift for us weight loss business\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-announces-strategic-shift-for-us-weight-loss-business/default.aspx\", \"note\": \"조제 glp-1 광고를 중단한다는 발표와 novo nordisk 협업, 소송 취하가 같은 날 이루어졌음을 확인했다.\"}, {\"title\": \"hims & hers announces agreement to acquire eucalyptus\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-announces-agreement-to-acquire-eucalyptus-accelerating-its-vision-to-become-the-leading-global-consumer-health-platform/default.aspx\", \"note\": \"인수 금액 최대 11억 5천만 달러와 대금 지급 구조, eucalyptus의 연 환산 매출을 확인했다.\"}, {\"title\": \"hims & hers completes acquisition of eucalyptus\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-completes-acquisition-of-eucalyptus-advancing-its-position-as-the-worlds-largest-consumer-health-platform/default.aspx\", \"note\": \"2026년 6월 2일 인수 완료와 진출 국가, 고객 85만 명이라는 회사 발표를 확인했다.\"}, {\"title\": \"hims & hers health, inc. reports second quarter 2026 financial results\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-health-inc--reports-second-quarter-2026-financial-results/default.aspx\", \"note\": \"2026년 2분기 매출과 구독자 수, 순손실, 총이익률, 연간 전망을 확인했다.\"}, {\"title\": \"hims & hers health, inc. reports fourth quarter and full year 2025 financial results\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-health-inc--reports-fourth-quarter-and-full-year-2025-financial-results/default.aspx\", \"note\": \"2025년 연간 매출 23억 5천만 달러와 순이익, 구독자 251만 명을 확인했다.\"}, {\"title\": \"hims & hers introduces new hers app with doctor-led, ai-native care experience\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-introduces-new-hers-app-with-first-of-its-kind-doctor-led-ai-native-care-experience/default.aspx\", \"note\": \"진료 사이의 빈 시간을 문제로 규정한 대목과 스마트 체중계 무상 제공, 문진부터 배송까지 한 회사가 맡는다는 회사 주장을 확인했다.\"}, {\"title\": \"ftc and states act against hims & hers for deceptive and unlawful privacy practices\", \"url\": \"https://www.ftc.gov/news-events/news/press-releases/2026/07/ftc-states-act-against-hims-hers-deceptive-unlawful-privacy-practices\", \"note\": \"광고 플랫폼 건강정보 공유, 문진 직후 결제, 해지 방해 혐의와 적용 법률, 함께 제소한 주를 확인했다.\"}, {\"title\": \"hims & hers responds to ftc lawsuit\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-responds-to-ftc-lawsuit/default.aspx\", \"note\": \"회사가 소송을 전면 부인한 입장문이다.\"}, {\"title\": \"hims' weight-loss plans draw penalties over credit card disputes\", \"url\": \"https://www.bloomberg.com/news/articles/2026-08-21/hims-weight-loss-plans-draw-penalties-over-credit-card-disputes\", \"note\": \"visa 감시 프로그램 편입을 내부 문서로 처음 보도한 기사다. 본문은 유료 구독 벽에 막혀 직접 열지 못했고, 이 기사를 인용해 정리한 medical daily와 investing.com 기사로 내용을 확인했다.\"}, {\"title\": \"hims 공식 사이트 (탈모, 발기부전, 정신건강, 체중 감량, labs)\", \"url\": \"https://www.hims.com/weight-loss\", \"note\": \"항목별 시작 가격과 체중 감량 멤버십 조건, 취급 약 목록, labs 검사 항목을 직접 확인했다.\"}, {\"title\": \"hims inc. 임원 소개\", \"url\": \"https://investors.hims.com/governance/executive-management/default.aspx\", \"note\": \"창업자와 주요 임원의 직함, 이전 경력을 확인했다.\"}, {\"title\": \"hims: telehealth for men (미국 애플 앱스토어)\", \"url\": \"https://apps.apple.com/us/app/hims-telehealth-for-men/id1455690574\", \"note\": \"평점 4.8, 평가 9만 4천여 건, 무료 내려받기, 수집 정보 항목을 확인했다.\"}, {\"title\": \"hims: telehealth for men (구글 플레이)\", \"url\": \"https://play.google.com/store/apps/details?id=com.himshers.hims\", \"note\": \"내려받기 100만 건 이상, 평점 4.5, 후기 1만 8천여 건과 결제 관련 이용자 불만을 확인했다.\"}, {\"title\": \"hers: women's healthcare (구글 플레이)\", \"url\": \"https://play.google.com/store/apps/details?id=com.himshers.hers\", \"note\": \"여성용 앱의 내려받기 50만 건 이상과 취급 항목을 확인했다.\"}, {\"title\": \"hims inc. 투자자 자주 묻는 질문\", \"url\": \"https://investors.hims.com/resources/investor-faqs/default.aspx\", \"note\": \"델라웨어주에 2013년 법인 설립, 뉴욕증권거래소 상장, 샌프란시스코 본사를 확인했다.\"}, {\"title\": \"hims & hers faces visa penalties over dispute surge (investing.com)\", \"url\": \"https://www.investing.com/news/stock-market-news/hims--hers-faces-visa-penalties-over-dispute-surge--bloomberg-93ch-4872170\", \"note\": \"건당 8달러 부과, 9월 약 7만 5천 달러 청구, 프로그램에서 빠지려면 석 달 연속 분쟁 비율 1.5퍼센트 아래라는 조건을 확인했다.\"}]}"},{"slug":"midi-health","name":"Midi Health","one_liner":"폐경 전후 증상을 겪는 미국 여성에게 화상으로 진료를 해 주는 원격 진료 회사로, 진료비를 환자에게 직접 받지 않고 민간 건강보험에 청구하는 방식을 택했다.","sells_to":"mixed","seen_in":[{"issue":"12","section":19,"headline":"폐경 케어로 가장 잘 알려진 여성 건강 회사로 소개되면서, Goodwater Capital이 주도한 라운드에서 1억 달러를 조달해 기업 가치 10억 달러를 넘겼다고 나왔다."}],"card":{"problem":"미국에서는 폐경 전후 증상을 제대로 진료해 주는 의사를 찾기가 어렵다. 검사 한 번으로 확정하는 병이 아니라 증상으로 판단하는 영역이라 정식으로 훈련받은 의사가 드물고, 보험 네트워크 안에서 그런 의사를 직접 찾아 예약을 잡는 데 몇 주가 걸린다.","solution":"여성 건강을 전공한 전문간호사와 조산사가 화상으로 30분 진료를 하고, 호르몬제와 비호르몬제 처방, 검사 의뢰, 생활 습관 상담을 묶은 치료 계획을 준다. 50개 주 전역에서 민간 보험으로 받을 수 있게 만든 것이 이 회사의 핵심이다.","price":"보험이 있으면 진료비를 보험에 청구하므로 본인부담금만 내고, 보험을 쓰지 않으면 첫 진료 250달러, 재진 150달러다.","tags":["폐경 케어","원격진료","보험 청구","여성 건강","간호사 진료"],"headline_traction":"2026년 2월에 Goodwater Capital이 주도한 시리즈 D로 1억 달러를 조달해 기업 가치 10억 달러를 넘겼다.","watch":"주당 25,000명과 보험 적용 대상 4,500만 명은 모두 회사가 스스로 낸 수치이고, 4,500만 명은 실제 이용자가 아니라 보험으로 이용할 수 있는 사람의 수다. 메디케어와 메디케이드 가입자는 받지 않는다."},"screenshots":[{"file":"midi-health_home.png","caption":"첫 화면에서 보험으로 받는 폐경 진료임을 앞세우고, 계약한 보험사 이름을 나란히 보여 준다.","from":"https://www.joinmidi.com"},{"file":"midi-health_pricing.png","caption":"값 안내 화면이다. 첫 진료 30분 250달러, 재진 15분 150달러이며 보험을 쓰면 보험 처리라고 적혀 있다.","from":"https://www.joinmidi.com/pricing-insurance"},{"file":"midi-health_glp1.png","caption":"GLP-1 약값 안내 화면이다. 진료는 보험으로 받고 약은 4주분 164달러에서 460달러 사이에 현금으로 사는 구조를 보여 준다.","from":"https://www.joinmidi.com/glp1-pricing"}],"q":"{\"slug\": \"midi-health\", \"name\": \"midi health\", \"one_liner\": \"폐경 전후 증상을 겪는 미국 여성에게 화상으로 진료를 해 주는 원격 진료 회사로, 진료비를 환자에게 직접 받지 않고 민간 건강보험에 청구하는 방식을 택했다.\", \"site\": \"https://www.joinmidi.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"12\", \"section\": 19, \"headline\": \"폐경 케어로 가장 잘 알려진 여성 건강 회사로 소개되면서, goodwater capital이 주도한 라운드에서 1억 달러를 조달해 기업 가치 10억 달러를 넘겼다고 나왔다.\"}], \"card\": {\"problem\": \"미국에서는 폐경 전후 증상을 제대로 진료해 주는 의사를 찾기가 어렵다. 검사 한 번으로 확정하는 병이 아니라 증상으로 판단하는 영역이라 정식으로 훈련받은 의사가 드물고, 보험 네트워크 안에서 그런 의사를 직접 찾아 예약을 잡는 데 몇 주가 걸린다.\", \"solution\": \"여성 건강을 전공한 전문간호사와 조산사가 화상으로 30분 진료를 하고, 호르몬제와 비호르몬제 처방, 검사 의뢰, 생활 습관 상담을 묶은 치료 계획을 준다. 50개 주 전역에서 민간 보험으로 받을 수 있게 만든 것이 이 회사의 핵심이다.\", \"price\": \"보험이 있으면 진료비를 보험에 청구하므로 본인부담금만 내고, 보험을 쓰지 않으면 첫 진료 250달러, 재진 150달러다.\", \"tags\": [\"폐경 케어\", \"원격진료\", \"보험 청구\", \"여성 건강\", \"간호사 진료\"], \"headline_traction\": \"2026년 2월에 goodwater capital이 주도한 시리즈 d로 1억 달러를 조달해 기업 가치 10억 달러를 넘겼다.\", \"watch\": \"주당 25,000명과 보험 적용 대상 4,500만 명은 모두 회사가 스스로 낸 수치이고, 4,500만 명은 실제 이용자가 아니라 보험으로 이용할 수 있는 사람의 수다. 메디케어와 메디케이드 가입자는 받지 않는다.\"}, \"problem\": \"폐경은 검사 한 번으로 확정하는 병이 아니라 안면홍조와 수면 장애, 기분 변화 같은 증상으로 판단하는 시기이며, 그 증상이 몇 해에 걸쳐 이어진다. 문제는 이 시기를 다루는 훈련을 정식으로 받은 의사가 미국에 드물다는 점이다. midi는 자사 자료에서 전공의 가운데 폐경 진료를 감당할 준비가 되었다고 답한 비율이 6.8%에 그친다는 조사를 인용한다. 여기에 미국 특유의 구조가 겹친다. 한국처럼 원하는 병원에 그냥 걸어 들어가면 되는 것이 아니라, 자기 보험이 네트워크로 인정하는 의사를 직접 찾아 예약을 잡아야 하고 그 과정에 몇 주가 걸리며, 폐경을 전문으로 보는 의사는 그 명단 안에서 더 찾기 어렵다. 그래서 증상이 있어도 진료를 포기하는 여성이 많고, mayo clinic이 2023년에 낸 연구는 제대로 치료되지 않은 폐경 증상 때문에 미국이 해마다 부담하는 비용을 260억 달러가 넘는 규모로 추산했다. 그 가운데 20억 달러 가까이가 결근을 비롯한 노동 손실이고 나머지 240억 달러 이상이 의료비다.\", \"solution\": \"이용자는 midi 홈페이지에서 화상 진료를 예약한다. 첫 진료는 30분이며, 여성 건강을 전공한 공인 전문간호사(np)나 공인 조산사(cnm)가 증상과 병력, 지금 무엇이 힘든지를 듣고 치료 계획을 세운다. 필요하면 대사 검사와 갑상선 검사, 인슐린 민감도 검사를 의뢰하고, 호르몬제와 비호르몬제 처방, 자사가 파는 보조제, 생활 습관 상담을 하나로 묶어 준다. 재진은 15분이며 필요할 때마다 받는다. 진료비는 보험이 있으면 보험에 청구되고 이용자는 본인부담금만 내며, 보험을 쓰지 않으면 첫 진료 250달러, 재진 150달러다. 50개 주 전역에서 진료하고, 회사는 대다수 ppo 보험과 네트워크 계약을 맺었다고 밝힌다. 소비자용 모바일 앱은 미국 앱스토어와 구글 플레이 어느 쪽에도 없으며, 예약부터 진료까지 모든 절차가 웹에서 이루어진다.\", \"features\": [{\"name\": \"화상 진료\", \"detail\": \"첫 진료 30분, 재진 15분으로 시간이 정해져 있다. 증상과 병력을 듣고 치료 계획을 세운 뒤 필요할 때마다 재진으로 조정한다.\"}, {\"name\": \"보험 청구\", \"detail\": \"이용자가 값을 직접 치르는 대신 회사가 민간 건강보험에 진료비를 청구한다. 회사는 ppo 보험의 80% 이상과 네트워크 계약을 맺었다고 밝히며, blue cross blue shield와 unitedhealthcare, cigna, aetna, health net을 계약사로 표시한다. 메디케어는 네트워크 밖이고 메디케이드와 medi-cal은 받지 않는다.\"}, {\"name\": \"검사 의뢰\", \"detail\": \"대사 검사와 갑상선 검사, 인슐린 민감도 지표 검사를 진료 과정에서 의뢰한다.\"}, {\"name\": \"처방\", \"detail\": \"호르몬제와 비호르몬제를 모두 처방하며, 테스토스테론과 glp-1 계열 비만 치료제, 에스트리올 크림도 처방 품목에 들어 있다.\"}, {\"name\": \"자사 판매 상품\", \"detail\": \"코르티솔 보조제와 식이섬유, 베르베린, 오메가3 같은 일반 판매 상품을 따로 판다. 이 상품들은 보험 대상이 아니라 현금 결제다.\"}, {\"name\": \"glp-1 현금 결제 경로\", \"detail\": \"조제 방식으로 만든 glp-1과 glp-1/gip 약을 4주분 164달러에서 460달러 사이에 판다. 회사는 회원비가 없고 배송비와 부자재가 값에 포함된다고 안내한다. 진료는 보험으로, 약값은 현금으로 갈리는 구조다.\"}, {\"name\": \"agewell 예방 프로그램\", \"detail\": \"2025년 5월에 시작한 예방 중심 프로그램으로, 심혈관 질환과 암 예방, 뼈와 뇌 건강을 다룬다. 보험이 적용되는 프로그램으로 소개됐다.\"}, {\"name\": \"midi university\", \"detail\": \"회사가 자체 운영하는 임상진 교육 과정으로, 50개가 넘는 강좌와 주간 강의로 여성 건강 최신 연구를 가르친다고 밝힌다.\"}, {\"name\": \"고용주 채널\", \"detail\": \"고용주에게는 인원당 월정액도, 계약도, 추가 비용도 없다고 안내한다. 고용주가 값을 치르는 것이 아니라 직원이 진료를 받으면 그 직원의 건강보험에 청구하는 방식이라, 고용주 쪽은 계약이 아니라 홍보 통로에 가깝다.\"}], \"differentiator\": \"같은 폐경 원격 진료를 하는 alloy는 결제 방식이 정반대다. alloy는 홈페이지에서 보험 문제가 없는 간편한 현금 결제를 내세우며 보험을 받지 않고 이용자가 값을 직접 치른다. midi는 민간 보험 네트워크 안으로 들어가는 쪽을 택해, 대다수 ppo 보험 가입자가 본인부담금만 내고 진료를 받게 만들었다. 창업자 joanna strober도 성장의 바탕을 보험 적용과 전문 인력을 갖춘 기반 구축으로 설명한다. 현금 결제 회사는 매달 값을 낼 뜻이 있는 사람만 모을 수 있는 반면, 보험 청구 방식은 이미 보험료를 내고 있는 사람에게 추가 부담이 크지 않은 선택지가 된다. 여성 건강 원격 진료에서 기업 가치 10억 달러를 넘긴 다른 회사로는 임신과 가족 돌봄을 다루는 maven clinic이 있으나, 다루는 시기가 달라 정면으로 겹치지는 않는다.\", \"team\": [{\"name\": \"joanna strober\", \"role\": \"공동창업자, ceo\", \"background\": \"아동 비만을 다루는 디지털 치료 서비스 kurbo를 창업해 weight watchers에 매각했다. 그 전에는 20여 년 동안 건강과 소비자 분야 기업에 투자하는 일을 했고 bluenile, etoys, babycenter 등에 관여했다. 2022년에 본인이 겪은 폐경 증상을 계기로 midi를 세웠다.\"}, {\"name\": \"jason wheeler\", \"role\": \"cfo\", \"background\": \"tesla와 google, forward에서 일했다. 시리즈 d 발표와 함께 합류했다.\"}, {\"name\": \"melissa waters\", \"role\": \"cmo\", \"background\": \"meta와 lyft, hims & hers에서 일했다. 시리즈 d 발표와 함께 합류했다.\"}, {\"name\": \"matt cook\", \"role\": \"cco\", \"background\": \"omada health와 firefly health에서 일했다. 시리즈 d 발표와 함께 합류했다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"시리즈 d로 1억 달러를 조달하며 기업 가치 10억 달러를 넘겼다. goodwater capital이 주도했고 foresite capital과 serena ventures가 새로 참여했으며, advance venture partners와 gv, emerson collective, sempervirens, mckesson ventures, felicis ventures가 이어서 투자했다.\", \"when\": \"2026-02\", \"source\": \"midi 보도자료, finsmes, future fem health\"}, {\"type\": \"funding\", \"detail\": \"시리즈 c로 5,000만 달러를 조달했다. advance venture partners가 주도했고 2025년 봄에 마감해 10월에 공개했다. 이 시점까지 누적 조달액은 약 1억 5,000만 달러였다.\", \"when\": \"2025-10\", \"source\": \"femtech insider가 인용한 business insider 보도\"}, {\"type\": \"funding\", \"detail\": \"시리즈 b로 약 6,000만 달러를 조달했다. 23andme 공동창업자 anne wojcicki를 비롯한 개인 투자자도 참여했다.\", \"when\": \"2024-04\", \"source\": \"femtech insider\"}, {\"type\": \"revenue\", \"detail\": \"연환산 매출이 1억 5,000만 달러에 이르렀다고 ceo가 밝혔다. 2024년 말 6,000만 달러에서 늘어난 수치다.\", \"when\": \"2025-10\", \"source\": \"femtech insider가 인용한 business insider 보도\"}, {\"type\": \"customers\", \"detail\": \"주당 25,000명이 넘는 환자를 보고, 4,500만 명이 넘는 여성이 보험을 통해 이용할 수 있다고 밝혔다.\", \"when\": \"2026-02\", \"source\": \"midi 보도자료\"}, {\"type\": \"customers\", \"detail\": \"45만 명이 넘는 여성이 진료를 맡겼고, 50개 주 전역에서 550명이 넘는 임상진이 일한다고 자사 소개 화면에 표기하고 있다.\", \"when\": \"2026-09\", \"source\": \"joinmidi.com/our-story 화면\"}], \"caveats\": \"규모를 보여 주는 수치는 거의 모두 회사가 스스로 낸 값이다. 주당 25,000명, 보험 적용 대상 4,500만 명, 누적 45만 명, 임상진 550명이 여기에 해당하며 제삼자가 확인한 값이 아니다. 특히 4,500만 명은 실제 이용자 수가 아니라 계약된 보험에 들어 있어 이용할 수 있는 사람의 규모를 뜻하므로, 이용자 수로 읽으면 안 된다. 임상 성과로 내세우는 값도 마찬가지다. 유방암 검진 이행률 28%포인트 상승, 대장암 검진 11%포인트 상승, 총 진료비 최대 13% 절감, a1c와 ldl 감소는 모두 회사 내부 데이터이며 동료 심사를 거친 논문이나 제삼자 감사로 확인되지 않았다. 연환산 매출 1억 5,000만 달러는 ceo가 business insider에 말한 값이고 감사받은 재무제표가 아니다. 진료 구조에도 짚어 둘 대목이 있다. 이용자가 실제로 만나는 사람은 의사가 아니라 공인 전문간호사나 공인 조산사이며, 의사는 진료 지침을 만들고 자문하는 자리에 있다. 지불 측면에서는 메디케어가 네트워크 밖이고 메디케이드와 medi-cal은 받지 않아, 65세 이상과 저소득층이 사실상 대상에서 빠진다. 보험이 적용돼도 자기부담금을 채우기 전에는 이용자가 진료비를 내며, 보조제와 glp-1 같은 약값은 보험 밖 현금 결제다. glp-1은 완제품이 아니라 조제 방식으로 만든 약이라는 점도 회사가 명시하고 있다. 마지막으로 보도자료와 언론 보도는 joanna strober를 공동창업자로 표기하지만, 다른 공동창업자의 이름은 공개 자료에서 확인하지 못했다.\", \"for_us\": \"이 회사가 하는 일 자체는 미국 의사 면허와 보험 계약이 있어야 하므로 3개월 안에 따라 할 수 없다. 다만 midi가 증명한 것은 수요의 위치다. 폐경 전후 증상을 다루는 곳이 없어서 주당 25,000명이 화상 진료를 찾아 나선다는 사실이 그 수요를 보여 준다. 우리가 소프트웨어만으로 할 수 있는 자리는 진료가 아니라 증상 기록이다. 폐경기 증상은 검사 수치가 아니라 본인이 느끼는 것으로 판단하므로, 안면홍조 횟수와 밤에 깬 횟수, 기분을 하루 몇 초 만에 남기게 하고 이미 받고 있는 걸음 수와 수면 데이터와 겹쳐 몇 주 단위 변화를 보여 주는 것만으로도 값이 생긴다. 치료를 권하지 않고 기록과 요약에만 머무르면 규제 허가가 필요 없다. midi에 소비자용 모바일 앱이 없다는 점도 눈여겨볼 만하다. 진료와 진료 사이의 몇 주를 기록으로 채워 주는 자리는 이 회사가 비워 두고 있다. 다만 우리 앱의 미국 사용자 가운데 40대 후반에서 50대 초반 여성이 얼마나 되는지 먼저 확인해야 하고, 실제 진료로 연결하는 일은 우리가 할 수 없으므로 기록과 정보 제공까지가 우리 몫이다.\", \"screenshots\": [{\"file\": \"midi-health_home.png\", \"caption\": \"첫 화면에서 보험으로 받는 폐경 진료임을 앞세우고, 계약한 보험사 이름을 나란히 보여 준다.\", \"from\": \"https://www.joinmidi.com\"}, {\"file\": \"midi-health_pricing.png\", \"caption\": \"값 안내 화면이다. 첫 진료 30분 250달러, 재진 15분 150달러이며 보험을 쓰면 보험 처리라고 적혀 있다.\", \"from\": \"https://www.joinmidi.com/pricing-insurance\"}, {\"file\": \"midi-health_glp1.png\", \"caption\": \"glp-1 약값 안내 화면이다. 진료는 보험으로 받고 약은 4주분 164달러에서 460달러 사이에 현금으로 사는 구조를 보여 준다.\", \"from\": \"https://www.joinmidi.com/glp1-pricing\"}, {\"file\": \"midi-health_employers.png\", \"caption\": \"고용주용 안내 화면이다. 인원당 월정액도 계약도 추가 비용도 없다고 적어, 고용주가 아니라 건강보험에 청구하는 구조임을 드러낸다.\", \"from\": \"https://www.joinmidi.com/for-employers\"}], \"sources\": [{\"title\": \"midi health 홈페이지\", \"url\": \"https://www.joinmidi.com\", \"note\": \"무엇을 파는지와 보험 적용 여부, 계약 보험사를 확인했다.\"}, {\"title\": \"pricing & insurance\", \"url\": \"https://www.joinmidi.com/pricing-insurance\", \"note\": \"첫 진료 250달러, 재진 150달러와 메디케어·메디케이드 제외 조건을 확인했다.\"}, {\"title\": \"how midi works\", \"url\": \"https://www.joinmidi.com/how-midi-works\", \"note\": \"예약부터 치료 계획, 재진까지 이용 흐름과 의뢰하는 검사 종류를 확인했다.\"}, {\"title\": \"meet our clinicians\", \"url\": \"https://www.joinmidi.com/meet-our-clinicians\", \"note\": \"진료하는 사람이 공인 전문간호사와 공인 조산사라는 점, 임상진 교육 과정, 전공의 6.8% 인용을 확인했다.\"}, {\"title\": \"our story\", \"url\": \"https://www.joinmidi.com/our-story\", \"note\": \"누적 45만 명, 임상진 550명, ppo 보험 80% 이상 같은 자사 표기 수치를 확인했다.\"}, {\"title\": \"joanna strober 소개 화면\", \"url\": \"https://www.joinmidi.com/team/joanna-strober-chief-executive-officer\", \"note\": \"kurbo 창업과 weight watchers 매각을 비롯한 창업자 경력을 확인했다.\"}, {\"title\": \"midi health surpasses $1b valuation (자사 보도자료)\", \"url\": \"https://www.joinmidi.com/press-release/series-d-announcement\", \"note\": \"시리즈 d 금액과 투자사, 기업 가치, 임원 영입, 자사 임상 성과 수치를 확인했다.\"}, {\"title\": \"glp-1 pricing\", \"url\": \"https://www.joinmidi.com/glp1-pricing\", \"note\": \"조제 glp-1 약값 구간과 회원비 없음 안내를 확인했다.\"}, {\"title\": \"for employers\", \"url\": \"https://www.joinmidi.com/for-employers\", \"note\": \"고용주에게 인원당 월정액과 계약이 없다는 점, 건강보험에 직접 청구하는 구조를 확인했다.\"}, {\"title\": \"midi health raises $100m series d at $1bn valuation (future fem health)\", \"url\": \"https://www.futurefemhealth.com/p/midi-health-raises-100m-series-d\", \"note\": \"투자사 명단과 창업자·투자자 발언, 진료 과목 범위를 확인했다.\"}, {\"title\": \"midi health hits $1 billion valuation (flow space)\", \"url\": \"https://www.theflowspace.com/physical-health/prevention-longevity/midi-health-1-billion-valuation-unicorn-joanna-strober-3021193/\", \"note\": \"2022년 창업 경위, 확장 방향, mayo clinic 연구가 추산한 폐경 증상 비용, maven clinic 비교를 확인했다.\"}, {\"title\": \"midi health raises $100m in series d funding (finsmes)\", \"url\": \"https://www.finsmes.com/2026/02/midi-health-raises-100m-in-series-d-funding.html\", \"note\": \"투자사 명단과 신임 임원 세 명을 확인했다.\"}, {\"title\": \"midi health hits $1b valuation with $100m (hit consultant)\", \"url\": \"https://hitconsultant.net/2026/02/03/midi-health-series-d-unicorn-valuation-womens-health/\", \"note\": \"폐경 전문에서 여성 생애 전반 진료로 넓히려는 방향과 ai 활용 용도를 확인했다.\"}, {\"title\": \"midi health raises $50m series c (femtech insider)\", \"url\": \"https://femtechinsider.com/midi-health-raises-50-million-series-c-for-menopause-care-platform/\", \"note\": \"시리즈 c 금액과 시기, 누적 조달액, 연환산 매출, agewell 프로그램, 메디케어·메디케이드 제외를 확인했다.\"}, {\"title\": \"미국 앱스토어 검색 api\", \"url\": \"https://itunes.apple.com/search?term=midi%20health&entity=software&country=us\", \"note\": \"소비자용 ios 앱이 없다는 것을 확인했다.\"}, {\"title\": \"구글 플레이 검색 결과\", \"url\": \"https://play.google.com/store/search?q=midi%20health&c=apps&hl=en_us&gl=us\", \"note\": \"소비자용 안드로이드 앱이 없다는 것을 확인했다.\"}, {\"title\": \"alloy 홈페이지\", \"url\": \"https://www.myalloy.com\", \"note\": \"경쟁사가 보험을 받지 않고 현금 결제로만 운영한다는 점을 확인했다.\"}]}"},{"slug":"oura","name":"Oura","one_liner":"손가락에 끼는 반지가 자는 동안 심박과 체온과 호흡을 재고, 그 값을 읽어 주는 앱은 반지값과 별개로 월 구독료를 받는 회사다.","sells_to":"mixed","seen_in":[{"issue":"43","section":7,"headline":"상장 서류를 비공개로 제출한 그 주에 혈압 신호와 야간 호흡, GLP-1 추적을 한꺼번에 붙였고, 필자는 그 가운데 Counsel Health와의 제휴를 가장 눈여겨보면서 Whoop에 이어 기기 회사가 진료를 앱 안으로 들이는 흐름이 생겼다고 짚었다."}],"card":{"problem":"미국에서는 병원에 한 번 가는 데 드는 돈과 시간이 커서, 몸에 변화가 생겨도 그것이 진료를 받을 일인지 판단할 근거를 개인이 스스로 갖기 어렵다.","solution":"반지가 자는 동안 심박과 체온과 호흡을 재서 수면 점수와 회복 점수로 바꿔 주고, 여기에 심혈관 부담 신호, GLP-1 투약 기록, 앱 안에서 바로 의료진에게 물어보는 창구를 얹었다.","price":"반지는 349달러부터 시작하며, 앱의 기능을 제대로 쓰려면 반지값과 별도로 월 5.99달러 또는 연 69.99달러를 내야 한다. 첫 달은 무료다.","tags":["반지형 웨어러블","수면 추적","월 구독","GLP-1 기록","앱 내 진료"],"headline_traction":"2026년 9월 3일에 상장 서류를 공개 제출했다. 서류에 적힌 2026년 6월까지 9개월 매출은 12억 달러이고 유료 구독 회원은 500만 명이며, 160억 달러가 넘는 기업 가치로 30억 달러를 모으려 한다.","watch":"혈압 기능은 혈압 수치를 재는 것이 아니라 변화 패턴을 알려 주는 웰니스 기능이고, 수면 측정 정확도를 문제 삼은 집단소송이 상장 서류에 위험 요인으로 적혀 있다."},"screenshots":[{"file":"oura_home.png","caption":"Oura 첫 화면이다. 반지 하나로 수면과 활동, 스트레스, 심장 건강을 본다는 것을 전면에 내세운다.","from":"https://ouraring.com/"},{"file":"oura_membership.png","caption":"구독 안내 화면이다. 반지값과 별도로 구독료를 받는다는 것이 여기서 드러난다. 접속 위치를 따라 원화로 표시됐으며 미국 기준 값은 월 5.99달러 또는 연 69.99달러다.","from":"https://ouraring.com/membership"},{"file":"oura_counsel.png","caption":"Counsel Health 제휴 발표 화면이다. 앱 안에서 의료 AI와 면허 의사에게 닿게 한다는 내용이며, 뉴스레터가 가장 눈여겨본 대목이다.","from":"https://ouraring.com/blog/counsel-integration-oura-app/"}],"q":"{\"slug\": \"oura\", \"name\": \"oura\", \"one_liner\": \"손가락에 끼는 반지가 자는 동안 심박과 체온과 호흡을 재고, 그 값을 읽어 주는 앱은 반지값과 별개로 월 구독료를 받는 회사다.\", \"site\": \"https://ouraring.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"43\", \"section\": 7, \"headline\": \"상장 서류를 비공개로 제출한 그 주에 혈압 신호와 야간 호흡, glp-1 추적을 한꺼번에 붙였고, 필자는 그 가운데 counsel health와의 제휴를 가장 눈여겨보면서 whoop에 이어 기기 회사가 진료를 앱 안으로 들이는 흐름이 생겼다고 짚었다.\"}], \"card\": {\"problem\": \"미국에서는 병원에 한 번 가는 데 드는 돈과 시간이 커서, 몸에 변화가 생겨도 그것이 진료를 받을 일인지 판단할 근거를 개인이 스스로 갖기 어렵다.\", \"solution\": \"반지가 자는 동안 심박과 체온과 호흡을 재서 수면 점수와 회복 점수로 바꿔 주고, 여기에 심혈관 부담 신호, glp-1 투약 기록, 앱 안에서 바로 의료진에게 물어보는 창구를 얹었다.\", \"price\": \"반지는 349달러부터 시작하며, 앱의 기능을 제대로 쓰려면 반지값과 별도로 월 5.99달러 또는 연 69.99달러를 내야 한다. 첫 달은 무료다.\", \"tags\": [\"반지형 웨어러블\", \"수면 추적\", \"월 구독\", \"glp-1 기록\", \"앱 내 진료\"], \"headline_traction\": \"2026년 9월 3일에 상장 서류를 공개 제출했다. 서류에 적힌 2026년 6월까지 9개월 매출은 12억 달러이고 유료 구독 회원은 500만 명이며, 160억 달러가 넘는 기업 가치로 30억 달러를 모으려 한다.\", \"watch\": \"혈압 기능은 혈압 수치를 재는 것이 아니라 변화 패턴을 알려 주는 웰니스 기능이고, 수면 측정 정확도를 문제 삼은 집단소송이 상장 서류에 위험 요인으로 적혀 있다.\"}, \"problem\": \"한국에서는 몸이 이상하면 동네 의원에 가서 몇천 원 내고 물어보면 된다. 미국은 진료 한 번에 드는 돈과 예약 대기가 커서, 그 문턱을 넘기 전에 '지금 내 몸이 정상인가'를 스스로 판단해야 하는 구간이 길다. 그런데 개인이 자기 몸에 대해 갖고 있는 자료는 1년에 한 번 받는 검진 결과 한 장뿐이고, 그 사이 364일은 비어 있다. 여기에 최근 몇 년 사이 glp-1 계열 비만 치료제를 쓰는 사람이 급격히 늘면서, 약을 언제 맞았는지, 부작용이 언제 났는지, 몸무게와 수면이 어떻게 변했는지를 따로따로 다른 앱에 적는 문제가 새로 생겼다. oura는 이 빈 구간을 매일 밤 자동으로 채우는 자리를 노린다.\", \"solution\": \"사용자는 티타늄 반지를 사서 손가락에 끼고 잔다. 반지 안쪽의 광학 센서와 체온 센서가 밤새 심박과 심박 변이도, 피부 온도, 호흡을 재고, 아침에 앱을 열면 그 값이 수면 점수, 준비도 점수, 활동 점수라는 세 숫자로 바뀌어 있다. 반지값은 oura ring 4 기준으로 마감재에 따라 349달러에서 499달러이며, 앱의 기능 대부분은 구독을 해야 열린다. 구독료는 미국 기준 월 5.99달러 또는 연 69.99달러이고 첫 달은 무료다. 2026년 5월 28일 발표에서 회사는 여기에 세 가지를 더 붙였는데, 심혈관 부담이 의심되는 패턴을 알려 주는 blood pressure signals, 수면 중 호흡 흐트러짐을 30일 단위로 보여 주는 nighttime breathing, 그리고 glp-1 투약 일정과 부작용과 체중을 한 화면에 모으는 glp-1 insights다. 2026년 6월 16일부터는 앱 안에서 'connect to care'를 누르거나 ai 비서인 oura advisor와 대화하다가 counsel health의 의료 ai로 넘어갈 수 있게 했고, 여기서 더 나아가 면허 의사의 진료로 이어지면 그 비용은 구독료와 별개로 따로 낸다.\", \"features\": [{\"name\": \"반지형 야간 측정\", \"detail\": \"손가락에 끼는 반지가 심박, 심박 변이도, 피부 온도, 호흡을 잠자는 동안 잰다. 회사는 50가지가 넘는 건강 지표를 본다고 밝히고 있다.\"}, {\"name\": \"세 가지 점수\", \"detail\": \"측정값을 수면 점수, 준비도 점수, 활동 점수라는 세 숫자로 바꿔서 아침마다 보여 준다. 숫자를 읽는 데 의학 지식이 필요하지 않게 만든 것이 핵심이다.\"}, {\"name\": \"health radar\", \"detail\": \"심혈관과 호흡 신호를 배경에서 계속 훑다가 눈여겨볼 만한 패턴이 나올 때만 알려 주는 층이다. 기존의 symptom radar에 blood pressure signals와 nighttime breathing이 더해졌다. 2026년 7월까지 미국, 아랍에미리트, 인도의 gen3 이상 사용자에게 순차 적용됐다.\"}, {\"name\": \"glp-1 insights\", \"detail\": \"비만 치료제 투약 일정과 복용 알림, 메스꺼움이나 피로 같은 부작용, 체중 변화를 앱 한 곳에 적게 하고 수면과 활동, 회복 지표와 나란히 놓고 보여 준다. 2026년 6월부터 미국, 아랍에미리트, 인도에서 순차 적용됐다.\"}, {\"name\": \"counsel health 연동\", \"detail\": \"앱 안에서 의료 ai와 대화하고 필요하면 면허 의사에게 넘어가는 창구다. 의료 ai 대화는 구독료에 포함되고 의사 진료와 치료는 별도 비용이다. 2026년 6월 16일부터 미국 43개 주에서 열렸으며, 아칸소, 워싱턴 d.c., 캔자스, 미시시피, 로드아일랜드, 워싱턴, 웨스트버지니아, 위스콘신은 빠졌다.\"}, {\"name\": \"oura advisor\", \"detail\": \"구독에 포함된 ai 건강 비서다. 사용자의 측정값을 근거로 대화하며, counsel health로 넘어가는 입구 노릇도 한다.\"}, {\"name\": \"health panels와 검사지 업로드\", \"detail\": \"혈액 검사를 붙여 파는 상품이며 회사는 99달러로 안내한다. 다른 곳에서 받은 검사 결과지를 pdf로 올려 앱 안에 함께 두는 기능도 2026년 5월에 추가됐다.\"}, {\"name\": \"live activity tracking\", \"detail\": \"앱에서 운동을 시작하면 속도와 거리, 심박을 실시간으로 보여 주고 잠금화면 위젯에도 띄운다. 2026년 6월 4일부터 전 세계에 적용됐다.\"}, {\"name\": \"fsa와 hsa 결제\", \"detail\": \"미국의 세제 혜택 의료비 계좌로 반지와 구독, 혈액 검사를 결제할 수 있다. 소비자가 실제로 내는 부담을 낮추는 장치다.\"}, {\"name\": \"기업과 기관 대상 판매\", \"detail\": \"고용주, 보험사, 병원, 연구기관, 군과 소방 조직에 반지와 앱, 관리자용 분석 화면을 묶어서 판다. 소개 페이지에 eli lilly, amazon, mayo clinic, quest diagnostics, google, american express, maven clinic, essence healthcare의 이름이 올라 있으며 값은 공개하지 않는다.\"}], \"differentiator\": \"whoop은 기기값을 받지 않고 구독만 받는 대신 손목에 차야 하고, apple watch와 samsung galaxy ring은 기기를 사면 구독 없이 쓸 수 있다. oura는 반지를 349달러에 팔면서 구독료를 또 받는 쪽인데, 이 구조를 유지한 채 구독 회원 500만 명과 12개월 유지율 85퍼센트를 상장 서류에 적어 냈다는 점이 다르다. 기능만 보면 수면과 회복을 재는 일 자체는 위 회사들과 크게 다르지 않고, 앱 안에 임상의 접근을 넣은 것도 whoop이 먼저 했다. 실제로 갈리는 대목은 특허 쪽인데, oura는 2025년에 미국 국제무역위원회에서 ultrahuman과 ringconn을 상대로 이겨서 두 회사 반지의 미국 수입과 판매를 막았고 ringconn과는 별도로 로열티를 받는 라이선스 계약을 맺었다.\", \"team\": [{\"name\": \"tom hale\", \"role\": \"최고경영자\", \"background\": \"설문 회사 momentive 사장으로 2018년 상장을 이끌었고, 그 전에는 homeaway 최고운영책임자와 linden lab 최고제품책임자를 지냈으며 macromedia와 adobe에서도 임원을 지냈다.\"}, {\"name\": \"sean brecker\", \"role\": \"최고재무책임자\", \"background\": \"명상 앱 headspace에서 10년 가까이 일하며 최고경영자와 최고재무책임자를 지냈고 ginger와의 30억 달러 규모 합병을 설계했다. 그 전에는 j.p. morgan, lehman brothers, citigroup에서 15년간 트레이더로 일했다.\"}, {\"name\": \"ricky bloomfield\", \"role\": \"최고의료책임자\", \"background\": \"apple에서 임상 정보 부문을 이끌었고 duke university health system에서 모바일 기술 전략 디렉터를 지냈으며, duke와 stanford 아동병원에서 소아과 입원전담의로 진료했다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"시리즈 d로 2억 달러를 받았고 기업 가치는 52억 달러가 됐다. fidelity와 dexcom이 투자자로 들어왔다.\", \"when\": \"2024-12\", \"source\": \"oura 뉴스룸 보도자료, techcrunch\"}, {\"type\": \"revenue\", \"detail\": \"누적 반지 판매 550만 개를 넘겼고 2년 연속 매출이 두 배가 됐다고 밝혔다.\", \"when\": \"2025-09\", \"source\": \"oura 뉴스룸 보도자료. 회사가 스스로 낸 수치다.\"}, {\"type\": \"regulatory\", \"detail\": \"미국 국제무역위원회가 ultrahuman과 ringconn의 스마트 반지에 대해 미국 수입과 판매를 막는 명령을 확정했다. oura가 제기한 특허 침해 사건에서 이긴 결과다.\", \"when\": \"2025-10\", \"source\": \"oura 블로그, oura 뉴스룸\"}, {\"type\": \"funding\", \"detail\": \"fidelity가 주도한 라운드로 9억 달러가 넘는 돈을 받았다. 보도에 따르면 기업 가치는 110억 달러였다.\", \"when\": \"2025-10\", \"source\": \"oura 뉴스룸 보도자료, techcrunch\"}, {\"type\": \"customers\", \"detail\": \"유료 구독 회원이 이번 분기에 500만 명을 넘길 예정이며 지난 2년 동안 4배 넘게 늘었다고 밝혔다. cnbc disruptor 50에 4년 연속 이름을 올렸다.\", \"when\": \"2026-05\", \"source\": \"oura 뉴스룸 보도자료. 회원 수는 회사가 스스로 낸 수치다.\"}, {\"type\": \"regulatory\", \"detail\": \"상장 신고 서류인 s-1 초안을 미국 증권거래위원회에 비공개로 제출했다고 발표했다. 뉴스레터 43회차가 다룬 대목이 이것이다.\", \"when\": \"2026-05\", \"source\": \"oura 뉴스룸 보도자료(2026년 5월 21일)\"}, {\"type\": \"partnership\", \"detail\": \"counsel health와 제휴해 앱 안에서 의료 ai 대화와 면허 의사 진료에 닿는 통로를 열었다. 미국 43개 주에서 쓸 수 있다.\", \"when\": \"2026-06\", \"source\": \"oura 블로그(2026년 6월 8일 게시, 6월 16일 적용 시작)\"}, {\"type\": \"funding\", \"detail\": \"제약사 eli lilly가 지분 투자를 했다고 발표했다. 금액과 기업 가치는 공개하지 않았으며, 회사는 이미 10만 명이 넘는 회원이 앱에 glp-1 사용을 기록했다고 밝혔다.\", \"when\": \"2026-07\", \"source\": \"oura 블로그(2026년 7월 15일). 금액 비공개다.\"}, {\"type\": \"funding\", \"detail\": \"상장 서류를 공개 제출했다. 2026년 6월까지 9개월 매출이 12억 달러로 전년 같은 기간 6억 9,700만 달러에서 늘었고, 회사는 2026년 연간 매출을 약 20억 달러로 내다봤다. 유료 구독 회원 500만 명, 최근 1년 반지 판매 360만 개, 12개월 구독 유지율 85퍼센트가 적혀 있다. 160억 달러가 넘는 기업 가치로 30억 달러를 모으는 것이 목표다.\", \"when\": \"2026-09\", \"source\": \"techcrunch(2026년 9월 3일)가 전한 s-1 내용\"}], \"caveats\": \"매출과 회원 수의 출처를 나눠서 볼 필요가 있다. 550만 개 판매와 매출 2배 성장, 회원 500만 명은 회사가 보도자료로 낸 수치이고 제삼자가 검증한 것이 아니다. 반면 2026년 9월 상장 서류에 실린 9개월 매출 12억 달러와 유지율 85퍼센트는 증권 당국에 내는 문서에 적힌 숫자여서 성격이 다르다. 기능 이름도 그대로 믿으면 안 된다. blood pressure signals는 혈압 수치를 재는 기능이 아니라 심혈관 부담이 의심되는 변화 패턴을 알려 주는 웰니스 기능이며, 회사는 이것을 의료기기로 소개하지 않고 임신 중인 회원에게는 자동으로 꺼 둔다. 뉴스레터가 '혈압 측정'이라고 옮긴 대목이 여기에 해당하므로 그대로 인용하면 과장이 된다. 마지막으로 상장 서류에는 수면 측정 정확도를 두고 소비자를 오도했다는 집단소송이 위험 요인으로 적혀 있는데, 소장은 이 반지의 수면 단계 판정이 ai 추정값에 기대고 있다고 주장한다.\", \"for_us\": \"이번에 oura가 붙인 것 가운데 기기가 필요한 것과 필요 없는 것을 갈라 보면 우리가 할 수 있는 자리가 나온다. blood pressure signals와 nighttime breathing은 반지의 광학 센서가 있어야 하므로 3개월 안에 소프트웨어 인력만으로는 불가능하고 애초에 제외해야 한다. 반대로 glp-1 insights는 센서가 아니라 기록과 배치의 문제다. 사용자가 주사 맞은 날과 부작용을 직접 적게 하고, 그것을 우리가 이미 갖고 있는 걸음 수와 체중 변화 옆에 나란히 놓아 투약 전후를 대조해 보여 주는 화면은 앱 안에서 만들 수 있다. oura가 밝힌 대로 이미 10만 명 넘는 회원이 glp-1 사용을 기록했고 제약사가 그 이유로 지분 투자를 했다는 사실이, 이 기록 자체에 값이 붙는다는 근거가 된다. counsel health 연동도 참고할 만한데, 여기서 배울 점은 진료를 붙였다는 사실보다 값을 나눈 방식이다. ai와 대화하는 데까지는 구독료에 포함시켜 문턱을 없애고 사람 의사로 넘어갈 때만 따로 받는데, 무료 구간에서 사용자가 자기 데이터를 들고 질문하게 만드는 이 구조는 우리 앱에도 그대로 옮길 수 있다. 다만 미국 43개 주라는 표현이 말해 주듯 진료는 주별 면허 규제에 걸리므로, 우리가 직접 할 수 있는 것은 진료가 아니라 질문을 받아 데이터를 근거로 답해 주는 창구까지다.\", \"screenshots\": [{\"file\": \"oura_home.png\", \"caption\": \"oura 첫 화면이다. 반지 하나로 수면과 활동, 스트레스, 심장 건강을 본다는 것을 전면에 내세운다.\", \"from\": \"https://ouraring.com/\"}, {\"file\": \"oura_membership.png\", \"caption\": \"구독 안내 화면이다. 반지값과 별도로 구독료를 받는다는 것이 여기서 드러난다. 접속 위치를 따라 원화로 표시됐으며 미국 기준 값은 월 5.99달러 또는 연 69.99달러다.\", \"from\": \"https://ouraring.com/membership\"}, {\"file\": \"oura_counsel.png\", \"caption\": \"counsel health 제휴 발표 화면이다. 앱 안에서 의료 ai와 면허 의사에게 닿게 한다는 내용이며, 뉴스레터가 가장 눈여겨본 대목이다.\", \"from\": \"https://ouraring.com/blog/counsel-integration-oura-app/\"}, {\"file\": \"oura_ios.png\", \"caption\": \"미국 앱스토어의 oura 앱 페이지다. 앱 자체는 무료로 내려받고 별점은 4.9에 평가 수는 29만 건이 넘는다.\", \"from\": \"https://apps.apple.com/us/app/oura/id1043837948\"}], \"sources\": [{\"title\": \"oura 공식 사이트 첫 화면\", \"url\": \"https://ouraring.com/\", \"note\": \"무엇을 파는 회사인지, 어떤 지표를 재는지 확인했다.\"}, {\"title\": \"oura membership 안내\", \"url\": \"https://ouraring.com/membership\", \"note\": \"구독료가 월 5.99달러, 연 69.99달러이고 첫 달이 무료라는 것, 구독하지 않으면 기능이 크게 제한된다는 것을 확인했다.\"}, {\"title\": \"oura 반지 제품 페이지\", \"url\": \"https://ouraring.com/product/rings\", \"note\": \"모델 비교표에서 oura ring 4의 값이 349달러에서 499달러, 세라믹 모델이 499달러임을 확인했다. oura ring 5의 값은 확인하지 못했다.\"}, {\"title\": \"새 소프트웨어 기능 발표\", \"url\": \"https://ouraring.com/blog/new-software-features/\", \"note\": \"2026년 5월 28일 발표다. health radar, glp-1 insights, counsel health, live activity tracking, 검사지 업로드의 내용과 적용 시점, 대상 국가를 확인했다.\"}, {\"title\": \"health radar 소개\", \"url\": \"https://ouraring.com/blog/introducing-health-radar/\", \"note\": \"blood pressure signals가 혈압 수치가 아니라 변화 패턴을 알리는 기능이라는 것, 임신 중에는 자동으로 꺼진다는 것을 확인했다.\"}, {\"title\": \"glp-1 insights 소개\", \"url\": \"https://ouraring.com/blog/glp-1-insights/\", \"note\": \"무엇을 기록하고 무엇을 보여 주는지, 반지가 필요한지, 어느 나라에서 쓸 수 있는지 확인했다.\"}, {\"title\": \"counsel health 제휴 발표\", \"url\": \"https://ouraring.com/blog/counsel-integration-oura-app/\", \"note\": \"2026년 6월 16일부터 미국 43개 주에서 열린다는 것, 의료 ai는 구독에 포함되고 의사 진료는 별도 비용이라는 것을 확인했다.\"}, {\"title\": \"eli lilly 지분 투자 발표\", \"url\": \"https://ouraring.com/blog/lilly-equity-investment/\", \"note\": \"2026년 7월 15일 발표이며 금액은 공개하지 않았다. 10만 명 넘는 회원이 glp-1 사용을 기록했다는 수치를 확인했다.\"}, {\"title\": \"oura 뉴스룸\", \"url\": \"https://ouraring.com/newsroom\", \"note\": \"2026년 5월 21일 상장 서류 비공개 제출, 5월 20일 유료 회원 500만 명, 2025년 10월 14일 9억 달러 조달, 2025년 9월 22일 반지 550만 개 판매와 매출 2배 성장, 2024년 12월 19일 시리즈 d 2억 달러를 확인했다.\"}, {\"title\": \"국제무역위원회 특허 사건 설명\", \"url\": \"https://ouraring.com/blog/oura-itc-case/\", \"note\": \"ultrahuman과 ringconn을 상대로 한 사건의 경과와 2025년 10월 21일 확정을 확인했다. 회사가 자기 입장에서 쓴 글이다.\"}, {\"title\": \"oura for organizations\", \"url\": \"https://organizations.ouraring.com/\", \"note\": \"고용주, 보험사, 병원, 연구기관, 군에 판다는 것과 고객사 이름을 확인했다. 값은 공개하지 않는다.\"}, {\"title\": \"fsa와 hsa 결제 안내\", \"url\": \"https://ouraring.com/blog/oura-ring-fsa-hsa-eligibility/\", \"note\": \"세제 혜택 의료비 계좌로 결제할 수 있는 항목과 health panels 값 99달러를 확인했다.\"}, {\"title\": \"oura 경영진 소개\", \"url\": \"https://ouraring.com/leadership\", \"note\": \"tom hale, sean brecker, ricky bloomfield의 직함과 이전 경력을 확인했다.\"}, {\"title\": \"oura files to go public (techcrunch)\", \"url\": \"https://techcrunch.com/2026/09/03/oura-files-to-go-public/\", \"note\": \"공개 제출된 상장 서류의 매출, 회원 수, 유지율, 목표 기업 가치와 집단소송 위험 요인을 확인했다.\"}, {\"title\": \"oura 태그 기사 목록 (techcrunch)\", \"url\": \"https://techcrunch.com/tag/oura/\", \"note\": \"2024년부터 2026년까지의 투자 라운드와 기업 가치, 상장 관련 보도 흐름을 확인했다.\"}, {\"title\": \"미국 앱스토어 oura 앱\", \"url\": \"https://apps.apple.com/us/app/oura/id1043837948\", \"note\": \"앱이 무료이고 별점 4.86에 평가 29만 4천 건임을 확인했다. 구글 플레이에도 같은 앱이 있고 별점은 4.7이다.\"}]}"},{"slug":"ro","name":"Ro","one_liner":"온라인 문진으로 비만 치료제 처방을 받아 집으로 배송받게 해 주는 소비자 직접 구매 서비스이며, 약값은 제약사 공식 현금가와 똑같이 받고 관리 서비스를 월 회비로 따로 판다.","sells_to":"consumer","seen_in":[{"issue":"04","section":7,"headline":"먹는 Wegovy가 미국 소비자 채널로 한꺼번에 풀린 날 Ro가 첫날 판매 채널에 이름을 올렸고, 필자는 이런 채널이 2026년 성장의 수혜자가 될 것으로 봤다."},{"issue":"10","section":5,"headline":"공보험 시장이 조여드는 주에 Ro는 슈퍼볼 광고 하나에 총비용 1,500만 달러 이상을 쓴다고 밝혔고, 필자는 이 대비를 소비자 직접 결제 시장의 크기를 보여 주는 신호로 읽었다."},{"issue":"14","section":31,"headline":"값싼 복제 형태의 비만 치료제를 팔던 Hims가 밀려나고 제약사와 손잡은 Ro가 그 자리를 잇는 구도를 WSJ 기사가 그렸다."}],"card":{"problem":"미국에는 전국민 건강보험이 없어서 비만 치료제는 보험이 거절하면 한 달 약값이 1,000달러를 넘고, 보험이 있어도 사전 승인을 받아 내는 절차가 따로 남는다.","solution":"온라인 문진만으로 처방을 받아 약을 집으로 배송하고, 약값은 제약사 공식 현금가와 같게 받는 대신 부작용 관리와 기록, 코칭을 월 회비로 판다.","price":"먹는 Wegovy 기준으로 약값이 월 149달러이고, 여기에 Ro 회비가 따로 붙는다. 회비는 첫 달 39달러, 이후 12개월 선결제 기준 월 74달러다.","tags":["원격진료","약 배송","비만 치료제","현금 결제","월 회비"],"headline_traction":"먹는 Wegovy가 미국에 나온 2026년 1월 5일 첫날부터 판매 채널로 들어갔고, 4월에는 Eli Lilly의 먹는 약 Foundayo도 출시 직후 받았다.","watch":"회원 300만 명과 만족도 95%는 회사가 스스로 낸 수치이고, 매출은 공개되지 않는다. 약값 자체는 제약사 공식 현금가와 같아서 회사가 버는 자리는 회비뿐이다."},"screenshots":[{"file":"ro_home.png","caption":"첫 화면이다. Healthier on Ro라는 문구와 Serena Williams를 앞세우고, 오른쪽에 보험이 필요 없고 전 과정이 온라인이며 배송이 무료라는 네 줄을 걸어 두었다. 아래에는 무료 보험 확인과 TrumpRx 가격으로 GLP-1을 받는 진입 카드가 나란히 있다. 회사 사이트가 자동 접속을 막고 있어 인터넷 아카이브에 보관된 2026년 8월 30일 기록을 찍었다.","from":"https://web.archive.org/web/2026/https://ro.co/"},{"file":"ro_glp1.png","caption":"첫 화면을 내리면 나오는 비만 치료제 목록이다. 먹는 Wegovy, Zepbound KwikPen, 먹는 Foundayo, Wegovy 주사 펜이 재고 표시와 함께 놓여 있어, 이 회사가 제약사 정품을 출시 순서대로 받아 오는 채널임을 보여 준다.","from":"https://web.archive.org/web/2026/https://ro.co/"},{"file":"ro_membership.png","caption":"비만 상품 페이지에서 회비로 무엇을 사는지 적어 둔 대목이다. 보험 담당 창구, 무제한 의료진 메시지, 부작용 관리와 증량 지원, 체중과 투약 기록, 1대1 코칭이 회비에 들어간다. 약값과 회비를 나눠 받는 구조가 여기서 드러난다.","from":"https://web.archive.org/web/2026/https://ro.co/weight-loss/"}],"q":"{\"slug\": \"ro\", \"name\": \"ro\", \"one_liner\": \"온라인 문진으로 비만 치료제 처방을 받아 집으로 배송받게 해 주는 소비자 직접 구매 서비스이며, 약값은 제약사 공식 현금가와 똑같이 받고 관리 서비스를 월 회비로 따로 판다.\", \"site\": \"https://ro.co\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"04\", \"section\": 7, \"headline\": \"먹는 wegovy가 미국 소비자 채널로 한꺼번에 풀린 날 ro가 첫날 판매 채널에 이름을 올렸고, 필자는 이런 채널이 2026년 성장의 수혜자가 될 것으로 봤다.\"}, {\"issue\": \"10\", \"section\": 5, \"headline\": \"공보험 시장이 조여드는 주에 ro는 슈퍼볼 광고 하나에 총비용 1,500만 달러 이상을 쓴다고 밝혔고, 필자는 이 대비를 소비자 직접 결제 시장의 크기를 보여 주는 신호로 읽었다.\"}, {\"issue\": \"14\", \"section\": 31, \"headline\": \"값싼 복제 형태의 비만 치료제를 팔던 hims가 밀려나고 제약사와 손잡은 ro가 그 자리를 잇는 구도를 wsj 기사가 그렸다.\"}], \"card\": {\"problem\": \"미국에는 전국민 건강보험이 없어서 비만 치료제는 보험이 거절하면 한 달 약값이 1,000달러를 넘고, 보험이 있어도 사전 승인을 받아 내는 절차가 따로 남는다.\", \"solution\": \"온라인 문진만으로 처방을 받아 약을 집으로 배송하고, 약값은 제약사 공식 현금가와 같게 받는 대신 부작용 관리와 기록, 코칭을 월 회비로 판다.\", \"price\": \"먹는 wegovy 기준으로 약값이 월 149달러이고, 여기에 ro 회비가 따로 붙는다. 회비는 첫 달 39달러, 이후 12개월 선결제 기준 월 74달러다.\", \"tags\": [\"원격진료\", \"약 배송\", \"비만 치료제\", \"현금 결제\", \"월 회비\"], \"headline_traction\": \"먹는 wegovy가 미국에 나온 2026년 1월 5일 첫날부터 판매 채널로 들어갔고, 4월에는 eli lilly의 먹는 약 foundayo도 출시 직후 받았다.\", \"watch\": \"회원 300만 명과 만족도 95%는 회사가 스스로 낸 수치이고, 매출은 공개되지 않는다. 약값 자체는 제약사 공식 현금가와 같아서 회사가 버는 자리는 회비뿐이다.\"}, \"problem\": \"한국에서는 건강보험이 있어서 의사를 만나는 일 자체가 싸고 빠르지만, 미국에서는 비만 치료제를 쓰려는 사람이 두 가지 벽을 따로 넘어야 한다. 첫째는 값이다. 주사형 비만 치료제의 정가는 cnbc 보도 기준으로 한 달 약 1,000달러 수준이고, 고용주 보험이 이 약을 보장 범위에서 빼는 흐름이 이어지고 있어 자기 돈으로 사야 하는 사람이 늘고 있다. 둘째는 절차다. 보험이 있어도 사전 승인을 받아 내야 하고, 그 과정에서 보험사에 전화를 걸고 서류를 맞추는 일은 환자 몫으로 남는다. 여기에 2025년부터 제약사들이 보험을 거치지 않고 소비자에게 직접 파는 현금가 채널을 열면서, 문제의 성격이 바뀌었다. 약을 구할 수 있느냐에서, 어디서 사고 쓰는 동안 누가 봐 주느냐로 옮겨 간 것이다.\", \"solution\": \"사용자는 ro.co에서 온라인 문진에 답하는 것으로 시작한다. 회사 설명 기준으로 자격 판정까지 이틀쯤 걸리고, 현금으로 살 경우 일주일 안에 처방이 나와 약이 집으로 온다. 보험을 쓰겠다고 하면 ro가 보험사에 대신 연락해 사전 승인을 처리하는데 2주에서 3주가 걸리고, 이 경우 약은 동네 약국에서 받는다. 값은 두 갈래로 나뉜다. 약값은 먹는 wegovy와 foundayo가 월 149달러, wegovy 주사 펜이 월 199달러, zepbound kwikpen이 월 299달러부터이며, 회사는 이 값이 novocare, lillydirect, trumprx의 현금가와 같다고 밝힌다. 여기에 ro body 회비가 따로 붙는데 첫 달 39달러이고, 그 뒤로는 12개월 선결제면 월 74달러, 6개월 89달러, 3개월 99달러, 달마다 내면 149달러다. 회비로 사는 것은 약이 아니라 관리이며, 24시간 의료진 메시지, 부작용 관리와 용량 증량 지원, 체중과 투약 기록, 1대1 코칭, 보험 담당 창구가 여기에 들어간다.\", \"features\": [{\"name\": \"무료 glp-1 보험 확인\", \"detail\": \"ro가 사용자를 대신해 보험사에 연락해 그 약이 보장되는지, 본인부담금이 얼마인지, 사전 승인이 필요한지를 정리한 리포트를 준다. 값을 받지 않고, 치료를 시작하면 50달러 크레딧을 얹어 준다.\"}, {\"name\": \"ro body 회비 멤버십\", \"detail\": \"약값과 별개로 받는 월 회비다. 24시간 의료진 메시지, 부작용 관리와 증량 지원, 체중과 투약 기록, 1대1 코칭, 보험 담당 창구가 포함된다.\"}, {\"name\": \"제약사 공식 현금가 그대로\", \"detail\": \"회사는 자기가 파는 현금가가 novocare, lillydirect, 그리고 정부가 연 trumprx의 값과 같다고 값 안내 페이지에 적어 두었다. 약값에 마진을 얹지 않는다는 뜻이며, 첫 화면에도 trumprx 가격으로 glp-1을 받는 진입 카드가 걸려 있다.\"}, {\"name\": \"선결제 할인\", \"detail\": \"3개월, 6개월, 12개월 선결제를 고르면 회비가 내려간다. 회사는 2026년 3월 발표에서 이 방식으로 wegovy 주사 펜은 연 1,200달러까지, 먹는 wegovy는 연 600달러까지 아낄 수 있다고 밝혔다.\"}, {\"name\": \"먹는 약 우선 취급\", \"detail\": \"먹는 wegovy는 미국 출시 첫날인 2026년 1월 5일부터, eli lilly의 먹는 약 foundayo는 2026년 4월 9일부터 취급했다. 주삿바늘 때문에 시작하지 못하던 사람을 겨냥한 상품군이다.\"}, {\"name\": \"비만 밖의 다른 상품군\", \"detail\": \"성 건강, 탈모, 피부, 난임을 함께 판다. 정자 채취와 보관 신청 페이지가 따로 있을 만큼 난임 쪽 상품도 살아 있다.\"}, {\"name\": \"자체 조제 상품\", \"detail\": \"ro sparks와 daily rise gummies는 ro에서만 파는 조제 의약품이며, fda 승인을 받은 약이 아니라는 표기가 첫 화면에 함께 붙어 있다.\"}, {\"name\": \"아이폰 전용 앱\", \"detail\": \"앱은 계정을 웹에서 만든 뒤 로그인해서 쓰는 보조 창구다. 주문 추적, 치료 진행 안내, 무료 보험 확인이 들어 있으며, 아이패드 없이 아이폰만 지원한다.\"}], \"differentiator\": \"약값만 놓고 보면 다를 것이 없다. 먹는 wegovy는 2026년 1월 5일 같은 날 ro와 lifemd, weight watchers, goodrx, 그리고 제약사가 직접 운영하는 novocare 약국으로 한꺼번에 풀렸고, ro는 자기 현금가가 novocare와 lillydirect, trumprx와 같다고 스스로 밝힌다. 그래서 경쟁은 약값이 아니라 회비와 관계에서 벌어진다. 가장 큰 경쟁자인 hims & hers는 값싼 조제 형태의 약을 직접 만들어 파는 쪽으로 갔다가 2026년 2월 먹는 조제약 판매 계획을 규제 반발 끝에 접었고, 회비도 첫 달 39달러 뒤 월 149달러로 ro보다 비싸다. ro는 반대로 제약사와 붙어 정품을 첫날부터 받아 오고 회비를 깎는 쪽을 골랐으며, 2026년 4월 회비를 약 145달러에서 74달러 수준으로 내려 이 경쟁을 먼저 걸었다. 무료 보험 확인 서비스처럼 결제 전에 답을 주는 도구를 앞에 세운 점도 같은 채널 회사들과 갈리는 대목이다.\", \"team\": [{\"name\": \"zachariah reitano\", \"role\": \"공동 창업자 겸 ceo\", \"background\": \"2026년 회사 보도자료에 공동 창업자 겸 ceo로 계속 이름이 나온다. 창업 전 경력은 확인하지 못했다.\"}, {\"name\": \"saman rahmanian\", \"role\": \"공동 창업자\", \"background\": \"회사 창업자 편지에 세 명 가운데 한 사람으로 서명돼 있다. 현재 직함과 창업 전 경력은 확인하지 못했다.\"}, {\"name\": \"rob schutz\", \"role\": \"공동 창업자\", \"background\": \"회사 창업자 편지에 세 명 가운데 한 사람으로 서명돼 있다. 현재 직함과 창업 전 경력은 확인하지 못했다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"시리즈 c로 2억 달러를 받았고 기업 가치는 15억 달러로 평가됐다.\", \"when\": \"2020-07\", \"source\": \"cnbc 보도\"}, {\"type\": \"funding\", \"detail\": \"시리즈 d로 5억 달러를 받았고 기업 가치는 50억 달러로 평가됐다.\", \"when\": \"2021-03\", \"source\": \"business insider 보도, 영어 위키백과\"}, {\"type\": \"funding\", \"detail\": \"기존 투자자들이 참여한 1억 5,000만 달러 라운드를 받으면서 피부과 상품을 열었다.\", \"when\": \"2022-02\", \"source\": \"fierce healthcare 보도\"}, {\"type\": \"partnership\", \"detail\": \"여성 건강 스타트업 modern fertility를 2억 2,500만 달러 규모로 인수했다.\", \"when\": \"2021-05\", \"source\": \"fierce healthcare 보도\"}, {\"type\": \"partnership\", \"detail\": \"novo nordisk의 novocare 약국과 직접 연동해, 보험을 거치지 않는 현금가로 wegovy를 파는 경로를 열었다.\", \"when\": \"2025-04\", \"source\": \"회사 보도자료. 같은 시기 abc news가 ro와 hims, lifemd가 함께 이 경로에 들어갔다고 보도했다.\"}, {\"type\": \"partnership\", \"detail\": \"먹는 wegovy가 미국에 출시된 첫날부터 판매 채널로 들어갔다. 같은 날 cvs와 costco를 포함한 7만 곳이 넘는 약국, lifemd, weight watchers, goodrx에도 함께 풀렸다.\", \"when\": \"2026-01\", \"source\": \"회사 보도자료(2026년 1월 5일), cnbc 보도\"}, {\"type\": \"partnership\", \"detail\": \"amgen과 glp-1 실사용 경험을 연구하는 협업을 발표했다. 보험 보장 장벽과 사전 승인 흐름을 함께 들여다보는 내용이다.\", \"when\": \"2026-01\", \"source\": \"회사 보도자료(2026년 1월 13일)\"}, {\"type\": \"partnership\", \"detail\": \"eli lilly의 먹는 glp-1인 foundayo를 최저 용량 기준 월 149달러부터 취급하기 시작했다. fda 승인은 2026년 4월 1일이었다.\", \"when\": \"2026-04\", \"source\": \"회사 보도자료(2026년 4월 9일), eli lilly의 승인 발표\"}, {\"type\": \"customers\", \"detail\": \"회원이 300만 명을 넘었다고 밝히고 있다.\", \"when\": \"2026-09\", \"source\": \"회사 첫 화면과 앱스토어 소개 화면. 제삼자가 확인한 수치가 아니다.\"}, {\"type\": \"customers\", \"detail\": \"200만 명이 넘는 사람의 보험 보장 여부를 대신 확인해 줬다고 밝히고 있다.\", \"when\": \"2026-01\", \"source\": \"회사 보도자료의 회사 소개 문단. 제삼자가 확인한 수치가 아니다.\"}, {\"type\": \"traffic\", \"detail\": \"serena williams를 내세운 첫 슈퍼볼 광고를 집행했다. 뉴스레터 10회차는 ro가 광고 하나에 총비용 1,500만 달러 이상을 쓴다고 밝혔다고 전한다.\", \"when\": \"2026-02\", \"source\": \"회사 보도자료(2026년 1월 28일), variety 보도, health tech nerds 10회차\"}, {\"type\": \"traffic\", \"detail\": \"미국 아이폰 앱스토어 의료 부문에서 23위이며, 평점은 4.8, 평가 수는 11,485개다. 앱은 2022년 5월에 나왔다.\", \"when\": \"2026-09\", \"source\": \"미국 앱스토어 페이지를 직접 확인\"}], \"caveats\": \"규모를 보여 주는 수치는 대부분 회사가 스스로 낸 것이다. 회원 300만 명, 만족도 95%, 보험 확인 200만 건이 모두 여기에 해당하며 제삼자가 확인한 것이 아니다. 매출은 공개되지 않는다. 효과 수치도 두 종류를 구분해서 봐야 한다. 비만 상품 페이지에 크게 걸린 20%라는 감량 수치는 ro의 실적이 아니라 제약사 임상시험 결과이며, 해당 페이지의 각주에 그렇게 적혀 있다. ro 자체 성적은 2025년 12월에 내놓은 655명, 68주 관찰 결과인 평균 16.6% 감량인데, 이 연구는 회사가 주도하고 자문 의사들과 함께 obesity 저널에 실은 것이므로 동료 심사를 거쳤다는 점과 이해관계가 있다는 점이 함께 있다. 값은 자주 바뀐다. 2026년 4월 23일 회비를 약 145달러에서 74달러 수준으로 내렸고, 2026년 9월 10일에도 다시 회비 인하를 발표했으므로 여기 적힌 값은 확인한 날짜 기준으로만 유효하다. 사업 구조상 주의할 대목도 있다. 약값은 제약사 공식 현금가와 같으므로 회사가 버는 자리는 회비이고, 매출이 처방이 이어지는 동안에만 유지된다. ro sparks와 daily rise gummies는 fda 승인을 받은 약이 아니라 ro에서만 파는 조제 의약품이다. 원격진료로 비만 치료제를 처방하는 방식 자체에 대한 비판도 있다. 시장조사 회사 sermo가 2025년 1월 1차 진료 의사 2,000명에게 물은 조사에서 67%가 제3자 원격진료를 통한 glp-1 처방의 건강 위험을 우려했고, 57%는 환자에게 그런 경로를 쓰지 말라고 조언했다고 답했다. 다만 이 조사는 경쟁 관계에 있는 omada health가 의뢰해 공개한 것이므로 그 점을 감안해야 한다. 규제 위험은 경쟁사 사례에서 드러난다. hims & hers는 2026년 2월 먹는 조제 glp-1을 내놨다가 규제 반발 끝에 판매 계획을 접었다. 창업자 세 사람의 이름은 회사 창업자 편지와 보도자료로 확인했으나, reitano를 뺀 두 사람의 현재 직함과 창업 전 경력은 확인하지 못해 비워 두었다. 마지막으로, 구글 플레이에서는 이 회사의 앱을 찾지 못했다. 앱은 아이폰 전용이고 평가도 1만여 개에 그치므로, 실제 사용은 앱이 아니라 웹에 몰려 있다고 보아야 한다.\", \"for_us\": \"이 회사에서 가져올 것은 약이 아니라 회비가 무엇을 팔고 있는지다. ro body 회비에 들어가는 항목은 24시간 메시지, 부작용 관리와 증량 지원, 체중과 투약 기록, 1대1 코칭인데, 이 가운데 기록과 알림, 코칭 화면은 처방권이나 규제 허가 없이 3개월 안에 소프트웨어로 만들 수 있다. 약을 이미 쓰는 사람이 관리에만 월 74달러에서 149달러를 내고 있다는 사실 자체가 그 자리에 수요가 있다는 증거다. 두 번째로 볼 것은 무료 보험 확인 도구다. 돈을 받기 전에 사용자가 가장 궁금해하는 질문에 먼저 답해 주고 그 자리에서 계정을 만들게 하는 방식인데, 우리 쪽으로 옮기면 검진 수치나 복용 중인 약에 대해 무료로 답을 주는 화면이 같은 역할을 할 수 있다. 세 번째는 이 회사가 앱을 주 창구로 쓰지 않는다는 점이다. 아이폰 전용에 평가가 1만여 개뿐이고 안드로이드 앱은 찾을 수 없었으므로, 약을 파는 회사들이 비워 둔 자리가 매일 여는 기록 앱 쪽에 남아 있다. 반대로 가져오지 말아야 할 것도 분명하다. 처방과 약 배송, 보험 사전 승인 대행은 규제와 물류가 얽혀 있어 3개월과 소프트웨어 인력이라는 조건 밖이고, 약효나 용량에 대한 조언 역시 우리가 말할 수 있는 영역이 아니다. 우리가 다룰 수 있는 것은 복용 여부와 체중, 부작용, 걷기를 사용자가 스스로 적게 하고 그것을 되돌려 보여 주는 데까지다.\", \"screenshots\": [{\"file\": \"ro_home.png\", \"caption\": \"첫 화면이다. healthier on ro라는 문구와 serena williams를 앞세우고, 오른쪽에 보험이 필요 없고 전 과정이 온라인이며 배송이 무료라는 네 줄을 걸어 두었다. 아래에는 무료 보험 확인과 trumprx 가격으로 glp-1을 받는 진입 카드가 나란히 있다. 회사 사이트가 자동 접속을 막고 있어 인터넷 아카이브에 보관된 2026년 8월 30일 기록을 찍었다.\", \"from\": \"https://web.archive.org/web/2026/https://ro.co/\"}, {\"file\": \"ro_glp1.png\", \"caption\": \"첫 화면을 내리면 나오는 비만 치료제 목록이다. 먹는 wegovy, zepbound kwikpen, 먹는 foundayo, wegovy 주사 펜이 재고 표시와 함께 놓여 있어, 이 회사가 제약사 정품을 출시 순서대로 받아 오는 채널임을 보여 준다.\", \"from\": \"https://web.archive.org/web/2026/https://ro.co/\"}, {\"file\": \"ro_membership.png\", \"caption\": \"비만 상품 페이지에서 회비로 무엇을 사는지 적어 둔 대목이다. 보험 담당 창구, 무제한 의료진 메시지, 부작용 관리와 증량 지원, 체중과 투약 기록, 1대1 코칭이 회비에 들어간다. 약값과 회비를 나눠 받는 구조가 여기서 드러난다.\", \"from\": \"https://web.archive.org/web/2026/https://ro.co/weight-loss/\"}, {\"file\": \"ro_ios.png\", \"caption\": \"미국 아이폰 앱스토어 페이지다. 평점 4.8에 평가 11,485개, 의료 부문 23위이며 아이폰 전용이다. 앱 소개 화면에 회원 300만 명이라는 회사 주장이 그대로 실려 있다.\", \"from\": \"https://apps.apple.com/us/app/ro-online-healthcare/id1585858911\"}], \"sources\": [{\"title\": \"ro 공식 사이트 첫 화면\", \"url\": \"https://ro.co\", \"note\": \"회원 300만 명, 만족도 95%, 보험 불필요, 무료 배송이라는 핵심 문구와 비만 치료제별 월 값 표기를 확인했다.\"}, {\"title\": \"ro 비만 상품 값 안내\", \"url\": \"https://ro.co/weight-loss/pricing/\", \"note\": \"회비가 첫 달 39달러이고 이후 12개월 선결제 74달러, 6개월 89달러, 3개월 99달러, 월납 149달러라는 것과, 약값이 novocare와 lillydirect, trumprx의 현금가와 같다는 문구를 확인했다.\"}, {\"title\": \"ro 비만 상품 소개\", \"url\": \"https://ro.co/weight-loss/\", \"note\": \"회비에 포함되는 항목과, 20%라는 감량 수치가 제약사 임상시험 결과라는 각주를 확인했다.\"}, {\"title\": \"ro 먹는 wegovy 상품 페이지\", \"url\": \"https://ro.co/weight-loss/wegovy-pill/\", \"note\": \"문진에서 배송까지의 단계와 각 단계에 걸리는 기간, 보험을 쓸 때와 현금으로 살 때의 경로 차이를 확인했다.\"}, {\"title\": \"ro 무료 glp-1 보험 확인 서비스\", \"url\": \"https://ro.co/weight-loss/glp1-insurance-checker/\", \"note\": \"ro가 보험사에 대신 연락해 보장 여부와 본인부담금을 정리해 주고 50달러 크레딧을 준다는 내용을 확인했다.\"}, {\"title\": \"ro launches wegovy pill through integration with novo nordisk\", \"url\": \"https://ro.co/press/wegovy-pill/\", \"note\": \"2026년 1월 5일 첫날 출시 참여, 2025년 4월 novo nordisk와의 직접 연동, 보험 확인 200만 건이라는 회사 주장을 확인했다.\"}, {\"title\": \"ro helps patients save up to $1,200 per year on wegovy\", \"url\": \"https://ro.co/press/wegovy-savings-options/\", \"note\": \"2026년 3월 31일 발표다. 3개월, 6개월, 12개월 선결제로 주사 펜은 연 1,200달러, 먹는 약은 연 600달러까지 아낄 수 있다는 회사 주장을 확인했다.\"}, {\"title\": \"ro offers eli lilly's foundayo, the newest glp-1 innovation\", \"url\": \"https://ro.co/press/foundayo/\", \"note\": \"2026년 4월 9일 발표다. 최저 용량 기준 월 149달러이며 회비는 별도라는 문구를 확인했다.\"}, {\"title\": \"ro announces research collaboration with amgen\", \"url\": \"https://ro.co/press/amgen-collaboration/\", \"note\": \"2026년 1월 13일 발표다. 보험 보장 장벽과 사전 승인 흐름을 함께 보는 연구 협업이라는 점을 확인했다.\"}, {\"title\": \"new research shows ro helps patients achieve weight loss outcomes consistent with clinical trials\", \"url\": \"https://ro.co/press/68-week-outcomes/\", \"note\": \"2025년 12월 10일 발표다. 655명을 68주 관찰해 평균 16.6% 감량이라는 결과를 obesity 저널에 실었다는 내용과 세부 수치를 확인했다.\"}, {\"title\": \"ro debuts first-ever super bowl commercial starring serena williams\", \"url\": \"https://ro.co/press/super-bowl-2026/\", \"note\": \"2026년 1월 28일 발표다. 광고 비용은 밝히지 않았고, 캠페인 이름과 출연자 발언을 확인했다.\"}, {\"title\": \"lower costs for high-quality care for ro patients\", \"url\": \"https://ro.co/news/multi-month-membership/\", \"note\": \"2026년 9월 10일 발표다. 첫 달 39달러, 이후 연간 플랜 월 74달러, 연 900달러 절감이라는 값과 회비가 약값과 별개라는 문구를 확인했다.\"}, {\"title\": \"ro 창업자 편지\", \"url\": \"https://ro.co/founder-letter/\", \"note\": \"zachariah reitano, saman rahmanian, rob schutz 세 사람이 공동 창업자로 서명한 글이며, 창업 동기를 확인했다.\"}, {\"title\": \"ro 아이폰 앱\", \"url\": \"https://apps.apple.com/us/app/ro-online-healthcare/id1585858911\", \"note\": \"평점 4.8, 평가 11,485개, 의료 부문 23위, 아이폰 전용, 2022년 5월 출시, 판매자가 roman health medical llc라는 것을 확인했다. 구글 플레이와 apk 목록에서는 같은 앱을 찾지 못했다.\"}, {\"title\": \"first glp-1 pill for obesity from novo nordisk launches in the u.s. (cnbc)\", \"url\": \"https://www.cnbc.com/2026/01/05/first-glp-1-pill-for-obesity-from-novo-nordisk-launches-in-the-us.html\", \"note\": \"2026년 1월 5일 출시, 용량별 현금가 149달러에서 299달러, 보험이 있으면 월 25달러까지, 7만 곳이 넘는 약국과 ro를 포함한 원격진료 채널로 동시에 풀렸다는 사실을 확인했다.\"}, {\"title\": \"hims stock slides premarket: rival telehealth firm ro launches aggressive price cuts (stocktwits)\", \"url\": \"https://stocktwits.com/news-articles/markets/equity/hims-stock-slides-premarket-ro-cuts-glp-1-subscription-prices/czbfp2trebh\", \"note\": \"2026년 4월 23일 기사다. ro가 회비를 약 145달러에서 74달러 수준으로 내렸고 hims는 첫 달 39달러 뒤 149달러라는 비교를 확인했다.\"}, {\"title\": \"primary care doctors concerned about patient risks of telehealth glp-1 prescribers (fierce healthcare)\", \"url\": \"https://www.fiercehealthcare.com/providers/primary-care-doctors-concerned-about-patient-risks-telehealth-prescribers-glp-1s-survey\", \"note\": \"1차 진료 의사 2,000명 조사에서 67%가 원격진료 glp-1 처방의 위험을 우려했다는 수치를 확인했다. 조사 의뢰자가 경쟁사 omada health라는 점도 함께 확인했다.\"}, {\"title\": \"digital health startup ro raises $500 million in series d funding (business insider)\", \"url\": \"https://www.businessinsider.com/digital-health-startup-ro-raises-500-million-series-d-2021-3\", \"note\": \"2021년 3월 시리즈 d 5억 달러 조달을 확인했다. 기사 본문은 유료 구독 벽에 막혀 제목과 요약만 확인했다.\"}, {\"title\": \"ro raises $200 million at $1.5 billion valuation (cnbc)\", \"url\": \"https://www.cnbc.com/2020/07/27/ro-raises-200-million-at-1point5-billion-valuation-250-million
