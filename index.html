원에서 처방을 받아야 하고, 허가받지 않은 물질을 개인이 사서 스스로 놓는 시장 자체가 크게 형성되지 않았다. 미국은 사정이 다르다. bpc-157이나 tb-500처럼 회복과 재생을 돕는다고 알려진 펩타이드 상당수가 정식 의약품으로 허가받지 않았고, 그래서 처방으로는 살 수 없다. 대신 연구용이라는 표기를 붙여 파는 온라인 판매처, 메드스파, 조제 약국을 거쳐 유통된다. 이 경로에는 성분과 순도를 검사해 보증하는 주체가 없고, 용량을 정해 주거나 부작용을 지켜보는 의료진도 없다. 소비자는 무엇을 얼마나 맞아야 하는지를 커뮤니티나 지인에게 듣고 스스로 정하는데, fitt insider가 인용한 소비자 조사에서도 구매자 대다수가 의사가 아니라 사회적 입소문을 통해 이 물질을 처음 알게 됐다고 답했다. 같은 조사에서 젊은 층 다수는 의료진의 안내가 있어야만 쓰겠다고 답해, 수요는 이미 커졌는데 그것을 받아 줄 통로가 없는 상태가 드러났다.\", \"solution\": \"회원은 먼저 사고 싶은 제품을 고르고 온라인 문진표를 작성한다. 면허를 가진 의료진이 문진 내용을 검토해 그 사람에게 적절한지 판단하고, 승인한 경우에만 처방을 낸다. 결제는 승인 시점에 이뤄진다. 주문 시점에는 카드에 임시 승인만 걸어 두고, 의료진이 승인하지 않으면 돈을 받지 않는다고 안내한다. 처방이 나오면 계약된 조제 약국이 약을 만들어 집으로 보내고, 회원은 냉장 보관했다가 직접 피하 주사로 놓는다. 사이트에는 손 씻기부터 바이알 준비, 용량 뽑기, 주사 부위 소독, 주사까지 다섯 단계로 나눈 자가 주사 안내와 여러 약을 함께 쓸 때 주삿바늘을 매번 새것으로 바꾸라는 안전 수칙이 붙어 있다. 값은 제품마다 따로 매겨져 있고 2026년 9월 기준 공개된 것은 nad+ 249달러, 세마글루타이드 249달러, 티어제파타이드 299달러, 글루타티온 199달러이며 모두 4주분이다. 실제 진료는 arora health & aesthetics라는 별도 법인이 맡고, 조제와 배송은 휴스턴에 있는 vialsrx가 맡는다고 faq에 적혀 있다.\", \"features\": [{\"name\": \"온라인 문진과 의료진 검토\", \"detail\": \"제품별로 따로 만들어진 문진 화면에서 건강 정보를 받고, 면허 의료진이 이를 검토해 처방 여부를 정한다. 승인되지 않으면 결제가 이뤄지지 않는다.\"}, {\"name\": \"목표별 프로토콜\", \"detail\": \"물질을 낱개로 파는 대신 회복, 운동 수행, 노화 억제 같은 목표에 맞춰 여러 개를 묶은 조합으로 구성한다고 회사가 밝혔다. 시간이 지나면서 조합을 다시 맞춰 주는 것을 내세운다.\"}, {\"name\": \"허가받은 조제 약국을 통한 배송\", \"detail\": \"미국 내 조제 약국 한 곳과만 일한다고 밝히고, 그 약국이 fda와 주 정부의 감독을 받으며 제조 품질 기준을 따른다고 설명한다. 원료 추적, 무균성과 역가 시험을 배치마다 한다고 적어 두었다.\"}, {\"name\": \"자가 주사 안내\", \"detail\": \"제품 페이지마다 주사 방법을 다섯 단계로 나눈 그림 안내, 보관 온도, 부작용, 금기 사항, 즉시 중단하고 연락해야 할 증상을 함께 싣는다.\"}, {\"name\": \"임상 자문단 공개\", \"detail\": \"의사 두 명과 제약 분야 엔지니어 한 명을 임상 및 과학 자문단으로 사이트에 걸어 두었다. 회색시장 판매처와 달리 책임지는 사람 얼굴을 보여 주는 것이 이 회사가 파는 신뢰의 상당 부분이다.\"}, {\"name\": \"회원 전용 포털\", \"detail\": \"portal.theprotocole.com 이라는 별도 주소에서 이메일로 로그인하는 환자용 화면을 둔다. 앱스토어와 구글 플레이에는 이 회사 이름으로 된 앱이 없어서, 회원 화면은 모두 웹으로만 돌아간다.\"}, {\"name\": \"추천을 통한 가입과 월 60달러 멤버십\", \"detail\": \"2026년 6월까지 사이트는 신청을 받아 승인하는 방식이었고, 기존 회원의 확인을 받아야 새 회원이 들어올 수 있다고 밝혔다. 첫 구매는 자유롭게 하되 다시 사려면 월 60달러 멤버십에 들어야 했고, 이 돈에는 세 달에 한 번 프로토콜을 다시 맞추는 상담, 상시 메시지 상담, 빠른 배송이 들어가고 약값은 따로였다. 2026년 9월 현재 사이트에서는 멤버십 메뉴와 신청 절차가 사라지고 제품을 바로 사는 형태로 바뀌었다.\"}, {\"name\": \"준비 중이라고 밝힌 프로그램\", \"detail\": \"athletech news 보도 기준으로 피부 회복에 초점을 맞춘 skin by protocole과 정밀 검사 결과를 반영하는 precision protocols 두 가지를 준비 중이라고 밝혔다. 2026년 9월 현재 사이트에서는 확인되지 않는다.\"}], \"differentiator\": \"같은 문제를 푸는 회사가 이미 여럿이고, 파는 논리도 서로 거의 같다. 2026년 9월 시리즈 라운드로 2,000만 달러를 받은 system은 원료 제조사부터 조제 약국, 의료진까지 공급망을 전부 묶었다고 내세우며 글루타티온, ghk-cu, nad+, 세르모렐린 같은 품목을 판다. superpower는 연 349달러 혈액검사 구독 안에 펩타이드 판매를 붙이려 하고, hims & hers는 이미 가진 원격진료 가입자 기반 위에 같은 상품을 얹으려 한다. protocole이 다르다고 말할 수 있는 대목은 기술이 아니라 진입 방식이었다. 아무나 사게 하지 않고 기존 회원의 확인을 거쳐 들이는 폐쇄형 회원제를 썼다는 점인데, 2026년 9월 현재는 그 장치가 사이트에서 사라지고 누구나 바로 살 수 있는 형태로 바뀌었다. 그래서 지금 기준으로는 경쟁사와 구조적으로 다르지 않다.\", \"team\": [{\"name\": \"delphine le grand\", \"role\": \"공동 창업자\", \"background\": \"롱제비티 분야에서 cindy yan과 함께 일하며 펩타이드 수요가 이를 안전하게 다룰 체계보다 빠르게 커지는 것을 직접 봤다고 회사가 배포한 보도자료에 적혀 있다. 그 이전에 어느 회사에서 무엇을 했는지는 확인하지 못했다.\"}, {\"name\": \"cindy yan\", \"role\": \"공동 창업자\", \"background\": \"delphine le grand과 같은 회사에서 롱제비티 일을 했다고 보도자료에 적혀 있다. 구체적인 이전 경력은 확인하지 못했다.\"}, {\"name\": \"dr. poonam desai\", \"role\": \"임상 및 과학 자문단\", \"background\": \"기능의학과 응급의학 양쪽에서 전문의 자격을 가졌고 weill cornell medicine에서 교수진으로 있었다고 회사 사이트가 소개한다. 회사가 스스로 적은 내용이다.\"}, {\"name\": \"dr. humaira ali\", \"role\": \"임상 및 과학 자문단\", \"background\": \"응급의학과 응급의료체계 전문의이며 의료진 조직과 진료 프로그램 운영 경험이 있다고 회사 사이트가 소개한다. 회사가 스스로 적은 내용이다.\"}, {\"name\": \"nick andrews\", \"role\": \"임상 및 과학 자문단\", \"background\": \"제약과 생명공학 분야에서 20년 넘게 일한 생화학 엔지니어이며 펩타이드 연구와 제형 설계를 10년 넘게 했다고 회사 사이트가 소개한다. 회사가 스스로 적은 내용이다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"rare capital이 이끄는 시드 라운드로 600만 달러를 받았다고 스텔스 해제와 함께 발표했다. rare capital은 투자자 rachel schow가 공동 창업한 곳이다.\", \"when\": \"2026-04\", \"source\": \"fitt insider에 실린 회사 보도자료 전문\"}, {\"type\": \"customers\", \"detail\": \"회원과 시술자, 소개를 통해 수천 명 규모의 대기자 명단을 모았고 성장의 대부분이 입소문에서 나왔다고 밝혔다. 회사가 스스로 낸 수치다.\", \"when\": \"2026-04\", \"source\": \"fitt insider에 실린 회사 보도자료 전문, athletech news 기사\"}, {\"type\": \"partnership\", \"detail\": \"진료는 시애틀에 있는 arora health & aesthetics, llc가 맡고 조제와 배송은 휴스턴에 있는 vialsrx가 맡는다고 밝혔다. 미국 50개 주 전역에서 서비스한다고 안내한다.\", \"when\": \"2026-09\", \"source\": \"theprotocole.com 홈페이지 faq\"}], \"caveats\": \"회사가 스스로 낸 수치와 제삼자가 확인한 수치를 나누어 볼 필요가 있다. 대기자 수천 명, 순도 99% 초과, 배치마다 하는 무균성과 역가 시험, 협력 약국이 가진 각종 자격 같은 대목은 모두 회사가 사이트와 보도자료에서 스스로 밝힌 것이고, 이를 검증한 제삼자 자료는 찾지 못했다. 투자 금액 600만 달러와 rare capital이 라운드를 이끌었다는 사실도 회사 보도자료가 출처이며 투자사 쪽 공식 발표는 확인하지 못했다. 회사 스스로도 자기가 파는 것이 조제 의약품이며 fda가 안전성과 효과를 확인해 주지 않는다고 faq에 명시한다. 즉 회색시장과 다른 점은 물질 자체가 허가를 받았다는 것이 아니라, 그 물질을 만드는 약국과 처방하는 사람이 규제 아래 있다는 것이다. 2026년 4월 뉴스레터가 전한 모습과 2026년 9월 현재 사이트 사이에 차이도 크다. 4월에는 신청과 추천으로만 들어가는 펩타이드 전용 회원제였고 월 60달러 멤버십이 있었는데, 9월 현재는 멤버십 메뉴가 사라지고 누구나 바로 살 수 있는 네 개 품목만 걸려 있다. 그 네 개는 nad+, 세마글루타이드, 티어제파타이드, 글루타티온으로, 뉴스레터가 다룬 bpc-157이나 tb-500 같은 회복용 펩타이드는 공개 목록에 없다. 홈페이지 상단에 wall street journal과 bloomberg 로고가 걸려 있으나 그 기사들이 이 회사를 이름으로 다뤘는지는 확인하지 못했다. 사이트의 quality 메뉴는 2026년 9월 현재 눌러도 404 화면이 나온다.\", \"for_us\": \"이 회사가 파는 것은 약이므로 3개월 안에 우리가 따라 할 수 있는 대상이 아니다. 눈여겨볼 것은 그 뒤에 깔린 수요다. 미국 소비자는 보험도 처방도 없이 4주에 200달러에서 300달러를 자기 돈으로 내고 주사제를 사서 스스로 놓고 있으며, 조사에서는 그러면서도 의료진의 안내를 원한다고 답한다. 여기서 소프트웨어만으로 떼어 낼 수 있는 조각은 판매가 아니라 기록과 안내다. 무엇을 언제 얼마나 썼는지 남기고, 걸음이나 수면처럼 우리가 이미 가진 지표와 나란히 보여 주는 화면은 3개월 안에 만들 수 있고 규제 허가도 필요 없다. 실제로 보충제 기록 앱인 suppco가 사용자 설문에서 90%가 원한다는 답을 받고 펩타이드 기록 기능을 앱에 붙였다는 사례가 같은 방향을 가리킨다. 다만 이 꼭지가 증명하는 것은 소비 규모이지 기록하고 싶어 하는 마음이 아니므로, 정말 남기고 싶어 하는지는 따로 확인해야 한다. 또 하나 참고할 것은 이 회사가 초기에 쓴 폐쇄형 가입 방식이다. 기존 회원의 확인을 받아야 새 회원이 들어오게 해서 초대를 성장 수단이자 품질 관리 장치로 함께 썼는데, 다섯 달 만에 그 장치를 걷어 내고 누구나 사게 바꿨다는 점까지 함께 보아야 한다.\", \"screenshots\": [{\"file\": \"protocole_home.png\", \"caption\": \"2026년 9월 현재 첫 화면이다. 펩타이드라는 말 대신 면허 의료진이 설계한 개인별 롱제비티 프로토콜이라고 적어 두었다.\", \"from\": \"https://theprotocole.com/\"}, {\"file\": \"protocole_prices.png\", \"caption\": \"공개된 제품과 값이다. nad+ 249달러, 세마글루타이드 249달러, 티어제파타이드 299달러, 글루타티온 199달러이며 위쪽에 wall street journal과 bloomberg 로고가 걸려 있다.\", \"from\": \"https://theprotocole.com/#glance-section\"}, {\"file\": \"protocole_product.png\", \"caption\": \"nad+ 제품 화면이다. 값과 함께 작용 원리, 바이알 용량, 부작용, 금기 사항을 펼쳐 볼 수 있게 해 두었다.\", \"from\": \"https://theprotocole.com/products/nad-plus\"}, {\"file\": \"protocole_archive_202606.png\", \"caption\": \"2026년 6월 7일에 저장된 같은 사이트다. 이때는 메뉴에 membership이 있었고 신청으로만 들어갈 수 있는 회원제라고 안내했다.\", \"from\": \"https://web.archive.org/web/20260607050250/https://theprotocole.com/\"}], \"sources\": [{\"title\": \"protocole emerges from stealth with $6m seed round led by rare capital to build the first clinical-grade peptide platform\", \"url\": \"https://insider.fitt.co/press-release/protocole-emerges-from-stealth-with-6m-seed-round-led-by-rare-capital-to-build-the-first-clinical-grade-peptide-platform/\", \"note\": \"회사가 배포한 보도자료 전문이다. 창업자 이름, 투자 금액과 주도 투자사, 대기자 규모, 회사 소재지를 여기서 확인했다.\"}, {\"title\": \"peptide platform protocole emerges from stealth with $6m in tow (athletech news, 2026-04-14)\", \"url\": \"https://athletechnews.com/peptide-platform-protocole-emerges-from-stealth-with-6m-in-tow/\", \"note\": \"월 60달러 멤버십의 구성, 약값이 따로라는 점, 바이알 하나에 200달러 안팎이며 4주에서 6주 간다는 회사 설명, 추천으로만 가입하는 방식, 준비 중인 두 프로그램을 여기서 확인했다.\"}, {\"title\": \"protocole launches clinical peptide platform (fitt insider, 2026-04-14)\", \"url\": \"https://insider.fitt.co/protocole-launches-clinical-peptide-platform/\", \"note\": \"fda가 14종 펩타이드를 다시 분류하려 한다는 맥락과, 이 회사가 회색시장을 제도권으로 옮기려 한다는 해석을 확인했다.\"}, {\"title\": \"the protocole 공식 사이트\", \"url\": \"https://theprotocole.com/\", \"note\": \"2026년 9월 기준 제품 목록과 값, 네 단계 구매 흐름, 자문단 소개, faq에 적힌 진료 법인과 조제 약국 이름, 조제 의약품이 fda 승인 대상이 아니라는 고지를 직접 확인했다.\"}, {\"title\": \"the protocole 품질 기준 페이지 (2026년 6월 7일 저장본)\", \"url\": \"https://web.archive.org/web/20260607041716/https://theprotocole.com/quality-standards\", \"note\": \"협력 약국이 어떤 감독을 받고 어떤 자격을 가졌다고 회사가 주장하는지를 확인했다. 현재 이 주소는 사이트에서 404를 낸다.\"}, {\"title\": \"the protocole 첫 화면 (2026년 6월 7일 저장본)\", \"url\": \"https://web.archive.org/web/20260607050250/https://theprotocole.com/\", \"note\": \"신청제 회원 가입, 월 60달러 멤버십, 펩타이드 전용이라는 당시 문구를 확인했다. 지금 사이트와 비교하는 근거다.\"}, {\"title\": \"peptide interest outpaces infrastructure (fitt insider, 2026-07-10)\", \"url\": \"https://insider.fitt.co/peptide-interest-outpaces-infrastructure/\", \"note\": \"소비자가 펩타이드를 얼마나 아는지, 의료진 안내를 원하는지에 관한 조사 결과와 경쟁 구도를 확인했다.\"}, {\"title\": \"consumers self-prescribe peptides (fitt insider, 2026-03-04)\", \"url\": \"https://insider.fitt.co/consumers-self-prescribe-peptides/\", \"note\": \"구매자가 의사가 아니라 입소문을 통해 알게 된다는 점, 메드스파와 온라인 판매처가 주된 경로라는 점, suppco가 앱에 펩타이드 기록을 붙였다는 사실을 확인했다.\"}, {\"title\": \"system raises $20m for vertically integrated peptide platform (fitt insider, 2026-09-09)\", \"url\": \"https://insider.fitt.co/system-raises-20m-for-vertically-integrated-peptide-platform/\", \"note\": \"같은 문제를 같은 방식으로 푸는 경쟁사의 규모와 품목을 확인했다.\"}]}"},{"slug":"ro","name":"Ro","one_liner":"온라인 문진으로 비만 치료제 처방을 받아 집으로 배송받게 해 주는 소비자 직접 구매 서비스이며, 약값은 제약사 공식 현금가와 똑같이 받고 관리 서비스를 월 회비로 따로 판다.","sells_to":"consumer","seen_in":[{"issue":"04","section":7,"headline":"먹는 Wegovy가 미국 소비자 채널로 한꺼번에 풀린 날 Ro가 첫날 판매 채널에 이름을 올렸고, 필자는 이런 채널이 2026년 성장의 수혜자가 될 것으로 봤다."},{"issue":"10","section":5,"headline":"공보험 시장이 조여드는 주에 Ro는 슈퍼볼 광고 하나에 총비용 1,500만 달러 이상을 쓴다고 밝혔고, 필자는 이 대비를 소비자 직접 결제 시장의 크기를 보여 주는 신호로 읽었다."},{"issue":"14","section":31,"headline":"값싼 복제 형태의 비만 치료제를 팔던 Hims가 밀려나고 제약사와 손잡은 Ro가 그 자리를 잇는 구도를 WSJ 기사가 그렸다."}],"card":{"problem":"미국에는 전국민 건강보험이 없어서 비만 치료제는 보험이 거절하면 한 달 약값이 1,000달러를 넘고, 보험이 있어도 사전 승인을 받아 내는 절차가 따로 남는다.","solution":"온라인 문진만으로 처방을 받아 약을 집으로 배송하고, 약값은 제약사 공식 현금가와 같게 받는 대신 부작용 관리와 기록, 코칭을 월 회비로 판다.","price":"먹는 Wegovy 기준으로 약값이 월 149달러이고, 여기에 Ro 회비가 따로 붙는다. 회비는 첫 달 39달러, 이후 12개월 선결제 기준 월 74달러다.","tags":["원격진료","약 배송","비만 치료제","현금 결제","월 회비"],"headline_traction":"먹는 Wegovy가 미국에 나온 2026년 1월 5일 첫날부터 판매 채널로 들어갔고, 4월에는 Eli Lilly의 먹는 약 Foundayo도 출시 직후 받았다.","watch":"회원 300만 명과 만족도 95%는 회사가 스스로 낸 수치이고, 매출은 공개되지 않는다. 약값 자체는 제약사 공식 현금가와 같아서 회사가 버는 자리는 회비뿐이다."},"screenshots":[{"file":"ro_home.png","caption":"첫 화면이다. Healthier on Ro라는 문구와 Serena Williams를 앞세우고, 오른쪽에 보험이 필요 없고 전 과정이 온라인이며 배송이 무료라는 네 줄을 걸어 두었다. 아래에는 무료 보험 확인과 TrumpRx 가격으로 GLP-1을 받는 진입 카드가 나란히 있다. 회사 사이트가 자동 접속을 막고 있어 인터넷 아카이브에 보관된 2026년 8월 30일 기록을 찍었다.","from":"https://web.archive.org/web/2026/https://ro.co/"},{"file":"ro_glp1.png","caption":"첫 화면을 내리면 나오는 비만 치료제 목록이다. 먹는 Wegovy, Zepbound KwikPen, 먹는 Foundayo, Wegovy 주사 펜이 재고 표시와 함께 놓여 있어, 이 회사가 제약사 정품을 출시 순서대로 받아 오는 채널임을 보여 준다.","from":"https://web.archive.org/web/2026/https://ro.co/"},{"file":"ro_membership.png","caption":"비만 상품 페이지에서 회비로 무엇을 사는지 적어 둔 대목이다. 보험 담당 창구, 무제한 의료진 메시지, 부작용 관리와 증량 지원, 체중과 투약 기록, 1대1 코칭이 회비에 들어간다. 약값과 회비를 나눠 받는 구조가 여기서 드러난다.","from":"https://web.archive.org/web/2026/https://ro.co/weight-loss/"}],"q":"{\"slug\": \"ro\", \"name\": \"ro\", \"one_liner\": \"온라인 문진으로 비만 치료제 처방을 받아 집으로 배송받게 해 주는 소비자 직접 구매 서비스이며, 약값은 제약사 공식 현금가와 똑같이 받고 관리 서비스를 월 회비로 따로 판다.\", \"site\": \"https://ro.co\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"04\", \"section\": 7, \"headline\": \"먹는 wegovy가 미국 소비자 채널로 한꺼번에 풀린 날 ro가 첫날 판매 채널에 이름을 올렸고, 필자는 이런 채널이 2026년 성장의 수혜자가 될 것으로 봤다.\"}, {\"issue\": \"10\", \"section\": 5, \"headline\": \"공보험 시장이 조여드는 주에 ro는 슈퍼볼 광고 하나에 총비용 1,500만 달러 이상을 쓴다고 밝혔고, 필자는 이 대비를 소비자 직접 결제 시장의 크기를 보여 주는 신호로 읽었다.\"}, {\"issue\": \"14\", \"section\": 31, \"headline\": \"값싼 복제 형태의 비만 치료제를 팔던 hims가 밀려나고 제약사와 손잡은 ro가 그 자리를 잇는 구도를 wsj 기사가 그렸다.\"}], \"card\": {\"problem\": \"미국에는 전국민 건강보험이 없어서 비만 치료제는 보험이 거절하면 한 달 약값이 1,000달러를 넘고, 보험이 있어도 사전 승인을 받아 내는 절차가 따로 남는다.\", \"solution\": \"온라인 문진만으로 처방을 받아 약을 집으로 배송하고, 약값은 제약사 공식 현금가와 같게 받는 대신 부작용 관리와 기록, 코칭을 월 회비로 판다.\", \"price\": \"먹는 wegovy 기준으로 약값이 월 149달러이고, 여기에 ro 회비가 따로 붙는다. 회비는 첫 달 39달러, 이후 12개월 선결제 기준 월 74달러다.\", \"tags\": [\"원격진료\", \"약 배송\", \"비만 치료제\", \"현금 결제\", \"월 회비\"], \"headline_traction\": \"먹는 wegovy가 미국에 나온 2026년 1월 5일 첫날부터 판매 채널로 들어갔고, 4월에는 eli lilly의 먹는 약 foundayo도 출시 직후 받았다.\", \"watch\": \"회원 300만 명과 만족도 95%는 회사가 스스로 낸 수치이고, 매출은 공개되지 않는다. 약값 자체는 제약사 공식 현금가와 같아서 회사가 버는 자리는 회비뿐이다.\"}, \"problem\": \"한국에서는 건강보험이 있어서 의사를 만나는 일 자체가 싸고 빠르지만, 미국에서는 비만 치료제를 쓰려는 사람이 두 가지 벽을 따로 넘어야 한다. 첫째는 값이다. 주사형 비만 치료제의 정가는 cnbc 보도 기준으로 한 달 약 1,000달러 수준이고, 고용주 보험이 이 약을 보장 범위에서 빼는 흐름이 이어지고 있어 자기 돈으로 사야 하는 사람이 늘고 있다. 둘째는 절차다. 보험이 있어도 사전 승인을 받아 내야 하고, 그 과정에서 보험사에 전화를 걸고 서류를 맞추는 일은 환자 몫으로 남는다. 여기에 2025년부터 제약사들이 보험을 거치지 않고 소비자에게 직접 파는 현금가 채널을 열면서, 문제의 성격이 바뀌었다. 약을 구할 수 있느냐에서, 어디서 사고 쓰는 동안 누가 봐 주느냐로 옮겨 간 것이다.\", \"solution\": \"사용자는 ro.co에서 온라인 문진에 답하는 것으로 시작한다. 회사 설명 기준으로 자격 판정까지 이틀쯤 걸리고, 현금으로 살 경우 일주일 안에 처방이 나와 약이 집으로 온다. 보험을 쓰겠다고 하면 ro가 보험사에 대신 연락해 사전 승인을 처리하는데 2주에서 3주가 걸리고, 이 경우 약은 동네 약국에서 받는다. 값은 두 갈래로 나뉜다. 약값은 먹는 wegovy와 foundayo가 월 149달러, wegovy 주사 펜이 월 199달러, zepbound kwikpen이 월 299달러부터이며, 회사는 이 값이 novocare, lillydirect, trumprx의 현금가와 같다고 밝힌다. 여기에 ro body 회비가 따로 붙는데 첫 달 39달러이고, 그 뒤로는 12개월 선결제면 월 74달러, 6개월 89달러, 3개월 99달러, 달마다 내면 149달러다. 회비로 사는 것은 약이 아니라 관리이며, 24시간 의료진 메시지, 부작용 관리와 용량 증량 지원, 체중과 투약 기록, 1대1 코칭, 보험 담당 창구가 여기에 들어간다.\", \"features\": [{\"name\": \"무료 glp-1 보험 확인\", \"detail\": \"ro가 사용자를 대신해 보험사에 연락해 그 약이 보장되는지, 본인부담금이 얼마인지, 사전 승인이 필요한지를 정리한 리포트를 준다. 값을 받지 않고, 치료를 시작하면 50달러 크레딧을 얹어 준다.\"}, {\"name\": \"ro body 회비 멤버십\", \"detail\": \"약값과 별개로 받는 월 회비다. 24시간 의료진 메시지, 부작용 관리와 증량 지원, 체중과 투약 기록, 1대1 코칭, 보험 담당 창구가 포함된다.\"}, {\"name\": \"제약사 공식 현금가 그대로\", \"detail\": \"회사는 자기가 파는 현금가가 novocare, lillydirect, 그리고 정부가 연 trumprx의 값과 같다고 값 안내 페이지에 적어 두었다. 약값에 마진을 얹지 않는다는 뜻이며, 첫 화면에도 trumprx 가격으로 glp-1을 받는 진입 카드가 걸려 있다.\"}, {\"name\": \"선결제 할인\", \"detail\": \"3개월, 6개월, 12개월 선결제를 고르면 회비가 내려간다. 회사는 2026년 3월 발표에서 이 방식으로 wegovy 주사 펜은 연 1,200달러까지, 먹는 wegovy는 연 600달러까지 아낄 수 있다고 밝혔다.\"}, {\"name\": \"먹는 약 우선 취급\", \"detail\": \"먹는 wegovy는 미국 출시 첫날인 2026년 1월 5일부터, eli lilly의 먹는 약 foundayo는 2026년 4월 9일부터 취급했다. 주삿바늘 때문에 시작하지 못하던 사람을 겨냥한 상품군이다.\"}, {\"name\": \"비만 밖의 다른 상품군\", \"detail\": \"성 건강, 탈모, 피부, 난임을 함께 판다. 정자 채취와 보관 신청 페이지가 따로 있을 만큼 난임 쪽 상품도 살아 있다.\"}, {\"name\": \"자체 조제 상품\", \"detail\": \"ro sparks와 daily rise gummies는 ro에서만 파는 조제 의약품이며, fda 승인을 받은 약이 아니라는 표기가 첫 화면에 함께 붙어 있다.\"}, {\"name\": \"아이폰 전용 앱\", \"detail\": \"앱은 계정을 웹에서 만든 뒤 로그인해서 쓰는 보조 창구다. 주문 추적, 치료 진행 안내, 무료 보험 확인이 들어 있으며, 아이패드 없이 아이폰만 지원한다.\"}], \"differentiator\": \"약값만 놓고 보면 다를 것이 없다. 먹는 wegovy는 2026년 1월 5일 같은 날 ro와 lifemd, weight watchers, goodrx, 그리고 제약사가 직접 운영하는 novocare 약국으로 한꺼번에 풀렸고, ro는 자기 현금가가 novocare와 lillydirect, trumprx와 같다고 스스로 밝힌다. 그래서 경쟁은 약값이 아니라 회비와 관계에서 벌어진다. 가장 큰 경쟁자인 hims & hers는 값싼 조제 형태의 약을 직접 만들어 파는 쪽으로 갔다가 2026년 2월 먹는 조제약 판매 계획을 규제 반발 끝에 접었고, 회비도 첫 달 39달러 뒤 월 149달러로 ro보다 비싸다. ro는 반대로 제약사와 붙어 정품을 첫날부터 받아 오고 회비를 깎는 쪽을 골랐으며, 2026년 4월 회비를 약 145달러에서 74달러 수준으로 내려 이 경쟁을 먼저 걸었다. 무료 보험 확인 서비스처럼 결제 전에 답을 주는 도구를 앞에 세운 점도 같은 채널 회사들과 갈리는 대목이다.\", \"team\": [{\"name\": \"zachariah reitano\", \"role\": \"공동 창업자 겸 ceo\", \"background\": \"2026년 회사 보도자료에 공동 창업자 겸 ceo로 계속 이름이 나온다. 창업 전 경력은 확인하지 못했다.\"}, {\"name\": \"saman rahmanian\", \"role\": \"공동 창업자\", \"background\": \"회사 창업자 편지에 세 명 가운데 한 사람으로 서명돼 있다. 현재 직함과 창업 전 경력은 확인하지 못했다.\"}, {\"name\": \"rob schutz\", \"role\": \"공동 창업자\", \"background\": \"회사 창업자 편지에 세 명 가운데 한 사람으로 서명돼 있다. 현재 직함과 창업 전 경력은 확인하지 못했다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"시리즈 c로 2억 달러를 받았고 기업 가치는 15억 달러로 평가됐다.\", \"when\": \"2020-07\", \"source\": \"cnbc 보도\"}, {\"type\": \"funding\", \"detail\": \"시리즈 d로 5억 달러를 받았고 기업 가치는 50억 달러로 평가됐다.\", \"when\": \"2021-03\", \"source\": \"business insider 보도, 영어 위키백과\"}, {\"type\": \"funding\", \"detail\": \"기존 투자자들이 참여한 1억 5,000만 달러 라운드를 받으면서 피부과 상품을 열었다.\", \"when\": \"2022-02\", \"source\": \"fierce healthcare 보도\"}, {\"type\": \"partnership\", \"detail\": \"여성 건강 스타트업 modern fertility를 2억 2,500만 달러 규모로 인수했다.\", \"when\": \"2021-05\", \"source\": \"fierce healthcare 보도\"}, {\"type\": \"partnership\", \"detail\": \"novo nordisk의 novocare 약국과 직접 연동해, 보험을 거치지 않는 현금가로 wegovy를 파는 경로를 열었다.\", \"when\": \"2025-04\", \"source\": \"회사 보도자료. 같은 시기 abc news가 ro와 hims, lifemd가 함께 이 경로에 들어갔다고 보도했다.\"}, {\"type\": \"partnership\", \"detail\": \"먹는 wegovy가 미국에 출시된 첫날부터 판매 채널로 들어갔다. 같은 날 cvs와 costco를 포함한 7만 곳이 넘는 약국, lifemd, weight watchers, goodrx에도 함께 풀렸다.\", \"when\": \"2026-01\", \"source\": \"회사 보도자료(2026년 1월 5일), cnbc 보도\"}, {\"type\": \"partnership\", \"detail\": \"amgen과 glp-1 실사용 경험을 연구하는 협업을 발표했다. 보험 보장 장벽과 사전 승인 흐름을 함께 들여다보는 내용이다.\", \"when\": \"2026-01\", \"source\": \"회사 보도자료(2026년 1월 13일)\"}, {\"type\": \"partnership\", \"detail\": \"eli lilly의 먹는 glp-1인 foundayo를 최저 용량 기준 월 149달러부터 취급하기 시작했다. fda 승인은 2026년 4월 1일이었다.\", \"when\": \"2026-04\", \"source\": \"회사 보도자료(2026년 4월 9일), eli lilly의 승인 발표\"}, {\"type\": \"customers\", \"detail\": \"회원이 300만 명을 넘었다고 밝히고 있다.\", \"when\": \"2026-09\", \"source\": \"회사 첫 화면과 앱스토어 소개 화면. 제삼자가 확인한 수치가 아니다.\"}, {\"type\": \"customers\", \"detail\": \"200만 명이 넘는 사람의 보험 보장 여부를 대신 확인해 줬다고 밝히고 있다.\", \"when\": \"2026-01\", \"source\": \"회사 보도자료의 회사 소개 문단. 제삼자가 확인한 수치가 아니다.\"}, {\"type\": \"traffic\", \"detail\": \"serena williams를 내세운 첫 슈퍼볼 광고를 집행했다. 뉴스레터 10회차는 ro가 광고 하나에 총비용 1,500만 달러 이상을 쓴다고 밝혔다고 전한다.\", \"when\": \"2026-02\", \"source\": \"회사 보도자료(2026년 1월 28일), variety 보도, health tech nerds 10회차\"}, {\"type\": \"traffic\", \"detail\": \"미국 아이폰 앱스토어 의료 부문에서 23위이며, 평점은 4.8, 평가 수는 11,485개다. 앱은 2022년 5월에 나왔다.\", \"when\": \"2026-09\", \"source\": \"미국 앱스토어 페이지를 직접 확인\"}], \"caveats\": \"규모를 보여 주는 수치는 대부분 회사가 스스로 낸 것이다. 회원 300만 명, 만족도 95%, 보험 확인 200만 건이 모두 여기에 해당하며 제삼자가 확인한 것이 아니다. 매출은 공개되지 않는다. 효과 수치도 두 종류를 구분해서 봐야 한다. 비만 상품 페이지에 크게 걸린 20%라는 감량 수치는 ro의 실적이 아니라 제약사 임상시험 결과이며, 해당 페이지의 각주에 그렇게 적혀 있다. ro 자체 성적은 2025년 12월에 내놓은 655명, 68주 관찰 결과인 평균 16.6% 감량인데, 이 연구는 회사가 주도하고 자문 의사들과 함께 obesity 저널에 실은 것이므로 동료 심사를 거쳤다는 점과 이해관계가 있다는 점이 함께 있다. 값은 자주 바뀐다. 2026년 4월 23일 회비를 약 145달러에서 74달러 수준으로 내렸고, 2026년 9월 10일에도 다시 회비 인하를 발표했으므로 여기 적힌 값은 확인한 날짜 기준으로만 유효하다. 사업 구조상 주의할 대목도 있다. 약값은 제약사 공식 현금가와 같으므로 회사가 버는 자리는 회비이고, 매출이 처방이 이어지는 동안에만 유지된다. ro sparks와 daily rise gummies는 fda 승인을 받은 약이 아니라 ro에서만 파는 조제 의약품이다. 원격진료로 비만 치료제를 처방하는 방식 자체에 대한 비판도 있다. 시장조사 회사 sermo가 2025년 1월 1차 진료 의사 2,000명에게 물은 조사에서 67%가 제3자 원격진료를 통한 glp-1 처방의 건강 위험을 우려했고, 57%는 환자에게 그런 경로를 쓰지 말라고 조언했다고 답했다. 다만 이 조사는 경쟁 관계에 있는 omada health가 의뢰해 공개한 것이므로 그 점을 감안해야 한다. 규제 위험은 경쟁사 사례에서 드러난다. hims & hers는 2026년 2월 먹는 조제 glp-1을 내놨다가 규제 반발 끝에 판매 계획을 접었다. 창업자 세 사람의 이름은 회사 창업자 편지와 보도자료로 확인했으나, reitano를 뺀 두 사람의 현재 직함과 창업 전 경력은 확인하지 못해 비워 두었다. 마지막으로, 구글 플레이에서는 이 회사의 앱을 찾지 못했다. 앱은 아이폰 전용이고 평가도 1만여 개에 그치므로, 실제 사용은 앱이 아니라 웹에 몰려 있다고 보아야 한다.\", \"for_us\": \"이 회사에서 가져올 것은 약이 아니라 회비가 무엇을 팔고 있는지다. ro body 회비에 들어가는 항목은 24시간 메시지, 부작용 관리와 증량 지원, 체중과 투약 기록, 1대1 코칭인데, 이 가운데 기록과 알림, 코칭 화면은 처방권이나 규제 허가 없이 3개월 안에 소프트웨어로 만들 수 있다. 약을 이미 쓰는 사람이 관리에만 월 74달러에서 149달러를 내고 있다는 사실 자체가 그 자리에 수요가 있다는 증거다. 두 번째로 볼 것은 무료 보험 확인 도구다. 돈을 받기 전에 사용자가 가장 궁금해하는 질문에 먼저 답해 주고 그 자리에서 계정을 만들게 하는 방식인데, 우리 쪽으로 옮기면 검진 수치나 복용 중인 약에 대해 무료로 답을 주는 화면이 같은 역할을 할 수 있다. 세 번째는 이 회사가 앱을 주 창구로 쓰지 않는다는 점이다. 아이폰 전용에 평가가 1만여 개뿐이고 안드로이드 앱은 찾을 수 없었으므로, 약을 파는 회사들이 비워 둔 자리가 매일 여는 기록 앱 쪽에 남아 있다. 반대로 가져오지 말아야 할 것도 분명하다. 처방과 약 배송, 보험 사전 승인 대행은 규제와 물류가 얽혀 있어 3개월과 소프트웨어 인력이라는 조건 밖이고, 약효나 용량에 대한 조언 역시 우리가 말할 수 있는 영역이 아니다. 우리가 다룰 수 있는 것은 복용 여부와 체중, 부작용, 걷기를 사용자가 스스로 적게 하고 그것을 되돌려 보여 주는 데까지다.\", \"screenshots\": [{\"file\": \"ro_home.png\", \"caption\": \"첫 화면이다. healthier on ro라는 문구와 serena williams를 앞세우고, 오른쪽에 보험이 필요 없고 전 과정이 온라인이며 배송이 무료라는 네 줄을 걸어 두었다. 아래에는 무료 보험 확인과 trumprx 가격으로 glp-1을 받는 진입 카드가 나란히 있다. 회사 사이트가 자동 접속을 막고 있어 인터넷 아카이브에 보관된 2026년 8월 30일 기록을 찍었다.\", \"from\": \"https://web.archive.org/web/2026/https://ro.co/\"}, {\"file\": \"ro_glp1.png\", \"caption\": \"첫 화면을 내리면 나오는 비만 치료제 목록이다. 먹는 wegovy, zepbound kwikpen, 먹는 foundayo, wegovy 주사 펜이 재고 표시와 함께 놓여 있어, 이 회사가 제약사 정품을 출시 순서대로 받아 오는 채널임을 보여 준다.\", \"from\": \"https://web.archive.org/web/2026/https://ro.co/\"}, {\"file\": \"ro_membership.png\", \"caption\": \"비만 상품 페이지에서 회비로 무엇을 사는지 적어 둔 대목이다. 보험 담당 창구, 무제한 의료진 메시지, 부작용 관리와 증량 지원, 체중과 투약 기록, 1대1 코칭이 회비에 들어간다. 약값과 회비를 나눠 받는 구조가 여기서 드러난다.\", \"from\": \"https://web.archive.org/web/2026/https://ro.co/weight-loss/\"}, {\"file\": \"ro_ios.png\", \"caption\": \"미국 아이폰 앱스토어 페이지다. 평점 4.8에 평가 11,485개, 의료 부문 23위이며 아이폰 전용이다. 앱 소개 화면에 회원 300만 명이라는 회사 주장이 그대로 실려 있다.\", \"from\": \"https://apps.apple.com/us/app/ro-online-healthcare/id1585858911\"}], \"sources\": [{\"title\": \"ro 공식 사이트 첫 화면\", \"url\": \"https://ro.co\", \"note\": \"회원 300만 명, 만족도 95%, 보험 불필요, 무료 배송이라는 핵심 문구와 비만 치료제별 월 값 표기를 확인했다.\"}, {\"title\": \"ro 비만 상품 값 안내\", \"url\": \"https://ro.co/weight-loss/pricing/\", \"note\": \"회비가 첫 달 39달러이고 이후 12개월 선결제 74달러, 6개월 89달러, 3개월 99달러, 월납 149달러라는 것과, 약값이 novocare와 lillydirect, trumprx의 현금가와 같다는 문구를 확인했다.\"}, {\"title\": \"ro 비만 상품 소개\", \"url\": \"https://ro.co/weight-loss/\", \"note\": \"회비에 포함되는 항목과, 20%라는 감량 수치가 제약사 임상시험 결과라는 각주를 확인했다.\"}, {\"title\": \"ro 먹는 wegovy 상품 페이지\", \"url\": \"https://ro.co/weight-loss/wegovy-pill/\", \"note\": \"문진에서 배송까지의 단계와 각 단계에 걸리는 기간, 보험을 쓸 때와 현금으로 살 때의 경로 차이를 확인했다.\"}, {\"title\": \"ro 무료 glp-1 보험 확인 서비스\", \"url\": \"https://ro.co/weight-loss/glp1-insurance-checker/\", \"note\": \"ro가 보험사에 대신 연락해 보장 여부와 본인부담금을 정리해 주고 50달러 크레딧을 준다는 내용을 확인했다.\"}, {\"title\": \"ro launches wegovy pill through integration with novo nordisk\", \"url\": \"https://ro.co/press/wegovy-pill/\", \"note\": \"2026년 1월 5일 첫날 출시 참여, 2025년 4월 novo nordisk와의 직접 연동, 보험 확인 200만 건이라는 회사 주장을 확인했다.\"}, {\"title\": \"ro helps patients save up to $1,200 per year on wegovy\", \"url\": \"https://ro.co/press/wegovy-savings-options/\", \"note\": \"2026년 3월 31일 발표다. 3개월, 6개월, 12개월 선결제로 주사 펜은 연 1,200달러, 먹는 약은 연 600달러까지 아낄 수 있다는 회사 주장을 확인했다.\"}, {\"title\": \"ro offers eli lilly's foundayo, the newest glp-1 innovation\", \"url\": \"https://ro.co/press/foundayo/\", \"note\": \"2026년 4월 9일 발표다. 최저 용량 기준 월 149달러이며 회비는 별도라는 문구를 확인했다.\"}, {\"title\": \"ro announces research collaboration with amgen\", \"url\": \"https://ro.co/press/amgen-collaboration/\", \"note\": \"2026년 1월 13일 발표다. 보험 보장 장벽과 사전 승인 흐름을 함께 보는 연구 협업이라는 점을 확인했다.\"}, {\"title\": \"new research shows ro helps patients achieve weight loss outcomes consistent with clinical trials\", \"url\": \"https://ro.co/press/68-week-outcomes/\", \"note\": \"2025년 12월 10일 발표다. 655명을 68주 관찰해 평균 16.6% 감량이라는 결과를 obesity 저널에 실었다는 내용과 세부 수치를 확인했다.\"}, {\"title\": \"ro debuts first-ever super bowl commercial starring serena williams\", \"url\": \"https://ro.co/press/super-bowl-2026/\", \"note\": \"2026년 1월 28일 발표다. 광고 비용은 밝히지 않았고, 캠페인 이름과 출연자 발언을 확인했다.\"}, {\"title\": \"lower costs for high-quality care for ro patients\", \"url\": \"https://ro.co/news/multi-month-membership/\", \"note\": \"2026년 9월 10일 발표다. 첫 달 39달러, 이후 연간 플랜 월 74달러, 연 900달러 절감이라는 값과 회비가 약값과 별개라는 문구를 확인했다.\"}, {\"title\": \"ro 창업자 편지\", \"url\": \"https://ro.co/founder-letter/\", \"note\": \"zachariah reitano, saman rahmanian, rob schutz 세 사람이 공동 창업자로 서명한 글이며, 창업 동기를 확인했다.\"}, {\"title\": \"ro 아이폰 앱\", \"url\": \"https://apps.apple.com/us/app/ro-online-healthcare/id1585858911\", \"note\": \"평점 4.8, 평가 11,485개, 의료 부문 23위, 아이폰 전용, 2022년 5월 출시, 판매자가 roman health medical llc라는 것을 확인했다. 구글 플레이와 apk 목록에서는 같은 앱을 찾지 못했다.\"}, {\"title\": \"first glp-1 pill for obesity from novo nordisk launches in the u.s. (cnbc)\", \"url\": \"https://www.cnbc.com/2026/01/05/first-glp-1-pill-for-obesity-from-novo-nordisk-launches-in-the-us.html\", \"note\": \"2026년 1월 5일 출시, 용량별 현금가 149달러에서 299달러, 보험이 있으면 월 25달러까지, 7만 곳이 넘는 약국과 ro를 포함한 원격진료 채널로 동시에 풀렸다는 사실을 확인했다.\"}, {\"title\": \"hims stock slides premarket: rival telehealth firm ro launches aggressive price cuts (stocktwits)\", \"url\": \"https://stocktwits.com/news-articles/markets/equity/hims-stock-slides-premarket-ro-cuts-glp-1-subscription-prices/czbfp2trebh\", \"note\": \"2026년 4월 23일 기사다. ro가 회비를 약 145달러에서 74달러 수준으로 내렸고 hims는 첫 달 39달러 뒤 149달러라는 비교를 확인했다.\"}, {\"title\": \"primary care doctors concerned about patient risks of telehealth glp-1 prescribers (fierce healthcare)\", \"url\": \"https://www.fiercehealthcare.com/providers/primary-care-doctors-concerned-about-patient-risks-telehealth-prescribers-glp-1s-survey\", \"note\": \"1차 진료 의사 2,000명 조사에서 67%가 원격진료 glp-1 처방의 위험을 우려했다는 수치를 확인했다. 조사 의뢰자가 경쟁사 omada health라는 점도 함께 확인했다.\"}, {\"title\": \"digital health startup ro raises $500 million in series d funding (business insider)\", \"url\": \"https://www.businessinsider.com/digital-health-startup-ro-raises-500-million-series-d-2021-3\", \"note\": \"2021년 3월 시리즈 d 5억 달러 조달을 확인했다. 기사 본문은 유료 구독 벽에 막혀 제목과 요약만 확인했다.\"}, {\"title\": \"ro raises $200 million at $1.5 billion valuation (cnbc)\", \"url\": \"https://www.cnbc.com/2020/07/27/ro-raises-200-million-at-1point5-billion-valuation-250-million-sales.html\", \"note\": \"2020년 7월 시리즈 c 2억 달러와 기업 가치 15억 달러를 확인했다.\"}, {\"title\": \"ro lands $150m inside round, launches virtual skincare clinic (fierce healthcare)\", \"url\": \"https://www.fiercehealthcare.com/digital-health/ro-lands-150m-inside-round-launches-virtual-skincare-clinic\", \"note\": \"2022년 2월 기존 투자자 참여 1억 5,000만 달러 조달을 확인했다.\"}, {\"title\": \"ro will acquire women's health startup modern fertility in $225m deal (fierce healthcare)\", \"url\": \"https://www.fiercehealthcare.com/digital-health/ro-will-acquire-women-s-health-startup-modern-fertility-225m-deal\", \"note\": \"2021년 5월 modern fertility 인수와 금액을 확인했다.\"}, {\"title\": \"serena williams super bowl commercial pitches glp-1 from ro (variety)\", \"url\": \"https://variety.com/2026/tv/news/serena-williams-super-bowl-commercial-glp-1-ro-1236642957/\", \"note\": \"슈퍼볼 광고가 실제로 집행됐다는 제삼자 확인 자료다.\"}, {\"title\": \"ro (company) 영어 위키백과\", \"url\": \"https://en.wikipedia.org/wiki/ro_(company)\", \"note\": \"2017년 설립, 창업 당시 이름이 roman이었다는 점, 초기 투자 라운드와 인수 이력을 확인했다. 편집 가능한 자료이므로 수치는 개별 보도로 다시 확인했다.\"}]}"},{"slug":"signos","name":"Signos","one_liner":"당뇨가 없는 사람에게 처방 없이 살 수 있는 연속혈당측정 센서를 매달 두 개씩 보내 주고, 센서가 보내는 혈당 값을 읽어 무엇을 먹고 언제 움직일지 알려 주는 앱을 함께 묶어 구독으로 파는 체중 관리 회사다.","sells_to":"consumer","seen_in":[{"issue":"43","section":22,"headline":"소비자가 직접 사서 쓰는 연속혈당측정 서비스로 소개되면서 2,000만 달러를 조달했고, 센서를 만드는 Dexcom과 보험사 BCBS Alabama가 투자자로 들어온 조합이 눈에 띈다고 나왔다."}],"card":{"problem":"미국에서 살을 빼려는 사람에게 놓인 선택지는 한 달에 1,000달러 가까이 드는 GLP-1 주사약이거나 남이 만든 식단표를 그대로 따르는 것이다. 정작 자기가 먹은 음식이 자기 몸에서 어떤 반응을 일으키는지 확인할 방법은 없다.","solution":"처방 없이 살 수 있는 Dexcom Stelo 센서를 매달 두 개 보내 주고, 앱이 혈당 곡선과 사진으로 찍은 식사 기록을 함께 읽어 이 음식이 혈당을 얼마나 올릴지 미리 알려 주고 혈당이 오르면 지금 움직이라고 알림을 보낸다.","price":"센서 두 개를 포함해 6개월 구독이 정가 기준 월 169달러다. 보험은 적용되지 않으며, 2026년 9월 기준 할인 코드를 넣으면 월 127달러다.","tags":["연속혈당측정","체중 관리","구독","처방 불필요","AI 코칭"],"headline_traction":"2026년 5월에 2,000만 달러를 조달하면서 센서 제조사 Dexcom이 투자자로 들어왔고, Dexcom이 자사 소비자 판매 사이트에서 Signos 구독을 팔기로 했다.","watch":"FDA 허가는 기존 기기와 실질적으로 같다고 인정받은 것이지 체중 감량 효과를 입증한 것이 아니며, 성장 수치도 회사가 10배라는 배수로만 밝히고 실제 매출과 이용자 수는 공개하지 않았다."},"screenshots":[{"file":"signos_ios.png","caption":"미국 애플 앱스토어의 Signos 앱 화면이다. 앱은 무료로 받지만 구독 회원이 센서와 함께 써야 한다고 적혀 있고, 평가 1,014개에 평점 4.6점이다. 아래에는 Nutrisense와 Levels 같은 경쟁 앱이 함께 뜬다.","from":"https://apps.apple.com/us/app/signos/id1534943157"},{"file":"signos_play.png","caption":"구글 플레이의 Signos 앱 화면이다. 다운로드가 1만 회 이상으로 표시되고, 회원이 센서와 함께 쓰는 앱이라는 안내가 그대로 적혀 있다. 같은 페이지의 데스크톱 화면에서는 평점 4.2점에 리뷰 285개로 나온다.","from":"https://play.google.com/store/apps/details?id=com.signos.core"},{"file":"signos_stelo.png","caption":"Dexcom이 Signos에 대는 센서 Stelo를 소비자에게 직접 파는 사이트다. 처방이 필요 없다고 적혀 있고 월 구독 값이 정가 99달러, 할인가 89달러로 뜬다. Signos 구독도 이 사이트에서 팔기로 했다.","from":"https://www.stelo.com/"}],"q":"{\"slug\": \"signos\", \"name\": \"signos\", \"one_liner\": \"당뇨가 없는 사람에게 처방 없이 살 수 있는 연속혈당측정 센서를 매달 두 개씩 보내 주고, 센서가 보내는 혈당 값을 읽어 무엇을 먹고 언제 움직일지 알려 주는 앱을 함께 묶어 구독으로 파는 체중 관리 회사다.\", \"site\": \"https://www.signos.com\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"43\", \"section\": 22, \"headline\": \"소비자가 직접 사서 쓰는 연속혈당측정 서비스로 소개되면서 2,000만 달러를 조달했고, 센서를 만드는 dexcom과 보험사 bcbs alabama가 투자자로 들어온 조합이 눈에 띈다고 나왔다.\"}], \"card\": {\"problem\": \"미국에서 살을 빼려는 사람에게 놓인 선택지는 한 달에 1,000달러 가까이 드는 glp-1 주사약이거나 남이 만든 식단표를 그대로 따르는 것이다. 정작 자기가 먹은 음식이 자기 몸에서 어떤 반응을 일으키는지 확인할 방법은 없다.\", \"solution\": \"처방 없이 살 수 있는 dexcom stelo 센서를 매달 두 개 보내 주고, 앱이 혈당 곡선과 사진으로 찍은 식사 기록을 함께 읽어 이 음식이 혈당을 얼마나 올릴지 미리 알려 주고 혈당이 오르면 지금 움직이라고 알림을 보낸다.\", \"price\": \"센서 두 개를 포함해 6개월 구독이 정가 기준 월 169달러다. 보험은 적용되지 않으며, 2026년 9월 기준 할인 코드를 넣으면 월 127달러다.\", \"tags\": [\"연속혈당측정\", \"체중 관리\", \"구독\", \"처방 불필요\", \"ai 코칭\"], \"headline_traction\": \"2026년 5월에 2,000만 달러를 조달하면서 센서 제조사 dexcom이 투자자로 들어왔고, dexcom이 자사 소비자 판매 사이트에서 signos 구독을 팔기로 했다.\", \"watch\": \"fda 허가는 기존 기기와 실질적으로 같다고 인정받은 것이지 체중 감량 효과를 입증한 것이 아니며, 성장 수치도 회사가 10배라는 배수로만 밝히고 실제 매출과 이용자 수는 공개하지 않았다.\"}, \"problem\": \"미국에서 체중을 줄이는 방법은 두 갈래로 갈려 있다. 한쪽에는 wegovy나 zepbound 같은 glp-1 주사약이 있는데, 보험이 비만 치료를 잘 보장하지 않아 자기 돈으로 사면 한 달에 1,000달러 안팎이 들고, 처방 자체도 비만 진단이나 일정 수준 이상의 체질량지수를 요구한다. 다른 한쪽에는 남이 만든 식단표가 있는데, 같은 음식을 먹어도 사람마다 몸이 다르게 반응한다는 점을 설명하지 못한다. 혈당은 그 반응을 실시간으로 보여 주는 값이지만, 미국에서 연속혈당측정기는 원래 의사 처방이 있어야 살 수 있는 기기였고 처방 없이 살 수 있는 제품은 2024년에야 나왔다. 그래서 당뇨가 없는 사람이 자기 대사 상태를 알고 싶으면 최근에야 길이 열린 셈이다. 한국은 국가건강검진에서 공복혈당을 정기적으로 확인해 주지만 미국에는 전 국민을 대상으로 하는 그런 검진 제도가 없어서, 자기 몸의 수치를 알고 싶으면 스스로 사서 재야 한다.\", \"solution\": \"소비자는 signos 사이트에서 1개월, 3개월, 6개월 가운데 하나를 고르고 처방 없이 바로 결제한다. 결제할 때 18세 이상인지, 인슐린을 쓰고 있지는 않은지, 저혈당 문제나 섭식장애가 없는지를 스스로 확인하는 항목에 체크한다. 결제하면 dexcom이 만든 stelo 센서가 배송되는데, 한 개가 15일 동안 붙어 있으므로 한 달에 두 개씩 쓰고, 6개월 요금제는 3개월치씩 두 번에 나눠 배송된다. 센서는 5분마다 혈당을 재서 15분마다 블루투스로 폰에 보내고, 앱은 그 값에 사진으로 찍거나 바코드로 스캔한 식사 기록, 운동, 수면, 체중을 겹쳐 놓는다. 혈당이 튀면 앱이 과거 기록을 근거로 어느 정도 강도로 얼마나 움직이면 되는지 알려 주고, 먹기 전에는 그 음식이 혈당을 올릴지 미리 점수로 알려 준다. 값은 6개월 요금제가 정가 월 169달러, 3개월이 월 199달러, 1개월이 월 299달러이며 센서 값이 모두 포함돼 있다. 이미 glp-1을 쓰는 사람을 위해 센서만 6개월에 여섯 개 보내 주는 월 89달러짜리 요금제가 따로 있고, 약까지 함께 받으려는 사람을 위한 월 199달러짜리 요금제도 있다.\", \"features\": [{\"name\": \"센서 배송과 혈당 측정\", \"detail\": \"dexcom이 만든 stelo 센서를 매달 두 개 보내 준다. 한 개를 15일 동안 팔 위쪽에 붙여 두면 5분마다 혈당을 재서 15분마다 폰으로 보낸다. 앱은 이 센서 하나만 지원한다.\"}, {\"name\": \"식사 기록과 미리 매기는 점수\", \"detail\": \"음식을 사진으로 찍거나 바코드를 스캔하거나 글로 적으면 ai가 무슨 음식인지와 영양 구성을 알아내고, 먹기 전에 그 음식이 혈당을 얼마나 올릴지 알려 준다. 회사는 2026년 조달한 자금을 이 기능을 넓히는 데 쓴다고 밝혔다.\"}, {\"name\": \"혈당이 오르면 보내는 움직임 알림\", \"detail\": \"혈당이 튀면 그 사람의 지난 기록을 근거로 어떤 운동을 어느 정도로 하면 혈당이 내려가는지 계산해 지금 움직이라고 알린다. 이것이 이 서비스의 핵심 흐름이다.\"}, {\"name\": \"등록 영양사 상담\", \"detail\": \"앱 안에서 영양사와 채팅하거나 화상으로 만날 수 있다. 회사 각주에 따르면 이 영양사는 nourish라는 외부 회사가 대는 독립 영양사이며, nourish는 자기 환자의 94%가 상담비를 한 푼도 내지 않는다고 밝힌다.\"}, {\"name\": \"다른 기기와의 연동\", \"detail\": \"apple health, google health connect, 스마트워치, 스마트 체중계와 연결해 수면과 심박수, 운동, 체중을 함께 본다.\"}, {\"name\": \"signos+ glp-1 요금제\", \"detail\": \"월 199달러에 3개월 또는 6개월짜리 glp-1 치료와 센서를 함께 준다. 처방은 signos가 아니라 openloop health 소속 독립 의료인이 하며, 회사 고지에 따르면 약은 조제 의약품이다.\"}, {\"name\": \"signos essentials 요금제\", \"detail\": \"이미 glp-1을 쓰고 있는 사람을 위한 요금제다. 6개월 동안 15일짜리 센서를 여섯 개만 보내 주고 약은 포함하지 않으며 처방도 필요 없다. 값은 월 89달러다.\"}, {\"name\": \"조직 대상 판매 창구\", \"detail\": \"고용주, 보험사, 의료 제휴사를 위한 페이지를 따로 두고 있다. 다만 2025년 8월 기준으로 체중 관리 용도에는 보험이 적용되지 않으며, 회사는 보험사와 고용주를 상대로 적용을 논의하고 있다고 밝혔다.\"}], \"differentiator\": \"같은 센서를 만드는 dexcom은 그 센서를 stelo라는 이름으로 직접 판다. 값은 월 구독 정가 99달러이고 할인가는 89달러이며 역시 처방이 필요 없다. signos는 같은 센서에 앱과 영양사 상담을 붙여 정가 월 169달러를 받으므로, 소비자가 더 내는 70달러가 소프트웨어 값인 셈이다. abbott은 lingo라는 자사 센서를 한 개 54달러부터 판다. 애플 앱스토어가 signos와 나란히 보여 주는 앱은 nutrisense와 levels, sugarmate로, 모두 같은 자리를 노린다. signos가 내세우는 차이는 두 가지다. 하나는 체중 관리 용도로 fda 허가를 받은 첫 시스템이라는 점이고, 다른 하나는 센서 제조사가 투자자로 들어와 자사 판매 사이트에 signos를 올려 준다는 점이다. 다만 그 사이트는 이미 nutrisense의 영양 상담도 함께 걸어 두고 있어서, 유통 창구를 얻은 것이 곧 독점을 얻은 것은 아니다.\", \"team\": [{\"name\": \"sharam fouladgar-mercer\", \"role\": \"창업자, ceo\", \"background\": \"2018년에 signos를 세웠다. 본인이 평생 체중 관리에 어려움을 겪었고 대학에서 하키 선수로 뛰면서 같은 음식이 팀 동료와 자기에게 다르게 작용한다는 점을 느낀 것이 창업 계기였다고 cnbc에 밝혔다.\"}, {\"name\": \"bill tancer\", \"role\": \"창업자, 데이터과학 총괄\", \"background\": \"회사 소개 글에 따르면 자기 체중을 스프레드시트로 꼼꼼히 기록하던 사람이며, sharam과 나눈 대화에서 signos가 시작됐다고 적혀 있다. 그 전 경력은 확인하지 못했다.\"}, {\"name\": \"pierre wehbe\", \"role\": \"공동창업자, 수석 아키텍트\", \"background\": \"\"}, {\"name\": \"roger neel\", \"role\": \"최고기술책임자 겸 최고마케팅책임자\", \"background\": \"\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"2,000만 달러를 조달했다. 보도자료와 기사에 이름이 나온 참여자는 gv와 dexcom, blue cross blue shield of alabama이며 이 보험사는 450 ventures를 통해 참여했다. 기업가치는 공개하지 않았다.\", \"when\": \"2026-05\", \"source\": \"cnbc, mobihealthnews, pulse 2.0\"}, {\"type\": \"partnership\", \"detail\": \"dexcom과의 협력을 넓혀, dexcom이 소비자에게 직접 파는 사이트 stelo.com에서 signos 구독을 팔기로 했다.\", \"when\": \"2026-05\", \"source\": \"mobihealthnews, pulse 2.0\"}, {\"type\": \"regulatory\", \"detail\": \"fda가 signos glucose monitoring system을 처방 없이 살 수 있는 연속혈당측정 시스템으로 인정했다. 접수는 2025년 1월 15일, 결정은 2025년 3월 21일이며 문서번호는 k250106이다. 회사는 이를 2025년 8월 20일에 발표했고, 체중 관리 용도로 허가받은 첫 시스템이라고 밝혔다.\", \"when\": \"2025-03\", \"source\": \"fda 510(k) 데이터베이스 k250106, cnbc\"}, {\"type\": \"funding\", \"detail\": \"2,000만 달러를 조달했다. cheyenne ventures와 gv가 주도했고 dexcom ventures가 참여했다. 당시 직원은 45명 안팎이었다.\", \"when\": \"2023-10\", \"source\": \"cnbc\"}, {\"type\": \"revenue\", \"detail\": \"매출과 이용자 수가 6개월 동안 열 배로 늘었다고 회사가 밝혔다. 다만 매출 금액과 이용자 수는 공개하지 않았다.\", \"when\": \"2026-05\", \"source\": \"cnbc 인터뷰, 회사 보도자료\"}, {\"type\": \"traffic\", \"detail\": \"미국 애플 앱스토어에서 평가 1,014개에 평점 4.6점이고, 구글 플레이에서는 리뷰 285개에 평점 4.2점, 다운로드는 1만 회 이상으로 표시된다.\", \"when\": \"2026-09\", \"source\": \"apple app store, google play\"}], \"caveats\": \"회사가 스스로 낸 수치와 제삼자가 확인한 수치를 갈라 볼 필요가 있다. 6개월 동안 열 배 성장했다는 말, 첫 달에 회원 86%가 성과를 봤다는 표시, 수만 명이 임상 연구에 참여했다는 말은 모두 회사가 밝힌 것이고 절대 수치가 없다. cnbc 기사에도 회사가 매출과 이용자 수, 기업가치를 공개하지 않았다고 적혀 있다. 제삼자로 확인되는 것은 fda 문서와 앱스토어 지표 정도다. fda 문서를 직접 보면 결론은 기존 기기와 실질적으로 같다는 인정(510(k))이며, 새 효과를 입증받은 것이 아니다. 허가 문구도 생활습관 변화가 혈당에 어떤 영향을 주는지 이해하는 데 도움이 되고 이것이 건강한 체중 유지에 쓸모 있을 수 있다는 표현이지, 체중이 준다는 문장이 아니다. 언론과 회사가 이를 승인이라고 쓰지만 성격이 다르다. 근거를 둘러싼 논쟁도 있다. 존스홉킨스 공중보건대학원이 2026년 1월에 낸 글에서 역학 전공 교수 elizabeth selvin과 michael fang은 당뇨가 없는 사람이 연속혈당측정으로 건강이 좋아진다는 근거가 부족하고 큰 임상시험이 없다고 말한다. 혈당만 쳐다보다가 콜레스테롤이나 나트륨처럼 중요한 다른 요소를 놓칠 수 있고, 정상 범위의 변동에도 불안해질 수 있다는 지적도 함께 나온다. 판매 조건도 봐야 한다. 모든 판매가 최종이라 환불과 교환이 없고, 6개월 요금제는 6개월마다 자동으로 갱신된다. 사이트에 뜨는 값은 25% 할인 코드가 적용된 값이라 정가와 다르다. 체중 관리 용도로는 보험이 적용되지 않는다. glp-1 요금제의 약은 조제 의약품이고 처방은 openloop health 소속 독립 의료인이 하며, signos 자신은 의료 행위를 하지 않는다고 고지한다. 뉴스레터가 2026년 라운드를 cheyenne ventures와 gv가 주도했다고 적었는데, 회사 보도자료와 기사에 이름이 나오는 2026년 참여자는 gv와 dexcom, bcbs alabama이고 cheyenne ventures가 주도한 것은 2023년의 같은 규모 라운드다.\", \"for_us\": \"이 회사가 파는 것은 센서가 아니라 센서 값을 행동으로 바꾸는 규칙이다. 혈당이 튀면 지금 얼마나 움직이라고 알리는 것이 핵심 흐름인데, 걸음 수를 이미 재고 있는 우리 앱과 바로 닿는 지점이다. 3개월 안에 기기를 만들 수는 없지만, 미국 사용자가 stelo나 lingo를 이미 붙이고 있다면 apple health와 google health connect를 통해 혈당 값을 읽어 오는 길이 있다. 센서가 없는 사용자에게도 식사를 사진으로 남기면 점수를 매기고 식사 뒤에 걷도록 알리는 흐름은 소프트웨어만으로 만들 수 있다. 값을 보면 소비자는 센서에 89달러를 내고 그 위에 얹힌 소프트웨어에 70달러를 더 내고 있으므로, 미국 소비자가 대사 관리 소프트웨어에 따로 돈을 낸다는 사실 자체는 확인된 셈이다. 다만 혈당 수치를 근거로 건강을 판정하면 규제와 근거 문제가 따라온다. 우리가 따라 할 수 있는 것은 판정이 아니라 행동을 부르는 알림 쪽이다.\", \"screenshots\": [{\"file\": \"signos_ios.png\", \"caption\": \"미국 애플 앱스토어의 signos 앱 화면이다. 앱은 무료로 받지만 구독 회원이 센서와 함께 써야 한다고 적혀 있고, 평가 1,014개에 평점 4.6점이다. 아래에는 nutrisense와 levels 같은 경쟁 앱이 함께 뜬다.\", \"from\": \"https://apps.apple.com/us/app/signos/id1534943157\"}, {\"file\": \"signos_play.png\", \"caption\": \"구글 플레이의 signos 앱 화면이다. 다운로드가 1만 회 이상으로 표시되고, 회원이 센서와 함께 쓰는 앱이라는 안내가 그대로 적혀 있다. 같은 페이지의 데스크톱 화면에서는 평점 4.2점에 리뷰 285개로 나온다.\", \"from\": \"https://play.google.com/store/apps/details?id=com.signos.core\"}, {\"file\": \"signos_stelo.png\", \"caption\": \"dexcom이 signos에 대는 센서 stelo를 소비자에게 직접 파는 사이트다. 처방이 필요 없다고 적혀 있고 월 구독 값이 정가 99달러, 할인가 89달러로 뜬다. signos 구독도 이 사이트에서 팔기로 했다.\", \"from\": \"https://www.stelo.com/\"}, {\"file\": \"signos_support.png\", \"caption\": \"signos 고객 지원 사이트다. 구독과 센서 사용, 앱 기능으로 안내가 나뉘어 있다. 본 사이트인 signos.com은 자동 접속을 막아 두어 갈무리하지 못했다.\", \"from\": \"https://support.signos.com/hc/en-us\"}], \"sources\": [{\"title\": \"signos 요금제 페이지\", \"url\": \"https://www.signos.com/plans\", \"note\": \"1개월·3개월·6개월 값과 센서 포함 조건, 환불 불가와 자동 갱신, glp-1 요금제 값을 확인했다.\"}, {\"title\": \"signos 회사 소개\", \"url\": \"https://www.signos.com/about\", \"note\": \"창업 이야기와 경영진 명단, 언론 보도 목록을 확인했다.\"}, {\"title\": \"signos essentials\", \"url\": \"https://www.signos.com/essentials\", \"note\": \"이미 glp-1을 쓰는 사람을 위한 월 89달러 요금제와 처방 불필요 표시를 확인했다.\"}, {\"title\": \"signos 첫 화면과 자주 묻는 질문\", \"url\": \"https://www.signos.com/\", \"note\": \"stelo 센서만 지원한다는 점, 측정 주기, 영양사 상담, 보험 적용 여부를 확인했다.\"}, {\"title\": \"cnbc, signos가 2,000만 달러를 조달하고 dexcom과 협력을 넓혔다\", \"url\": \"https://www.cnbc.com/2026/05/27/ai-health-tech-signos-dexcom.html\", \"note\": \"2026년 라운드 참여자와 유통 계약, 회사가 밝힌 열 배 성장, 기업가치 비공개를 확인했다.\"}, {\"title\": \"mobihealthnews, signos가 체중 관리용 혈당 측정 시스템으로 2,000만 달러를 모았다\", \"url\": \"https://www.mobihealthnews.com/news/signos-raises-20m-glucose-monitoring-system-weight-management\", \"note\": \"stelo.com 판매 계약과 fda 문서번호, 회사 설립 연도를 확인했다.\"}, {\"title\": \"pulse 2.0, signos가 2,000만 달러를 조달했다\", \"url\": \"https://pulse2.com/signos-20-million-raised-to-scale-fda-cleared-cgm-system-for-weight-management/\", \"note\": \"bcbs alabama가 450 ventures를 통해 참여했다는 사실과 ceo 발언을 확인했다.\"}, {\"title\": \"cnbc, fda가 체중 관리용 혈당 측정 시스템을 처음으로 허가했다\", \"url\": \"https://www.cnbc.com/2025/08/20/fda-approves-signos-glucose-monitoring-for-weight-loss.html\", \"note\": \"허가 발표 시점, 보험 미적용, glp-1 값과의 비교, ceo 이름을 확인했다.\"}, {\"title\": \"cnbc, signos가 2,000만 달러를 조달했다(2023년)\", \"url\": \"https://www.cnbc.com/2023/10/24/signos-raised-20-million-to-tackle-weight-loss-with-cgms-and-data.html\", \"note\": \"2023년 라운드 주도 투자자와 당시 직원 규모, 창업 배경을 확인했다.\"}, {\"title\": \"fda 510(k) 데이터베이스 k250106\", \"url\": \"https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?id=k250106\", \"note\": \"기기명, 신청 회사와 주소, 접수일과 결정일, 실질적 동등성 인정이라는 결론을 확인했다.\"}, {\"title\": \"존스홉킨스 공중보건대학원, 당뇨가 없는 사람에게 혈당 측정기가 쓸모 있는가\", \"url\": \"https://publichealth.jhu.edu/2026/is-glucose-monitoring-useful-for-non-diabetics\", \"note\": \"당뇨가 없는 사람의 연속혈당측정에 근거가 부족하다는 전문가 지적을 확인했다.\"}, {\"title\": \"apple app store, signos\", \"url\": \"https://apps.apple.com/us/app/signos/id1534943157\", \"note\": \"무료 다운로드와 평점 4.6점, 평가 1,014개, 회원 전용이라는 안내를 확인했다.\"}, {\"title\": \"google play, signos\", \"url\": \"https://play.google.com/store/apps/details?id=com.signos.core\", \"note\": \"평점 4.2점, 리뷰 285개, 다운로드 1만 회 이상을 확인했다.\"}, {\"title\": \"stelo by dexcom\", \"url\": \"https://www.stelo.com/\", \"note\": \"같은 센서를 직접 살 때의 값과 처방 불필요 표시, nutrisense 영양 상담 연결을 확인했다.\"}, {\"title\": \"lingo by abbott\", \"url\": \"https://www.hellolingo.com/\", \"note\": \"경쟁 센서의 시작 값이 54달러라는 점을 확인했다.\"}]}"},{"slug":"superpower","name":"Superpower","one_liner":"연 349달러 구독으로 1년에 두 차례 채혈해 150여 개 혈액 지표를 재고, 그 결과를 AI와 상주 의료진이 해석해 보충제와 처방약, 펩타이드 구매까지 같은 앱 안에서 이어 주는 소비자용 건강 구독 서비스다.","sells_to":"consumer","seen_in":[{"issue":"14","section":16,"headline":"경쟁사 Function Health가 기만적 광고를 주장하며 소송을 걸었고, 필자는 잘 자본화된 D2C 롱제비티 스타트업 두 곳이 초반부터 점유율 다툼을 벌이는 모습을 시장 모멘텀이 식는 신호로 읽었다."}],"card":{"problem":"미국에서는 보험이 있어도 일반 건강검진에서 재는 혈액 항목이 몇 가지에 그치고, 더 알아보려면 항목마다 따로 검사를 사야 해서 금액이 빠르게 불어난다. 그래서 아직 아프지 않은 사람이 자기 몸 상태를 미리 확인할 창구가 마땅치 않다.","solution":"연 349달러 구독을 팔아 1년에 두 번 채혈로 150여 개 지표를 재고, 결과를 생물학적 나이와 17개 건강 점수로 정리해 AI와 케어팀이 실행 계획을 준다. 계획에 나온 보충제와 처방약, 펩타이드를 같은 구독 안에서 바로 살 수 있게 붙여 두었다.","price":"연 349달러이고 뉴욕과 뉴저지는 값이 다르다. 집으로 채혈 인력을 부르는 것, 암 조기발견 검사와 장내 미생물 검사 같은 추가 검사, 보충제와 처방약은 따로 낸다.","tags":["혈액검사","연간 구독","예방","AI 해석","보충제 판매"],"headline_traction":"2025년 4월 시리즈 A로 3,000만 달러를 받았고, Forbes Australia는 2026년 4월 기준으로 이 라운드의 총액이 4,300만 달러, 기업 가치가 4억 3,200만 달러라고 전했다.","watch":"Function Health이 낸 허위광고 소송은 2026년 6월에 합의로 끝났으나 합의 내용은 공개되지 않았고, 회원 만족도와 매출 성장 수치는 모두 회사가 스스로 낸 것이다."},"screenshots":[{"file":"superpower_home.png","caption":"첫 화면이다. 두 번의 채혈로 150개가 넘는 검사를 받고 값은 연 349달러라는 문구를 맨 위에 걸어 두었다.","from":"https://superpower.com"},{"file":"superpower_pricing.png","caption":"값 안내 페이지다. 연 349달러에 무엇이 들어가는지, 추가 검사와 펩타이드, 처방약이 어떻게 별도로 붙는지 보여 준다.","from":"https://superpower.com/pricing"},{"file":"superpower_vs_function.png","caption":"회사가 직접 만든 Function Health 비교 페이지다. 소송의 쟁점이던 항목 수 표기가 여기서는 첫 채혈 90개가량으로 적혀 있어 홈페이지의 150개 표기와 대비된다.","from":"https://superpower.com/superpower-vs-function"}],"q":"{\"slug\": \"superpower\", \"name\": \"superpower\", \"one_liner\": \"연 349달러 구독으로 1년에 두 차례 채혈해 150여 개 혈액 지표를 재고, 그 결과를 ai와 상주 의료진이 해석해 보충제와 처방약, 펩타이드 구매까지 같은 앱 안에서 이어 주는 소비자용 건강 구독 서비스다.\", \"site\": \"https://superpower.com\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"14\", \"section\": 16, \"headline\": \"경쟁사 function health가 기만적 광고를 주장하며 소송을 걸었고, 필자는 잘 자본화된 d2c 롱제비티 스타트업 두 곳이 초반부터 점유율 다툼을 벌이는 모습을 시장 모멘텀이 식는 신호로 읽었다.\"}], \"card\": {\"problem\": \"미국에서는 보험이 있어도 일반 건강검진에서 재는 혈액 항목이 몇 가지에 그치고, 더 알아보려면 항목마다 따로 검사를 사야 해서 금액이 빠르게 불어난다. 그래서 아직 아프지 않은 사람이 자기 몸 상태를 미리 확인할 창구가 마땅치 않다.\", \"solution\": \"연 349달러 구독을 팔아 1년에 두 번 채혈로 150여 개 지표를 재고, 결과를 생물학적 나이와 17개 건강 점수로 정리해 ai와 케어팀이 실행 계획을 준다. 계획에 나온 보충제와 처방약, 펩타이드를 같은 구독 안에서 바로 살 수 있게 붙여 두었다.\", \"price\": \"연 349달러이고 뉴욕과 뉴저지는 값이 다르다. 집으로 채혈 인력을 부르는 것, 암 조기발견 검사와 장내 미생물 검사 같은 추가 검사, 보충제와 처방약은 따로 낸다.\", \"tags\": [\"혈액검사\", \"연간 구독\", \"예방\", \"ai 해석\", \"보충제 판매\"], \"headline_traction\": \"2025년 4월 시리즈 a로 3,000만 달러를 받았고, forbes australia는 2026년 4월 기준으로 이 라운드의 총액이 4,300만 달러, 기업 가치가 4억 3,200만 달러라고 전했다.\", \"watch\": \"function health이 낸 허위광고 소송은 2026년 6월에 합의로 끝났으나 합의 내용은 공개되지 않았고, 회원 만족도와 매출 성장 수치는 모두 회사가 스스로 낸 것이다.\"}, \"problem\": \"한국에서는 국가건강검진이 있고 동네 의원에서도 혈액검사를 싼값에 받을 수 있어서, 자기 수치를 확인하는 일 자체가 큰 결심을 요구하지 않는다. 미국은 보험이 있어도 예방 목적의 일반 건강검진에서 재는 혈액 항목이 몇 가지에 그치고, 그 밖의 항목은 보험사가 의학적으로 필요하다고 인정하는 범위에서만 값을 대준다. 필요를 인정받지 못하면 본인이 전액을 부담하는데 항목마다 값이 따로 붙기 때문에, 자세히 알아보려 할수록 금액이 빠르게 불어난다. 그 결과 아직 증상이 없는 사람이 몸 상태를 미리 확인하려 할 때 갈 곳이 마땅치 않고, 이 빈자리를 소비자가 자기 돈을 내는 검사 구독이 메우고 있다. 회사는 홈페이지에서 1만 달러가 들 만한 것을 349달러에 준다고 내세우는데, 1만 달러라는 값은 회사가 제시한 비교치일 뿐 근거는 밝혀져 있지 않다.\", \"solution\": \"회원으로 가입하면 기준선을 만드는 첫 채혈부터 한다. quest 계열 채혈 장소 2,000여 곳 가운데 하나를 고르거나 추가 비용을 내고 집으로 채혈 인력을 부를 수 있으며, 채혈 자체는 10분쯤 걸린다. 5일에서 10영업일 뒤 앱과 웹 대시보드에 결과가 올라오는데, 개별 수치뿐 아니라 생물학적 나이와 17개 건강 점수로 정리해 보여 준다. 과거에 다른 곳에서 받은 검사지를 올리고 oura, whoop, 애플 헬스 같은 기기를 연결해 한곳에 모을 수 있다. 그다음에는 ai 채팅과 24시간 메시지로 이어지는 케어팀이 식사, 운동, 보충제, 치료를 묶은 실행 계획을 주고, 회원 전용 마켓플레이스에서 보충제와 처방약, 펩타이드를 회원가로 살 수 있다. 반년쯤 뒤 두 번째 채혈로 60여 개 항목을 다시 재서 달라진 부분을 확인한다. 값은 연 349달러이고 뉴욕과 뉴저지는 다르며, 미국 의료비 전용 계좌인 hsa와 fsa로 결제할 수 있다고 안내한다.\", \"features\": [{\"name\": \"연 2회 혈액검사\", \"detail\": \"1년에 두 번 채혈해 회사 표기로 150개가 넘는 지표를 잰다. 회사가 만든 function health 비교 페이지에는 첫 채혈에서 90개가량을 재고 두 번째에 60개가량을 다시 잰다고 적혀 있다.\"}, {\"name\": \"건강 데이터 통합\", \"detail\": \"다른 곳에서 받은 과거 검사지를 올리고 oura, whoop, 애플 헬스 같은 기기를 연결해 한 화면에서 함께 본다.\"}, {\"name\": \"생물학적 나이와 17개 건강 점수\", \"detail\": \"혈액 수치를 심혈관, 대사, 호르몬, 갑상선, 간, 신장, 염증, 독소 노출 같은 갈래로 묶어 점수로 환산해 보여 준다.\"}, {\"name\": \"ai 채팅과 24시간 케어팀\", \"detail\": \"본인 검사 결과를 그대로 아는 상태에서 대화하는 ai 채팅을 두고, 그 옆에 면허를 가진 의료진에게 메시지로 물어보는 창구를 붙여 두었다.\"}, {\"name\": \"추가 검사 판매\", \"detail\": \"grail의 galleri 다중암 조기발견 검사, 장내 미생물 분석, 중금속과 환경 독소 검사, 심장질환 유전 위험 검사를 회원 대상 별도 상품으로 판다. 값은 회원 로그인 뒤에만 보인다.\"}, {\"name\": \"회원 전용 마켓플레이스\", \"detail\": \"사이트맵 기준으로 상품 페이지가 220개 있다. 보충제가 대부분이고 그 사이에 세마글루타이드, 메트포르민, 타다라필, 엔클로미펜, 저용량 날트렉손 같은 처방약과 세르모렐린, 고나도렐린, ghk-cu 크림 같은 펩타이드가 섞여 있다. 문진표를 작성하면 소속 의사가 검토해 승인하는 방식이고, 조제 의약품은 fda가 안전성과 효과를 확인해 주지 않는다는 고지가 상품 페이지에 붙어 있다.\"}, {\"name\": \"펩타이드 별도 브랜드\", \"detail\": \"펩타이드만 따로 떼어 낸 페이지가 있으나 2026년 9월 현재 대기자 등록만 받는다. 회사 로드맵 페이지에는 2026년 초에 자체 클리닉을 통해 glp-1 계열 비만 치료제, 호르몬, 피부와 롱제비티 펩타이드를 내놓겠다고 적혀 있다.\"}, {\"name\": \"ios 앱\", \"detail\": \"2026년 1월 14일에 나왔고 무료이며 미국 앱스토어 평점은 4.9, 평가 수는 1,391개다. 구글 플레이에서는 같은 회사의 안드로이드 앱을 찾지 못했다.\"}, {\"name\": \"기업 판매 채널\", \"detail\": \"직원용으로 같은 회원권을 파는 별도 페이지가 있고 인사 시스템 연동을 안내한다. 값은 공개하지 않고 상담으로만 받는다. susa ventures, wordware, haven의 후기가 실려 있다.\"}, {\"name\": \"검색 유입용 콘텐츠\", \"detail\": \"사이트맵에 2,481개 주소가 들어 있고 그 가운데 건강 가이드가 1,531개, 개별 생체지표 설명이 387개다. 경쟁사 비교 페이지도 12개 따로 만들어 두었다.\"}], \"differentiator\": \"function health은 값이 연 365달러로 거의 같고 검사 항목 수도 비슷하게 내세우며, 두 회사 모두 실제 검사는 quest에 맡긴다. 그래서 검사 자체로는 크게 다르지 않고, superpower는 결과를 받은 다음에 무엇을 할지까지 같은 구독 안에서 끝낸다는 점을 차이로 내세운다. 자사 비교 페이지에서 function health은 보충제를 suppco라는 다른 회사로 넘기지만 자기들은 보충제와 처방약, 펩타이드를 직접 판다고 적어 두었다. 다만 function health은 전신 mri 회사 ezra를 인수해 영상 검사 쪽으로 넓혔고, mito health과 insidetracker, lifeforce처럼 같은 형태로 파는 회사가 여럿 있어서 값과 항목 수만 놓고 보면 서로 구별하기 어렵다. 두 회사가 소송까지 간 쟁점도 기술이 아니라 항목 수를 세는 방식이었다.\", \"team\": [{\"name\": \"max marchione\", \"role\": \"공동 창업자 겸 ceo\", \"background\": \"호주 사람이고 시드니대학교 상경 및 법학 과정을 중퇴한 뒤 창업했다. 2026년 4월 기사 기준 20대 중반이다. 20명이 넘는 의사에게 오진을 겪은 경험을 창업 계기로 밝혔다.\"}, {\"name\": \"jacob peters\", \"role\": \"공동 창업자 겸 executive chairman\", \"background\": \"원인을 찾지 못한 질환에 200만 달러를 쓰고 목숨을 잃을 뻔한 경험을 창업 계기로 밝혔다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"kevin unkrich\", \"role\": \"공동 창업자\", \"background\": \"가장 친한 친구가 예정된 mri 검사를 받기 전에 뇌종양으로 세상을 떠난 일을 창업 계기로 밝혔다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"anant vinjamoori\", \"role\": \"chief longevity officer\", \"background\": \"회사 소개 페이지에 의사로 올라 있으나 이전 경력은 확인하지 못했다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"forerunner ventures가 주도한 시리즈 a로 3,000만 달러를 받았다. susa ventures, long journey ventures, day one ventures, winklevoss capital 등이 참여했고 doordash 공동 창업자 evan moore, balaji srinivasan, 배우 vanessa hudgens, dj steve aoki, 농구 선수 giannis antetokounmpo, 축구 선수 kylian mbappé가 개인 자격으로 들어왔다.\", \"when\": \"2025-04\", \"source\": \"회사 시리즈 a 발표 페이지, techcrunch, fierce healthcare\"}, {\"type\": \"funding\", \"detail\": \"forbes australia는 시리즈 a 총액이 4,300만 달러이고 그 뒤 기업 가치가 4억 3,200만 달러가 되었으며 누적 조달액이 6,500만 호주달러를 넘는다고 전했다. 회사 발표 페이지의 3,000만 달러와 금액이 다른데, 라운드가 뒤에 늘어난 것인지 집계 기준이 다른 것인지는 확인하지 못했다.\", \"when\": \"2026-04\", \"source\": \"forbes australia\"}, {\"type\": \"customers\", \"detail\": \"2025년 4월 일반 공개 시점에 대기자가 15만 명이었다고 밝혔다. 이 숫자는 회원 수가 아니라 대기자 수다.\", \"when\": \"2025-04\", \"source\": \"techcrunch. 회사가 밝힌 수치다.\"}, {\"type\": \"partnership\", \"detail\": \"가정용 검사 회사 base와 호르몬 건강 회사 feminade를 인수했다.\", \"when\": \"2025\", \"source\": \"fitt insider, business insider 기사 제목. 인수 금액과 정확한 시점은 확인하지 못했다.\"}, {\"type\": \"partnership\", \"detail\": \"david beckham의 보충제 회사 im8과 제휴해, 검사 결과와 보충제 처방을 잇는 구조를 만들겠다고 밝혔다.\", \"when\": \"2026-04\", \"source\": \"forbes australia\"}, {\"type\": \"partnership\", \"detail\": \"grail의 galleri 다중암 조기발견 검사를 회원 대상 추가 상품으로 판다.\", \"when\": \"2026-09\", \"source\": \"회사 사이트 값 안내 페이지와 마켓플레이스 상품 목록에서 직접 확인했다.\"}, {\"type\": \"revenue\", \"detail\": \"직전 6개월 동안 매출이 10배 늘었다고 밝혔다. 금액은 공개하지 않았다.\", \"when\": \"2026-04\", \"source\": \"forbes australia에 실린 회사 주장. 제삼자가 확인한 수치가 아니다.\"}, {\"type\": \"traffic\", \"detail\": \"사이트맵을 직접 세어 보면 주소가 2,481개이고 그 가운데 건강 가이드가 1,531개, 생체지표 설명이 387개다. 검색으로 사람을 끌어들이는 데 상당한 자원을 쓰고 있다는 뜻이다.\", \"when\": \"2026-09\", \"source\": \"https://superpower.com/sitemap-webflow.xml 을 직접 집계\"}, {\"type\": \"customers\", \"detail\": \"미국 아이폰 앱스토어 평점이 4.9이고 평가 수가 1,391개다. 2026년 1월에 나온 앱치고는 평가가 빠르게 쌓였다.\", \"when\": \"2026-09\", \"source\": \"애플 앱스토어 조회 api로 직접 확인\"}], \"caveats\": \"뉴스레터가 다룬 소송은 이미 끝났다. 사건은 function health, inc. v. superpower health inc.이고 캘리포니아 중부 연방지방법원에 2026년 1월 26일 제기됐으며 사건번호는 2:26-cv-00810, 담당 판사는 john f. walter, 청구 근거는 상표와 허위광고를 다루는 랜햄법이다. 2026년 6월 12일 양측이 합의했다고 법원에 알렸고 법원은 소를 각하하면서 7월 13일까지만 재개할 수 있도록 했으므로, 그 이후로는 각하가 확정된 상태다. superpower는 답변서를 낸 적이 없고 합의 내용도 공개되지 않았다. 소송의 쟁점은 기술이 아니라 숫자를 세는 방식이었다. 보도에 따르면 function health은 superpower가 기본 회원권에 생체지표 100개가 넘게 들어간다고 광고하지만 실제로 직접 측정하는 항목은 55개쯤이고 나머지는 계산으로 얻은 비율과 지수라고 주장했다. 이 주장 자체는 원고 쪽 주장이며 법원이 판단한 적이 없다. 지금도 회사 안에서 표기가 갈린다. 홈페이지는 150개가 넘는다고 적고, 회사가 만든 function health 비교 페이지는 첫 채혈 90개가량이라고 적으며, 아이폰 앱스토어 설명과 기업용 페이지에는 여전히 100개가 넘는다고 적혀 있다. 값도 갈린다. 홈페이지와 값 안내 페이지는 연 349달러인데 마켓플레이스 상품 페이지는 연 결제 기준 월 17달러로 안내한다. 소송을 보도한 2026년 2월 기사에는 기본 회원권이 연 199달러로 적혀 있어서, 그 뒤 값이 올랐거나 상품 구성이 바뀐 것으로 보인다. 회사가 내세우는 수치는 대부분 자체 집계다. 회원의 93%가 자기 의사보다 낫다고 답했다, 60%가 의사가 놓친 것을 발견했다, 85%가 활력이 크게 좋아졌다는 세 수치는 소개 페이지에 조사 방법 없이 실려 있다. 6개월 매출 10배도 회사 주장이다. 15만이라는 숫자는 두 갈래로 쓰이는데, 2025년 4월 공개 시점의 대기자 수이고 사이트 하단의 15만 명은 무료 안내 자료를 받는 이메일 구독 권유 문구이므로 회원 수로 읽으면 안 된다. 마지막으로 마켓플레이스에서 파는 조제 펩타이드와 처방약에는 fda가 안전성과 효과, 품질을 확인해 주지 않는다는 고지가 상품 페이지에 붙어 있다. 안드로이드 앱은 구글 플레이에서 찾지 못했다.\", \"for_us\": \"우리는 3개월 안에 채혈과 검사실 계약을 붙일 수 없으므로 검사 자체는 가져올 대상이 아니다. 가져올 것은 검사 뒤에 붙은 화면 구조다. 첫째, 흩어진 수치를 하나로 모으는 진입이다. 과거 검사지를 올리고 웨어러블을 연결해 한 화면에서 같이 보게 하는 것만으로 검사 없이도 쓸 이유가 생기고, 우리 앱에는 이미 건강검진 수치와 식단 기록이 들어와 있다. 둘째, 수치를 항목별 점수로 환산해 무엇이 좋고 무엇을 봐야 하는지 즉시 알려 주는 방식이다. 다만 우리 앱에는 이미 건강 나이가 있으므로 생물학적 나이는 제외하고, 심혈관이나 대사처럼 갈래별로 나눈 점수와 그 아래 붙는 실행 계획만 본다. 셋째, 결과를 그대로 두지 않고 무엇을 할지, 무엇을 살지까지 잇는 구조다. superpower가 function health과 다르다고 내세우는 지점이 바로 여기이고, 소프트웨어만으로 만들 수 있는 부분이기도 하다. 넷째, 소송이 남긴 교훈이다. 두 회사가 다툰 것은 기술이 아니라 항목 수를 세는 방식이었으므로, 우리가 미국에서 숫자를 앞세울 때는 그 숫자를 어떻게 셌는지 화면에 함께 적어 두어야 한다. 한편 필자가 이 소송을 시장 열기가 식는 신호로 읽었다는 점은 그대로 받아들이지 않는 편이 낫다. 소송은 넉 달 만에 합의로 끝났고, function health은 그 뒤인 2026년 7월에 추가로 큰 자금을 조달했다고 보도됐다.\", \"screenshots\": [{\"file\": \"superpower_home.png\", \"caption\": \"첫 화면이다. 두 번의 채혈로 150개가 넘는 검사를 받고 값은 연 349달러라는 문구를 맨 위에 걸어 두었다.\", \"from\": \"https://superpower.com\"}, {\"file\": \"superpower_pricing.png\", \"caption\": \"값 안내 페이지다. 연 349달러에 무엇이 들어가는지, 추가 검사와 펩타이드, 처방약이 어떻게 별도로 붙는지 보여 준다.\", \"from\": \"https://superpower.com/pricing\"}, {\"file\": \"superpower_vs_function.png\", \"caption\": \"회사가 직접 만든 function health 비교 페이지다. 소송의 쟁점이던 항목 수 표기가 여기서는 첫 채혈 90개가량으로 적혀 있어 홈페이지의 150개 표기와 대비된다.\", \"from\": \"https://superpower.com/superpower-vs-function\"}, {\"file\": \"superpower_ios.png\", \"caption\": \"미국 아이폰 앱스토어 페이지다. 2026년 1월에 나왔고 평점 4.9에 평가가 1,391개다. 설명에는 아직 연 100개가 넘는 검사라고 적혀 있다.\", \"from\": \"https://apps.apple.com/us/app/superpower/id6747997159\"}], \"sources\": [{\"title\": \"superpower 공식 사이트 첫 화면\", \"url\": \"https://superpower.com\", \"note\": \"연 349달러, 두 번의 채혈로 150개가 넘는 검사, quest 2,000여 곳, 1,000가지가 넘는 질환 조기 발견이라는 표기를 확인했다.\"}, {\"title\": \"superpower 값 안내\", \"url\": \"https://superpower.com/pricing\", \"note\": \"회원권에 들어가는 것과 별도로 값을 내는 것, 뉴욕과 뉴저지는 값이 다르다는 문구, hsa와 fsa 결제 가능 여부를 확인했다.\"}, {\"title\": \"superpower 소개 페이지\", \"url\": \"https://superpower.com/about\", \"note\": \"회원 93%, 60%, 85%라는 자체 집계 수치와 의료 자문단, 투자자 명단, 그리고 15만 명이라는 숫자가 이메일 구독 권유 문구라는 점을 확인했다.\"}, {\"title\": \"superpower vs function health 비교 페이지\", \"url\": \"https://superpower.com/superpower-vs-function\", \"note\": \"첫 채혈 90개가량, 재검 60개가량이라는 자체 표기와 function health과의 값 및 기능 비교를 확인했다.\"}, {\"title\": \"superpower 시리즈 a 발표\", \"url\": \"https://superpower.com/series-a\", \"note\": \"창업자 max marchione과 jacob peters의 이름과 직함, 3,000만 달러 라운드, 투자자 명단을 확인했다.\"}, {\"title\": \"superpower 로드맵\", \"url\": \"https://superpower.com/roadmap\", \"note\": \"ios 앱, 펩타이드, glp-1 계열 약, 장기 나이 검사 출시 예고와 2026년 초 클리닉 계획을 확인했다.\"}, {\"title\": \"superpower 펩타이드 페이지\", \"url\": \"https://superpower.com/peptides\", \"note\": \"2026년 9월 현재 대기자 등록만 받고 있다는 것을 확인했다.\"}, {\"title\": \"superpower 기업용 페이지\", \"url\": \"https://superpower.com/organizations\", \"note\": \"직원용 판매 채널의 존재와 100개가 넘는 검사라는 표기, 고객사 후기를 확인했다.\"}, {\"title\": \"superpower 마켓플레이스 세르모렐린 상품 페이지\", \"url\": \"https://superpower.com/marketplace/products/sermorelin-injection\", \"note\": \"회원 전용 판매, 문진표와 의사 승인 절차, 조제 의약품에 대한 fda 미승인 고지, 월 17달러 표기를 확인했다.\"}, {\"title\": \"superpower 사이트맵\", \"url\": \"https://superpower.com/sitemap-webflow.xml\", \"note\": \"주소 2,481개를 직접 세어 가이드 1,531개, 생체지표 387개, 마켓플레이스 상품 220개, 경쟁사 비교 12개를 확인했다.\"}, {\"title\": \"function health, inc. v. superpower health inc. 사건 기록\", \"url\": \"https://www.courtlistener.com/docket/72191232/function-health-inc-v-superpower-health-inc/\", \"note\": \"사건번호 2:26-cv-00810, 2026년 1월 26일 제소, 랜햄법, 2026년 6월 12일 합의에 따른 각하 명령 원문을 확인했다.\"}, {\"title\": \"function sues rival lab-testing startup superpower, alleging false marketing (athletech news)\", \"url\": \"https://athletechnews.com/function-superpower-lawsuit-lab-testing/\", \"note\": \"직접 측정 55개 주장, 두 회사의 값과 조달 내역, 소송 제기 시점을 확인했다.\"}, {\"title\": \"function sues superpower over biomarker claims (fitt insider)\", \"url\": \"https://insider.fitt.co/function-sues-superpower-over-biomarker-claims/\", \"note\": \"두 회사가 모두 quest에 검사를 맡긴다는 점, superpower의 base와 feminade 인수를 확인했다.\"}, {\"title\": \"superpower wants to help people detect and address health issues before symptoms appear (techcrunch)\", \"url\": \"https://techcrunch.com/2025/04/22/superpower-wants-to-help-people-detect-and-address-health-issues-before-symptoms-appear/\", \"note\": \"창업자 세 사람의 이름과 창업 계기, 시리즈 a 3,000만 달러, 공개 시점 대기자 15만 명을 확인했다.\"}, {\"title\": \"sydney uni dropout behind $432m startup teams up with beckham to outsmart aging (forbes australia)\", \"url\": \"https://www.forbes.com.au/news/entrepreneurs/sydney-uni-dropout-behind-432m-startup-teams-up-with-beckham-to-outsmart-aging/\", \"note\": \"max marchione의 학력과 중퇴, 기업 가치 4억 3,200만 달러, 6개월 매출 10배 주장, im8 제휴, 소송에 대한 창업자의 부인을 확인했다.\"}, {\"title\": \"superpower 아이폰 앱\", \"url\": \"https://apps.apple.com/us/app/superpower/id6747997159\", \"note\": \"2026년 1월 14일 출시, 무료, 평점 4.9와 평가 1,391개, 그리고 설명에 남아 있는 100개가 넘는 검사 표기를 확인했다.\"}, {\"title\": \"function lands another $450m, growth financing general catalyst (athletech news)\", \"url\": \"https://athletechnews.com/function-450-million-growth-financing-general-catalyst/\", \"note\": \"소송이 합의로 끝난 뒤인 2026년 7월에 function health이 추가 자금을 조달했다는 보도 제목과 날짜를 검색 목록에서 확인했다. 본문은 열지 않았다.\"}]}"},{"slug":"suppco","name":"SuppCo","one_liner":"자기가 먹는 보충제를 바코드로 찍어 등록하면 제품 품질과 조합의 허점을 점수로 매겨 주고 복용 일정까지 짜 주는 무료 소비자 앱이며, 자기 제품을 만들어 팔지는 않고 브랜드 제품 구매로 연결한다.","sells_to":"consumer","seen_in":[{"issue":"42","section":12,"headline":"Function이 개인 맞춤 보충제 조합을 짜 주는 SuppCo를 금액 비공개로 인수했다는 짧은 소식이며, 필자는 이 자리를 빌려 투자사 Union Square Ventures의 롱제비티 강세론을 소개하면서 자신은 그 비전에 깊이 회의적이라고 밝혔다."}],"card":{"problem":"미국에서 보충제는 의약품과 달리 팔기 전에 당국 허가를 받지 않으므로, 병에 적힌 성분이 실제로 그만큼 들었는지 소비자가 확인할 길이 없다. 여러 병을 함께 먹으면 성분이 겹치거나 모자라는데 그 총량을 대신 계산해 주는 곳도 없다.","solution":"먹고 있는 제품을 바코드로 찍어 등록하면 제품 품질을 0에서 10까지 점수로 보여 주고, 조합 전체를 다시 한 숫자로 점수 매겨 무엇을 바꾸라고 알려 주며, 복용 시각 알림과 전문가가 짠 조합까지 붙여 준다.","price":"앱과 웹 모두 무료이고, 더 깊은 개인 맞춤은 Pro 구독으로 판다. 회사는 Pro 값을 공개하지 않으며, 구글 플레이에는 앱 안 결제가 건당 9.99달러에서 59.99달러라고만 표시된다.","tags":["보충제","품질 점수","조합 분석","무료 앱","구독"],"headline_traction":"2024년 10월 베타와 함께 시드 550만 달러를 받았고, 2025년 말 회원 50만 명을 넘겼다고 밝힌 뒤 2026년 5월 Function Health에 인수됐다.","watch":"회원 수와 성장 폭은 모두 회사가 스스로 낸 수치이고 제삼자가 확인한 것이 아니며, 수록 제품 수도 자료에 따라 2만 건에서 23만 건까지 달라진다."},"screenshots":[{"file":"suppco_home.png","caption":"공식 사이트 첫 화면이다. 맨 위에 Function이 SuppCo를 인수했다는 안내가 걸려 있고, 조합 점수 91점을 보여 주는 앱 화면을 앞세운다.","from":"https://supp.co"},{"file":"suppco_trustscore.png","caption":"품질 점수 TrustScore 안내 페이지다. 제품마다 0에서 10까지 점수를 매기고 비활성 성분, 제조 기준, 검사 이력을 나눠 보여 준다.","from":"https://supp.co/trustscore"},{"file":"suppco_product.png","caption":"제품 상세 페이지다. 품질 점수와 성분 함량뿐 아니라 같은 분류 안에서 값이 비싼 편인지, 인기 순위가 어디쯤인지까지 보여 주고 구매 버튼이 붙어 있다.","from":"https://supp.co/products/momentous-omega-3"}],"q":"{\"slug\": \"suppco\", \"name\": \"suppco\", \"one_liner\": \"자기가 먹는 보충제를 바코드로 찍어 등록하면 제품 품질과 조합의 허점을 점수로 매겨 주고 복용 일정까지 짜 주는 무료 소비자 앱이며, 자기 제품을 만들어 팔지는 않고 브랜드 제품 구매로 연결한다.\", \"site\": \"https://supp.co\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"42\", \"section\": 12, \"headline\": \"function이 개인 맞춤 보충제 조합을 짜 주는 suppco를 금액 비공개로 인수했다는 짧은 소식이며, 필자는 이 자리를 빌려 투자사 union square ventures의 롱제비티 강세론을 소개하면서 자신은 그 비전에 깊이 회의적이라고 밝혔다.\"}], \"card\": {\"problem\": \"미국에서 보충제는 의약품과 달리 팔기 전에 당국 허가를 받지 않으므로, 병에 적힌 성분이 실제로 그만큼 들었는지 소비자가 확인할 길이 없다. 여러 병을 함께 먹으면 성분이 겹치거나 모자라는데 그 총량을 대신 계산해 주는 곳도 없다.\", \"solution\": \"먹고 있는 제품을 바코드로 찍어 등록하면 제품 품질을 0에서 10까지 점수로 보여 주고, 조합 전체를 다시 한 숫자로 점수 매겨 무엇을 바꾸라고 알려 주며, 복용 시각 알림과 전문가가 짠 조합까지 붙여 준다.\", \"price\": \"앱과 웹 모두 무료이고, 더 깊은 개인 맞춤은 pro 구독으로 판다. 회사는 pro 값을 공개하지 않으며, 구글 플레이에는 앱 안 결제가 건당 9.99달러에서 59.99달러라고만 표시된다.\", \"tags\": [\"보충제\", \"품질 점수\", \"조합 분석\", \"무료 앱\", \"구독\"], \"headline_traction\": \"2024년 10월 베타와 함께 시드 550만 달러를 받았고, 2025년 말 회원 50만 명을 넘겼다고 밝힌 뒤 2026년 5월 function health에 인수됐다.\", \"watch\": \"회원 수와 성장 폭은 모두 회사가 스스로 낸 수치이고 제삼자가 확인한 것이 아니며, 수록 제품 수도 자료에 따라 2만 건에서 23만 건까지 달라진다.\"}, \"problem\": \"한국에서는 영양제를 사면 건강기능식품 마크와 인정 번호가 붙고, 식약처가 기능성과 함량을 미리 심사한 결과가 그 표시에 담긴다. 미국은 보충제를 식품에 가깝게 다루어 팔기 전에 당국이 내용물을 심사하지 않으며, suppco 웹사이트의 모든 페이지 아래에도 이 내용은 식품의약국이 평가하지 않았다는 고지가 붙어 있다. 그래서 소비자는 병에 적힌 성분이 실제로 그만큼 들었는지, 만든 공장이 어떤 기준을 지켰는지 스스로 알아내야 한다. 회사 설명으로는 미국인의 58퍼센트가 하루에 하나 이상 보충제를 먹고 시장 규모는 연 2,000억 달러에 이르는데, 그만큼 팔리면서도 무엇을 얼마나 먹어야 하는지 정리해 주는 곳이 없다. 여러 병을 함께 먹으면 같은 성분이 겹치거나 모자라는 문제도 생기는데, 창업자는 이것을 직접 표를 만들어 손으로 더하고 있었다고 밝힌다. 회사는 또 대부분의 사람이 첫 30일 안에 복용을 그만두며, 효과가 나타날 만한 기간을 채우기 전에 멈춘다고 지적한다.\", \"solution\": \"가입은 무료이고, 앱에서 먹고 있는 제품을 바코드로 찍거나 이름으로 검색해 등록하는 것으로 시작한다. 등록하면 제품마다 trustscore라는 품질 점수가 0에서 10까지 붙는데, 제조 기준과 제삼자 인증, 검사 이력 같은 다섯 범주 30여 개 항목을 따져 매긴 값이다. 등록한 제품 전체는 다시 stackscore라는 한 개 점수로 묶여, 품질과 목표 충족도와 용량을 기준으로 무엇이 부족하고 무엇을 빼야 하는지 알려 준다. 성분 총량이 합산돼 나이와 성별 기준에 견주어 표시되고, 복용 시각 알림과 매일 섭취 기록이 붙는다. 목표가 정해져 있으면 장수, 장 건강, 운동, 체중 관리, 임신 준비처럼 분야를 나눠 전문가 일곱 명이 짠 80여 개 조합을 그대로 따라갈 수 있다. 값은 무료가 기본이고, 개인별 영양소 계획과 제품 최적화, 무제한 조합 분석 같은 기능은 pro 구독으로 판다.\", \"features\": [{\"name\": \"trustscore (제품·브랜드 품질 점수)\", \"detail\": \"제조 기준, 제품 인증, 품질 지표, 검사 이력, 기술 혁신의 다섯 범주에서 30여 개 항목을 따져 0에서 10까지 점수를 매긴다. 브랜드 500곳이 넘게 평가돼 있고, 회사 설명으로는 공개된 브랜드 자료와 라벨, 정부 데이터베이스를 검토하고 필요하면 브랜드에 직접 자료를 요청해 매긴다.\"}, {\"name\": \"stackscore (조합 점수)\", \"detail\": \"등록한 보충제 전체를 한 개 점수로 요약한다. 2025년 9월에 기존 suppscore를 갈아엎고 다시 내놓았으며, 네 범주로 점수를 나누고 달마다 자동으로 다시 계산한다. 사용자가 직접 다시 계산하는 것은 한 달에 세 번까지다.\"}, {\"name\": \"바코드 스캔 등록과 복용 일정\", \"detail\": \"제품 바코드를 찍으면 성분표 전체가 불러와진다. 성분 총량이 합산되고, 복용 시각 알림과 매일 섭취 기록이 따라붙는다.\"}, {\"name\": \"expert protocols (전문가 조합)\", \"detail\": \"mark hyman, robin berzin, natalie crawford, darshan shah, bruce hoffman, thomas delauer, lanae mullane 일곱 명이 분야를 나눠 짠 80여 개 보충제 조합이다. mark hyman은 인수한 쪽인 function health의 공동창업자 겸 최고의료책임자이기도 하다.\"}, {\"name\": \"suppiq (ai 보충제 비서)\", \"detail\": \"2025년 12월에 내놓은 대화형 기능으로, 사용자의 조합과 목표를 알고 있는 상태에서 질문에 답하고 조합을 대신 고친다. 회사는 출시 한 달 만에 대화가 7만 건을 넘었다고 밝혔다.\"}, {\"name\": \"nutrient research center (성분 연구 자료실)\", \"detail\": \"성분별로 임상 연구를 모아 목표에 맞게 걸러 보여 준다. 회사는 2만 편이 넘는 연구를 다룬다고 적는다.\"}, {\"name\": \"nutrient journeys (성분 여정 추적)\", \"detail\": \"새로 먹기 시작한 성분에 대해 주차별로 무엇을 기대할 수 있는지 알려 주고 효과를 기록하게 한다. 2026년 2월 기준 13개 성분으로 늘었고, 같은 여정을 밟는 다른 사용자가 몇 명이고 그들에게는 어떤 결과가 나왔는지도 보여 준다.\"}, {\"name\": \"tested by suppco (자체 검사 인증)\", \"detail\": \"2026년 3월에 시작한 인증 제도다. 브랜드가 고른 시료를 받는 기존 인증과 달리, suppco가 브랜드 웹사이트에서 신분을 밝히지 않고 사서 iso 17025 인증 실험실로 보낸다. 표시된 함량의 95퍼센트 이상을 채운 제품만 인증을 받고 해마다 다시 검사한다. thorne, metagenics, momentous를 포함해 10개 브랜드가 첫 참여 대상이다.\"}, {\"name\": \"pro 구독\", \"detail\": \"2025년 7월에 조용히 시험 출시해 9월에 모든 사용자에게 열었다. 개인별 영양소 계획, 제품 최적화, 무제한 조합 분석, suppiq 기반 심층 해석이 들어 있다. 2026년 3월에는 검사 결과지를 올려 성분 조언으로 바꿔 주는 바이오마커 분석을 pro 전용으로 붙인다고 예고했다.\"}, {\"name\": \"구매 연결과 buying club\", \"detail\": \"제품 페이지에 브랜드 공식몰과 아마존의 값이 함께 나오고 구매 링크가 걸린다. 앱 안에는 브랜드에서 곧바로 배송되는 판매 경로가 따로 있고, 10일에서 40일까지 주기를 고르는 buying club 정기구독이 붙어 있다. 회사 서버가 내려 주는 안내 문구는 pro 회원이 최대 30퍼센트를 돌려받는다고 적는다.\"}], \"differentiator\": \"개인에게 맞춰 보충제를 새로 조제해 파는 회사들과 달리 suppco는 자기 제품이 없다. 시중에 이미 나와 있는 제품을 점수 매기고, 사용자가 이미 먹고 있는 조합을 고쳐 주는 쪽에 서 있으며, 앱 소개에도 어떤 보충제 브랜드와도 제휴하지 않는다고 적는다. 검사 인증 쪽에서는 nsf나 informed sport 같은 기존 인증이 브랜드가 내어 준 시료를 검사하는 데 비해, tested by suppco는 브랜드 웹사이트에서 신분을 숨기고 사서 검사한다는 점을 내세운다. 다만 독립성을 내세우는 것과 달리 수익 구조는 판매 쪽에 붙어 있다. 제품 페이지에는 제휴 링크가 걸려 있고, 앱 안에는 브랜드 직배송 판매와 buying club 정기구독이 들어와 있으며 pro 회원에게는 구매액의 일부를 돌려준다. 회사는 창업 때부터 이 구조를 협동조합 비슷한 회원제라고 부르며 예고해 왔다.\", \"team\": [{\"name\": \"steve martocci\", \"role\": \"공동창업자 겸 최고경영자\", \"background\": \"메시지 앱 groupme를 만들어 skype에 팔았고, 그 뒤 음악 제작 플랫폼 splice의 최고경영자로 10년을 일했다. blade도 창업했다. 본인 글에 따르면 체중과 갑상선 문제로 오래 고생하다 기능의학 의사 joshua trutt와 분기마다 혈액검사를 하며 관리한 경험이 창업 계기가 됐고, 자기 보충제 조합을 표로 관리하던 것을 제품으로 옮겼다.\"}, {\"name\": \"nick michlewicz\", \"role\": \"공동창업자 겸 최고운영책임자\", \"background\": \"steve martocci의 창업 발표 글에 따르면 이전에 보충제 스타트업 두 곳을 만들었고, 그 과정에서 업계가 고객 이익과 어긋나 있는 것을 직접 겪었다. suppco의 월간 제품 소식 글은 대부분 그의 이름으로 나간다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"시드 550만 달러를 받았다. union square ventures와 true ventures가 함께 이끌었고 box group, compound, 지인들이 참여했다. 같은 날 베타를 열었다.\", \"when\": \"2024-10\", \"source\": \"suppco 베타 출시 발표(supp.co/about/beta, 2024년 10월 17일), union square ventures 투자 글\"}, {\"type\": \"partnership\", \"detail\": \"mark hyman을 비롯한 건강 전문가 일곱 명과 손잡고 전문가 조합(expert protocols)을 내놓았다. 회사는 이 시점에 전체 건강 분야의 60퍼센트가 전문가 손을 거친 조합으로 채워졌다고 밝혔다.\", \"when\": \"\", \"source\": \"suppco 전문가 소개 페이지(supp.co/about/experts)\"}, {\"type\": \"customers\", \"detail\": \"2025년을 회원 50만 명이 넘은 상태로 마감했다고 밝혔다. 회사가 낸 수치다.\", \"when\": \"2026-01\", \"source\": \"suppco 창업자 소식 11호(2026년 1월 3일)\"}, {\"type\": \"customers\", \"detail\": \"1월 소식 이후 한 달 남짓 사이에 회원이 15만 명 넘게 늘었다고 밝혔다. 회사가 낸 수치다.\", \"when\": \"2026-02\", \"source\": \"suppco 창업자 소식 12호(2026년 2월 27일)\"}, {\"type\": \"partnership\", \"detail\": \"자체 검사 인증 제도 tested by suppco를 시작했다. thorne, metagenics, momentous, designs for health, gaia, solaray, integrative therapeutics, fatty15, tru niagen, pendulum 10개 브랜드가 첫 참여 대상이다.\", \"when\": \"2026-03\", \"source\": \"suppco 창업자 소식 13호(2026년 3월 3일)\"}, {\"type\": \"partnership\", \"detail\": \"function health에 인수됐다. 금액은 공개하지 않았다. 회사 설명으로는 팀 전원이 function으로 옮기고 앱과 기존 기능은 그대로 이어지며, 앞으로 사용자의 혈액검사 수치와 보충제 조합을 연결하는 기능을 붙인다.\", \"when\": \"2026-05\", \"source\": \"suppco 창업자 소식 14호(2026년 5월 12일), health tech nerds 42회차\"}, {\"type\": \"traffic\", \"detail\": \"미국 애플 앱스토어에서 평가 29,273건에 평점 4.82를 받았고, 구글 플레이에서는 설치 10만 회 이상에 평점 4.7이다. 두 앱 모두 무료이며 앱 안 결제가 있다.\", \"when\": \"2026-09\", \"source\": \"애플 itunes 조회 api와 구글 플레이 상품 페이지에서 직접 확인\"}], \"caveats\": \"회원 50만 명, 한 달 15만 명 증가, suppiq 대화 7만 건 같은 수치는 모두 회사가 월간 소식 글에서 스스로 낸 것이고 제삼자가 확인한 것이 아니다. 수록 제품 수는 자료마다 다르다. 웹사이트 제목에는 23만 개가 넘는다고 적혀 있고, 애플 앱스토어 소개에는 16만 개가 넘는다고 적혀 있으며, 웹에서 실제로 둘러볼 수 있는 목록은 2만 390개다. 품질 점수가 매겨진 제품은 2026년 1월 기준 3만 5,000개라고 회사가 밝혔다. trustscore 자체도 suppco가 만든 기준이며, 공개된 브랜드 자료와 라벨을 사람이 검토해 매기는 것이지 제품을 실험실에서 검사한 결과가 아니다. 실제 검사는 2026년 3월에 시작한 tested 인증에만 해당하고, 그것도 브랜드가 스스로 참여를 신청한 제품에 한한다. 독립성과 수익 구조가 한 회사 안에 같이 있다는 점도 눈여겨봐야 한다. 앱 소개에는 어떤 보충제 브랜드와도 제휴하지 않는다고 적혀 있지만, 제품 페이지에는 제휴 링크가 걸려 있고 앱 안에는 브랜드 직배송 판매와 buying club 정기구독이 있으며 pro 회원은 구매액의 최대 30퍼센트를 돌려받는다. 회사도 창업 발표에서 제휴 링크가 있다는 사실은 밝혔다. pro 구독 값은 공식 페이지 어디에도 없고 구글 플레이의 앱 안 결제 범위 9.99달러에서 59.99달러가 공개된 유일한 단서다. 앱은 2026년 9월 현재도 스스로를 베타라고 표기한다. 인수 금액은 공개되지 않았고, 시드 550만 달러는 회사 발표와 뉴스레터가 같은 값을 적었으나 투자사 글에는 금액이 없다.\", \"for_us\": \"이 회사가 판 것은 보충제가 아니라 사용자가 이미 하고 있던 행동을 등록받아 숫자로 되돌려 준 화면이다. 제품도 없고 검사 장비도 없이 앱 하나로 1년 남짓에 회원 50만 명을 모았으니, 3개월 동안 소프트웨어 인력만으로 만들 수 있는 범위에 정확히 들어온다. 옮겨 볼 만한 장치가 세 가지 있다. 첫째, 바코드 스캔으로 등록 문턱을 없앤 점이다. 무엇을 먹는지 타이핑하게 하면 대부분 중간에 그만두는데, 병을 찍게 하면 등록이 끝난다. 둘째, 흩어진 입력을 stackscore라는 한 개 숫자로 묶고 달마다 자동으로 다시 계산해 알림을 보내는 구조다. 점수가 바뀌었다는 알림 자체가 재방문 이유가 되며, 직접 다시 계산하는 것은 한 달 세 번으로 묶어 pro 전환 지점까지 만들어 두었다. 셋째, nutrient journeys처럼 새로 시작한 것에 대해 주차별로 무엇을 기대할지 미리 알려 주고 같은 여정을 밟는 사람 수를 보여 주는 화면이다. 효과가 나기 전에 그만두는 문제를 정면으로 겨냥한 리텐션 장치이고, 우리 앱의 어떤 건강 행동에도 그대로 얹을 수 있다. 다만 두 가지는 조심해야 한다. 보충제 추천은 효능 주장으로 번지기 쉬워서, suppco도 모든 페이지에 식품의약국이 평가하지 않았다는 고지를 붙여 두었다. 그리고 건강 데이터를 다루면서 구매 수수료나 광고로 돈을 버는 구조는 미국에서 규제 위험이 붙는 자리이므로, 우리 앱이 같은 길을 가려면 데이터 사용 범위를 먼저 정리해야 한다.\", \"screenshots\": [{\"file\": \"suppco_home.png\", \"caption\": \"공식 사이트 첫 화면이다. 맨 위에 function이 suppco를 인수했다는 안내가 걸려 있고, 조합 점수 91점을 보여 주는 앱 화면을 앞세운다.\", \"from\": \"https://supp.co\"}, {\"file\": \"suppco_trustscore.png\", \"caption\": \"품질 점수 trustscore 안내 페이지다. 제품마다 0에서 10까지 점수를 매기고 비활성 성분, 제조 기준, 검사 이력을 나눠 보여 준다.\", \"from\": \"https://supp.co/trustscore\"}, {\"file\": \"suppco_product.png\", \"caption\": \"제품 상세 페이지다. 품질 점수와 성분 함량뿐 아니라 같은 분류 안에서 값이 비싼 편인지, 인기 순위가 어디쯤인지까지 보여 주고 구매 버튼이 붙어 있다.\", \"from\": \"https://supp.co/products/momentous-omega-3\"}, {\"file\": \"suppco_ios.png\", \"caption\": \"미국 애플 앱스토어 페이지다. 평가 29,273건에 평점 4.8로, 소비자용 앱이 주된 창구임을 보여 준다.\", \"from\": \"https://apps.apple.com/us/app/suppco/id6504838951\"}], \"sources\": [{\"title\": \"suppco 공식 사이트 첫 화면\", \"url\": \"https://supp.co\", \"note\": \"무료 이용과 pro 구독이 따로 있다는 사실, 조합 분석과 전문가 조합 80여 개, 연구 2만 편, 둘러볼 수 있는 제품 2만 390개를 확인했다.\"}, {\"title\": \"suppco 베타 출시와 시드 투자 발표\", \"url\": \"https://supp.co/about/beta\", \"note\": \"2024년 10월 17일 발표로 시드 550만 달러와 투자사 명단, 제품 23만 개, 브랜드 500곳, 조합 70여 개, 제휴 링크가 있다는 사실, 협동조합 비슷한 회원제 예고를 확인했다.\"}, {\"title\": \"suppco 창업자 이야기\", \"url\": \"https://supp.co/about/founder-story\", \"note\": \"steve martocci의 이름과 직함, groupme와 splice와 blade 경력, 창업 계기를 확인했다.\"}, {\"title\": \"suppco 선언문\", \"url\": \"https://supp.co/about/manifesto\", \"note\": \"미국인 58퍼센트가 하루 하나 이상 보충제를 먹는다는 회사 주장과 협동조합 지향을 확인했다.\"}, {\"title\": \"suppco 전문가 소개\", \"url\": \"https://supp.co/about/experts\", \"note\": \"전문가 일곱 명의 이름과 소개, mark hyman이 function health 공동창업자라는 사실을 확인했다.\"}, {\"title\": \"trustscore 작동 방식\", \"url\": \"https://supp.co/trustscore\", \"note\": \"다섯 범주 30여 개 항목의 구체적인 목록과 점수 산정 방식을 확인했다.\"}, {\"title\": \"창업자 소식 08호: stackscore와 pro 출시\", \"url\": \"https://supp.co/articles/founders-note-08-introducing-stackscore-and-pro\", \"note\": \"2025년 9월 12일 글로 stackscore 개편 내용, 월 자동 갱신과 수동 갱신 3회 제한, pro를 7월에 시험 출시했다는 사실을 확인했다.\"}, {\"title\": \"창업자 소식 11호: 2026년을 맞으며\", \"url\": \"https://supp.co/articles/founders-note-11-ringing-in-2026-together\", \"note\": \"2026년 1월 3일 글로 회원 50만 명 돌파, trustscore 적용 제품 3만 5,000개, suppiq 한 달 대화 7만 건을 확인했다. 모두 회사가 낸 수치다.\"}, {\"title\": \"창업자 소식 12호: 성분 여정, 바이오마커, 펩타이드\", \"url\": \"https://supp.co/articles/founders-note-12-nutrient-journeys-biomarkers-peptides\", \"note\": \"2026년 2월 27일 글로 한 달 사이 회원 15만 명 증가, 성분 여정 13개, pro 전용 바이오마커 분석 예고를 확인했다.\"}, {\"title\": \"창업자 소식 13호: tested by suppco 출시\", \"url\": \"https://supp.co/articles/founders-note-13-introducing-tested-by-suppco\", \"note\": \"2026년 3월 3일 글로 몰래 구입해 검사하는 방식, iso 17025 실험실, 표시량 95퍼센트 기준, 첫 참여 브랜드 10곳을 확인했다.\"}, {\"title\": \"창업자 소식 14호: function health와 함께 다음 단계로\", \"url\": \"https://supp.co/articles/founders-note-14-function-acquires-suppco\", \"note\": \"2026년 5월 12일 인수 발표로 공동창업자 두 사람의 이름과 직함, 팀 전원 합류, 기존 기능 유지, 혈액검사 수치와 보충제 조합을 잇겠다는 계획을 확인했다.\"}, {\"title\": \"union square ventures의 suppco 투자 글\", \"url\": \"https://blog.usv.com/supp\", \"note\": \"2024년 10월 17일 글로 투자 논지를 확인했다. 신뢰가 무너진 의료 체계 밖에서 사람들이 스스로 이끄는 새 체계를 지을 수 있다는 주장이며, 제품 16만 개와 브랜드 평가 29개 항목을 언급한다. 투자 금액은 적지 않았다.\"}, {\"title\": \"u 작하기와 내 보험 확인하기 둘이다.","from":"https://www.talkspace.com"},{"file":"talkspace_pricing.png","caption":"값 안내 페이지다. 보험을 쓰지 않을 때의 주당 69달러에서 109달러 구독과 정신과 초진 299달러, 그리고 AI 대화 기능 월 19.99달러가 나란히 적혀 있다.","from":"https://www.talkspace.com/pricing"},{"file":"talkspace_tee.png","caption":"2026년 6월에 내놓은 AI 대화 기능 Tee의 안내 화면이다. 대화를 바로 시작하게 하고, 아래쪽에 이것이 AI일 뿐 의료인이 아니라는 설명을 붙여 두었다.","from":"https://www.talkspace.com/tee"}],"q":"{\"slug\": \"talkspace\", \"name\": \"talkspace\", \"one_liner\": \"면허를 가진 상담사, 그리고 약을 처방할 수 있는 정신과 진료 담당자를 문자와 음성과 영상으로 연결해 주는 미국의 원격 정신건강 회사다. 2012년에 문자 상담으로 출발했으나 지금은 매출의 4분의 3이 건강보험에서 나오며, 2026년 8월 병원 기업 universal health services에 약 8억 3,500만 달러에 인수되어 그 자회사가 됐다.\", \"site\": \"https://www.talkspace.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"16\", \"section\": 7, \"headline\": \"2025년 매출이 22% 늘어 2억 3,000만 달러가 되고 주가가 20% 넘게 올랐는데, 소비자가 직접 결제한 매출은 전체의 약 6%뿐이고 나머지는 보험사와 기업에서 나왔다는 소식으로 실렸다.\"}], \"card\": {\"problem\": \"미국에서 상담을 자기 돈으로 받으면 주당 69달러부터 시작하는 값을 계속 내야 해서 오래 이어 가기 어렵다. 보험으로 받으려 해도 그 보험을 받아 주는 상담사를 직접 찾아 몇 주를 기다려야 한다.\", \"solution\": \"건강보험사와 직접 계약해 상담 자체를 보험 진료로 만들어 놓고, 이용자가 보험 정보를 넣어 자격을 확인하면 며칠 안에 상담사를 배정한다. 보험이 없는 사람에게는 주 단위 구독을 판다.\", \"price\": \"보험이 있으면 대부분 본인부담금이 없고 회사는 평균 10달러라고 적어 두었다. 보험을 쓰지 않으면 주당 69달러부터 시작한다.\", \"tags\": [\"원격 상담\", \"정신건강\", \"보험 청구\", \"기업 복지\", \"ai 상담\"], \"headline_traction\": \"2025년 매출 2억 2,887만 달러로 22% 성장했고, 2026년 8월 병원 기업 uhs에 약 8억 3,500만 달러에 인수됐다.\", \"watch\": \"소비자가 직접 결제하는 활성 이용자가 2021년 말 약 2만 4,000명에서 2025년 말 약 5,000명까지 줄었다. 2021년 상장 때 매겨진 값은 14억 달러였는데 매각가는 8억 3,500만 달러다.\"}, \"problem\": \"미국에서 심리상담을 시작하려는 사람은 두 가지에 막힌다. 하나는 값이다. talkspace가 자기 사이트에 적어 둔 자기 부담 구독료는 주당 69달러에서 109달러이고, 정신과 초진은 299달러다. 다른 하나는 보험을 쓰려 할 때 생기는 일이다. 미국에는 전 국민이 함께 드는 건강보험이 없고 보험사가 수백 곳으로 나뉘어 있어서, 환자는 자기 보험을 받아 주는 상담사를 직접 수소문해 예약을 잡아야 한다. 한국은 정신건강의학과 진료가 건강보험 급여 대상이고 동네 의원에 그냥 가면 되지만, 미국은 그 상담사가 내 보험망 안에 있는지부터 확인해야 하므로 시작하는 일 자체가 과제가 된다. 그래서 값이 미리 정해져 있고 상담사를 대신 찾아 주는 서비스에 수요가 생겼는데, 정작 그 수요를 돈으로 바꾸는 자리는 환자의 지갑이 아니라 보험사와 고용주 쪽이었다.\", \"solution\": \"이용자는 첫 화면에서 보험 적용 여부를 먼저 확인한다. 보험사를 고르고 가입 정보를 넣으면 자격이 확인되고, 이어서 무엇 때문에 힘든지와 어떤 상담사를 원하는지를 묻는 설문이 나온다. 회사는 이 답을 바탕으로 며칠 안에 면허 상담사를 배정하고, 배정된 뒤에는 예약 없이 문자를 남기거나 영상, 음성, 실시간 채팅으로 상담을 받는다. 값은 보험이 적용되면 대부분 본인부담금이 없고 회사는 평균 10달러라고 적어 두었으며, 보험을 쓰지 않으면 문자만 쓰는 구독이 주당 69달러, 영상을 포함하면 주당 99달러, 워크숍까지 붙이면 주당 109달러다. 정신과 진료는 별도로 초진 299달러, 재진 175달러다. 2026년 6월에는 tee라는 ai 대화 기능을 내놓아 월 19.99달러에 팔고 있다. 다만 이 회사가 실제로 돈을 버는 경로는 이 값표가 아니라, 건강보험사와 기업, 학교, 지방자치단체와 맺은 계약이다.\", \"features\": [{\"name\": \"보험 자격 확인 후 상담사 배정\", \"detail\": \"cigna, aetna, optum, anthem, tricare, medicare 등과 계약돼 있어 이용자가 보험 정보를 넣으면 자격과 본인부담금이 먼저 확인된다. 그 뒤 설문 답을 바탕으로 며칠 안에 상담사를 붙여 준다.\"}, {\"name\": \"문자 상담\", \"detail\": \"예약 없이 아무 때나 상담사에게 글을 남기고 답을 받는 방식이다. 이 회사가 2012년에 처음 규모를 키운 방식이며 지금도 가장 싼 구독에 들어 있다.\"}, {\"name\": \"정신과 진료와 약 처방\", \"detail\": \"18세 이상을 대상으로 영상 진료를 하고 약을 처방한다. 미국 마약류 원격처방 규제에 따라 중독성이 있는 향정신성 의약품은 처방하지 않으며, 그런 약이 필요하면 대면 의사에게 연결한다.\"}, {\"name\": \"tee, ai 대화 기능\", \"detail\": \"2026년 6월에 내놓은 ai 상담 도우미다. 지난 대화를 기억하고 이어서 응답한다고 안내하며, 화면에 이것이 ai일 뿐 면허를 가진 의료인이 아니고 응급 상황에는 988로 전화하라고 명시해 두었다. 값은 월 19.99달러다.\"}, {\"name\": \"기업과 보험사에 파는 묶음\", \"detail\": \"고용주, 건강보험사, 복리후생 중개인, 학교, 정부 기관, 제약사를 상대로 자가 학습 프로그램과 문자 상담, 영상 정신과 진료를 단계별로 묶어 판다. 값은 공개하지 않고 상담 요청을 받는다.\"}, {\"name\": \"뉴욕시 청소년 무료 상담\", \"detail\": \"nyc teenspace라는 이름으로 뉴욕시에 사는 13세에서 17세 청소년에게 상담을 무료로 제공한다. 비용은 뉴욕시 예산에서 나오며 보험이 필요 없고, 24시간에서 48시간 안에 상담사를 배정하고 매달 한 번의 실시간 상담과 무제한 문자 상담을 준다.\"}], \"differentiator\": \"같은 온라인 상담이라도 betterhelp와는 방향이 반대다. betterhelp는 보험을 거치지 않는 소비자 구독으로 규모를 키운 뒤 2025년에야 보험 경로를 붙이기 시작했고, 2025년에도 유료 이용자가 39만 명이었다. talkspace는 그 반대로 소비자 구독을 스스로 줄여 왔고, 2025년 말 직접 결제하는 활성 이용자는 약 5,000명뿐이다. 대신 건강보험사와 직접 계약해 상담을 보험 진료로 만들어 두었고, 그 결과 2025년 매출의 75%가 보험에서 나왔다. 처음부터 보험 청구를 대신 처리해 주는 headway나 grow therapy와 지금은 같은 자리에 서 있는 셈인데, 차이는 이 회사가 상장사로서 숫자를 공시해 왔다는 점, 그리고 2026년 8월 병원과 정신과 입원 시설을 운영하는 uhs에 인수되어 대면 진료망과 묶였다는 점이다.\", \"team\": [{\"name\": \"oren frank\", \"role\": \"공동창업자, 2012년부터 2021년 11월까지 최고경영자\", \"background\": \"아내 roni frank와 함께 2012년에 talkspace를 세워 문자 상담이라는 방식을 처음 규모화했고, 2021년 나스닥 상장 뒤 그해 11월 15일에 최고경영자와 이사 자리에서 물러났다.\"}, {\"name\": \"roni frank\", \"role\": \"공동창업자, 전 임상 서비스 총괄\", \"background\": \"공동창업자로서 임상 서비스를 맡았고, 2021년 11월에 남편 oren frank와 함께 회사와 이사회에서 물러났다.\"}, {\"name\": \"jon r. cohen\", \"role\": \"최고경영자(2022년 11월 취임), 의사\", \"background\": \"2019년부터 2022년까지 검사 기업 bioreference laboratories 회장 겸 opko health 부사장을 지냈고, 2009년부터 2018년까지 검사 기업 quest diagnostics 임원이었다. 그전에는 뉴욕주지사 선임보좌관과 northwell health 최고의료책임자를 지냈다.\"}, {\"name\": \"ian harris\", \"role\": \"최고재무책임자(2024년 5월 취임)\", \"background\": \"talkspace를 상장시킨 spac의 운용사 hudson executive capital에서 파트너로 헬스케어와 기술 분야 투자를 이끌었고, 그전에는 barclays에서 헬스케어 기업의 인수합병을 자문했다.\"}, {\"name\": \"gil margolin\", \"role\": \"최고기술책임자(2014년 4월 취임)\", \"background\": \"talkspace에 오기 전 deutsche telekom과 amdocs에서 제품 관리 책임자를 지냈다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"2021년 1월 13일 spac인 hudson executive investment corp.와 합병한다고 발표했고, 이때 매겨진 기업가치는 약 14억 달러, 확보한 현금은 2억 5,000만 달러였다. 그해 6월 나스닥에 talk라는 이름으로 상장됐다.\", \"when\": \"2021-01\", \"source\": \"2021년 1월 13일 8-k 첨부 보도자료\"}, {\"type\": \"revenue\", \"detail\": \"2025년 매출이 2억 2,887만 달러로 1년 전보다 22.0% 늘었고, 순이익 779만 달러에 조정 ebitda 1,577만 달러를 냈다. 조정 ebitda는 1년 전보다 127% 늘었고, 4분기만 보면 매출 6,300만 달러로 29.3% 늘었다.\", \"when\": \"2026-02\", \"source\": \"2026년 2월 19일 4분기 및 연간 실적 발표 자료\"}, {\"type\": \"revenue\", \"detail\": \"2025년 매출을 채널별로 나누면 보험 1억 7,152만 달러(75%), 기업 3,988만 달러(17%), 소비자 직접 결제 1,747만 달러(8%)다. 1년 전과 견주면 보험은 37.9% 늘고 소비자는 29.5% 줄었다.\", \"when\": \"2026-03\", \"source\": \"2025 회계연도 10-k\"}, {\"type\": \"customers\", \"detail\": \"2025년 말 기준 계약한 건강보험 고객이 35곳으로 1년 전 27곳에서 늘었고, 기업 고객은 188곳에서 159곳으로 줄었다. 소비자 활성 이용자는 7,200명에서 약 5,000명으로 줄었다.\", \"when\": \"2026-03\", \"source\": \"2025 회계연도 10-k 주요 지표\"}, {\"type\": \"customers\", \"detail\": \"2025년 한 해 보험 가입자를 상대로 완료한 상담이 161만 7,000건으로 1년 전 122만 9,200건에서 늘었고, 4분기 기준 보험으로 이용한 고유 이용자는 12만 4,100명이었다.\", \"when\": \"2026-02\", \"source\": \"2026년 2월 19일 실적 발표 자료\"}, {\"type\": \"revenue\", \"detail\": \"2026년 2분기 매출은 6,167만 달러로 13.6% 늘었는데, 보험이 27.1% 늘어난 반면 기업은 26.8%, 소비자는 25.4% 줄었다. 같은 시점 기업 고객은 151곳으로 더 줄었고 건강보험 고객은 39곳으로 늘었다.\", \"when\": \"2026-08\", \"source\": \"2026년 2분기 10-q\"}, {\"type\": \"partnership\", \"detail\": \"뉴욕시가 예산을 대는 nyc teenspace를 운영해 뉴욕시에 사는 13세에서 17세 청소년에게 상담을 무료로 제공한다. 보험이 필요 없고 24시간에서 48시간 안에 상담사를 배정한다.\", \"when\": \"2026-09\", \"source\": \"nycteenspace.com\"}, {\"type\": \"funding\", \"detail\": \"2026년 3월 9일 병원 기업 universal health services가 주당 5.25달러 현금, 기업가치 약 8억 3,500만 달러에 인수한다고 발표했고, 8월 17일 거래가 끝나 나스닥에서 상장 폐지됐다. 8월 27일에는 증권 등록 말소 서류까지 제출했다.\", \"when\": \"2026-08\", \"source\": \"2026년 3월 9일과 8월 17일 8-k 및 첨부 보도자료, 8월 27일 form 15\"}, {\"type\": \"traffic\", \"detail\": \"미국 애플 앱스토어에서 별점 4.8에 평가 4만 7,000건이고 건강 및 피트니스 부문 192위이며, 구글 플레이에서는 별점 4.5에 후기 1만 200건, 내려받기 50만 회 이상이다.\", \"when\": \"2026-09\", \"source\": \"애플 앱스토어와 구글 플레이 페이지\"}], \"caveats\": \"수치의 출처를 나누어 읽어야 한다. 매출과 이용자 수, 인수 금액은 이 회사가 미국 증권거래위원회에 낸 공시 자료에서 직접 확인한 것이므로 회계감사를 거친 숫자다. 반면 사이트에 걸린 상담사 5,600명에서 6,000명, 도움받은 사람 119만 9,000명, 상담 499만 건, 대면 상담만큼 또는 그보다 효과가 있었다고 답한 이용자 80%, 논문 30편 이상, 2억 명 이상이 이용할 수 있다는 대목은 모두 회사가 스스로 낸 것이고 제삼자가 확인한 것이 아니다. 기업 고객에게 내건 12주 뒤 결근 50% 감소, 생산성 36% 향상 같은 수치도 마찬가지다.\\n\\n뉴스레터가 인용한 '소비자 매출 약 6%'는 2025년 4분기 기준이다. 연간으로 보면 7.6%이고, 인수 직전인 2026년 2분기에는 5.3%까지 더 내려갔다.\\n\\n'보험사와 기업으로 방향을 틀었다'는 요약도 절반만 맞다. 실제로 늘어난 것은 보험 한쪽뿐이다. 기업에 직접 파는 매출은 2025년에 3.7% 느는 데 그쳤고 2026년 2분기에는 26.8% 줄었으며, 기업 고객 수도 188곳에서 151곳으로 계속 줄고 있다.\\n\\n소비자 매출이 줄어든 것을 회사는 실패가 아니라 선택이라고 적었다. 10-k는 소비자 감소가 마케팅을 보험 가입자 확보 쪽으로 옮긴 의도적이고 전략적인 결정 때문이라고 밝히고 있다. 다만 2025년 판매·마케팅비는 5,380만 달러로 매출의 23%를 차지하는데, 그 돈을 쓰고도 직접 결제 활성 이용자는 약 5,000명이다.\\n\\n값과 회사 가치의 방향도 엇갈린다. 2021년 상장 때 매겨진 기업가치는 14억 달러였고 그해 매출은 1억 1,370만 달러였다. 2025년 매출은 그 두 배인 2억 2,887만 달러가 됐지만 매각가는 8억 3,500만 달러였다.\\n\\n애플 앱스토어의 개인정보 항목에는 구매 내역과 식별자가 이용자 신원에 연결되며 그 쓰임에 광고와 마케팅이 들어간다고 표시돼 있다. 2025년 말 기준으로 중요한 계류 소송은 없다고 10-k에 적혀 있다.\", \"for_us\": \"첫째로 가져갈 것은 미국에서 소비자가 정신건강에 직접 돈을 내는 시장의 크기다. 이름이 가장 많이 알려진 축에 드는 회사인데도 직접 결제하는 활성 이용자가 약 5,000명이고, 그마저 4년 동안 2만 4,000명에서 줄어든 결과다. 우리가 3개월 안에 미국인에게 유료 상담을 파는 방향은 접는 것이 맞다는 근거가 된다.\\n\\n둘째는 그럼에도 이 회사가 무엇을 무료 또는 싼값에 내놓는지다. 월 19.99달러짜리 ai 대화와 자가 학습 프로그램이 상담 이전 단계를 맡고 있다. 상담으로 넘어가지 않는 사람에게 남는 것이 아무것도 없다는 빈자리가 여기서 확인되며, 기분 기록과 되돌아보기처럼 소프트웨어만으로 만들 수 있는 기능이 그 자리에 들어간다. 우리는 이미 걸음 수와 수면 데이터를 가지고 있으므로 붙일 재료가 있다.\\n\\n셋째는 온보딩 순서다. talkspace는 첫 화면에서 보험 확인부터 시킨다. 우리 앱은 보험을 거치지 않으므로 자격과 값을 묻지 않고 바로 쓰게 하는 것 자체가 차이가 된다. 미국 이용자에게는 그것이 낯선 경험이다.\\n\\n넷째는 지켜야 할 선이다. tee 화면은 이것이 ai이며 면허를 가진 의료인이 아니라는 점, 응급 상황에는 988로 전화하라는 안내를 앞에 붙여 두었다. 우리가 정서 관련 기능을 붙일 때 진단이나 치료를 표방하지 않고 기록과 대화에 머무르게 하는 최소 기준으로 삼을 만하다.\\n\\n다섯째는 광고와 건강 데이터의 분리다. 이 회사의 앱조차 구매 내역과 식별자를 신원에 연결하고 그 쓰임에 광고를 넣어 두었다. 우리 앱은 광고로 매출을 내므로, 건강 관련 입력값이 광고 도구에 닿는 경로가 없는지 미국 진출 전에 먼저 확인해야 한다.\", \"screenshots\": [{\"file\": \"talkspace_home.png\", \"caption\": \"첫 화면이다. 값을 말하기 전에 보험이 적용된다는 문구를 앞세우고, 맨 위에는 보험 가입자 대부분이 본인부담금을 내지 않는다고 적어 두었다. 버튼도 시작하기와 내 보험 확인하기 둘이다.\", \"from\": \"https://www.talkspace.com\"}, {\"file\": \"talkspace_pricing.png\", \"caption\": \"값 안내 페이지다. 보험을 쓰지 않을 때의 주당 69달러에서 109달러 구독과 정신과 초진 299달러, 그리고 ai 대화 기능 월 19.99달러가 나란히 적혀 있다.\", \"from\": \"https://www.talkspace.com/pricing\"}, {\"file\": \"talkspace_tee.png\", \"caption\": \"2026년 6월에 내놓은 ai 대화 기능 tee의 안내 화면이다. 대화를 바로 시작하게 하고, 아래쪽에 이것이 ai일 뿐 의료인이 아니라는 설명을 붙여 두었다.\", \"from\": \"https://www.talkspace.com/tee\"}, {\"file\": \"talkspace_ios.png\", \"caption\": \"미국 애플 앱스토어 페이지다. 별점 4.8에 평가 4만 7,000건, 건강 및 피트니스 부문 192위로 표시되며, 개인정보 항목에는 구매 내역과 식별자가 이용자 신원에 연결된다고 적혀 있다.\", \"from\": \"https://apps.apple.com/us/app/talkspace-therapy-and-support/id661829386\"}], \"sources\": [{\"title\": \"talkspace 공식 사이트 첫 화면\", \"url\": \"https://www.talkspace.com\", \"note\": \"무엇을 파는지, 보험을 앞세우는 구성, 회사가 내건 이용자 수와 상담사 수를 확인했다.\"}, {\"title\": \"talkspace 값 안내 페이지\", \"url\": \"https://www.talkspace.com/pricing\", \"note\": \"주당 69달러에서 109달러 구독, 정신과 초진 299달러와 재진 175달러, ai 대화 월 19.99달러를 확인했다.\"}, {\"title\": \"talkspace 보험 안내 페이지\", \"url\": \"https://www.talkspace.com/coverage\", \"note\": \"cigna, aetna, optum, anthem, tricare, medicare 등 계약 보험과 본인부담금 안내를 확인했다.\"}, {\"title\": \"talkspace 기업 대상 사이트\", \"url\": \"https://business.talkspace.com\", \"note\": \"고용주, 건강보험사, 학교, 정부 기관, 제약사를 상대로 무엇을 파는지와 값을 공개하지 않는다는 사실을 확인했다.\"}, {\"title\": \"nyc teenspace\", \"url\": \"https://www.nycteenspace.com\", \"note\": \"뉴욕시 예산으로 13세에서 17세 청소년에게 무료 상담을 제공하는 프로그램의 조건을 확인했다.\"}, {\"title\": \"talkspace 2025년 4분기 및 연간 실적 발표 자료(8-k 첨부)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1803901/000119312526058146/talk-ex99_1.htm\", \"note\": \"2025년 매출 2억 2,887만 달러, 순이익 779만 달러, 조정 ebitda 1,577만 달러, 분기별 채널 매출을 확인했다.\"}, {\"title\": \"talkspace 2025 회계연도 10-k\", \"url\": \"https://www.sec.gov/archives/edgar/data/1803901/000119312526105146/talk-20251231.htm\", \"note\": \"채널별 매출, 보험 고객 35곳과 기업 고객 159곳, 소비자 활성 이용자 약 5,000명, 창업 연도와 사업 구조를 확인했다.\"}, {\"title\": \"talkspace 2026년 2분기 10-q\", \"url\": \"https://www.sec.gov/archives/edgar/data/1803901/000119312526338193/talk-20260630.htm\", \"note\": \"2026년 2분기 채널별 매출과 기업 매출 26.8% 감소, 소비자 활성 이용자 약 5,000명을 확인했다.\"}, {\"title\": \"uhs의 talkspace 인수 발표 보도자료(8-k 첨부, 2026년 3월 9일)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1803901/000095015726000259/ex99-1.htm\", \"note\": \"주당 5.25달러, 기업가치 약 8억 3,500만 달러, 상담사 약 6,000명, 2억 명 이상이 이용할 수 있다는 회사 설명을 확인했다.\"}, {\"title\": \"uhs의 talkspace 인수 완료 발표(8-k, 2026년 8월 17일)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1803901/000095015726000907/form8-k.htm\", \"note\": \"2026년 8월 17일 거래 완료와 주당 5.25달러 현금 지급, 상장 폐지 절차를 확인했다.\"}, {\"title\": \"talkspace 창업자 사임 발표(8-k 첨부, 2021년 11월 15일)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1803901/000095017021004773/talk-ex99_1.htm\", \"note\": \"oren frank와 roni frank가 2012년에 공동창업했다는 사실과 두 사람의 사임을 확인했다.\"}, {\"title\": \"spac 합병 발표 보도자료(8-k 첨부, 2021년 1월 13일)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1803901/000119312521007698/d74855dex991.htm\", \"note\": \"상장 당시 기업가치 14억 달러와 조달 현금 2억 5,000만 달러를 확인했다.\"}, {\"title\": \"talkspace 2021 회계연도 10-k\", \"url\": \"https://www.sec.gov/archives/edgar/data/1803901/000095017022002102/talk-20211231.htm\", \"note\": \"2021년 매출 1억 1,370만 달러와 소비자 활성 이용자 약 2만 4,000명을 확인했다.\"}, {\"title\": \"talkspace 2025 회계연도 10-k/a(경영진과 이사회)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1803901/000119312526197712/talk-20251231.htm\", \"note\": \"jon cohen, ian harris, gil margolin의 직함과 이전 경력을 확인했다.\"}, {\"title\": \"미국 애플 앱스토어 talkspace 페이지\", \"url\": \"https://apps.apple.com/us/app/talkspace-therapy-and-support/id661829386\", \"note\": \"별점 4.8, 평가 4만 7,000건, 부문 192위, 개인정보 수집 항목을 확인했다.\"}, {\"title\": \"구글 플레이 talkspace 페이지\", \"url\": \"https://play.google.com/store/apps/details?id=com.talkspace.talkspaceapp\", \"note\": \"별점 4.5, 후기 1만 200건, 내려받기 50만 회 이상을 확인했다.\"}]}"},{"slug":"torch-health","name":"Torch","one_liner":"병원과 검사실, 웨어러블에 흩어진 미국인의 진료 기록을 한 앱으로 모아 AI가 읽을 수 있는 형태로 정리해 주려던 개인 건강 기록 스타트업이며, 정식 출시 전인 2026년 1월 OpenAI에 인수되어 네 명 전원이 ChatGPT Health 팀으로 옮겼다.","sells_to":"consumer","seen_in":[{"issue":"06","section":14,"headline":"OpenAI가 개인 건강 기록 스타트업 Torch를 약 1억 달러 규모 지분으로 인수했고, 대금의 상당 부분이 직원 4명의 잔류와 묶여 있어 제품보다 사람을 데려온 거래로 읽혔다."}],"card":{"problem":"미국에서는 병원과 검사실, 약국, 웨어러블이 각자 기록을 들고 있어 환자가 자기 기록의 일부만 본다. 기록이 흩어져 있으면 AI에게 물어봐도 제대로 된 답을 받을 수 없다.","solution":"수천 곳의 의료 기록 출처에 연결해 검사 수치와 처방약, 진료실 녹음을 한 앱에 모으고, AI가 추세를 짚고 의학 용어를 풀어 준다. 대기자 명단을 받는 iOS 비공개 베타까지만 갔다.","price":"소비자 가격을 공개한 적이 없다. 정식 출시 전에 인수되어 실제로 돈을 낸 사용자가 없다.","tags":["개인 건강 기록","기록 통합","AI 해설","진료 녹음","iOS 비공개 베타"],"headline_traction":"창업 약 1년 만인 2026년 1월 OpenAI에 인수됐다. The Information은 지분 약 1억 달러, CNBC는 약 6천만 달러로 보도했고 네 명 전원이 OpenAI로 옮겼다.","watch":"정식 출시된 적이 없어 사용자 수와 매출 같은 실적 수치가 아예 없고, 인수 금액도 매체마다 갈리는 데다 양쪽 회사 모두 공개하지 않았다."},"screenshots":[{"file":"torch-health_home.png","caption":"인수 뒤 남은 torchapp.com 첫 화면이다. 제품 설명은 모두 지워지고 OpenAI에 합류한
