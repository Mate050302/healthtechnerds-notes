다.\", \"price\": \"보험이 있으면 진료비를 보험에 청구하므로 본인부담금만 내고, 보험을 쓰지 않으면 첫 진료 250달러, 재진 150달러다.\", \"tags\": [\"폐경 케어\", \"원격진료\", \"보험 청구\", \"여성 건강\", \"간호사 진료\"], \"headline_traction\": \"2026년 2월에 goodwater capital이 주도한 시리즈 d로 1억 달러를 조달해 기업 가치 10억 달러를 넘겼다.\", \"watch\": \"주당 25,000명과 보험 적용 대상 4,500만 명은 모두 회사가 스스로 낸 수치이고, 4,500만 명은 실제 이용자가 아니라 보험으로 이용할 수 있는 사람의 수다. 메디케어와 메디케이드 가입자는 받지 않는다.\"}, \"problem\": \"폐경은 검사 한 번으로 확정하는 병이 아니라 안면홍조와 수면 장애, 기분 변화 같은 증상으로 판단하는 시기이며, 그 증상이 몇 해에 걸쳐 이어진다. 문제는 이 시기를 다루는 훈련을 정식으로 받은 의사가 미국에 드물다는 점이다. midi는 자사 자료에서 전공의 가운데 폐경 진료를 감당할 준비가 되었다고 답한 비율이 6.8%에 그친다는 조사를 인용한다. 여기에 미국 특유의 구조가 겹친다. 한국처럼 원하는 병원에 그냥 걸어 들어가면 되는 것이 아니라, 자기 보험이 네트워크로 인정하는 의사를 직접 찾아 예약을 잡아야 하고 그 과정에 몇 주가 걸리며, 폐경을 전문으로 보는 의사는 그 명단 안에서 더 찾기 어렵다. 그래서 증상이 있어도 진료를 포기하는 여성이 많고, mayo clinic이 2023년에 낸 연구는 제대로 치료되지 않은 폐경 증상 때문에 미국이 해마다 부담하는 비용을 260억 달러가 넘는 규모로 추산했다. 그 가운데 20억 달러 가까이가 결근을 비롯한 노동 손실이고 나머지 240억 달러 이상이 의료비다.\", \"solution\": \"이용자는 midi 홈페이지에서 화상 진료를 예약한다. 첫 진료는 30분이며, 여성 건강을 전공한 공인 전문간호사(np)나 공인 조산사(cnm)가 증상과 병력, 지금 무엇이 힘든지를 듣고 치료 계획을 세운다. 필요하면 대사 검사와 갑상선 검사, 인슐린 민감도 검사를 의뢰하고, 호르몬제와 비호르몬제 처방, 자사가 파는 보조제, 생활 습관 상담을 하나로 묶어 준다. 재진은 15분이며 필요할 때마다 받는다. 진료비는 보험이 있으면 보험에 청구되고 이용자는 본인부담금만 내며, 보험을 쓰지 않으면 첫 진료 250달러, 재진 150달러다. 50개 주 전역에서 진료하고, 회사는 대다수 ppo 보험과 네트워크 계약을 맺었다고 밝힌다. 소비자용 모바일 앱은 미국 앱스토어와 구글 플레이 어느 쪽에도 없으며, 예약부터 진료까지 모든 절차가 웹에서 이루어진다.\", \"features\": [{\"name\": \"화상 진료\", \"detail\": \"첫 진료 30분, 재진 15분으로 시간이 정해져 있다. 증상과 병력을 듣고 치료 계획을 세운 뒤 필요할 때마다 재진으로 조정한다.\"}, {\"name\": \"보험 청구\", \"detail\": \"이용자가 값을 직접 치르는 대신 회사가 민간 건강보험에 진료비를 청구한다. 회사는 ppo 보험의 80% 이상과 네트워크 계약을 맺었다고 밝히며, blue cross blue shield와 unitedhealthcare, cigna, aetna, health net을 계약사로 표시한다. 메디케어는 네트워크 밖이고 메디케이드와 medi-cal은 받지 않는다.\"}, {\"name\": \"검사 의뢰\", \"detail\": \"대사 검사와 갑상선 검사, 인슐린 민감도 지표 검사를 진료 과정에서 의뢰한다.\"}, {\"name\": \"처방\", \"detail\": \"호르몬제와 비호르몬제를 모두 처방하며, 테스토스테론과 glp-1 계열 비만 치료제, 에스트리올 크림도 처방 품목에 들어 있다.\"}, {\"name\": \"자사 판매 상품\", \"detail\": \"코르티솔 보조제와 식이섬유, 베르베린, 오메가3 같은 일반 판매 상품을 따로 판다. 이 상품들은 보험 대상이 아니라 현금 결제다.\"}, {\"name\": \"glp-1 현금 결제 경로\", \"detail\": \"조제 방식으로 만든 glp-1과 glp-1/gip 약을 4주분 164달러에서 460달러 사이에 판다. 회사는 회원비가 없고 배송비와 부자재가 값에 포함된다고 안내한다. 진료는 보험으로, 약값은 현금으로 갈리는 구조다.\"}, {\"name\": \"agewell 예방 프로그램\", \"detail\": \"2025년 5월에 시작한 예방 중심 프로그램으로, 심혈관 질환과 암 예방, 뼈와 뇌 건강을 다룬다. 보험이 적용되는 프로그램으로 소개됐다.\"}, {\"name\": \"midi university\", \"detail\": \"회사가 자체 운영하는 임상진 교육 과정으로, 50개가 넘는 강좌와 주간 강의로 여성 건강 최신 연구를 가르친다고 밝힌다.\"}, {\"name\": \"고용주 채널\", \"detail\": \"고용주에게는 인원당 월정액도, 계약도, 추가 비용도 없다고 안내한다. 고용주가 값을 치르는 것이 아니라 직원이 진료를 받으면 그 직원의 건강보험에 청구하는 방식이라, 고용주 쪽은 계약이 아니라 홍보 통로에 가깝다.\"}], \"differentiator\": \"같은 폐경 원격 진료를 하는 alloy는 결제 방식이 정반대다. alloy는 홈페이지에서 보험 문제가 없는 간편한 현금 결제를 내세우며 보험을 받지 않고 이용자가 값을 직접 치른다. midi는 민간 보험 네트워크 안으로 들어가는 쪽을 택해, 대다수 ppo 보험 가입자가 본인부담금만 내고 진료를 받게 만들었다. 창업자 joanna strober도 성장의 바탕을 보험 적용과 전문 인력을 갖춘 기반 구축으로 설명한다. 현금 결제 회사는 매달 값을 낼 뜻이 있는 사람만 모을 수 있는 반면, 보험 청구 방식은 이미 보험료를 내고 있는 사람에게 추가 부담이 크지 않은 선택지가 된다. 여성 건강 원격 진료에서 기업 가치 10억 달러를 넘긴 다른 회사로는 임신과 가족 돌봄을 다루는 maven clinic이 있으나, 다루는 시기가 달라 정면으로 겹치지는 않는다.\", \"team\": [{\"name\": \"joanna strober\", \"role\": \"공동창업자, ceo\", \"background\": \"아동 비만을 다루는 디지털 치료 서비스 kurbo를 창업해 weight watchers에 매각했다. 그 전에는 20여 년 동안 건강과 소비자 분야 기업에 투자하는 일을 했고 bluenile, etoys, babycenter 등에 관여했다. 2022년에 본인이 겪은 폐경 증상을 계기로 midi를 세웠다.\"}, {\"name\": \"jason wheeler\", \"role\": \"cfo\", \"background\": \"tesla와 google, forward에서 일했다. 시리즈 d 발표와 함께 합류했다.\"}, {\"name\": \"melissa waters\", \"role\": \"cmo\", \"background\": \"meta와 lyft, hims & hers에서 일했다. 시리즈 d 발표와 함께 합류했다.\"}, {\"name\": \"matt cook\", \"role\": \"cco\", \"background\": \"omada health와 firefly health에서 일했다. 시리즈 d 발표와 함께 합류했다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"시리즈 d로 1억 달러를 조달하며 기업 가치 10억 달러를 넘겼다. goodwater capital이 주도했고 foresite capital과 serena ventures가 새로 참여했으며, advance venture partners와 gv, emerson collective, sempervirens, mckesson ventures, felicis ventures가 이어서 투자했다.\", \"when\": \"2026-02\", \"source\": \"midi 보도자료, finsmes, future fem health\"}, {\"type\": \"funding\", \"detail\": \"시리즈 c로 5,000만 달러를 조달했다. advance venture partners가 주도했고 2025년 봄에 마감해 10월에 공개했다. 이 시점까지 누적 조달액은 약 1억 5,000만 달러였다.\", \"when\": \"2025-10\", \"source\": \"femtech insider가 인용한 business insider 보도\"}, {\"type\": \"funding\", \"detail\": \"시리즈 b로 약 6,000만 달러를 조달했다. 23andme 공동창업자 anne wojcicki를 비롯한 개인 투자자도 참여했다.\", \"when\": \"2024-04\", \"source\": \"femtech insider\"}, {\"type\": \"revenue\", \"detail\": \"연환산 매출이 1억 5,000만 달러에 이르렀다고 ceo가 밝혔다. 2024년 말 6,000만 달러에서 늘어난 수치다.\", \"when\": \"2025-10\", \"source\": \"femtech insider가 인용한 business insider 보도\"}, {\"type\": \"customers\", \"detail\": \"주당 25,000명이 넘는 환자를 보고, 4,500만 명이 넘는 여성이 보험을 통해 이용할 수 있다고 밝혔다.\", \"when\": \"2026-02\", \"source\": \"midi 보도자료\"}, {\"type\": \"customers\", \"detail\": \"45만 명이 넘는 여성이 진료를 맡겼고, 50개 주 전역에서 550명이 넘는 임상진이 일한다고 자사 소개 화면에 표기하고 있다.\", \"when\": \"2026-09\", \"source\": \"joinmidi.com/our-story 화면\"}], \"caveats\": \"규모를 보여 주는 수치는 거의 모두 회사가 스스로 낸 값이다. 주당 25,000명, 보험 적용 대상 4,500만 명, 누적 45만 명, 임상진 550명이 여기에 해당하며 제삼자가 확인한 값이 아니다. 특히 4,500만 명은 실제 이용자 수가 아니라 계약된 보험에 들어 있어 이용할 수 있는 사람의 규모를 뜻하므로, 이용자 수로 읽으면 안 된다. 임상 성과로 내세우는 값도 마찬가지다. 유방암 검진 이행률 28%포인트 상승, 대장암 검진 11%포인트 상승, 총 진료비 최대 13% 절감, a1c와 ldl 감소는 모두 회사 내부 데이터이며 동료 심사를 거친 논문이나 제삼자 감사로 확인되지 않았다. 연환산 매출 1억 5,000만 달러는 ceo가 business insider에 말한 값이고 감사받은 재무제표가 아니다. 진료 구조에도 짚어 둘 대목이 있다. 이용자가 실제로 만나는 사람은 의사가 아니라 공인 전문간호사나 공인 조산사이며, 의사는 진료 지침을 만들고 자문하는 자리에 있다. 지불 측면에서는 메디케어가 네트워크 밖이고 메디케이드와 medi-cal은 받지 않아, 65세 이상과 저소득층이 사실상 대상에서 빠진다. 보험이 적용돼도 자기부담금을 채우기 전에는 이용자가 진료비를 내며, 보조제와 glp-1 같은 약값은 보험 밖 현금 결제다. glp-1은 완제품이 아니라 조제 방식으로 만든 약이라는 점도 회사가 명시하고 있다. 마지막으로 보도자료와 언론 보도는 joanna strober를 공동창업자로 표기하지만, 다른 공동창업자의 이름은 공개 자료에서 확인하지 못했다.\", \"for_us\": \"이 회사가 하는 일 자체는 미국 의사 면허와 보험 계약이 있어야 하므로 3개월 안에 따라 할 수 없다. 다만 midi가 증명한 것은 수요의 위치다. 폐경 전후 증상을 다루는 곳이 없어서 주당 25,000명이 화상 진료를 찾아 나선다는 사실이 그 수요를 보여 준다. 우리가 소프트웨어만으로 할 수 있는 자리는 진료가 아니라 증상 기록이다. 폐경기 증상은 검사 수치가 아니라 본인이 느끼는 것으로 판단하므로, 안면홍조 횟수와 밤에 깬 횟수, 기분을 하루 몇 초 만에 남기게 하고 이미 받고 있는 걸음 수와 수면 데이터와 겹쳐 몇 주 단위 변화를 보여 주는 것만으로도 값이 생긴다. 치료를 권하지 않고 기록과 요약에만 머무르면 규제 허가가 필요 없다. midi에 소비자용 모바일 앱이 없다는 점도 눈여겨볼 만하다. 진료와 진료 사이의 몇 주를 기록으로 채워 주는 자리는 이 회사가 비워 두고 있다. 다만 우리 앱의 미국 사용자 가운데 40대 후반에서 50대 초반 여성이 얼마나 되는지 먼저 확인해야 하고, 실제 진료로 연결하는 일은 우리가 할 수 없으므로 기록과 정보 제공까지가 우리 몫이다.\", \"screenshots\": [{\"file\": \"midi-health_home.png\", \"caption\": \"첫 화면에서 보험으로 받는 폐경 진료임을 앞세우고, 계약한 보험사 이름을 나란히 보여 준다.\", \"from\": \"https://www.joinmidi.com\"}, {\"file\": \"midi-health_pricing.png\", \"caption\": \"값 안내 화면이다. 첫 진료 30분 250달러, 재진 15분 150달러이며 보험을 쓰면 보험 처리라고 적혀 있다.\", \"from\": \"https://www.joinmidi.com/pricing-insurance\"}, {\"file\": \"midi-health_glp1.png\", \"caption\": \"glp-1 약값 안내 화면이다. 진료는 보험으로 받고 약은 4주분 164달러에서 460달러 사이에 현금으로 사는 구조를 보여 준다.\", \"from\": \"https://www.joinmidi.com/glp1-pricing\"}, {\"file\": \"midi-health_employers.png\", \"caption\": \"고용주용 안내 화면이다. 인원당 월정액도 계약도 추가 비용도 없다고 적어, 고용주가 아니라 건강보험에 청구하는 구조임을 드러낸다.\", \"from\": \"https://www.joinmidi.com/for-employers\"}], \"sources\": [{\"title\": \"midi health 홈페이지\", \"url\": \"https://www.joinmidi.com\", \"note\": \"무엇을 파는지와 보험 적용 여부, 계약 보험사를 확인했다.\"}, {\"title\": \"pricing & insurance\", \"url\": \"https://www.joinmidi.com/pricing-insurance\", \"note\": \"첫 진료 250달러, 재진 150달러와 메디케어·메디케이드 제외 조건을 확인했다.\"}, {\"title\": \"how midi works\", \"url\": \"https://www.joinmidi.com/how-midi-works\", \"note\": \"예약부터 치료 계획, 재진까지 이용 흐름과 의뢰하는 검사 종류를 확인했다.\"}, {\"title\": \"meet our clinicians\", \"url\": \"https://www.joinmidi.com/meet-our-clinicians\", \"note\": \"진료하는 사람이 공인 전문간호사와 공인 조산사라는 점, 임상진 교육 과정, 전공의 6.8% 인용을 확인했다.\"}, {\"title\": \"our story\", \"url\": \"https://www.joinmidi.com/our-story\", \"note\": \"누적 45만 명, 임상진 550명, ppo 보험 80% 이상 같은 자사 표기 수치를 확인했다.\"}, {\"title\": \"joanna strober 소개 화면\", \"url\": \"https://www.joinmidi.com/team/joanna-strober-chief-executive-officer\", \"note\": \"kurbo 창업과 weight watchers 매각을 비롯한 창업자 경력을 확인했다.\"}, {\"title\": \"midi health surpasses $1b valuation (자사 보도자료)\", \"url\": \"https://www.joinmidi.com/press-release/series-d-announcement\", \"note\": \"시리즈 d 금액과 투자사, 기업 가치, 임원 영입, 자사 임상 성과 수치를 확인했다.\"}, {\"title\": \"glp-1 pricing\", \"url\": \"https://www.joinmidi.com/glp1-pricing\", \"note\": \"조제 glp-1 약값 구간과 회원비 없음 안내를 확인했다.\"}, {\"title\": \"for employers\", \"url\": \"https://www.joinmidi.com/for-employers\", \"note\": \"고용주에게 인원당 월정액과 계약이 없다는 점, 건강보험에 직접 청구하는 구조를 확인했다.\"}, {\"title\": \"midi health raises $100m series d at $1bn valuation (future fem health)\", \"url\": \"https://www.futurefemhealth.com/p/midi-health-raises-100m-series-d\", \"note\": \"투자사 명단과 창업자·투자자 발언, 진료 과목 범위를 확인했다.\"}, {\"title\": \"midi health hits $1 billion valuation (flow space)\", \"url\": \"https://www.theflowspace.com/physical-health/prevention-longevity/midi-health-1-billion-valuation-unicorn-joanna-strober-3021193/\", \"note\": \"2022년 창업 경위, 확장 방향, mayo clinic 연구가 추산한 폐경 증상 비용, maven clinic 비교를 확인했다.\"}, {\"title\": \"midi health raises $100m in series d funding (finsmes)\", \"url\": \"https://www.finsmes.com/2026/02/midi-health-raises-100m-in-series-d-funding.html\", \"note\": \"투자사 명단과 신임 임원 세 명을 확인했다.\"}, {\"title\": \"midi health hits $1b valuation with $100m (hit consultant)\", \"url\": \"https://hitconsultant.net/2026/02/03/midi-health-series-d-unicorn-valuation-womens-health/\", \"note\": \"폐경 전문에서 여성 생애 전반 진료로 넓히려는 방향과 ai 활용 용도를 확인했다.\"}, {\"title\": \"midi health raises $50m series c (femtech insider)\", \"url\": \"https://femtechinsider.com/midi-health-raises-50-million-series-c-for-menopause-care-platform/\", \"note\": \"시리즈 c 금액과 시기, 누적 조달액, 연환산 매출, agewell 프로그램, 메디케어·메디케이드 제외를 확인했다.\"}, {\"title\": \"미국 앱스토어 검색 api\", \"url\": \"https://itunes.apple.com/search?term=midi%20health&entity=software&country=us\", \"note\": \"소비자용 ios 앱이 없다는 것을 확인했다.\"}, {\"title\": \"구글 플레이 검색 결과\", \"url\": \"https://play.google.com/store/search?q=midi%20health&c=apps&hl=en_us&gl=us\", \"note\": \"소비자용 안드로이드 앱이 없다는 것을 확인했다.\"}, {\"title\": \"alloy 홈페이지\", \"url\": \"https://www.myalloy.com\", \"note\": \"경쟁사가 보험을 받지 않고 현금 결제로만 운영한다는 점을 확인했다.\"}]}"},{"slug":"oscar-health","name":"Oscar Health","one_liner":"미국에서 직장 보험이 없는 사람이 정부가 운영하는 개인 보험 장터에서 직접 사 가는 건강보험을 파는 회사다. 가입부터 청구, 비대면 진료, 약 주문까지를 자사 앱 한 곳에서 처리한다는 점을 내세우며, 2025년 보험료의 93%는 회원이 아니라 정부 보조금으로 들어왔다.","sells_to":"mixed","seen_in":[{"issue":"14","section":6,"headline":"2026년 개인 보험 회원이 크게 늘고 흑자 전환도 예고했지만, 축소되는 개인 보험 시장에 사업이 하나뿐인 점을 필자가 축복이자 저주로 본 실적 꼭지에 나왔다."}],"card":{"problem":"미국에서 직장 보험도 없고 노인 보험이나 저소득층 보험 대상도 아닌 사람은 자기 건강보험을 직접 골라 사야 한다. 상품 등급이 복잡해 고르기 어렵고, 가입한 뒤에도 어느 병원이 보장되는지, 지금 자기가 얼마를 내야 하는지 알기 어렵다.","solution":"정부 장터에서 파는 개인·가족 보험을 팔면서 가입과 청구, 진료 연결을 자사 앱 한 곳에 모았다. 대부분의 플랜에 24시간 비대면 급성 진료를 0달러로 붙이고, 흔히 쓰는 처방약을 3달러에 주며, 플랜과 청구를 대신 풀어 주는 전담 상담 조직인 Care Team을 둔다.","price":"보험료는 소득과 사는 곳, 등급에 따라 달라진다. 회사는 일부 플랜이 월 0달러부터 시작한다고 안내하며, 예방 진료와 비대면 급성 진료는 대부분의 플랜에서 0달러이고 흔한 처방약은 3달러다.","tags":["개인 건강보험","정부 장터","비대면 진료","앱 관리","건강 리워드"],"headline_traction":"2026년 가입 시즌에 회원이 사상 최대인 약 340만 명까지 늘었고, 2026년 상반기에 순이익 10억 4,000만 달러를 내며 적자에서 벗어났다.","watch":"사업이 개인 보험 한 곳에 몰려 있다. 2025년 보험료의 93%가 회원이 아니라 정부에서 들어왔고, 보조금을 늘려 주던 제도가 2025년 말에 끝나면서 2026년 회원은 3월 말 317만 명에서 6월 말 296만 명으로 줄었다. 회원의 58%가 플로리다 한 주에 몰려 있다."},"screenshots":[{"file":"oscar-health_home.png","caption":"첫 화면이다. 보험 회사가 아니라 건강 관리를 함께하는 곳이라고 내세우면서, 이미 가입한 회원의 계정 들어가기와 새로 플랜 고르기를 나란히 놓았다.","from":"https://www.hioscar.com/"},{"file":"oscar-health_rewards.png","caption":"혜택과 리워드 안내 페이지다. 작은 과제를 끝내면 열리는 Oscar Unlocks 위에, 질환별 플랜의 보상 금액이 만성질환 최대 455달러, 당뇨 최대 380달러, 폐경 최대 150달러, 천식·COPD 최대 65달러로 나란히 붙어 있다.","from":"https://www.hioscar.com/perks-and-rewards"},{"file":"oscar-health_ichra.png","caption":"고용주용 ICHRA 안내 페이지다. 회사가 매달 정해진 금액만 세금 없이 넣어 주고 직원이 개인 시장에서 플랜을 직접 고르는 방식을 세 단계로 설명한다.","from":"https://www.hioscar.com/ichra"}],"q":"{\"slug\": \"oscar-health\", \"name\": \"oscar health\", \"one_liner\": \"미국에서 직장 보험이 없는 사람이 정부가 운영하는 개인 보험 장터에서 직접 사 가는 건강보험을 파는 회사다. 가입부터 청구, 비대면 진료, 약 주문까지를 자사 앱 한 곳에서 처리한다는 점을 내세우며, 2025년 보험료의 93%는 회원이 아니라 정부 보조금으로 들어왔다.\", \"site\": \"https://www.hioscar.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"14\", \"section\": 6, \"headline\": \"2026년 개인 보험 회원이 크게 늘고 흑자 전환도 예고했지만, 축소되는 개인 보험 시장에 사업이 하나뿐인 점을 필자가 축복이자 저주로 본 실적 꼭지에 나왔다.\"}], \"card\": {\"problem\": \"미국에서 직장 보험도 없고 노인 보험이나 저소득층 보험 대상도 아닌 사람은 자기 건강보험을 직접 골라 사야 한다. 상품 등급이 복잡해 고르기 어렵고, 가입한 뒤에도 어느 병원이 보장되는지, 지금 자기가 얼마를 내야 하는지 알기 어렵다.\", \"solution\": \"정부 장터에서 파는 개인·가족 보험을 팔면서 가입과 청구, 진료 연결을 자사 앱 한 곳에 모았다. 대부분의 플랜에 24시간 비대면 급성 진료를 0달러로 붙이고, 흔히 쓰는 처방약을 3달러에 주며, 플랜과 청구를 대신 풀어 주는 전담 상담 조직인 care team을 둔다.\", \"price\": \"보험료는 소득과 사는 곳, 등급에 따라 달라진다. 회사는 일부 플랜이 월 0달러부터 시작한다고 안내하며, 예방 진료와 비대면 급성 진료는 대부분의 플랜에서 0달러이고 흔한 처방약은 3달러다.\", \"tags\": [\"개인 건강보험\", \"정부 장터\", \"비대면 진료\", \"앱 관리\", \"건강 리워드\"], \"headline_traction\": \"2026년 가입 시즌에 회원이 사상 최대인 약 340만 명까지 늘었고, 2026년 상반기에 순이익 10억 4,000만 달러를 내며 적자에서 벗어났다.\", \"watch\": \"사업이 개인 보험 한 곳에 몰려 있다. 2025년 보험료의 93%가 회원이 아니라 정부에서 들어왔고, 보조금을 늘려 주던 제도가 2025년 말에 끝나면서 2026년 회원은 3월 말 317만 명에서 6월 말 296만 명으로 줄었다. 회원의 58%가 플로리다 한 주에 몰려 있다.\"}, \"problem\": \"미국에는 전 국민이 자동으로 드는 건강보험이 없다. 직장에서 보험을 주지 않고, 65세 이상이 드는 노인 보험이나 저소득층 보험의 대상도 아닌 사람은 정부가 연 온라인 장터에서 자기 보험을 직접 골라 사야 한다. 이 장터의 상품은 bronze, silver, gold처럼 등급으로 나뉘는데, 매달 내는 보험료가 쌀수록 병원에 갈 때 본인이 내는 몫이 커지는 구조여서 어느 쪽이 유리한지 판단하기가 쉽지 않다. 보험에 들었다고 문제가 끝나지도 않는다. 보험사와 계약하지 않은 병원에 가면 보장을 받지 못하고, 디덕터블이라고 부르는 금액을 다 채우기 전까지는 진료비를 본인이 전액 낸다. 한국은 건강보험공단 한 곳이 전 국민을 자동으로 맡기 때문에 상품을 고르는 일 자체가 없지만, 미국에서는 고르는 일과 고른 뒤에 제대로 쓰는 일이 모두 소비자에게 남는다.\", \"solution\": \"소비자는 정부 장터나 oscar 사이트에서 사는 곳과 나이, 소득을 넣고 bronze, silver, gold 가운데 하나를 고른다. bronze는 보장 대상 의료비의 60%를, silver는 70%를, gold는 80%를 oscar가 낸다. 가입한 뒤에는 oscar 앱에서 보험증을 띄우고 남은 디덕터블과 청구 내역, 검사 결과와 사전승인 상태를 보며 진료비는 자동이체로 낸다. 몸이 아프면 앱에서 비대면 급성 진료를 신청해 이르면 15분 안에 전화나 메시지로 진료를 받는데, 고액공제형 플랜과 secure 플랜을 빼면 0달러다. 처방을 받으면 자주 쓰이는 약은 3달러이고, capsule이나 cvs 배송을 고르면 주문한 날 집으로 온다. 플랜 내용이나 청구서가 이해되지 않으면 앱 메시지로 care team에게 묻고, 앱 설명에 따르면 ai 상담이 먼저 몇 초 안에 답한다. 이 사업의 돈이 어디서 오는지도 함께 봐야 한다. 회사가 sec에 낸 2025년 연차보고서를 보면 그해 보험료의 93%는 회원이 아니라 정부가 보조금으로 직접 냈고, 회원이 낸 몫은 7%였다.\", \"features\": [{\"name\": \"oscar 앱\", \"detail\": \"보험증과 남은 디덕터블, 청구와 청구서, 검사 결과와 사전승인 상태를 한 곳에서 보고 자동이체를 걸어 둔다. 앱 설명에는 문의하면 ai 상담이 몇 초 안에 답하고 care guide가 이어받는다고 적혀 있다. 2026년 9월 기준으로 미국 아이폰 앱스토어 평점은 4.8에 평가 16,634건이고, 구글 플레이는 평점 3.3에 리뷰 3,750건, 설치 50만 회 이상이다.\"}, {\"name\": \"virtual urgent care(비대면 급성 진료)\", \"detail\": \"감기와 목 아픔, 피부 트러블, 요로감염처럼 급하지만 가벼운 문제를 24시간 내내 전화나 메시지로 상담한다. 이르면 15분 안에 연결되고 진단과 처방, 처방 연장까지 받는다. 대부분의 플랜에서 0달러이지만 고액공제형 플랜과 secure 플랜은 제외이며 미국 영토 밖에서는 쓸 수 없다.\"}, {\"name\": \"3달러 처방약과 당일 배송\", \"detail\": \"회사가 지정한 목록에 든 흔한 처방약을 3달러에 준다. 앱이나 전화로 재처방을 받고 capsule의 당일 배송이나 cvs의 90일분 우편 배송을 고를 수 있다. 다만 뉴욕과 뉴저지, 일부 오프라인 전용 플랜과 재난 대비용 플랜에는 이 목록이 적용되지 않는다.\"}, {\"name\": \"care team\", \"detail\": \"전담 상담 조직이 플랜 보장 범위를 설명하고 계약된 병원을 찾아 주며, 진료를 받기 전에 예상 자기부담금을 계산해 준다. 전화와 문자, 앱 메시지로 받는다.\"}, {\"name\": \"oscar unlocks와 질환별 리워드\", \"detail\": \"회원이 작은 과제를 끝내면 혜택을 열어 주고 아이패드 추첨 응모권과 care team 우선 연결을 준다. 질환별 플랜에는 현금성 보상이 붙는데, 만성질환 관리 플랜은 최대 455달러, 당뇨 플랜은 최대 380달러와 검사용품 연 300달러 절감, 폐경 관리 플랜은 최대 150달러, 천식·copd 플랜은 최대 65달러다. 회사가 직접 파는 ichra 전용 플랜은 계정 만들기, 앱 로그인, 종이 안내 끄기, 건강 프로필 작성 네 가지를 끝내면 50달러를 준다.\"}, {\"name\": \"ichra 대응(회사가 돈만 주고 직원이 고르는 제도)\", \"detail\": \"고용주가 단체 보험을 사 주는 대신 매달 정해진 금액을 세금 없이 직원 계좌에 넣어 주면, 직원이 개인 시장에서 원하는 플랜을 고르는 방식이다. oscar는 이 제도를 쓰는 고용주와 직원, 중개인을 모두 상대로 상품과 도구를 제공한다.\"}, {\"name\": \"lucie 장터와 중개 사업\", \"detail\": \"2025년에 인수한 세 회사로 만든 사업이다. 직접 가입 기술 회사 lucie(옛 insxcloud)는 미국 정부가 승인한 11개 가입 경로 가운데 하나이고, ihc specialty benefits는 50개 주에서 여러 보험사의 상품을 파는 중개사이며, healthinsurance.org는 소비자 안내 사이트다. 2026년 4월 20일에는 이 자산을 묶어 여러 보험사의 의료·치과·안과·상해 상품을 한 곳에서 비교하고 묶어 사는 소비자용 장터 lucie health marketplace를 열었다.\"}, {\"name\": \"+oscar와 campaign builder\", \"detail\": \"자사 기술 플랫폼을 다른 보험사와 의료기관에 파는 사업이다. campaign builder는 데이터로 개입할 대상을 찾아 개인화된 안내를 보내고 결과를 집계하는 도구이며, 2025년 12월 31일 기준으로 약 60만 명분의 고객사 인원을 다룬다고 회사가 밝혔다.\"}], \"differentiator\": \"같은 개인 보험 시장에는 centene과 molina healthcare, elevance health, cvs health처럼 규모가 훨씬 큰 보험사가 이미 들어와 있고, oscar가 sec 제출 서류에서 스스로 비교 대상으로 꼽은 회사도 이들과 cigna, humana다. 파는 상품 자체는 크게 다르지 않다. 등급과 보장 범위, 보험료 인상률까지 정부가 정한 규격을 따르고 주와 연방 기관의 승인을 받아야 하기 때문이다. oscar가 내세우는 차이는 상품이 아니라 창구에 있다. 회사를 세울 때부터 자체 기술 플랫폼 위에 앱과 care team을 올려 가입과 청구, 진료 연결을 한 경로로 묶었고, 그 플랫폼을 다른 보험사에도 판다. 다만 진짜로 다른 대목은 사업 구성이다. 경쟁사들은 노인 보험과 저소득층 보험, 기업 단체 보험을 함께 가진 반면 oscar는 개인 보험 한 곳에만 있으며, 뉴스레터 필자는 지금 시장 상황에서 그 구성을 약점으로 본다.\", \"team\": [{\"name\": \"mark t. bertolini\", \"role\": \"최고경영자 겸 이사\", \"background\": \"2023년 4월에 최고경영자로 왔다. 그 전에는 2010년 11월부터 2018년 11월까지 대형 보험사 aetna의 최고경영자였고 2011년 4월부터는 이사회 의장을 겸했다. 2019년부터 2023년까지 투자운용사 bridgewater associates에서 공동 최고경영자와 이사회 의장을 지냈으며, 2015년부터 지금까지 verizon의 이사회 의장을 맡고 있다.\"}, {\"name\": \"mario schlosser\", \"role\": \"공동창업자, 기술 부문 사장 겸 최고기술책임자, 이사\", \"background\": \"2012년에 회사를 함께 세우고 2012년 12월부터 2023년 4월까지 최고경영자를 맡아 회원 100만 명까지 회사를 키웠다. 지금은 제품과 개발, 데이터 과학, 보안을 맡는다. 창업 전에는 라틴아메리카의 소셜 게임 회사 vostu를 공동 창업했고 bridgewater associates에서 거래 모형을 만들었으며 mckinsey에서 컨설턴트로 일했다.\"}, {\"name\": \"joshua kushner\", \"role\": \"공동창업자, 이사회 부의장\", \"background\": \"2012년 10월에 회사를 함께 세웠다. 뉴욕의 벤처투자사 thrive capital의 창업자이자 최고경영자다. 2025년에는 회사에서 보수를 받지 않았다.\"}, {\"name\": \"scott blackley\", \"role\": \"최고재무책임자\", \"background\": \"2021년 3월부터 2022년 12월까지 최고재무책임자를 맡았다가 최고전환책임자를 거쳐 2023년 8월에 다시 최고재무책임자가 됐다. 그 전에는 2016년부터 2021년까지 금융회사 capital one의 최고재무책임자였다.\"}, {\"name\": \"janet liang\", \"role\": \"oscar insurance 사장\", \"background\": \"2026년 주주총회 안내 자료에 보수를 공개해야 하는 주요 임원으로 올라 있다. 이번 조사에서 이전 경력은 확인하지 못했다.\"}], \"traction\": [{\"type\": \"customers\", \"detail\": \"2026년 가입 시즌에 회원이 사상 최대인 약 340만 명이 됐다고 발표했다. 2025년 12월 31일 기준 유효 회원은 204만 2,449명으로 1년 전의 167만 6,970명보다 늘었다.\", \"when\": \"2026-02\", \"source\": \"oscar health 2025년 4분기·연간 실적 보도자료(2026년 2월 10일)와 sec 제출 연차보고서 10-k\"}, {\"type\": \"revenue\", \"detail\": \"2025년 매출은 117억 달러로 1년 전의 92억 달러보다 늘었으나, 의료비 지출 비율이 87.4%까지 올라 영업손실 3억 9,640만 달러, 순손실 4억 4,315만 달러를 냈다.\", \"when\": \"2026-02\", \"source\": \"oscar health 2025년 4분기·연간 실적 보도자료(2026년 2월 10일)\"}, {\"type\": \"revenue\", \"detail\": \"2026년 1분기 매출 46억 4,700만 달러에 순이익 6억 7,900만 달러를 내며 흑자로 돌아섰다. 3월 31일 기준 회원은 317만 4,489명이었다.\", \"when\": \"2026-05\", \"source\": \"oscar health 2026년 1분기 실적 보도자료(2026년 5월 6일)\"}, {\"type\": \"revenue\", \"detail\": \"2026년 상반기 매출 95억 2,700만 달러에 순이익 10억 4,080만 달러를 내고 연간 영업이익 전망을 2억 5,000만~4억 5,000만 달러에서 5억~7억 달러로 올렸다. 6월 30일 기준 유효 회원은 296만 3,002명이다.\", \"when\": \"2026-08\", \"source\": \"oscar health 2026년 2분기 실적 보도자료(2026년 8월 6일)\"}, {\"type\": \"partnership\", \"detail\": \"2025년에 인수한 직접 가입 기술 회사 lucie(옛 insxcloud), 중개사 ihc specialty benefits, 소비자 안내 사이트 healthinsurance.org를 묶어 여러 보험사의 상품을 비교하고 조합해 살 수 있는 소비자용 장터 lucie health marketplace를 열었다.\", \"when\": \"2026-04\", \"source\": \"oscar health 보도자료 'meet lucie. a new way to shop for healthcare.'(2026년 4월 20일)와 sec 제출 연차보고서 10-k\"}, {\"type\": \"customers\", \"detail\": \"2025년에 18개 주에서 팔던 개인 보험을 2026년에는 20개 주로 넓혔다. 다만 2025년 말 기준으로 회원 204만 명 가운데 117만 9,934명이 플로리다 한 주에 몰려 있다.\", \"when\": \"2026-02\", \"source\": \"sec 제출 연차보고서 10-k(2026년 2월 13일 제출)\"}, {\"type\": \"funding\", \"detail\": \"2025년 9월에 전환사채로 3억 5,500만 달러를 조달했고, 2026년 2월 6일에는 3년 만기 4억 7,500만 달러 규모의 담보부 회전 신용 한도를 새로 열었다.\", \"when\": \"2026-02\", \"source\": \"oscar health 보도자료(2025년 9월 16일, 2026년 2월 10일)\"}, {\"type\": \"customers\", \"detail\": \"미국 아이폰 앱스토어에서 평점 4.8에 평가 16,634건이고, 구글 플레이에서는 평점 3.3에 리뷰 3,750건, 설치 50만 회 이상이다. 앱은 무료이며 회원만 쓸 수 있다.\", \"when\": \"2026-09\", \"source\": \"애플 itunes 조회 api와 구글 플레이 앱 페이지를 직접 확인\"}], \"caveats\": \"회사가 스스로 낸 수치와 검증된 수치를 갈라 볼 필요가 있다. 매출과 손익, 회원 수는 상장사가 sec에 내는 서류와 실적 발표 자료에서 확인한 것이므로 근거가 분명하지만, 2026년 2월에 발표한 '사상 최대 약 340만 명'은 가입 시즌 도중에 회사가 집계한 값이다. 실제로 보험료를 내고 있는 회원은 3월 말 317만 4,489명, 6월 말 296만 3,002명으로 해가 갈수록 줄고 있으므로 340만 명을 그 해의 회원 수로 읽으면 안 된다. 회사 소개 페이지에 걸린 순추천지수 66과 69, 회원 68%가 진료 안내를 신뢰한다는 수치, 회원 44%가 온라인 계정을 쓴다는 수치는 모두 회사가 자기 회원을 상대로 낸 것이며 제삼자가 검증하지 않았다. 같은 소개 페이지 안에서도 회원 수가 한 곳은 약 160만 명, 다른 곳은 약 320만 명으로 어긋나 있어 갱신이 밀린 것으로 보인다. lucie 보도자료가 든 '미국 노동자의 94%가 더 많은 보험 선택지를 원한다', '개인 시장으로 옮긴 뒤 93%가 만족한다'도 회사가 인용한 수치다. 구조적인 위험도 함께 봐야 한다. 2025년 보험료의 93%는 회원이 아니라 정부가 보조금으로 낸 돈이므로, 이 회사의 매출은 소비자 지갑보다 정부 정책에 달려 있다. 보조금을 크게 늘려 주던 제도는 2025년 말에 끝나 예전 구조로 돌아갔고, 2025년 7월에 통과된 법은 보조금 자격을 좁히고 확인 절차를 늘렸다. 뉴스레터 필자는 여기에 더해 개인 보험 한 시장에만 사업이 있다는 점, 그리고 2025년에 한 여러 건의 소규모 인수가 핵심 매출 기회로 부각되는 것 자체가 이 회사의 문제를 드러낸다고 지적했다. 다만 그 인수 자산은 두 달 뒤에 lucie라는 소비자용 장터로 묶여 나왔다.\", \"for_us\": \"보험을 파는 일 자체는 3개월과 소프트웨어 인력이라는 조건 밖에 있으므로, 볼 것은 이 회사가 보험이 아니라 앱 화면에서 무엇을 하고 있는지다. 첫째로 눈여겨볼 것은 미국 소비자가 보험을 들고도 그 보험을 못 쓴다는 문제다. 남은 디덕터블이 얼마인지, 이 병원이 계약된 곳인지, 이 진료를 받으면 얼마를 내는지를 모르는 상태가 기본값이고, oscar는 그 세 가지를 앱 화면과 care team 메시지로 풀어 주는 데 제품의 상당 부분을 쓴다. 우리는 보험사가 아니라서 청구 데이터를 받을 수 없지만, 사용자가 직접 입력하거나 안내문을 찍어 올리는 방식이라면 3개월 안에 만들 수 있는 범위에 들어온다. 둘째는 리워드 과제의 종류다. 현금 리워드 자체는 우리 앱에 이미 있어 제외 대상이지만, oscar가 값을 매기는 행동은 걸음이 아니라 계정 만들기, 앱 로그인, 종이 안내 끄기, 건강 프로필 작성, 연 1회 건강검진 받기, 만성질환 관리 과제 끝내기다. 보상 방식이 아니라 무엇을 과제로 삼는지를 참고할 수 있고, 질환별로 최대 금액을 65달러에서 455달러까지 다르게 매긴 점도 과제의 무게를 어떻게 갈랐는지 보여 준다. 셋째는 시점이다. 미국 개인 보험 가입자는 해마다 정해진 기간에 플랜을 다시 고르며, 2026년에는 등급 구성이 한 해 만에 크게 바뀔 만큼 이동이 컸다. 비교와 계산을 돕는 화면의 수요가 그 시기에 몰린다는 뜻이므로, 우리가 미국에서 앱을 열 이유를 만들려 한다면 이 달력을 먼저 확인하는 편이 낫다. 다만 증상에서 진료로 이어지는 안내를 붙이는 일은 규제선에 닿으므로 기능을 고르기 전에 선을 확인해야 한다.\", \"screenshots\": [{\"file\": \"oscar-health_home.png\", \"caption\": \"첫 화면이다. 보험 회사가 아니라 건강 관리를 함께하는 곳이라고 내세우면서, 이미 가입한 회원의 계정 들어가기와 새로 플랜 고르기를 나란히 놓았다.\", \"from\": \"https://www.hioscar.com/\"}, {\"file\": \"oscar-health_rewards.png\", \"caption\": \"혜택과 리워드 안내 페이지다. 작은 과제를 끝내면 열리는 oscar unlocks 위에, 질환별 플랜의 보상 금액이 만성질환 최대 455달러, 당뇨 최대 380달러, 폐경 최대 150달러, 천식·copd 최대 65달러로 나란히 붙어 있다.\", \"from\": \"https://www.hioscar.com/perks-and-rewards\"}, {\"file\": \"oscar-health_ichra.png\", \"caption\": \"고용주용 ichra 안내 페이지다. 회사가 매달 정해진 금액만 세금 없이 넣어 주고 직원이 개인 시장에서 플랜을 직접 고르는 방식을 세 단계로 설명한다.\", \"from\": \"https://www.hioscar.com/ichra\"}, {\"file\": \"oscar-health_ios.png\", \"caption\": \"미국 아이폰 앱스토어 페이지다. 평점 4.8에 평가 16,634건이며, 설명에 비대면 진료와 ai 상담, oscar unlocks 리워드가 기능으로 적혀 있다.\", \"from\": \"https://apps.apple.com/us/app/oscar-health/id781584599\"}], \"sources\": [{\"title\": \"oscar health 공식 사이트\", \"url\": \"https://www.hioscar.com\", \"note\": \"플랜 등급과 보장 비율, 0달러 예방 진료와 비대면 급성 진료, 3달러 처방약, care team, 앱 기능을 확인했다.\"}, {\"title\": \"oscar 혜택과 리워드 안내\", \"url\": \"https://www.hioscar.com/perks-and-rewards\", \"note\": \"oscar unlocks의 보상 방식과 질환별 플랜의 리워드 금액, ichra 전용 플랜의 50달러 과제 네 가지를 확인했다.\"}, {\"title\": \"oscar 비대면 급성 진료 안내\", \"url\": \"https://www.hioscar.com/virtual-urgent-care\", \"note\": \"24시간 운영과 15분 연결, 0달러 적용 조건과 제외 플랜, 처방 배송 경로를 확인했다.\"}, {\"title\": \"oscar 고용주용 ichra 안내\", \"url\": \"https://www.hioscar.com/ichra\", \"note\": \"고용주가 금액만 정해 주고 직원이 개인 시장에서 고르는 구조를 확인했다.\"}, {\"title\": \"2025년 4분기·연간 실적 보도자료\", \"url\": \"https://s27.q4cdn.com/943936911/files/doc_financials/2025/q4/oscar-health-fourth-quarter-and-full-year-2025-financial-results.pdf\", \"note\": \"뉴스레터 14회차가 다룬 그 실적이다. 2025년 매출 117억 달러와 순손실 4억 4,315만 달러, 사상 최대 약 340만 명 발표, 2026년 흑자 전환 전망을 확인했다.\"}, {\"title\": \"2026년 1분기 실적 보도자료\", \"url\": \"https://s27.q4cdn.com/943936911/files/doc_financials/2026/q1/oscar-health-first-quarter-2026-financial-results.pdf\", \"note\": \"3월 31일 기준 회원 317만 4,489명과 1분기 순이익 6억 7,900만 달러를 확인했다.\"}, {\"title\": \"2026년 2분기 실적 보도자료\", \"url\": \"https://s27.q4cdn.com/943936911/files/doc_financials/2026/q2/oscar-health-second-quarter-2026-financial-results.pdf\", \"note\": \"상반기 순이익 10억 4,080만 달러와 연간 영업이익 전망 상향, 6월 30일 기준 회원 296만 3,002명을 확인했다.\"}, {\"title\": \"sec 제출 연차보고서 10-k (2025 회계연도)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1568651/000156865126000011/oscr-20251231.htm\", \"note\": \"보험료의 93%가 정부에서 들어온다는 사실, 주별 회원 분포와 플로리다 집중, 18개 주에서 20개 주로 확대, 보조금 확대 제도의 2025년 말 종료, lucie와 ihc specialty benefits, healthinsurance.org 인수, +oscar의 약 60만 명을 확인했다.\"}, {\"title\": \"sec 제출 주주총회 안내 자료 def 14a a와 매사추세츠 블루크로스블루실드, Cigna, UnitedHealthcare 로고를 붙여 보험 네트워크 안에 있다는 점을 앞세운다.","from":"https://oshihealth.com/"},{"file":"oshi-health_pricing.png","caption":"값과 보험 안내 페이지다. 보험이 적용되면 1년 무제한 진료에 전문의 진료 4회분만 본인이 부담하고, 보험망 밖이면 1회 150달러라고 적혀 있다. 메디케어와 메디케이드는 받지 않는다는 안내도 함께 있다.","from":"https://oshihealth.com/pricing-insurance/"},{"file":"oshi-health_ios.png","caption":"미국 애플 앱스토어 페이지다. 별점 3.1에 평가 117건이며 분류가 '소화기내과 원격진료'로 돼 있다. 앱이 앞에 띄운 후기 가운데 연락이 잘 닿지 않았다는 2점짜리 글이 보인다.","from":"https://apps.apple.com/us/app/oshi-health/id1518331430"}],"q":"{\"slug\": \"oshi-health\", \"name\": \"oshi health\", \"one_liner\": \"소화기 질환만 보는 원격 진료 클리닉이다. 소화기내과 전문의와 영양사와 심리 담당자를 한 팀으로 묶어 화상으로 진료하고, 진료비는 환자가 가진 보험과 고용주에게 청구한다.\", \"site\": \"https://oshihealth.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"20\", \"section\": 26, \"headline\": \"phti가 낸 버추얼 소화기 진료 평가에서, 임상의가 직접 환자를 보는 쪽(ayble, oshi, salvo)으로 분류된 회사 가운데 하나로 이름만 언급됐다.\"}], \"card\": {\"problem\": \"미국에서 소화기내과 전문의를 만나려면 대도시권에서도 평균 40일을 기다려야 하고, 식이 상담과 심리 치료까지 함께 받는 다학제 진료는 거의 전부 대학병원 안에만 있다. 기다리는 동안 증상이 심해져 응급실로 가는 일이 잦다.\", \"solution\": \"소화기내과 전문의와 영양사와 장뇌축 심리 담당자와 진료 코디네이터를 한 팀으로 묶어 앱으로 화상 진료와 무제한 채팅 상담을 제공하고, 보험 네트워크 안에서 진료비를 청구한다. 첫 진료까지 며칠 안에 잡히는 것을 가장 앞세워 광고한다.\", \"price\": \"보험이 적용되면 1년 무제한 진료를 받으면서 전문의 진료 4회분의 본인부담금만 낸다. 보험망 밖이면 1회 150달러이며 fsa와 hsa 자금으로 낼 수 있다.\", \"tags\": [\"원격진료\", \"소화기 질환\", \"다학제 진료\", \"보험 청구\", \"고용주 복지\"], \"headline_traction\": \"누적 민간 투자 1억 1,850만 달러이며, 2026년 7월 american journal of gastroenterology에 대조군을 둔 전향 연구를 실어 환자 1인당 연 8,112달러 절감을 보고했다.\", \"watch\": \"회사가 내세우는 절감액과 증상 개선률은 대부분 회사 자체 분석이며, phti는 평가 시점에 oshi가 제출한 연구가 전부 학회 초록과 포스터여서 편향 위험을 매길 수 없었다고 적었다.\"}, \"problem\": \"미국 성인 다섯 명 가운데 한 명이 소화기 질환을 겪고, 여기에 들어가는 의료비가 한 해 1,118억 달러다. phti는 이 금액이 당뇨병이나 심장병에 쓰는 돈보다 많다고 적었다. 그런데 소화기내과는 미국 전문과목 가운데 환자가 기다리는 기간이 세 번째로 긴 과목이며, 회사가 인용한 자료로는 2025년 대도시권 평균 대기가 40일이었다. 게다가 약 처방과 식이 상담과 심리 치료를 한 팀이 함께 다루는 다학제 진료는 사실상 대학병원 안에만 있어서, 지역에 사는 환자는 그 조합을 아예 구할 수 없다. 한국에서는 배가 아프면 동네 내과에 가서 며칠 안에 진료를 받고 건강보험으로 처리되지만, 미국에서는 그 몇 주를 기다리는 동안 증상이 심해져 응급실로 가는 일이 잦고, phti는 관리되지 않은 소화기 증상이 미국에서 진료 후 바로 귀가하는 응급실 방문의 첫 번째 이유라고 적었다. 비용을 대는 고용주와 보험사 쪽에서 보면, 이 대기가 곧 불필요한 내시경과 영상 검사와 입원으로 이어지는 구조다.\", \"solution\": \"환자는 먼저 사이트에서 자기가 사는 주와 보험을 넣어 적용 여부를 확인하고 앱으로 가입한다. 회사가 학술지에 실은 연구에서 첫 진료까지 걸린 기간은 중앙값 6일이었다. 진료는 전부 화상으로 이뤄지며, 배정되는 팀에는 소속 소화기내과 전문의와 그 감독을 받는 임상 간호사 또는 의사보조, 등록 영양사, 장뇌축을 다루는 심리 담당자, 그리고 검사 예약과 의무기록 확보와 외부 의뢰를 대신 처리하는 진료 코디네이터가 들어간다. 약 처방과 용량 조정, 검사 지시도 oshi 소속 의료진이 직접 하며, 내시경이나 영상 촬영, 주사 치료처럼 직접 만나야 하는 처치는 지역 의료기관으로 연결한다. 진료와 진료 사이에는 앱 채팅으로 팀에 계속 물어볼 수 있다. 값을 매기는 방식이 일반 병원과 다른데, 진료 회차마다 청구하지 않고 1년 무제한 진료를 묶어 팔면서 그 가운데 전문의 진료 4회분에 대해서만 본인부담금과 공제액을 받는다. 보험 네트워크 밖이면 1회 150달러다. 메디케어와 메디케이드는 받지 않으며 18세 이상만 진료한다.\", \"features\": [{\"name\": \"전문의가 주치의를 맡는 다학제 팀\", \"detail\": \"전문의와 영양사와 심리 담당자와 코디네이터가 하나의 치료 계획을 공유한다. phti 비교표에서 소화기내과 전문의가 환자의 주치의 역할을 하며 약을 처방하는 회사는 평가 대상 다섯 곳 가운데 ayble과 oshi 둘뿐이었다.\"}, {\"name\": \"보험 네트워크 안 청구\", \"detail\": \"aetna, cigna, unitedhealthcare, 매사추세츠 블루크로스블루실드를 비롯한 보험사와 네트워크 계약을 맺어 진료비를 직접 청구한다. 환자가 스스로 큰돈을 내지 않아도 되는 구조여서, 소비자에게 현금을 받는 원격진료 회사들과 값을 매기는 방식이 다르다.\"}, {\"name\": \"1년 묶음 요금\", \"detail\": \"진료 회차마다 청구하지 않고 1년 치를 묶어 판다. phti는 임상의 주도 솔루션이 구매자에게 매기는 값을 참여 회원 1인당 연 1,025달러로 추정했으며, 이는 회사들이 제공한 가격 정보를 근거로 삼은 수치다.\"}, {\"name\": \"수수료 전액을 건 성과 보증\", \"detail\": \"2025년 4월에 수수료 100%를 성과에 거는 roi 보증을 발표했다. phti는 oshi의 보증 기준이 총 의료비라고 기록했으며, 같은 표에서 ayble의 기준은 임상 지표와 재무 지표 둘 다였다.\"}, {\"name\": \"모바일 앱\", \"detail\": \"화상 진료, 팀과의 무제한 채팅, 예약, 치료 계획 확인을 앱 하나에서 한다. 아이폰 전용이며 2020년 11월에 처음 등록됐고, 안드로이드판은 내려받기 1만 회 이상이다.\"}, {\"name\": \"access+\", \"detail\": \"2025년 10월에 지역 소화기내과 의원이 oshi의 영양과 심리 인력을 끌어다 쓰게 하는 상품을 냈다. 외부 의사가 주치의를 맡고 oshi는 보조 인력만 대는 형태여서, phti 분류로는 랩어라운드 쪽에 가깝다. phti도 이 움직임을 보고서에 따로 적었다.\"}, {\"name\": \"glp-1 소화기 부작용 진료\", \"detail\": \"비만 치료제를 쓰면서 생기는 메스꺼움과 변비 같은 소화기 부작용을 별도 진료 항목으로 두고 있다. 2026년 7월에는 glp-1 사용자의 75%가 소화기 부작용을 겪는다는 자체 의뢰 조사 결과를 냈다.\"}], \"differentiator\": \"뉴스레터가 oshi와 나란히 놓은 ayble health와 견주면 분류는 같고 체급과 근거의 성격이 다르다. phti는 둘 다 임상의 주도 솔루션으로 묶었고, 둘 다 소화기내과 전문의가 주치의를 맡아 약을 처방하며 고용주와 보험사에 팔고 네트워크 안에서 청구한다는 점까지 같다. 체급은 열 배 차이인데, oshi는 2018년에 세워져 누적 1억 1,850만 달러를 모았고 ayble은 2020년에 세워져 1,140만 달러를 모았다. 더 중요한 차이는 내놓은 근거의 성격이다. ayble이 낸 두 연구는 대조군 없는 단일군이지만 편향 위험이 낮다는 평가를 받았고 과민성대장증후군 증상 점수가 평균 140점 떨어졌다고 보고했으나, 비용이나 의료 이용량을 본 연구는 하나도 없다. 반대로 oshi가 낸 세 연구는 phti 평가 시점에 전부 학회 초록과 포스터여서 편향 위험을 매길 수조차 없었으나, 응급실 방문 68% 감소와 1인당 연 6,081달러 절감처럼 돈을 대는 쪽이 원하는 수치를 갖고 있었다. 즉 ayble은 연구의 질이 낫고 oshi는 범위가 넓다. 다만 그 평가가 나온 뒤 oshi는 2026년 6월과 7월에 심사를 거친 학술지 두 곳에 논문을 실어 이 약점을 스스로 메웠다. 팀 구성에서도 갈리는데, ayble은 약 선택과 약값까지 다루는 임상 약사를 두었고 phti 비교표에서 약사를 둔 회사는 ayble 하나뿐이었다. oshi는 대신 검사 예약과 외부 의뢰를 대신 처리하는 진료 코디네이터를 전면에 둔다.\", \"team\": [{\"name\": \"sam holliday\", \"role\": \"최고경영자\", \"background\": \"회사 소개 페이지에 2017년 어머니가 과민성대장증후군 진단을 받고 저포드맵 식이를 혼자 알아내 관리하다가 스트레스로 증상이 악화돼 응급실과 입원까지 갔던 일이 창업 계기라고 적혀 있다. 2025년 rock health가 뽑은 디지털 헬스 50인에 들었다. 이전 직장 경력은 확인하지 못했다.\"}, {\"name\": \"sameer k. berry\", \"role\": \"공동창업자 겸 최고의료책임자\", \"background\": \"소화기내과 의사이며 2025년 modern healthcare가 뽑은 영향력 있는 임상 경영자 50인에 들었다. 회사가 학술지에 낸 연구들에서 저자로 이름을 올렸다.\"}, {\"name\": \"danny krifcher\", \"role\": \"사장 겸 최고운영책임자\", \"background\": \"회사가 새로 만든 자리에 선임됐다고 발표했다. 이전 경력은 확인하지 못했다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"6,000만 달러 규모 시리즈 c를 마무리했고, 여기에 미국소화기학회(acg)와 미국소화기학회(aga)의 gi opportunity fund, 그리고 개원의와 대학병원 소속 소화기내과 의사들이 추가로 참여했다고 발표했다. acg와 aga는 2023년에도 투자한 바 있다.\", \"when\": \"2025-01\", \"source\": \"oshi health 보도자료\"}, {\"type\": \"funding\", \"detail\": \"pitchbook 집계 기준 누적 민간 투자액이 1억 1,850만 달러다. 같은 표에서 ayble health는 1,140만 달러, cylinder health는 4,930만 달러, salvo health는 2,890만 달러였다.\", \"when\": \"2026-02\", \"source\": \"phti 보고서가 인용한 pitchbook 자료(2026년 2월 6일 기준)\"}, {\"type\": \"award\", \"detail\": \"phti 평가에서 ayble, salvo와 함께 임상의 주도 솔루션으로 묶여, 과민성대장증후군과 염증성장질환 환자 대상 확대 도입을 지지한다는 종합 판정을 받았다. 다만 임상 근거의 확실성 등급은 '낮음'이었다.\", \"when\": \"2026-03\", \"source\": \"phti, virtual gastrointestinal care solutions 보고서\"}, {\"type\": \"award\", \"detail\": \"journal of medical internet research에 환자 1만 1,345명을 다룬 연구를 실었다. 92.4%가 증상 개선을 보고했고 첫 진료까지 걸린 기간의 중앙값이 6일이었다. 미시간대 소화기내과 과장 william d. chey가 공저자로 참여했다.\", \"when\": \"2026-06\", \"source\": \"oshi health 보도자료\"}, {\"type\": \"award\", \"detail\": \"american journal of gastroenterology에 대조군을 둔 전향 연구를 실었다. 환자 234명을 성향점수로 맞춘 대조군과 비교해 소화기 관련 비용이 월 443달러, 전체 의료비가 월 676달러 줄었고, 이를 1년으로 환산하면 5,316달러와 8,112달러다. 영상 검사를 받은 비율은 15% 대 44%, 소화기 관련 응급실 방문은 4% 대 10%였다.\", \"when\": \"2026-07\", \"source\": \"oshi health 보도자료\"}, {\"type\": \"partnership\", \"detail\": \"teladoc health가 자사 prism 플랫폼에서 진료팀이 의뢰할 수 있는 전문 진료 파트너로 oshi를 추가했다.\", \"when\": \"2025-03\", \"source\": \"teladoc health 보도자료(oshi 뉴스룸 게재)\"}, {\"type\": \"partnership\", \"detail\": \"고용주 건강 관리 서비스 회사 accolade가 신뢰 파트너 목록에 oshi를 넣었다.\", \"when\": \"2025-03\", \"source\": \"accolade 보도자료(oshi 뉴스룸 게재)\"}, {\"type\": \"partnership\", \"detail\": \"독립 소화기내과 의원 네트워크인 one gi와 제휴해, 해당 의원들의 진료 여력을 늘리고 대기 기간을 줄이는 일을 함께 하기로 했다.\", \"when\": \"2026-04\", \"source\": \"one gi 보도자료(oshi 뉴스룸 게재)\"}, {\"type\": \"customers\", \"detail\": \"회사 첫 화면에 누적 환자 4만 7,000명 이상과 환자 만족도 98%가 적혀 있다. 2025년 4월 보도자료에는 50개 주에서 5,700만 명 이상이 네트워크 안에서 이용할 수 있다고 돼 있다.\", \"when\": \"2026-09\", \"source\": \"oshi health 공식 사이트와 보도자료\"}, {\"type\": \"traffic\", \"detail\": \"미국 애플 앱스토어에서 별점 3.1에 평가 117건이고 최신 버전은 2026년 8월 29일에 올라왔다. 구글 플레이에서는 별점 3.6에 후기 82건, 내려받기 1만 회 이상이다.\", \"when\": \"2026-09\", \"source\": \"애플 itunes 조회 api와 구글 플레이 페이지\"}], \"caveats\": \"가장 먼저 갈라 볼 것은 수치를 누가 냈는가다. 환자 만족도 98%와 누적 환자 4만 7,000명, 증상 조절 97%는 전부 회사가 자기 환자 자료를 정리해 낸 것이며 제삼자가 확인한 자료를 찾지 못했다. 반면 누적 투자액 1억 1,850만 달러는 pitchbook 집계를 phti가 인용한 것이고, 임상의 주도 솔루션 전반에 대한 판정은 phti가 독립적으로 내린 것이다.\\n\\nphti는 oshi에 대해 두 가지를 분명히 짚었다. 첫째, 제출된 세 연구가 전부 학회 초록과 포스터라서 편향 위험을 평가할 수 없었고, 그래서 임상의 주도 솔루션 묶음의 근거 확실성 등급이 '낮음'으로 매겨졌다. 둘째, 절감액이 커 보이는 이유에 선택 편향이 섞여 있을 수 있다는 지적이다. phti는 oshi가 보고한 등록 환자의 연간 전체 의료비가 5만 달러로, 염증성장질환 환자 평균인 약 2만 5,000달러의 두 배라고 적었다. 원래 돈이 많이 드는 환자가 모였다면 줄어드는 금액도 커 보이게 된다.\\n\\n다만 이 지적은 시점이 있다. phti 보고서는 2026년 3월에 나왔고, oshi는 그 뒤인 6월과 7월에 심사를 거친 학술지 두 곳에 논문을 실었다. 뉴스레터를 읽고 이 회사를 볼 때 근거가 부실하다고만 정리하면 최근 석 달을 놓치게 된다. 그렇다고 논문이 모든 의문을 없앤 것은 아니다. ajg 연구는 환자 234명 규모이고, 6개월치 자료를 1년으로 환산한 수치이며, 무작위 배정이 아니라 성향점수로 맞춘 대조군과 비교한 것이다. 보고된 p값도 0.047과 0.043으로 통상적인 기준선에 가깝다. 회사가 함께 내세운 투자 대비 7.2배 회수라는 숫자는 학술지 검증 대상이 아니라 회사가 기존 행위별 수가 기준과 비교해 계산한 값이다.\\n\\n환자 평가는 회사가 내세우는 만족도와 어긋난다. 미국 애플 앱스토어 별점이 3.1이고, 앱스토어가 앞에 띄운 후기 가운데는 연락이 잘 닿지 않고 진료가 효과가 없었다는 2점짜리 글이 있다. 앱 평점이 낮은 이유가 진료의 질 때문인지 앱 자체의 문제인지는 확인하지 못했다.\\n\\n그 밖에 사소하지만 적어 둘 것이 있다. danny krifcher 선임 보도자료는 목록에 2026년 5월 12일로 걸려 있으나 본문에는 2025년 5월 12일로 적혀 있어 날짜가 어긋난다. 매출은 공개된 자료를 찾지 못해 넣지 않았다. 창업자 두 사람의 이전 직장 경력도 확인하지 못해 비워 두었다.\", \"for_us\": \"우리 목적에 비추면 oshi가 하는 진료 자체는 따라 할 수 없다. 의사 면허와 보험사 네트워크 계약이 있어야 하고 3개월로는 어림없다. 가져갈 것은 이 회사가 아니라 이 회사를 평가한 기관이 인정한 대목이다. phti는 의사 없이 식이 상담과 장뇌축 심리 지원만 붙인 랩어라운드 제품도 과민성대장증후군 환자에게는 임상적으로 의미 있는 증상과 삶의 질 개선을 냈다고 판정했다. 반대로 염증성장질환에는 효과가 없었다고 못 박았다. 이 구분이 우리에게 중요한데, 소프트웨어만으로 다룰 수 있는 쪽이 정확히 앞의 것이기 때문이다. 우리 앱은 이미 식단을 기록하고 있으므로, 복통과 팽만과 배변 같은 증상 로그를 붙이고 어떤 음식 뒤에 증상이 잦았는지 되돌려 보여 주는 화면까지는 3개월 안에 만들 수 있다. 진단이나 치료를 말하지 않고 본인이 기록한 것을 정리해 보여 주는 선을 지키면 규제 부담도 작다.\\n\\n두 번째로 볼 것은 oshi가 환자를 끌어오는 지점이다. 이 회사가 첫 화면에서 가장 크게 내세우는 것은 치료 성적이 아니라 '내일이라도 볼 수 있다'는 대기 기간이다. 학술지 논문에서도 첫 진료까지 6일이라는 수치를 앞에 세웠다. 미국에서 건강 관련 제품이 사람을 움직이는 지점이 무엇인지 알려 주는 대목이며, 우리가 미국 사용자에게 줄 가치를 고를 때도 참고가 된다.\\n\\n마지막으로 조심할 대목이 있다. 증상 기록을 다루는 순간 그 자료는 건강정보가 된다. 앞서 정리한 대로 미국에서는 광고 sdk가 건강 자료에 닿는 구조가 규제 위험으로 돌아온 사례가 있으므로, 증상 로그를 붙이기로 한다면 그 자료를 광고 쪽과 분리하는 일을 설계 단계에서 정해 둬야 한다.\", \"screenshots\": [{\"file\": \"oshi-health_home.png\", \"caption\": \"첫 화면이다. '내일이라도 집에서 진료를 받을 수 있다'는 문구를 가장 크게 걸었고, 그 아래 aetna와 매사추세츠 블루크로스블루실드, cigna, unitedhealthcare 로고를 붙여 보험 네트워크 안에 있다는 점을 앞세운다.\", \"from\": \"https://oshihealth.com/\"}, {\"file\": \"oshi-health_pricing.png\", \"caption\": \"값과 보험 안내 페이지다. 보험이 적용되면 1년 무제한 진료에 전문의 진료 4회분만 본인이 부담하고, 보험망 밖이면 1회 150달러라고 적혀 있다. 메디케어와 메디케이드는 받지 않는다는 안내도 함께 있다.\", \"from\": \"https://oshihealth.com/pricing-insurance/\"}, {\"file\": \"oshi-health_ios.png\", \"caption\": \"미국 애플 앱스토어 페이지다. 별점 3.1에 평가 117건이며 분류가 '소화기내과 원격진료'로 돼 있다. 앱이 앞에 띄운 후기 가운데 연락이 잘 닿지 않았다는 2점짜리 글이 보인다.\", \"from\": \"https://apps.apple.com/us/app/oshi-health/id1518331430\"}, {\"file\": \"oshi-health_phti.png\", \"caption\": \"뉴스레터가 소개한 phti 평가 페이지다. 랩어라운드 제품과 임상의 주도 제품을 나눠 평가했고 보고서 원문과 요약본을 내려받을 수 있게 해 두었다.\", \"from\": \"https://www.phti.org/assessment/virtual-solutions-gi-conditions/\"}], \"sources\": [{\"title\": \"oshi health 공식 사이트\", \"url\": \"https://oshihealth.com/\", \"note\": \"진료 대상 질환, 팀 구성, 네트워크 계약 보험사, 누적 환자 4만 7,000명과 만족도 98% 주장을 확인했다.\"}, {\"title\": \"oshi health 값과 보험 안내\", \"url\": \"https://oshihealth.com/pricing-insurance/\", \"note\": \"1년 무제한 진료에 전문의 진료 4회분만 부담하는 구조, 보험망 밖 1회 150달러, fsa와 hsa 사용 가능, 메디케어와 메디케이드 미수용, 18세 이상 제한을 확인했다.\"}, {\"title\": \"phti, virtual gastrointestinal care solutions 평가\", \"url\": \"https://www.phti.org/assessment/virtual-solutions-gi-conditions/\", \"note\": \"뉴스레터가 소개한 평가의 원문 페이지다. 랩어라운드와 임상의 주도의 구분, 종합 판정, 보고서 내려받기 위치를 확인했다.\"}, {\"title\": \"phti 평가 보고서 전문(2026년 5월 개정판)\", \"url\": \"https://www.phti.org/wp-content/uploads/2026/05/phti-virtual-gi-care-solutions-assessment-report-v1.1.pdf\", \"note\": \"다섯 회사의 설립 연도와 누적 투자액 표, 기능 비교표, oshi와 ayble의 제출 연구에 대한 평가, 등록 환자의 연간 의료비가 평균의 두 배라는 지적, 구매자 측 가격 추정치 1,025달러를 확인했다.\"}, {\"title\": \"oshi health, jmir 논문 게재 발표\", \"url\": \"https://oshihealth.com/newsroom/press-releases/oshi-health-publishes-peer-reviewed-study-of-11000-patients-validating-virtual-multidisciplinary-gi-care-at-scale/\", \"note\": \"환자 1만 1,345명, 증상 개선 92.4%, 첫 진료 대기 중앙값 6일, 공저자 william d. chey를 확인했다.\"}, {\"title\": \"oshi health, american journal of gastroenterology 논문 게재 발표\", \"url\": \"https://oshihealth.com/newsroom/press-releases/oshi-health-publishes-prospective-study-in-the-american-journal-of-gastroenterology-validating-improved-outcomes-and-reduced-healthcare-costs-through-virtual-multidisciplinary-gi-care/\", \"note\": \"환자 234명, 월 443달러와 676달러 절감, 연 환산 5,316달러와 8,112달러, 영상 검사와 응급실 방문 비교 수치, 투자 대비 7.2배 회수 주장을 확인했다.\"}, {\"title\": \"oshi health, 시리즈 c 추가 투자 발표\", \"url\": \"https://oshihealth.com/newsroom/press-releases/oshi-health-adds-to-recent-60-million-funding-with-strategic-investments-from-american-college-of-gastroenterology-american-gastroenterological-association-and-practicing-physicians-with-scrub-capit/\", \"note\": \"6,000만 달러 시리즈 c, acg와 aga gi opportunity fund의 참여, 2023년 선행 투자 사실, 소속 인력 구성을 확인했다.\"}, {\"title\": \"oshi health, 수수료 전액을 건 roi 보증 발표\", \"url\": \"https://oshihealth.com/newsroom/press-releases/oshi-health-unveils-100-fees-at-risk-roi-guarantee-for-outcomes-based-gastrointestinal-care/\", \"note\": \"성과 보증의 내용, 1인당 연 1만 292달러 절감 주장, 50개 주 5,700만 명 이용 가능 주장을 확인했다.\"}, {\"title\": \"oshi health 2025 임팩트 리포트 발표\", \"url\": \"https://oshihealth.com/newsroom/press-releases/oshi-healths-2025-impact-report-demonstrates-exceptional-gi-outcomes-and-cost-savings-at-scale/\", \"note\": \"증상 조절 97%, 1인당 연 6,081달러 절감, 응급실 방문 68% 감소라는 회사 자체 수치를 확인했다.\"}, {\"title\": \"ayble health 공식 사이트\", \"url\": \"https://www.ayblehealth.com/\", \"note\": \"비교 대상 회사의 모델을 확인했다. 임상 약사를 팀에 둔 점, 클리블랜드 클리닉과 함께 만든 장뇌축 프로그램, 본인부담금 0~30달러 안내를 확인했다.\"}, {\"title\": \"애플 앱스토어 oshi health\", \"url\": \"https://apps.apple.com/us/app/oshi-health/id1518331430\", \"note\": \"별점 3.1과 평가 117건, 최신 버전 날짜, 앞에 걸린 부정적 후기를 확인했다.\"}, {\"title\": \"구글 플레이 oshi health\", \"url\": \"https://play.google.com/store/apps/details?id=com.oshimobile\", \"note\": \"별점 3.6, 후기 82건, 내려받기 1만 회 이상을 확인했다.\"}]}"},{"slug":"oula","name":"Oula","one_liner":"조산사와 산부인과 의사를 한 팀으로 묶어 임신 준비부터 출산과 산후까지 맡는 미국의 산과 진료소로, 평소 진찰은 자체 클리닉에서 하고 분만은 제휴한 병원에서 하며 진료비는 환자에게 직접 받지 않고 건강보험에 청구한다.","sells_to":"mixed","seen_in":[{"issue":"45","section":16,"headline":"산과 영역의 소비자 브랜드가 병원 그룹 Novant Health와 함께 샬럿에 클리닉을 열고 남동부로 더 확장하겠다고 밝힌 소식으로 짧게 다뤄졌다."}],"card":{"problem":"미국에서 임신부는 의료 개입이 많은 병원 진료와 시간을 충분히 쓰는 조산사 진료 가운데 하나를 처음부터 골라야 했다. 그래서 출산 경험에 실망하는 사람이 많고, 진찰이 짧고 자기 뜻이 반영되지 않는다는 불만이 쌓여 있다.","solution":"조산사와 산부인과 의사, 진료 안내 담당자를 한 팀으로 두고 임신 전부터 산후까지 맡는다. 평소 진찰은 자체 클리닉에서 조산사가 길게 보고, 분만은 제휴한 대형 병원에서 하되 조산사와 의사가 함께 병원에 들어간다.","price":"진료비를 건강보험에 청구하므로 환자는 자기 보험의 본인부담금만 낸다. 보험 밖 현금 상품은 산후 모임 Circles 하나이며 1회 95달러다.","tags":["산과 진료","조산사","병원 제휴","보험 청구","메디케이드"],"headline_traction":"2026년 6월에 병원 그룹 Novant Health와 손잡고 샬럿에 다섯 번째 클리닉을 열어 남동부에 처음 들어갔고, 누적 분만 3,000건을 넘겼다고 밝혔다.","watch":"제왕절개 25% 감소 같은 성과 수치는 모두 회사가 스스로 내놓은 값이고, 저위험 임신을 주로 받는 진료소라 일반 병원 평균과 그대로 견주기 어렵다."},"screenshots":[{"file":"oula_home.png","caption":"첫 화면이다. 분만 3,000건, 보험 30종 이상, 구글 평점 4.5점을 앞에 내걸고 산부인과 의사와 조산사, 진료 안내 담당자 세 역할을 나란히 보여 준다.","from":"https://oulahealth.com/"},{"file":"oula_charlotte.png","caption":"샬럿 클리닉 안내 화면이다. 이름을 Oula with Novant Health로 걸고, 분만은 Novant Health Presbyterian Medical Center에서 한다고 적어 두었다.","from":"https://oulahealth.com/locations/cotswold-clinic/"},{"file":"oula_health_systems.png","caption":"병원 그룹을 상대로 만든 화면이다. 클리닉 개설 비용을 Oula가 부담하고 3개월에서 6개월 안에 문을 연다는 조건, 그리고 뉴욕 사례의 성과 수치를 제시한다.","from":"https://oulahealth.com/health-systems/"}],"q":"{\"slug\": \"oula\", \"name\": \"oula\", \"one_liner\": \"조산사와 산부인과 의사를 한 팀으로 묶어 임신 준비부터 출산과 산후까지 맡는 미국의 산과 진료소로, 평소 진찰은 자체 클리닉에서 하고 분만은 제휴한 병원에서 하며 진료비는 환자에게 직접 받지 않고 건강보험에 청구한다.\", \"site\": \"https://oulahealth.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"45\", \"section\": 16, \"headline\": \"산과 영역의 소비자 브랜드가 병원 그룹 novant health와 함께 샬럿에 클리닉을 열고 남동부로 더 확장하겠다고 밝힌 소식으로 짧게 다뤄졌다.\"}], \"card\": {\"problem\": \"미국에서 임신부는 의료 개입이 많은 병원 진료와 시간을 충분히 쓰는 조산사 진료 가운데 하나를 처음부터 골라야 했다. 그래서 출산 경험에 실망하는 사람이 많고, 진찰이 짧고 자기 뜻이 반영되지 않는다는 불만이 쌓여 있다.\", \"solution\": \"조산사와 산부인과 의사, 진료 안내 담당자를 한 팀으로 두고 임신 전부터 산후까지 맡는다. 평소 진찰은 자체 클리닉에서 조산사가 길게 보고, 분만은 제휴한 대형 병원에서 하되 조산사와 의사가 함께 병원에 들어간다.\", \"price\": \"진료비를 건강보험에 청구하므로 환자는 자기 보험의 본인부담금만 낸다. 보험 밖 현금 상품은 산후 모임 circles 하나이며 1회 95달러다.\", \"tags\": [\"산과 진료\", \"조산사\", \"병원 제휴\", \"보험 청구\", \"메디케이드\"], \"headline_traction\": \"2026년 6월에 병원 그룹 novant health와 손잡고 샬럿에 다섯 번째 클리닉을 열어 남동부에 처음 들어갔고, 누적 분만 3,000건을 넘겼다고 밝혔다.\", \"watch\": \"제왕절개 25% 감소 같은 성과 수치는 모두 회사가 스스로 내놓은 값이고, 저위험 임신을 주로 받는 진료소라 일반 병원 평균과 그대로 견주기 어렵다.\"}, \"problem\": \"미국에서 임신부는 진료 방식을 임신 초기에 하나 골라야 하고, 그 선택이 출산까지 이어진다. 산부인과 의사가 이끄는 진료를 택하면 응급 상황에 대비한 수단은 갖추지만 진찰 시간이 짧고 의료 개입이 늘어나기 쉬우며, 조산원이나 가정 분만을 택하면 시간을 충분히 쓰는 대신 수술이 필요한 상황에 대응할 수단이 줄어든다. 동네 산부인과에 다니다가 같은 의사에게 분만을 맡기면 되는 한국과 달리, 미국에서는 진료하는 곳과 분만하는 병원이 갈리는 일이 흔하고 두 곳이 각각 보험 네트워크에 들어 있는지를 환자가 직접 확인해야 한다. 불만은 수치로도 드러난다. oula가 2025년에 12개 대도시권 여성 1,100명을 조사한 결과, 최근에 출산한 여성의 24%가 진료 과정에서 무시당하거나 지레 짐작을 당하거나 차별을 받았다고 답했고, 산부인과 의사만 만난 비율은 2023년 75%에서 2025년 66%로 떨어진 반면 의사와 조산사를 함께 본 비율은 16%에서 27%로 올랐다. 병원 쪽에도 사정이 있다. oula가 인용한 commonwealth fund 자료에 따르면 미국 산모 사망률은 2021년에 40% 늘었고 흑인 산모는 그 2.6배에 이르며, 병원은 산부인과 의사 부족과 소진 문제를 안은 채로 분만실을 24시간 채워야 한다.\", \"solution\": \"환자는 임신을 확인한 직후부터 oula 클리닉에 다닌다. 평소 진찰은 조산사가 맡고, 산부인과 의사는 뒤에서 모든 임신 경과를 지켜보다가 고위험 요소가 확인되거나 환자가 원하면 직접 진료한다. 여기에 진료 안내 담당자(care navigator)가 붙어 예약과 보험 확인, 진료 사이에 생기는 질문을 맡는다. 임신 8주에서 13주 사이에 첫 진찰과 첫 초음파를 하고, 30주에 출산 방식을 정하는 워크숍을 하며, 36주부터는 매주 진찰을 받는다. 분만은 oula 클리닉이 아니라 제휴한 병원에서 하고, 조산사와 산부인과 의사가 24시간 병원에 있다가 제왕절개가 필요하면 산부인과 의사가 수술과 수술 후 회진을 맡는다. 분만 병원은 지역마다 정해져 있어서 뉴욕은 mount sinai west, 코네티컷은 stamford hospital, 샬럿은 novant health presbyterian medical center다. 값은 환자에게 직접 받지 않고 건강보험에 청구하며, 상업 보험뿐 아니라 저소득층 대상 공공보험인 메디케이드도 받는다. 환자가 현금으로 사는 상품은 산후 모임 circles 하나이고 1회 95달러다.\", \"features\": [{\"name\": \"조산사 주도 진찰, 의사 공동 관리\", \"detail\": \"클리닉에서 만나는 사람은 대체로 공인 조산사(cnm)다. 산부인과 의사는 환자를 매번 만나지 않더라도 모든 임신 경과를 함께 보며, 고위험 요소가 있으면 의사 진료가 정기적으로 붙는다. 고위험이 아니어도 환자가 원하면 의사를 더 자주 만날 수 있다고 안내한다.\"}, {\"name\": \"진료 안내 담당자\", \"detail\": \"care navigator라고 부르는 담당자가 예약을 잡고 보험 적용 여부를 확인하며 진료와 진료 사이의 질문을 받는다. 임상 인력과 별도로 두는 자리다.\"}, {\"name\": \"제휴 병원 분만\", \"detail\": \"자체 분만 시설을 두지 않고 지역마다 큰 병원 한 곳과 제휴해 그곳에서만 분만한다. 가정 분만은 하지 않는다. 샬럿은 novant health presbyterian medical center이며, 이 병원은 2026년 us news & world report의 산과 우수 병원 명단에 들었다고 보도자료가 밝혔다.\"}, {\"name\": \"oula 포털\", \"detail\": \"예약과 경과 확인, 진료팀과의 연락을 웹 포털에서 한다. 미국 앱스토어와 구글 플레이 어느 쪽에도 oula의 소비자용 산과 앱은 없으며, 이름이 비슷한 oula fitness는 다른 회사의 운동 앱이다.\"}, {\"name\": \"원격 진료와 24시간 지원\", \"detail\": \"대면 진찰에 더해 화상 진료와 원격 모니터링을 쓰고, 24시간 가상 지원과 교육 자료, 전문가가 진행하는 워크숍을 제공한다고 밝힌다.\"}, {\"name\": \"임신 준비 상담\", \"detail\": \"임신을 계획하는 단계에서 병력 검토, 배란 주기 기록법, 유전자 검사 선택지 안내를 받는다. 다만 난임 진단과 치료는 하지 않고 제휴한 난임 병원으로 연결한다.\"}, {\"name\": \"산부인과 일반 진료\", \"detail\": \"연 1회 검진과 자궁경부 세포 검사, 성매개감염 검사, 피임 상담을 한다. 질확대경 검사와 골반 초음파, 유방 촬영, 부인과 수술은 하지 않고 제휴 기관으로 보낸다.\"}, {\"name\": \"유산 진료\", \"detail\": \"유산을 겪은 환자를 위한 진료 항목을 따로 두고 있다.\"}, {\"name\": \"oula circles\", \"detail\": \"출산 예정일이 비슷한 사람들을 묶어 주는 산후 모임이다. 조산사가 진행하는 첫 모임 뒤에 매주 화상으로 만나고, 그 사이에는 whatsapp 단체 대화방으로 계속 연결된다. 1회 95달러이며 보험이 적용되지 않고 fsa와 hsa로 낼 수 있다. oula 환자가 아니어도 가입할 수 있다.\"}, {\"name\": \"병원 그룹 대상 제안\", \"detail\": \"병원에는 oula가 클리닉 개설 비용을 부담하고(회사 표현으로 병원 쪽 자본 투자 0원) 3개월에서 6개월 안에 문을 연다고 제안한다. 병원은 산부인과 의사 부족을 메우고 분만실 24시간 대응을 보강하며, 출산한 병원으로 돌아오는 여성이 74%라는 자료를 근거로 새 환자를 데려온다는 것을 내세운다.\"}], \"differentiator\": \"같은 모델을 하는 회사로는 샌프란시스코 만 지역의 millie가 있다. millie도 조산사가 이끌고 산부인과 의사가 받치는 방식으로 병원 분만까지 맡으며 2026년에 북부 캘리포니아로 확장했으나, 다루는 지역과 규모가 oula보다 작다. 원격 진료 쪽의 여성 건강 회사와는 성격이 다르다. maven clinic은 고용주가 값을 치르는 복지 상품으로 임신 기간의 상담과 안내를 하지만 직접 아기를 받지 않고, midi health는 폐경 시기를 다룬다. oula는 실제로 분만까지 하는 진료 기관이라는 점에서 이들과 갈린다. 병원을 상대하는 태도도 다르다. 병원과 환자를 놓고 겨루는 대신 병원 그룹과 이름을 나란히 걸고 들어가며, 클리닉 개설 비용을 oula가 부담하고 분만은 그 병원에서 하도록 묶어 병원이 잃을 것이 없게 만들었다. 샬럿에서는 진료소 이름 자체가 oula with novant health이고, 코네티컷에서는 oula provided by stamford health다.\", \"team\": [{\"name\": \"adrianne nickerson\", \"role\": \"공동창업자, ceo\", \"background\": \"암 환자의 진료 경험을 다루는 원격 관리 회사 robin care를 공동창업했다. 하버드에서 글로벌 헬스 석사를 받았고 학위 연구 주제는 여성 건강 진료 접근을 가로막는 요인이었다. 2019년 10월에 oula를 세웠으며, 첫 클리닉을 준비하던 시기에 본인이 임신 중이었다.\"}, {\"name\": \"elaine purcell\", \"role\": \"공동창업자, coo\", \"background\": \"deloitte에서 대형 병원 그룹과 보험사를 상대로 컨설팅을 했고, 1차 진료 회사인 privia health와 caremore health의 경영진으로 일했다. 다만 2026년 9월 현재 oula 리더십 화면에는 이름이 올라 있지 않다.\"}, {\"name\": \"dr. ila dayananda, md, mph\", \"role\": \"최고임상책임자 겸 산부인과 의사\", \"background\": \"oula 리더십 화면에서 직함을 확인했다. 이전 경력은 공개 자료에서 확인하지 못했다.\"}, {\"name\": \"joanne schneider\", \"role\": \"최고경험책임자\", \"background\": \"oula circles 소개 화면에서 직함을 확인했다. 이전 경력은 확인 가능한 출처를 찾지 못했다.\"}], \"traction\": [{\"type\": \"partnership\", \"detail\": \"병원 그룹 novant health와 제휴해 샬럿 cotswold 지역에 3,200제곱피트 규모 클리닉을 연다고 발표했다. 분만은 novant health presbyterian medical center에서 한다. oula의 남동부 첫 진출이자 세 번째 시장이며, 샬럿 안에서 클리닉을 더 늘리고 남동부 다른 도시로 넓히겠다고 밝혔다.\", \"when\": \"2026-06\", \"source\": \"oula 보도자료(pr newswire/prweb), novant health 뉴스룸\"}, {\"type\": \"customers\", \"detail\": \"2021년 브루클린 첫 클리닉을 연 뒤로 분만 3,000건을 넘겼고 클리닉이 다섯 곳으로 늘었다고 밝혔다. 브루클린, 맨해튼 다운타운, 어퍼웨스트, 코네티컷 노워크, 샬럿이다.\", \"when\": \"2026-06\", \"source\": \"oula 보도자료, oulahealth.com 첫 화면\"}, {\"type\": \"funding\", \"detail\": \"시리즈 b로 2,800만 달러를 조달했다. revolution ventures와 maverick ventures가 공동 주도했고 gv, female founders fund, 8vc, alumni ventures, great oaks가 참여했다. 이 라운드까지 누적 조달액은 약 5,000만 달러다.\", \"when\": \"2024-02\", \"source\": \"femtech insider, pr newswire\"}, {\"type\": \"partnership\", \"detail\": \"뉴욕에서는 mount sinai west와 제휴해 그 병원에서 분만한다. oula는 이 병원에서 4년 동안 3,000건이 넘는 분만을 했고 뉴욕과 뉴저지 175개 우편번호 지역의 환자를 받았다고 자사 화면에 적고 있다.\", \"when\": \"\", \"source\": \"oulahealth.com 병원 그룹 안내 화면, mount sinai 홈페이지\"}, {\"type\": \"partnership\", \"detail\": \"코네티컷에서는 stamford health와 제휴해 oula provided by stamford health라는 이름으로 노워크 클리닉을 운영하고 stamford hospital에서 분만한다.\", \"when\": \"\", \"source\": \"oulahealth.com faq 화면\"}, {\"type\": \"customers\", \"detail\": \"환자 다섯 명 가운데 한 명이 메디케이드 가입자라고 공동창업자가 밝혔다. 저소득층 공공보험을 받는 산과 진료소라는 점을 이 회사가 내세우는 대목이다.\", \"when\": \"2024-02\", \"source\": \"femtech insider\"}], \"caveats\": \"성과 수치는 거의 전부 회사가 스스로 내놓은 값이다. 제왕절개 필요성 25% 감소, vbac(제왕절개 뒤 자연분만) 성공률 85%, 조산 51% 감소, 순추천지수 90점대, 구글 평점 4.5점이 모두 여기에 해당하며 제삼자가 감사하거나 동료 심사를 거친 논문으로 확인된 값이 아니다. 비교 대상도 짚어야 한다. 이 수치들은 뉴욕시 평균이나 미국 전국 평균과 견준 값인데, oula는 저위험 임신을 주로 받는 진료소다. 창업자를 인터뷰한 2022년 기사도 이 회사를 저위험 임신부를 상대하는 곳으로 소개한다. 고위험 임신부를 함께 받는 일반 병원의 평균과 그대로 견주면 차이의 일부는 환자 구성에서 나온 것일 수 있다. 2025년 조사 수치도 마찬가지로 oula가 직접 설계하고 실시한 조사이며 독립 기관 조사가 아니다. novant health 제휴의 조건도 공개되지 않았다. 보도자료는 어느 쪽이 얼마를 부담하고 수익을 어떻게 나누는지 밝히지 않았고, 뉴스레터 원문도 파트너십이 흥미롭다고만 전했다. 환자 쪽 불만도 있다. 파크슬로프 부모 모임에 올라온 2024년 출산 설문 후기 가운데는 초음파를 맨해튼에서만 해서 진찰과 초음파를 같은 날 한자리에서 받을 수 없었다는 것, 포털에서 일반 진찰 외의 예약을 하려면 담당자가 권한을 따로 열어 줘야 하는데 그 처리가 느려 검사를 놓칠 뻔했다는 것이 있다. 진료 범위의 한계도 분명하다. 가정 분만을 하지 않고, 난임 진단과 치료를 하지 않으며, 질확대경 검사와 골반 초음파, 유방 촬영, 부인과 수술도 하지 않는다. 샬럿 클리닉은 2026년 9월 현재 2027년 1월 이후 출산 예정자를 받고 있고, 다른 곳에서 진료를 시작한 사람은 임신 35주 6일까지만 옮겨 올 수 있다. 마지막으로 보험 적용이 곧 무료를 뜻하지 않는다. 자기부담금을 채우기 전까지는 환자가 진료비를 내고, 실제 부담액은 각자의 보험 조건에 따라 달라진다.\", \"for_us\": \"이 회사가 하는 일 자체는 미국 의사와 조산사 면허, 병원 제휴, 보험 계약이 있어야 하므로 3개월 안에 따라 할 수 없다. 우리가 가져올 것은 이 회사가 확인한 수요의 위치다. oula가 자체 조사에서 읽어 낸 것은 결과가 나빠서가 아니라 경험이 나빠서 사람들이 다른 진료를 찾아 나선다는 사실이다. 최근 출산한 여성의 24%가 진료 중에 무시당했다고 답했고, 산부인과 의사만 만나는 비율은 2년 사이 9%포인트 떨어졌다. 눈여겨볼 대목은 세 가지다. 첫째, 환자가 가장 크게 값을 느끼는 자리가 임상이 아니라 그 옆이다. 예약과 보험 확인, 진료 사이의 질문을 맡는 진료 안내 담당자를 따로 두었고, 후기에서 불만이 터진 자리도 진료 자체가 아니라 예약 권한이 열리지 않는 포털이었다. 소프트웨어가 손댈 수 있는 자리가 바로 여기다. 둘째, oula에는 소비자용 모바일 앱이 없다. 진료와 진료 사이의 몇 주를 채우는 자리를 이 회사가 비워 두고 있다. 셋째, circles가 보여 준 것이 가장 직접적이다. 출산 예정일이 비슷한 사람끼리 묶고, 조산사가 미리 써 둔 대화 주제를 매주 던지고, 그 사이는 단체 대화방으로 잇는 것만으로 1회 95달러를 현금으로 받아 냈다. 진료 없이도 성립하고, oula 환자가 아니어도 가입할 수 있다. 우리 앱이 이미 걸음 수와 수면 자료를 받고 있으므로, 예정일이나 출산일을 기준으로 사람을 묶고 주마다 이야깃거리를 주는 기능은 소프트웨어만으로 3개월 안에 만들 수 있고 치료를 권하지 않으므로 규제 허가가 필요 없다. 다만 우리 앱의 미국 사용자 가운데 임신 중이거나 산후인 사람이 얼마나 되는지 먼저 확인해야 하고, 임신 관련 정보는 잘못 다루면 위험이 큰 영역이라 임상 조언에 해당하는 말은 넣지 않는 선을 처음부터 그어야 한다.\", \"screenshots\": [{\"file\": \"oula_home.png\", \"caption\": \"첫 화면이다. 분만 3,000건, 보험 30종 이상, 구글 평점 4.5점을 앞에 내걸고 산부인과 의사와 조산사, 진료 안내 담당자 세 역할을 나란히 보여 준다.\", \"from\": \"https://oulahealth.com/\"}, {\"file\": \"oula_charlotte.png\", \"caption\": \"샬럿 클리닉 안내 화면이다. 이름을 oula with novant health로 걸고, 분만은 novant health presbyterian medical center에서 한다고 적어 두었다.\", \"from\": \"https://oulahealth.com/locations/cotswold-clinic/\"}, {\"file\": \"oula_health_systems.png\", \"caption\": \"병원 그룹을 상대로 만든 화면이다. 클리닉 개설 비용을 oula가 부담하고 3개월에서 6개월 안에 문을 연다는 조건, 그리고 뉴욕 사례의 성과 수치를 제시한다.\", \"from\": \"https://oulahealth.com/health-systems/\"}, {\"file\": \"oula_circles.png\", \"caption\": \"산후 모임 circles 안내 화면이다. 1회 95달러 현금 결제이며 oula 환자가 아니어도 가입할 수 있다고 밝힌 유일한 보험 밖 상품이다.\", \"from\": \"https://oulahealth.com/circles/\"}], \"sources\": [{\"title\": \"oula 홈페이지\", \"url\": \"https://oulahealth.com/\", \"note\": \"분만 3,000건, 보험 30종 이상, 구글 평점 4.5점, 제왕절개 25% 감소와 vbac 성공률 85%, 조산 51% 감소 같은 자사 표기 수치와 세 역할 구성을 확인했다.\"}, {\"title\": \"oula expands to charlotte with novant health partnership (oula 보도자료)\", \"url\": \"https://www.prweb.com/releases/oula-expands-to-charlotte-with-novant-health-partnership-302796133.html\", \"note\": \"2026년 6월 10일 발표 내용, 샬럿 클리닉 3,200제곱피트, 분만 병원, 누적 분만 3,000건과 다섯 곳 운영, 남동부 확장 계획, 2019년 창업 사실을 확인했다.\"}, {\"title\": \"novant health 뉴스룸의 같은 발표\", \"url\": \"https://www.novanthealth.org/newsroom/releases-20260611\", \"note\": \"병원 그룹 쪽에도 같은 발표가 올라와 있음을 검색 결과로 확인했다. 페이지 본문은 차단되어 직접 열지 못했고 내용은 같은 보도자료로 확인했다.\"}, {\"title\": \"obgyn & midwife care in charlotte north carolina (샬럿 클리닉 안내)\", \"url\": \"https://oulahealth.com/locations/cotswold-clinic/\", \"note\": \"주소와 진료 시간, 샬럿 진료팀 구성, novant health presbyterian medical center 분만을 확인했다.\"}, {\"title\": \"oula faq\", \"url\": \"https://oulahealth.com/faq/\", \"note\": \"조산사와 의사가 함께 일하는 방식, 병원에서의 역할 분담, 지역별 제휴 병원, 노스캐롤라이나와 코네티컷의 계약 보험사 명단, 메디케이드 수용, 진료 범위 제한, 전원 가능 주수를 확인했다.\"}, {\"title\": \"health systems (병원 그룹 대상 안내)\", \"url\": \"https://oulahealth.com/health-systems/\", \"note\": \"병원에 제시하는 조건(개설 비용 부담, 3~6개월 개설), 뉴욕 사례 수치, 인용한 commonwealth fund와 advisory board 자료를 확인했다.\"}, {\"title\": \"oula circles\", \"url\": \"https://oulahealth.com/circles/\", \"note\": \"1회 95달러 요금, 보험 미적용과 fsa/hsa 결제, whatsapp 단체방과 주간 화상 모임 구성, 비환자 가입 가능을 확인했다.\"}, {\"title\": \"the experience gap (2025 maternity experience survey)\", \"url\": \"https://oulahealth.com/2025report/\", \"note\": \"12개 대도시권 여성 1,100명 조사 설계와 24% 무시·차별 경험, 산부인과 단독 진료 75%에서 66%로 하락, 협업 진료 16%에서 27%로 증가를 확인했다.\"}, {\"title\": \"pregnancy care\", \"url\": \"https://oulahealth.com/pregnancy-care\", \"note\": \"임신 8~13주 첫 진찰과 초음파, 30주 출산 방식 워크숍, 36주 주간 진찰 같은 진료 일정을 확인했다.\"}, {\"title\": \"oula leadership\", \"url\": \"https://oulahealth.com/leadership/\", \"note\": \"현재 경영진 명단과 직함을 확인했다. 공동창업자 elaine purcell의 이름이 없다는 점도 여기서 확인했다.\"}, {\"title\": \"oula secures $28m in series b funding (femtech insider)\", \"url\": \"https://femtechinsider.com/oula-series-b/\", \"note\": \"시리즈 b 금액과 투자사 명단, 누적 약 5,000만 달러, 환자 다섯 명 중 한 명이 메디케이드, 2024년 시점의 성과 수치를 확인했다.\"}, {\"title\": \"leading women's health: elaine purcell, oula co-founder & coo (chasm partners)\", \"url\": \"https://chasmpartners.com/insights/womens-health-elaine-purcell/\", \"note\": \"공동창업자 elaine purcell의 경력(deloitte, privia health, caremore health)과 전액 보험 기반 모델이라는 발언을 확인했다.\"}, {\"title\": \"how healthcare revolutionaries think: 10 questions with adrianne nickerson (4sight health)\", \"url\": \"https://www.4sighthealth.com/how-healthcare-revolutionaries-think-10-questions-with-adrianne-nickerson/\", \"note\": \"ceo adrianne nickerson의 경력(robin care 공동창업, 하버드 글로벌 헬스 석사)과 이 회사가 저위험 임신부를 상대한다는 서술을 확인했다.\"}, {\"title\": \"oula (female founders fund 포트폴리오)\", \"url\": \"https://femalefoundersfund.com/portfolio/oula/\", \"note\": \"두 공동창업자가 adrianne nickerson과 elaine purcell이라는 사실을 투자사 쪽 자료로 확인했다.\"}, {\"title\": \"oula 후기 (park slope parents)\", \"url\": \"https://www.parkslopeparents.com/reviews/oula\", \"note\": \"초음파를 맨해튼에서만 받을 수 있다는 점, 포털 예약 권한 처리가 느려 검사를 놓칠 뻔했다는 점 등 환자 쪽 불만을 확인했다.\"}, {\"title\": \"millie 홈페이지\", \"url\": \"https://www.millieclinic.com/\", \"note\": \"같은 모델을 하는 경쟁사가 있고 다루는 지역이 샌프란시스코 만 지역이라는 점을 확인했다.\"}, {\"title\": \"미국 앱스토어 검색 api\", \"url\": \"https://itunes.apple.com/search?term=oula&entity=software&country=us\", \"note\": \"oula의 소비자용 산과 앱이 ios에 없다는 것을 확인했다. 검색되는 oula fitness는 다른 회사의 운동 앱이다.\"}, {\"title\": \"구글 플레이 검색 결과\", \"url\": \"https://play.google.com/store/search?q=oula%20maternity&c=apps&hl=en_us&gl=us\", \"note\": \"안드로이드에도 oula의 소비자용 앱이 없다는 것을 확인했다.\"}]}"},{"slug":"oura","name":"Oura","one_liner":"손가락에 끼는 반지가 자는 동안 심박과 체온과 호흡을 재고, 그 값을 읽어 주는 앱은 반지값과 별개로 월 구독료를 받는 회사다.","sells_to":"mixed","seen_in":[{"issue":"43","section":7,"headline":"상장 서류를 비공개로 제출한 그 주에 혈압 신호와 야간 호흡, GLP-1 추적을 한꺼번에 붙였고, 필자는 그 가운데 Counsel Health와의 제휴를 가장 눈여겨보면서 Whoop에 이어 기기 회사가 진료를 앱 안으로 들이는 흐름이 생겼다고 짚었다."}],"card":{"problem":"미국에서는 병원에 한 번 가는 데 드는 돈과 시간이 커서, 몸에 변화가 생겨도 그것이 진료를 받을 일인지 판단할 근거를 개인이 스스로 갖기 어렵다.","solution":"반지가 자는 동안 심박과 체온과 호흡을 재서 수면 점수와 회복 점수로 바꿔 주고, 여기에 심혈관 부담 신호, GLP-1 투약 기록, 앱 안에서 바로 의료진에게 물어보는 창구를 얹었다.","price":"반지는 349달러부터 시작하며, 앱의 기능을 제대로 쓰려면 반지값과 별도로 월 5.99달러 또는 연 69.99달러를 내야 한다. 첫 달은 무료다.","tags":["반지형 웨어러블","수면 추적","월 구독","GLP-1 기록","앱 내 진료"],"headline_traction":"2026년 9월 3일에 상장 서류를 공개 제출했다. 서류에 적힌 2026년 6월까지 9개월 매출은 12억 달러이고 유료 구독 회원은 500만 명이며, 160억 달러가 넘는 기업 가치로 30억 달러를 모으려 한다.","watch":"혈압 기능은 혈압 수치를 재는 것이 아니라 변화 패턴을 알려 주는 웰니스 기능이고, 수면 측정 정확도를 문제 삼은 집단소송이 상장 서류에 위험 요인으로 적혀 있다."},"screenshots":[{"file":"oura_home.png","caption":"Oura 첫 화면이다. 반지 하나로 수면과 활동, 스트레스, 심장 건강을 본다는 것을 전면에 내세운다.","from":"https://ouraring.com/"},{"file":"oura_membership.png","caption":"구독 안내 화면이다. 반지값과 별도로 구독료를 받는다는 것이 여기서 드러난다. 접속 위치를 따라 원화로 표시됐으며 미국 기준 값은 월 5.99달러 또는 연 69.99달러다.","from":"https://ouraring.com/membership"},{"file":"oura_counsel.png","caption":"Counsel Health 제휴 발표 화면이다. 앱 안에서 의료 AI와 면허 의사에게 닿게 한다는 내용이며, 뉴스레터가 가장 눈여겨본 대목이다.","from":"https://ouraring.com/blog/counsel-integration-oura-app/"}],"q":"{\"slug\": \"oura\", \"name\": \"oura\", \"one_liner\": \"손가락에 끼는 반지가 자는 동안 심박과 체온과 호흡을 재고, 그 값을 읽어 주는 앱은 반지값과 별개로 월 구독료를 받는 회사다.\", \"site\": \"https://ouraring.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"43\", \"section\": 7, \"headline\": \"상장 서류를 비공개로 제출한 그 주에 혈압 신호와 야간 호흡, glp-1 추적을 한꺼번에 붙였고, 필자는 그 가운데 counsel health와의 제휴를 가장 눈여겨보면서 whoop에 이어 기기 회사가 진료를 앱 안으로 들이는 흐름이 생겼다고 짚었다.\"}], \"card\": {\"problem\": \"미국에서는 병원에 한 번 가는 데 드는 돈과 시간이 커서, 몸에 변화가 생겨도 그것이 진료를 받을 일인지 판단할 근거를 개인이 스스로 갖기 어렵다.\", \"solution\": \"반지가 자는 동안 심박과 체온과 호흡을 재서 수면 점수와 회복 점수로 바꿔 주고, 여기에 심혈관 부담 신호, glp-1 투약 기록, 앱 안에서 바로 의료진에게 물어보는 창구를 얹었다.\", \"price\": \"반지는 349달러부터 시작하며, 앱의 기능을 제대로 쓰려면 반지값과 별도로 월 5.99달러 또는 연 69.99달러를 내야 한다. 첫 달은 무료다.\", \"tags\": [\"반지형 웨어러블\", \"수면 추적\", \"월 구독\", \"glp-1 기록\", \"앱 내 진료\"], \"headline_traction\": \"2026년 9월 3일에 상장 서류를 공개 제출했다. 서류에 적힌 2026년 6월까지 9개월 매출은 12억 달러이고 유료 구독 회원은 500만 명이며, 160억 달러가 넘는 기업 가치로 30억 달러를 모으려 한다.\", \"watch\": \"혈압 기능은 혈압 수치를 재는 것이 아니라 변화 패턴을 알려 주는 웰니스 기능이고, 수면 측정 정확도를 문제 삼은 집단소송이 상장 서류에 위험 요인으로 적혀 있다.\"}, \"problem\": \"한국에서는 몸이 이상하면 동네 의원에 가서 몇천 원 내고 물어보면 된다. 미국은 진료 한 번에 드는 돈과 예약 대기가 커서, 그 문턱을 넘기 전에 '지금 내 몸이 정상인가'를 스스로 판단해야 하는 구간이 길다. 그런데 개인이 자기 몸에 대해 갖고 있는 자료는 1년에 한 번 받는 검진 결과 한 장뿐이고, 그 사이 364일은 비어 있다. 여기에 최근 몇 년 사이 glp-1 계열 비만 치료제를 쓰는 사람이 급격히 늘면서, 약을 언제 맞았는지, 부작용이 언제 났는지, 몸무게와 수면이 어떻게 변했는지를 따로따로 다른 앱에 적는 문제가 새로 생겼다. oura는 이 빈 구간을 매일 밤 자동으로 채우는 자리를 노린다.\", \"solution\": \"사용자는 티타늄 반지를 사서 손가락에 끼고 잔다. 반지 안쪽의 광학 센서와 체온 센서가 밤새 심박과 심박 변이도, 피부 온도, 호흡을 재고, 아침에 앱을 열면 그 값이 수면 점수, 준비도 점수, 활동 점수라는 세 숫자로 바뀌어 있다. 반지값은 oura ring 4 기준으로 마감재에 따라 349달러에서 499달러이며, 앱의 기능 대부분은 구독을 해야 열린다. 구독료는 미국 기준 월 5.99달러 또는 연 69.99달러이고 첫 달은 무료다. 2026년 5월 28일 발표에서 회사는 여기에 세 가지를 더 붙였는데, 심혈관 부담이 의심되는 패턴을 알려 주는 blood pressure signals, 수면 중 호흡 흐트러짐을 30일 단위로 보여 주는 nighttime breathing, 그리고 glp-1 투약 일정과 부작용과 체중을 한 화면에 모으는 glp-1 insights다. 2026년 6월 16일부터는 앱 안에서 'connect to care'를 누르거나 ai 비서인 oura advisor와 대화하다가 counsel health의 의료 ai로 넘어갈 수 있게 했고, 여기서 더 나아가 면허 의사의 진료로 이어지면 그 비용은 구독료와 별개로 따로 낸다.\", \"features\": [{\"name\": \"반지형 야간 측정\", \"detail\": \"손가락에 끼는 반지가 심박, 심박 변이도, 피부 온도, 호흡을 잠자는 동안 잰다. 회사는 50가지가 넘는 건강 지표를 본다고 밝히고 있다.\"}, {\"name\": \"세 가지 점수\", \"detail\": \"측정값을 수면 점수, 준비도 점수, 활동 점수라는 세 숫자로 바꿔서 아침마다 보여 준다. 숫자를 읽는 데 의학 지식이 필요하지 않게 만든 것이 핵심이다.\"}, {\"name\": \"health radar\", \"detail\": \"심혈관과 호흡 신호를 배경에서 계속 훑다가 눈여겨볼 만한 패턴이 나올 때만 알려 주는 층이다. 기존의 symptom radar에 blood pressure signals와 nighttime breathing이 더해졌다. 2026년 7월까지 미국, 아랍에미리트, 인도의 gen3 이상 사용자에게 순차 적용됐다.\"}, {\"name\": \"glp-1 insights\", \"detail\": \"비만 치료제 투약 일정과 복용 알림, 메스꺼움이나 피로 같은 부작용, 체중 변화를 앱 한 곳에 적게 하고 수면과 활동, 회복 지표와 나란히 놓고 보여 준다. 2026년 6월부터 미국, 아랍에미리트, 인도에서 순차 적용됐다.\"}, {\"name\": \"counsel health 연동\", \"detail\": \"앱 안에서 의료 ai와 대화하고 필요하면 면허 의사에게 넘어가는 창구다. 의료 ai 대화는 구독료에 포함되고 의사 진료와 치료는 별도 비용이다. 2026년 6월 16일부터 미국 43개 주에서 열렸으며, 아칸소, 워싱턴 d.c., 캔자스, 미시시피, 로드아일랜드, 워싱턴, 웨스트버지니아, 위스콘신은 빠졌다.\"}, {\"name\": \"oura advisor\", \"detail\": \"구독에 포함된 ai 건강 비서다. 사용자의 측정값을 근거로 대화하며, counsel health로 넘어가는 입구 노릇도 한다.\"}, {\"name\": \"health panels와 검사지 업로드\", \"detail\": \"혈액 검사를 붙여 파는 상품이며 회사는 99달러로 안내한다. 다른 곳에서 받은 검사 결과지를 pdf로 올려 앱 안에 함께 두는 기능도 2026년 5월에 추가됐다.\"}, {\"name\": \"live activity tracking\", \"detail\": \"앱에서 운동을 시작하면 속도와 거리, 심박을 실시간으로 보여 주고 잠금화면 위젯에도 띄운다. 2026년 6월 4일부터 전 세계에 적용됐다.\"}, {\"name\": \"fsa와 hsa 결제\", \"detail\": \"미국의 세제 혜택 의료비 계좌로 반지와 구독, 혈액 검사를 결제할 수 있다. 소비자가 실제로 내는 부담을 낮추는 장치다.\"}, {\"name\": \"기업과 기관 대상 판매\", \"detail\": \"고용주, 보험사, 병원, 연구기관, 군과 소방 조직에 반지와 앱, 관리자용 분석 화면을 묶어서 판다. 소개 페이지에 eli lilly, amazon, mayo clinic, quest diagnostics, google, american express, maven clinic, essence healthcare의 이름이 올라 있으며 값은 공개하지 않는다.\"}], \"differentiator\": \"whoop은 기기값을 받지 않고 구독만 받는 대신 손목에 차야 하고, apple watch와 samsung galaxy ring은 기기를 사면 구독 없이 쓸 수 있다. oura는 반지를 349달러에 팔면서 구독료를 또 받는 쪽인데, 이 구조를 유지한 채 구독 회원 500만 명과 12개월 유지율 85퍼센트를 상장 서류에 적어 냈다는 점이 다르다. 기능만 보면 수면과 회복을 재는 일 자체는 위 회사들과 크게 다르지 않고, 앱 안에 임상의 접근을 넣은 것도 whoop이 먼저 했다. 실제로 갈리는 대목은 특허 쪽인데, oura는 2025년에 미국 국제무역위원회에서 ultrahuman과 ringconn을 상대로 이겨서 두 회사 반지의 미국 수입과 판매를 막았고 ringconn과는 별도로 로열티를 받는 라이선스 계약을 맺었다.\", \"team\": [{\"name\": \"tom hale\", \"role\": \"최고경영자\", \"background\": \"설문 회사 momentive 사장으로 2018년 상장을 이끌었고, 그 전에는 homeaway 최고운영책임자와 linden lab 최고제품책임자를 지냈으며 macromedia와 adobe에서도 임원을 지냈다.\"}, {\"name\": \"sean brecker\", \"role\": \"최고재무책임자\", \"background\": \"명상 앱 headspace에서 10년 가까이 일하며 최고경영자와 최고재무책임자를 지냈고 ginger와의 30억 달러 규모 합병을 설계했다. 그 전에는 j.p. morgan, lehman brothers, citigroup에서 15년간 트레이더로 일했다.\"}, {\"name\": \"ricky bloomfield\", \"role\": \"최고의료책임자\", \"background\": \"apple에서 임상 정보 부문을 이끌었고 duke university health system에서 모바일 기술 전략 디렉터를 지냈으며, duke와 stanford 아동병원에서 소아과 입원전담의로 진료했다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"시리즈 d로 2억 달러를 받았고 기업 가치는 52억 달러가 됐다. fidelity와 dexcom이 투자자로 들어왔다.\", \"when\": \"2024-12\", \"source\": \"oura 뉴스룸 보도자료, techcrunch\"}, {\"type\": \"revenue\", \"detail\": \"누적 반지 판매 550만 개를 넘겼고 2년 연속 매출이 두 배가 됐다고 밝혔다.\", \"when\": \"2025-09\", \"source\": \"oura 뉴스룸 보도자료. 회사가 스스로 낸 수치다.\"}, {\"type\": \"regulatory\", \"detail\": \"미국 국제무역위원회가 ultrahuman과 ringconn의 스마트 반지에 대해 미국 수입과 판매를 막는 명령을 확정했다. oura가 제기한 특허 침해 사건에서 이긴 결과다.\", \"when\": \"2025-10\", \"source\": \"oura 블로그, oura 뉴스룸\"}, {\"type\": \"funding\", \"detail\": \"fidelity가 주도한 라운드로 9억 달러가 넘는 돈을 받았다. 보도에 따르면 기업 가치는 110억 달러였다.\", \"when\": \"2025-10\", \"source\": \"oura 뉴스룸 보도자료, techcrunch\"}, {\"type\": \"customers\", \"detail\": \"유료 구독 회원이 이번 분기에 500만 명을 넘길 예정이며 지난 2년 동안 4배 넘게 늘었다고 밝혔다. cnbc disruptor 50에 4년 연속 이름을 올렸다.\", \"when\": \"2026-05\", \"source\": \"oura 뉴스룸 보도자료. 회원 수는 회사가 스스로 낸 수치다.\"}, {\"type\": \"regulatory\", \"detail\": \"상장 신고 서류인 s-1 초안을 미국 증권거래위원회에 비공개로 제출했다고 발표했다. 뉴스레터 43회차가 다룬 대목이 이것이다.\", \"when\": \"2026-05\", \"source\": \"oura 뉴스룸 보도자료(2026년 5월 21일)\"}, {\"type\": \"partnership\", \"detail\": \"counsel health와 제휴해 앱 안에서 의료 ai 대화와 면허 의사 진료에 닿는 통로를 열었다. 미국 43개 주에서 쓸 수 있다.\", \"when\": \"2026-06\", \"source\": \"oura 블로그(2026년 6월 8일 게시, 6월 16일 적용 시작)\"}, {\"type\": \"funding\", \"detail\": \"제약사 eli lilly가 지분 투자를 했다고 발표했다. 금액과 기업 가치는 공개하지 않았으며, 회사는 이미 10만 명이 넘는 회원이 앱에 glp-1 사용을 기록했다고 밝혔다.\", \"when\": \"2026-07\", \"source\": \"oura 블로그(2026년 7월 15일). 금액 비공개다.\"}, {\"type\": \"funding\", \"detail\": \"상장 서류를 공개 제출했다. 2026년 6월까지 9개월 매출이 12억 달러로 전년 같은 기간 6억 9,700만 달러에서 늘었고, 회사는 2026년 연간 매출을 약 20억 달러로 내다봤다. 유료 구독 회원 500만 명, 최근 1년 반지 판매 360만 개, 12개월 구독 유지율 85퍼센트가 적혀 있다. 160억 달러가 넘는 기업 가치로 30억 달러를 모으는 것이 목표다.\", \"when\": \"2026-09\", \"source\": \"techcrunch(2026년 9월 3일)가 전한 s-1 내용\"}], \"caveats\": \"매출과 회원 수의 출처를 나눠서 볼 필요가 있다. 550만 개 판매와 매출 2배 성장, 회원 500만 명은 회사가 보도자료로 낸 수치이고 제삼자가 검증한 것이 아니다. 반면 2026년 9월 상장 서류에 실린 9개월 매출 12억 달러와 유지율 85퍼센트는 증권 당국에 내는 문서에 적힌 숫자여서 성격이 다르다. 기능 이름도 그대로 믿으면 안 된다. blood pressure signals는 혈압 수치를 재는 기능이 아니라 심혈관 부담이 의심되는 변화 패턴을 알려 주는 웰니스 기능이며, 회사는 이것을 의료기기로 소개하지 않고 임신 중인 회원에게는 자동으로 꺼 둔다. 뉴스레터가 '혈압 측정'이라고 옮긴 대목이 여기에 해당하므로 그대로 인용하면 과장이 된다. 마지막으로 상장 서류에는 수면 측정 정확도를 두고 소비자를 오도했다는 집단소송이 위험 요인으로 적혀 있는데, 소장은 이 반지의 수면 단계 판정이 ai 추정값에 기대고 있다고 주장한다.\", \"for_us\": \"이번에 oura가 붙인 것 가운데 기기가 필요한 것과 필요 없는 것을 갈라 보면 우리가 할 수 있는 자리가 나온다. blood pressure signals와 nighttime breathing은 반지의 광학 센서가 있어야 하므로 3개월 안에 소프트웨어 인력만으로는 불가능하고 애초에 제외해야 한다. 반대로 glp-1 insights는 센서가 아니라 기록과 배치의 문제다. 사용자가 주사 맞은 날과 부작용을 직접 적게 하고, 그것을 우리가 이미 갖고 있는 걸음 수와 체중 변화 옆에 나란히 놓아 투약 전후를 대조해 보여 주는 화면은 앱 안에서 만들 수 있다. oura가 밝힌 대로 이미 10만 명 넘는 회원이 glp-1 사용을 기록했고 제약사가 그 이유로 지분 투자를 했다는 사실이, 이 기록 자체에 값이 붙는다는 근거가 된다. counsel health 연동도 참고할 만한데, 여기서 배울 점은 진료를 붙였다는 사실보다 값을 나눈 방식이다. ai와 대화하는 데까지는 구독료에 포함시켜 문턱을 없애고 사람 의사로 넘어갈 때만 따로 받는데, 무료 구간에서 사용자가 자기 데이터를 들고 질문하게 만드는 이 구조는 우리 앱에도 그대로 옮길 수 있다. 다만 미국 43개 주라는 표현이 말해 주듯 진료는 주별 면허 규제에 걸리므로, 우리가 직접 할 수 있는 것은 진료가 아니라 질문을 받아 데이터를 근거로 답해 주는 창구까지다.\", \"screenshots\": [{\"file\": \"oura_home.png\", \"caption\": \"oura 첫 화면이다. 반지 하나로 수면과 활동, 스트레스, 심장 건강을 본다는 것을 전면에 내세운다.\", \"from\": \"https://ouraring.com/\"}, {\"file\": \"oura_membership.png\", \"caption\": \"구독 안내 화면이다. 반지값과 별도로 구독료를 받는다는 것이 여기서 드러난다. 접속 위치를 따라 원화로 표시됐으며 미국 기준 값은 월 5.99달러 또는 연 69.99달러다.\", \"from\": \"https://ouraring.com/membership\"}, {\"file\": \"oura_counsel.png\", \"caption\": \"counsel health 제휴 발표 화면이다. 앱 안에서 의료 ai와 면허 의사에게 닿게 한다는 내용이며, 뉴스레터가 가장 눈여겨본 대목이다.\", \"from\": \"https://ouraring.com/blog/counsel-integration-oura-app/\"}, {\"file\": \"oura_ios.png\", \"caption\": \"미국 앱스토어의 oura 앱 페이지다. 앱 자체는 무료로 내려받고 별점은 4.9에 평가 수는 29만 건이 넘는다.\", \"from\": \"https://apps.apple.com/us/app/oura/id1043837948\"}], \"sources\": [{\"title\": \"oura 공식 사이트 첫 화면\", \"url\": \"https://ouraring.com/\", \"note\": \"무엇을 파는 회사인지, 어떤 지표를 재는지 확인했다.\"}, {\"title\": \"oura membership 안내\", \"url\": \"https://ouraring.com/membership\", \"note\": \"구독료가 월 5.99달러, 연 69.99달러이고 첫 달이 무료라는 것, 구독하지 않으면 기능이 크게 제한된다는 것을 확인했다.\"}, {\"title\": \"oura 반지 제품 페이지\", \"url\": \"https://ouraring.com/product/rings\", \"note\": \"모델 비교표에서 oura ring 4의 값이 349달러에서 499달러, 세라믹 모델이 499달러임을 확인했다. oura ring 5의 값은 확인하지 못했다.\"}, {\"title\": \"새 소프트웨어 기능 발표\", \"url\": \"https://ouraring.com/blog/new-software-features/\", \"note\": \"2026년 5월 28일 발표다. health radar, glp-1 insights, counsel health, live activity tracking, 검사지 업로드의 내용과 적용 시점, 대상 국가를 확인했다.\"}, {\"title\": \"health radar 소개\", \"url\": \"https://ouraring.com/blog/introducing-health-radar/\", \"note\": \"blood pressure signals가 혈압 수치가 아니라 변화 패턴을 알리는 기능이라는 것, 임신 중에는 자동으로 꺼진다는 것을 확인했다.\"}, {\"title\": \"glp-1 insights 소개\", \"url\": \"https://ouraring.com/blog/glp-1-insights/\", \"note\": \"무엇을 기록하고 무엇을 보여 주는지, 반지가 필요한지, 어느 나라에서 쓸 수 있는지 확인했다.\"}, {\"title\": \"counsel health 제휴 발표\", \"url\": \"https://ouraring.com/blog/counsel-integration-oura-app/\", \"note\": \"2026년 6월 16일부터 미국 43개 주에서 열린다는 것, 의료 ai는 구독에 포함되고 의사 진료는 별도 비용이라는 것을 확인했다.\"}, {\"title\": \"eli lilly 지분 투자 발표\", \"url\": \"https://ouraring.com/blog/lilly-equity-investment/\", \"note\": \"2026년 7월 15일 발표이며 금액은 공개하지 않았다. 10만 명 넘는 회원이 glp-1 사용을 기록했다는 수치를 확인했다.\"}, {\"title\": \"oura 뉴스룸\", \"url\": \"https://ouraring.com/newsroom\", \"note\": \"2026년 5월 21일 상장 서류 비공개 제출, 5월 20일 유료 회원 500만 명, 2025년 10월 14일 9억 달러 조달, 2025년 9월 22일 반지 550만 개 판매와 매출 2배 성장, 2024년 12월 19일 시리즈 d 2억 달러를 확인했다.\"}, {\"title\": \"국제무역위원회 특허 사건 설명\", \"url\": \
