다는 안내문과 창업자들이 남긴 글만 걸려 있다.","from":"https://torchapp.com"},{"file":"torch-health_product.png","caption":"인수 직전인 2026년 1월 6일에 저장된 제품 설명 페이지 전체다. 기록 연결, 개인별 해설, 수치 시각화, 직접 올리기와 진료 녹음 네 가지 기능과 연결 가능한 병원 로고들이 보인다.","from":"https://web.archive.org/web/20260106195852/https://torchapp.com/"},{"file":"torch-health_waitlist.png","caption":"대기자 명단 페이지다. 이메일을 남기고 iOS 비공개 베타 순서를 기다리는 것이 이 앱에 들어가는 유일한 경로였다.","from":"https://web.archive.org/web/20260106/https://torchapp.com/waitlist"}],"q":"{\"slug\": \"torch-health\", \"name\": \"torch\", \"one_liner\": \"병원과 검사실, 웨어러블에 흩어진 미국인의 진료 기록을 한 앱으로 모아 ai가 읽을 수 있는 형태로 정리해 주려던 개인 건강 기록 스타트업이며, 정식 출시 전인 2026년 1월 openai에 인수되어 네 명 전원이 chatgpt health 팀으로 옮겼다.\", \"site\": \"https://torchapp.com\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"06\", \"section\": 14, \"headline\": \"openai가 개인 건강 기록 스타트업 torch를 약 1억 달러 규모 지분으로 인수했고, 대금의 상당 부분이 직원 4명의 잔류와 묶여 있어 제품보다 사람을 데려온 거래로 읽혔다.\"}], \"card\": {\"problem\": \"미국에서는 병원과 검사실, 약국, 웨어러블이 각자 기록을 들고 있어 환자가 자기 기록의 일부만 본다. 기록이 흩어져 있으면 ai에게 물어봐도 제대로 된 답을 받을 수 없다.\", \"solution\": \"수천 곳의 의료 기록 출처에 연결해 검사 수치와 처방약, 진료실 녹음을 한 앱에 모으고, ai가 추세를 짚고 의학 용어를 풀어 준다. 대기자 명단을 받는 ios 비공개 베타까지만 갔다.\", \"price\": \"소비자 가격을 공개한 적이 없다. 정식 출시 전에 인수되어 실제로 돈을 낸 사용자가 없다.\", \"tags\": [\"개인 건강 기록\", \"기록 통합\", \"ai 해설\", \"진료 녹음\", \"ios 비공개 베타\"], \"headline_traction\": \"창업 약 1년 만인 2026년 1월 openai에 인수됐다. the information은 지분 약 1억 달러, cnbc는 약 6천만 달러로 보도했고 네 명 전원이 openai로 옮겼다.\", \"watch\": \"정식 출시된 적이 없어 사용자 수와 매출 같은 실적 수치가 아예 없고, 인수 금액도 매체마다 갈리는 데다 양쪽 회사 모두 공개하지 않았다.\"}, \"problem\": \"한국에서는 병원을 옮겨도 국민건강보험공단과 건강보험심사평가원에 진료와 투약 이력이 쌓이고, 개인이 공단 앱에서 검진 결과와 투약 내역을 한 번에 확인할 수 있다. 미국은 병원과 검사실, 보험사가 저마다 다른 전자의무기록을 쓰고 서로 기록을 잘 넘기지 않기 때문에, 환자가 병원마다 따로 만든 포털에 각각 로그인해야 자기 기록을 겨우 본다. torch는 홈페이지에 이 사정을 두고 건강 데이터가 병원 네 곳과 검사실 두 곳, 앱 일곱 개와 웹 포털 세 개에 흩어져 있으면 ai가 도와줄 수 없다고 적었다. 여기에 웨어러블과 소비자 검사 회사가 쏟아 내는 데이터까지 더해지면서, 환자는 자기 기록의 일부만 보고 의사는 환자가 들고 오는 자료를 다 읽을 시간이 없는 상태가 된다는 것이 이 회사가 내건 문제다. 그래서 미국에서는 흩어진 기록을 대신 모아 주는 일 자체가 하나의 사업 영역으로 존재한다.\", \"solution\": \"쓰려면 먼저 홈페이지에서 이메일을 남겨 대기자 명단에 올라야 했고, 순서가 오면 ios 비공개 베타에 초대받는 방식이었다. 앱은 대형 병원과 검사실부터 소비자 건강 검사 회사까지 수천 곳의 기록 출처에 연결해 검사 수치와 처방약, 진단, 치료 이력을 한 화면으로 합친다. 여기에 사용자가 직접 올리는 pdf와 의료 서류 사진, 진료실에서 녹음한 대화를 받아 글로 옮기고 요약해 같은 기록 옆에 붙여 둔다. 그렇게 모은 자료를 ai가 읽어 시간에 따른 추세를 짚고 의학 용어를 풀어 주며, 검사 결과가 무슨 뜻인지 묻는 질문에 답한다. 홈페이지 첫 화면에 예시로 걸어 둔 질문은 내 검사 결과가 무슨 뜻이냐, 내 테스토스테론 수치는 어떠냐, 나에게 맞는 adhd 약은 무엇이냐 같은 것들이었다. 값은 끝내 공개되지 않았고, 인수 전 개인정보 처리방침에 구독이나 서비스 구매를 위한 결제 정보를 수집한다는 대목이 있을 뿐 금액은 어디에도 적혀 있지 않았다.\", \"features\": [{\"name\": \"기록 연결\", \"detail\": \"대형 병원과 검사실부터 소비자 건강 검사 회사까지 수천 곳의 기록 출처에 연결해, 조각난 기록을 하나의 전체 그림으로 합친다고 밝혔다.\"}, {\"name\": \"개인별 해설\", \"detail\": \"모은 기록을 분석해 시간에 따른 추세를 찾아내고, 의학 용어를 일상 언어로 바꾸며, 중요한 항목을 골라 표시한다.\"}, {\"name\": \"수치 시각화\", \"detail\": \"혈당처럼 여러 기관에 나뉘어 있는 항목을 한 화면에 합쳐 보여 준다. 포털 세 곳에 각각 들어가 조각을 맞추지 않아도 되게 하는 것이 목표라고 적었다.\"}, {\"name\": \"직접 올리기와 진료 녹음\", \"detail\": \"pdf를 올리거나 의료 서류를 사진으로 찍을 수 있고, 진료실 대화를 녹음하면 글로 옮기고 요약해 나머지 기록 옆에 정리해 둔다. 나중에 그 대목을 다시 찾아보고 ai에게 후속 질문을 할 수 있다.\"}, {\"name\": \"기록에 근거한 ai 대화\", \"detail\": \"인수 전 이용약관이 밝힌 제공 서비스는 네 가지다. 건강 기록을 ai로 처리해 해석과 제안을 주는 것, 기록 내용을 근거로 대화하는 것, pdf에서 구조화된 건강 데이터를 뽑아내는 것, 녹음된 대화로 노트와 요약을 만드는 것이다.\"}], \"differentiator\": \"같은 문제를 푸는 회사로 picnichealth가 있다. picnichealth도 여러 기관의 기록을 모아 한 화면으로 보여 주지만, 연 499달러 회원제로 값을 매기고 임상 연구에 참여하면 회원비를 면제해 주며 149달러짜리 화상 진료를 따로 판다. 기록을 모아 주는 값을 사람에게 직접 받거나 연구 참여로 대신 받는 셈이다. torch는 값을 내놓지 못한 채 비공개 베타에서 멈췄기 때문에 제품으로 맞붙은 기간 자체가 없고, 무엇이 더 나은지 비교할 근거도 남기지 못했다. 굳이 다른 점을 들면 진료실 대화 녹음을 기관에서 받아 온 기록과 같은 자리에 붙였다는 것, 그리고 처음부터 사람이 읽을 화면이 아니라 ai가 읽을 형태로 기록을 정리하는 것을 목표로 내걸고 자기 기술을 ai를 위한 의료 기억이라고 불렀다는 점이다. 결국 그 목표를 산 쪽이 경쟁사가 아니라 openai였다.\", \"team\": [{\"name\": \"ilya abyzov\", \"role\": \"공동창업자\", \"background\": \"2016년 adrian aoun과 함께 ai 일차진료 클리닉 회사 forward를 창업했다. 인수 소식을 알린 것도 그의 x 게시글이다.\"}, {\"name\": \"adrian aoun\", \"role\": \"공동창업자\", \"background\": \"2024년 문을 닫은 forward의 창업자다. silicon republic은 그가 ilya abyzov와 함께 2016년에 forward를 세웠다고 적었다.\"}, {\"name\": \"eugene huang\", \"role\": \"공동창업자\", \"background\": \"forward에서 두 창업자와 만나 함께 일하던 사람이다. eweek은 그를 ilya abyzov와 나란히 공동창업자로 들었다.\"}, {\"name\": \"james hamlin\", \"role\": \"공동창업자\", \"background\": \"forward에서 두 창업자와 만나 함께 일하던 사람이다. 네 명 전원의 이름을 함께 적은 매체는 silicon republic 하나다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"openai가 2026년 1월 12일 인수를 발표했다. 금액은 양쪽 다 공개하지 않았고, the information은 지분 약 1억 달러로, cnbc는 약 6천만 달러로 보도했다. 뉴스레터가 전한 구조는 선지급 6천만 달러에 나머지를 직원 4명의 잔류와 연동한 형태다.\", \"when\": \"2026-01\", \"source\": \"siliconangle(2026년 1월 12일), techcrunch(2026년 1월 13일)\"}, {\"type\": \"partnership\", \"detail\": \"네 명 전원이 openai로 옮겨 chatgpt health 작업에 합류했다. openai는 x에 검사 결과와 약, 진료 녹음을 하나로 묶는 회사를 인수했으며 이를 chatgpt health와 합치면 건강을 이해하고 관리하는 새로운 방법이 열린다고 적었다. 발표는 openai가 chatgpt health를 처음 공개한 지 일주일도 되지 않아 나왔다.\", \"when\": \"2026-01\", \"source\": \"eweek이 인용한 openai x 게시글, silicon republic, siliconangle\"}, {\"type\": \"customers\", \"detail\": \"정식 출시 없이 대기자 명단을 받는 ios 비공개 베타 단계에서 인수됐다. 2026년 9월 기준 미국 애플 앱스토어와 구글 플레이 어디에도 이 회사의 앱이 올라와 있지 않다.\", \"when\": \"2026-09\", \"source\": \"애플 itunes 검색 api와 구글 플레이 검색에서 직접 확인, 인수 전 홈페이지 아카이브본\"}], \"caveats\": \"실적으로 내세울 수치가 하나도 없는 회사다. 사용자 수와 매출은 물론 외부에서 돈을 받은 기록도 찾지 못했고, 정식 출시 전에 인수됐으므로 제품을 써 본 사람의 규모조차 공개된 적이 없다. 인수 금액은 두 보도가 갈린다. the information은 지분 약 1억 달러, cnbc는 약 6천만 달러로 적었고 torch와 openai 모두 금액을 공개하지 않았다. 뉴스레터가 전한 선지급 6천만 달러에 잔류 연동분을 더한 구조로 보면 두 숫자가 같은 거래의 다른 부분을 가리키지만, 그 구조 자체도 언론 보도이지 회사가 확인해 준 것이 아니다. 설립 시점도 어긋난다. siliconangle과 computerworld는 2024년으로, silicon republic은 2025년 1월로 적었다. 창업자 네 명의 이름을 한꺼번에 적은 매체는 silicon republic 하나뿐이고, eweek은 ilya abyzov와 eugene huang 두 사람만 공동창업자로 들었다. 마지막으로 인수 직전인 2026년 1월 6일 아카이브본을 직접 확인해 보면, 홈페이지에 올려 둔 개인정보 처리방침과 이용약관 어디에도 hipaa를 언급한 대목이 없고, 이용약관 4.2항은 이용 과정에서 수집된 데이터가 회사의 ai 알고리즘을 개선하는 데 쓰일 수 있다고 적어 두었다. 진료 기록을 다루는 서비스의 약관으로는 눈여겨볼 대목이다.\", \"for_us\": \"수천 기관의 기록을 직접 끌어오는 일은 3개월 안에 소프트웨어 인력만으로 할 수 있는 일이 아니다. 다만 torch가 기관 연동과 나란히 배치한 네 번째 기능은 사정이 다르다. 사용자가 이미 손에 들고 있는 것, 그러니까 검사 결과 pdf와 종이 서류 사진, 진료실에서 녹음한 대화를 앱이 받아 글로 옮기고 요약해 시간순으로 쌓아 두는 일은 병원 연동 없이도 만들 수 있다. 미국 사용자는 병원 포털에서 자기 기록을 내려받을 수는 있으나 그 파일이 쌓이기만 할 뿐 읽히지는 않는 상태에 있고, 이 회사는 바로 그 자리를 제품의 한 축으로 잡았다. 또 하나 볼 대목은 이 회사가 사용자 수를 한 번도 내보이지 않은 채 인수됐다는 사실이다. 미국에서 흩어진 기록을 모으는 문제는 실적을 증명하기 전부터 값이 매겨질 만큼 확실한 문제로 인정받고 있다는 뜻이다. 반대로 조심할 것도 분명하다. 진료 기록을 직접 받아 보관하는 순간 규제와 보안의 부담이 따라오므로, 무엇을 받고 무엇을 받지 않을지, 받은 것을 어디에 두고 어떻게 지울지를 먼저 정해야 한다. torch의 약관이 그 부담을 제대로 다루지 않은 채 넘어간 예시로 남아 있다.\", \"screenshots\": [{\"file\": \"torch-health_home.png\", \"caption\": \"인수 뒤 남은 torchapp.com 첫 화면이다. 제품 설명은 모두 지워지고 openai에 합류한다는 안내문과 창업자들이 남긴 글만 걸려 있다.\", \"from\": \"https://torchapp.com\"}, {\"file\": \"torch-health_product.png\", \"caption\": \"인수 직전인 2026년 1월 6일에 저장된 제품 설명 페이지 전체다. 기록 연결, 개인별 해설, 수치 시각화, 직접 올리기와 진료 녹음 네 가지 기능과 연결 가능한 병원 로고들이 보인다.\", \"from\": \"https://web.archive.org/web/20260106195852/https://torchapp.com/\"}, {\"file\": \"torch-health_waitlist.png\", \"caption\": \"대기자 명단 페이지다. 이메일을 남기고 ios 비공개 베타 순서를 기다리는 것이 이 앱에 들어가는 유일한 경로였다.\", \"from\": \"https://web.archive.org/web/20260106/https://torchapp.com/waitlist\"}], \"sources\": [{\"title\": \"torch 공식 홈페이지 (현재)\", \"url\": \"https://torchapp.com\", \"note\": \"openai 합류 안내문과 창업자들이 남긴 글을 확인했다. 법인명이 torch health, inc.인 것도 여기서 확인했다.\"}, {\"title\": \"torch 공식 홈페이지 (2026년 1월 6일 아카이브본)\", \"url\": \"https://web.archive.org/web/20260106195852/https://torchapp.com/\", \"note\": \"인수 직전 제품 설명이다. 네 가지 기능, 대기자 명단과 ios 비공개 베타, 예시 질문을 확인했다.\"}, {\"title\": \"torch 이용약관 (아카이브본)\", \"url\": \"https://web.archive.org/web/20260106/https://torchapp.com/terms\", \"note\": \"제공 서비스 네 가지와 4.2항의 데이터 활용 문구를 확인했다. hipaa 언급은 없다.\"}, {\"title\": \"torch 개인정보 처리방침 (아카이브본)\", \"url\": \"https://web.archive.org/web/20260106/https://torchapp.com/privacy\", \"note\": \"구독 결제 정보를 수집한다는 대목과, ai 알고리즘 개선에 사용한다는 이용 목적을 확인했다. hipaa 언급은 없다.\"}, {\"title\": \"openai buys torch to bring unified medical data into chatgpt health (siliconangle, 2026-01-12)\", \"url\": \"https://siliconangle.com/2026/01/12/openai-buys-torch-bring-unified-medical-data-chatgpt-health/\", \"note\": \"법인명 torch health inc., 2024년 설립, the information 약 1억 달러와 cnbc 약 6천만 달러로 금액 보도가 갈리는 사실, 공식 사이트 주소를 확인했다.\"}, {\"title\": \"openai buys health-tech torch for $100m (silicon republic)\", \"url\": \"https://www.siliconrepublic.com/business/openai-torch-acquisition-100m-health-tech-healthcare-medicine-ai\", \"note\": \"창업자 네 명의 이름, forward와의 관계, 2025년 1월 설립이라는 표기, 창업자 발언을 확인했다.\"}, {\"title\": \"openai strengthens chatgpt health plans with torch acquisition (eweek, 2026-01-13)\", \"url\": \"https://www.eweek.com/news/openai-buys-torch/\", \"note\": \"네 명 규모의 팀, openai의 x 게시글 원문, forward가 4억 달러 넘게 조달하고 2024년 말에 문을 닫은 사실을 확인했다.\"}, {\"title\": \"openai acquires health records startup torch in deal reportedly worth $100 million (moneycontrol, 2026-01-13)\", \"url\": \"https://www.moneycontrol.com/technology/openai-acquires-health-records-startup-torch-in-deal-reportedly-worth-100-million-article-13771450.html\", \"note\": \"제품이 무엇을 모으려 했는지, 애퀴하이어 성격, 팀 전원이 openai로 옮긴다는 내용을 확인했다.\"}, {\"title\": \"openai buys tiny health records startup torch for, reportedly, $100m (techcrunch, yahoo finance 전재, 2026-01-13)\", \"url\": \"https://finance.yahoo.com/news/openai-buys-tiny-health-records-000419573.html\", \"note\": \"the information의 1억 달러 보도와 팀 규모를 교차 확인했다.\"}, {\"title\": \"openai acquires torch health to boost its healthcare offerings (computerworld)\", \"url\": \"https://www.computerworld.com/article/4116050/openai-acquires-torch-health-to-boost-its-healthcare-offerings.html\", \"note\": \"2024년 설립이라는 표기와 팀 전원 이동을 교차 확인했다.\"}, {\"title\": \"picnichealth 가격 페이지\", \"url\": \"https://picnichealth.com/pricing\", \"note\": \"비교 대상으로 확인했다. 연 499달러 회원제, 연구 참여 시 면제, 화상 진료 149달러다.\"}]}"},{"slug":"truemed","name":"Truemed","one_liner":"미국 직장인이 세금 혜택이 붙은 의료비 전용 계좌에 쌓아 둔 돈으로 운동기구와 보조제, 사우나 같은 건강 상품을 살 수 있도록, 온라인 상점 결제 화면에서 의사 소견서를 붙여 주는 결제 연동 회사다.","sells_to":"mixed","seen_in":[{"issue":"01","section":9,"headline":"HSA와 FSA에 쌓인 혜택 자금을 쓸 수 있게 해 주는 마켓플레이스로 소개되면서, a16z가 주도한 3,400만 달러 투자를 받았다고 나왔다."}],"card":{"problem":"미국 직장인은 세금을 떼기 전에 급여 일부를 의료비 전용 계좌(HSA·FSA)에 쌓아 두는데, 이 돈은 질병의 진단과 치료에만 쓸 수 있어서 운동기구나 보조제, 헬스장 회원권에는 원칙적으로 쓰지 못한다. FSA에 남은 돈은 해가 바뀌면 대부분 사라지므로 연말이 되면 쓰지 못한 금액을 잃는다.","solution":"Truemed는 제휴 상점의 결제 화면에서 건강 설문을 받고, 계약한 면허 의료인이 그 답변을 검토해 의학적 필요 소견서를 발급하면 그 자리에서 계좌 카드로 결제되게 해 준다. 한 번 발급된 소견서는 12개월 동안 유효해서 같은 상품을 다시 살 때 재사용할 수 있다.","price":"상품을 사는 경우에는 소비자가 Truemed에 따로 내는 돈이 없고 서비스 비용이 이미 상품 가격에 포함되어 있지만, 헬스장과 스튜디오는 방식이 달라서 회원이 소견서 한 건당 20달러를 직접 낸다.","tags":["세제 혜택 계좌","결제 연동","의사 소견서","건강 상품 구매","헬스장 회원권"],"headline_traction":"2025년 12월에 a16z가 주도한 시리즈 A로 3,400만 달러를 조달했다.","watch":"미국 국세청이 2024년에 자기 보고만으로 발급한 소견서로는 생활 지출을 의료비로 바꿀 수 없다는 경고를 냈고, 회사 이용약관도 세금 문제의 책임을 이용자 본인에게 넘겨 두었다."},"screenshots":[{"file":"truemed_shop.png","caption":"소비자용 마켓플레이스 첫 화면이다. HSA·FSA 자금을 실제로 원하는 상품에 쓰라는 문구와 평균 30퍼센트 절약, 이용자 100만 명이라는 표기가 보인다.","from":"https://shopping.truemed.com/hsa-fsa-shopping"},{"file":"truemed_brands.png","caption":"같은 페이지 전체다. Peloton과 Thorne, Tonal, Plunge, Orthofeet 같은 제휴 브랜드와 결제, 건강 설문, HSA·FSA 결제로 이어지는 3단계 이용 절차가 나와 있다.","from":"https://shopping.truemed.com/hsa-fsa-shopping"},{"file":"truemed_help.png","caption":"고객 도움말의 자격 기준 안내다. 세법 213(d)조를 근거로 삼되 일반적인 건강에 이롭기만 한 지출은 인정되지 않는다고 회사가 직접 설명하고 있다.","from":"https://help.truemed.com/eligibility-qualification/eligibility-qualification-overview"}],"q":"{\"slug\": \"truemed\", \"name\": \"truemed\", \"one_liner\": \"미국 직장인이 세금 혜택이 붙은 의료비 전용 계좌에 쌓아 둔 돈으로 운동기구와 보조제, 사우나 같은 건강 상품을 살 수 있도록, 온라인 상점 결제 화면에서 의사 소견서를 붙여 주는 결제 연동 회사다.\", \"site\": \"https://www.truemed.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"01\", \"section\": 9, \"headline\": \"hsa와 fsa에 쌓인 혜택 자금을 쓸 수 있게 해 주는 마켓플레이스로 소개되면서, a16z가 주도한 3,400만 달러 투자를 받았다고 나왔다.\"}], \"card\": {\"problem\": \"미국 직장인은 세금을 떼기 전에 급여 일부를 의료비 전용 계좌(hsa·fsa)에 쌓아 두는데, 이 돈은 질병의 진단과 치료에만 쓸 수 있어서 운동기구나 보조제, 헬스장 회원권에는 원칙적으로 쓰지 못한다. fsa에 남은 돈은 해가 바뀌면 대부분 사라지므로 연말이 되면 쓰지 못한 금액을 잃는다.\", \"solution\": \"truemed는 제휴 상점의 결제 화면에서 건강 설문을 받고, 계약한 면허 의료인이 그 답변을 검토해 의학적 필요 소견서를 발급하면 그 자리에서 계좌 카드로 결제되게 해 준다. 한 번 발급된 소견서는 12개월 동안 유효해서 같은 상품을 다시 살 때 재사용할 수 있다.\", \"price\": \"상품을 사는 경우에는 소비자가 truemed에 따로 내는 돈이 없고 서비스 비용이 이미 상품 가격에 포함되어 있지만, 헬스장과 스튜디오는 방식이 달라서 회원이 소견서 한 건당 20달러를 직접 낸다.\", \"tags\": [\"세제 혜택 계좌\", \"결제 연동\", \"의사 소견서\", \"건강 상품 구매\", \"헬스장 회원권\"], \"headline_traction\": \"2025년 12월에 a16z가 주도한 시리즈 a로 3,400만 달러를 조달했다.\", \"watch\": \"미국 국세청이 2024년에 자기 보고만으로 발급한 소견서로는 생활 지출을 의료비로 바꿀 수 없다는 경고를 냈고, 회사 이용약관도 세금 문제의 책임을 이용자 본인에게 넘겨 두었다.\"}, \"problem\": \"미국 직장인은 급여에서 세금을 떼기 전에 일부를 미리 떼어 hsa나 fsa라는 의료비 전용 계좌에 쌓아 둔다. hsa는 본인이 먼저 부담하는 금액이 큰 보험에 든 사람만 열 수 있고 남은 돈을 해마다 계속 이월할 수 있는 반면, fsa는 고용주가 제공하며 그해에 쓰지 못한 돈은 고용주가 정한 제도에 따라 2025년 기준 660달러까지만 다음 해로 넘길 수 있고 나머지는 사라진다. 문제는 이 돈을 쓸 수 있는 범위가 세법 213(d)조에 따라 질병의 진단과 치료, 완화, 처치, 예방으로 좁게 묶여 있어서, 헬스장 회원권이나 보조제, 운동기구처럼 건강에 도움이 되기만 하는 지출은 원칙적으로 인정되지 않는다는 점이다. 그래서 계좌에는 돈이 쌓여 있는데 정작 쓸 곳이 마땅치 않은 상황이 생기고, fsa 가입자는 연말이 되면 남은 돈을 잃는다. 한국의 연말정산 의료비 세액공제는 이미 쓴 돈을 사후에 깎아 주는 방식이라 이런 문제가 생기지 않으며, 급여를 미리 떼어 별도 계좌에 쌓아 두는 제도 자체가 한국에는 없다.\", \"solution\": \"소비자는 truemed와 제휴한 브랜드의 온라인 상점에서 상품을 고른 뒤 결제 화면에서 truemed를 선택한다. 그러면 현재 건강 상태와 진단받은 병, 이 상품을 사려는 이유를 묻는 건강 설문이 뜨고, truemed와 계약한 독립 면허 의료인이 그 답변을 검토한다. 의료인이 그 상품을 그 사람의 건강 상태에 필요하다고 판단하면 의학적 필요 소견서(letter of medical necessity)를 발급하고, 소비자는 그 자리에서 hsa나 fsa 카드로 결제한다. 결제 화면에 truemed가 붙어 있지 않은 상점이거나 구독 상품이면 일반 카드로 먼저 결제한 다음 같은 날 설문에 답하고, 보통 24시간에서 48시간 안에 검토 결과를 받아 계좌 운영사에 환급을 신청한다. 한 번 발급된 소견서는 12개월 동안 유효하고 같은 상품을 다시 살 때 재사용할 수 있다. 상품을 사는 경우 소비자가 truemed에 따로 내는 돈은 없다. 회사는 자사 서비스 비용이 이미 상품 가격에 포함돼 있다고 고지하며, 브랜드 계약서를 보면 truemed가 주문 금액에서 수수료를 먼저 떼고 나머지를 브랜드에 정산한다. 다만 헬스장과 스튜디오는 값을 매기는 방식이 다르다. 가맹점은 750달러를 한 번만 내고 그 뒤로는 거래 수수료도 월 이용료도 최소 금액도 없는 대신, 회원이 소견서 한 건당 20달러를 직접 낸다. 소비자용 모바일 앱은 없으며, 모든 절차는 제휴 상점의 결제 화면과 웹 화면에서 이루어진다.\", \"features\": [{\"name\": \"결제 화면 연동\", \"detail\": \"shopify와 woocommerce, bigcommerce, 직접 api로 상점에 붙어서 hsa·fsa 카드 결제를 그 자리에서 처리한다. 상품 페이지에는 이 상품이 대상인지 알려 주는 안내 표시가 붙는다.\"}, {\"name\": \"건강 설문과 의료인 검토\", \"detail\": \"소비자가 답한 건강 설문을 제휴 면허 의료인이 검토해 의학적 필요 소견서를 발급하거나 거절한다. 거절되면 결제 자체가 이루어지지 않는다.\"}, {\"name\": \"환급 지원\", \"detail\": \"결제 연동이 없는 상점이나 구독 상품은 일반 카드로 먼저 결제한 뒤, 소견서를 받아 계좌 운영사에 환급을 신청하도록 돕는다.\"}, {\"name\": \"소비자 마켓플레이스\", \"detail\": \"제휴 브랜드 3,000곳과 15개가 넘는 상품 분류를 모아 보여 주고, 상품을 고르면 해당 브랜드 상점으로 보낸다. 결제는 마켓플레이스가 아니라 브랜드 상점에서 이루어진다.\"}, {\"name\": \"상품 분류\", \"detail\": \"운동기구, 헬스 기기, 수면, 보조제, 적색광 치료, 기능성 신발, 사우나와 냉수욕, 재택 건강, 헬스장과 스튜디오로 나뉜다. 헬스장과 스튜디오 분류에는 barry's와 classpass, club pilates가 올라 있고 투자 보도자료에는 24 hour fitness도 제휴처로 나오므로, 헬스장 회원권도 실제로 대상이 된다.\"}, {\"name\": \"헬스장 전용 방식\", \"detail\": \"헬스장에서는 hsa·fsa 카드로 그 자리에서 결제하는 방식을 회사가 권하지 않는다. 카드사가 매기는 가맹점 업종 분류 때문에 헬스장에서는 승인이 나지 않는 경우가 많아서, 회원이 일반 카드로 결제하고 소견서를 받아 나중에 환급받는 방식만 쓴다. 가맹점 가입 비용도 이 경우에만 공개돼 있다.\"}], \"differentiator\": \"같은 일을 하는 회사로 flex와 sika health가 있고, 결제 화면에서 건강 설문을 받아 소견서를 발급한다는 구조는 세 회사가 같다. 실질적인 차이는 어느 브랜드와 붙어 있느냐이며, 소비자는 사려는 브랜드가 어느 회사를 쓰는지에 따라 선택이 갈린다. truemed는 제휴 브랜드가 3,000곳이 넘는다고 밝혀 세 회사 가운데 가장 많은 제휴처를 확보했다고 주장하며, peloton과 eight sleep, nike strength, garmin, 24 hour fitness처럼 이름이 알려진 브랜드를 제휴처로 확보했다. 기술 자체는 세 회사가 같기 때문에, 제휴 영업의 규모가 경쟁을 가르는 시장이다.\", \"team\": [{\"name\": \"justin mares\", \"role\": \"공동창업자, ceo\", \"background\": \"식품 브랜드 kettle & fire와 perfect keto를 창업해 키운 사람이다.\"}, {\"name\": \"calley means\", \"role\": \"공동창업자\", \"background\": \"맞춤 웨딩드레스 회사 anomalie를 공동창업해 david's bridal에 매각했고, 그 전에는 식품과 제약 업계를 상대하는 컨설턴트로 일했다. 2025년 3월부터 백악관 자문 자격으로 미국 보건복지부 장관을 보좌했고, 그해 말 정부 일을 정리하는 과정에서 truemed 지분을 전량 매각했다고 밝혔다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"3,400만 달러 규모 시리즈 a를 마감했다. a16z가 주도했고 bessemer venture partners와 long journey ventures, boxgroup, trust ventures가 참여했다.\", \"when\": \"2025-12\", \"source\": \"pr newswire 보도자료, a16z 투자 공지\"}, {\"type\": \"funding\", \"detail\": \"창업 초기에 350만 달러를 safe 방식으로 모았다. mark hyman과 thrive market, eight sleep, levels 창업자들이 참여했다.\", \"when\": \"2023-09\", \"source\": \"techcrunch\"}, {\"type\": \"customers\", \"detail\": \"제휴 가맹 브랜드가 3,000곳을 넘는다고 밝혔다.\", \"when\": \"2025-12\", \"source\": \"a16z 투자 공지, truemed 마켓플레이스 페이지\"}, {\"type\": \"revenue\", \"detail\": \"2년 연속으로 전년 대비 매출이 3배 늘었다고 밝혔다.\", \"when\": \"2025-12\", \"source\": \"pr newswire 보도자료\"}, {\"type\": \"customers\", \"detail\": \"이용자가 100만 명을 넘었다고 자사 마켓플레이스에 표기하고 있다.\", \"when\": \"2026-09\", \"source\": \"shopping.truemed.com 화면\"}, {\"type\": \"partnership\", \"detail\": \"peloton과 eight sleep, nike strength, 24 hour fitness, rogue fitness, garmin, barry's, thorne, tonal, plunge, ag1 등이 제휴 브랜드로 공개돼 있다.\", \"when\": \"2025-12\", \"source\": \"a16z 투자 공지, pr newswire 보도자료, truemed 마켓플레이스 화면\"}], \"caveats\": \"미국 국세청은 2024년 3월 6일에 이 방식을 겨냥한 경고를 냈다(ir-2024-65). 본인이 스스로 보고한 건강 정보만 근거로 의사가 써 준 소견서로는 원래 개인 지출인 식품과 운동 비용을 의료비로 바꿀 수 없고, 인정되지 않는 지출을 갚아 준 계좌는 자격을 잃어 그 계좌에서 나간 돈 전부가 소득으로 잡힐 수 있다는 내용이다. 다만 이 경고는 truemed를 이름으로 지목하지 않았고, 회사는 진단받은 병이 있어야 인정된다고 안내하면서 국세청 기준을 지키고 있다고 주장한다. 공동창업자 calley means를 둘러싼 이해충돌도 계속 문제가 됐다. means는 2025년 3월 18일에 특별정부직원 신분으로 백악관 자문에 임명돼 보건복지부 장관 robert f. kennedy jr.를 보좌하면서 truemed 지분을 그대로 들고 있었다. 지분 규모는 보도마다 달라 2,000만 달러대에서 5,000만 달러 사이로 엇갈리게 전해지므로 특정 금액을 확정해서 인용하지 않는 편이 안전하다. 하원의원 jake auchincloss는 2025년 6월 16일 means 본인과 truemed 이사회에 각각 서한을 보내, truemed의 기업 가치가 2024년 1월 이후 3배 가까이 올랐고 그 시점이 means의 임명 시기와 겹친다는 점을 문제 삼았다. 같은 의원과 상원의원 adam schiff는 2025년 10월 31일 백악관 비서실장과 보건복지부 장관에게 보낸 공동 서한에서, means가 직접 만든 정책으로 자기 회사가 이득을 봤다고 지적했다. 두 사람은 그 예로 truemed가 비데(alpha jx2 bidet)까지 자가면역과 소화기, 관절 건강에 도움이 된다며 hsa 대상 상품으로 광고한다는 점을 들었고, 근거 자료로는 9,000달러짜리 사우나에 세금 혜택을 받게 해 준다는 new york times 기사(2025년 7월 18일)를 인용했다. means는 2025년 말 정부를 떠나거나 정규직으로 자리를 옮기는 과정에서 지분을 전량 매각했다고 밝혔으나, 매각 시점에 대한 보도가 서로 조금씩 다르다. 2026년 6월에는 법무법인 migliaccio & rathod가 소비자에게 예상치 못한 세금 부담이 생겼는지 조사한다고 공지했으나, 소송이 실제로 제기되지는 않았다. 제휴 브랜드 3,000곳과 이용자 100만 명, 2년 연속 매출 3배 성장은 모두 회사가 스스로 낸 수치이고 제삼자가 확인한 것이 아니다. 브랜드 수는 직접 세어 검증하지 못했다. 이커머스 상품의 수수료율도 브랜드 계약서가 요율을 계약상 비밀로 못 박고 있어 밖에서는 알 수 없다. 평균 30퍼센트 절약이라는 문구도 소득이 있는 미국 중위 납세자의 세율을 가정해 계산한 값이라고 회사가 밝히고 있어서 개인마다 실제 절감액은 달라진다. 위험을 누가 지는지도 분명하다. 회사의 이용약관은 소견서를 받았다고 해서 계좌 운영사나 고용주가 인정한다는 보장이 없고, 미국 국세청이나 주·지방 세무당국이 그 지출을 213(d)조 인정 의료비로 볼 것이라는 보장도 없다고 적은 뒤, 소견서에 기대어 자격을 입증하는 일은 전적으로 이용자 본인의 위험이며 그에 따른 금전적 책임도 본인이 전부 진다고 명시한다. 회사 블로그에서는 국세청 규정에 어긋나지 않는다는 오해 풀이를 싣고 있지만, 약관에서는 그 책임을 이용자에게 넘겨 두었다는 점을 함께 봐야 한다. 참고로 회사 소개 페이지에는 이제 justin mares만 나오고 calley means의 이름은 나오지 않는다. 한편 헬스장 회원권과 운동비를 연 500달러까지 hsa 인정 의료비로 삼는 조항은 2025년 세법 개정안 가운데 하원 통과본에는 들어 있었으나 최종 법에서 삭제됐다. 그래서 지금 헬스장 회원권에 hsa를 쓰는 길은 이 소견서 방식밖에 없다. 이 회사의 사업이 법 개정 하나에 크게 흔들릴 수 있다는 뜻이기도 하다.\", \"for_us\": \"이 회사가 파는 것은 상품이 아니라 이 지출이 의료비로 인정된다는 판정과 그 근거 문서다. 결제 화면에서 설문 몇 개를 받아 판정을 붙여 주는 것만으로 소비자가 실제로 내는 값이 30퍼센트 가까이 줄어들기 때문에, 필요한 것은 기기나 임상 데이터가 아니라 소프트웨어와 제휴다. 다만 우리가 같은 일을 직접 하려면 면허 의료인 발급 체계와 세법 판단 책임을 함께 떠안아야 해서 3개월 안에 시도하기에는 위험이 크다. 대신 우리 앱 화면 안에서 할 수 있는 일이 두 가지 있다. 첫째, 미국 이용자에게 지금 hsa나 fsa에 얼마가 남아 있는지 알려 주고, fsa라면 연말까지 쓰지 않으면 사라지는 금액을 계산해 보여 주는 안내다. 둘째, truemed나 flex의 제휴 브랜드로 연결해 주는 자리를 만드는 것이며, 이렇게 하면 세법 판단은 그 회사가 하고 우리는 이용자를 연결하는 역할만 맡는다. 연말이라는 정해진 기한이 있고 쓰지 않으면 돈이 사라진다는 조건은 앱에서 알림과 목표를 붙이기에 잘 맞는다.\", \"screenshots\": [{\"file\": \"truemed_shop.png\", \"caption\": \"소비자용 마켓플레이스 첫 화면이다. hsa·fsa 자금을 실제로 원하는 상품에 쓰라는 문구와 평균 30퍼센트 절약, 이용자 100만 명이라는 표기가 보인다.\", \"from\": \"https://shopping.truemed.com/hsa-fsa-shopping\"}, {\"file\": \"truemed_brands.png\", \"caption\": \"같은 페이지 전체다. peloton과 thorne, tonal, plunge, orthofeet 같은 제휴 브랜드와 결제, 건강 설문, hsa·fsa 결제로 이어지는 3단계 이용 절차가 나와 있다.\", \"from\": \"https://shopping.truemed.com/hsa-fsa-shopping\"}, {\"file\": \"truemed_help.png\", \"caption\": \"고객 도움말의 자격 기준 안내다. 세법 213(d)조를 근거로 삼되 일반적인 건강에 이롭기만 한 지출은 인정되지 않는다고 회사가 직접 설명하고 있다.\", \"from\": \"https://help.truemed.com/eligibility-qualification/eligibility-qualification-overview\"}, {\"file\": \"truemed_merchant.png\", \"caption\": \"가맹점용 기술 문서다. 결제 처리와 환급 지원이라는 두 갈래로 상점에 붙는다는 설명이 나와 있다.\", \"from\": \"https://docs.truemed.com/guides/get-started/how-truemed-works\"}], \"sources\": [{\"title\": \"investing in truemed\", \"url\": \"https://a16z.com/announcement/investing-in-truemed/\", \"note\": \"a16z가 밝힌 투자 이유와 제휴 브랜드 3,000곳, 평균 30퍼센트 절약 수치를 확인했다.\"}, {\"title\": \"truemed closes $34 million series a to unlock hsa/fsa funds for lifestyle interventions\", \"url\": \"https://www.prnewswire.com/news-releases/truemed-closes-34-million-series-a-to-unlock-hsafsa-funds-for-lifestyle-interventions-302647740.html\", \"note\": \"투자 규모와 참여 투자사, 본사 위치, 매출 3배 성장 발표를 확인했다.\"}, {\"title\": \"how truemed works (가맹점용 기술 문서)\", \"url\": \"https://docs.truemed.com/guides/get-started/how-truemed-works\", \"note\": \"결제 연동 방식과 소견서 12개월 유효, 24시간에서 48시간 검토 시간을 확인했다.\"}, {\"title\": \"eligibility & qualification overview (고객 도움말)\", \"url\": \"https://help.truemed.com/eligibility-qualification/eligibility-qualification-overview\", \"note\": \"인정 기준과 헬스장 회원권 포함 여부, 계좌 운영사가 최종 판단권을 가진다는 안내를 확인했다.\"}, {\"title\": \"hsa/fsa eligible products (소비자 마켓플레이스)\", \"url\": \"https://shopping.truemed.com/hsa-fsa-shopping\", \"note\": \"제휴 브랜드 목록과 3단계 이용 절차, 이용자 100만 명 표기를 확인했다.\"}, {\"title\": \"disclosures (truemed 고지 문서)\", \"url\": \"https://www.truemed.com/disclosures\", \"note\": \"서비스 비용이 상품 가격에 포함된다는 안내와, 계좌 운영사가 청구를 거절할 수 있고 사실과 다르게 답하면 세금 불이익이 생길 수 있다는 면책 문구를 확인했다.\"}, {\"title\": \"gyms & studios (truemed 상품 분류)\", \"url\": \"https://www.truemed.com/shop/gym-studios\", \"note\": \"헬스장과 스튜디오 회원권이 실제 대상 분류로 있고 barry's, classpass, club pilates가 제휴돼 있음을 확인했다.\"}, {\"title\": \"publication 969, health savings accounts and other tax-favored health plans\", \"url\": \"https://www.irs.gov/publications/p969\", \"note\": \"hsa와 fsa의 가입 조건, 이월 규칙, 인정 의료비 정의를 확인했다.\"}, {\"title\": \"irs alert: beware of companies misrepresenting nutrition, wellness and general health expenses as medical care for fsas, hsas, hras and msas (ir-2024-65)\", \"url\": \"https://www.irs.gov/newsroom/irs-alert-beware-of-companies-misrepresenting-nutrition-wellness-and-general-health-expenses-as-medical-care-for-fsas-hsas-hras-and-msas\", \"note\": \"자기 보고 정보만으로 발급한 소견서를 인정하지 않는다는 국세청 경고와 계좌 자격 상실 위험을 확인했다.\"}, {\"title\": \"truemed's payment integration platform unlocks hsa/fsa for health, not sickness\", \"url\": \"https://techcrunch.com/2023/09/18/truemed-payment-integration-hsa-fsa/\", \"note\": \"창업 배경과 초기 투자 350만 달러, 창업자 경력을 확인했다.\"}, {\"title\": \"congressman auchincloss probes corruption of healthcare executives in the trump administration\", \"url\": \"https://auchincloss.house.gov/media/press-releases/congressman-auchincloss-probes-corruption-of-healthcare-executives-in-the-trump-administration\", \"note\": \"calley means의 이해충돌을 문제 삼은 의회 서한 내용을 확인했다.\"}, {\"title\": \"헬스장·스튜디오 가맹점 가입 안내\", \"url\": \"https://www.truemed.com/partners/dtc-merchant-sign-up\", \"note\": \"가맹점 750달러 일회성, 이후 거래 수수료와 월 이용료 없음, 회원이 소견서 한 건당 20달러 부담, 업종 분류 문제로 헬스장에서는 카드 결제 대신 환급 방식을 쓴다는 안내를 원문으로 확인했다.\"}, {\"title\": \"brand agreement (가맹 브랜드 계약서)\", \"url\": \"https://www.truemed.com/legal/brand-agreement\", \"note\": \"주문 금액에서 수수료를 먼저 떼고 나머지를 브랜드에 정산한다는 조항과, 요율이 계약상 비밀이라는 조항을 확인했다.\"}, {\"title\": \"terms of service (truemed 이용약관)\", \"url\": \"https://www.truemed.com/terms\", \"note\": \"소견서에 기대어 자격을 입증하는 일이 전적으로 이용자 본인의 위험이고, 국세청이 213(d)조 인정 의료비로 볼 것이라는 보장이 없다는 조항을 원문으로 확인했다.\"}, {\"title\": \"letter from representative auchincloss to the truemed board of directors\", \"url\": \"https://auchincloss.house.gov/imo/media/doc/auchincloss_letter_to_truemed_board_of_directors.pdf\", \"note\": \"2025년 6월 16일 자 서한 원문이다. 기업 가치가 2024년 1월 이후 3배 가까이 올랐다는 지적과 본사 주소를 확인했다.\"}, {\"title\": \"what the one big beautiful bill act means for employee benefits\", \"url\": \"https://www.tasconline.com/legislative-updates/what-the-one-big-beautiful-bill-act-means-for-employee-benefits/\", \"note\": \"헬스장 회원권과 운동비를 연 500달러까지 hsa 인정 의료비로 삼는 조항이 최종 법에서 삭제됐다는 사실을 항목별 목록으로 확인했다.\"}, {\"title\": \"auchincloss and schiff letter on potential conflict of interest with calley means\", \"url\": \"https://www.schiff.senate.gov/wp-content/uploads/2025/11/auchincloss-schiff-letter-on-potential-coi-with-calley-means.pdf\", \"note\": \"2025년 10월 31일 자 공동 서한 원문이다. 임명일과 이해충돌 지적, truemed가 비데를 hsa 대상으로 광고한다는 사례를 확인했다.\"}, {\"title\": \"a kennedy aide's start-up can get you a tax break on a $9,000 sauna\", \"url\": \"https://www.nytimes.com/2025/07/18/business/truemed-fsa-hsa-calley-means-maha.html\", \"note\": \"이 방식을 비판적으로 다룬 new york times 기사다. 본문은 열지 못했고 의회 서한의 인용을 통해 존재와 논지를 확인했다.\"}, {\"title\": \"truemed hsa/fsa medical necessity investigation\", \"url\": \"https://classlawdc.com/2026/06/02/truemed-hsa-fsa-medical-necessity-investigation/\", \"note\": \"법무법인이 소비자 피해 여부를 조사 중이라는 공지를 확인했다. 소송 제기 단계는 아니다.\"}, {\"title\": \"a list of tax provisions left out of the big beautiful bill\", \"url\": \"https://bipartisanpolicy.org/explainer/tax-provisions-left-out-of-obbb/\", \"note\": \"헬스장 회원권을 hsa 대상에 넣는 조항이 최종 법에서 빠졌다는 사실을 확인했다.\"}, {\"title\": \"truemed lands $34m to grow hsa/fsa purchase platform\", \"url\": \"https://athletechnews.com/truemed-34-million-funding-hsa-fsa/\", \"note\": \"피트니스 업계 관점의 투자 보도와 창업자 발언을 확인했다.\"}]}"},{"slug":"whoop","name":"WHOOP","one_liner":"화면이 없는 손목 밴드를 기기값 없이 연 199~359달러 구독으로 파는 회사이며, 최근에는 그 밴드를 들고 미국 메디케어 환자를 직접 진료하는 별도 의사 법인까지 세웠다.","sells_to":"mixed","seen_in":[{"issue":"04","section":6,"headline":"FDA가 소비자가전전시회에서 일부 AI 및 웰니스 제품에 대한 감독을 완화하겠다고 밝히자, 2025년 7월 혈압 기능으로 경고 서한을 받았던 이 회사가 그 조치를 반겼다는 대목에서 이름이 나왔다."}],"card":{"problem":"미국 소비자는 1년에 한 번 병원에서 받는 검사와 그다음 검사 사이에 자기 몸이 어떤 상태인지 확인할 방법이 없고, 의사도 진료실에서 몇 분 동안 잰 수치만 보고 판단한다.","solution":"화면이 없는 밴드를 하루 종일 채우게 해서 수면과 회복, 스트레스, 혈압 추정치를 앱으로 매일 보여 주고, 기기값을 따로 받지 않는 대신 해마다 구독료를 받는다.","price":"기기값 없이 연 199달러(One), 239달러(Peak), 359달러(Life)다. 혈액검사는 구독과 별개로 69달러부터 799달러까지 따로 판다.","tags":["웨어러블","연 구독","수면·회복","혈액검사","메디케어 진료"],"headline_traction":"2026년 3월 시리즈 G로 5억 7,500만 달러를 받아 기업가치가 101억 달러가 됐고, 의료기기 회사 Abbott이 투자자로 참여했다.","watch":"FDA가 2025년 7월 혈압 기능에 경고 서한을 보냈으나 회사는 기능을 내리지 않고 면책 문구만 붙여 계속 팔고 있으며, 그 기능이 담긴 밴드를 메디케어 환자에게 무상으로 지급하고 있다."},"screenshots":[{"file":"whoop_membership.png","caption":"요금제 비교 페이지다. One, Peak, Life 세 가지가 나란히 놓여 있고 요금제마다 밴드와 충전기가 포함된다는 점, 위 요금제로 갈수록 Healthspan과 심전도, 혈압 인사이트가 더해지는 구조를 보여 준다. 한국에서 접속했기 때문에 값이 원화로 표시돼 있으며, 달러 값은 같은 페이지의 데이터에서 확인했다.","from":"https://www.whoop.com/us/en/membership/"},{"file":"whoop_labs.png","caption":"혈액검사 상품 목록이다. 53개 항목을 보는 기본 패널이 69달러, 75개 항목을 정기적으로 보는 구독형 패널이 199달러로 붙어 있고, 세전 의료비 계좌로 결제할 수 있다는 표시가 상품마다 달려 있다.","from":"https://shop.whoop.com/us/en/advanced-labs/panels/"},{"file":"whoop_connected_care.png","caption":"WHOOP Physician Services, P.C.의 진료 약관 첫 화면이다. 웨어러블 회사가 자기 이름을 단 의사 법인을 세우고 진료 약관을 따로 내걸었다는 사실 자체를 보여 주며, 2026년 8월 5일에 갱신됐다.","from":"https://www.whoop.com/us/en/connected-care-terms-of-care/"}],"q":"{\"slug\": \"whoop\", \"name\": \"whoop\", \"one_liner\": \"화면이 없는 손목 밴드를 기기값 없이 연 199~359달러 구독으로 파는 회사이며, 최근에는 그 밴드를 들고 미국 메디케어 환자를 직접 진료하는 별도 의사 법인까지 세웠다.\", \"site\": \"https://www.whoop.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"04\", \"section\": 6, \"headline\": \"fda가 소비자가전전시회에서 일부 ai 및 웰니스 제품에 대한 감독을 완화하겠다고 밝히자, 2025년 7월 혈압 기능으로 경고 서한을 받았던 이 회사가 그 조치를 반겼다는 대목에서 이름이 나왔다.\"}], \"card\": {\"problem\": \"미국 소비자는 1년에 한 번 병원에서 받는 검사와 그다음 검사 사이에 자기 몸이 어떤 상태인지 확인할 방법이 없고, 의사도 진료실에서 몇 분 동안 잰 수치만 보고 판단한다.\", \"solution\": \"화면이 없는 밴드를 하루 종일 채우게 해서 수면과 회복, 스트레스, 혈압 추정치를 앱으로 매일 보여 주고, 기기값을 따로 받지 않는 대신 해마다 구독료를 받는다.\", \"price\": \"기기값 없이 연 199달러(one), 239달러(peak), 359달러(life)다. 혈액검사는 구독과 별개로 69달러부터 799달러까지 따로 판다.\", \"tags\": [\"웨어러블\", \"연 구독\", \"수면·회복\", \"혈액검사\", \"메디케어 진료\"], \"headline_traction\": \"2026년 3월 시리즈 g로 5억 7,500만 달러를 받아 기업가치가 101억 달러가 됐고, 의료기기 회사 abbott이 투자자로 참여했다.\", \"watch\": \"fda가 2025년 7월 혈압 기능에 경고 서한을 보냈으나 회사는 기능을 내리지 않고 면책 문구만 붙여 계속 팔고 있으며, 그 기능이 담긴 밴드를 메디케어 환자에게 무상으로 지급하고 있다.\"}, \"problem\": \"한국에서는 국가건강검진을 해마다 받을 수 있고 몸이 이상하면 동네 의원에 바로 갈 수 있어서, 검사와 검사 사이의 공백이 크게 문제가 되지 않는다. 미국은 진료를 한 번 받는 데 드는 비용과 예약 대기 때문에 그 간격이 훨씬 길고, 그동안 몸에서 일어나는 변화는 아무도 보지 않는다. 특히 혈압처럼 평소에 계속 오르내리는 수치는 진료실에서 몇 분 동안 한 번 재는 방식으로는 제대로 잡히지 않는데, fda는 whoop에 보낸 경고 서한에서 고혈압을 심혈관 질환의 위험 요인 가운데 사람이 고칠 수 있는 가장 흔한 요인이라고 표현했다. 그래서 미국에서는 몸 상태를 매일 재서 보여 주는 일 자체가 상품이 되며, 소비자가 해마다 수백 달러를 내고 그 수치를 사는 시장이 만들어졌다. 여기에 더해 메디케어 쪽에서는 만성질환을 앓는 고령자를 병원 밖에서 계속 지켜보는 일에 정부가 돈을 대기 시작했고, whoop은 그 자리에도 들어갔다.\", \"solution\": \"사용자는 회사에서 밴드를 받아 손목에 차고 하루 종일 벗지 않는다. 밴드에는 화면이 없어서 숫자는 전부 휴대전화 앱에서만 본다. 앱은 매일 아침 수면 점수, 회복 점수, 그날 감당할 만한 운동량인 스트레인 점수를 내주고, 상위 요금제에서는 노화 속도를 나타내는 healthspan, 실시간 스트레스 점수, 심전도 측정, 불규칙 심박 알림, 매일의 혈압 추정치를 더 준다. 요금제는 세 가지이며 기기값을 따로 받지 않고 연 구독료만 받는다. whoop one은 연 199달러, whoop peak은 연 239달러, whoop mg 기기와 혈압 기능이 들어가는 whoop life는 연 359달러다. 구독과 별개로 앱 안에서 혈액검사를 예약할 수 있는데, 전국 quest diagnostics 2,000여 곳에서 피를 뽑고 임상의가 결과를 검토해 실행 계획을 붙여 주며, 값은 53개 항목 69달러부터 122개 항목을 다루는 특화 패널 299달러, 50종 넘는 암을 한 번에 보는 galleri 검사 799달러까지 갈린다. 안드로이드 앱 설명에 따르면 기기와 앱을 한 달 동안 무료로 써 본 뒤 결정할 수 있다.\", \"features\": [{\"name\": \"화면 없는 밴드와 연 구독\", \"detail\": \"기기값을 따로 받지 않고 밴드와 충전기를 구독에 포함해 준다. 요금제는 one 연 199달러, peak 연 239달러, life 연 359달러 세 가지이며 언제든 바꿀 수 있다고 안내한다.\"}, {\"name\": \"수면·회복·스트레인 점수\", \"detail\": \"심박변이도와 안정 시 심박수, 수면, 호흡수를 재서 회복 점수를 1에서 99퍼센트로, 수면 점수를 0에서 100퍼센트로, 그날의 운동 부하를 0에서 21까지의 스트레인 점수로 매일 내준다.\"}, {\"name\": \"blood pressure insights\", \"detail\": \"매일의 수축기와 이완기 혈압 추정치를 보여 주는 기능이며 가장 비싼 life 요금제에만 들어간다. fda가 2025년 7월에 문제 삼은 바로 그 기능이고, 지금은 의료기기가 아니며 진단이나 관리에 쓸 수 없다는 문구가 함께 붙어 있다. 임신 중이거나 혈압약을 먹는 사람은 쓰지 말라고 적혀 있다.\"}, {\"name\": \"healthspan과 whoop age\", \"detail\": \"생활 습관을 근거로 몸의 나이와 노화 속도를 숫자로 보여 주는 기능이다. 만 18세 미만은 쓸 수 없고 의료 목적이 아니라 웰니스 목적이라고 표기돼 있다.\"}, {\"name\": \"심전도와 불규칙 심박 알림\", \"detail\": \"whoop mg 기기로 심전도를 측정하고 불규칙한 심박을 알려 주는 기능이다. 규제를 받는 기능이라 나라마다 쓸 수 있는지가 다르며, 한국에서 접속하면 해당 지역에서는 제공되지 않는다고 표시된다.\"}, {\"name\": \"whoop advanced labs\", \"detail\": \"앱에서 혈액검사를 예약해 quest diagnostics 2,000여 곳에서 피를 뽑고, 임상의가 결과를 검토해 실행 계획을 붙여 주는 상품이다. 구독이나 밴드가 없어도 살 수 있다고 회사가 직접 내세운다. 애리조나, 하와이, 와이오밍, 노스다코타, 사우스다코타에서는 검사를 받을 수 없다.\"}, {\"name\": \"galleri 암 조기 발견 검사\", \"detail\": \"grail의 검사로 50종이 넘는 암을 한 번의 채혈로 살펴보는 상품이며 799달러다. 처방이 필요한 검사인데 면허 의사가 대신 처방을 내주므로 따로 진료를 받을 필요가 없다고 안내한다. 결과는 약 2주 뒤에 나오고 진단은 아니라고 못 박고 있다.\"}, {\"name\": \"whoop connected care\", \"detail\": \"whoop이 세운 별도 의사 법인 whoop physician services, p.c.가 메디케어 환자를 원격으로 진료하는 프로그램이다. 미국 안에서만 제공되며, 진료비와 본인부담금이 전액 면제되고 밴드와 혈압계도 무상으로 지급된다. 의료비는 메디케어가 이 법인에 직접 지급한다.\"}, {\"name\": \"한 달 무료 체험\", \"detail\": \"구글 플레이 앱 설명에 따르면 처음 쓰는 사람은 기기와 앱을 한 달 동안 무료로 써 볼 수 있다고 안내한다.\"}], \"differentiator\": \"apple watch와 fitbit은 기기를 먼저 사야 하고 화면으로 시간과 알림을 보는 손목시계인 반면, whoop은 기기값을 받지 않고 화면도 없애서 숫자를 앱에서만 보게 만들었다. 그 대신 구독을 끊으면 밴드가 쓸모없어지므로 매출이 전부 구독에 걸려 있다. 반지 형태로 수면과 회복을 재는 oura와는 재는 항목이 상당히 겹치며, 이 부분만 놓고 보면 크게 다르지 않다. 진짜 차이는 다른 데 있다. whoop은 별도 의사 법인을 세워 미국 정부의 메디케어 지불 모형에 참가 기관으로 들어갔고, 소비자가 돈을 내는 구조 밖에서 정부가 진료비를 대는 두 번째 매출선을 만들었다. 손목 웨어러블 회사 가운데 자기 이름을 단 의사 법인을 세우고 메디케어에 진료비를 청구하는 곳은 확인한 범위에서 whoop뿐이다.\", \"team\": [{\"name\": \"will ahmed\", \"role\": \"공동 창업자 겸 ceo\", \"background\": \"하버드 재학 시절 운동선수였고 2012년에 학교 창업 지원 조직에서 회사를 시작했다. 출처는 위키백과이며 1차 자료로 확인하지는 못했다.\"}, {\"name\": \"john capodilupo\", \"role\": \"공동 창업자\", \"background\": \"2012년 창업에 함께 참여했다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"aurelian nicolae\", \"role\": \"공동 창업자\", \"background\": \"2012년 창업에 함께 참여했다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"robin berzin\", \"role\": \"의료 자문위원\", \"background\": \"기능의학 진료 체인 parsley health를 세우고 이끄는 의사이며, 회사가 advanced labs 소개 페이지에 자문위원으로 올려 두었다.\"}, {\"name\": \"dan henderson\", \"role\": \"의료 자문위원\", \"background\": \"brigham and women's hospital의 1차 진료 의사이며, 회사가 advanced labs 소개 페이지에 자문위원으로 올려 두었다.\"}, {\"name\": \"hazel wallace\", \"role\": \"의료 자문위원\", \"background\": \"영국 국민보건서비스에서 일하던 의사이며 the food medic을 만들었다고 회사 페이지에 적혀 있다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"softbank로부터 2억 달러를 받았고 이때 기업가치가 36억 달러로 매겨졌다.\", \"when\": \"2021-08\", \"source\": \"위키백과가 인용한 보도. 1차 보도자료는 직접 확인하지 못했다.\"}, {\"type\": \"funding\", \"detail\": \"시리즈 g로 5억 7,500만 달러를 받아 기업가치가 101억 달러가 됐다. 의료기기 회사 abbott이 이 라운드에 참여했다.\", \"when\": \"2026-03\", \"source\": \"new york times 2026년 3월 31일자 기사와 massdevice 2026년 4월 1일자 기사. 위키백과의 각주를 통해 확인했고 기사 본문은 직접 열지 못했다.\"}, {\"type\": \"regulatory\", \"detail\": \"fda가 blood pressure insights 기능에 대해 경고 서한을 보냈다. 혈압을 재는 일 자체가 고혈압과 저혈압의 진단에 붙어 있으므로 의료기기에 해당하며, 허가나 신고 없이 팔았으므로 제품이 불량표시 상태라고 판단했다. 웰니스 제품이라는 회사 주장은 혈압 측정이 저위험이 아니라는 이유로 받아들이지 않았고, 15영업일 안에 시정 계획을 내지 않으면 압류와 판매 금지, 과징금으로 갈 수 있다고 통지했다.\", \"when\": \"2025-07-14\", \"source\": \"fda 경고 서한 원문(공개 문서)\"}, {\"type\": \"regulatory\", \"detail\": \"whoop physician services, p.c.라는 별도 의사 법인을 세워 미국 메디케어 혁신센터의 access 모형에 참가 기관으로 들어갔다. 이 모형은 2026년 7월 5일에 시작해 10년 동안 운영되며, 고혈압과 고지혈증, 비만, 당뇨, 만성 신장질환 같은 만성질환을 병원 밖에서 관리하는 조직에 성과에 따라 돈을 지급한다.\", \"when\": \"2026-08\", \"source\": \"whoop connected care 진료 약관(2026년 8월 5일 갱신)과 동의서, 그리고 cms의 access 모형 설명 페이지\"}, {\"type\": \"partnership\", \"detail\": \"quest diagnostics의 전국 2,000여 개 채혈 시설과 grail의 galleri 암 검사를 앱 안에 붙여 혈액검사 상품을 만들었다.\", \"when\": \"2026-09\", \"source\": \"whoop advanced labs 소개 페이지와 galleri 상품 페이지\"}, {\"type\": \"customers\", \"detail\": \"미국 아이폰 앱스토어에서 평점 4.8에 평가가 74,784개이고, 구글 플레이에서는 평점 4.7에 리뷰 28,200개, 설치 100만 회 이상이다. 앱은 무료이며 밴드가 있어야 쓸 수 있다.\", \"when\": \"2026-09\", \"source\": \"애플 itunes 조회 api와 구글 플레이 앱 페이지를 직접 확인\"}], \"caveats\": \"회사가 스스로 낸 수치와 제삼자가 확인한 수치를 갈라 볼 필요가 있다. 홈페이지에 걸린 매일 착용하면 주당 활동이 91분 늘고 수면이 2.3시간 늘며 심박변이도가 10퍼센트 넘게 높아진다는 문구는 회사가 자기 회원 데이터로 낸 것이고 별표 각주가 붙어 있으며, 제삼자가 검증한 결과가 아니다. 회원 수와 매출은 아예 공개하지 않으므로 규모는 앱 평가 수와 투자 라운드로만 짐작할 수 있다. 시리즈 g의 5억 7,500만 달러와 101억 달러라는 숫자는 new york times와 massdevice 보도에 근거하지만 이번 조사에서 기사 본문을 직접 열지 못했고 위키백과의 각주로만 확인했다. 규제 쪽에는 짚어야 할 대목이 더 있다. fda는 2025년 7월 14일에 혈압 기능을 두고 경고 서한을 보냈고 회사는 cnbc를 통해 fda가 권한을 넘어섰다고 반박했는데, 2026년 9월 현재까지 그 기능은 내려가지 않았고 홈페이지에서도 매일의 혈압 인사이트를 받으라고 계속 광고하고 있다. 달라진 것은 의료기기가 아니고 진단이나 관리에 쓸 수 없다는 면책 문구가 붙은 점뿐이다. 여기에 connected care 동의서를 보면, 메디케어 환자에게 무상으로 주는 밴드에 바로 그 blood pressure insights 기능이 포함된다고 명시돼 있고, 밴드와 혈압계를 받지 않으면 진료 자체를 받을 수 없다고 적혀 있다. 진료 약관은 이 진료가 인공지능 기술로 제공되며 제3자의 대규모 언어모형이 쓰인다고 밝히면서, 그 결과물이 틀리거나 없는 사실을 지어낼 수 있고 사람을 대신하지 못하며 정보 제공용일 뿐이라고 대문자로 경고하고 있다. 진료 과실 책임의 상한도 100달러로 걸어 두었다. 확인하지 못한 것도 있다. connected care 소개 페이지는 사이트 아래쪽에 연결 주소가 남아 있으나 접속하면 없는 페이지로 나오며, 지금 공개된 것은 법률 문서 세 건뿐이다. cms 쪽에서 access 모형 참가 기관 명단을 찾지 못해, whoop의 참가 사실은 회사가 낸 법률 문서로만 확인했다. 요금제 값은 접속 위치 때문에 화면에는 원화로 표시됐고, 달러 값은 같은 페이지가 내려받는 데이터에서 확인했다.\", \"for_us\": \"이 회사에서 3개월과 소프트웨어 인력이라는 조건 안에 들어오는 것과 밖에 있는 것을 먼저 갈라야 한다. 밴드와 혈압계 같은 하드웨어, 전국 채혈망을 낀 혈액검사, 메디케어에 진료비를 청구하는 의사 법인은 전부 조건 밖이다. healthspan과 whoop age는 우리 앱의 건강 나이와 같은 것이므로 제외 대상이다. 그러면 세 가지가 남는다. 첫째, whoop이 지금 옮겨 가고 있는 방향 자체가 참고가 된다. 수치를 보여 주는 데서 멈추지 않고 그 수치를 근거로 사람이 개입하는 층을 위에 얹고 있는데, 개입의 상당 부분은 앱 화면에서 일어나는 일이다. 혈액검사 결과를 임상의가 검토해 실행 계획으로 돌려주는 흐름이 그 예이며, 우리 앱에는 이미 검진 수치와 식단 기록이 있으므로 재료는 갖춰져 있다. 둘째, advanced labs가 구독도 밴드도 필요 없다고 내세우는 대목이다. 웨어러블 회사가 자기 기기를 쓰지 않는 사람에게도 팔 수 있는 건강 상품을 따로 만들었다는 뜻이며, 우리도 걸음 데이터 밖에서 앱을 열 이유를 하나 더 만들 수 있다는 근거가 된다. 셋째이자 가장 실용적인 것은 규제선을 보여 주는 문서다. fda 경고 서한은 혈압처럼 몸의 수치를 추정해 보여 주면 표현을 어떻게 하든 의료기기가 된다고 못 박았고, 반대로 어디까지가 웰니스인지도 같은 문서에서 읽어 낼 수 있다. 우리가 미국에서 3개월 안에 붙일 기능은 이 선을 넘지 않아야 하므로, 기능을 고르기 전에 이 서한을 기준 문서로 쓰는 편이 낫다. 한 달 무료 체험처럼 진입 문턱을 없애는 방식도 참고할 만하지만, 우리는 줄 하드웨어가 없으므로 그대로 옮겨 오지는 못한다.\", \"screenshots\": [{\"file\": \"whoop_membership.png\", \"caption\": \"요금제 비교 페이지다. one, peak, life 세 가지가 나란히 놓여 있고 요금제마다 밴드와 충전기가 포함된다는 점, 위 요금제로 갈수록 healthspan과 심전도, 혈압 인사이트가 더해지는 구조를 보여 준다. 한국에서 접속했기 때문에 값이 원화로 표시돼 있으며, 달러 값은 같은 페이지의 데이터에서 확인했다.\", \"from\": \"https://www.whoop.com/us/en/membership/\"}, {\"file\": \"whoop_labs.png\", \"caption\": \"혈액검사 상품 목록이다. 53개 항목을 보는 기본 패널이 69달러, 75개 항목을 정기적으로 보는 구독형 패널이 199달러로 붙어 있고, 세전 의료비 계좌로 결제할 수 있다는 표시가 상품마다 달려 있다.\", \"from\": \"https://shop.whoop.com/us/en/advanced-labs/panels/\"}, {\"file\": \"whoop_connected_care.png\", \"caption\": \"whoop physician services, p.c.의 진료 약관 첫 화면이다. 웨어러블 회사가 자기 이름을 단 의사 법인을 세우고 진료 약관을 따로 내걸었다는 사실 자체를 보여 주며, 2026년 8월 5일에 갱신됐다.\", \"from\": \"https://www.whoop.com/us/en/connected-care-terms-of-care/\"}, {\"file\": \"whoop_ios.png\", \"caption\": \"미국 아이폰 앱스토어 페이지다. 앱은 무료이고 평점 4.8에 평가가 74,784개이며, 밴드가 있어야 쓸 수 있다는 점이 설명에 적혀 있다.\", \"from\": \"https://apps.apple.com/us/app/whoop/id933944389\"}], \"sources\": [{\"title\": \"whoop 요금제 비교 페이지\", \"url\": \"https://www.whoop.com/us/en/membership/\", \"note\": \"one, peak, life 세 요금제의 구성과 기능 차이, 각 기능에 붙은 의료 관련 면책 문구를 확인했다. 달러 값 199, 239, 359는 이 페이지가 내려받는 데이터에서 확인했다.\"}, {\"title\": \"whoop 홈페이지\", \"url\": \"https://www.whoop.com/us/en/\", \"note\": \"매일의 혈압 인사이트를 지금도 광고하고 있다는 점과, 매일 착용 시 활동과 수면, 심박변이도가 늘어난다는 회사 주장 문구를 확인했다.\"}, {\"title\": \"whoop advanced labs 소개 페이지\", \"url\": \"https://www.whoop.com/us/en/advanced-labs/\", \"note\": \"검사 흐름 세 단계, 임상의가 결과를 검토해 실행 계획을 준다는 설명, quest diagnostics 2,000여 곳, 구독과 밴드가 없어도 된다는 문구, 검사를 못 받는 다섯 개 주, 의료 자문위원 명단을 확인했다.\"}, {\"title\": \"whoop advanced labs 상품 목록\", \"url\": \"https://shop.whoop.com/us/en/advanced-labs/panels/\", \"note\": \"기본 패널 69달러, 구독형 종합 패널 199달러, 특화 패널 299달러라는 값을 확인했다.\"}, {\"title\": \"galleri 암 조기 발견 검사 상품 페이지\", \"url\": \"https://shop.whoop.com/us/en/advanced-labs/panels/grail-galleri-cancer-test/\", \"note\": \"799달러라는 값과, 면허 의사가 처방을 대신 내주므로 따로 진료를 받지 않아도 된다는 안내를 확인했다.\"}, {\"title\": \"whoop connected care 진료 약관\", \"url\": \"https://www.whoop.com/us/en/connected-care-terms-of-care/\", \"note\": \"별도 의사 법인 whoop physician services, p.c.의 존재, 메디케어 access 모형 참가, 진료가 인공지능과 제3자 대규모 언어모형으로 제공된다는 사실, 책임 상한 100달러를 확인했다. 2026년 8월 5일 갱신본이다.\"}, {\"title\": \"whoop connected care 진료 동의서\", \"url\": \"https://www.whoop.com/us/en/connected-care-consent-to-care/\", \"note\": \"진료비와 본인부담금 전액 면제, 밴드와 혈압계 무상 지급, 그 밴드에 blood pressure insights가 포함된다는 명시, 메디케어가 이 법인에 직접 지급한다는 조항, 90일 뒤 이탈 가능 조건을 확인했다.\"}, {\"title\": \"fda가 whoop에 보낸 경고 서한\", \"url\": \"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/whoop-inc-709755-07142025\", \"note\": \"2025년 7월 14일자이며, 혈압 기능이 왜 의료기기로 분류되는지와 웰니스 제품 주장이 왜 받아들여지지 않았는지를 확인했다.\"}, {\"title\": \"fda 경고 서한 검색 목록\", \"url\": \"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/compliance-actions-and-activities/warning-letters?search_api_fulltext=whoop\", \"note\": \"whoop 앞으로 발송된 경고 서한의 발송일과 담당 부서를 확인했다.\"}, {\"title\": \"cms access 모형 설명 페이지\", \"url\": \"https://www.cms.gov/priorities/innovation/innovation-models/access-model\", \"note\": \"2026년 7월 5일 시작해 10년간 운영되는 모형이라는 점, 네 갈래 임상 트랙과 다루는 질환, 성과에 따라 지급하는 구조를 확인했다. 참가 기관 명단은 찾지 못했다.\"}, {\"title\": \"위키백과 whoop 항목\", \"url\": \"https://en.wikipedia.org/wiki/whoop_(company)\", \"note\": \"창업 연도와 창업자, 본사, 2021년과 2026년 투자 라운드, 2025년 기기 업그레이드 정책 논란을 확인했다. 투자 라운드의 원 출처는 new york times 2026년 3월 31일자와 massdevice 2026년 4월 1일자 기사이며, fda 반박 발언의 원 출처는 cnbc 2025년 7월 15일자 기사다.\"}, {\"title\": \"애플 앱스토어 조회 결과와 구글 플레이 앱 페이지\", \"url\": \"https://apps.apple.com/us/app/whoop/id933944389\", \"note\": \"아이폰 평점 4.8에 평가 74,784개, 안드로이드 평점 4.7에 리뷰 28,200개와 설치 100만 회 이상, 한 달 무료 체험 안내를 확인했다.\"}]}"},{"slug":"withings","name":"Withings","one_liner":"체중계와 혈압계처럼 집에서 쓰는 건강 측정 기기를 소비자에게 팔고, 그 측정값을 읽어 주는 앱에 월 구독을 붙이며, 2026년부터는 같은 기기로 메디케어 환자의 만성질환 진료까지 직접 제공하기 시작한 프랑스 회사다.","sells_to":"mixed","seen_in":[{"issue":"33","section":3,"headline":"정부가 정한 수가를 보고 디지털 헬스 기업 대부분이 ACCESS 모델 신청을 접은 가운데, 필자가 가장 눈여겨보는 참여자로 Whoop과 함께 소비자용 기기 회사인 Withings를 지목한 대목에서 나왔다."}],"card":{"problem":"고혈압이나 당뇨처럼 매일 숫자를 확인해야 하는 병을 앓아도, 미국에서는 1년에 몇 번 되는 진료 사이의 기간을 아무도 들여다보지 않는다. 기기를 사서 혼자 재는 사람은 그 값을 어떻게 해석하고 무엇을 바꿔야 하는지까지는 알기 어렵다.","solution":"통신 기능이 들어간 혈압계와 체중계를 집으로 보내고, 그 값을 매일 확인하는 임상팀을 붙였다. 소비자에게는 기기를 팔고 앱 구독을 붙여 팔며, 메디케어 환자에게는 기기와 진료를 묶어 정부에게서 돈을 받는다.","price":"기기를 사는 것이 기본 경로다. 혈압계 BPM Vision은 179.95달러, 체중계 BodyScan 2는 599.95달러이고, 앱 구독인 Withings+는 월 9.99달러 또는 연 99.99달러다. 메디케어 대상 진료 프로그램인 Withings Medical은 본인 부담이 0달러라고 안내한다.","tags":["가정용 측정 기기","혈압계","앱 월 구독","메디케어 진료","원격 환자 모니터링"],"headline_traction":"2026년 4월에 CMS의 ACCESS 모델 첫 참여자로 승인받아 50개 주에서 메디케어 환자를 직접 맡게 됐고, 7월 8일에 진료 서비스인 Withings Medical을 열었다.","watch":"매출과 사용자 수는 모두 회사가 스스로 낸 수치이며 보도자료 각주에 내부 자료 기준이라고 적혀 있다. ACCESS 수가로 실제 수지가 맞는지는 아직 아무도 확인하지 못했다."},"screenshots":[{"file":"withings_home.png","caption":"미국 공식 사이트 첫 화면이다. 시계와 체중계, 혈압 측정 기기가 함께 놓여 있어 무엇을 파는 회사인지 바로 보인다.","from":"https://www.withings.com/us/en/"},{"file":"withings_plus.png","caption":"앱 구독인 Withings+ 안내 화면이다. 심장전문의 심전도 판독과 AI 건강 비서를 구독 혜택으로 내세운다.","from":"https://www.withings.com/us/en/withings-plus"},{"file":"withings_medical.png","caption":"메디케어 대상 진료 서비스 Withings Medical의 소비자용 첫 화면이다. Original Medicare 가입자는 본인 부담이 0달러라고 못 박아 놓았다.","from":"https://www.withings.com/medical"}],"q":"{\"slug\": \"withings\", \"name\": \"withings\", \"one_liner\": \"체중계와 혈압계처럼 집에서 쓰는 건강 측정 기기를 소비자에게 팔고, 그 측정값을 읽어 주는 앱에 월 구독을 붙이며, 2026년부터는 같은 기기로 메디케어 환자의 만성질환 진료까지 직접 제공하기 시작한 프랑스 회사다.\", \"site\": \"https://www.withings.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"33\", \"section\": 3, \"headline\": \"정부가 정한 수가를 보고 디지털 헬스 기업 대부분이 access 모델 신청을 접은 가운데, 필자가 가장 눈여겨보는 참여자로 whoop과 함께 소비자용 기기 회사인 withings를 지목한 대목에서 나왔다.\"}], \"card\": {\"problem\": \"고혈압이나 당뇨처럼 매일 숫자를 확인해야 하는 병을 앓아도, 미국에서는 1년에 몇 번 되는 진료 사이의 기간을 아무도 들여다보지 않는다. 기기를 사서 혼자 재는 사람은 그 값을 어떻게 해석하고 무엇을 바꿔야 하는지까지는 알기 어렵다.\", \"solution\": \"통신 기능이 들어간 혈압계와 체중계를 집으로 보내고, 그 값을 매일 확인하는 임상팀을 붙였다. 소비자에게는 기기를 팔고 앱 구독을 붙여 팔며, 메디케어 환자에게는 기기와 진료를 묶어 정부에게서 돈을 받는다.\", \"price\": \"기기를 사는 것이 기본 경로다. 혈압계 bpm vision은 179.95달러, 체중계 bodyscan 2는 599.95달러이고, 앱 구독인 withings+는 월 9.99달러 또는 연 99.99달러다. 메디케어 대상 진료 프로그램인 withings medical은 본인 부담이 0달러라고 안내한다.\", \"tags\": [\"가정용 측정 기기\", \"혈압계\", \"앱 월 구독\", \"메디케어 진료\", \"원격 환자 모니터링\"], \"headline_traction\": \"2026년 4월에 cms의 access 모델 첫 참여자로 승인받아 50개 주에서 메디케어 환자를 직접 맡게 됐고, 7월 8일에 진료 서비스인 withings medical을 열었다.\", \"watch\": \"매출과 사용자 수는 모두 회사가 스스로 낸 수치이며 보도자료 각주에 내부 자료 기준이라고 적혀 있다. access 수가로 실제 수지가 맞는지는 아직 아무도 확인하지 못했다.\"}, \"problem\": \"한국에서 고혈압 약을 먹는 사람은 몇 달에 한 번 동네 의원에 가서 혈압을 재고 처방을 다시 받으면 되고, 그 값은 진료 기록으로 남는다. 미국에서는 진료 한 번에 드는 돈과 예약 대기가 커서 만성질환자가 의료진을 만나는 횟수 자체가 적고, 그 사이에 혈압이 오르거나 체중이 늘어도 이를 보는 사람이 없다. 기기를 사서 혼자 재는 사람도 있지만, 숫자가 나와도 그것이 약을 바꿀 일인지 그냥 둘 일인지 판단해 줄 사람이 붙어 있지 않다. 심혈관과 신장, 대사 질환은 미국에서 만성질환 부담을 키우는 가장 큰 축이고, 미국심장협회는 이를 공중보건 비상 상황이라고 부른다. glp-1 계열 비만 치료제처럼 효과가 확인된 약이 이미 있는데도 널리 쓰이지 못하는 이유를, withings는 약을 안전하게 조절할 근거가 되는 연속 측정값이 없기 때문이라고 정리한다.\", \"solution\": \"소비자 쪽 흐름은 단순하다. 사용자가 혈압계나 체중계, 하이브리드 시계를 사서 집에 두면 측정값이 withings 앱으로 자동으로 올라가고, 앱 자체는 무료다. 여기에 월 9.99달러 또는 연 99.99달러짜리 withings+ 구독을 붙이면 ai 건강 비서와 심전도 심장전문의 판독, 영양 코칭 같은 기능이 열리며, 기기를 사면 1개월은 무료로 준다. 2026년 7월부터는 메디케어 대상 진료 서비스인 withings medical이 따로 열렸는데, 이쪽은 사용자가 5분짜리 가입을 마치면 혈액 검사로 기준값을 잡고, 그 결과에 맞춰 통신형 혈압계 bpm pro 2와 체중계 body pro를 무료로 보내 준다. 그다음부터는 전담 의료진이 매일 올라오는 값을 보고, 수치가 흔들리면 같은 주 안에 먼저 연락해 약을 조정하거나 생활 습관을 코칭하고, 처방은 약국으로 바로 보낸다. 회사는 이 프로그램을 original medicare 가입자 기준 본인 부담 0달러로 안내하며, 검사비는 메디케어에 청구하되 메디케어가 보장하지 않는 항목에는 일부 본인 부담이 생길 수 있다고 밝힌다.\", \"features\": [{\"name\": \"가정용 측정 기기 묶음\", \"detail\": \"혈압계 bpm vision이 179.95달러, 체중계 bodyscan 2가 599.95달러, 하이브리드 시계 scanwatch 2가 369.95달러, 여러 값을 한 번에 재는 beamo가 249.95달러, 수면 측정 매트 sleep이 199.95달러다. 미국에서는 거의 모든 기기를 세제 혜택 의료비 계좌인 fsa와 hsa로 결제할 수 있다.\"}, {\"name\": \"withings 앱\", \"detail\": \"기기 값을 한곳에 모으는 무료 앱이다. apple health와 health connect, strava, myfitnesspal에 더해 abbott의 연속혈당측정기인 lingo까지 연결해 체중과 활동, 수면, 혈압, 생리 주기를 한 화면에서 본다.\"}, {\"name\": \"withings+ 구독\", \"detail\": \"앱 안에서 파는 유료 구독이며 월 9.99달러 또는 연 99.99달러다. 사용자의 측정 이력을 기억하는 ai 건강 비서, 심전도 판독, 체중과 영양을 잇는 nutricare, 노화 정도 평가가 여기에 들어간다. 회사는 2025년에 이 구독의 매출이 거의 두 배가 됐다고 밝혔다.\"}, {\"name\": \"심전도 심장전문의 판독\", \"detail\": \"scanwatch로 잰 심전도를 미국 전문의 자격을 가진 심장전문의가 읽어 준다. heartbeat health와 함께 제공하며, 앱스토어에는 59.99달러짜리 별도 결제 항목으로도 올라 있다.\"}, {\"name\": \"withings health solutions\", \"detail\": \"병원과 디지털 헬스 기업, 연구기관에 통신형 기기와 원격 환자 모니터링 체계를 파는 사업부다. 기기 배송과 기술 연동, 전담 고객 담당자까지 묶어 제공하며, 회사는 이 사업부가 전체 매출의 17%를 만든다고 밝혔다.\"}, {\"name\": \"withings medical\", \"detail\": \"2026년 7월 8일에 연 진료 서비스다. 의료진으로 구성된 withings medical group이 개인별 치료 계획을 세우고, 진료 지침에 따라 약을 처방하고 조정하며, 생활 습관 변화를 돕는다. 고혈압과 당뇨, 비만을 우선 다루고 환자의 기존 주치의를 대체하지 않는 방식으로 설계했다.\"}, {\"name\": \"조건별 주간 레슨\", \"detail\": \"가입자의 주된 질환에 맞춰 짧은 학습 자료를 매주 보낸다. 혈압, 혈당, 체중이라는 세 갈래에 더해 누구에게나 공통인 걷기와 호흡, 수면, 복약 습관 자료가 있다.\"}, {\"name\": \"다른 access 참여자에게 기기 공급\", \"detail\": \"access 도구 목록을 통해 다른 참여 기업도 withings의 fda 인증 통신형 기기를 쓸 수 있게 했다. 혈압과 환자가 직접 답한 내용을 측정 시점에 함께 받는 bpm pro 2가 대표 제품이다.\"}, {\"name\": \"의뢰한 의사에게 주는 조정 수당\", \"detail\": \"환자를 withings medical로 의뢰한 주치의는 진료 경과 검토 한 건당 최대 30달러, 초기 등록 지원에 10달러를 받는다. 환자 한 명당 연 3회까지이며 환자의 추가 부담은 없다고 안내한다.\"}], \"differentiator\": \"같은 access 명단에 올라 있는 whoop과 비교하면 차이가 분명하다. whoop은 손목 밴드 하나로 초기 심혈관 대사 트랙만 맡았고, withings는 초기 트랙과 본격 심혈관 신장 대사 트랙을 둘 다 맡았다. 이는 이미 당뇨나 만성 신장질환, 죽상경화성 심혈관질환을 앓는 환자까지 받는다는 뜻이고, 혈압계와 체중계라는 치료 판단에 바로 쓰이는 측정 기기를 갖고 있기에 가능한 선택이다. oura나 whoop이 구독료를 주된 수입으로 삼는 것과 달리 withings는 2025년 매출의 66%가 fda 인증 의료기기에서 나왔다고 밝히고 있으며, 병원과 프로그램에 기기를 대는 b2b 사업을 되사기 이전부터 쌓아 왔다. 결과적으로 소비자에게 기기를 파는 회사에서 정부에게 진료비를 받는 회사로 넘어가는 길목에, 다른 소비자 기기 회사보다 기기와 임상 근거를 더 많이 들고 서 있다.\", \"team\": [{\"name\": \"eric carreel\", \"role\": \"chairman and co-founder\", \"background\": \"2008년에 withings를 공동 창업했고, 2016년 nokia가 1억 6,400만 유로에 인수한 회사를 2018년에 직접 되사 왔다.\"}, {\"name\": \"patrick sheehan\", \"role\": \"vice president of value-based care\", \"background\": \"\"}, {\"name\": \"nisha basu\", \"role\": \"clinical advisor, withings medical (md, mph)\", \"background\": \"\"}, {\"name\": \"mikela yarawamai\", \"role\": \"medical director, withings medical group (md)\", \"background\": \"\"}], \"traction\": [{\"type\": \"regulatory\", \"detail\": \"cms의 access 모델 첫 참여자로 승인받았다. 초기 심혈관 신장 대사 트랙과 심혈관 신장 대사 트랙 두 가지를 50개 주에서 맡으며, 7월 5일 모델 시작과 함께 메디케어 가입자를 받기 시작한다고 밝혔다.\", \"when\": \"2026-04\", \"source\": \"withings 보도자료(2026년 4월 20일)와 cms의 access 승인 신청자 명단. 명단에 'withings medical group', 트랙은 eckm과 ckm으로 올라 있다.\"}, {\"type\": \"partnership\", \"detail\": \"진료 서비스 withings medical을 미국에서 열었다. 측정만 하던 회사에서 진료를 제공하는 회사로 넘어가는 첫걸음이라고 밝혔고, 고혈압과 당뇨, 비만부터 다룬다.\", \"when\": \"2026-07\", \"source\": \"withings 보도자료(2026년 7월 8일)\"}, {\"type\": \"revenue\", \"detail\": \"2025년 연간 흑자를 달성했다고 발표했다. 2018년 nokia로부터 되산 뒤 전 세계 매출이 약 90% 늘었고, 미국이 가장 큰 시장이며, 2025년 매출의 66%가 fda 인증 의료기기에서 나왔다고 밝혔다.\", \"when\": \"2026-04\", \"source\": \"withings 기업 보도자료. 회사가 스스로 낸 수치이며 각주에 내부 자료 기준이라고 적혀 있다.\"}, {\"type\": \"customers\", \"detail\": \"전 세계 활성 사용자가 1,500만 명이고 그 가운데 360만 명이 의료 목적 사용자로 분류된다고 밝혔다. 2025년 한 해에 기기가 기록한 측정이 10억 건이 넘고 그중 약 35%인 3억 6,000만 건이 임상 또는 의료 수준의 측정이라고 설명했다.\", \"when\": \"2026-04\", \"source\": \"withings 기업 보도자료. 회사가 스스로 낸 수치다.\"}, {\"type\": \"customers\", \"detail\": \"병원과 프로그램에 기기를 대는 b2b 사업에서 등록 환자가 74만 명을 넘었다고 밝혔다. 2018년 되사기 전에는 약 2만 5,500명이었다고 비교했고, 비만 관리 프로그램에 등록된 환자만 50만 명이 넘는다고 덧붙였다.\", \"when\": \"2026-04\", \"source\": \"withings 기업 보도자료. 회사가 스스로 낸 수치이며 파트너로 medstar health, calibrate, 9amhealth를 들었다.\"}, {\"type\": \"revenue\", \"detail\": \"withings+ 구독 매출이 2025년에 거의 두 배가 됐다고 밝혔다.\", \"when\": \"2026-04\", \"source\": \"withings 기업 보도자료. 회사가 스스로 낸 수치이며 금액은 공개하지 않았다.\"}, {\"type\": \"funding\", \"detail\": \"2019년 이후 6,100만 유로, 미화로 약 7,142만 달러를 조달했으며 전 세계 인력은 400명이라고 밝혔다.\", \"when\": \"2026-04\", \"source\": \"withings 기업 보도자료\"}, {\"type\": \"traffic\", \"detail\": \"미국 앱스토어에서 5점 만점에 4.6점이고 평가가 36만 4,000건이다. 구글 플레이에서는 4.3점에 평가 22만 6,000건이며 설치가 500만 회를 넘었다.\", \"when\": \"2026-09\", \"source\": \"미국 앱스토어와 구글 플레이 제품 페이지\"}, {\"type\": \"award\", \"detail\": \"ces 혁신상을 28번 받았다고 밝혔다.\", \"when\": \"2026-04\", \"source\": \"withings 보도자료에 실린 patrick sheehan의 발언. 회사가 스스로 낸 수치다.\"}], \"caveats\": \"매출 관련 수치는 모두 회사가 낸 자료이고, 기업 보도자료 끝에 재무 수치는 내부 자료를 바탕으로 한 대략값이라고 명시돼 있다. 활성 사용자 1,500만 명, 의료 사용자 360만 명, b2b 환자 74만 명, 92%에 이르는 기기 유지율 역시 제삼자가 확인한 값이 아니다. 홈페이지에 걸린 '사용자의 87%가 건강에 긍정적 영향을 받았다'는 문구는 2025년 6월에 자사 사용자 3,274명을 상대로 한 자체 설문 결과다. 사업부 소개 페이지에는 사용자가 100만 명이 넘는다고 적혀 있고 다른 페이지에는 1,500만 명이라고 적혀 있어, 같은 회사 안에서도 무엇을 세는지에 따라 숫자가 달라진다. 심전도 판독 소요 시간도 같은 페이지 안에서 24시간과 4시간으로 엇갈리게 적혀 있다. 뉴스레터가 다룬 맥락 자체가 더 큰 주의 사항이다. access 출범 당시 관심을 보인 68개 기업 가운데 22곳만 신청했고, 그 수가로 사업이 되는지에 대해 정부와 업계의 계산이 정면으로 엇갈린다. withings가 참여했다는 사실은 참여를 결정했다는 것일 뿐, 그 수가로 이익을 낸다는 증거가 아니다. cms도 명단에 오른 것이 참여를 보장하지 않는다고 밝히고 있다. 본인 부담 0달러라는 안내는 original medicare 가입자에게 적용되는 것이며, 회사가 환자 부담분을 스스로 면제하기로 한 결정이라 계속 유지될지는 별개 문제다. 소비자 기기 자체의 평가도 고르지 않아서, 자사 몰의 별점이 bodyscan 2는 5점 만점에 3.8점, 수면 측정 매트 sleep은 1점으로 표시돼 있다.\", \"for_us\": \"기기를 만드는 일은 우리 범위 밖이지만, 이 회사가 소비자에게 실제로 파는 가치는 기기가 아니라 '내 숫자를 매일 누군가 보고 있다'는 경험이다. 그 부분은 소프트웨어만으로 흉내 낼 수 있다. 첫째, withings medical의 화면 구성은 우리가 3개월 안에 만들 수 있는 형태에 가깝다. 오늘 할 일 목록, 질환별 주간 레슨, 측정값 추이, 담당자와 나누는 대화창이 한 앱 안에 있고, 이 가운데 레슨과 추이 화면은 기기 없이도 만들 수 있다. 둘째, 조건별 레슨 트랙을 혈압, 혈당, 체중이라는 세 갈래로만 나눈 점은 참고할 만하다. 주제를 늘리지 않고 한 사람에게 하나만 붙인다. 셋째, 기기를 사면 구독 1개월을 무료로 주고 심전도 판독 같은 단건 결제를 따로 두는 방식은, 무료 앱에서 유료 기능으로 넘어가는 경로를 설계할 때 참고할 수 있다. 넷째, 우리 앱은 기기가 없으므로 사용자가 이미 가진 기기와 앱의 값을 받아 오는 쪽이 현실적이며, withings 앱이 apple health와 health connect, lingo 연속혈당측정기까지 받아들이는 구조가 그 예시다. 다만 이 회사의 핵심 수입은 기기 판매와 정부 지불이므로, 앱 구독만으로 같은 것을 만들려 하면 값을 매길 근거가 약해진다는 점은 감안해야 한다.\", \"screenshots\": [{\"file\": \"withings_home.png\", \"caption\": \"미국 공식 사이트 첫 화면이다. 시계와 체중계, 혈압 측정 기기가 함께 놓여 있어 무엇을 파는 회사인지 바로 보인다.\", \"from\": \"https://www.withings.com/us/en/\"}, {\"file\": \"withings_plus.png\", \"caption\": \"앱 구독인 withings+ 안내 화면이다. 심장전문의 심전도 판독과 ai 건강 비서를 구독 혜택으로 내세운다.\", \"from\": \"https://www.withings.com/us/en/withings-plus\"}, {\"file\": \"withings_medical.png\", \"caption\": \"메디케어 대상 진료 서비스 withings medical의 소비자용 첫 화면이다. original medicare 가입자는 본인 부담이 0달러라고 못 박아 놓았다.\", \"from\": \"https://www.withings.com/medical\"}, {\"file\": \"withings_ios.png\", \"caption\": \"미국 앱스토어의 withings 앱 페이지다. 앱은 무료이고 월 9.99달러와 연 99.99달러짜리 구독, 59.99달러짜리 심전도 판독이 인앱 결제로 올라 있다.\", \"from\": \"https://apps.apple.com/us/app/withings-health-mate/id542701020\"}], \"sources\": [{\"title\": \"health tech nerds 33회차 3번 꼭지\", \"url\": \"\", \"note\": \"access 모델 신청 결과를 다루면서 필자가 whoop과 withings를 가장 눈여겨보는 참여자로 지목한 대목이다.\"}, {\"title\": \"cms, access model accepted applicants\", \"url\": \"https://www.cms.gov/priorities/innovation/access-model-accepted-applicants\", \"note\": \"정부 명단에서 'withings medical group'이 eckm과 ckm 트랙으로 올라 있는 것을 직접 확인했다.\"}, {\"title\": \"cms, access model 개요\", \"url\": \"https://www.cms.gov/priorities/innovation/innovation-models/access-model\", \"note\": \"모델이 성과에 연동된 지불 방식이고 2026년 7월 5일에 시작해 10년간 운영된다는 사실을 확인했다.\"}, {\"title\": \"cms, access model request for applications (pdf)\", \"url\": \"https://www.cms.gov/priorities/innovation/files/access-rfa.pdf\", \"note\": \"eckm과 ckm이 각각 어떤 환자를 받는지, 지불액에 통신형 혈압계 기기 값이 반영된다는 점을 확인했다.\"}, {\"title\": \"withings 보도자료, access 모델 승인\", \"url\": \"https://media-cdn.withings.com/press/press-releases/cms-access-model/pr_withings-accepted-into-cms-access-model.pdf\", \"note\": \"2026년 4월 20일 자료다. 50개 주 참여, 환자 본인 부담 면제, 다른 참여자에 대한 기기 공급 계획, patrick sheehan의 직함을 확인했다.\"}, {\"title\": \"withings 보도자료, withings medical 출시\", \"url\": \"https://media-cdn.withings.com/press/press-releases/withings-medical/withings-medical-us-pr.pdf\", \"note\": \"2026년 7월 8일 자료다. 진료 서비스의 범위와 eric carreel, nisha basu의 직함을 확인했다.\"}, {\"title\": \"withings 기업 보도자료, 2025년 연간 흑자\", \"url\": \"https://media-cdn.withings.com/press/press-releases/withings-nokia/withings_us_corporate%20story_2026.pdf\", \"note\": \"nokia 인수 금액과 되사기, 매출 구성, 사용자 수, b2b 환자 수, 조달 금액과 인력 규모를 확인했다. 모든 수치가 회사 내부 자료 기준이다.\"}, {\"title\": \"withings medical 소비자 페이지\", \"url\": \"https://www.withings.com/medical\", \"note\": \"가입 절차 네 단계, 배송되는 기기, 검사 항목, 본인 부담 안내, 의료진 구성, 질환별 주간 레슨을 확인했다.\"}, {\"title\": \"withings medical 의료진용 페이지\", \"url\": \"https://www.withings.com/en-us/pages/withings-medical\", \"note\": \"의뢰한 의사에게 주는 건당 30달러 조정 수당과 회사가 내세우는 규모 수치를 확인했다.\"}, {\"title\": \"withings+ 안내 페이지\", \"url\": \"https://www.withings.com/us/en/withings-plus\", \"note\": \"구독에 포함되는 기능과 heartbeat health와의 심전도 판독 제휴를 확인했다.\"}, {\"title\": \"withings health solutions 소개\", \"url\": \"https://www.withings.com/en-us/pages/about-withings-health-solutions\", \"note\": \"b2b 사업부의 범위와 eric carreel의 직함 표기를 확인했다.\"}, {\"title\": \"withings 미국 스토어\", \"url\": \"https://www.withings.com/us/en/\", \"note\": \"bodyscan 2, scanwatch 2, beamo, sleep, bpm vision의 판매 가격과 fsa, hsa 결제 가능 여부를 확인했다.\"}, {\"title\": \"미국 앱스토어, withings 앱\", \"url\": \"https://apps.apple.com/us/app/withings-health-mate/id542701020\", \"note\": \"별점과 평가 수, 인앱 결제 항목과 가격을 확인했다.\"}, {\"title\": \"구글 플레이, withings 앱\", \"url\": \"https://play.google.com/store/apps/details?id=com.withings.wiscale2\", \"note\": \"별점과 평가 수, 설치 수, 연동되는 외부 앱 목록을 확인했다.\"}]}"},{"slug":"zealthy","name":"Zealthy","one_liner":"비만 치료제를 비롯한 처방약을 온라인 문진과 화상 진료만으로 처방해 집으로 배송하고, 매달 회원비를 자동으로 청구하는 소비자 직접 결제형 원격진료 회사다.","sells_to":"consumer","seen_in":[{"issue":"33","section":21,"headline":"미국 법무부가 소송에서 새 신청서를 내면서 GLP-1 원격진료 회사 Zealthy가 파산에 가까워졌고, 창업자가 앞서 Cerebral에서도 같은 혐의를 받았다는 이력이 함께 소개됐다."}],"card":{"problem":"미국에서 비만 치료제는 한 달 약값이 1,000달러를 넘고 보험이 적용되지 않는 경우가 많아서, 의사를 만나 처방을 받는 일 자체가 비용과 대기 시간의 벽에 막힌다.","solution":"문진표를 채우면 원격으로 처방을 내주고 약을 집으로 보내 주며, 보험 적용을 대신 알아봐 주거나 보험 없이도 살 수 있는 조제 의약품을 매달 배송하는 구독 상품을 판다.","price":"체중 감량 회원비는 정가 월 135달러이고 첫 달 할인가는 49달러다. 약값은 따로 내며 세마글루타이드는 3개월치를 한 번에 사면 월 151달러부터, 보험이 적용되는 브랜드 약은 월 25달러부터다.","tags":["원격진료","비만 치료제","구독 결제","현금 결제","약 배송"],"headline_traction":"미국 법무부가 2026년 4월 13일 자산 동결과 법정관리인 선임을 요구하는 가처분 신청을 냈고, 심리는 2026년 10월 5일로 잡혀 있다.","watch":"회사가 광고하는 체중 감량 효과와 회원 후기는 전부 회사가 스스로 낸 것이고, 정부는 그 후기 가운데 상당수가 조작됐다고 주장한다."},"screenshots":[{"file":"zealthy_home.png","caption":"첫 화면이다. 상단에 첫 달 96달러 할인 안내가 걸려 있고 체중 감량, 불안과 우울, 피임, 발기부전 등 진료 영역을 골라 들어가게 돼 있다.","from":"https://getzealthy.com/"},{"file":"zealthy_weightloss.png","caption":"체중 감량 상품 설명 페이지다. 보험이 있으면 월 25달러부터, 보험 없이 세마글루타이드를 사면 월 151달러부터라는 값이 나란히 적혀 있다.","from":"https://getzealthy.com/weight-loss"},{"file":"zealthy_cancel.png","caption":"구독과 해지, 환불 정책 페이지다. 법인 이름이 FitRX, LLC이고 Zealthy가 그 상호라는 사실과 해지 절차가 여기에 적혀 있다.","from":"https://getzealthy.com/subscriptions-cancellations-refunds-policy"}],"q":"{\"slug\": \"zealthy\", \"name\": \"zealthy\", \"one_liner\": \"비만 치료제를 비롯한 처방약을 온라인 문진과 화상 진료만으로 처방해 집으로 배송하고, 매달 회원비를 자동으로 청구하는 소비자 직접 결제형 원격진료 회사다.\", \"site\": \"https://getzealthy.com\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"33\", \"section\": 21, \"headline\": \"미국 법무부가 소송에서 새 신청서를 내면서 glp-1 원격진료 회사 zealthy가 파산에 가까워졌고, 창업자가 앞서 cerebral에서도 같은 혐의를 받았다는 이력이 함께 소개됐다.\"}], \"card\": {\"problem\": \"미국에서 비만 치료제는 한 달 약값이 1,000달러를 넘고 보험이 적용되지 않는 경우가 많아서, 의사를 만나 처방을 받는 일 자체가 비용과 대기 시간의 벽에 막힌다.\", \"solution\": \"문진표를 채우면 원격으로 처방을 내주고 약을 집으로 보내 주며, 보험 적용을 대신 알아봐 주거나 보험 없이도 살 수 있는 조제 의약품을 매달 배송하는 구독 상품을 판다.\", \"price\": \"체중 감량 회원비는 정가 월 135달러이고 첫 달 할인가는 49달러다. 약값은 따로 내며 세마글루타이드는 3개월치를 한 번에 사면 월 151달러부터, 보험이 적용되는 브랜드 약은 월 25달러부터다.\", \"tags\": [\"원격진료\", \"비만 치료제\", \"구독 결제\", \"현금 결제\", \"약 배송\"], \"headline_traction\": \"미국 법무부가 2026년 4월 13일 자산 동결과 법정관리인 선임을 요구하는 가처분 신청을 냈고, 심리는 2026년 10월 5일로 잡혀 있다.\", \"watch\": \"회사가 광고하는 체중 감량 효과와 회원 후기는 전부 회사가 스스로 낸 것이고, 정부는 그 후기 가운데 상당수가 조작됐다고 주장한다.\"}, \"problem\": \"미국에서 비만 치료제로 쓰이는 glp-1 계열 약은 보험이 없으면 한 달에 1,000달러가 넘게 든다. 회사가 자기 사이트에 적어 둔 정가만 봐도 세마글루타이드는 월 1,349달러다. 한국은 전국민 건강보험이 있어서 아프면 동네 의원에 가면 되지만, 미국은 보험사마다 비만약을 보장 항목에서 빼는 일이 흔하고 보장이 되더라도 사전 승인 절차를 통과해야 한다. 그래서 약을 받으려면 의사를 만나는 일, 보험사와 다투는 일, 약국에서 재고를 찾는 일을 환자가 각각 따로 감당해야 한다. 이 세 가지를 한 번에 대신해 주고 값을 월 정액으로 묶어 파는 자리가 미국의 소비자 직접 결제형 원격진료 시장이며, zealthy는 그 자리에서 성장한 회사다.\", \"solution\": \"사용자는 사이트나 앱에서 5분 정도 걸리는 문진표를 채우고 회원으로 가입한다. 가입과 동시에 결제 수단을 등록하며, 회원비는 매달 같은 날짜에 자동으로 다시 청구된다. 그다음 담당 의료진이 답변을 검토하고 필요하면 화상 진료를 진행하며, 적합하다고 판단하면 처방을 내린다. 보험이 있으면 회사의 보험 담당 인력이 사전 승인을 대신 처리해 브랜드 약값을 월 25달러까지 낮추는 것을 목표로 하고, 보험이 없으면 조제 의약품인 세마글루타이드를 월 151달러부터, 티르제파타이드를 월 216달러부터 집으로 보내 준다. 회원에게는 체중 감량 코치가 배정되고 메시지로 무제한 상담할 수 있다. 체중 감량 회원비는 정가 월 135달러이고, 사이트에 걸린 할인 안내에 따르면 첫 달은 49달러다. 회사는 체중 감량 외에도 불안과 우울, 피임, 발기부전, 탈모, 피부, 수면, 일차 진료를 같은 구조로 판다.\", \"features\": [{\"name\": \"온라인 문진 기반 glp-1 처방\", \"detail\": \"대면 진료 없이 문진과 화상 상담만으로 세마글루타이드나 티르제파타이드 처방을 받고 약을 집에서 받는다. 회사는 보험이 없어도 된다는 점을 가장 앞세워 광고한다.\"}, {\"name\": \"보험 청구 대행\", \"detail\": \"회사의 담당 인력이 보험사 사전 승인을 대신 처리해 브랜드 약의 본인 부담금을 낮추는 일을 맡는다. 회사는 이 절차로 월 1,349달러짜리 약을 월 25달러 수준까지 낮출 수 있다고 안내한다.\"}, {\"name\": \"월정액 회원 구독\", \"detail\": \"약값과 별개로 회원비를 매달 자동으로 청구한다. 정가는 월 135달러이고 분기, 반기, 연 단위로 묶어 사면 할인된다. 3개월치 약을 한 번에 사면 이후 두 달치 회원비를 20% 깎아 준다.\"}, {\"name\": \"체중 감량 코치 메시지 상담\", \"detail\": \"회원에게 코치를 배정하고 식사와 운동에 관해 횟수 제한 없이 메시지로 상담할 수 있게 한다. 약만 파는 것이 아니라는 점을 내세우는 장치다.\"}, {\"name\": \"여러 상표로 나뉜 같은 서비스\", \"detail\": \"애플 앱스토어에서 zealthy inc. 이름으로 zealthy 외에 roenrx, fitrx, amrx 세 개의 앱이 더 나와 있다. 세 앱 모두 2026년 4월 6일부터 19일 사이에 처음 등록됐고 설명 문구와 판매 품목이 zealthy와 거의 같다.\"}, {\"name\": \"12개 진료 영역 확장\", \"detail\": \"체중 감량 외에 불안과 우울, 피임, 발기부전, 탈모, 피부, 수면, 엔클로미펜, 프리워크아웃, 일차 진료, hiv 예방약까지 같은 구독 구조로 판다.\"}], \"differentiator\": \"같은 문제를 푸는 회사로는 hims & hers, ro, noom 같은 곳이 있고, 파는 물건과 결제 구조만 놓고 보면 zealthy가 특별히 다르지 않다. 값을 낮추는 방식이 조금 다른데, hims & hers가 자체 브랜드 상품을 앞세우는 데 비해 zealthy는 보험 사전 승인을 대신 처리해 브랜드 약의 본인 부담금을 낮추는 쪽과 보험 없이 조제 의약품을 싸게 파는 쪽을 둘 다 내세운다. 실제로 이 회사를 다른 회사와 갈라놓는 것은 제품이 아니라 규제 이력이다. 창업자 kyle robertson은 앞서 cerebral을 세웠다가 2022년 5월에 물러났고, 미국 법무부는 2024년에 cerebral을 상대로 낸 소송에 그를 개인 피고로 넣은 뒤 2026년에는 zealthy까지 피고에 포함해 회사 자체를 법정관리에 넘겨 달라고 요구하고 있다.\", \"team\": [{\"name\": \"kyle robertson\", \"role\": \"창업자\", \"background\": \"2020년에 원격 정신건강 회사 cerebral을 세워 약 5억 달러를 모으고 48억 달러 기업 가치를 인정받았으나 2022년 5월에 회사에서 물러났고, 같은 해에 zealthy를 세웠다.\"}, {\"name\": \"michael repplier\", \"role\": \"robertson의 사업 동업자\", \"background\": \"법무부가 제안한 법정관리인 선임 명령이 법원에서 받아들여지면 robertson과 함께 재산 내역을 상세히 공개해야 하는 대상으로 지목됐다.\"}], \"traction\": [{\"type\": \"regulatory\", \"detail\": \"미국 법무부가 연방거래위원회를 대신해 플로리다 남부 연방지방법원에 cerebral을 상대로 소송을 냈다. 사건 번호는 1:24-cv-21376이며 이후 kyle robertson과 zealthy가 피고에 추가됐다.\", \"when\": \"2024-04\", \"source\": \"courtlistener 사건 기록 united states v. cerebral, inc.\"}, {\"type\": \"regulatory\", \"detail\": \"법원이 세 번째 수정 소장 제출을 명령했고 정부가 2026년 4월 10일까지 이를 제출했다. 사흘 뒤인 4월 13일에는 자산 동결과 법정관리인 선임을 요구하는 가처분 신청이 접수됐다.\", \"when\": \"2026-04\", \"source\": \"courtlistener 사건 기록 도켓 210번, 223번\"}, {\"type\": \"regulatory\", \"detail\": \"정부는 법원 제출 서류에서 소비자 배상액과 과징금이 zealthy를 파산시킬 수 있으므로 자산 보전이 필요하다고 밝혔고, 관리인 후보로 alvarez & marsal의 mark roberts를 제안했다.\", \"when\": \"2026-04\", \"source\": \"behavioral health business 보도\"}, {\"type\": \"regulatory\", \"detail\": \"가처분 신청 심리가 2026년 10월 5일 마이애미 법정에서 열리도록 잡혔고, 배심 재판은 2027년 4월 19일로 지정됐다. 피고 측은 2026년 7월 10일에 소장 1번 청구에 대한 각하 신청을 냈다.\", \"when\": \"2026-07\", \"source\": \"courtlistener 사건 기록 도켓 281번, 287번\"}, {\"type\": \"regulatory\", \"detail\": \"novo nordisk a/s가 뉴욕 남부 연방지방법원에 zealthy inc.를 상대로 소송을 냈다. 사건 번호는 1:25-cv-06391이다.\", \"when\": \"2025-08\", \"source\": \"courtlistener 사건 검색 결과\"}, {\"type\": \"traffic\", \"detail\": \"미국 애플 앱스토어에서 별점 4.2에 평가 2,845건, 구글 플레이에서 별점 3.5에 후기 779건과 내려받기 1만 건 이상을 기록하고 있다. 두 스토어 모두 2026년 9월 9일에 최신 버전이 올라왔다.\", \"when\": \"2026-09\", \"source\": \"애플 itunes 조회 api와 구글 플레이 페이지\"}], \"caveats\": \"가장 먼저 짚어야 할 것은 뉴스레터가 전한 파산 이야기가 아직 확정된 사실이 아니라는 점이다. 파산 가능성을 언급한 쪽은 법원이 아니라 정부이며, 정부가 요구한 배상액과 과징금이 회사의 자금을 넘어설 수 있다는 취지로 법원 제출 서류에 적은 문장이다. 조사 시점인 2026년 9월 10일 기준으로 가처분 심리는 아직 열리지 않았고 회사는 계속 영업하고 있다. 사이트는 할인 행사를 걸어 두고 회원을 받고 있으며 앱은 하루 전에도 새 버전이 올라왔다.\\n\\n다만 옛 주소인 zealthy.com은 접속이 끊긴다. 국내망과 해외 서비스 양쪽에서 확인했으나 연결 자체가 닫혀 있었고, 현재 살아 있는 주소는 getzealthy.com이다. 이용 약관을 보면 법인 이름은 fitrx, llc이며 zealthy는 그 상호다. 앱스토어에서는 같은 회사가 roenrx, fitrx, amrx라는 이름으로 사실상 같은 서비스를 파는 앱 세 개를 2026년 4월 초순과 중순에 새로 냈는데, 이는 정부가 세 번째 수정 소장을 내고 자산 동결을 신청한 시기와 겹친다. 다만 두 사실 사이의 인과관계를 확인해 주는 자료는 찾지 못했다.\\n\\n회사가 내세우는 수치는 전부 회사가 스스로 낸 것이다. 평균 15~20% 체중 감량, 회원 후기, 별점은 제삼자가 검증한 것이 아니다. 정부는 소장에서 robertson이 사업체들을 시켜 가명으로 좋은 후기 수천 건을 올리게 했고 본인도 직접 가짜 후기를 썼다고 주장한다. 값 표기도 일관되지 않는다. 같은 안내 페이지에서 배너는 첫 달 96달러 할인이라고 적혀 있는데 아래 문답에서는 86달러 할인이라 적혀 있고 첫 달 값은 49달러라고 나온다. 회사 앱 설명에는 첫 달 39달러라는 문구가 또 따로 있다.\\n\\n정부가 주장하는 위법 행위는 크게 세 갈래다. 첫째는 해지를 어렵게 만든 구독 결제 구조이고, 둘째는 후기 조작이며, 셋째는 의료진의 면허 번호를 본인 동의 없이 써서 처방을 낸 행위다. 세 번째 혐의는 회사의 의무 책임자가 법무부에 낸 내부 고발에서 나왔으며, 필리핀 콜센터 직원처럼 처방 권한이 없는 사람이 처방과 보험 사전 승인을 처리했다는 주장이 포함돼 있다. 이 주장들은 아직 법원에서 판단을 받지 않았고, 공개된 소장에서는 관련 대목 상당수가 가려져 있어 규모를 알 수 없다.\\n\\n소비자가 낸 소송도 별도로 여러 건 진행 중이다. 2025년 8월부터 2026년 4월 사이에 캘리포니아, 펜실베이니아, 뉴욕, 테네시, 플로리다 연방법원에 zealthy를 상대로 한 사건이 접수됐다. 창업자 이력과 회사 연혁은 behavioral health business 보도를 근거로 삼았고, 소송 진행 상황은 미국 연방법원 전자기록을 모으는 courtlistener에서 직접 확인했다. 투자 유치 금액과 매출은 확인 가능한 자료를 찾지 못해 비워 두었다.\", \"for_us\": \"이 사례에서 우리가 가져갈 것은 제품이 아니라 규칙이다. 미국에서 앱이 유료 구독을 붙이는 순간 rosca라는 법의 적용을 받는데, 이 법은 자동 갱신 결제를 팔 때 값과 갱신 조건을 결제 직전에 분명히 보여 줄 것, 이용자의 명시적 동의를 받을 것, 해지 수단을 간단하게 둘 것을 요구한다. 정부가 zealthy를 문제 삼은 첫 번째 이유가 바로 해지 절차를 일부러 복잡하게 설계했다는 점이며, 소장에는 창업자가 팀에 마찰을 더 넣으라고 지시했다는 전직 직원의 증언까지 담겼다. 우리가 미국에서 구독이나 자동 갱신을 다루게 된다면 해지 버튼을 몇 번 눌러야 닿는지가 곧 법적 위험이 된다.\\n\\n두 번째로 볼 것은 후기다. 연방거래위원회는 2024년 8월에 가짜 후기와 후기 매수, 내부자 후기, 회사가 직접 운영하는 후기 사이트, 부정적 후기 억제를 모두 금지하는 규칙을 확정했다. 앱 안에서 별점을 요청하는 방식이나 부정적 평가를 걸러 내는 장치는 한국에서 관행처럼 쓰이더라도 미국에서는 제재 대상이 될 수 있다.\\n\\n세 번째는 구조적인 관찰이다. 미국 소비자가 보험을 거치지 않고 매달 직접 돈을 내는 건강 서비스에 기꺼이 지갑을 여는 시장이 실재한다는 것을 이 회사가 보여 준다. 다만 그 시장에서 성장 속도를 만들어 낸 장치가 그대로 규제 위험으로 돌아왔다는 점도 같이 봐야 한다. 우리가 3개월 안에 소프트웨어만으로 붙일 수 있는 건강 가치를 고를 때, 처방과 약 배송처럼 면허와 규제가 걸린 영역은 피하고 보험 절차 안내나 비용 비교처럼 정보를 다루는 쪽이 현실적이다.\", \"screenshots\": [{\"file\": \"zealthy_home.png\", \"caption\": \"첫 화면이다. 상단에 첫 달 96달러 할인 안내가 걸려 있고 체중 감량, 불안과 우울, 피임, 발기부전 등 진료 영역을 골라 들어가게 돼 있다.\", \"from\": \"https://getzealthy.com/\"}, {\"file\": \"zealthy_weightloss.png\", \"caption\": \"체중 감량 상품 설명 페이지다. 보험이 있으면 월 25달러부터, 보험 없이 세마글루타이드를 사면 월 151달러부터라는 값이 나란히 적혀 있다.\", \"from\": \"https://getzealthy.com/weight-loss\"}, {\"file\": \"zealthy_cancel.png\", \"caption\": \"구독과 해지, 환불 정책 페이지다. 법인 이름이 fitrx, llc이고 zealthy가 그 상호라는 사실과 해지 절차가 여기에 적혀 있다.\", \"from\": \"https://getzealthy.com/subscriptions-cancellations-refunds-policy\"}, {\"file\": \"zealthy_ios.png\", \"caption\": \"미국 애플 앱스토어 페이지다. 별점 4.2에 평가 2,845건이며 조사 하루 전인 2026년 9월 9일에 새 버전이 올라왔다.\", \"from\": \"https://apps.apple.com/us/app/zealthy-health-weight-loss/id6502919679\"}], \"sources\": [{\"title\": \"ftc, doj move to seize zealthy - a telehealth company led by cerebral's founding ceo\", \"url\": \"https://bhbusiness.com/2026/04/20/ftc-doj-move-to-seize-zealthy-a-telehealth-company-led-by-cerebrals-founding-ceo/\", \"note\": \"세 번째 수정 소장의 내용, 법정관리인 선임 요구, 창업자 이력, 면허 번호 도용 관련 내부 고발을 확인했다.\"}, {\"title\": \"united states v. cerebral, inc., 1:24-cv-21376 (s.d. fla.) 사건 기록\", \"url\": \"https://www.courtlistener.com/docket/68432608/united-states-v-cerebral-inc/\", \"note\": \"소송 제기일, 피고 목록, 세 번째 수정 소장과 가처분 신청 날짜, 10월 5일 심리와 2027년 4월 배심 재판 일정을 직접 확인했다.\"}, {\"title\": \"courtlistener 'zealthy' 사건 검색 결과\", \"url\": \"https://www.courtlistener.com/?q=zealthy&type=r\", \"note\": \"novo nordisk가 낸 소송과 2025년부터 2026년 사이에 접수된 소비자 소송 여러 건을 확인했다.\"}, {\"title\": \"zealthy 체중 감량 상품 페이지\", \"url\": \"https://getzealthy.com/weight-loss\", \"note\": \"보험 적용 시 월 25달러, 보험 없이 세마글루타이드 월 151달러라는 값과 평균 15~20% 감량이라는 주장을 확인했다.\"}, {\"title\": \"zealthy 체중 감량 값 안내 페이지\", \"url\": \"https://go.getzealthy.com/zealthy-weight-loss-pricing_homepage/\", \"note\": \"회원비 정가 월 135달러, 첫 달 49달러, 자동 갱신 결제 방식과 할인 조건을 확인했다. 배너와 본문의 할인 금액이 서로 다른 것도 여기서 확인했다.\"}, {\"title\": \"zealthy 구독, 해지, 환불 정책\", \"url\": \"https://getzealthy.com/subscriptions-cancellations-refunds-policy\", \"note\": \"법인 이름이 fitrx, llc라는 사실, 회원비 구조, 해지 절차와 환불 제한 조건을 확인했다.\"}, {\"title\": \"애플 앱스토어 zealthy 및 동일 회사 앱 조회 결과\", \"url\": \"https://apps.apple.com/us/app/zealthy-health-weight-loss/id6502919679\", \"note\": \"별점과 평가 수, 최신 버전 날짜를 확인했다. 같은 회사가 낸 roenrx, fitrx, amrx 세 앱의 등록일도 함께 확인했다.\"}, {\"title\": \"구글 플레이 zealthy 페이지\", \"url\": \"https://play.google.com/store/apps/details?id=com.zealthy.mobileapp\", \"note\": \"별점 3.5, 후기 779건, 내려받기 1만 건 이상을 확인했다.\"}]}"}],"themeLabels":{"medicare":"메디케어","medicare-advantage":"메디케어 어드밴티지","medicaid":"메디케이드","aca-exchange":"ACA 거래소","employer-insurance":"고용주 보험","payer-ops":"보험사 운영","hospital-health-system":"병원·헬스시스템","primary-care":"1차 진료","value-based-care":"성과기반 진료","rcm-billing":"청구·수납","pbm-drug-pricing":"PBM·약값","pharmacy-retail":"약국·리테일","pharma-glp1":"제약·GLP-1","price-transparency":"가격 투명성","consumer-dtc":"소비자 직접판매","cash-pay":"현금 결제 시장","employer-benefits":"복리후생","ai-clinical":"임상 AI","ai-admin":"행정 AI","data-interop":"데이터 상호운용","telehealth":"원격진료","behavioral-mental":"정신건강","chronic-care":"만성질환 관리","senior-care":"시니어 케어","women-health":"여성 건강","dental-vision":"치과·안과","devices-wearables":"기기·웨어러블","digital-health-funding":"투자·펀딩","ma-consolidation":"인수합병","regulation-cms":"CMS 규제","regulation-fda":"FDA 규제","policy-legislation":"입법·정책","public-health":"공중보건","workforce":"인력","rural-access":"의료 접근성","clinical-trials":"임상시험","insurance-brokerage":"보험 유통","startups":"스타트업","market-earnings":"실적·시장"},"split":true}</script>
<script>
(function(){
"use strict";
var DB = JSON.parse(document.getElementById('payload').textContent);
var ISSUES = DB.issues || [];
var EXTRAS = DB.extras || {};
var COMPANIES = {};
(DB.companies || []).forEach(function(c){ COMPANIES[c.slug] = c; });
var SPLIT = !!DB.split;          /* 본문을 조각 파일로 나눠 두었는가 */
var CACHE = { issue:{}, company:{}, extras:null };

function fetchJSON(path){
  return fetch(path, {cache:'no-cache'}).then(function(r){
    if(!r.ok) throw new Error(path + ' ' + r.status);
    return r.json();
  });
}
function showLoading(msg){
  document.getElementById('content').innerHTML =
    '<div class="empty">' + esc(msg || '불러오는 중입니다') + '</div>';
}
/* 본문이 필요한 화면은 조각 파일을 먼저 받아 온 뒤에 그린다. */
function need(kind, id, draw){
  if(!SPLIT){ draw(); return; }
  if(CACHE[kind][id]){ draw(); return; }
  showLoading();
  var path = kind === 'issue' ? 'site/issue-' + id + '.json' : 'site/company-' + id + '.json';
  fetchJSON(path).then(function(d){
    CACHE[kind][id] = d;
    draw();
  }).catch(function(e){
    document.getElementById('content').innerHTML =
      '<div class="empty">내용을 불러오지 못했습니다.<br><small>' + esc(String(e)) + '</small></div>';
  });
}
function needExtras(draw){
  if(!SPLIT || CACHE.extras){ draw(); return; }
  showLoading();
  fetchJSON('site/extras.json').then(function(d){ CACHE.extras = d; EXTRAS = d; draw(); })
    .catch(function(){ CACHE.extras = {}; EXTRAS = {}; draw(); });
}
var TYPE_LABEL = {reads:'테크 리즈', policy:'정책 브리핑', roundup:'그랜드 라운드업', interview:'인터뷰', event:'안내'};
var THEME_LABEL = DB.themeLabels || {};

/* ---------- theme toggle ---------- */
var root = document.documentElement;
try{ var saved = localStorage.getItem('htn-theme'); if(saved) root.setAttribute('data-theme', saved); }catch(e){}
document.getElementById('themebtn').addEventListener('click', function(){
  var cur = root.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : (cur === 'light' ? 'dark' : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark'));
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('htn-theme', next); }catch(e){}
});

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function el(html){ var d = document.createElement('div'); d.innerHTML = html; return d; }
function fmtDate(d){ if(!d) return ''; var p = d.split('-'); return p[0] + '.' + p[1] + '.' + p[2]; }
function monthKey(d){ var p = String(d||'').split('-'); return p[0] + '년 ' + parseInt(p[1],10) + '월'; }
function issueText(it){
  if(it.q) return it.q;
  if(it._txt) return it._txt;
  var buf = [it.title_ko, it.title_en, it.hook, (it.tldr||[]).join(' ')];
  (it.sections||[]).forEach(function(s){
    buf.push(s.heading_ko, s.heading_en, s.what, s.why, s.structure, s.consumer);
    (s.players||[]).forEach(function(p){ buf.push(p.name, p.what); });
    (s.terms||[]).forEach(function(t){ buf.push(t.en, t.ko, t.plain); });
    (s.numbers||[]).forEach(function(n){ buf.push(n.value, n.meaning); });
  });
  (it.glossary||[]).forEach(function(t){ buf.push(t.en, t.ko, t.plain); });
  it._txt = buf.join(' ').toLowerCase();
  return it._txt;
}

/* ---------- state ---------- */
var state = { view:'home', id:null, q:'', types:{}, theme:null, raw:null, tab:'list' };
try{ state.cmp = localStorage.getItem('htn-cmp') === '1'; }catch(e){}

/* ---------- sidebar ---------- */
var NAV = [
  {k:'home',  t:'시작하기'},
  {k:'primer',t:'미국 헬스케어 101'},
  {k:'consumer', t:'소비자 시장'},
  {k:'report',t:'건질 것 모음'},
  {k:'pon',t:'PON 리스트'},
  {k:'companies',t:'투자받은 회사'},
  {k:'themes',t:'주제별'},
  {k:'timeline',t:'타임라인'},
  {k:'glossary',t:'용어사전'}
];
function renderNav(){
  document.getElementById('navlinks').innerHTML = NAV.map(function(n){
    return '<button class="navlink' + (state.view===n.k?' on':'') + '" data-nav="' + n.k + '">' + esc(n.t) + '</button>';
  }).join('');
}
function renderFilters(){
  var counts = {};
  ISSUES.forEach(function(i){ counts[i.type] = (counts[i.type]||0)+1; });
  var keys = Object.keys(TYPE_LABEL).filter(function(k){ return counts[k]; });
  document.getElementById('filters').innerHTML = keys.map(function(k){
    return '<button class="chip' + (state.types[k]?' on':'') + '" data-type="' + k + '">' +
      esc(TYPE_LABEL[k]) + ' ' + counts[k] + '</button>';
  }).join('');
}
function filtered(){
  var q = state.q.trim().toLowerCase();
  var anyType = Object.keys(state.types).some(function(k){ return state.types[k]; });
  return ISSUES.filter(function(it){
    if(anyType && !state.types[it.type]) return false;
    if(state.theme && (it.themes||[]).indexOf(state.theme) < 0) return false;
    if(q && issueText(it).indexOf(q) < 0) return false;
    return true;
  });
}
function renderList(){
  var list = filtered(), out = [], lastM = '';
  if(!list.length){ document.getElementById('issuelist').innerHTML = '<div class="empty">조건에 맞는 회차가 없습니다</div>'; return; }
  list.forEach(function(it){
    var m = monthKey(it.date);
    if(m !== lastM){ out.push('<div class="ilist-month">' + esc(m) + '</div>'); lastM = m; }
    out.push(
      '<button class="irow' + (state.view==='issue' && state.id===it.index ? ' on':'') + '" data-issue="' + esc(it.index) + '">' +
        '<span class="r1"><span class="num">' + esc(it.index) + '</span>' +
        '<span class="badge b-' + esc(it.type) + '">' + esc(TYPE_LABEL[it.type]||it.type) + '</span></span>' +
        '<span class="ttl">' + esc(it.title_ko) + '</span>' +
        '<span class="sub">' + esc(fmtDate(it.date)) + ' · ' + esc((it.hook||'').slice(0,44)) + '…</span>' +
      '</button>');
  });
  document.getElementById('issuelist').innerHTML = out.join('');
}

/* ---------- views ---------- */
function qaHTML(cls, label, text){
  /* 줄바꿈으로 나뉜 덩어리를 문단으로 만든다. 줄바꿈이 없고 길기만 하면
     문장 경계를 찾아 대략 260자 단위로 끊어 읽기 부담을 줄인다. */
  var parts = String(text).split(/\n\s*\n|\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  if(parts.length === 1 && parts[0].length > 420){
    var sents = parts[0].match(/[^.!?]+[.!?]+(?:\s|$)|[^.!?]+$/g) || [parts[0]];
    var acc = [], cur = '';
    sents.forEach(function(sn){
      cur += sn;
      if(cur.length >= 260){ acc.push(cur.trim()); cur = ''; }
    });
    if(cur.trim()) {
      if(acc.length && cur.trim().length < 90) acc[acc.length-1] += ' ' + cur.trim();
      else acc.push(cur.trim());
    }
    parts = acc;
  }
  return '<div class="qa ' + cls + '"><span class="lbl">' + esc(label) + '</span>' +
    parts.map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('') + '</div>';
}
function rawHTML(raw, n){
  /* 원문을 번역만 한 대조군. 정리 노트 꼭지와 순서가 1대 1로 맞는다. */
  if(!raw || !raw.sections || !raw.sections[n]) return '';
  var r = raw.sections[n];
  var paras = String(r.body || '').split(/\n\s*\n|\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  return '<div class="rawcol"><span class="rawlbl">원문 번역만</span>' +
    paras.map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('') + '</div>';
}
var SKIP_LABEL = {
  sponsor: {t:'광고', d:'후원사가 돈을 내고 실은 자리다. 건너뛰어도 된다.'},
  promo:   {t:'홍보·안내', d:'뉴스레터가 자기 행사나 커뮤니티를 알리는 자리다. 건너뛰어도 된다.'},
  admin:   {t:'잡다한 안내', d:'인사말이나 일정 공지처럼 내용이 거의 없는 자리다.'}
};
function secHTML(s, n){
  var b = [];

  /* 맨 위: 요약과 인사이트 */
  if(s.summary){
    b.push('<div class="sumbox"><span class="lbl">요약</span><p>' + esc(s.summary) + '</p></div>');
  }
  if(s.insight){
    b.push('<div class="insbox"><span class="lbl">3개월 안에 만들 수 있는 것</span><p>' + esc(s.insight) + '</p></div>');
  }
  if(s.signal){
    b.push('<div class="insbox sig"><span class="lbl">소비자 시장 신호</span><p>' + esc(s.signal) + '</p></div>');
  }
  if(!s.insight && !s.signal && !s.skip && s.summary){
    b.push('<div class="insbox none"><span class="lbl">건질 것</span><p>없다.</p></div>');
  }

  /* 필자의 주장과 근거 */
  if(s.author && s.author.length){
    b.push('<div class="claims author"><span class="lbl">필자의 주장과 근거</span>' +
      s.author.map(function(c){
        return '<div class="claim"><p class="c">' + esc(c.claim) + '</p>' +
          (c.evidence ? '<p class="e"><span>근거</span>' + esc(c.evidence) + '</p>' : '') + '</div>';
      }).join('') + '</div>');
  }

  /* 전문가의 주장과 근거 */
  if(s.experts && s.experts.length){
    b.push('<div class="claims expert"><span class="lbl">전문가의 주장과 근거</span>' +
      s.experts.map(function(c){
        return '<div class="claim"><p class="who"><b>' + esc(c.who) + '</b>' +
          (c.role ? '<span class="role">' + esc(c.role) + '</span>' : '') + '</p>' +

var scrollTimer = null;
function trackScroll(){
  if(scrollTimer) return;
  scrollTimer = setInterval(function(){
    var secsEl = document.querySelectorAll('[id^="s"]');
    var cur = -1, top = 120;
    secsEl.forEach(function(e){
      if(!/^s\d+$/.test(e.id)) return;
      if(e.getBoundingClientRect().top <= top) cur = parseInt(e.id.slice(1), 10);
    });
    document.querySelectorAll('.stoc').forEach(function(b){
      b.classList.toggle('on', parseInt(b.dataset.sn, 10) === cur);
    });
  }, 400);
}
function mdish(t){
  /* very small formatter: **bold**, `code`, paragraphs, - lists, ## heads */
  var lines = String(t||'').split('\n'), out = [], inList = false;
  function inline(s){
    return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
                 .replace(/`(.+?)`/g,'<code>$1</code>')
                 .replace(/\[\[(\d{2})\]\]/g,'<button class="tt" data-issue="$1" style="padding:1px 7px">$1회차</button>');
  }
  lines.forEach(function(l){
    var s = l.trim();
    if(!s){ if(inList){ out.push('</ul>'); inList=false; } return; }
    if(/^###\s/.test(s)){ if(inList){out.push('</ul>');inList=false;} out.push('<h4>'+inline(s.replace(/^###\s/,''))+'</h4>'); return; }
    if(/^##\s/.test(s)){ if(inList){out.push('</ul>');inList=false;} out.push('<h3>'+inline(s.replace(/^##\s/,''))+'</h3>'); return; }
    if(/^[-*]\s/.test(s)){ if(!inList){ out.push('<ul>'); inList=true; } out.push('<li>'+inline(s.replace(/^[-*]\s/,''))+'</li>'); return; }
    if(inList){ out.push('</ul>'); inList=false; }
    out.push('<p>'+inline(s)+'</p>');
  });
  if(inList) out.push('</ul>');
  return out.join('');
}
