<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Health Tech Nerds 정리 노트 — 미국 헬스케어 읽기</title>
<meta name="description" content="Health Tech Nerds 뉴스레터 55회차를, 미국 헬스케어를 처음 보는 사람 기준으로 한글로 풀어 쓴 정리 노트">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#faf9f7; --surface:#fff; --surface-2:#f4f2ee; --text:#1b1a18; --muted:#6d6860;
  --line:#e5e1d9; --line-soft:#efece6;
  --accent:#1c6d5b; --accent-soft:#e4f1ed; --accent-ink:#12503f;
  --warn:#8a5a10; --warn-soft:#fbf0dc;
  --t-reads:#1f5fa8; --t-reads-bg:#e6eefa;
  --t-policy:#8a5a10; --t-policy-bg:#fbf0dc;
  --t-roundup:#6b3f9e; --t-roundup-bg:#f0e9fb;
  --t-interview:#a33a6b; --t-interview-bg:#fbe8f1;
  --t-event:#5a5a5a; --t-event-bg:#ececec;
  --radius:12px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
:root:not([data-theme="light"]){ color-scheme:light }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131519; --surface:#1a1d22; --surface-2:#20242b; --text:#e9e7e3; --muted:#9aa0a8;
    --line:#2b3038; --line-soft:#232830;
    --accent:#63c3a8; --accent-soft:#173028; --accent-ink:#8fd9c2;
    --warn:#d9ab63; --warn-soft:#2e2415;
    --t-reads:#7fb0e8; --t-reads-bg:#182634;
    --t-policy:#d9ab63; --t-policy-bg:#2e2415;
    --t-roundup:#b493e0; --t-roundup-bg:#241c33;
    --t-interview:#e08bb2; --t-interview-bg:#331823;
    --t-event:#a8a8a8; --t-event-bg:#26262a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131519; --surface:#1a1d22; --surface-2:#20242b; --text:#e9e7e3; --muted:#9aa0a8;
  --line:#2b3038; --line-soft:#232830;
  --accent:#63c3a8; --accent-soft:#173028; --accent-ink:#8fd9c2;
  --t-reads:#7fb0e8; --t-reads-bg:#182634;
  --t-policy:#d9ab63; --t-policy-bg:#2e2415;
  --t-roundup:#b493e0; --t-roundup-bg:#241c33;
  --t-interview:#e08bb2; --t-interview-bg:#331823;
  --t-event:#a8a8a8; --t-event-bg:#26262a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:anywhere;
}
a{color:var(--accent-ink); text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit; font-size:inherit; color:inherit}

/* ---------- layout ---------- */
.app{display:grid; grid-template-columns:308px minmax(0,1fr); min-height:100vh}
.side{
  border-right:1px solid var(--line); background:var(--surface);
  position:sticky; top:0; height:100vh; display:flex; flex-direction:column; min-width:0;
}
.main{min-width:0; display:flex; flex-direction:column}

/* ---------- sidebar ---------- */
.brand{padding:18px 18px 12px; border-bottom:1px solid var(--line-soft)}
.brand h1{margin:0; font-size:15px; font-weight:700; letter-spacing:-.01em}
.brand p{margin:4px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5}
.searchwrap{padding:12px 14px 8px}
.search{
  width:100%; padding:9px 12px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--text); font-size:13.5px;
}
.search::placeholder{color:var(--muted)}
.search:focus{outline:2px solid var(--accent); outline-offset:-1px; background:var(--surface)}
.navlinks{display:flex; flex-wrap:wrap; gap:6px; padding:2px 14px 10px}
.navlink{
  border:1px solid var(--line); background:var(--surface-2); border-radius:999px;
  padding:5px 11px; font-size:12.5px; cursor:pointer; color:var(--muted);
}
.navlink:hover{border-color:var(--accent); color:var(--accent-ink)}
.navlink.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.filters{display:flex; flex-wrap:wrap; gap:5px; padding:0 14px 10px; border-bottom:1px solid var(--line-soft)}
.chip{
  border:1px solid var(--line); background:transparent; border-radius:999px;
  padding:3px 9px; font-size:11.5px; cursor:pointer; color:var(--muted);
}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .chip.on{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#0e1a16}}
.issuelist{overflow-y:auto; flex:1; padding:6px 8px 24px}
.ilist-head{
  font-size:11px; color:var(--muted); padding:10px 8px 4px; letter-spacing:.04em;
  text-transform:uppercase; font-weight:700; position:sticky; top:0; background:var(--surface);
}
.ilist-month{
  font-size:11.5px; color:var(--muted); font-weight:700; padding:12px 8px 4px;
  border-top:1px solid var(--line-soft); margin-top:6px;
}
.ilist-month:first-child{border-top:0; margin-top:0}
.irow{
  display:block; width:100%; text-align:left; border:0; background:transparent;
  padding:8px 10px; border-radius:9px; cursor:pointer; line-height:1.45;
}
.irow:hover{background:var(--surface-2)}
.irow.on{background:var(--accent-soft)}
.irow .r1{display:flex; align-items:center; gap:6px; margin-bottom:2px}
.irow .num{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.irow .ttl{font-size:13px; font-weight:600; color:var(--text); display:block}
.irow.on .ttl{color:var(--accent-ink)}
.irow .sub{font-size:11.5px; color:var(--muted); display:block; margin-top:2px}
.badge{
  font-size:10px; font-weight:700; padding:1.5px 6px; border-radius:5px; white-space:nowrap;
  letter-spacing:.01em;
}
.b-reads{background:var(--t-reads-bg); color:var(--t-reads)}
.b-policy{background:var(--t-policy-bg); color:var(--t-policy)}
.b-roundup{background:var(--t-roundup-bg); color:var(--t-roundup)}
.b-interview{background:var(--t-interview-bg); color:var(--t-interview)}
.b-event{background:var(--t-event-bg); color:var(--t-event)}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--line); padding:10px 16px;
  display:flex; align-items:center; gap:10px;
}
.menubtn{display:none; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 10px; cursor:pointer}
.crumb{font-size:12.5px; color:var(--muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.iconbtn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:5px 10px; cursor:pointer; font-size:12.5px; color:var(--muted)}
.iconbtn:hover{border-color:var(--accent); color:var(--accent-ink)}

/* ---------- content ---------- */
.wrap{padding:26px 30px 120px; max-width:860px; width:100%; margin:0 auto}
.doc h2{font-size:25px; line-height:1.35; margin:0 0 6px; letter-spacing:-.02em}
.doc h3{font-size:18px; margin:34px 0 10px; letter-spacing:-.01em; scroll-margin-top:70px}
.doc h4{font-size:15px; margin:22px 0 6px}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{margin:0 0 14px; padding-left:20px}
.doc li{margin-bottom:5px}
.meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 16px; font-size:12.5px; color:var(--muted)}
.hook{
  font-size:17px; line-height:1.7; font-weight:600; letter-spacing:-.01em;
  padding:14px 16px; border-left:3px solid var(--accent); background:var(--accent-soft);
  border-radius:0 10px 10px 0; margin:0 0 22px; color:var(--accent-ink);
}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin:0 0 14px}
.tldr{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 18px 6px; margin:0 0 26px}
.tldr .lbl{font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--muted); text-transform:uppercase}
.tldr ol{margin:8px 0 10px; padding-left:20px}
.tldr li{margin-bottom:7px}

.sec{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin:0 0 16px; overflow:hidden}
.sec > h3{margin:0; padding:14px 18px 12px; font-size:17px; border-bottom:1px solid var(--line-soft); background:var(--surface)}
.sec > h3 .en{display:block; font-size:11.5px; font-weight:500; color:var(--muted); margin-top:3px; letter-spacing:0}
.secbody{padding:14px 18px 6px}
.qa{margin:0 0 14px}
.qa .lbl{
  display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.05em;
  padding:2px 7px; border-radius:5px; margin-bottom:6px;
  background:var(--surface-2); color:var(--muted); border:1px solid var(--line-soft);
}
.qa.what .lbl{background:var(--t-reads-bg); color:var(--t-reads); border-color:transparent}
.qa.why .lbl{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent}
.qa.struct .lbl{background:var(--t-roundup-bg); color:var(--t-roundup); border-color:transparent}
.qa.consumer .lbl{background:var(--t-policy-bg); color:var(--t-policy); border-color:transparent}
.qa p{margin:0 0 10px}
.qa p:last-child{margin-bottom:0}
.stats{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px}
.stat{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:9px; padding:8px 11px; min-width:0}
.stat b{display:block; font-size:15px; font-family:var(--mono); letter-spacing:-.02em}
.stat span{display:block; font-size:11.5px; color:var(--muted); line-height:1.45; margin-top:2px}
.players{display:flex; flex-direction:column; gap:6px; margin:0 0 14px}
.player{font-size:13px; line-height:1.6; padding:7px 11px; background:var(--surface-2); border-radius:8px; border:1px solid var(--line-soft)}
.player b{color:var(--text)}
.player span{color:var(--muted)}
.terms{margin:0 0 16px; padding:12px 15px 13px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:10px}
.terms .lbl{font-size:11px; font-weight:800; letter-spacing:.04em; color:var(--accent-ink); display:block; margin-bottom:9px}
.term{font-size:13px; line-height:1.65; margin-bottom:9px}
.term:last-child{margin-bottom:0}
.term.core{
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:8px; padding:11px 13px; margin-bottom:10px; font-size:13.5px; line-height:1.75;
}
.term.core b{font-size:14px}
.term.core .pl{margin-top:4px}
.term b{color:var(--text)}
.term .ko{color:var(--accent-ink); font-weight:600}
.term .pl{color:var(--muted); display:block}
/* ---------- 투자받은 회사 ---------- */
.cbig{border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); padding:16px 18px; margin:0 0 16px}
.cbig-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px}
.cspacer{flex:1}
.cname{border:0; background:transparent; padding:0; font-size:18px; font-weight:700; cursor:pointer; letter-spacing:-.01em}
.cname:hover{color:var(--accent-ink); text-decoration:underline}
.cs{font-size:11px; font-weight:700; padding:2px 8px; border-radius:5px; background:var(--t-reads-bg); color:var(--t-reads)}
.cissue{border:1px solid var(--line); background:var(--surface-2); color:var(--muted); border-radius:5px;
  font-size:11px; padding:1px 7px; cursor:pointer; font-family:var(--mono)}
.cissue:hover{border-color:var(--accent); color:var(--accent-ink)}
.cmore{border:1px solid var(--accent); background:var(--surface); color:var(--accent-ink); border-radius:8px;
  font-size:12.5px; font-weight:600; padding:5px 12px; cursor:pointer}
.cmore:hover{background:var(--accent); color:#fff}
:root[data-theme="dark"] .cmore:hover{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cmore:hover{color:#0e1a16}}
.cone{margin:0 0 9px; font-size:14.5px; line-height:1.7; font-weight:600}
.ctags{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 10px}
.ctags span{font-size:11.5px; padding:2px 9px; border-radius:999px; background:var(--surface-2);
  border:1px solid var(--line-soft); color:var(--muted)}
.csum{margin:0 0 12px; font-size:14px; line-height:1.8; color:var(--muted)}
.ctab{width:100%; border-collapse:collapse; margin:0 0 12px; font-size:13.5px}
.ctab th{
  text-align:left; width:126px; vertical-align:top; padding:7px 10px 7px 0; font-weight:700;
  color:var(--muted); font-size:12px; white-space:nowrap; border-top:1px solid var(--line-soft);
}
.ctab td{padding:7px 0; line-height:1.7; border-top:1px solid var(--line-soft)}
.ctab tr:first-child th, .ctab tr:first-child td{border-top:0}
.ctab tr.w th{color:var(--t-policy)}
.ctab tr.w td{color:var(--t-policy)}
.cthumbs{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.cthumbs figure{margin:0; min-width:0}
.cthumbs a{display:block; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface-2)}
.cthumbs img{width:100%; height:132px; object-fit:cover; object-position:top; display:block}
.cthumbs figcaption{font-size:11px; color:var(--muted); margin-top:4px; line-height:1.5}
@media (max-width:760px){ .cthumbs{grid-template-columns:1fr 1fr} .ctab th{width:92px} }
.backlink{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; margin:0 0 14px;
}
.backlink:hover{border-color:var(--accent); color:var(--accent-ink)}
.cblock{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 18px; margin:0 0 12px}
.cblock .lbl{display:block; font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--muted); margin-bottom:8px}
.cblock p{margin:0 0 10px; font-size:14.5px; line-height:1.8}
.cblock p:last-child{margin-bottom:0}
.cblock.warn{border-color:var(--t-policy); background:var(--t-policy-bg)}
.cblock.warn .lbl{color:var(--t-policy)}
.cblock.forus{border-color:var(--accent); background:var(--accent-soft)}
.cblock.forus .lbl, .cblock.forus p{color:var(--accent-ink)}
.cfeat, .cteam, .ctrac, .csrc{list-style:none; margin:0; padding:0}
.cfeat li{padding:8px 0 8px 12px; border-left:3px solid var(--line); margin-bottom:8px}
.cfeat b{display:block; font-size:14px}
.cfeat span{display:block; font-size:13.5px; color:var(--muted); margin-top:2px; line-height:1.7}
.cteam li{padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:14px}
.cteam li:last-child{border-bottom:0}
.cteam .role{font-size:11.5px; color:var(--muted); background:var(--surface-2); padding:1px 7px; border-radius:5px; margin-left:7px}
.cteam span:not(.role){display:block; font-size:13px; color:var(--muted); margin-top:3px}
.ctrac li{display:flex; gap:9px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
.ctrac li:last-child{border-bottom:0}
.tt2{font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:5px; background:var(--surface-2); color:var(--muted); flex:none}
.tt2.t-funding{background:var(--accent-soft); color:var(--accent-ink)}
.tt2.t-regulatory{background:var(--t-policy-bg); color:var(--t-policy)}
.tt2.t-partnership{background:var(--t-roundup-bg); color:var(--t-roundup)}
.tt2.t-revenue, .tt2.t-customers, .tt2.t-traffic{background:var(--t-reads-bg); color:var(--t-reads)}
.ctrac .d{flex:1; min-width:0; font-size:14px; line-height:1.7}
.ctrac .w{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
/* 세로로 긴 갈무리가 섞여 있어 단 배치로 빈 공간을 줄인다. */
.cshots{columns:2; column-gap:12px}
.cshots figure{margin:0 0 14px; break-inside:avoid}
.cshots a{display:block; position:relative; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--surface-2)}
.cshots img{width:100%; display:block; max-height:520px; object-fit:cover; object-position:top}
.cshots a::after{
  content:'원본 보기'; position:absolute; right:8px; bottom:8px; font-size:10.5px; font-weight:700;
  background:rgba(0,0,0,.62); color:#fff; padding:3px 8px; border-radius:5px; opacity:0; transition:opacity .15s;
}
.cshots a:hover::after{opacity:1}
.cshots figcaption{font-size:12px; color:var(--muted); margin-top:5px; line-height:1.6}
@media (max-width:900px){ .cshots{columns:1} }
.csrc li{padding:6px 0; font-size:13.5px; border-bottom:1px solid var(--line-soft)}
.csrc li:last-child{border-bottom:0}
.csrc span{display:block; font-size:12.5px; color:var(--muted); margin-top:2px}

/* ---------- 회차 머리: 요약 → 건질 것 → 꼭지 고르기 ---------- */
.ihead{margin:0 0 26px}
.tldr{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 20px 8px; margin:0 0 14px}
.tldr .lbl{font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--muted)}
.tldr ol{margin:10px 0 8px; padding-left:20px}
.tldr li{margin-bottom:12px}
.tldr .pt{display:block; font-size:15px; line-height:1.7; font-weight:600}
.tldr .nt{display:block; font-size:13.5px; line-height:1.7; color:var(--muted); margin-top:3px}

.issueins{border-radius:var(--radius); padding:15px 20px; margin:0 0 16px}
.issueins.yes{background:var(--accent-soft); border:1px solid var(--accent); border-left:4px solid var(--accent)}
.issueins.no{background:var(--surface); border:1px dashed var(--line)}
.issueins .lbl{display:block; font-size:11px; font-weight:800; letter-spacing:.05em; margin-bottom:7px}
.issueins.yes .lbl{color:var(--accent-ink)}
.issueins.no .lbl{color:var(--muted)}
.issueins p{margin:0; font-size:14.5px; line-height:1.8}
.issueins.yes p{color:var(--accent-ink)}
.issueins.no p{color:var(--muted)}
.issueins .jump{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px}
.issueins .jump button{
  border:1px solid var(--accent); background:var(--surface); color:var(--accent-ink);
  border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; font-weight:600;
}
.issueins .jump button:hover{background:var(--accent); color:#fff}

.issueins .igrp{margin-top:13px}
.issueins .gl{
  display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.04em;
  padding:2px 9px; border-radius:5px; margin-bottom:8px;
}
.issueins .igrp.b .gl{background:var(--accent); color:#fff}
.issueins .igrp.s .gl{background:var(--t-policy-bg); color:var(--t-policy)}
:root[data-theme="dark"] .issueins .igrp.b .gl{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .issueins .igrp.b .gl{color:#0e1a16}}
.ibul{list-style:none; margin:0; padding:0}
.ibul li{
  padding:9px 0 9px 13px; border-left:3px solid var(--accent); margin-bottom:8px;
  background:var(--surface); border-radius:0 8px 8px 0; padding-right:12px;
}
.ibul.s li{border-left-color:var(--t-policy)}
.ibul li:last-child{margin-bottom:0}
.ibul b{display:block; font-size:14px; line-height:1.6; color:var(--text)}
.ibul span{display:block; font-size:13.5px; line-height:1.7; color:var(--muted); margin-top:3px}
.ibul .src{
  display:inline-block; margin-top:6px; border:1px solid var(--line); background:var(--surface-2);
  color:var(--muted); border-radius:5px; font-size:11px; padding:2px 8px; cursor:pointer;
}

분한지를 먼저 봐야 한다.","section":8}],"signal":[{"title":"예약 전화에 쓰는 시간이 사람에서 AI로 옮겨 가고 있다","detail":"WellSpan은 AI 케어 어시스턴트로 160만 통이 넘는 전화를 걸었고, 지난주 1차 진료 예약의 절반 이상을 그 AI가 잡았다. 반대편에서는 연회비를 내고 담당 의사에게 바로 닿는 상품이 사람에게 연결된다는 점을 앞세워 팔린다.","section":3},{"title":"증상이 없는 사람이 자기 돈으로 검진 상품을 산다","detail":"Prenuvo는 몸 전체를 훑는 영상 검사를 소비자에게 직접 팔아 2025년 초에 1억 2,000만 달러를 유치했다. 소비자가 그 돈으로 사는 것은 치료가 아니라 숨은 병이 없다는 확인이며, 이번 소송은 그 확인이 틀렸을 때 생기는 손해를 보여 준다.","section":7},{"title":"의료비 전용 계좌에 쌓인 돈을 쓰게 해 주는 일이 상품이 된다","detail":"TrueMed는 세금 혜택이 붙은 의료비 전용 계좌의 돈을 쓸 수 있는 상품을 모아 팔아 3,400만 달러를 유치했고, a16z가 라운드를 주도했다. 소비자에게 이미 있는 돈인데도 무엇이 의료비로 인정되는지가 분명하지 않아서 쓰기 어렵다는 사정이 이 시장을 만든다.","section":9}]},"sections":[{"heading_ko":"후원: AscendRural 시니어 케어 액셀러레이터","heading_en":"AscendRural's Senior Care Accelerator","skip":"sponsor","summary":"농촌 고령 인구를 지원하는 초기 단계 스타트업을 모집하는 액셀러레이터 광고다. 지원 마감과 파일럿 계약 규모를 안내한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"인사말","heading_en":"","skip":"admin","summary":"연휴 뒤 첫 회차라는 인사와, 다음 주 JPMorgan 헬스케어 컨퍼런스 관련 별도 소식을 예고하는 짧은 안내다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"필자의 생각: 솜씨와 사업","heading_en":"My Reflection: Arts and crafts and business","skip":null,"summary":"필자가 왜 뉴스레터 제작을 자동화하지 않는지에서 이야기를 시작해, 2025년 헬스케어 AI 투자가 어디로 몰렸는지에 대한 진단으로 넘어간다. 진단의 요지는, 투자가 진료 자체가 아니라 예약 전화와 증상 문진처럼 환자가 병원과 처음 마주치는 접점을 사람 대신 자동화하는 데 집중됐다는 것이다. 필자는 그 방향이 단기적으로는 인건비를 아껴 주지만 장기적으로는 틀렸다고 보고, 반대편 사례로 사람이 직접 응대하는 고급 진료 서비스를 든다.","insight":null,"signal":"WellSpan은 AI 케어 어시스턴트 Anna로 160만 통이 넘는 전화를 걸었고, 지난주 1차 진료 예약의 50% 이상을 Anna가 잡았다. 미국에서는 진료를 받기 전에 전화로 예약을 잡아야 하는데, 소비자가 그 단계에서 쓰는 시간이 사람 응대에서 AI 응대로 옮겨 가고 있다는 뜻이다. 필자가 반대편 사례로 든 Private Medical은 연회비를 내고 담당 의사에게 언제든 직접 연락할 권리를 파는데, 이 상품이 앞세우는 것은 AI의 품질이 아니라 사람에게 바로 닿는다는 점이다. 같은 단계를 두고 한쪽에서는 소비자가 시간을 쓰고, 다른 쪽에서는 돈을 더 내서 그 시간을 건너뛴다.","author":[{"claim":"AI가 만들어 낸 결과물이 넘쳐날수록 사람의 솜씨가 들어간 결과물이 오히려 더 두드러진다.","evidence":"Scott Belsky의 블로그 글이 비슷한 이야기를 했다고 소개했을 뿐이며, 자신이 편향돼 있다고 스스로 인정했다."},{"claim":"환자와의 모든 상호작용을 자동화한다는 비전은 의료 제공 조직이 갈 방향으로 틀렸다.","evidence":"WellSpan의 AI 도입에 대한 페이스북 반응이 이미 나쁜 신호를 보여 줬다는 점과, 고급 컨시어지 서비스 Private Medical의 핵심 가치 제안이 상호작용하는 LLM의 품질이 아니라 담당 의사에게 언제든 직접 연결되는 것이라는 점을 들었다."},{"claim":"사람을 로봇으로 대체해 얻는 차익거래 기회는 빠르게 닫힐 것이다.","evidence":"근거를 대지 않았다."},{"claim":"더 흥미로운 비전은 애초에 환자가 증상 체커나 자동 전화 안내를 거칠 필요가 없는 쪽이며, AI는 그런 사람 중심 경험을 더 싼 값에 가능하게 만드는 배경 역할을 맡아야 한다.","evidence":"Belsky가 말한 환대의 논지를 헬스케어의 현관문에 적용한 것이며, 별도의 데이터는 대지 않았다."}],"experts":[{"who":"Roxanna Gapstur","role":"WellSpan Health CEO다. Hippocratic AI를 도입한 당사자이므로 그 도입을 옹호할 위치에 있다.","claim":"AI 케어 어시스턴트 Anna를 이미 케어 팀의 일원으로 여기고 있으며, 앞으로 WellSpan에 연락하는 모든 사람을 처음에 Anna가 맞이하는 현관문이 될 수 있다. 환자들은 Anna와의 상호작용을 좋아한다.","evidence":"Anna로 160만 통이 넘는 전화를 걸었고 지난주 1차 진료 방문의 50% 이상을 Anna가 예약했다는 수치를 들었다. 환자가 좋아한다는 근거로는 예약을 끝까지 완료했다는 사실 하나를 들었는데, 만족의 증거로 보기에는 약한 해석이다."},{"who":"Scott Belsky","role":"필자가 인용한 블로그 글의 저자다. 원문은 그의 소속을 밝히지 않았고, 2026년 제품에 들어가는 솜씨를 다룬 글이라고만 소개했다.","claim":"2026년에는 제품에 들어가는 솜씨가 중요해지며, 사람이 앞에 나서서 응대하는 쪽으로 흐름이 움직인다.","evidence":"원문에는 해당 대목의 링크만 있고 내용이 본문에 옮겨지지 않아, 그가 어떤 근거를 들었는지는 확인할 수 없다."}],"cases":[{"name":"WellSpan Health","what":"미국의 의료 시스템으로, Hippocratic AI와 손잡고 AI 케어 어시스턴트 Anna에게 환자 전화 응대와 예약을 맡겼다.","scale":"Anna로 160만 통이 넘는 전화, 지난주 1차 진료 방문 예약의 50% 이상","note":"CEO는 예약을 끝까지 마쳤다는 사실만으로 환자가 좋아한다고 해석했으나, 필자는 페이스북 반응을 근거로 반대 신호를 읽었다."},{"name":"Hippocratic AI","what":"의료 시스템을 대신해 환자에게 거는 전화를 처리하는 AI를 파는 회사다.","scale":"","note":""},{"name":"Doctronic","what":"AI 증상 체커를 파는 회사로, 2025년에 성장했다.","scale":"","note":""},{"name":"Assort Health","what":"진료소의 전화 안내를 자동으로 받아 주는 AI를 파는 회사로, 진료소들이 채택했다.","scale":"","note":""},{"name":"Private Medical","what":"돈을 더 내고 담당 의사에게 직접 닿는 고급 컨시어지 진료를 파는 곳이다.","scale":"","note":"필자가 반대 사례로 든 곳이다. 이곳의 홈페이지는 AI 품질이 아니라 사람 의사에게 언제든 연결된다는 점을 앞세운다."}],"notes":[{"term":"front of house","ko":"손님을 맞는 앞쪽","plain":"원래는 식당 용어로, 손님 눈에 보이는 접객 구역을 가리킨다. 주방처럼 보이지 않는 쪽은 back of house라고 부른다. 헬스케어에서는 진료 자체가 아니라 예약 전화, 접수, 안내처럼 환자가 병원과 처음 마주치는 접점을 뜻한다. 필자는 미국의 이 접점이 역사적으로 형편없었다고 평가한다."},{"term":"컨시어지 의료","ko":"연회비를 내고 담당 의사에게 직접 닿는 진료","plain":"미국에는 전 국민 건강보험이 없어서, 어떤 보험을 들었느냐에 따라 의사를 얼마나 빨리 만나는지가 크게 갈린다. 컨시어지 의료는 환자가 보험과 별개로 연회비를 내고 담당 의사에게 언제든 직접 연락할 권리를 사는 방식이다. 한국에서 동네 의원에 그냥 걸어 들어가 진료받는 일을, 미국에서는 돈을 더 내야 얻는 셈이다."}]},{"heading_ko":"커뮤니티 토론 주제: 성과 기반 진료는 성공하고 있는가","heading_en":"Community Discussion Topic: Is VBC Succeeding?","skip":null,"summary":"필자가 지난 11월에 소개했던 논쟁을 다시 꺼내는 대목이다. 성과 기반 진료를 옹호하는 쪽과 이제 그만 넘어가자는 쪽이 정면으로 갈렸고, 필자는 2026년이 그 흐름의 분기점이 될 것으로 본다. 뒷부분은 이번 주에 진행할 커뮤니티 설문과 토론 일정을 알리는 안내다.","insight":null,"signal":null,"author":[{"claim":"2026년은 성과 기반 진료의 모멘텀에 결정적인 해가 될 것이다.","evidence":"근거를 대지 않았다."},{"claim":"성과 기반 진료를 두고 업계 의견이 크게 갈린다.","evidence":"11월에 소개한 두 사람의 대화에서 정반대 입장이 부딪혔다는 점을 들었다."}],"experts":[{"who":"Farzad Mostashari","role":"Aledade 공동창업자다. Aledade는 개원의 그룹이 성과 기반 진료에 참여하도록 돕는 회사이므로, 이 방식이 성공했다고 말할 이해관계가 있다.","claim":"성과 기반 진료의 원칙과 MSSP 프로그램은 성공했다.","evidence":"필자는 그가 탄탄하게 옹호했다고만 적었고, 그가 든 구체적인 근거는 옮기지 않았다."},{"who":"Andrew Ryan","role":"Brown 대학 소속이다. 원문은 그를 대학 쪽 인물로만 소개했고, 그가 어떤 이해관계를 갖는지는 밝히지 않았다.","claim":"미국 헬스케어의 병폐를 고치는 수단으로서 성과 기반 진료에서 이제 넘어갈 때가 됐을 수 있다.","evidence":"필자는 그의 주장이 구체적인 내용은 적었지만 의심의 씨앗을 심는 데는 효과적이었다고 평가했다."}],"cases":[{"name":"Aledade의 크레딧 퍼실리티(대출 약정)","what":"성과 기반 진료 참여를 돕는 Aledade가 최근 발표한 자금 조달 수단으로, 목요일 대화의 주제로 예고됐다.","scale":"","note":"성과 기반 진료는 절감액을 나중에 정산받는 구조라 참여 기관이 자금 압박을 받는데, 그 공백을 메우는 자금 조달이 화두로 올라왔다는 뜻이다."}],"notes":[{"term":"VBC (value-based care)","ko":"성과 기반 진료","plain":"미국은 원래 행위별 수가제여서, 검사와 시술을 많이 할수록 병원이 더 벌었다. 성과 기반 진료는 그 대신 환자 한 명을 맡아 총 진료비를 얼마나 줄이고 건강 결과를 얼마나 좋게 만들었는지로 보상한다. 돈은 메디케어를 운영하는 연방 기관에서 의사 그룹으로 흐르고, 미리 정한 기준선보다 적게 쓴 금액의 일부를 그 그룹이 나눠 갖는다. 한국은 지금도 대부분 행위별 수가제이므로 이 구조가 낯설다."},{"term":"MSSP","ko":"메디케어 절감액 공유 프로그램","plain":"메디케어에서 10년 넘게 돌아간 가장 큰 성과 기반 진료 프로그램이다. 의사 그룹이 맡은 환자들의 총 진료비가 미리 정한 기준선보다 적게 나오면, 그 차액의 일부를 정부와 나눠 갖는다. 이 프로그램이 실제로 나라 전체의 돈을 아꼈는지가 이 꼭지에서 벌어지는 논쟁의 핵심이다."}]},{"heading_ko":"이번 주의 차트: 버몬트 블루크로스의 가격 공개","heading_en":"Chart of the Week: BCBS VT's transparency push","skip":null,"summary":"버몬트의 보험사가 고비용 대학병원에서 환자를 다른 곳으로 돌리려고, 값이 싼 의료기관 네 곳과 함께 가격 비교 웹사이트를 열었다. 보험사가 특정 병원을 실명으로 지목하는 일은 드물다. 필자는 가격을 공개한다고 비용이 내려간다는 데는 회의적이지만, 그럼에도 이번 시도만큼은 응원한다고 밝힌다.","insight":"미국에서는 같은 검사라도 어디서 받느냐에 따라 값이 크게 달라지는데, 소비자가 그 차이를 미리 알기는 어렵다. 이번 꼭지의 보험사도 전체 가격표를 펼치는 대신 값이 싼 네 곳으로 좁혀 보여 주는 방식을 골랐다. 앱에서도 MRI나 혈액검사처럼 값 차이가 큰 흔한 항목을 열 개 안쪽으로 골라, 사용자가 사는 지역의 기준가와 그보다 눈에 띄게 싼 곳을 짚어 주는 화면은 3개월 안에 만들 수 있다. 다만 이 기능의 성패는 화면이 아니라 가격 자료를 구하는 데 달려 있으므로, 메디케어의 지역별 수가표처럼 이미 공개되어 있고 정리된 자료부터 붙여 보고, 값을 보여 주는 것만으로 실제로 가는 곳이 바뀌는지를 먼저 확인해야 한다.","signal":null,"author":[{"claim":"가격 투명성이 실제로 비용을 줄이는 데 도움이 될 것이라는 데 여전히 꽤 회의적이다.","evidence":"비싸게 받는 의료 제공자는 그래도 되니 계속 비싸게 유지하고, 싸게 받던 쪽은 공개된 높은 가격을 근거로 자기 가격을 올린다는 논리를 폈다. 실제 사례로 No Surprises Act의 결과와 노스캐롤라이나 주 공무원 건강보험의 Clear Pricing Project 결과를 들었다."},{"claim":"그럼에도 투명성이 비용을 줄일 수 있다면 이번 BCBS VT 같은 시도를 통해서일 것이다.","evidence":"근거를 대지 않았고, 경계를 밀어붙였다는 점을 높이 산다고만 적었다."},{"claim":"BCBS VT는 서로 어긋나는 두 가지를 동시에 맞춰야 하는 처지에 놓여 있다.","evidence":"지역 뉴스 보도를 근거로, 환자를 UVMMC에서 멀어지게 하면서도 UVMMC가 화가 나 네트워크를 떠나지 않게 해야 한다고 설명했다."}],"experts":[],"cases":[{"name":"Blue Cross Blue Shield of Vermont","what":"버몬트주 민간 보험사로, 값이 더 싼 의료기관 네 곳과 함께 Vermont Affordable Care라는 가격 비교 웹사이트를 열었다.","scale":"협력 의료기관 4곳","note":"보험사가 지역 최대 병원을 실명으로 지목했다는 점이 이례적이다. 가격 협상으로 이기지 못하니 환자의 선택을 움직여 우회하는 방식이다."},{"name":"University of Vermont Medical Center (UVMMC)","what":"버몬트에서 시장을 지배하는 대학병원으로, 비싼 곳으로 지목당한 쪽이다.","scale":"","note":"이 병원이 네트워크에서 빠지면 보험 상품 자체가 팔리지 않으므로, 지목당한 쪽이 오히려 협상에서 우위에 있다."},{"name":"BCBSM, BCBSNC","what":"미시간과 노스캐롤라이나의 블루크로스 계열 보험사로, 최근 의료비가 비싸다는 기고문을 실었다.","scale":"","note":"보험사들이 잇따라 공론장에 나서는 흐름이 있다는 것을 보여 주는 사례다."}],"notes":[{"term":"네트워크","ko":"보험사가 값을 미리 협상해 둔 병원 목록","plain":"미국 민간 보험사는 병원마다 따로 가격을 협상해 계약을 맺고, 그렇게 계약된 병원과 의사의 묶음을 네트워크라고 부른다. 가입자는 네트워크 안에서 진료받아야 제대로 보장을 받고, 밖으로 나가면 훨씬 많이 낸다. 그래서 지역에 대체할 곳이 없는 대형 병원은 네트워크 이탈을 무기로 삼아 협상에서 절대적으로 유리하다. 한국에는 이런 구분이 없어서 어느 병원에 가든 건강보험이 적용된다."},{"term":"Blues 플랜","ko":"블루크로스 블루실드 계열 보험사들","plain":"블루크로스 블루실드는 하나의 회사가 아니라 주 단위로 나뉜 여러 회사가 같은 상표를 함께 쓰는 형태다. 버몬트, 미시간, 노스캐롤라이나 조직이 각각 별개 회사이며 그래서 하는 말도 서로 다르다. 한국에서 건강보험공단 하나가 전국을 맡는 것과 대비된다."},{"term":"학술 의료 센터","ko":"의대에 딸린 대형 병원","plain":"연구와 교육을 함께 하는 대학병원을 말한다. 미국에서는 대개 이런 곳의 가격이 가장 비싸고, 지역에 하나뿐인 경우가 많아 사실상 대체지가 없다."},{"term":"No Surprises Act","ko":"예상 밖 청구서 금지법","plain":"환자가 네트워크 안의 병원에서 진료를 받았는데 그 안에 있던 일부 의사가 계약 밖이어서 나중에 큰 청구서를 따로 받는 일이 흔했고, 그것을 막으려고 만든 법이다. 필자는 이 법의 결과를 두고, 가격 정보가 드러났다고 해서 값이 내려가지는 않았다는 사례로 인용한다."}]},{"heading_ko":"다른 주요 소식: CMS 농촌 의료 전환 자금 배분","heading_en":"Other Top Headlines","skip":null,"summary":"CMS가 500억 달러 규모 농촌 의료 전환 프로그램의 2026년 몫을 주별로 배분했다. 필자가 짚는 대목은 절대 금액 순위와 농촌 인구 1인당 금액 순위가 완전히 뒤집힌다는 점이다.","insight":null,"signal":null,"author":[{"claim":"각 주의 농촌 인구를 기준으로 1인당으로 계산하면 로드아일랜드가 압도적 1위이고 텍사스는 오히려 맨 아래다.","evidence":"'계산해 보면'이라고만 적었고, 계산 과정이나 농촌 인구 자료의 출처는 밝히지 않았다."}],"experts":[],"cases":[{"name":"Rural Health Transformation Program","what":"CMS가 운영하는 농촌 의료 전환 지원 프로그램으로, 2026년 배분액을 발표했다.","scale":"총 500억 달러 규모, 2026년 100억 달러를 50개 주 전체에 배분. 텍사스 2억 8,100만 달러, 알래스카 2억 7,200만 달러, 뉴저지 1억 4,700만 달러","note":"금액이 가장 큰 주가 1인당으로는 가장 적을 수 있다는 점을 필자가 지적한다."}],"notes":[{"term":"CMS","ko":"메디케어·메디케이드 서비스 센터","plain":"미국 연방 정부 기관으로, 노인 대상 공보험인 메디케어와 저소득층 대상 공보험인 메디케이드를 운영한다. 전 국민을 맡는 것이 아니라 이 두 집단만 맡는다는 점이 한국 건강보험공단과 결정적으로 다르다. 미국에서 나머지 사람들은 대부분 직장에서 받는 민간 보험을 쓴다. 가격과 지불 방식을 바꾸는 실험도 이 기관이 주도한다."}]},{"heading_ko":"다른 주요 소식: Prenuvo 의료과실 소송","heading_en":"Other Top Headlines","skip":null,"summary":"스캔 검사를 파는 Prenuvo가, 스캔을 받은 뒤 뇌졸중을 겪은 환자에게 소송을 당했다. 필자는 이 사건과 담당 영상의학과 의사의 별건 유죄 인정을 묶어, 이 회사가 내세워 온 첨단 기술 서사와 어긋나는 신호로 읽는다.","insight":null,"signal":"Prenuvo는 증상이 없는 사람이 직접 돈을 내고 받는 몸 전체 영상 검사를 파는 회사이며, 2025년 초에 1억 2,000만 달러를 유치했다. 이번 소송을 낸 사람은 2023년에 이 검사를 받고 결과가 정상이라는 통보를 받은 뒤 뇌졸중을 겪은 환자다. 미국에는 국가 건강검진 제도가 없어서 검진을 받으려면 소비자가 상품을 직접 사야 하고, 그 돈은 치료가 아니라 숨은 병이 없다는 확인을 사는 데 쓰인다. 그 확인이 틀렸을 때 소비자가 무엇을 잃는지를 이번 사건이 함께 보여 준다.","author":[{"claim":"이 사건은 Prenuvo가 투자 유치 때 내세운 첨단 기술 서사와 모순되는, 꽤 우려스러운 대목으로 보인다.","evidence":"소송 내용과 함께, 이 사건에 연루된 영상의학과 의사가 별건으로 2024년 1월 뉴욕에서 7,000만 달러가 넘는 보험 사기 계획에 가담한 혐의를 인정한 것으로 보인다는 점을 들었다. 필자 스스로 '저만 그런지 모르겠지만'이라고 단서를 달았다."}],"experts":[],"cases":[{"name":"Prenuvo","what":"몸을 훑는 영상 스캔 검사를 파는 회사로, 2023년 스캔을 받은 뒤 뇌졸중을 겪은 환자에게 담당 영상의학과 의사와 함께 의료과실 소송을 당했다. 소송은 뇌졸중을 막을 수 있었던 주요 경고 신호를 놓치고 결과가 정상이라고 알렸다고 주장한다.","scale":"2025년 초 1억 2,000만 달러 투자 유치, 담당 의사의 별건 보험 사기 규모 7,000만 달러 이상","note":"판사가 캘리포니아 법에 따라 배상액에 상한을 두려는 회사 측 시도를 기각했다. 사건은 아직 진행 중이다."}],"notes":[{"term":"전신 스캔 검진","ko":"증상이 없는 사람이 돈을 내고 받는 몸 전체 영상 검사","plain":"미국에는 한국 같은 국가 건강검진 제도가 없어서, 검진을 받으려면 개인이 직접 돈을 내고 상품을 사야 한다. Prenuvo가 파는 것은 증상이 없는 사람이 몇 천 달러를 내고 몸 전체를 영상으로 훑어 숨은 병을 찾는 검사다. 보험이 아니라 소비자가 직접 결제하기 때문에 광고와 기술 서사가 판매의 중심이 된다. 그래서 '정상'이라는 결과를 받은 사람이 곧바로 뇌졸중을 겪었다는 사실이 이 사업 모델 자체에 대한 문제 제기가 된다."},{"term":"의료과실 배상 상한","ko":"캘리포니아 법상 배상액 한도","plain":"캘리포니아에는 의료과실 소송에서 정신적 피해에 대한 배상액을 법으로 제한하는 규정이 있다. 병원과 의사가 소송 위험 때문에 진료를 꺼리는 일을 막으려고 만든 장치인데, 피고 입장에서는 물어 줄 금액의 상한이 미리 정해지므로 유리하게 작용한다. 이번 사건에서 판사가 그 상한을 적용하지 않았다는 것은, 회사 쪽이 지게 될 금전적 위험이 그만큼 커졌다는 뜻이다."}]},{"heading_ko":"다른 주요 소식: 먹는 Wegovy 승인","heading_en":"Other Top Headlines","skip":null,"summary":"FDA가 노보 노디스크의 먹는 Wegovy를 승인했다는 한 줄 소식이다. 필자는 별도의 의견을 붙이지 않았다.","insight":"먹는 형태가 나오면 주삿바늘 때문에 시작하지 못하던 사람에게도 문이 열리므로, 이 약을 쓰는 사람은 더 늘어날 여지가 있다. 약을 쓰기 시작한 사람에게는 메스꺼움 같은 부작용을 견디는 문제, 근육량이 함께 빠지지 않도록 단백질을 챙기는 문제, 약을 끊은 뒤 체중이 되돌아오는 문제가 곧바로 따라온다. 이런 일은 기록 화면과 알림만으로 다룰 수 있고 처방권이나 규제 허가가 필요하지 않으므로, 약을 파는 자리가 아니라 이미 약을 쓰는 사람의 하루를 돕는 자리를 3개월 안에 시험해 볼 수 있다.","signal":null,"author":[],"experts":[],"cases":[{"name":"Novo Nordisk","what":"비만 치료제 Wegovy를 만드는 제약사로, 주사가 아니라 먹는 알약 형태의 Wegovy를 FDA에서 승인받았다.","scale":"","note":""}],"notes":[{"term":"Wegovy","ko":"GLP-1 계열 비만 치료제","plain":"식욕을 억제하는 호르몬과 비슷하게 작용해 체중을 줄이는 약이며, 지금까지는 주 1회 스스로 놓는 주사 형태였다. 미국에서는 이 계열 약이 몇 년 사이 크게 퍼지면서 체중 관리 시장 전체를 바꿔 놓았다."}]},{"heading_ko":"투자 소식: TrueMed","heading_en":"Funding Announcements","skip":null,"summary":"미국 근로자가 세금 혜택이 붙은 의료비 계좌에 쌓아 둔 돈을 쓸 수 있게 해 주는 마켓플레이스 TrueMed가 투자를 받았다. 필자는 노화 관리 상품에 대한 관심과 이 계좌에 대한 정치적 지지가 겹치는 국면이라 이 회사가 유리한 자리에 있다고 본다.","insight":null,"signal":"TrueMed는 세금 혜택이 붙은 의료비 전용 계좌에 쌓인 돈을 쓸 수 있는 상품을 모아 파는 마켓플레이스이며, a16z가 주도한 라운드에서 3,400만 달러를 유치했다. 필자는 노화를 늦추고 오래 살기 위한 상품에 관심이 커지는 상황과 이 계좌에 정치적 지지가 붙은 상황이 겹친다는 점을 들어, 이 회사가 유리한 자리에 있다고 봤다. 미국 소비자에게는 의료비로만 쓸 수 있게 떼어 둔 자기 돈이 있는데, 무엇이 의료비로 인정되는지가 분명하지 않아서 쓰기가 어렵다. 이미 자기 손에 있는 돈을 쓰게 해 주는 일 자체가 상품이 된다는 것을 이 꼭지가 보여 준다.","author":[{"claim":"TrueMed는 이 시장이 커지는 국면에서 유리한 위치에 있어 보인다.","evidence":"노화를 늦추고 오래 살기 위한 상품(롱제비티)에 대한 관심이 커지고 있다는 점과 HSA 계좌에 정치적 지지가 있다는 점을 들었을 뿐, 구체적인 수치는 대지 않았다."}],"experts":[],"cases":[{"name":"TrueMed","what":"HSA와 FSA에 쌓인 혜택 자금을 쓸 수 있는 상품을 모아 파는 마켓플레이스다.","scale":"3,400만 달러 유치, a16z 주도","note":"쓰기 어려운 돈을 쓰게 만들어 주는 것 자체가 상품이 된다는 점을 보여 주는 사례다."}],"notes":[{"term":"HSA / FSA","ko":"세금 혜택이 붙은 의료비 전용 계좌","plain":"미국 근로자가 세금을 떼기 전 급여의 일부를 따로 떼어 두었다가 의료비에만 쓰는 계좌다. HSA는 본인이 먼저 부담하는 금액이 큰 보험에 든 사람만 열 수 있고 남은 돈을 다음 해로 넘길 수 있는 반면, FSA는 고용주가 제공하며 연말에 남은 돈은 대개 사라진다. 문제는 무엇이 의료비로 인정되는지가 분명하지 않다는 점이며, 인정받으려면 의사가 써 준 의학적 필요 소견서가 있어야 하는 품목도 있다. 한국의 연말정산 의료비 공제와 목적은 비슷하지만, 돈을 따로 쌓아 두는 별도 계좌라는 점이 다르다."}]},{"heading_ko":"읽고 있는 글: Town Hall Ventures의 2026년 예측","heading_en":"What I'm Reading: Town Hall Ventures' 2026 Predictions","skip":null,"summary":"필자가 2026년 예측 글은 대부분 피했지만 이 글만은 정책 지형에 관해 볼 만하다고 소개하는 짧은 대목이다. 짚은 지점은 CMS 산하 혁신센터가 새로 내놓는 지불 모델의 한 요소이며, 그것이 진료비를 미리 정액으로 넘기는 방식을 늘릴 수 있다는 관측이다.","insight":null,"signal":null,"author":[{"claim":"이 글은 특히 정책 지형에 관해 흥미로운 관점이 몇 가지 있다.","evidence":"CMMI의 새 LEAD 모델에서 CARA를 다룬 대목을 구체적인 이유로 들었다."}],"experts":[{"who":"Andy Slavitt, Josh Loria, Andie Steinberg","role":"헬스케어에 투자하는 벤처 회사 Town Hall Ventures에서 2026년 예측 글을 쓴 사람들이다. 자신들이 투자한 분야가 커진다고 말할 이해관계가 있다.","claim":"CARA가 CMMI의 새 LEAD 모델에서 핵심 요소이며, 이것이 서브 캐피테이션 모델의 의미 있는 증가로 이어질 수 있다.","evidence":"뉴스레터는 이 관측만 옮겼을 뿐, 그들이 든 근거는 옮기지 않았다. 다만 원문 문장 구조상 서브 캐피테이션이 늘어날 수 있다는 관측을 글쓴이들이 한 것인지 필자가 덧붙인 것인지는 분명하지 않다."}],"cases":[],"notes":[{"term":"CARA, LEAD 모델","ko":"원문이 풀어 쓰지 않은 약어","plain":"LEAD는 CMS 산하 혁신센터가 새로 내놓는 지불 모델의 이름이고, CARA는 필자가 그 모델의 핵심 요소라고 소개한 구성 부분이다. 원문은 두 약어를 풀어 쓰지도, 내용을 설명하지도 않았으므로 이 뉴스레터만 읽어서는 무엇인지 알 수 없다. 여기서 읽어 낼 수 있는 것은 지불 방식이 정액제 쪽으로 더 옮겨 갈 수 있다는 방향뿐이다."},{"term":"CMMI","ko":"CMS 산하 혁신센터","plain":"메디케어와 메디케이드를 운영하는 연방 기관 안에 있는 조직으로, 새로운 진료비 지불 방식을 시범 사업으로 돌려 보고 효과가 있으면 넓히는 일을 한다. 미국에서 지불 방식이 바뀔 때 그 실험은 대개 여기서 시작된다. 한국에는 이렇게 지불 방식을 바꿔 보는 상설 조직이 사실상 없다."},{"term":"캐피테이션 / 서브 캐피테이션","ko":"환자 1인당 월정액 방식 / 그 정액을 다시 나눠 넘기는 방식","plain":"행위별 수가제에서는 진료를 한 건 할 때마다 돈을 받지만, 캐피테이션에서는 환자 한 명당 한 달에 얼마씩 미리 받고 그 안에서 진료를 책임진다. 많이 진료할수록 자기 손해가 되므로 불필요한 진료를 줄일 동기가 생기지만, 반대로 필요한 진료까지 미룰 위험이 함께 생긴다. 서브 캐피테이션은 그렇게 받은 정액의 일부를 다시 하위 진료 그룹에 넘겨 위험까지 함께 떠넘기는 방식이다."}]},{"heading_ko":"읽고 있는 글: 마크 큐번의 헬스케어 처방","heading_en":"What I'm Reading: Mark Cuban Tells Us How He Can Fix America's Sh!tty Health Care","skip":null,"summary":"마크 큐번이 미국 헬스케어를 어떻게 고칠지 이야기한 인터뷰를 소개하는 대목이다. 필자는 이 서사가 작년과 똑같이 반복된다고 느끼며, 큐번의 과도한 단순화와 손가락질을 비판한다. 다만 저가 약 판매 사업이 만든 성과는 인정한다.","insight":null,"signal":null,"author":[{"claim":"큐번이 하는 말 중 어떤 것은 말이 되고 어떤 것은 그렇지 않다는 Cohn의 평가에 동의한다.","evidence":"이 평가는 필자가 따로 검증한 것이 아니라 인터뷰를 진행한 Cohn의 평가에 동의한다고 밝힌 것이며, 어떤 대목이 왜 말이 되지 않는지는 짚지 않았다."},{"claim":"큐번의 전반적인 과도한 단순화와 손가락질은 대화를 생산적으로 진전시키는 데 전혀 도움이 되지 않는다.","evidence":"근거를 대지 않았다."},{"claim":"큐번은 자신이 대화에서 드러내는 것보다 이 문제의 복잡성을 훨씬 잘 알고 있음이 분명하다.","evidence":"10Plan과 Cost Plus Wellness가 확산에 실패했다는 점, 그리고 Cost Plus Drugs에서 Humana와 파트너십을 맺고 싶어 했다는 점을 들었다."},{"claim":"Cost Plus Drugs가 만들어 낸 임팩트에 대해서는 큐번이 인정받을 자격이 있다.","evidence":"근거를 대지 않았다."}],"experts":[{"who":"Jonathan Cohn","role":"The Bulwark에서 큐번을 인터뷰한 기자다. 원문은 그의 이력을 따로 소개하지 않았다.","claim":"큐번이 하는 말 중 일부는 말이 되고 일부는 그렇지 않다.","evidence":"필자가 그 글의 정서를 요약했을 뿐, Cohn이 든 근거는 옮기지 않았다."},{"who":"Mark Cuban","role":"억만장자 사업가이자 저가 약 판매 사업 Cost Plus Drugs의 창업자다. 자기 사업 방식이 해법이라고 말할 이해관계가 있다.","claim":"미국 헬스케어는 망가져 있고 자신은 그것을 고칠 방법을 알고 있다는 입장이다.","evidence":"뉴스레터는 그 방법의 구체적인 내용을 옮기지 않았다. 필자는 그가 이 대화에서 다른 거의 모든 사람을 바보이거나 악한 사람으로 취급하는 것처럼 보인다고 평가했는데, 이 평가는 필자의 것이지 큐번이 한 말이 아니다."}],"cases":[{"name":"Cost Plus Drugs","what":"큐번이 만든 회사로, 약의 원가에 정해진 마진만 붙여 값을 공개하고 파는 방식을 내세운다.","scale":"","note":"필자가 유일하게 성과를 인정하는 대목이다. 다만 Humana와 손잡고 싶어 했다는 사실은, 기존 유통 구조를 우회하기가 그만큼 어렵다는 뜻으로 읽힌다."},{"name":"10Plan","what":"큐번이 몇 년 전에 내놓은 미국 헬스케어 재원 조달 계획이다.","scale":"","note":"필자가 연휴 동안 새로 알게 됐다고 밝힌 사실이며, 확산에는 실패했다."},{"name":"Cost Plus Wellness","what":"큐번이 벌인 또 다른 시도로, 확산에 실패한 사례로 언급된다.","scale":"","note":""}],"notes":[{"term":"원가 공개 방식의 약 판매","ko":"Cost Plus Drugs가 내세우는 판매 방식","plain":"미국에서는 같은 복제약이라도 약국과 보험에 따라 값이 몇 배씩 달라진다. 보험사와 약국 사이에 약값 협상과 정산을 대신 맡는 중간 사업자가 끼어 있고, 그 단계에서 붙는 금액이 밖에서 보이지 않기 때문이다. Cost Plus Drugs는 그 중간 단계를 건너뛰고 매입 원가에 정해진 마진과 배송비만 붙여 값을 공개해서 판다. 필자가 이 회사의 성과만은 인정한다고 적은 이유가 여기에 있다."}]}],"themes":["ai-admin","value-based-care","price-transparency","consumer-dtc","rural-access","pharma-glp1"],"for_later":[]},{"index":"26","date":"2026-03-29","type":"reads","title_en":"Weekly Health Tech Reads 3/29/26","title_ko":"펩타이드 열풍과 펀딩 열두 건","hook":"미국 소비자가 정체를 모르는 주사를 스스로 사는 동안, 투자자는 그 흐름에 돈을 걸었다.","tldr":[{"point":"필자는 2026년 1분기를 마무리하며 올해 헬스케어 논의를 지배하는 흐름으로 임상 진료의 AI와 롱제비티 모델 두 가지를 꼽는데, 이번 주에 발표된 스타트업 펀딩 열두 건도 대부분 이 두 가지 안에 들어간다. 병원 안에 엔지니어를 들여보내 AI 과제를 함께 만드는 Qualified Health가 1억 2,500만 달러를, 병원의 청구서를 보험사에 중계하는 Stedi가 5,000만 달러를 조달한 것이 그 예다.","note":"롱제비티 모델이란 아픈 데를 고치는 진료가 아니라, 건강한 사람이 자기 돈을 내고 노화를 늦추겠다며 검사와 주사를 받는 시장을 가리킨다."},{"point":"이번 회차의 중심 글은 필자가 회색 시장 펩타이드 열풍을 두고 쓴 단상이며, 그는 논쟁의 진짜 쟁점이 효능의 증거가 아니라 FDA 같은 기관에 대한 불신이라고 보고, 나쁜 결과와 규제 당국의 조사를 거쳐 펩타이드가 결국 자리 잡힌 시장으로 정착할 것이라고 예측한다. 같은 주에 롱제비티 진료 기관 eMed가 기업가치 20억 달러가 넘는 조건으로 2억 달러를, 조제 약국과 롱제비티 클리닉을 연결하는 VITL이 750만 달러를 조달했고, 필자는 이 두 건을 투자자가 앞으로 올 펩타이드 붐을 기대하고 있다는 신호로 읽는다. eMed가 고용주에게 자사 GLP-1 관리 상품을 팔면서 내세운 근거도 임상 결과가 아니라 환자 순응도 90%다.","note":"펩타이드는 아미노산이 짧게 이어진 물질을 통틀어 가리키는 말이지만, 미국에서 요즘 펩타이드라고 하면 대개 FDA가 그 용도로 승인하지 않은 채 롱제비티 클리닉이나 개인 수입 경로로 도는 주사제를 뜻한다."},{"point":"임상 진료용 AI 모델을 만드는 Doctronic이 12개월도 안 되는 사이 세 번째로 4,000만 달러를 조달했지만, 주간 방문자 30만 명 가운데 실제 유료 원격진료 방문으로 이어지는 비율은 2%가 되지 않는다.","note":"이 2%는 회사가 발표한 값이 아니라, 필자가 회사가 밝힌 연환산 매출 1,000만 달러와 상담 단가 39달러를 놓고 직접 역산한 추정치다."},{"point":"헬스케어 프로바이더 임원의 88%가 앞으로 12개월간 입원 건당 인건비가 오를 것이라고 답했고, 필자는 이 숫자가 AI 덕분에 곧 의료 공급 비용이 거의 사라진다는 여러 주장과 어긋난다고 본다. 같은 문제를 인력 쪽에서 푸는 회사도 이번 주에 돈을 받았는데, 학자금 대출 상환을 지원해 병원이 채용한 임상 인력이 오래 근무하도록 돕는 Clasp가 2,000만 달러를 조달했다.","note":"설문을 진행한 곳은 헬스케어 전문 투자사 Health Enterprise Partners이고 응답자는 이 회사에 돈을 댄 기관 150곳이므로, 표본이 업계 안쪽 시각에 치우쳐 있다는 점을 감안해야 한다."},{"point":"매사추세츠에서 고중증도 퇴원 건수가 최근 몇 년 사이 크게 늘었는데, 환자가 실제로 더 위중해진 것인지 아니면 AI 문서화 도구 덕분에 청구서에 무거운 코드가 더 많이 붙게 된 것인지를 두고 신문 기사가 의문을 제기한다. 같은 주에 의학 정보 검색으로 의사들 사이에 자리 잡은 OpenEvidence가 의사가 벌어들인 돈을 빠짐없이 받게 해 준다는 취지의 청구 코드 제품을 내놓아, 같은 흐름이 이미 상품으로 팔리고 있음을 보여 준다.","note":"미국은 진단이 무겁게 기록될수록 병원이 받는 금액이 커지기 때문에, 빠뜨린 코드를 찾아 붙여 주는 소프트웨어가 곧바로 병원 매출로 이어진다."},{"point":"미국 법무부가 뉴욕의 대형 병원 그룹 New York Presbyterian을 반독점으로 제소했고, 쟁점은 진료의 질이 아니라 보험사가 값싼 병원을 우대하거나 환자를 그쪽으로 안내하지 못하게 막는 계약 조항이다. 필자는 소장을 직접 읽어 본 뒤 특별히 강력한 사건으로 보이지는 않았다고 평가한다.","note":"미국은 전국민이 함께 드는 건강보험이 없어 보험사와 병원이 개별 계약으로 값을 정하기 때문에, 그 계약서에 적힌 문구 하나가 소비자가 내는 보험료와 본인 부담금을 좌우한다."},{"point":"직원 의료비를 회사 돈으로 직접 부담하는 고용주를 상대로 대안적 보험 플랜을 파는 XO Health가 전국으로 확장했고, 필자는 이를 몇 년째 말만 오가던 대안적 플랜 설계를 고용주들이 실제로 채택하기 시작하는 변곡점으로 읽는다.","note":"미국 직장인 상당수는 회사를 통해 건강보험에 드는데, 회사가 의료비를 직접 지급하는 방식에서는 의료비가 줄어든 만큼 회사가 이익을 보기 때문에 새로운 플랜을 시험할 동기가 생긴다."},{"point":"미국 공보험을 운영하는 연방 기관이 무엇을 잘한 진료로 볼 것인지 다시 정하는 자리에서 나온 첫 번째 시사점은 초점이 치료에서 예방 서비스로 옮겨 가고 있다는 것이며, 필자가 함께 소개한 다른 글도 의사에게 진료 건수가 아니라 환자를 건강하게 유지한 결과로 돈을 지급하자는 주장을 편다.","note":"연방 기관이 무엇을 측정하느냐에 따라 병원과 보험 플랜이 받는 금액이 달라지므로, 측정 항목이 바뀌면 현장이 힘을 쏟는 곳도 함께 바뀐다."}],"issue_insight":{"verdict":"yes","summary":"이번 회차의 서른두 꼭지 가운데 스물아홉 꼭지는 병원과 보험사, 청구 업무를 상대로 하는 B2B 소식이거나 뉴스레터 자체 홍보여서 B2C 앱 화면으로 옮길 것이 없다. 미국 소비자가 직접 등장하는 자리를 겹쳐 놓으면 하나의 판단이 나오는데, 소비자는 이미 자기 돈과 시간을 쓰고 있는데 그 결정이 맞는지 확인해 줄 곳이 없다는 것이다.","build":[{"title":"펩타이드와 GLP-1 자가 실험 일지","detail":"사용자가 무엇을 언제 시작했는지 표시해 두면, 이미 매일 받고 있는 걸음과 수면 데이터로 시작 전 4주와 시작 후 4주를 자동으로 대조해 보여 줄 수 있다. 효능을 주장하지 않고 본인 데이터만 비교하는 형태로 두면 규제 허가가 필요하지 않다.","section":9},{"title":"진단이 아니라 정보 제공으로 묶은 건강 상담 창구","detail":"증상과 검진 수치, 복용 중인 약에 대해 물어볼 수 있는 상담 창구는 3개월 안에 붙일 수 있다. 답변 범위를 정보 제공으로 묶어 진단이나 처방으로 읽히지 않게 설계하는 것이 관건이다.","section":15},{"title":"GLP-1 사용자를 계속 맞게 만드는 동반 트랙","detail":"주사 요일 알림과 투여 기록, 몸 상태 기록, 단백질 섭취와 걷기 과제를 한 묶음으로 엮으면 걸음 리워드가 이미 만들어 놓은 반복 행동에 얹을 수 있다. 약을 팔지 않으므로 허가는 필요 없지만, 미국 사용자 가운데 약을 쓰는 사람 수가 시험에 충분한지 먼저 확인해야 한다.","section":17}],"signal":[{"title":"승인 절차 밖의 주사제를 소비자가 스스로 사서 맞는다","detail":"필자는 소비자가 지갑을 열어 중국산 회색 시장 펩타이드를 주사하는 것으로 선호를 드러내고 있다고 적었고, 관심도가 지난 1년간 급등한 차트를 근거로 들었다. Gameday Men's Health가 미국 전역에 400개가 넘는 프랜차이즈 클리닉을 두고 있어, 이 수요가 오프라인 점포로도 규모를 갖췄다.","section":9},{"title":"무료 AI 상담에는 몰리지만 진료비는 2%도 내지 않는다","detail":"주간 방문자 30만 명이 무료 AI 상담 창구로 찾아오는데, 필자가 매출과 상담 단가로 역산한 유료 원격진료 전환은 2%에 미치지 못한다. 건강을 물어볼 곳을 찾는 수요와 진료비를 내는 수요는 크기가 다르다.","section":15},{"title":"GLP-1 시장에서 값이 붙는 것은 약이 아니라 계속 맞게 만드는 관리다","detail":"eMed는 골드 스탠더드를 주장하며 임상 결과가 아니라 환자 순응도 90%를 근거로 내걸고 2억 달러를 조달했다. 이 숫자는 회사의 자기 주장이지만, 시작한 사람이 계속 맞기 어려워하는 사정이 그만큼 흔하다는 것을 보여 준다.","section":17},{"title":"소비자가 직접 돈을 내는 롱제비티 클리닉이 630곳을 넘는다","detail":"조제 약국과 롱제비티 클리닉을 연결하는 VITL이 클리닉 고객 630곳과 연환산 매출 1,000만 달러를 밝혔다. 소비자가 스스로 찾아가 주사를 받는 창구와 그 공급망이 이미 매출을 내는 사업으로 서 있다는 뜻이다.","section":23}]},"sections":[{"heading_ko":"인사말","heading_en":"","skip":"admin","summary":"1분기를 마무리하며 이번 주에 다룰 주제를 예고하는 짧은 인사다. 다음 주는 부활절이라 쉬고 4월 6일에 라이브를 진행한다는 안내가 붙는다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"라이브 방송 예고","heading_en":"Catch The Grand Round Up LIVE, Tomorrow @ 12pm ET / 9am PT","skip":"promo","summary":"뉴스레터가 직접 운영하는 주간 라이브 방송을 알리는 자리다. 이번 주 게스트와 다룰 주제를 소개한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"법무부, New York Presbyterian 반독점 제소","heading_en":"Top Headlines","skip":null,"summary":"미국 법무부가 최근 몇 달 사이 두 번째로 대형 병원 그룹을 반독점으로 제소한 사건이다. 쟁점은 진료의 질이 아니라 병원이 보험사와 맺는 계약서의 조항들, 곧 그룹 병원을 전부 받아야 한다는 조항과 병원을 등급으로 나누거나 환자를 다른 병원으로 유도하지 못하게 막는 조항이다. 필자는 소장을 읽어 본 소감을 덧붙이는데, 사건 자체가 그리 강해 보이지 않는다는 쪽이다.","insight":null,"signal":null,"author":[{"claim":"특별히 강력한 반독점 사건이라는 느낌을 받지 못했으며, NYP는 자신이 고비용 상품임을 알고 그 위치를 편안해하는 조직처럼 읽힌다.","evidence":"소장에 실린 뉴욕시 지도들의 조합, 더 낮은 가격을 제시하는 경쟁자 이야기, NYP의 25% 시장 점유율에 대한 논의를 직접 읽은 인상을 근거로 든다."},{"claim":"가격을 낮추는 것이 주된 목표라면, 지금의 트레이드오프를 감안할 때 경쟁을 키우고 값을 내릴 가능성이 더 높은 다른 길들이 있다.","evidence":"그 다른 길이 무엇인지는 밝히지 않아 근거를 대지 않았다."}],"experts":[],"cases":[{"name":"미국 법무부(DOJ) 대 New York Presbyterian","what":"뉴욕시의 대형 병원 그룹인 New York Presbyterian이 보험사와 맺은 all-or-nothing 조항과 anti-tiering 및 steering 제한 조항을 걸어 반독점 소송을 제기했다.","scale":"NYP 시장 점유율 25%","note":"DOJ는 NYP가 내부 분석에서 티어링이 도입되면 매년 수억 달러의 이익이 사라진다는 결과를 얻었다고 지적한다. 병원이 그 조항의 값어치를 스스로 계산해 두었다는 뜻이다."}],"notes":[{"term":"티어링(tiering)과 anti-tiering, steering 조항","ko":"병원 등급 나누기와 그것을 금지하는 계약 조항","plain":"티어링은 보험사가 값이 싼 병원을 우대 등급에 넣어 환자 본인 부담을 낮춰 주고, 비싼 병원으로 가면 더 내게 만드는 방식이다. 미국은 전국민 단일 건강보험이 없고 보험사와 병원이 개별 계약으로 값을 정하므로, 병원을 등급으로 나누는 것이 보험사가 값을 누를 수 있는 몇 안 되는 수단이다. anti-tiering 조항은 계약서에 우리를 불리한 등급에 넣지 말라고 못 박아 그 수단을 막고, steering 제한 조항은 보험사가 환자를 더 싼 병원으로 안내하는 행위 자체를 막는다. 한국은 병원마다 수가가 다르지 않으므로 대응하는 제도 자체가 없다."},{"term":"all-or-nothing 조항","ko":"전부 아니면 전무 계약 조항","plain":"한 병원 그룹과 계약하려면 그 그룹에 속한 병원을 하나도 빼지 않고 모두 보험 네트워크에 넣어야 한다는 조건이다. 보험사가 값싼 병원만 골라 담아 보험료가 저렴한 상품을 만드는 길이 막힌다. DOJ가 더 저렴한 보험 상품이 시장에 들어오지 못한다고 보는 이유가 여기에 있다."}]},{"heading_ko":"뉴욕시 공공병원, Palantir 계약 종료","heading_en":"Top Headlines","skip":null,"summary":"뉴욕시 공공병원 시스템이 Palantir와의 계약을 갱신하지 않기로 했다. 제품 성능이나 성과가 아니라 Palantir가 이민 단속 기관을 포함한 정부 고객을 지원하는 데 대한 정치적 반발이 이유다. 계약 규모 자체는 크지 않다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"New York City Health + Hospitals","what":"청구와 수납 업무를 지원받으려고 써 온 Palantir와의 계약을 갱신하지 않기로 했다.","scale":"2023년 이후 지급액 약 400만 달러","note":"의료 소프트웨어 계약이 성능이 아니라 공급사의 다른 사업 때문에 끊긴 사례다."}],"notes":[{"term":"레비뉴 사이클 매니지먼트(RCM)","ko":"진료비 청구·수납 관리","plain":"환자를 진료한 뒤 보험사와 환자에게 실제로 돈을 받아 내기까지의 모든 과정을 관리하는 일이다. 미국은 보험사가 수천 곳이고 청구가 거절되면 근거를 붙여 다시 다투는 절차가 길어서, 병원 수익이 이 과정의 성패에 크게 좌우된다. 한국의 심평원 청구 업무보다 훨씬 손이 많이 가고, 그래서 이 영역만 다루는 회사와 소프트웨어가 따로 큰 시장을 이룬다."}]},{"heading_ko":"Infosys, Optimum Healthcare IT 인수","heading_en":"Top Headlines","skip":null,"summary":"헬스케어 IT 컨설팅 회사가 4억 6,500만 달러에 팔린 소식이다. 눈에 띄는 대목은 인수 금액보다 매출이 1년 만에 두 배 넘게 늘어난 속도와, 그 성장의 원인으로 지목된 것이 기술이 아니라 사람을 길러 낸 도제식 교육 프로그램이라는 점이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Infosys의 Optimum Healthcare IT 인수","what":"IT 서비스 기업 Infosys가 헬스케어 IT 컨설팅 회사 Optimum Healthcare IT를 인수한다고 발표했다.","scale":"인수가 4억 6,500만 달러, Optimum 매출 2024년 1억 700만 달러에서 2025년 2억 7,600만 달러","note":"Optimum의 대주주인 사모펀드(PE) 운용사는 지난 몇 년의 성장 요인으로 더 많은 인력을 업계로 끌어들인 도제식 교육 프로그램을 꼽는다."}],"notes":[]},{"heading_ko":"OpenEvidence, 청구 코드 제품 출시","heading_en":"Top Headlines","skip":null,"summary":"의학 정보 검색으로 의사들 사이에 자리 잡은 OpenEvidence가 청구 코드 영역까지 사업을 넓혔다. 의사가 벌어들인 돈을 빠짐없이 받게 해 준다는 취지의 제품이다. 필자는 전략의 논리는 이해하면서도 이미 경쟁이 치열한 시장에서 그 기세가 이어질지 의문을 남긴다.","insight":null,"signal":null,"author":[{"claim":"핵심인 검색 상품을 넘어 전통적인 청구·수납 기능으로 확장하는 것은 OpenEvidence로서 흥미로운 전략적 움직임이지만, 그 기세가 경쟁이 치열한 시장에서 어떻게 이어질지는 지켜봐야 한다.","evidence":"논리는 이해가 간다고만 밝힐 뿐 별도의 근거를 대지 않았으며, OpenEvidence가 이 제품의 사용량을 어떻게 발표하는지 보고 판단하겠다고 말한다."}],"experts":[],"cases":[{"name":"OpenEvidence Coding Intelligence","what":"의학 정보 검색 서비스인 OpenEvidence가 진료 내용을 청구 코드로 옮기는 작업을 돕는 새 제품을 출시했다.","scale":"","note":"제품 문구가 진료의 질이 아니라 의사가 받는 돈을 앞세운다."}],"notes":[{"term":"메디컬 코딩(coding)","ko":"진료 내용을 청구 코드로 옮겨 적는 일","plain":"프로그래밍과는 아무 상관이 없다. 의사가 무엇을 진단하고 무엇을 했는지를 정해진 번호 체계로 바꿔 적는 사무 작업이다. 어떤 코드를 붙이느냐에 따라 병원과 의사가 받는 금액이 달라지므로, 빠뜨린 코드를 찾아 주는 소프트웨어가 곧바로 매출로 이어진다. 한국은 수가 항목이 비교적 단순하고 심평원 한 곳이 심사하지만, 미국은 코드 체계가 방대하고 보험사마다 규칙이 달라 전문 직군이 따로 있다."}]},{"heading_ko":"XO Health 전국 확장","heading_en":"Top Headlines","skip":null,"summary":"직원 의료비를 회사가 직접 부담하는 고용주를 상대로 대안적 보험 플랜을 파는 회사가 전국으로 확장한다. 필자가 주목하는 것은 이 회사 자체보다, 몇 년째 말만 오가던 대안적 플랜 설계를 고용주들이 실제로 채택하기 시작하는 변곡점이라는 판단이다.","insight":null,"signal":null,"author":[{"claim":"지난 몇 년간 대안적 플랜 설계를 이야기해 온 끝에 이제 고용주들이 실제로 움직이기 시작하는 변곡점에 와 있다.","evidence":"XO Health가 전국으로 확장한다는 사실 하나를 앞에 두었을 뿐, 고용주들이 실제로 움직이고 있다는 수치나 다른 사례는 대지 않았다."}],"experts":[],"cases":[{"name":"XO Health","what":"자가보험 고용주, level-funded 플랜, TPA를 대상으로 성과 기반 진료 네트워크를 묶어 파는 회사이며 전국 단위로 확장한다.","scale":"","note":"보험사를 거치지 않고 고용주가 직접 의료비를 관리하는 쪽에 붙은 사업이다."}],"notes":[{"term":"자가보험(self-insured) 고용주","ko":"직원 의료비를 회사 돈으로 직접 지급하는 고용주","plain":"미국 직장인 상당수는 회사를 통해 건강보험에 든다. 자가보험이란 회사가 보험사에서 완제품 보험 상품을 사는 대신, 직원의 의료비를 회사 돈으로 직접 지급하고 보험사에는 청구 처리 같은 사무만 맡기는 방식이다. 의료비가 줄면 그만큼 회사가 이익을 보기 때문에, 새로운 플랜 설계를 실험할 동기가 생긴다. 한국은 건강보험공단이 이 역할을 하므로 회사가 직원 의료비를 직접 떠안는 구조 자체가 없다."},{"term":"TPA와 level-funded 플랜","ko":"제3자 관리 업체와 준자가보험 플랜","plain":"TPA는 자가보험 회사를 대신해 청구 처리와 병원 네트워크 운영 같은 사무를 맡는 업체다. level-funded 플랜은 그 중간 형태로, 회사가 매달 정해진 금액을 내되 실제 의료비가 적게 나오면 남은 돈의 일부를 돌려받는 구조다. 규모가 작아 완전한 자가보험은 부담스러운 중소 고용주가 주로 쓴다."}]},{"heading_ko":"HMA, 메디케이드 애널리틱스 회사 인수","heading_en":"Top Headlines","skip":null,"summary":"컨설팅 회사 Health Management Associates가 저소득층 공공 의료 부조 프로그램에 특화된 데이터 분석 회사를 인수한다는 한 줄짜리 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Health Management Associates의 HealthTech Solutions 인수","what":"헬스케어 컨설팅 회사가 메디케이드에 특화된 애널리틱스 플랫폼을 인수한다고 발표했다.","scale":"","note":""}],"notes":[]},{"heading_ko":"단상: 나도 펩타이드를 맞아야 하나","heading_en":"MUSING: Should I be injecting myself with peptides?","skip":null,"summary":"필자가 미국의 펩타이드 열풍을 두고 자기 생각을 정리한 글이다. 본인은 회의적이지만 임상의 친구의 절제된 낙관론과 TBPN 방송에서 열린 Shkreli 대 Marchione의 30분짜리 공개 토론을 거치면서, 논쟁의 진짜 축이 효능의 증거가 아니라 FDA 같은 기관에 대한 불신이라고 본다. 마지막에는 이 시장이 어떻게 흘러갈지를 순서대로 예측한다.","insight":"미국 소비자가 자기 돈으로 정체를 정확히 모르는 물질을 몸에 넣고 있다는 것이 이 꼭지의 사실이고, 그 불안을 채워 주는 곳이 아직 없다. 앱에서 3개월 안에 만들 수 있는 것은 지금 무엇을 쓰고 있는지 기록하고 몸의 반응과 대조해 주는 자가 실험 일지다. 이미 걸음과 수면 데이터를 매일 받고 있으므로, 사용자가 펩타이드나 GLP-1, 보충제를 시작한 날짜를 표시해 두면 시작 전 4주와 시작 후 4주를 자동으로 비교해 보여 줄 수 있다. 효능을 주장하지 않고 본인 데이터만 대조하는 형태로 두면 규제 허가가 필요하지 않고, 어떤 물질을 얼마나 쓰는지에 대한 실사용 데이터가 우리 쪽에 쌓인다.","signal":"필자는 미국 소비자가 지갑을 열어 중국산 회색 시장 펩타이드를 몸에 주사하는 방식으로 자기 선호를 드러내고 있다고 적었고, 그 근거로 지난 1년간 펩타이드 관심도가 급등한 흐름을 보여 주는 2026년 3월 26일 Sherwood 기사의 차트를 들었다. 사는 이유는 승인 여부가 아니라 운동선수가 BPC-157로 회복이 빨라진다고 여기니 자기라고 못 쓸 이유가 없다는 판단이고, 사는 곳은 롱제비티 클리닉과 정식 유통 경로 밖의 회색 시장이다. 남성 대상 클리닉 브랜드 Gameday Men's Health가 미국 전역에 400개가 넘는 프랜차이즈 클리닉을 두고 있다는 사실은, 이 수요가 온라인의 화제에 그치지 않고 오프라인 점포로도 이미 규모를 갖췄음을 보여 준다. 미국 소비자가 승인 절차와 의료계 주류의 판단을 기다리지 않고 자기 돈으로 먼저 시험하고 있다는 뜻이다.","author":[{"claim":"필자는 회색 시장 펩타이드에 회의적이며, 자신은 이 시장에서 뒤늦게 따라가는 쪽이어도 괜찮다고 말한다.","evidence":"회색 시장 화합물은 사이클이 흘러가는 동안 다른 사람들이 실험하도록 두겠다고 밝히며, 앞으로 5년 안에 승인된 약이 나오면 답이 바뀔 것이라고 덧붙인다."},{"claim":"Shkreli가 내용상으로는 꽤 분명하게 토론에서 이겼지만, Marchione가 전투에서 지고 전쟁에서는 이기게 될 수 있다.","evidence":"Superpower와 Hims 같은 회사가 다가오는 연방 차원의 규제 완화를 배경으로 이 흐름에서 이익을 얻기 좋은 위치에 있다는 점, 이번 주 eMed와 VITL의 펀딩, Gameday Men's Health가 미국 전역에 400개 넘는 프랜차이즈 클리닉을 늘려 온 사실을 든다."},{"claim":"의료계 주류와 시티즌 사이언티스트는 서로 엇갈려 이야기하면서, FDA 같은 기관에 대한 불신이라는 훨씬 더 큰 사회적 대화를 정면으로 다루지 않고 주변만 이야기하고 있다.","evidence":"한쪽은 효과의 증거가 없다고 외치고 다른 쪽은 효과가 없다면 왜 이렇게 많이 쓰느냐고 되묻는 토론의 구도 자체를 근거로 삼는다."},{"claim":"결말은 예측 가능하다. 인기가 커지면 나쁜 행위자와 나쁜 결과가 나오고, 그것이 헤드라인이 되어 규제 당국의 조사를 부르며, 펩타이드는 결국 자리 잡힌 시장으로 정착한다.","evidence":"소비자들이 이미 지갑을 열어 중국산 회색 시장 펩타이드를 주사하며 선호를 드러내고 있다는 점을 근거로 들지만, 이 흐름이 실제로 그 순서를 밟는다는 증거는 대지 않았다."}],"experts":[{"who":"이름을 밝히지 않은 임상의 친구","role":"필자의 지인인 임상의이며, 원문은 이름과 소속, 이해관계를 밝히지 않는다","claim":"지금의 회색 시장은 후미진 곳일 수 있지만, 염증을 억제하면 건강상 상당한 이득이 따른다는 일반적인 발상 자체에는 근거가 있다. 10년 뒤 펩타이드를 GLP-1과 같은 혁명적 잠재력을 가진 것으로 보게 될 가능성도 충분하다.","evidence":"염증 억제라는 기전의 일반적 타당성만 들 뿐 특정 연구나 데이터를 제시하지 않았다."},{"who":"Martin Shkreli","role":"원문이 이른바 파마 브로라고 소개한 인물이며, 펩타이드 회의론 쪽에서 토론에 나섰다","claim":"TBPN 토론에서 펩타이드의 유용성에 회의적인 입장을 폈다.","evidence":"뉴스레터는 토론 내용을 옮기지 않고 필자가 내용상 그가 이겼다고 평가한 사실만 전한다."},{"who":"Max Marchione","role":"롱제비티 검사·관리 서비스를 파는 Superpower의 CEO이며, 필자가 이 흐름에서 이익을 얻기 좋은 위치라고 꼽은 회사의 당사자다","claim":"TBPN 토론에서 펩타이드의 유용성을 옹호하는 입장을 폈다.","evidence":"뉴스레터는 토론 내용을 옮기지 않았고, 필자는 그가 내용상으로는 밀렸다고 평가한다."}],"cases":[{"name":"Gameday Men's Health","what":"남성 대상 클리닉 브랜드이며, 프랜차이즈 방식으로 조용히 점포 수를 늘려 왔다.","scale":"미국 전역 400개 이상 프랜차이즈 클리닉","note":"이 시장이 온라인 화제만이 아니라 오프라인 점포로도 이미 규모를 갖췄다는 신호다."},{"name":"Sherwood 기사의 펩타이드 관심도 차트","what":"2026년 3월 26일 Sherwood 기사에 실린 차트로, 지난 1년간 펩타이드에 대한 관심이 급등한 흐름을 보여 준다.","scale":"","note":"필자가 이 열풍을 실재하는 현상으로 다루는 근거다."}],"notes":[{"term":"펩타이드(peptide)","ko":"아미노산이 짧게 이어진 물질","plain":"아미노산이 짧게 연결된 물질을 통틀어 가리키는 말이다. 비만·당뇨 주사제인 GLP-1도 펩타이드지만, 요즘 미국에서 사람들이 펩타이드라고 말할 때는 대개 FDA가 그 용도로 승인하지 않은 채 롱제비티 클리닉이나 개인 수입 경로로 도는 주사제를 뜻한다. 필자도 이 둘을 다른 범주로 구분해 쓴다."},{"term":"회색 시장(grey market)","ko":"정식 승인·유통 경로 밖의 거래 영역","plain":"완전한 암거래는 아니지만 정식 승인과 유통 경로를 벗어나 사고파는 영역이다. 성분과 함량을 보증하는 주체가 없어서, 소비자가 자기가 무엇을 얼마나 맞고 있는지 확인할 방법이 사실상 없다. 필자가 나쁜 결과와 이목을 끄는 헤드라인을 예상하는 이유가 여기에 있다."},{"term":"시티즌 사이언티스트(citizen scientist)","ko":"스스로 실험하고 결과를 공유하는 비전문가","plain":"의료 전문가가 아니면서 자기 몸으로 직접 시도해 보고 결과를 인터넷에 공유하는 사용자들을 가리킨다. 이 꼭지의 대립 구도가 바로 의료계 주류 대 이들이다. 이들은 승인 여부보다 실제로 쓰는 사람이 많다는 사실을 근거로 삼는다."},{"term":"BPC-157과 retatrutide","ko":"회색 시장 펩타이드와 파이프라인의 차세대 약","plain":"BPC-157은 운동선수들 사이에서 회복을 빠르게 해 준다고 여겨지는 회색 시장 펩타이드로, 필자가 소비자 심리를 설명할 때 예로 든다. retatrutide는 아직 개발 단계에 있는 약으로, 필자가 5년 안에 자기 답이 바뀔 계기로 꼽는 승인된 선택지의 예다."}]},{"heading_ko":"곱씹어 볼 숫자: 88%","heading_en":"A NUMBER TO PONDER","skip":null,"summary":"헬스케어 투자사 HEP의 연례 설문에서 나온 숫자 하나를 짚는 자리다. 프로바이더 임원의 88%가 앞으로 1년간 입원 건당 인건비가 오를 것으로 본다는 결과이며, 필자는 이를 AI가 곧 의료 공급 비용을 극적으로 낮춘다는 전망과 나란히 놓는다.","insight":null,"signal":null,"author":[{"claim":"이 88%라는 수치는 AI가 가까운 미래에 비용 제로에 가까운 의료 공급의 풍요를 가져올 것이라는 여러 사설류의 주장과 상반되어 보인다.","evidence":"HEP가 자사 출자 기관 150곳을 상대로 진행한 설문 결과를 근거로 든다."}],"experts":[{"who":"Ezra Mehlman, Tom Cassels","role":"각각 헬스케어 전문 투자사 HEP의 Managing Partner와 Operating Partner이며, 이 설문 리포트를 낸 당사자다","claim":"AI가 촉발할 파괴의 가능성이 있는 동시에, 조직 재설계는 시간이 오래 걸리는 과정이다.","evidence":"필자가 팟캐스트 대화에서 들은 내용을 요약해 전할 뿐 구체적인 근거는 옮기지 않았다."}],"cases":[{"name":"Health Enterprise Partners 연례 설문","what":"헬스케어 전문 투자사가 자사에 출자한 기관 150곳을 상대로 업계 전망을 물었다.","scale":"응답자 150곳, 입원 건당 인건비 상승 전망 88%","note":"응답자가 이 투자사에 돈을 댄 업계 안쪽 조직들이므로, 표본이 업계 내부의 시각에 치우쳐 있다는 점을 감안해야 한다."}],"notes":[{"term":"입원 건당 인건비(labor costs per admit)","ko":"환자 한 명을 입원시켜 퇴원시킬 때까지 드는 인건비","plain":"병원 비용을 환자 수로 나눈 단위 지표다. 미국 병원은 보험사와 이미 정해 둔 값 때문에 진료비를 마음대로 올릴 수 없으므로, 이 숫자가 오르면 이익이 그만큼 그대로 깎인다. 그래서 병원들이 사람이 많이 드는 자리부터 자동화하려는 압력이 생긴다."},{"term":"LP","ko":"펀드에 돈을 대는 출자자","plain":"투자 펀드에 자금을 대는 쪽을 가리킨다. 여기서는 헬스케어 전문 투자사 HEP에 출자한 업계 조직들을 뜻하므로, 설문 응답자가 곧 업계 임원들이다."}]},{"heading_ko":"이번 주의 차트: 매사추세츠 패혈증 급증","heading_en":"CHART OF THE WEEK","skip":null,"summary":"매사추세츠에서 고중증도 퇴원 건수가 최근 몇 년 사이 크게 늘었다는 신문 기사의 차트를 옮긴 자리다. 환자가 실제로 더 위중해진 것인지, 아니면 AI 문서화 도구 덕에 청구서에 무거운 코드가 더 많이 붙게 된 것인지가 쟁점이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Boston Globe의 매사추세츠 패혈증 기사","what":"2026년 3월 20일 Boston Globe 기사로, 매사추세츠에서 고중증도 퇴원 건수가 지난 몇 년 사이 극적으로 증가한 현상을 다루고 그 원인 후보로 AI가 이끄는 코딩 인텐시티를 거론했다.","scale":"","note":"AI 도구의 효과를 문서화 품질 개선으로 볼지 청구 부풀리기로 볼지가 갈리는 지점이다."}],"notes":[{"term":"코딩 인텐시티(coding intensity)","ko":"청구 코드가 점점 무거워지는 현상","plain":"환자의 실제 상태는 그대로인데 청구서에 붙는 진단 코드가 갈수록 무거워지는 현상을 가리킨다. 미국은 중증도가 높게 기록될수록 병원이 받는 금액이 커지므로, 빠진 진단을 찾아 붙여 주는 AI 도구가 퍼지면 진짜 중증 환자가 늘지 않아도 고중증도 퇴원 건수가 늘어난다. 한국도 상병 코드에 따라 수가가 달라지지만, 미국은 그 차이가 훨씬 커서 이 문제가 오래된 논쟁거리다."}]},{"heading_ko":"펀딩: Qualified Health 1억 2,500만 달러","heading_en":"Funding Announcements","skip":null,"summary":"병원 그룹 안에 엔지니어를 들여보내 AI 과제를 함께 만들어 주는 회사가 큰 규모의 투자를 받았다. 소프트웨어만 파는 것이 아니라 사람을 붙여 파는 모델이다.","insight":null,"signal":null,"author":[{"claim":"Qualified Health는 Palantir나 Health Catalyst와 비슷한 접근을 취하는 것으로 보인다.","evidence":"엔지니어를 헬스 시스템 내부에 투입해 여러 AI 기회를 구축하고 실행하도록 돕는 방식이라는 점을 든다."}],"experts":[],"cases":[{"name":"Qualified Health","what":"헬스 시스템용 AI 플랫폼을 파는 회사이며 New Enterprise Associates가 주도한 라운드로 자금을 조달했다.","scale":"1억 2,500만 달러","note":"Mercy, Emory Healthcare, University of Rochester Medicine, Jefferson Health, University of Texas System을 고객으로 꼽는다."}],"notes":[]},{"heading_ko":"펀딩: Stedi 5,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"병원의 청구서를 보험사에 중계하는 회사가 직전 라운드 7개월 만에 다시 투자를 받았다. 유료 고객과 처리 건수가 배수로 늘었다는 점을 근거로 내세운다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Stedi","what":"클레임 클리어링하우스를 운영하며 Addition이 주도한 라운드로 자금을 조달했다.","scale":"5,000만 달러 조달, 누적 1억 4,200만 달러, 유료 고객 6배·청구 트랜잭션 7배 증가, 연간 10억 건 이상 처리","note":"직전 라운드로부터 겨우 7개월 만이라는 점을 필자가 짚는다. 고객 수와 처리 건수는 회사 발표다."}],"notes":[{"term":"클레임 클리어링하우스(claims clearinghouse)","ko":"청구서 중계 회사","plain":"병원이 보낸 진료비 청구서를 각 보험사가 읽을 수 있는 형식으로 바꿔 전달하고, 자격 확인 같은 조회도 중계하는 회사다. 미국은 보험사가 수천 곳이고 저마다 요구하는 형식이 달라서 이 중계업이 독립된 산업으로 성립한다. 한국은 심평원이 창구를 하나로 모아 두어 이런 회사가 아예 필요 없다."}]},{"heading_ko":"펀딩: Thesis Care 4,500만 달러","heading_en":"Funding Announcements","skip":null,"summary":"임상의의 업무를 대신 처리하는 AI 에이전트를 만드는 회사가 투자를 받았다. 이전 사명은 Trovo Health였다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Thesis Care","what":"임상의를 위한 AI 에이전트를 만드는 스타트업이며 Oak HC/FT가 주도한 라운드로 자금을 조달했다.","scale":"4,500만 달러","note":"1차 진료와 전문 진료 조직에 걸쳐 수천 명의 프로바이더를 고객으로 두고 있다고 밝히며, 그 가운데 US Heart and Vascular를 이름으로 꼽는다."}],"notes":[]},{"heading_ko":"펀딩: Doctronic 4,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"AI가 진료 상담을 맡는 서비스가 12개월도 안 되어 세 번째 라운드를 받았다. 필자는 회사가 공개한 매출과 방문자 수를 역산해, 방문자 대비 실제 유료 진료 전환이 매우 낮다는 점을 짚는다.","insight":"여기서 눈여겨볼 것은 낮은 전환율이 아니라 그 분모다. 주간 30만 명이 AI에게 건강을 물어보려고 찾아오는데 그중 2%도 유료 진료로 넘어가지 않는다는 것은, 무료로 물어볼 창구에 대한 수요가 진료 수요보다 훨씬 크다는 뜻이다. 우리는 진료로 전환시킬 이유가 없으므로 이 수요가 그대로 앱을 여는 이유가 된다. 증상과 검진 수치, 복용 중인 약에 대해 물어보는 상담 창구는 3개월 안에 붙일 수 있고, 답변 범위를 정보 제공으로 묶어 진단이나 처방으로 읽히지 않게 설계하는 것이 관건이다.","signal":"Doctronic의 무료 AI 상담 창구에는 주간 방문자가 30만 명 넘게 찾아오지만, 회사가 밝힌 연환산 매출 1,000만 달러와 상담 단가 39달러를 놓고 필자가 역산한 결과 실제 유료 원격진료 방문으로 이어지는 비율은 2%가 되지 않는다. 이 2%는 회사 발표가 아니라 필자의 추정치이고, 월 약 21,000건의 상담에 해당한다. 건강을 물어볼 곳을 찾는 데 시간을 쓰는 사람은 아주 많지만 그 자리에서 진료비를 내는 사람은 그중 일부에 그친다는 뜻이다. Endpoints의 기자 Ngai Yeung도 이 서비스를 직접 써 본 뒤 AI 중심의 케어가 아직 갈 길이 남아 있다고 적었다.","author":[{"claim":"공개된 수치대로면 Doctronic은 현재 월 약 21,000건의 원격진료 상담을 하고 있으며, 이는 주간 방문자 30만 명 중 2% 미만에 대해서만 실제 방문이 이뤄진다는 뜻이다.","evidence":"회사가 밝힌 연환산 매출 1,000만 달러 이상과 주간 방문자 30만 명에, 상담 단가 39달러를 넣어 직접 역산한 계산식을 제시한다."}],"experts":[{"who":"Ngai Yeung","role":"Endpoints에 이 글을 쓴 기자다","claim":"기대와 달리 AI 중심의 케어는 아직 갈 길이 남아 있다.","evidence":"Doctronic을 직접 써 본 경험을 근거로 든다."}],"cases":[{"name":"Doctronic","what":"임상 진료를 위한 AI 모델을 만드는 회사이며 Abstract와 Lightspeed Venture Partners가 주도한 라운드로 자금을 조달했다.","scale":"4,000만 달러 조달, 12개월 내 세 번째 라운드, 시리즈 A 이후 6개월간 15배 성장, 연환산 매출 1,000만 달러 이상, 주간 방문자 30만 명 이상","note":"성장률과 방문자 수는 회사 발표이고, 전환율 2% 미만은 필자의 추정이다."}],"notes":[]},{"heading_ko":"펀딩: Adonis 4,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"AI로 청구와 수납을 처리하는 회사가 투자를 받았다. 보도자료가 내세운 근거는 매출 성장률과 기존 고객이 지출을 늘렸다는 지표다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Adonis","what":"AI 중심의 청구·수납 관리 플랫폼이며 Quadrille Capital이 주도하고 General Catalyst와 Bling Capital이 참여한 라운드로 자금을 조달했다.","scale":"4,000만 달러 조달, 누적 9,400만 달러, 2025년 매출 4배 성장, 순유지율 130% 이상","note":"Mount Sinai가 고객으로 인용되어 있다. 매출 성장률과 순유지율은 보도자료에 실린 회사 발표다."}],"notes":[]},{"heading_ko":"펀딩: eMed 2억 달러","heading_en":"Funding Announcements","skip":null,"summary":"롱제비티 진료 기관이 20억 달러가 넘는 기업가치로 대형 투자를 받았다. 리드 투자자가 보험 중개 회사라는 점, Tom Brady를 최고 웰니스 책임자로 두었다는 점이 이례적이다. 회사가 자기 상품의 근거로 내세운 숫자가 치료 성적이 아니라 환자 순응도라는 대목이 눈에 띈다.","insight":"eMed가 고용주에게 골드 스탠더드를 주장하며 내민 근거가 임상 결과가 아니라 환자 순응도 90%라는 점이 중요하다. 미국 GLP-1 시장에서 값을 인정받는 것은 약 자체가 아니라 계속 맞게 만드는 관리이며, 그것은 진료 행위가 아니라 습관 설계의 문제다. 우리 앱은 이미 걸음 리워드로 매일 반복하는 행동을 만들고 있으므로, 주사 요일 알림과 투여 기록, 몸 상태 기록, 단백질 섭취와 걷기 과제를 한 묶음으로 엮은 GLP-1 동반 트랙을 3개월 안에 붙일 수 있다. 약을 팔지 않고 이미 쓰는 사람을 돕는 형태이므로 허가가 필요하지 않지만, 대상이 약 사용자로 좁아지는 만큼 미국 사용자 가운데 그 수가 시험에 충분한지를 먼저 확인해야 한다.","signal":"eMed는 고용주를 상대로 자사가 골드 스탠더드 GLP-1 상품이라고 주장하면서 그 근거로 임상 결과가 아니라 환자 순응도 90%를 내걸었고, 기업가치 20억 달러가 넘는 조건으로 2억 달러를 조달했다. 순응도를 상품의 값어치로 내세운다는 것은, 비만 치료제를 시작한 사람이 정해진 대로 계속 맞기 어려워하는 사정이 그만큼 흔하다는 뜻이다. 다만 순응도 90%는 회사 보도자료의 자기 주장이며 제3자가 검증한 수치가 아니다. eMed는 소비자에게 직접 파는 상품도 함께 갖고 있어서, 필자는 이 회사가 롱제비티와 펩타이드 수요를 곧바로 받아 낼 자리에 있다고 본다.","author":[{"claim":"AON Consulting이 이런 라운드의 리드 투자자로 등장한 것은 이례적이며, 회사 자체도 좀 이례적이다.","evidence":"Tom Brady를 Chief Wellness Officer로 두고 있다는 점을 든다."},{"claim":"eMed의 D2C 상품은 롱제비티와 펩타이드 수요를 곧바로 공략할 준비가 된 것으로 보인다.","evidence":"그 상품이 이미 존재한다는 사실 외에 별도의 근거를 대지 않았다."}],"experts":[],"cases":[{"name":"eMed","what":"롱제비티 진료 기관이며 고용주를 상대로 GLP-1 관리 상품을 팔고, 소비자에게 직접 파는 상품도 갖고 있다.","scale":"2억 달러 조달, 기업가치 20억 달러 이상, 환자 순응도 90% 주장","note":"순응도 90%는 회사 보도자료의 자기 주장이며 제3자가 검증한 수치가 아니다."}],"notes":[{"term":"환자 순응도(adherence)","ko":"정해진 대로 계속 약을 쓰는 비율","plain":"처방받은 약을 정해진 용법대로 끊지 않고 계속 쓰는 비율이다. 고용주에게 GLP-1 관리 상품을 팔 때 이 숫자가 곧 상품의 값어치가 되는데, eMed가 골드 스탠더드를 주장하며 내민 근거도 임상 결과가 아니라 이 숫자다. 약효 자체보다 계속 쓰게 만드는 관리 능력을 파는 셈이다."}]},{"heading_ko":"펀딩: Blossom Health 2,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"정신과 진료 기관의 업무를 돕는 AI 도구를 만드는 회사가 투자를 받았다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Blossom Health","what":"정신과 진료 기관을 위한 AI 코파일럿을 만들며 Headline이 주도한 라운드로 자금을 조달했다.","scale":"2,000만 달러, 임상의 수백 명이 환자 1만 명 이상 진료","note":""}],"notes":[]},{"heading_ko":"펀딩: Clasp 2,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"학자금 대출 상환을 지원해 병원이 채용한 임상 인력을 오래 근무하게 돕는 회사가 투자를 받았다. 앞선 꼭지의 인건비 상승 전망과 같은 문제를 다른 쪽에서 푸는 사업이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Clasp","what":"대출 상환 프로그램을 통해 고용주가 채용한 임상 인력을 유지하도록 돕는 스타트업이며 Crosslink Capital과 Digitalis Ventures가 주도한 라운드로 자금을 조달했다.","scale":"2,000만 달러, 다른 모델 대비 유지율 2.5배 주장","note":"Boston Children's Hospital, Memorial Sloan Kettering, Northwestern Medicine, Novant Health, Ohio Health가 이미 고객이다. 유지율 2.5배는 회사 주장이다."}],"notes":[]},{"heading_ko":"펀딩: Dimer Health 1,350만 달러","heading_en":"Funding Announcements","skip":null,"summary":"퇴원한 환자를 이후에 관리하는 AI 중심 플랫폼이 투자를 받았다는 한 줄짜리 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Dimer Health","what":"AI 중심의 퇴원 후 관리 플랫폼이며 Team8과 Table Management가 주도한 라운드로 자금을 조달했다.","scale":"1,350만 달러","note":""}],"notes":[]},{"heading_ko":"펀딩: Prax Health 1,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"간호사 자격으로 독립 진료소를 여는 사람에게 개원에 필요한 것을 한 묶음으로 제공하는 회사가 투자를 받았다. 미국 일부 주에서 간호사가 의사 감독 없이 진료할 수 있다는 제도 위에서 성립하는 모델이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Prax Health","what":"NP가 이끄는 클리닉을 위한 business-in-a-box 모델을 팔며 두 번의 라운드에 걸쳐 자금 조달을 발표했다.","scale":"1,000만 달러, NP 200명 이상 개원 지원, 올해 5배에서 10배 성장 전망","note":"개원 지원 인원과 성장 전망은 뉴스레터가 회사 쪽 설명을 그대로 전한 수치이며, 별도의 검증 근거는 붙어 있지 않다. Martin이 공동창업자 겸 CEO인 Meghan Jewitt와 마주 앉아 이 모델을 더 들었다는 언급이 함께 실렸다."}],"notes":[{"term":"NP(Nurse Practitioner)","ko":"전문 간호사","plain":"일정한 대학원 교육과 자격을 갖춘 간호사로, 주에 따라 의사의 감독 없이 진단하고 처방할 수 있다. 한국의 간호사와 달리 자기 이름으로 진료소를 열 수 있는 주가 있어서, 이 꼭지의 사업 모델이 성립한다. 의사보다 인건비가 낮아 1차 진료 공백을 메우는 인력으로 쓰인다."}]},{"heading_ko":"펀딩: Certuma 1,000만 달러","heading_en":"Funding Announcements","skip":null,"summary":"AI 닥터를 만드는 초기 단계 회사가 6,000만 달러 기업가치로 투자를 받았다는 한 줄짜리 소식이다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[{"name":"Certuma","what":"AI 닥터를 만드는 스타트업이며 8VC가 주도한 라운드로 자금을 조달했다.","scale":"1,000만 달러 조달, 기업가치 6,000만 달러","note":""}],"notes":[]},{"heading_ko":"펀딩: VITL 750만 달러","heading_en":"Funding Announcements","skip":null,"summary":"조제 약국과 롱제비티 클리닉을 연결하는 중개 플랫폼이 투자를 받았다. 필자가 앞선 단상에서 투자자의 펩타이드 기대를 보여 주는 신호로 꼽은 두 건 가운데 하나다.","insight":null,"signal":"조제 약국과 롱제비티 클리닉을 연결하는 VITL은 클리닉 고객이 630곳을 넘고 연환산 매출이 1,000만 달러를 넘는다고 밝혔다. 필자는 앞선 단상에서 롱제비티 클리닉을 소비자가 스스로 찾아가 펩타이드를 받는 곳으로 적었으므로, 이 630곳은 소비자가 직접 돈을 내고 주사를 받는 창구가 이미 그만큼 촘촘하게 깔려 있다는 뜻이 된다. 승인된 완제품이 아니라 개별 처방에 맞춰 조제한 주사제를 공급하는 유통망이 이미 매출을 내는 사업으로 서 있다는 점도 함께 드러난다. 필자는 이번 주 eMed와 VITL의 펀딩 발표를 앞으로 올 펩타이드 붐에 대한 투자자의 기대를 보여 주는 신호로 읽는다.","author":[],"experts":[],"cases":[{"name":"VITL","what":"조제 약국과 롱제비티 클리닉을 연결하는 플랫폼이다.","scale":"750만 달러 조달, 클리닉 고객 630곳 이상, ARR 1,000만 달러 이상","note":"고객 수와 ARR은 회사 발표다. 클리닉이 630곳이나 된다는 것은 이 시장의 공급 측이 이미 촘촘하다는 뜻이다."}],"notes":[{"term":"조제 약국(compounding pharmacy)","ko":"개별 처방에 맞춰 직접 조제하는 약국","plain":"완제품 의약품을 그대로 파는 것이 아니라 성분을 받아 개별 처방에 맞춰 직접 만들어 주는 약국이다. 미국에서는 승인된 약이 품절이거나 승인된 용도 밖으로 쓰일 때 이 경로가 활용되며, 롱제비티 클리닉의 주사제 공급도 여기에 기댄다. 한국에는 이 정도 규모의 조제 유통 산업이 없다."}]},{"heading_ko":"읽을거리: 메디케이드와 AI","heading_en":"What I'm Reading: Medicaid + AI: A New Standard for Innovation","skip":null,"summary":"저소득층 공공 의료 부조 대상자를 진료하는 회사의 CEO가 자사의 AI 도입 방식을 정리한 글을 소개한다. 원칙과 실제 적용 지점을 함께 다룬다는 것이 필자의 평이다.","insight":null,"signal":null,"author":[{"claim":"이론적 원칙과 멤버 여정에 AI를 어떻게 녹여 넣고 있는지를 양쪽에서 다룬 좋은 관점이다.","evidence":"글의 구성을 근거로 들 뿐 구체적인 내용은 옮기지 않았다."}],"experts":[{"who":"Toyin Ajayi","role":"메디케이드 대상자를 진료하는 Cityblock의 공동창업자 겸 CEO이며, 자사 방식을 소개하는 당사자다","claim":"Cityblock은 메디케이드 인구를 대상으로 AI를 도입하고 있으며 멤버 여정 안에 AI를 넣고 있다.","evidence":"뉴스레터는 글의 존재와 주제만 전하고 근거를 옮기지 않았다."}],"cases":[],"notes":[{"term":"메디케이드(Medicaid)","ko":"저소득층 대상 공공 의료 부조","plain":"소득이 낮은 사람을 위해 연방과 주가 함께 돈을 대는 미국의 공공 의료 제도다. 주마다 운영 방식과 자격 기준이 달라서 전국이 하나의 제도로 굴러가지 않는다. 노인을 대상으로 하는 메디케어와는 별개의 제도이며, 한국의 의료급여에 가깝다."}]},{"heading_ko":"읽을거리: CMS 질 측정 컨퍼런스 시사점","heading_en":"What I'm Reading: The Future of Quality in Medicare and Medicaid: Themes from the CMS Quality Conference","skip":null,"summary":"미국 공보험을 운영하는 연방 기관이 무엇을 잘한 진료로 볼 것인지를 다시 정하는 자리의 시사점을 정리한 글이다. 첫 번째 시사점이 치료에서 예방 서비스로의 초점 이동이라는 점을 필자가 짚는다.","insight":null,"signal":null,"author":[{"claim":"첫 번째 시사점이 치료에서 예방 서비스로의 초점 이동이라는 점이 흥미로웠지만 아주 놀랍지는 않았다.","evidence":"왜 놀랍지 않은지는 밝히지 않아 근거를 대지 않았다."},{"claim":"연례 웰니스 방문과 영양, 생활습관 개입이 이 전환에서 핵심 역할을 한다.","evidence":"필자가 컨퍼런스 시사점을 요약하며 덧붙인 문장이고, 어떤 근거로 이 세 가지를 꼽았는지는 밝히지 않았다."}],"experts":[{"who":"Avalere Health 팀","role":"헬스케어 정책·전략 컨설팅 회사이며, 이 변화를 고객에게 설명해 주는 것이 사업인 쪽이다","claim":"최근 열린 CMS 질 측정 컨퍼런스의 첫 번째 시사점은 초점이 치료에서 예방 서비스로 옮겨 가고 있다는 것이다.","evidence":"컨퍼런스에 직접 참석해 얻은 시사점이라고 밝힐 뿐, 뉴스레터는 그 근거를 옮기지 않았다."}],"cases":[],"notes":[{"term":"CMS와 질 측정(quality measures)","ko":"미국 공보험 운영 기관과 그 성적표","plain":"CMS는 노인 대상 메디케어와 저소득층 대상 메디케이드를 운영하는 연방 기관이다. 질 측정은 CMS가 병원과 보험 플랜에 돈을 더 줄지 덜 줄지 정할 때 쓰는 성적표이며, 무엇을 재느냐가 바뀌면 현장이 무엇에 힘을 쏟을지도 함께 바뀐다. 한국의 심평원 적정성 평가와 성격이 비슷하지만, 금액 차이가 훨씬 크게 벌어진다."},{"term":"연례 웰니스 방문(Annual Wellness Visit)","ko":"해마다 한 번 받는 예방 목적 면담","plain":"아픈 데를 치료하는 진료가 아니라, 위험 요인을 점검하고 앞으로의 예방 계획을 세우는 자리다. 미국 공보험 가입자가 정기적으로 받을 수 있게 마련해 둔 제도이며, 이 꼭지에서 예방 중심 전환의 대표 수단으로 꼽힌다. 한국의 국가건강검진과 목적이 비슷하지만, 검사보다 면담과 계획 수립이 중심이다."}]},{"heading_ko":"읽을거리: 2026년 헬스케어 시장이 말해 주는 열 가지","heading_en":"What I'm Reading: Break Stuff: Ten Things the Healthcare Market Is Telling Us in 2026","skip":null,"summary":"앞서 88% 수치가 나온 HEP 연례 설문의 원문을 소개하는 자리다. AI가 이끄는 변화의 현주소와 헬스케어 조직에 가해지는 비용 압박을 다룬다.","insight":null,"signal":null,"author":[{"claim":"이 연례 설문은 AI가 이끄는 변화의 현주소와 비용 압박에 대해 유용한 인사이트를 제공했다.","evidence":"설문 대상이 헬스케어 임원 150명 이상이라는 사실만 덧붙일 뿐, 어떤 내용이 유용했는지에 대한 근거는 대지 않았다."}],"experts":[],"cases":[],"notes":[]},{"heading_ko":"읽을거리: 에이전틱 EHR의 부상","heading_en":"What I'm Reading: Rise of the Agentic EHR","skip":null,"summary":"병원 전자의무기록 시장을 흔들 주체가 무엇이 될지에 대한 짧은 글을 소개한다. 필자는 결론보다 왜 지금이냐를 설명하는 논점들이 곱씹어 볼 만하다고 본다.","insight":null,"signal":null,"author":[{"claim":"이 글이 제시한 왜 지금인가에 대한 논점들은 곱씹어 볼 만하다.","evidence":"글에 담긴 네 가지 논점을 그대로 옮길 뿐 따로 검증하지 않았다."}],"experts":[{"who":"Colton Ortolf","role":"X에 이 글을 올린 사람이며, 원문은 소속을 밝히지 않는다","claim":"에이전틱 EHR이 헤드리스 EHR 개념을 대체하며 EHR 시장의 파괴자가 될 가능성이 있다.","evidence":"AI로 유통 비용이 낮아지는 점, 더 나아진 기술, 더 많은 중소 프로바이더 고객, 혁신가의 딜레마에 빠진 기존 강자 집단을 근거로 든다."}],"cases":[],"notes":[{"term":"EHR","ko":"전자의무기록 시스템","plain":"병원이 진료 기록과 처방, 검사 결과를 넣어 두고 쓰는 기간 시스템이다. 미국에서는 소수 업체가 시장을 사실상 나눠 갖고 있고 병원이 한번 도입하면 바꾸기 어려워서, 기존 업체를 밀어내는 일이 헬스테크의 오랜 화두다."},{"term":"헤드리스 EHR과 에이전틱 EHR","ko":"화면 없는 EHR과 에이전트가 일하는 EHR","plain":"헤드리스 EHR은 화면 없이 데이터와 기능만 제공해 다른 앱들이 그 위에 붙어 각자의 화면을 만들게 하자는 구상이다. 에이전틱 EHR은 AI 에이전트가 기록 작성과 사무를 대신 처리하면서 기존 시스템의 자리를 밀어내는 구상이다. 이 글의 요지는 앞의 것보다 뒤의 것이 실제 파괴자가 될 가능성이 크다는 것이다."}]},{"heading_ko":"읽을거리: 건강하게 지켜 낸 만큼 의사에게 지급하라","heading_en":"What I'm Reading: Doctors should be paid to keep patients healthy","skip":null,"summary":"진료 건수가 아니라 환자를 건강하게 유지한 결과로 돈을 받는 방식을 더 밀어붙이자는 주장을 담은 시리즈다. 필자는 업계 사람에게는 새로울 것이 없지만 일반 독자를 향해 이 주장이 어떻게 펼쳐지는지가 흥미롭다고 본다.","insight":null,"signal":null,"author":[{"claim":"이 분야에 밝은 사람에게는 새로울 것이 많지 않지만, 좀 더 일반적인 독자를 향해 이 주장이 어떻게 펼쳐지는지 보는 것은 흥미롭다.","evidence":"왜 일반 독자에게 유효한지는 밝히지 않아 근거를 대지 않았다."}],"experts":[{"who":"Ashish Jha, Tom Tsai","role":"Substack과 Boston Globe에 이 시리즈를 함께 쓴 저자들이며, 원문은 소속과 이해관계를 밝히지 않는다","claim":"밸류 기반 케어가 나아갈 길은 진료 기관이 지는 책임의 크기를 키우는 것이며, 전문 진료를 포함한 상방·하방 리스크와 더 긴 계약 기간이 필요하다.","evidence":"뉴스레터는 주장의 골자만 전하고 근거는 옮기지 않았다."}],"cases":[],"notes":[{"term":"밸류 기반 케어(value-based care)와 상방·하방 리스크","ko":"성과에 따라 지급하는 방식과 이익·손실을 함께 지는 구조","plain":"진료를 많이 할수록 더 받는 행위별 수가 대신, 환자를 건강하게 유지하고 총 진료비를 줄인 결과에 따라 돈을 받는 방식이다. 상방 리스크는 비용을 아끼면 그만큼 나눠 갖는 것이고, 하방 리스크는 예상보다 많이 쓰면 그만큼 물어내는 것이다. 하방까지 지면 진료 기관이 실제로 손해를 볼 수 있으므로, 책임의 크기를 키운다는 표현이 쓰인다. 한국은 대부분 행위별 수가라 이런 계약이 드물다."}]},{"heading_ko":"읽을거리: 세포·유전자 치료제의 값과 가치","heading_en":"What I'm Reading: High-Stakes Medicine: Rethinking Policies for the Cost and Value of Cell and Gene Therapies","skip":null,"summary":"한 번 투여로 큰 효과를 노리는 고가 치료제가 지불 구조 안에서 겪는 어려움을 다룬 글이다. 필자는 특히 병원 쪽 재정 부담에 관한 대목을 흥미롭게 봤다.","insight":null,"signal":null,"author":[{"claim":"병원이 이런 프로그램에 투자할 때 겪는 재정적 어려움에 대한 지적이 특히 흥미로웠다.","evidence":"CGT 프로그램을 시작하는 데 선불로 100만 달러가 들 수 있는데 이후의 환자 유입에 대한 가시성은 제한적이라는 글의 지적을 든다."}],"experts":[{"who":"Alison Sexton Ward, Elizabeth Fowler, Jeremy Shane, Darius Lakdawalla","role":"이 글을 함께 쓴 저자들이며, 원문은 소속과 이해관계를 밝히지 않는다","claim":"세포·유전자 치료제는 보상 경로 측면에서 고유한 어려움을 안고 있으며, 병원이 프로그램에 투자하기 어렵게 만드는 재정 구조가 그 하나다.","evidence":"프로그램 개설에 선불 100만 달러가 들 수 있다는 점과 이후 환자 유입 예측이 어렵다는 점을 든다."}],"cases":[],"notes":[{"term":"세포·유전자 치료제(CGT)","ko":"한 번 투여로 효과를 노리는 초고가 치료제","plain":"환자의 세포나 유전자를 손봐 병을 근본적으로 고치려는 치료제로, 한 번 쓰는 데 수억 원이 드는 경우가 많다. 미국은 병원이 약을 먼저 사서 환자에게 쓴 다음 보험사에 청구하는 구조여서, 환자가 얼마나 올지 모르는 상태로 큰돈을 미리 들여야 하는 문제가 생긴다. 여러 해에 걸쳐 나눠 받는 식의 새로운 지불 방식이 논의되는 이유가 여기에 있다."}]},{"heading_ko":"이번 주 HTN 콘텐츠: 커뮤니티","heading_en":"HTN Content From the Week","skip":"promo","summary":"뉴스레터가 운영하는 커뮤니티의 이번 주 글을 알리는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"이번 주 HTN 콘텐츠: 정책 브리핑","heading_en":"HTN Content From the Week","skip":"promo","summary":"뉴스레터가 따로 내는 주간 정책 브리핑을 알리는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"이번 주 HTN 콘텐츠: 팟캐스트","heading_en":"HTN Content From the Week","skip":"promo","summary":"뉴스레터가 운영하는 팟캐스트의 이번 주 에피소드 네 편을 알리는 자리다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]}],"themes":["pharma-glp1","consumer-dtc","digital-health-funding","ai-clinical","rcm-billing","hospital-health-system"],"for_later":[]},{"index":"54","date":"2026-08-23","type":"reads","title_en":"Weekly Health Tech Reads 8/23/26","title_ko":"값 올리기 게임, 부담은 개인에게","hook":"응급실 체인 한 곳이 중재 절차로 값을 두 배 받아 내면서 San Antonio 시 직원 보험 예산이 4,000만 달러 초과했고, 시는 2027년부터 직원 보험료를 올린다.","tldr":[{"point":"San Antonio 시 직원 건강보험 플랜이 응급실 체인 한 곳 때문에 한 해 예산 2억 5,000만 달러를 4,000만 달러 넘겼는데, 그 체인은 No Surprises Act의 중재 절차로 값을 대략 두 배로 올리고 넘긴 건의 99.6%에서 이기면서 환자에게는 본인부담금과 코페이를 면제해 이용을 끌어모았다.","note":"이 법은 응급 상황에서 계약 밖 병원에 실려 간 환자에게 차액을 청구하지 못하게 하는 대신 병원과 보험사가 각자 값을 하나씩 써 내면 중재인이 둘 중 하나를 통째로 고르게 했기 때문에, 높은 값을 써서 이기면 중간에서 깎이는 일 없이 쓴 값을 그대로 다 받는다."},{"point":"Devoted Health가 250억 달러 가치로 자금을 조달 중이며, 이는 메디케어 어드밴티지 가입자 한 명당 약 5만 달러다.","note":"같은 사업을 하는 상장사 Clover Health는 오늘 가입자 한 명당 1만 1,000달러 수준이어서, 같은 잣대를 대면 Devoted는 55억 달러가 된다."},{"point":"필자는 Hims CEO가 내놓은 저가 웨어러블과 블루투스 약통 비전에 극도로 회의적이며 소비자는 센서가 아니라 브랜드화된 경험에 돈을 낸다고 보는데, 정작 그 Hims는 체중 감량 구독의 청구 방식에 대한 소비자 불만이 몰리면서 Visa의 가맹점 감시 프로그램에 올랐다.","note":"Hims는 처방약을 멤버십 구독과 함께 온라인으로 파는 회사여서 소비자가 같은 약을 다른 곳에서 더 싸게 살 수 있는데도 멤버십 비용까지 내고 사는데, 그 비용이 첫 달 39달러에서 그다음 달 149달러가 되는 구조가 불만이 몰린 원인으로 지목됐다."},{"point":"AI가 임상의를 능가한다는 미국의사협회지(JAMA) 기고가 논란이 됐지만, 필자는 'AI가 의사를 대체하는가'라는 물음 자체가 정작 필요한 논의에서 주의를 돌린다고 본다.","note":"필자가 보기에 실제로 벌어지는 일은 아주 구체적인 용도에 대해 FDA 허가를 받은 AI를 병원이 환자에게 처방하는 쪽이며, 그것은 자율이냐 사람이 끼느냐로 딱 잘라 가를 수 없다."}],"issue_insight":{"verdict":"yes","summary":"이번 회차는 병원과 보험사, 고용주, 정부 사이에서 돈이 오가는 이야기가 대부분이고, 소비자는 마지막에 인상된 보험료를 받아 드는 쪽으로만 등장한다. 그래서 3개월 안에 만들 것은 Virta 꼭지 하나에서만 나오고, 나머지 소득은 미국 소비자가 어디에 돈을 내고 있는지 보여 주는 신호 쪽에 몰려 있다.","build":[{"title":"걸음과 식단을 심장대사라는 한 축으로 묶어 보여 준다","detail":"미국에서 팔리는 이름은 걸음이나 식단이 아니라 심장대사라는 하나의 묶음이며, GLP-1이 그 관심을 이미 키워 놓았다. 지금 따로 놓인 두 화면을 하나의 위험 축으로 묶고 GLP-1을 쓰고 있는지 묻는 문항을 붙이면 기록과 화면만으로 3개월 안에 가능하다.","section":4},{"title":"진단과 처방에 닿는 기능은 이번 후보에서 뺀다","detail":"FDA 허가를 받은 AI를 병원이 환자에게 처방하는 경로는 3개월 안에 갈 수 없다. 대신 검사 결과지와 진료 후 요약을 쉬운 말로 풀어 주고 다음 진료에서 물어볼 질문을 정리해 주는 화면은 새로 판정을 내리지 않는 선을 지키는 한 허가 대상이 아니다.","section":16}],"signal":[{"title":"본인부담금을 면제해 주는 곳으로 이용이 몰린다","detail":"응급실 네 곳짜리 체인이 본인부담금과 코페이를 면제하자 시 플랜 응급실 이용량의 53%를 가져갔고, 고용주가 다른 곳을 쓰라고 알린 뒤에도 석 달 만에 적자가 두 배로 늘었다. 미국 소비자에게 방문 한 번에 붙는 본인부담이 그만큼 무겁다는 뜻이다.","section":2},{"title":"더 싼 약을 두고도 멤버십 비용을 내고 브랜드 경험을 산다","detail":"소비자가 다른 곳에서 더 싸게 살 수 있는 약을 굳이 Hims에서 멤버십 비용까지 내고 사는 것이 이 회사가 존재하는 이유라고 필자는 적었다. 의료비 전용 계좌를 개인에게 맡기자는 지지와 공급자를 중간상으로 보는 불신이 이 흐름을 받치고 있다.","section":7},{"title":"구독 요금이 오르는 지점에서 카드사 이의 제기로 반응한다","detail":"첫 달 39달러에서 그다음 달 149달러가 되는 구조에 이의 제기가 몰려 9월 벌금이 약 7만 5,000달러로 예상되며, 이는 한 달 분쟁이 9,000건을 넘는다는 뜻이다. 온라인 처방약 구독에 돈을 내면서도 청구 방식에는 카드사를 통해 항의한다.","section":8}]},"sections":[{"heading_ko":"자체 행사 안내: Differential","heading_en":"Announcing Differential","skip":"promo","summary":"뉴스레터가 직접 여는 초기 단계 창업자 초대 모임을 알리고 지원을 받는 자리다. 연사 명단과 후원사, 지원 마감일을 안내한다.","insight":null,"signal":null,"author":[],"experts":[],"cases":[],"notes":[]},{"heading_ko":"No Surprises Act가 만들어 낸 새 문제","heading_en":"The No Surprises Act Saga","skip":null,"summary":"텍사스 San Antonio 시가 직원 건강보험 예산을 크게 넘긴 사건을 들여다보는 꼭지다. 원인으로 지목된 것은 응급실 체인 한 곳이 예상치 못한 청구서를 막으려고 만든 법의 중재 절차를 활용하기 시작한 일이다. 필자는 이 사건을 한 도시의 사고가 아니라 앞으로 전국에서 반복될 구조의 첫 사례로 읽고, 공급자들이 값을 올려 받는 새 수단을 손에 넣었다고 본다.","insight":null,"signal":"San Antonio 시 플랜에 든 직원 2만 8,000명은 본인부담금과 코페이를 면제해 주는 응급실 체인 한 곳으로 몰렸고, 그 체인은 지역 응급실 50곳 가운데 네 곳뿐인데도 시 플랜 응급실 이용량의 53%를 차지했다. 시 매니저가 5월에 다른 곳을 이용하라고 알렸는데도 석 달 만에 적자가 두 배로 늘었다는 것은, 고용주의 권고보다 방문할 때 당장 내야 하는 금액이 갈 곳을 정한다는 뜻이다. 미국 소비자에게는 방문 한 번에 붙는 본인부담이 그만큼 무겁게 걸려 있고, 그것을 없애 주는 곳이 생기면 이용이 그쪽으로 옮겨 간다.","author":[{"claim":"No Surprises Act는 예상치 못한 청구서라는 문제 하나를 풀었지만 이제 또 다른 문제를 만들어 내고 있다.","evidence":"San Antonio 시 플랜이 응급실 체인 한 곳 때문에 예산을 4,000만 달러 넘겼고, 그 체인의 가격이 중재 절차를 거치며 대략 두 배가 됐다는 보도를 들었다."},{"claim":"Prestige는 물량과 가격 양쪽에서 이기고 있어 인네트워크 계약 협상에 나설 유인이 실제로 없어 보인다.","evidence":"Prestige가 시 플랜 응급실 이용량의 53%를 차지하고 중재로 넘긴 건의 99.6%에서 이기고 있다는 수치를 들었다."},{"claim":"공급자들의 중재 참여는 S자 곡선을 그릴 것이며, 최근 몇 달의 법원 판결이 얼리어답터에서 주류 공급자 조직으로 넘어가는 고비를 지금 넘게 하고 있다.","evidence":"Prestige가 2025년 말에야 참여를 시작했다는 사실을 들었을 뿐, 공급자 전체의 참여 추이를 보여 주는 데이터는 대지 않았다."},{"claim":"인센티브가 공급자에게 더 많이 받아내는 게임을 하라고 대놓고 가리키고 있어, 프로그램의 작동 방식에 v28 같은 변화가 오기 전까지 과열은 계속된다.","evidence":"메디케어 어드밴티지의 리스크 조정에서 벌어진 일과 같은 분위기라고 견주었을 뿐, 별도의 데이터는 대지 않았다."}],"experts":[{"who":"Prestige Emergency Rooms","role":"San Antonio에서 응급실 네 곳을 운영하는 체인이며, 중재로 값을 올려 받는 당사자다. 그 결과를 옹호할 위치에 있다.","claim":"그동안 BCBS 요율 아래에서 낮게 지급받아 왔고 이제야 합리적인 수가를 받는 것뿐이다.","evidence":"과거에 낮게 지급받았다는 주장 외에 구체적인 수치를 대지 않았다. 필자는 이것이 중재 결과를 옹호하는 공급자들이 흔히 내세우는 논리라고 적었다."},{"who":"San Antonio 시 매니저","role":"시 직원 건강보험 플랜의 예산을 책임지는 자리에 있다. 원문은 이름을 밝히지 않았다.","claim":"직원들은 Prestige 대신 병원 응급실을 이용해야 한다.","evidence":"5월 시점에 이미 플랜이 예산을 2,000만 달러 초과했다는 사실을 메모로 알렸다. 필자는 석 달 만에 적자가 두 배로 늘었다는 점을 들어 이 권고가 통하지 않았다고 판단했다."},{"who":"San Antonio 시 직원들","role":"이 플랜의 가입자이자 Prestige의 이용자다. 기사에 인용된 이용자 진술이다.","claim":"Prestige를 이용하는 이유는 그곳이 개인의 본인부담금과 코페이를 면제해 주기 때문이다.","evidence":"자신들의 이용 경험을 들었다. 필자는 고용주에게서 두 배를 받아낼 수 있다면 이 면제가 효과적인 전략이 된다고 해석했다."}],"cases":[{"name":"San Antonio 시 직원 건강보험 플랜","what":"시 직원 2만 8,000명을 보장하는 플랜으로, BCBS가 네트워크와 청구 처리를 맡는다.","scale":"2026년 연간 예산 2억 5,000만 달러 대비 4,000만 달러를 초과했으며, 이는 16%에 해당한다. 5월 시점에는 2,000만 달러 초과였다.","note":"5월에 병원 응급실을 쓰라고 권고했으나 석 달 만에 적자가 두 배로 늘었다. 시는 2027년부터 가입자 보험료를 올릴 예정이다."},{"name":"Prestige Emergency Rooms","what":"San Antonio 지역에서 응급실 네 곳을 운영하는 체인으로, 2025년 말부터 No Surprises Act의 중재 절차를 쓰기 시작했다.","scale":"지역 응급실 50곳 가운데 4곳이지만 시 플랜 응급실 이용량의 53%를 차지한다. 중재를 거치며 가격이 대략 두 배가 됐고 넘긴 건의 99.6%에서 이겼다.","note":"환자에게는 본인부담금과 코페이를 면제해 이용을 끌어모으고, 고용주에게는 중재로 두 배를 받아내는 구조다."}],"notes":[{"term":"No Surprises Act (NSA)","ko":"예상치 못한 청구서 금지법","plain":"미국은 병원마다 보험사와 따로 계약을 맺어서, 계약 안에 있는 병원(인네트워크)에 가야 보험이 제값을 쳐 준다. 그런데 응급 상황에서는 환자가 병원을 고를 수 없어, 계약 밖 병원에 실려 가면 보험이 안 내는 차액을 병원이 환자에게 그대로 청구해 왔다. 2022년부터 이 법이 그 청구를 금지해, 환자는 인네트워크 수준만 내고 나머지 다툼은 병원과 보험사 사이로 넘어갔다. 한국은 전 국민 건강보험이라 병원마다 계약이 따로 없어 이런 일 자체가 없다."},{"term":"IDR (독립 분쟁 해결 절차)","ko":"병원과 보험사를 붙이는 중재","plain":"위 법이 병원과 보험사에게 넘긴 다툼을 처리하는 중재 절차다. 양쪽이 각자 값을 하나씩 써 내면 중재인이 둘 중 하나를 통째로 고르며, 중간값으로 깎지 않는다. 그래서 높은 값을 써서 이기면 그대로 다 받는다. Prestige가 99.6%를 이겼다는 것은 이 절차에서 자기가 쓴 값이 거의 언제나 채택됐다는 뜻이다."},{"term":"본인부담금·코페이 면제","ko":"환자가 낼 몫을 병원이 깎아 주는 것","plain":"미국 보험은 보험사가 돈을 내기 전에 환자가 먼저 채워야 하는 자기부담 한도(deductible)와, 방문할 때마다 내는 정액(copay)이 있다. 병원이 이 몫을 면제해 주면 환자는 공짜처럼 느껴 그 병원에 몰린다. 대신 병원은 보험사와 고용주에게 청구하는 값을 올려 회수한다. 한국에서 본인부담금 할인이 불법인 것과 견주면 왜 이것이 문제가 되는지 짐작할 수 있다."},{"term":"자가보험 고용주 플랜","ko":"고용주가 의료비를 직접 무는 방식","plain":"미국의 대형 고용주는 보험사에서 보험을 사는 대신, 직원의 의료비를 자기 돈으로 직접 물고 보험사에는 네트워크와 청구 처리만 맡긴다. 원문이 이 표현을 쓰지는 않았지만, BCBS가 협상과 처리를 맡고 초과분은 시가 떠안는 이 사례의 구조가 그것이다. 돈이 시 예산에서 병원으로 바로 흐르므로, 직원들이 비싼 곳을 많이 쓰면 그 초과분이 고스란히 시의 예산 적자가 된다."}]},{"heading_ko":"Devoted Health의 250억 달러와 메디케어 어드밴티지 시장","heading_en":"Medicare Advantage","skip":null,"summary":"비상장 보험사 Devoted Health가 250억 달러 가치로 자금을 조달 중이라는 보도를 놓고, 그 값이 말이 되는지를 따지는 꼭지다. 필자는 가입자 수로 나눈 단가를 상장사와 견주어 지나치게 비싸다고 보면서도, 2026년 메디케어 어드밴티지 실적이 전반적으로 좋았던 배경과 2027년에 성장 쪽으로 앞서 나가려는 구도를 함께 설명한다. 뒷부분은 Centene의 철수와 SCAN·Costco 제휴 같은 시장 신호를 짧게 덧붙인다.","insight":null,"signal":null,"author":[{"claim":"오늘의 숫자로만 보면 250억 달러는 천문학적이며, 이 밸류에이션은 현실과 동떨어져 보인다.","evidence":"가입자 50만 명으로 나누면 한 명당 약 5만 달러인데, 오늘 Clover Health가 한 명당 1만 1,000달러 수준이므로 같은 잣대라면 Devoted는 55억 달러가 된다는 계산을 들었다."},{"claim":"투자자들은 Devoted를 평균에서 표준편차 3에서 6 사이에 있는 결과에 맞춰 가격 매기고 있다.","evidence":"근거를 대지 않았다. 요즘 사모 시장 성장 자본의 속성이 그런 듯하다고만 적었다."},{"claim":"Devoted의 메디케어 어드밴티지 사업은 수익성 면에서 계획보다 의미 있게 앞서 있을 것이다.","evidence":"2026년 메디케어 어드밴티지 실적이 전반적으로 기대를 웃돌아 지불자들이 일제히 가이던스를 상회하고 상향했다는 점과, Devoted가 2026년에 수익성이 좋은 C-SNP 상품으로 크게 무게를 옮겼다는 점 두 가지를 들었다. 본인도 짐작이라고 밝혔다."},{"claim":"케어 딜리버리에 쏟는 투자 수준을 감안하면 Devoted가 전사 차원에서 흑자라고 보기는 여전히 어렵다.","evidence":"투자 수준 자체를 들었을 뿐 구체적인 금액은 대지 않았다."},{"claim":"CMS는 2026년의 초과 성과를 근거 삼아 2027년 지급을 더 깎는 대화를 반드시 다시 꺼낼 것이다.","evidence":"메디케어 어드밴티지 보험사들이 곳곳에서 가이던스를 상회하고 상향하는 상황과, Devoted CEO 본인이 몇 달 전 CMS에 업계에 돈을 덜 주라고 공개 요구한 사실을 들었다."},{"claim":"점유율을 빠르게 가져가려 한 보험사들에게 이런 서사는 대체로 좋게 끝나지 않았다.","evidence":"Devoted 자신이 2025년에 신규 가입자의 적자로 고전했다는 사실을 들었다. 다만 2026년 Humana는 새 가입자 유입을 소화하면서도 사업 전체를 흔들지 않아 예상을 뒤집었다고 덧붙였다."}],"experts":[{"who":"Alignment Health의 CEO","role":"메디케어 어드밴티지 보험사의 CEO다. 원문은 이름을 밝히지 않았다. 자신도 경쟁 보험사이므로 시장 구도를 말할 이해관계가 있다.","claim":"2027년에 소규모 보험사 몇 곳이 튀어나와 의미 있는 시장 점유율을 가져가려 시도할 것이다.","evidence":"2분기 실적 시즌에 내놓은 전망이며, 원문은 그가 든 근거를 옮기지 않았다."},{"who":"Chris Klomp","role":"2026년 초 요율 발표 국면에서 업계에 대한 지급을 낮추는 안을 내놓은 인물이다. 원문은 직함을 밝히지 않았으나 CMS의 요율 결정을 이야기하는 대목에서 등장하므로, 지급을 깎는 편에 선 사람으로 읽힌다.","claim":"업계가 세금의 더 나은 청지기가 되어야 하며, 업계에 대한 지급을 낮춰야 한다.","evidence":"원문은 그가 든 근거를 옮기지 않았다."},{"who":"Devoted Health의 CEO","role":"Devoted의 CEO다. 원문은 이름을 밝히지 않았다. 자기 회사가 속한 업계에 돈을 덜 주라고 요구한 이례적인 위치다.","claim":"CMS는 업계에 돈을 덜 줘야 한다.","evidence":"몇 달 전 공개적으로 요구했다는 사실만 소개됐고, 그가 든 근거는 원문에 옮겨지지 않았다."}],"cases":[{"name":"Devoted Health","what":"메디케어 어드밴티지 보험사이면서 자체 케어 딜리버리에도 투자하는 회사로, 250억 달러 가치로 추가 자본을 조달 중이라고 Business Insider가 보도했다.","scale":"직전 라운드에서 3억 1,700만 달러를 160억 달러 가치로 조달했다고 발표한 지 1년도 채 지나지 않았다. 가입자는 올해 들어 50만 명을 막 넘겼고, 한 명당 약 5만 달러다.","note":"상장사였다면 Centene을 제치고 다섯 번째 또는 여섯 번째로 큰 관리의료 회사가 된다. 이 가격에서는 사실상 인수 불가능한 회사가 된다는 것이 필자의 지적이다."},{"name":"Clover Health","what":"메디케어 어드밴티지 보험사로 2021년 SPAC으로 상장했다. 필자가 밸류에이션 비교 기준으로 든 회사다.","scale":"2021년에는 가입자 5만 7,000명에 37억 달러로 한 명당 6만 5,000달러였고, 오늘은 가입자가 대략 세 배인데 가치는 20억 달러에 가까워 한 명당 1만 1,000달러다.","note":"가입자가 세 배로 늘었는데 회사 가치는 오히려 줄었다. 시장이 메디케어 어드밴티지 가입자 한 명에게 매기는 값이 얼마나 달라졌는지를 보여 준다."},{"name":"Centene","what":"대형 관리의료 회사로, 지난주 브로커들에게 메디케어 어드밴티지 플랜 철수 계획을 공유한 것으로 전해진다.","scale":"현재 34만 명 이상이 가입한 플랜을 158개 이상 카운티에서 접으며, 여기에는 Oklahoma, Tennessee, Hawaii 전역이 포함된다.","note":"수익성을 우선해 가입자를 줄이는 쪽이며, 이렇게 비는 자리가 Devoted 같은 성장 지향 보험사에게 기회가 된다."},{"name":"SCAN과 Costco의 공동 브랜드 플랜","what":"메디케어 어드밴티지 보험사 SCAN이 Costco와의 파트너십을 확대해, 비공개 세 개 시장에서 공동 브랜드 플랜을 출시한다고 발표했다.","scale":"세 시장의 메디케어 가입자는 합쳐서 500만 명이다.","note":"보험 상품에 소비자 소매 브랜드를 붙여 파는 시도다."}],"notes":[{"term":"Medicare Advantage (MA)","ko":"메디케어 어드밴티지","plain":"65세 이상을 위한 공보험 메디케어를 정부가 직접 운영하지 않고 민간 보험사에 맡기는 방식이다. 정부가 가입자 한 명당 매달 정해진 금액을 보험사에 주면, 보험사는 그 안에서 진료비를 대고 남는 만큼 이익을 가져간다. 가입자가 아플수록 정부가 더 많이 주기 때문에 보험사는 질병 코드를 빠짐없이 붙이려 하고, 그 지점에서 늘 말썽이 난다. 한국에는 이런 민간 위탁이 없다."},{"term":"care delivery","ko":"케어 딜리버리","plain":"보험사가 보험금만 지급하는 데 그치지 않고 의원과 방문 간호, 원격 진료 같은 진료 조직을 직접 갖춰 환자를 돌보는 것을 가리킨다. 메디케어 어드밴티지는 가입자 한 명당 정액을 받는 구조여서, 진료를 직접 관리해 입원을 줄이면 그만큼 이익이 남는다. 그래서 보험사가 진료 조직에 큰돈을 넣는데, 그 투자가 회수되기 전까지는 회사 전체가 적자로 보일 수 있다. 한국은 보험사가 병원을 소유할 수 없어 이런 구조 자체가 없다."},{"term":"v28","ko":"지급액 산정 방식의 개정판","plain":"위에서 말한 질병 코드로 보험사에 줄 돈을 계산하는 방식을 리스크 조정이라 하는데, CMS가 2024년부터 단계적으로 적용한 개정판이 v28이다. 값을 부풀리기 쉬웠던 코드를 걷어내 보험사에 가는 돈을 줄였다. 필자가 다른 꼭지에서 'v28 같은 변화'라고 말할 때는, 과열된 게임의 규칙을 정부가 바꿔 열기를 식히는 조치를 뜻한다."},{"term":"C-SNP / D-SNP","ko":"특정 대상만 받는 메디케어 어드밴티지 상품","plain":"아무나 들 수 있는 일반 상품이 아니라 조건을 갖춘 사람만 가입하는 상품이다. C-SNP는 당뇨나 심부전 같은 만성질환이 있는 사람을, D-SNP는 메디케어와 저소득층 공보험 메디케이드를 함께 받는 사람을 대상으로 한다. 대상자가 아플수록 정부가 주는 금액이 커지므로, 관리를 잘하면 수익성이 특히 좋은 구간이 된다."},{"term":"beat and raise","ko":"실적은 넘고 전망은 올리는 것","plain":"원래는 상장사 실적 용어다. 분기 실적이 시장 기대를 넘고(beat), 동시에 남은 기간의 전망치까지 올려 잡는(raise) 상황을 가리킨다. 회사가 잘 굴러간다는 가장 강한 신호로 읽힌다. 필자는 비상장인 Devoted가 사모 시장에서 그와 같은 상황을 맞았다는 뜻으로 이 표현을 썼고, 이번 회차의 부제에도 올렸다."}]},{"heading_ko":"Virta Health가 밝힌 규모와 앞으로의 경로","heading_en":"Company Spotlight","skip":null,"summary":"영양으로 심장대사 질환의 근본 원인을 다룬다는 Virta Health가 자사 실적과 확장 계획을 뉴스레터에 공개한 자리다. 사장이 밝힌 숫자와 100배 성장 구상을 소개한 뒤, 필자가 그 구상에서 읽어 낸 전략 방향을 덧붙인다. 요점은 고용주용 종합 플랫폼으로 넓히는 대신 지금 하는 일을 고객 유형 전반으로 깊이 파고드는 쪽을 택했
