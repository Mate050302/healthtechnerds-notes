 '순응도 90%'는 회사가 스스로 낸 것이고, 제삼자가 검증한 자료는 없다. 확인한 내용을 순서대로 적는다.\\n\\n첫째, 같은 숫자가 자리마다 다른 이름을 달고 있다. 회사 앱 안내 페이지는 '10명 중 9명이 처방받은 치료 계획을 따른다', '10명 중 9명이 6개월 넘게 프로그램에 남는다'로 적고 출처를 'emed population health data (2025)'라는 자사 데이터로 밝힌다. 즉 원래는 '프로그램 잔류율'이다. 보도자료는 이것을 '복약 순응도'로 바꿔 적고 업계 평균과 비교했다. 잔류율과 순응도는 다른 것을 세는 지표다.\\n\\n둘째, 표본 수도 순응도의 정의도 공개되지 않았다. emed가 유일하게 등록한 연구(영국 isrctn12421711)는 emed가 스스로 의뢰하고 스스로 돈을 대며 연구 책임자도 emed 직원이고, 단일 기관에서 대조군 없이 뒤돌아보는 방식이며 윤리 심의 대상도 아니다. 결과는 아직 없고 종료 시점은 2027년 4월로 미뤄졌다. 그 연구가 정의한 순응도는 '권고받은 프로그램 활동 가운데 환자가 완료한 비율', 곧 앱 활동 수행률이다. 약을 실제로 얼마나 썼는지를 재는 지표가 아니다.\\n\\n셋째, 회사가 내세운 독립 검증은 아직 존재하지 않는다. emed는 pitchbook에 '영국 회원 8,000명 이상을 유니버시티 칼리지 런던의 john deanfield 교수가 독립 분석했고 6개월 91% 이상이 나왔으며 nature medicine에 심사 중, 몇 주 안에 게재'라고 밝혔다. 그로부터 다섯 달 반이 지난 2026년 9월 현재 pubmed, europe pmc, crossref, nature medicine 어디에도 그 논문이 없다. 게다가 같은 연구의 표본 수가 자료마다 8,000명, 1만 3천 명, 1,000명으로 다르게 적혀 있다. pitchbook의 애널리스트는 이 주장이 '마땅히 갖춰야 할 동료 심사와 임상 검증을 갖추지 못했다'고 평했다.\\n\\n넷째, '업계 평균의 두 배'는 성립하지 않는다. 시기와 지표를 맞춘 최신 자료로 보면 prime therapeutics의 2024년 상반기 코호트(3만 3,607명, jmcp 2026)에서 1년 지속률이 60.9%, 복약 순응도(pdc 80% 이상)가 55.5%였고, 매사추세츠 메디케이드 코호트(7,493명, jmcp 2026)에서는 6개월 시점 지속률 60.8%, 순응도 60.1%였다. 이 기준으로 보면 90%는 두 배가 아니라 1.3배에서 1.5배 수준이다. '두 배'가 되려면 약이 품귀였던 2021년에서 2023년 사이의 12개월 지속률을 끌어와야 한다. 게다가 이탈은 초반에 몰려 있어서 6개월로 끊어 재면 숫자가 유리해진다. 1년 이탈의 71%가 첫 6개월에 일어난다.\\n\\n다섯째, 함께 내건 '99%가 6개월 안에 지표 하나 이상 개선'은 재는 항목이 여섯 가지여서 하나만 좋아져도 성립한다. 회사 faq도 '첫 검사에서 약 99%는 최소 한 항목이 정상 범위를 벗어난다'고 밝히고 있다.\\n\\n여섯째, 체중 감량 수치가 13개월 사이에 계속 바뀌었다. 2025년 8월 aon 발표는 22.4파운드, 2026년 1월과 3월 보도자료는 21파운드, 앱 안내 페이지는 6개월에 23파운드, 현재 고용주 페이지는 30파운드다. 어느 수치가 어느 집단인지 회사가 밝히지 않았다.\\n\\n일곱째, 라운드를 주도한 aon은 독립된 제삼자가 아니다. aon은 emed를 자사 고용주 고객에게 파는 유통 파트너이고, 웹사이트가 성과 근거로 드는 'aon workforce-focused analysis on glp-1s'도 aon이 만든 것이며, 그 분석 자체는 청구 데이터 5,000만 명 중 glp-1 사용자 13만 9천 명을 본 것이지 emed 참가자를 본 것이 아니다. 더 나아가 aon의 2025 회계연도 사업보고서(10-k) 별지에는 emed population health, inc.가 2025년 12월 31일 기준 aon의 자회사로 올라 있다. 투자자 이상의 관계다.\\n\\n여덟째, 회사를 상대로 한 소송이 진행 중이다. 체중 관리 자회사의 전 ceo였던 wendi mader가 2026년 5월 플로리다 남부 연방지방법원에 성차별과 보복 해고를 이유로 소송을 냈다(사건번호 1:26-cv-23258). 소장에는 회사가 정한 임상 절차를 건너뛰고 특정 인물에게 glp-1을 처방하도록 지시받았다는 주장도 담겨 있다. 이는 아직 입증되지 않은 원고 측 주장이고 피고들은 2026년 8월 각하 신청을 내며 전면 다투고 있으므로, 사실로 인용해서는 안 된다. 다만 '임상 관리가 붙은 glp-1'을 파는 회사에 대해 그 관리의 실행을 문제 삼는 주장이 제기됐다는 사실 자체는 기록해 둘 만하다.\\n\\n아홉째, 영국에서는 인수 뒤에 마찰이 있었다. 2024년 3월 emed는 임상의 정리해고 협의를 시작했고 영국의사협회(bma)는 이 협의가 '위법일 가능성이 매우 높고 간접 차별에 해당한다'고 밝혔다. gp at hand의 등록 환자는 11만 1천 명에서 9만 6천 명으로 줄었고 bupa 계약은 2025년 1월 종료됐다. 앞서 2022년에는 abbott가 미수금 문제로 emed를 상대로 중재를 걸었고 법원이 emed에게 중재에 응하라고 명령했다.\\n\\n열째, 소비자용 앱의 사용 흔적이 아주 적다. 미국 앱스토어는 평점 4.2에 평가 10건, 구글 플레이는 평점 2.7에 평가 6건이고 내려받기가 1,000회 이상 구간이다. 개인 가입 페이지가 내세우는 '회원 5만 명'은 영국 shemed와 hemed의 환자 수와 같은 숫자인데, 영국 앱은 평가가 6,300건대다. 미국 소비자 사업은 이제 막 시작한 것으로 보인다.\\n\\n마지막으로, 뉴스레터가 쓴 '롱제비티 진료 기관'이라는 표현은 회사의 현재 사업과 맞지 않는다. 웹사이트에 롱제비티나 펩타이드를 다루는 페이지가 없고 해당 주소는 모두 없는 문서로 나온다. ceo가 axios 인터뷰에서 앞으로 펩타이드 영역 전반을 살펴보겠다고 말했으므로, 그 표현은 현재 사업이 아니라 계획을 가리킨 것으로 보인다. 참고로 인터넷에 도는 '2022년 미국 보건복지부와 최대 12억 달러 규모 계약'이라는 내용은 근거가 없다. 연방 조달 기록에서 emed 앞으로 확인되는 계약은 연방항공청 97만 2,623달러와 교육부 4,250달러가 전부다.\", \"for_us\": \"약을 파는 대목은 우리가 할 수 없다. 그러나 emed가 값을 받아 내는 지점은 약 자체가 아니라 '끊지 않게 만드는 관리'이고, 그 관리의 실제 내용은 1분이 안 걸리는 주 1회 체크인, 투약 알림, 진도 그래프, 부작용이 생겼을 때 바로 응대하는 상담 창구다. 전부 앱 화면에서 되는 일이고 의료기기 허가도 필요 없다. 회사도 앱을 '추적·분석 도구이며 의료기기가 아니다'라고 명시한다. 우리 앱은 걸음 리워드로 매일 여는 습관을 이미 만들어 두었으므로, 비만 치료제를 이미 쓰고 있는 사람을 위한 동반 트랙(주사 요일 알림, 투여 기록, 부작용 기록, 단백질 섭취와 걷기 과제)을 3개월 안에 붙일 수 있다. 다만 대상이 약 사용자로 좁아지므로, 우리 미국 사용자 가운데 실제로 glp-1을 쓰는 사람이 시험에 충분한 수인지 먼저 세어 봐야 한다. 두 번째로 볼 것은 값을 정당화하는 방식이다. emed는 '체중 감량과 복약 지속을 보증하고 못 지키면 대금을 깎는다'는 계약을 내걸었다. 우리가 지속 이용률 자체를 상품으로 팔려면 결국 같은 형태의 약속을 숫자로 내걸 수 있어야 한다. 세 번째는 반대 방향의 교훈이다. emed는 '앱에 남아 있는 비율'을 '약을 제대로 쓰는 비율'로 바꿔 부르면서 20억 달러짜리 이야기를 만들었다. 우리가 같은 종류의 지표를 낼 때는 무엇을 세는지, 분모가 무엇인지 먼저 정해 두어야 나중에 뒤집히지 않는다.\", \"screenshots\": [{\"file\": \"emed_home.png\", \"caption\": \"첫 화면. 고용주용과 개인용 두 갈래로 나뉘어 있고, 내세우는 문구가 '시작하기 쉽고 계속하기는 더 쉽다'이다.\", \"from\": \"https://www.emed.com\"}, {\"file\": \"emed_claims.png\", \"caption\": \"순응도 90%의 실제 표기. '10명 중 9명이 처방대로 따른다', '10명 중 9명이 6개월 넘게 프로그램에 남는다'로 적혀 있고 출처는 'emed population health data (2025)'라는 자사 데이터다.\", \"from\": \"https://www.emed.com/download\"}, {\"file\": \"emed_pricing.png\", \"caption\": \"소비자가 직접 가입할 때의 값. 최초 검사비 49달러, 약값 월 149.99달러부터, 회비 월 149.99달러가 각각 따로 붙는다.\", \"from\": \"https://www.emed.com/join/home\"}, {\"file\": \"emed_ios.png\", \"caption\": \"미국 앱스토어 페이지. 앱 설명이 '회사가 지원하는 체중 관리'로 되어 있어 고용주를 거쳐 들어오는 사람을 위한 도구임을 드러낸다. 평점 4.2에 평가 10건뿐이다.\", \"from\": \"https://apps.apple.com/us/app/emed-population-health/id6741202488\"}], \"sources\": [{\"title\": \"emed 첫 화면\", \"url\": \"https://www.emed.com\", \"note\": \"고용주용과 개인용으로 갈리는 구조와 내세우는 문구를 확인했다.\"}, {\"title\": \"emed 고용주용 페이지\", \"url\": \"https://www.emed.com/employers\", \"note\": \"pbm을 빼고 약을 직접 조달한다는 설명, 성과 보증 문구, 자가 채혈 검사 여섯 항목, 회원 여정 절차를 확인했다.\"}, {\"title\": \"emed 개인 가입 페이지\", \"url\": \"https://www.emed.com/join/home\", \"note\": \"소비자가 직접 낼 값(49달러, 149.99달러, 149.99달러)과 위고비 알약 취급 사실을 확인했다.\"}, {\"title\": \"emed 개인 가입 faq\", \"url\": \"https://www.emed.com/join/faq\", \"note\": \"fda 허가 정품만 쓴다는 답변, 처방 약은 위고비라는 답변, 자사 검사 키트만 인정한다는 답변, 첫 검사에서 약 99%가 한 항목 이상 정상 범위를 벗어난다는 서술을 확인했다.\"}, {\"title\": \"emed 앱 안내 페이지\", \"url\": \"https://www.emed.com/download\", \"note\": \"순응도 90%의 실제 표기와 출처 표시('emed population health data (2025)')를 확인했다.\"}, {\"title\": \"emed 회사 소개 페이지\", \"url\": \"https://www.emed.com/about\", \"note\": \"경영진 명단, 코로나 시기 실적 주장, aon과 thrive global, cvs health 제휴 표기를 확인했다.\"}, {\"title\": \"emed 자율 가입형 상품 페이지\", \"url\": \"https://www.emed.com/voluntary\", \"note\": \"회사 부담 0달러, 직원이 월 149.99달러를 내는 방식임을 확인했다.\"}, {\"title\": \"emed 영국 사업 페이지\", \"url\": \"https://www.emed.com/uk\", \"note\": \"nhs 환자 10만 명 이상 1차 진료, shemed와 hemed로 5만 명 이상 관리를 확인했다.\"}, {\"title\": \"tom brady 최고 웰니스 책임자 선임 보도자료\", \"url\": \"https://www.emed.com/in-the-news/tom-brady-named-chief-wellness-officer-of-emed\", \"note\": \"2026년 1월 12일 자다. 순응도 90%, 평균 21파운드 감량, 99% 지표 개선, 관리받지 않는 프로그램의 35% 순응도, 3년 차 최대 3배 투자 회수라는 주장을 원문 그대로 확인했다.\"}, {\"title\": \"2억 달러 조달 보도자료\", \"url\": \"https://www.prnewswire.com/news-releases/emed-raises-200-million-at-2-billion-plus-valuation-302725381.html\", \"note\": \"2026년 3월 26일 자다. 기업가치, 투자자 명단, 인두제 방식 도입 계획을 확인했다.\"}, {\"title\": \"aon 전략적 투자 보도자료\", \"url\": \"https://www.prnewswire.com/in/news-releases/aon-announces-strategic-investment-in-emed-to-scale-glp-1-population-health-platform-302532187.html\", \"note\": \"2025년 8월 18일 자다. aon이 자사 고용주 고객에게 emed를 공급한다는 내용과 aon 사내 프로그램 실적(등록 1,200명 이상, 평균 22.4파운드 감량, 유지율 95%)을 확인했다.\"}, {\"title\": \"aon 2025 회계연도 사업보고서 자회사 목록(sec 10-k 별지 21)\", \"url\": \"https://www.sec.gov/archives/edgar/data/315293/000162828026008116/exhibit2112025.htm\", \"note\": \"emed population health, inc.가 2025년 12월 31일 기준 aon의 자회사로 올라 있음을 확인했다.\"}, {\"title\": \"aon의 glp-1 인력 분석 보도자료\", \"url\": \"https://www.prnewswire.com/news-releases/aon-unveils-first-workforce-focused-analysis-on-glp-1s-medications-and-holistic-support-can-transform-workforce-health-and-bend-the-cost-curve-302441869.html\", \"note\": \"2025년 4월 30일 자다. 청구 데이터 5,000만 명 중 glp-1 사용자 13만 9천 명을 본 분석이며 emed 참가자 대상이 아님을 확인했다.\"}, {\"title\": \"pitchbook, 업계 통념을 뒤집는 순응도 주장으로 2억 달러를 조달했다\", \"url\": \"https://pitchbook.com/news/articles/linda-yaccarinos-glp-1-telehealth-unicorn-raises-200m-on-adherence-claim-that-bucks-industry-norm\", \"note\": \"emed가 주장한 유니버시티 칼리지 런던 분석과 nature medicine 게재 예정 발언, 애널리스트의 '동료 심사와 임상 검증이 없다'는 평가를 확인했다.\"}, {\"title\": \"emed가 등록한 유일한 연구(isrctn12421711)\", \"url\": \"https://www.isrctn.com/isrctn12421711\", \"note\": \"emed가 스스로 의뢰·자금을 대고 연구 책임자도 emed 직원이며, 순응도를 '권고 활동 완료 비율'로 정의하고, 결과가 없으며 종료가 2027년 4월로 미뤄졌음을 확인했다.\"}, {\"title\": \"rodriguez 외, glp-1 중단과 재개 연구(jama network open, 2025년 1월 31일)\", \"url\": \"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2829779\", \"note\": \"과체중 또는 비만인 성인 12만 5,474명 실사용 데이터다. 1년 중단률은 전체 53.6%, 당뇨가 없는 사람은 64.8%였고, 2년 중단률은 전체 72.2%, 당뇨가 없는 사람은 84.4%였다. 문제 정의의 근거로 썼다.\"}, {\"title\": \"meyer 외, 메디케이드 glp-1 순응도 연구(jmcp 2026)\", \"url\": \"https://pmc.ncbi.nlm.nih.gov/articles/pmc12948758/\", \"note\": \"7,493명에서 6개월 시점 지속률 60.8%, 순응도(pdc 80% 이상) 60.1%임을 확인했다. emed의 '두 배' 주장을 검증하는 기준으로 썼다.\"}, {\"title\": \"emed의 babylon 인수 보도자료\", \"url\": \"https://www.prnewswire.co.uk/news-releases/emed-healthcare-uk-promises-continuity-and-expansion-following-successful-acquisition-of-babylon---marking-a-new-era-for-digital-first-primary-care-in-the-uk-301962293.html\", \"note\": \"2023년 영국 babylon health와 gp at hand 인수를 확인했다. 대금 679만 파운드와 매출 수치는 영국 기업등기소 감사보고서(법인번호 15085216)에서 확인했다.\"}, {\"title\": \"emed의 science 37 공개매수 서류(sec)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1819113/000110465924013752/tm244930-1_sctot.htm\", \"note\": \"주당 5.75달러, 약 3,800만 달러 규모의 인수와 공동창업자 patrice harris의 직함을 확인했다.\"}, {\"title\": \"abbott, binaxnow 가정용 검사 fda 긴급사용승인 보도자료\", \"url\": \"https://abbott.mediaroom.com/2020-12-16-abbotts-binaxnow-covid-19-rapid-test-receives-fda-emergency-use-authorization-for-first-virtually-guided-at-home-rapid-test-using-emeds-digital-health-platform\", \"note\": \"2020년 12월 16일 자다. 화상 감독 플랫폼이 emed의 것임을 확인했다.\"}, {\"title\": \"mader 대 emed 소송 기록(미국 법원 전자기록)\", \"url\": \"https://www.courtlistener.com/docket/73318156/mader-v-emed-llc/\", \"note\": \"2026년 5월 8일 제소, 2026년 8월 각하 신청 등 진행 경과를 확인했다. 소장 내용은 입증되지 않은 원고 측 주장이다.\"}, {\"title\": \"pulse today, emed의 영국 임상의 정리해고와 bma의 문제 제기\", \"url\": \"https://www.pulsetoday.co.uk/news/workforce/emed-gp-redundancy-consultation-likely-to-be-unlawful-and-discriminatory-claims-bma/\", \"note\": \"2024년 4월 자다. 영국의사협회가 정리해고 협의를 위법 가능성이 높고 간접 차별에 해당한다고 밝힌 내용을 확인했다.\"}, {\"title\": \"linda yaccarino ceo 선임 보도자료\", \"url\": \"https://www.prnewswire.com/news-releases/emed-population-health-announces-appointment-of-former-x-twitter-ceo-linda-yaccarino-as-new-chief-executive-officer-302521918.html\", \"note\": \"2025 talyst 고객가치펀드에서 성장자금 4억 5,000만 달러를 추가로 받았다.\", \"watch\": \"회원 수와 누적 검사 건수는 모두 회사가 스스로 낸 수치이고, 건강한 사람이 해마다 이만큼 혈액검사를 받는 것은 미국 진료 표준이 아니라고 반박하는 의사들이 있다.\"}, \"problem\": \"한국에서는 국민건강보험이 2년마다 국가건강검진을 보내 주고, 항목을 늘리고 싶으면 동네 병원에서 비교적 적은 돈으로 추가할 수 있다. 미국은 검사를 주문할 권한이 사실상 의사에게 있고, 보험이 의학적 필요를 인정해야 비용이 처리되기 때문에 아직 증상이 없는 사람은 검사를 받기가 어렵다. 값을 미리 알기 어렵고 진료 예약이 몇 달씩 밀리는 사정도 겹친다. 그래서 자기 건강을 스스로 관리하려는 사람들이 의료 체계 밖에서 검사를 직접 주문하는 흐름이 생겼고, 미국 공영 라디오 npr은 이 흐름을 두고 의사가 검사를 지시하고 결과를 알려 주던 오래된 방식이 뒤집히는 중이라고 정리했다. function health는 바로 그 자리를 겨냥해, 의사를 거치지 않고 소비자가 값을 알고 사는 검사 상품을 판다.\", \"solution\": \"가입하면 먼저 건강 이력 문진을 채우고 첫 검사 예약을 잡는다. 채혈은 전국 2,000곳이 넘는 quest diagnostics 채혈소에서 하거나, 자격을 갖춘 채혈 전문가가 집이나 사무실로 찾아오는 방문 채혈을 고를 수 있다. 회사 설명으로는 결과가 대략 2주 뒤에 나오고, 임상의가 모든 항목을 검토해 문제가 되는 값을 표시한다. 회원은 앱에서 항목별 설명과 함께 식단·보충제를 포함한 개인별 실행 지침을 받고, 3~6개월 뒤 60여 종을 다시 검사해 변화를 추적한다. 값은 연 365달러이며 하루 1달러라고 광고한다. 전신 mri와 심장·폐 ct, 다중암 혈액검사인 galleri, 뇌 건강 패널 같은 항목은 회원이라도 따로 결제해야 한다.\", \"features\": [{\"name\": \"연 160여 종 혈액검사\", \"detail\": \"첫 검사에서 100여 종을 재고 3~6개월 뒤 60여 종을 다시 잰다. 회사는 호르몬과 갑상선 16종, 암을 포함한 조용한 위험 34종, 심장·대사 18종, 노화 34종, 정신건강·집중력 20종처럼 영역을 나눠 보여 준다.\"}, {\"name\": \"임상의 검토와 실행 지침\", \"detail\": \"모든 결과를 임상의가 개인 건강 이력에 비춰 검토하고 문제 항목을 표시하며, 그에 맞춘 식단·보충제 지침을 함께 준다.\"}, {\"name\": \"전신 mri와 ct\", \"detail\": \"2025년 5월에 인수한 영상 검사 회사 ezra를 통해 제공한다. 22분짜리 전신 mri는 회원 899달러, 비회원 999달러이고 척추를 포함하면 1,499달러, 골격·신경까지 보는 약 2시간 55분짜리는 3,999달러다. 심장 ct는 349달러, 폐 ct는 399달러다.\"}, {\"name\": \"방문 채혈\", \"detail\": \"채혈 전문가가 집이나 사무실로 와서 20분 안에 채혈을 끝낸다. 2026년 4월에 인수한 방문 채혈 회사 getlabs가 이 부분을 맡는다.\"}, {\"name\": \"외부 ai 도구 연결\", \"detail\": \"회원이 자기 검사 결과를 chatgpt, claude, perplexity, microsoft copilot health 같은 외부 ai 서비스로 연결해 질문할 수 있게 커넥터를 열어 두었다. 앱 안에도 자체 ai 대화 기능이 있다.\"}, {\"name\": \"보충제 정보\", \"detail\": \"2026년에 보충제 정보 서비스 suppco를 인수해 보충제 선택을 돕는 기능을 붙였다.\"}, {\"name\": \"기업 판매\", \"detail\": \"직원 500명 이상 대기업, 복리후생 컨설턴트, 499명 이하 소규모 팀으로 나눠 같은 검사 상품을 복리후생으로 판다. 기업 대상 가격은 공개하지 않는다.\"}], \"differentiator\": \"같은 자리에는 연 199달러에 100종이 넘는 검사를 내세우는 superpower, 연 499달러를 349달러로 할인해 130종 넘는 검사를 파는 hims & hers, 99달러짜리 소규모 패널을 반지 사용자에게 파는 oura가 있다. function health는 검사 종수를 가장 많이 내세우면서, 혈액검사 구독에 전신 mri와 ct까지 한 회사 안에 묶었다는 점이 다르다. 전신 mri만 파는 prenuvo와 달리 피검사가 본체이고 영상은 추가 결제 항목이다. 다만 실제 채혈과 분석은 superpower와 마찬가지로 quest diagnostics에 맡기기 때문에, 검사 자체의 품질이 아니라 결과를 어떻게 보여 주고 무엇을 하라고 알려 주는 층에서 경쟁한다.\", \"team\": [{\"name\": \"jonathan swerdlin\", \"role\": \"공동창업자 겸 최고경영자\", \"background\": \"회사 소개 페이지에 공동창업자 겸 ceo로 올라 있다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"mark hyman\", \"role\": \"공동창업자 겸 최고의료책임자\", \"background\": \"의사이며 cleveland clinic에서 일했다. npr은 그를 기능의학을 가장 목소리 높여 주장하는 사람 가운데 하나로 소개한다.\"}, {\"name\": \"pranitha patil\", \"role\": \"공동창업자 겸 최고사업책임자\", \"background\": \"회사 소개 페이지에서 확인했다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"seth weisfeld\", \"role\": \"공동창업자 겸 최고디자인책임자\", \"background\": \"회사 소개 페이지에서 확인했다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"dan swerdlin\", \"role\": \"공동창업자 겸 법무총괄\", \"background\": \"회사 소개 페이지에서 확인했다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"neil shah\", \"role\": \"최고운영책임자\", \"background\": \"slack에서 일하다 2025년에 합류했다.\"}, {\"name\": \"daniel k. sodickson\", \"role\": \"최고의학과학책임자\", \"background\": \"의사이자 연구자이며 병렬 mri 기술을 만든 사람으로 소개된다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"redpoint ventures가 이끈 시리즈 b로 2억 9,800만 달러를 받았고 기업가치를 25억 달러로 인정받았다. andreessen horowitz와 samsung next가 참여했고 matt damon, magic johnson 같은 유명인도 투자자로 이름을 올렸다.\", \"when\": \"2025-11\", \"source\": \"function health 공식 발표(functionhealth.com/article/function-announcement), athletech news\"}, {\"type\": \"funding\", \"detail\": \"general catalyst의 고객가치펀드에서 성장자금 4억 5,000만 달러를 받았다. 회사는 이 돈을 사업 확장과 최근 인수 건을 뒷받침하는 데 쓴다고 밝혔다.\", \"when\": \"2026-07\", \"source\": \"pr newswire 보도자료(2026년 7월 30일)\"}, {\"type\": \"partnership\", \"detail\": \"전신 mri 회사 ezra를 인수해 499달러짜리 22분 전신 mri를 내놓았다. ezra는 emi gal이 창업했고 인수 전까지 4,100만 달러를 조달한 상태였다. 거래 금액은 공개하지 않았다.\", \"when\": \"2025-05\", \"source\": \"athletech news, function health 공식 발표\"}, {\"type\": \"partnership\", \"detail\": \"방문 채혈 회사 getlabs와 보충제 정보 서비스 suppco를 인수해 집에서 피를 뽑는 경로와 보충제 기능을 붙였다.\", \"when\": \"2026-04\", \"source\": \"pr newswire 보도자료, function health 뉴스룸\"}, {\"type\": \"customers\", \"detail\": \"npr은 function health가 수십만 명 규모의 회원에게 검사를 제공한다고 적었다. 회사는 자사 소개 페이지에서 회원에게 전달한 검사 결과가 누적 7,500만 건을 넘었다고 밝힌다.\", \"when\": \"2026-04\", \"source\": \"npr(2026년 4월 14일), function health 소개 페이지\"}, {\"type\": \"traffic\", \"detail\": \"미국 애플 앱스토어에서 평가 24,473건에 평점 4.9를 받았다. 구글 플레이 설치 수는 1만 회 이상으로, 안드로이드 쪽 규모가 훨씬 작다.\", \"when\": \"2026-09\", \"source\": \"애플 itunes 검색 api와 구글 플레이 상품 페이지에서 직접 확인\"}, {\"type\": \"award\", \"detail\": \"time 100 most influential companies, fast company most innovative companies 2024, linkedin 2025 top startups에 이름을 올렸다.\", \"when\": \"\", \"source\": \"function health 소개 페이지(회사 자체 표기)\"}], \"caveats\": \"회원 수, 누적 검사 건수, 회원의 40퍼센트가 가구 중위소득 9만 5,000달러 미만 지역에 산다는 소득 분포는 모두 회사가 낸 수치이고 제삼자가 확인한 것이 아니다. 값도 확인이 필요하다. 2025년 5월 ezra 인수를 알릴 때는 전신 mri가 499달러라고 발표했으나, 2026년 9월 현재 공식 사이트에는 회원 899달러, 비회원 999달러로 올라 있다. 뉴스레터가 다룬 소송은 그 뒤 끝났다. function health가 2026년 1월 26일 캘리포니아 중부연방지방법원에 낸 소송(사건번호 2:26-cv-00810)은 2026년 6월 12일 양측이 합의했다는 신고와 함께 각하됐다. 판사는 7월 13일까지 재개할 수 있는 조건을 달았고 그 뒤에는 다시 제기할 수 없는 각하로 굳는다고 밝혔다. 합의 내용은 공개되지 않았다. 의학적으로도 반론이 있다. npr 기사에서 노스웨스턴대 의대의 jeffrey linder는 건강한 사람이 해마다, 또는 반년마다 혈액검사를 받는 것은 미국의 진료 표준이 아니라고 말한다. 정상 범위를 조금 벗어난 값 하나가 불필요한 추가 검사로 이어지는 문제도 지적하는데, 그가 인용한 연구에서는 그런 연쇄가 시작된 사례의 33퍼센트에서 처음 검사 자체가 임상적으로 부적절했다. 공동창업자 mark hyman이 대표하는 기능의학은 주류 의학과 거리가 있는 접근이라는 점도 같은 기사가 짚는다.\", \"for_us\": \"검사 자체는 3개월 안에 소프트웨어 인력만으로 만들 수 없지만, 이 회사가 실제로 파는 것은 채혈이 아니라 결과를 해석해 주는 층이다. npr 기사가 보여 주는 공백이 정확히 그 자리다. 사람들이 검사 결과를 받아 들고도 무엇을 해야 할지 몰라 검색을 하고, 자기 주치의를 만나기까지 두 달을 기다린다. 이미 가지고 있는 건강 데이터를 항목별로 풀어 설명하고 다음에 무엇을 할지 알려 주는 화면은 소프트웨어만으로 만들 수 있다. 재검사 시점을 3~6개월 뒤로 잡아 다시 불러들이는 구조도 앱의 재방문 설계로 그대로 옮길 수 있다. 회원이 자기 데이터를 chatgpt나 claude 같은 외부 ai로 내보내 질문하게 열어 둔 점도 눈여겨볼 만하다. 검사 데이터를 자기 앱 안에 가두지 않고 밖으로 흘려보내는 쪽을 택했고, 그것이 오히려 유입 경로가 됐다. 다만 미국 의사들이 잦은 검사 자체를 표준이 아니라고 보는 만큼, 검사 권유가 아니라 이미 나온 결과의 해석을 돕는 방향이 안전하다.\", \"screenshots\": [{\"file\": \"function-health_home.png\", \"caption\": \"공식 사이트 첫 화면이다. 연 160여 종 검사와 하루 1달러라는 값을 앞세운다.\", \"from\": \"https://www.functionhealth.com\"}, {\"file\": \"function-health_pricing.png\", \"caption\": \"가격 안내 페이지다. 연 365달러 단일 회원제와 포함 항목, 추가 결제 항목을 보여 준다.\", \"from\": \"https://www.functionhealth.com/pricing\"}, {\"file\": \"function-health_imaging.png\", \"caption\": \"영상검사 안내 페이지다. ezra와 함께 제공하는 전신 mri와 심장·폐 ct의 회원가와 정가, 촬영 시간이 나온다.\", \"from\": \"https://www.functionhealth.com/imaging\"}, {\"file\": \"function-health_ios.png\", \"caption\": \"미국 애플 앱스토어 페이지다. 평가 24,473건에 평점 4.9로, 소비자용 앱이 주된 창구임을 보여 준다.\", \"from\": \"https://apps.apple.com/us/app/function-health/id6471280307\"}], \"sources\": [{\"title\": \"function health 공식 사이트 첫 화면\", \"url\": \"https://www.functionhealth.com\", \"note\": \"검사 종수, 연 365달러라는 값, 검사 영역별 항목 수를 확인했다.\"}, {\"title\": \"function health 가격 안내\", \"url\": \"https://www.functionhealth.com/pricing\", \"note\": \"단일 회원제 구조와 추가 결제 항목을 확인했다.\"}, {\"title\": \"function health 이용 흐름 안내\", \"url\": \"https://www.functionhealth.com/how-it-works\", \"note\": \"가입부터 채혈, 결과 2주, 임상의 검토, 재검사까지의 순서를 확인했다.\"}, {\"title\": \"function health 영상검사 안내\", \"url\": \"https://www.functionhealth.com/imaging\", \"note\": \"전신 mri와 ct의 회원가·정가와 촬영 시간을 확인했다.\"}, {\"title\": \"function health 회사 소개\", \"url\": \"https://www.functionhealth.com/about\", \"note\": \"공동창업자 다섯 명의 이름과 직함, 누적 검사 결과 7,500만 건, 수상 이력을 확인했다.\"}, {\"title\": \"function health 기업 대상 페이지\", \"url\": \"https://www.functionhealth.com/for-business\", \"note\": \"고용주와 복리후생 컨설턴트에게도 같은 상품을 판다는 사실을 확인했다.\"}, {\"title\": \"function, 의료 인텔리전스 랩 출범과 기업가치 25억 달러 발표\", \"url\": \"https://www.functionhealth.com/article/function-announcement\", \"note\": \"시리즈 b 2억 9,800만 달러, 기업가치 25억 달러, ezra 인수와 499달러 mri, 신규 경영진을 확인했다. 회사가 낸 발표다.\"}, {\"title\": \"function secures $450 million growth financing from general catalyst's customer value fund\", \"url\": \"https://www.prnewswire.com/news-releases/function-secures-450-million-growth-financing-from-general-catalysts-customer-value-fund-cvf-302838766.html\", \"note\": \"2026년 7월 30일 자 보도자료로 4억 5,000만 달러 성장자금과 getlabs·suppco 인수를 확인했다.\"}, {\"title\": \"function health raises $298 million at $2.5 billion valuation (athletech news)\", \"url\": \"https://athletechnews.com/function-health-raises-298-million-at-2-5-billion-valuation/\", \"note\": \"투자 주체와 회원비가 499달러에서 365달러로 내려간 사실을 제삼자 보도로 확인했다.\"}, {\"title\": \"function health acquires ezra, launches $499 full-body mri (athletech news)\", \"url\": \"https://athletechnews.com/function-health-acquires-ezra-launches-499-full-body-mri/\", \"note\": \"2025년 5월 5일 인수 발표, ezra 창업자와 조달액, 거래 금액 비공개를 확인했다.\"}, {\"title\": \"function sues rival lab-testing startup superpower, alleging false marketing (athletech news)\", \"url\": \"https://athletechnews.com/function-superpower-lawsuit-lab-testing/\", \"note\": \"소송의 핵심 주장과 양쪽 회원비, 조달액을 확인했다.\"}, {\"title\": \"competing biomarker providers clash: function health sues superpower health (arentfox schiff)\", \"url\": \"https://www.afslaw.com/perspectives/longevity-lens/competing-biomarker-providers-clash-function-health-sues-superpower\", \"note\": \"법무법인이 정리한 소장 내용으로 사건번호, 청구 근거, 구체적 광고 주장 네 가지를 확인했다.\"}, {\"title\": \"function health, inc. v. superpower health inc. 사건 기록\", \"url\": \"https://www.courtlistener.com/docket/72191232/function-health-inc-v-superpower-health-inc/\", \"note\": \"2026년 1월 26일 제소와 2026년 6월 12일 합의에 따른 각하 명령 전문을 법원 기록에서 직접 확인했다.\"}, {\"title\": \"you can order your own blood work now. interpreting the results is another story (npr)\", \"url\": \"https://www.npr.org/2026/04/14/nx-s1-5780066/oura-function-wearables-blood-testing-bloodwork\", \"note\": \"회원 규모, 경쟁사 가격 비교, 잦은 검사에 대한 의사들의 반론과 불필요한 추가 검사 연쇄 문제를 확인했다.\"}, {\"title\": \"function sues superpower over biomarker claims (fitt insider)\", \"url\": \"https://insider.fitt.co/function-sues-superpower-over-biomarker-claims/\", \"note\": \"두 회사 모두 채혈과 분석을 quest에 맡긴다는 점을 확인했다.\"}, {\"title\": \"미국 애플 앱스토어 function health 앱\", \"url\": \"https://apps.apple.com/us/app/function-health/id6471280307\", \"note\": \"평점 4.9, 평가 24,473건, 무료 배포, 2024년 8월 공개를 확인했다.\"}, {\"title\": \"구글 플레이 function health 앱\", \"url\": \"https://play.google.com/store/apps/details?id=com.functionhealth\", \"note\": \"설치 1만 회 이상과 앱 소개 문구를 확인했다.\"}, {\"title\": \"ezra 공식 사이트\", \"url\": \"https://ezra.com\", \"note\": \"function과 하나가 되었다는 안내와 현재 촬영 가격표를 확인했다.\"}]}"},{"slug":"goodrx","name":"GoodRx","one_liner":"미국에서 처방약을 보험을 쓰지 않고 현금으로 살 때, 약국마다 다른 값을 비교해 주고 할인가를 받을 수 있는 코드를 무료로 발급하는 회사다. 소비자에게는 돈을 받지 않고, 그 거래를 성사시킨 대가로 약값 협상 대행사와 제약사, 약국에서 수수료를 받는다.","sells_to":"mixed","seen_in":[{"issue":"18","section":11,"headline":"2026년 매출 가이던스를 시장 기대보다 낮게 내놓아 주가가 18% 빠졌다는 한 줄 소식으로 나왔다."}],"card":{"problem":"미국은 같은 약이라도 약국마다 값이 다르고, 보험이 있어도 본인부담금이 커서 보험을 쓰는 것보다 현금으로 사는 편이 싼 경우가 자주 생긴다. 소비자는 창구에서 값을 부르기 전까지 얼마를 내야 하는지 알 방법이 없다.","solution":"약 이름과 사는 곳을 넣으면 근처 약국별 할인가를 비교해 주고, 무료 코드를 발급해 그 코드를 창구에 보여 주면 그 값에 살 수 있게 한다. 소비자는 돈을 내지 않고, 거래가 성사되면 약값 협상 대행사와 제약사, 약국이 GoodRx에 수수료를 낸다.","price":"가격 비교와 쿠폰 코드는 무료다. 유료 회원제 GoodRx Companion은 개인 월 14.99달러이고, 1년치를 미리 내면 119.88달러로 월 9.99달러가 된다.","tags":["처방약 할인","가격 비교","쿠폰","현금 결제","구독"],"headline_traction":"2025년 매출 7억 9,690만 달러를 냈고, 연간 약 2,500만 명이 쓴다고 회사가 밝혔다.","watch":"핵심인 쿠폰 사업이 줄고 있다. 2026년 2분기 처방 거래 매출이 1년 전보다 26% 줄었고, 성장은 제약사가 비용을 내는 사업에서 나온다. 2023년에는 건강 정보를 광고에 넘긴 문제로 미국 연방거래위원회에서 150만 달러 제재를 받았다."},"screenshots":[{"file":"goodrx_home.png","caption":"첫 화면. 약 이름을 넣는 검색창 아래에 GLP-1 체중 감량 약 값과 월 9.99달러 회원제 안내가 함께 놓여 있어, 무료 쿠폰 회사에서 유료 구독과 브랜드 약 판매로 무게가 옮겨간 것이 드러난다.","from":"https://www.goodrx.com/"},{"file":"goodrx_companion.png","caption":"유료 회원제 GoodRx Companion 안내. 250종이 넘는 무료 약과 치과, 안과, 검사, 영상 할인을 묶어 개인 월 9.99달러, 가족 월 16.99달러(연납 기준)로 판다.","from":"https://www.goodrx.com/companion"},{"file":"goodrx_ios.png","caption":"미국 아이폰 앱스토어 페이지. 평점 4.8에 평가 70만 건, 의료 분야 12위이며 7만 곳이 넘는 약국에서 최대 80% 아낀다고 안내한다.","from":"https://apps.apple.com/us/app/goodrx-prescription-savings/id485357017"}],"q":"{\"slug\": \"goodrx\", \"name\": \"goodrx\", \"one_liner\": \"미국에서 처방약을 보험을 쓰지 않고 현금으로 살 때, 약국마다 다른 값을 비교해 주고 할인가를 받을 수 있는 코드를 무료로 발급하는 회사다. 소비자에게는 돈을 받지 않고, 그 거래를 성사시킨 대가로 약값 협상 대행사와 제약사, 약국에서 수수료를 받는다.\", \"site\": \"https://www.goodrx.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"18\", \"section\": 11, \"headline\": \"2026년 매출 가이던스를 시장 기대보다 낮게 내놓아 주가가 18% 빠졌다는 한 줄 소식으로 나왔다.\"}], \"card\": {\"problem\": \"미국은 같은 약이라도 약국마다 값이 다르고, 보험이 있어도 본인부담금이 커서 보험을 쓰는 것보다 현금으로 사는 편이 싼 경우가 자주 생긴다. 소비자는 창구에서 값을 부르기 전까지 얼마를 내야 하는지 알 방법이 없다.\", \"solution\": \"약 이름과 사는 곳을 넣으면 근처 약국별 할인가를 비교해 주고, 무료 코드를 발급해 그 코드를 창구에 보여 주면 그 값에 살 수 있게 한다. 소비자는 돈을 내지 않고, 거래가 성사되면 약값 협상 대행사와 제약사, 약국이 goodrx에 수수료를 낸다.\", \"price\": \"가격 비교와 쿠폰 코드는 무료다. 유료 회원제 goodrx companion은 개인 월 14.99달러이고, 1년치를 미리 내면 119.88달러로 월 9.99달러가 된다.\", \"tags\": [\"처방약 할인\", \"가격 비교\", \"쿠폰\", \"현금 결제\", \"구독\"], \"headline_traction\": \"2025년 매출 7억 9,690만 달러를 냈고, 연간 약 2,500만 명이 쓴다고 회사가 밝혔다.\", \"watch\": \"핵심인 쿠폰 사업이 줄고 있다. 2026년 2분기 처방 거래 매출이 1년 전보다 26% 줄었고, 성장은 제약사가 비용을 내는 사업에서 나온다. 2023년에는 건강 정보를 광고에 넘긴 문제로 미국 연방거래위원회에서 150만 달러 제재를 받았다.\"}, \"problem\": \"미국에서 처방약 값은 정해져 있지 않다. 같은 약이라도 약국 체인마다 부르는 값이 다르고, 보험 가입자라면 보험사와 계약한 약값 협상 대행사(pbm)가 정한 값에 자기부담금을 얹어 내는데, 그 금액이 현금가보다 비싼 경우가 드물지 않다. 보험이 없는 사람은 약국이 정한 정가를 그대로 내야 하고, 보험이 있어도 연간 본인부담 한도를 채우기 전까지는 사실상 전액을 본인이 부담하는 고액공제형 보험 가입자가 많다. 창구에서 값을 부를 때까지 얼마인지 알 수 없다는 점이 문제의 핵심이며, 그래서 값이 무서워 처방을 받고도 약을 타지 않는 사람이 생긴다. 한국은 건강보험이 전 국민에게 적용되고 약값도 전국이 같아서 이런 문제 자체가 성립하지 않는다. goodrx는 이 값의 차이와 불투명함이 만든 자리에서 사업을 한다.\", \"solution\": \"소비자는 앱이나 웹에서 약 이름과 있는 곳을 넣는다. 그러면 근처 약국별로 goodrx가 받아 온 할인가가 나란히 나오고, 가장 싼 곳을 골라 코드를 저장한다. 회원 가입도, 결제도 필요 없다. 그 코드를 약국 창구에서 보여 주면 보험 대신 그 값으로 계산된다. 회사 설명에 따르면 한 번 쓴 코드는 그 약국 전산에 남기 때문에, 다음 조제부터는 다시 보여 주지 않아도 같은 할인이 이어진다. 소비자가 goodrx에 내는 돈은 없고, 대신 그 거래를 처리한 약값 협상 대행사가 받은 몫에서 일정 비율이나 정액을 goodrx가 받는다. 약국과 직접 계약한 경우에는 약국이, 브랜드 약의 현금가를 낮추는 프로그램은 제약사가 비용을 낸다. 더 싼 값과 부가 혜택을 원하는 사람을 위한 유료 회원제 goodrx companion이 따로 있는데, 개인은 월 14.99달러 또는 연 119.88달러이고 가족용은 월 24.99달러 또는 연 203.88달러다. 온라인 진료도 붙어 있어서, 체중 감량 진료는 월 39달러, 회원이 받는 일반 온라인 진료는 1회 19달러로 안내한다.\", \"features\": [{\"name\": \"약국별 가격 비교와 무료 코드\", \"detail\": \"약 이름과 위치를 넣으면 근처 약국의 할인가를 한 화면에 비교해 주고, 코드를 저장해 창구에서 보여 주면 그 값에 살 수 있다. 회사는 하루 4,200억 건이 넘는 가격 데이터를 처리하며 미국에서 가장 큰 약값 통합 데이터베이스를 갖고 있다고 밝힌다. 앱 설명에는 7만 곳이 넘는 약국에서 쓸 수 있다고 적혀 있다.\"}, {\"name\": \"goodrx companion 유료 회원제\", \"detail\": \"250종이 넘는 약을 값 없이 받고 수백 종을 10달러 미만에 사며, 치과와 안과, 혈액 검사와 영상 촬영 할인, 1회 19달러 온라인 진료가 함께 붙는다. 본인 외 4명까지 넣을 수 있고 반려동물도 포함된다. 예전 이름은 goodrx gold였고, 지금은 옛 주소로 들어가도 이 페이지가 열린다.\"}, {\"name\": \"약국 창구 자동 적용\", \"detail\": \"2023년에 시작한 통합 절감 프로그램이다. 약값 협상 대행사와 제휴해, 보험 가입자가 평소 쓰던 보험 카드만 내밀어도 goodrx 할인가가 자동으로 적용된다. 소비자는 따로 할 일이 없다. 다만 이 프로그램은 대행사가 운영 방식을 정하기 때문에 goodrx가 통제하지 못한다.\"}, {\"name\": \"pharma direct(제약사 직접 가격)\", \"detail\": \"제약사가 브랜드 약의 현금가를 낮추거나 본인부담금을 대신 내 주는 프로그램을 goodrx 화면에 붙여 주고 제약사에서 비용을 받는다. 2025년에 41% 성장해 매출 1억 5,140만 달러가 됐고, 2026년 2분기에는 1년 전보다 76% 늘었다. 2026년 2월 미국 정부가 연 직접 판매 사이트 trumprx.gov에서도 제약사 현금가를 붙이는 핵심 연동 파트너라고 회사가 밝힌다.\"}, {\"name\": \"질환별 구독과 온라인 진료(goodrx care)\", \"detail\": \"2025년 6월부터 발기부전, 탈모, 체중 감량 같은 질환별 구독을 시작했다. 진료와 약, 배송을 하나의 구독 가격으로 묶어 판다. 체중 감량은 월 39달러 온라인 진료와 함께 foundayo 149달러부터, wegovy 149달러부터, zepbound 299달러부터로 안내한다.\"}, {\"name\": \"복약 관리와 반려동물 약\", \"detail\": \"앱에는 복약 알림과 약 목록 관리 기능이 있고, 반려동물 약 할인도 제공한다. 아이폰 앱은 평가 70만 건에 평점 4.8이고, 안드로이드 앱은 내려받기 1,000만 회를 넘었다.\"}], \"differentiator\": \"같은 방식의 쿠폰 서비스로 singlecare와 rxsaver, buzzrx가 있고, 약값 협상 대행사에게서 받아 온 할인가를 코드로 보여 준다는 구조는 모두 같다. 실제 차이는 규모다. 2026년 9월 미국 앱스토어 기준으로 평가 건수가 goodrx는 70만 건인 데 비해 singlecare는 2.7만 건, rxsaver는 2.4만 건, buzzrx는 0.4만 건이다. 여러 대행사의 가격을 한 화면에서 비교한다는 점, 그리고 2025년 이후 제약사가 비용을 내는 브랜드 약 현금가와 질환별 구독으로 수익의 축을 옮긴 점이 goodrx가 내세우는 차이다. 다만 쿠폰 자체만 놓고 보면 경쟁사도 같은 대행사의 가격을 받아 오기 때문에 크게 다르지 않다.\", \"team\": [{\"name\": \"wendy barnes\", \"role\": \"최고경영자 겸 사장\", \"background\": \"2024년 12월에 선임돼 2025년 1월 1일부터 일하고 있다. 그 전에는 약제비 관리 회사 rxbenefits의 최고경영자였고, 2013년부터 2022년까지 약값 협상 대행사 express scripts에서 일하며 2019년 8월부터 2022년 4월까지 사장을 맡았다.\"}, {\"name\": \"douglas hirsch\", \"role\": \"공동창업자, 이사\", \"background\": \"2011년 9월 창업 때부터 이사이며 2023년 4월까지 공동 최고경영자였다. 창업 전에는 온라인 환자 모임 서비스 dailystrength의 최고경영자였고, 그 전에는 facebook과 yahoo에서 일했다.\"}, {\"name\": \"trevor bezdek\", \"role\": \"공동창업자, 공동 이사회 의장\", \"background\": \"2011년 9월 창업 때부터 이사이며 2015년 1월부터 2023년 4월까지 공동 최고경영자였다. 창업 전에는 정보기술 컨설팅 회사 tryarc의 대표였다.\"}, {\"name\": \"christopher mcginnis\", \"role\": \"최고재무책임자 겸 재무담당\", \"background\": \"2026년 2분기 실적 발표 자료에서 justin fengler가 차기 최고재무책임자로 소개됐으므로, 재무 책임자 교체가 진행 중이다.\"}], \"traction\": [{\"type\": \"revenue\", \"detail\": \"2025년 매출 7억 9,690만 달러로 1년 전보다 1% 늘었고, 조정 ebitda는 2억 7,050만 달러, 순이익은 3,040만 달러였다.\", \"when\": \"2026-02\", \"source\": \"sec 제출 8-k 부속서류(2025년 4분기·연간 실적 보도자료)\"}, {\"type\": \"revenue\", \"detail\": \"제약사가 비용을 내는 pharma direct 매출이 2025년에 41% 늘어 1억 5,140만 달러가 됐다. 반면 핵심인 처방 거래 매출은 6% 줄어 5억 4,400만 달러였다.\", \"when\": \"2026-02\", \"source\": \"sec 제출 8-k 부속서류, 10-k\"}, {\"type\": \"revenue\", \"detail\": \"2026년 연간 매출 가이던스를 2월에 7억 5,000만~7억 8,000만 달러(1년 전보다 6% 감소에서 2% 감소)로 제시했다가, 5월에 7억 6,500만~7억 8,500만 달러로, 8월에 7억 9,000만~8억 500만 달러로 두 차례 올렸다.\", \"when\": \"2026-08\", \"source\": \"sec 제출 8-k 부속서류(2026년 1분기·2분기 실적 보도자료)\"}, {\"type\": \"customers\", \"detail\": \"연간 약 2,500만 명의 소비자와 100만 명이 넘는 의료 전문가가 쓴다고 회사가 밝혔다. 2011년 이후 미국인이 1,000억 달러 넘게 아꼈다는 것도 회사 자체 집계다.\", \"when\": \"2026-02\", \"source\": \"goodrx 실적 보도자료\"}, {\"type\": \"traffic\", \"detail\": \"미국 아이폰 앱스토어에서 평점 4.8에 평가 70만 1,118건이고 의료 분야 순위 12위이며, 구글 플레이에서는 내려받기 1,000만 회 이상에 리뷰 33.6만 건이다.\", \"when\": \"2026-09\", \"source\": \"애플 앱스토어 조회 api, 구글 플레이 페이지\"}, {\"type\": \"partnership\", \"detail\": \"2026년 2월 미국 정부가 연 직접 판매 사이트 trumprx.gov에서, 제약사가 내놓는 현금 할인가를 붙이는 핵심 연동 파트너라고 회사가 10-k에 적었다.\", \"when\": \"2026-02\", \"source\": \"goodrx 10-k\"}, {\"type\": \"regulatory\", \"detail\": \"2023년 2월 미국 연방거래위원회가 건강 정보를 광고 목적으로 facebook과 google 등에 넘긴 문제로 150만 달러 과징금과 시정명령을 부과했다. 건강정보 유출 통지 규정을 적용한 첫 집행 사례였고, goodrx는 지금도 그 명령의 적용을 받는다.\", \"when\": \"2023-02\", \"source\": \"미국 연방거래위원회 보도자료, goodrx 10-k\"}, {\"type\": \"funding\", \"detail\": \"2020년 9월 나스닥에 gdrx로 상장했다.\", \"when\": \"2020-09\", \"source\": \"goodrx 10-k\"}], \"caveats\": \"수치의 성격을 나눠 볼 필요가 있다. 매출과 순이익, 부문별 매출은 미국 증권거래위원회에 낸 연차보고서에 담긴 감사받은 숫자다. 반면 조정 ebitda와 조정 순이익은 회계 기준 밖의 자체 계산이며, 회사도 그렇게 밝히고 있다. 월간 이용자 수와 구독 건수, 연간 2,500만 명, 1,000억 달러 절감 같은 숫자는 회사 내부 집계이고 제삼자가 검증하지 않았다고 10-k에 스스로 적어 두었다. 뉴스레터가 전한 주가 18% 하락은 실제 종가로 확인된다. 2026년 2월 25일 종가 2.45달러에서 다음 날 1.99달러로 18.8% 떨어졌다. 2020년 9월 상장 직후 월간 고가는 64.22달러였고 2026년 9월 10일 종가는 3.34달러다. 성장이 꺾인 이유는 회사가 밝힌 대로 두 가지다. 하나는 약국 폐점이다. 2025년 5월 rite aid가 자산 대부분을 매각하는 파산 절차를 밟으면서 약값 협상 대행사들이 rite aid를 취급 약국에서 빼 청구가 즉시 끊겼고, 회사는 2026년 매출에도 계속 영향이 있을 것이라고 밝혔다. 다른 하나는 약국 창구 자동 적용 프로그램 가운데 한 곳에서 물량이 크게 줄어든 것이다. 두 가지를 합친 2025년 매출 영향만 3,500만~4,000만 달러로 회사가 추산했다. 월간 이용자는 2024년 4분기 660만 명에서 2025년 4분기 530만 명으로 줄었고, 구독 건수도 68만 4,000건에서 67만 4,000건으로 줄었다. 마지막으로 시점 문제가 있다. 뉴스레터가 다룬 2026년 2월 가이던스는 이후 5월과 8월에 두 번 올라갔으므로, 2월 시점의 숫자만 인용해 지금을 말하면 사실과 어긋난다.\", \"for_us\": \"우리가 3개월 동안 소프트웨어만으로 미국인에게 건강 가치를 주려 한다는 목적에 비추면 세 가지가 눈에 띈다. 첫째, 약값은 미국인이 매달 실제로 겪는 통증이고 앱 화면만으로 돈을 아껴 줄 수 있는 몇 안 되는 영역이다. goodrx는 약을 팔지 않고 기존 약국으로 보내기만 하므로, 재고도 면허도 없이 소프트웨어로 성립한다는 점을 증명한다. 둘째, 그러나 단순 가격 비교로 새로 들어갈 자리는 남아 있지 않다. 2026년 2분기에 쿠폰에서 나오는 처방 거래 매출은 1년 전보다 26% 줄었고, 늘어난 것은 제약사가 비용을 내는 pharma direct(76% 증가)와 질환별 구독(39% 증가)이었다. 값을 비교해 주는 일 자체가 아니라 누가 비용을 내는가가 사업을 가른다. 셋째, goodrx companion이 약에서 그치지 않고 치과와 안과, 혈액 검사, 영상 촬영 할인까지 월 9.99달러 회원제로 묶은 방향은 참고할 만하다. 우리 앱이 이미 현금 리워드를 갖고 있으므로, 미국 이용자에게 절감 가능 금액을 보여 주는 방식은 리워드와 성질이 비슷하면서도 다른 가치가 된다. 다만 위험도 같이 봐야 한다. goodrx는 건강 정보를 광고 목적으로 넘긴 문제로 2023년에 연방거래위원회 제재를 받았고 지금도 시정명령을 받고 있다. 광고 소프트웨어를 붙인 앱이 미국에서 건강 데이터를 다룰 때 무엇이 문제가 되는지 보여 주는 가장 가까운 사례다.\", \"screenshots\": [{\"file\": \"goodrx_home.png\", \"caption\": \"첫 화면. 약 이름을 넣는 검색창 아래에 glp-1 체중 감량 약 값과 월 9.99달러 회원제 안내가 함께 놓여 있어, 무료 쿠폰 회사에서 유료 구독과 브랜드 약 판매로 무게가 옮겨간 것이 드러난다.\", \"from\": \"https://www.goodrx.com/\"}, {\"file\": \"goodrx_companion.png\", \"caption\": \"유료 회원제 goodrx companion 안내. 250종이 넘는 무료 약과 치과, 안과, 검사, 영상 할인을 묶어 개인 월 9.99달러, 가족 월 16.99달러(연납 기준)로 판다.\", \"from\": \"https://www.goodrx.com/companion\"}, {\"file\": \"goodrx_ios.png\", \"caption\": \"미국 아이폰 앱스토어 페이지. 평점 4.8에 평가 70만 건, 의료 분야 12위이며 7만 곳이 넘는 약국에서 최대 80% 아낀다고 안내한다.\", \"from\": \"https://apps.apple.com/us/app/goodrx-prescription-savings/id485357017\"}], \"sources\": [{\"title\": \"goodrx 2025년 4분기·연간 실적 보도자료(sec 8-k 부속서류 99.1)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1809519/000180951926000028/gdrxq425-exx991pressrelease.htm\", \"note\": \"2025년 매출 7억 9,690만 달러, 부문별 매출, 2026년 가이던스 7억 5,000만~7억 8,000만 달러를 확인했다.\"}, {\"title\": \"goodrx 2025년 연차보고서(10-k)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1809519/000180951926000031/gdrx-20251231.htm\", \"note\": \"수익 구조, 월간 이용자 추이, rite aid 파산과 창구 자동 적용 프로그램 축소의 영향, trumprx 연동, 연방거래위원회 명령을 확인했다.\"}, {\"title\": \"goodrx 2026년 2분기 실적 보도자료\", \"url\": \"https://www.sec.gov/archives/edgar/data/1809519/000180951926000151/gdrxq226-exx991pressrelease.htm\", \"note\": \"처방 거래 매출 26% 감소, pharma direct 76% 증가, 구독 39% 증가, 가이던스 상향을 확인했다.\"}, {\"title\": \"goodrx 2026년 1분기 실적 보도자료\", \"url\": \"https://www.sec.gov/archives/edgar/data/1809519/000180951926000110/gdrxq126-exx991pressrelease.htm\", \"note\": \"5월 시점의 가이던스 상향과 pharma direct 82% 성장을 확인했다.\"}, {\"title\": \"goodrx 최고경영자 선임 공시(8-k)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1809519/000180951924000213/gdrx-20241212.htm\", \"note\": \"wendy barnes의 선임 시점과 이전 경력을 확인했다.\"}, {\"title\": \"goodrx 2026년 주주총회 소집 통지(def 14a)\", \"url\": \"https://www.sec.gov/archives/edgar/data/1809519/000180951926000091/gdrx-20260429.htm\", \"note\": \"공동창업자 douglas hirsch와 trevor bezdek의 약력과 창업 시점을 확인했다.\"}, {\"title\": \"미국 연방거래위원회, goodrx 제재 보도자료\", \"url\": \"https://www.ftc.gov/news-events/news/press-releases/2023/02/ftc-enforcement-action-bar-goodrx-sharing-consumers-sensitive-health-info-advertising\", \"note\": \"2023년 2월 150만 달러 과징금과 시정명령의 내용을 확인했다.\"}, {\"title\": \"goodrx 첫 화면\", \"url\": \"https://www.goodrx.com/\", \"note\": \"현재 무엇을 앞세워 파는지, glp-1 값과 회원제 안내를 확인했다.\"}, {\"title\": \"goodrx companion 안내 페이지\", \"url\": \"https://www.goodrx.com/companion\", \"note\": \"개인 월 14.99달러와 연 119.88달러, 가족 월 24.99달러와 연 203.88달러, 1회 19달러 온라인 진료 같은 구체적인 값을 확인했다.\"}, {\"title\": \"미국 아이폰 앱스토어의 goodrx 앱\", \"url\": \"https://apps.apple.com/us/app/goodrx-prescription-savings/id485357017\", \"note\": \"평점과 평가 건수, 7만 곳이 넘는 약국이라는 안내, 경쟁 앱의 평가 건수를 확인했다.\"}, {\"title\": \"구글 플레이의 goodrx 앱\", \"url\": \"https://play.google.com/store/apps/details?id=com.goodrx\", \"note\": \"내려받기 1,000만 회 이상과 리뷰 33.6만 건을 확인했다.\"}, {\"title\": \"야후 파이낸스 gdrx 시세 자료\", \"url\": \"https://finance.yahoo.com/quote/gdrx/history/\", \"note\": \"2026년 2월 25일 종가 2.45달러에서 26일 1.99달러로 18.8% 하락한 사실과 상장 이후 주가 흐름을 확인했다.\"}]}"},{"slug":"hims-hers","name":"Hims & Hers","one_liner":"탈모와 발기부전, 체중 감량, 정신건강처럼 미국 보험이 잘 보장하지 않는 처방 진료를 앱과 웹의 문진만으로 받게 해 주고, 면허 의료인이 처방한 약을 집으로 보내 월 구독료를 받는 미국 상장 원격진료 회사다.","sells_to":"consumer","seen_in":[{"issue":"10","section":5,"headline":"정부 프로그램 시장이 지급률 동결로 두들겨 맞는 같은 주에, 보험을 거치지 않고 소비자가 직접 내는 쪽인 Ro와 Hims가 나란히 슈퍼볼 광고 세부 내용을 공개했다는 대비를 보여 주는 사례로 나왔다."}],"card":{"problem":"미국에서 탈모와 성기능, 체중 감량 같은 문제는 보험이 거의 보장하지 않아 환자가 값을 전액 부담하는데, 그런데도 처방을 받으려면 병원 예약을 잡고 대면 진료를 거쳐야 한다. 부끄러워서 병원을 찾지 않고 그냥 참는 사람도 많다.","solution":"앱이나 웹에서 문진표를 채우면 면허 의료인이 검토해 처방하고, 약이 집으로 배송된다. 진료비를 따로 청구하지 않고 약값과 관리비를 묶어 월 구독료로 받으며, 복용 중에는 앱 안에서 담당 의료인에게 메시지를 보낼 수 있다.","price":"남성 탈모 치료는 월 15달러부터, 발기부전 치료는 월 22달러부터, 정신건강 약은 월 49달러부터다. 체중 감량은 멤버십이 첫 달 39달러이고 이후 월 149달러로 자동 갱신되며, 약값은 여기에 더해 월 149달러부터 따로 붙는다.","tags":["원격진료","처방약 배송","월 구독","보험 미사용","GLP-1"],"headline_traction":"2025년 매출이 23억 5천만 달러로 전년보다 59퍼센트 늘었고, 2026년 6월 말 구독자는 289만 명이다.","watch":"2026년 7월에 미국 연방거래위원회가 건강정보 광고 공유와 해지 방해를 이유로 소송을 냈고, 8월에는 Visa가 결제 분쟁이 지나치게 많은 가맹점을 넣는 감시 프로그램에 이 회사를 올렸다."},"screenshots":[{"file":"hims-hers_news.png","caption":"회사 뉴스룸 첫 화면이다. 호주 진출 소식이 맨 위에 있고, 그 아래로 여성용 Hers 앱이 담당 의료인과 케어팀, AI를 한 대화창에 모은 화면이 보인다.","from":"https://news.hims.com/"},{"file":"hims-hers_ios.png","caption":"미국 애플 앱스토어의 남성용 Hims 앱 페이지다. 평점 4.8에 평가 9만 5천 건이고 의료 분야 순위 안에 든다. 아래 개인정보 항목에는 건강, 금융, 민감 정보가 이용자 신원과 연결돼 수집된다고 적혀 있다.","from":"https://apps.apple.com/us/app/hims-telehealth-for-men/id1455690574"},{"file":"hims-hers_android.png","caption":"구글 플레이의 같은 앱 페이지다. 내려받기 100만 건이 넘고 평점은 4.5인데, 화면 아래쪽 후기 목록에는 결제와 해지를 문제 삼는 이용자 불만과 그에 대한 회사 답변이 나란히 붙어 있다.","from":"https://play.google.com/store/apps/details?id=com.himshers.hims"}],"q":"{\"slug\": \"hims-hers\", \"name\": \"hims & hers\", \"one_liner\": \"탈모와 발기부전, 체중 감량, 정신건강처럼 미국 보험이 잘 보장하지 않는 처방 진료를 앱과 웹의 문진만으로 받게 해 주고, 면허 의료인이 처방한 약을 집으로 보내 월 구독료를 받는 미국 상장 원격진료 회사다.\", \"site\": \"https://www.hims.com\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"10\", \"section\": 5, \"headline\": \"정부 프로그램 시장이 지급률 동결로 두들겨 맞는 같은 주에, 보험을 거치지 않고 소비자가 직접 내는 쪽인 ro와 hims가 나란히 슈퍼볼 광고 세부 내용을 공개했다는 대비를 보여 주는 사례로 나왔다.\"}], \"card\": {\"problem\": \"미국에서 탈모와 성기능, 체중 감량 같은 문제는 보험이 거의 보장하지 않아 환자가 값을 전액 부담하는데, 그런데도 처방을 받으려면 병원 예약을 잡고 대면 진료를 거쳐야 한다. 부끄러워서 병원을 찾지 않고 그냥 참는 사람도 많다.\", \"solution\": \"앱이나 웹에서 문진표를 채우면 면허 의료인이 검토해 처방하고, 약이 집으로 배송된다. 진료비를 따로 청구하지 않고 약값과 관리비를 묶어 월 구독료로 받으며, 복용 중에는 앱 안에서 담당 의료인에게 메시지를 보낼 수 있다.\", \"price\": \"남성 탈모 치료는 월 15달러부터, 발기부전 치료는 월 22달러부터, 정신건강 약은 월 49달러부터다. 체중 감량은 멤버십이 첫 달 39달러이고 이후 월 149달러로 자동 갱신되며, 약값은 여기에 더해 월 149달러부터 따로 붙는다.\", \"tags\": [\"원격진료\", \"처방약 배송\", \"월 구독\", \"보험 미사용\", \"glp-1\"], \"headline_traction\": \"2025년 매출이 23억 5천만 달러로 전년보다 59퍼센트 늘었고, 2026년 6월 말 구독자는 289만 명이다.\", \"watch\": \"2026년 7월에 미국 연방거래위원회가 건강정보 광고 공유와 해지 방해를 이유로 소송을 냈고, 8월에는 visa가 결제 분쟁이 지나치게 많은 가맹점을 넣는 감시 프로그램에 이 회사를 올렸다.\"}, \"problem\": \"미국에서는 탈모약이나 발기부전 치료제, 체중 감량약처럼 당장 생명을 위협하지 않는 처방약을 보험이 거의 보장하지 않는다. 그래서 환자가 약값을 전부 낸다. 그런데도 이 약들은 처방전이 있어야만 살 수 있기 때문에, 값을 스스로 내는 사람조차 병원 예약을 잡고 대면 진료를 한 번 거쳐야 한다. 한국이라면 동네 의원에 걸어 들어가 건강보험이 적용된 진료비를 내고 끝날 일이, 미국에서는 예약을 잡고 기다리는 시간과 진료비를 따로 부담하는 일이 겹쳐 두 겹의 문턱이 된다. 여기에 수치심이 더해진다. 탈모와 성기능, 비만은 의사 앞에서 먼저 말을 꺼내기 어려운 주제여서, 문제를 알면서도 아무 조치를 하지 않고 지내는 사람이 많다. glp-1 계열 비만약이 퍼지면서 이 구조가 더 뚜렷해졌다. 보험이 비만약을 보장 목록에서 빼는 경우가 많아 한 달에 수백 달러를 현금으로 내야 하는데, 그 돈을 낼 뜻이 있는 사람에게도 처방을 받을 통로가 마땅치 않았다.\", \"solution\": \"이용자는 앱이나 웹에서 증상과 병력을 묻는 문진표를 채운다. 면허를 가진 의료인이 그 답변을 검토하고, 필요하면 추가로 질문을 보낸 뒤 처방 여부를 정한다. 처방이 나오면 약이 집으로 배송되고, 그다음부터는 정해진 주기에 맞춰 자동으로 온다. 회사는 진료비를 따로 청구하지 않고 약값과 관리비를 묶어 월 구독료로 받는다. 복용을 시작한 뒤에도 앱 안에서 담당 의료인과 케어팀에게 메시지를 보낼 수 있고, 체중 감량 회원에게는 앱과 연동되는 체중계를 추가 비용 없이 보내 매일 잰 몸무게가 자동으로 올라오게 한다. 값은 항목마다 다르다. 남성 탈모는 월 15달러부터, 발기부전은 월 22달러부터, 정신건강 약은 월 49달러부터 시작한다. 체중 감량만 구조가 달라서 멤버십과 약값을 따로 받는다. 멤버십은 첫 달 39달러이고 그 뒤 월 149달러로 자동 갱신되며, 약값은 wegovy 알약이 월 149달러부터, zepbound가 월 299달러부터 별도로 붙는다.\", \"features\": [{\"name\": \"온라인 문진과 처방\", \"detail\": \"증상과 병력을 묻는 문진표를 채우면 면허 의료인이 검토해 처방 여부를 정한다. 화상 진료가 필수는 아니며 대부분 글로 주고받는다.\"}, {\"name\": \"정기 배송 구독\", \"detail\": \"처방이 나온 약을 정해진 주기로 집에 보낸다. 회사는 문진과 진료 연결, 약 조제와 배송, 그 뒤의 관리까지를 한 회사가 모두 맡는다고 스스로 밝힌다.\"}, {\"name\": \"앱 안 의료인 메시지\", \"detail\": \"복용 중에 생기는 질문을 앱에서 담당 의료인과 케어팀에게 바로 물어볼 수 있다. 배송 일정도 앱에서 조정한다.\"}, {\"name\": \"labs 혈액검사와 실행 계획\", \"detail\": \"1년에 130가지가 넘는 혈액 지표를 재고, 그 결과를 바탕으로 의사가 만든 실행 계획을 앱에 띄운다. 보험을 쓰지 않는다. 2026년 2월부터는 한 번의 채혈로 50가지가 넘는 암 신호를 살피는 galleri 검사를 선택 항목으로 붙였다.\"}, {\"name\": \"체중 감량 프로그램\", \"detail\": \"wegovy와 ozempic, zepbound 같은 fda 승인 glp-1 약을 처방받는다. 부작용을 줄이려고 용량을 잘게 나누어 쓰는 방식도 고를 수 있고, 앱과 연동되는 체중계가 멤버십에 포함된다.\"}, {\"name\": \"hers 앱의 ai 진료 경험\", \"detail\": \"2026년 8월에 여성용 hers 앱을 새로 만들어, 이용자와 담당 의료인, 케어팀, ai가 하나의 대화 안에서 이어지게 했다. 진료와 진료 사이의 빈 시간을 ai가 메우고 판단이 필요한 순간에 의료인을 불러들이는 구조이며, 체중 감량 회원부터 적용한 뒤 남성용 hims 앱과 다른 항목으로 넓힐 계획이라고 밝혔다.\"}, {\"name\": \"hims & hers benefits\", \"detail\": \"2026년 3월부터 구독자에게 다른 건강·웰니스 상품 할인을 제공한다.\"}], \"differentiator\": \"같은 자리에 있는 회사는 ro다. 보험을 거치지 않고 소비자가 직접 값을 내며, 온라인 문진으로 처방을 받아 약을 배송받는 구조가 두 회사 모두 같다. 2026년 슈퍼볼에 나란히 광고를 낸 것도 이 둘이다. 차이는 규모와 방향에 있다. hims & hers는 뉴욕증권거래소에 상장돼 있어 매출과 구독자 수를 분기마다 공개하며, 2025년 매출은 23억 5천만 달러였다. 또 영국의 zava, 캐나다의 livewell, 호주의 eucalyptus를 차례로 사들여 영국과 독일, 캐나다, 호주, 일본으로 넓혔는데, 이렇게 국경을 넘어 확장한 소비자 원격진료 회사는 아직 드물다. teladoc처럼 보험사와 고용주를 상대로 파는 원격진료 회사와는 고객 자체가 다르다. 저쪽은 보험이 값을 치르고 이쪽은 이용자가 직접 치른다.\", \"team\": [{\"name\": \"andrew dudum\", \"role\": \"공동창업자, 최고경영자\", \"background\": \"2016년 9월부터 최고경영자와 이사를 맡고 있다. 그 전에는 스타트업 스튜디오이자 투자 펀드인 atomic labs를 공동창업해 제너럴 파트너로 일했다.\"}, {\"name\": \"yemi okupe\", \"role\": \"최고재무책임자\", \"background\": \"2019년부터 2021년까지 uber에서 ubereats와 글로벌 모빌리티 부문의 사업부 재무책임자로 일했고, 그 전에는 ebay와 paypal, google에서 재무를 맡았다.\"}, {\"name\": \"mo elshenawy\", \"role\": \"최고기술책임자\", \"background\": \"2025년 5월에 합류했다. 그 전에는 general motors의 자율주행 자회사 cruise에서 사장 겸 최고기술책임자를 지냈고, amazon에서도 엔지니어링 조직을 이끌었다.\"}, {\"name\": \"dheerja kaur\", \"role\": \"최고제품책임자\", \"background\": \"2025년 7월에 합류했다. 그 전에는 robinhood의 제품 부사장으로 유료 멤버십인 robinhood gold를 맡았다.\"}, {\"name\": \"patrick carroll\", \"role\": \"글로벌 최고의료책임자\", \"background\": \"2014년부터 2019년까지 walgreens의 최고의료책임자를 지냈고, whoop과 vida health에서도 같은 자리를 맡았다.\"}, {\"name\": \"deb autor\", \"role\": \"최고정책책임자\", \"background\": \"2001년부터 2013년까지 미국 fda에서 일했고 마지막 직책은 글로벌 규제 운영·정책을 총괄하는 부청장이었다. 2024년 11월부터 이 회사 이사를 맡다가 2025년 11월에 최고정책책임자가 됐다.\"}], \"traction\": [{\"type\": \"revenue\", \"detail\": \"2025년 매출이 23억 5천만 달러로 전년보다 59퍼센트 늘었다. 순이익은 1억 2,800만 달러, 조정 ebitda는 3억 1,800만 달러였다.\", \"when\": \"2026-02\", \"source\": \"2025년 4분기·연간 실적 발표\"}, {\"type\": \"revenue\", \"detail\": \"2026년 2분기 매출이 7억 5,320만 달러로 전년 동기보다 38퍼센트 늘었으나, 같은 분기에 8,630만 달러 순손실을 냈다. 총이익률은 1년 사이 76퍼센트에서 64퍼센트로 떨어졌다.\", \"when\": \"2026-08\", \"source\": \"2026년 2분기 실적 발표\"}, {\"type\": \"customers\", \"detail\": \"2026년 6월 말 구독자가 289만 명으로 전년 동기보다 19퍼센트 늘었다. 구독자 한 사람이 한 달에 내는 금액은 평균 92달러다.\", \"when\": \"2026-08\", \"source\": \"2026년 2분기 실적 발표\"}, {\"type\": \"partnership\", \"detail\": \"novo nordisk와 협업 계약을 맺고 ozempic과 wegovy를 플랫폼에서 팔기 시작했다. 같은 날 novo nordisk는 2월에 제기했던 소송을 취하했다.\", \"when\": \"2026-03\", \"source\": \"회사 보도자료, reuters\"}, {\"type\": \"partnership\", \"detail\": \"호주의 원격진료 회사 eucalyptus를 최대 11억 5천만 달러에 인수하는 절차를 마쳤다. eucalyptus는 juniper와 pilot 브랜드를 운영하며 고객 85만 명을 모았고 연 환산 매출이 4억 5천만 달러를 넘는다고 밝혔다.\", \"when\": \"2026-06\", \"source\": \"회사 보도자료\"}, {\"type\": \"funding\", \"detail\": \"국제 확장과 ai 투자에 쓰겠다며 3억 5천만 달러 규모 전환사채를 발행했다.\", \"when\": \"2026-05\", \"source\": \"회사 보도자료\"}, {\"type\": \"regulatory\", \"detail\": \"미국 연방거래위원회가 유타주, 캘리포니아주와 함께 캘리포니아 북부 연방지방법원에 소송을 냈다. 민감한 건강정보를 meta와 snap 같은 광고 플랫폼에 넘겼고, 문진표를 낸 직후 바로 결제를 걸었으며, 해지 버튼을 여러 단계 뒤에 숨겼다는 내용이다. 회사는 근거 없는 주장이라며 다투겠다고 밝혔다.\", \"when\": \"2026-07\", \"source\": \"ftc 보도자료, 회사 입장문\"}, {\"type\": \"regulatory\", \"detail\": \"visa가 결제 분쟁이 지나치게 많은 가맹점을 넣는 감시 프로그램에 이 회사를 올렸다. 분쟁 한 건마다 8달러가 붙어 9월에 약 7만 5천 달러를 물게 됐고, 프로그램에서 빠지려면 분쟁 비율을 석 달 연속 1.5퍼센트 아래로 낮춰야 한다.\", \"when\": \"2026-08\", \"source\": \"bloomberg 보도(내부 문서 기반), medical daily 정리\"}, {\"type\": \"traffic\", \"detail\": \"2025년 슈퍼볼 광고 뒤 트래픽이 650퍼센트 늘었다고 보도됐다.\", \"when\": \"2025-02\", \"source\": \"fierce healthcare 기사 제목(본문은 열지 못해 확인하지 못했다)\"}], \"caveats\": \"먼저 뉴스레터 대목부터 정리한다. 2026년 슈퍼볼 광고는 실제로 집행됐다. 2월 8일에 내보낸 광고 이름은 'rich people live longer'이고, 래퍼 common이 목소리를 맡았으며, 부자가 더 오래 사는 나라라는 문제를 정면으로 꺼내는 내용이다. 다만 이 광고에 얼마를 썼는지는 회사가 밝히지 않았다. 뉴스레터에 나온 1,500만 달러는 ro가 밝힌 금액이므로 hims에 그대로 옮겨 쓰면 안 된다.\\n\\n조제 glp-1 광고를 멈춘 일은 성격을 정확히 볼 필요가 있다. 규제 당국이 명령했거나 합의를 강제한 것이 아니라, 2026년 3월 9일에 회사가 스스로 전략을 바꾼다고 발표한 것이다. fda 승인 약으로 무게중심을 옮기면서 조제 glp-1은 더 이상 광고하지 않고 임상적으로 꼭 필요한 경우에만 제한적으로 제공하겠다고 했다. 그런데 같은 날 novo nordisk가 판매 협업 계약을 맺고 2월 9일에 냈던 특허 침해 소송을 취하했으므로, 자발적 결정과 소송 타결이 사실상 한 묶음이었다고 보는 편이 맞다.\\n\\n수치의 출처가 서로 다르다. 매출과 구독자 수, 순손익은 상장사가 공시한 실적이므로 감사받는 재무제표에 근거한다. 다만 조정 ebitda는 회계 기준 밖의 지표이고 계산 방식을 회사가 정한다. 반면 eucalyptus의 고객 85만 명과 연 환산 매출 4억 5천만 달러는 회사가 인수를 알리며 밝힌 값이고 제삼자가 확인한 것이 아니다. 2030년까지 매출 65억 달러라는 목표도 회사의 전망이다.\\n\\n법적 위험은 아직 진행 중이다. 연방거래위원회 소송은 제소 단계이고 법원이 어떤 판단도 내리지 않았다. 회사는 3년 가까운 조사에서 제출한 자료를 무시한 소송이라고 반박했다. visa 감시 프로그램 편입은 bloomberg가 내부 문서를 근거로 보도한 것이고, 회사는 분쟁 건수가 상대적으로 적다고만 답하고 프로그램 자체에 대한 질문에는 답하지 않았다. 이 둘은 성격이 다르다. 앞의 것은 정부 기관의 법 집행이고 뒤의 것은 카드 회사가 가맹점에 매기는 상업적 제재다.\\n\\n광고를 둘러싼 시비는 이번이 처음이 아니다. 2025년 슈퍼볼 광고 때도 상원의원 두 명과 업계 단체가 환자를 오도할 위험이 있다며 fda에 검토를 요청했다. 갈무리한 구글 플레이 화면에는 결제와 해지를 문제 삼는 이용자 후기가 상단에 올라와 있는데, 이는 개별 이용자의 주장이지 확인된 사실은 아니다. 다만 연방거래위원회가 문제 삼은 대목과 방향이 같다는 점은 눈여겨볼 만하다.\", \"for_us\": \"이 회사가 파는 것은 약이 아니라 구독이다. 슈퍼볼 광고 같은 큰돈을 감당할 수 있는 이유는 한 번 들어온 사람이 매달 계속 내기 때문이고, 그래서 회사의 가장 큰 약점도 거기서 나왔다. 해지와 청구를 둘러싼 분쟁이 쌓여 규제 기관 소송과 카드 회사 제재로 이어졌다. 우리가 미국에서 구독을 붙인다면, 해지 경로를 앱 안에서 두 번 안에 끝내도록 만드는 일이 나중에 붙일 기능이 아니라 처음부터 지켜야 할 조건이라는 뜻이다.\\n\\n제품 쪽에서 가져올 것은 hers 앱이 잡은 문제 정의다. 이 회사는 진료와 진료 사이의 빈 시간을 문제로 규정했다. 밤 아홉 시에 생긴 부작용, 용량을 바꾼 뒤의 질문, 아무도 알아주지 않는 작은 성취처럼 다음 예약까지 기다리라는 말밖에 들을 수 없는 구간이다. 이 구간을 메우는 일은 처방권도 약국도 필요 없고 소프트웨어만으로 할 수 있다. 우리 앱은 이미 걸음 데이터를 매일 받고 있으므로 붙일 자리가 있다.\\n\\n특히 glp-1 복용자라는 집단이 눈에 띈다. 미국에서 이 약을 쓰는 사람이 빠르게 늘었고, 이들은 메스꺼움 같은 부작용과 단백질 섭취, 근육 손실, 약을 끊은 뒤의 요요처럼 매일 판단해야 할 문제를 안고 있다. 처방한 의료인은 매일 곁에 없다. 우리는 약을 팔 수 없지만 약을 쓰는 사람 옆에서 매일 쓰이는 앱은 될 수 있다. hims가 체중계를 무료로 보내 매일 수치를 받아 가는 것도 같은 목적이며, 우리는 기기 없이 이미 그 자리를 갖고 있다.\\n\\n마지막으로 값의 감각을 참고할 만하다. 미국 소비자는 보험을 거치지 않는 건강 상품에 월 15달러에서 149달러까지 현금으로 낸다. 한국에서 흔히 가정하는 지불 의사보다 훨씬 높은 수준이며, 우리가 미국에서 유료 기능을 붙일 때 기준으로 삼을 만한 실측값이다.\", \"screenshots\": [{\"file\": \"hims-hers_news.png\", \"caption\": \"회사 뉴스룸 첫 화면이다. 호주 진출 소식이 맨 위에 있고, 그 아래로 여성용 hers 앱이 담당 의료인과 케어팀, ai를 한 대화창에 모은 화면이 보인다.\", \"from\": \"https://news.hims.com/\"}, {\"file\": \"hims-hers_ios.png\", \"caption\": \"미국 애플 앱스토어의 남성용 hims 앱 페이지다. 평점 4.8에 평가 9만 5천 건이고 의료 분야 순위 안에 든다. 아래 개인정보 항목에는 건강, 금융, 민감 정보가 이용자 신원과 연결돼 수집된다고 적혀 있다.\", \"from\": \"https://apps.apple.com/us/app/hims-telehealth-for-men/id1455690574\"}, {\"file\": \"hims-hers_android.png\", \"caption\": \"구글 플레이의 같은 앱 페이지다. 내려받기 100만 건이 넘고 평점은 4.5인데, 화면 아래쪽 후기 목록에는 결제와 해지를 문제 삼는 이용자 불만과 그에 대한 회사 답변이 나란히 붙어 있다.\", \"from\": \"https://play.google.com/store/apps/details?id=com.himshers.hims\"}], \"sources\": [{\"title\": \"hims & hers returns to the big game with a message to all americans\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-returns-to-the-big-game-with-a-message-to-all-americans-the-era-of-health-as-a-luxury-is-over/default.aspx\", \"note\": \"2026년 슈퍼볼 광고의 이름과 내용, 출연자를 확인했다. 광고비는 밝히지 않았다.\"}, {\"title\": \"hims & hers announces strategic shift for us weight loss business\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-announces-strategic-shift-for-us-weight-loss-business/default.aspx\", \"note\": \"조제 glp-1 광고를 중단한다는 발표와 novo nordisk 협업, 소송 취하가 같은 날 이루어졌음을 확인했다.\"}, {\"title\": \"hims & hers announces agreement to acquire eucalyptus\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-announces-agreement-to-acquire-eucalyptus-accelerating-its-vision-to-become-the-leading-global-consumer-health-platform/default.aspx\", \"note\": \"인수 금액 최대 11억 5천만 달러와 대금 지급 구조, eucalyptus의 연 환산 매출을 확인했다.\"}, {\"title\": \"hims & hers completes acquisition of eucalyptus\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-completes-acquisition-of-eucalyptus-advancing-its-position-as-the-worlds-largest-consumer-health-platform/default.aspx\", \"note\": \"2026년 6월 2일 인수 완료와 진출 국가, 고객 85만 명이라는 회사 발표를 확인했다.\"}, {\"title\": \"hims & hers health, inc. reports second quarter 2026 financial results\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-health-inc--reports-second-quarter-2026-financial-results/default.aspx\", \"note\": \"2026년 2분기 매출과 구독자 수, 순손실, 총이익률, 연간 전망을 확인했다.\"}, {\"title\": \"hims & hers health, inc. reports fourth quarter and full year 2025 financial results\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-health-inc--reports-fourth-quarter-and-full-year-2025-financial-results/default.aspx\", \"note\": \"2025년 연간 매출 23억 5천만 달러와 순이익, 구독자 251만 명을 확인했다.\"}, {\"title\": \"hims & hers introduces new hers app with doctor-led, ai-native care experience\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-introduces-new-hers-app-with-first-of-its-kind-doctor-led-ai-native-care-experience/default.aspx\", \"note\": \"진료 사이의 빈 시간을 문제로 규정한 대목과 스마트 체중계 무상 제공, 문진부터 배송까지 한 회사가 맡는다는 회사 주장을 확인했다.\"}, {\"title\": \"ftc and states act against hims & hers for deceptive and unlawful privacy practices\", \"url\": \"https://www.ftc.gov/news-events/news/press-releases/2026/07/ftc-states-act-against-hims-hers-deceptive-unlawful-privacy-practices\", \"note\": \"광고 플랫폼 건강정보 공유, 문진 직후 결제, 해지 방해 혐의와 적용 법률, 함께 제소한 주를 확인했다.\"}, {\"title\": \"hims & hers responds to ftc lawsuit\", \"url\": \"https://investors.hims.com/news/news-details/2026/hims--hers-responds-to-ftc-lawsuit/default.aspx\", \"note\": \"회사가 소송을 전면 부인한 입장문이다.\"}, {\"title\": \"hims' weight-loss plans draw penalties over credit card disputes\", \"url\": \"https://www.bloomberg.com/news/articles/2026-08-21/hims-weight-loss-plans-draw-penalties-over-credit-card-disputes\", \"note\": \"visa 감시 프로그램 편입을 내부 문서로 처음 보도한 기사다. 본문은 유료 구독 벽에 막혀 직접 열지 못했고, 이 기사를 인용해 정리한 medical daily와 investing.com 기사로 내용을 확인했다.\"}, {\"title\": \"hims 공식 사이트 (탈모, 발기부전, 정신건강, 체중 감량, labs)\", \"url\": \"https://www.hims.com/weight-loss\", \"note\": \"항목별 시작 가격과 체중 감량 멤버십 조건, 취급 약 목록, labs 검사 항목을 직접 확인했다.\"}, {\"title\": \"hims inc. 임원 소개\", \"url\": \"https://investors.hims.com/governance/executive-management/default.aspx\", \"note\": \"창업자와 주요 임원의 직함, 이전 경력을 확인했다.\"}, {\"title\": \"hims: telehealth for men (미국 애플 앱스토어)\", \"url\": \"https://apps.apple.com/us/app/hims-telehealth-for-men/id1455690574\", \"note\": \"평점 4.8, 평가 9만 4천여 건, 무료 내려받기, 수집 정보 항목을 확인했다.\"}, {\"title\": \"hims: telehealth for men (구글 플레이)\", \"url\": \"https://play.google.com/store/apps/details?id=com.himshers.hims\", \"note\": \"내려받기 100만 건 이상, 평점 4.5, 후기 1만 8천여 건과 결제 관련 이용자 불만을 확인했다.\"}, {\"title\": \"hers: women's healthcare (구글 플레이)\", \"url\": \"https://play.google.com/store/apps/details?id=com.himshers.hers\", \"note\": \"여성용 앱의 내려받기 50만 건 이상과 취급 항목을 확인했다.\"}, {\"title\": \"hims inc. 투자자 자주 묻는 질문\", \"url\": \"https://investors.hims.com/resources/investor-faqs/default.aspx\", \"note\": \"델라웨어주에 2013년 법인 설립, 뉴욕증권거래소 상장, 샌프란시스코 본사를 확인했다.\"}, {\"title\": \"hims & hers faces visa penalties over dispute surge (investing.com)\", \"url\": \"https://www.investing.com/news/stock-market-news/hims--hers-faces-visa-penalties-over-dispute-surge--bloomberg-93ch-4872170\", \"note\": \"건당 8달러 부과, 9월 약 7만 5천 달러 청구, 프로그램에서 빠지려면 석 달 연속 분쟁 비율 1.5퍼센트 아래라는 조건을 확인했다.\"}]}"},{"slug":"lillydirect","name":"LillyDirect","one_liner":"제약사 Eli Lilly가 도매상과 약국 체인, 약값 협상 대행사를 거치지 않고 자사 약을 환자에게 직접 파는 통로다. Lilly가 운영하는 약국이 처방전을 받아 집으로 무료 배송하고, 보험을 쓰지 않고 현금으로 살 때 내는 값을 용량별로 미리 공개한다. 처방해 줄 의사가 없는 사람에게는 제휴 온라인 진료 회사를 연결해 준다.","sells_to":"consumer","seen_in":[{"issue":"33","section":5,"headline":"제약사의 다음 단계가 신약 분자 개발을 넘어 생태계를 만들어 고용주 시장에서 이기는 쪽으로 간다는 2×2 표를 소개하면서, 그 생태계 전략의 사례로 한 줄 언급됐다."}],"card":{"problem":"미국에서 약은 제약사에서 도매상과 약국, 그리고 보험사를 대신해 보장 목록을 정하는 약값 협상 대행사를 차례로 거쳐 환자에게 닿는다. 그 사이에 붙는 몫 때문에 값이 어떻게 정해지는지 알 수 없고, 비만 치료제처럼 보험 보장이 자주 빠지는 약은 정가인 월 1,086달러를 환자가 그대로 떠안는다.","solution":"제약사가 중간 유통을 건너뛰고 자기 약국에서 환자에게 직접 판다. 용량별 현금 결제 값을 미리 공개하고 배송비를 받지 않으며, 처방해 줄 의사가 없는 사람에게는 제휴 온라인 진료 회사를 골라 예약하게 한다.","price":"보험을 쓰지 않는 현금 결제 기준으로 비만 주사제 Zepbound가 시작 용량 월 299달러, 5mg 월 399달러이고, 그 위 용량은 45일 안에 다시 처방을 채우면 월 449달러다. 먹는 약 Foundayo는 월 149달러부터 299달러이며, 인슐린은 종류와 무관하게 월 35달러다.","tags":["제약사 직판","비만 치료제","현금 결제","약 배송","온라인 진료"],"headline_traction":"2026년 2분기 실적 발표에서 회사는 Zepbound 처방의 45%, 신규 처방의 55%가 보험을 거치지 않는 현금 결제였다고 밝혔다.","watch":"미국 상원 조사에서 LillyDirect로 연결된 온라인 진료 이용자의 74%가 처방을 받았고 제휴사 한 곳은 100%였다는 지적이 나왔다. 공개된 값도 45일 안에 재조제해야 유지되는 조건부 값이다."},"screenshots":[{"file":"lillydirect_home.png","caption":"첫 화면이다. 약을 찾고, 의사를 찾고, 처방 지원을 받는 세 갈래로 나뉘어 있다.","from":"https://lillydirect.lilly.com/"},{"file":"lillydirect_zepbound_price.png","caption":"비만 주사제 Zepbound의 현금 결제 값이다. 시작 용량 월 299달러, 5mg 월 399달러이고 7.5mg 이상은 45일 안에 재조제하는 조건으로 월 449달러다. 아래 작은 글씨에 조건을 놓쳤을 때 적용되는 499달러와 699달러가 적혀 있다.","from":"https://www.lilly.com/lillydirect/zepbound"},{"file":"lillydirect_foundayo_price.png","caption":"먹는 비만 치료제 Foundayo의 현금 결제 값이다. 0.8mg과 2.5mg이 월 149달러, 5.5mg이 199달러, 9mg 이상이 299달러다.","from":"https://www.lilly.com/lillydirect/foundayo"}],"q":"{\"slug\": \"lillydirect\", \"name\": \"lillydirect\", \"one_liner\": \"제약사 eli lilly가 도매상과 약국 체인, 약값 협상 대행사를 거치지 않고 자사 약을 환자에게 직접 파는 통로다. lilly가 운영하는 약국이 처방전을 받아 집으로 무료 배송하고, 보험을 쓰지 않고 현금으로 살 때 내는 값을 용량별로 미리 공개한다. 처방해 줄 의사가 없는 사람에게는 제휴 온라인 진료 회사를 연결해 준다.\", \"site\": \"https://lillydirect.lilly.com\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"33\", \"section\": 5, \"headline\": \"제약사의 다음 단계가 신약 분자 개발을 넘어 생태계를 만들어 고용주 시장에서 이기는 쪽으로 간다는 2×2 표를 소개하면서, 그 생태계 전략의 사례로 한 줄 언급됐다.\"}], \"card\": {\"problem\": \"미국에서 약은 제약사에서 도매상과 약국, 그리고 보험사를 대신해 보장 목록을 정하는 약값 협상 대행사를 차례로 거쳐 환자에게 닿는다. 그 사이에 붙는 몫 때문에 값이 어떻게 정해지는지 알 수 없고, 비만 치료제처럼 보험 보장이 자주 빠지는 약은 정가인 월 1,086달러를 환자가 그대로 떠안는다.\", \"solution\": \"제약사가 중간 유통을 건너뛰고 자기 약국에서 환자에게 직접 판다. 용량별 현금 결제 값을 미리 공개하고 배송비를 받지 않으며, 처방해 줄 의사가 없는 사람에게는 제휴 온라인 진료 회사를 골라 예약하게 한다.\", \"price\": \"보험을 쓰지 않는 현금 결제 기준으로 비만 주사제 zepbound가 시작 용량 월 299달러, 5mg 월 399달러이고, 그 위 용량은 45일 안에 다시 처방을 채우면 월 449달러다. 먹는 약 foundayo는 월 149달러부터 299달러이며, 인슐린은 종류와 무관하게 월 35달러다.\", \"tags\": [\"제약사 직판\", \"비만 치료제\", \"현금 결제\", \"약 배송\", \"온라인 진료\"], \"headline_traction\": \"2026년 2분기 실적 발표에서 회사는 zepbound 처방의 45%, 신규 처방의 55%가 보험을 거치지 않는 현금 결제였다고 밝혔다.\", \"watch\": \"미국 상원 조사에서 lillydirect로 연결된 온라인 진료 이용자의 74%가 처방을 받았고 제휴사 한 곳은 100%였다는 지적이 나왔다. 공개된 값도 45일 안에 재조제해야 유지되는 조건부 값이다.\"}, \"problem\": \"미국에서 처방약은 제약사에서 도매상으로, 다시 약국으로, 그리고 보험사를 대신해 어떤 약을 보장 목록에 넣을지 정하고 제약사와 할인을 협상하는 약값 협상 대행사를 거쳐 환자에게 닿는다. 제약사가 정가를 올리면 대행사가 그만큼 비공개 할인을 받아 가는 구조이기 때문에, 겉으로 붙은 정가와 실제로 오간 돈이 크게 벌어지고 그 차이를 환자는 확인할 방법이 없다. 비만 치료제에서 이 문제가 가장 크게 드러난다. lilly는 회사 자료에서 민간 보험에 든 직장인 가운데 절반가량이 비만 치료제를 보장받지 못한다고 밝히는데, 보장이 없으면 zepbound의 정가인 월 1,086.37달러를 그대로 내야 한다. lilly가 밝힌 2026년 2분기 수치를 보면 zepbound 처방의 45%가 보험을 거치지 않은 현금 결제였다. 보험 제도가 있는 나라에서 한 약의 처방 절반 가까이가 보험 밖에서 오가고 있다는 뜻이다. 한국은 건강보험이 전 국민에게 적용되고 약값을 정부가 직접 정하기 때문에 중간에서 할인을 협상하는 이런 단계 자체가 없어서, 대응하는 제도를 찾기 어렵다.\", \"solution\": \"먼저 사이트에서 자기에게 해당하는 약을 찾는다. 2026년 9월 기준으로 비만 주사제 zepbound, 먹는 비만 치료제 foundayo, 당뇨약 mounjaro와 trulicity, 편두통 예방 주사 emgality, 그리고 인슐린 다섯 종류까지 모두 10개 제품이 올라와 있다. 처방은 반드시 의사가 내야 하므로, 다니는 의사가 있으면 lillydirect 약국으로 처방전을 보내 달라고 부탁하고, 없으면 사이트에 붙어 있는 온라인 진료 회사 가운데 한 곳을 골라 예약한다. 처방전이 약국에 도착하면 약국이 먼저 환자에게 연락해서 적용할 수 있는 할인을 확인하고 결제까지 안내한다. 결제가 끝나면 약이 집으로 배송되며 배송비는 받지 않고, 원하면 가까운 소매 약국에서 찾아가는 방법도 고를 수 있다. 현금으로 살 때 값은 zepbound가 용량에 따라 월 299달러에서 449달러, foundayo가 월 149달러에서 299달러이고, 인슐린은 종류와 무관하게 월 35달러다. 보험이 zepbound를 보장하는 사람은 할인 카드를 붙여 월 25달러까지 내려가며, medicare 가입자는 2026년 7월 1일 시작된 별도 프로그램으로 월 50달러에 받는다.\", \"features\": [{\"name\": \"lilly가 직접 운영하는 약국\", \"detail\": \"lillydirect pharmacy라는 이름으로 미국 약국 식별 번호(npi 1912889320)와 인디애나폴리스 주소를 사이트에 공개해 두었다. 의사가 이곳으로 처방전을 보내면 약국이 환자에게 먼저 연락해 할인 적용과 결제를 안내하고 배송비를 받지 않는다. 주사기로 한 번 쓰고 버리는 단일 용량 바이알 형태의 zepbound는 이 통로에서만 살 수 있다.\"}, {\"name\": \"용량별 현금 결제 값 공개\", \"detail\": \"보험을 쓰지 않는 사람이 얼마를 내는지 제품 페이지에 용량별로 적어 둔다. zepbound는 2.5mg 월 299달러, 5mg 월 399달러, 7.5mg 이상은 월 449달러이고, 먹는 약 foundayo는 0.8mg과 2.5mg 월 149달러, 5.5mg 월 199달러, 9mg 이상 월 299달러다. lilly가 따로 운영하는 값 안내 사이트는 zepbound의 정가를 499달러에서 1,086.37달러로 밝히고 있어, 현금 결제 값이 정가의 3분의 1 수준임을 확인할 수 있다.\"}, {\"name\": \"45일 재조제 조건이 붙은 값(journey program)\", \"detail\": \"zepbound 7.5mg 이상과 foundayo 14.5mg 이상에 적혀 있는 값은 45일 안에 다음 처방을 채운다는 조건이 붙는다. 조건을 지키지 못하면 zepbound는 7.5mg 499달러, 10mg 이상 699달러로 원래 값이 적용된다. 값을 낮게 유지하려면 복약을 끊지 않아야 하는 구조다.\"}, {\"name\": \"제휴 온라인 진료 연결\", \"detail\": \"비만, 당뇨, 편두통, 수면무호흡 네 가지로 나뉘어 있고 2026년 9월 기준 제휴사는 general medicine, counsel health, sesame, weightwatchers, knownwell, healthtap, neura health, ognomy 여덟 곳이다. 진료비는 보험을 쓰면 1회 평균 25달러, 현금으로는 1회 29달러부터 299달러까지이고 월 회비 방식도 있다. 이 진료비는 약값과 별개이며, lilly는 이들이 독립된 업체이고 자신이 추천하는 것이 아니라고 화면에 명시한다.\"}, {\"name\": \"보험 가입자와 medicare 가입자를 위한 별도 경로\", \"detail\": \"민간 보험이 zepbound를 보장하면 할인 카드를 붙여 한 달에서 석 달치를 월 25달러에 받는다. medicare 가입자는 2026년 7월 1일 시작된 medicare glp-1 bridge 프로그램으로 월 50달러에 받으며, lillydirect가 이 프로그램의 조제도 처리한다. 정부 보험 가입자는 현금 결제용 할인 카드를 쓸 수 없다.\"}, {\"name\": \"인슐린 월 35달러\", \"detail\": \"humalog, humulin, basaglar, rezvoglar, lyumjev 다섯 계열 인슐린을 보험 여부와 무관하게 월 35달러에 판다. 비만 치료제와 달리 값이 용량에 따라 갈리지 않는다.\"}, {\"name\": \"무료 동반 앱 lilly health\", \"detail\": \"lillydirect 자체 앱은 없고, zepbound와 mounjaro, foundayo를 쓰는 사람을 위한 무료 앱 lilly health가 따로 있다. 복약과 활동 기록, 투약 알림, 추세 그래프, 스마트 기기 연동, 글과 조리법과 운동 영상 모음을 담고 있다. 미국 애플 앱스토어에서 별점 4.7에 평가 3,878건, 구글 플레이에서 별점 4.4에 후기 817건과 내려받기 10만 회 이상을 기록하고 있다.\"}, {\"name\": \"대면 진료 의사 찾기\", \"detail\": \"온라인 진료를 원하지 않는 사람을 위해 healthgrades라는 외부 의사 검색 서비스로 넘겨 준다. 미국 상원 보고서는 이 검색 기능이 lilly와 금전 관계가 있는 의사를 앞세워 보여 준다고 지적했다.\"}], \"differentiator\": \"같은 방식을 쓰는 곳이 이미 여럿이다. 경쟁사 novo nordisk의 novocare pharmacy는 wegovy를 현금 결제 월 349달러, 먹는 형태를 149달러부터 299달러에 파는데 값 구간과 안내 방식이 lillydirect와 거의 같다. pfizer의 pfizerforall도 같은 시기에 같은 구조로 열렸다. hims & hers나 ro, goodrx처럼 약을 되파는 회사와 비교하면 차이가 분명하다. lillydirect는 약을 만든 회사 자신이라 가장 낮은 값을 스스로 정할 수 있고, 되파는 회사들은 그 값보다 아래로 내려갈 수 없다. 다만 뒤집어 보면 자사 약만 판다는 한계가 있어서, 여러 회사 약을 놓고 값을 비교하는 일은 여기서 할 수 없다. 진료도 직접 하지 않고 외부 업체에 넘긴다는 점에서, 진료와 처방과 배송을 한 회사가 모두 쥐는 hims & hers 방식과는 다르다.\", \"team\": [{\"name\": \"david a. ricks\", \"role\": \"eli lilly 회장 겸 최고경영자\", \"background\": \"2024년 1월 lillydirect 출시 보도자료에서 복잡한 미국 의료 체계가 환자의 부담을 키운다며 이 통로를 만든 이유를 밝힌 인물이다.\"}, {\"name\": \"ilya yuffa\", \"role\": \"eli lilly 총괄 부사장 겸 lilly usa와 글로벌 고객 역량 부문 사장\", \"background\": \"2026년 3월 고용주 대상 프로그램 출시 보도자료와 2026년 2분기 실적 발표 통화에서 미국 소비자 직접 판매 전략을 설명한 책임자다.\"}, {\"name\": \"frank cunningham\", \"role\": \"출시 당시 eli lilly 글로벌 가치와 접근성 부문 그룹 부사장\", \"background\": \"2024년 1월 출시 보도자료에서 lillydirect를 처음 소개한 임원이다. 이후 직함이 바뀌었는지는 확인하지 못했다.\"}], \"traction\": [{\"type\": \"revenue\", \"detail\": \"회사는 2026년 2분기 실적 발표에서 zepbound 처방의 45%, 신규 처방의 55%가 보험을 거치지 않는 현금 결제였다고 밝혔다. 같은 발표에서 foundayo 매출은 9,800만 달러로 집계됐다.\", \"when\": \"2026-08\", \"source\": \"eli lilly 2026년 2분기 실적 발표 통화록\"}, {\"type\": \"revenue\", \"detail\": \"회사는 2026년 1분기 실적 발표에서 먹는 비만 치료제 foundayo의 초기 처방 가운데 약 45%가 lillydirect를 거쳐 나왔다고 밝혔다.\", \"when\": \"2026-04\", \"source\": \"yahoo finance가 전한 eli lilly 1분기 실적 발표 내용\"}, {\"type\": \"customers\", \"detail\": \"미국 상원 조사에 따르면 2024년 7월부터 12월까지 lillydirect를 거쳐 실제로 온라인 진료를 받은 환자는 4,394명이었다. 제휴사별로는 form health 3,759명, 9amhealth 620명, cove 15명이었다.\", \"when\": \"2025-07\", \"source\": \"미국 상원 dtc investigation 2025 보고서를 전한 wfyi 보도\"}, {\"type\": \"regulatory\", \"detail\": \"2025년 11월 미국 정부와 맺은 최혜국 대우 방식 약값 합의에 따라, 정부가 연 직접 판매 사이트 trumprx에 zepbound가 월 299달러부터로 올라가 있다. 같은 페이지는 원래 값을 1,087달러로 적어 최대 72% 할인이라고 표시한다.\", \"when\": \"2025-11\", \"source\": \"trumprx zepbound 판매 페이지\"}, {\"type\": \"regulatory\", \"detail\": \"medicare 가입자가 비만 치료제를 월 50달러에 받는 medicare glp-1 bridge 프로그램이 2026년 7월 1일 시작됐고, lillydirect가 이 프로그램의 조제를 처리한다. 회사는 대상 인원을 2,000만 명으로 밝혔다.\", \"when\": \"2026-07\", \"source\": \"eli lilly 2026년 2분기 실적 발표 통화록\"}, {\"type\": \"partnership\", \"detail\": \"2026년 3월 5일 lilly는 고용주를 상대로 하는 별도 플랫폼 lilly employer connect를 열었다. 프로그램 관리 회사 15곳 이상이 참여하며 zepbound kwikpen을 모든 용량에서 449달러에 공급한다. 참여 명단에 9amhealth, form health, goodrx, sesame, teladoc health, transcarent, mark cuban cost plus drug company가 들어 있다.\", \"when\": \"2026-03\", \"source\": \"eli lilly 보도자료\"}, {\"type\": \"partnership\", \"detail\": \"2026년 9월 기준 온라인 진료 제휴사는 general medicine, counsel health, sesame, weightwatchers, knownwell, healthtap, neura health, ognomy 여덟 곳이다. 2025년 상원 보고서에 등장한 form health, 9amhealth, cove는 현재 목록에 없다.\", \"when\": \"2026-09\", \"source\": \"lillydirect 첫 화면에서 직접 확인\"}, {\"type\": \"traffic\", \"detail\": \"동반 앱 lilly health가 미국 애플 앱스토어에서 별점 4.7에 평가 3,878건, 구글 플레이에서 별점 4.4에 후기 817건과 내려받기 10만 회 이상을 기록하고 있다. 앱은 2025년 6월에 처음 나왔다.\", \"when\": \"2026-09\", \"source\": \"애플 itunes 조회 api와 구글 플레이 페이지\"}], \"caveats\": \"가장 크게 짚어야 할 것은 2025년 7월에 나온 미국 상원 보고서다. richard durbin, bernie sanders, elizabeth warren, peter welch 네 상원의원이 9개월간 조사해 lillydirect와 pfizer의 pfizerforall을 함께 다뤘다. 보고서는 lillydirect를 거쳐 온라인 진료를 받은 환자의 약 74%가 처방을 받았고, 편두통 제휴사 cove에서는 100%가 처방을 받았다고 밝혔다. 9amhealth 이용자는 lilly 약을 처방받을 확률이 여섯 배 높았고, form health가 낸 처방의 66%가 lilly 약이었다. 보고서는 또 lilly가 제휴사에서 환자 한 명당 21개에서 28개의 정보 항목을 받아 보고, 제휴사에 3년 계약으로 942,500달러를 지급했으며, form health 소속 의사 두 명에게 41건의 개별 지급이 있었다고 적었다. lilly는 보고서가 회사의 의도를 잘못 해석했으며 제휴 업체는 독립적으로 운영되고 처방에 대한 대가를 주지 않는다고 반박했다. 판단이 내려진 사안은 아니다.\\n\\n같은 보고서가 밝힌 이용 규모도 함께 봐야 한다. 2024년 7월부터 12월까지 lillydirect를 거쳐 온라인 진료를 받은 환자는 모두 4,394명이었다. 언론이 다루는 크기에 비하면 매우 작은 수이고, 이것이 제삼자가 회사에서 자료를 받아 확인한 유일한 이용 규모 수치다. 회사가 내는 45%나 55% 같은 비중 수치는 실적 발표에서 나온 것이며 외부 검증을 거치지 않았다.\\n\\n그 비중 수치 자체도 조심해서 읽어야 한다. 2026년 2분기 발표 자료는 zepbound 현금 결제 비중을 전체 처방의 45%, 신규 처방의 55%로 적었는데, 같은 통화의 질의응답에서 임원은 전체의 약 55%라고 말했다. 한 번의 발표 안에서도 숫자가 어긋난다. 더 중요한 것은 현금 결제가 곧 lillydirect는 아니라는 점이다. zepbound는 일반 소매 약국에서도 현금으로 살 수 있고, 바이알 형태만 lillydirect 전용이다. 따라서 현금 결제 비중은 이 통로의 규모를 웃도는 수치다.\\n\\n값도 조건부다. zepbound 7.5mg 이상과 foundayo 14.5mg 이상에 붙은 값은 45일 안에 다음 처방을 채운다는 조건에서만 유지되며, 조건을 놓치면 zepbound는 최대 699달러로 돌아간다. foundayo의 2.5mg과 5.5mg 값은 2026년 12월 31일까지만 적용되는 한시 인하다. 진료비는 약값과 별개이고, 회사는 약관에서 이 값과 조건을 사전 통지 없이 언제든 바꾸거나 없앨 수 있다고 명시한다.\\n\\n마지막으로 값이 내려온 배경이 시장 경쟁만은 아니다. 2025년 11월 미국 정부와 lilly, novo nordisk 사이에 맺어진 최혜국 대우 약값 합의가 현재의 299달러 시작 값과 직접 연결돼 있고, 정부가 운영하는 trumprx 사이트가 같은 값을 걸고 있다. 정치적 합의에 기대어 있는 값이라는 뜻이며, 합의 조건이 바뀌면 값도 따라 움직일 수 있다.\", \"for_us\": \"우리 목적에 비추어 볼 때 이 회사에서 가져갈 것은 약을 파는 방식이 아니라 그 옆에 붙은 앱이다. lilly health는 약을 산 사람에게 무료로 주는 동반 앱인데, 담긴 기능이 복약과 활동 기록, 투약 알림, 추세 그래프, 스마트 기기 연동, 글과 조리법과 운동 영상 모음이다. 처방이나 배송처럼 면허와 규제가 걸린 부분은 전부 약국과 의사 쪽에 두고, 앱은 규제가 걸리지 않는 기록과 알림과 교육만 맡았다. 3개월 동안 소프트웨어 인력만으로 만들 수 있는 범위가 정확히 이 선이다. 미국 애플 앱스토어에서 별점 4.7에 평가 3,878건이 쌓였다는 사실은 이 정도 구성으로도 사람들이 계속 쓴다는 뜻이다.\\n\\n두 번째로 볼 것은 값을 먼저 보여 주는 화면 구성이다. lillydirect는 진료를 예약하기 전에 제휴사별 진료비를 한 화면에 나란히 놓고, 보험을 쓸 때와 현금으로 낼 때를 나눠 적으며, 첫 진료까지 걸리는 평균 시간까지 표시한다. 미국 소비자가 건강 서비스에서 가장 먼저 알고 싶어 하는 것이 얼마인지와 언제 만나는지라는 점을 화면 구성이 그대로 드러낸다. 우리가 미국에서 무엇을 붙이든 이 두 가지를 앞에 놓는 편이 낫다.\\n\\n세 번째는 조심해야 할 선이다. 상원 보고서가 문제 삼은 대목은 정보를 주는 행위가 아니라, 이용자를 특정 처방으로 이어지는 경로로 보내고 그 대가가 오간 구조였다. 우리 앱이 미국에서 약이나 진료를 소개하는 자리를 만들게 된다면, 소개의 대가를 받는 순간 성격이 달라진다는 점을 먼저 정리해 두어야 한다.\", \"screenshots\": [{\"file\": \"lillydirect_home.png\", \"caption\": \"첫 화면이다. 약을 찾고, 의사를 찾고, 처방 지원을 받는 세 갈래로 나뉘어 있다.\", \"from\": \"https://lillydirect.lilly.com/\"}, {\"file\": \"lillydirect_zepbound_price.png\", \"caption\": \"비만 주사제 zepbound의 현금 결제 값이다. 시작 용량 월 299달러, 5mg 월 399달러이고 7.5mg 이상은 45일 안에 재조제하는 조건으로 월 449달러다. 아래 작은 글씨에 조건을 놓쳤을 때 적용되는 499달러와 699달러가 적혀 있다.\", \"from\": \"https://www.lilly.com/lillydirect/zepbound\"}, {\"file\": \"lillydirect_foundayo_price.png\", \"caption\": \"먹는 비만 치료제 foundayo의 현금 결제 값이다. 0.8mg과 2.5mg이 월 149달러, 5.5mg이 199달러, 9mg 이상이 299달러다.\", \"from\": \"https://www.lilly.com/lillydirect/foundayo\"}, {\"file\": \"lillydirect_ios.png\", \"caption\": \"미국 애플 앱스토어의 lilly health 페이지다. lillydirect 자체 앱은 없고 이 무료 동반 앱이 대신 놓여 있다. 별점 4.7에 평가 3,878건이다.\", \"from\": \"https://apps.apple.com/us/app/lilly-health/id6744534749\"}], \"sources\": [{\"title\": \"lillydirect 첫 화면\", \"url\": \"https://lillydirect.lilly.com/\", \"note\": \"판매 중인 약 10종, 세 단계로 나뉜 이용 흐름, 온라인 진료 제휴사 여덟 곳과 각 진료비, 첫 진료까지 걸리는 평균 시간을 직접 확인했다.\"}, {\"title\": \"lillydirect zepbound 제품 페이지\", \"url\": \"https://www.lilly.com/lillydirect/zepbound\", \"note\": \"용량별 현금 결제 값, 45일 재조제 조건과 조건을 놓쳤을 때의 값, 보험 가입자용 월 25달러 안내, lillydirect 약국의 식별 번호와 주소를 확인했다.\"}, {\"title\": \"lillydirect foundayo 제품 페이지\", \"url\": \"https://www.lilly.com/lillydirect/foundayo\", \"note\": \"먹는 약 foundayo의 용량별 현금 결제 값과 2026년 12월 31일까지인 한시 인하 조건을 확인했다.\"}, {\"title\": \"lilly 공식 값 안내 사이트의 zepbound 항목\", \"url\": \"https://pricinginfo.lilly.com/zepbound\", \"note\": \"zepbound 정가가 1회 조제당 499달러에서 1,086.37달러라는 것과, 환자 직접 판매 값이 용량별로 299달러부터 699달러라는 것을 확인했다.\"}, {\"title\": \"lilly 보도자료, lillydirect 출시\", \"url\": \"https://investor.lilly.com/news-releases/news-release-details/lilly-launches-end-end-digital-healthcare-experience-through\", \"note\": \"2024년 1월 4일 출시 사실, 처음 다룬 질환이 비만과 편두통과 당뇨였다는 점, 자체 약국과 무료 배송 구조, david a. ricks와 frank cunningham의 직함을 확인했다.\"}, {\"title\": \"lilly 보도자료, lilly employer connect 출시\", \"url\": \"https://investor.lilly.com/news-releases/news-release-details/lilly-employer-connect-platform-launches-over-fifteen\", \"note\": \"2026년 3월 5일 고용주 대상 플랫폼 출시, 모든 용량 449달러 공급가, 참여 관리 회사 명단, 민간 보험 가입 직장인 절반가량이 비만 치료제를 보장받지 못한다는 회사 주장, ilya yuffa와 kevin hern의 직함을 확인했다.\"}, {\"title\": \"senators raise questions about deals between telehealth and drug companies (wfyi)\", \"url\": \"https://www.wfyi.org/health/2025-07-31/senators-raise-questions-about-deals-between-telehealth-and-drug-companies\", \"note\": \"2024년 7월부터 12월까지 lillydirect를 거친 온라인 진료 환자 4,394명과 제휴사별 내역, 처방률 74%, cove 100%, 제휴사 지급액 942,500달러, lilly의 반박 입장을 확인했다.\"}, {\"title\": \"senate report raises concerns over pharma-telehealth partnerships (the medicine maker)\", \"url\": \"https://themedicinemaker.com/issues/2025/articles/july/senate-report-raises-concerns-over-pharma-telehealth-partnerships/\", \"note\": \"상원 보고서의 세부 지적을 확인했다. 환자당 21개에서 28개 정보 항목 전달, 의사 검색 기능이 금전 관계가 있는 의사를 앞세운다는 지적, 의료 리베이트 금지법(anti-kickback statute) 관련 문제 제기가 여기에 나온다.\"}, {\"title\": \"eli lilly 2026년 2분기 실적 발표 통화록\", \"url\": \"https://www.fool.com/earnings/call-transcripts/2026/08/12/eli-lilly-lly-q2-2026-earnings-call-transcript/\", \"note\": \"zepbound 현금 결제 비중 45%와 55%, foundayo 매출 9,800만 달러, 2026년 7월 1일 시작한 medicare glp-1 bridge와 월 50달러 부담, 미국 밖에서도 lillydirect 형태를 열고 있다는 발언을 확인했다.\"}, {\"title\": \"lilly's oral glp-1 pill 관련 yahoo finance 보도\", \"url\": \"https://finance.yahoo.com/sectors/healthcare/articles/lillys-oral-glp-1-pill-171000441.html\", \"note\": \"foundayo 초기 처방의 약 45%가 lillydirect를 거쳤다는 회사 발표를 확인했다.\"}, {\"title\": \"trumprx의 zepbound 판매 페이지\", \"url\": \"https://trumprx.gov/p/zepbound\", \"note\": \"정부 사이트에 올라간 zepbound 값이 299달러부터이고 원래 값을 1,087달러로 표시해 최대 72% 할인이라고 적혀 있음을 확인했다.\"}, {\"title\": \"novocare wegovy 값 안내 페이지\", \"url\": \"https://www.novocare.com/obesity/products/wegovy/savings-offer.html\", \"note\": \"경쟁사 novo nordisk의 현금 결제 값이 주사제 월 349달러, 먹는 형태 149달러에서 299달러라는 것을 확인해 비교 근거로 삼았다.\"}, {\"title\": \"애플 앱스토어 lilly health 페이지\", \"url\": \"https://apps.apple.com/us/app/lilly-health/id6744534749\", \"note\": \"lillydirect 이름의 앱은 없다는 점, lilly health의 기능 구성, 별점 4.7과 평가 3,878건, 2025년 6월 첫 출시를 확인했다.\"}, {\"title\": \"구글 플레이 lilly health 페이지\", \"url\": \"https://play.google.com/store/apps/details?id=com.lilly.android.lillyhealth\", \"note\": \"별점 4.4, 후기 817건, 내려받기 10만 회 이상을 확인했다.\"}]}"},{"slug":"lotus-health-ai","name":"Lotus Health AI","one_liner":"캘리포니아에 있는 사람에게 24시간 인공지능 건강 상담과 면허 의사의 처방을 값 없이 열어 주고, 환자도 보험사도 아닌 앱 안 스폰서에게서 돈을 받겠다고 공언한 소비자용 1차 진료 앱이다.","sells_to":"consumer","seen_in":[{"issue":"12","section":2,"headline":"AI로 주치의를 다시 발명한다는 단상에서 새 세대 주자로 등장했다. Kleiner Perkins와 CRV에서 3,600만 달러를 받고 모두에게 무료 프라이머리 케어를 열겠다고 했지만, 필자가 수요일 밤 가입해 보니 AI 뒤의 인간 의사들이 정원 초과라 대기자 명단에 올랐고 일요일까지 그대로였다."}],"card":{"problem":"미국에서 주치의는 보험이 정해 둔 관문인데, 그 관문에 들어가는 일 자체가 막혀 있다. 회사가 인용한 2025년 조사에서 대도시 15곳의 신규 환자 초진 예약 대기는 평균 31일이었고, 같은 회차 뉴스레터가 전한 보스턴 환자는 진료소 열 곳에 전화해도 가장 빠른 예약이 1.5년에서 2년 뒤였다.","solution":"신분증과 얼굴을 대조해 본인을 확인한 뒤 병원 기록과 웨어러블 데이터를 앱 한 곳에 모으고, 그 자료를 배경으로 24시간 인공지능과 대화하게 한다. 처방이나 검사가 필요해지면 Cortex라는 의사용 인공지능이 처방과 검사 지시 초안을 미리 만들어 두고 면허 의사가 승인하거나 반려한다.","price":"소비자 부담 없음. 다만 회사는 현재 단계에서 승인된 사용자에게 무료라고 단서를 달고, 앞으로 앱 안 스폰서 콘텐츠로 돈을 벌겠다고 밝혔다.","tags":["1차 진료","AI 상담","무료","스폰서 수익","캘리포니아 한정"],"headline_traction":"2026년 2월 Kleiner Perkins와 CRV가 공동 주도한 3,500만 달러 시리즈 A를 발표했고, 앞선 시드를 합쳐 누적 조달액이 4,100만 달러라고 밝혔다.","watch":"무료는 현재 단계에만 걸린 조건이고 예정된 수익원은 앱 안 스폰서 콘텐츠다. 진료는 캘리포니아에 있는 사람에게만 제공하며, 의사 정원이 차면 대기자 명단에 올려 두는 구조가 뉴스레터 시점 이후에도 이어졌다. 임상의 승인률 98%는 회사가 직접 낸 내부 분석이고 보류 30.5%를 분모에서 뺀 수치다."},"screenshots":[{"file":"lotus-health-ai_home.png","caption":"첫 화면. 무한한 케어를 받으라는 문장과 24시간 열려 있는 전담 의사라는 설명 아래 iOS 내려받기 버튼이 있고, 그 밑에 의사 지원 버튼이 나란히 놓여 있다.","from":"https://lotus.ai/"},{"file":"lotus-health-ai_faq.png","caption":"내려받기 안내 페이지의 문답 목록. 무엇이 무료인지, 의사가 어떻게 관여하는지, 어느 지역에서 쓸 수 있는지를 묻는 항목이 이어진다.","from":"https://lotus.ai/download"},{"file":"lotus-health-ai_cortex.png","caption":"의사를 모으는 Cortex 페이지. 행정 업무를 덜어 주고 의사가 결정권을 쥔 채 더 빠르게 진료하게 해 준다는 설명으로 의사 지원을 받는다.","from":"https://lotus.ai/cortex"}],"q":"{\"slug\": \"lotus-health-ai\", \"name\": \"lotus health ai\", \"one_liner\": \"캘리포니아에 있는 사람에게 24시간 인공지능 건강 상담과 면허 의사의 처방을 값 없이 열어 주고, 환자도 보험사도 아닌 앱 안 스폰서에게서 돈을 받겠다고 공언한 소비자용 1차 진료 앱이다.\", \"site\": \"https://lotus.ai\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"12\", \"section\": 2, \"headline\": \"ai로 주치의를 다시 발명한다는 단상에서 새 세대 주자로 등장했다. kleiner perkins와 crv에서 3,600만 달러를 받고 모두에게 무료 프라이머리 케어를 열겠다고 했지만, 필자가 수요일 밤 가입해 보니 ai 뒤의 인간 의사들이 정원 초과라 대기자 명단에 올랐고 일요일까지 그대로였다.\"}], \"card\": {\"problem\": \"미국에서 주치의는 보험이 정해 둔 관문인데, 그 관문에 들어가는 일 자체가 막혀 있다. 회사가 인용한 2025년 조사에서 대도시 15곳의 신규 환자 초진 예약 대기는 평균 31일이었고, 같은 회차 뉴스레터가 전한 보스턴 환자는 진료소 열 곳에 전화해도 가장 빠른 예약이 1.5년에서 2년 뒤였다.\", \"solution\": \"신분증과 얼굴을 대조해 본인을 확인한 뒤 병원 기록과 웨어러블 데이터를 앱 한 곳에 모으고, 그 자료를 배경으로 24시간 인공지능과 대화하게 한다. 처방이나 검사가 필요해지면 cortex라는 의사용 인공지능이 처방과 검사 지시 초안을 미리 만들어 두고 면허 의사가 승인하거나 반려한다.\", \"price\": \"소비자 부담 없음. 다만 회사는 현재 단계에서 승인된 사용자에게 무료라고 단서를 달고, 앞으로 앱 안 스폰서 콘텐츠로 돈을 벌겠다고 밝혔다.\", \"tags\": [\"1차 진료\", \"ai 상담\", \"무료\", \"스폰서 수익\", \"캘리포니아 한정\"], \"headline_traction\": \"2026년 2월 kleiner perkins와 crv가 공동 주도한 3,500만 달러 시리즈 a를 발표했고, 앞선 시드를 합쳐 누적 조달액이 4,100만 달러라고 밝혔다.\", \"watch\": \"무료는 현재 단계에만 걸린 조건이고 예정된 수익원은 앱 안 스폰서 콘텐츠다. 진료는 캘리포니아에 있는 사람에게만 제공하며, 의사 정원이 차면 대기자 명단에 올려 두는 구조가 뉴스레터 시점 이후에도 이어졌다. 임상의 승인률 98%는 회사가 직접 낸 내부 분석이고 보류 30.5%를 분모에서 뺀 수치다.\"}, \"problem\": \"미국에서 프라이머리 케어(주치의 진료)는 보험이 정해 둔 관문이어서, 이 자리가 막히면 전문의로 가는 길까지 함께 막힌다. 그런데 관문을 통과하는 일 자체가 어렵다. 이 회차 뉴스레터가 전한 보스턴 사례에서는 주치의가 세상을 떠나 혈압약 처방을 이어 갈 새 의사가 필요해진 환자가 진료소 열 곳에 전화했지만 가장 빠른 예약이 1.5년에서 2년 뒤였다. 회사가 자사 연구 글에서 인용한 2025년 amn healthcare 조사에서도 미국 대도시 15곳의 신규 환자 초진 예약 대기가 평균 31일로 2022년의 26일, 2004년의 21일보다 길어졌고, 가정의학과만 따로 보면 평균 23.5일이었다. 여기에 진료 기록이 다니던 병원마다 따로 흩어져 있어서 환자 본인도 자기 병력을 한자리에서 보지 못한다. 한국은 동네 의원이든 대학병원이든 원하는 곳에 바로 갈 수 있어 이 관문도, 이만한 대기도 없다.\", \"solution\": \"ios 앱 하나로만 쓰고 안드로이드 앱은 없다. 가입은 문자로 온 일회용 번호를 넣는 것으로 시작해서, persona라는 신원 확인 업체를 거쳐 정부 발급 신분증과 실시간 얼굴을 대조하는 단계로 이어진다. 그다음 진료 동의 화면을 지나면 병원 진료 기록과 apple health, 웨어러블 데이터가 자동으로 모이기 시작하고, 옛 기록까지 찾기 위해 과거 주소와 이메일, 전화번호를 더 물어보기도 한다. 이렇게 모인 자료를 배경으로 사용자는 24시간 인공지능과 대화하며 증상을 설명하거나 질문하는데, 50개가 넘는 언어와 음성 입력을 지원한다. 처방이나 검사처럼 의사가 필요한 요청이 나오면 같은 시각에 마주 앉지 않는 비동기 진료로 넘어간다. 이때 cortex라는 의사용 인공지능이 환자 차트와 대화 내용을 정리해 후속 메시지, 검사 지시, 처방 초안을 미리 만들어 두고, 면허 의사가 그것을 승인하거나 고치거나 반려한다. 회사가 낸 내부 분석에서 승인된 조치가 최종 승인에 이르기까지 걸린 시간은 중앙값 7.6시간이었다. 처방은 사용자가 고른 약국으로 보내 주지만 마약류는 처방하지 않는다. 사용자가 내는 값은 없고, 회사는 현재 단계에서 승인된 사용자에게 무료로 제공한다고 적는다.\", \"features\": [{\"name\": \"흩어진 진료 기록 자동 수집\", \"detail\": \"여러 병원과 의원에 직접 연결해 진료 기록을 가져오므로 사용자가 서류를 일일이 올리지 않아도 된다. 검사 결과, 복용 약, 예방접종, 진단명, 시술 이력을 한 화면에서 보게 한다.\"}, {\"name\": \"24시간 인공지능 상담\", \"detail\": \"약속을 잡지 않고 언제든 말을 걸면 답이 온다. 50개가 넘는 언어와 음성 입력을 지원하고, 답에는 근거로 삼은 자료의 출처를 함께 붙인다고 회사가 밝힌다.\"}, {\"name\": \"cortex, 의사가 쓰는 인공지능\", \"detail\": \"환자를 상대하는 인공지능과 별도로, 의사 쪽에서 돌아가는 인공지능이 있다. 차트와 대화 기록을 종합해 후속 메시지, 검사 지시, 처방을 초안 상태로 만들어 놓으면 의사는 읽고 판단만 한다. 회사는 이것을 의사를 대체하는 것이 아니라 판단할 거리를 미리 준비해 두는 방식이라고 설명한다.\"}, {\"name\": \"처방 전송\", \"detail\": \"흔한 질환은 사용자가 고른 약국으로 처방을 보내 준다. 마약류는 처방하지 않고, 모든 처방은 면허 임상의가 검토하고 승인한 뒤에만 나간다.\"}, {\"name\": \"검사 지시\", \"detail\": \"앱 설명에 따르면 전국 6,000곳이 넘는 검사소에서 받을 수 있는 검사를 지시한다. 2026년 2월 투자 발표 시점에는 준비 중이라고 했으나 5월 연구 글에서는 이미 의사가 승인하는 조치 세 갈래 가운데 하나로 집계됐다.\"}, {\"name\": \"웨어러블과 보험 정보 연결\", \"detail\": \"fitbit, garmin, oura, peloton, dexcom, abbott libreview, withings, polar, strava, wahoo 등을 연결한다. 보험 혜택 정보도 함께 모아 무엇을 보장받는지 안내한다고 밝힌다.\"}, {\"name\": \"신원 확인과 위치 확인이라는 두 관문\", \"detail\": \"가입할 때 정부 발급 신분증과 얼굴을 실시간으로 대조한다. 또 기기 위치로 사용자가 캘리포니아에 있는지 확인한 뒤에야 임상의에게 연결한다. 소속 임상의가 면허를 가진 주가 캘리포니아뿐이기 때문이다.\"}, {\"name\": \"의사 모집 창구\", \"detail\": \"사이트 첫 화면에 앱 내려받기 버튼과 나란히 의사 지원 버튼을 둔다. 행정 업무를 덜어 준다는 점을 내세워 의사를 직접 모으며, 공개된 소속 의사 11명은 ucsf, sutter health, cpmc, ucla health, johns hopkins 계열에서 왔다.\"}], \"differentiator\": \"값을 받는 상대가 다르다. 같은 데이터셋에 있는 doctronic은 인공지능 상담을 무료로 주고 처방이 필요한 순간의 화상 진료 1회에 39달러를 받으며, hims & hers와 zealthy는 매달 회원비를 청구한다. lotus는 환자에게도 보험사에게도 받지 않고 앱 안 스폰서 콘텐츠에서 돈을 벌겠다고 투자 발표문에 직접 적었다. crv의 saar gur는 헬스케어 스타트업이 병원이나 보험사, 제약사 가운데 가장 많이 내는 쪽에 맞춰 만들거나 환자에게 비용을 떠넘기다가 신뢰를 잃는다면서, 그 둘을 다 피하는 것이 이 회사의 열쇠라고 말한다. 진료 방식도 다르다. 같은 회차에 나온 k health는 mass general brigham 같은 병원에 인공지능 가상 진료를 파는 쪽이고, 파산한 carbon health는 오프라인 클리닉을 사들이는 쪽이었는데, lotus는 오프라인 진료 없이 비동기로만 굴리며 인공지능이 의사의 결정을 미리 준비해 두는 구조를 택했다. 다만 인공지능 상담에 면허 의사를 붙여 처방까지 내주는 형태 자체는 doctronic을 비롯해 이미 여럿이 하고 있어서, 거기까지는 다르지 않다.\", \"team\": [{\"name\": \"kj dhaliwal\", \"role\": \"공동창업자 겸 ceo\", \"background\": \"이민자인 부모의 진료를 통역하며 자랐고 본인의 건강 문제를 겪으며 미국 의료의 문제를 봤다고 회사 소개에 적혀 있다. 회사는 그가 전에 수백만 명이 쓴 소비자 제품을 만들었고 그 회사가 인수됐다고만 밝히고 제품 이름은 대지 않는다.\"}, {\"name\": \"zekka nelson\", \"role\": \"공동창업자 겸 cto\", \"background\": \"회사 사이트가 이름과 직함만 싣고 경력을 밝히지 않아 확인하지 못했다.\"}, {\"name\": \"aidan cole\", \"role\": \"창업 멤버 겸 최고성장책임자\", \"background\": \"underlining과 dil mil을 거쳤다고 회사가 소개한다.\"}, {\"name\": \"nicholas stark, md\", \"role\": \"임상 전략 부사장\", \"background\": \"georgetown에서 의학을 공부했고 ucsf에서 응급의학을 했다. 현재도 ucsf health 소속으로 소개된다.\"}, {\"name\": \"aravind mani, md\", \"role\": \"의료 담당 부사장\", \"background\": \"stanford에서 의학을 공부했고 ucla에서 내과를 했다. ucla health 소속으로 소개된다.\"}, {\"name\": \"varinderjit kaur, md\", \"role\": \"임상 운영 총괄\", \"background\": \"usf morsani에서 내과를 했고 ucsf health hyde 소속으로 소개된다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"kleiner perkins와 crv가 공동 주도한 3,500만 달러 시리즈 a를 발표했다. crv의 제너럴파트너 saar gur가 이사회에 합류했고, 앞서 kleiner perkins가 주도한 시드를 합쳐 누적 조달액은 4,100만 달러다.\", \"when\": \"2026-02\", \"source\": \"회사 뉴스룸 lotus.ai/news/lotus-raised-41m\"}, {\"type\": \"funding\", \"detail\": \"개인 투자자로 joe montana의 liquid 2, 아디다스 패밀리오피스의 leadvc와 함께 aneesh chopra(미국 초대 cto), vivek garipalli(clover health), julia cheek(everlywell), adrian aoun(forward), harpreet rai(oura 전 ceo), travis may(datavant), ian shakil(augmedix) 등이 참여했다.\", \"when\": \"2026-02\", \"source\": \"회사 뉴스룸 lotus.ai/news/lotus-raised-41m\"}, {\"type\": \"customers\", \"detail\": \"회사 연구 글에 따르면 환자 244명에게 1,678건의 조치를 제안했다. 조치가 많았던 환자들은 캘리포니아 74개 도시에 흩어져 있었고 나이는 20세부터 82세까지였으며, 환자당 제안 건수는 중앙값 5건이었다.\", \"when\": \"2026-05\", \"source\": \"회사 연구 글 lotus.ai/news/evaluating-clinician-agreement...\"}, {\"type\": \"traffic\", \"detail\": \"미국 앱스토어에서 평점 4.4점에 평가 184건이다. 앱은 2025년 5월 14일에 처음 올라왔고, 2026년 2월 투자 발표보다 아홉 달 앞선다.\", \"when\": \"2026-09\", \"source\": \"애플 앱스토어 조회 api\"}], \"caveats\": \"먼저 금액이 어긋난다. 뉴스레터는 3,600만 달러라고 적었으나 회사 발표문은 시리즈 a가 3,500만 달러이고 시드를 합친 누적이 4,100만 달러라고 밝힌다. 성과 수치는 대부분 회사가 스스로 낸 것이다. 임상의가 인공지능 제안의 98%를 승인했다는 문장은 최종 판정이 난 건만 분모로 삼은 값이고, 제안 1,678건 전체로 보면 승인 66.7%, 반려 2.8%, 보류 30.5%다. 처방만 떼어 보면 반려율이 10.2%로 가장 높다. 이 분석은 회사 연구진이 자사 서비스를 대상으로 직접 수행했고 동료 심사를 거친 논문이 아니다. 규모도 짚어야 한다. 환자 244명, 캘리포니아 74개 도시라는 숫자는 앱 설명에 적힌 전국 6,000곳 검사소라는 문구와 크기가 맞지 않고, 실제 진료는 캘리포니아에 있는 사람에게만 제공한다. 무료라는 말에도 단서가 붙는다. 회사 문답은 현재 단계에서 승인된 사용자에게 무료라고 적고, 앞으로 여러 사업 모델을 시험하겠다면서 건강 목표를 돕는 스폰서 콘텐츠에서 나오는 수익을 든다. 개인정보 문서는 두 갈래로 갈라져 있다. 일반 개인정보 고지는 타깃 광고 목적의 이용과 광고 네트워크 등 사업 파트너와의 공유를 명시하지만, 그 고지는 hipaa가 규율하는 진료 정보에는 적용되지 않는다고 스스로 밝힌다. 진료 정보는 별도의 개인정보 취급 고지가 맡는데, 그 문서는 치료나 제품을 권하는 연락의 대가로 다른 조직에게서 돈을 받으려면 환자의 서면 동의를 먼저 받아야 한다고 적는다. 스폰서 수익 모델이 이 두 문서 사이를 어떻게 지나갈지는 아직 공개되지 않았다. 대기자 명단 문제도 그대로다. 필자가 2026년 2월 가입에 실패한 뒤로도 앱스토어 후기에는 일주일 넘게 대기자 명단에 있다는 글이 올라온다. 평점은 4.4점이지만 최근 후기 49건 가운데 13건이 1점으로 평가가 양극단에 몰려 있고, 문자 인증이 오지 않아 가입 자체를 못 했다는 글, 급한 처방 요청에 12일 동안 답이 없었다는 글, 과거 병력을 현재 병처럼 취급해 알림을 쏟아낸다는 글, 수익 모델이 데이터 활용과 앱 내 광고라는 점을 알고 실망했다는 글이 함께 있다. 인공지능이 임상 추론에서 사람 의사와 맞먹거나 앞선다는 고객센터 문구에는 근거 자료가 붙어 있지 않다. 안드로이드 앱은 없다.\", \"for_us\": \"세 가지가 우리 작업에 직접 걸린다. 첫째, 사용자에게 값을 받지 않고 제삼자에게서 돈을 받는 구조를 의료 서비스에서 공개적으로 내건 사례다. 우리 앱의 광고와 리워드 구조와 같은 자리인데, 그 모델을 알게 된 사용자가 앱스토어 후기에 곧바로 실망을 적어 둔 것도 함께 봐야 한다. 무료가 왜 가능한지 먼저 설명하지 않으면 공짜 자체가 의심의 근거가 된다. 둘째, 3개월 동안 소프트웨어 인력만으로 만들 수 있는 부분과 그렇지 않은 부분이 이 회사 안에서 선명하게 갈린다. 흩어진 진료 기록과 웨어러블 데이터를 한자리에 모으고 그것을 읽어 주는 일은 소프트웨어의 몫이고, 이 회사가 내세우는 사용자 후기에서도 아무도 말해 주지 않은 진단을 기록에서 찾아냈다는 대목이 가치의 중심이다. 반면 처방과 검사는 면허 의사가 필요하고, 그 순간 주 면허와 정원이 한계가 되어 대기자 명단이 생긴다. 우리가 붙일 기능은 이 축을 피해야 한다. 셋째, 실패한 세부가 그대로 교훈이 된다. 신분증과 얼굴 대조, 문자 인증처럼 가입 앞단에 관문을 쌓으면 후기에 보이듯 가입 자체가 무너진다. 과거 병력을 현재 상태로 취급해 알림을 반복하면 도움이 아니라 불만이 된다. 건강 알림을 설계할 때 무엇이 지금의 상태이고 무엇이 지나간 일인지 구분하는 일이 먼저다.\", \"screenshots\": [{\"file\": \"lotus-health-ai_home.png\", \"caption\": \"첫 화면. 무한한 케어를 받으라는 문장과 24시간 열려 있는 전담 의사라는 설명 아래 ios 내려받기 버튼이 있고, 그 밑에 의사 지원 버튼이 나란히 놓여 있다.\", \"from\": \"https://lotus.ai/\"}, {\"file\": \"lotus-health-ai_faq.png\", \"caption\": \"내려받기 안내 페이지의 문답 목록. 무엇이 무료인지, 의사가 어떻게 관여하는지, 어느 지역에서 쓸 수 있는지를 묻는 항목이 이어진다.\", \"from\": \"https://lotus.ai/download\"}, {\"file\": \"lotus-health-ai_cortex.png\", \"caption\": \"의사를 모으는 cortex 페이지. 행정 업무를 덜어 주고 의사가 결정권을 쥔 채 더 빠르게 진료하게 해 준다는 설명으로 의사 지원을 받는다.\", \"from\": \"https://lotus.ai/cortex\"}, {\"file\": \"lotus-health-ai_ios.png\", \"caption\": \"미국 앱스토어 페이지. 값은 무료이고 평점 4.4점에 평가 184건이며, 처방 전송과 전국 검사소 검사 지시를 앞세워 설명한다.\", \"from\": \"https://apps.apple.com/us/app/lotus-health-ai/id6736791154\"}], \"sources\": [{\"title\": \"lotus ai 공식 홈페이지\", \"url\": \"https://lotus.ai/\", \"note\": \"제품 소개 문구와 ios 전용 배포, 의사 모집 동선을 확인했다. lotushealth.ai 주소는 이곳으로 넘어온다.\"}, {\"title\": \"lotus raised $41m (회사 발표문)\", \"url\": \"https://lotus.ai/news/lotus-raised-41m\", \"note\": \"3,500만 달러 시리즈 a와 누적 4,100만 달러, 투자자 명단, 이사회 합류, 그리고 앱 안 스폰서 수익으로 벌겠다는 사업 모델을 확인했다.\"}, {\"title\": \"physician agreement with ai-suggested care actions in asynchronous primary care (회사 연구 글)\", \"url\": \"https://lotus.ai/news/evaluating-clinician-agreement-with-ai-proposed-care-actions-in-asynchronous-primary-care\", \"note\": \"환자 244명, 제안 1,678건, 승인 66.7%와 보류 30.5%, 최종 판정 기준 98%, 처방 반려율 10.2%, 중앙값 7.6시간, 캘리포니아 74개 도시를 확인했다.\"}, {\"title\": \"내려받기 안내와 문답\", \"url\": \"https://lotus.ai/download\", \"note\": \"무료인 이유와 예정 수익원, 캘리포니아 한정 제공과 위치 확인, 마약류 미처방, 의사의 처방 검토를 확인했다.\"}, {\"title\": \"lotus ai 기계 판독용 요약 문서\", \"url\": \"https://lotus.ai/.well-known/facts.json\", \"note\": \"회사가 스스로 정리한 기능 목록, 지원 웨어러블, 차별점 주장, 현재 단계에서 무료라는 문구를 확인했다.\"}, {\"title\": \"cortex 의사용 페이지\", \"url\": \"https://lotus.ai/cortex\", \"note\": \"의사를 직접 모집하는 창구와 소속 의사 11명의 소속 기관을 확인했다.\"}, {\"title\": \"핵심 인력 페이지\", \"url\": \"https://lotus.ai/team\", \"note\": \"창업자 두 명과 임상 책임자들의 이름, 직함, 회사가 밝힌 경력을 확인했다.\"}, {\"title\": \"가입 절차 안내 (고객센터)\", \"url\": \"https://help.lotus.ai/en/articles/11636626-what-should-i-expect-when-signing-up-for-lotus-health-ai\", \"note\": \"문자 인증, persona를 통한 신분증과 얼굴 대조, 진료 동의, 자동 기록 수집으로 이어지는 가입 흐름을 확인했다.\"}, {\"title\": \"개인정보 고지\", \"url\": \"https://lotus.ai/privacy-policy\", \"note\": \"타깃 광고 목적의 개인정보 이용과 광고 네트워크 공유 조항, 그리고 이 고지가 hipaa 대상 진료 정보에는 적용되지 않는다는 단서를 확인했다.\"}, {\"title\": \"개인정보 취급 고지 (hipaa)\", \"url\": \"https://lotus.ai/notice-of-privacy-practices\", \"note\": \"진료 법인이 lotus health medical inc.와 lotus health medical, p.c.라는 점과, 치료나 제품을 권하는 연락의 대가를 받으려면 서면 동의가 필요하다는 조항을 확인했다.\"}, {\"title\": \"미국 앱스토어 lotus health ai\", \"url\": \"https://apps.apple.com/us/app/lotus-health-ai/id6736791154\", \"note\": \"값이 무료인 점, 평점 4.4점과 평가 184건, 2025년 5월 14일 최초 출시, 전국 6,000곳 검사소 문구를 확인했다.\"}, {\"title\": \"미국 앱스토어 최신 후기\", \"url\": \"https://itunes.apple.com/us/rss/customerreviews/id=6736791154/sortby=mostrecent/page=1/json\", \"note\": \"최근 49건 가운데 1점이 13건이라는 분포와 대기자 명단, 문자 인증 실패, 12일 무응답, 과잉 알림, 광고 수익 모델에 대한 실망을 확인했다.\"}, {\"title\": \"구글 플레이 검색 결과\", \"url\": \"https://play.google.com/store/search?q=lotus%20health%20ai&c=apps\", \"note\": \"안드로이드 앱이 없다는 점을 확인했다. 이름이 비슷한 lotus ai 식단 앱은 다른 회사다.\"}]}"},{"slug":"midi-health","name":"Midi Health","one_liner":"폐경 전후 증상을 겪는 미국 여성에게 화상으로 진료를 해 주는 원격 진료 회사로, 진료비를 환자에게 직접 받지 않고 민간 건강보험에 청구하는 방식을 택했다.","sells_to":"mixed","seen_in":[{"issue":"12","section":19,"headline":"폐경 케어로 가장 잘 알려진 여성 건강 회사로 소개되면서, Goodwater Capital이 주도한 라운드에서 1억 달러를 조달해 기업 가치 10억 달러를 넘겼다고 나왔다."}],"card":{"problem":"미국에서는 폐경 전후 증상을 제대로 진료해 주는 의사를 찾기가 어렵다. 검사 한 번으로 확정하는 병이 아니라 증상으로 판단하는 영역이라 정식으로 훈련받은 의사가 드물고, 보험 네트워크 안에서 그런 의사를 직접 찾아 예약을 잡는 데 몇 주가 걸린다.","solution":"여성 건강을 전공한 전문간호사와 조산사가 화상으로 30분 진료를 하고, 호르몬제와 비호르몬제 처방, 검사 의뢰, 생활 습관 상담을 묶은 치료 계획을 준다. 50개 주 전역에서 민간 보험으로 받을 수 있게 만든 것이 이 회사의 핵심이다.","price":"보험이 있으면 진료비를 보험에 청구하므로 본인부담금만 내고, 보험을 쓰지 않으면 첫 진료 250달러, 재진 150달러다.","tags":["폐경 케어","원격진료","보험 청구","여성 건강","간호사 진료"],"headline_traction":"2026년 2월에 Goodwater Capital이 주도한 시리즈 D로 1억 달러를 조달해 기업 가치 10억 달러를 넘겼다.","watch":"주당 25,000명과 보험 적용 대상 4,500만 명은 모두 회사가 스스로 낸 수치이고, 4,500만 명은 실제 이용자가 아니라 보험으로 이용할 수 있는 사람의 수다. 메디케어와 메디케이드 가입자는 받지 않는다."},"screenshots":[{"file":"midi-health_home.png","caption":"첫 화면에서 보험으로 받는 폐경 진료임을 앞세우고, 계약한 보험사 이름을 나란히 보여 준다.","from":"https://www.joinmidi.com"},{"file":"midi-health_pricing.png","caption":"값 안내 화면이다. 첫 진료 30분 250달러, 재진 15분 150달러이며 보험을 쓰면 보험 처리라고 적혀 있다.","from":"https://www.joinmidi.com/pricing-insurance"},{"file":"midi-health_glp1.png","caption":"GLP-1 약값 안내 화면이다. 진료는 보험으로 받고 약은 4주분 164달러에서 460달러 사이에 현금으로 사는 구조를 보여 준다.","from":"https://www.joinmidi.com/glp1-pricing"}],"q":"{\"slug\": \"midi-health\", \"name\": \"midi health\", \"one_liner\": \"폐경 전후 증상을 겪는 미국 여성에게 화상으로 진료를 해 주는 원격 진료 회사로, 진료비를 환자에게 직접 받지 않고 민간 건강보험에 청구하는 방식을 택했다.\", \"site\": \"https://www.joinmidi.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"12\", \"section\": 19, \"headline\": \"폐경 케어로 가장 잘 알려진 여성 건강 회사로 소개되면서, goodwater capital이 주도한 라운드에서 1억 달러를 조달해 기업 가치 10억 달러를 넘겼다고 나왔다.\"}], \"card\": {\"problem\": \"미국에서는 폐경 전후 증상을 제대로 진료해 주는 의사를 찾기가 어렵다. 검사 한 번으로 확정하는 병이 아니라 증상으로 판단하는 영역이라 정식으로 훈련받은 의사가 드물고, 보험 네트워크 안에서 그런 의사를 직접 찾아 예약을 잡는 데 몇 주가 걸린다.\", \"solution\": \"여성 건강을 전공한 전문간호사와 조산사가 화상으로 30분 진료를 하고, 호르몬제와 비호르몬제 처방, 검사 의뢰, 생활 습관 상담을 묶은 치료 계획을 준다. 50개 주 전역에서 민간 보험으로 받을 수 있게 만든 것이 이 회사의 핵심이
