<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Health Tech Nerds 정리 노트 — 미국 헬스케어 읽기</title>
<meta name="description" content="Health Tech Nerds 뉴스레터 55회차를, 미국 헬스케어를 처음 보는 사람 기준으로 한글로 풀어 쓴 정리 노트">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#faf9f7; --surface:#fff; --surface-2:#f4f2ee; --text:#1b1a18; --muted:#6d6860;
  --line:#e5e1d9; --line-soft:#efece6;
  --accent:#1c6d5b; --accent-soft:#e4f1ed; --accent-ink:#12503f;
  --warn:#8a5a10; --warn-soft:#fbf0dc;
  --t-reads:#1f5fa8; --t-reads-bg:#e6eefa;
  --t-policy:#8a5a10; --t-policy-bg:#fbf0dc;
  --t-roundup:#6b3f9e; --t-roundup-bg:#f0e9fb;
  --t-interview:#a33a6b; --t-interview-bg:#fbe8f1;
  --t-event:#5a5a5a; --t-event-bg:#ececec;
  --radius:12px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
:root:not([data-theme="light"]){ color-scheme:light }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131519; --surface:#1a1d22; --surface-2:#20242b; --text:#e9e7e3; --muted:#9aa0a8;
    --line:#2b3038; --line-soft:#232830;
    --accent:#63c3a8; --accent-soft:#173028; --accent-ink:#8fd9c2;
    --warn:#d9ab63; --warn-soft:#2e2415;
    --t-reads:#7fb0e8; --t-reads-bg:#182634;
    --t-policy:#d9ab63; --t-policy-bg:#2e2415;
    --t-roundup:#b493e0; --t-roundup-bg:#241c33;
    --t-interview:#e08bb2; --t-interview-bg:#331823;
    --t-event:#a8a8a8; --t-event-bg:#26262a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131519; --surface:#1a1d22; --surface-2:#20242b; --text:#e9e7e3; --muted:#9aa0a8;
  --line:#2b3038; --line-soft:#232830;
  --accent:#63c3a8; --accent-soft:#173028; --accent-ink:#8fd9c2;
  --t-reads:#7fb0e8; --t-reads-bg:#182634;
  --t-policy:#d9ab63; --t-policy-bg:#2e2415;
  --t-roundup:#b493e0; --t-roundup-bg:#241c33;
  --t-interview:#e08bb2; --t-interview-bg:#331823;
  --t-event:#a8a8a8; --t-event-bg:#26262a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:anywhere;
}
a{color:var(--accent-ink); text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit; font-size:inherit; color:inherit}

/* ---------- layout ---------- */
.app{display:grid; grid-template-columns:308px minmax(0,1fr); min-height:100vh}
.side{
  border-right:1px solid var(--line); background:var(--surface);
  position:sticky; top:0; height:100vh; display:flex; flex-direction:column; min-width:0;
}
.main{min-width:0; display:flex; flex-direction:column}

/* ---------- sidebar ---------- */
.brand{padding:18px 18px 12px; border-bottom:1px solid var(--line-soft)}
.brand h1{margin:0; font-size:15px; font-weight:700; letter-spacing:-.01em}
.brand p{margin:4px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5}
.searchwrap{padding:12px 14px 8px}
.search{
  width:100%; padding:9px 12px; border-radius:9px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--text); font-size:13.5px;
}
.search::placeholder{color:var(--muted)}
.search:focus{outline:2px solid var(--accent); outline-offset:-1px; background:var(--surface)}
.navlinks{display:flex; flex-wrap:wrap; gap:6px; padding:2px 14px 10px}
.navlink{
  border:1px solid var(--line); background:var(--surface-2); border-radius:999px;
  padding:5px 11px; font-size:12.5px; cursor:pointer; color:var(--muted);
}
.navlink:hover{border-color:var(--accent); color:var(--accent-ink)}
.navlink.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); font-weight:600}
.filters{display:flex; flex-wrap:wrap; gap:5px; padding:0 14px 10px; border-bottom:1px solid var(--line-soft)}
.chip{
  border:1px solid var(--line); background:transparent; border-radius:999px;
  padding:3px 9px; font-size:11.5px; cursor:pointer; color:var(--muted);
}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
:root[data-theme="dark"] .chip.on{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#0e1a16}}
.issuelist{overflow-y:auto; flex:1; padding:6px 8px 24px}
.ilist-head{
  font-size:11px; color:var(--muted); padding:10px 8px 4px; letter-spacing:.04em;
  text-transform:uppercase; font-weight:700; position:sticky; top:0; background:var(--surface);
}
.ilist-month{
  font-size:11.5px; color:var(--muted); font-weight:700; padding:12px 8px 4px;
  border-top:1px solid var(--line-soft); margin-top:6px;
}
.ilist-month:first-child{border-top:0; margin-top:0}
.irow{
  display:block; width:100%; text-align:left; border:0; background:transparent;
  padding:8px 10px; border-radius:9px; cursor:pointer; line-height:1.45;
}
.irow:hover{background:var(--surface-2)}
.irow.on{background:var(--accent-soft)}
.irow .r1{display:flex; align-items:center; gap:6px; margin-bottom:2px}
.irow .num{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.irow .ttl{font-size:13px; font-weight:600; color:var(--text); display:block}
.irow.on .ttl{color:var(--accent-ink)}
.irow .sub{font-size:11.5px; color:var(--muted); display:block; margin-top:2px}
.badge{
  font-size:10px; font-weight:700; padding:1.5px 6px; border-radius:5px; white-space:nowrap;
  letter-spacing:.01em;
}
.b-reads{background:var(--t-reads-bg); color:var(--t-reads)}
.b-policy{background:var(--t-policy-bg); color:var(--t-policy)}
.b-roundup{background:var(--t-roundup-bg); color:var(--t-roundup)}
.b-interview{background:var(--t-interview-bg); color:var(--t-interview)}
.b-event{background:var(--t-event-bg); color:var(--t-event)}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(10px);
  border-bottom:1px solid var(--line); padding:10px 16px;
  display:flex; align-items:center; gap:10px;
}
.menubtn{display:none; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 10px; cursor:pointer}
.crumb{font-size:12.5px; color:var(--muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.iconbtn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:5px 10px; cursor:pointer; font-size:12.5px; color:var(--muted)}
.iconbtn:hover{border-color:var(--accent); color:var(--accent-ink)}

/* ---------- content ---------- */
.wrap{padding:26px 30px 120px; max-width:860px; width:100%; margin:0 auto}
.doc h2{font-size:25px; line-height:1.35; margin:0 0 6px; letter-spacing:-.02em}
.doc h3{font-size:18px; margin:34px 0 10px; letter-spacing:-.01em; scroll-margin-top:70px}
.doc h4{font-size:15px; margin:22px 0 6px}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{margin:0 0 14px; padding-left:20px}
.doc li{margin-bottom:5px}
.meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 16px; font-size:12.5px; color:var(--muted)}
.hook{
  font-size:17px; line-height:1.7; font-weight:600; letter-spacing:-.01em;
  padding:14px 16px; border-left:3px solid var(--accent); background:var(--accent-soft);
  border-radius:0 10px 10px 0; margin:0 0 22px; color:var(--accent-ink);
}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin:0 0 14px}
.tldr{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 18px 6px; margin:0 0 26px}
.tldr .lbl{font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--muted); text-transform:uppercase}
.tldr ol{margin:8px 0 10px; padding-left:20px}
.tldr li{margin-bottom:7px}

.sec{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin:0 0 16px; overflow:hidden}
.sec > h3{margin:0; padding:14px 18px 12px; font-size:17px; border-bottom:1px solid var(--line-soft); background:var(--surface)}
.sec > h3 .en{display:block; font-size:11.5px; font-weight:500; color:var(--muted); margin-top:3px; letter-spacing:0}
.secbody{padding:14px 18px 6px}
.qa{margin:0 0 14px}
.qa .lbl{
  display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.05em;
  padding:2px 7px; border-radius:5px; margin-bottom:6px;
  background:var(--surface-2); color:var(--muted); border:1px solid var(--line-soft);
}
.qa.what .lbl{background:var(--t-reads-bg); color:var(--t-reads); border-color:transparent}
.qa.why .lbl{background:var(--accent-soft); color:var(--accent-ink); border-color:transparent}
.qa.struct .lbl{background:var(--t-roundup-bg); color:var(--t-roundup); border-color:transparent}
.qa.consumer .lbl{background:var(--t-policy-bg); color:var(--t-policy); border-color:transparent}
.qa p{margin:0 0 10px}
.qa p:last-child{margin-bottom:0}
.stats{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px}
.stat{background:var(--surface-2); border:1px solid var(--line-soft); border-radius:9px; padding:8px 11px; min-width:0}
.stat b{display:block; font-size:15px; font-family:var(--mono); letter-spacing:-.02em}
.stat span{display:block; font-size:11.5px; color:var(--muted); line-height:1.45; margin-top:2px}
.players{display:flex; flex-direction:column; gap:6px; margin:0 0 14px}
.player{font-size:13px; line-height:1.6; padding:7px 11px; background:var(--surface-2); border-radius:8px; border:1px solid var(--line-soft)}
.player b{color:var(--text)}
.player span{color:var(--muted)}
.terms{margin:0 0 16px; padding:12px 15px 13px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:10px}
.terms .lbl{font-size:11px; font-weight:800; letter-spacing:.04em; color:var(--accent-ink); display:block; margin-bottom:9px}
.term{font-size:13px; line-height:1.65; margin-bottom:9px}
.term:last-child{margin-bottom:0}
.term.core{
  background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:8px; padding:11px 13px; margin-bottom:10px; font-size:13.5px; line-height:1.75;
}
.term.core b{font-size:14px}
.term.core .pl{margin-top:4px}
.term b{color:var(--text)}
.term .ko{color:var(--accent-ink); font-weight:600}
.term .pl{color:var(--muted); display:block}
/* ---------- 투자받은 회사 ---------- */
.cbig{border:1px solid var(--line); background:var(--surface); border-radius:var(--radius); padding:16px 18px; margin:0 0 16px}
.cbig-h{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px}
.cspacer{flex:1}
.cname{border:0; background:transparent; padding:0; font-size:18px; font-weight:700; cursor:pointer; letter-spacing:-.01em}
.cname:hover{color:var(--accent-ink); text-decoration:underline}
.cs{font-size:11px; font-weight:700; padding:2px 8px; border-radius:5px; background:var(--t-reads-bg); color:var(--t-reads)}
.cissue{border:1px solid var(--line); background:var(--surface-2); color:var(--muted); border-radius:5px;
  font-size:11px; padding:1px 7px; cursor:pointer; font-family:var(--mono)}
.cissue:hover{border-color:var(--accent); color:var(--accent-ink)}
.cmore{border:1px solid var(--accent); background:var(--surface); color:var(--accent-ink); border-radius:8px;
  font-size:12.5px; font-weight:600; padding:5px 12px; cursor:pointer}
.cmore:hover{background:var(--accent); color:#fff}
:root[data-theme="dark"] .cmore:hover{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cmore:hover{color:#0e1a16}}
.cone{margin:0 0 9px; font-size:14.5px; line-height:1.7; font-weight:600}
.ctags{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 10px}
.ctags span{font-size:11.5px; padding:2px 9px; border-radius:999px; background:var(--surface-2);
  border:1px solid var(--line-soft); color:var(--muted)}
.csum{margin:0 0 12px; font-size:14px; line-height:1.8; color:var(--muted)}
.ctab{width:100%; border-collapse:collapse; margin:0 0 12px; font-size:13.5px}
.ctab th{
  text-align:left; width:126px; vertical-align:top; padding:7px 10px 7px 0; font-weight:700;
  color:var(--muted); font-size:12px; white-space:nowrap; border-top:1px solid var(--line-soft);
}
.ctab td{padding:7px 0; line-height:1.7; border-top:1px solid var(--line-soft)}
.ctab tr:first-child th, .ctab tr:first-child td{border-top:0}
.ctab tr.w th{color:var(--t-policy)}
.ctab tr.w td{color:var(--t-policy)}
.cthumbs{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.cthumbs figure{margin:0; min-width:0}
.cthumbs a{display:block; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface-2)}
.cthumbs img{width:100%; height:132px; object-fit:cover; object-position:top; display:block}
.cthumbs figcaption{font-size:11px; color:var(--muted); margin-top:4px; line-height:1.5}
@media (max-width:760px){ .cthumbs{grid-template-columns:1fr 1fr} .ctab th{width:92px} }
.backlink{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; margin:0 0 14px;
}
.backlink:hover{border-color:var(--accent); color:var(--accent-ink)}
.cblock{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 18px; margin:0 0 12px}
.cblock .lbl{display:block; font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--muted); margin-bottom:8px}
.cblock p{margin:0 0 10px; font-size:14.5px; line-height:1.8}
.cblock p:last-child{margin-bottom:0}
.cblock.warn{border-color:var(--t-policy); background:var(--t-policy-bg)}
.cblock.warn .lbl{color:var(--t-policy)}
.cblock.forus{border-color:var(--accent); background:var(--accent-soft)}
.cblock.forus .lbl, .cblock.forus p{color:var(--accent-ink)}
.cfeat, .cteam, .ctrac, .csrc{list-style:none; margin:0; padding:0}
.cfeat li{padding:8px 0 8px 12px; border-left:3px solid var(--line); margin-bottom:8px}
.cfeat b{display:block; font-size:14px}
.cfeat span{display:block; font-size:13.5px; color:var(--muted); margin-top:2px; line-height:1.7}
.cteam li{padding:7px 0; border-bottom:1px solid var(--line-soft); font-size:14px}
.cteam li:last-child{border-bottom:0}
.cteam .role{font-size:11.5px; color:var(--muted); background:var(--surface-2); padding:1px 7px; border-radius:5px; margin-left:7px}
.cteam span:not(.role){display:block; font-size:13px; color:var(--muted); margin-top:3px}
.ctrac li{display:flex; gap:9px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
.ctrac li:last-child{border-bottom:0}
.tt2{font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:5px; background:var(--surface-2); color:var(--muted); flex:none}
.tt2.t-funding{background:var(--accent-soft); color:var(--accent-ink)}
.tt2.t-regulatory{background:var(--t-policy-bg); color:var(--t-policy)}
.tt2.t-partnership{background:var(--t-roundup-bg); color:var(--t-roundup)}
.tt2.t-revenue, .tt2.t-customers, .tt2.t-traffic{background:var(--t-reads-bg); color:var(--t-reads)}
.ctrac .d{flex:1; min-width:0; font-size:14px; line-height:1.7}
.ctrac .w{font-family:var(--mono); font-size:11.5px; color:var(--muted)}
/* 세로로 긴 갈무리가 섞여 있어 단 배치로 빈 공간을 줄인다. */
.cshots{columns:2; column-gap:12px}
.cshots figure{margin:0 0 14px; break-inside:avoid}
.cshots a{display:block; position:relative; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--surface-2)}
.cshots img{width:100%; display:block; max-height:520px; object-fit:cover; object-position:top}
.cshots a::after{
  content:'원본 보기'; position:absolute; right:8px; bottom:8px; font-size:10.5px; font-weight:700;
  background:rgba(0,0,0,.62); color:#fff; padding:3px 8px; border-radius:5px; opacity:0; transition:opacity .15s;
}
.cshots a:hover::after{opacity:1}
.cshots figcaption{font-size:12px; color:var(--muted); margin-top:5px; line-height:1.6}
@media (max-width:900px){ .cshots{columns:1} }
.csrc li{padding:6px 0; font-size:13.5px; border-bottom:1px solid var(--line-soft)}
.csrc li:last-child{border-bottom:0}
.csrc span{display:block; font-size:12.5px; color:var(--muted); margin-top:2px}

/* ---------- 회차 머리: 요약 → 건질 것 → 꼭지 고르기 ---------- */
.ihead{margin:0 0 26px}
.tldr{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 20px 8px; margin:0 0 14px}
.tldr .lbl{font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--muted)}
.tldr ol{margin:10px 0 8px; padding-left:20px}
.tldr li{margin-bottom:12px}
.tldr .pt{display:block; font-size:15px; line-height:1.7; font-weight:600}
.tldr .nt{display:block; font-size:13.5px; line-height:1.7; color:var(--muted); margin-top:3px}

.issueins{border-radius:var(--radius); padding:15px 20px; margin:0 0 16px}
.issueins.yes{background:var(--accent-soft); border:1px solid var(--accent); border-left:4px solid var(--accent)}
.issueins.no{background:var(--surface); border:1px dashed var(--line)}
.issueins .lbl{display:block; font-size:11px; font-weight:800; letter-spacing:.05em; margin-bottom:7px}
.issueins.yes .lbl{color:var(--accent-ink)}
.issueins.no .lbl{color:var(--muted)}
.issueins p{margin:0; font-size:14.5px; line-height:1.8}
.issueins.yes p{color:var(--accent-ink)}
.issueins.no p{color:var(--muted)}
.issueins .jump{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px}
.issueins .jump button{
  border:1px solid var(--accent); background:var(--surface); color:var(--accent-ink);
  border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; font-weight:600;
}
.issueins .jump button:hover{background:var(--accent); color:#fff}

.issueins .igrp{margin-top:13px}
.issueins .gl{
  display:inline-block; font-size:10.5px; font-weight:800; letter-spacing:.04em;
  padding:2px 9px; border-radius:5px; margin-bottom:8px;
}
.issueins .igrp.b .gl{background:var(--accent); color:#fff}
.issueins .igrp.s .gl{background:var(--t-policy-bg); color:var(--t-policy)}
:root[data-theme="dark"] .issueins .igrp.b .gl{color:#0e1a16}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .issueins .igrp.b .gl{color:#0e1a16}}
.ibul{list-style:none; margin:0; padding:0}
.ibul li{
  padding:9px 0 9px 13px; border-left:3px solid var(--accent); margin-bottom:8px;
  background:var(--surface); border-radius:0 8px 8px 0; padding-right:12px;
}
.ibul.s li{border-left-color:var(--t-policy)}
.ibul li:last-child{margin-bottom:0}
.ibul b{display:block; font-size:14px; line-height:1.6; color:var(--text)}
.ibul span{display:block; font-size:13.5px; line-height:1.7; color:var(--muted); margin-top:3px}
.ibul .src{
  display:inline-block; margin-top:6px; border:1px solid var(--line); background:var(--surface-2);
  color:var(--muted); border-radius:5px; font-size:11px; padding:2px 8px; cursor:pointer;
}

th-funding"],"n_sec":31,"n_build":2,"n_signal":5,"q":"ai 주치의 열풍과 hims의 49달러 알약 weekly health tech reads 2/8/25 ai가 주치의를 다시 발명하겠다고 선언한 주에, 같은 약속을 했던 앞 세대는 파산 신청을 했다. 이 회차의 중심 글은 필자가 ai 프라이머리 케어 모델을 두고 쓴 단상이다. 같은 주에 어전트 케어 체인 carbon health가 chapter 11 파산을 신청했고, ai 프라이머리 케어를 내건 lotus health ai는 3,600만 달러를 조달했는데, 필자가 직접 가입해 보니 ai 뒤에 있는 인간 의사들이 정원이 차서 대기자 명단에 올랐다. 필자는 ai로 의사 한 명이 맡는 환자 수를 열 배로 늘리겠다는 모델의 진짜 숙제가 기술이 아니라 조직 설계라고 주장하며, 이미 과로를 이유로 노조를 만들려는 mass general brigham의 주치의들이 ai 가상 진료 도입에 더 화가 난 사례를 근거로 든다. devoted health가 3억 6,600만 달러를 조달하고 medicare advantage 가입자를 466,000명으로 전년 대비 121% 늘렸다고 거의 알리지 않은 채 발표했는데, 정작 devoted 창업팀에 속한 venrock은 두 달 전 신규 ma 가입자를 잘못 받으면 큰돈을 잃는다며 humana의 붕괴를 예측했다. hims가 목요일 아침 복합조제 glp-1 알약을 월 49달러에 내놓아 주가가 9% 뛰고 eli lilly와 novo nordisk 주가를 끌어내렸지만, fda와 hhs가 즉각 반응하고 법무부에 조사가 회부되면서 금요일 늦게 제품을 내렸고 주가는 주간 30% 하락으로 끝났다. 정부 프로그램에 의존하는 보험사와 그 밖의 회사가 실적에서 정반대로 갈렸다. molina는 28%, centene은 10%, doximity는 25% 하락했고, 스페셜티 약 유통을 키운 cigna는 7% 올랐으며 pace 사업자 innovage는 50% 급등했다. 인디애나에서 병원 재정을 두고 상반된 자료가 부딪혔다. kaufmann hall은 2025년 마진이 전국 평균을 밑돈다고 발표했지만, 고용주 연합은 2024년 인디애나 병원의 거의 20%가 순이익률 20%를 넘겼고 fort wayne의 비영리 정형외과 병원 한 곳은 영업이익률 37%를 냈다는 데이터를 내놓았다. 후원: candor health sponsored by: candor health 단상: ai로 주치의를 다시 발명한다는 이야기 my musing: ai and the nuances of reinventing primary care carbon health lotus health ai mass general brigham kff가 전한 보스턴 환자 사례 intuitive surgical primary care / pcp iron triangle panel size chapter 11 메디케어 어드밴티지: devoted health의 조용한 대형 조달 medicare advantage: devoted health very quietly announces a very large funding round devoted health medicare advantage (ma) v28 in-house medical group 실적: molina, 가이던스의 절반에도 못 미치다 public markets earnings updates molina healthcare medicaid rfp 실적: centene, aca 가입자가 몇 달 만에 줄어든다 public markets earnings updates centene centene의 뉴욕 프로바이더 상대 소송 aca exchange no surprises act (nsa)와 독립 분쟁 해결(idr) aba therapy duals 실적: cigna, 보험에서 약 유통 쪽으로 무게를 옮기다 public markets earnings updates cigna pbm specialty pharmacy co-pay only y Health Tech Reads 2/22/26","hook":"의료비를 낮추라고 만든 규제 두 건이 오히려 값을 끌어올린 한 주다.","themes":["policy-legislation","pbm-drug-pricing","regulation-cms","medicare-advantage","consumer-dtc","medicaid"],"n_sec":25,"n_build":1,"n_signal":2,"q":"의료비를 깎으려던 규제의 역설 weekly health tech reads 2/22/26 의료비를 낮추라고 만든 규제 두 건이 오히려 값을 끌어올린 한 주다. medicare가 eliquis 가격을 56% 깎기로 한 바로 그 해에 제조사 bristol myers squibb는 그 약의 매출을 2025년 144억 달러에서 약 160억 달러로 늘릴 것으로 전망했고, 늘어나는 20억 달러는 1차 협상 10개 약 전체의 절감 추정치인 15억 달러보다 크다. 필자가 인용한 분석 매체는 이를 두고 인플레이션 감축법이 eliquis에게 일어난 가장 좋은 일일지도 모른다고 적었다. 예상치 못한 의료비 청구서로부터 소비자를 지키려고 만든 no surprises act의 분쟁 조정 절차를 일부 의사 그룹이 역이용하면서, 보험사 centene은 2025년 자사 aca 가입자의 의료비가 1% 늘었다고 밝혔고 필자는 이를 거래소 전체로 환산하면 10억~20억 달러 규모라고 추정한다. 필자는 cmmi가 발표한 access 모델의 지불 요율이 업계 예상보다 낮은 것을 두고, 기존 디지털 헬스의 인건비 구조로는 셈이 맞지 않아 접근법을 바닥부터 다시 짜야 하는 수준이라고 본다. 그는 이 모델이 새 이익 풀을 만들면서 전체 비용도 낮추려면 생태계 어딘가의 이익을 줄여야 한다고 덧붙인다. 소비자에게 직접 파는 헬스케어 기업 hims가 호주 등에서 연 매출 약 4억 5,000만 달러와 고객 77만 5,000명을 가진 eucalyptus를 최대 11억 5,000만 달러에 인수했지만, hims 주가는 이번 주 6% 더 내려 시가총액이 약 36억 달러, 2026년 예상 매출의 약 1.5배에 머물렀다. 정신건강 원격 상담 기업 talkspace가 2025년 매출 2억 3,000만 달러로 22% 성장하며 주가가 20% 넘게 올랐는데, 소비자가 직접 결제한 매출은 전체의 약 6%뿐이고 나머지는 보험사와 기업 채널에서 나왔다. scripps health는 2024년 medicare advantage에서 철수해 7,500만 달러 손실이 나던 계약을 끊고 환자를 전통적 medicare로 옮겼는데도 물량 감소가 없었다고 밝힌 반면, cleveland clinic은 같은 상품의 가입자를 2026년 4만 6,000명에서 2028년 12만 5,000명으로 늘리겠다고 말한다. 이번 주 단상: 의료비를 낮추려는 규제의 기이한 역학 musing: the peculiar dynamics of deflationary regulation in healthcare 인플레이션 감축법과 약값 the inflation reduction act and drug costs ira 1차 약가 협상 bristol myers squibb의 eliquis 매출 전망 medicare ira(인플레이션 감축법) 약가 협상 medicaid list-to-net(표시가와 실수령가의 차이) no surprises act와 네트워크 외 청구 the no surprises act & provider oon billing no surprises act와 독립 분쟁 해결 절차 envision과 american physician partners lawson mansell 초청 대화 예고 네트워크 외 진료(out-of-network) no surprises act(nsa) idr(독립 분쟁 해결 절차) aca 거래소(exchange) access 모델과 디지털 헬스에 주는 함의 the implications for access & digital health cmmi access model cmmi access 6 ai가 일자리를 없앨지 다투는 사이, 작은 ma 회사들은 내년 요율에 괜찮다고 말했다. 필자는 ai가 화이트칼라 일자리를 없앤다는 파멸론 리포트를 2028년의 현실보다는 sf 소재에 가깝다고 보면서도, 미국 헬스케어의 백오피스 직무가 자동화하기 딱 좋아 보인다는 점은 인정하고, 결국 헬스케어 전체 일자리는 늘고 화이트칼라 감소를 블루칼라 증가가 상쇄할 것이라는 자기 직감을 밝힌다. vbc와 medicare advantage 기업들의 4분기 실적이 몰리면서 주가가 크게 갈렸는데(evolent +25%, agilon +31%, privia +10%, alignment -6%), 더 눈에 띈 것은 이 작은 회사들이 cms의 2027년 지급률 초안을 두고 대형 보험사와 정반대로 '이 요율로도 괜찮다'고 말한 대목이다. 소비자가 자기 돈으로 쓰는 온라인 처방 서비스 hims는 매출 23억 달러에 전년 대비 59% 성장, 조정 ebitda 마진 14%라는 숫자를 내고도 주가가 한 주 동안 7% 더 빠졌는데, 필자는 회사 이름을 가리면 좋은 투자로 보이지만 sec 조사를 실적 발표에서 언급하지 않은 회사라면 투자자의 회의가 이해된다고 적는다. mount sinai 연구진이 nature medicine에 낸 연구에서 chatgpt health가 임상 증례에 답한 내용을 두고 일부 임상의가 '불필요한 위해와 사망으로 충분히 이어질 수 있다'고 우려했지만, 필자는 그 위험을 인정하면서도 아이가 독감인지 계속 chatgpt health에 물어보겠다고 덧붙인다. massachusetts 정책위원회가 주 내 완전보험형 상업 플랜 데이터를 살펴본 결과, 2024년 보험사들이 상업 청구의 평균 20.4%를 거절한 것으로 나타났다. 펀딩은 일곱 건이 나왔는데, vbc 인에이블먼트 honest health가 1억 4,000만 달러로 가장 컸고, 그 아래로 뇌 건강 클리닉 salma health 8,000만 달러, 진료소 행정 플랫폼 third way 1,500만 달러, 플랜 비교 플랫폼 handl health 1,420만 달러, 재택 소아 치료 coral care와 인지 평가 도구 braincheck 각 1,300만 달러, medicare 애드보커시 baba 650만 달러가 이어졌다. 여는 인사 후원: ascendrural sponsored by: ascendrural ai는 헬스케어 일자리를 없앨까 musing: ben affleck, the ai abundance / apocalypse, and healthcare block 인력 감축 rcm jevons paradox 실적 시즌: 들어가며 public markets updates medicare advantage (ma) vbc hims: 숫자는 좋은데 주가는 빠졌다 public markets updates hims 2025년 4분기 실적 compounded glp-1 조정 ebitda evolent: 종양학이 매출의 3분의 2가 된다 public markets updates evolent 2025년 4분기 실적 aca 거래소(exchange) 케어 경로(care pathway) agilon: 손실을 줄이려 가입자를 덜어 냈다 public markets updates agilon health 2025년 4분기 실적 리스크를 떠안는다(risk-bearing) alignment: 가이던스를 넘기고도 주가는 내렸다 public markets updates alignment health 2025년 4분기 실적 ipa clover: new jersey 밖에서는 아직 public markets updates clover health 2025년 4분기 실적 counterpart health provider-sponsored plan privia: 조용한 분기 public markets updates privia health 2025년 4분기 실적 goodrx: 가이던스 하향 public markets updates goodrx 2026년 가이던스 goodrx teladoc: betterhelp 역풍 -03-29","type":"reads","title_ko":"펩타이드 열풍과 펀딩 열두 건","title_en":"Weekly Health Tech Reads 3/29/26","hook":"미국 소비자가 정체를 모르는 주사를 스스로 사는 동안, 투자자는 그 흐름에 돈을 걸었다.","themes":["pharma-glp1","consumer-dtc","digital-health-funding","ai-clinical","rcm-billing","hospital-health-system"],"n_sec":32,"n_build":3,"n_signal":4,"q":"펩타이드 열풍과 펀딩 열두 건 weekly health tech reads 3/29/26 미국 소비자가 정체를 모르는 주사를 스스로 사는 동안, 투자자는 그 흐름에 돈을 걸었다. 필자는 2026년 1분기를 마무리하며 올해 헬스케어 논의를 지배하는 흐름으로 임상 진료의 ai와 롱제비티 모델 두 가지를 꼽는데, 이번 주에 발표된 스타트업 펀딩 열두 건도 대부분 이 두 가지 안에 들어간다. 병원 안에 엔지니어를 들여보내 ai 과제를 함께 만드는 qualified health가 1억 2,500만 달러를, 병원의 청구서를 보험사에 중계하는 stedi가 5,000만 달러를 조달한 것이 그 예다. 이번 회차의 중심 글은 필자가 회색 시장 펩타이드 열풍을 두고 쓴 단상이며, 그는 논쟁의 진짜 쟁점이 효능의 증거가 아니라 fda 같은 기관에 대한 불신이라고 보고, 나쁜 결과와 규제 당국의 조사를 거쳐 펩타이드가 결국 자리 잡힌 시장으로 정착할 것이라고 예측한다. 같은 주에 롱제비티 진료 기관 emed가 기업가치 20억 달러가 넘는 조건으로 2억 달러를, 조제 약국과 롱제비티 클리닉을 연결하는 vitl이 750만 달러를 조달했고, 필자는 이 두 건을 투자자가 앞으로 올 펩타이드 붐을 기대하고 있다는 신호로 읽는다. emed가 고용주에게 자사 glp-1 관리 상품을 팔면서 내세운 근거도 임상 결과가 아니라 환자 순응도 90%다. 임상 진료용 ai 모델을 만드는 doctronic이 12개월도 안 되는 사이 세 번째로 4,000만 달러를 조달했지만, 주간 방문자 30만 명 가운데 실제 유료 원격진료 방문으로 이어지는 비율은 2%가 되지 않는다. 헬스케어 프로바이더 임원의 88%가 앞으로 12개월간 입원 건당 인건비가 오를 것이라고 답했고, 필자는 이 숫자가 ai 덕분에 곧 의료 공급 비용이 거의 사라진다는 여러 주장과 어긋난다고 본다. 같은 문제를 인력 쪽에서 푸는 회사도 이번 주에 돈을 받았는데, 학자금 대출 상환을 지원해 병원이 채용한 임상 인력이 오래 근무하도록 돕는 clasp가 2,000만 달러를 조달했다. 매사추세츠에서 고중증도 퇴원 건수가 최근 몇 년 사이 크게 늘었는데, 환자가 실제로 더 위중해진 것인지 아니면 ai 문서화 도구 덕분에 청구서에 무거운 코드가 더 많이 붙게 된 것인지를 두고 신문 기사가 의문을 제기한다. 같은 주에 의학 정보 검색으로 의사들 사이에 자리 잡은 openevidence가 의사가 벌어들인 돈을 빠짐없이 받게 해 준다는 취지의 청구 코드 제품을 내놓아, 같은 흐름이 이미 상품으로 팔리고 있음을 보여 준다. 미국 법무부가 뉴욕의 대형 병원 그룹 new york presbyterian을 반독점으로 제소했고, 쟁점은 진료의 질이 아니라 보험사가 값싼 병원을 우대하거나 환자를 그쪽으로 안내하지 못하게 막는 계약 조항이다. 필자는 소장을 직접 읽어 본 뒤 특별히 강력한 사건으로 보이지는 않았다고 평가한다. 직원 의료비를 회사 돈으로 직접 부담하는 고용주를 상대로 대안적 보험 플랜을 파는 xo health가 전국으로 확장했고, 필자는 이를 몇 년째 말만 오가던 대안적 플랜 설계를 고용주들이 실제로 채택하기 시작하는 변곡점으로 읽는다. 미국 공보험을 운영하는 연방 기관이 무엇을 잘한 진료로 볼 것인지 다시 정하는 자리에서 나온 첫 번째 시사점은 초점이 치료에서 예방 서비스로 옮겨 가고 있다는 것이며, 필자가 함께 소개한 다른 글도 의사에게 진료 건수가 아니라 환자를 건강하게 유지한 결과로 돈을 지급하자는 주장을 편다. 인사말 라이브 방송 예고 catch the grand round up live, tomorrow @ 12pm et / 9am pt 법무부, new york presbyterian 반독점 제소 top headlines 미국 법무부(doj) 대 new york presbyterian 티어링(tiering)과 anti-tiering, steering 조항 all-or-nothing 조항 뉴욕시 공공병원, palantir 계약 종료 top headlines new york city health + hospitals 레비뉴 사이클 매니지먼트(rcm) infosys, optimum healthcare it 인수 top headlines infosys의 optimum healthcare it 인수 openevidence, 청구 코드 제품 출시 top headlines openevidence coding intelligence 메디컬 코딩(coding) xo health 전국 확장 top headlines xo health 자가보험(self-insured) 고용주 tpa와 level-funded 플랜 hma, 메디케이드 애널리틱스 회사 인수 top headlines health management associates의 healthtech solutions 인수 단상: 나도 펩타이드를 맞아야 하나 musing: should i be injecting myself with peptides? gameday men's health sherwood 기사의 펩타이드 관심도 차트 펩타이드(peptide) 회색 시장(grey market) 시티즌 사이언티스트(citizen scientist) bpc-157과 retatrutide 곱씹어 볼 숫자: 88% a number to ponder health enterprise partners 연례 설문 입원 건당 인건비(labor costs per admit) lp 이번 주의 차트: 매사추세츠 패혈증 급증 chart of the week boston globe의 매사추세츠 패혈증 기사 코딩 인텐시티(coding intensity) 펀딩: qualified health 1억 2,500만 달러 funding announcements qualified health 펀딩: stedi 5,000만 달러 funding announcements stedi 클레임 클리어링하우스(claims clearinghouse) 펀딩: thesis care 4,500만 달러 funding announcements thesis care 펀딩: doctronic 4,000만 달러 funding announcements doctronic 펀딩: adonis 4,000만 달러 funding announcements adonis 펀딩: emed 2억 달러 funding announcements emed 환자 순응도(adherence) 펀딩: blossom health 2,000만 달러 funding announcements blossom health 펀딩: clasp 2,000만 달러 funding announcements clasp 펀딩: dimer health 1,350만 달러 funding announcements dimer health 펀딩: prax health 1,000만 달러 funding announcements prax health np(nurse practitioner) 펀딩: certuma 1,000만 달러 funding announcements certuma 펀딩: vitl 750만 달러 funding announcements vitl 조제 약국(compounding pharmacy) 읽을거리: 메디케이드와 ai what i'm reading: medicaid + ai: a new standard for innovation 메디케이드(medicaid) 읽을거리: cms 질 측정 컨퍼런스 시사점 what i'm reading: the future of ps","hospital-health-system","policy-legislation","ai-clinical","digital-health-funding"],"n_sec":30,"n_build":2,"n_signal":3,"q":"1분기 실적, ai 파일럿의 정치 역풍 weekly health tech reads 4/26/26 눈폭풍이 보험사와 병원의 실적을 갈랐고, ai 파일럿 두 건은 규제 정치에 막혔다. 1~2월 눈폭풍으로 사람들이 병원에 덜 가면서 보험사 세 곳(united, elevance, molina)은 기대를 넘겨 주가가 7~19% 올랐고, 병원 체인 hca는 물량이 모자라 주가가 11% 떨어졌다. 필자는 양쪽 모두 시장 반응이 과했다고 본다. ezekiel emanuel이 '더 나은 헬스케어 시스템을 위해 당신은 무엇을 포기할 것인가'를 물었고, 필자는 흥미로운 사고 실험이지만 각 진영이 합의할 가능성은 0.0%라고 잘라 말했다. 성형외과 의사 norman rowe는 유방 축소술을 웹사이트에 1만 5,000~2만 5,000달러로 광고하면서, no surprises act의 중재 절차로 한 건에 44만 달러를 받아 냈고 다섯 건에서 140만 달러 판정을 받았다. 법을 만든 cassidy 상원의원은 보험사가 합리적인 안을 안 내서 그렇다고 답했다. ai를 쓰는 시도 두 건이 같은 주에 정치에 막혔다. 유타주 의료면허위원회는 doctronic의 ai 처방 리필 파일럿을 즉시 중단하라고 권고했고, 워싱턴주 상원의원은 medicare 사전 승인 모델 wiser를 '행정적 미로'라고 비판하는 보고서를 냈다. 보험 거절에 이의를 제기해 주는 claimable이 mark cuban 등에게서 1,000만 달러를 조달했는데, 환자는 이의 제기 한 건당 50달러를 직접 내고 있고 회사는 제약사와 계약을 맺기 시작했다. 이번 주 자금은 행정 업무 자동화와 제약사 환자 지원 쪽으로 몰렸다. 제약사의 환자 경험 관리를 돕는 courier health가 5,000만 달러, 행동건강 tava health가 4,000만 달러, 청구 거부 회수 amperos가 1,600만 달러를 받았다. 스폰서: nashville health care council sponsored by: nashville health care council 여는 글 1분기 실적: 눈폭풍이 갈라 놓은 보험사와 병원 q1 earnings season: early q1 takeaways: weather patterns, payor outperformance, and provider underperformance united, elevance, molina hca payor / provider (페이어와 프로바이더) medical cost trend (의료비 트렌드) guidance (가이던스) hca: 독감과 눈폭풍에 밀린 병원 체인 hca hca aca state supplemental payment (주 보조 지급 프로그램) payor mix (페이어 믹스) elevance: 전망치를 올린 보험사 elevance elevance ma (medicare advantage) medicaid second blue bid molina: 좋은 분기인데도 전망치를 안 올린 이유 molina molina redetermination / acuity shift (재심사와 중증도 이동) d-snp / hide / fide / mapd same-store (동일 매장 기준) uhg: 전 부문 초과 성과와 소비자 결제 계좌 인수 uhg optum health optum financial의 alegeus 인수 unitedhealth group / optum ffs / vbc pbm hsa / fsa 단상: 더 나은 헬스케어를 위해 무엇을 포기할 것인가 musing: a tough question: what sacrifices are we willing to make for better healthcare? iron triangle (철의 삼각형) site-neutral payme 몰린 주간의 소음 사이로, 미국인이 자기 보험을 직접 고르기 시작한 흔적이 보인다. 이번 주는 실적 발표가 몰린 주간이었고 페이어들이 대체로 좋은 성적을 냈는데, 필자가 꼽은 전략적 관전 지점은 teladoc과 alignment 둘이다. teladoc은 소비자가 구독료를 직접 내던 심리상담 betterhelp에서 보험 결제 매출이 붙기 시작해 1분기 1,300만 달러, 연환산 7,500만 달러를 기록했고 연말 1억 2,500만 달러를 전망했으며, alignment는 가이던스를 올렸는데도 주가가 12% 빠졌다. devoted health의 ceo ed park이 정부가 ma 플랜에 돈을 덜 지급했으면 좋겠다고 공개 발언했고, 필자는 이것을 이타심이 아니라 정체성 선언으로 읽는다. devoted는 스스로를 보험사가 아니라 기술로 총 의료비를 가장 잘 관리하는 진료 조직으로 보고 있으며, 지급액이 줄어드는 국면일수록 그 강점이 드러난다고 믿는다는 해석이다. apollo의 수석 이코노미스트가 래디올로지스트 패러독스라는 차트를 퍼뜨려 화제가 됐고, 같은 주에 병원용 ai 영상 판독 회사 aidoc이 1억 5,000만 달러를 조달했다. 필자는 그 차트가 전체가 아니라 특정한 이야기를 고른 것일 수 있다고 보면서도, 헬스케어 바깥에서 영상의학과 의사를 ai 영향의 첫 신호로 여기는 현상 자체를 주목한다. mark cuban이 자기 원가 기반 약국을 humana의 centerwell pharmacy와 묶는 제휴를 발표한 바로 다음 날, 의원들에게 겁쟁이가 되지 말고 수직 통합 보험사를 해체하라고 요구했다. 필자는 이 모순을 지적하면서도 제휴 자체는 점유율을 늘리지 못한 스타트업이 규모 있는 유통에 올라타는 단순한 거래로 본다. cigna가 2027년 aca 개인보험 시장에서 철수하고 사전승인 심사 자회사 evicore에 대해 매각을 포함한 전략적 대안을 검토한다. 회사가 업계의 사전승인 자동화 진전을 핵심 이유로 들자, 필자는 evicore의 사업 모델이 증발해 가고 있다고 읽었다. 소비자 쪽 흐름이 두 꼭지에서 겹치는데, rwjf는 정부 장터 바깥에서 파는 개인보험이 내년에 장터 안 플랜을 앞지를 수 있다고 전망했고, bloomberg는 비용 때문에 회사가 주는 보험을 버리고 부모는 의료비 분담 조직에, 아이들은 뉴욕주의 무료 아동 공보험에 나눠 넣은 건강한 가족을 소개했다. 인사말 1분기 실적 총평 q1 earnings: a busy week of earnings highlights confidence in 2026 performance and momentum ahead 비용 트렌드(cost trend) teladoc, 전환점의 신호 q1 earnings: a busy week of earnings highlights confidence in 2026 performance and momentum ahead teladoc betterhelp fee-for-service alignment, 가이던스를 올리고도 급락 q1 earnings: a busy week of earnings highlights confidence in 2026 performance and momentum ahead alignment healthcare medicare advantage(ma) ppo와 hmo humana, 혜택 축소를 예고 q1 earnings: a busy week of earnings highlights confidence in 2026 performance and momentum ahead humana 베네핏 축소(benefit pullback) cigna, 스페셜티와 고용주 시장으로 좁히기 q1 earnings: a busy week of earnings highlights confidence in 2026 performance and momentum ahead cigna 스페셜티 파머시(specialty pharmacy) 코페이 전용 플랜(copay-only plan) centene, 26% 급등과 aca 마진 하향 q1 earni 이션에 7,000만 달러를 조달한 것을 실마리로, 미국 헬스케어의 1조 달러 넘는 행정 지출에 ai를 붙여 1,000억 달러짜리 회사가 나올 수 있는지를 따진다. 투자자 hemant taneja와 ceo tanay tandon은 인수로 포인트 솔루션을 흡수해 그 자리에 오르겠다고 공언하지만, 같은 문제를 풀려던 health catalyst의 시가총액은 1억 달러이고 olive ai는 이미 무너졌다. epic의 진료 기록으로 본 미국 성인 bmi 분포는 지난 5년간 과체중·비만 73%에서 72.5%로 0.5%밖에 움직이지 않았다. 2025년 glp-1 매출이 약 360억 달러이고 인구의 12%가 복용했다고 응답한 것과 나란히 놓으면 앞뒤가 맞지 않으며, 필자는 답을 내놓지 못한 채 세 사실이 어떻게 동시에 참일 수 있는지를 질문으로 남긴다. 유타주가 공개한 doctronic ai 파일럿 초기 데이터에서, ai는 처방의 72%에 승인을 권고했고 그중 91%는 의사가 추가 정보를 요구하지 않고 그대로 승인했다. 필자는 사람이 전 과정에 남아 있으므로 의사 대체 우려는 과장이라고 보면서, 정작 눈여겨볼 것은 파일럿을 거친 환자 수가 아직 적다는 점이라고 짚는다. 반지형 웨어러블 oura가 ipo 서류를 비공개로 제출하면서 혈압 측정, 야간 호흡, glp-1 추적을 기기에 추가하고 counsel health와 손잡아 앱 안에서 ai 기반 진료에 닿게 했다. 필자는 whoop에 이어 oura까지 임상의 접근을 경험 안으로 들이는 흐름이 만들어졌다고 본다. 이번 주 펀딩 다섯 건은 돈이 어디로 가는지를 보여 준다. 고용주에게 파는 garner health가 27억 4,000만 달러 밸류에이션에 1억 달러를, 프로바이더 리퍼럴로 환자를 모으는 nourish가 17억 5,000만 달러에 1억 달러를 받은 반면, 소비자를 직접 상대하는 쪽은 d2c 연속혈당측정 signos 2,000만 달러와 진료 녹음 앱 kin 900만 달러로 자릿수가 다르다. 프라이머리 케어 접근성을 다룬 글 세 편이 뒤에 붙는데, wsj가 nurse practitioner를 가장 뜨거운 직업으로 꼽아 의사 커뮤니티가 반발했고, jama는 프라이머리 케어를 공공 유틸리티로 다루자고 주장했으며, 영국 nhs는 인력난을 ai로 메우는 계획을 마무리하다 의사협회로부터 거대하고 위험한 도박이라는 비난을 받았다. 필자는 접근이 무엇을 뜻하는지부터 정의하기 어렵다고 본다. 후원: limina sponsored by: limina 1,000억 달러짜리 헬스케어 ai 플랫폼이 나올까 ai: how many $100 billion ai healthcare admin platforms will there be? commure summa health health catalyst olive ai administrative spending point solution / platform forward deployed engineer glp-1은 비만율을 얼마나 낮췄나 glp-1s: glp-1s and their impact on obesity rates epic research eli lilly와 novo nordisk glp-1 bmi 유타주 ai 파일럿의 초기 데이터 clinical ai: early utah ai pilot data provides a glimpse into rollout 유타주와 doctronic의 ai 처방 파일럿 state medical board escalation 후원: abridge sponsored by: abridge clover health가 cms 상대 stars 소송에서 이겼다 key trends to keep an eye on clover health와 cms의 stars 소송 stars (star ratings) cms chevron 판결 oura가 ipo 대열에 들어서며 헬스케어 야심을 내비쳤다 key trends to keep an eye on oura whoop counsel health s-1 cmmi access model no su
