룹들은 Independent Dispute Resolution 절차를 자기들에게 유리하게 활용하는 법을 알아낸 모양이다.\n\n그 정도가 심해서 Centene은 가장 최근 실적 발표에서, 의료 제공자들이 IDR 절차를 남용하는 탓에 2025년 자사 ACA 인구의 의료비가 1% 늘어나는 것을 보고 있다고 밝혔다. 그 결과 일부 제공자를 상대로 소송을 시작하고 있다고 한다. Centene의 경험이 정확하고 전체 exchange 인구를 대표한다고 가정하면, IDR 절차가 2025년 exchange의 의료비를 10억~20억 달러 늘리고 있다는 뜻이 되는 것으로 보인다. 소수의 제공자 집단이 이 절차를 활용해 지급자에게 청구할 수 있는 금액을 키운 결과다.\n\n또다시 비용을 줄이도록 설계된 것처럼 보이는 법이 업계에 한 수 밀려 비용을 끌어올리는 사례를 보게 된다. 알고 보니 provider price transparency는 고귀한 목표이긴 하지만 실제로는 제공자 그룹이 더 많이 청구하게 만드는 기제다. 벌어지는 일은 이런 것으로 보인다. 역사적으로 더 낮은 가격을 받아 온 제공자들이 투명성을 이용해 요율을 끌어올리고, 그 결과 시장 전체가 위로 당겨진다. 적어도 IDR 절차가 시사하는 바는 그렇다.\n\n참고: 목요일 오후 1시 CT에 Niskanen Center의 보건정책 애널리스트 Lawson Mansell과 이야기를 나눕니다. 그는 NSA/IDR에 대해 광범위하게 글을 써 왔습니다. NSA의 현재 상태에 대한 그의 생각을 깊이 들어볼 예정입니다. 커뮤니티 멤버들은 여기에서 대화에 참여하세요."},{"heading_en":"The implications for ACCESS & digital health","body":"NSA와 IRA의 사례는 정부가 최선을 다했음에도 의료비 지출을 실제로 줄이는 규제를 시행하는 데서 겪어 온 어려움을 잘 보여 준다. 자기 이익 풀을 지키려는 기업들은, 그럴 만도 하지만, 빠져나갈 길을 찾아낸다.\n\n이번 주에 그런 대화들과 나란히 놓고 보기에 흥미로웠던 것이 CMMI ACCESS Model을 둘러싼 논의였다. 기술 기반 케어의 도입과 그에 딸린 새로운 이익 풀을 장려해 의료비를 낮추도록 설계된 것처럼 보이는 또 하나의 프로그램이다. 지난주 뉴스레터에서 언급했듯이, CMMI가 발표한 ACCESS 지불 요율은 업계의 많은 이들이 예상한 것보다 낮았다.\n\n이번 주에 CMMI의 Chief AI & Technology Officer인 Jacob Shiff와 이 모델에 대해 이야기 나눈 것이 정말 도움이 됐다. 아래 YouTube에서 들을 수 있다(Spotify나 Apple에서도 가능하다).\n\nUnpacking the ACCESS Model | Jacob Shiff (CMMI)\n\nJacob이 그리는 비전을 들어 보면, ACCESS는 Medicare 인구의 넓은 층에게 고품질이면서 비용 효율적인 케어에 대한 접근성을 개선하려는 것으로 보인다. 기술을 활용해 의료를 더 나은 재정 궤도에 올려놓으려는 행정부의 더 큰 노력과도 맞닿아 있다.\n\nACCESS가 성공한다면 참여자들에게 연간 수십억 달러 매출의 새로운 이익 풀도 만들어 줄 것이다. 창업자와 투자자가 노릴 만한 거대한 기회로 보인다. “AI가 케어 전달의 한계비용을 0으로 만들 것”이라고 보는 투자자·창업자 무리가 이 기회에 몰려들 것 같다. 나에게 가장 흥미로운 지점이 바로 이것이다. ACCESS는 더 많은 경쟁을 불러들이고 디지털 헬스 전체 시장을 키울 기회를 만들고 있다. 다만 오늘날 존재하는 것과는 근본적으로 다른 비용 구조 위에서다.\n\n요율은 의료비에 디플레이션 효과를 내도록 의도적으로 낮게 설정된 것으로 보인다. 이 요율은 만성질환 관리를 위한 이전 세대 디지털 헬스 위에 쌓아 올리는 방식이 아니라, 접근법을 바닥부터 다시 생각해야 하는 비용 구조를 요구할 것이다. 전통적 접근법의 인건비는 여기서 셈이 맞기에는 너무 높다. 필연적으로 이 긴장은 참여 기업이 제공하는 케어의 안전성과 품질에 대한 합리적인 질문을 부를 것이고, 기존 업계는 더 기술 중심적인 접근에 반발할 것이다. 일자리를 위태롭게 하는 문제인 만큼 중요하면서도 매우 정치적인 성격을 띤 사안으로 보인다. CMMI가 이 프로그램의 일부로 참여자에 대해 보고하는 성과 데이터를 지켜볼 가치가 있겠다. NSA 절차에서 보고 있듯이, 데이터가 보이면 사람들이 프로그램 성과에 무슨 일이 벌어지고 있는지 이해하는 데 도움이 된다.\n\n궁극적으로 규제 당국이 의료비를 낮추고 경쟁을 촉진하며 시장의 투명성을 높이려고 이렇게 시도를 한다는 건 좋은 일로 보인다. 이런 노력이 맞닥뜨리는 어려움은 꽤 분명해 보이고, 이전 시도들이 어떤 지표가 된다면 이는 험난한 오르막 싸움이다. 의료의 이익 풀은 시간이 지나도 꽤나 회복력이 강하다는 것이 증명됐고, 그것을 줄이는 일은 어렵다. ACCESS가 기술 기반 케어를 위한 새로운 이익 풀을 만들면서 동시에 전체 비용도 낮추는 데 성공하려면, 생태계의 다른 어딘가에서 이익을 줄여야 한다.\n\n여기서 성공을 어렵게 만드는 장애물이 여럿 있는 건 분명하다. 모델 인지도부터 업계의 반발, 특정 모델 조정에 대한 의문까지 말이다. 이런 노력이 대개 그렇다. 하지만 새로운 시도로서의 ACCESS에 대해 나는 날이 갈수록 더 흥미를 느끼고 있다."},{"heading_en":"Public Markets","body":"이번 주는 실적 발표가 비교적 조용한 주였고, 훨씬 바쁜 다음 주(agilon, Alignment, Clover, Evolent, Hims, Privia 등)를 앞두고 있다. 주요 내용 몇 가지는 다음과 같다."},{"heading_en":"Public Markets","body":"암 선별 검사 Galleri를 만드는 GRAIL은 금요일에 주가가 50% 폭락했다. 실적을 발표하면서 NHS와 진행해 온 대규모 연구의 1차 평가변수를 충족하지 못했다고 밝혔다. 경영진은 초기 단계 암을 더 많이 찾아내고 후기 단계 암 진단을 줄인 결과에 대해 여전히 낙관적인 어조를 유지했지만, 투자자들은 그럼에도 영국과 미국에서의 상업적 파장을 우려했다."},{"heading_en":"Public Markets","body":"Talkspace는 견실한 분기 실적을 발표했고 주가는 20% 넘게 올랐다. 소비자 중심 모델에서 B2B 헬스케어에 더 집중하는 모델로 전환하며 사업이 전환점을 도는 것으로 보인다. 2025년 매출은 2억 3,000만 달러로 2024년보다 22% 늘었고, 동시에 7%의 조정 EBITDA 마진을 달성했다. Talkspace는 2026년을 마칠 무렵 분기 조정 EBITDA 마진이 10%대 중반에 이를 것으로 예상한다. 실적 발표에서는 정신건강 분야의 AI 역량과, AI를 활용해 임상의의 도달 범위를 넓히는 방식을 강조했다. AI로 정신건강 지원이 필요한 사람이 더 많이 식별되면서 치료사 수요도 함께 늘 것이라는 기대다. 이번 분기 소비자 매출은 전체 매출의 약 6%에 그쳤는데, Talkspace가 지급자와 기업 채널을 우선하고 있기 때문이다."},{"heading_en":"Public Markets","body":"Community Health Systems는 실적 발표 후 소폭 올랐다. 매출은 추정치를 살짝 밑돌았지만 EPS는 상회했다. CHS는 2025년에 진행한 여러 매각의 마무리 단계에 있으며, 그로 인해 매출과 조정 EBITDA 모두 2025년 수준 아래로 줄어들 것이다. Martin이 Slack 대화에서 짚었듯이, 지금 헬스 시스템의 성과는 가진 쪽과 못 가진 쪽으로 나뉘는 느낌이다. 상장된 헬스 시스템 대부분은 가진 쪽에 있어 보이지만, CHS는 못 가진 쪽에서 운영해 온 것으로 보이며 거기서 벗어나기 위해 자산 기반의 규모를 적정하게 줄여 왔다. 계획한 매각이 끝나가는 만큼, 앞으로는 포트폴리오가 훨씬 나은 자리에 있기를 기대한다."},{"heading_en":"Quote of the Week","body":"Beckers는 Scripps Health가 2024년에 Medicare Advantage 시장에서 철수하기로 한 결정과, 그것이 조직에 재무적 배당을 안겨 온 과정에 대한 훌륭한 글을 실었다. 아래 Scripps CFO Brett Tande가 표현한 생각이 나에게는 흥미롭다. 요컨대 MA는 마진이 워낙 낮은 상품이라 거기서 돈을 벌 유일한 방법은 수직 통합뿐이라는 그의 관점이다.\n\n출처: Beckers에 인용된 Scripps CFO Brett Tande\n\n이 Medicare Advantage 전략 사례 연구에서 나를 사로잡는 것은 두 가지다.\n\n1. 환자 대부분을 MA에서 전통적 Medicare + Med Supp로 옮길 수 있었고 의미 있는 물량 감소는 없었다는 Scripps의 시각. 일련의 계약에서 7,500만 달러를 잃고 있는데 그 계약에서 빠져나와 환자를 새롭고 더 수익성 있는 계약으로 옮길 수 있는 상황이라면, 고민할 것도 없어 보인다.\n\n2. 불과 몇 주 전 JPMorgan에서 나는 Cleveland Clinic 경영진이 정반대 편에 서서, MA의 글로벌 캡 가입자를 2026년 4만 6,000명에서 2028년 12만 5,000명으로 늘리는 것에 대해 이야기하는 걸 들었다. 헬스 시스템이 MA에서 벌 돈이 없다는 것은 분명 결론이 난 문제가 아니다.\n\n말할 것도 없이, 헬스 시스템들이 MA를 다루는 방식에서 매우 갈라지는 두 전략이 작동하고 있는 것으로 보이며, 더 넓은 시장에도 흥미로운 함의가 있다."},{"heading_en":"Other Top Headlines","body":"진단 시장의 대형 M&A로, Danaher가 맥박산소측정 플랫폼 Masimo를 99억 달러에 인수한다고 발표했다. Masimo는 주당 180달러에 인수되는데, 코로나 시기 고점인 주당 약 300달러에서 크게 내려온 가격이다. 2025년 12월 Masimo의 투자자의 날 발표 자료가 이 사업의 상태를 잘 보여 준다. 매출 성장은 둔화돼 있었다. 시장을 선도하는 맥박산소측정 사업이 연 4~6% 성장을 만들고 나머지 사업이 몇 퍼센트를 더 보태는 구조이며, 전체 사업은 연 7~10% 성장을 목표로 하고 있다."},{"heading_en":"Other Top Headlines","body":"어려움을 겪고 있는 D2C 헬스케어 기업 Hims가 이번 주 큰 인수를 단행해 Eucalyptus를 최대 11억 5,000만 달러에 인수했다. Hims는 이번 움직임으로 국제 유통망을 사들이는 것으로 보인다. 호주와 몇몇 다른 시장에서 약 4억 5,000만 달러의 ARR과 77만 5,000명의 고객을 확보한다. 투자자 대상 자료는 Eucalyptus가 “수익성이 시야에 들어온” 상태로 운영되고 있다고 적었는데, 구체적으로는 아무것도 말하지 않으면서 수익성에 가까울지도 모른다는 암시를 주는 데 기막히게 잘 들어맞는 표현이다. SEC 제출 서류를 읽어 보면 여기 earnout 구조는 꽤 복잡해 보이지만, 요컨대 Hims는 클로징 시점에 현금 2억 4,000만 달러를 지급하고, 이후 18개월에 걸친 확정 이연 지급과 2029년까지 매출·EBITDA 마일스톤에 기반한 추가 earn-out 목표가 붙는다. Hims는 월요일에 실적을 발표하는데, 분명 흥미로운 자리가 될 것이다. 최근 몇 주 사이에는 개인 투자자 커뮤니티마저 Hims에 대해 다소 시들해진 듯 경영진에게 껄끄러운 질문을 던지고 있다. Hims 주가는 이번 주에 6% 더 내려 시가총액이 약 36억 달러에 그치는데, 2026년 예상 매출의 약 1.5배에 거래되고 있다는 뜻이다."},{"heading_en":"Other Top Headlines","body":"First Cressey Ventures가 네 번째 펀드인 4억 2,500만 달러 규모의 신규 펀드를 발표했다. Cigna, MedStar, OhioHealth가 이 펀드의 전략적 LP로 언급됐다. FCV는 펀드 I과 II가 같은 빈티지 대비 성과에서 전체 VC 펀드 상위 5%에 든다고 밝혔는데, 분명 인상적인 성과다. 그 문장에 펀드 III가 언급되지 않았다는 사실은 그 빈티지의 디지털 헬스 펀드 전반의 성과에 대해 많은 것을 말해 주는 듯하다. 펀드 III는 2022년 4월에 발표됐다."},{"heading_en":"Funding Announcements","body":"건강보험 플랜 운영을 위한 AI 플랫폼 Dafodil Health가 1,630만 달러를 조달했다. Flare Capital, LRVHealth, Maverick Ventures가 투자했다. Dafodil은 Multiplan/Claritev와 비슷한 모델을 만들고 있는 것으로 보이는데, Multiplan이 오랫동안 상당한 비판을 받아 온 “절감액 비율” 방식이 아닌 새로운 가격 책정 방식을 쓴다. 보도자료는 한 지급자 파트너가 Dafodil과 함께한 첫해에 벤더 수수료 절감만으로 400만 달러를 아꼈다고 밝혔다. 인상적인 절감 규모로 보이고, 그래서 오히려 Dafodil의 매출 모델이 궁금해진다. 그 모델이 사려 깊은 헬스케어 VC 여럿을 이 회사에 투자하도록 설득한 것은 분명하다."},{"heading_en":"Funding Announcements","body":"CMMI의 TEAM 모델에 초점을 맞춘 헬스 시스템용 상환 플랫폼 Rainfall Health가 1,500만 달러를 조달했다. Rainfall Health는 이번 자금이 병원들 사이에서 TEAM 모델에 대한 인지를 높이는 데 쓰일 것이라고 밝혔으며, 일부 헬스 시스템에는 최대 1억 달러의 영향이 있을 수 있다고 추정한다."},{"heading_en":"Chart of the Week","body":"Wakely의 백서가 2019년부터 2024년까지 Medicaid MCO의 수익성을 살펴봤다. 해당 기간 모든 연도에 재무 자료를 보고한 170개 건강보험 플랜의 NAIC 데이터를 바탕으로 했으며, 이들은 2023년 MCO 가입자의 63%를 차지했다.\n\n출처: Wakely\n\n그 지급자 집단 전체의 언더라이팅 마진이 2024년에 의미 있게 마이너스로 돌아선 것을 보는 건 놀랍다. 상장 지급자들이 모두 2026년을 Medicaid 수익성의 “바닥 해”로 이야기한다는 점을 염두에 두면, 아래 차트의 마진 수치는 적어도 몇 년 동안은 나아지지 않는다는 뜻으로 보인다."},{"heading_en":"What I'm Reading","body":"Clinical AI: Evidence and Policy Requirements for Scaling Adoption — PHTI\n\n고혈압과 정신건강 분야에서 AI 도입을 이끄는 방법에 대한 생각을 담은, 업계 세션에서 나온 좋은 글이다. 획기적인 내용은 없지만 임상 AI를 배치할 때 유용할 근거 기준, 성능 벤치마크 등에 대한 사고를 잘 정리했다."},{"heading_en":"What I'm Reading","body":"Navigating Cell And Gene Therapy Risk In Medicaid: Lessons From The States — Will Shrank, Bruce Greenstein, Hannah Katch\n\nHealth Affairs 기사로, Medicaid 프로그램이 세포·유전자 치료제와 관련해 겪을 가능성이 큰 어려움과, 주 정부가 이를 관리하도록 민간 부문 파트너가 도울 수 있는 기회를 설명한다."},{"heading_en":"What I'm Reading","body":"Primary care is in trouble. Doctors are banding together to increase market power — Karen Brown\n\n독립 1차 진료가 나아갈 길로서 Independent Practice Association의 장점을 다룬 흥미로운 글로, 매사추세츠 서부 Valley Medical Group의 경험에 초점을 맞춘다."},{"heading_en":"What I'm Reading","body":"Before You Cry ‘Fraud’: What DOGE’s Open-Source Medicaid Data Is (and Isn’t) — Jocelyn Guyer, Avi Herring, Laura Nolan\n\n지난 주말 공개된 Medicaid 데이터셋에 대한 유용한 관점. 데이터셋에 무엇이 들어 있는지, 전체 Medicaid 지출의 약 80%가 어떻게 여기에 빠져 있는지, 그리고 이 데이터에서 도출되고 있는 결론 중 일부가 왜 틀렸는지를 짚는다."},{"heading_en":"What I'm Reading","body":"Beyond Minnesota: Four Medicaid Services Vulnerable to Fraud and the Case for Stronger CMS Enforcement — Chris Medrano, Brian Blase\n\nParagon Institute 보고서로, 전국적으로 Medicaid에서 사기 위험이 높은 네 영역을 살펴본다. 가정·지역사회 기반 서비스, 응급 의료 이송, ABA 치료, 물질사용장애 치료다."},{"heading_en":"What I'm Reading","body":"‘We Don’t See Savings’: Indiana Medicaid Restructuring Bill Draws Pushback — Casey Smith\n\n이 기사는 Indiana Pathways 관리형 Medicaid 프로그램이 도입 과정에서 여러 난관을 겪은 것으로 보이는 상황을 조명한다. 현재 주 안에서는 절감을 위해 장기 요양시설 입소를 다시 FFS Medicaid로 되돌리는 법안을 두고 팽팽한 논쟁이 벌어지고 있다."},{"heading_en":"HTN Radio","body":"HTN radio에서 저희가 최근 나눈 논의들을 확인해 보세요.\n\nCMMI의 Jacob Shiff가 ACCESS 모델을 풀어내는 데 도움을 줬습니다."},{"heading_en":"HTN Radio","body":"Medicaid 기술 스택의 현황과, H.R.1으로 인한 자격·등록의 큰 변화에 대한 준비를 Fortuna Health CEO인 Nikita Singareddy, Better Government Lab의 펠로우 Luke Farrell과 함께 다뤘습니다."},{"heading_en":"HTN Radio","body":"Humana의 플로리다 의료 제공자 그룹 MaxHealth 인수와 그 밖의 소식을 다룬 이번 주 The Grand Round-Up."},{"heading_en":"HTN Radio","body":"Nest Health가 산전·산후 건강에 초점을 맞춘 새로운 사업 부문을 발표했고, HTN이 Chief Clinical Officer Kelsie Brandt를 초대해 자세한 내용을 들었습니다."}]},"18":{"index":"18","title_en":"Weekly Health Tech Reads 3/1/26","subtitle":"AI 파괴에 대한 단상, 쏟아진 VBC / MA 실적 발표, 비상장으로 가는 Enhabit, 어느 연구에서 고전한 ChatGPT Health, 그리고 더 많은 소식","sections":[{"heading_en":"","body":"👋 특이점 2026년의 3개월 차로 접어드는 지금, 일요일마다 전해 드리는 헬스케어 뉴스 정리에 오신 것을 환영한다. 이번 호는 헬스케어 이노베이션 업계의 또 한 번 분주했던 한 주를 다룬다. 여러 VBC / MA 기업의 4분기 실적 시즌이 마무리됐고, 헬스케어가 가장 아끼는 불평분자도 함께였다. 2027 Advance Notice를 두고는 실적 시즌 초반과 눈에 띄게 다른 반응들이 나왔다. Alignment CEO와 나눈 대화는 한번 확인해 볼 만하다고 생각한다. 이 회사의 임상 모델과 그것이 어떻게 MA에서 일관된 성과를 만들어 내는지에 대한 흥미로운 통찰이 담겨 있다. 마지막으로, 요즘 쏟아지는 AI 예측 글들을 그냥 지나치기가 어려워서, 어느 Dunkin' Donuts 홍보대사가 내놓은, 내가 제일 좋아하는 AI 사고 리더십 한 편을 공유하려 한다. 즐겁게 읽어 주시길!\n\n- Kevin"},{"heading_en":"Sponsored by: AscendRural","body":"CMS Rural Health Transformation(RHT) 프로그램은 각 주가 농촌 보건 시스템을 강화하는 방식을 새로 짜고 있으며, 헬스 테크 혁신 기업에게 새로운 기회를 만들어 내고 있다.\n\n주 정부 리더, health plan, 혁신 기업이 참여하는 AscendRural의 3부작 웨비나 시리즈에 함께하자. RHT가 어떻게 틀에서 현장의 임팩트로 옮겨 가는지, 그리고 확장 가능하고 농촌에 바로 적용할 수 있는 솔루션을 만들려면 무엇이 필요한지 살펴본다.\n\n- 2월 26일: RHT에 스타트업 참여시키기\n- 3월 5일: RHT를 뒷받침하는 health plan의 역할\n- 3월 12일: RHT에서의 주 정부 리더십\n\n무료로 등록하기\n\n뉴스레터 스폰서십에 관심이 있다면 알려 주세요!"},{"heading_en":"MUSING: Ben Affleck, the AI abundance / apocalypse, and healthcare","body":"AI 파괴를 둘러싼 시장 전반의 대화는 이번 주에 절정에 달한 느낌이었다. 주 초에는 Cintrini Research의 2028년발 리포트가 시장을 겁줬고, 이어 Jack Dorsey가 예상되는 AI 생산성 향상을 이유로 자기 회사 Block의 인력을 거의 절반 가까이 선제적으로 감축했다. 아니면 경영 실패 때문일지도 모르겠고. FOBO(Fear Of Being Obsolete)라는 말도 이제 생겼다고 한다. 그런데 그건 이미 몇 년째 커져 오고 있던 것이기도 하다.\n\nCintrini는 지금부터 2년 뒤, 우리가 본질적으로 덜 유쾌한 버전의 Wall-E 속 인간이 되어 있는 시나리오를 효과적으로 그려 낸다. 화이트칼라 일자리는 넘쳐나는 AI 에이전트로 대체되고, 그 에이전트들이 순식간에 일자리의 필요를 없애 버려, 아무도 주택담보대출을 감당할 수 없게 되면서 경제 붕괴가 촉발된다. 설상가상으로 우리 쓰레기를 치워 주는 그 귀여운 로봇은 Cintrini의 세계에는 없는 듯한데, 그건 좀 아쉽다.\n\n내가 보기에 Cintrini의 시나리오는 2028년의 현실을 반영하기보다는 좋은 SF 스릴러 소재가 될 가능성이 더 커 보인다. 다시 현실 세계로 돌아오면, Dunkin' Donuts 브랜드 홍보대사 Ben Affleck이 최근 하필이면 The Joe Rogan Show에서 AI에 대해 내가 들어 본 것 중 가장 흥미로운 관점 하나를 내놓았다. Affleck은 AI가 분명 많은 것을 바꾸겠지만 결국은 Hollywood 같은 산업에 생산성을 높여 주는 도구가 될 것이라고 주장했다. Citadel Securities도 여기에 가세해 Cintrini에 대한 훌륭한 반박문을 썼는데, Affleck과 비슷한 주장을 펴되 경제학자에게 기대할 법한 종류의 데이터로 뒷받침했다. 결론은 AI가 우리 경제가 마주한 역풍을 상쇄하고 GDP 성장률을 2% 안팎으로 유지하기에 딱 충분할지도 모른다는 것이다.\n\n이 대화는 몇 달 전 Financial Times가 만들어 여기저기 돌아다니고 있는 차트와도 비슷한 느낌이다. 여기서 논의되는 잠재적 결과의 범위가 기이할 정도로 넓다는 점을 보여 주는 차트다(FT 차트는 2025년 6월 Dallas Fed 포스트에 실린 차트를 양식화한 버전이다).\n\n출처: Financial Times가 이 Dallas Fed 포스트의 차트를 옮겨 표현한 것\n\n이번 주 대화에서 내가 가장 흥미로웠던 것은 Cintrini식 사고를 헬스케어에, 구체적으로는 2028년까지 이 산업의 노동 투입이 어떻게 바뀔지에 적용해 보는 일이었다.\n\n헬스케어 기업들이 Block식 구조조정을 거치며 'AI 네이티브' 조직이 되는 데 힘을 실으면서 엄청난 규모의 일자리 상실이 일어나는 시나리오는 상상하기 어렵지 않다. 지난 50년간 미국 헬스케어에서 만들어진 마찰을 관리하려고 존재해 온 백오피스 직무는 사실상 전부 자동화하기 딱 좋아 보이지 않는가? 그게 수십만 개인가? 수백만 개인가? 이건 케어 딜리버리와 임상 인력이라는 건드리기 힘든 주제는 꺼내기도 전의 이야기다. 그 사람들은 다 뭘 하게 될까? 사회 안전망 프로그램은 어떻게 굴러갈까? 여기서는 파멸론 시나리오가 아주 손에 잡히는 듯하다.\n\n그런데 동시에, 나는 불과 몇 주 전 이 뉴스레터에서 가장 최근의 고용 보고서에 대해 쓰고 있었다. 헬스케어 일자리가 경제에서 유일하게 꾸준히 늘고 있는 영역이라는 내용이었다. 그런 일이 벌어지는 동안 2025년 헬스케어의 최대 화두 중 하나는 health system들이 RCM 용도로 AI를 빠르게 도입한 것이었고, 그것이 재무 성과 초과 달성(그리고 payer의 부진)을 이끌고 있었다. 그렇다면 이미 일자리 감소의 증거가 보여야 하지 않나? 아니면 그 유명한 영상의학과 의사 사례는 어떤가. 실리콘밸리의 서사 속에서 놀라운 180도 전환을 겪은 직종이다. 10년 사이에 실리콘밸리는 영상의학과 의사를 가장 먼저 없어질 직종으로 보다가 이제는 Jevons Paradox의 대표 사례로 보게 된 듯하다. 영상의학과 의사들은 그 어느 때보다 잘나가는 것으로 보이니 말이다. 물론 그것이 Jevons Paradox의 증거가 아닐 수도 있지만.\n\n전부 아주 혼란스러운 뒤죽박죽이라 머리가 아프다. 한 가지 분명한 게 있다면, 앞으로 세상이 어떤 모습일지 씨름하는 전환의 시기에 우리가 놓여 있다는 것이다.\n\n2028년 헬스케어 고용 그림이 어떤 모습일지 여러분 생각이 궁금하다. 2028년 중반에 노동부 고용 보고서를 본다면, 헬스케어에서 일하는 사람이 지금보다 많아졌을 것 같은가, 적어졌을 것 같은가? 나는 이를 전체와 화이트칼라 대 블루칼라로 나눠 봤다. 그 모든 이동을 함께 따져 보는 게 의미 있다고 생각하기 때문이다. 2028년에 헬스케어 일자리 수는 오늘보다 늘어 있을까, 줄어 있을까?\n\n전체 증가: 화이트칼라·블루칼라 모두 증가\n\n전체 증가: 화이트칼라 증가, 블루칼라 감소\n\n전체 증가: 화이트칼라 감소, 블루칼라 증가\n\n전체 감소: 화이트칼라 증가, 블루칼라 감소\n\n전체 감소: 화이트칼라 감소, 블루칼라 증가\n\n전체 감소: 화이트칼라·블루칼라 모두 감소\n\n내 개인적인 직감: 헬스케어 일자리 총수는 늘어날 것이다. 화이트칼라 일자리가 다소 줄겠지만 블루칼라 일자리의 증가가 그것을 충분히 상쇄할 것이다. 달리 말하면… 나는 GDP 2% 성장 시나리오가 현실화되는 쪽이라고 보지만, 그 아래에서는 초자본주의 사회에서 커지는 불평등에 대한 어려운 질문들과 계속 씨름하게 될 것이다."},{"heading_en":"Public Markets Updates","body":"이번 주에는 실적 발표 이후 VBC / Medicare Advantage 시장에서 주가가 크게 출렁였다. 아래에서 주요 실적 발표의 핵심 내용을 짚어 보겠다."},{"heading_en":"Public Markets Updates","body":"Hims가 월요일에 실적을 발표했고, 주가는 한 주 동안 7% 더 떨어졌다. Hims는 지난 몇 주간의 GLP-1 중심 드라마 대부분을 비껴갔고, 대신 오늘날 자사 사업에서 compounded GLP-1이 차지하는 비중이 얼마나 작은지, 그리고 지금 처한 GLP-1 혼란에 대해 얼마나 개의치 않는지를 거듭 강조하는 데 공을 들였다. 해외 성장은 Hims 스토리의 중심축이 되어 가고 있다. 최근 인수들을 발판으로 상위 10개 해외 시장에서 빠르게 확장한 뒤, 그 시장들의 수익성은 나중에 챙기겠다는 계획을 밝혔다. 경영진의 서사를 믿는다면 여기에는 여전히 설득력 있는 이야기가 있다. 이들은 현재 각각 23억 달러와 3억 1,800만 달러인 매출과 조정 EBITDA를 2030년까지 연매출 65억 달러, 조정 EBITDA 13억 달러로 키우겠다고 전망한다. 이번 주에 Slack에 공유했듯이, 식별 정보를 다 지우고 매출 23억 달러에 전년 대비 59% 성장, 조정 EBITDA 마진 14%인 회사가 기업가치 38억 달러 언저리에 거래되고 있다고만 말해 준다면, 나는 훌륭한 투자처럼 보인다고 답할 것이다. 그런데 그 회사가 Hims이고, 최근의 온갖 소동을 겪고도 경영진이 실적 발표에서 SEC 조사를 받고 있다는 사실을 언급하지 않았다고 말해 준다면, 투자자들이 왜 회의적인지 아주 잘 이해가 간다."},{"heading_en":"Public Markets Updates","body":"Evolent는 강한 성장, 특히 종양학에서의 성장을 발표한 뒤 한 주 동안 25% 올랐다. 종양학 사업은 2026년 Evolent 매출의 65%를 차지할 것으로 예상되는데, 2025년에는 36%에 불과했다. Evolent는 신규 수주가 대단히 많아, 2026년 코호트가 9억 달러의 매출을 낼 것으로 보고 있다. 이전 추정치인 5억 5,000만 달러에서 올린 수치다. 이번 발표에는 Evolent의 접근법이 종양학에서 특히 효과적으로 작동하고 있다는 흥미로운 대목들이 있었다. 오늘날 하나의 종양 유형에 최대 200가지의 서로 다른 케어 경로가 존재할 수 있는 영역이다. ACA 사업은 2026년 Evolent 실적에 뚜렷한 부담 요인이다. 가장 큰 두 개의 거래소 고객이 가입자를 각각 60%, 40% 줄였기 때문이다. VBC, 특히 전문과목 VBC에 관심이 있다면 이 발표를 들어 보길 권한다."},{"heading_en":"Public Markets Updates","body":"agilon 주가는 2026년 조정 EBITDA 손익분기 달성 경로를 제시한 뒤 31% 올랐다. 2025년 거의 3억 달러에 달했던 손실에서 크게 개선된 것이다. 2025년 내내 대대적인 재계약 작업을 진행했는데, 수익성을 우선하는 자사 접근법과 맞지 않는 MA 가입자 약 5만 명을 떨어냈다는 점도 언급했다. agilon의 3대 고객은 Aetna, Humana, UHC이므로, 2026년에 그 나쁜 리스크를 누가 다시 떠안을지 생각해 보는 것도 흥미롭다."},{"heading_en":"Public Markets Updates","body":"Alignment Health는 목요일에 실적을 발표했는데, 모든 지표에서 가이던스 상단을 넘어섰음에도 주가는 이번 주에 약 6% 떨어졌다. Alignment는 어려운 MA 시장 전반의 역학에도 불구하고 계속 잘 실행해 내고 있으며, 그 바탕에는 health plan으로서의 케어 매니지먼트 접근법이 있다. 이렇게 일관된 성과를 감안하면 Alignment에 대한 질문은 결국 얼마나 빨리 성장할 수 있는가, 그리고 이 모델이 계속 통할 것인가다. 2027년은 Alignment에 매우 흥미로운 해가 될 것으로 보인다. 시장은 이 회사가 특히 California 밖에서 빠르면서도 수익성 있게 성장할 능력을 입증하기를 기대하고 있다. 금요일 오후에 Alignment CEO John Kao와 이야기를 나눌 기회가 있었는데(인터뷰는 아래 참조), 그는 California 밖에 IPA가 없다는 점이 오히려 그 시장들에서 성과를 내기 더 쉽게 만들어 줄 것이라는 견해를 밝혔다. 그 시장들에서의 Alignment 초기 성과도 이를 뒷받침하는 것으로 보인다. 이 2027년 성장 논의는 계속 지켜볼 만하겠다."},{"heading_en":"Public Markets Updates","body":"Clover 주가는 이번 주 크게 움직이지 않았다. 2025년 조정 EBITDA 흑자를 달성했고 2026년에는 순이익 흑자를 낼 것으로 전망한다고 밝혔다. 과장이 넘치던 SPAC 시절을 지나오면서 Clover는 점점 더 반대편 해안의 작은 Alignment 서사처럼 보인다. New Jersey에서 MA 플랜으로 성과를 내고 있는데, 그 시장에서 provider-sponsored plan이었던 이력 위에 세워진 것이다. 하지만 New Jersey 밖에서 그 기세를 이어 가는 데는 어려움을 겪었다. 2026년 53% 성장해 가입자 15만 3,000명이 됐지만, New Jersey가 Clover 가입자의 약 12만 7,000명을 차지한다. 눈에 띄는 가입자가 있는 유일한 다른 주는 Georgia로, 약 1만 명에서 약 2만 2,000명으로 늘었다. Clover의 기술 플랫폼 Counterpart Health는 여전히 서사의 일부이지만, 애널리스트가 '2026년 가이던스에 기여하느냐'고 묻는데 답이 '아니다'라면, Counterpart 모델이 공개적으로 발표된 지 거의 2년이 지난 지금 그 기회를 두고 크게 흥분하기는 어렵다."},{"heading_en":"Public Markets Updates","body":"Privia Health는 견조한 성과 행진을 이어 갔고 이번 주 주가가 약 10% 올랐다. Privia의 실적 발표는 비교적 특별할 게 없었고, 질문은 대체로 Privia가 여기서 어떻게 더 성장할 것인지에 집중됐다. Q&A에서는 Privia가 AI를 활용할 준비가 어떻게 되어 있는지, Evolent Care Partners 인수와 다른 시장에서 오는 성장 기회, 그리고 MA에서의 공동 리스크 부담에 대한 Privia의 접근법을 두고 흥미로운 대화가 오갔다."},{"heading_en":"Public Markets Updates","body":"GoodRx 주가는 2026년 매출 가이던스가 예상보다 낮아 18% 떨어졌다."},{"heading_en":"Public Markets Updates","body":"Teladoc 주가는 특히 BetterHelp 사업의 광범위한 역풍에도 견조한 분기 실적에 힘입어 15% 뛰었다."},{"heading_en":"Public Markets Updates","body":"이번 주 Slack에는 Option Care Health, Universal Health Services, Fresenius, Acadia Healthcare에 대한 업데이트도 썼다."},{"heading_en":"HTN Radio: An interview with Alignment's John Kao","body":"목요일 오후 Alignment 실적 발표에 이어 금요일에 John Kao와 이야기를 나눌 기회가 있었다. 대화는 Alignment의 임상 모델에 집중됐다. 프로바이더 네트워크와 어떻게 협업하는지, 그리고 Care Anywhere 모델을 통해 어떻게 방문형 랩어라운드 서비스를 제공하는지에 관한 것이다. Medicare Advantage 플랜을 문화적으로는 그 무엇보다 케어 딜리버리 조직에 가깝게 느껴지도록 규정하는 흥미로운 틀이다. 이 접근법의 매력은 쉽게 알 수 있고, 업계의 더 많은 곳이 이 방향으로 움직일지 지켜보고 싶다.\n\nAlignment Healthcare가 Medicare Advantage에서 거둔 성공 뒤에 있는 임상 모델 | John Kao\n\n링크: Apple | Spotify | YouTube"},{"heading_en":"Other episodes this week:","body":"경쟁과 더 나은 성과를 위해 ACO를 다시 설계하기 | Liz Fowler and Purva Rawal. ACO를 지원하기 위해 Fowler와 Rawal이 최근 내놓은 제안들에 관한 좋은 대화."},{"heading_en":"Other episodes this week:","body":"이중수급 인구를 위한 재택 케어의 설계와 전달 | Oren Shatken + Romanos Fessas. Martin이 Jukebox Health 경영진과 LTSS 인구를 위한 재택 개입에 대해 이야기를 나눴다."},{"heading_en":"Other episodes this week:","body":"The Grand Roundup: 2026년 2월 23일"},{"heading_en":"Other Top Headlines","body":"재택 의료 제공업체 Enhabit이 비상장 회사로 전환한다. PE 회사 Kinderhook Industries가 약 11억 달러에 인수한다. Enhabit은 2025년에 매출 10억 6,000만 달러, EBITDA 1억 700만 달러를 냈다. Enhabit은 2021년 Encompass에서 분사한 이후 상당한 역풍을 맞아 왔다. 수가 변화와 Medicare Advantage의 성장에 적응하는 데 어려움을 겪었다. 이 딜에 대한 애널리스트 논평이 여기 작동하는 역학을 잘 짚어 주는 것 같다 — Enhabit 주주와 Kinderhook 모두에게 괜찮은 윈윈이라는 것이다. Enhabit 주주는 단기적 이익을 얻고, Kinderhook 역시 앞으로 몇 년에 걸쳐 반등할 것으로 보이는 시장에서 장기적 상방을 확보한 듯하다."},{"heading_en":"Other Top Headlines","body":"DOJ가 Columbus에서의 계약 방식을 두고 OhioHealth를 제소하고 있다. DOJ는 OhioHealth의 계약 방식 때문에, 구체적으로는 anti-tiering / steering 조항과 all-or-nothing 계약의 사용 때문에 보험사가 대안적인 플랜 설계를 제시할 방법이 없다고 주장한다."},{"heading_en":"Other Top Headlines","body":"2027 Advance Notice에 대한 의견이 이번 주에 제출됐고, 많은 조직이 소셜 미디어에 자신들의 의견을 올렸다. 나는 아직 여러 건을 살펴보는 중이지만, Better Medicare Alliance의 의견서는 그 톤 때문에 한번 훑어볼 만해 보였다 — 프로그램 무결성과 관련한 일부 변화에는 지지를 표하면서도, 제안된 실효 성장률과 그것이 확정될 경우 수급자에게 미칠 부정적 영향에 대해서는 우려를 밝힌다."},{"heading_en":"Other Top Headlines","body":"CMS가 사기를 단속하기 위해 취할 새로운 조치들을 발표했다. 여기에는 최근 몇 달간 전국적 주목을 받아 온 프로그램 무결성과 사기 문제를 Minnesota주가 해결하는 동안 분기별 연방 지급금 2억 5,950만 달러를 유보하는 조치가 포함된다."},{"heading_en":"Other Top Headlines","body":"Allina Health의 Minneapolis Heart Institute와 Innovaccer가 Innovaccer의 Story Health 플랫폼을 이용해 환자를 위한 가상 심부전 프로그램을 출범하는 파트너십을 발표했다. CMMI의 새 ACCESS 모델이라는 맥락에서 이런 파트너십을 생각해 보면 흥미롭다. 내가 CMMI라면 딱 이런 유형의 파트너십이 발표되기를 바랄 것 같기 때문이다."},{"heading_en":"Other Top Headlines","body":"Oregon이 Medicaid의 어려운 비용 방정식과 계속 씨름하는 가운데, Providence Medical Group과 CareOregon이 2월 15일자로 Providence의 전문과목 클리닉 서비스로 보내는 의뢰를 중단하기로 합의했다. Portland 광역권 최대 Medicaid 플랜인 CareOregon은 가입자들이 여전히 케어를 받을 수 있을 것이라는 자신감을 표했다."},{"heading_en":"Funding Announcements","body":"VBC 인에이블먼트 플랫폼 Honest Health가 1억 4,000만 달러를 유치했다. NewSpring Healthcare가 라운드를 주도했고 Rubicon Founders, Oak HC/FT, Welsh Carson 등 헬스케어의 큰 이름들이 참여했다. Honest는 2021년 Buffalo, NY의 한 IPA와의 파트너십으로 시작하고 2022년 BCBS Michigan과의 파트너십으로 Michigan에 확장한 이후 몇 년간 비교적 조용했다. 보도자료를 보면 Honest의 초점이 PCP 중심 접근에서 health system 인에이블먼트 쪽으로 옮겨 가고 있는 것으로 보이며, 이는 지켜볼 만하다."},{"heading_en":"Funding Announcements","body":"뇌 건강을 위한 center-of-excellence 모델 Salma Health가 8,000만 달러를 유치했다. Mubadala Capital과 ARCH Venture Partners가 라운드를 주도했다. Salma는 우울증 치료를 위한 새로운 TMS 요법인 SAINT Neuromodulation System을 개발한 Magnus Medical과 관계가 있는 것으로 보인다. 이것이 Salma Health 클리닉이 제공하는 서비스의 핵심 구성 요소로 보인다. Salma는 현재 California에 네 곳의 클리닉을 두고 있으며 미국 전역으로 확장할 계획이다."},{"heading_en":"Funding Announcements","body":"프로바이더 진료소를 위한 행정 플랫폼 Third Way가 1,500만 달러를 유치했다. Health Velocity Capital이 라운드를 주도했다. Third Way는 합쳐서 연간 500만 명의 환자를 보는 진료소들을 지원하고 있으며, 프런트 오피스 행정 비용을 최대 40% 줄이고 환자 방문을 11% 늘리며 전화 대기 시간을 절반으로 줄이고 있다고 밝혔다. Astrana Health와 California 기반 MSO인 MedPoint Management가 앞서 Third Way에 750만 달러를 투자한 바 있다."},{"heading_en":"Funding Announcements","body":"복리후생 컨설턴트가 성과 좋은 health plan을 찾도록 돕는 플랫폼 Handl Health가 1,420만 달러를 유치했다. Arthur Ventures가 라운드를 주도했다. Handl은 쇼퍼블 시술에 대한 소비자 비용을 22% 줄였고, 지난 2년간 10억 달러의 헬스케어 지출에서 총 1억 1,300만 달러를 절감했다고 보고한다."},{"heading_en":"Funding Announcements","body":"재택 소아 치료 모델 Coral Care가 1,300만 달러를 유치했다. Haymaker Ventures가 라운드를 주도했다. Coral Care는 현재 400명이 넘는 OT, PT, SLP로 구성된 임상 네트워크를 갖추고 있다."},{"heading_en":"Funding Announcements","body":"인지 건강 평가를 위한 디지털 헬스 도구 BrainCheck가 1,300만 달러를 유치했다. Next Coast Ventures가 라운드를 주도했고 UPMC Enterprises와 S3 Ventures도 참여했다."},{"heading_en":"Funding Announcements","body":"Medicare를 위한 애드보커시 모델 Baba가 650만 달러를 유치했다. General Catalyst가 라운드를 주도했다. Baba는 최근 훨씬 큰 라운드를 발표한 또 다른 스타트업 Solace와 개념적으로 비슷하게 들린다. Baba의 웹사이트에 따르면 원격의료 의사가 초진을 통해 의학적 필요성을 확인한 뒤 환자를 애드보킷에게 인계한다."},{"heading_en":"Quote of the Week","body":"이번 주 실적 발표에서 더 흥미로웠던 요소 중 하나는 최근의 2027 Advance Notice를 대하는 agilon, Alignment, Clover의 톤 변화였다. 세 곳 모두 트렌드 숫자가 더 높았다면 좋았겠지만, 2027 Final Notice가 Advance Notice에서 크게 올라가지 않더라도 2027년 성과를 내기에 좋은 위치에 있다고 느낀다고 밝혔다.\n\nClover CEO Andrew Toy가 애널리스트 Q&A에서 이를 표현한 방식은 이렇다:\n\n…Advance Notice에 대해 말씀드리자면, 논평에서 말씀드린 대로 트렌드를 기준으로 볼 때 저희는 그것이 사실 어느 정도 합리적인 트렌드라고 생각합니다. 업계가 더 높은 수준의 트렌드를 기대했다는 것은 알고 있고, CMS는 낭비와 남용을 걷어내고 더 최근의 데이터를 보는 등 여러 조치를 했습니다. 지금도 기회는 있다고 보고 레이트가 조금 위로 움직일 가능성도 있다고 보지만, 저희가 거기에 기대고 있는 것은 결코 아닙니다.\n\n그래서 높은 수준의 벤치마크 레이트에 대해서는, 아마 다른 곳들은 더 높은 레이트를 기대했겠지만, 저희는 그것이 꽤 단순명료하고 합리적이라고 봅니다.\n\n출처: Clover의 2025년 4분기 실적 발표에서 Clover CEO Andrew Toy\n\n이 발언들에 함축된 게임 이론이 나에게는 흥미롭다. CMS에게도, 여러 Medicare Advantage 플랜에게도 그렇다. 몇 주 전 대형 사업자들은 한목소리로 Advance Notice 레이트에 대한 실망을 표했다. 이제 Medicare Advantage 생태계의 작고 스타트업다운 '인서전트' 계층은 자신들의 모델이 레이트 인하로부터 스스로를 지켜 주기 때문에 그 레이트로도 괜찮을 것이라고 사실상 말하고 있다. 이는 변화로 인해 특별히 큰 영향을 받지는 않을 것이라고 시사하는 듯했던 대형 사업자들의 화법과 갈린다.\n\nCMS 지도부가 다른 자리(예: ACCESS)에서 시장 내 경쟁을 더 끌어내기 위해 '인서전트' 모델을 지원한다는 구상을 공개적으로 논해 온 점을 감안하면, 실적 시즌 동안 '인서전트' 그룹이 CMS의 변화에 덜 비판적으로 나온 것은 흥미롭다.\n\n물론, 투자자에게 내세울 유일한 서사가 Medicare Advantage에서의 성공인 소형 상장사라면 그것을 해낼 수 있다는 자신감을 표현해야만 한다. 하지만 당신이 CMS 지도부라면, 그 실적 발표에서 인용구를 잘라내며 '다들 뭘 그렇게 화내는 거지?'라고 말하고 있을 것 같다. 몇 주 뒤 Final Notice를 준비하는 지금, 또 하나의 흥미로운 데이터 포인트다."},{"heading_en":"What I'm Reading","body":"ChatGPT Health performance in a structured test of triage recommendations. Ashwin Ramaswamy 외\n\nMount Sinai 연구진이 Nature Medicine에 낸 글은 일련의 임상 증례에 ChatGPT Health가 어떻게 응답했는지를 두고 우려를 짚어 냈다. 일부 임상의는 그것이 '불필요한 위해와 사망으로 충분히 이어질 수 있다'고 걱정했다. 그 리스크가 있다는 건 분명하고, 그래도 내 아이가 독감인지 ChatGPT Health에 물어볼 때 그 점을 유념하겠다."},{"heading_en":"What I'm Reading","body":"AI, Equity, and the Workforce That Makes Whole-Person Care Possible. Janine Kundsen, Soshanah Brown\n\nHTN에 실린 이 게스트 기고는 세이프티넷 환경에서 AI 도입을 검토할 때 고려해야 할 인력 관련 사안들을 짚는다. 몇 주 전 Toyin Ajayi와 Andy Slavitt의 글 위에 얹히는, 이 대화에 대한 좋은 보탬이다."},{"heading_en":"What I'm Reading","body":"One Step Forward And One Step Back For US Health. Darshak Sanghavi, Jake Segal, Caroline Whistler\n\nARPA-H의 HEROS 프로그램에 대한 Health Affairs의 흥미로운 글이다. 연방 재정의 조류 변화로 끊겨 버린 흥미로운 성과 기반 모델의 또 하나의 사례다. 여기서 답이 무엇인지는 잘 모르겠지만, 이런 흥미로운 프로그램들이 시작과 중단을 반복하는 것은 진짜 난제로 보인다."},{"heading_en":"What I'm Reading","body":"Accountable Health Communities Model - Final Evaluation Report. RTI International\n\nCMMI가 Accountable Health Communities 모델의 최종 평가 보고서를 냈다. 요약본이 결과를 잘 개괄해 주는데, '건강의 상류 동인'에 집중하면 입원과 응급실 이용을 줄이면서 비용 절감으로도 이어질 수 있음을 시사한다."},{"heading_en":"What I'm Reading","body":"Issue 33: Evidence of Administrative Complexity: Health Insurance Claim Denials in Massachusetts. Massachusetts Health Policy Commission\n\nMassachusetts의 완전보험형 상업 health plan 데이터를 살펴본 결과, 2024년 보험사들이 상업 청구의 평균 20.4%를 거절한 것으로 나타났다."},{"heading_en":"What I'm Reading","body":"Infinite Healthcare: What's It Worth? Jay Rughani, Jane Rhee, Julie Yoo\n\na16z 팀이 임상 AI의 미래에 대해 어번던스 관점의 글을 썼다. 선제적 케어가 늘면 사후 대응적 케어가 줄어들고, 그 결과 '우리가 지금까지 만든 그 어떤 것보다 달러당 더 많은 건강'을 전달하는 개선된 헬스 시스템이 될 것이라는 주장이다. 나는 이 글의 일부에는 동의하지만, 이 전환을 거치면서 GDP 대비 헬스케어 지출 비중이 떨어질 것이라는 차트에는 이견을 제기하고 싶다. 나는 그 반대가 일어난다는 데 가볍게 걸겠다. 다만 전체 논지에 대해서는, 그 과정에서 쓴 돈당 더 많은 건강을 얻고 있는 한 그것은 여전히 좋은 일일 수 있다. 그 단서야말로 앞으로 몇 년간 업계에서 더 큰 논쟁거리 중 하나가 될 것으로 보인다 — 이 선제적 케어의 물결 중에서 실제로 달러당 더 나은 건강으로 이어지는 것은 얼마나 될까?"}]},"20":{"index":"20","title_en":"Weekly Health Tech Reads 3/8/26","subtitle":"다가오는 CGT의 물결에 대한 단상, 응급실 분쟁, Hims / Novo의 새로운 파트너십, AI 도입과 디플레이션적 지불에 대한 CMS의 시각, 그리고 그 밖의 소식","sections":[{"heading_en":"","body":"👋 이번 주 일요일 헬스케어 뉴스 정리에 오신 것을 환영합니다. 이번 주에 저는 태평양 북서부에서 벌어진 두 건의 응급실 분쟁을 둘러싼 서로 다른 이야기들에 푹 빠져 있었습니다. 또 주 Medicaid 기관들이 세포·유전자 치료제 도입을 어떻게 바라보고 있는지에 대한 대화를 나눈 뒤로 Cell and Gene Therapies가 계속 머릿속에 맴돌았습니다. 앞으로 10년간 이곳에서 거대한 주제가 될 것으로 보입니다. 그 밖의 짧은 소식들: OpenEvidence가 흥미로운 새 콘텐츠 파트너십을 발표했고, Klomp이 Better Medicare Alliance Policy Summit에서 연설했으며, Hims는 Novo와의 새로운 딜 소문이 나온 뒤 금요일 밤 40% 올랐습니다. 잠깐, 뭐라고요?!\n\n- Kevin"},{"heading_en":"MUSING: Startups and states preparing for the coming “tsunami” of pharma innovation","body":"몇 년 전, 저는 Cigna의 2024 Investor Presentation에서 아래 슬라이드를 봤던 기억이 있습니다. 앞으로 10년간 제약 혁신에서 그들이 보고 있는 거대한 기회를 강조한 슬라이드였습니다. y축이 없는 차트를 소개하려면 저에게는 상당한 결심이 필요하지만, 이 차트는 계속 기억에 남았습니다. GLP-1과 Cell and Gene Therapies(CGTs) 전반의 Rx 지출 증가에 힘입어 2024년에서 2034년 사이 총 케어 비용이 얼마나 늘어날 것이라고 신호를 보내고 있는지 보십시오:\n\n출처: Cigna 2024 Investor Presentation\n\n이 슬라이드는 앞으로 10년의 비즈니스 맥락을 깔끔하게 정리해 줍니다 — 우리는 제약 혁신, 그중에서도 특히 Cell and Gene Therapies에 대해 아주 많이 이야기하게 될 것입니다. 그 큰 이유 중 하나는 천문학적인 비용입니다 — 오늘날 시장에 나와 있는 CGT는 치료 한 건당 100만 달러에서 400만 달러 사이입니다.\n\n하지만 비즈니스 임팩트보다 더 중요한 것은, 여기서 사람들의 삶에 미칠 수 있는 긍정적 영향이 엄청나다는 점입니다. 2025년 12월 60 Minutes 보도는 이 약물의 물결이 이미 개인의 삶에 어떤 영향을 주고 있는지를 훌륭하게 보여 줍니다. 저는 그 영상을 보면서 눈물을 흘리지 않기가 어렵습니다 — 이 치료제들은 말 그대로 아이들의 생명을 구할 수 있습니다. 또한 이것이 마냥 좋기만 한 이야기는 아니라는 점도 짚어 둘 만합니다. 이런 종류의 이야기에는 곱씹어 볼 만한 미묘한 지점이 많습니다.\n\n60 Minutes 에피소드는 이 모든 것에 담긴 긴장을 잘 보여 줍니다. 미주리주의 직원 5,000명 규모 비영리 헬스 시스템 Mosaic Life Care의 CEO는 자가보험 플랜에 미칠 비용 부담 420만 달러 때문에, CGT 치료가 필요했던 한 직원의 쌍둥이에 대한 보장을 거절했습니다. 그 직원은 거절 사실을 공개했고, CEO는 살해 협박을 받기 시작했습니다. CEO는 주 Medicaid 기관에 호소했고, 그 기관이 치료 비용을 부담했습니다. 풀어낼 이야기가 정말 많습니다.\n\n이 일에서 놀라운 대목은, 생명을 구하는 이런 치료제가 시장에 겨우 몇 개밖에 없는 지금 이미 이런 이야기들이 나오고 있다는 것입니다. 이 약물들의 파이프라인은 어마어마합니다 — 오늘날 FDA 승인을 받은 것은 30개지만, 개발 중인 유전자 치료제는 4,000개입니다. Obamacare 설계자 Jonathan Gruber가 60 Minutes 클립에서 말했듯이: \"저는 이것을 다가오는 쓰나미에 비유합니다. 기본적으로 고용주 기반 헬스케어 시스템을 압도하게 될 것입니다.\"\n\n이 모든 것을 배경에 두고 보니, 주 Medicaid 기관들이 CGT를 도입하는 데 내재된 과제에 어떻게 접근하고 있는지 다룬 이 Health Affairs 기사가 무척 흥미로웠습니다. 놀랍지 않게도, 운영 인프라부터 페이어 역학, 이 약물을 전달할 임상 전문성, 실제 세계 아웃컴 추적에 이르기까지 복잡한 과정입니다. 저는 저자들에게 이야기를 나눠 보자고 청했고, Bruce Greenstein(Louisiana Department of Health의 Secretary)과 Will Shrank(Aradigm의 CEO)이 이번 주 초 아래 대화에 함께해 주었습니다:\n\nHow state Medicaid programs are preparing for cell and gene therapies\n\n😎 좋아하는 HTN Radio 채널에서 이 대화를 확인해 보세요: Spotify. Apple. YouTube.\n\nLouisiana 같은 주들이 다가올 치료제의 물결에 대비하기 위해 어떻게 앞서 나가고 있는지, 그리고 눈앞에 놓인 어려운 트레이드오프가 무엇인지 배우는 것이 꽤 유익했고, 저는 이 치료제들을 도입하는 데 얼마나 많은 인프라 변화가 필요한지를 충분히 이해하지 못하고 있었습니다. 자원 제약을 감안하면 민관 협력이 꽃필 만한 논리적인 자리로 보이며, 앞으로 몇 년간 이 영역이 어떻게 진화할지 지켜보는 것도 흥미로울 것입니다. Shrank의 스타트업 Aradigm은 CGT를 전달하는 데 얽힌 다양한 금융 및 케어 딜리버리 역학을 헤쳐 나가기 위한 카브아웃 모델을 만들고 있습니다. 그리고 바로 이번 주, 또 다른 스타트업 NexCure가 CAR-T 치료를 제공하는 클리닉 네트워크를 구축하기 위한 자금 조달을 발표했습니다. NexCure의 보도자료는 오늘날 미국 병원 중 CAR-T 치료를 시행할 수 있는 곳이 3%에 불과하다는 점을 언급하는데 — 6,100곳 중 200곳 — 앞으로 필요한 인프라 구축을 잘 보여 줍니다.\n\nCGT 시장에서 한 발 물러나 보면, 이 제약 붐의 함의를 곱씹어 보는 것도 흥미롭습니다. 우리는 이미 종양학 시장에서 그 모습이 어떨지 엿보고 있습니다. 그곳에서는 임상 아웃컴과 케어 비용이 제약에 의해 좌우됩니다. Cigna를 비롯한 이들의 예상이 맞다면 이것이 표준이 될 것이고, 이 나라 헬스케어의 접근성, 질, 부담 가능성에 광범위한 함의를 갖게 될 것입니다. 신경 쓰지 마세요, 이게 어떻게 흘러갈지 곱씹으면서 마지막에 iron triangle 이야기를 한 번 더 슬쩍 끼워 넣은 것뿐이니까요."},{"heading_en":"QUOTE OF THE WEEK: The CMS perspective on AI’s deflationary potential","body":"CMS 리더 Chris Klomp과 John Brooks는 MA Advance Notice에 달린 약 47,000건의 의견을 읽던 일을 잠시 멈추고, 화요일 Better Medicare Alliance Executive Policy Summit에서 업계를 향해 이야기했습니다. 가장 흥미로웠던 발언은, 헬스케어가 \"엄청나게 강력한 파괴적 기술을 가져다가 땅에 처박아 버리고 거기서 정확히 제로의 가치를 얻는\" 일이 벌어지지 않도록 CMS가 AI 활용을 어떻게 생각하고 있는지에 대한 것이었습니다.\n\n꽤 생생한 그림입니다. Klomp은 그런 운명을 피하려면 참이어야 할 세 가지를 제시했는데, 세 번째가 디플레이션적 지불 메커니즘이었습니다:\n\n우리에게는 디플레이션적 지불 메커니즘이 필요합니다. 지금 헬스케어의 대부분은 솔직히 말해 여전히 오리지널 Medicare 수가표와 벤치마크에 연동되어 있습니다. 이것들은 시간에 기반한 구성물이고, 상대가치단위를 사용했습니다. 우리는 거기에 환산지수를 곱합니다. 그게 우리가 지불하는 방식입니다.\n\n작년에 한 컨퍼런스에서 어떤 창업자가 저에게 다가왔습니다. 그들은 영상의학 분야에서 정말 흥미로운 AI 기술을 만들었고 이렇게 말했습니다. 저기요, 저희는 이 CPT 코드로 청구하려고 하는데요. 의견을 좀 듣고 싶습니다. 이건 15 단위 증분으로 청구됩니다. 저희가 시간 두 단위를 청구해도 될까요? 저는 이렇게 답했습니다. 만약 그렇게 하기로 결정한다면 저는 일부러라도 그 코드를 없애 버릴 겁니다. 그건 우리가 원하는 것과 정확히 반대되는 일이니까요. AI는 사이클로 사고합니다. 토큰을 씁니다. 우리는 그것을 시간으로 생각하지 않습니다. 그게 CMMI의 동료들이 씨름하고 있는 일입니다.\n\n- Chris Klomp, Better Medicare Alliance Policy Summit에서\n\n전체 발언을 들어 볼 가치가 있지만, 특히 저 대목이 눈에 띄었습니다. 지금 CMS 리더십이 지불 수준과 이익 풀을 어떻게 생각하고 있는지에 대해 거기서 추론해 낼 수 있는 것이 많아 보입니다.\n\n그 입장과 혁신·경쟁을 지원하는 것 사이의 긴장은 분명합니다 — Kintsugi의 최근 포스트모템이 짚었듯이, 규제 자본 요건은 높은 반면 AI 기술에 투자하는 벤처 투자자들은 OpenEvidence 같은 매출 성장 차트를 기대합니다. CMS 리더십은 그 수수께끼를 푸는 데 내재된 어려움을 잘 알고 있는 듯하고, 저는 그들이 이를 계속 어떻게 다뤄 나갈지 궁금합니다."},{"heading_en":"A NUMBER TO PONDER","body":"60억 달러\n\nCMS가 Elevance의 리스크 어저스트먼트 데이터 USB 드라이브 우편 발송에 마침내 질려 버린 탓에 이번 주 Elevance가 잃은 시가총액. 이런.\n\nCMS는 Elevance에 2026년 3월 31일 자로 45개 계약 전반의 신규 가입을 동결하는 제재 서한을 발부했습니다. 이 조치로 Elevance 주가는 주간 기준 약 8% 하락했고, 시가총액 약 60억 달러가 증발했습니다. 이 문제는 2018년까지 거슬러 올라가는 것으로 보이며, CMS는 최근인 2025년 10월까지도 계속되었다고 시사하는 반면 Elevance는 8-K에서 2023년에 관행을 바꿨다고 밝혔습니다. 그 불일치가 Elevance의 입장에 도움이 될지 해가 될지는 잘 모르겠지만, 어느 쪽이든 2027년 가입 시즌 전에 문제를 고칠 시간은 적어도 있을 것입니다."},{"heading_en":"CHART OF THE WEEK: Blue’s view into AI-driven upcoding coding intensity increases","body":"출처: Blue Health Intelligence Analysis\n\nBlue Health Intelligence는 병원에서의 AI 주도 코딩 인텐시티를 평가하기 위해 BCBS 상업 보험 입원 클레임을 분석했습니다. 위 차트는 코딩 인텐시티 증가가 주로 병원의 10%에 의해 주도되었음을 보여 줍니다. 위 그림에서 연한 파란색 선으로 표시된 그 10%의 병원은 2022년 2분기에서 2025년 1분기 사이 복합 입원 비율이 46.8%에서 59.8%로 늘어난 반면, 나머지 90%의 병원은 상대적으로 평탄했습니다."},{"heading_en":"NEWS: The drama of emergency departments in the Pacific Northwest","body":"오리건주 Eugene에서 Peace Health는 최근 응급실 서비스 계약을 지역 그룹에서 ApolloMD로 옮기려 했습니다. ApolloMD는 그 지역 그룹을 포함한 여러 곳과의 경쟁 RFP 과정을 거쳐 선정된 것으로 보입니다. 이는 지역 사회의 분노를 불러일으켰습니다. PeaceHealth가 지역 그룹에서 PE 자본을 받은 것으로 인식되는 전국 단위 회사로 옮기는 것을 좋아하지 않기 때문인데, ApolloMD 웹사이트는 자사가 의사 소유이며 외부 자본이 없다고 명시하고 있습니다.\n\n지역 PeaceHealth 프로바이더들은 최근 계약 변경을 이유로 리더십에 대한 불신임 투표를 했습니다. 이 모든 일은 인근의 다른 응급실이 최근 문을 닫으면서 이 응급실로 물량이 몰려들던 와중에 벌어졌습니다. PeaceHealth는 최근 몇 년간 현금을 계속 소진해 왔는데, 그 지역 시장이 마주한 어려움을 보여 줍니다. 그곳의 누구에게도 이길 수 없는 상황으로 보입니다.\n\n북동쪽으로 약 500마일 떨어진 아이다호주 Post Falls에서는 응급실을 무대로 아주 다른 이야기가 펼쳐지고 있습니다. 주 의회가 Nutex Health가 운영하는 응급실의 No Surprises Act IDR 프로세스 남용을 막기 위한 새 법안을 검토하고 있는 것입니다. BCBS Idaho는 작년에 Nutex Health가 IDR 프로세스에 클레임을 쏟아붓고 있다고 지적했습니다. 아이다호의 약 40개 응급실 가운데, BCBS는 Nutex가 운영하는 단 한 곳의 응급실에서 월 280건의 IDR 클레임을 받는 반면 나머지 39개 응급실은 다 합쳐 월 14건을 제출한다고 합니다. 한 예로 BCBS는 무릎 염좌에 대해 시장 가격이 $,700인데도 Nutex가 자사 응급실에서 8,588달러를 받으려 했다고 말합니다.\n\n상장된 마이크로 병원/독립형 응급실 운영사 Nutex Health는 No Surprises Act IDR 프로세스를 과도하고 수상쩍게 활용한다는 이유로 2024년 7월 공매도 리포트의 대상이 된 바 있습니다. Nutex는 목요일에 실적을 발표했는데, 5,500만 달러 규모의 중재 클레임이 자격 없음으로 판정되면서 매출이 큰 타격을 입어 주가가 한때 40% 하락했습니다. 그럼에도 IDR을 핵심 전략 지렛대로 쓰는 데 위축된 기색은 없어 보이며, 자사의 접근을 다윗과 골리앗의 싸움이라고 부르고 있습니다. Nutex는 스스로를 공정한 경쟁을 해치는 악랄한 보험사들에 맞서 싸우는 선한 힘으로 여깁니다. 이 모든 일이, Nutex가 Medicare 수가의 약 1,000%를 받으려 하는 경우가 잦아 보이는 와중에 벌어지고 있습니다.\n\nNutex는 헬스케어 혁신의 흥미로운 사례 연구입니다. 한 세트의 사실만 놓고 보면 여기에는 정말 설득력 있는 서사가 있습니다: 새로운 마이크로 병원 모델이 작은 시장들에 등장해 필요한 케어 접근점을 만들고 있고, 환자 리뷰는 5점 만점에 4.8점이며, 그러면서도 매출은 82% 성장하고 조정 EBITDA 마진 30%를 보고합니다. Rule of 110짜리 마이크로 병원에 투자할 수 있는데 누가 Rule of 40짜리 SaaS 사업에 투자하고 싶겠습니까?\n\n몬태나주의 일부 의원들도 적어도 그렇게 느끼는 듯합니다. 이 법안에 반대표를 던진 한 주 상원의원의 발언을 보십시오:\n\n\"시장에서 그걸 제공하고 싶고 그 가격을 낼 의향이 있는 소비자가 있다면, 그건 좋은 일입니다.\" Lenney가 말했다. \"저는 그들이 나쁜 행위자라고 생각하지 않습니다. 상원 본회의장에서 우리는 자본주의자라는 말을 들었는데, 정작 여기서 우리는 이 회사 하나를 문 닫게 하려 하고 있습니다. 우리가 지금 뭘 하고 있는 겁니까? 누군가 거기서 임신 테스트를 받고 싶다면, 마음껏 하게 두면 됩니다.\"\n\n출처: Idaho 주 상원의원 Brian Lenney, Idaho Statesman 인용\n\n거기서 표현된 견해는… 저에게는 당혹스럽다고 인정할 수밖에 없습니다. 특히 여기서 벌어지고 있는 것으로 보이는 일의 맥락을 감안하면 말이죠. 우선, 저 발언에서 저는 Lenney가 보험이라는 개념을 이해하고 있다는 인상을 받지 못했습니다 — 누군가 그에게 다른 사람이 Nutex에서 그 임신 테스트를 받고 싶어 한다는 이유로 당신이 헬스케어에 더 많은 돈을 내야 하느냐고 물었다면, 그는 다르게 답했을 것 같습니다.\n\n오해하지 마세요, 저도 자본주의를 전적으로 지지합니다. 하지만 나쁜 행동을 억제하는 효과적인 규제 틀을 마련할 수 있는 유능한 정치인이 있는 것도 중요하다고 생각합니다. Lenney의 반대에도 불구하고, 제안된 법안은 위원회를 통과해 전체 표결로 넘어갑니다."},{"heading_en":"From The Public Markets","body":"Bloomberg가 Hims가 이르면 월요일에 Novo Nordisk와의 파트너십을 발표해 Novo의 브랜드 체중 감량 약물을 판매할 것이라고 보도한 뒤, Hims 주가는 금요일 장 마감 후 40% 뛰었습니다. 이는 제가 지금까지 다룬 뉴스 중 가장 예상 밖의 것 축에 듭니다. 올해 초 Novo가 Hims를 상대로 소송을 제기했고 작년에는 기만적 마케팅을 했다고 비난했으며, 그 모든 일이 앞선 파트너십에서 발을 뺀 뒤에 벌어졌기 때문입니다. Novo가 계속해서 테이블로 돌아오고 있다는 사실은 Hims에 대한 강세 논리를 보여 주는 듯합니다."},{"heading_en":"From The Public Markets","body":"Omada는 목요일 장 마감 후 좋은 4분기 실적을 발표했고, 주가는 주간 기준 약 14% 올랐습니다. 2025년 매출은 2억 6,000만 달러로 전년 대비 53% 증가했습니다. 4분기에 순이익이 흑자로 전환했고, 연간 기준으로 조정 EBITDA 600만 달러를 창출했습니다. Omada는 2026년 매출이 22% 성장해 약 3억 1,700만 달러가 되고 조정 EBITDA는 약 1,100만 달러로 늘어날 것으로 예상합니다. Omada는 현재 GLP-1을 쓰는 멤버 15만 명을 지원하고 있으며 이는 2024년 말 5만 명에서 늘어난 수치라고 밝혔고, GLP-1 관련 상품을 계속 확대하고 있습니다. Omada는 새로운 GLP-1 상품이 2026년 가이던스에 포함되어 있지 않다고 언급했는데, 이는 여기서의 상방 시나리오를 암시하는 듯합니다."},{"heading_en":"From The Public Markets","body":"Ardent Health는 수요일 장 마감 후 실적을 발표했고, 2026년 조정 EBITDA 전망을 낮추면서 주가가 몇 퍼센트 하락했습니다. 2025년에 5억 4,500만 달러를 기록해 전년 대비 약 9% 성장한 뒤, Ardent는 2026년 전망을 4억 8,500만~5억 3,500만 달러로 하향하고 2027년에 성장으로 돌아설 것으로 보고 있습니다."},{"heading_en":"From The Public Markets","body":"Surgery Partners는 월요일에 실적을 발표했고, 실적 발표 후 주가가 약 20% 하락했다가 소폭 반등했습니다. 분기 매출은 추정치를 상회했지만, Surgery Partners는 2025년을 \"두 개의 반기 이야기\"라고 표현했습니다. 2025년 상반기의 상당한 모멘텀이 2025년 하반기에 역풍으로 바뀌었고, 4분기 마진은 이미 3분기에 하향 조정했던 전망치에도 미치지 못했습니다."},{"heading_en":"From The Public Markets","body":"Astrana는 월요일에 실적을 발표했고 주가는 30% 올랐습니다. Astrana는 MA 시장에서 조용히 꾸준한 성장을 이어 가며 2025년에 매출 32억 달러와 조정 EBITDA 2억 540만 달러를 창출했는데, 대부분 capitated 계약에 속한 회사로서 2025년 조정 EBITDA 마진 6.5%는 인상적입니다. Astrana는 2026년 가이던스 중간값을 매출 39억 5,000만 달러, 조정 EBITDA 2억 6,500만 달러로 제시하고 있습니다. 어려운 MA 환경 속에서 견고한 결과입니다. Astrana는 지난주 소규모 Medicare Advantage 플레이어들의 흐름을 이어 가며, 아무것도 바뀌지 않더라도 2027 Advance Notice와 관련해 자사가 놓인 위치에 대해 괜찮게 느끼고 있고 업계보다 덜 영향을 받을 것으로 예상한다고 밝혔습니다. 다시 한 번 짚어 둘 만한 점은, 작은 플레이어들이 모두 업계보다 덜 영향받을 것이라 예상하고 큰 플레이어들은 모두 업계 전반에 걸쳐 일관된 영향을 예상한다면, 누군가는 틀리게 되어 있다는 것입니다."},{"heading_en":"Other Top Headlines","body":"Bloomberg에 따르면, New Mountain Capital이 Thoreau, 그리고 다섯 개 헬스케어 AI 자산을 전 New Mountain Capital 파트너 Matt Holt에게 매각하려던 계획된 딜에서 손을 뗐습니다. Bloomberg는 New Mountain이 투자자들에게 보낸 서한을 인용해, Holt가 예정된 오퍼 마감을 놓치고 대신 여러 불확실성이 있는 더 낮은 오퍼를 제출했다고 전했습니다. New Mountain은 또한 해당 사업들의 상방 가능성에 대해 낙관적이며, 이 과정이 운영에 점점 부담이 되고 있다고 봤다고 밝혔습니다. 시장에서 가장 흥미로운 헬스케어 플랫폼 중 하나가 될 수도 있었던 것의 아쉽고 갑작스러운 종결이며, 어쩌면 지금 사모 시장의 불확실성을 보여 주는 신호이기도 합니다."},{"heading_en":"Other Top Headlines","body":"OpenEvidence가 이번 주 Wiley와 새로운 콘텐츠 파트너십을 발표했습니다. 저에게는 무척 흥미로운 딜입니다 — JPMorgan에서 OpenEvidence의 CEO Daniel Nadler는 OpenEvidence의 핵심 언락이, 지금까지 자사의 핵심 혁신을 AI Napster들로 가득한 시장 속의 Spotify로 본다는 데 있다고 말했습니다. 즉, OpenEvidence는 퍼블리셔들에게 돈을 지불하고 있다는 뜻입니다. Wiley는 이번 주 실적을 발표한 상장 기업으로, 실적 콜에서 이번 딜이 5년, 수백만 달러 규모의 계약이며 그 일부로 Wiley가 OpenEvidence의 지분을 받는다고 밝혔습니다. Wiley는 앞으로의 AI 전략에 대해 매우 강세로 보는 듯합니다."},{"heading_en":"Other Top Headlines","body":"고용주 베네핏 시장에서는 Quantum Health가 CirrusMD를 인수했습니다. Quantum의 최근 두 번째 인수인데 — 작년에 프로바이더 데이터 스타트업 Embold Health를 인수한 바 있습니다 — CirrusMD의 버추얼 케어 플랫폼을 더 넓은 고용주 내비게이션 상품에 더할 예정입니다. 지금이 고용주 시장에서 이런 종류의 상품을 스케일하기에 흥미로운 시점이라는 생각이 계속 듭니다."},{"heading_en":"Other Top Headlines","body":"DoseSpot과 Arrive Health가 합병해, e-프리스크라이빙 플랫폼과 베네핏 데이터를 결합해 약값에 대한 실시간 투명성을 제공합니다. Interra Health라는 이름의 합병 회사는 Fierce Healthcare에 따르면 2026년에 1억 달러의 매출을 내고 연 40% 성장할 것으로 예상됩니다. 여기서는 Bain Capital이 합병 자금을 대고 사업의 과반 지분을 갖습니다. PSG, Providence, UPMC Enterprises가 소수 투자자로 참여합니다."},{"heading_en":"Other Top Headlines","body":"TPG가 SDoH 플랫폼 FindHelp과 파트너십을 맺고, 임팩트 투자 펀드에서 2억 5,000만 달러를 이 사업에 투자했습니다. FindHelp에 2억 5,000만 달러를 투자했습니다. 보도자료는 FindHelp이 이제 Medicare와 Medicaid 베네핏 등록 검증을 지원한다고 시사하는데, 흥미로운 비즈니스 모델 확장으로 보입니다."},{"heading_en":"Other Top Headlines","body":"FDA가 컴파운딩 GLP-1의 불법 마케팅을 이유로 텔레헬스 기업 30곳에 경고 서한을 발부했습니다."},{"heading_en":"Funding Announcements","body":"치료사를 위한 MSO 성격의 플랫폼 Grow Therapy가 30억 달러 밸류에이션으로 1억 5,000만 달러를 조달했습니다. TCV와 Goldman Sachs Alternatives가 라운드를 주도했고, Bloomberg는 Grow Therapy가 현재 연 매출 10억 달러를 넘기고 있다고 전했습니다. 이 소식은 이런 사업에서 매출이 어떻게 잡히는지, 그리고 그중 몇 퍼센트가 Grow 네트워크의 프로바이더들에게 가고 얼마가 Grow에 남는지를 두고 Slack에서 흥미로운 대화를 촉발했습니다. Grow에 실제로 돌아가는 매출은 아마 그 숫자의 30% 미만일 것으로 보입니다."},{"heading_en":"Funding Announcements","body":"요양원/어시스티드 리빙을 위한 플랫폼 Sage가 6,500만 달러를 조달했습니다. Goldman Sachs Alternatives가 라운드를 주도했고 IVP와 Goldcrest가 참여했습니다. 웹사이트에 따르면 제품은 간호사 호출 기기, 낙상 관리 센서, 앱, 애널리틱스 플랫폼으로 구성됩니다."},{"heading_en":"Funding Announcements","body":"행동 건강을 위한 AI 운영 체제 Ease가 4,100만 달러를 조달했습니다. a16z가 라운드를 주도했습니다."},{"heading_en":"Funding Announcements","body":"헬스 시스템을 위한 텔레헬스 플랫폼 KeyCare가 2,740만 달러를 조달했습니다. Health X Ventures가 라운드를 주도했고, 여러 전략적 투자자가 함께했으며 Exact Sciences도 포함되었는데 눈에 띄는 이름이었습니다."},{"heading_en":"Funding Announcements","body":"NP가 이끄는 케어 모델 Greater Good Health가 2,050만 달러를 조달했습니다. Allumia Ventures가 라운드를 주도했습니다. Martin이 Greater Good 리더십 팀과 훌륭한 심층 대화를 나눴습니다."},{"heading_en":"Funding Announcements","body":"CAR-T 치료를 위한 외래 클리닉 모델 NexCure가 1,900만 달러를 조달했습니다. RA Capital이 NexCure를 인큐베이팅했고 라운드를 주도했으며, Cencora Ventures와 Oncology Ventures도 참여했습니다."},{"heading_en":"Funding Announcements","body":"케어 딜리버리 운영을 위한 에이전틱 AI 플랫폼 UnityAI가 850만 달러를 조달했습니다. Third Prime이 라운드를 주도했습니다. 보도자료는 UnityAI가 Tennessee Oncology와 Peregrine Health를 포함한 대형 전문 진료 그룹들과 함께 일하고 있다고 밝힙니다."},{"heading_en":"What I’m Reading: Addressing Social Needs Saves Money and Improves Health in Medicaid. Now Scale It.","body":"Mandy Cohen, Melinda Dutton 씀\n\nAccountable Health Communities와 Healthy Outcomes Pilots를 살펴보는 좋은 읽을거리로, 이런 상류의 필요를 충족하는 모델들을 스케일하는 것이 앞으로 Medicaid 인구를 지원하는 데 핵심적인 부분이라고 제안합니다."},{"heading_en":"What I’m Reading: Virtual Gastrointestinal Care Solutions","body":"PHTI 씀\n\nPHTI가 버추얼 GI 지형을 파고들어, 랩어라운드 솔루션(Cylinder, Digbi)과 임상의 주도 솔루션(Ayble, Oshi, Salvo)을 함께 평가합니다. 전반적으로 이 영역에서 버추얼 솔루션의 확대 도입에 대해 긍정적인 임상적·경제적 근거를 발견합니다."},{"heading_en":"What I’m Reading: Value-Based Payments Are Catching On, but Rural and Small Practices Lag","body":"Celli Horstman 씀\n\nCommonwealth Fund에 실린 짧은 읽을거리로, 2025년 PCP 설문 데이터를 바탕으로 1차 진료에서 밸류 기반 지불의 현주소를 다루며 농촌 지역 진료 기관이 다른 유형의 진료 기관보다 VBP 도입에서 뒤처져 있음을 짚습니다."},{"heading_en":"What I’m Reading: ACCESS: A Fix For Digital Health Companies, Not Medicare’s Costliest Patients","body":"Morish Shah, Graham Walker, Sudeep Bansal 씀\n\nCMMI의 ACCESS 모델에 대한 Health Affairs Forefront의 비판으로, 이 모델이 디지털 헬스 기업들에게는 재정적 생명줄이지만 복합적 인구에게는 상황을 더 나쁘게 만들 위험이 있다고 봅니다."},{"heading_en":"What I’m Reading: Will The New CMS ACO Model LEAD To Better Care For High-Need Medicare Beneficiaries?","body":"William Roberts, José Figueroa 씀\n\nCMMI의 LEAD 모델이 dual eligible 인구와 관련해 마주할 수 있는 어려움에 대한 Health Affairs Forefront의 관점으로, 이 모델이 REACH 모델에 있던 명시적인 형평성 기반 지불 조정을 없앴다는 점을 짚습니다."},{"heading_en":"More from Health Tech Nerds","body":"Weekly Health Policy Briefing 3/5/26."},{"heading_en":"More from Health Tech Nerds","body":"Community Brain Trust 3/4/26."},{"heading_en":"More from Health Tech Nerds","body":"Guest Post: AI, Equity, and the Workforce That Makes Whole-Person Care Possible."},{"heading_en":"More from Health Tech Nerds","body":"HTN Radio\n\n- The Grand Round Up, 3월 2일. Spotify. Apple. YouTube.\n\n- The clinical model behind Alignment Healthcare's success in Medicare Advantage | John Kao (Alignment Health). Spotify. Apple. YouTube.\n\n- How state Medicaid programs are preparing for cell and gene therapies | Bruce Greenstein (Louisiana DoH), Will Shrank (Aradigm). Spotify. Apple. YouTube.\n\n- Why preventative care is hard to finance and how Truemed is trying to fix it | Justin Mares (Truemed). Spotify. Apple."}]},"22":{"index":"22","title_en":"Weekly Health Tech Reads 3/15/26","subtitle":"UHS가 Talkspace를 인수하고, Hims와 Novo가 GLP-1을 두고 손을 잡고, Devoted의 임상 조직, AI 레드팀에 대한 단상, 그리고 그 밖의 소식","sections":[{"heading_en":"","body":"👋 이번 주 일요일 헬스케어 뉴스 정리에 오신 것을 환영합니다. UHS의 Talkspace 인수와 Hims / Novo 이야기의 최신 반전이 이번 주 대화의 가장 큰 주제였습니다. 4분기 실적 시즌은 끝났지만, 이번 주에는 은행 몇 곳이 컨퍼런스를 열었고 상장 페이어와 프로바이더 쪽에서 흥미로운 업데이트가 나왔습니다. 이번 주에는 사려 깊은 활용 사례를 가진 회사들의 흥미로운 AI 펀딩 라운드도 몇 건 있었습니다. 오늘 아침 미네소타의 창밖으로 눈이 쌓이는 것을 보면서, 저는 몇 해 전 로스쿨 1학년 불법행위법 수업과 그것이 AI 중심 세계에서 책임 문제에 갖는 의미를 잠시 곱씹어 보았습니다. 이보다 더 재미있는 게 있을까요? 자, 들어가 봅시다!\n\n- Kevin"},{"heading_en":"BIG NEWS","body":"UHS, 행동건강 분야 최신 합병으로 Talkspace를 약 8억 3,500만 달러에 인수\n\n병원 운영사 United Health Services는 외래 행동건강 사업을 키우기 위해 버추얼 행동건강 프로바이더 Talkspace를 주당 5.25달러, 약 8억 3,500만 달러에 인수한다고 발표했습니다. UHS는 월요일 아침 콜에서 외래 행동건강 부문의 성장이 원하는 만큼 빠르지 않았고, 그래서 이 분야에서 파트너십 논의를 진행해 왔다고 밝혔습니다. Talkspace가 매각 절차에 들어가자 UHS는 이를 훌륭한 궁합으로 보고 뛰어들었습니다. 합병 타임라인이 공시될 때 그 내용과 이 절차가 얼마나 경쟁적이었는지를 보는 것이 무척 흥미로울 것입니다.\n\nUHS는 관심을 이끈 Talkspace 사업의 핵심 요소 몇 가지를 짚었습니다. 첫째, 버추얼 서비스는 UHS에 스텝다운 경로를 제공하고, 그 반대도 마찬가지입니다. Talkspace의 회원 구성은 더 젊고 상업보험 비중이 높은 쪽으로 기울어 있습니다. 그리고 아마도 가장 중요한 것은, UHS가 Talkspace의 치료사 6,000명 네트워크를 얻는다는 점입니다. 이 치료사들이 Talkspace에 고용된 인력이 아니라는 점은 흥미로운데, UHS는 이를 자기 진료소를 직접 소유하고 있을 수도 있는 치료사들과 더 깊은 관계를 만들 기회로 보고 있습니다.\n\n정신건강 시장과 케어 딜리버리 전반에서의 M&A를 생각해 보면, 최고 수준의 프로바이더 그룹을 보유한 조직이 전략적으로 특히 유리한 위치에 있는 것으로 보입니다. 물론 계약 관계의 버추얼 치료사 집단이 최고 수준이라는 기준을 충족하는지는 조금 다른 질문으로 보입니다. 분명한 것은 UHS가 이 자산을 높게 평가한다는 점입니다. 결론은 그대로입니다. 제가 디지털 헬스 창업자라면, 최고 수준의 임상 팀을 구축하는 데 조직의 자원을 투자하고 그들을 뒷받침할 수익성 있는 페이어 계약을 찾겠습니다.\n\nTalkspace는 2026년 매출 약 2억 8,000만 달러, 조정 EBITDA 약 3,200만 달러를 전망하고 있었고, 이는 선행 매출 배수 3배, EBITDA 배수 26배를 뜻합니다. 몇 년 전만 해도 보유 현금보다 낮은 가치에 거래되던 사업치고는 꽤 괜찮은 결말로 보입니다. 아래 주가 차트는 Talkspace가 2021년 6월 SPAC을 통해 상장한 이후 걸어온 힘든 여정을 보여 줍니다. D2C 프로바이더에서 헬스케어 사업으로의 전환은 쉽지 않았지만, 코로나 버블 밸류에이션이 리셋된 이후에 Talkspace를 샀다면 그럭저럭 괜찮은 수익을 냈습니다. 지난 몇 년간 헬스케어 혁신 분야의 수많은 이야기를 잘 보여 주는 사례로 보입니다."},{"heading_en":"Other Top Headlines","body":"Hims와 Novo가 월요일에 새로운 파트너십을 공식 발표했습니다. Hims는 조제(compounded) GLP-1 제품을 광고하지 않기로 합의했지만, 보도자료의 표현은 환자들이 여전히 플랫폼을 통해 그 제품에 접근할 수 있다고 적고 있습니다. Novo는 이 과정의 일환으로 Hims를 상대로 한 소송을 취하하기로 했습니다. 이는 거의 1년 전 처음 파트너십을 발표했던 두 회사의 길고 지루한 여정의 최신 장인데, 그 파트너십은 몇 주 만에 Novo가 발을 빼고 Hims를 기만적 마케팅과 불법 대량 조제 혐의로 비난하면서 끝났습니다. 주가 흐름이 이야기를 대신 말해 줍니다. Novo의 태도 급변으로 Hims 주가는 약 52% 올랐고, Novo는 지난 한 달간 23% 내렸습니다. Hims에 대한 비판자는 여전히 많지만(현재 공매도 잔고 비율은 41% 근처를 맴돌고 있습니다), Hims에 대한 Hunterbrook 공매도 리포트의 저자가 이번 주 X에서 표현했듯 Hims는 이번에 Novo를 \"완전히 압도한\" 것으로 보입니다. Hims 브랜드와 유통 역량의 힘을 보여 주는 것은 분명해 보입니다."},{"heading_en":"Other Top Headlines","body":"Elsevier가 환자 인게이지먼트 플랫폼 Mytonomy를 인수했습니다. Mytonomy의 영상 기반 플랫폼은 Elsevier의 폭넓은 콘텐츠 역량을 강화할 것입니다. 보도자료는 앞으로 2~3년 안에 대부분의 환자가 온라인에서 스스로 자가진단을 하게 되면서 임상의들이 잘못된 정보를 우려하고 있다고 적고 있습니다. Mytonomy의 SaaS 서비스는 현재 70개 이상의 병원과 200개 이상의 클리닉에서 쓰이고 있습니다."},{"heading_en":"Other Top Headlines","body":"MedPAC의 매우 긴 연례 의회 보고서가 목요일 밤에 나왔습니다. 여러 내용 중에서도, 연방정부가 2026년에 Medicare Advantage 플랜에 지급할 6,150억 달러가 해당 가입자들이 fee-for-service Medicare에 있었다면 지급했을 금액보다 약 14% 높다는 점을 지적했습니다. 주된 원인은 유리한 선택(favorable selection)으로 인식되는 부분이고, 코딩이 이차적 요인입니다."},{"heading_en":"Other Top Headlines","body":"MUSC가 사우스캐롤라이나 최대 독립 프로바이더 그룹인 Palmetto Primary Care Physicians를 1억 1,100만 달러에 인수했습니다. MUSC 산하 비영리 법인이 될 PPCP는 40개 진료소에 의사 31명과 APP 95명을 두고 있습니다. PPCP는 앞서 2022년에 agilon과의 파트너십을 발표했는데, 당시 사우스캐롤라이나에서 풀리스크 VBC 모델로 전환한 첫 프라이머리 케어 그룹이라고 밝혔습니다. PPCP는 MUSC의 인수가 장기적 안정성을 보장하고 더 강력한 가치 기반 케어를 제공할 것이라고 밝혔는데, 이는 글로벌 캡 모델에서 v28이 불러온 재무적 우려를 에둘러 언급한 것으로 보입니다."},{"heading_en":"Other Top Headlines","body":"원격 모니터링 플랫폼 Cadence가 CMMI ACCESS 모델에 참여할 계획임을 확인했고, 참여 의사를 공개적으로 밝힌 첫 회사 중 하나가 되었습니다. Cadence가 이 모델을 활용해 사업의 AI 전환을 받아들이겠다고 말하는 대목이 흥미롭습니다. 월 1회 사람의 개입이 있는 전통적인 RPM 코드에서, 더 많은 작업을 AI 에이전트가 수행하는 이 모델로 옮겨 가게 됩니다."},{"heading_en":"Other Top Headlines","body":"Aetna가 Medicare Advantage 프로그램의 업코딩 혐의를 해소하기 위해 1억 1,770만 달러를 지급하기로 합의했습니다. 이 합의는 별개의 두 사안을 포함하는데, 1억 600만 달러는 2015년에 운영한 차트 리뷰 프로그램과 연결되어 있고, 1,150만 달러는 2018년에서 2013년 사이 고도비만 코드와 관련된 문제와 연결되어 있습니다. 두 번째 사안의 내부고발자는 200만 달러를 받게 됩니다."},{"heading_en":"Other Top Headlines","body":"BV Investment Partners가 임상 데이터 교환 플랫폼 Moxe Health의 경영권 지분을 인수했습니다."},{"heading_en":"A Number to Ponder","body":"~700\n\nDevoted Health의 Medical Group을 통해 케어를 제공하는 임상의 수로, Devoted가 조용히 상당한 규모의 메디컬 그룹을 구축해 온 것으로 보입니다. 프라이머리 케어 운영 직무에 대한 Devoted의 채용 공고는 이 700명에 가까운 임상의가 지난해 20만 건 이상의 진료를 제공했다고 적었는데, 계산해 보면 근무일 기준 하루 약 1.1건에 해당합니다. LinkedIn의 채용 공고들을 훑어보면 이 자리들 상당수가 풀타임 NP인 것으로 보입니다. Devoted는 채용 공고에서 5,000개의 AI 에이전트가 워크플로를 자동화하고 있다고도 밝혔습니다.\n\nAI가 케어 딜리버리를 더 효율적으로 만들고 있다면, 아직 Devoted의 데이터에는 그것이 드러나지 않는 것으로 보입니다. \"AI는 어디에나 있는데 고용 데이터에만 없다\"는 주제가 또 한 번 고개를 듭니다.\n\n그렇지만 Devoted Health의 채용 공고 47건을 훑어보면, Devoted에 대해 정말 흥미로운 그림이 그려집니다. 공고들을 읽어 보면 페이어라기보다 케어 딜리버리 조직처럼 읽히는데, 최근 다른 Medicare Advantage 신흥 주자들(Alignment, Clover 참조)에게서도 들어 온 주제입니다. Devoted의 직무들은 흔한 만성질환을 가진 회원에게 케어를 제공하기 위한 버추얼 센터 오브 엑설런스를 구축하는 방향으로 가고 있음을 시사하는 것으로 보입니다(이건 꽤나… ACCESS 비슷한 개념의 민간 페이어 버전처럼 느껴지지 않나요?).\n\n그래서 저는 머지않은 어느 시점에는 우리가 Devoted를 MA 플랜이 아니라 모든 사업 라인에 걸쳐 계약을 맺는 버추얼 헬스 시스템으로 이야기하게 되는 것은 아닐까 하는 생각이 듭니다. 일종의 버추얼 전국구 Kaiser 말이죠."},{"heading_en":"A MUSING","body":"Cardozo 판사, 레드팀, 그리고 새로운 AI 규제 프레임워크\n\n정기 독자라면 아마 놀라지 않으실 텐데, 저는 로스쿨 1학년을 꽤 즐겼던 몇 안 되는 별종 중 하나였습니다. 특별히 뛰어난 로스쿨 학생은 아니었지만 그래도 몇 가지 교훈은 제게 남았습니다. 적어도 저는 스스로에게 그렇게 말합니다. 잠시 추억 여행을 허락해 주세요. 불법행위법 수업으로 돌아가 봅니다.\n\n불법행위법에서 가장 흥미로운 판례 계열 중 하나는 1900년대 초의 제조물 책임에 관한 것이었습니다. 이제 전국의 건물에 이름이 걸려 있는 Benjamin Cardozo 판사는 산업혁명 이후 제조물 책임법을 다시 짜는 역할로 이 이야기에서 두드러지게 등장합니다.\n\n산업혁명은 사회에 큰 변화를 가져왔습니다. 법조계에서 특히 골치 아팠던 문제 하나가 제조물 책임이었습니다. 역사상 처음으로 기업이 제품을 대량 생산하고 유통할 수 있게 되었습니다. 이는 구매자와 판매자의 관계를 근본적으로 바꿔 놓았고, 판매 이후에 예견하지 못한 사정이 생겨 불법행위가 발생했을 때 책임을 어떻게 배분할지를 두고 법원들이 씨름하면서 수십 년간 혼란을 낳았습니다. 증기 보일러의 폭발, 원형 톱의 결함 있는 균형 바퀴, 잘못 표시된 독극물 병 같은 주제를 다룬 일련의 판례들이 모두 이 문제로 고전했습니다. 네, 로스쿨에서는 그런 것들을 이야기합니다. 전통적인 법리 프레임워크는 과실이 성립하려면 두 당사자가 서로 직접 계약, 즉 \"계약의 상호성(privity of contract)\"을 맺고 있어야 한다는 것이었습니다. 역사적으로 그 프레임워크는 말이 됐습니다. 대량 시장 상품이 없었고, 구매자와 판매자의 관계가 아주 달랐기 때문입니다.\n\n그때 Cardozo가 등장해 1916년 기념비적 판결인 MacPherson v. Buick에서 이 프레임워크를 뒤집었습니다. 이 사건은 Buick이 자동차 딜러를 통해 결함 있는 차를 과실로 판매한 건이었습니다. 구매자인 MacPherson 씨는 그 차 때문에 이후 부상을 입었습니다. Buick은 딜러와만 계약을 맺었을 뿐 그와는 계약하지 않았으므로 MacPherson 씨에게 책임이 없다고 주장했습니다. 이것이 \"계약의 상호성\" 책임이라는 옛 세계였습니다. Cardozo는 그것을 없애고, 두 당사자에게 직접 계약이 없었음에도 제품을 과실로 만든 데 대해 Buick이 MacPherson에게 책임을 진다고 판시했습니다. 한 세기 전의 이 판결은 지금도 제조물 책임의 바탕이 되고 있습니다.\n\n그 수업에서 얻은 교훈 중 하나는, Cardozo가 분명 똑똑한 사람이었고 지금은 법조계의 거인으로 여겨지지만 그 역시 적절한 시기에 등장한 덕을 봤다는 것입니다. 수십 년간 쌓인 앞선 판결들이 당시 프레임워크가 잘못됐다는 점을 이미 분명히 만들어 놓은 뒤였습니다. 달리 말하면, 그가 새로운 기준을 만들어 내려면 앞선 수십 년간 이상하게 결론 난 판례들을 먼저 봐야 했습니다. 혁신은 늘 그런 식으로 규제보다 앞서 있고, 기존 프레임워크의 결함을 드러내기 위해서라도 그래야만 합니다.\n\nAI 혁명의 시대로 들어서는 지난 몇 주 동안 저는 그 교훈을 많이 생각했습니다. 이 시대가 가져올 변화에 대응하려면 오늘날 진화하는 기술을 반영한 새로운 규제·법리 프레임워크가 필요합니다. 제 생각에 가장 흥미로운 프레임워크 전환은 환자와 프로바이더 관계의 변화, 구체적으로는 임상 케어를 제공하는 과정에서 사람과 AI가 맞물리는 방식에 있습니다.\n\n저는 한 AI 보안 회사가 Doctronic의 AI 챗봇에서 보안 취약점을 드러낸 일에 대한 최근 반응들에 매료돼 있었습니다. 다른 건 몰라도 Mindgard의 리포트는 AI 챗봇의 작동 방식을 흥미롭게 파고든 자료입니다. Doctronic AI가 크리올어로 답하게 만든 대목은 재미있었고, 오해를 부르는 SOAP 노트를 생성한 부분은 걱정스러웠습니다. 아마 가장 걱정스러운 부분은 Mindgard가 문제를 알린 뒤에도 Doctronic 지원팀이 이 모든 것에 별다른 대응을 하지 않은 것으로 보인다는 점입니다.\n\n하지만 소셜 미디어에서 본 이 리포트를 둘러싼 우려는 두 가지 측면에서 조금 과하다고 생각합니다.\n\n1. 이런 식으로 답하게 하려면 사용자가 Doctronic에 그 정보를 직접 입력해야 합니다. 저만 그런지 모르겠지만, 책임 이야기로 돌아가 보면, 알고서 소스 코드를 해킹하고 가짜 공식 공문서를 제공해 시스템을 의도적으로 오용했을 때 그것이 Doctronic의 책임인지는 잘 모르겠습니다.\n\n2. Doctronic의 유타주 파일럿은 잘 문서화돼 있지만, 제가 이해하기로는 일반에 공개된 챗봇은 \"Doctronic 1.0\"이고 유타에서 쓰이는 버전은 \"Doctronic 2.0\"입니다. 구체적인 내용은 모르겠지만, 예상할 수 있듯이 유타에서는 Mindgard가 접근한 공개 챗봇보다 훨씬 많은 안전장치가 마련돼 있는 것으로 보입니다. 그건 좋은 일로 보이고, Doctronic이 이것을 확대해 나가는 데 대해 더 신뢰를 갖게 합니다.\n\nDoctronic 사례에서 한 발 물러나 보면, 이 모든 것은 우리가 규제·법리 프레임워크가 아직 정리되지 않은 새로운 시대로 들어서고 있음을 드러냅니다. 지난 몇 달 사이 Prenuvo가 스캔을 잘못 해석했다는 이유로 제소되는 것을 봤습니다. 프로바이더들이 CMMI의 ACCESS 모델이 적은 대가와 맞바꿔 책임을 PCP에게 떠넘길 것이라고 말하는 것도 봤습니다. 주 정부들이 여기서 나아갈 길을 제안하기 시작하는 것도 봤는데, 뉴욕주는 AI 회사가 자사 챗봇에 대해 책임을 지도록 하는 법을 제안했습니다. 바로 지난주 Chris Klomp는 Better Medicare Alliance Executive Summit에서 헬스케어가 AI의 긍정적 효과를 보려면 새로운 규제 프레임워크가 필요하다고 말했습니다. 저도 그 말에 매우 동의합니다. 다만 개인적으로는 그것이 어떤 모습일지 아직 잘 모르겠습니다.\n\n제가 더 확신하는 것은, 이 AI 중심 세계에서 일이 잘못됐을 때 책임이 어떤 모습일지를 제대로 규정하는 일관된 새 규제 기준에 이르기까지 앞으로 몇 년간 더 많은 일이 잘못되어야 한다는 점입니다. 현대에 그 과정을 겪는 것은 정말 힘든 일이 될 것이고, 정당하든 아니든 그 과정에서 악당 몇몇이 만들어지는 것은 피할 수 없어 보입니다. 하지만 어느 시점에는 AI 혁명판 Benjamin Cardozo가 나타나 규칙을 다시 정의하고, 앞으로 우리를 더 나은 길에 올려놓을 것입니다.\n\n그때까지 우리는 때때로 일이 잘못되고 그 결과를 모두가 감당해야 하는 어수선한 시기를 지나게 될 것입니다. 이 AI 혁신의 시대는 거의 확실히 현대판 MacPherson 씨가 피해를 입는 불행한 현실을 수반할 것입니다. 그렇다고 \"해를 끼치지 말라\"는 우려 때문에 여기서 진보를 멈춰야 한다는 주장은, 최선의 의도에도 불구하고 의료 시스템이 지금도 여전히 사람들에게 해를 끼치기도 한다는 사실을 외면하는 것으로 보입니다. 제 불법행위법 수업이 제게 가르쳐 준 것이 있다면, 이것이 우리 모두에게 피할 수 없는 앞길이며 궁극적으로는 그것이 사회적으로 좋은 일이 되리라는 점입니다."},{"heading_en":"Public Markets Updates","body":"2025년 4분기 실적 시즌은 이제 지나갔지만, 이번 주에는 은행 컨퍼런스에서 헬스 플랜과 헬스 시스템의 발표가 여러 건 있었습니다. 이번 주에 제가 따라가며 챙겨 본 세션들에서 하나씩 짧게 정리한 내용을 플랜 / 프로바이더로 나눠 옮깁니다."},{"heading_en":"Public Markets Updates","body":"플랜(Plans):\n\nAlignment는 대형 플랜들이 계속 마진을 우선시하고 2026년에 크게 성장한 소규모 민간 / 비영리 플랜들이 문제를 겪게 되면서, 2027년에 성장할 좋은 기회가 있을 것으로 본다고 밝혔습니다. Advance Notice와 관련해서는, 차트 리뷰를 분리(de-linking)할 경우 일부 플랜이 6%의 요율 삭감을 겪을 수 있다는 최근 Wakely 리포트가 언급됐습니다. Kao는 또한 피부 대체재(skin substitutes) 산정 오류를 짚었는데, 이는 최종 고시에서 요율을 1.5~2% 끌어올릴 수 있습니다. 그러면서 그는 최종 고시가 전체적으로 4%까지 갈 수 있다고 보며, 이는 대다수가 예상하는 2~3%를 웃도는 수준이라고 말했습니다."},{"heading_en":"Public Markets Updates","body":"Centene은 ACA 회원 감소가 예상대로 진행되고 있으며 ACA 사업이 한 해 동안 40% 줄었다고 밝혔습니다. 업계 전반은 10%대 후반에서 30%대 중반 범위에 더 가깝습니다."},{"heading_en":"Public Markets Updates","body":"Clover Health는 AI 중심 모델의 강점을 다시 한 번 내세우며, 업계가 최종 요율 고시에서 2~5% 인상을 예상하고 있다고 언급했습니다. 어느 대목에서는 \"거의 제로에 가까운 요율 인상도… 환영한다. 그것이 우리 모델의 강점을 보여 줄 것이기 때문\"이라고 말했습니다. 최근 Martin과 이야기해 온 대로, 여기서의 게임 이론이 흥미롭습니다."},{"heading_en":"Public Markets Updates","body":"CVS의 발표는 꽤 단순했습니다. 새로운 소비자 대상 AI 이니셔티브인 Health 100을 설명하는 데 상당한 시간을 썼습니다. 저는 아직도 그게 뭔지 이해하지 못하겠지만, 조직은 그것에 들떠 있는 것으로 보입니다."},{"heading_en":"Public Markets Updates","body":"Elevance는 최근 CMS와의 문제를 데이터 전송 문제가 아니라 2023년 이전 리스크 조정 데이터에 관한 정책 문제로 본다고 밝혔습니다. ACA 쪽에서는 초기 가입 효력 발생 데이터가 예년과 비슷하게 흘러가고 있는데, 이는 업계가 예상해 온 것보다 이탈이 적을 것임을 시사합니다."},{"heading_en":"Public Markets Updates","body":"Humana는 앞으로 MA의 전반적인 요율 환경에 대응하기 위해 베네핏을 조정해야 할 것이라고 더 분명하게 밝혔고, 이는 Humana의 LTV 논리를 시험대에 올릴 것입니다. Humana는 의료비 관리와 더불어 LTV의 핵심 재무 동인 중 하나가 1년 차에서 2년 차로 넘어가며 회원 획득 비용이 줄어드는 것이라고 설명했습니다. 획득 비용은 1년 차 신규 회원당 1,000달러 이상에서 2년 차에는 약 500달러로 떨어집니다. 대략 계산해 보면 이 숫자 하나만으로 마진이 약 4% 개선된다는 뜻입니다."},{"heading_en":"Public Markets Updates","body":"UHG는 OptumHealth에서 마진이 -2%에서 최대 -11%에 이르는 VBC 계약들에서 철수하고 있다고 밝혔고, VBC 회원 규모를 적정화하는 것이 2027년으로 넘어가며 목표 마진으로 되돌아가려는 과정에서 순풍이 될 것이라고 했습니다."},{"heading_en":"Public Markets Updates","body":"프로바이더(Providers):\n\nHCA는 2026년 가입 해지에 따른 6억~9억 달러의 ACA 역풍을 이야기하는 데 시간을 썼고, 2026년은 예상 범위의 하단으로 들어오고 있다고 밝혔습니다. 또한 가정들이 보조금 없는 ACA 플랜의 재정적 영향을 감당해 나가면서 2027년에는 해지가 더 늘어날 수 있다고 언급했습니다."},{"heading_en":"Public Markets Updates","body":"Tenet은 전반적으로 계속 상당히 좋은 위치를 잡아 가고 있습니다. 사이트 뉴트럴 지불과, 병원 외래 수가가 동일해질 경우 ASC가 어떻게 계속 차별화할 것인지에 대한 흥미로운 Q&A가 있었습니다. Tenet은 사이트 뉴트럴 지불이 의미 있는 수준으로, 즉 복잡한 수술 케이스에까지 현실화되는 것에 대해 특별히 걱정하는 것으로 보이지는 않습니다."},{"heading_en":"Public Markets Updates","body":"agilon은 연간 트렌드 가정을 5%에서 6.5%로 상향한 뒤, 2025년의 고비용 회원(의료비 100만 달러 이상)에 대해 다시 이야기했습니다. agilon은 보통 이런 회원이 연간 2~3명 정도일 것으로 예상하는데, 결국 한 분기에만 2~3명이 나왔고 그중 한 환자는…."},{"heading_en":"Public Markets Updates","body":"Surgery Partners는 최근의 부진을 이끈 세 개 시장을 이야기했는데, 그중 하나는 다른 프로바이더들이 네트워크에서 빠지면서 Medicare Advantage 물량을 예상 밖으로 많이 가져가게 된 시장이었습니다. 그 결과 환자들이 이용할 수 있는 유일한 독립 수술 시설로 남게 되었고, 상업보험 물량을 희생하며 MA 회원이 몰려들었습니다."},{"heading_en":"Public Markets Updates","body":"Teladoc은 턴어라운드를 계속 실행해 나가며, BetterHelp 보험 사업의 성장 궤적에 대해 낙관을 나타냈고 이것이 결국 소비자 대상 사업의 감소를 상쇄할 것으로 보고 있습니다. BetterHelp는 회원의 80%가 비용 때문에 현금 결제 모델을 그만둔다고 밝혔는데, 보험이 그 수요를 끌어오는 데 도움이 될 것입니다. Teladoc은 미국 중심의 M&A가 계속될 것으로 예상합니다."},{"heading_en":"Funding Announcements","body":"AI 스크라이브 스타트업 Nabla와 깊은 관계를 가진 AI \"월드 모델\" 회사 AMI Labs가 프리머니 기업가치 35억 달러에 시드 라운드로 10억 3,000만 달러를 조달했습니다. Nabla는 12월에 양측이 독점 파트너십을 발표한 이후 AMI의 첫 파트너로 언급됩니다. AMI는 Nabla의 창업 투자자이자 어드바이저인 Yann LeCun이 설립했고, Nabla의 전 CEO였던 Alex LeBrun이 AMI의 CEO 자리로 옮겼습니다."},{"heading_en":"Funding Announcements","body":"진료소의 재무 관리를 돕는 AI 플랫폼 Nitra가 7,200만 달러 시리즈 B를 조달했습니다. 시리즈 B와 2,200만 달러 시리즈 A, 2,000만 달러 벤처 대출, 9,500만 달러 웨어하우스 시설을 합쳐 총 1억 8,700만 달러의 자금 조달을 발표했습니다. Nitra는 2025년 매출이 2024년 400만 달러에서 3,300만 달러로 늘었고, 2026년에는 1억 5,000만 달러의 \"연환산 매출\"을 낼 것으로 기대한다고 밝혔습니다. 현재 700개 클리닉과 일하고 있으며 2026년에는 고객사를 위해 40억 달러의 거래액을 처리할 것으로 예상하는데, 고객사는 안과, 피부과, 비뇨기과, 메드스파 시장의 전문 진료소들로 보입니다."},{"heading_en":"Funding Announcements","body":"병원 재무 부서를 위한 AI 에이전트 Translucent가 2,700만 달러를 조달했습니다. Google Ventures가 라운드를 주도했고, 이는 2025년 8월 시드 자금을 조달한 지 1년이 채 안 된 시점입니다. Translucent는 Northwestern Medicine과 Duly Health and Care를 포함한 고객사에 더 나은 재무 데이터를 제공해 병원이 마진을 개선하도록 돕고 있습니다. 병원을 지원하는 데 AI를 활용한, 아주 멋지고 표적화된 사례로 보입니다."},{"heading_en":"Funding Announcements","body":"임상 AI를 위한 \"디지털 레지던시\" Amigo AI가 1,100만 달러를 조달했습니다. Madrona가 라운드를 주도했습니다. Amigo는 Eucalptus, Diverge Health, the Care Clinic 등의 고객을 위해 300만 건의 환자 진료를 완료했다고 밝혔습니다. 이는 2025년 1월 General Catalyst가 주도한 시드 라운드 당시 전문가의 디지털 클론을 지향했던 것에서 살짝 방향을 튼 것으로 보입니다."},{"heading_en":"Funding Announcements","body":"Medicaid 대상 산모 케어 회사 Malama Health가 920만 달러를 조달했습니다. Acumen America가 라운드를 주도했습니다. 이번 라운드에는 230만 달러의 NIH 보조금과 100만 달러 이상의 캘리포니아 주 지원금이 포함돼 있습니다. Fierce Healthcare의 기사가 이 모델을 잘 정리해 줍니다. Malama의 모델은 둘라(doula)를 중심에 두고 있으며, 캘리포니아, 텍사스, 콜로라도의 Medicaid 플랜과 인네트워크로 계약돼 있고 VBC 계약으로 옮겨 갈 계획입니다. FQHC 및 커뮤니티 헬스 센터와 협력해 환자를 Malama의 프로그램으로 의뢰받습니다."},{"heading_en":"What I'm Reading: Healthcare Uses Specialized Language. It Needs Specialized AI, Too.","body":"Amber Nigam, John Glaser 씀\n\n헬스케어에서 대규모 언어 모델을 배포하는 일과 \"해를 끼치지 말라\"가 갖는 함의에 대한 흥미로운 논의입니다."},{"heading_en":"What I'm Reading: AI Won't Automatically Accelerate Clinical Trials","body":"Ruxandra Teslo 씀\n\n더 나은 약을 설계하고 치료의 풍요에 이르는 과정의 병목에 대한 좋은 관점입니다. 병목이 운영과 규제 문제에서 비롯되기 때문에 AI만으로는 임상시험 기간을 단축하기 어렵다는 점을 짚습니다."},{"heading_en":"This week on HTN","body":"Community Brain Trust: Hims와 Novo의 새 파트너십 발표, 멤버들이 나눈 CMMI ACCESS 웨비나 이야기, EHR 마이그레이션을 준비하는 방법 등."},{"heading_en":"This week on HTN","body":"Weekly Health Policy Briefing: MA 플랜을 둘러싼 초당적 내용, 근로 요건 시행 비용에 대한 사례 연구, 그리고 ACA 보험 투자자들의 예민함."},{"heading_en":"This week on HTN","body":"Health Tech Nerds Radio\n\n- The Grand Roundup: Novo-Hims 파트너십, UHS의 Talkspace 인수, OpenEvidence의 \"헬스케어의 Spotify\" 전략과 Wiley 파트너십, 그리고 아이다호의 마이크로 병원. Spotify, Apple, YouTube.\n- 의학적으로 복잡한 아동을 돌보는 일: PPEC이 필요한 이유 | Jeffrey Soffen (Spark Pediatrics). Spotify, Apple, YouTube.\n- 가치 기반 신장 케어의 진화: 정책, 치료, 지불 | Tim Fitzpatrick (Signals Group). Spotify, Apple, YouTube."}]},"24":{"index":"24","title_en":"Weekly Health Tech Reads 3/22/26","subtitle":"Sutter와 Allina의 LOI 체결, STAT에서 나온 Klomp의 발언, 프로바이더 코딩 인텐시티에 대한 Trilliant의 시각, 그리고 그 밖의 소식","sections":[{"heading_en":"","body":"👋 이번 주 일요일 헬스케어 뉴스 정리에 오신 것을 환영합니다. 주 초반에는 Sutter Health가 Allina Health를 인수하겠다는 LOI가 논의를 지배했고, 주 후반에는 STAT 서밋에서 나온 Klomp의 발언이 몇 주 뒤로 다가온 Final Notice를 앞두고 Medicare가 어디로 향하고 있는지에 대한 흥미로운 신호를 주었습니다. Trilliant는 AI와 맞물린 코딩 인텐시티 증가에 대해 유익하고 결이 섬세한 관점을 내놓았고, 저는 최근 North Carolina State Health Plan의 Tom Friedman과 나눈 대화를 되짚어 보며 시간을 보냈습니다. 자, 들어가 봅시다!\n\n- Kevin"},{"heading_en":"Sponsored by: Ursa Health","body":"지난 10년 동안 Ursa Health는 가장 폭넓게 사업을 펼친 value-based care 기업 몇 곳을 조용히 뒷받침해 왔습니다. 그중에서도 agilon health와 함께 만들어 낸 결과물은 특히 인상적입니다.\n\n30개가 넘는 full-risk 페이어 계약과 50만 명 이상의 MA 및 ACO 라이브스를 아우르는 상장사로서, agilon은 대단히 까다로운 데이터 환경에서 운영됩니다.\n\nUrsa는 agilon의 도메인 전문가들과 직접 붙어서 이 복잡성과 엄격한 검증을 감당할 수 있는 재무 데이터 파이프라인을 구축했고, 1퍼센트의 몇 분의 일 수준까지 좁힌 예측 정확도, 6개월 단축된 대규모 페이어 온보딩, 원본 페이어 파일에서 GL 반영이 가능한 산출물까지 이어지는 완전한 추적성을 달성했습니다.\n\n대규모 VBC 데이터 인프라를 고민하고 있다면, 이 케이스 스터디는 읽어 볼 만합니다.\n\n뉴스레터 스폰서십에 관심이 있으시면 알려 주세요!"},{"heading_en":"TOP NEWS: Sutter and Allina announce intent to merge","body":"California에 기반을 둔 Sutter Health가 Minnesota에 기반을 둔 Allina Health(제가 Health Tech Nerds를 시작하기 전 마지막으로 몸담았던 곳입니다!)와 합병하겠다는 의사를 발표했습니다. 양측은 LOI에 서명한 상태입니다. 합병이 승인되면 통합 시스템은 연간 약 250억 달러의 매출을 내고, California, Minnesota, Wisconsin에 걸쳐 39개 병원을 운영하게 됩니다.\n\nAllina Health는 지역 시장의 브랜드와 리더십을 유지하면서 \"Sutter Health's Upper Midwest Division\"이 됩니다. Sutter는 환자 접근성과 비용 부담 개선을 돕기 위해 Minnesota와 서부 Wisconsin에 20억 달러를 투자합니다.\n\nAllina를 \"Sutter Health's Upper Midwest Division\"이라고 부르는 명명법은 앞으로의 Sutter 확장 계획을 보여 주는 신호처럼 보이며, Sutter가 최근 M&A 리더를 영입한 것도 마찬가지입니다. 제 안의 Minnesota 사람은 Allina에 붙은 \"Upper Midwest\"라는 이름을 두고 한마디 하고 싶어집니다 — 이제 California, Minnesota, 서부 Wisconsin에서 병원을 운영하는 시스템인데, \"Midwest\" 앞에 방향을 가리키는 수식어가 정말 필요할까요?! 이 이름은 Sutter가 여기서 계획하고 있는 전략을 드러내는 단서라고 볼 수밖에 없습니다. 비교적 가까운 시일 안에 이런 움직임을 더 듣게 되지 않는다면 오히려 놀랄 것 같습니다.\n\n두 조직의 현재 상황을 감안하면 양쪽 경영진 모두에게 논리적인 선택으로 보입니다. Sutter는 전국구 헬스 시스템 경쟁에 뛰어들려는 야심을 구체화하기 시작했고, Allina는 Minnesota의 불확실한 헬스케어 환경에서 장기적인 안정성을 확보합니다. 헬스케어에서는 대체로 규모가 더 큰 쪽이 이기는 패로 보입니다. 그래서 헬스 시스템 간 교차 시장 합병이 사회적으로 어떤 가치를 갖는지, 이런 딜에 실질적인 시너지가 있기는 한지 같은 더 큰 질문들을 옆으로 치워 둔다면, 여기서의 전략적 논리는 저에게는 꽤 단순해 보입니다."},{"heading_en":"TOP HEADLINES","body":"Qualtrics와 Press Ganey의 합병은 무산된 것으로 보입니다. 은행들이 부채 시장에서의 AI에 대한 우려를 이유로 딜을 중단시켰습니다. 2025년 10월에는 Qualtrics가 고객 경험을 위한 더 넓은 AI 플랫폼을 만들기 위해 67억 5,000만 달러를 들여 Press Ganey를 인수한다고 발표한 바 있습니다."},{"heading_en":"TOP HEADLINES","body":"Providence가 자사 헬스 플랜인 Providence Health Plan의 매각을 검토하고 있습니다. Providence Health Plan은 ACA, 커머셜, Medicare, Medicaid 시장에 걸쳐 44만 명의 회원을 두고 있습니다. Providence의 CEO는 the Lund Report에 보낸 이메일에서 매각을 고려하는 여러 요인을 언급하며, 특히 \"처방 의약품 비용 상승, 가격을 감당 가능한 수준으로 유지해야 한다는 압박, 그리고 지속적으로 기술을 업그레이드해야 하는 필요성 때문에 소규모 플랜이 따라가기가 더 어려워지고 있다\"고 밝혔습니다. 현재 지역 헬스 플랜들이 처한 암울한 상황을 보여 주는 또 하나의 지표로 보입니다."},{"heading_en":"TOP HEADLINES","body":"Verily가 이번 주 3억 달러 규모의 펀딩을 발표하면서 Alphabet은 이 회사의 소수 투자자로 내려앉았습니다. Series X Capital이 라운드를 주도했고 Alphabet, UCHealth, University of Colorado Anschutz가 참여했습니다. Verily는 Alphabet이 이 사업을 더 이상 핵심 사업으로 보지 않기로 하면서, 수년간 Alphabet에서 분사하기 위해 노력해 온 것으로 전해집니다. Series X는 Alphabet이 자사의 X 프로젝트들을 독립 기업으로 전환하도록 돕기 위해 2024년에 출범한 곳으로, Alphabet과 밀접한 관계가 있습니다."},{"heading_en":"TOP HEADLINES","body":"The Seattle Times가 WISeR 프로그램이 Washington주에서 겪은 도입 초기의 난항을 1면 기사로 다루면서, 약을 받는 데 문제를 겪고 있는 한 사람의 사례를 통해 현실에서의 여파를 짚었습니다. 이 기사는 WISeR 모델에 대한 사실관계 일부를 틀리게 쓴 것으로 보이지만, 그럼에도 현재 사람들이 사전승인(prior auth)에 대해 갖고 있는 광범위한 불신, 그리고 그에 따른 WISeR의 정치적 어려움을 보여 주는 사례로 읽힙니다."},{"heading_en":"TOP HEADLINES","body":"Chartis가 AI 벤처 스튜디오인 Leap AI를 인수했습니다. Leap AI는 포트폴리오에 다섯 개 사업을 올려 두고 있으며, 그중 셋은 유전학, 롱제비티, 임상시험 영역에서 아직 스텔스 상태입니다. Chartis가 Leap AI 팀을 활용해 고객사를 위한 AI 솔루션을 개발하고 배포하려는, 일종의 애퀴하이어로 보입니다."},{"heading_en":"TOP HEADLINES","body":"MedArrive가 Inbound Health의 자산을 인수했다고 발표했습니다. Inbound는 앞서 자사의 hospital-at-home 모델 운영을 접었습니다."},{"heading_en":"TOP HEADLINES","body":"VBC 이네이블러인 Oasis Health Partners가 레비뉴 사이클 및 진료 운영 플랫폼인 Premier Health를 인수했습니다. 보도자료는 Oasis가 최근 PreferCare와의 파트너십을 통해 North Carolina로 사업을 확장했다는 점을 언급하고 있습니다."},{"heading_en":"CHART OF THE WEEK: Trilliant's exploration of hospital coding intensity","body":"Trilliant 팀이 헬스 시스템의 코딩 인텐시티 증가에서 AI가 하는 역할에 대해 사려 깊은 관점을 공유했습니다. AI 스크라이브를 도입한 여섯 개 헬스 시스템의 데이터를 살펴본 결과, 신규 환자와 기존 환자 모두에서 외래 E/M 방문의 인텐시티가 일관되게 상승하는 추세를 발견했습니다. 이 글은 그 배경에 있을 수 있는 여러 요인들을 잘 짚어 주고 있습니다. 아래 차트를 보시면 여러 헬스 시스템에 걸쳐 New Patient Visits의 코딩 인텐시티가 꾸준히 올라가는 모습을 확인할 수 있습니다.\n\n출처: Trilliant Health 블로그 포스트"},{"heading_en":"MY MUSING: A reflection on building trust in healthcare innovation","body":"지난주에 North Carolina State Health Plan의 Tom Friedman과 팟캐스트 에피소드를 녹음하면서, 이 플랜을 정상화하기 위해 진행 중인 노력에 대해 이야기를 나눌 기회가 있었습니다. North Carolina는 늘 이 나라에서 헬스케어 혁신의 흥미로운 실험장 역할을 해 왔는데, 여기에는 State Health Plan(SHP)이 적극적인 역할을 해 온 것도 한몫했습니다.\n\nFriedman과 동료들은 작년 말 Health Affairs Forefront에 이 플랜을 정상화하려는 노력을 정리한 글을 실었습니다. 이 플랜은 North Carolina에서 약 75만 명을 커버하고 있으며, 2027년 말까지 약 10억 달러의 적자가 예상되던 상황이었습니다. 이 노력의 여러 측면이 저에게는 흥미로운데, 그중 하나가 Clear Pricing Project를 접기로 한 결정입니다. 이는 참조가격(reference-based pricing) 모델을 통해 가격 투명성을 높이고 궁극적으로 시장의 비용을 낮추려던 이전 이니셔티브였습니다. Clear Pricing Project는 비용 절감을 노린 시도가 어떻게 의도와 정반대의 결과를 낳아 주(州) 내 헬스케어 비용을 오히려 올릴 수 있는지를 보여 주는 훌륭한 사례 연구였습니다(과거에 RBP 요율보다 낮게 지급받던 프로바이더들은 참여를 선택했고, 그렇지 않던 곳들은 참여할 이유가 없어 참여하지 않았기 때문에 결과적으로 비용이 올라갔습니다).\n\nFriedman과 SHP가 지금 펼치고 있는 핵심 노력 중 하나는 수술 진료의 능동적인 구매자(active purchaser)로 더 나서는 것이며, 구체적으로는 Lantern(이번 주에 펀딩 라운드를 발표했습니다)과 손잡고 특정 수술 유형에 대해 본인부담이 없는 번들을 제공하는 것입니다. 그 일환으로 SHP는 가입자들의 행동에 영향을 주어 더 저렴한 프로바이더로 볼륨을 유도하려 하고 있고, Novant Health도 여기에 합류했습니다.\n\nTom과 제가 나눈 주제 중 하나는, 이런 변화를 도입할 때 SHP 가입 직원들과 신뢰를 쌓아야 한다는 점이었습니다. 특히 SHP의 적자를 메우는 과정의 일부로 그 직원들의 보험료를 올린 뒤라면 더욱 그렇습니다. 그는 페이어들이 역사적으로 신뢰를 쌓는 데 그리 능하지 못했다는 점, 그리고 SHP가 이런 프로그램들을 펼쳐 나가는 데 신뢰 구축이 핵심이라는 점을 짚었습니다. 혁신 이니셔티브의 성공적인 도입을 이끄는 결정적 재료로서 흥미로운 프레이밍입니다. 신뢰를 쌓는다는 이 개념은 요즘 제가 나누는 대화 대부분에서 등장하는 것 같고, 어떤 헬스케어 시도에서든 핵심 요소로 느껴집니다.\n\n아래에서 전체 대화를 보시거나, Apple / Spotify에서 들으실 수 있습니다.\n\nHow North Carolina is fixing its $5.5B state employee health plan | Tom Friedman (State Health Plan)"},{"heading_en":"A QUOTE TO PONDER","body":"Medicare Director인 Chris Klomp가 이번 주 STAT의 Breakthrough Summit East에서 발언했습니다. Klomp의 발언 일부는 목요일 Bloomberg에 실렸는데, Medicare Advantage 프로그램이 비용을 충분히 관리하지 못하고 있다는 취지였습니다.\n\n같은 행사에서 STAT의 Mario Aguilar와 진행한 인터뷰에서 Medicare 수급자를 기본값으로 MA에 등록시키는 방안에 대해 한 다음 발언을, 그 헤드라인과 나란히 놓고 보면 무척 흥미롭습니다.\n\nKlomp: CMS에는 명시된 목표가 있고, 이는 트럼프 행정부보다, 바이든 행정부보다, 그 이전보다도 앞서는 것인데, 모든 수급자가 어카운터블한 관계 안에 있게 하는 것입니다. 우리는 왜 그것을 중요하게 여길까요? 방금 이야기한 대로, 어카운터블한 관계가 더 높은 품질 지표, 더 나은 임상 경험, 더 나은 임상 성과로 이어지기 때문입니다. 더 건강한 수급자, 더 건강한 환자를 뜻하니까요. 그렇다면 어카운터블한 관계로의 기본 선택, 즉 Medicare Shared Savings Program을 통한 ACO나 Director Sutton이 이끄는 Center for Medicare and Medicaid Innovation의 파생 혹은 후속 CMMI 모델로의 기본 선택을 보게 될 수 있을까요? 네. Medicare Advantage 등록을 통해서일 수도 있을까요? 네.\n\n제 생각에 그 둘 중 어느 쪽이든, 수급자와 환자, 그리고 그들의 프로바이더 사이에 이런 장기적이고 지속적인 관계가 없는 fee-for-service 방식으로의 기본 등록보다 더 나을까요? 네. 왜냐고요? 더 건강한 수급자를 보게 되기 때문입니다. 그건 좋은 일이죠.\n\nAguilar: 이번 행정부에서 그런 걸 보게 될 거라고 생각하십니까?\n\nKlomp: 저희가 검토하고 있는 사안입니다.\n\n출처: Mario Aguilar의 Chris Klomp 인터뷰\n\n지난 몇 달간 Klomp가 해 온 여러 발언을 이어 붙여 보면, 지금 CMS에서 나오는 흥미로운 공통의 실마리가 있다고 생각합니다. 가입자와 장기적이고 어카운터블한 관계를 장려한다는 이 발상이 현재 진행되는 큰 서사의 중심에 있는 것으로 보이며, 이는 대부분이 좋은 일이라고 동의할 만한 방향이라고 생각합니다.\n\n그래서 그 관계를 CMS가 이루려는 것의 중심 원칙으로 놓고, 동시에 Medicare Advantage 같은 프로그램이 납세자의 자원을 잘 관리하도록 보장하는 것을 함께 놓고 보면, 그 모든 발언들이 서로 잘 맞아떨어지는 것처럼 보입니다."},{"heading_en":"Funding Announcements","body":"전문 의약품 승인을 위한 AI 플랫폼 Latent가 6억 달러 밸류에이션에 8,000만 달러를 조달했습니다. Spark Capital과 Transformation Capital이 참여했습니다. 보도자료는 Latent가 헬스 시스템에서 인상적인 트랙션을 보이고 있다고 밝히고 있습니다 — Latent는 미국 상위 20개 시스템 중 절반을 포함해 45개 헬스 시스템을 고객으로 두고 있다고 합니다. Ochsner Health는 Latent와 협업하며 자사 전문 약국 사업에서 전년 대비 30% 성장을 기록했다고 보고했습니다."},{"heading_en":"Funding Announcements","body":"가격 투명성 플랫폼 Turquoise Health가 4,000만 달러를 조달했습니다. Oak HC/FT가 라운드를 주도했고, 이로써 누적 조달액은 1억 달러에 가까워졌습니다. Turquoise는 헬스케어 조직들을 위한 계약(contracting) 플랫폼이 되겠다는 야심을 갖고 있습니다. 회사는 선도적인 헬스 시스템, 페이어, 제약사, 보험 브로커를 포함해 280곳이 넘는 고객을 두고 있다고 밝혔습니다."},{"heading_en":"Funding Announcements","body":"고용주를 위한 수술 진료 네트워크 Lantern이 3,000만 달러를 조달했습니다. Morgan Health와 Echo Health Ventures가 라운드를 주도했습니다. Lantern이 실제 고객사에서 어떻게 도입되고 있는지 보고 싶다면 North Carolina State Health Plan의 Tom Friedman 인터뷰를 확인해 보세요."},{"heading_en":"Funding Announcements","body":"DME 플랫폼 Conduit Health가 1,700만 달러를 조달했습니다. Drive Capital이 라운드를 주도했습니다."},{"heading_en":"Funding Announcements","body":"산모 케어 모델 Nadia Care가 1,200만 달러를 조달했습니다. Valtruis가 이름을 밝히지 않은 전국 단위 페이어와 함께 라운드를 주도했습니다. 이전에 Cayaba Care로 알려졌던 Nadia는 DC, Maryland, Tennessee의 지역 Medicaid 플랜들과 일해 왔습니다."},{"heading_en":"What I'm Reading: CMS Proposes Its Best NBPP Yet","body":"Brian Blase 씀\n\nBlase는 이번 안이 자신이 본 것 중 최고의 Notice of Benefit and Payment Parameters라고 평가하며, 선택지 확대, 경쟁 강화, 지급 무결성(payment integrity) 개혁 등을 그 이유로 들었습니다."},{"heading_en":"What I'm Reading: What's Worse than a Ghost Network Plan? A No-Network Plan","body":"Sabrina Corlette, Jason Levitis, Lindsey Murtagh 씀\n\nGeorgetown CHIR의 연구진이 NBPP가 ACA 시장에서 네트워크 없는 플랜을 장려하는 것을 비판하며, 오늘날 이 나라 헬스케어의 현실을 무시하는 처사라고 주장합니다."},{"heading_en":"What I'm Reading: Doximity Study Finds Physicians Rapidly Adopting AI, But Accuracy Concerns Persist","body":"Doximity가 의사들의 AI 도입에 대해 자체 진행한 연구 결과를 공유했습니다. 획기적인 내용은 없지만, 의사들이 실제 진료에서 AI를 어떻게 쓰고 있는지에 대한 좋은 데이터 포인트들이 담겨 있습니다."},{"heading_en":"What I'm Reading: The Peptide Boom Is Getting Out of Hand","body":"Nicholas Florko 씀\n\n솔직히 말하면 저는 펩타이드에 그다지 관심을 두지 않았습니다. 그런데 이번 주에 눈길이 갔습니다. The Atlantic의 이 기사와 Martin Shkreli의 X 게시물 사이에서, 이 회색시장 펩타이드 열풍에 대한 논의가 얼마나 주류로 올라오게 될지 지켜보는 것이 흥미로울 것 같습니다."},{"heading_en":"HTN Content","body":"Community Brain Trust: 난임 치료 전달 방식의 변화, Walz 주지사의 Medicaid 개편안, 정신건강용 AI 도구 평가 등."},{"heading_en":"HTN Content","body":"Weekly Health Policy Briefing: MedPAC 권고안, 주 지정 지급(state-directed payments), 그리고 ESRD 번들 지급."},{"heading_en":"HTN Content","body":"특별한 의료적 요구가 있는 아동이 집에서 안전하게 보내는 날을 늘리기 | Taylor Beery, Imagine Pediatrics."},{"heading_en":"HTN Content","body":"Health Tech Nerds Radio\n\n- The Grand Roundup: Devoted Health의 전략, Doctronic과 AI 규제, DC의 MA 지출 논쟁 등. Apple. Spotify. YouTube.\n\n- How North Carolina is fixing its $5.5B state employee health plan | Tom Friedman (NC State Health Plan). Apple. Spotify. YouTube.\n\n- Why CMMI needs simpler models and better measurement | Ankit Patel (Percepta, ex-CMMI). Apple. Spotify. YouTube.\n\n- Medicaid is an underappreciated innovation lab | Dr. Chris Cogle (Florida Medicaid). Apple. Spotify. YouTube."}]},"26":{"index":"26","title_en":"Weekly Health Tech Reads 3/29/26","subtitle":"펩타이드 열풍에 대한 단상, 열두 건에 이르는 스타트업 펀딩 발표, 그리고 그 밖의 소식","sections":[{"heading_en":"","body":"👋 이번 주 일요일 헬스케어 뉴스 정리에 오신 것을 환영합니다. 2026년 1분기를 마무리하는 지금, 올해 헬스케어 혁신 논의를 지배하는 두 가지 흐름이 임상 진료에서의 AI와 롱제비티 모델이라는 점이 분명해졌습니다. 이번 주에는 두 가지 모두가 넘치도록 등장했고, 여기에 DOJ가 헬스 시스템을 제소한 일이나 프로바이더의 코딩 인텐시티 문제 같은 좀 더 전통적인 너드 주제들도 함께 나왔습니다. 이번 주에 발표된 스타트업 펀딩 라운드만 열두 건인데, 투자자들이 AI 닥터와 펩타이드 주사에서 보고 있는 거대한 기회를 보여 줍니다. 자, 들어가 봅시다!\n\n- Kevin\n\nPS. 다음 주 일요일은 부활절이라 쉬지만, 4월 6일 월요일에는 Martin과 함께 The Grand Round Up 라이브를 진행합니다. 그날은 이른바 2027 Final Notice 마감일이라, 이야기할 거리가 충분할 것 같습니다 🙂"},{"heading_en":"Catch The Grand Round Up LIVE, Tomorrow @ 12pm ET / 9am PT","body":"🚨 The Grand Round Up 라이브, 내일 미 동부시간 낮 12시 / 태평양시간 오전 9시\n\nMartin과 저는 The Grand Round Up에서 매주 헬스케어 뉴스를 정리하며 이야기 나누는 시간을 꽤 즐기고 있습니다. 요즘 헬스케어 혁신 세계에서 벌어지는 일이 워낙 많아서, 이렇게 글로 쓰는 형식에 더해 라이브로 다 함께 짚어 보는 것이 상당히 도움이 된다고 느끼고 있습니다.\n\n이번 주에는 대단한 펩타이드 논쟁, Martin이 연례 AHIP 컨퍼런스에서 느낀 점, 그리고 열두 건의 개별 펀딩 라운드 같은 주제를 다룹니다. 또 몇 분의 특별 게스트에게서 이야기를 들을 수 있게 되어 기대하고 있습니다.\n\n- Cityblock의 Co-Founder 겸 CEO인 Toyin Ajayi가 미 동부시간 12시 15분부터 12시 30분까지 Cityblock이 AI를 어떻게 도입하고 있는지 이야기합니다.\n- Stedi의 Founder 겸 CEO인 Zack Kanter가 미 동부시간 12시 35분부터 12시 50분까지 Stedi의 5,000만 달러 규모 시리즈 C와 클레임 클리어링하우스의 미래에 대해 이야기합니다.\n\n🎙️ 매주 월요일 미 동부시간 낮 12시 / 태평양시간 오전 9시, LinkedIn 또는 YouTube에서 라이브로 함께해 주세요."},{"heading_en":"Top Headlines","body":"DOJ가 최근 몇 달 사이 헬스 시스템을 상대로 두 번째 반독점 소송을 제기했습니다. 이번에는 뉴욕시의 New York Presbyterian을 상대로, all-or-nothing 조항과 anti-tiering / steering 계약 조항을 문제 삼았습니다. DOJ가 NYP를 상대로 어떤 논리를 펴는지, 그리고 NYP가 더 저렴한 보험 상품이 시장에 들어오는 것을 어떻게 막고 있다고 보는지 살펴볼 만한 소송입니다. 저만 그런지 몰라도, 뉴욕시 지도들의 조합과 더 낮은 가격을 제시하는 경쟁자 이야기, 그리고 NYP의 25% 시장 점유율에 대한 논의를 읽어 나가면서 이것이 특별히 강력한 반독점 사건이라는 느낌은 받지 못했습니다. 자신이 시장에서 고비용 상품이라는 것을 알고 있고, 바로 그 위치에 있는 것을 편안해하는 조직처럼 읽힙니다. DOJ의 소장은 NYP가 내부 분석을 진행해, 티어링이 도입되면 매년 수억 달러의 이익이 사라진다는 결과를 얻었다고 지적합니다. anti-tiering 조항과 all-or-nothing 계약이 소비자 가격을 낮추는 데 도움이 되지 않는 것은 분명합니다. 다만 그것이 주된 목표라면, 지금 놓여 있는 트레이드오프를 감안할 때 경쟁을 더 키우고 가격을 낮출 가능성이 더 높은 다른 길들이 있다고 생각합니다."},{"heading_en":"Top Headlines","body":"New York City Health + Hospitals가 Palantir와의 계약을 갱신하지 않기로 했습니다. ICE를 포함한 정부 고객을 지원하는 Palantir의 업무를 두고 정치적 반발이 일어난 데 따른 것입니다. NYC Health + Hospitals는 그동안 레비뉴 사이클 매니지먼트 지원을 위해 Palantir를 써 왔고, 2023년 이후 Palantir에 약 400만 달러를 지급한 것으로 보입니다."},{"heading_en":"Top Headlines","body":"컨설팅 업계에서는 Infosys가 Optimum Healthcare IT를 4억 6,500만 달러에 인수한다고 발표했습니다. Optimum은 2025년에 2억 7,600만 달러의 매출을 올렸는데, 2024년의 1억 700만 달러에서 늘어난 수치입니다. 흥미롭게도 Optimum 뒤에 있는 PE 회사는 지난 몇 년간의 성장 요인으로, 더 많은 인력을 업계로 끌어들인 도제식 교육 프로그램을 꼽습니다."},{"heading_en":"Top Headlines","body":"OpenEvidence가 \"의사들이 벌어들인 모든 돈을 빠짐없이 확보하도록 돕는다\"는 취지의 새로운 Coding Intelligence 상품을 출시했습니다. 핵심인 검색 상품을 넘어 좀 더 전통적인 RCM 기능으로 확장하는, OpenEvidence로서는 흥미로운 전략적 움직임으로 보입니다. 논리는 이해가 갑니다만, 그 기세가 경쟁이 치열한 RCM 시장에서 어떻게 이어질지는 궁금하기도 합니다. OE가 여기서의 사용량을 어떻게 발표할지 지켜보고 싶습니다."},{"heading_en":"Top Headlines","body":"고용주를 위한 대안적 플랜 설계인 XO Health가 전국으로 확장하고 있습니다. XO는 자가보험 고용주, level-funded 플랜, TPA를 대상으로 흥미로운 밸류 기반 케어 네트워크를 구축해 왔습니다. 지난 몇 년간 대안적 플랜 설계에 대해 이야기해 온 끝에, 이제 고용주들이 실제로 움직이기 시작하는 변곡점에 와 있다는 느낌입니다. 앞으로 몇 년간 이 영역이 어떻게 전개될지 지켜보면 흥미로울 것입니다."},{"heading_en":"Top Headlines","body":"Health Management Associates가 Medicaid에 특화된 애널리틱스 플랫폼 HealthTech Solutions를 인수한다고 발표했습니다."},{"heading_en":"MUSING: Should I be injecting myself with peptides?","body":"어린 시절 제가 자란 시대에, 제가 아는 한 몸에 뭔가를 주사하는 사람이라고는 야구의 강타자들, 마약 중독자들, 그리고 제1형 당뇨병을 앓던 친구뿐이었습니다. 수십 년이 지난 지금, 저는 갑자기 제 개인 펩타이드 공급책 노릇을 해 주는 롱제비티 클리닉 하나 없다는 이유로 촌사람이 된 기분입니다. 지난 1년간 펩타이드에 대한 관심이 어떻게 급등했는지 보여 주는, 목요일 Sherwood 기사의 차트를 보시죠.\n\n출처: Sherwood 기사, 2026년 3월 26일\n\n위 문단에서 눈치채셨겠지만, 저는 여기에 회의적입니다. 그런데 며칠 전 임상의 친구와 이야기하면서 펩타이드에 대한 의견을 물었습니다. 그의 의견이 절제된 낙관론이어서 조금 놀랐습니다. 지금의 회색 시장이 후미진 곳일 수는 있습니다. 하지만 동시에 염증을 억제하면 건강상 상당한 이득이 따른다는 일반적인 발상 자체에는 근거가 있다는 것입니다. 그의 전반적인 견해는, 10년 뒤에 우리가 펩타이드를 GLP-1과 같은 혁명적 잠재력을 가진 것으로 바라보게 될 가능성도 충분히 있다는 것이었습니다(GLP-1 자체도 펩타이드지만, 사람들이 흔히 \"펩타이드\"라고 말할 때 가리키는 회색 시장의 것들과는 다른 범주로 보이기는 합니다).\n\n저는 Martin Shkreli(그 파마 브로)와 Max Marchione(Superpower CEO)가 펩타이드의 유용성을 두고 벌인 30분짜리 TBPN 토론을 본 뒤, 월요일 오후의 상당 부분을 펩타이드 토끼굴을 파고드는 데 썼습니다. 이 주제에 관심이 있는데 아직 못 보셨다면, 시간을 들일 만합니다.\n\n제가 Shkreli를 이성의 목소리로 여기게 될 줄은 몰랐지만, 어쨌든 지금은 2026년이고 우리는 이상한 세상에 살고 있습니다. 저는 Shkreli가 내용상으로는 꽤 분명하게 토론에서 이겼다고 봅니다. 그러면서도 동시에, Marchione가 전투에서는 졌지만 결국 전쟁에서는 이기게 되는 것은 아닐까 하는 생각을 지울 수 없습니다. Superpower나 Hims 같은 회사들은 이 흐름에 올라타기 좋은 위치에 있는 것으로 보이고, 특히 다가오는 연방 차원의 규제 완화를 감안하면 더욱 그렇습니다. 이번 주 eMed와 VITL의 펀딩 발표는 다가올 펩타이드 붐에 대한 투자자들의 기대를 보여 주는 신호처럼 보입니다. Gameday Men's Health 같은 브랜드는 조용히 상당한 규모의 거점을 쌓아 올리고 있습니다(현재 미국 전역에 400개가 넘는 프랜차이즈 클리닉을 두고 있습니다).\n\nShkreli와 Marchione의 토론은 펩타이드를 둘러싼 현재의 대화를 꽤 잘 요약해 주는 것 같습니다. 의료계 주류는 펩타이드가 효과가 있다는 증거가 없다고 외칩니다. 시티즌 사이언티스트들은 효과가 없다면 왜 이렇게 많은 사람이 쓰고 있느냐고 되묻습니다. 양쪽 다 타당한 지점을 짚고 있지만, 서로 엇갈려 이야기하면서, 이런 문제를 대신 정리해 주기로 되어 있는 FDA 같은 기관에 대한 불신이라는 훨씬 더 큰 사회적 대화의 가장자리만 맴돌고 있는 듯합니다.\n\n여기서의 결말은 꽤 예측 가능해 보입니다. 소비자들은 지갑을 열어 중국산 회색 시장 펩타이드를 몸에 주사하는 것으로 자신의 선호를 드러내고 있습니다. 운동선수들이 BPC-157로 회복이 빨라진다고 여기는 것 같은데, 그럼 나라고 못 쓸 이유가 있나? 의료계 주류가 펩타이드에 증거가 없다고 소리치는 동안, 소비자들은 신경 쓰지 않는 것처럼 보입니다. 인기가 커지면 나쁜 행위자들이 나타날 것이고, 자기가 무엇을 주사하는지 실제로는 알지 못하는 일부 사람들에게 나쁜 결과가 생길 것입니다. 그런 나쁜 결과들은 이목을 끄는 헤드라인이 될 것입니다. 정치 지도자들이 손쉬운 승리를 보게 되면서 규제 당국의 조사가 뒤따를 것이고, 펩타이드는 결국 자리 잡힌 시장으로 정착할 것입니다.\n\n제 개인적인 펩타이드 소비에 관해 말하자면, 저는 이 시장에서 뒤늦게 따라가는 쪽이어도 괜찮습니다. 그 사이클이 흘러가는 동안 회색 시장 화합물은 다른 사람들이 실험하도록 두겠습니다. 그렇긴 해도, 앞으로 5년 안에 그 질문에 대한 제 답은 바뀔 것 같습니다. FDA 승인을 받은 retatrutide든, 파이프라인에서 내려올 다른 기적의 약이든 말이죠."},{"heading_en":"A NUMBER TO PONDER","body":"88%\n\nHealth Enterprise Partners가 자사 LP 150곳을 대상으로 진행한 설문에 따르면, 향후 12개월간 입원 건당 인건비가 오를 것이라고 보는 헬스케어 프로바이더 임원의 비율입니다. 이 수치는 AI가 가까운 미래에 비용 제로에 가까운 의료 공급의 풍요를 가져올 것이라는, 제가 읽어 온 여러 사설류의 주장과는 상반되어 보입니다.\n\nHEP 설문은 여러 핵심 산업 트렌드를 짚고 있어 전체를 훑어볼 가치가 있지만, 이 숫자가 특히 눈에 띄었습니다. 저는 HEP의 Managing Partner인 Ezra Mehlman, Operating Partner인 Tom Cassels와 이 내용을 비롯해 리포트의 다른 핵심 트렌드에 대해 이야기를 나눌 기회가 있었습니다(Apple, Spotify, YouTube). Tom과 Ezra는 AI가 촉발할 파괴의 가능성, 그리고 조직 재설계가 시간이 오래 걸리는 과정이라는 점에 대해 흥미로운 인사이트를 나눠 주었습니다."},{"heading_en":"CHART OF THE WEEK","body":"이번 주 Boston Globe의 기사는 매사추세츠주 패혈증의 흥미로운 사례를 조명했습니다. 아래 차트에서 보듯, 지난 몇 년 사이 고중증도 퇴원 건수가 극적으로 증가한 사례입니다. 이 증가의 잠재적 원인으로 AI가 이끄는 코딩 인텐시티라는 유령이 거론되는데, AI 기반 도구들이 프로바이더에게 더 나은 문서화를 제공하기 때문입니다.\n\n출처: Boston Globe 기사, 2026년 3월 20일"},{"heading_en":"Funding Announcements","body":"헬스 시스템용 AI 플랫폼 Qualified Health가 1억 2,500만 달러를 조달했습니다. New Enterprise Associates가 라운드를 주도했습니다. Qualified는 Mercy, Emory Healthcare, University of Rochester Medicine, Jefferson Health, University of Texas System을 자사 AI 플랫폼을 쓰는 고객으로 꼽습니다. Qualified는 Palantir나 Health Catalyst와 비슷한 접근을 취하는 것으로 보이는데, 엔지니어를 헬스 시스템 내부에 투입해 다양한 AI 기회를 구축하고 실행하도록 돕는 방식입니다."},{"heading_en":"Funding Announcements","body":"클레임 클리어링하우스 Stedi가 5,000만 달러를 조달했습니다. Addition이 라운드를 주도했으며, 이는 Stedi가 직전 라운드를 발표한 지 겨우 7개월 만입니다. Stedi의 누적 조달액은 이제 1억 4,200만 달러입니다. 유료 고객 6배 증가, 청구 트랜잭션 7배 증가를 언급하며, 연간 10억 건이 넘는 클레임과 자격 확인 트랜잭션을 처리하고 있다고 합니다."},{"heading_en":"Funding Announcements","body":"임상의를 위한 AI 에이전트를 만드는 스타트업 Thesis Care가 4,500만 달러를 조달했습니다. Oak HC/FT가 이 라운드를 주도했으며, Thesis는 이전에 Trovo Health로 불리던 회사입니다. 1차 진료와 전문 진료 조직 전반에 걸쳐 수천 명의 프로바이더를 고객으로 두고 있다고 하며, 여기에는 US Heart and Vascular도 포함됩니다."},{"heading_en":"Funding Announcements","body":"임상 진료를 위한 AI 모델 Doctronic이 4,000만 달러를 조달했습니다. Abstract와 Lightspeed Venture Partners가 라운드를 주도했으며, 12개월이 채 안 되는 기간에 세 번째 라운드입니다. Doctronic은 6개월 전 시리즈 A를 마감한 이후 15배 성장해 1,000만 달러 이상의 연환산 매출을 내고 있고 주간 방문자 30만 명 이상을 기록하고 있다고 밝힙니다. 이 계산대로라면 현재 월 약 21,000건의 원격진료 상담을 하고 있다는 뜻이 되고(21,000 × $39 × 12 = 약 1,000만 달러), 이는 주간 방문자 30만 명 중 2% 미만에 대해서만 원격진료 방문이 이뤄지고 있음을 뜻합니다. Ngai Yeung이 이번 주 Endpoints에서 Doctronic을 써 본 흥미로운 경험을 공유하며, 기대와는 달리 AI 중심의 케어가 아직 갈 길이 남아 있다는 점을 짚었습니다."},{"heading_en":"Funding Announcements","body":"AI 중심의 레비뉴 사이클 매니지먼트 플랫폼 Adonis가 4,000만 달러를 조달했습니다. Quadrille Capital이 라운드를 주도했고 General Catalyst와 Bling Capital이 참여해, Adonis의 누적 조달액은 9,400만 달러가 되었습니다. 보도자료는 Adonis가 2025년에 매출 4배 성장을 기록했고 순유지율은 130%를 넘는다고 밝힙니다. 고객으로 Mount Sinai가 인용되어 있습니다."},{"heading_en":"Funding Announcements","body":"롱제비티 진료 기관 eMed가 20억 달러 이상의 밸류에이션으로 2억 달러를 조달했습니다. AON Consulting이 라운드를 주도했는데, 이런 라운드의 리드 투자자로 보기에는 이례적인 이름입니다. 하기야 이 회사 자체가 좀 이례적이어서, Tom Brady를 Chief Wellness Officer로 두고 있습니다. eMed는 보도자료에서 자사가 고용주를 위한 \"골드 스탠더드\" GLP-1 상품이라고 여긴다며 환자 순응도 90%를 근거로 들었습니다. eMed는 롱제비티/펩타이드 기회를 바로 낚아챌 준비가 된 것으로 보이는 D2C 상품도 갖고 있습니다."},{"heading_en":"Funding Announcements","body":"정신과 진료 기관을 위한 AI 코파일럿 Blossom Health가 2,000만 달러를 조달했습니다. Headline이 라운드를 주도했습니다. Blossom은 수백 명의 임상의가 자사 제품을 사용해 1만 명이 넘는 환자를 진료하고 있다고 밝혔습니다."},{"heading_en":"Funding Announcements","body":"대출 상환 프로그램을 통해 고용주가 채용한 임상 인력을 유지하도록 돕는 스타트업 Clasp가 2,000만 달러를 조달했습니다. Crosslink Capital과 Digitalis Ventures가 라운드를 주도했습니다. Clasp는 다른 모델보다 유지율이 2.5배 높다고 주장합니다. 이미 여러 대형 헬스 시스템이 고객인데, Boston Children's Hospital, Memorial Sloan Kettering, Northwestern Medicine, Novant Health, Ohio Health 등입니다."},{"heading_en":"Funding Announcements","body":"AI 중심의 퇴원 후 관리 플랫폼 Dimer Health가 1,350만 달러를 조달했습니다. Team8과 Table Management가 라운드를 주도했습니다."},{"heading_en":"Funding Announcements","body":"NP가 이끄는 클리닉을 위한 business-in-a-box 모델 Prax Health가 두 번의 라운드에 걸쳐 1,000만 달러의 자금 조달을 발표했습니다. Martin이 Prax의 Co-Founder 겸 CEO인 Meghan Jewitt와 마주 앉아 이 모델에 대해 더 들어 볼 기회가 있었습니다. Prax는 200명이 넘는 NP가 자신의 독립 진료소를 열도록 도왔고, 올해 5배에서 10배 성장을 향해 가고 있습니다."},{"heading_en":"Funding Announcements","body":"AI 닥터를 만드는 스타트업 Certuma가 6,000만 달러 밸류에이션으로 1,000만 달러를 조달했습니다. 8VC가 라운드를 주도했습니다."},{"heading_en":"Funding Announcements","body":"조제 약국과 롱제비티 클리닉을 연결하는 플랫폼 VITL이 750만 달러를 조달했습니다. VITL은 현재 630곳이 넘는 클리닉을 고객으로 두고 있으며 1,000만 달러 이상의 ARR을 내고 있다고 밝힙니다."},{"heading_en":"What I'm Reading: Medicaid + AI: A New Standard for Innovation","body":"Toyin Ajayi 씀\n\nCityblock이 Medicaid 인구를 대상으로 AI 도입에 어떻게 접근하고 있는지를, 이론적 원칙과 멤버 여정에 AI를 어떻게 녹여 넣고 있는지 양쪽 측면에서 다룬 좋은 관점입니다."},{"heading_en":"What I'm Reading: The Future of Quality in Medicare and Medicaid: Themes from the CMS Quality Conference","body":"Avalere Health 씀\n\nAvalere 팀이 최근 열린 CMS의 질 측정 컨퍼런스에서 얻은 시사점을 공유합니다. 첫 번째 시사점이 치료에서 예방 서비스로의 초점 이동이라는 점이 흥미로웠는데, 아주 놀랍지는 않았습니다. 연례 웰니스 방문, 영양, 생활습관 개입이 모두 여기서 핵심 역할을 합니다."},{"heading_en":"What I'm Reading: Break Stuff: Ten Things the Healthcare Market Is Telling Us in 2026","body":"Ezra Mehlman, Jessie Gentil, Michelle Kauffman, Culver Duquette 씀\n\n위에서 언급했듯, 헬스케어 임원 150명 이상을 대상으로 한 이 연례 HEP 설문은 AI가 이끄는 변화의 현주소, 헬스케어 조직에 가해지는 비용 압박 등에 대해 유용한 인사이트를 제공했습니다."},{"heading_en":"What I'm Reading: Rise of the Agentic EHR","body":"Colton Ortolf 씀\n\nOrtolf가 X에 흥미로운 글을 올려, 에이전틱 EHR이 EHR 파괴자로서 \"헤드리스 EHR\" 개념을 대체할 가능성을 짚었습니다. '왜 지금인가'에 대한 논점들을 곱씹어 볼 만합니다. AI로 유통 비용이 낮아지는 점, 오늘날 더 나아진 기술, 더 많은 SMB 프로바이더 고객, 그리고 혁신가의 딜레마에 직면한 기존 강자 집단이 그것입니다."},{"heading_en":"What I'm Reading: Doctors should be paid to keep patients healthy","body":"Ashish Jha, Tom Tsai 씀\n\n밸류 기반 케어가 나아갈 길로 판돈을 키우자는 주장을 펴는, Substack(그리고 Boston Globe)에 실린 흥미로운 시리즈입니다. 전문 진료를 포함한 상방/하방 리스크, 더 긴 계약 기간 등 모두가 더 책임 있는 케어를 중심으로 돌아갑니다. VBC 너드라면 새로울 것이 많지는 않겠지만, 좀 더 일반 독자를 향해 이 주장이 어떻게 펼쳐지는지 보는 것은 흥미롭습니다."},{"heading_en":"What I'm Reading: High-Stakes Medicine: Rethinking Policies for the Cost and Value of Cell and Gene Therapies","body":"Alison Sexton Ward, Elizabeth Fowler, Jeremy Shane, Darius Lakdawalla 씀\n\n세포·유전자 치료제가 보상 경로 측면에서 안고 있는 고유한 어려움을 다룬 유익한 글입니다. 병원이 이런 프로그램에 투자할 때 겪는 재정적 어려움에 대한 지적이 특히 흥미로웠습니다. 이를테면 CGT 프로그램을 시작하는 데 선불로 100만 달러가 들 수 있는데, 이후의 환자 유입에 대한 가시성은 제한적이라는 것입니다."},{"heading_en":"HTN Content From the Week","body":"Community Brain Trust: HTN Slack 소식, 노스캐롤라이나가 주(州) 건강보험 플랜을 어떻게 고치고 있는지, Allina와 Sutter Health의 합병 등."},{"heading_en":"HTN Content From the Week","body":"Weekly Health Policy Briefing: AHIP에 드리운 그늘, Medicare에서 기본값이 된 매니지드 케어, 그리고 Medicaid 소급 적용."},{"heading_en":"HTN Content From the Week","body":"Health Tech Nerds Radio\n\n- The Grand Roundup: Sutter-Allina 합병, Lantern의 3,000만 달러 조달과 모델, WISeR 사전승인 반발, Medicare Advantage 대 FFS, state directed payments, 헬스테크 펀딩 등. Apple, Spotify, YouTube.\n- 헬스 시스템이 케어를 확장하도록 돕는 버추얼 케어 모델 만들기 | Ashul Govil (Story Health by Innovaccer). Apple, Spotify, YouTube.\n- 미국 공립학교의 절실한 정신건강 수요에 응답하기 | Jake Sussman (CEO, Marble Health). Apple, Spotify, YouTube.\n- AI와 조직의 현실, 치솟는 인건비, 그리고 버추얼 케어와 VBC의 다음 물결로서의 전문 진료: 페이어·프로바이더 임원 150명에게서 얻은 인사이트 | Ezra Mehlman (HEP), Tom Cassels (Manatt). Apple, Spotify, YouTube."}]},"30":{"index":"30","title_en":"Weekly Health Tech Reads 4/12/26","subtitle":"2027 Final Notice에 대한 단상, Jefferson과 Aetna 사이의 페이어/프로바이더 다툼, Teladoc의 밸류에이션 문제, BCBS MN의 재무 문제, 그리고 그 밖의 소식","sections":[{"heading_en":"Sponsored by: Alumni Ventures","body":"스폰서: Alumni Ventures\n\nAlumni Ventures Healthtech Syndicate는 보통 기관 투자자만 접근할 수 있는 헬스테크 스타트업에 개인이 투자할 기회를 제공합니다.\n\n멤버가 받는 것:\n\n- 매달 1~2건의 엄선된 헬스테크 딜. Andreessen Horowitz, Khosla Ventures, Sequoia 등과 함께 코인베스트합니다.\n- 각 딜에 대한 전체 실사 자료: 재무, 시장 분석, 그리고 AV 투자팀과의 라이브 논의.\n- 가입에 비용이나 의무는 없으며, 관심이 가는 딜에만 투자하면 됩니다.\n- 실제로 투자할 때는 딜당 최소 1만 달러.\n\n가입은 빠르고 간단합니다 – 자세한 내용을 확인하고 여기서 참여하세요.\n\n알림: HTN은 Alumni Ventures와 제휴 관계가 없으며 투자 자문을 제공하지 않습니다.\n\n뉴스레터 스폰서십에 관심이 있으시면 알려 주세요!"},{"heading_en":"","body":"👋 이번 주 일요일 헬스케어 뉴스 정리에 오신 것을 환영합니다. 한 주 쉬고 다시 돌아왔습니다! 이번 주에는 2027 Final Notice 요율에 이르기까지의 여정을 두고 — Chris Klomp와의 재미있는 인터뷰를 포함해 — 많은 시간을 생각하며 보냈고, 그것이 앞으로의 업계에 어떤 의미인지도 함께 고민했습니다. 그런 배경 속에서 이번 주 Jefferson이 Aetna를 상대로 제기한 다운코딩 소송을 읽는 것은 흥미로웠습니다. 아래에서 그 이야기 전부와 함께, 미네소타 사람들의 Life Time 멤버십 사랑, 그리고 훨씬 더 많은 이야기를 다루겠습니다. 즐겁게 읽으세요!\n\n- Kevin"},{"heading_en":"TOP HEADLINE: 2027 MA Final Notice comes in ahead of expectations","body":"월요일 오후, CMS는 2027 Final Notice, 다른 이름으로는 CY(Calendar Year) 2027 Medicare Advantage(MA) 및 Part D Rate Announcement를 발표했습니다. 헤드라인은 최종 Overall Expected Change가 기대를 웃도는 2.48%로 나왔다는 것으로, Advance Notice에서 애초에 제안됐던 0.09%에서 의미 있게 오른 수치입니다.\n\n이 소식에 Medicare Advantage 주식은 전반적으로 올랐고, 여러 기업이 한 주 동안 10% 안팎 상승했습니다. 저는 이번 주 초 Chris와 마주 앉아, CMS가 이 요율을 확정하며 무엇을 고민하고 있는지 직접 들을 기회가 있었습니다.\n\nChris Klomp: 2027 MA final rate notice, accountable relationships, and opportunity for startups\n\nApple, Spotify, YouTube에서 들으실 수 있습니다. 또는 여기서 전문을 읽어 보세요.\n\nKlomp이 Advance Notice에서 Final Notice로 넘어오며 무엇이 바뀌었는지 설명하는 것을 듣다 보니, 제 머릿속은 지난 주말 지역 신문에서 읽은 관련 기사로 자꾸 흘러갔습니다. Blue Cross Blue Shield of Minnesota가 2025년에 겪은 영업손실을 다룬 기사였습니다. 거기에는 12월에 BCBS MN 본사 앞에서 피켓 시위를 하는 시니어 50여 명의 사진이 실려 있었는데, BCBS MN이 피트니스 베네핏의 일부였던 YMCA와 Life Time 헬스장 무료 이용을 없앴기 때문입니다.\n\n출처: Star Tribune\n\n자, 이번 주에 Slack에서 이야기했듯이, 미네소타 사람을 안다면 우리가 지역 브랜드를 얼마나 사랑하는지 아실 겁니다. Life Time은 그 목록의 맨 위에 있습니다. 실제로 저는 지난주에 바로 이 문제를 한탄하던 가족 지인과 이야기를 나눴는데, 보험사에 대한 불만의 일부였습니다. 그분은 예전에 UCare를 통해 MA 커버리지를 갖고 있었고 Life Time 무료 이용을 무척 좋아했는데, BCBS MN으로 오면서 그것을 잃어 속상해했습니다. 평균적인 미국인이 Medicare Advantage를 바라보는 방식이 바로 이렇다고 저는 꽤 확신합니다.\n\nAdvance Notice 이후 CMS가 받은 44,000건 이상의 의견 중 상당수는, Advance Notice에서 상정된 요율 인상에 맞추기 위해 필요한 베네핏 삭감이 상당히 가혹할 것이라는 점, 그리고 삭감에 항의해 거리로 나서는 미네소타 사람이 몇 명 더 생길지도 모른다는 점을 어떤 형태로든 담고 있었으리라 짐작합니다.\n\n그런 점에서 Final Notice는 아주 합리적인 지점에 안착한 것으로 보입니다. 2027년 수급자들의 안정성을 확보하도록 조정하면
