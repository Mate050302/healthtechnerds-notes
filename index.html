 맞춘 최신 자료로 보면 Prime Therapeutics의 2024년 상반기 코호트(3만 3,607명, JMCP 2026)에서 1년 지속률이 60.9%, 복약 순응도(PDC 80% 이상)가 55.5%였고, 매사추세츠 메디케이드 코호트(7,493명, JMCP 2026)에서는 6개월 시점 지속률 60.8%, 순응도 60.1%였다. 이 기준으로 보면 90%는 두 배가 아니라 1.3배에서 1.5배 수준이다. '두 배'가 되려면 약이 품귀였던 2021년에서 2023년 사이의 12개월 지속률을 끌어와야 한다. 게다가 이탈은 초반에 몰려 있어서 6개월로 끊어 재면 숫자가 유리해진다. 1년 이탈의 71%가 첫 6개월에 일어난다.\n\n다섯째, 함께 내건 '99%가 6개월 안에 지표 하나 이상 개선'은 재는 항목이 여섯 가지여서 하나만 좋아져도 성립한다. 회사 FAQ도 '첫 검사에서 약 99%는 최소 한 항목이 정상 범위를 벗어난다'고 밝히고 있다.\n\n여섯째, 체중 감량 수치가 13개월 사이에 계속 바뀌었다. 2025년 8월 Aon 발표는 22.4파운드, 2026년 1월과 3월 보도자료는 21파운드, 앱 안내 페이지는 6개월에 23파운드, 현재 고용주 페이지는 30파운드다. 어느 수치가 어느 집단인지 회사가 밝히지 않았다.\n\n일곱째, 라운드를 주도한 Aon은 독립된 제삼자가 아니다. Aon은 eMed를 자사 고용주 고객에게 파는 유통 파트너이고, 웹사이트가 성과 근거로 드는 'Aon Workforce-Focused Analysis on GLP-1s'도 Aon이 만든 것이며, 그 분석 자체는 청구 데이터 5,000만 명 중 GLP-1 사용자 13만 9천 명을 본 것이지 eMed 참가자를 본 것이 아니다. 더 나아가 Aon의 2025 회계연도 사업보고서(10-K) 별지에는 eMed Population Health, Inc.가 2025년 12월 31일 기준 Aon의 자회사로 올라 있다. 투자자 이상의 관계다.\n\n여덟째, 회사를 상대로 한 소송이 진행 중이다. 체중 관리 자회사의 전 CEO였던 Wendi Mader가 2026년 5월 플로리다 남부 연방지방법원에 성차별과 보복 해고를 이유로 소송을 냈다(사건번호 1:26-cv-23258). 소장에는 회사가 정한 임상 절차를 건너뛰고 특정 인물에게 GLP-1을 처방하도록 지시받았다는 주장도 담겨 있다. 이는 아직 입증되지 않은 원고 측 주장이고 피고들은 2026년 8월 각하 신청을 내며 전면 다투고 있으므로, 사실로 인용해서는 안 된다. 다만 '임상 관리가 붙은 GLP-1'을 파는 회사에 대해 그 관리의 실행을 문제 삼는 주장이 제기됐다는 사실 자체는 기록해 둘 만하다.\n\n아홉째, 영국에서는 인수 뒤에 마찰이 있었다. 2024년 3월 eMed는 임상의 정리해고 협의를 시작했고 영국의사협회(BMA)는 이 협의가 '위법일 가능성이 매우 높고 간접 차별에 해당한다'고 밝혔다. GP at Hand의 등록 환자는 11만 1천 명에서 9만 6천 명으로 줄었고 BUPA 계약은 2025년 1월 종료됐다. 앞서 2022년에는 Abbott가 미수금 문제로 eMed를 상대로 중재를 걸었고 법원이 eMed에게 중재에 응하라고 명령했다.\n\n열째, 소비자용 앱의 사용 흔적이 아주 적다. 미국 앱스토어는 평점 4.2에 평가 10건, 구글 플레이는 평점 2.7에 평가 6건이고 내려받기가 1,000회 이상 구간이다. 개인 가입 페이지가 내세우는 '회원 5만 명'은 영국 SheMed와 HeMed의 환자 수와 같은 숫자인데, 영국 앱은 평가가 6,300건대다. 미국 소비자 사업은 이제 막 시작한 것으로 보인다.\n\n마지막으로, 뉴스레터가 쓴 '롱제비티 진료 기관'이라는 표현은 회사의 현재 사업과 맞지 않는다. 웹사이트에 롱제비티나 펩타이드를 다루는 페이지가 없고 해당 주소는 모두 없는 문서로 나온다. CEO가 Axios 인터뷰에서 앞으로 펩타이드 영역 전반을 살펴보겠다고 말했으므로, 그 표현은 현재 사업이 아니라 계획을 가리킨 것으로 보인다. 참고로 인터넷에 도는 '2022년 미국 보건복지부와 최대 12억 달러 규모 계약'이라는 내용은 근거가 없다. 연방 조달 기록에서 eMed 앞으로 확인되는 계약은 연방항공청 97만 2,623달러와 교육부 4,250달러가 전부다.","for_us":"약을 파는 대목은 우리가 할 수 없다. 그러나 eMed가 값을 받아 내는 지점은 약 자체가 아니라 '끊지 않게 만드는 관리'이고, 그 관리의 실제 내용은 1분이 안 걸리는 주 1회 체크인, 투약 알림, 진도 그래프, 부작용이 생겼을 때 바로 응대하는 상담 창구다. 전부 앱 화면에서 되는 일이고 의료기기 허가도 필요 없다. 회사도 앱을 '추적·분석 도구이며 의료기기가 아니다'라고 명시한다. 우리 앱은 걸음 리워드로 매일 여는 습관을 이미 만들어 두었으므로, 비만 치료제를 이미 쓰고 있는 사람을 위한 동반 트랙(주사 요일 알림, 투여 기록, 부작용 기록, 단백질 섭취와 걷기 과제)을 3개월 안에 붙일 수 있다. 다만 대상이 약 사용자로 좁아지므로, 우리 미국 사용자 가운데 실제로 GLP-1을 쓰는 사람이 시험에 충분한 수인지 먼저 세어 봐야 한다. 두 번째로 볼 것은 값을 정당화하는 방식이다. eMed는 '체중 감량과 복약 지속을 보증하고 못 지키면 대금을 깎는다'는 계약을 내걸었다. 우리가 지속 이용률 자체를 상품으로 팔려면 결국 같은 형태의 약속을 숫자로 내걸 수 있어야 한다. 세 번째는 반대 방향의 교훈이다. eMed는 '앱에 남아 있는 비율'을 '약을 제대로 쓰는 비율'로 바꿔 부르면서 20억 달러짜리 이야기를 만들었다. 우리가 같은 종류의 지표를 낼 때는 무엇을 세는지, 분모가 무엇인지 먼저 정해 두어야 나중에 뒤집히지 않는다.","screenshots":[{"file":"emed_home.png","caption":"첫 화면. 고용주용과 개인용 두 갈래로 나뉘어 있고, 내세우는 문구가 '시작하기 쉽고 계속하기는 더 쉽다'이다.","from":"https://www.emed.com"},{"file":"emed_claims.png","caption":"순응도 90%의 실제 표기. '10명 중 9명이 처방대로 따른다', '10명 중 9명이 6개월 넘게 프로그램에 남는다'로 적혀 있고 출처는 'eMed Population Health Data (2025)'라는 자사 데이터다.","from":"https://www.emed.com/download"},{"file":"emed_pricing.png","caption":"소비자가 직접 가입할 때의 값. 최초 검사비 49달러, 약값 월 149.99달러부터, 회비 월 149.99달러가 각각 따로 붙는다.","from":"https://www.emed.com/join/home"},{"file":"emed_ios.png","caption":"미국 앱스토어 페이지. 앱 설명이 '회사가 지원하는 체중 관리'로 되어 있어 고용주를 거쳐 들어오는 사람을 위한 도구임을 드러낸다. 평점 4.2에 평가 10건뿐이다.","from":"https://apps.apple.com/us/app/emed-population-health/id6741202488"}],"sources":[{"title":"eMed 첫 화면","url":"https://www.emed.com","note":"고용주용과 개인용으로 갈리는 구조와 내세우는 문구를 확인했다."},{"title":"eMed 고용주용 페이지","url":"https://www.emed.com/employers","note":"PBM을 빼고 약을 직접 조달한다는 설명, 성과 보증 문구, 자가 채혈 검사 여섯 항목, 회원 여정 절차를 확인했다."},{"title":"eMed 개인 가입 페이지","url":"https://www.emed.com/join/home","note":"소비자가 직접 낼 값(49달러, 149.99달러, 149.99달러)과 위고비 알약 취급 사실을 확인했다."},{"title":"eMed 개인 가입 FAQ","url":"https://www.emed.com/join/faq","note":"FDA 허가 정품만 쓴다는 답변, 처방 약은 위고비라는 답변, 자사 검사 키트만 인정한다는 답변, 첫 검사에서 약 99%가 한 항목 이상 정상 범위를 벗어난다는 서술을 확인했다."},{"title":"eMed 앱 안내 페이지","url":"https://www.emed.com/download","note":"순응도 90%의 실제 표기와 출처 표시('eMed Population Health Data (2025)')를 확인했다."},{"title":"eMed 회사 소개 페이지","url":"https://www.emed.com/about","note":"경영진 명단, 코로나 시기 실적 주장, Aon과 Thrive Global, CVS Health 제휴 표기를 확인했다."},{"title":"eMed 자율 가입형 상품 페이지","url":"https://www.emed.com/voluntary","note":"회사 부담 0달러, 직원이 월 149.99달러를 내는 방식임을 확인했다."},{"title":"eMed 영국 사업 페이지","url":"https://www.emed.com/uk","note":"NHS 환자 10만 명 이상 1차 진료, SheMed와 HeMed로 5만 명 이상 관리를 확인했다."},{"title":"Tom Brady 최고 웰니스 책임자 선임 보도자료","url":"https://www.emed.com/in-the-news/tom-brady-named-chief-wellness-officer-of-emed","note":"2026년 1월 12일 자다. 순응도 90%, 평균 21파운드 감량, 99% 지표 개선, 관리받지 않는 프로그램의 35% 순응도, 3년 차 최대 3배 투자 회수라는 주장을 원문 그대로 확인했다."},{"title":"2억 달러 조달 보도자료","url":"https://www.prnewswire.com/news-releases/emed-raises-200-million-at-2-billion-plus-valuation-302725381.html","note":"2026년 3월 26일 자다. 기업가치, 투자자 명단, 인두제 방식 도입 계획을 확인했다."},{"title":"Aon 전략적 투자 보도자료","url":"https://www.prnewswire.com/in/news-releases/aon-announces-strategic-investment-in-emed-to-scale-glp-1-population-health-platform-302532187.html","note":"2025년 8월 18일 자다. Aon이 자사 고용주 고객에게 eMed를 공급한다는 내용과 Aon 사내 프로그램 실적(등록 1,200명 이상, 평균 22.4파운드 감량, 유지율 95%)을 확인했다."},{"title":"Aon 2025 회계연도 사업보고서 자회사 목록(SEC 10-K 별지 21)","url":"https://www.sec.gov/Archives/edgar/data/315293/000162828026008116/exhibit2112025.htm","note":"eMed Population Health, Inc.가 2025년 12월 31일 기준 Aon의 자회사로 올라 있음을 확인했다."},{"title":"Aon의 GLP-1 인력 분석 보도자료","url":"https://www.prnewswire.com/news-releases/aon-unveils-first-workforce-focused-analysis-on-glp-1s-medications-and-holistic-support-can-transform-workforce-health-and-bend-the-cost-curve-302441869.html","note":"2025년 4월 30일 자다. 청구 데이터 5,000만 명 중 GLP-1 사용자 13만 9천 명을 본 분석이며 eMed 참가자 대상이 아님을 확인했다."},{"title":"PitchBook, 업계 통념을 뒤집는 순응도 주장으로 2억 달러를 조달했다","url":"https://pitchbook.com/news/articles/linda-yaccarinos-glp-1-telehealth-unicorn-raises-200m-on-adherence-claim-that-bucks-industry-norm","note":"eMed가 주장한 유니버시티 칼리지 런던 분석과 Nature Medicine 게재 예정 발언, 애널리스트의 '동료 심사와 임상 검증이 없다'는 평가를 확인했다."},{"title":"eMed가 등록한 유일한 연구(ISRCTN12421711)","url":"https://www.isrctn.com/ISRCTN12421711","note":"eMed가 스스로 의뢰·자금을 대고 연구 책임자도 eMed 직원이며, 순응도를 '권고 활동 완료 비율'로 정의하고, 결과가 없으며 종료가 2027년 4월로 미뤄졌음을 확인했다."},{"title":"Rodriguez 외, GLP-1 중단과 재개 연구(JAMA Network Open, 2025년 1월 31일)","url":"https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2829779","note":"과체중 또는 비만인 성인 12만 5,474명 실사용 데이터다. 1년 중단률은 전체 53.6%, 당뇨가 없는 사람은 64.8%였고, 2년 중단률은 전체 72.2%, 당뇨가 없는 사람은 84.4%였다. 문제 정의의 근거로 썼다."},{"title":"Meyer 외, 메디케이드 GLP-1 순응도 연구(JMCP 2026)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12948758/","note":"7,493명에서 6개월 시점 지속률 60.8%, 순응도(PDC 80% 이상) 60.1%임을 확인했다. eMed의 '두 배' 주장을 검증하는 기준으로 썼다."},{"title":"eMed의 Babylon 인수 보도자료","url":"https://www.prnewswire.co.uk/news-releases/emed-healthcare-uk-promises-continuity-and-expansion-following-successful-acquisition-of-babylon---marking-a-new-era-for-digital-first-primary-care-in-the-uk-301962293.html","note":"2023년 영국 Babylon Health와 GP at Hand 인수를 확인했다. 대금 679만 파운드와 매출 수치는 영국 기업등기소 감사보고서(법인번호 15085216)에서 확인했다."},{"title":"eMed의 Science 37 공개매수 서류(SEC)","url":"https://www.sec.gov/Archives/edgar/data/1819113/000110465924013752/tm244930-1_sctot.htm","note":"주당 5.75달러, 약 3,800만 달러 규모의 인수와 공동창업자 Patrice Harris의 직함을 확인했다."},{"title":"Abbott, BinaxNOW 가정용 검사 FDA 긴급사용승인 보도자료","url":"https://abbott.mediaroom.com/2020-12-16-Abbotts-BinaxNOW-COVID-19-Rapid-Test-Receives-FDA-Emergency-Use-Authorization-for-First-Virtually-Guided-At-Home-Rapid-Test-Using-eMeds-Digital-Health-Platform","note":"2020년 12월 16일 자다. 화상 감독 플랫폼이 eMed의 것임을 확인했다."},{"title":"Mader 대 eMed 소송 기록(미국 법원 전자기록)","url":"https://www.courtlistener.com/docket/73318156/mader-v-emed-llc/","note":"2026년 5월 8일 제소, 2026년 8월 각하 신청 등 진행 경과를 확인했다. 소장 내용은 입증되지 않은 원고 측 주장이다."},{"title":"Pulse Today, eMed의 영국 임상의 정리해고와 BMA의 문제 제기","url":"https://www.pulsetoday.co.uk/news/workforce/emed-gp-redundancy-consultation-likely-to-be-unlawful-and-discriminatory-claims-bma/","note":"2024년 4월 자다. 영국의사협회가 정리해고 협의를 위법 가능성이 높고 간접 차별에 해당한다고 밝힌 내용을 확인했다."},{"title":"Linda Yaccarino CEO 선임 보도자료","url":"https://www.prnewswire.com/news-releases/emed-population-health-announces-appointment-of-former-x-twitter-ceo-linda-yaccarino-as-new-chief-executive-officer-302521918.html","note":"2025년 8월 5일 자다. 취임한 법인이 모회사가 아니라 eMed Population Health임을 확인했다."},{"title":"Dr. Dyan Hes 최고 의료 책임자 선임 보도자료","url":"https://www.prnewswire.com/news-releases/emed-population-health-appoints-dr-dyan-hes-as-chief-medical-officer-302570333.html","note":"2025년 9월 30일 자다. 경력과 선임 시점을 확인했다."},{"title":"Axios, GLP-1 유니콘이 Tom Brady 등에게 2억 달러를 조달했다","url":"https://www.axios.com/2026/03/26/glp-1-yaccarino-emed-tom-brady","note":"비용을 나누고 순응도를 높이는 임상 프로그램을 제공한다는 사업 설명, 펩타이드 영역 확장과 해외 진출 계획, 경구용 GLP-1의 순응도 불확실성 언급을 확인했다."},{"title":"Employee Benefit News, 의료 종사자용 GLP-1 프로그램","url":"https://www.benefitnews.com/news/tom-bradys-new-play-making-glp-1s-affordable-for-healthcare-workers","note":"고용주가 1인당 월 25달러, 직원이 월 99달러를 내는 별도 가격 구조를 확인했다."},{"title":"Fox Business, Tom Brady가 eMed와 손잡고 GLP-1 접근을 넓힌다","url":"https://www.foxbusiness.com/media/tom-brady-teams-digital-health-firm-emed-expand-glp-1-weight-loss-medication-access","note":"미국인의 60% 이상이 직장을 통해 의료 혜택을 받는다는 서술을 확인했다."},{"title":"eMed Population Health 아이폰 앱","url":"https://apps.apple.com/us/app/emed-population-health/id6741202488","note":"앱 설명이 회사가 지원하는 프로그램 참가자를 대상으로 하며, 평점 4.2에 평가 10건, 2026년 8월 24일 갱신임을 확인했다."},{"title":"eMed 안드로이드 앱","url":"https://play.google.com/store/apps/details?id=com.emed.s2p","note":"평점 2.7에 평가 6건, 내려받기 1,000회 이상, 2026년 8월 24일 갱신을 확인했다."},{"title":"eMed 뉴스 모음 페이지","url":"https://www.emed.com/news","note":"Alight(2026년 8월), Crux(2026년 7월), CVS Health 제휴 소식과 Mercer 조사 인용을 확인했다."}]},"truemed":{"slug":"truemed","name":"Truemed","one_liner":"미국 직장인이 세금 혜택이 붙은 의료비 전용 계좌에 쌓아 둔 돈으로 운동기구와 보조제, 사우나 같은 건강 상품을 살 수 있도록, 온라인 상점 결제 화면에서 의사 소견서를 붙여 주는 결제 연동 회사다.","site":"https://www.truemed.com","sells_to":"mixed","seen_in":[{"issue":"01","section":9,"headline":"HSA와 FSA에 쌓인 혜택 자금을 쓸 수 있게 해 주는 마켓플레이스로 소개되면서, a16z가 주도한 3,400만 달러 투자를 받았다고 나왔다."}],"card":{"problem":"미국 직장인은 세금을 떼기 전에 급여 일부를 의료비 전용 계좌(HSA·FSA)에 쌓아 두는데, 이 돈은 질병의 진단과 치료에만 쓸 수 있어서 운동기구나 보조제, 헬스장 회원권에는 원칙적으로 쓰지 못한다. FSA에 남은 돈은 해가 바뀌면 대부분 사라지므로 연말이 되면 쓰지 못한 금액을 잃는다.","solution":"Truemed는 제휴 상점의 결제 화면에서 건강 설문을 받고, 계약한 면허 의료인이 그 답변을 검토해 의학적 필요 소견서를 발급하면 그 자리에서 계좌 카드로 결제되게 해 준다. 한 번 발급된 소견서는 12개월 동안 유효해서 같은 상품을 다시 살 때 재사용할 수 있다.","price":"상품을 사는 경우에는 소비자가 Truemed에 따로 내는 돈이 없고 서비스 비용이 이미 상품 가격에 포함되어 있지만, 헬스장과 스튜디오는 방식이 달라서 회원이 소견서 한 건당 20달러를 직접 낸다.","tags":["세제 혜택 계좌","결제 연동","의사 소견서","건강 상품 구매","헬스장 회원권"],"headline_traction":"2025년 12월에 a16z가 주도한 시리즈 A로 3,400만 달러를 조달했다.","watch":"미국 국세청이 2024년에 자기 보고만으로 발급한 소견서로는 생활 지출을 의료비로 바꿀 수 없다는 경고를 냈고, 회사 이용약관도 세금 문제의 책임을 이용자 본인에게 넘겨 두었다."},"problem":"미국 직장인은 급여에서 세금을 떼기 전에 일부를 미리 떼어 HSA나 FSA라는 의료비 전용 계좌에 쌓아 둔다. HSA는 본인이 먼저 부담하는 금액이 큰 보험에 든 사람만 열 수 있고 남은 돈을 해마다 계속 이월할 수 있는 반면, FSA는 고용주가 제공하며 그해에 쓰지 못한 돈은 고용주가 정한 제도에 따라 2025년 기준 660달러까지만 다음 해로 넘길 수 있고 나머지는 사라진다. 문제는 이 돈을 쓸 수 있는 범위가 세법 213(d)조에 따라 질병의 진단과 치료, 완화, 처치, 예방으로 좁게 묶여 있어서, 헬스장 회원권이나 보조제, 운동기구처럼 건강에 도움이 되기만 하는 지출은 원칙적으로 인정되지 않는다는 점이다. 그래서 계좌에는 돈이 쌓여 있는데 정작 쓸 곳이 마땅치 않은 상황이 생기고, FSA 가입자는 연말이 되면 남은 돈을 잃는다. 한국의 연말정산 의료비 세액공제는 이미 쓴 돈을 사후에 깎아 주는 방식이라 이런 문제가 생기지 않으며, 급여를 미리 떼어 별도 계좌에 쌓아 두는 제도 자체가 한국에는 없다.","solution":"소비자는 Truemed와 제휴한 브랜드의 온라인 상점에서 상품을 고른 뒤 결제 화면에서 Truemed를 선택한다. 그러면 현재 건강 상태와 진단받은 병, 이 상품을 사려는 이유를 묻는 건강 설문이 뜨고, Truemed와 계약한 독립 면허 의료인이 그 답변을 검토한다. 의료인이 그 상품을 그 사람의 건강 상태에 필요하다고 판단하면 의학적 필요 소견서(Letter of Medical Necessity)를 발급하고, 소비자는 그 자리에서 HSA나 FSA 카드로 결제한다. 결제 화면에 Truemed가 붙어 있지 않은 상점이거나 구독 상품이면 일반 카드로 먼저 결제한 다음 같은 날 설문에 답하고, 보통 24시간에서 48시간 안에 검토 결과를 받아 계좌 운영사에 환급을 신청한다. 한 번 발급된 소견서는 12개월 동안 유효하고 같은 상품을 다시 살 때 재사용할 수 있다. 상품을 사는 경우 소비자가 Truemed에 따로 내는 돈은 없다. 회사는 자사 서비스 비용이 이미 상품 가격에 포함돼 있다고 고지하며, 브랜드 계약서를 보면 Truemed가 주문 금액에서 수수료를 먼저 떼고 나머지를 브랜드에 정산한다. 다만 헬스장과 스튜디오는 값을 매기는 방식이 다르다. 가맹점은 750달러를 한 번만 내고 그 뒤로는 거래 수수료도 월 이용료도 최소 금액도 없는 대신, 회원이 소견서 한 건당 20달러를 직접 낸다. 소비자용 모바일 앱은 없으며, 모든 절차는 제휴 상점의 결제 화면과 웹 화면에서 이루어진다.","features":[{"name":"결제 화면 연동","detail":"Shopify와 WooCommerce, BigCommerce, 직접 API로 상점에 붙어서 HSA·FSA 카드 결제를 그 자리에서 처리한다. 상품 페이지에는 이 상품이 대상인지 알려 주는 안내 표시가 붙는다."},{"name":"건강 설문과 의료인 검토","detail":"소비자가 답한 건강 설문을 제휴 면허 의료인이 검토해 의학적 필요 소견서를 발급하거나 거절한다. 거절되면 결제 자체가 이루어지지 않는다."},{"name":"환급 지원","detail":"결제 연동이 없는 상점이나 구독 상품은 일반 카드로 먼저 결제한 뒤, 소견서를 받아 계좌 운영사에 환급을 신청하도록 돕는다."},{"name":"소비자 마켓플레이스","detail":"제휴 브랜드 3,000곳과 15개가 넘는 상품 분류를 모아 보여 주고, 상품을 고르면 해당 브랜드 상점으로 보낸다. 결제는 마켓플레이스가 아니라 브랜드 상점에서 이루어진다."},{"name":"상품 분류","detail":"운동기구, 헬스 기기, 수면, 보조제, 적색광 치료, 기능성 신발, 사우나와 냉수욕, 재택 건강, 헬스장과 스튜디오로 나뉜다. 헬스장과 스튜디오 분류에는 Barry's와 ClassPass, Club Pilates가 올라 있고 투자 보도자료에는 24 Hour Fitness도 제휴처로 나오므로, 헬스장 회원권도 실제로 대상이 된다."},{"name":"헬스장 전용 방식","detail":"헬스장에서는 HSA·FSA 카드로 그 자리에서 결제하는 방식을 회사가 권하지 않는다. 카드사가 매기는 가맹점 업종 분류 때문에 헬스장에서는 승인이 나지 않는 경우가 많아서, 회원이 일반 카드로 결제하고 소견서를 받아 나중에 환급받는 방식만 쓴다. 가맹점 가입 비용도 이 경우에만 공개돼 있다."}],"differentiator":"같은 일을 하는 회사로 Flex와 Sika Health가 있고, 결제 화면에서 건강 설문을 받아 소견서를 발급한다는 구조는 세 회사가 같다. 실질적인 차이는 어느 브랜드와 붙어 있느냐이며, 소비자는 사려는 브랜드가 어느 회사를 쓰는지에 따라 선택이 갈린다. Truemed는 제휴 브랜드가 3,000곳이 넘는다고 밝혀 세 회사 가운데 가장 많은 제휴처를 확보했다고 주장하며, Peloton과 Eight Sleep, Nike Strength, Garmin, 24 Hour Fitness처럼 이름이 알려진 브랜드를 제휴처로 확보했다. 기술 자체는 세 회사가 같기 때문에, 제휴 영업의 규모가 경쟁을 가르는 시장이다.","team":[{"name":"Justin Mares","role":"공동창업자, CEO","background":"식품 브랜드 Kettle & Fire와 Perfect Keto를 창업해 키운 사람이다."},{"name":"Calley Means","role":"공동창업자","background":"맞춤 웨딩드레스 회사 Anomalie를 공동창업해 David's Bridal에 매각했고, 그 전에는 식품과 제약 업계를 상대하는 컨설턴트로 일했다. 2025년 3월부터 백악관 자문 자격으로 미국 보건복지부 장관을 보좌했고, 그해 말 정부 일을 정리하는 과정에서 Truemed 지분을 전량 매각했다고 밝혔다."}],"traction":[{"type":"funding","detail":"3,400만 달러 규모 시리즈 A를 마감했다. a16z가 주도했고 Bessemer Venture Partners와 Long Journey Ventures, BoxGroup, Trust Ventures가 참여했다.","when":"2025-12","source":"PR Newswire 보도자료, a16z 투자 공지"},{"type":"funding","detail":"창업 초기에 350만 달러를 SAFE 방식으로 모았다. Mark Hyman과 Thrive Market, Eight Sleep, Levels 창업자들이 참여했다.","when":"2023-09","source":"TechCrunch"},{"type":"customers","detail":"제휴 가맹 브랜드가 3,000곳을 넘는다고 밝혔다.","when":"2025-12","source":"a16z 투자 공지, Truemed 마켓플레이스 페이지"},{"type":"revenue","detail":"2년 연속으로 전년 대비 매출이 3배 늘었다고 밝혔다.","when":"2025-12","source":"PR Newswire 보도자료"},{"type":"customers","detail":"이용자가 100만 명을 넘었다고 자사 마켓플레이스에 표기하고 있다.","when":"2026-09","source":"shopping.truemed.com 화면"},{"type":"partnership","detail":"Peloton과 Eight Sleep, Nike Strength, 24 Hour Fitness, Rogue Fitness, Garmin, Barry's, Thorne, Tonal, Plunge, AG1 등이 제휴 브랜드로 공개돼 있다.","when":"2025-12","source":"a16z 투자 공지, PR Newswire 보도자료, Truemed 마켓플레이스 화면"}],"caveats":"미국 국세청은 2024년 3월 6일에 이 방식을 겨냥한 경고를 냈다(IR-2024-65). 본인이 스스로 보고한 건강 정보만 근거로 의사가 써 준 소견서로는 원래 개인 지출인 식품과 운동 비용을 의료비로 바꿀 수 없고, 인정되지 않는 지출을 갚아 준 계좌는 자격을 잃어 그 계좌에서 나간 돈 전부가 소득으로 잡힐 수 있다는 내용이다. 다만 이 경고는 Truemed를 이름으로 지목하지 않았고, 회사는 진단받은 병이 있어야 인정된다고 안내하면서 국세청 기준을 지키고 있다고 주장한다. 공동창업자 Calley Means를 둘러싼 이해충돌도 계속 문제가 됐다. Means는 2025년 3월 18일에 특별정부직원 신분으로 백악관 자문에 임명돼 보건복지부 장관 Robert F. Kennedy Jr.를 보좌하면서 Truemed 지분을 그대로 들고 있었다. 지분 규모는 보도마다 달라 2,000만 달러대에서 5,000만 달러 사이로 엇갈리게 전해지므로 특정 금액을 확정해서 인용하지 않는 편이 안전하다. 하원의원 Jake Auchincloss는 2025년 6월 16일 Means 본인과 Truemed 이사회에 각각 서한을 보내, Truemed의 기업 가치가 2024년 1월 이후 3배 가까이 올랐고 그 시점이 Means의 임명 시기와 겹친다는 점을 문제 삼았다. 같은 의원과 상원의원 Adam Schiff는 2025년 10월 31일 백악관 비서실장과 보건복지부 장관에게 보낸 공동 서한에서, Means가 직접 만든 정책으로 자기 회사가 이득을 봤다고 지적했다. 두 사람은 그 예로 Truemed가 비데(Alpha JX2 Bidet)까지 자가면역과 소화기, 관절 건강에 도움이 된다며 HSA 대상 상품으로 광고한다는 점을 들었고, 근거 자료로는 9,000달러짜리 사우나에 세금 혜택을 받게 해 준다는 New York Times 기사(2025년 7월 18일)를 인용했다. Means는 2025년 말 정부를 떠나거나 정규직으로 자리를 옮기는 과정에서 지분을 전량 매각했다고 밝혔으나, 매각 시점에 대한 보도가 서로 조금씩 다르다. 2026년 6월에는 법무법인 Migliaccio & Rathod가 소비자에게 예상치 못한 세금 부담이 생겼는지 조사한다고 공지했으나, 소송이 실제로 제기되지는 않았다. 제휴 브랜드 3,000곳과 이용자 100만 명, 2년 연속 매출 3배 성장은 모두 회사가 스스로 낸 수치이고 제삼자가 확인한 것이 아니다. 브랜드 수는 직접 세어 검증하지 못했다. 이커머스 상품의 수수료율도 브랜드 계약서가 요율을 계약상 비밀로 못 박고 있어 밖에서는 알 수 없다. 평균 30퍼센트 절약이라는 문구도 소득이 있는 미국 중위 납세자의 세율을 가정해 계산한 값이라고 회사가 밝히고 있어서 개인마다 실제 절감액은 달라진다. 위험을 누가 지는지도 분명하다. 회사의 이용약관은 소견서를 받았다고 해서 계좌 운영사나 고용주가 인정한다는 보장이 없고, 미국 국세청이나 주·지방 세무당국이 그 지출을 213(d)조 인정 의료비로 볼 것이라는 보장도 없다고 적은 뒤, 소견서에 기대어 자격을 입증하는 일은 전적으로 이용자 본인의 위험이며 그에 따른 금전적 책임도 본인이 전부 진다고 명시한다. 회사 블로그에서는 국세청 규정에 어긋나지 않는다는 오해 풀이를 싣고 있지만, 약관에서는 그 책임을 이용자에게 넘겨 두었다는 점을 함께 봐야 한다. 참고로 회사 소개 페이지에는 이제 Justin Mares만 나오고 Calley Means의 이름은 나오지 않는다. 한편 헬스장 회원권과 운동비를 연 500달러까지 HSA 인정 의료비로 삼는 조항은 2025년 세법 개정안 가운데 하원 통과본에는 들어 있었으나 최종 법에서 삭제됐다. 그래서 지금 헬스장 회원권에 HSA를 쓰는 길은 이 소견서 방식밖에 없다. 이 회사의 사업이 법 개정 하나에 크게 흔들릴 수 있다는 뜻이기도 하다.","for_us":"이 회사가 파는 것은 상품이 아니라 이 지출이 의료비로 인정된다는 판정과 그 근거 문서다. 결제 화면에서 설문 몇 개를 받아 판정을 붙여 주는 것만으로 소비자가 실제로 내는 값이 30퍼센트 가까이 줄어들기 때문에, 필요한 것은 기기나 임상 데이터가 아니라 소프트웨어와 제휴다. 다만 우리가 같은 일을 직접 하려면 면허 의료인 발급 체계와 세법 판단 책임을 함께 떠안아야 해서 3개월 안에 시도하기에는 위험이 크다. 대신 우리 앱 화면 안에서 할 수 있는 일이 두 가지 있다. 첫째, 미국 이용자에게 지금 HSA나 FSA에 얼마가 남아 있는지 알려 주고, FSA라면 연말까지 쓰지 않으면 사라지는 금액을 계산해 보여 주는 안내다. 둘째, Truemed나 Flex의 제휴 브랜드로 연결해 주는 자리를 만드는 것이며, 이렇게 하면 세법 판단은 그 회사가 하고 우리는 이용자를 연결하는 역할만 맡는다. 연말이라는 정해진 기한이 있고 쓰지 않으면 돈이 사라진다는 조건은 앱에서 알림과 목표를 붙이기에 잘 맞는다.","screenshots":[{"file":"truemed_shop.png","caption":"소비자용 마켓플레이스 첫 화면이다. HSA·FSA 자금을 실제로 원하는 상품에 쓰라는 문구와 평균 30퍼센트 절약, 이용자 100만 명이라는 표기가 보인다.","from":"https://shopping.truemed.com/hsa-fsa-shopping"},{"file":"truemed_brands.png","caption":"같은 페이지 전체다. Peloton과 Thorne, Tonal, Plunge, Orthofeet 같은 제휴 브랜드와 결제, 건강 설문, HSA·FSA 결제로 이어지는 3단계 이용 절차가 나와 있다.","from":"https://shopping.truemed.com/hsa-fsa-shopping"},{"file":"truemed_help.png","caption":"고객 도움말의 자격 기준 안내다. 세법 213(d)조를 근거로 삼되 일반적인 건강에 이롭기만 한 지출은 인정되지 않는다고 회사가 직접 설명하고 있다.","from":"https://help.truemed.com/eligibility-qualification/eligibility-qualification-overview"},{"file":"truemed_merchant.png","caption":"가맹점용 기술 문서다. 결제 처리와 환급 지원이라는 두 갈래로 상점에 붙는다는 설명이 나와 있다.","from":"https://docs.truemed.com/guides/get-started/how-truemed-works"}],"sources":[{"title":"Investing in Truemed","url":"https://a16z.com/announcement/investing-in-truemed/","note":"a16z가 밝힌 투자 이유와 제휴 브랜드 3,000곳, 평균 30퍼센트 절약 수치를 확인했다."},{"title":"Truemed Closes $34 Million Series A To Unlock HSA/FSA Funds For Lifestyle Interventions","url":"https://www.prnewswire.com/news-releases/truemed-closes-34-million-series-a-to-unlock-hsafsa-funds-for-lifestyle-interventions-302647740.html","note":"투자 규모와 참여 투자사, 본사 위치, 매출 3배 성장 발표를 확인했다."},{"title":"How Truemed works (가맹점용 기술 문서)","url":"https://docs.truemed.com/guides/get-started/how-truemed-works","note":"결제 연동 방식과 소견서 12개월 유효, 24시간에서 48시간 검토 시간을 확인했다."},{"title":"Eligibility & Qualification Overview (고객 도움말)","url":"https://help.truemed.com/eligibility-qualification/eligibility-qualification-overview","note":"인정 기준과 헬스장 회원권 포함 여부, 계좌 운영사가 최종 판단권을 가진다는 안내를 확인했다."},{"title":"HSA/FSA Eligible Products (소비자 마켓플레이스)","url":"https://shopping.truemed.com/hsa-fsa-shopping","note":"제휴 브랜드 목록과 3단계 이용 절차, 이용자 100만 명 표기를 확인했다."},{"title":"Disclosures (Truemed 고지 문서)","url":"https://www.truemed.com/disclosures","note":"서비스 비용이 상품 가격에 포함된다는 안내와, 계좌 운영사가 청구를 거절할 수 있고 사실과 다르게 답하면 세금 불이익이 생길 수 있다는 면책 문구를 확인했다."},{"title":"Gyms & Studios (Truemed 상품 분류)","url":"https://www.truemed.com/shop/gym-studios","note":"헬스장과 스튜디오 회원권이 실제 대상 분류로 있고 Barry's, ClassPass, Club Pilates가 제휴돼 있음을 확인했다."},{"title":"Publication 969, Health Savings Accounts and Other Tax-Favored Health Plans","url":"https://www.irs.gov/publications/p969","note":"HSA와 FSA의 가입 조건, 이월 규칙, 인정 의료비 정의를 확인했다."},{"title":"IRS alert: Beware of companies misrepresenting nutrition, wellness and general health expenses as medical care for FSAs, HSAs, HRAs and MSAs (IR-2024-65)","url":"https://www.irs.gov/newsroom/irs-alert-beware-of-companies-misrepresenting-nutrition-wellness-and-general-health-expenses-as-medical-care-for-fsas-hsas-hras-and-msas","note":"자기 보고 정보만으로 발급한 소견서를 인정하지 않는다는 국세청 경고와 계좌 자격 상실 위험을 확인했다."},{"title":"TrueMed's payment integration platform unlocks HSA/FSA for health, not sickness","url":"https://techcrunch.com/2023/09/18/truemed-payment-integration-hsa-fsa/","note":"창업 배경과 초기 투자 350만 달러, 창업자 경력을 확인했다."},{"title":"Congressman Auchincloss Probes Corruption of Healthcare Executives in the Trump Administration","url":"https://auchincloss.house.gov/media/press-releases/congressman-auchincloss-probes-corruption-of-healthcare-executives-in-the-trump-administration","note":"Calley Means의 이해충돌을 문제 삼은 의회 서한 내용을 확인했다."},{"title":"헬스장·스튜디오 가맹점 가입 안내","url":"https://www.truemed.com/partners/dtc-merchant-sign-up","note":"가맹점 750달러 일회성, 이후 거래 수수료와 월 이용료 없음, 회원이 소견서 한 건당 20달러 부담, 업종 분류 문제로 헬스장에서는 카드 결제 대신 환급 방식을 쓴다는 안내를 원문으로 확인했다."},{"title":"Brand Agreement (가맹 브랜드 계약서)","url":"https://www.truemed.com/legal/brand-agreement","note":"주문 금액에서 수수료를 먼저 떼고 나머지를 브랜드에 정산한다는 조항과, 요율이 계약상 비밀이라는 조항을 확인했다."},{"title":"Terms of Service (Truemed 이용약관)","url":"https://www.truemed.com/terms","note":"소견서에 기대어 자격을 입증하는 일이 전적으로 이용자 본인의 위험이고, 국세청이 213(d)조 인정 의료비로 볼 것이라는 보장이 없다는 조항을 원문으로 확인했다."},{"title":"Letter from Representative Auchincloss to the TrueMed Board of Directors","url":"https://auchincloss.house.gov/imo/media/doc/auchincloss_letter_to_truemed_board_of_directors.pdf","note":"2025년 6월 16일 자 서한 원문이다. 기업 가치가 2024년 1월 이후 3배 가까이 올랐다는 지적과 본사 주소를 확인했다."},{"title":"What the One Big Beautiful Bill Act Means for Employee Benefits","url":"https://www.tasconline.com/legislative-updates/what-the-one-big-beautiful-bill-act-means-for-employee-benefits/","note":"헬스장 회원권과 운동비를 연 500달러까지 HSA 인정 의료비로 삼는 조항이 최종 법에서 삭제됐다는 사실을 항목별 목록으로 확인했다."},{"title":"Auchincloss and Schiff Letter on Potential Conflict of Interest with Calley Means","url":"https://www.schiff.senate.gov/wp-content/uploads/2025/11/Auchincloss-Schiff-Letter-on-Potential-COI-with-Calley-Means.pdf","note":"2025년 10월 31일 자 공동 서한 원문이다. 임명일과 이해충돌 지적, Truemed가 비데를 HSA 대상으로 광고한다는 사례를 확인했다."},{"title":"A Kennedy Aide's Start-Up Can Get You a Tax Break on a $9,000 Sauna","url":"https://www.nytimes.com/2025/07/18/business/truemed-fsa-hsa-calley-means-maha.html","note":"이 방식을 비판적으로 다룬 New York Times 기사다. 본문은 열지 못했고 의회 서한의 인용을 통해 존재와 논지를 확인했다."},{"title":"Truemed HSA/FSA Medical Necessity Investigation","url":"https://classlawdc.com/2026/06/02/truemed-hsa-fsa-medical-necessity-investigation/","note":"법무법인이 소비자 피해 여부를 조사 중이라는 공지를 확인했다. 소송 제기 단계는 아니다."},{"title":"A List of Tax Provisions Left Out of the Big Beautiful Bill","url":"https://bipartisanpolicy.org/explainer/tax-provisions-left-out-of-obbb/","note":"헬스장 회원권을 HSA 대상에 넣는 조항이 최종 법에서 빠졌다는 사실을 확인했다."},{"title":"Truemed Lands $34M To Grow HSA/FSA Purchase Platform","url":"https://athletechnews.com/truemed-34-million-funding-hsa-fsa/","note":"피트니스 업계 관점의 투자 보도와 창업자 발언을 확인했다."}]}}}</script>
<script>
(function(){
"use strict";
var DB = JSON.parse(document.getElementById('payload').textContent);
var ISSUES = DB.issues || [];
var EXTRAS = DB.extras || {};
var COMPANIES = DB.companies || {};
var TYPE_LABEL = {reads:'테크 리즈', policy:'정책 브리핑', roundup:'그랜드 라운드업', interview:'인터뷰', event:'안내'};
var THEME_LABEL = DB.themeLabels || {};

/* ---------- theme toggle ---------- */
var root = document.documentElement;
try{ var saved = localStorage.getItem('htn-theme'); if(saved) root.setAttribute('data-theme', saved); }catch(e){}
document.getElementById('themebtn').addEventListener('click', function(){
  var cur = root.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : (cur === 'light' ? 'dark' : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark'));
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('htn-theme', next); }catch(e){}
});

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function el(html){ var d = document.createElement('div'); d.innerHTML = html; return d; }
function fmtDate(d){ if(!d) return ''; var p = d.split('-'); return p[0] + '.' + p[1] + '.' + p[2]; }
function monthKey(d){ var p = String(d||'').split('-'); return p[0] + '년 ' + parseInt(p[1],10) + '월'; }
function issueText(it){
  if(it._txt) return it._txt;
  var buf = [it.title_ko, it.title_en, it.hook, (it.tldr||[]).join(' ')];
  (it.sections||[]).forEach(function(s){
    buf.push(s.heading_ko, s.heading_en, s.what, s.why, s.structure, s.consumer);
    (s.players||[]).forEach(function(p){ buf.push(p.name, p.what); });
    (s.terms||[]).forEach(function(t){ buf.push(t.en, t.ko, t.plain); });
    (s.numbers||[]).forEach(function(n){ buf.push(n.value, n.meaning); });
  });
  (it.glossary||[]).forEach(function(t){ buf.push(t.en, t.ko, t.plain); });
  it._txt = buf.join(' ').toLowerCase();
  return it._txt;
}

/* ---------- state ---------- */
var state = { view:'home', id:null, q:'', types:{}, theme:null, raw:null, tab:'list' };
try{ state.cmp = localStorage.getItem('htn-cmp') === '1'; }catch(e){}

/* ---------- sidebar ---------- */
var NAV = [
  {k:'home',  t:'시작하기'},
  {k:'primer',t:'미국 헬스케어 101'},
  {k:'consumer', t:'소비자 시장'},
  {k:'companies',t:'투자받은 회사'},
  {k:'themes',t:'주제별'},
  {k:'timeline',t:'타임라인'},
  {k:'glossary',t:'용어사전'}
];
function renderNav(){
  document.getElementById('navlinks').innerHTML = NAV.map(function(n){
    return '<button class="navlink' + (state.view===n.k?' on':'') + '" data-nav="' + n.k + '">' + esc(n.t) + '</button>';
  }).join('');
}
function renderFilters(){
  var counts = {};
  ISSUES.forEach(function(i){ counts[i.type] = (counts[i.type]||0)+1; });
  var keys = Object.keys(TYPE_LABEL).filter(function(k){ return counts[k]; });
  document.getElementById('filters').innerHTML = keys.map(function(k){
    return '<button class="chip' + (state.types[k]?' on':'') + '" data-type="' + k + '">' +
      esc(TYPE_LABEL[k]) + ' ' + counts[k] + '</button>';
  }).join('');
}
function filtered(){
  var q = state.q.trim().toLowerCase();
  var anyType = Object.keys(state.types).some(function(k){ return state.types[k]; });
  return ISSUES.filter(function(it){
    if(anyType && !state.types[it.type]) return false;
    if(state.theme && (it.themes||[]).indexOf(state.theme) < 0) return false;
    if(q && issueText(it).indexOf(q) < 0) return false;
    return true;
  });
}
function renderList(){
  var list = filtered(), out = [], lastM = '';
  if(!list.length){ document.getElementById('issuelist').innerHTML = '<div class="empty">조건에 맞는 회차가 없습니다</div>'; return; }
  list.forEach(function(it){
    var m = monthKey(it.date);
    if(m !== lastM){ out.push('<div class="ilist-month">' + esc(m) + '</div>'); lastM = m; }
    out.push(
      '<button class="irow' + (state.view==='issue' && state.id===it.index ? ' on':'') + '" data-issue="' + esc(it.index) + '">' +
        '<span class="r1"><span class="num">' + esc(it.index) + '</span>' +
        '<span class="badge b-' + esc(it.type) + '">' + esc(TYPE_LABEL[it.type]||it.type) + '</span></span>' +
        '<span class="ttl">' + esc(it.title_ko) + '</span>' +
        '<span class="sub">' + esc(fmtDate(it.date)) + ' · ' + esc((it.hook||'').slice(0,44)) + '…</span>' +
      '</button>');
  });
  document.getElementById('issuelist').innerHTML = out.join('');
}

/* ---------- views ---------- */
function qaHTML(cls, label, text){
  /* 줄바꿈으로 나뉜 덩어리를 문단으로 만든다. 줄바꿈이 없고 길기만 하면
     문장 경계를 찾아 대략 260자 단위로 끊어 읽기 부담을 줄인다. */
  var parts = String(text).split(/\n\s*\n|\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  if(parts.length === 1 && parts[0].length > 420){
    var sents = parts[0].match(/[^.!?]+[.!?]+(?:\s|$)|[^.!?]+$/g) || [parts[0]];
    var acc = [], cur = '';
    sents.forEach(function(sn){
      cur += sn;
      if(cur.length >= 260){ acc.push(cur.trim()); cur = ''; }
    });
    if(cur.trim()) {
      if(acc.length && cur.trim().length < 90) acc[acc.length-1] += ' ' + cur.trim();
      else acc.push(cur.trim());
    }
    parts = acc;
  }
  return '<div class="qa ' + cls + '"><span class="lbl">' + esc(label) + '</span>' +
    parts.map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('') + '</div>';
}
function rawHTML(raw, n){
  /* 원문을 번역만 한 대조군. 정리 노트 꼭지와 순서가 1대 1로 맞는다. */
  if(!raw || !raw.sections || !raw.sections[n]) return '';
  var r = raw.sections[n];
  var paras = String(r.body || '').split(/\n\s*\n|\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  return '<div class="rawcol"><span class="rawlbl">원문 번역만</span>' +
    paras.map(function(x){ return '<p>' + esc(x) + '</p>'; }).join('') + '</div>';
}
var SKIP_LABEL = {
  sponsor: {t:'광고', d:'후원사가 돈을 내고 실은 자리다. 건너뛰어도 된다.'},
  promo:   {t:'홍보·안내', d:'뉴스레터가 자기 행사나 커뮤니티를 알리는 자리다. 건너뛰어도 된다.'},
  admin:   {t:'잡다한 안내', d:'인사말이나 일정 공지처럼 내용이 거의 없는 자리다.'}
};
function secHTML(s, n){
  var b = [];

  /* 맨 위: 요약과 인사이트 */
  if(s.summary){

var scrollTimer = null;
function trackScroll(){
  if(scrollTimer) return;
  scrollTimer = setInterval(function(){
    var secsEl = document.querySelectorAll('[id^="s"]');
    var cur = -1, top = 120;
    secsEl.forEach(function(e){
      if(!/^s\d+$/.test(e.id)) return;
      if(e.getBoundingClientRect().top <= top) cur = parseInt(e.id.slice(1), 10);
    });
    document.querySelectorAll('.stoc').forEach(function(b){
      b.classList.toggle('on', parseInt(b.dataset.sn, 10) === cur);
    });
  }, 400);
}
function mdish(t){
  /* very small formatter: **bold**, `code`, paragraphs, - lists, ## heads */
  var lines = String(t||'').split('\n'), out = [], inList = false;
  function inline(s){
    return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
                 .replace(/`(.+?)`/g,'<code>$1</code>')
                 .replace(/\[\[(\d{2})\]\]/g,'<button class="tt" data-issue="$1" style="padding:1px 7px">$1회차</button>');
  }
  lines.forEach(function(l){
    var s = l.trim();
    if(!s){ if(inList){ out.push('</ul>'); inList=false; } return; }
    if(/^###\s/.test(s)){ if(inList){out.push('</ul>');inList=false;} out.push('<h4>'+inline(s.replace(/^###\s/,''))+'</h4>'); return; }
    if(/^##\s/.test(s)){ if(inList){out.push('</ul>');inList=false;} out.push('<h3>'+inline(s.replace(/^##\s/,''))+'</h3>'); return; }
    if(/^[-*]\s/.test(s)){ if(!inList){ out.push('<ul>'); inList=true; } out.push('<li>'+inline(s.replace(/^[-*]\s/,''))+'</li>'); return; }
    if(inList){ out.push('</ul>'); inList=false; }
    out.push('<p>'+inline(s)+'</p>');
  });
  if(inList) out.push('</ul>');
  return out.join('');
}

    (c.sells_to ? '<span class="badge b-reads">' + esc(SELLS_LABEL[c.sells_to] || c.sells_to) + '</span>' : '') +
    (c.site ? '<span>' + esc(c.site.replace(/^https?:\/\//,'')) + '</span>' : '') +
    ((c.seen_in||[]).map(function(x){
      return '<span>·</span><button class="tt" data-issue="' + esc(x.issue) + '">' + esc(x.issue) + '회차</button>'; }).join('')) +
    '</div>');
  if(c.one_liner) h.push('<div class="hook">' + esc(c.one_liner) + '</div>');

  function block(title, body, cls){
    if(!body) return;
    h.push('<div class="cblock ' + (cls||'') + '"><span class="lbl">' + esc(title) + '</span>' +
      String(body).split(/\n\s*\n|\n/).filter(Boolean).map(function(x){
        return '<p>' + esc(x.trim()) + '</p>'; }).join('') + '</div>');
  }
  block('푸는 문제', c.problem);
  block('솔루션', c.solution);
  if((c.features||[]).length){
    h.push('<div class="cblock"><span class="lbl">기능 상세</span><ul class="cfeat">' +
      c.features.map(function(f){
        return '<li><b>' + esc(f.name) + '</b><span>' + esc(f.detail||'') + '</span></li>'; }).join('') + '</ul></div>');
  }
  block('차별점', c.differentiator);
  if((c.screenshots||[]).length){
    h.push('<div class="cblock"><span class="lbl">화면</span><div class="cshots">' +
      c.screenshots.map(function(sh){
        var src = 'assets/companies/' + esc(sh.file);
        return '<figure><a href="' + src + '" target="_blank" rel="noopener">' +
          '<img src="' + src + '" alt="' + esc(sh.caption||'') + '" loading="lazy"></a>' +
          '<figcaption>' + esc(sh.caption||'') + '</figcaption></figure>'; }).join('') + '</div></div>');
  }
  if((c.team||[]).length){
    h.push('<div class="cblock"><span class="lbl">팀</span><ul class="cteam">' +
      c.team.map(function(t){
        return '<li><b>' + esc(t.name) + '</b>' + (t.role ? '<span class="role">' + esc(t.role) + '</span>' : '') +
          (t.background ? '<span>' + esc(t.background) + '</span>' : '') + '</li>'; }).join('') + '</ul></div>');
  }
  if((c.traction||[]).length){
    h.push('<div class="cblock"><span class="lbl">성과</span><ul class="ctrac">' +
      c.traction.map(function(t){
        return '<li><span class="tt2 t-' + esc(t.type||'') + '">' + esc(TRACTION_LABEL[t.type] || t.type || '') + '</span>' +
          '<span class="d">' + esc(t.detail||'') + '</span>' +
          (t.when ? '<span class="w">' + esc(t.when) + '</span>' : '') + '</li>'; }).join('') + '</ul></div>');
  }
  block('주의해서 볼 대목', c.caveats, 'warn');
  block('우리 목적에 비추어', c.for_us, 'forus');
  if((c.sources||[]).length){
    h.push('<div class="cblock"><span class="lbl">확인한 자료</span><ul class="csrc">' +
      c.sources.map(function(x){
        return '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.title||x.url) + '</a>' +
          (x.note ? '<span>' + esc(x.note) + '</span>' : '') + '</li>'; }).join('') + '</ul></div>');
  }
  document.getElementById('content').innerHTML = h.join('');
}
function viewHome(){
  document.getElementById('crumb').textContent = '시작하기';
  var d = EXTRAS.home;
  var h = ['<h2>Health Tech Nerds 정리 노트</h2>'];
  h.push('<div class="hook">미국 헬스케어 업계 뉴스레터 ' + ISSUES.length + '회차(2026년 1월~8월)를, 헬스케어도 영어도 익숙하지 않은 사람이 읽을 수 있게 한글로 다시 쓴 노트입니다.</div>');
  if(d && d.sections){ d.sections.forEach(function(s,n){ h.push('<h3 id="h'+n+'">' + esc(s.heading) + '</h3>'); h.push(mdish(s.body)); }); }
  h.push('<h3>회차 한눈에 보기</h3>');
  var byType = {};
  ISSUES.forEach(function(i){ (byType[i.type] = byType[i.type] || []).push(i); });
  h.push('<div class="stats">' + Object.keys(byType).map(function(k){
    return '<div class="stat"><b>' + byType[k].length + '</b><span>' + esc(TYPE_LABEL[k]||k) + '</span></div>'; }).join('') + '</div>');
  h.push('<p style="color:var(--muted);font-size:13.5px">왼쪽 목록에서 회차를 고르거나, <button class="tt" data-nav="primer">미국 헬스케어 101</button> 부터 읽어보세요.</p>');
  document.getElementById('content').innerHTML = h.join('');
}

/* ---------- router ---------- */
function render(){
  renderNav(); renderFilters(); renderList();
  var v = state.view;
  /* 회차 화면만 비교 모드로 넓어진다. 나머지 화면은 기본 폭으로 되돌린다. */
  if(v !== 'issue'){ document.getElementById('content').className = 'wrap doc';
    document.getElementById('sidetoc').innerHTML = ''; setTab('list'); }
  if(v === 'issue') viewIssue(state.id);
  else if(v === 'companies') viewCompanies();
  else if(v === 'company') viewCompany(state.id);
  else if(v === 'glossary') viewGlossary();
  else if(v === 'themes') viewThemes();
  else if(v === 'timeline') viewTimeline();
  else if(v === 'primer') viewDoc('primer','미국 헬스케어 101');
  else if(v === 'consumer') viewDoc('consumer','소비자 시장');
  else viewHome();
  document.querySelector('.main').scrollTop = 0;
  window.scrollTo(0,0);
}
function go(view, id){
  state.view = view; state.id = id || null;
  var hash = (view === 'issue' || view === 'company') ? '#/' + view + '/' + id : '#/' + view;
  if(location.hash !== hash) location.hash = hash;
  else render();
  closeSide();
}
function fromHash(){
  var m = /^#\/issue\/(\w+)/.exec(location.hash);
  if(m){ state.view='issue'; state.id=m[1]; return; }
  var mc = /^#\/company\/([\w-]+)/.exec(location.hash);
  if(mc){ state.view='company'; state.id=mc[1]; return; }
  var m2 = /^#\/(\w+)/.exec(location.hash);
  state.view = m2 ? m2[1] : 'home'; state.id = null;
}
window.addEventListener('hashchange', function(){ fromHash(); render(); });

/* ---------- events ---------- */
function setTab(which){
  state.tab = which;
  var hasToc = document.getElementById('sidetoc').innerHTML.trim().length > 0;
  if(which === 'toc' && !hasToc) which = 'list';
  /* CSS 기본값이 display:none 이므로 빈 문자열이 아니라 값을 명시해야 한다. */
  document.getElementById('issuelist').style.display = which === 'list' ? 'block' : 'none';
  document.getElementById('sidetoc').style.display = which === 'toc' ? 'block' : 'none';
  document.getElementById('filters').style.display = which === 'list' ? 'flex' : 'none';
  document.querySelectorAll('#sidetabs button').forEach(function(b){
    b.classList.toggle('on', b.dataset.tab === which);
  });
  document.getElementById('sidetabs').style.display = hasToc ? 'flex' : 'none';
}
function closeSide(){ document.getElementById('side').classList.remove('open'); document.getElementById('scrim').classList.remove('on'); }
document.getElementById('menubtn').addEventListener('click', function(){
  document.getElementById('side').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('on');
});
document.getElementById('scrim').addEventListener('click', closeSide);
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-issue],[data-nav],[data-type],[data-theme-go],[data-anchor],[data-cmp],[data-tab],[data-company]');
  if(!t) return;
  if(t.dataset.company){ e.preventDefault(); go('company', t.dataset.company); return; }
  if(t.dataset.tab){ e.preventDefault(); setTab(t.dataset.tab); return; }
  if(t.dataset.cmp){ e.preventDefault(); state.cmp = !state.cmp;
    try{ localStorage.setItem('htn-cmp', state.cmp ? '1' : '0'); }catch(err){}
    render(); return; }
  if(t.dataset.issue){ e.preventDefault(); state.theme=null; go('issue', t.dataset.issue); return; }
  if(t.dataset.nav){ e.preventDefault(); state.theme=null; go(t.dataset.nav); return; }
  if(t.dataset.type){ e.preventDefault(); state.types[t.dataset.type] = !state.types[t.dataset.type]; renderFilters(); renderList(); return; }
  if(t.dataset.themeGo){ e.preventDefault(); state.theme = t.dataset.themeGo; state.q=''; document.getElementById('q').value=''; renderList(); closeSide();
    document.getElementById('crumb').textContent = '#' + (THEME_LABEL[state.theme]||state.theme) + ' 로 목록 필터됨'; return; }
  if(t.dataset.anchor){ e.preventDefault(); closeSide();
    var el2 = document.getElementById(t.dataset.anchor);
    if(el2) el2.scrollIntoView({behavior:'smooth', block:'start'});
    return; }
});
var qt;
document.getElementById('q').addEventListener('input', function(e){
  clearTimeout(qt); var v = e.target.value;
  qt = setTimeout(function(){ state.q = v; state.theme=null; renderList(); if(state.view==='glossary') viewGlossary(); }, 120);
});
document.addEventListener('keydown', function(e){
  if(e.key === '/' && document.activeElement.tagName !== 'INPUT'){ e.preventDefault(); document.getElementById('q').focus(); }
  if(state.view==='issue' && !e.metaKey && !e.ctrlKey && document.activeElement.tagName !== 'INPUT'){
    var i = ISSUES.findIndex(function(x){ return x.index === state.id; });
    if(e.key === 'ArrowLeft' && ISSUES[i-1]) go('issue', ISSUES[i-1].index);
    if(e.key === 'ArrowRight' && ISSUES[i+1]) go('issue', ISSUES[i+1].index);
  }
});

fromHash(); render();
})();
</script>
</body>
</html>
