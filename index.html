 기기와 실질적으로 같다고 인정받은 것이지 체중 감량 효과를 입증한 것이 아니며, 성장 수치도 회사가 10배라는 배수로만 밝히고 실제 매출과 이용자 수는 공개하지 않았다."},"screenshots":[{"file":"signos_ios.png","caption":"미국 애플 앱스토어의 Signos 앱 화면이다. 앱은 무료로 받지만 구독 회원이 센서와 함께 써야 한다고 적혀 있고, 평가 1,014개에 평점 4.6점이다. 아래에는 Nutrisense와 Levels 같은 경쟁 앱이 함께 뜬다.","from":"https://apps.apple.com/us/app/signos/id1534943157"},{"file":"signos_play.png","caption":"구글 플레이의 Signos 앱 화면이다. 다운로드가 1만 회 이상으로 표시되고, 회원이 센서와 함께 쓰는 앱이라는 안내가 그대로 적혀 있다. 같은 페이지의 데스크톱 화면에서는 평점 4.2점에 리뷰 285개로 나온다.","from":"https://play.google.com/store/apps/details?id=com.signos.core"},{"file":"signos_stelo.png","caption":"Dexcom이 Signos에 대는 센서 Stelo를 소비자에게 직접 파는 사이트다. 처방이 필요 없다고 적혀 있고 월 구독 값이 정가 99달러, 할인가 89달러로 뜬다. Signos 구독도 이 사이트에서 팔기로 했다.","from":"https://www.stelo.com/"}],"q":"{\"slug\": \"signos\", \"name\": \"signos\", \"one_liner\": \"당뇨가 없는 사람에게 처방 없이 살 수 있는 연속혈당측정 센서를 매달 두 개씩 보내 주고, 센서가 보내는 혈당 값을 읽어 무엇을 먹고 언제 움직일지 알려 주는 앱을 함께 묶어 구독으로 파는 체중 관리 회사다.\", \"site\": \"https://www.signos.com\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"43\", \"section\": 22, \"headline\": \"소비자가 직접 사서 쓰는 연속혈당측정 서비스로 소개되면서 2,000만 달러를 조달했고, 센서를 만드는 dexcom과 보험사 bcbs alabama가 투자자로 들어온 조합이 눈에 띈다고 나왔다.\"}], \"card\": {\"problem\": \"미국에서 살을 빼려는 사람에게 놓인 선택지는 한 달에 1,000달러 가까이 드는 glp-1 주사약이거나 남이 만든 식단표를 그대로 따르는 것이다. 정작 자기가 먹은 음식이 자기 몸에서 어떤 반응을 일으키는지 확인할 방법은 없다.\", \"solution\": \"처방 없이 살 수 있는 dexcom stelo 센서를 매달 두 개 보내 주고, 앱이 혈당 곡선과 사진으로 찍은 식사 기록을 함께 읽어 이 음식이 혈당을 얼마나 올릴지 미리 알려 주고 혈당이 오르면 지금 움직이라고 알림을 보낸다.\", \"price\": \"센서 두 개를 포함해 6개월 구독이 정가 기준 월 169달러다. 보험은 적용되지 않으며, 2026년 9월 기준 할인 코드를 넣으면 월 127달러다.\", \"tags\": [\"연속혈당측정\", \"체중 관리\", \"구독\", \"처방 불필요\", \"ai 코칭\"], \"headline_traction\": \"2026년 5월에 2,000만 달러를 조달하면서 센서 제조사 dexcom이 투자자로 들어왔고, dexcom이 자사 소비자 판매 사이트에서 signos 구독을 팔기로 했다.\", \"watch\": \"fda 허가는 기존 기기와 실질적으로 같다고 인정받은 것이지 체중 감량 효과를 입증한 것이 아니며, 성장 수치도 회사가 10배라는 배수로만 밝히고 실제 매출과 이용자 수는 공개하지 않았다.\"}, \"problem\": \"미국에서 체중을 줄이는 방법은 두 갈래로 갈려 있다. 한쪽에는 wegovy나 zepbound 같은 glp-1 주사약이 있는데, 보험이 비만 치료를 잘 보장하지 않아 자기 돈으로 사면 한 달에 1,000달러 안팎이 들고, 처방 자체도 비만 진단이나 일정 수준 이상의 체질량지수를 요구한다. 다른 한쪽에는 남이 만든 식단표가 있는데, 같은 음식을 먹어도 사람마다 몸이 다르게 반응한다는 점을 설명하지 못한다. 혈당은 그 반응을 실시간으로 보여 주는 값이지만, 미국에서 연속혈당측정기는 원래 의사 처방이 있어야 살 수 있는 기기였고 처방 없이 살 수 있는 제품은 2024년에야 나왔다. 그래서 당뇨가 없는 사람이 자기 대사 상태를 알고 싶으면 최근에야 길이 열린 셈이다. 한국은 국가건강검진에서 공복혈당을 정기적으로 확인해 주지만 미국에는 전 국민을 대상으로 하는 그런 검진 제도가 없어서, 자기 몸의 수치를 알고 싶으면 스스로 사서 재야 한다.\", \"solution\": \"소비자는 signos 사이트에서 1개월, 3개월, 6개월 가운데 하나를 고르고 처방 없이 바로 결제한다. 결제할 때 18세 이상인지, 인슐린을 쓰고 있지는 않은지, 저혈당 문제나 섭식장애가 없는지를 스스로 확인하는 항목에 체크한다. 결제하면 dexcom이 만든 stelo 센서가 배송되는데, 한 개가 15일 동안 붙어 있으므로 한 달에 두 개씩 쓰고, 6개월 요금제는 3개월치씩 두 번에 나눠 배송된다. 센서는 5분마다 혈당을 재서 15분마다 블루투스로 폰에 보내고, 앱은 그 값에 사진으로 찍거나 바코드로 스캔한 식사 기록, 운동, 수면, 체중을 겹쳐 놓는다. 혈당이 튀면 앱이 과거 기록을 근거로 어느 정도 강도로 얼마나 움직이면 되는지 알려 주고, 먹기 전에는 그 음식이 혈당을 올릴지 미리 점수로 알려 준다. 값은 6개월 요금제가 정가 월 169달러, 3개월이 월 199달러, 1개월이 월 299달러이며 센서 값이 모두 포함돼 있다. 이미 glp-1을 쓰는 사람을 위해 센서만 6개월에 여섯 개 보내 주는 월 89달러짜리 요금제가 따로 있고, 약까지 함께 받으려는 사람을 위한 월 199달러짜리 요금제도 있다.\", \"features\": [{\"name\": \"센서 배송과 혈당 측정\", \"detail\": \"dexcom이 만든 stelo 센서를 매달 두 개 보내 준다. 한 개를 15일 동안 팔 위쪽에 붙여 두면 5분마다 혈당을 재서 15분마다 폰으로 보낸다. 앱은 이 센서 하나만 지원한다.\"}, {\"name\": \"식사 기록과 미리 매기는 점수\", \"detail\": \"음식을 사진으로 찍거나 바코드를 스캔하거나 글로 적으면 ai가 무슨 음식인지와 영양 구성을 알아내고, 먹기 전에 그 음식이 혈당을 얼마나 올릴지 알려 준다. 회사는 2026년 조달한 자금을 이 기능을 넓히는 데 쓴다고 밝혔다.\"}, {\"name\": \"혈당이 오르면 보내는 움직임 알림\", \"detail\": \"혈당이 튀면 그 사람의 지난 기록을 근거로 어떤 운동을 어느 정도로 하면 혈당이 내려가는지 계산해 지금 움직이라고 알린다. 이것이 이 서비스의 핵심 흐름이다.\"}, {\"name\": \"등록 영양사 상담\", \"detail\": \"앱 안에서 영양사와 채팅하거나 화상으로 만날 수 있다. 회사 각주에 따르면 이 영양사는 nourish라는 외부 회사가 대는 독립 영양사이며, nourish는 자기 환자의 94%가 상담비를 한 푼도 내지 않는다고 밝힌다.\"}, {\"name\": \"다른 기기와의 연동\", \"detail\": \"apple health, google health connect, 스마트워치, 스마트 체중계와 연결해 수면과 심박수, 운동, 체중을 함께 본다.\"}, {\"name\": \"signos+ glp-1 요금제\", \"detail\": \"월 199달러에 3개월 또는 6개월짜리 glp-1 치료와 센서를 함께 준다. 처방은 signos가 아니라 openloop health 소속 독립 의료인이 하며, 회사 고지에 따르면 약은 조제 의약품이다.\"}, {\"name\": \"signos essentials 요금제\", \"detail\": \"이미 glp-1을 쓰고 있는 사람을 위한 요금제다. 6개월 동안 15일짜리 센서를 여섯 개만 보내 주고 약은 포함하지 않으며 처방도 필요 없다. 값은 월 89달러다.\"}, {\"name\": \"조직 대상 판매 창구\", \"detail\": \"고용주, 보험사, 의료 제휴사를 위한 페이지를 따로 두고 있다. 다만 2025년 8월 기준으로 체중 관리 용도에는 보험이 적용되지 않으며, 회사는 보험사와 고용주를 상대로 적용을 논의하고 있다고 밝혔다.\"}], \"differentiator\": \"같은 센서를 만드는 dexcom은 그 센서를 stelo라는 이름으로 직접 판다. 값은 월 구독 정가 99달러이고 할인가는 89달러이며 역시 처방이 필요 없다. signos는 같은 센서에 앱과 영양사 상담을 붙여 정가 월 169달러를 받으므로, 소비자가 더 내는 70달러가 소프트웨어 값인 셈이다. abbott은 lingo라는 자사 센서를 한 개 54달러부터 판다. 애플 앱스토어가 signos와 나란히 보여 주는 앱은 nutrisense와 levels, sugarmate로, 모두 같은 자리를 노린다. signos가 내세우는 차이는 두 가지다. 하나는 체중 관리 용도로 fda 허가를 받은 첫 시스템이라는 점이고, 다른 하나는 센서 제조사가 투자자로 들어와 자사 판매 사이트에 signos를 올려 준다는 점이다. 다만 그 사이트는 이미 nutrisense의 영양 상담도 함께 걸어 두고 있어서, 유통 창구를 얻은 것이 곧 독점을 얻은 것은 아니다.\", \"team\": [{\"name\": \"sharam fouladgar-mercer\", \"role\": \"창업자, ceo\", \"background\": \"2018년에 signos를 세웠다. 본인이 평생 체중 관리에 어려움을 겪었고 대학에서 하키 선수로 뛰면서 같은 음식이 팀 동료와 자기에게 다르게 작용한다는 점을 느낀 것이 창업 계기였다고 cnbc에 밝혔다.\"}, {\"name\": \"bill tancer\", \"role\": \"창업자, 데이터과학 총괄\", \"background\": \"회사 소개 글에 따르면 자기 체중을 스프레드시트로 꼼꼼히 기록하던 사람이며, sharam과 나눈 대화에서 signos가 시작됐다고 적혀 있다. 그 전 경력은 확인하지 못했다.\"}, {\"name\": \"pierre wehbe\", \"role\": \"공동창업자, 수석 아키텍트\", \"background\": \"\"}, {\"name\": \"roger neel\", \"role\": \"최고기술책임자 겸 최고마케팅책임자\", \"background\": \"\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"2,000만 달러를 조달했다. 보도자료와 기사에 이름이 나온 참여자는 gv와 dexcom, blue cross blue shield of alabama이며 이 보험사는 450 ventures를 통해 참여했다. 기업가치는 공개하지 않았다.\", \"when\": \"2026-05\", \"source\": \"cnbc, mobihealthnews, pulse 2.0\"}, {\"type\": \"partnership\", \"detail\": \"dexcom과의 협력을 넓혀, dexcom이 소비자에게 직접 파는 사이트 stelo.com에서 signos 구독을 팔기로 했다.\", \"when\": \"2026-05\", \"source\": \"mobihealthnews, pulse 2.0\"}, {\"type\": \"regulatory\", \"detail\": \"fda가 signos glucose monitoring system을 처방 없이 살 수 있는 연속혈당측정 시스템으로 인정했다. 접수는 2025년 1월 15일, 결정은 2025년 3월 21일이며 문서번호는 k250106이다. 회사는 이를 2025년 8월 20일에 발표했고, 체중 관리 용도로 허가받은 첫 시스템이라고 밝혔다.\", \"when\": \"2025-03\", \"source\": \"fda 510(k) 데이터베이스 k250106, cnbc\"}, {\"type\": \"funding\", \"detail\": \"2,000만 달러를 조달했다. cheyenne ventures와 gv가 주도했고 dexcom ventures가 참여했다. 당시 직원은 45명 안팎이었다.\", \"when\": \"2023-10\", \"source\": \"cnbc\"}, {\"type\": \"revenue\", \"detail\": \"매출과 이용자 수가 6개월 동안 열 배로 늘었다고 회사가 밝혔다. 다만 매출 금액과 이용자 수는 공개하지 않았다.\", \"when\": \"2026-05\", \"source\": \"cnbc 인터뷰, 회사 보도자료\"}, {\"type\": \"traffic\", \"detail\": \"미국 애플 앱스토어에서 평가 1,014개에 평점 4.6점이고, 구글 플레이에서는 리뷰 285개에 평점 4.2점, 다운로드는 1만 회 이상으로 표시된다.\", \"when\": \"2026-09\", \"source\": \"apple app store, google play\"}], \"caveats\": \"회사가 스스로 낸 수치와 제삼자가 확인한 수치를 갈라 볼 필요가 있다. 6개월 동안 열 배 성장했다는 말, 첫 달에 회원 86%가 성과를 봤다는 표시, 수만 명이 임상 연구에 참여했다는 말은 모두 회사가 밝힌 것이고 절대 수치가 없다. cnbc 기사에도 회사가 매출과 이용자 수, 기업가치를 공개하지 않았다고 적혀 있다. 제삼자로 확인되는 것은 fda 문서와 앱스토어 지표 정도다. fda 문서를 직접 보면 결론은 기존 기기와 실질적으로 같다는 인정(510(k))이며, 새 효과를 입증받은 것이 아니다. 허가 문구도 생활습관 변화가 혈당에 어떤 영향을 주는지 이해하는 데 도움이 되고 이것이 건강한 체중 유지에 쓸모 있을 수 있다는 표현이지, 체중이 준다는 문장이 아니다. 언론과 회사가 이를 승인이라고 쓰지만 성격이 다르다. 근거를 둘러싼 논쟁도 있다. 존스홉킨스 공중보건대학원이 2026년 1월에 낸 글에서 역학 전공 교수 elizabeth selvin과 michael fang은 당뇨가 없는 사람이 연속혈당측정으로 건강이 좋아진다는 근거가 부족하고 큰 임상시험이 없다고 말한다. 혈당만 쳐다보다가 콜레스테롤이나 나트륨처럼 중요한 다른 요소를 놓칠 수 있고, 정상 범위의 변동에도 불안해질 수 있다는 지적도 함께 나온다. 판매 조건도 봐야 한다. 모든 판매가 최종이라 환불과 교환이 없고, 6개월 요금제는 6개월마다 자동으로 갱신된다. 사이트에 뜨는 값은 25% 할인 코드가 적용된 값이라 정가와 다르다. 체중 관리 용도로는 보험이 적용되지 않는다. glp-1 요금제의 약은 조제 의약품이고 처방은 openloop health 소속 독립 의료인이 하며, signos 자신은 의료 행위를 하지 않는다고 고지한다. 뉴스레터가 2026년 라운드를 cheyenne ventures와 gv가 주도했다고 적었는데, 회사 보도자료와 기사에 이름이 나오는 2026년 참여자는 gv와 dexcom, bcbs alabama이고 cheyenne ventures가 주도한 것은 2023년의 같은 규모 라운드다.\", \"for_us\": \"이 회사가 파는 것은 센서가 아니라 센서 값을 행동으로 바꾸는 규칙이다. 혈당이 튀면 지금 얼마나 움직이라고 알리는 것이 핵심 흐름인데, 걸음 수를 이미 재고 있는 우리 앱과 바로 닿는 지점이다. 3개월 안에 기기를 만들 수는 없지만, 미국 사용자가 stelo나 lingo를 이미 붙이고 있다면 apple health와 google health connect를 통해 혈당 값을 읽어 오는 길이 있다. 센서가 없는 사용자에게도 식사를 사진으로 남기면 점수를 매기고 식사 뒤에 걷도록 알리는 흐름은 소프트웨어만으로 만들 수 있다. 값을 보면 소비자는 센서에 89달러를 내고 그 위에 얹힌 소프트웨어에 70달러를 더 내고 있으므로, 미국 소비자가 대사 관리 소프트웨어에 따로 돈을 낸다는 사실 자체는 확인된 셈이다. 다만 혈당 수치를 근거로 건강을 판정하면 규제와 근거 문제가 따라온다. 우리가 따라 할 수 있는 것은 판정이 아니라 행동을 부르는 알림 쪽이다.\", \"screenshots\": [{\"file\": \"signos_ios.png\", \"caption\": \"미국 애플 앱스토어의 signos 앱 화면이다. 앱은 무료로 받지만 구독 회원이 센서와 함께 써야 한다고 적혀 있고, 평가 1,014개에 평점 4.6점이다. 아래에는 nutrisense와 levels 같은 경쟁 앱이 함께 뜬다.\", \"from\": \"https://apps.apple.com/us/app/signos/id1534943157\"}, {\"file\": \"signos_play.png\", \"caption\": \"구글 플레이의 signos 앱 화면이다. 다운로드가 1만 회 이상으로 표시되고, 회원이 센서와 함께 쓰는 앱이라는 안내가 그대로 적혀 있다. 같은 페이지의 데스크톱 화면에서는 평점 4.2점에 리뷰 285개로 나온다.\", \"from\": \"https://play.google.com/store/apps/details?id=com.signos.core\"}, {\"file\": \"signos_stelo.png\", \"caption\": \"dexcom이 signos에 대는 센서 stelo를 소비자에게 직접 파는 사이트다. 처방이 필요 없다고 적혀 있고 월 구독 값이 정가 99달러, 할인가 89달러로 뜬다. signos 구독도 이 사이트에서 팔기로 했다.\", \"from\": \"https://www.stelo.com/\"}, {\"file\": \"signos_support.png\", \"caption\": \"signos 고객 지원 사이트다. 구독과 센서 사용, 앱 기능으로 안내가 나뉘어 있다. 본 사이트인 signos.com은 자동 접속을 막아 두어 갈무리하지 못했다.\", \"from\": \"https://support.signos.com/hc/en-us\"}], \"sources\": [{\"title\": \"signos 요금제 페이지\", \"url\": \"https://www.signos.com/plans\", \"note\": \"1개월·3개월·6개월 값과 센서 포함 조건, 환불 불가와 자동 갱신, glp-1 요금제 값을 확인했다.\"}, {\"title\": \"signos 회사 소개\", \"url\": \"https://www.signos.com/about\", \"note\": \"창업 이야기와 경영진 명단, 언론 보도 목록을 확인했다.\"}, {\"title\": \"signos essentials\", \"url\": \"https://www.signos.com/essentials\", \"note\": \"이미 glp-1을 쓰는 사람을 위한 월 89달러 요금제와 처방 불필요 표시를 확인했다.\"}, {\"title\": \"signos 첫 화면과 자주 묻는 질문\", \"url\": \"https://www.signos.com/\", \"note\": \"stelo 센서만 지원한다는 점, 측정 주기, 영양사 상담, 보험 적용 여부를 확인했다.\"}, {\"title\": \"cnbc, signos가 2,000만 달러를 조달하고 dexcom과 협력을 넓혔다\", \"url\": \"https://www.cnbc.com/2026/05/27/ai-health-tech-signos-dexcom.html\", \"note\": \"2026년 라운드 참여자와 유통 계약, 회사가 밝힌 열 배 성장, 기업가치 비공개를 확인했다.\"}, {\"title\": \"mobihealthnews, signos가 체중 관리용 혈당 측정 시스템으로 2,000만 달러를 모았다\", \"url\": \"https://www.mobihealthnews.com/news/signos-raises-20m-glucose-monitoring-system-weight-management\", \"note\": \"stelo.com 판매 계약과 fda 문서번호, 회사 설립 연도를 확인했다.\"}, {\"title\": \"pulse 2.0, signos가 2,000만 달러를 조달했다\", \"url\": \"https://pulse2.com/signos-20-million-raised-to-scale-fda-cleared-cgm-system-for-weight-management/\", \"note\": \"bcbs alabama가 450 ventures를 통해 참여했다는 사실과 ceo 발언을 확인했다.\"}, {\"title\": \"cnbc, fda가 체중 관리용 혈당 측정 시스템을 처음으로 허가했다\", \"url\": \"https://www.cnbc.com/2025/08/20/fda-approves-signos-glucose-monitoring-for-weight-loss.html\", \"note\": \"허가 발표 시점, 보험 미적용, glp-1 값과의 비교, ceo 이름을 확인했다.\"}, {\"title\": \"cnbc, signos가 2,000만 달러를 조달했다(2023년)\", \"url\": \"https://www.cnbc.com/2023/10/24/signos-raised-20-million-to-tackle-weight-loss-with-cgms-and-data.html\", \"note\": \"2023년 라운드 주도 투자자와 당시 직원 규모, 창업 배경을 확인했다.\"}, {\"title\": \"fda 510(k) 데이터베이스 k250106\", \"url\": \"https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?id=k250106\", \"note\": \"기기명, 신청 회사와 주소, 접수일과 결정일, 실질적 동등성 인정이라는 결론을 확인했다.\"}, {\"title\": \"존스홉킨스 공중보건대학원, 당뇨가 없는 사람에게 혈당 측정기가 쓸모 있는가\", \"url\": \"https://publichealth.jhu.edu/2026/is-glucose-monitoring-useful-for-non-diabetics\", \"note\": \"당뇨가 없는 사람의 연속혈당측정에 근거가 부족하다는 전문가 지적을 확인했다.\"}, {\"title\": \"apple app store, signos\", \"url\": \"https://apps.apple.com/us/app/signos/id1534943157\", \"note\": \"무료 다운로드와 평점 4.6점, 평가 1,014개, 회원 전용이라는 안내를 확인했다.\"}, {\"title\": \"google play, signos\", \"url\": \"https://play.google.com/store/apps/details?id=com.signos.core\", \"note\": \"평점 4.2점, 리뷰 285개, 다운로드 1만 회 이상을 확인했다.\"}, {\"title\": \"stelo by dexcom\", \"url\": \"https://www.stelo.com/\", \"note\": \"같은 센서를 직접 살 때의 값과 처방 불필요 표시, nutrisense 영양 상담 연결을 확인했다.\"}, {\"title\": \"lingo by abbott\", \"url\": \"https://www.hellolingo.com/\", \"note\": \"경쟁 센서의 시작 값이 54달러라는 점을 확인했다.\"}]}"},{"slug":"superpower","name":"Superpower","one_liner":"연 349달러 구독으로 1년에 두 차례 채혈해 150여 개 혈액 지표를 재고, 그 결과를 AI와 상주 의료진이 해석해 보충제와 처방약, 펩타이드 구매까지 같은 앱 안에서 이어 주는 소비자용 건강 구독 서비스다.","sells_to":"consumer","seen_in":[{"issue":"14","section":16,"headline":"경쟁사 Function Health가 기만적 광고를 주장하며 소송을 걸었고, 필자는 잘 자본화된 D2C 롱제비티 스타트업 두 곳이 초반부터 점유율 다툼을 벌이는 모습을 시장 모멘텀이 식는 신호로 읽었다."}],"card":{"problem":"미국에서는 보험이 있어도 일반 건강검진에서 재는 혈액 항목이 몇 가지에 그치고, 더 알아보려면 항목마다 따로 검사를 사야 해서 금액이 빠르게 불어난다. 그래서 아직 아프지 않은 사람이 자기 몸 상태를 미리 확인할 창구가 마땅치 않다.","solution":"연 349달러 구독을 팔아 1년에 두 번 채혈로 150여 개 지표를 재고, 결과를 생물학적 나이와 17개 건강 점수로 정리해 AI와 케어팀이 실행 계획을 준다. 계획에 나온 보충제와 처방약, 펩타이드를 같은 구독 안에서 바로 살 수 있게 붙여 두었다.","price":"연 349달러이고 뉴욕과 뉴저지는 값이 다르다. 집으로 채혈 인력을 부르는 것, 암 조기발견 검사와 장내 미생물 검사 같은 추가 검사, 보충제와 처방약은 따로 낸다.","tags":["혈액검사","연간 구독","예방","AI 해석","보충제 판매"],"headline_traction":"2025년 4월 시리즈 A로 3,000만 달러를 받았고, Forbes Australia는 2026년 4월 기준으로 이 라운드의 총액이 4,300만 달러, 기업 가치가 4억 3,200만 달러라고 전했다.","watch":"Function Health이 낸 허위광고 소송은 2026년 6월에 합의로 끝났으나 합의 내용은 공개되지 않았고, 회원 만족도와 매출 성장 수치는 모두 회사가 스스로 낸 것이다."},"screenshots":[{"file":"superpower_home.png","caption":"첫 화면이다. 두 번의 채혈로 150개가 넘는 검사를 받고 값은 연 349달러라는 문구를 맨 위에 걸어 두었다.","from":"https://superpower.com"},{"file":"superpower_pricing.png","caption":"값 안내 페이지다. 연 349달러에 무엇이 들어가는지, 추가 검사와 펩타이드, 처방약이 어떻게 별도로 붙는지 보여 준다.","from":"https://superpower.com/pricing"},{"file":"superpower_vs_function.png","caption":"회사가 직접 만든 Function Health 비교 페이지다. 소송의 쟁점이던 항목 수 표기가 여기서는 첫 채혈 90개가량으로 적혀 있어 홈페이지의 150개 표기와 대비된다.","from":"https://superpower.com/superpower-vs-function"}],"q":"{\"slug\": \"superpower\", \"name\": \"superpower\", \"one_liner\": \"연 349달러 구독으로 1년에 두 차례 채혈해 150여 개 혈액 지표를 재고, 그 결과를 ai와 상주 의료진이 해석해 보충제와 처방약, 펩타이드 구매까지 같은 앱 안에서 이어 주는 소비자용 건강 구독 서비스다.\", \"site\": \"https://superpower.com\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"14\", \"section\": 16, \"headline\": \"경쟁사 function health가 기만적 광고를 주장하며 소송을 걸었고, 필자는 잘 자본화된 d2c 롱제비티 스타트업 두 곳이 초반부터 점유율 다툼을 벌이는 모습을 시장 모멘텀이 식는 신호로 읽었다.\"}], \"card\": {\"problem\": \"미국에서는 보험이 있어도 일반 건강검진에서 재는 혈액 항목이 몇 가지에 그치고, 더 알아보려면 항목마다 따로 검사를 사야 해서 금액이 빠르게 불어난다. 그래서 아직 아프지 않은 사람이 자기 몸 상태를 미리 확인할 창구가 마땅치 않다.\", \"solution\": \"연 349달러 구독을 팔아 1년에 두 번 채혈로 150여 개 지표를 재고, 결과를 생물학적 나이와 17개 건강 점수로 정리해 ai와 케어팀이 실행 계획을 준다. 계획에 나온 보충제와 처방약, 펩타이드를 같은 구독 안에서 바로 살 수 있게 붙여 두었다.\", \"price\": \"연 349달러이고 뉴욕과 뉴저지는 값이 다르다. 집으로 채혈 인력을 부르는 것, 암 조기발견 검사와 장내 미생물 검사 같은 추가 검사, 보충제와 처방약은 따로 낸다.\", \"tags\": [\"혈액검사\", \"연간 구독\", \"예방\", \"ai 해석\", \"보충제 판매\"], \"headline_traction\": \"2025년 4월 시리즈 a로 3,000만 달러를 받았고, forbes australia는 2026년 4월 기준으로 이 라운드의 총액이 4,300만 달러, 기업 가치가 4억 3,200만 달러라고 전했다.\", \"watch\": \"function health이 낸 허위광고 소송은 2026년 6월에 합의로 끝났으나 합의 내용은 공개되지 않았고, 회원 만족도와 매출 성장 수치는 모두 회사가 스스로 낸 것이다.\"}, \"problem\": \"한국에서는 국가건강검진이 있고 동네 의원에서도 혈액검사를 싼값에 받을 수 있어서, 자기 수치를 확인하는 일 자체가 큰 결심을 요구하지 않는다. 미국은 보험이 있어도 예방 목적의 일반 건강검진에서 재는 혈액 항목이 몇 가지에 그치고, 그 밖의 항목은 보험사가 의학적으로 필요하다고 인정하는 범위에서만 값을 대준다. 필요를 인정받지 못하면 본인이 전액을 부담하는데 항목마다 값이 따로 붙기 때문에, 자세히 알아보려 할수록 금액이 빠르게 불어난다. 그 결과 아직 증상이 없는 사람이 몸 상태를 미리 확인하려 할 때 갈 곳이 마땅치 않고, 이 빈자리를 소비자가 자기 돈을 내는 검사 구독이 메우고 있다. 회사는 홈페이지에서 1만 달러가 들 만한 것을 349달러에 준다고 내세우는데, 1만 달러라는 값은 회사가 제시한 비교치일 뿐 근거는 밝혀져 있지 않다.\", \"solution\": \"회원으로 가입하면 기준선을 만드는 첫 채혈부터 한다. quest 계열 채혈 장소 2,000여 곳 가운데 하나를 고르거나 추가 비용을 내고 집으로 채혈 인력을 부를 수 있으며, 채혈 자체는 10분쯤 걸린다. 5일에서 10영업일 뒤 앱과 웹 대시보드에 결과가 올라오는데, 개별 수치뿐 아니라 생물학적 나이와 17개 건강 점수로 정리해 보여 준다. 과거에 다른 곳에서 받은 검사지를 올리고 oura, whoop, 애플 헬스 같은 기기를 연결해 한곳에 모을 수 있다. 그다음에는 ai 채팅과 24시간 메시지로 이어지는 케어팀이 식사, 운동, 보충제, 치료를 묶은 실행 계획을 주고, 회원 전용 마켓플레이스에서 보충제와 처방약, 펩타이드를 회원가로 살 수 있다. 반년쯤 뒤 두 번째 채혈로 60여 개 항목을 다시 재서 달라진 부분을 확인한다. 값은 연 349달러이고 뉴욕과 뉴저지는 다르며, 미국 의료비 전용 계좌인 hsa와 fsa로 결제할 수 있다고 안내한다.\", \"features\": [{\"name\": \"연 2회 혈액검사\", \"detail\": \"1년에 두 번 채혈해 회사 표기로 150개가 넘는 지표를 잰다. 회사가 만든 function health 비교 페이지에는 첫 채혈에서 90개가량을 재고 두 번째에 60개가량을 다시 잰다고 적혀 있다.\"}, {\"name\": \"건강 데이터 통합\", \"detail\": \"다른 곳에서 받은 과거 검사지를 올리고 oura, whoop, 애플 헬스 같은 기기를 연결해 한 화면에서 함께 본다.\"}, {\"name\": \"생물학적 나이와 17개 건강 점수\", \"detail\": \"혈액 수치를 심혈관, 대사, 호르몬, 갑상선, 간, 신장, 염증, 독소 노출 같은 갈래로 묶어 점수로 환산해 보여 준다.\"}, {\"name\": \"ai 채팅과 24시간 케어팀\", \"detail\": \"본인 검사 결과를 그대로 아는 상태에서 대화하는 ai 채팅을 두고, 그 옆에 면허를 가진 의료진에게 메시지로 물어보는 창구를 붙여 두었다.\"}, {\"name\": \"추가 검사 판매\", \"detail\": \"grail의 galleri 다중암 조기발견 검사, 장내 미생물 분석, 중금속과 환경 독소 검사, 심장질환 유전 위험 검사를 회원 대상 별도 상품으로 판다. 값은 회원 로그인 뒤에만 보인다.\"}, {\"name\": \"회원 전용 마켓플레이스\", \"detail\": \"사이트맵 기준으로 상품 페이지가 220개 있다. 보충제가 대부분이고 그 사이에 세마글루타이드, 메트포르민, 타다라필, 엔클로미펜, 저용량 날트렉손 같은 처방약과 세르모렐린, 고나도렐린, ghk-cu 크림 같은 펩타이드가 섞여 있다. 문진표를 작성하면 소속 의사가 검토해 승인하는 방식이고, 조제 의약품은 fda가 안전성과 효과를 확인해 주지 않는다는 고지가 상품 페이지에 붙어 있다.\"}, {\"name\": \"펩타이드 별도 브랜드\", \"detail\": \"펩타이드만 따로 떼어 낸 페이지가 있으나 2026년 9월 현재 대기자 등록만 받는다. 회사 로드맵 페이지에는 2026년 초에 자체 클리닉을 통해 glp-1 계열 비만 치료제, 호르몬, 피부와 롱제비티 펩타이드를 내놓겠다고 적혀 있다.\"}, {\"name\": \"ios 앱\", \"detail\": \"2026년 1월 14일에 나왔고 무료이며 미국 앱스토어 평점은 4.9, 평가 수는 1,391개다. 구글 플레이에서는 같은 회사의 안드로이드 앱을 찾지 못했다.\"}, {\"name\": \"기업 판매 채널\", \"detail\": \"직원용으로 같은 회원권을 파는 별도 페이지가 있고 인사 시스템 연동을 안내한다. 값은 공개하지 않고 상담으로만 받는다. susa ventures, wordware, haven의 후기가 실려 있다.\"}, {\"name\": \"검색 유입용 콘텐츠\", \"detail\": \"사이트맵에 2,481개 주소가 들어 있고 그 가운데 건강 가이드가 1,531개, 개별 생체지표 설명이 387개다. 경쟁사 비교 페이지도 12개 따로 만들어 두었다.\"}], \"differentiator\": \"function health은 값이 연 365달러로 거의 같고 검사 항목 수도 비슷하게 내세우며, 두 회사 모두 실제 검사는 quest에 맡긴다. 그래서 검사 자체로는 크게 다르지 않고, superpower는 결과를 받은 다음에 무엇을 할지까지 같은 구독 안에서 끝낸다는 점을 차이로 내세운다. 자사 비교 페이지에서 function health은 보충제를 suppco라는 다른 회사로 넘기지만 자기들은 보충제와 처방약, 펩타이드를 직접 판다고 적어 두었다. 다만 function health은 전신 mri 회사 ezra를 인수해 영상 검사 쪽으로 넓혔고, mito health과 insidetracker, lifeforce처럼 같은 형태로 파는 회사가 여럿 있어서 값과 항목 수만 놓고 보면 서로 구별하기 어렵다. 두 회사가 소송까지 간 쟁점도 기술이 아니라 항목 수를 세는 방식이었다.\", \"team\": [{\"name\": \"max marchione\", \"role\": \"공동 창업자 겸 ceo\", \"background\": \"호주 사람이고 시드니대학교 상경 및 법학 과정을 중퇴한 뒤 창업했다. 2026년 4월 기사 기준 20대 중반이다. 20명이 넘는 의사에게 오진을 겪은 경험을 창업 계기로 밝혔다.\"}, {\"name\": \"jacob peters\", \"role\": \"공동 창업자 겸 executive chairman\", \"background\": \"원인을 찾지 못한 질환에 200만 달러를 쓰고 목숨을 잃을 뻔한 경험을 창업 계기로 밝혔다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"kevin unkrich\", \"role\": \"공동 창업자\", \"background\": \"가장 친한 친구가 예정된 mri 검사를 받기 전에 뇌종양으로 세상을 떠난 일을 창업 계기로 밝혔다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"anant vinjamoori\", \"role\": \"chief longevity officer\", \"background\": \"회사 소개 페이지에 의사로 올라 있으나 이전 경력은 확인하지 못했다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"forerunner ventures가 주도한 시리즈 a로 3,000만 달러를 받았다. susa ventures, long journey ventures, day one ventures, winklevoss capital 등이 참여했고 doordash 공동 창업자 evan moore, balaji srinivasan, 배우 vanessa hudgens, dj steve aoki, 농구 선수 giannis antetokounmpo, 축구 선수 kylian mbappé가 개인 자격으로 들어왔다.\", \"when\": \"2025-04\", \"source\": \"회사 시리즈 a 발표 페이지, techcrunch, fierce healthcare\"}, {\"type\": \"funding\", \"detail\": \"forbes australia는 시리즈 a 총액이 4,300만 달러이고 그 뒤 기업 가치가 4억 3,200만 달러가 되었으며 누적 조달액이 6,500만 호주달러를 넘는다고 전했다. 회사 발표 페이지의 3,000만 달러와 금액이 다른데, 라운드가 뒤에 늘어난 것인지 집계 기준이 다른 것인지는 확인하지 못했다.\", \"when\": \"2026-04\", \"source\": \"forbes australia\"}, {\"type\": \"customers\", \"detail\": \"2025년 4월 일반 공개 시점에 대기자가 15만 명이었다고 밝혔다. 이 숫자는 회원 수가 아니라 대기자 수다.\", \"when\": \"2025-04\", \"source\": \"techcrunch. 회사가 밝힌 수치다.\"}, {\"type\": \"partnership\", \"detail\": \"가정용 검사 회사 base와 호르몬 건강 회사 feminade를 인수했다.\", \"when\": \"2025\", \"source\": \"fitt insider, business insider 기사 제목. 인수 금액과 정확한 시점은 확인하지 못했다.\"}, {\"type\": \"partnership\", \"detail\": \"david beckham의 보충제 회사 im8과 제휴해, 검사 결과와 보충제 처방을 잇는 구조를 만들겠다고 밝혔다.\", \"when\": \"2026-04\", \"source\": \"forbes australia\"}, {\"type\": \"partnership\", \"detail\": \"grail의 galleri 다중암 조기발견 검사를 회원 대상 추가 상품으로 판다.\", \"when\": \"2026-09\", \"source\": \"회사 사이트 값 안내 페이지와 마켓플레이스 상품 목록에서 직접 확인했다.\"}, {\"type\": \"revenue\", \"detail\": \"직전 6개월 동안 매출이 10배 늘었다고 밝혔다. 금액은 공개하지 않았다.\", \"when\": \"2026-04\", \"source\": \"forbes australia에 실린 회사 주장. 제삼자가 확인한 수치가 아니다.\"}, {\"type\": \"traffic\", \"detail\": \"사이트맵을 직접 세어 보면 주소가 2,481개이고 그 가운데 건강 가이드가 1,531개, 생체지표 설명이 387개다. 검색으로 사람을 끌어들이는 데 상당한 자원을 쓰고 있다는 뜻이다.\", \"when\": \"2026-09\", \"source\": \"https://superpower.com/sitemap-webflow.xml 을 직접 집계\"}, {\"type\": \"customers\", \"detail\": \"미국 아이폰 앱스토어 평점이 4.9이고 평가 수가 1,391개다. 2026년 1월에 나온 앱치고는 평가가 빠르게 쌓였다.\", \"when\": \"2026-09\", \"source\": \"애플 앱스토어 조회 api로 직접 확인\"}], \"caveats\": \"뉴스레터가 다룬 소송은 이미 끝났다. 사건은 function health, inc. v. superpower health inc.이고 캘리포니아 중부 연방지방법원에 2026년 1월 26일 제기됐으며 사건번호는 2:26-cv-00810, 담당 판사는 john f. walter, 청구 근거는 상표와 허위광고를 다루는 랜햄법이다. 2026년 6월 12일 양측이 합의했다고 법원에 알렸고 법원은 소를 각하하면서 7월 13일까지만 재개할 수 있도록 했으므로, 그 이후로는 각하가 확정된 상태다. superpower는 답변서를 낸 적이 없고 합의 내용도 공개되지 않았다. 소송의 쟁점은 기술이 아니라 숫자를 세는 방식이었다. 보도에 따르면 function health은 superpower가 기본 회원권에 생체지표 100개가 넘게 들어간다고 광고하지만 실제로 직접 측정하는 항목은 55개쯤이고 나머지는 계산으로 얻은 비율과 지수라고 주장했다. 이 주장 자체는 원고 쪽 주장이며 법원이 판단한 적이 없다. 지금도 회사 안에서 표기가 갈린다. 홈페이지는 150개가 넘는다고 적고, 회사가 만든 function health 비교 페이지는 첫 채혈 90개가량이라고 적으며, 아이폰 앱스토어 설명과 기업용 페이지에는 여전히 100개가 넘는다고 적혀 있다. 값도 갈린다. 홈페이지와 값 안내 페이지는 연 349달러인데 마켓플레이스 상품 페이지는 연 결제 기준 월 17달러로 안내한다. 소송을 보도한 2026년 2월 기사에는 기본 회원권이 연 199달러로 적혀 있어서, 그 뒤 값이 올랐거나 상품 구성이 바뀐 것으로 보인다. 회사가 내세우는 수치는 대부분 자체 집계다. 회원의 93%가 자기 의사보다 낫다고 답했다, 60%가 의사가 놓친 것을 발견했다, 85%가 활력이 크게 좋아졌다는 세 수치는 소개 페이지에 조사 방법 없이 실려 있다. 6개월 매출 10배도 회사 주장이다. 15만이라는 숫자는 두 갈래로 쓰이는데, 2025년 4월 공개 시점의 대기자 수이고 사이트 하단의 15만 명은 무료 안내 자료를 받는 이메일 구독 권유 문구이므로 회원 수로 읽으면 안 된다. 마지막으로 마켓플레이스에서 파는 조제 펩타이드와 처방약에는 fda가 안전성과 효과, 품질을 확인해 주지 않는다는 고지가 상품 페이지에 붙어 있다. 안드로이드 앱은 구글 플레이에서 찾지 못했다.\", \"for_us\": \"우리는 3개월 안에 채혈과 검사실 계약을 붙일 수 없으므로 검사 자체는 가져올 대상이 아니다. 가져올 것은 검사 뒤에 붙은 화면 구조다. 첫째, 흩어진 수치를 하나로 모으는 진입이다. 과거 검사지를 올리고 웨어러블을 연결해 한 화면에서 같이 보게 하는 것만으로 검사 없이도 쓸 이유가 생기고, 우리 앱에는 이미 건강검진 수치와 식단 기록이 들어와 있다. 둘째, 수치를 항목별 점수로 환산해 무엇이 좋고 무엇을 봐야 하는지 즉시 알려 주는 방식이다. 다만 우리 앱에는 이미 건강 나이가 있으므로 생물학적 나이는 제외하고, 심혈관이나 대사처럼 갈래별로 나눈 점수와 그 아래 붙는 실행 계획만 본다. 셋째, 결과를 그대로 두지 않고 무엇을 할지, 무엇을 살지까지 잇는 구조다. superpower가 function health과 다르다고 내세우는 지점이 바로 여기이고, 소프트웨어만으로 만들 수 있는 부분이기도 하다. 넷째, 소송이 남긴 교훈이다. 두 회사가 다툰 것은 기술이 아니라 항목 수를 세는 방식이었으므로, 우리가 미국에서 숫자를 앞세울 때는 그 숫자를 어떻게 셌는지 화면에 함께 적어 두어야 한다. 한편 필자가 이 소송을 시장 열기가 식는 신호로 읽었다는 점은 그대로 받아들이지 않는 편이 낫다. 소송은 넉 달 만에 합의로 끝났고, function health은 그 뒤인 2026년 7월에 추가로 큰 자금을 조달했다고 보도됐다.\", \"screenshots\": [{\"file\": \"superpower_home.png\", \"caption\": \"첫 화면이다. 두 번의 채혈로 150개가 넘는 검사를 받고 값은 연 349달러라는 문구를 맨 위에 걸어 두었다.\", \"from\": \"https://superpower.com\"}, {\"file\": \"superpower_pricing.png\", \"caption\": \"값 안내 페이지다. 연 349달러에 무엇이 들어가는지, 추가 검사와 펩타이드, 처방약이 어떻게 별도로 붙는지 보여 준다.\", \"from\": \"https://superpower.com/pricing\"}, {\"file\": \"superpower_vs_function.png\", \"caption\": \"회사가 직접 만든 function health 비교 페이지다. 소송의 쟁점이던 항목 수 표기가 여기서는 첫 채혈 90개가량으로 적혀 있어 홈페이지의 150개 표기와 대비된다.\", \"from\": \"https://superpower.com/superpower-vs-function\"}, {\"file\": \"superpower_ios.png\", \"caption\": \"미국 아이폰 앱스토어 페이지다. 2026년 1월에 나왔고 평점 4.9에 평가가 1,391개다. 설명에는 아직 연 100개가 넘는 검사라고 적혀 있다.\", \"from\": \"https://apps.apple.com/us/app/superpower/id6747997159\"}], \"sources\": [{\"title\": \"superpower 공식 사이트 첫 화면\", \"url\": \"https://superpower.com\", \"note\": \"연 349달러, 두 번의 채혈로 150개가 넘는 검사, quest 2,000여 곳, 1,000가지가 넘는 질환 조기 발견이라는 표기를 확인했다.\"}, {\"title\": \"superpower 값 안내\", \"url\": \"https://superpower.com/pricing\", \"note\": \"회원권에 들어가는 것과 별도로 값을 내는 것, 뉴욕과 뉴저지는 값이 다르다는 문구, hsa와 fsa 결제 가능 여부를 확인했다.\"}, {\"title\": \"superpower 소개 페이지\", \"url\": \"https://superpower.com/about\", \"note\": \"회원 93%, 60%, 85%라는 자체 집계 수치와 의료 자문단, 투자자 명단, 그리고 15만 명이라는 숫자가 이메일 구독 권유 문구라는 점을 확인했다.\"}, {\"title\": \"superpower vs function health 비교 페이지\", \"url\": \"https://superpower.com/superpower-vs-function\", \"note\": \"첫 채혈 90개가량, 재검 60개가량이라는 자체 표기와 function health과의 값 및 기능 비교를 확인했다.\"}, {\"title\": \"superpower 시리즈 a 발표\", \"url\": \"https://superpower.com/series-a\", \"note\": \"창업자 max marchione과 jacob peters의 이름과 직함, 3,000만 달러 라운드, 투자자 명단을 확인했다.\"}, {\"title\": \"superpower 로드맵\", \"url\": \"https://superpower.com/roadmap\", \"note\": \"ios 앱, 펩타이드, glp-1 계열 약, 장기 나이 검사 출시 예고와 2026년 초 클리닉 계획을 확인했다.\"}, {\"title\": \"superpower 펩타이드 페이지\", \"url\": \"https://superpower.com/peptides\", \"note\": \"2026년 9월 현재 대기자 등록만 받고 있다는 것을 확인했다.\"}, {\"title\": \"superpower 기업용 페이지\", \"url\": \"https://superpower.com/organizations\", \"note\": \"직원용 판매 채널의 존재와 100개가 넘는 검사라는 표기, 고객사 후기를 확인했다.\"}, {\"title\": \"superpower 마켓플레이스 세르모렐린 상품 페이지\", \"url\": \"https://superpower.com/marketplace/products/sermorelin-injection\", \"note\": \"회원 전용 판매, 문진표와 의사 승인 절차, 조제 의약품에 대한 fda 미승인 고지, 월 17달러 표기를 확인했다.\"}, {\"title\": \"superpower 사이트맵\", \"url\": \"https://superpower.com/sitemap-webflow.xml\", \"note\": \"주소 2,481개를 직접 세어 가이드 1,531개, 생체지표 387개, 마켓플레이스 상품 220개, 경쟁사 비교 12개를 확인했다.\"}, {\"title\": \"function health, inc. v. superpower health inc. 사건 기록\", \"url\": \"https://www.courtlistener.com/docket/72191232/function-health-inc-v-superpower-health-inc/\", \"note\": \"사건번호 2:26-cv-00810, 2026년 1월 26일 제소, 랜햄법, 2026년 6월 12일 합의에 따른 각하 명령 원문을 확인했다.\"}, {\"title\": \"function sues rival lab-testing startup superpower, alleging false marketing (athletech news)\", \"url\": \"https://athletechnews.com/function-superpower-lawsuit-lab-testing/\", \"note\": \"직접 측정 55개 주장, 두 회사의 값과 조달 내역, 소송 제기 시점을 확인했다.\"}, {\"title\": \"function sues superpower over biomarker claims (fitt insider)\", \"url\": \"https://insider.fitt.co/function-sues-superpower-over-biomarker-claims/\", \"note\": \"두 회사가 모두 quest에 검사를 맡긴다는 점, superpower의 base와 feminade 인수를 확인했다.\"}, {\"title\": \"superpower wants to help people detect and address health issues before symptoms appear (techcrunch)\", \"url\": \"https://techcrunch.com/2025/04/22/superpower-wants-to-help-people-detect-and-address-health-issues-before-symptoms-appear/\", \"note\": \"창업자 세 사람의 이름과 창업 계기, 시리즈 a 3,000만 달러, 공개 시점 대기자 15만 명을 확인했다.\"}, {\"title\": \"sydney uni dropout behind $432m startup teams up with beckham to outsmart aging (forbes australia)\", \"url\": \"https://www.forbes.com.au/news/entrepreneurs/sydney-uni-dropout-behind-432m-startup-teams-up-with-beckham-to-outsmart-aging/\", \"note\": \"max marchione의 학력과 중퇴, 기업 가치 4억 3,200만 달러, 6개월 매출 10배 주장, im8 제휴, 소송에 대한 창업자의 부인을 확인했다.\"}, {\"title\": \"superpower 아이폰 앱\", \"url\": \"https://apps.apple.com/us/app/superpower/id6747997159\", \"note\": \"2026년 1월 14일 출시, 무료, 평점 4.9와 평가 1,391개, 그리고 설명에 남아 있는 100개가 넘는 검사 표기를 확인했다.\"}, {\"title\": \"function lands another $450m, growth financing general catalyst (athletech news)\", \"url\": \"https://athletechnews.com/function-450-million-growth-financing-general-catalyst/\", \"note\": \"소송이 합의로 끝난 뒤인 2026년 7월에 function health이 추가 자금을 조달했다는 보도 제목과 날짜를 검색 목록에서 확인했다. 본문은 열지 않았다.\"}]}"},{"slug":"truemed","name":"Truemed","one_liner":"미국 직장인이 세금 혜택이 붙은 의료비 전용 계좌에 쌓아 둔 돈으로 운동기구와 보조제, 사우나 같은 건강 상품을 살 수 있도록, 온라인 상점 결제 화면에서 의사 소견서를 붙여 주는 결제 연동 회사다.","sells_to":"mixed","seen_in":[{"issue":"01","section":9,"headline":"HSA와 FSA에 쌓인 혜택 자금을 쓸 수 있게 해 주는 마켓플레이스로 소개되면서, a16z가 주도한 3,400만 달러 투자를 받았다고 나왔다."}],"card":{"problem":"미국 직장인은 세금을 떼기 전에 급여 일부를 의료비 전용 계좌(HSA·FSA)에 쌓아 두는데, 이 돈은 질병의 진단과 치료에만 쓸 수 있어서 운동기구나 보조제, 헬스장 회원권에는 원칙적으로 쓰지 못한다. FSA에 남은 돈은 해가 바뀌면 대부분 사라지므로 연말이 되면 쓰지 못한 금액을 잃는다.","solution":"Truemed는 제휴 상점의 결제 화면에서 건강 설문을 받고, 계약한 면허 의료인이 그 답변을 검토해 의학적 필요 소견서를 발급하면 그 자리에서 계좌 카드로 결제되게 해 준다. 한 번 발급된 소견서는 12개월 동안 유효해서 같은 상품을 다시 살 때 재사용할 수 있다.","price":"상품을 사는 경우에는 소비자가 Truemed에 따로 내는 돈이 없고 서비스 비용이 이미 상품 가격에 포함되어 있지만, 헬스장과 스튜디오는 방식이 달라서 회원이 소견서 한 건당 20달러를 직접 낸다.","tags":["세제 혜택 계좌","결제 연동","의사 소견서","건강 상품 구매","헬스장 회원권"],"headline_traction":"2025년 12월에 a16z가 주도한 시리즈 A로 3,400만 달러를 조달했다.","watch":"미국 국세청이 2024년에 자기 보고만으로 발급한 소견서로는 생활 지출을 의료비로 바꿀 수 없다는 경고를 냈고, 회사 이용약관도 세금 문제의 책임을 이용자 본인에게 넘겨 두었다."},"screenshots":[{"file":"truemed_shop.png","caption":"소비자용 마켓플레이스 첫 화면이다. HSA·FSA 자금을 실제로 원하는 상품에 쓰라는 문구와 평균 30퍼센트 절약, 이용자 100만 명이라는 표기가 보인다.","from":"https://shopping.truemed.com/hsa-fsa-shopping"},{"file":"truemed_brands.png","caption":"같은 페이지 전체다. Peloton과 Thorne, Tonal, Plunge, Orthofeet 같은 제휴 브랜드와 결제, 건강 설문, HSA·FSA 결제로 이어지는 3단계 이용 절차가 나와 있다.","from":"https://shopping.truemed.com/hsa-fsa-shopping"},{"file":"truemed_help.png","caption":"고객 도움말의 자격 기준 안내다. 세법 213(d)조를 근거로 삼되 일반적인 건강에 이롭기만 한 지출은 인정되지 않는다고 회사가 직접 설명하고 있다.","from":"https://help.truemed.com/eligibility-qualification/eligibility-qualification-overview"}],"q":"{\"slug\": \"truemed\", \"name\": \"truemed\", \"one_liner\": \"미국 직장인이 세금 혜택이 붙은 의료비 전용 계좌에 쌓아 둔 돈으로 운동기구와 보조제, 사우나 같은 건강 상품을 살 수 있도록, 온라인 상점 결제 화면에서 의사 소견서를 붙여 주는 결제 연동 회사다.\", \"site\": \"https://www.truemed.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"01\", \"section\": 9, \"headline\": \"hsa와 fsa에 쌓인 혜택 자금을 쓸 수 있게 해 주는 마켓플레이스로 소개되면서, a16z가 주도한 3,400만 달러 투자를 받았다고 나왔다.\"}], \"card\": {\"problem\": \"미국 직장인은 세금을 떼기 전에 급여 일부를 의료비 전용 계좌(hsa·fsa)에 쌓아 두는데, 이 돈은 질병의 진단과 치료에만 쓸 수 있어서 운동기구나 보조제, 헬스장 회원권에는 원칙적으로 쓰지 못한다. fsa에 남은 돈은 해가 바뀌면 대부분 사라지므로 연말이 되면 쓰지 못한 금액을 잃는다.\", \"solution\": \"truemed는 제휴 상점의 결제 화면에서 건강 설문을 받고, 계약한 면허 의료인이 그 답변을 검토해 의학적 필요 소견서를 발급하면 그 자리에서 계좌 카드로 결제되게 해 준다. 한 번 발급된 소견서는 12개월 동안 유효해서 같은 상품을 다시 살 때 재사용할 수 있다.\", \"price\": \"상품을 사는 경우에는 소비자가 truemed에 따로 내는 돈이 없고 서비스 비용이 이미 상품 가격에 포함되어 있지만, 헬스장과 스튜디오는 방식이 달라서 회원이 소견서 한 건당 20달러를 직접 낸다.\", \"tags\": [\"세제 혜택 계좌\", \"결제 연동\", \"의사 소견서\", \"건강 상품 구매\", \"헬스장 회원권\"], \"headline_traction\": \"2025년 12월에 a16z가 주도한 시리즈 a로 3,400만 달러를 조달했다.\", \"watch\": \"미국 국세청이 2024년에 자기 보고만으로 발급한 소견서로는 생활 지출을 의료비로 바꿀 수 없다는 경고를 냈고, 회사 이용약관도 세금 문제의 책임을 이용자 본인에게 넘겨 두었다.\"}, \"problem\": \"미국 직장인은 급여에서 세금을 떼기 전에 일부를 미리 떼어 hsa나 fsa라는 의료비 전용 계좌에 쌓아 둔다. hsa는 본인이 먼저 부담하는 금액이 큰 보험에 든 사람만 열 수 있고 남은 돈을 해마다 계속 이월할 수 있는 반면, fsa는 고용주가 제공하며 그해에 쓰지 못한 돈은 고용주가 정한 제도에 따라 2025년 기준 660달러까지만 다음 해로 넘길 수 있고 나머지는 사라진다. 문제는 이 돈을 쓸 수 있는 범위가 세법 213(d)조에 따라 질병의 진단과 치료, 완화, 처치, 예방으로 좁게 묶여 있어서, 헬스장 회원권이나 보조제, 운동기구처럼 건강에 도움이 되기만 하는 지출은 원칙적으로 인정되지 않는다는 점이다. 그래서 계좌에는 돈이 쌓여 있는데 정작 쓸 곳이 마땅치 않은 상황이 생기고, fsa 가입자는 연말이 되면 남은 돈을 잃는다. 한국의 연말정산 의료비 세액공제는 이미 쓴 돈을 사후에 깎아 주는 방식이라 이런 문제가 생기지 않으며, 급여를 미리 떼어 별도 계좌에 쌓아 두는 제도 자체가 한국에는 없다.\", \"solution\": \"소비자는 truemed와 제휴한 브랜드의 온라인 상점에서 상품을 고른 뒤 결제 화면에서 truemed를 선택한다. 그러면 현재 건강 상태와 진단받은 병, 이 상품을 사려는 이유를 묻는 건강 설문이 뜨고, truemed와 계약한 독립 면허 의료인이 그 답변을 검토한다. 의료인이 그 상품을 그 사람의 건강 상태에 필요하다고 판단하면 의학적 필요 소견서(letter of medical necessity)를 발급하고, 소비자는 그 자리에서 hsa나 fsa 카드로 결제한다. 결제 화면에 truemed가 붙어 있지 않은 상점이거나 구독 상품이면 일반 카드로 먼저 결제한 다음 같은 날 설문에 답하고, 보통 24시간에서 48시간 안에 검토 결과를 받아 계좌 운영사에 환급을 신청한다. 한 번 발급된 소견서는 12개월 동안 유효하고 같은 상품을 다시 살 때 재사용할 수 있다. 상품을 사는 경우 소비자가 truemed에 따로 내는 돈은 없다. 회사는 자사 서비스 비용이 이미 상품 가격에 포함돼 있다고 고지하며, 브랜드 계약서를 보면 truemed가 주문 금액에서 수수료를 먼저 떼고 나머지를 브랜드에 정산한다. 다만 헬스장과 스튜디오는 값을 매기는 방식이 다르다. 가맹점은 750달러를 한 번만 내고 그 뒤로는 거래 수수료도 월 이용료도 최소 금액도 없는 대신, 회원이 소견서 한 건당 20달러를 직접 낸다. 소비자용 모바일 앱은 없으며, 모든 절차는 제휴 상점의 결제 화면과 웹 화면에서 이루어진다.\", \"features\": [{\"name\": \"결제 화면 연동\", \"detail\": \"shopify와 woocommerce, bigcommerce, 직접 api로 상점에 붙어서 hsa·fsa 카드 결제를 그 자리에서 처리한다. 상품 페이지에는 이 상품이 대상인지 알려 주는 안내 표시가 붙는다.\"}, {\"name\": \"건강 설문과 의료인 검토\", \"detail\": \"소비자가 답한 건강 설문을 제휴 면허 의료인이 검토해 의학적 필요 소견서를 발급하거나 거절한다. 거절되면 결제 자체가 이루어지지 않는다.\"}, {\"name\": \"환급 지원\", \"detail\": \"결제 연동이 없는 상점이나 구독 상품은 일반 카드로 먼저 결제한 뒤, 소견서를 받아 계좌 운영사에 환급을 신청하도록 돕는다.\"}, {\"name\": \"소비자 마켓플레이스\", \"detail\": \"제휴 브랜드 3,000곳과 15개가 넘는 상품 분류를 모아 보여 주고, 상품을 고르면 해당 브랜드 상점으로 보낸다. 결제는 마켓플레이스가 아니라 브랜드 상점에서 이루어진다.\"}, {\"name\": \"상품 분류\", \"detail\": \"운동기구, 헬스 기기, 수면, 보조제, 적색광 치료, 기능성 신발, 사우나와 냉수욕, 재택 건강, 헬스장과 스튜디오로 나뉜다. 헬스장과 스튜디오 분류에는 barry's와 classpass, club pilates가 올라 있고 투자 보도자료에는 24 hour fitness도 제휴처로 나오므로, 헬스장 회원권도 실제로 대상이 된다.\"}, {\"name\": \"헬스장 전용 방식\", \"detail\": \"헬스장에서는 hsa·fsa 카드로 그 자리에서 결제하는 방식을 회사가 권하지 않는다. 카드사가 매기는 가맹점 업종 분류 때문에 헬스장에서는 승인이 나지 않는 경우가 많아서, 회원이 일반 카드로 결제하고 소견서를 받아 나중에 환급받는 방식만 쓴다. 가맹점 가입 비용도 이 경우에만 공개돼 있다.\"}], \"differentiator\": \"같은 일을 하는 회사로 flex와 sika health가 있고, 결제 화면에서 건강 설문을 받아 소견서를 발급한다는 구조는 세 회사가 같다. 실질적인 차이는 어느 브랜드와 붙어 있느냐이며, 소비자는 사려는 브랜드가 어느 회사를 쓰는지에 따라 선택이 갈린다. truemed는 제휴 브랜드가 3,000곳이 넘는다고 밝혀 세 회사 가운데 가장 많은 제휴처를 확보했다고 주장하며, peloton과 eight sleep, nike strength, garmin, 24 hour fitness처럼 이름이 알려진 브랜드를 제휴처로 확보했다. 기술 자체는 세 회사가 같기 때문에, 제휴 영업의 규모가 경쟁을 가르는 시장이다.\", \"team\": [{\"name\": \"justin mares\", \"role\": \"공동창업자, ceo\", \"background\": \"식품 브랜드 kettle & fire와 perfect keto를 창업해 키운 사람이다.\"}, {\"name\": \"calley means\", \"role\": \"공동창업자\", \"background\": \"맞춤 웨딩드레스 회사 anomalie를 공동창업해 david's bridal에 매각했고, 그 전에는 식품과 제약 업계를 상대하는 컨설턴트로 일했다. 2025년 3월부터 백악관 자문 자격으로 미국 보건복지부 장관을 보좌했고, 그해 말 정부 일을 정리하는 과정에서 truemed 지분을 전량 매각했다고 밝혔다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"3,400만 달러 규모 시리즈 a를 마감했다. a16z가 주도했고 bessemer venture partners와 long journey ventures, boxgroup, trust ventures가 참여했다.\", \"when\": \"2025-12\", \"source\": \"pr newswire 보도자료, a16z 투자 공지\"}, {\"type\": \"funding\", \"detail\": \"창업 초기에 350만 달러를 safe 방식으로 모았다. mark hyman과 thrive market, eight sleep, levels 창업자들이 참여했다.\", \"when\": \"2023-09\", \"source\": \"techcrunch\"}, {\"type\": \"customers\", \"detail\": \"제휴 가맹 브랜드가 3,000곳을 넘는다고 밝혔다.\", \"when\": \"2025-12\", \"source\": \"a16z 투자 공지, truemed 마켓플레이스 페이지\"}, {\"type\": \"revenue\", \"detail\": \"2년 연속으로 전년 대비 매출이 3배 늘었다고 밝혔다.\", \"when\": \"2025-12\", \"source\": \"pr newswire 보도자료\"}, {\"type\": \"customers\", \"detail\": \"이용자가 100만 명을 넘었다고 자사 마켓플레이스에 표기하고 있다.\", \"when\": \"2026-09\", \"source\": \"shopping.truemed.com 화면\"}, {\"type\": \"partnership\", \"detail\": \"peloton과 eight sleep, nike strength, 24 hour fitness, rogue fitness, garmin, barry's, thorne, tonal, plunge, ag1 등이 제휴 브랜드로 공개돼 있다.\", \"when\": \"2025-12\", \"source\": \"a16z 투자 공지, pr newswire 보도자료, truemed 마켓플레이스 화면\"}], \"caveats\": \"미국 국세청은 2024년 3월 6일에 이 방식을 겨냥한 경고를 냈다(ir-2024-65). 본인이 스스로 보고한 건강 정보만 근거로 의사가 써 준 소견서로는 원래 개인 지출인 식품과 운동 비용을 의료비로 바꿀 수 없고, 인정되지 않는 지출을 갚아 준 계좌는 자격을 잃어 그 계좌에서 나간 돈 전부가 소득으로 잡힐 수 있다는 내용이다. 다만 이 경고는 truemed를 이름으로 지목하지 않았고, 회사는 진단받은 병이 있어야 인정된다고 안내하면서 국세청 기준을 지키고 있다고 주장한다. 공동창업자 calley means를 둘러싼 이해충돌도 계속 문제가 됐다. means는 2025년 3월 18일에 특별정부직원 신분으로 백악관 자문에 임명돼 보건복지부 장관 robert f. kennedy jr.를 보좌하면서 truemed 지분을 그대로 들고 있었다. 지분 규모는 보도마다 달라 2,000만 달러대에서 5,000만 달러 사이로 엇갈리게 전해지므로 특정 금액을 확정해서 인용하지 않는 편이 안전하다. 하원의원 jake auchincloss는 2025년 6월 16일 means 본인과 truemed 이사회에 각각 서한을 보내, truemed의 기업 가치가 2024년 1월 이후 3배 가까이 올랐고 그 시점이 means의 임명 시기와 겹친다는 점을 문제 삼았다. 같은 의원과 상원의원 adam schiff는 2025년 10월 31일 백악관 비서실장과 보건복지부 장관에게 보낸 공동 서한에서, means가 직접 만든 정책으로 자기 회사가 이득을 봤다고 지적했다. 두 사람은 그 예로 truemed가 비데(alpha jx2 bidet)까지 자가면역과 소화기, 관절 건강에 도움이 된다며 hsa 대상 상품으로 광고한다는 점을 들었고, 근거 자료로는 9,000달러짜리 사우나에 세금 혜택을 받게 해 준다는 new york times 기사(2025년 7월 18일)를 인용했다. means는 2025년 말 정부를 떠나거나 정규직으로 자리를 옮기는 과정에서 지분을 전량 매각했다고 밝혔으나, 매각 시점에 대한 보도가 서로 조금씩 다르다. 2026년 6월에는 법무법인 migliaccio & rathod가 소비자에게 예상치 못한 세금 부담이 생겼는지 조사한다고 공지했으나, 소송이 실제로 제기되지는 않았다. 제휴 브랜드 3,000곳과 이용자 100만 명, 2년 연속 매출 3배 성장은 모두 회사가 스스로 낸 수치이고 제삼자가 확인한 것이 아니다. 브랜드 수는 직접 세어 검증하지 못했다. 이커머스 상품의 수수료율도 브랜드 계약서가 요율을 계약상 비밀로 못 박고 있어 밖에서는 알 수 없다. 평균 30퍼센트 절약이라는 문구도 소득이 있는 미국 중위 납세자의 세율을 가정해 계산한 값이라고 회사가 밝히고 있어서 개인마다 실제 절감액은 달라진다. 위험을 누가 지는지도 분명하다. 회사의 이용약관은 소견서를 받았다고 해서 계좌 운영사나 고용주가 인정한다는 보장이 없고, 미국 국세청이나 주·지방 세무당국이 그 지출을 213(d)조 인정 의료비로 볼 것이라는 보장도 없다고 적은 뒤, 소견서에 기대어 자격을 입증하는 일은 전적으로 이용자 본인의 위험이며 그에 따른 금전적 책임도 본인이 전부 진다고 명시한다. 회사 블로그에서는 국세청 규정에 어긋나지 않는다는 오해 풀이를 싣고 있지만, 약관에서는 그 책임을 이용자에게 넘겨 두었다는 점을 함께 봐야 한다. 참고로 회사 소개 페이지에는 이제 justin mares만 나오고 calley means의 이름은 나오지 않는다. 한편 헬스장 회원권과 운동비를 연 500달러까지 hsa 인정 의료비로 삼는 조항은 2025년 세법 개정안 가운데 하원 통과본에는 들어 있었으나 최종 법에서 삭제됐다. 그래서 지금 헬스장 회원권에 hsa를 쓰는 길은 이 소견서 방식밖에 없다. 이 회사의 사업이 법 개정 하나에 크게 흔들릴 수 있다는 뜻이기도 하다.\", \"for_us\": \"이 회사가 파는 것은 상품이 아니라 이 지출이 의료비로 인정된다는 판정과 그 근거 문서다. 결제 화면에서 설문 몇 개를 받아 판정을 붙여 주는 것만으로 소비자가 실제로 내는 값이 30퍼센트 가까이 줄어들기 때문에, 필요한 것은 기기나 임상 데이터가 아니라 소프트웨어와 제휴다. 다만 우리가 같은 일을 직접 하려면 면허 의료인 발급 체계와 세법 판단 책임을 함께 떠안아야 해서 3개월 안에 시도하기에는 위험이 크다. 대신 우리 앱 화면 안에서 할 수 있는 일이 두 가지 있다. 첫째, 미국 이용자에게 지금 hsa나 fsa에 얼마가 남아 있는지 알려 주고, fsa라면 연말까지 쓰지 않으면 사라지는 금액을 계산해 보여 주는 안내다. 둘째, truemed나 flex의 제휴 브랜드로 연결해 주는 자리를 만드는 것이며, 이렇게 하면 세법 판단은 그 회사가 하고 우리는 이용자를 연결하는 역할만 맡는다. 연말이라는 정해진 기한이 있고 쓰지 않으면 돈이 사라진다는 조건은 앱에서 알림과 목표를 붙이기에 잘 맞는다.\", \"screenshots\": [{\"file\": \"truemed_shop.png\", \"caption\": \"소비자용 마켓플레이스 첫 화면이다. hsa·fsa 자금을 실제로 원하는 상품에 쓰라는 문구와 평균 30퍼센트 절약, 이용자 100만 명이라는 표기가 보인다.\", \"from\": \"https://shopping.truemed.com/hsa-fsa-shopping\"}, {\"file\": \"truemed_brands.png\", \"caption\": \"같은 페이지 전체다. peloton과 thorne, tonal, plunge, orthofeet 같은 제휴 브랜드와 결제, 건강 설문, hsa·fsa 결제로 이어지는 3단계 이용 절차가 나와 있다.\", \"from\": \"https://shopping.truemed.com/hsa-fsa-shopping\"}, {\"file\": \"truemed_help.png\", \"caption\": \"고객 도움말의 자격 기준 안내다. 세법 213(d)조를 근거로 삼되 일반적인 건강에 이롭기만 한 지출은 인정되지 않는다고 회사가 직접 설명하고 있다.\", \"from\": \"https://help.truemed.com/eligibility-qualification/eligibility-qualification-overview\"}, {\"file\": \"truemed_merchant.png\", \"caption\": \"가맹점용 기술 문서다. 결제 처리와 환급 지원이라는 두 갈래로 상점에 붙는다는 설명이 나와 있다.\", \"from\": \"https://docs.truemed.com/guides/get-started/how-truemed-works\"}], \"sources\": [{\"title\": \"investing in truemed\", \"url\": \"https://a16z.com/announcement/investing-in-truemed/\", \"note\": \"a16z가 밝힌 투자 이유와 제휴 브랜드 3,000곳, 평균 30퍼센트 절약 수치를 확인했다.\"}, {\"title\": \"truemed closes $34 million series a to unlock hsa/fsa funds for lifestyle interventions\", \"url\": \"https://www.prnewswire.com/news-releases/truemed-closes-34-million-series-a-to-unlock-hsafsa-funds-for-lifestyle-interventions-302647740.html\", \"note\": \"투자 규모와 참여 투자사, 본사 위치, 매출 3배 성장 발표를 확인했다.\"}, {\"title\": \"how truemed works (가맹점용 기술 문서)\", \"url\": \"https://docs.truemed.com/guides/get-started/how-truemed-works\", \"note\": \"결제 연동 방식과 소견서 12개월 유효, 24시간에서 48시간 검토 시간을 확인했다.\"}, {\"title\": \"eligibility & qualification overview (고객 도움말)\", \"url\": \"https://help.truemed.com/eligibility-qualification/eligibility-qualification-overview\", \"note\": \"인정 기준과 헬스장 회원권 포함 여부, 계좌 운영사가 최종 판단권을 가진다는 안내를 확인했다.\"}, {\"title\": \"hsa/fsa eligible products (소비자 마켓플레이스)\", \"url\": \"https://shopping.truemed.com/hsa-fsa-shopping\", \"note\": \"제휴 브랜드 목록과 3단계 이용 절차, 이용자 100만 명 표기를 확인했다.\"}, {\"title\": \"disclosures (truemed 고지 문서)\", \"url\": \"https://www.truemed.com/disclosures\", \"note\": \"서비스 비용이 상품 가격에 포함된다는 안내와, 계좌 운영사가 청구를 거절할 수 있고 사실과 다르게 답하면 세금 불이익이 생길 수 있다는 면책 문구를 확인했다.\"}, {\"title\": \"gyms & studios (truemed 상품 분류)\", \"url\": \"https://www.truemed.com/shop/gym-studios\", \"note\": \"헬스장과 스튜디오 회원권이 실제 대상 분류로 있고 barry's, classpass, club pilates가 제휴돼 있음을 확인했다.\"}, {\"title\": \"publication 969, health savings accounts and other tax-favored health plans\", \"url\": \"https://www.irs.gov/publications/p969\", \"note\": \"hsa와 fsa의 가입 조건, 이월 규칙, 인정 의료비 정의를 확인했다.\"}, {\"title\": \"irs alert: beware of companies misrepresenting nutrition, wellness and general health expenses as medical care for fsas, hsas, hras and msas (ir-2024-65)\", \"url\": \"https://www.irs.gov/newsroom/irs-alert-beware-of-companies-misrepresenting-nutrition-wellness-and-general-health-expenses-as-medical-care-for-fsas-hsas-hras-and-msas\", \"note\": \"자기 보고 정보만으로 발급한 소견서를 인정하지 않는다는 국세청 경고와 계좌 자격 상실 위험을 확인했다.\"}, {\"title\": \"truemed's payment integration platform unlocks hsa/fsa for health, not sickness\", \"url\": \"https://techcrunch.com/2023/09/18/truemed-payment-integration-hsa-fsa/\", \"note\": \"창업 배경과 초기 투자 350만 달러, 창업자 경력을 확인했다.\"}, {\"title\": \"congressman auchincloss probes corruption of healthcare executives in the trump administration\", \"url\": \"https://auchincloss.house.gov/media/press-releases/congressman-auchincloss-probes-corruption-of-healthcare-executives-in-the-trump-administration\", \"note\": \"calley means의 이해충돌을 문제 삼은 의회 서한 내용을 확인했다.\"}, {\"title\": \"헬스장·스튜디오 가맹점 가입 안내\", \"url\": \"https://www.truemed.com/partners/dtc-merchant-sign-up\", \"note\": \"가맹점 750달러 일회성, 이후 거래 수수료와 월 이용료 없음, 회원이 소견서 한 건당 20달러 부담, 업종 분류 문제로 헬스장에서는 카드 결제 대신 환급 방식을 쓴다는 안내를 원문으로 확인했다.\"}, {\"title\": \"brand agreement (가맹 브랜드 계약서)\", \"url\": \"https://www.truemed.com/legal/brand-agreement\", \"note\": \"주문 금액에서 수수료를 먼저 떼고 나머지를 브랜드에 정산한다는 조항과, 요율이 계약상 비밀이라는 조항을 확인했다.\"}, {\"title\": \"terms of service (truemed 이용약관)\", \"url\": \"https://www.truemed.com/terms\", \"note\": \"소견서에 기대어 자격을 입증하는 일이 전적으로 이용자 본인의 위험이고, 국세청이 213(d)조 인정 의료비로 볼 것이라는 보장이 없다는 조항을 원문으로 확인했다.\"}, {\"title\": \"letter from representative auchincloss to the truemed board of directors\", \"url\": \"https://auchincloss.house.gov/imo/media/doc/auchincloss_letter_to_truemed_board_of_directors.pdf\", \"note\": \"2025년 6월 16일 자 서한 원문이다. 기업 가치가 2024년 1월 이후 3배 가까이 올랐다는 지적과 본사 주소를 확인했다.\"}, {\"title\": \"what the one big beautiful bill act means for employee benefits\", \"url\": \"https://www.tasconline.com/legislative-updates/what-the-one-big-beautiful-bill-act-means-for-employee-benefits/\", \"note\": \"헬스장 회원권과 운동비를 연 500달러까지 hsa 인정 의료비로 삼는 조항이 최종 법에서 삭제됐다는 사실을 항목별 목록으로 확인했다.\"}, {\"title\": \"auchincloss and schiff letter on potential conflict of interest with calley means\", \"url\": \"https://www.schiff.senate.gov/wp-content/uploads/2025/11/auchincloss-schiff-letter-on-potential-coi-with-calley-means.pdf\", \"note\": \"2025년 10월 31일 자 공동 서한 원문이다. 임명일과 이해충돌 지적, truemed가 비데를 hsa 대상으로 광고한다는 사례를 확인했다.\"}, {\"title\": \"a kennedy aide's start-up can get you a tax break on a $9,000 sauna\", \"url\": \"https://www.nytimes.com/2025/07/18/business/truemed-fsa-hsa-calley-means-maha.html\", \"note\": \"이 방식을 비판적으로 다룬 new york times 기사다. 본문은 열지 못했고 의회 서한의 인용을 통해 존재와 논지를 확인했다.\"}, {\"title\": \"truemed hsa/fsa medical necessity investigation\", \"url\": \"https://classlawdc.com/2026/06/02/truemed-hsa-fsa-medical-necessity-investigation/\", \"note\": \"법무법인이 소비자 피해 여부를 조사 중이라는 공지를 확인했다. 소송 제기 단계는 아니다.\"}, {\"title\": \"a list of tax provisions left out of the big beautiful bill\", \"url\": \"https://bipartisanpolicy.org/explainer/tax-provisions-left-out-of-obbb/\", \"note\": \"헬스장 회원권을 hsa 대상에 넣는 조항이 최종 법에서 빠졌다는 사실을 확인했다.\"}, {\"title\": \"truemed lands $34m to grow hsa/fsa purchase platform\", \"url\": \"https://athletechnews.com/truemed-34-million-funding-hsa-fsa/\", \"note\": \"피트니스 업계 관점의 투자 보도와 창업자 발언을 확인했다.\"}]}"},{"slug":"whoop","name":"WHOOP","one_liner":"화면이 없는 손목 밴드를 기기값 없이 연 199~359달러 구독으로 파는 회사이며, 최근에는 그 밴드를 들고 미국 메디케어 환자를 직접 진료하는 별도 의사 법인까지 세웠다.","sells_to":"mixed","seen_in":[{"issue":"04","section":6,"headline":"FDA가 소비자가전전시회에서 일부 AI 및 웰니스 제품에 대한 감독을 완화하겠다고 밝히자, 2025년 7월 혈압 기능으로 경고 서한을 받았던 이 회사가 그 조치를 반겼다는 대목에서 이름이 나왔다."}],"card":{"problem":"미국 소비자는 1년에 한 번 병원에서 받는 검사와 그다음 검사 사이에 자기 몸이 어떤 상태인지 확인할 방법이 없고, 의사도 진료실에서 몇 분 동안 잰 수치만 보고 판단한다.","solution":"화면이 없는 밴드를 하루 종일 채우게 해서 수면과 회복, 스트레스, 혈압 추정치를 앱으로 매일 보여 주고, 기기값을 따로 받지 않는 대신 해마다 구독료를 받는다.","price":"기기값 없이 연 199달러(One), 239달러(Peak), 359달러(Life)다. 혈액검사는 구독과 별개로 69달러부터 799달러까지 따로 판다.","tags":["웨어러블","연 구독","수면·회복","혈액검사","메디케어 진료"],"headline_traction":"2026년 3월 시리즈 G로 5억 7,500만 달러를 받아 기업가치가 101억 달러가 됐고, 의료기기 회사 Abbott이 투자자로 참여했다.","watch":"FDA가 2025년 7월 혈압 기능에 경고 서한을 보냈으나 회사는 기능을 내리지 않고 면책 문구만 붙여 계속 팔고 있으며, 그 기능이 담긴 밴드를 메디케어 환자에게 무상으로 지급하고 있다."},"screenshots":[{"file":"whoop_membership.png","caption":"요금제 비교 페이지다. One, Peak, Life 세 가지가 나란히 놓여 있고 요금제마다 밴드와 충전기가 포함된다는 점, 위 요금제로 갈수록 Healthspan과 심전도, 혈압 인사이트가 더해지는 구조를 보여 준다. 한국에서 접속했기 때문에 값이 원화로 표시돼 있으며, 달러 값은 같은 페이지의 데이터에서 확인했다.","from":"https://www.whoop.com/us/en/membership/"},{"file":"whoop_labs.png","caption":"혈액검사 상품 목록이다. 53개 항목을 보는 기본 패널이 69달러, 75개 항목을 정기적으로 보는 구독형 패널이 199달러로 붙어 있고, 세전 의료비 계좌로 결제할 수 있다는 표시가 상품마다 달려 있다.","from":"https://shop.whoop.com/us/en/advanced-labs/panels/"},{"file":"whoop_connected_care.png","caption":"WHOOP Physician Services, P.C.의 진료 약관 첫 화면이다. 웨어러블 회사가 자기 이름을 단 의사 법인을 세우고 진료 약관을 따로 내걸었다는 사실 자체를 보여 주며, 2026년 8월 5일에 갱신됐다.","from":"https://www.whoop.com/us/en/connected-care-terms-of-care/"}],"q":"{\"slug\": \"whoop\", \"name\": \"whoop\", \"one_liner\": \"화면이 없는 손목 밴드를 기기값 없이 연 199~359달러 구독으로 파는 회사이며, 최근에는 그 밴드를 들고 미국 메디케어 환자를 직접 진료하는 별도 의사 법인까지 세웠다.\", \"site\": \"https://www.whoop.com\", \"sells_to\": \"mixed\", \"seen_in\": [{\"issue\": \"04\", \"section\": 6, \"headline\": \"fda가 소비자가전전시회에서 일부 ai 및 웰니스 제품에 대한 감독을 완화하겠다고 밝히자, 2025년 7월 혈압 기능으로 경고 서한을 받았던 이 회사가 그 조치를 반겼다는 대목에서 이름이 나왔다.\"}], \"card\": {\"problem\": \"미국 소비자는 1년에 한 번 병원에서 받는 검사와 그다음 검사 사이에 자기 몸이 어떤 상태인지 확인할 방법이 없고, 의사도 진료실에서 몇 분 동안 잰 수치만 보고 판단한다.\", \"solution\": \"화면이 없는 밴드를 하루 종일 채우게 해서 수면과 회복, 스트레스, 혈압 추정치를 앱으로 매일 보여 주고, 기기값을 따로 받지 않는 대신 해마다 구독료를 받는다.\", \"price\": \"기기값 없이 연 199달러(one), 239달러(peak), 359달러(life)다. 혈액검사는 구독과 별개로 69달러부터 799달러까지 따로 판다.\", \"tags\": [\"웨어러블\", \"연 구독\", \"수면·회복\", \"혈액검사\", \"메디케어 진료\"], \"headline_traction\": \"2026년 3월 시리즈 g로 5억 7,500만 달러를 받아 기업가치가 101억 달러가 됐고, 의료기기 회사 abbott이 투자자로 참여했다.\", \"watch\": \"fda가 2025년 7월 혈압 기능에 경고 서한을 보냈으나 회사는 기능을 내리지 않고 면책 문구만 붙여 계속 팔고 있으며, 그 기능이 담긴 밴드를 메디케어 환자에게 무상으로 지급하고 있다.\"}, \"problem\": \"한국에서는 국가건강검진을 해마다 받을 수 있고 몸이 이상하면 동네 의원에 바로 갈 수 있어서, 검사와 검사 사이의 공백이 크게 문제가 되지 않는다. 미국은 진료를 한 번 받는 데 드는 비용과 예약 대기 때문에 그 간격이 훨씬 길고, 그동안 몸에서 일어나는 변화는 아무도 보지 않는다. 특히 혈압처럼 평소에 계속 오르내리는 수치는 진료실에서 몇 분 동안 한 번 재는 방식으로는 제대로 잡히지 않는데, fda는 whoop에 보낸 경고 서한에서 고혈압을 심혈관 질환의 위험 요인 가운데 사람이 고칠 수 있는 가장 흔한 요인이라고 표현했다. 그래서 미국에서는 몸 상태를 매일 재서 보여 주는 일 자체가 상품이 되며, 소비자가 해마다 수백 달러를 내고 그 수치를 사는 시장이 만들어졌다. 여기에 더해 메디케어 쪽에서는 만성질환을 앓는 고령자를 병원 밖에서 계속 지켜보는 일에 정부가 돈을 대기 시작했고, whoop은 그 자리에도 들어갔다.\", \"solution\": \"사용자는 회사에서 밴드를 받아 손목에 차고 하루 종일 벗지 않는다. 밴드에는 화면이 없어서 숫자는 전부 휴대전화 앱에서만 본다. 앱은 매일 아침 수면 점수, 회복 점수, 그날 감당할 만한 운동량인 스트레인 점수를 내주고, 상위 요금제에서는 노화 속도를 나타내는 healthspan, 실시간 스트레스 점수, 심전도 측정, 불규칙 심박 알림, 매일의 혈압 추정치를 더 준다. 요금제는 세 가지이며 기기값을 따로 받지 않고 연 구독료만 받는다. whoop one은 연 199달러, whoop peak은 연 239달러, whoop mg 기기와 혈압 기능이 들어가는 whoop life는 연 359달러다. 구독과 별개로 앱 안에서 혈액검사를 예약할 수 있는데, 전국 quest diagnostics 2,000여 곳에서 피를 뽑고 임상의가 결과를 검토해 실행 계획을 붙여 주며, 값은 53개 항목 69달러부터 122개 항목을 다루는 특화 패널 299달러, 50종 넘는 암을 한 번에 보는 galleri 검사 799달러까지 갈린다. 안드로이드 앱 설명에 따르면 기기와 앱을 한 달 동안 무료로 써 본 뒤 결정할 수 있다.\", \"features\": [{\"name\": \"화면 없는 밴드와 연 구독\", \"detail\": \"기기값을 따로 받지 않고 밴드와 충전기를 구독에 포함해 준다. 요금제는 one 연 199달러, peak 연 239달러, life 연 359달러 세 가지이며 언제든 바꿀 수 있다고 안내한다.\"}, {\"name\": \"수면·회복·스트레인 점수\", \"detail\": \"심박변이도와 안정 시 심박수, 수면, 호흡수를 재서 회복 점수를 1에서 99퍼센트로, 수면 점수를 0에서 100퍼센트로, 그날의 운동 부하를 0에서 21까지의 스트레인 점수로 매일 내준다.\"}, {\"name\": \"blood pressure insights\", \"detail\": \"매일의 수축기와 이완기 혈압 추정치를 보여 주는 기능이며 가장 비싼 life 요금제에만 들어간다. fda가 2025년 7월에 문제 삼은 바로 그 기능이고, 지금은 의료기기가 아니며 진단이나 관리에 쓸 수 없다는 문구가 함께 붙어 있다. 임신 중이거나 혈압약을 먹는 사람은 쓰지 말라고 적혀 있다.\"}, {\"name\": \"healthspan과 whoop age\", \"detail\": \"생활 습관을 근거로 몸의 나이와 노화 속도를 숫자로 보여 주는 기능이다. 만 18세 미만은 쓸 수 없고 의료 목적이 아니라 웰니스 목적이라고 표기돼 있다.\"}, {\"name\": \"심전도와 불규칙 심박 알림\", \"detail\": \"whoop mg 기기로 심전도를 측정하고 불규칙한 심박을 알려 주는 기능이다. 규제를 받는 기능이라 나라마다 쓸 수 있는지가 다르며, 한국에서 접속하면 해당 지역에서는 제공되지 않는다고 표시된다.\"}, {\"name\": \"whoop advanced labs\", \"detail\": \"앱에서 혈액검사를 예약해 quest diagnostics 2,000여 곳에서 피를 뽑고, 임상의가 결과를 검토해 실행 계획을 붙여 주는 상품이다. 구독이나 밴드가 없어도 살 수 있다고 회사가 직접 내세운다. 애리조나, 하와이, 와이오밍, 노스다코타, 사우스다코타에서는 검사를 받을 수 없다.\"}, {\"name\": \"galleri 암 조기 발견 검사\", \"detail\": \"grail의 검사로 50종이 넘는 암을 한 번의 채혈로 살펴보는 상품이며 799달러다. 처방이 필요한 검사인데 면허 의사가 대신 처방을 내주므로 따로 진료를 받을 필요가 없다고 안내한다. 결과는 약 2주 뒤에 나오고 진단은 아니라고 못 박고 있다.\"}, {\"name\": \"whoop connected care\", \"detail\": \"whoop이 세운 별도 의사 법인 whoop physician services, p.c.가 메디케어 환자를 원격으로 진료하는 프로그램이다. 미국 안에서만 제공되며, 진료비와 본인부담금이 전액 면제되고 밴드와 혈압계도 무상으로 지급된다. 의료비는 메디케어가 이 법인에 직접 지급한다.\"}, {\"name\": \"한 달 무료 체험\", \"detail\": \"구글 플레이 앱 설명에 따르면 처음 쓰는 사람은 기기와 앱을 한 달 동안 무료로 써 볼 수 있다고 안내한다.\"}], \"differentiator\": \"apple watch와 fitbit은 기기를 먼저 사야 하고 화면으로 시간과 알림을 보는 손목시계인 반면, whoop은 기기값을 받지 않고 화면도 없애서 숫자를 앱에서만 보게 만들었다. 그 대신 구독을 끊으면 밴드가 쓸모없어지므로 매출이 전부 구독에 걸려 있다. 반지 형태로 수면과 회복을 재는 oura와는 재는 항목이 상당히 겹치며, 이 부분만 놓고 보면 크게 다르지 않다. 진짜 차이는 다른 데 있다. whoop은 별도 의사 법인을 세워 미국 정부의 메디케어 지불 모형에 참가 기관으로 들어갔고, 소비자가 돈을 내는 구조 밖에서 정부가 진료비를 대는 두 번째 매출선을 만들었다. 손목 웨어러블 회사 가운데 자기 이름을 단 의사 법인을 세우고 메디케어에 진료비를 청구하는 곳은 확인한 범위에서 whoop뿐이다.\", \"team\": [{\"name\": \"will ahmed\", \"role\": \"공동 창업자 겸 ceo\", \"background\": \"하버드 재학 시절 운동선수였고 2012년에 학교 창업 지원 조직에서 회사를 시작했다. 출처는 위키백과이며 1차 자료로 확인하지는 못했다.\"}, {\"name\": \"john capodilupo\", \"role\": \"공동 창업자\", \"background\": \"2012년 창업에 함께 참여했다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"aurelian nicolae\", \"role\": \"공동 창업자\", \"background\": \"2012년 창업에 함께 참여했다. 이전 경력은 확인하지 못했다.\"}, {\"name\": \"robin berzin\", \"role\": \"의료 자문위원\", \"background\": \"기능의학 진료 체인 parsley health를 세우고 이끄는 의사이며, 회사가 advanced labs 소개 페이지에 자문위원으로 올려 두었다.\"}, {\"name\": \"dan henderson\", \"role\": \"의료 자문위원\", \"background\": \"brigham and women's hospital의 1차 진료 의사이며, 회사가 advanced labs 소개 페이지에 자문위원으로 올려 두었다.\"}, {\"name\": \"hazel wallace\", \"role\": \"의료 자문위원\", \"background\": \"영국 국민보건서비스에서 일하던 의사이며 the food medic을 만들었다고 회사 페이지에 적혀 있다.\"}], \"traction\": [{\"type\": \"funding\", \"detail\": \"softbank로부터 2억 달러를 받았고 이때 기업가치가 36억 달러로 매겨졌다.\", \"when\": \"2021-08\", \"source\": \"위키백과가 인용한 보도. 1차 보도자료는 직접 확인하지 못했다.\"}, {\"type\": \"funding\", \"detail\": \"시리즈 g로 5억 7,500만 달러를 받아 기업가치가 101억 달러가 됐다. 의료기기 회사 abbott이 이 라운드에 참여했다.\", \"when\": \"2026-03\", \"source\": \"new york times 2026년 3월 31일자 기사와 massdevice 2026년 4월 1일자 기사. 위키백과의 각주를 통해 확인했고 기사 본문은 직접 열지 못했다.\"}, {\"type\": \"regulatory\", \"detail\": \"fda가 blood pressure insights 기능에 대해 경고 서한을 보냈다. 혈압을 재는 일 자체가 고혈압과 저혈압의 진단에 붙어 있으므로 의료기기에 해당하며, 허가나 신고 없이 팔았으므로 제품이 불량표시 상태라고 판단했다. 웰니스 제품이라는 회사 주장은 혈압 측정이 저위험이 아니라는 이유로 받아들이지 않았고, 15영업일 안에 시정 계획을 내지 않으면 압류와 판매 금지, 과징금으로 갈 수 있다고 통지했다.\", \"when\": \"2025-07-14\", \"source\": \"fda 경고 서한 원문(공개 문서)\"}, {\"type\": \"regulatory\", \"detail\": \"whoop physician services, p.c.라는 별도 의사 법인을 세워 미국 메디케어 혁신센터의 access 모형에 참가 기관으로 들어갔다. 이 모형은 2026년 7월 5일에 시작해 10년 동안 운영되며, 고혈압과 고지혈증, 비만, 당뇨, 만성 신장질환 같은 만성질환을 병원 밖에서 관리하는 조직에 성과에 따라 돈을 지급한다.\", \"when\": \"2026-08\", \"source\": \"whoop connected care 진료 약관(2026년 8월 5일 갱신)과 동의서, 그리고 cms의 access 모형 설명 페이지\"}, {\"type\": \"partnership\", \"detail\": \"quest diagnostics의 전국 2,000여 개 채혈 시설과 grail의 galleri 암 검사를 앱 안에 붙여 혈액검사 상품을 만들었다.\", \"when\": \"2026-09\", \"source\": \"whoop advanced labs 소개 페이지와 galleri 상품 페이지\"}, {\"type\": \"customers\", \"detail\": \"미국 아이폰 앱스토어에서 평점 4.8에 평가가 74,784개이고, 구글 플레이에서는 평점 4.7에 리뷰 28,200개, 설치 100만 회 이상이다. 앱은 무료이며 밴드가 있어야 쓸 수 있다.\", \"when\": \"2026-09\", \"source\": \"애플 itunes 조회 api와 구글 플레이 앱 페이지를 직접 확인\"}], \"caveats\": \"회사가 스스로 낸 수치와 제삼자가 확인한 수치를 갈라 볼 필요가 있다. 홈페이지에 걸린 매일 착용하면 주당 활동이 91분 늘고 수면이 2.3시간 늘며 심박변이도가 10퍼센트 넘게 높아진다는 문구는 회사가 자기 회원 데이터로 낸 것이고 별표 각주가 붙어 있으며, 제삼자가 검증한 결과가 아니다. 회원 수와 매출은 아예 공개하지 않으므로 규모는 앱 평가 수와 투자 라운드로만 짐작할 수 있다. 시리즈 g의 5억 7,500만 달러와 101억 달러라는 숫자는 new york times와 massdevice 보도에 근거하지만 이번 조사에서 기사 본문을 직접 열지 못했고 위키백과의 각주로만 확인했다. 규제 쪽에는 짚어야 할 대목이 더 있다. fda는 2025년 7월 14일에 혈압 기능을 두고 경고 서한을 보냈고 회사는 cnbc를 통해 fda가 권한을 넘어섰다고 반박했는데, 2026년 9월 현재까지 그 기능은 내려가지 않았고 홈페이지에서도 매일의 혈압 인사이트를 받으라고 계속 광고하고 있다. 달라진 것은 의료기기가 아니고 진단이나 관리에 쓸 수 없다는 면책 문구가 붙은 점뿐이다. 여기에 connected care 동의서를 보면, 메디케어 환자에게 무상으로 주는 밴드에 바로 그 blood pressure insights 기능이 포함된다고 명시돼 있고, 밴드와 혈압계를 받지 않으면 진료 자체를 받을 수 없다고 적혀 있다. 진료 약관은 이 진료가 인공지능 기술로 제공되며 제3자의 대규모 언어모형이 쓰인다고 밝히면서, 그 결과물이 틀리거나 없는 사실을 지어낼 수 있고 사람을 대신하지 못하며 정보 제공용일 뿐이라고 대문자로 경고하고 있다. 진료 과실 책임의 상한도 100달러로 걸어 두었다. 확인하지 못한 것도 있다. connected care 소개 페이지는 사이트 아래쪽에 연결 주소가 남아 있으나 접속하면 없는 페이지로 나오며, 지금 공개된 것은 법률 문서 세 건뿐이다. cms 쪽에서 access 모형 참가 기관 명단을 찾지 못해, whoop의 참가 사실은 회사가 낸 법률 문서로만 확인했다. 요금제 값은 접속 위치 때문에 화면에는 원화로 표시됐고, 달러 값은 같은 페이지가 내려받는 데이터에서 확인했다.\", \"for_us\": \"이 회사에서 3개월과 소프트웨어 인력이라는 조건 안에 들어오는 것과 밖에 있는 것을 먼저 갈라야 한다. 밴드와 혈압계 같은 하드웨어, 전국 채혈망을 낀 혈액검사, 메디케어에 진료비를 청구하는 의사 법인은 전부 조건 밖이다. healthspan과 whoop age는 우리 앱의 건강 나이와 같은 것이므로 제외 대상이다. 그러면 세 가지가 남는다. 첫째, whoop이 지금 옮겨 가고 있는 방향 자체가 참고가 된다. 수치를 보여 주는 데서 멈추지 않고 그 수치를 근거로 사람이 개입하는 층을 위에 얹고 있는데, 개입의 상당 부분은 앱 화면에서 일어나는 일이다. 혈액검사 결과를 임상의가 검토해 실행 계획으로 돌려주는 흐름이 그 예이며, 우리 앱에는 이미 검진 수치와 식단 기록이 있으므로 재료는 갖춰져 있다. 둘째, advanced labs가 구독도 밴드도 필요 없다고 내세우는 대목이다. 웨어러블 회사가 자기 기기를 쓰지 않는 사람에게도 팔 수 있는 건강 상품을 따로 만들었다는 뜻이며, 우리도 걸음 데이터 밖에서 앱을 열 이유를 하나 더 만들 수 있다는 근거가 된다. 셋째이자 가장 실용적인 것은 규제선을 보여 주는 문서다. fda 경고 서한은 혈압처럼 몸의 수치를 추정해 보여 주면 표현을 어떻게 하든 의료기기가 된다고 못 박았고, 반대로 어디까지가 웰니스인지도 같은 문서에서 읽어 낼 수 있다. 우리가 미국에서 3개월 안에 붙일 기능은 이 선을 넘지 않아야 하므로, 기능을 고르기 전에 이 서한을 기준 문서로 쓰는 편이 낫다. 한 달 무료 체험처럼 진입 문턱을 없애는 방식도 참고할 만하지만, 우리는 줄 하드웨어가 없으므로 그대로 옮겨 오지는 못한다.\", \"screenshots\": [{\"file\": \"whoop_membership.png\", \"caption\": \"요금제 비교 페이지다. one, peak, life 세 가지가 나란히 놓여 있고 요금제마다 밴드와 충전기가 포함된다는 점, 위 요금제로 갈수록 healthspan과 심전도, 혈압 인사이트가 더해지는 구조를 보여 준다. 한국에서 접속했기 때문에 값이 원화로 표시돼 있으며, 달러 값은 같은 페이지의 데이터에서 확인했다.\", \"from\": \"https://www.whoop.com/us/en/membership/\"}, {\"file\": \"whoop_labs.png\", \"caption\": \"혈액검사 상품 목록이다. 53개 항목을 보는 기본 패널이 69달러, 75개 항목을 정기적으로 보는 구독형 패널이 199달러로 붙어 있고, 세전 의료비 계좌로 결제할 수 있다는 표시가 상품마다 달려 있다.\", \"from\": \"https://shop.whoop.com/us/en/advanced-labs/panels/\"}, {\"file\": \"whoop_connected_care.png\", \"caption\": \"whoop physician services, p.c.의 진료 약관 첫 화면이다. 웨어러블 회사가 자기 이름을 단 의사 법인을 세우고 진료 약관을 따로 내걸었다는 사실 자체를 보여 주며, 2026년 8월 5일에 갱신됐다.\", \"from\": \"https://www.whoop.com/us/en/connected-care-terms-of-care/\"}, {\"file\": \"whoop_ios.png\", \"caption\": \"미국 아이폰 앱스토어 페이지다. 앱은 무료이고 평점 4.8에 평가가 74,784개이며, 밴드가 있어야 쓸 수 있다는 점이 설명에 적혀 있다.\", \"from\": \"https://apps.apple.com/us/app/whoop/id933944389\"}], \"sources\": [{\"title\": \"whoop 요금제 비교 페이지\", \"url\": \"https://www.whoop.com/us/en/membership/\", \"note\": \"one, peak, life 세 요금제의 구성과 기능 차이, 각 기능에 붙은 의료 관련 면책 문구를 확인했다. 달러 값 199, 239, 359는 이 페이지가 내려받는 데이터에서 확인했다.\"}, {\"title\": \"whoop 홈페이지\", \"url\": \"https://www.whoop.com/us/en/\", \"note\": \"매일의 혈압 인사이트를 지금도 광고하고 있다는 점과, 매일 착용 시 활동과 수면, 심박변이도가 늘어난다는 회사 주장 문구를 확인했다.\"}, {\"title\": \"whoop advanced labs 소개 페이지\", \"url\": \"https://www.whoop.com/us/en/advanced-labs/\", \"note\": \"검사 흐름 세 단계, 임상의가 결과를 검토해 실행 계획을 준다는 설명, quest diagnostics 2,000여 곳, 구독과 밴드가 없어도 된다는 문구, 검사를 못 받는 다섯 개 주, 의료 자문위원 명단을 확인했다.\"}, {\"title\": \"whoop advanced labs 상품 목록\", \"url\": \"https://shop.whoop.com/us/en/advanced-labs/panels/\", \"note\": \"기본 패널 69달러, 구독형 종합 패널 199달러, 특화 패널 299달러라는 값을 확인했다.\"}, {\"title\": \"galleri 암 조기 발견 검사 상품 페이지\", \"url\": \"https://shop.whoop.com/us/en/advanced-labs/panels/grail-galleri-cancer-test/\", \"note\": \"799달러라는 값과, 면허 의사가 처방을 대신 내주므로 따로 진료를 받지 않아도 된다는 안내를 확인했다.\"}, {\"title\": \"whoop connected care 진료 약관\", \"url\": \"https://www.whoop.com/us/en/connected-care-terms-of-care/\", \"note\": \"별도 의사 법인 whoop physician services, p.c.의 존재, 메디케어 access 모형 참가, 진료가 인공지능과 제3자 대규모 언어모형으로 제공된다는 사실, 책임 상한 100달러를 확인했다. 2026년 8월 5일 갱신본이다.\"}, {\"title\": \"whoop connected care 진료 동의서\", \"url\": \"https://www.whoop.com/us/en/connected-care-consent-to-care/\", \"note\": \"진료비와 본인부담금 전액 면제, 밴드와 혈압계 무상 지급, 그 밴드에 blood pressure insights가 포함된다는 명시, 메디케어가 이 법인에 직접 지급한다는 조항, 90일 뒤 이탈 가능 조건을 확인했다.\"}, {\"title\": \"fda가 whoop에 보낸 경고 서한\", \"url\": \"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/whoop-inc-709755-07142025\", \"note\": \"2025년 7월 14일자이며, 혈압 기능이 왜 의료기기로 분류되는지와 웰니스 제품 주장이 왜 받아들여지지 않았는지를 확인했다.\"}, {\"title\": \"fda 경고 서한 검색 목록\", \"url\": \"https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/compliance-actions-and-activities/warning-letters?search_api_fulltext=whoop\", \"note\": \"whoop 앞으로 발송된 경고 서한의 발송일과 담당 부서를 확인했다.\"}, {\"title\": \"cms access 모형 설명 페이지\", \"url\": \"https://www.cms.gov/priorities/innovation/innovation-models/access-model\", \"note\": \"2026년 7월 5일 시작해 10년간 운영되는 모형이라는 점, 네 갈래 임상 트랙과 다루는 질환, 성과에 따라 지급하는 구조를 확인했다. 참가 기관 명단은 찾지 못했다.\"}, {\"title\": \"위키백과 whoop 항목\", \"url\": \"https://en.wikipedia.org/wiki/whoop_(company)\", \"note\": \"창업 연도와 창업자, 본사, 2021년과 2026년 투자 라운드, 2025년 기기 업그레이드 정책 논란을 확인했다. 투자 라운드의 원 출처는 new york times 2026년 3월 31일자와 massdevice 2026년 4월 1일자 기사이며, fda 반박 발언의 원 출처는 cnbc 2025년 7월 15일자 기사다.\"}, {\"title\": \"애플 앱스토어 조회 결과와 구글 플레이 앱 페이지\", \"url\": \"https://apps.apple.com/us/app/whoop/id933944389\", \"note\": \"아이폰 평점 4.8에 평가 74,784개, 안드로이드 평점 4.7에 리뷰 28,200개와 설치 100만 회 이상, 한 달 무료 체험 안내를 확인했다.\"}]}"},{"slug":"zealthy","name":"Zealthy","one_liner":"비만 치료제를 비롯한 처방약을 온라인 문진과 화상 진료만으로 처방해 집으로 배송하고, 매달 회원비를 자동으로 청구하는 소비자 직접 결제형 원격진료 회사다.","sells_to":"consumer","seen_in":[{"issue":"33","section":21,"headline":"미국 법무부가 소송에서 새 신청서를 내면서 GLP-1 원격진료 회사 Zealthy가 파산에 가까워졌고, 창업자가 앞서 Cerebral에서도 같은 혐의를 받았다는 이력이 함께 소개됐다."}],"card":{"problem":"미국에서 비만 치료제는 한 달 약값이 1,000달러를 넘고 보험이 적용되지 않는 경우가 많아서, 의사를 만나 처방을 받는 일 자체가 비용과 대기 시간의 벽에 막힌다.","solution":"문진표를 채우면 원격으로 처방을 내주고 약을 집으로 보내 주며, 보험 적용을 대신 알아봐 주거나 보험 없이도 살 수 있는 조제 의약품을 매달 배송하는 구독 상품을 판다.","price":"체중 감량 회원비는 정가 월 135달러이고 첫 달 할인가는 49달러다. 약값은 따로 내며 세마글루타이드는 3개월치를 한 번에 사면 월 151달러부터, 보험이 적용되는 브랜드 약은 월 25달러부터다.","tags":["원격진료","비만 치료제","구독 결제","현금 결제","약 배송"],"headline_traction":"미국 법무부가 2026년 4월 13일 자산 동결과 법정관리인 선임을 요구하는 가처분 신청을 냈고, 심리는 2026년 10월 5일로 잡혀 있다.","watch":"회사가 광고하는 체중 감량 효과와 회원 후기는 전부 회사가 스스로 낸 것이고, 정부는 그 후기 가운데 상당수가 조작됐다고 주장한다."},"screenshots":[{"file":"zealthy_home.png","caption":"첫 화면이다. 상단에 첫 달 96달러 할인 안내가 걸려 있고 체중 감량, 불안과 우울, 피임, 발기부전 등 진료 영역을 골라 들어가게 돼 있다.","from":"https://getzealthy.com/"},{"file":"zealthy_weightloss.png","caption":"체중 감량 상품 설명 페이지다. 보험이 있으면 월 25달러부터, 보험 없이 세마글루타이드를 사면 월 151달러부터라는 값이 나란히 적혀 있다.","from":"https://getzealthy.com/weight-loss"},{"file":"zealthy_cancel.png","caption":"구독과 해지, 환불 정책 페이지다. 법인 이름이 FitRX, LLC이고 Zealthy가 그 상호라는 사실과 해지 절차가 여기에 적혀 있다.","from":"https://getzealthy.com/subscriptions-cancellations-refunds-policy"}],"q":"{\"slug\": \"zealthy\", \"name\": \"zealthy\", \"one_liner\": \"비만 치료제를 비롯한 처방약을 온라인 문진과 화상 진료만으로 처방해 집으로 배송하고, 매달 회원비를 자동으로 청구하는 소비자 직접 결제형 원격진료 회사다.\", \"site\": \"https://getzealthy.com\", \"sells_to\": \"consumer\", \"seen_in\": [{\"issue\": \"33\", \"section\": 21, \"headline\": \"미국 법무부가 소송에서 새 신청서를 내면서 glp-1 원격진료 회사 zealthy가 파산에 가까워졌고, 창업자가 앞서 cerebral에서도 같은 혐의를 받았다는 이력이 함께 소개됐다.\"}], \"card\": {\"problem\": \"미국에서 비만 치료제는 한 달 약값이 1,000달러를 넘고 보험이 적용되지 않는 경우가 많아서, 의사를 만나 처방을 받는 일 자체가 비용과 대기 시간의 벽에 막힌다.\", \"solution\": \"문진표를 채우면 원격으로 처방을 내주고 약을 집으로 보내 주며, 보험 적용을 대신 알아봐 주거나 보험 없이도 살 수 있는 조제 의약품을 매달 배송하는 구독 상품을 판다.\", \"price\": \"체중 감량 회원비는 정가 월 135달러이고 첫 달 할인가는 49달러다. 약값은 따로 내며 세마글루타이드는 3개월치를 한 번에 사면 월 151달러부터, 보험이 적용되는 브랜드 약은 월 25달러부터다.\", \"tags\": [\"원격진료\", \"비만 치료제\", \"구독 결제\", \"현금 결제\", \"약 배송\"], \"headline_traction\": \"미국 법무부가 2026년 4월 13일 자산 동결과 법정관리인 선임을 요구하는 가처분 신청을 냈고, 심리는 2026년 10월 5일로 잡혀 있다.\", \"watch\": \"회사가 광고하는 체중 감량 효과와 회원 후기는 전부 회사가 스스로 낸 것이고, 정부는 그 후기 가운데 상당수가 조작됐다고 주장한다.\"}, \"problem\": \"미국에서 비만 치료제로 쓰이는 glp-1 계열 약은 보험이 없으면 한 달에 1,000달러가 넘게 든다. 회사가 자기 사이트에 적어 둔 정가만 봐도 세마글루타이드는 월 1,349달러다. 한국은 전국민 건강보험이 있어서 아프면 동네 의원에 가면 되지만, 미국은 보험사마다 비만약을 보장 항목에서 빼는 일이 흔하고 보장이 되더라도 사전 승인 절차를 통과해야 한다. 그래서 약을 받으려면 의사를 만나는 일, 보험사와 다투는 일, 약국에서 재고를 찾는 일을 환자가 각각 따로 감당해야 한다. 이 세 가지를 한 번에 대신해 주고 값을 월 정액으로 묶어 파는 자리가 미국의 소비자 직접 결제형 원격진료 시장이며, zealthy는 그 자리에서 성장한 회사다.\", \"solution\": \"사용자는 사이트나 앱에서 5분 정도 걸리는 문진표를 채우고 회원으로 가입한다. 가입과 동시에 결제 수단을 등록하며, 회원비는 매달 같은 날짜에 자동으로 다시 청구된다. 그다음 담당 의료진이 답변을 검토하고 필요하면 화상 진료를 진행하며, 적합하다고 판단하면 처방을 내린다. 보험이 있으면 회사의 보험 담당 인력이 사전 승인을 대신 처리해 브랜드 약값을 월 25달러까지 낮추는 것을 목표로 하고, 보험이 없으면 조제 의약품인 세마글루타이드를 월 151달러부터, 티르제파타이드를 월 216달러부터 집으로 보내 준다. 회원에게는 체중 감량 코치가 배정되고 메시지로 무제한 상담할 수 있다. 체중 감량 회원비는 정가 월 135달러이고, 사이트에 걸린 할인 안내에 따르면 첫 달은 49달러다. 회사는 체중 감량 외에도 불안과 우울, 피임, 발기부전, 탈모, 피부, 수면, 일차 진료를 같은 구조로 판다.\", \"features\": [{\"name\": \"온라인 문진 기반 glp-1 처방\", \"detail\": \"대면 진료 없이 문진과 화상 상담만으로 세마글루타이드나 티르제파타이드 처방을 받고 약을 집에서 받는다. 회사는 보험이 없어도 된다는 점을 가장 앞세워 광고한다.\"}, {\"name\": \"보험 청구 대행\", \"detail\": \"회사의 담당 인력이 보험사 사전 승인을 대신 처리해 브랜드 약의 본인 부담금을 낮추는 일을 맡는다. 회사는 이 절차로 월 1,349달러짜리 약을 월 25달러 수준까지 낮출 수 있다고 안내한다.\"}, {\"name\": \"월정액 회원 구독\", \"detail\": \"약값과 별개로 회원비를 매달 자동으로 청구한다. 정가는 월 135달러이고 분기, 반기, 연 단위로 묶어 사면 할인된다. 3개월치 약을 한 번에 사면 이후 두 달치 회원비를 20% 깎아 준다.\"}, {\"name\": \"체중 감량 코치 메시지 상담\", \"detail\": \"회원에게 코치를 배정하고 식사와 운동에 관해 횟수 제한 없이 메시지로 상담할 수 있게 한다. 약만 파는 것이 아니라는 점을 내세우는 장치다.\"}, {\"name\": \"여러 상표로 나뉜 같은 서비스\", \"detail\": \"애플 앱스토어에서 zealthy inc. 이름으로 zealthy 외에 roenrx, fitrx, amrx 세 개의 앱이 더 나와 있다. 세 앱 모두 2026년 4월 6일부터 19일 사이에 처음 등록됐고 설명 문구와 판매 품목이 zealthy와 거의 같다.\"}, {\"name\": \"12개 진료 영역 확장\", \"detail\": \"체중 감량 외에 불안과 우울, 피임, 발기부전, 탈모, 피부, 수면, 엔클로미펜, 프리워크아웃, 일차 진료, hiv 예방약까지 같은 구독 구조로 판다.\"}], \"differentiator\": \"같은 문제를 푸는 회사로는 hims & hers, ro, noom 같은 곳이 있고, 파는 물건과 결제 구조만 놓고 보면 zealthy가 특별히 다르지 않다. 값을 낮추는 방식이 조금 다른데, hims & hers가 자체 브랜드 상품을 앞세우는 데 비해 zealthy는 보험 사전 승인을 대신 처리해 브랜드 약의 본인 부담금을 낮추는 쪽과 보험 없이 조제 의약품을 싸게 파는 쪽을 둘 다 내세운다. 실제로 이 회사를 다른 회사와 갈라놓는 것은 제품이 아니라 규제 이력이다. 창업자 kyle robertson은 앞서 cerebral을 세웠다가 2022년 5월에 물러났고, 미국 법무부는 2024년에 cerebral을 상대로 낸 소송에 그를 개인 피고로 넣은 뒤 2026년에는 zealthy까지 피고에 포함해 회사 자체를 법정관리에 넘겨 달라고 요구하고 있다.\", \"team\": [{\"name\": \"kyle robertson\", \"role\": \"창업자\", \"background\": \"2020년에 원격 정신건강 회사 cerebral을 세워 약 5억 달러를 모으고 48억 달러 기업 가치를 인정받았으나 2022년 5월에 회사에서 물러났고, 같은 해에 zealthy를 세웠다.\"}, {\"name\": \"michael repplier\", \"role\": \"robertson의 사업 동업자\", \"background\": \"법무부가 제안한 법정관리인 선임 명령이 법원에서 받아들여지면 robertson과 함께 재산 내역을 상세히 공개해야 하는 대상으로 지목됐다.\"}], \"traction\": [{\"type\": \"regulatory\", \"detail\": \"미국 법무부가 연방거래위원회를 대신해 플로리다 남부 연방지방법원에 cerebral을 상대로 소송을 냈다. 사건 번호는 1:24-cv-21376이며 이후 kyle robertson과 zealthy가 피고에 추가됐다.\", \"when\": \"2024-04\", \"source\": \"courtlistener 사건 기록 united states v. cerebral, inc.\"}, {\"type\": \"regulatory\", \"detail\": \"법원이 세 번째 수정 소장 제출을 명령했고 정부가 2026년 4월 10일까지 이를 제출했다. 사흘 뒤인 4월 13일에는 자산 동결과 법정관리인 선임을 요구하는 가처분 신청이 접수됐다.\", \"when\": \"2026-04\", \"source\": \"courtlistener 사건 기록 도켓 210번, 223번\"}, {\"type\": \"regulatory\", \"detail\": \"정부는 법원 제출 서류에서 소비자 배상액과 과징금이 zealthy를 파산시킬 수 있으므로 자산 보전이 필요하다고 밝혔고, 관리인 후보로 alvarez & marsal의 mark roberts를 제안했다.\", \"when\": \"2026-04\", \"source\": \"behavioral health business 보도\"}, {\"type\": \"regulatory\", \"detail\": \"가처분 신청 심리가 2026년 10월 5일 마이애미 법정에서 열리도록 잡혔고, 배심 재판은 2027년 4월 19일로 지정됐다. 피고 측은 2026년 7월 10일에 소장 1번 청구에 대한 각하 신청을 냈다.\", \"when\": \"2026-07\", \"source\": \"courtlistener 사건 기록 도켓 281번, 287번\"}, {\"type\": \"regulatory\", \"detail\": \"novo nordisk a/s가 뉴욕 남부 연방지방법원에 zealthy inc.를 상대로 소송을 냈다. 사건 번호는 1:25-cv-06391이다.\", \"when\": \"2025-08\", \"source\": \"courtlistener 사건 검색 결과\"}, {\"type\": \"traffic\", \"detail\": \"미국 애플 앱스토어에서 별점 4.2에 평가 2,845건, 구글 플레이에서 별점 3.5에 후기 779건과 내려받기 1만 건 이상을 기록하고 있다. 두 스토어 모두 2026년 9월 9일에 최신 버전이 올라왔다.\", \"when\": \"2026-09\", \"source\": \"애플 itunes 조회 api와 구글 플레이 페이지\"}], \"caveats\": \"가장 먼저 짚어야 할 것은 뉴스레터가 전한 파산 이야기가 아직 확정된 사실이 아니라는 점이다. 파산 가능성을 언급한 쪽은 법원이 아니라 정부이며, 정부가 요구한 배상액과 과징금이 회사의 자금을 넘어설 수 있다는 취지로 법원 제출 서류에 적은 문장이다. 조사 시점인 2026년 9월 10일 기준으로 가처분 심리는 아직 열리지 않았고 회사는 계속 영업하고 있다. 사이트는 할인 행사를 걸어 두고 회원을 받고 있으며 앱은 하루 전에도 새 버전이 올라왔다.\\n\\n다만 옛 주소인 zealthy.com은 접속이 끊긴다. 국내망과 해외 서비스 양쪽에서 확인했으나 연결 자체가 닫혀 있었고, 현재 살아 있는 주소는 getzealthy.com이다. 이용 약관을 보면 법인 이름은 fitrx, llc이며 zealthy는 그 상호다. 앱스토어에서는 같은 회사가 roenrx, fitrx, amrx라는 이름으로 사실상 같은 서비스를 파는 앱 세 개를 2026년 4월 초순과 중순에 새로 냈는데, 이는 정부가 세 번째 수정 소장을 내고 자산 동결을 신청한 시기와 겹친다. 다만 두 사실 사이의 인과관계를 확인해 주는 자료는 찾지 못했다.\\n\\n회사가 내세우는 수치는 전부 회사가 스스로 낸 것이다. 평균 15~20% 체중 감량, 회원 후기, 별점은 제삼자가 검증한 것이 아니다. 정부는 소장에서 robertson이 사업체들을 시켜 가명으로 좋은 후기 수천 건을 올리게 했고 본인도 직접 가짜 후기를 썼다고 주장한다. 값 표기도 일관되지 않는다. 같은 안내 페이지에서 배너는 첫 달 96달러 할인이라고 적혀 있는데 아래 문답에서는 86달러 할인이라 적혀 있고 첫 달 값은 49달러라고 나온다. 회사 앱 설명에는 첫 달 39달러라는 문구가 또 따로 있다.\\n\\n정부가 주장하는 위법 행위는 크게 세 갈래다. 첫째는 해지를 어렵게 만든 구독 결제 구조이고, 둘째는 후기 조작이며, 셋째는 의료진의 면허 번호를 본인 동의 없이 써서 처방을 낸 행위다. 세 번째 혐의는 회사의 의무 책임자가 법무부에 낸 내부 고발에서 나왔으며, 필리핀 콜센터 직원처럼 처방 권한이 없는 사람이 처방과 보험 사전 승인을 처리했다는 주장이 포함돼 있다. 이 주장들은 아직 법원에서 판단을 받지 않았고, 공개된 소장에서는 관련 대목 상당수가 가려져 있어 규모를 알 수 없다.\\n\\n소비자가 낸 소송도 별도로 여러 건 진행 중이다. 2025년 8월부터 2026년 4월 사이에 캘리포니아, 펜실베이니아, 뉴욕, 테네시, 플로리다 연방법원에 zealthy를 상대로 한 사건이 접수됐다. 창업자 이력과 회사 연혁은 behavioral health business 보도를 근거로 삼았고, 소송 진행 상황은 미국 연방법원 전자기록을 모으는 courtlistener에서 직접 확인했다. 투자 유치 금액과 매출은 확인 가능한 자료를 찾지 못해 비워 두었다.\", \"for_us\": \"이 사례에서 우리가 가져갈 것은 제품이 아니라 규칙이다. 미국에서 앱이 유료 구독을 붙이는 순간 rosca라는 법의 적용을 받는데, 이 법은 자동 갱신 결제를 팔 때 값과 갱신 조건을 결제 직전에 분명히 보여 줄 것, 이용자의 명시적 동의를 받을 것, 해지 수단을 간단하게 둘 것을 요구한다. 정부가 zealthy를 문제 삼은 첫 번째 이유가 바로 해지 절차를 일부러 복잡하게 설계했다는 점이며, 소장에는 창업자가 팀에 마찰을 더 넣으라고 지시했다는 전직 직원의 증언까지 담겼다. 우리가 미국에서 구독이나 자동 갱신을 다루게 된다면 해지 버튼을 몇 번 눌러야 닿는지가 곧 법적 위험이 된다.\\n\\n두 번째로 볼 것은 후기다. 연방거래위원회는 2024년 8월에 가짜 후기와 후기 매수, 내부자 후기, 회사가 직접 운영하는 후기 사이트, 부정적 후기 억제를 모두 금지하는 규칙을 확정했다. 앱 안에서 별점을 요청하는 방식이나 부정적 평가를 걸러 내는 장치는 한국에서 관행처럼 쓰이더라도 미국에서는 제재 대상이 될 수 있다.\\n\\n세 번째는 구조적인 관찰이다. 미국 소비자가 보험을 거치지 않고 매달 직접 돈을 내는 건강 서비스에 기꺼이 지갑을 여는 시장이 실재한다는 것을 이 회사가 보여 준다. 다만 그 시장에서 성장 속도를 만들어 낸 장치가 그대로 규제 위험으로 돌아왔다는 점도 같이 봐야 한다. 우리가 3개월 안에 소프트웨어만으로 붙일 수 있는 건강 가치를 고를 때, 처방과 약 배송처럼 면허와 규제가 걸린 영역은 피하고 보험 절차 안내나 비용 비교처럼 정보를 다루는 쪽이 현실적이다.\", \"screenshots\": [{\"file\": \"zealthy_home.png\", \"caption\": \"첫 화면이다. 상단에 첫 달 96달러 할인 안내가 걸려 있고 체중 감량, 불안과 우울, 피임, 발기부전 등 진료 영역을 골라 들어가게 돼 있다.\", \"from\": \"https://getzealthy.com/\"}, {\"file\": \"zealthy_weightloss.png\", \"caption\": \"체중 감량 상품 설명 페이지다. 보험이 있으면 월 25달러부터, 보험 없이 세마글루타이드를 사면 월 151달러부터라는 값이 나란히 적혀 있다.\", \"from\": \"https://getzealthy.com/weight-loss\"}, {\"file\": \"zealthy_cancel.png\", \"caption\": \"구독과 해지, 환불 정책 페이지다. 법인 이름이 fitrx, llc이고 zealthy가 그 상호라는 사실과 해지 절차가 여기에 적혀 있다.\", \"from\": \"https://getzealthy.com/subscriptions-cancellations-refunds-policy\"}, {\"file\": \"zealthy_ios.png\", \"caption\": \"미국 애플 앱스토어 페이지다. 별점 4.2에 평가 2,845건이며 조사 하루 전인 2026년 9월 9일에 새 버전이 올라왔다.\", \"from\": \"https://apps.apple.com/us/app/zealthy-health-weight-loss/id6502919679\"}], \"sources\": [{\"title\": \"ftc, doj move to seize zealthy - a telehealth company led by cerebral's founding ceo\", \"url\": \"https://bhbusiness.com/2026/04/20/ftc-doj-move-to-seize-zealthy-a-telehealth-company-led-by-cerebrals-founding-ceo/\", \"note\": \"세 번째 수정 소장의 내용, 법정관리인 선임 요구, 창업자 이력, 면허 번호 도용 관련 내부 고발을 확인했다.\"}, {\"title\": \"united states v. cerebral, inc., 1:24-cv-21376 (s.d. fla.) 사건 기록\", \"url\": \"https://www.courtlistener.com/docket/68432608/united-states-v-cerebral-inc/\", \"note\": \"소송 제기일, 피고 목록, 세 번째 수정 소장과 가처분 신청 날짜, 10월 5일 심리와 2027년 4월 배심 재판 일정을 직접 확인했다.\"}, {\"title\": \"courtlistener 'zealthy' 사건 검색 결과\", \"url\": \"https://www.courtlistener.com/?q=zealthy&type=r\", \"note\": \"novo nordisk가 낸 소송과 2025년부터 2026년 사이에 접수된 소비자 소송 여러 건을 확인했다.\"}, {\"title\": \"zealthy 체중 감량 상품 페이지\", \"url\": \"https://getzealthy.com/weight-loss\", \"note\": \"보험 적용 시 월 25달러, 보험 없이 세마글루타이드 월 151달러라는 값과 평균 15~20% 감량이라는 주장을 확인했다.\"}, {\"title\": \"zealthy 체중 감량 값 안내 페이지\", \"url\": \"https://go.getzealthy.com/zealthy-weight-loss-pricing_homepage/\", \"note\": \"회원비 정가 월 135달러, 첫 달 49달러, 자동 갱신 결제 방식과 할인 조건을 확인했다. 배너와 본문의 할인 금액이 서로 다른 것도 여기서 확인했다.\"}, {\"title\": \"zealthy 구독, 해지, 환불 정책\", \"url\": \"https://getzealthy.com/subscriptions-cancellations-refunds-policy\", \"note\": \"법인 이름이 fitrx, llc라는 사실, 회원비 구조, 해지 절차와 환불 제한 조건을 확인했다.\"}, {\"title\": \"애플 앱스토어 zealthy 및 동일 회사 앱 조회 결과\", \"url\": \"https://apps.apple.com/us/app/zealthy-health-weight-loss/id6502919679\", \"note\": \"별점과 평가 수, 최신 버전 날짜를 확인했다. 같은 회사가 낸 roenrx, fitrx, amrx 세 앱의 등록일도 함께 확인했다.\"}, {\"title\": \"구글 플레이 zealthy 페이지\", \"url\": \"https://play.google.com/store/apps/details?id=com.zealthy.mobileapp\", \"note\": \"별점 3.5, 후기 779건, 내려받기 1만 건 이상을 확인했다.\"}]}"}],"themeLabels":{"medicare":"메디케어","medicare-advantage":"메디케어 어드밴티지","medicaid":"메디케이드","aca-exchange":"ACA 거래소","employer-insurance":"고용주 보험","payer-ops":"보험사 운영","hospital-health-system":"병원·헬스시스템","primary-care":"1차 진료","value-based-care":"성과기반 진료","rcm-billing":"청구·수납","pbm-drug-pricing":"PBM·약값","pharmacy-retail":"약국·리테일","pharma-glp1":"제약·GLP-1","price-transparency":"가격 투명성","consumer-dtc":"소비자 직접판매","cash-pay":"현금 결제 시장","employer-benefits":"복리후생","ai-clinical":"임상 AI","ai-admin":"행정 AI","data-interop":"데이터 상호운용","telehealth":"원격진료","behavioral-mental":"정신건강","chronic-care":"만성질환 관리","senior-care":"시니어 케어","women-health":"여성 건강","dental-vision":"치과·안과","devices-wearables":"기기·웨어러블","digital-health-funding":"투자·펀딩","ma-consolidation":"인수합병","regulation-cms":"CMS 규제","regulation-fda":"FDA 규제","policy-legislation":"입법·정책","public-health":"공중보건","workforce":"인력","rural-access":"의료 접근성","clinical-trials":"임상시험","insurance-brokerage":"보험 유통","startups":"스타트업","market-earnings":"실적·시장"},"split":true}</script>
<script>
(function(){
"use strict";
var DB = JSON.parse(document.getElementById('payload').textContent);
var ISSUES = DB.issues || [];
var EXTRAS = DB.extras || {};
var COMPANIES = {};
(DB.companies || []).forEach(function(c){ COMPANIES[c.slug] = c; });
var SPLIT = !!DB.split;          /* 본문을 조각 파일로 나눠 두었는가 */
var CACHE = { issue:{}, company:{}, extras:null };

function fetchJSON(path){
  return fetch(path, {cache:'no-cache'}).then(function(r){
    if(!r.ok) throw new Error(path + ' ' + r.status);
    return r.json();
  });
}
function showLoading(msg){
  document.getElementById('content').innerHTML =
    '<div class="empty">' + esc(msg || '불러오는 중입니다') + '</div>';
}
/* 본문이 필요한 화면은 조각 파일을 먼저 받아 온 뒤에 그린다. */
function need(kind, id, draw){
  if(!SPLIT){ draw(); return; }
  if(CACHE[kind][id]){ draw(); return; }
  showLoading();
  var path = kind === 'issue' ? 'site/issue-' + id + '.json' : 'site/company-' + id + '.json';
  fetchJSON(path).then(function(d){
    CACHE[kind][id] = d;
    draw();
  }).catch(function(e){
    document.getElementById('content').innerHTML =
      '<div class="empty">내용을 불러오지 못했습니다.<br><small>' + esc(String(e)) + '</small></div>';
  });
}
function needExtras(draw){
  if(!SPLIT || CACHE.extras){ draw(); return; }
  showLoading();
  fetchJSON('site/extras.json').then(function(d){ CACHE.extras = d; EXTRAS = d; draw(); })
    .catch(function(){ CACHE.extras = {}; EXTRAS = {}; draw(); });
}
var TYPE_LABEL = {reads:'테크 리즈', policy:'정책 브리핑', roundup:'그랜드 라운드업', interview:'인터뷰', event:'안내'};
var THEME_LABEL = DB.themeLabels || {};

/* ---------- theme toggle ---------- */
var root = document.documentElement;
try{ var saved = localStorage.getItem('htn-theme'); if(saved) root.setAttribute('data-theme', saved); }catch(e){}
document.getElementById('themebtn').addEventListener('click', function(){
  var cur = root.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : (cur === 'light' ? 'dark' : (matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark'));
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('htn-theme', next); }catch(e){}
});

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function el(html){ var d = document.createElement('div'); d.innerHTML = html; return d; }
function fmtDate(d){ if(!d) return ''; var p = d.split('-'); return p[0] + '.' + p[1] + '.' + p[2]; }
function monthKey(d){ var p = String(d||'').split('-'); return p[0] + '년 ' + parseInt(p[1],10) + '월'; }
function issueText(it){
  if(it.q) return it.q;
  if(it._txt) return it._txt;
  var buf = [it.title_ko, it.title_en, it.hook, (it.tldr||[]).join(' ')];
  (it.sections||[]).forEach(function(s){
    buf.push(s.heading_ko, s.heading_en, s.what, s.why, s.structure, s.consumer);
    (s.players||[]).forEach(function(p){ buf.push(p.name, p.what); });
    (s.terms||[]).forEach(function(t){ buf.push(t.en, t.ko, t.plain); });
    (s.numbers||[]).forEach(function(n){ buf.push(n.value, n.meaning); });
  });
  (it.glossary||[]).forEach(function(t){ buf.push(t.en, t.ko, t.plain); });
  it._txt = buf.join(' ').toLowerCase();
  return it._txt;
}

function renderFilters(){
  var counts = {};
  ISSUES.forEach(function(i){ counts[i.type] = (counts[i.type]||0)+1; });
  var keys = Object.keys(TYPE_LABEL).filter(function(k){ return counts[k]; });
  document.getElementById('filters').innerHTML = keys.map(function(k){
    return '<button class="chip' + (state.types[k]?' on':'') + '" data-type="' + k + '">' +
      esc(TYPE_LABEL[k]) + ' ' + counts[k] + '</button>';
  }).join('');
}
function filtered(){
  var q = state.q.trim().toLowerCase();
  var anyType = Object.keys(state.types).some(function(k){ return state.types[k]; });
  return ISSUES.filter(function(it){
    if(anyType && !state.types[it.type]) return false;
    if(state.theme && (it.themes||[]).indexOf(state.theme) < 0) return false;
    if(q && issueText(it).indexOf(q) < 0) return false;
    return true;
  });
}

      '</button>');
